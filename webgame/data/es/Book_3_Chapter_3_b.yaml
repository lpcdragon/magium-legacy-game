          "¿Llevas todo este tiempo escuchándonos?"

          "No todo el tiempo, pero sí oí lo que han dicho durante el último minuto más o menos", escribe Leila.

          "Entonces, ¿debo dar por hecho que ya sabes lo que está pasando?", digo.

