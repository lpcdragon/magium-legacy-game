  - name: b3_ch03b_royal
    texts:
      - source: scene_text
        paragraph: 17
        text: |-
          "Melindra, no estás sintiendo a la guardia real por aquí cerca, ¿verdad?"

          "A ninguno de los que hemos conocido hasta ahora, al menos", dice Melindra. "A los demás no los conozco, así que no podría asegurar que no haya guardias reales alrededor, pero no estoy sintiendo magos poderosos cerca, así que creo que deberíamos estar a salvo."

          "Protocolo Supervisor iniciado", dice la bola metálica, y de repente el tono de su voz metálica se vuelve más expresivo. "Hola, Breynan. ¿En qué puedo ayudarlo hoy?"

          "Sabes por qué hemos venido, viejo montón de chatarra", dice Breynan. "¡Tú fuiste quien nos invitó! ¡Ahora dinos por qué lo hiciste!"

          "El protocolo Supervisor no recuerda haber hecho tal invitación", dice el Supervisor. "Quizá esté confundido. Si está dispuesto a decirme a qué evento fue invitado, con mucho gusto lo guiaré a la ubicación correcta."

          "Parece que otra vez se hace el tonto", dice Melindra.

          "O quizá nos está diciendo que no éramos nosotros a quienes invitó aquí y que solo está dispuesto a hablar con los representantes oficiales del rey del subsuelo", dice Kate.
      - source: scene_text_2
        paragraph: 13
        text: |-
          "Eso no es lo que está diciendo", nos dice Breynan. "No se preocupen, al final nos dará la información que necesitamos. Solo hay que encontrar las preguntas adecuadas. ¡Eh, Supervisor! ¿Ha habido últimamente cambios en la seguridad del palacio? ¿Quizá del tipo que permitiría a un grupo de rebeldes colarse dentro sin que los notaran?"

          "No se ha realizado ningún cambio de ese tipo recientemente", dice el Supervisor. "El palacio es tan seguro como siempre lo ha sido."

          "Bueno, quizá entonces haya cambiado la situación dentro del castillo", dice Breynan. "¿El rey de Ollendor está mostrando signos de haber contraído alguna enfermedad, por casualidad?"

          "El rey goza de perfecta salud", dice el Supervisor. "Gracias por preguntar."

          "¿Y qué hay de la situación con el integrante más reciente del séquito del rey?", dice Kate. "¿Cómo se lleva Eiden con la guardia real?"

          El Supervisor hace una breve pausa antes de responder la pregunta de Kate.
      - source: scene_3
        paragraph: 8
        text: |-
          "La mayor parte de la guardia real no acepta a Eiden como figura de autoridad y lo consideran una amenaza", dice el Supervisor. "Eiden parece ser consciente de ello y está intentando provocarlos constantemente para ver sus reacciones."

          "Eso sí que suena a Eiden", dice Melindra.

          "¿Hay alguna manera en que los rebeldes podamos beneficiarnos de esta fricción entre la guardia real y el Creador?", dice Breynan. "Quizá la tensión constante entre ellos esté causando algún punto ciego que podamos explotar al invadir el castillo."

          "Como ya se ha indicado antes, no ha habido cambios recientes que puedan afectar a la seguridad del palacio", dice el Supervisor.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch03b_vulnerability
