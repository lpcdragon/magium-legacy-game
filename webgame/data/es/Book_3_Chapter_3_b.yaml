  - name: b3_ch03b_nonsense
    texts:
      - source: scene_text
        paragraph: 36
        text: |-
          "Bueno, maldita sea...", dice Derek, que ahora también deja de moverse, lo que hace que la tercera manticora se aleje de él también. "Estos rebeldes me han dejado en ridículo de verdad, ¿eh? Supongo que ha llegado la hora de enseñarles una lección."

          "Genial...", dice Melindra mientras crea una barrera grande y semitransparente a nuestro alrededor. "Kate, ¿cómo va el dolor de cabeza? ¿Hay alguna posibilidad de que puedas hacer una cúpula de hielo a nuestro alrededor?"

          "Aunque pudiera hacer una, no habría forma de que pudiera mantenerla más de un segundo en mi estado actual", dice Kate, masajeándose la frente. "Lo siento."

          "Sí, más o menos me lo imaginaba, pero había que intentarlo", dice Melindra, mientras su barrera empieza a ser bombardeada con ataques de fuego, viento y tierra desde todas las direcciones.

          Tras unos diez segundos de asedio continuo contra la barrera, Melindra ya da señales de fatiga y veo una gota de sudor resbalando por el lado de su rostro.
      - source: scene_text_2
        paragraph: 24
        text: |-
          "Melindra, ya has hecho bastante", dice Kate de pronto. "Si te obligas a mantener la barrera más tiempo, podrías perder el control de tus poderes otra vez y arriesgarte a morir por culpa del juramento de encantador. Todo esto es culpa mía. No debería haber hecho que ninguno de ustedes me siguiera aquí. Por favor, váyanse de aquí mientras todavía puedan y llévense a Leila con ustedes. Si tú y Barry intentan salir volando con ella ahora, todavía podrían conseguirlo."

          "Tonterías", dice Melindra. "Lo único que hago ahora mismo es reforzar el aire a nuestro alrededor. No hay ninguna razón para que pueda salir mal aunque pierda el control de ello."

          Luego alza la voz para que todo el mundo en la zona pueda oírla.

          "Aun así, ayudaría bastante que ALGUIEN terminara ya de lanzar su hechizo", dice Melindra. "En serio, ¿cuánto más piensas hacerme esperar?"

          "¿De qué está hablando?", dice Derek.
      - source: scene_3
        paragraph: 21
        text: |-
          "¿Y a quién le importa?", dice el hombre del tridente. "Seguramente está fanfarroneando. Si tuvieran aquí a otro aliado, ya lo habríamos sabido, así que no deberíamos..."

          El hombre se interrumpe de repente cuando mira hacia arriba y ve tres inmensas serpientes de agua, cada una con forma de cobra gigante, volando por el aire mientras se acercan a toda velocidad a él y a sus aliados. Cada una de las serpientes mide al menos treinta metros de largo y casi dos de ancho, y tienen un aspecto tan feroz que parece como si estuvieran sedientas de sangre.

          "Santos dioses...", dice el hombre del tridente. "¡Retirada! ¡Retírense ahora mismo o estamos acabados, entienden?"

          "¡Aaaaaah!", grita Derek mientras vuela en dirección opuesta a las serpientes, tan rápido como puede. "¡Van a alcanzarme! ¡Van a...!"

          Derek no llega a terminar la frase, porque una de las serpientes de agua se lo traga y luego se lo lleva muy lejos del campo de batalla. Poco después les ocurre lo mismo a los otros dos aprendices de la guardia real, que no fueron lo bastante rápidos para huir a tiempo y quedaron arrastrados por ella.
    choices:
