  - name: b3_ch03b_carry
    texts:
      - source: scene_text
        paragraph: 35
        text: |-
          "¡Voy!", digo, y entonces vuelo tan rápido como puedo hacia Leila, a una altura relativamente baja.

          El hombre del tridente ve lo que estoy haciendo e intenta lanzarme unos cuantos proyectiles de roca, pero todos quedan bloqueados por la barrera de viento de Melindra, así que consigo llegar a mi destino sin sufrir daño alguno. Mientras tomo a Leila en brazos, el aprendiz intenta una vez más atacarme clavando el tridente en el suelo para crear un puño de piedra, pero como no puede conjurarlo lo bastante cerca de mí, lo único que consigue es golpear el aire vacío que hay delante de él.

          Al ver que no corro peligro de ser alcanzado, decido simplemente ignorar los ataques de mi adversario y llevar a Leila de vuelta con el grupo, mientras el hombre del tridente se rinde a la idea de detenerme y empieza a desahogar su rabia con sus compañeros.

          "¡¿Qué demonios están haciendo los dos?!", dice el hombre del tridente. "¿Por qué siguen peleando con esas ilusiones de manticora? ¿No entienden que no son reales? ¡Dejen de moverse y permitan que los golpeen!"
