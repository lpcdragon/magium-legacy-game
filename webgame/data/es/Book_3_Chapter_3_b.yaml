          - set:
              current_scene: b3_ch03b_interpersonal
  - name: b3_ch03b_interpersonal
    texts:
      - source: scene_text
        paragraph: 37
        text: |-
          "¿Eso ha sido... magia de agua de Illuna?", pregunta Kate, que parece estar esforzándose por asimilar la situación.

          "Así es", oímos la voz de Illuna, mientras deja de suprimir su aura y sale caminando de un callejón al lado de nuestra calle.

          Ahora que puedo sentir su aura con claridad, noto que el aura de Flower es muy tenue, lo que significa que debe de estar dormida.

          "¡Pensé que no ibas a terminar nunca de lanzar ese hechizo!", le dice Melindra a Illuna mientras se acerca al grupo. "Tenías que hacer tres serpientes, ¿verdad?"

          "Quería que hubiera una para cada uno, por si acaso", dice Illuna. "No es como si hubiera tenido una segunda oportunidad de lanzar un ataque sorpresa de esta magnitud. ¿No querías evitar que ninguno escapara, acaso?"

          "Vale, vale", dice Melindra. "Ya has dejado claro tu punto."

          "No lo entiendo...", dice Kate. "Illuna, ¿cómo nos encontraste?"
      - source: scene_text_2
        paragraph: 25
        text: |-
          "Los he seguido desde la distancia desde antes incluso de que se teletransportaran aquí", dice Illuna. "Melindra probablemente sintió mi presencia desde el principio, pero tuvo la cortesía de no delatar mi posición. Cuando vi que habían ido a la superficie, le pedí a la persona a cargo del teletransportador que me trajera aquí también, y luego seguí siguiéndolos, porque estaba segura de que encontrarían una manera de meterse en problemas."

          "¡Y vaya si la encontramos!", dice Melindra.

          "¿Por qué no viniste a pedirme ayuda antes de teletransportarte aquí?", dice Illuna, con una expresión seria en los ojos mientras mira a Kate.

          "Yo...", dice Kate. "No quería ser una molestia..."

          Illuna niega con la cabeza, desaprobando.

          "Pensaba que ya habíamos superado hace tiempo esta fase de nuestra interacción interpersonal", dice Illuna. "Por favor, dime que no seguimos todavía en la etapa en la que se supone que debemos usar charla trivial para comunicarnos."
      - source: scene_3
        paragraph: 22
        text: |-
          "No...", dice Kate con tono humilde. "Tienes razón. No lo estamos."

          "Bien", dice Illuna. "Detesto la charla trivial."

          "Me temo que por ahora tendremos que interrumpir la conversación", dice Melindra. "Puedo sentir que el capitán de la guardia real y ese mercenario vienen hacia aquí, además de unos cuantos magos más. No tardarán en alcanzarnos. Breynan, ¿crees que ya deberíamos poder teletransportarnos de vuelta?"

          "Probablemente todavía tengamos que esperar un poco, pero llamaré a Barry para que prepare el teletransportador", dice Breynan mientras saca el transceptor.

          "¿Esos tres eran todos los enemigos que había por su zona?", pregunta Illuna.

          "Había otro mago que le lanzó un hechizo de mareo a Kate, pero no sabemos dónde está", digo.

          "Lo más probable es que esté escondido en uno de los edificios al lado de la calle", dice Melindra. "Estas casas están llenas de civiles, así que me resulta imposible averiguar quién es nuestro atacante, dado que no es un mago."
