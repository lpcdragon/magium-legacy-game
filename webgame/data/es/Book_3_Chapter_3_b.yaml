      - condition: b2_ch7_dizziness = 0
        texts:
          - source: scene_text
            paragraph: 34
            text: |-
              "¡Voy!", digo, y entonces alzo el vuelo hasta bastante arriba en el cielo para asegurarme de poder pasar por encima de la barrera invisible de Melindra y empezar a dispararle al hombre del tridente.

              En cuanto sobrepaso la barrera, me coloco en algún punto por encima del aprendiz de la guardia real y comienzo a disparar la ballesta en su dirección. Por desgracia, el hombre anticipa mis disparos y consigue apartarse a tiempo, al mismo tiempo que prepara un contraataque usando su arma para crear varios pedruscos de la nada. Cuando termina de formar sus proyectiles de roca, apunta con el tridente hacia mí y me lanza todos los pedruscos a gran velocidad.

              Esquivo los proyectiles con facilidad en pleno vuelo y le disparo unos cuantos virotes de ballesta más, pero esta vez el hombre ni siquiera se molesta en apartarse y simplemente conjura un muro de roca para bloquearlos.

              "¡Deja de perder el tiempo con él y recoge a Leila!", grita Melindra mientras recargo la ballesta. "¡Los 'droons' te van a ver! ¡Maldición, ya están bajando!"

              Al oír lo que dice Melindra, alzo la vista y veo que ahora hay seis bolas metálicas de ojos rojos viniendo hacia mí a toda velocidad. Intento dispararles desde lejos, pero esquivan mis ataques sin mucho esfuerzo y siguen avanzando en mi dirección. Mientras tanto, el hombre del tridente se aprovecha de la situación y empieza a lanzarme todavía más pedruscos para mantenerme distraído.
          - source: scene_text_2
            paragraph: 22
            text: |-
              Mientras estoy ocupado esquivando pedruscos en el aire mientras recargo la ballesta, de pronto siento un leve dolor de cabeza y una ligera sensación de náusea. Me doy cuenta enseguida de que esto debe de estar ocurriendo porque la misma persona que antes le lanzó el hechizo de mareo a Kate ha usado sobre mí una versión similar, pero más débil, de ese hechizo para hacerme perder el equilibrio. Por suerte, todavía tengo la protección mágica contra el mareo que Illuna me lanzó hace una semana, así que los efectos del hechizo no son demasiado severos.

              Sigo esquivando con éxito los pedruscos que me lanzan, a pesar del leve dolor de cabeza, y consigo derribar a dos de las bolas metálicas antes de que lleguen hasta mí. Sin embargo, en cuanto los 'droons' se acercan más, enseguida empiezan a atacarme con rayos de fuego y hielo, obligándome a alejarme de ellos mientras sigo teniendo cuidado con los proyectiles de roca que me llegan desde abajo.

              De repente, cuatro carámbanos atraviesan las bolas metálicas restantes, que se estrellan contra el suelo mientras Kate me hace gestos para que baje. Decido seguir su consejo y regresar a menor altura antes de que más 'droons' tengan tiempo de verme. De camino de vuelta, también tomo a Leila en brazos y vuelo con ella hacia Melindra y Kate, mientras el aprendiz de la guardia real empieza a gritar furioso a sus compañeros.

              "¡¿Qué demonios están haciendo los dos?!", dice el hombre del tridente. "¿Por qué siguen peleando con esas ilusiones de manticora? ¿No entienden que no son reales? ¡Dejen de moverse y permitan que los golpeen!"
          - source: scene_3
            paragraph: 20
            text: |-
              "Como si fuera tan estúpido como para arriesgarme a que me despedacen vivo basándome solo en tu intuición", dice Derek, que sigue volando por el aire mientras blande la espada para enviar poderosas ráfagas de viento contra la manticora que lo persigue. "¡Si de verdad crees que son ilusiones, demuéstralo!"

              "¿No has visto una manticora en toda tu vida?", dice el hombre del tridente. "¿No ves que sus movimientos son antinaturales? En realidad, ¿sabes qué? Olvídalo. Mira la manticora con la que estaba luchando yo. Todo este tiempo podría haberme atacado, pero desde que la llamé ilusión ha dejado por completo de intentar abalanzarse sobre mí y ahora solo da vueltas por el cielo. ¿Crees que eso es una coincidencia?"

              "No puedo...", empieza a decir Derek, pero lo interrumpen.

              "Además, ¿no te has dado cuenta de que las bolas metálicas de ojos rojos no las están atacando?", dice el hombre del tridente. "¿Por qué ignorarían unos objetivos voladores tan grandes y sin identificar si no supieran que eran ilusiones?"

              "Vale, me has convencido", dice el hombre del guante metálico, y entonces deja de intentar esquivar justo cuando una de las manticoras se abalanzaba sobre él.

              Al ver que ya no intenta evadir sus ataques, la manticora bate de repente las alas y remonta hacia el cielo, donde se pone a dar vueltas sin rumbo igual que la manticora que antes luchaba contra el hombre del tridente.
