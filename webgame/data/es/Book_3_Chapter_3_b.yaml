  - name: b3_ch03b_calling
    routes:
      - condition: b3_ch2_name = 0
        texts:
          - source: scene_text
            paragraph: 23
            text: |-
              "Sí, ¿puedes dejar de llamarnos Felran?"

              "Por desgracia, cambiar la designación de su grupo no es posible en este momento", dice el Supervisor. "Le pedimos disculpas por las molestias."

              "Claro", digo. "No sé por qué esperaba algo distinto."
          - source: scene_text_2
            paragraph: 15
            text: |-
              "¿Alguien más tiene preguntas para el Supervisor?", dice Breynan.

              "No sé si servirá de algo seguir interrogándolo", dice Kate. "Me parece que ya nos ha dado toda la información que tenía sobre las debilidades del rey de Ollendor."

              "Eso pienso yo también", dice Breynan. "Quizá entonces deberíamos prepararnos para volver. Muy bien, Supervisor, eso será todo por hoy. Que tengas un buen viaje."

              "Adiós, Breynan", dice el Supervisor, y la bola metálica vuelve a elevarse en el aire para continuar sus patrullas.

              "Vayamos por aquí", dice Breynan, y entonces emprende el camino de regreso por donde vinimos.
          - source: scene_3
            paragraph: 14
            text: |-
              "Entonces, ¿podemos saber con certeza que algo de lo que nos ha dicho el Supervisor es verdad?", digo mientras avanzamos hacia la salida.

              "Todavía no, pero deberíamos poder comprobar toda esta información con facilidad", dice Breynan. "En cuanto volvamos a nuestra base, podemos empezar por..."

              Breynan se interrumpe de repente porque, justo antes de que lleguemos al final del callejón, tres hombres vestidos con harapos se colocan delante de nosotras con dagas en la mano. Dos de ellos tienen una expresión de puro terror en los ojos y están temblando de miedo, pero aun así no parece que piensen apartarse.

              "Escuchen... no sé quién los ha enviado aquí, pero no pretendemos hacerles daño", les dice Breynan a los tres hombres. "Por favor, apártense."
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch03b_platform
