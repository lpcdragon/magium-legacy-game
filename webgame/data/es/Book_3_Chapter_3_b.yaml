  - name: b3_ch03b_uniforms
    texts:
      - source: scene_text
        paragraph: 32
        text: |-
          "Tenemos que encontrar un lugar donde calmarnos para poder teletransportarnos de vuelta a nuestra base", dice Breynan mientras avanzamos deprisa por una calle amplia y vacía con muchas entradas a callejones a ambos lados. "Por ahora, intentemos alejarnos de aquí todo lo posible."

          "Todavía no hemos averiguado quién le lanzó el hechizo de mareo a Kate", dice Melindra. "Mientras siga por aquí, no estamos a salvo."

          "No necesitamos estar a salvo", dice Breynan. "Solo necesitamos estar lo bastante calmados para que el del teletransportador pueda fijarse en nuestras auras."

          "Vale", dice Melindra. "En ese caso, podría intentar hacernos volar lejos de aquí para que..."

          "No, no podemos arriesgarnos a volar", dice Breynan. "Las bolas metálicas que patrullan los cielos empezarán a atacarnos en cuanto lo hagamos. Sus órdenes son priorizar por encima de todo a los objetivos aéreos."

          "¡Pues tampoco podemos arriesgarnos a pelear con los guardias!", dice Melindra. "Kate sigue sin ser capaz de concentrarse en sus hechizos, yo no puedo atacar a los lugareños y el dispositivo de estadísticas de Barry no funciona. ¿De verdad crees que tú y Leila podrán contener a la guardia real ustedes solos?"

          "Mientras consigamos alejarnos lo bastante de aquí, no habrá necesidad de pelear", dice Breynan. "Solo necesitamos llegar al final de esta calle y entonces podremos..."
      - source: scene_text_2
        paragraph: 19
        text: |-
          "¡Cuidado!", grita Melindra, y enseguida tira de Breynan hacia atrás con ambas manos.

          De uno de los callejones laterales sale de repente una explosión de fuego, y toda la zona que hay delante de nosotras queda de inmediato envuelta en llamas. La gran pared de fuego que ahora bloquea el paso está al parecer a apenas unos centímetros del rostro de Breynan. Si Melindra no lo hubiese apartado a tiempo, probablemente habría quedado completamente incinerado.

          "Has fallado", oigo la voz de un hombre mientras sale de un callejón detrás de nosotras. "No puedo creer que de verdad hayas fallado. ¿No podías esperar un segundo más antes de lanzar ese hechizo?"

          "No es mi maldita culpa", oigo la voz de otro hombre, procedente del callejón del que salió el muro de fuego. "¡Maldita! Los apartó justo antes de que entraran en mi línea de visión. Pero no importa. Tienen un enorme muro de fuego delante. No van a ninguna parte."

          "Ya les dije a los dos que enfrentarnos a ellos por nuestra cuenta era una idea estúpida", dice otro hombre, que al parecer está situado en la azotea de un edificio de forma extraña a un lado de la calle. "Solo somos aprendices. Deberíamos haber esperado a que vinieran los guardias reales de verdad para respaldarnos."
      - source: scene_3
        paragraph: 18
        text: |-
          "Por eso siempre seguirás siendo un aprendiz, Derek", dice el primer hombre. "Nunca vas a convertirte en un guardia real de pleno derecho si sigues esperando a que el capitán venga a arreglarte el desastre."

          Cuando los tres hombres se acercan lo bastante para que podamos ver su aspecto, me doy cuenta de que todos llevan el mismo tipo de uniformes azules que Gontrok y los demás guardias reales, salvo por el hecho de que sus uniformes tienen muchas menos marcas, probablemente por ser solo aprendices. Cada uno sostiene un arma distinta y cada arma tiene una gema de color diferente incrustada en la empuñadura.

          El hombre que está detrás de nosotras lleva un tridente con un topacio marrón incrustado, el hombre de la azotea empuña una espada con un diamante en la empuñadura y el hombre que levantó el muro de fuego lleva un guante metálico decorado con un rubí. No tardo en darme cuenta de que sus armas son en realidad artefactos lessathi y de que esas son las herramientas que están usando para lanzar todos sus hechizos.

          "Ninguno de ellos es mago...", nos dice Melindra en voz baja mientras los tres hombres siguen discutiendo entre ellos. "Podía sentir sus auras desde lejos, pero no tenía ni idea de que fueran aprendices de la guardia real... Kate, ¿puedes pelear?"

          "Yo... no lo sé...", dice Kate, que sigue luchando por librarse del dolor de cabeza. "Pero tendré que intentarlo."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch03b_summoner
  - name: b3_ch03b_summoner
    texts:
      - source: scene_text
        paragraph: 33
        text: |-
          "No pasé dos años enteros dominando esta arma para actuar como un simple vigía glorificado", dice el primer hombre. "Hoy voy a demostrarle a toda la guardia real de qué soy capaz, ¡y ustedes dos van a ayudarme!"

          "Como si tuviéramos muchas opciones a estas alturas", dice Derek. "Acabemos con esto."

          "¡Prepárense!", nos dice Breynan.

          Kate no espera a que los hombres ataquen y dispara varios carámbanos contra el tipo que está detrás de nosotras. El aprendiz clava rápidamente su tridente en el suelo y una pared de roca se alza desde el pavimento ante él, bloqueando todos los proyectiles que iban a alcanzarlo. Luego el hombre levanta el tridente del suelo y la pared se desmorona.

          Al mismo tiempo, el hombre de la azotea alza su espada y empieza a elevarse despacio en el aire, mientras el hombre que tenemos delante apunta con el guante en nuestra dirección y de él sale un rayo de fuego que se dirige directo hacia nuestro grupo.

          Kate crea inmediatamente un muro de hielo delante de nosotras que nos protege de las llamas, pero en cuanto el fuego desaparece, el muro también se desvanece y Kate vuelve a ponerse la mano en la frente, intentando una vez más reprimir los efectos del dolor de cabeza. De pronto, Breynan golpea el suelo con su bastón y una luz blanca muy intensa llena la zona que hay a nuestro lado. Cuando la luz desaparece, vemos que de la nada han aparecido tres manticoras y que ya están alzando el vuelo, cada una dirigiéndose a un objetivo diferente.
      - source: scene_text_2
        paragraph: 20
        text: |-
          "¡Mierda!", dice el hombre del tridente al ver que uno de los leones alados se acerca rápidamente hacia él. "¡No sabía que tuvieran a un invocador!"

          "¡Acaben con las invocaciones!", grita Derek, el hombre de la espada, con voz presa del pánico al ver que una de las manticoras vuela hacia él. "¡Rápido! No puedo maniobrar mejor que una manticora mientras estoy en el aire."

          "¡Pues baja al suelo y lucha con ella!", dice el hombre del tridente, mientras intenta derribar a la manticora más cercana lanzándole proyectiles de roca. "¡Yo ya tengo las manos bastante ocupadas aquí!"

          El hombre del guante metálico no dice nada, pero no deja de lanzar ráfagas de fuego contra la manticora que tiene encima, aunque no parece acertarle ni una sola vez.

          "Intentaré derribar a uno de ellos mientras están distraídos", escribe Leila, y entonces se lanza corriendo hacia el hombre del tridente.

          "¡No, espera!", grita Melindra, pero Leila no la oye y sigue avanzando.
      - source: scene_3
        paragraph: 19
        text: |-
          Justo cuando está a punto de alcanzar a su objetivo para apuñalarlo por la espalda, el hombre del tridente se vuelve hacia ella al instante con una sonrisa maliciosa y vuelve a clavar su arma en las rocas planas que tiene bajo los pies. Antes de que Leila tenga tiempo de reaccionar, un enorme puño de piedra surge de repente del suelo y la golpea con tanta fuerza que la manda despedida de espaldas, haciéndole golpearse la cabeza contra el pavimento y perder el conocimiento.

          "¿De verdad pensaste que era tan estúpido como para no darme cuenta de que esas manticoras eran ilusiones?", dice el hombre del tridente al sacar su arma del suelo, mientras el gran puño de piedra se desmorona igual que la pared de antes. "Solo esperaba a que uno de ustedes fuera lo bastante idiota como para entrar en el alcance de mi ataque de puño de roca. Despídanse de su amiga."

          Entonces intenta avanzar hacia Leila, pero choca contra lo que parece ser una barrera invisible que bloquea su paso.

          "¿Qué demonios?...", dice el hombre del tridente mientras apoya las manos en la barrera para comprobar hasta dónde se extiende.

          Mientras el aprendiz de la guardia real sigue intentando rodear el muro invisible, de repente siento las corrientes de aire de Melindra rodeando todo mi cuerpo.

          "¡Tráela de vuelta!", me dice Melindra señalando a Leila, que sigue inconsciente en el suelo. "¡Rápido! ¡No podré mantener esta barrera de viento mucho más tiempo!"
    choices:
      - position: 1
        text: Volar hacia Leila y traerla de vuelta con el grupo.
        effects:
          - set:
              current_scene: b3_ch03b_carry
              b3_ch3_carry: 1
      - position: 2
        text: Volar hacia el hombre del tridente e intentar matarlo.
        effects:
          - set:
              current_scene: b3_ch03b_trident
              b3_ch3_carry: 0
  - name: b3_ch03b_trident
    routes:
      - condition: b2_ch7_dizziness = 1
        texts:
          - source: scene_text
            paragraph: 34
            text: |-
              "¡Voy!", digo, y entonces alzo el vuelo hasta bastante arriba en el cielo para asegurarme de poder pasar por encima de la barrera invisible de Melindra y empezar a dispararle al hombre del tridente.

              En cuanto sobrepaso la barrera, me coloco en algún punto por encima del aprendiz de la guardia real y comienzo a disparar la ballesta en su dirección. Por desgracia, el hombre anticipa mis disparos y consigue apartarse a tiempo, al mismo tiempo que prepara un contraataque usando su arma para crear varios pedruscos de la nada. Cuando termina de formar sus proyectiles de roca, apunta con el tridente hacia mí y me lanza todos los pedruscos a gran velocidad.

              Esquivo los proyectiles con facilidad en pleno vuelo y le disparo unos cuantos virotes de ballesta más, pero esta vez el hombre ni siquiera se molesta en apartarse y simplemente conjura un muro de roca para bloquearlos.

              "¡Deja de perder el tiempo con él y recoge a Leila!", grita Melindra mientras recargo la ballesta. "¡Los 'droons' te van a ver! ¡Maldición, ya están bajando!"

              Al oír lo que dice Melindra, alzo la vista y veo que ahora hay seis bolas metálicas de ojos rojos viniendo hacia mí a toda velocidad. Intento dispararles desde lejos, pero esquivan mis ataques sin mucho esfuerzo y siguen avanzando en mi dirección. Mientras tanto, el hombre del tridente se aprovecha de la situación y empieza a lanzarme todavía más pedruscos para mantenerme distraído.
          - source: scene_text_2
            paragraph: 21
            text: |-
              Mientras estoy ocupado esquivando pedruscos en el aire mientras recargo la ballesta, de pronto siento un fuerte dolor de cabeza y una sensación de intensa desorientación que me obliga a dejar de moverme y agarrarme la frente con ambas manos, en un intento de hacer que el dolor desaparezca.

              Me doy cuenta enseguida de que esto debe de ser un hechizo parecido al que le lanzaron antes a Kate, y de que lo único que puedo hacer es aguantarlo. Mientras lucho por recuperar el equilibrio, un pedrusco aparece de la nada y me golpea justo en la cabeza, abriéndome el cráneo y matándome en el acto.
