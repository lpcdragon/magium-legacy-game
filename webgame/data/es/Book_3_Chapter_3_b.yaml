scenes:
  - name: b3_ch03b_complicate
    texts:
      - source: scene_text
        paragraph: 2
        text: |-
          "No se preocupe, su majestad", dice Albert. "Más tarde hablaré con él para enderezar las cosas. Le aseguro que no volverá a pasar."

          "Muy bien", dice el rey. "En ese caso, quedan todos despedidos. Siéntanse libres de contactarme en cualquier momento si tienen algo importante que decirme. Estaré aquí, en la sala del trono, el resto del día."

          "Tomo nota", dice Daren. "Vamos, volvamos a la sala de espera."

          "Bueno, esa ha sido... toda una conversación", dice Hadrik en cuanto salimos de la sala del trono.

          "Desde luego", dice Daren mientras regresamos a la sala de espera. "Será interesante ver cómo se desarrollan las cosas a partir de ahora, eso seguro."

          "¿Crees que podrían intentar deshacerse de nosotros?", dice Hadrik.

          "Dudo muchísimo que lo hagan", dice Daren en voz baja, asegurándose de que Peter y Albert no estén lo bastante cerca como para oírnos. "Sobre todo porque sospechan que somos aliados de Eiden. Tendrían que estar completamente locos para arriesgarse a convertirlo en su enemigo sin motivo alguno. Aun así, sugiero que sigamos esta conversación cuando volvamos a la sala de espera, porque no me gusta tener que mirar por encima del hombro cada pocos segundos para asegurarme de que nadie nos espíe."

          En cuanto llegamos a la sala de espera, aguardamos hasta que Peter y Albert dejan de estar a la vista y luego reanudamos la conversación en un tono lo bastante bajo para que las demás personas presentes en la sala no puedan oírnos.
      - source: scene_text_2
        paragraph: 2
        text: |-
          "En fin", dice Daren. "Yo diría que estos acontecimientos recientes complican bastante nuestra situación. ¿Qué recomiendan ustedes que hagamos? ¿Vamos a seguir cooperando con el rey, o quizá deberíamos empezar a pensar en ir cada uno por su lado?"

          "No sé qué decir...", dice Hadrik. "La verdad es que la información que estos rebeldes pueden obtener con sus dispositivos de escucha resulta bastante útil."

          "Estoy de acuerdo", dice Daren. "El único problema es que no sabemos si a partir de ahora van a seguir compartiendo este tipo de información con nosotros o no. Creo que podría ser mejor mantener esta 'alianza' hasta que averigüemos si seguimos sacando algo de ella o no. Kate, ¿tú qué dices?"

          "Haz lo que quieras", dice Kate, dándose la vuelta y echando a andar hacia una de las salidas. "Yo voy a volver a mi entrenamiento. Melindra, vamos."

          "Uhh, claro", dice Melindra mientras empieza a seguir a Kate. "Voy detrás de ti."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch03b_declared
  - name: b3_ch03b_declared
    texts:
      - source: scene_text
        paragraph: 3
        text: |-
          "¡Eh, Kate, no te pongas así!", dice Daren. "¡Vamos!"

          Kate no reacciona de ninguna manera y sigue caminando hacia delante, con Melindra siguiéndola muy de cerca, hasta que las dos desaparecen por uno de los pasillos que salen de la sala de espera.

          "Sí, no creo que Kate quiera que cooperemos con el rey del subsuelo", dice Daren.

          "No es de extrañar", dice Illuna. "Hace apenas unos minutos declaró más o menos abiertamente que no confía en él en absoluto. Evidentemente, no le entusiasma la idea de que mantengamos nuestra alianza con él."

          "Sí, pero yo no estaba diciendo que debiéramos hacernos amigos suyos ni nada por el estilo", dice Daren. "Solo sugería que podríamos intentar mantener la alianza un poco más, hasta averiguar si de verdad nos está beneficiando o no..."

          "Quizá deberíamos darle algo de tiempo", dice Hadrik. "Puede que cambie de opinión cuando se despeje un poco."
      - source: scene_text_2
        paragraph: 3
        text: |-
          "Supongo...", dice Daren. "De acuerdo, sigamos todos con lo que estábamos haciendo y nos reuniremos otra vez más tarde. Arraka, ¿te apetece una segunda ronda de estudio del aura?"

          "Claro, lo que sea", dice Arraka. "No es que tenga nada mejor que hacer, de todos modos."

          "¡Barry, ahí estás!", oigo que me llama el padre de Leila, mientras la mayoría de mis amigos empieza a tomar direcciones distintas para continuar con sus actividades previas.

          El padre de Leila se acerca ahora hacia mí con mi potenciador de estadísticas en la mano. En cuanto llega lo bastante cerca de Leila y de mí, se detiene y extiende la mano para devolvérmelo.

          "Quería decirte que ya he terminado de trabajar en tu potenciador de estadísticas", dice el padre de Leila, mientras tomo el dispositivo de su mano y lo examino con atención. "Sin embargo, deberías darle un poco de tiempo para que se ajuste a los cambios que he hecho. De momento el dispositivo no funciona, pero en condiciones normales debería empezar a funcionar por sí solo dentro de un rato. Si mañana sigue sin funcionar, le echaré otro vistazo para asegurarme de que todo esté bien."
    choices:
      - position: 1
        text: ¿Conseguiste desbloquear todas las estadísticas de aura?
        effects:
          - set:
              current_scene: b3_ch03b_functional
              b3_ch3_functional: 0
      - position: 2
        text: ¿Cuánto suele tardar en volver a funcionar?
        effects:
          - set:
              current_scene: b3_ch03b_functional
              b3_ch3_functional: 1
      - position: 3
        text: ¿Hay algún efecto secundario no deseado del que deba preocuparme?
        effects:
          - set:
              current_scene: b3_ch03b_functional
              b3_ch3_functional: 2
  - name: b3_ch03b_functional
    effects:
      - set:
          ac_b3_ch3_unexpected: 1
        achievement:
          id: ac_b3_ch3_unexpected
          title: Un extra inesperado
        condition: b3_ch1_unlock = 2
    routes:
      - condition: b3_ch3_functional = 0
        texts:
          - source: scene_text
            paragraph: 4
            text: |-
              "¿Conseguiste desbloquear todas las estadísticas de aura?"

              "Sí, las estadísticas de Sentido mágico, Farol y Endurecimiento de aura deberían estar disponibles para ti en cuanto tu dispositivo vuelva a funcionar", dice el padre de Leila. "Además, creo que debería informarte de que los dispositivos de estadísticas están hechos de tal forma que la distribución de tus puntos de estadísticas se reinicia automáticamente cuando desbloqueas las estadísticas de aura ocultas. En otras palabras, en cuanto tu dispositivo vuelva a funcionar, todas tus estadísticas estarán a cero y volverás a tener todos tus puntos disponibles para gastarlos como quieras."

              "¡Vaya, eso es increíble!", digo. "¿Quiere decir eso que es posible reiniciar las estadísticas varias veces, si ocultas las estadísticas de aura y luego vuelves a desbloquearlas?"

              "Para serte sincero, yo no me arriesgaría", dice el padre de Leila. "Estos dispositivos son muy antiguos y un reinicio completo de estadísticas los somete a mucha tensión. Esa es la razón por la que no se te da la opción de simplemente quitar puntos de tus estadísticas a voluntad después de haberlos gastado. La única razón por la que dejé que el reinicio ocurriera es porque no tenía elección en el asunto, pero intentar reiniciar tus estadísticas varias veces a propósito bien podría hacer que algunos de tus puntos se volvieran inutilizables, o incluso que tu dispositivo de estadísticas dejara de funcionar por completo. Mi consejo es que te alegres de que este reinicio no haya causado daños y que tengas muchísimo cuidado al elegir qué estadísticas subir a partir de ahora, porque es probable que no vuelvas a tener otra oportunidad como esta."

              "Entendido", digo. "¿Hay algo más que deba saber?"
          - source: scene_text_2
            paragraph: 4
            text: |-
              "Sí, había una última cosa que quería comentarte sobre tu dispositivo", dice el padre de Leila. "Cuando saqué tu potenciador de estadísticas de su estado bloqueado, el proceso encargado de convertir la energía mágica en puntos de estadísticas disponibles se reinició, así que recibirás uno de tus puntos de estadísticas antes de lo normal. Eso también significa que recibirás un punto menos en tu siguiente tanda, pero creo que preferirás tener ese punto disponible ahora en vez de más tarde. Si no me equivoco, tu punto extra debería estar disponible en cuanto tu dispositivo de estadísticas vuelva a funcionar."

              "De acuerdo", digo mientras me guardo el dispositivo en el bolsillo. "Me aseguraré de tenerlo presente. ¡Gracias por toda tu ayuda!"

              "¡De nada!", dice el padre de Leila. "Ah, y ya que seguimos hablando de potenciadores de estadísticas... Leila, ¿te importaría volver un rato a mi taller? Hay una última comprobación de mantenimiento que olvidé hacerle a tu dispositivo de estadísticas y preferiría hacerlo ahora, mientras tengo algo de tiempo libre."

              "Vale", escribe Leila. "¡Nos vemos, Barry!"

              "Nos vemos luego", digo mientras los dos se dirigen de regreso al taller del doctor Reidzek.
            condition: b3_ch1_unlock = 2
          - source: scene_text_2
            paragraph: 5
            text: |-
              "No en particular", dice el padre de Leila. "Ya te he dado toda la información que tenía. Cómo elijas usar tu dispositivo de estadísticas de ahora en adelante depende enteramente de ti."

              "De acuerdo", digo mientras me guardo el dispositivo en el bolsillo. "Me aseguraré de tener en cuenta todos tus consejos. ¡Gracias por toda tu ayuda!"

              "¡De nada!", dice el padre de Leila. "Ah, y ya que seguimos hablando de potenciadores de estadísticas... Leila, ¿te importaría volver un rato a mi taller? Hay una última comprobación de mantenimiento que olvidé hacerle a tu dispositivo de estadísticas y preferiría hacerlo ahora, mientras tengo algo de tiempo libre."

              "Vale", escribe Leila. "¡Nos vemos, Barry!"

              "Nos vemos luego", digo mientras los dos se dirigen de regreso al taller del doctor Reidzek.
            condition: b3_ch1_unlock != 2
          - source: scene_3
            paragraph: 2
            text: |-
              Mientras miro alrededor de la sala para decidir qué voy a hacer a continuación, un pasillo en concreto me llama la atención. Es el pasillo por el que Kate y Melindra entraron cuando decidieron reanudar su entrenamiento. Ahora que me fijo mejor, me doy cuenta de que no es el mismo pasillo que estaban usando para entrenar antes de que el rey del subsuelo nos llamara a su sala del trono. ¿Por qué elegirían un pasillo distinto al de antes? ¿No tendría más sentido que entrenaran en un lugar con el que ya están familiarizadas?

              Espera un momento... Estoy bastante seguro de que había una forma de ir desde ese pasillo directamente al túnel que lleva a la sala del teletransportador. ¿Será ahí adonde se dirigen realmente? Supongo que solo hay una forma de averiguarlo.

              Empiezo a dirigirme a paso rápido hacia el túnel que lleva directamente a la sala del teletransportador. Si me doy prisa, todavía debería poder alcanzarlas. Este túnel toma una ruta más directa hacia el teletransportador que la que ellas escogieron, así que la distancia es mucho más corta. Cruzo corriendo la puerta que da al pasillo y luego voy directo hacia el teletransportador, sin mirar atrás. No pasa nada. Si de verdad han ido por aquí, no pueden estar mucho más adelante. Debería verlas de un momento a otro. De un momento a otro...

              Mis predicciones resultan ser correctas, porque pronto alcanzo a ver a lo lejos la capa verde de Kate, y entonces reduzco el paso para poder seguirla a ella y a Melindra sin que me noten. Por desgracia, mi plan se viene abajo casi de inmediato cuando Melindra se detiene de repente y me llama a voz en grito.
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch03b_inconvenience
