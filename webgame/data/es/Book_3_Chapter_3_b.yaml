  - name: b3_ch03b_transceiver
    texts:
      - source: scene_text
        paragraph: 42
        text: |-
          "¡Barry!", oigo de repente la voz de Rose saliendo de mi transceptor. "¡Contéstame rápido! ¿Dónde estás ahora mismo? ¿Illuna está contigo? ¿Estás en una calle con muchos edificios de formas extrañas?"

          "Umm, sí...", digo mientras toco el transceptor a través del bolsillo. "Sí a tus dos preguntas, pero ¿cómo has...?"

          "¡Illuna, acabo de ver una premonición!", grita Rose. "¡Alguien va a teletransportarse justo detrás de ti! ¡Apártate de ahí, rápido!"

          "¿Una premonición?...", digo. "Espera, ¿desde cuándo puedes ver...?"

          Antes de que termine la frase, un hombre vestido con túnicas negras aparece de la nada justo detrás de Illuna e intenta apuñalarla en el corazón con una daga. Gracias a la advertencia de Rose, Illuna logra apartarse de un salto y escapar solo con un corte leve en el costado de la cintura, pero su atacante no se rinde e intenta acercarse a ella otra vez.

          "¡No!", grita Kate, lanzando varios conos de hielo hacia el hombre de las túnicas negras y obligándolo a retroceder. "¡Aléjate de ella!"

          Mientras observo a nuestro atacante, me doy cuenta de que lleva bastantes anillos en los dedos, con gemas de distintos colores incrustadas en ellos. Algo me dice que esos anillos son reliquias lessathi que pueden usarse para lanzar diferentes tipos de magia. Tengo que avisar a los demás.

          "¡Illuna, cuidado!", digo. "¡Creo que esos anillos lo ayudan a lanzar distintos tipos de..."
      - source: scene_text_2
        paragraph: 28
        text: |-
          "Sí, ya me he dado cuenta", dice Illuna mientras azota al hombre de las túnicas negras con uno de sus látigos de agua, pero él se teletransporta fuera de su alcance sin esfuerzo y luego crea un arma de la nada, enviándola volando en dirección a Illuna.

          "¡Todo el mundo, escúchenme!", grita Melindra de repente, mientras Illuna está ocupada esquivando los ataques del hombre de las túnicas negras. "¡Tenemos que salir de aquí ahora! Gontrok viene hacia aquí y se mueve a una velocidad absurda. ¡A este ritmo llegará en cualquier momento!"

          "¿Has oído eso, Barry?", dice Breynan a través del transceptor. "¡Necesitamos que nos teletransportes ahora mismo!"

          "Pero... las reglas... Yo no puedo...", dice el del teletransportador.

          "¡Olvídate de las reglas!", grita Breynan. "Asumo toda la responsabilidad. ¡Ahora teletranspórtanos, rápido! No tenemos tiempo."

          "¡Gontrok ya casi está aquí!", dice Melindra.

          "¡Vale!", grita el del teletransportador con voz presa del pánico. "¡Lo haré! ¡Pero no me culpen por lo que pase!"
