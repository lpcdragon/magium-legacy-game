          "Ah, o sea que no piensan meterse en ninguna pelea", dice el del teletransportador.

          "Sí", dice Breynan. "Con suerte solo será un viaje corto y sin incidentes, y volveremos justo a tiempo para la cena."

          "Bueno, recuerden que si llegan a meterse en una pelea, no podré teletransportarlos de vuelta correctamente hasta que estén todos a salvo y se hayan calmado", dice el del teletransportador. "No querríamos tener otro accidente como el de Desmond."
      - source: scene_3
        paragraph: 6
        text: |-
          "Sí, Barry, iremos con cuidado", dice Breynan.

          "¡Ah, y no olviden volver esta vez a la zona de teletransporte designada antes de llamarme por el transceptor!", dice el del teletransportador. "¡La función de teletransporte de emergencia somete demasiado a tensión a este dispositivo como para usarla solo por comodidad!"

          "Vale, vale, lo entiendo", dice Breynan. "Solo asegúrate de teletransportarnos a las coordenadas habituales, ¿de acuerdo? No quiero que nos metamos en problemas ahí arriba."

          "¡Recibido!", dice el del teletransportador mientras pulsa algunos botones. "¡Que tengan un viaje seguro!"

          Entonces nos rodea una luz blanca muy brillante y empezamos a sentir cómo nuestros cuerpos vibran ruidosamente mientras somos teletransportados a la superficie. Cuando el proceso termina, nos encontramos de pie en medio de un callejón abandonado en lo que parece ser uno de los distritos más pobres de la ciudad. Al alzar la vista hacia el cielo, veo que ahora tiene un tono rojizo y probablemente no tardará mucho en ponerse el sol.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch03b_desmond
  - name: b3_ch03b_desmond
    texts:
      - source: scene_text
        paragraph: 16
        text: |-
          "Esta zona casi nunca es patrullada, así que la usamos como punto habitual de teletransporte cuando queremos llegar a la superficie", dice Breynan. "Vengan conmigo. Les enseñaré cómo localizar una de esas bolas metálicas de ojos verdes en cuestión de minutos, si se sabe cómo buscarlas."

          "¿Qué ocurrió durante el accidente del que habló antes tu amigo?", dice Kate, mientras todos nos ponemos en marcha tras Breynan. "Cuando dijo 'Desmond', ¿se refería al mismo Desmond que ahora custodia la puerta de fuera de la zona de cuarentena?"
      - source: scene_text_2
        paragraph: 12
        text: '"Sí, se refería a ese Desmond", dice Breynan. "Pobre desgraciado, lo pasó fatal. Una vez quedó atrapado en una pelea terrible y le pidió a Barry que lo teletransportara fuera de allí cuanto antes. Técnicamente iba contra nuestras precauciones de seguridad hacer algo así, porque el teletransportador es bastante viejo y le cuesta fijarse correctamente en las auras de la gente si su flujo no está lo bastante calmado, pero la situación parecía desesperada, así que Barry se arriesgó. Por lo que Desmond nos contó, la sensación que tuvo al ser teletransportado fue como si le hicieran pedazos todo el cuerpo. En cuanto apareció en los túneles, empezó a vomitar y se sintió enfermo durante días. Incluso después de todo este tiempo, Desmond todavía no lo ha superado y trata de evitar usar el teletransportador siempre que puede. Por eso pidió personalmente que lo pusieran como un simple guardia en nuestra base rebelde, para no tener que teletransportarse a la superficie a menos que haya una emergencia extrema."'
      - source: scene_3
        paragraph: 7
        text: |-
          "Mierda...", digo. "Suena bastante mal. ¿Al menos se recuperó del todo? ¿O sigue teniendo problemas por aquel teletransporte fallido?"

          "Por suerte se recuperó por completo en unos pocos días", dice Breynan. "Pero desde aquel día no hemos vuelto a intentar un teletransporte así. Sus efectos son demasiado impredecibles como para que merezca la pena el riesgo. En fin, ¿ven aquella bola metálica voladora allá arriba? Va a dar vueltas por esa zona durante un rato y luego debería bajar para patrullar rápidamente ese callejón de allí. Ahí tendremos nuestra conversación. Mientras lleguemos sin que nos noten, no deberíamos tener demasiados problemas. Vamos."

          Logramos entrar con bastante facilidad en el callejón que mencionó Breynan, gracias a la escasez general de guardias por esta zona, y después esperamos pacientemente a que el 'droon' baje hacia nosotras. Tras unos dos minutos dando vueltas por el cielo, la bola metálica desciende, tal como predijo Breynan, y empieza a flotar a unos pocos pies del suelo, muy cerca de nosotras.

          "¡Eh, tú!", dice Breynan. "¡Bola metálica! ¡Quiero hablar con el Supervisor! ¿Me oyes?"

          La bola metálica gira para que su ojo verde quede mirando directamente a Breynan. Tras unos segundos de silencio, el 'droon' responde con su habitual voz metálica.

          "Solicitud reconocida", dice la bola metálica. "Por favor, esperen. El protocolo Supervisor se iniciará en breve."
    choices:
      - position: 1
        text: Melindra, no estás sintiendo a la guardia real por aquí cerca, ¿verdad?
        effects:
          - set:
              current_scene: b3_ch03b_royal
      - position: 2
        text: Esperemos tener más suerte que Eiden sacándole información útil.
        effects:
