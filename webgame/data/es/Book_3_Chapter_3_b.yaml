                  current_scene: b3_ch03b_interrupt
      - condition: b3_ch2_name = 3
        texts:
          - source: scene_text
            paragraph: 20
            text: |-
              "¿Y qué hay del rey?", escribe Leila. "No dejan de mencionar la seguridad del palacio, pero nunca la del rey. ¿Está el rey en una posición más vulnerable ahora que antes?"

              El Supervisor no le responde a Leila y simplemente sigue flotando en el aire, en completo silencio.

              "No creo que pueda leer lo que escribes, Leila", digo. "¡Eh, Supervisor! Leila pregunta si el rey de Ollendor está ahora en una posición más vulnerable que antes."

              "Afirmativo", dice el Supervisor. "El rey está, en efecto, en una posición más vulnerable que antes, como resultado de la llegada de Eiden a la ciudad."

              "¿Cómo es eso?", pregunta Breynan.
          - source: scene_text_2
            paragraph: 14
            text: |-
              "El rey Undriel solía pasar la mayor parte de sus días en el palacio hasta hace poco", dice el Supervisor, "pero desde la aparición de Eiden, su alteza real ha empezado a visitar muchas instalaciones importantes de Ollendor para inspeccionarlas personalmente y asegurarse de que todo está en orden. El rey teme que Eiden pueda marcharse de nuevo si encuentra la más mínima imperfección en su ciudad, así que no deja de desvivirse para garantizar que todo funcione con la máxima fluidez posible. Esto lo coloca en una posición de vulnerabilidad, ya que a la guardia real le resulta más difícil defenderlo cuando está en movimiento que cuando permanece sentado en su trono dentro del palacio. Siempre que conozcan el horario del rey y las rutas que piensa tomar con antelación, la posibilidad de que un intento de asesinato tenga éxito aumenta considerablemente."

              "¿Y podrías proporcionarnos ese horario suyo?", dice Breynan.

              "Negativo", dice el Supervisor. "Esa información está clasificada."

              "Clasificada, ¿eh?...", dice Breynan. "Bueno, ¿hay algún tipo de información no clasificada sobre el horario del rey o sus rutas que pudieras revelarnos? ¿O cualquier información que pudiera resultarnos útil al organizar un asesinato mientras se desplaza de un lugar a otro?"
