    texts:
      - source: scene_text
        paragraph: 41
        text: |-
          "¡Pero sabes lo que le pasó a Desmond!", dice el del teletransportador. "¡No puedo arriesgarme!"

          "¡Todas moriremos si no nos sacas de aquí, entiendes!", dice Breynan. "¡No es momento de preocuparse por un simple dolor de cabeza!"

          "¡Sabes perfectamente que es más que solo un dolor de cabeza!", dice el del teletransportador. "Y además, ¿y si esta vez es peor? ¿Y si alguien pierde un brazo o una pierna? ¿Estás dispuesto a arriesgarte a eso?"

          "¡Ahora ya estás exagerando!", dice Breynan. "Escucha, de verdad no tenemos tiempo para discutir sobre..."

          Antes de que Breynan termine la frase, un hombre vestido con túnicas negras se teletransporta de la nada justo detrás de Illuna e intenta apuñalarla en el corazón con una daga. Illuna lo percibe en el último segundo y logra evitar un golpe fatal, pero por desgracia eso no impide que el hombre le atraviese el pecho con la daga, mientras todas contemplamos la escena con expresiones de horror.

          "¡No!", grita Kate, disparando varios carámbanos hacia el hombre de las túnicas negras y obligándolo a saltar hacia atrás. "¡Aléjate de ella!"
      - source: scene_text_2
        paragraph: 27
        text: |-
          En cuanto el hombre de las túnicas negras retira su cuchillo, Illuna cae al suelo y parece a punto de desmayarse, mientras un charco de sangre se va formando lentamente sobre el pavimento. Cuando miro mejor al hombre que atacó a Illuna, veo que lleva bastantes anillos en los dedos, con gemas de distintos colores incrustadas en ellos. Parece que esos anillos son reliquias lessathi usadas para lanzar diversos tipos de magia, porque el hombre ahora está creando una espada de la nada y enviándola volando hacia Kate.

          "¡Breynan, cúrala rápido!", dice Kate con tono desesperado, mientras intenta mantener a raya al hombre de las túnicas negras mientras reprime su dolor de cabeza.

          "¿Q-q-qué está pasando?", dice el del teletransportador a través del transceptor, mientras Breynan corre a curar a Illuna.

          "¡Todo el mundo, escúchenme!", grita Melindra de repente, mientras Breynan está ocupado lanzando un hechizo curativo sobre Illuna. "¡Tenemos que salir de aquí ahora! Gontrok viene hacia aquí y se mueve a una velocidad absurda. ¡A este ritmo llegará en cualquier momento!"

          "¿Has oído eso, Barry?", dice Breynan a través del transceptor. "¡Necesitamos que nos teletransportes ahora mismo!"

          "Pero... las reglas... Yo no puedo...", dice el del teletransportador.

          "¡Olvídate de las reglas!", grita Breynan. "Asumo toda la responsabilidad. ¡Ahora teletranspórtanos, rápido! No tenemos tiempo."

          "¡Gontrok ya casi está aquí!", dice Melindra.
      - source: scene_3
        paragraph: 23
        text: |-
          "¡Vale!", grita el operador con voz presa del pánico. "¡Lo haré! ¡Pero no me culpen por lo que pase!"

          Una luz blanca brillante empieza a envolvernos a todas, mientras nuestros cuerpos vibran con fuerza. Justo cuando estamos a punto de teletransportarnos, alcanzo a ver a Gontrok corriendo hacia nosotras a una velocidad enorme.

          "¡Maldición!", lo oigo gritar, y entonces mi cuerpo es transportado lejos de la calle en la que estábamos.

          Tal como nos advirtió Breynan, la sensación que tengo ahora es como si el teletransportador me estuviera haciendo pedazos todo el cuerpo. Me hace falta toda mi fuerza de voluntad para no perder el conocimiento durante el teletransporte y, cuando por fin llego a mi destino, lo primero que hago es vomitar en el suelo.

          Mientras me recupero poco a poco, miro a mi alrededor por un instante y veo que, aunque estamos en una caverna subterránea rodeada de paredes de seredium, no hay ningún teletransportador a la vista y, a pesar de haber explorado toda la base rebelde durante el día, este túnel no me resulta familiar en absoluto. Mientras Breynan sigue luchando por mantener a Illuna con vida con uno de sus hechizos curativos, por fin empiezo a comprender lo que nos ha pasado y les hago a todos una pregunta.

          "Esto...", digo. "Esto no está ni cerca de la base rebelde subterránea, ¿verdad?"
