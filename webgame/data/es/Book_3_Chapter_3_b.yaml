  - name: b3_ch03b_inconvenience
    texts:
      - source: scene_text
        paragraph: 7
        text: |-
          "Barry, ¿qué estás haciendo?...", dice Melindra, mientras su voz resuena por todo el túnel.

          En cuanto la oigo, entro en pánico e intento esconderme instintivamente en uno de los túneles laterales, pero no tardo en darme cuenta de que esta no es precisamente una de mis ideas más brillantes.

          "Barry, te das cuenta de que pude sentir cómo te acercabas a nosotras desde el primer momento en que entraste en este pasillo, ¿verdad?", dice Melindra. "¿Cómo pudiste pensar aunque solo fuera un segundo que intentar acercarte a escondidas era una buena idea?..."

          "Vale, admito que este no era precisamente uno de mis mejores planes", digo, mientras vuelvo al túnel principal y empiezo a acercarme a ellas. "Pero aun así, no esperaba encontrarme con ustedes aquí. ¿Adónde van las dos?"

          "¿Adónde dirías que vamos?", dice Melindra. "En serio, Barry, si fuiste lo bastante listo para encontrarnos, no debería costarte tanto averiguar qué intentamos hacer."

          "Sí, pero ¿por qué?", digo cuando por fin las alcanzo. "Si querían hablar con el Supervisor antes de que los hombres del rey del subsuelo tuvieran ocasión de hacerlo, ¿por qué ir solas? ¿Por qué no intentaron al menos hablar con nosotros de todo esto?"
      - source: scene_text_2
        paragraph: 6
        text: |-
          "¿No es evidente?...", dice Melindra. "Porque Kate no quería ser una molestia para ti. Ya se siente responsable de haber arruinado ella sola tu alianza con el rey del subsuelo y no quería ponerte todavía más presión diciéndote que pensaba ir a reunirse con el Supervisor por su cuenta. Y además, ¿a quién iba a pedir ayuda? Tú no tienes tu dispositivo de estadísticas, Leila acaba de reencontrarse con su padre después de mucho tiempo, Flower e Illuna siguen peleadas, Daren está ocupado curando esa peste y Hadrik lleva todo el día de bajón. A estas alturas ya deberías saber que Kate no es del tipo de personas que piden ayuda si cree que podrían estar molestando a alguien."

          "No me parece que haya tenido problema en molestarte a ti, de todas formas...", digo.
      - source: scene_3
        paragraph: 3
        text: |-
          "¡Claro que no!", dice Melindra con expresión orgullosa. "Cuando eres lo bastante amigo de alguien, ya no hace falta preocuparse por molestarlo cuando le pides ayuda. Al fin y al cabo, ¿no va de eso la amistad? ¿De poder molestarse mutuamente sin tener que preocuparse de acabar odiándose por ello?"

          "Sabes, Melindra", dice Kate, "cuando antes me dijiste que te dejara a ti todo el discurso porque sabías cómo tratar con Barry, esto no era exactamente lo que yo tenía en mente."

          "¿No?", pregunta Melindra, con auténtica sorpresa. "¿Por qué no?"

          "¡Tú sabes por qué!", dice Kate. "Pensaba que ibas a convencerlo de volver a la sala de espera, no a contarle todos nuestros planes."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch03b_honest
  - name: b3_ch03b_honest
    texts:
      - source: scene_text
        paragraph: 8
        text: |-
          "¡No te pongas así, hielitos!", dice Melindra. "¡Sabes perfectamente que lo que de verdad querías era que viniera con nosotras!"

          "¡No quería eso!", dice Kate.

          "Claro que sí", dice Melindra. "Si de verdad hubieras querido que no viniera con nosotras, podríamos habernos escondido fácilmente en uno de los túneles laterales cuando lo detecté por primera vez, y nunca nos habría encontrado. Pero ni siquiera sugeriste que hiciéramos algo así. Ahora, ¿a qué se deberá eso, me pregunto?"

          "Yo... simplemente no lo pensé, eso es todo...", dice Kate con tono vacilante.

          "¿Ah, sí?", dice Melindra con una sonrisa de suficiencia. "¿Por eso seguiste volviendo la cabeza hacia todos los túneles laterales por los que pasábamos desde que te dije que Barry nos estaba siguiendo? ¿Porque no estabas pensándolo?"

          "Cállate...", dice Kate.

          "De vez en cuando está bien ser sincera contigo misma, ¿sabes?", dice Melindra, todavía sonriendo con suficiencia. "Mira, es fácil. Repite conmigo: 'Quería que Barry viniera con nosotras a la superficie'. Venga, ¡tú puedes! ¡Confío en ti!"

          "Voy a golpearte...", dice Kate.

          "¿Soy yo o ustedes dos se están llevando un poco mejor de lo normal?", digo.

          "¿De qué estás hablando?", dice Kate enarcando una ceja. "¿Cuándo no nos hemos llevado bien?"

          "Uhh... por ejemplo, el primer día en que empezamos a viajar juntas?...", digo.
      - source: scene_text_2
        paragraph: 7
        text: |-
          "¡Oh, de eso hace siglos!", dice Melindra. "No creo que hayamos tenido ni una sola discusión desde aquel día en que derrotamos juntas a Talmak. ¿A que no, hielitos?"

          "Tienes razón", dice Kate. "No la hemos tenido."

          "Si ustedes lo dicen...", les digo.

          "En fin, ahora que ya hemos dejado eso resuelto, ¡vayamos todas juntas a ver al Supervisor!", dice Melindra. "Conozco bastante bien la ciudad, así que creo que puedo tener una idea general de dónde podríamos encontrar una de esas cabezas de gólem de ojos verdes sin que nos atrapen los guardias."

          "No piensan renunciar a este plan diga yo lo que diga, ¿verdad?", les pregunto.

          "Obviamente", dice Melindra.

          "Bien", digo. "¿Y cómo convencemos al del teletransportador para que nos lleve a la superficie?"

          "¡No!", dice Kate, colocándose delante de mí. "¡Barry, no puedes venir con nosotras!"
      - source: scene_3
        paragraph: 4
        text: |-
          "¿Por qué no?", digo.

          "¡Porque no tienes tu dispositivo de estadísticas!", dice Kate. "¡Estarás indefenso!"

          "Bueno, técnicamente sí llevo conmigo mi potenciador de estadísticas", digo, sacándolo del bolsillo para enseñárselo durante unos segundos antes de volver a guardarlo. "Lo único es que ahora mismo no funciona. Pero se supone que volverá a funcionar dentro de unas horas o menos. Y aunque no lo haga, soy Barry el temerario, ¿recuerdas? Seguro que me las arreglaré de una forma u otra."

          "Creía que se suponía que estabas esforzándote por ser menos temerario", me dice Kate.

          "Cierto, pero técnicamente tú también se suponía que estabas intentando confiar más en tus amigos, así que supongo que estamos empatados", digo.

          "¿Tienen sitio para una más o ya terminaron de aceptar pasajeros extra?", vemos de repente un texto azul flotando frente a nosotras.

          Al darnos la vuelta, vemos que Leila también se está acercando despacio, sonriendo levemente.
    choices:
