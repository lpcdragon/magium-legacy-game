              current_scene: b3_ch03b_platform
  - name: b3_ch03b_platform
    texts:
      - source: scene_text
        paragraph: 28
        text: |-
          "¡No podemos!", dice uno de los hombres con voz temblorosa. "El hombre de las túnicas negras nos dijo que teníamos que asegurarnos de que no salieran del callejón. Dijo que mataría a nuestras familias si no obedecíamos. ¡No podemos dejarlos pasar!"

          "¡No tienen por qué hacer esto!", dice Breynan mientras intenta acercarse despacio a él. "Vengan con nosotros y daremos refugio a ustedes y a sus familias en los túneles subterráneos bajo la ciudad. Estoy con los rebeldes. ¡Puedo mantenerlos a salvo!"

          "¡Atrás!", dice el hombre de la voz temblorosa, lanzando su daga hacia Breynan. "¡No se acerquen más! ¡Se lo advierto!"

          "No tenemos tiempo para esto", dice Kate, y entonces conjura varias barras altas de hielo entre nosotras y los hombres harapientos para impedir que nos alcancen.

          "¿Qué estás haciendo?", dice Breynan. "Ahora nos tienen justo donde querían."

          "No, no es así", dice Kate, conjurando ahora una plataforma de hielo justo debajo de nuestros pies. "Si no podemos pasar por su lado, tendremos que volar por encima de ellos."
      - source: scene_text_2
        paragraph: 16
        text: |-
          Antes siquiera de que la plataforma de hielo tenga ocasión de levantarnos del suelo, tanto las barras de hielo como la plataforma desaparecen de repente, y Kate se aprieta las manos contra la frente, tratando al parecer de contener un fuerte dolor de cabeza.

          "¿Qué ha pasado?", le pregunto.

          "No lo sé...", dice Kate, manteniendo los ojos cerrados mientras intenta librarse del dolor. "No puedo... concentrarme... Apenas puedo... formular frases."

          "Le han lanzado un hechizo de mareo realmente potente", dice Melindra. "Ha atravesado de lleno sus protecciones mágicas. No lo entiendo. No hay magos cerca. ¿Quién podría haber lanzado ese hechizo?"

          "Debe de ser alguien usando un dispositivo lessathi", dice Breynan. "Quizá incluso un guardia real. No todos son magos."

          "¡Si no es un mago, no tengo forma de distinguirlo de todos los demás civiles de la zona!", dice Melindra. "No deberíamos haber bajado la guardia. Voy a sacarnos de aquí."
      - source: scene_3
        paragraph: 15
        text: |-
          Entonces empieza a elevarnos muy despacio en el aire, pero uno de los hombres harapientos echa a correr hacia nosotras e intenta atacar a Melindra.

          "¡No, no dejaré que escapen!", dice el hombre, pero Breynan lo intercepta, saca su espada y choca contra él.

          Al mismo tiempo, los otros dos hombres también vienen corriendo hacia nosotras, y Leila y yo nos vemos obligados a sacar nuestras armas y enfrentarnos a ellos también.

          "¡No puedo concentrarme en elevarlos si todos están peleando!", dice Melindra mientras nos hace descender de nuevo al suelo. "¡Terminen rápido sus peleas para que podamos salir de aquí!"

          Mientras Melindra hablaba, otros tres hombres estaban entrando al callejón por el otro lado y parece que ahora intentan flanquearnos. Parece que ya no puedo permitirme vacilar. Tendré que decidir qué hacer con estos hombres, y rápido.
    choices:
      - position: 1
        text: Intentar incapacitar, sin matar a nadie.
        effects:
          - set:
              current_scene: b3_ch03b_glance
              b3_ch3_civilians: 0
      - position: 2
        text: Matar solo si es necesario.
        effects:
          - set:
              current_scene: b3_ch03b_glance
              b3_ch3_civilians: 1
      - position: 3
        text: Matar a todo el que me ataque.
        effects:
          - set:
              current_scene: b3_ch03b_glance
              b3_ch3_civilians: 2
  - name: b3_ch03b_glance
    routes:
      - condition: b3_ch3_civilians = 0
        texts:
          - source: scene_text
            paragraph: 29
            text: |-
              Con solo echarles un vistazo, puedo decir que estos hombres nunca han empuñado una hoja en su vida. Incluso sin mis estadísticas, debería poder ocuparme de ellos fácilmente.

              No pierdo tiempo y uso mi daga para apuñalar en la pierna al hombre que tengo delante. Luego le doy una patada en el estómago y lo hago caer de espaldas, mientras saco rápidamente la ballesta de mi mochila y empiezo a disparar también a los hombres que tengo detrás en las piernas, para inmovilizarlos.

              Justo cuando los tres hombres que intentaban flanquearnos caen al suelo, el hombre al que apuñalé antes se recupera mucho más deprisa de lo que esperaba e inmediatamente se lanza hacia mí con el cuchillo empuñado con firmeza en las manos.

              Disparo deprisa a la otra pierna del hombre para intentar frenar su impulso, pero antes de caer al suelo aún consigue apuñalarme en el lado izquierdo del abdomen.

              "Parece que te vendría bien algo de curación", me dice Breynan, mientras presiono la mano contra la herida para evitar que sangre demasiado y el hombre que me apuñaló grita de dolor en el suelo, incapaz de volver a levantarse.
          - source: scene_text_2
            paragraph: 17
            text: |-
              Cuando me vuelvo hacia Breynan, veo que tanto él como Leila han conseguido dejar fuera de combate a sus adversarios y que ahora se acercan a mí. Cuando Breynan llega lo bastante cerca, pone las manos sobre mi herida y de ellas sale una luz blanca, mientras empiezo a sentir poco a poco que el dolor remite gracias a los efectos de la curación.

              "¡Padre!", grita un niño de diez años, corriendo ahora hacia el hombre que me apuñaló, que sigue tirado en el suelo.

              "Estoy bien", dice el hombre cuando el niño llega hasta él. "Por favor, vuelve con tu madre. Aquí no es seguro."

              "¡Pero padre, tenemos que llevarte a un médico!", dice el niño. "¡Estás sangrando!"
          - source: scene_3
            paragraph: 16
            text: |-
              "Salgamos de aquí antes de que alguien más intente atacarnos", nos dice Breynan en cuanto termina de lanzar su hechizo curativo.

              Pasamos junto al padre y el niño y salimos del callejón, comprobando con cuidado nuestros alrededores para ver si no nos espera otra emboscada en la calle más grande que hay justo fuera. Mientras regresamos hacia el lugar al que nos teletransportaron al principio, alcanzamos a ver a una mujer entrando en el callejón que acabamos de dejar, y probablemente sea la 'madre' de la que habló el hombre al que disparé.
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch03b_uniforms
      - condition: b3_ch3_civilians = 1
        texts:
          - source: scene_text
            paragraph: 30
            text: |-
              Con solo echarles un vistazo, puedo decir que estos hombres nunca han empuñado una hoja en su vida. Incluso sin mis estadísticas, debería poder ocuparme de ellos fácilmente.

              No pierdo tiempo y uso mi daga para apuñalar en la pierna al hombre que tengo delante. Luego le doy una patada en el estómago y lo hago caer de espaldas, mientras saco rápidamente la ballesta de mi mochila y empiezo a disparar también a los hombres que tengo detrás en las piernas, para inmovilizarlos.

              Justo cuando los tres hombres que intentaban flanquearnos caen al suelo, el hombre al que apuñalé antes se recupera mucho más deprisa de lo que esperaba e inmediatamente se lanza hacia mí con el cuchillo empuñado con firmeza en las manos.

              Me doy cuenta enseguida de que dispararle en la pierna no evitará que me apuñale, así que entro en pánico y uso la ballesta para dispararle un virote directamente al pecho. Al recibir el disparo, mi atacante deja caer la daga e intenta arrancarse el virote de ballesta con las manos desnudas, pero enseguida pierde la fuerza en brazos y piernas y se desploma de bruces en el suelo. Después de intentar levantarse varias veces sin éxito, el hombre harapiento por fin deja de moverse y sucumbe lentamente a la muerte. Al mirar a mi alrededor, veo que tanto Breynan como Leila han conseguido dejar fuera de combate a sus adversarios y que ahora se acercan a mí.
          - source: scene_text_2
            paragraph: 18
            text: |-
              "Tenemos que salir de aquí antes de que alguien más intente atacarnos", dice Breynan. "No quiero que hoy se pierdan más vidas inocentes..."

              "¿Padre?...", oímos la voz de un niño de diez años entrando ahora en el callejón.

              Cuando ve al hombre muerto a mis pies, el niño corre hacia él todo lo deprisa que puede y se arrodilla a su lado, intentando despertarlo.

              "No...", dice el niño al ver la mirada sin vida en los ojos de su padre. "No, no, no, no puedes estar muerto. Dijiste que todo iría bien. Dijiste que volveríamos juntos a casa cuando todo esto terminara. Por favor, dime que solo estás durmiendo. Por favor..."

              Entonces el niño agarra con ambas manos la camisa de su padre, intentando con todas sus fuerzas contener las lágrimas.

              "Vamos", nos dice Breynan. "No hay nada más que podamos hacer aquí."

              "Tú...", dice el niño justo cuando estamos a punto de pasar a su lado. "Tú hiciste esto..."

              Cuando vuelvo la cabeza hacia él, veo que ahora me está mirando directamente a los ojos, con una expresión dolorida pero decidida. Mientras sigue mirándome, de pronto me doy cuenta de que todavía sostengo la ballesta que disparó el virote que ahora está clavado en el pecho de su padre.
          - source: scene_3
            paragraph: 17
            text: |-
              "Nunca te perdonaré...", dice el niño, apretando aún más fuerte la ropa del cadáver que tiene delante.

              Luego repite las mismas palabras con una voz mucho más fuerte, mientras la expresión de sus ojos se transforma en puro odio.

              "¡Nunca te perdonaré!", grita el niño.

              "Por aquí", me dice Breynan al ver que he dejado de moverme.

              Echo una última mirada al niño y luego lo sigo fuera del callejón, sin volver la vista atrás. Al salir, alcanzo a ver a una mujer justo afuera, cubriéndose los ojos con una mano mientras las lágrimas le corren lentamente por la cara. Entiendo enseguida que debe de ser la esposa del hombre al que acabo de matar. Pasamos todos junto a ella sin decir una palabra y empezamos a regresar hacia el lugar al que nos teletransportaron al principio.
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch03b_uniforms
