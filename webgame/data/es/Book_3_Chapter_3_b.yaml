  - name: b3_ch03b_helping
    texts:
      - source: scene_text
        paragraph: 21
        text: |-
          "¿Por qué nos ayudas a asesinar a tu propio rey?"

          "El único propósito del protocolo Supervisor es prestar asistencia", dice el Supervisor.

          "Vale, eso lo entiendo", digo. "Pero acabas de ayudarnos contra tu propio amo. ¿No crees que al rey le habría ido mejor si no nos hubieras dado esa información?"

          "Pregunta poco clara", dice el Supervisor. "Por desgracia, el protocolo Supervisor no puede proporcionarle una respuesta correcta si su pregunta es demasiado vaga. Reformule su consulta anterior."

          "¿En qué sentido era poco clara?...", digo. "¡Esa pregunta era lo más directa posible!"

          El Supervisor no dice nada y simplemente sigue flotando sobre el suelo, en silencio.

          "No vas a sacarle nada más", me dice Breynan. "No hará más que repetir 'Pregunta poco clara' hasta que te rindas. Es la frase estándar que siempre utiliza cuando no quiere responder a una pregunta."

          "Así que así van a ser las cosas...", digo.
