  - name: b3_ch03b_status
    texts:
      - source: scene_text
        paragraph: 12
        text: |-
          "He venido por voluntad propia", dice Breynan. "Los seguí hasta aquí porque quería unirme a ustedes. Miren... pretenden hablar con el Supervisor, ¿verdad? Pues yo soy quien más ha interactuado con él de entre todos los de este lugar. ¡Sé cómo piensa! Hay muchas maneras en las que puedo ayudarlos si deciden llevarme con ustedes. Puedo ayudarlos a encontrar más rápido esas bolas metálicas de ojos verdes. También puedo inventar una excusa lo bastante buena como para convencer a Barry de que nos teletransporte a la superficie sin levantar sospechas. Lo único que pido a cambio es que me permitan ser el primero en hablar con el Supervisor."

          "¿Y cómo sabemos que luego no vas a contarle toda nuestra conversación con el Supervisor a tu rey cuando volvamos?", dice Kate.

          "¡No le diré nada al rey, lo juro!", dice Breynan. "Sé cómo pueden parecer las cosas desde la perspectiva de alguien de fuera, pero no todos los rebeldes somos completamente sumisos al rey del subsuelo. Algunos todavía tenemos orgullo. No voy a dejar que el rey me pisotee como hace con Peter y Albert todos los días. El rey sabía perfectamente que para mí era muy importante participar en estas negociaciones con el Supervisor, pero me prohibió ir, simplemente porque quería demostrarme que es él quien manda. Si así van a ser las cosas, entonces ya no siento la necesidad de obedecer todas sus órdenes. Tomaré mis propias decisiones, basándome en lo que creo que es correcto, aunque eso signifique arriesgar mi posición y mi estatus dentro de esta sociedad subterránea."
      - source: scene_text_2
        paragraph: 9
        text: |-
          "No parece que esté mintiendo", dice Melindra. "Al menos no por lo que percibo en su aura."

          "Yo también lo creo", escribe Leila. "Y si lo que dice es cierto, entonces no tendría ninguna razón para contarle al rey lo de nuestra reunión con el Supervisor, porque eso sería como esforzarse activamente por notificarle su propia traición."

          Kate suspira.

          "Breynan", dice, "no puedo decir que confíe del todo en ti, pero admitiré que prefiero que vengas con nosotras a dejarte aquí y darte un motivo real para querer delatarnos ante tu rey. Si todo el mundo está de acuerdo con esto, sigamos adelante. No me gustaría que alguien más nos alcanzara antes de que podamos llegar a la sala del teletransportador."
    choices:
      - position: 1
        text: ¿No deberíamos al menos avisar a Daren de adónde vamos?
        effects:
          - set:
              current_scene: b3_ch03b_daren
              b3_ch3_daren: 1
      - position: 2
        text: De acuerdo, movámonos.
        effects:
          - set:
              current_scene: b3_ch03b_teleporter
              b3_ch3_daren: 0
  - name: b3_ch03b_daren
    texts:
      - source: scene_text
        paragraph: 13
        text: |-
          "¿No deberíamos al menos avisar a Daren de adónde vamos?"

          "Puede que sea buena idea", escribe Leila. "Si algo sale mal y tardamos demasiado en volver, al menos debería saber lo que está pasando."

          "Si vamos a contárselo a Daren, tendremos que asegurarnos de que nadie a su alrededor oiga de qué estamos hablando", dice Kate. "No querríamos que nadie informara al rey de nuestros planes."

          "No se preocupen, yo me encargo", digo mientras saco el transceptor y lo pongo en la frecuencia de Daren.

          "Eh, Daren, ¿nos oyes?", digo.

          "Sí, Barry", dice Daren. "¿Qué pasa?"

          "¿Podrías bajar el volumen de tu transceptor al mínimo y luego acercártelo al oído?", digo.

          "Eh... vale", dice Daren. "Dame un segundo."

          Hay una breve pausa antes de que volvamos a oír la voz de Daren.

          "Vale, ya está", dice Daren.

          "Bien", digo. "Ahora asegúrate de no sobreactuar a nada de lo que voy a decir y de usar solo palabras vagas al responderme, para no revelar el tema de nuestra conversación. Bien, ¿estás listo?"
      - source: scene_text_2
        paragraph: 10
        text: |-
          "Sí, sí, estoy listo", dice Daren. "¿Qué es?"

          "Llamaba para decirte que Kate, Melindra, Leila y yo estamos a punto de ir a reunirnos con el Supervisor por nuestra cuenta, a espaldas del rey", digo. "Ah, y Breynan también viene con nosotras."

          "¡¿Qué?!", grita Daren muy fuerte.

          "Daren, ¿qué acabo de decirte sobre sobreactuar?...", digo.

          "Sí, sí, lo siento...", dice Daren, ahora en voz más baja. "Pero aun así, ¿por qué harían algo así? ¿No íbamos a esperar hasta mañana para tomar una decisión?"

          "Escucha", digo. "Kate estaba a punto de salir ahí fuera solo con Melindra antes de que la interceptáramos. Se sentía culpable por haber arruinado nuestra alianza con el rey y quería encargarse ella misma del asunto. No piensa parar hagamos lo que hagamos."

          "Ugh... bien", dice Daren. "Esperen ahí, voy con ustedes."
      - source: scene_3
        paragraph: 5
        text: |-
          "En realidad, creo que deberías quedarte ahí y ocuparte de la peste", digo. "Recuerda que solo te queda una semana hasta que tu enfermedad se vuelva contagiosa. No deberías interrumpir tu trabajo salvo que sea absolutamente necesario. No te preocupes por nosotras. Podemos arreglárnoslas solas."

          "Vale...", dice Daren. "Vale. Pero prométeme que no correrán riesgos innecesarios. Si sienten que van a ser emboscadas, no se lo piensen dos veces y pidan que las teletransporten de vuelta de inmediato, ¿entendido?"

          "Sí, sí, iremos con cuidado", digo.

          "Muy bien", dice Daren. "No olviden llamarme cuando vuelvan."

          "No lo olvidaremos", digo. "Vale, cierro ya el transceptor. Cuídate."

          Entonces toco una vez el transceptor para cerrarlo y me lo guardo en el bolsillo.

          "Parece que estamos listas para ir", dice Melindra. "Movámonos."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch03b_teleporterb
  - name: b3_ch03b_teleporter
    texts:
      - source: scene_text
        paragraph: 14
        text: |-
          "De acuerdo, movámonos."

          "Breynan, hay una pregunta que olvidé hacerte antes", dice Kate poco después de que empecemos a dirigirnos a la sala del teletransportador. "Si ya pensabas actuar a espaldas del rey y reunirte con el Supervisor por tu cuenta, ¿por qué no fuiste solo? ¿Por qué preferiste unirte a nosotros?"

          "No suelo ir solo en las misiones, así que si de repente pidiera salir ahí fuera por mi cuenta, temía que pudiera parecer un poco sospechoso", dice Breynan. "A pesar de mi aspecto, no soy precisamente muy luchador. Me gusta llevar esta espada conmigo, pero solo la uso cuando es absolutamente necesario. Por lo general tiro más hacia la magia de ilusión, con un poco de curación de apoyo. Por eso mi plan es fingir que los llevo a todos fuera para enseñarles las rutas habituales de patrulla de los guardias, de modo que podamos cooperar mejor en el futuro cuando salgamos juntos en misiones."

          "¿Crees que el del teletransportador se tragará esa historia?", digo.

          "¿Te refieres a Barry?", dice Breynan. "Se la tragará, no te preocupes. Déjame hablar a mí y todo irá bien."
      - source: scene_text_2
        paragraph: 11
        text: |-
          "Esperemos que tengas razón", digo.

          Después de caminar un poco más, por fin llegamos a la sala del teletransportador, donde Barry 'Nubarrón' sigue de pie detrás del escritorio metálico lleno de botones que controla el dispositivo de teletransporte situado detrás de él. En cuanto nos ve, el del teletransportador nos saluda con la mano y luego saluda a Breynan.

          "Hola, Breynan", dice el del teletransportador. "¿Llevas a nuestros nuevos 'reclutas' a su primera misión?"

          "Más bien a una sesión de entrenamiento", dice Breynan. "Quiero enseñarles las rutas habituales de patrulla de los guardias para que sepan desenvolverse cuando estén en una misión con nosotros aunque nuestros grupos tengan que separarse. Lo último que querríamos es que volvieran a meterse en una pelea con la guardia real por error."

          "Ah, o sea que no piensan meterse en ninguna pelea", dice el del teletransportador.

          "Sí", dice Breynan. "Con suerte solo será un viaje corto y sin incidentes, y volveremos justo a tiempo para la cena."

          "Bueno, recuerden que si llegan a meterse en una pelea, no podré teletransportarlos de vuelta correctamente hasta que estén todos a salvo y se hayan calmado", dice el del teletransportador. "No querríamos tener otro accidente como el de Desmond."
      - source: scene_3
        paragraph: 6
        text: |-
          "Sí, Barry, iremos con cuidado", dice Breynan.

          "¡Ah, y no olviden volver esta vez a la zona de teletransporte designada antes de llamarme por el transceptor!", dice el del teletransportador. "¡La función de teletransporte de emergencia somete demasiado a tensión a este dispositivo como para usarla solo por comodidad!"

          "Vale, vale, lo entiendo", dice Breynan. "Solo asegúrate de teletransportarnos a las coordenadas habituales, ¿de acuerdo? No quiero que nos metamos en problemas ahí arriba."

          "¡Recibido!", dice el del teletransportador mientras pulsa algunos botones. "¡Que tengan un viaje seguro!"

          Entonces nos rodea una luz blanca muy brillante y empezamos a sentir cómo nuestros cuerpos vibran ruidosamente mientras somos teletransportados a la superficie. Cuando el proceso termina, nos encontramos de pie en medio de un callejón abandonado en lo que parece ser uno de los distritos más pobres de la ciudad. Al alzar la vista hacia el cielo, veo que ahora tiene un tono rojizo y probablemente no tardará mucho en ponerse el sol.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch03b_desmond
