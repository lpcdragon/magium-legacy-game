  - name: b3_ch03b_merrier
    texts:
      - source: scene_text
        paragraph: 9
        text: |-
          "¡Claro que puedes venir! ¡Cuantos más, mejor!"

          "En realidad, estamos intentando escabullirnos de los guardias, no pelear con ellos, así que es preferible tener un equipo más pequeño", dice Melindra. "Pero Leila es buena en el sigilo, así que no debería haber problema. ¡Bienvenida a bordo!"

          "¡Encantada de ser de ayuda!", escribe Leila.

          "Entonces, ¿debo dar por hecho que ya sabes lo que está pasando?", digo.

          "Sí, más o menos lo deduje en cuanto sentí la presencia de Kate y Melindra en el túnel", escribe Leila. "No es que pudiera haber tantas razones para que quisieran salir a la superficie."

          "Lo siento, Leila...", dice Kate. "No quería apartarte de tu padre justo después de que por fin se hayan reencontrado."
      - source: scene_text_2
        paragraph: 8
        text: |-
          "No tienes que preocuparte por eso", escribe Leila. "Nunca me obligaste a venir aquí. Elegí estar aquí por mi propia cuenta. Y además, solo vamos a hacer un viaje corto, ¿no? Volveremos justo después de hablar con el Supervisor."

          "Ese sería el plan, sí", dice Melindra. "Pero antes de seguir adelante, todavía hay un asunto sin resolver del que vamos a tener que ocuparnos. Breynan, ya puedes salir de tu escondite. Siento decirte que tus habilidades de supresión de aura no están ni de lejos al nivel suficiente para engañarme."

          "Temía que pudiera ser así", oímos la voz de Breynan, mientras disipa su hechizo de invisibilidad y empieza a materializarse lentamente de la nada, a unos quince metros de donde estamos.

          "¿Qué haces aquí?", dice Kate, frunciéndole el ceño. "¿Te envió el rey del subsuelo a espiarnos?"

          "¡No, no fue el rey!", dice Breynan.

          "Entonces, ¿quién?", dice Kate.
