    texts:
      - source: scene_text
        paragraph: 10
        text: |-
          "Espera, ¿cómo sabías dónde encontrarnos?"

          "Te vi entrar corriendo en este túnel mientras seguía a mi padre hacia su taller, así que me imaginé que algo debía de haber salido mal", escribe Leila. "Al principio no estaba segura de si debía ir tras vosotros, pero al final me decidí y le dije a mi padre que tendríamos que dejar el mantenimiento de mi potenciador de estadísticas para otro momento, para poder alcanzaros a tiempo."

          "Entonces, ¿debo dar por hecho que ya sabes lo que está pasando?", digo.

          "Sí, más o menos lo deduje en cuanto sentí la presencia de Kate y Melindra en el túnel", escribe Leila. "No es que pudiera haber tantas razones para que quisieran salir a la superficie."

          "Lo siento, Leila...", dice Kate. "No quería apartarte de tu padre justo después de que por fin se hayan reencontrado."
