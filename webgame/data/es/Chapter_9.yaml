                condition: is_dead = 1
      - condition: reflexes >= 3
        texts:
          - source: scene_text
            paragraph: 71
            text: |-
              Al girarme, descubro aterrorizado que uno de los ogros acaba de hacerse visible, y ahora está a punto de estrellar un garrote de cinco pies contra mi cráneo.

              Mientras el garrote descendía hacia mí, mi cuerpo se movió solo, y conseguí apartarme del peligro, mientras el arma del ogro se estrellaba contra el suelo y enviaba trozos de roca volando por todas partes.

              Al echar un vistazo más de cerca a mi atacante, veo que el monstruo mide unos ocho pies de alto, con piel gruesa y gris, y no lleva más que un taparrabos alrededor de la cintura. Dos de sus colmillos inferiores sobresalen de su boca cerrada, su frente es excesivamente estrecha, y en su cara lleva una de las expresiones más estúpidas que he visto en mi vida.

              Los demás ogros también están apareciendo lentamente de la nada, y resulta que hay al menos un centenar de ellos, y nos tienen completamente rodeados. Dos de los ogros destacan entre la multitud, uno por la excesiva cantidad de tatuajes en su cuerpo, y el otro por su armadura pesada. Deben ser el chamán y el capitán del fuerte de los que tanto hemos oído hablar. Todos los demás ogros no llevan más que taparrabos y sostienen grandes garrotes en sus manos, así que es un poco difícil distinguir a sus magos de sus guerreros.
        effects:
          - set:
              successful_checks:
                - '[ Comprobación de reflejos exitosa - nivel 3 ]'
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: ch9_brave
                condition: is_dead = 0
  - name: ch9_brave
    texts:
      - source: scene_text
        paragraph: 72
        text: |-
          Los ogros que nos rodean están todos haciendo fuertes ruidos y preparando sus garrotes, mientras nosotros sacamos nuestras propias armas y nos preparamos para luchar. Sin embargo, antes de que podamos enfrentarnos al enemigo, su capitán ruge con fuerza, y eso hace que todos los demás ogros se queden completamente en silencio. Luego se apartan para dejar paso a su chamán, que se acerca a nosotros y se detiene a unos pies de nuestra posición, apoyándose en su bastón de madera.

          "¡Bienvenidos, valientes guerreros!" dice el chamán, en la lengua común, con una sonrisa perversa en su cara. "No es frecuente ver humanos vagando por estas tierras hoy en día. Debo decir que ciertamente sois audaces al venir aquí solos. ¿A qué debo este placer?"
    choices:
