        paragraph: 43
        text: |-
          "¿Ah sí? ¿Y quién nos va a guiar hasta la fortaleza de los ogros sin la chica?"

          "Ya sabemos la dirección general. Diría que estamos lo suficientemente cerca de nuestro destino como para poder llegar incluso sin guía a estas alturas. Apártate, Barry."

          "Sí," digo, con una risa, mientras saco mi daga. "Eso no va a pasar."

          "¡Oh-oh-oh, amigos!" dice Hadrik. "¿Qué tal si ambos respiráis hondo y pensáis en lo que estáis haciendo? ¿De verdad queréis acabar así, por una disputa insignificante? ¿No preferiríais que vuestros nombres fusen inmortalizados como guerreros legendarios que lucharon en el mayor torneo de magos de la historia reciente en lugar de ser recordados como los idiotas que murieron antes de que el concurso siquiera empezara?"

          "Daren, por favor..." dice Rose, con una mirada suplicante.

          Al ver que nadie está de su lado, Daren finalmente decide envainar su espada.

          "No voy a luchar contra ti, Barry," dice. "Esperaba intimidarte para que te echaras atrás, pero supongo que si no eres del tipo que se deja intimidar por un stillwater o un dragón, una espada no va a servirme de mucho. Si te importa tanto, no me queda más remedio que dejar las cosas como están, por ahora. Tenías razón con Kate, así que solo puedo esperar que tu instinto esté en lo cierto esta vez también."
      - source: scene_text_2
        paragraph: 18
        text: |-
          Con estas últimas palabras, Daren y Hadrik pasan junto a nosotros para tomar sus posiciones en lo alto de la colina, mientras Rose, Illuna y yo bajamos hacia nuestras tiendas. Los tres descendemos de la colina sin decir una sola palabra, y cuando llegamos a la tienda de Flower, Illuna gira la cabeza hacia mí antes de entrar.

          "Tu intervención de antes era innecesaria, humano," me dice. "Podría haberme encargado de ese sanador sin tu ayuda."

          "¡Vamos, no seas así!" le digo. "¡Los amigos deben apoyarse mutuamente en los momentos de necesidad!"

          "Pareces estar bajo la falsa impresión de que tú y yo somos amigos. Te aseguro que nada podría estar más lejos de la verdad."
    choices:
