  - name: ch9_getting_along
    texts:
      - source: scene_text
        paragraph: 16
        text: |-
          "Hablando de Petal, ¿cómo os habéis llevado estos últimos veinte años?"

          "¡Oh, ha sido genial!" dice Flower. "¡Me lo he pasado en grande durante todos estos años y creo que Petal también lo ha disfrutado! O al menos creo que sí. Es un poco difícil saberlo porque siempre está gruñona y no es muy sociable."

          "Sí, conozco a gente así," le digo, mientras miro hacia Kate.

          Kate me frunce el ceño, pero no se digna a responder a mi comentario.

          "¡Eh, Flower!" grita Daren desde lejos. "¿Es este el camino correcto a la fortaleza de los ogros?"

          "¡No!" grita Flower, mientras sale corriendo hacia donde Daren está parado. "¡Si seguimos por aquí, acabaremos en medio de un pantano! Tenemos que girar a la izquierda aquí, y luego seguir este sendero hasta salir del bosque."

          Los seis reanudamos nuestro viaje, y Flower vuelve a ir al frente. La chica se ha vuelto mucho más fiable desde que salimos de las ruinas. Parece saber exactamente a dónde va, y comprueba regularmente varios puntos de referencia que ha marcado en el pasado, para asegurarse de que seguimos en la dirección correcta. Debe haber recorrido estos caminos muchas veces a lo largo de los años.
      - source: scene_text_2
        paragraph: 10
        text: |-
          Cuando empieza a oscurecer, decidimos acampar en un valle cerca de un pequeño río, donde no hay muchos árboles que puedan ocultar a posibles emboscadores. Flower y Kate fueron a explorar la zona alrededor de nuestro campamento, mientras Daren y Hadrik, que ambos tenían varias tiendas de repuesto en sus mochilas encantadas, ahora están ocupados montándolas. Como dijeron que no necesitaban ayuda, y realmente no había nada más que hacer, Rose y yo nos sentamos en un tronco no lejos de ellos, para no estorbarles.

          "Así que, esto..." empiezo a preguntarle a Rose. "¿Cómo lo has estado llevando últimamente? Parecías bastante afectada después de que nos encontramos con esa hidra. Y tampoco parecías estar muy bien cuando nos atacó el dragón..."

          Rose se sonroja al oír mi pregunta.

          "Oh, te diste cuenta..." dice, sonando un poco avergonzada.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch9_whimpers
