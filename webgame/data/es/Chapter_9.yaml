        paragraph: 10
        text: |-
          "Aunque tus habilidades acrobáticas pueden ser destacables," dice Kate, "quedan completamente eclipsadas por tu afinidad natural con la magia. ¿Sabes a qué se debe?"

          "No estoy segura... Petal siempre me dijo que estoy aprendiendo magia a un ritmo mucho más rápido de lo que debería ser humanamente posible. ¿Es porque soy una etérea también?"

          "¡Sí! El plano etéreo es más cercano en naturaleza al plano mágico que el plano terrenal. Por esta razón, tu perspectiva única te permite comprender la magia mucho más naturalmente que al resto de nosotros. Ser etérea no te otorga poderes mágicos al nacer, pero aquellos que también nacen como magos están destinados a volverse extremadamente poderosos. Por eso los lessathi del Faro de Esperanza se propusieron capturar a tantos huérfanos etéreos como fuera posible, con la esperanza de que sus experimentos tendrían mayor probabilidad de éxito. Mi amiga Diane y su hermano eran ambos etéreos, y resultaron ser bastante prodigiosos."

          "Creo que por fin empiezo a entender por qué Petal se sorprendió tanto al encontrarme dentro de mi propia mente cuando despertó por primera vez," dice Flower.

          "Si tuviera que aventurar una suposición," dice Kate, "diría que tu inesperada fusión con el alma de la banshee también fue resultado de tus circunstancias bastante singulares. Normalmente, una banshee encontraría el alma indefensa cuando invade la mente de su anfitriona, pero tú debiste estar esperándola, armada y preparada. Dado que tenías la ventaja del terreno, ella no tuvo más remedio que aceptar un compromiso."
      - source: scene_text_2
        paragraph: 6
        text: |-
          Flower jadea en voz alta, de repente.

          "¡Oh no, acabo de darme cuenta de algo!" dice. "El Faro del que hablaste... y los experimentos..."

          Hace una pausa.

          "¿Eres una maga artificial?" pregunta.

          "Lo soy. ¿Por qué lo preguntas?"

          "¡Oh dios, lo debiste pasar mucho peor que yo! Al menos yo tenía la experiencia de Petal en la que apoyarme cuando nos perseguían los cazadores de banshees. Me ha enseñado muchos trucos de supervivencia que me han resultado útiles a lo largo de los años. ¿Quieres que comparta algunos contigo?"

          "Eh, supongo que no vendría mal..."

          "¡Genial!" dice Flower, mientras su alegre sonrisa vuelve a su cara una vez más. "Intentaré recordar todo lo que sé de camino a la fortaleza de los ogros. ¡Vamos, seguidme! ¡Podemos seguir hablando mientras caminamos!"

          "Etéreos, ¿eh?" se dice Arraka a sí misma, mientras empezamos nuestra larga marcha hacia nuestro objetivo. "Es un nombre que suena bastante guay. ¡Puede que empiece a usarlo yo también a partir de ahora!"
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch9_crossroads
  - name: ch9_crossroads
    texts:
      - source: scene_text
        paragraph: 11
        text: |-
          Pasamos las siguientes horas siguiendo el camino que Flower nos había indicado. Durante este tiempo, Daren y Hadrik empezaron una especie de competición para ver cuál de los dos podía contar la historia más interesante de sus aventuras, mientras Kate y Flower empezaron a compartir sus experiencias vitales similares la una con la otra, lo que pareció acercarlas un poco más.

          Una vez llegamos al cruce, alrededor de mediodía, todos nos detuvimos, y Daren empezó a dirigirse a Rose, con una expresión seria en el rostro:

          "Rose, creo que deberías tomar este camino y dirigirte a tu ciudad natal lo antes posible. No te preocupes por nosotros y los collares. ¡Estaremos bien! ¡Los enfermos de tu pueblo te están esperando!"

          "No puede irse..." dice Kate. "¿Recuerdas lo que nos dijo el leopardo antes de que nos fuéramos? Si dos de los collares se alejan más de tres millas entre sí, todos empezaremos a recibir descargas eléctricas de intensidad creciente por todo el cuerpo. Si los collares se alejan más de cuatro millas, moriremos todos. Los lessathi fueron quienes diseñaron originalmente estos dispositivos, y esta era una medida que tomaban para mantener a sus prisioneros bajo control. Rose, lo siento mucho... No sabía que llegaríamos a esto. Debería haber intentado detenerte cuando te ofreciste a venir conmigo ayer. Todo esto es culpa mía..."
      - source: scene_text_2
        paragraph: 7
        text: |-
          "Kate, no tenías forma de saber que esto pasaría," dice Rose. "Incluso con este desvío, seguiré llegando antes de lo que tenía previsto originalmente, siempre y cuando sigamos la ruta directa que hemos estado usando hasta ahora. No hay necesidad de disculparse por nada de esto. Somos amigas, ¿recuerdas?"

          Sin saber exactamente cómo responder, Kate simplemente asiente con la cabeza, y todos decidimos hacer un pequeño descanso para comer algo, porque realmente no hemos comido mucho desde nuestro encarcelamiento. Después de terminar mi comida, noto que Flower, que no tenía mucha hambre, había decidido aprovechar este tiempo para practicar su magia de fuego, disparando bolas de fuego a varias rocas que había al lado del camino.

          "Sí que te gusta entrenar, ¿eh?" le pregunto a Flower mientras me acerco a ella.

          "Oh, no, no estoy entrenando ahora mismo," dice ella. "¡Solo me gusta hacer explotar cosas!"

          "¿Cuántos años dijiste que tenías?"

          "¡Casi treinta!"
    choices:
      - position: 1
        text: ¿Entonces por qué siempre te comportas como una niña de diez años?
        effects:
          - set:
              current_scene: ch9_acting
      - position: 2
        text: Eres consciente de que técnicamente tu cerebro nunca se desarrolló más allá de los diez años, ¿verdad?
        effects:
