            paragraph: 56
            text: |-
              "Bien," dice Daren, en un tono despectivo. "Bueno, pues supongo que ha llegado el momento. No va a ser una pelea fácil. Ni de lejos. Vamos a estar enormemente superados en número, pelearemos en terreno desconocido, y lo peor de todo, no tendremos nuestra magia para ayudarnos. Sin embargo, todos hemos tenido que pasar por dificultades desde el comienzo de este torneo, y siempre hemos conseguido salir adelante de alguna manera. No tendría sentido celebrar una reunión de estrategia de último minuto ahora, dada la información extremadamente limitada que tenemos sobre nuestro enemigo, así que en su lugar, os diré esto: ¡Hagáis lo que hagáis, no os dejéis matar!"

              "Te preocupas demasiado, Daren," dice Hadrik, con una sonrisa. "Nadie va a morir aquí. La mayoría de nosotros ya hemos tenido nuestra buena ración de batallas en el pasado. No hemos sobrevivido tanto tiempo para que nos elimine un puñado de babuinos sobredimensionados en medio de la nada. ¡Ganaremos esta pelea como hemos ganado muchas otras, y al final del día todos tendremos otra historia emocionante que compartir con los amigos tomando algo junto al fuego!"

              "Esperemos que tengas razón," dice Daren.

              Luego se gira hacia Rose y Kate.

              "Rose," dice, "aquí es donde nos separamos, por ahora. Estarás en manos de Kate hasta que el resto volvamos del fuerte. Recuerda, si pasa algo inesperado, contáctanos a través de tu transceptor, e intentaremos ir en vuestra ayuda, aunque estemos en medio de una batalla."
          - source: scene_text_2
            paragraph: 25
            text: |-
              "¡Estaremos bien, Daren!" dice Rose, sonriendo. "No hay necesidad de preocuparse por nosotras. ¡Solo aseguraos de volver todos de una pieza!"

              "Flower, ¿estás segura de esto?" dice Kate. "El zorro solo dijo que tenías que guiarnos hasta la fortaleza. Ya has cumplido tu promesa. No hace falta que arriesgues tu vida por nosotros más de lo necesario."

              "¡Oh, jamás podría vivir conmigo misma si simplemente os abandonara aquí así!" dice Flower. "Y además, Petal y yo ya hemos luchado contra ogros antes. ¡No son tan duros! No creo que haya problemas."
