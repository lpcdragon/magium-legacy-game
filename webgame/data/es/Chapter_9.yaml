  - name: ch9_sacred
    texts:
      - source: scene_text
        paragraph: 74
        text: |-
          "Hemos venido a buscar el cáliz sagrado."

          "Ah, así que es el zorro dorado quien os ha enviado aquí, entonces," dice el chamán, mientras se frota la barbilla con la mano izquierda. "No sé qué os ofreció el zorro a cambio del cáliz, pero dudo que valiera todas vuestras vidas. Podría hacer que os aplastaran a todos con una sola palabra, pero no quiero arriesgar la vida de ninguno de los míos sin buena razón. Así que aquí va mi oferta. Iros ahora, y os concederemos un salvoconducto fuera de nuestro fuerte. No os haremos daño alguno, y todos podremos olvidar que este desafortunado incidente alguna vez ocurrió. ¿Qué decís a esto, guerreros humanos?"

          "¡Ni de broma nos vamos de aquí sin el cáliz, maldito monstruo!" dice Daren. "Si no nos lo vais a dar, tendremos que abrirnos paso a la fuerza entre vuestros secuaces hasta encontrarlo nosotros mismos."

          "Ya veo..." dice el chamán ogro. "Entonces me temo que voy a tener que pediros que soltéis vuestras armas, humanos. A partir de ahora, sois nuestros prisioneros."

          "Sí, eso no va a ser así," dice Hadrik, con una sonrisa, mientras prepara sus puños.
