      - source: scene_text
        paragraph: 39
        text: |-
          Rose sonríe.

          "¿Ves?" le dice a Illuna. "¡Puedes abrirte con nosotros si lo intentas!"

          La banshee le frunce el ceño.

          "Felicidades," dice, fríamente. "Has logrado tu objetivo. ¿Ahora por fin os iréis y me dejaréis terminar mi sándwich en paz?"

          "¡Sabes, te ves muy mona cuando frunces el ceño!" dice Rose, sonriendo con picardía de nuevo.

          "Dios mío," dice Illuna. "¿Qué tendría que hacer para que os fuerais y me dejarais tener mi paz y tranquilidad? Ya es bastante difícil aguantar a Flower mientras está despierta. ¿No puedo al menos descansar un poco mientras duerme?"

          "¡Claro que no!" dice Rose, con una sonrisa pícara en la cara. "Si nos fuéramos a dormir ahora, ¿quién se quedaría aquí para tomarte el pelo toda la noche?"

          "Por todos los dioses," dice Illuna. "Es como si las Flowers se hubieran multiplicado..."
      - source: scene_text_2
        paragraph: 17
        text: |-
          Acabamos pasando las siguientes horas hablando con Illuna, y aunque en la superficie parecía estar molesta con nosotros, una parte de mí sentía que en realidad estaba disfrutando de nuestra compañía, a su manera. Aunque mantuvo su actitud gruñona durante toda la noche, la banshee poco a poco empezó a abrirse hacia nosotros e incluso nos contó algunas historias de sus aventuras con Flower en los últimos años. Fue más entrada la noche cuando nos interrumpieron Daren y Hadrik, que vinieron a relevar nuestro turno.

          "Espera, ¿no se suponía que Flower era la única que iba a hacer este turno?" nos pregunta Hadrik, sorprendido.

          "Parece que Flower nos engañó ayer," dice Daren, con un tono grave en su voz. "Porque al parecer nunca tuvo intención de hacer ese turno ella misma."

          Illuna y Daren pasan entonces unos segundos mirándose a los ojos, como si estuvieran preparados para lanzarse el uno al cuello del otro en cualquier momento.
