            paragraph: 26
            text: |-
              Mientras nos dirigimos hacia el interior de su patio, Arraka de repente empieza a hacer un ruido muy fuerte desde dentro de su amuleto.

              "¡Ah, no, ni hablar!" dice Flower. "Si abro el amuleto ahora, vas a gritar tan fuerte como puedas y delatarás nuestra posición a los ogros, ¿verdad? ¡No vas a engañarme otra vez!"

              Arraka hace un sonido amortiguado aún más fuerte, y no parece tener intención de parar.
