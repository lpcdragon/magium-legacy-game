              "Espera un momento," digo. "Te estabas sonrojando ahora mismo. ¡Te he visto! ¿Debo entender que has cambiado de opinión sobre mí desde la última vez que hablamos en privado?"

              "Solo sobre tus capacidades de combate," dice Rose, mientras vuelve la cabeza hacia mí, para enseñarme que sus mejillas ya no están rojas. "Podría haber sido diferente si tu primer comentario sobre mí no hubiera sido sobre mis pechos grandes, pero tal como están las cosas, me temo que mi opinión original sobre ti no tiene muchas probabilidades de cambiar."

              "Bueno, vaya..." digo.

              Rose sonríe de nuevo.

              "¡No te entristezcas tanto, Barry!" dice. "Tú y yo venimos de mundos completamente diferentes. Una vez termine este torneo, es poco probable que vayas a poder encontrar el camino de vuelta aquí, y yo no planeó abandonar este continente en un futuro cercano. Incluso si hubiéramos acabado juntos, no habría podido durar mucho."

              "Supongo que tienes razón," le digo, y luego decido cambiar de tema. "Bueno, en fin, hay algo que quería preguntarte en privado desde esta mañana. ¿Qué piensas de Flower?"

              Rose parece algo sorprendida por mi pregunta.

