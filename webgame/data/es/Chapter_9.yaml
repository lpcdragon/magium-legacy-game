            paragraph: 62
            text: |-
              Mientras Flower y Kate hablaban, oí lo que sonaban como pasos en algún lugar detrás de mí. Me giro inmediatamente para ver si nos están siguiendo, pero no hay nadie ahí. ¿Fue solo mi imaginación?

              Empiezo a mirar detenidamente la zona donde escuché el sonido antes. Todo parece estar en orden, excepto por un pequeño detalle que llama mi atención. La hierba está inusualmente aplastada justo alrededor del punto donde escuché esos pasos. Es como si una fuerza estuviera empujando ese trozo de hierba en particular hacia el suelo, de la misma manera que lo haría si alguien estuviera pisándolo.

              Una idea descabellada se me ocurre, y apunto mi ballesta hacia un punto unos pies por encima de la hierba aplastada.

              "Barry, ¿a qué juegas?" me pregunta Daren. "Baja esa ballesta y vamos al fuerte."

              Le ignoro y disparo una flecha al espacio vacío frente a mí. Sin embargo, en lugar de atravesar el aire, la flecha se detiene en pleno vuelo, y un hilillo de sangre empieza a brotar de su punta. Poco después, una criatura horripilante empieza a materializarse lentamente frente a nosotros, con mi flecha clavada en su gran barriga. El monstruo mide unos ocho pies de alto, con piel gruesa y gris, y no lleva más que un taparrabos alrededor de la cintura. Dos de sus colmillos inferiores sobresalen de su boca cerrada, su frente es excesivamente estrecha, y en su cara lleva una de las expresiones más estúpidas que he visto en mi vida.
        effects:
