scenes:
  - name: ch9_intro
    texts:
      - source: scene_text
        paragraph: 2
        text: |-
          Después de terminar nuestro informe y encontrar la salida de las ruinas, nos despedimos de Leo el leopardo, cogemos nuestras mochilas y empezamos a dirigirnos hacia nuestro nuevo objetivo. Flower va al frente de nuevo, pero esta vez se la ve mucho menos segura que antes, y definitivamente hay algo de inquietud en su voz mientras nos habla.

          "Bien, tendremos que seguir este camino durante las próximas horas, hasta llegar al primer cruce," dice la chica. "Después de eso, realmente ya no hay un camino que seguir, así que vais a tener que quedaros cerca de mí si no queréis perderos. Si queréis hacer paradas para comer, solo decidme y..."

          "Flower," la interrumpe Kate. "¿Por qué accediste a venir con nosotros a la fortaleza de los ogros? ¿No es un poco peligroso incluso para ti dirigirte directamente a territorio de monstruos así?"

          "Bueno, sí, pero si no hubiera accedido a ir con vosotros, Eleya os habría matado..."

          "¿Y qué?" pregunta Kate. "Si el zorro nos hubiera matado, su sangre no habría caído sobre tus manos. ¿Por qué te desviarías tanto de tu camino para ayudar a un grupo de completos desconocidos? ¿Por qué no simplemente dejar que nos matara y seguir con tus asuntos?"

          "No lo sé... Yo simplemente... no pude..."

          Kate la mira durante unos segundos, y luego sonríe levemente.

          "Ya veo..." dice. "Flower, creo que puede que hayamos empezado con mal pie esta mañana. Permíteme rectificar eso."
      - source: scene_text_2
        paragraph: 2
        text: |-
          Entonces le tiende la mano y dice:

          "Me llamo Kate. ¡Encantada de conocerte!"

          Flower parece algo tomada por sorpresa por el repentino cambio de actitud de Kate hacia ella, y le estrecha la mano, con indecisión.

          "¡Y yo me llamo Rose!" dice Rose, mientras le ofrece la mano también. "¡Me alegro de tenerte con nosotros, Flower!"

          "Yo soy Hadrik," dice Hadrik. "¡Pero puedes llamarme simplemente 'el enano'. ¡Cualquiera de los dos vale!"

          Flower retrocede unos pasos y empieza a entrar en pánico.

          "¡Lo siento!" dice. "Nunca me habían aceptado en un grupo antes. ¡No tengo ni idea de qué se supone que hay que decir en estas situaciones!"

          "No pasa nada, Flower," dice Kate. "No necesitas decir nada."

          "Oh," dice Flower, mientras empieza a calmarse. "Bueno, ¡qué alivio!"
    effects:
      - set:
          successful_checks:
            - 'Punto de control alcanzado: Partida guardada.'
        condition: checkpoint_rich = 1
    choices:
      - position: 1
        text: Presentarme a Flower yo también
        effects:
          - set:
              current_scene: ch9_introduce
              checkpoint_rich: 0
      - position: 2
        text: Mantener mi silencio por ahora
        effects:
          - set:
              current_scene: ch9_silence
              checkpoint_rich: 0
  - name: ch9_introduce
    texts:
      - source: scene_text
        paragraph: 4
        text: |-
          "Yo soy Barry," le digo. "¡Encantado de conocerte también!"

          "¡Oh, gracias!" dice Flower. "¡Pero ya me sabía tu nombre! ¡Es bastante fácil de recordar!"

          "¡Ya lo creo!" dice Hadrik, con una sonrisa. "¡Probablemente también es la razón por la que no puedes tirar una piedra sin darle a al menos tres Barrys en el Continente Occidental!"

          Luego empieza a reírse a carcajadas, como siempre hace.

          "¿Es Barry un nombre común en los otros continentes?" me pregunta Flower.

          "Sí, he conocido al menos a dos docenas de Barrys en mi vida, y no socializo mucho," le digo.

          "Bueno, para ser justos," dice Hadrik, "mi nombre también es bastante común en el Continente Norte. Especialmente para gigantes como yo."

          "¿¡Eres un gigante?!" pregunta Flower, asombrada. "Vaya... supongo que realmente debiste ser la oveja negra de tu familia, ¿no?"

          Hadrik se ríe.

          "No te equivocas del todo, pequeña, pero la opinión que mi familia tenía de mí no tenía nada que ver con mi tamaño, me temo. La única razón por la que soy tan pequeño ahora mismo es porque he usado magia para convertirme en un enano. ¡Te aseguro que mi altura está muy por encima de la media entre los míos!"
      - source: scene_text_2
        paragraph: 4
        text: |-
          "Siempre quise preguntar," dice Rose. "¿Por qué elegiste usar cambio de forma para convertirte en un enano y no en un humano? ¿No habría sido más fácil pelear si hubieras mantenido las proporciones de tu cuerpo al menos algo similares a tu forma original?"

          "¿Recuerdas cuando dije que mis amigos me llaman 'el enano'?" pregunta Hadrik. "Bueno, eso es porque paso la mayor parte de mi tiempo bebiendo con enanos del Continente Norte, y porque suelo usar cambio de forma para convertirme en uno. Dado que he adoptado su acento y sus modales en los muchos años que he pasado en sus tabernas, pensé que levantaría menos sospechas si venía disfrazado de enano, en lugar de humano. Además, ¡siempre me ha gustado pelear con desventaja, así que eso también es un bonus!"

          Se ríe de nuevo.

          Flower se acerca ahora a Daren, y empieza a dirigirse a él.

          "Lo siento, todavía no me sé tu nombre..." le dice.

          "Daren," dice él. "Me llamo Daren."

          "No te caigo muy bien, ¿verdad, Daren?" le pregunta la chica, con un tono preocupado.

          "Me caes bien," dice él. "Es la banshee la que no me convence mucho."

          "¡Oh, relájate, Daren!" dice Hadrik. "¿Qué crees que va a hacer? ¿Traicionarnos a todos y unirse a los ogros cuando lleguemos a su fortaleza?"
      - source: scene_3
        paragraph: 3
        text: |-
          "En realidad, eso es exactamente lo que me preocupa," dice Daren.

          "Creo que empiezo a entender por qué Petal no quiere hablar con vosotros..." dice Flower.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch9_awakening
  - name: ch9_silence
    texts:
      - source: scene_text
        paragraph: 3
        text: |-
          En lugar de subirme al tren de bienvenida como todos los demás, decido mantener mi silencio por ahora y ver cómo se desarrollan las cosas. Daren, que tampoco parece tener prisa por acercarse a Flower, me agarra del hombro y me susurra al oído:

          "No me fío de esa banshee, Barry," dice. "La chica parece simpática, pero esa no es razón suficiente para asumir lo mismo del espíritu maligno que alberga dentro de su cuerpo. Intenta mantenerte en guardia cuando estés cerca de ella."

          Flower se acerca ahora a nosotros, y empieza a dirigirse a Daren.

          "Lo siento, todavía no me sé tu nombre..." le dice.

          "Daren," dice él. "Me llamo Daren."

          "No te caigo muy bien, ¿verdad, Daren?" le pregunta la chica, con un tono preocupado.

          "Me caes bien," dice él. "Es la banshee la que no me convence mucho."

          "¡Oh, relájate, Daren!" dice Hadrik. "¿Qué crees que va a hacer? ¿Traicionarnos a todos y unirse a los ogros cuando lleguemos a su fortaleza?"

          "En realidad, eso es exactamente lo que me preocupa," dice Daren.

          "Creo que empiezo a entender por qué Petal no quiere hablar con vosotros..." dice Flower.

          "Espera, ¿no vas a preguntarme mi nombre?" le pregunto.

          "¡Oh, no, ya me sé tu nombre, Barry! ¡El tuyo es bastante fácil de recordar!"
