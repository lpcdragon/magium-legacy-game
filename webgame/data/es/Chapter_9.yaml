              "Así es," dice Hadrik. "¡Estoy seguro de que Kate será más que capaz de lidiar con unos cuantos ogros insignificantes!"

              "Rose, ¿sigues teniendo ese transceptor que te di?" dice Daren.

              "Sí, ¿lo quieres de vuelta?" pregunta Rose.

