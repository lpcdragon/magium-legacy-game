          "Si yo fuera tú, tendría cuidado con tales bromas, humano," dice el chamán, aún sonriendo. "Da la casualidad de que nos vendrían bien algunos esclavos para el trabajo manual en nuestro fuerte, así que vuestro grupo nos serviría de maravilla para eso."

          "¡Ni de broma vamos a trabajar para ti, maldito monstruo!" dice Daren. "Vamos a barrer a tus secuaces más rápido de lo que puedas dar la orden de atacar."

          "Ya veo..." dice el chamán ogro. "Entonces me temo que voy a tener que pediros que soltéis vuestras armas, humanos. A partir de ahora, sois nuestros prisioneros."

