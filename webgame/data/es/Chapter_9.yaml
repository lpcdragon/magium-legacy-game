    texts:
      - source: scene_text
        paragraph: 73
        text: |-
          "No tenemos por qué darte explicaciones, ¡monstruo!"

          "Si yo fuera tú, tendría más cuidado con mis palabras, humano," dice el chamán, con su sonrisa desaparecida del rostro. "No estás exactamente en posición de rechazar nuestras exigencias, en estos momentos."

          "¡Ni de broma, maldito monstruo!" dice Daren. "Vamos a barrer a tus secuaces más rápido de lo que puedas dar la orden de atacar."

          "Ya veo..." dice el chamán ogro. "Entonces me temo que voy a tener que pediros que soltéis vuestras armas, humanos. A partir de ahora, sois nuestros prisioneros."

          "Sí, eso no va a ser así," dice Hadrik, con una sonrisa, mientras prepara sus puños.
