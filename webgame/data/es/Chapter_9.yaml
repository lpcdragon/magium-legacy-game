    texts:
      - source: scene_text
        paragraph: 40
        text: |-
          "¡Eh, vamos, calmémonos todos! Estamos todos en el mismo equipo aquí, ¿no?"

          "No sé, ¿lo estamos?" dice Daren. "Todo salió bien porque tú y Rose descubristeis lo que había pasado y fuisteis a vigilarla de cerca, pero ¿quién nos dice que no nos habría degollado mientras dormíamos si la hubierais dejado sin supervisión?"

          "No habría necesidad de usar tácticas tan ruines para librarme de un puñado de magos que ni siquiera pueden usar magia," dice Illuna. "Tú y tus amigos no suponéis ninguna amenaza para mí en vuestra condición actual. Si tienes algún problema conmigo, sanador, estaré más que encantada de demostrarte que no estoy faroleando."

          "Acepto tu oferta, banshee," dice Daren, mientras desenvaina su espada. "A ver si peleas tan bien como hablas."

          "¡Daren, espera!" grito, mientras me coloco entre los dos. "¿Piensas matar a la chica junto con la banshee?"

          "El hecho de que la espada no pueda fijar el aura de la banshee por sí sola no significa que yo no pueda hacerlo manualmente," dice Daren. "Todavía puedo matar a la banshee sin hacerle daño a la chica si me concentro lo suficiente."

          "¿Te has vuelto loco?" le pregunto. "¿Cómo esperas apuntar correctamente al aura de la banshee si la espada no puede hacerlo por sí sola? ¡Es casi seguro que fallarás!"

          "Si fallo, aun así sería un destino mejor para la chica que vivir toda su vida encadenada a un espíritu maligno."
