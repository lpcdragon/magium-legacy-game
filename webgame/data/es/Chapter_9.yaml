        texts:
          - source: scene_text
            paragraph: 37
            text: |-
              "Quería preguntar..." dice Rose. "¿De dónde sacaste ese sándwich? Nunca te vi llevar una mochila contigo."

              "Lo hice con magia," dice Illuna, mientras agita la mano y conjura mágicamente dos sándwiches más que caen directamente en nuestros regazos. "Tomad, a disfrutar."

              Echo un vistazo al sándwich que conjuró de la nada, y luego lo agarro con ambas manos, pero dudo un poco en darle un mordisco. No tengo ni idea de con qué ingredientes lo hizo. ¿Podría estar envenenado?

              "¡Oh, por el amor de dios!" dice Illuna, cuando me ve mirar su sándwich con suspicacia. "¿No estarás pensando en serio que el sándwich está envenenado? ¿Quién demonios sigue usando veneno hoy en día? Sin contar las cientos de protecciones mágicas fáciles de aprender que te pueden proporcionar inmunidad contra todos los venenos, se pueden comprar elixires anti-veneno por diez cobres la pieza. ¿Seguro que al menos te tomaste UNO de esos antes de venir a este torneo? Un solo elixir debería proporcionarte fácilmente inmunidad contra todos los venenos conocidos durante el resto de este torneo. ¡Cómete el maldito sándwich de una vez!"

              Rose se ríe.

              "¡Ahora entiendo por qué Flower me dijo que siempre estabas gruñona!" dice, sonriendo con picardía.
          - source: scene_text_2
            paragraph: 15
            text: |-
              "Espectacular," dice Illuna. "¿Hay algo más que la chica haya compartido sobre mí mientras dormía?"

              "Bueno, ¡desde luego no me dijo que pudieras conjurar comida de la nada!" dice Rose. "Eso normalmente es una habilidad que solo los grandes sacerdotes de cada ciudad pueden dominar. ¡Debes ser increíblemente talentosa!"

              "En realidad, me avergüenza admitir que fue Flower quien me enseñó esta habilidad."

              "¿Flower?"

              "Sí, la chica tiene el talento natural de ser capaz de comprender al instante algunos hechizos ridículamente complejos sin esfuerzo alguno. Solo vio al zorro espíritu lanzar este hechizo una vez, hace veinte años, y logró imitarlo al segundo siguiente. Sin embargo, es completamente inútil cuando se trata de aprender hechizos que requieren la menor cantidad de estudio previo. Llevo años intentando enseñarle curación, pero es como intentar enseñar a un ogro a hablar lessathi."
        choices:
          - position: 1
