  - name: ch9_final_march
    routes:
      - condition: ch9_take_rose = 0 AND hearing < 2
        texts:
          - source: scene_text
            paragraph: 58
            text: |-
              Con estas últimas palabras, todos nos despedimos de Kate y Rose, y luego empezamos nuestra marcha final hacia la fortaleza.

              Nos llevó unos diez minutos llegar al borde del bosque. Toda la zona alrededor del fuerte había sido completamente limpiada de árboles y toda otra vegetación, para proporcionar línea de visión directa para las patrullas de ogros. La fortaleza en sí estaba situada en la cima de una colina, y tenía una superficie de quizás mil pies cuadrados. Sus murallas eran de piedra, y tenían una altura de unos treinta pies, mientras que la única entrada visible al fuerte era un portón de madera muy grande que habían dejado abierto de par en par, dándonos una vista clara del patio interior de la fortaleza.

              Parecía haber un edificio principal en el centro, que estaba conectado a las cuatro murallas que formaban un cuadrado a su alrededor. Al acercarnos más al fuerte, pronto nos dimos cuenta de que no solo las murallas estaban desiertas, sino todo el patio también.

              "Desde luego no están intentando ocultar el hecho de que esto es una trampa, ¿verdad?" pregunta Hadrik, mientras cruzamos sus puertas abiertas.

              "Mantened la guardia alta," dice Daren, mientras mira a su alrededor. "Podrían atacarnos desde cualquier dirección."
