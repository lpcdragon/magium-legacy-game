              current_scene: ch9_interrupt
  - name: ch9_submission
    texts:
      - source: scene_text
        paragraph: 79
        text: |-
          "Si no vais a cooperar, entonces no nos queda más remedio que someteros por la fuerza," dice el chamán.

          "No será necesario," oigo la voz de Flower desde mi izquierda.

          Al mirarla, veo que sus ojos son de un azul brillante de nuevo, y tiene la expresión fría de Illuna en su cara. Sin embargo, a diferencia de antes, esta vez el aura de la chica es tan débil que palidece en comparación con la de la banshee. Apenas puedo sentir fuerza vital emanando de ella, como si estuviera en algún tipo de estado latente.

          Inmediatamente después de que Illuna deja de hablar, una jaula dorada aparece de la nada y nos rodea a todos, dejando solo a la banshee y a los ogros fuera de ella.

          "Creo que todos recordáis el hechizo que usó el zorro para atraparos en las ruinas," nos dice Illuna. "Ni se os ocurra intentar salir de ahí por la fuerza bruta. Esa jaula dorada es prácticamente indestructible."

          No miente. Incluso sin ser mago, puedo notar que es un hechizo increíblemente poderoso. No hay forma de que salgamos de aquí sin magia.

          "¿Qué significa esto, banshee?" dice Daren, furioso. "¿Qué le has hecho a la chica?"

          "He puesto a Flower en estasis," dice Illuna. "Ya he tenido suficiente de su idiotez por hoy. De hecho, diría que he tenido suficiente para toda una vida."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch9_traitorous
