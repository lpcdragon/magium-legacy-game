  - name: ch9_sloppy
    texts:
      - source: scene_text
        paragraph: 51
        text: |-
          "¿Quizás podríamos intentar comprárselo?" sugiere Rose.

          "No funcionaría," dice Kate. "Los ogros robaron ese cáliz sabiendo perfectamente de lo que era capaz. No van a entregarlo a ningún precio."

          "Bueno, pues entonces supongo que solo queda una opción," dice Hadrik, con una sonrisa. "¡Entramos directamente por la puerta principal!"

          "Me temo que no nos queda otra alternativa," dice Daren.

          "Si nos encontramos con elementalistas, ¡dejádmelos a mí!" dice Hadrik. "Como me centro principalmente en la magia de cambio de forma, he tenido que desarrollar ciertas técnicas que puedo usar en lugar de hechizos defensivos mientras estoy transformado. Una de estas técnicas me permite endurecer el aura mágica alrededor de mi cuerpo, lo cual no solo es genial para la defensa, ¡sino también para el ataque! Si la uso para endurecer el aura mágica alrededor de mis puños, puedo desviar bolas de fuego con mis golpes fácilmente, ¡y enviarlas de vuelta a sus lanzadores!"

          "Mi espada también es buena contra los elementalistas," dice Daren. "Puedo usarla para absorber cualquier elemento, y también tengo una técnica de espada que puede cortar temporalmente la conexión de un mago con el plano mágico, impidiéndole lanzar hechizos durante treinta minutos."

          "¡Ja!" dice Hadrik. "¿Quién dice que los magos necesitan magia para pelear? ¡Conquistaremos esta fortaleza suya en un abrir y cerrar de ojos!"
      - source: scene_text_2
        paragraph: 23
        text: |-
          "Si todos estamos de acuerdo en atacar el fuerte abiertamente, entonces supongo que no hay mucho más que discutir," dice Daren. "Hay demasiadas cosas que no sabemos sobre la distribución del edificio y el despliegue de sus tropas como para poder anticipar qué pasará. Tendremos que confiar en nuestros instintos una vez comience la batalla. Si nadie más tiene algo que añadir, sugiero que nos pongamos en marcha. Todavía tenemos mucho terreno que cubrir hasta llegar a nuestro objetivo."

          Fueron unas horas más tarde cuando nos acercamos lo suficiente a la fortaleza como para poder hacer un poco de reconocimiento. Flower y Hadrik fueron a explorar, mientras el resto de nosotros buscábamos un buen lugar para enterrar nuestras mochilas, ya que sería demasiado difícil pelear con ellas a la espalda y no tendríamos dónde dejarlas mientras estemos en el fuerte. Antes de enterrar mi mochila, me aseguré de sacar mi ballesta, ya que seguro la necesitaré en la batalla que se avecina.

          Después de unos treinta minutos, Flower y Hadrik regresaron con noticias bastante inquietantes.

          "Está muerto de silencio ahí fuera," nos dice Hadrik. "Y no me refiero solo a la falta de patrullas, estoy diciendo que ni siquiera había ogros apostados en las murallas. Aquí algo no cuadra. Los ogros serán estúpidos, pero no pueden ser tan descuidados."
