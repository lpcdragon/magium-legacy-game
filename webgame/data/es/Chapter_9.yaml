  - name: ch9_traitorous
    texts:
      - source: scene_text
        paragraph: 81
        text: |-
          Luego se gira hacia el chamán ogro.

          "Gran chamán," dice, "mi nombre es Illuna, y soy una banshee. He venido a ofreceros mis servicios a cambio de acceso a los libros raros y únicos de la biblioteca de vuestra fortaleza. Como muestra de mi buena voluntad, os ofrezco a estos intrusos humanos como tributo."

          "Maldita trai--" empieza a decir Daren, pero es interrumpido por el capitán de los ogros.

          "¡Palabras atrevidas para prisionera insignificante!" grita el capitán en voz alta, en la lengua común, hablando con un acento y gramática muy deficientes. "¿Qué hacer creer a banshee que ogro querer sus servicios?"

          "No seas tan precipitado, capitán," dice el chamán. "Esta no es una banshee cualquiera. Es Illuna, la de la masacre de los bosques sagrados. Se dice que mató a cientos de guardianes del bosque en un solo día, sin mostrar la más mínima piedad. Sin embargo, también se dice que se ablandó desde que se fusionó con esta niña que vemos ante nosotros."

          "La chica con la que comparto cuerpo ha estado balanceándose entre ser un activo y una carga durante demasiado tiempo," dice Illuna. "Su talento mágico natural la convertía en una aliada particularmente poderosa, pero sus caprichos superaban su juicio más a menudo de lo deseable, y repetidamente nos ponía en peligro mortal por ello. Su decisión de ayudar a estos magos a infiltrarse en vuestra fortaleza fue la gota que colmó el vaso, y me hizo darme cuenta de que necesitaba librarme de ella rápido, antes de que acabara siendo mi perdición."
      - source: scene_text_2
        paragraph: 30
        text: |-
          "¿Y cómo planeas hacerlo?" pregunta el chamán.

          "He oído hablar de varios rituales chamánicos que podrían ayudarme con mi problema de fusión de almas," dice la banshee. "Solo necesito algo de tiempo para estudiar en vuestra biblioteca, y estoy segura de que encontraré una manera de eliminar a la chica para siempre, sin dañarme a mí misma en el proceso."

          "¿Y a cambio de este favor, nos ofreces tu lealtad?" pregunta el chamán.

          "Precisamente," dice Illuna.

          "Entonces necesito que hagas una cosa más para demostrar que eres sincera," dice el chamán, con una sonrisa perversa. "Tendrás que ejecutar a tus amigos de esa jaula."

          "Desafortunadamente, no puedo hacer eso," dice la banshee. "Matarlos ahora resultaría en la muerte de todos nosotros."

          "¿Cómo es eso?" pregunta el chamán.

          "Esos collares que llevan han sido puestos alrededor de sus cuellos por el gran zorro dorado, que es también quien los envió aquí para robar vuestro cáliz sagrado," dice Illuna. "Están hechos de tal manera que si los humanos mueren, los collares explotan, y esas explosiones serían lo suficientemente potentes como para arrasar fácilmente vuestro fuerte y matar a todos vuestros guerreros. El zorro tomó esta medida extrema para asegurarse de que todos quedarais eliminados aunque los humanos fallaran su misión."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch9_mechanisms
  - name: ch9_mechanisms
    texts:
      - source: scene_text
        paragraph: 82
        text: |-
          "Hmm..." dice el chamán, mientras se acaricia la barbilla. "Reconozco estos collares. Fueron fabricados por los lessathi de antaño. Sé con certeza que estos dispositivos tenían mecanismos de autodestrucción muy peligrosos integrados en caso de que los prisioneros que los llevaran se portaran mal."

          Hace una pausa.

          "¿Qué propones que hagamos con ellos, entonces?" le pregunta a la banshee.

          "Esperamos," dice Illuna. "El zorro les dio cinco días para completar su misión. Si no regresan en cinco días, asumirá que abandonaron su misión, y morirán electrocutados. En ese caso, el mecanismo de autodestrucción de los collares no se activará."

          "Has dicho suficiente," dice el chamán. "Está claro que no sientes apego alguno por tus antiguos aliados. Eres bienvenida a usar nuestra biblioteca tanto como quieras, Illuna de la masacre de los bosques sagrados. Discutiremos tu pago después de que te libres de la chica. En cuanto a estos humanos, tengo un hechizo de teletransportación que puede transportarlos fácilmente a su celda, siempre que no se muevan de su posición durante un rato. Si confirmas que aún puedes mantener esa jaula, empezaré a lanzarlo."

          "Mi jaula durará al menos unos minutos más," dice Illuna. "Sin embargo, tengo una advertencia más que darte. Ese enano posee la fuerza de un gigante y podría romper fácilmente las paredes de vuestra prisión sin arma alguna. Sugiero que los transportéis a una de las celdas que tienen un hechizo de parálisis. He visitado esta fortaleza antes, cuando era propiedad de goblins, y recuerdo que había al menos una celda así en los niveles inferiores del edificio principal."
      - source: scene_text_2
        paragraph: 31
        text: |-
          "Recuerdas bien, banshee," dice el chamán. "Muy bien, entonces. Los enviaré a una de las celdas de parálisis."

          Entonces empieza a lanzar su hechizo de teletransportación, y nuestros cuerpos empiezan a vibrar lentamente, mientras nos cubre una luz blanca brillante.

          "¡Maldita traidora!" dice Hadrik, mientras intenta doblar los barrotes de la jaula con sus propias manos. "¡No puedo creer que realmente les hayas dicho lo de mi fuerza de gigante!"

          "Illuna, ¿cómo has podido hacer esto?" le pregunta Rose a la banshee, mientras una lágrima cae de su ojo. "Yo confié en ti. Flower confió en ti. ¿Cómo has podido traicionarnos a todos así?"

          "Confías demasiado para tu propio bien, Rose," dice Illuna, con una mirada gélida en los ojos. "Ya te advertí que no me consideraras tu aliada. Deberías haber escuchado a tu sanador cuando tuviste la oportunidad. Ahora pagaréis el precio de vuestra insensatez."

          La fría mirada de la banshee y las lágrimas de Rose son lo último que veo antes de que todo se desvanezca a negro y todos seamos teletransportados a lo que bien podría convertirse en nuestro destino final.
    choices:
