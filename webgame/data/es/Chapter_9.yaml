  - name: ch9_throw
    texts:
      - source: scene_text
        paragraph: 78
        text: |-
          Hago lo que dice el chamán, y lanzo mi ballesta a sus pies. Luego saco mi daga y la tiro también. Daren duda unos segundos, pero finalmente sigue mi ejemplo y tira su espada y su escudo. Hadrik y Flower no llevaban armas, así que simplemente se quedaron ahí, mirando al ogro.

          "Una decisión sensata," dice el chamán, mientras hace un gesto a sus dos asociados.

          Los dos ogros bajan a Kate y Rose de sus espaldas y luego las tiran al suelo junto a nosotros.

          "¡Rose!" grita Daren, mientras la agarra en sus brazos y empieza a sacudirla. "Rose, ¿puedes oírme?"

          Mientras Daren intenta despertar a Rose, yo voy a comprobar cómo está Kate. Afortunadamente, no parece haber sufrido ninguna herida grave, y respira con normalidad.

          "¿Daren?..." dice Rose, mientras empieza a despertar. "¿Qué ha pasado? ¿Cómo he llegado aquí?"

          "Rose, fuisteis atacadas por ogros, y luego os trajeron aquí," dice Daren. "Ahora estamos en el fuerte de los ogros, y acabamos de vernos obligados a rendirnos."

          Rose se queda sin aliento.

          "Oh dios..." dice. "¿Es... os han capturado por nuestra culpa? Daren, lo siento mucho..."

          "No fue culpa vuestra," dice Daren. "No deberíamos haberos dejado atrás. Deberíamos haberos llevado con nosotros desde el principio."
    effects:
      - set:
          ac_ch9_decision: 1
        achievement:
          id: ac_ch9_decision
          title: Una decisión acertada
