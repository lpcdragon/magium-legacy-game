      - condition: ch9_inventory = 1
        texts:
          - source: scene_text
            paragraph: 31
            text: |-
              "Oh, eh... Acabo de recordar que necesitaba hacer un rápido inventario del contenido de mi mochila antes de irme a dormir. Ya no puedo ver lo que tengo dentro, desde que Daren la encantó, y solo quería asegurarme de que aún recuerdo todos mis objetos correctamente."

              "¿De verdad?" me pregunta Rose, sonriendo.

              "Sí, vete tú adelante. Voy a estar aquí fuera un rato."

              "Vale, entonces. ¡Buenas noches, Barry!"

              "¡Que descanses!" le digo, mientras ella entra en su tienda.

              Una vez me aseguro de que todos se fueron a dormir, empiezo a dirigirme hacia donde Flower fue a vigilar el valle. Es hora de ver si mi intuición tenía razón, y Flower realmente se fue a dormir antes. A medida que me acerco a ella, me doy cuenta de que no me equivocaba, porque los ojos de la chica brillan con una luz azul intensa, y el aura sobrenatural a su alrededor es definitivamente la dominante en este momento.

              "La chica está durmiendo," me dice Petal, con voz fría, al verme subir la colina hacia ella. "Puedo despertarla si necesitas decirle algo importante."

              La banshee está sentada en la hierba, con las piernas cruzadas, con un sándwich en las manos. Parece que estaba a punto de empezar a comer, antes de verme subir la colina.
          - source: scene_text_2
            paragraph: 12
            text: |-
              "En realidad, eres tú con quien quería hablar, no Flower," le digo.

              "¿De verdad?" dice la banshee, mirándome con suspicacia. "Bueno, entonces, por favor, siéntate."

              Luego le da un mordisco a su sándwich, mientras yo me siento en la hierba junto a ella.

              "Bueno, eh," empiezo a decir, "hace un tiempo realmente estupendo estos días, ¿no crees?"

              La banshee frunce el ceño al oír mi pregunta, y gira la cabeza hacia mí.

              "Ve al grano, humano," dice. "Nunca me han gustado mucho las formas indirectas en que a vosotros os gusta empezar vuestras conversaciones. Estás aquí porque no te fías de dejarme vigilar vuestro campamento sola, ¿verdad?"
