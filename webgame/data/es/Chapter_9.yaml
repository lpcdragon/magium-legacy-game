  - name: ch9_awakening
    routes:
      - condition: ch8_old = 0
        texts:
          - source: scene_text
            paragraph: 5
            text: |-
              "Si puedo preguntar," dice Kate, "¿cómo exactamente llegaron tú y Petal a compartir el mismo cuerpo? Nunca he oído que algo así haya pasado antes."

              "Oh, Petal me dijo que nuestras almas se fusionaron durante su despertar, hace veinte años," dice Flower. "Realmente no sé los detalles de la fusión de almas. Tendrás que preguntarle a Petal sobre eso."

              "Espera, ¿hace veinte años?" pregunta Hadrik. "¿Cuántos años tienes, exactamente?"

              "¡Cumpliré treinta el mes que viene!" dice la chica, sonriendo.

              Al ver las caras que ponemos, decide darnos un poco más de contexto.

              "Un cuerpo deja de envejecer después de ser poseído por una banshee," dice. "Estaba a punto de cumplir diez cuando Petal despertó."

              "Siento mucho lo que pasó..." le dice Rose. "Debió ser una experiencia terrible para una niña..."

              "¡No, lo habéis entendido todo mal!" dice Flower. "¡El día que Petal despertó fue el día más feliz de mi vida! ¡Por fin tenía a alguien aquí conmigo, con quien compartir mi mundo! ¡No os podéis imaginar la alegría que sentí cuando me di cuenta de que ya no tenía que vivir mi vida sola dentro de mi propia mente!"
        choices:
          - position: 1
            text: ¿Vivir dentro de tu propia mente? ¿Quieres decir que te quedas abstraída a menudo?
            effects:
              - set:
                  current_scene: ch9_space_out
          - position: 2
            text: ¡Vaya con la imaginación activa!
            effects:
              - set:
                  current_scene: ch9_imagination
          - position: 3
            text: Conozco a un buen médico en el Continente Occidental, si te interesa.
            effects:
              - set:
                  current_scene: ch9_doctor
