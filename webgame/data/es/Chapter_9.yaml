        paragraph: 26
        text: |-
          "La encuentro un poco molesta, para serte sincero."

          "¿Por qué?"

          "Bueno, técnicamente es mayor que yo, pero siempre se comporta como una niña pequeña. Es un poco difícil tomar en serio a alguien así."

          "Recuerda, Barry, a ella nunca le dieron la oportunidad de crecer en el verdadero sentido de la palabra. Entiendo por qué puede resultarte molesta por eso, pero aunque a veces pueda parecer que está bromeando, realmente creo que se está tomando esta situación mucho más en serio de lo que aparenta. ¿Podrías quizás darle otra oportunidad?"

          "Supongo que podría intentarlo..."

          "¡Estupendo!" dice Rose, sonriendo. "Oh, y no te preocupes, no le voy a contar a Flower lo que has dicho de ella. ¡Será nuestro pequeño secreto!"

          "Dejando a la chica aparte, sin embargo, la banshee que habita su cuerpo es en realidad la que más me preocupa. Las palabras que Daren dijo esta mañana siguen resonando en mi cabeza."

          "Bueno, yo por mi parte confío en Petal."

          "Pero ni siquiera has hablado con ella..."
      - source: scene_text_2
        paragraph: 11
        text: |-
          "No, ¡pero Flower sí! Llevan viviendo juntas veinte años. Si Petal sigue teniendo la confianza de Flower después de tanto tiempo, eso me basta a mí."

          "Quizás tengas razón. No creo que nadie pueda ocultar su verdadera naturaleza durante tanto tiempo. Si la banshee estuviera tramando algo, se habría delatado en algún momento durante estas dos últimas décadas. O sea, nadie puede actuar tan bien, ¿no?"
