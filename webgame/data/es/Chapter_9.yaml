    texts:
      - source: scene_text
        paragraph: 19
        text: |-
          "Bueno, habría sido un poco difícil no darme cuenta, con los gemidos y los temblores y todo eso."

          Al terminar mi frase, Rose me da un puñetazo en el brazo izquierdo, pero lo hace muy suavemente. Apenas habría sentido que me tocaba si no hubiera estado prestando atención.

          "Empiezo a entender por qué Kate te pega tan a menudo," dice Rose, sonriendo con picardía. "Pero gracias por preocuparte. Como habrás podido notar, siempre le he tenido miedo a los monstruos gigantes. Estoy acostumbrada a los pequeños y medianos, porque me he cruzado con varios goblins y ogros durante mis viajes, pero el solo pensamiento de encontrarme con un dragón en persona siempre me daba escalofríos. Nunca imaginé que me encontraría cara a cara con un dragón y una hidra en menos de un día. Sabía que existían, pero esperaba no cruzarme nunca con uno de ellos en toda mi vida. No puedo imaginar cómo es para gente como Daren y Hadrik que luchan contra monstruos como estos de forma mensual."

          Hace una pausa.

          "Ahora que lo pienso, todo esto debe ser bastante nuevo para ti también, ¿no? Por lo que me contaste, ni siquiera habías luchado contra un goblin antes de venir a este torneo. ¿Cómo siempre consigues mantener la calma, a pesar de que te han puesto el mundo entero patas arriba?"
