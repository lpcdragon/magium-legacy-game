        texts:
          - source: scene_text
            paragraph: 63
            text: |-
              El ogro grita con fuerza, mientras arranca la flecha con una mano y prepara su garrote de cinco pies con la otra. Otro ogro está apareciendo también, saliendo de la invisibilidad, listo para luchar junto a su camarada herido. Sin embargo, los dos no tienen mucha oportunidad de demostrar su fuerza, porque en un abrir y cerrar de ojos, Daren sacó su espada y decapitó a uno de ellos, mientras Hadrik dio un gran salto y le aplastó la cabeza al otro ogro con su bota, dejando solo una masa sanguinolenta donde antes estaba su cara.

              "¡Buen tiro, Barry!" dice Daren, mientras los cadáveres de los dos ogros caen al suelo con un sonoro golpe. "Ni siquiera habría imaginado que los ogros tuvieran acceso a hechizos tan avanzados como la invisibilidad. Ese chamán suyo no es de tomarse a la ligera."

              "No creo que sea seguro dejar a Rose y Kate atrás, ahora que sabemos que los ogros pueden usar hechizos como estos," digo.

              "Tienes razón," dice Daren. "Rose, Kate, venís con nosotros al fuerte. Es demasiado peligroso dejaros aquí. No acepto un no por respuesta."

              Una vez nos aseguramos de que no hay otros exploradores ogros invisibles en la zona, cogemos nuestras armas y empezamos nuestra marcha final hacia la fortaleza.
