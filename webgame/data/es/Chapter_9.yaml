        paragraph: 44
        text: |-
          "Relájate, solo quería asegurarme de que no perdemos a nuestra única guía. No fue nada personal."

          "Ya veo," dice la banshee. "En ese caso no puedo reprocharte el ser demasiado cauteloso. Sin embargo, te daré una advertencia. No cometas el error de considerarme tu aliada. Nuestra asociación es solo temporal, y terminará en el momento en que acabemos nuestro pequeño viaje juntos. Serías un tonto si pensaras lo contrario."

          Luego nos da la espalda y entra lentamente en su tienda.

          "¡Buenas noches, Illuna!" dice Rose, sacudiendo la mano, pero la banshee no da señal de haberla oído, y cierra la tienda detrás de ella.

          "Bueno, ¡yo diría que ha salido bastante bien!" dice Rose, sonriendo, mientras nos dirigimos a nuestras tiendas.

          "¿Tú crees?" le pregunto.

          "¡Claro que sí!" dice. "¿No viste lo contenta que estaba cuando saltaste en su defensa antes? Si consigues ver más allá de su fachada gruñona, ¡puedes ver que realmente no es tan diferente del resto de nosotros!"

          "Creo que estoy empezando a ver un poco de Flower en ti..."

          "¡Hay un poco de Flower en todos nosotros, Barry!" dice Rose, mientras me señala. "¡El tuyo simplemente resulta que está enterrado bajo varias capas de cinismo y comentarios sarcásticos!"
