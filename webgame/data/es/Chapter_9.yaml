  - name: ch9_take_rose
    routes:
      - condition: ch9_take_rose = 1
        texts:
          - source: scene_text
            paragraph: 50
            text: |-
              "Creo que sería más seguro llevar a Rose con nosotros a la fortaleza," digo. "Nos han dicho que los ogros tienen magos en sus filas. Si aunque sea uno de esos magos resulta estar en la patrulla de exploración, Kate no tendrá posibilidad de vencerlo."

              "El chaval tiene razón," dice Hadrik. "Es demasiado arriesgado dejar a Rose atrás. Yo digo que la llevemos con nosotros. ¡Si conseguimos protegerla en las ruinas, podemos hacerlo aquí también!"

              Daren se gira hacia Rose.

              "Rose, ¿te parece bien esto?" le pregunta.

              "¡Claro!" dice ella. "Ya hemos pasado por cosas mucho peores juntos. Haré todo lo posible por no estorbar a nadie una vez entremos en el fuerte."

              "Antes de hacer planes concretos," dice Hadrik, "¿podríamos repasar el informe del leopardo una vez más? Su acento en la lengua común era horrible y no estoy seguro de haberlo entendido todo."
          - source: scene_text_2
            paragraph: 22
            text: |-
              "Bueno, lo primero de todo," dice Kate, "el cáliz que debemos recuperar se usaba para dar al agua propiedades curativas únicas que podían curar algunas enfermedades incurables mediante el uso de hechizos. El artefacto en sí parece un cáliz dorado normal, excepto que tiene marcas triangulares en los lados. Respecto a las defensas de la fortaleza, el leopardo dijo que los ogros se dividen principalmente entre guerreros regulares que usan grandes garrotes para pelear, y magos que tienen una variedad de especialidades mágicas. Los más peligrosos de los que debemos estar atentos son su chamán, que debería ser fácilmente reconocible por la multitud de tatuajes inscritos en su cuerpo, y el capitán de la fortaleza, que es el único guerrero ogro del fuerte que lleva armadura pesada. Eso debería ser lo esencial."

              "Si este cáliz suyo es tan importante, sigo sin entender por qué el zorro no asalta ella misma el fuerte para recuperarlo," dice Hadrik. "¿No se supone que es muy poderosa?"

              "Eleya obtiene la mayor parte de su poder de los bosques sagrados del continente," dice Flower. "Cuando sale de esos bosques, no es mucho más fuerte que la mayoría de los otros animales. Por eso la guerra entre los animales y los monstruos lleva décadas sin llegar a una conclusión. También por eso el acceso a los bosques sagrados está prohibido para todos los foráneos."

              "Volviendo al tema que nos ocupa," dice Daren, "creo que lo siguiente que necesitamos establecer es cómo vamos a recuperar ese cáliz. Por lo que he oído, la fortaleza está situada en la cima de una colina, y todos los árboles en un radio de una milla han sido talados. No hay forma de que podamos colarnos."
