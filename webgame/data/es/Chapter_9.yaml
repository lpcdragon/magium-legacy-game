  - name: ch9_space_out
    texts:
      - source: scene_text
        paragraph: 7
        text: |-
          "¿Vivir dentro de tu propia mente? ¿Quieres decir que te quedas abstraída a menudo?"

          "¡No!" grita Flower. "¡Quiero decir que estoy literalmente viviendo dentro de mi propia mente, y llevo haciéndolo desde que nací! ¿Por qué nadie me cree nunca?"

          "Yo te creo, Flower," dice Kate.

          "¿De verdad?..." pregunta la chica.

          "Sí, porque no eres la primera persona que me cuenta esto. Una amiga mía, llamada..."

          Kate hace una breve pausa antes de volver a hablar.

          "Una amiga mía, llamada Diane, estaba en la misma situación que tú, y no era la única. Muchos de los huérfanos del Faro de Esperanza eran así. Los lessathi los llamaban etéreos. Personas que se identifican con sus almas, en lugar de sus cuerpos."

          "¿Sus almas?" pregunta Rose.
      - source: scene_text_2
        paragraph: 5
        text: |-
          "Sí," dice Kate. "La mayoría de las personas ni siquiera saben que tienen un alma, porque solo usan sus cinco sentidos para explorar el mundo a su alrededor. Sin embargo, el alma, que almacena la memoria de una persona y la esencia misma de su ser, en realidad se mantiene en el plano etéreo, en un universo de bolsillo que generalmente se conoce como su mente. Aunque el cerebro humano facilita la interacción entre el alma y el cuerpo, no es el único actor en la creación de la personalidad de un individuo, como la mayoría de los eruditos te harían creer. Después de que una persona muere, de la misma manera que su cuerpo se descompone y eventualmente se vuelve uno con la tierra, el alma de la persona también se descompone en materia etérea y eventualmente se vuelve una con el plano etéreo de nuevo."

          "¡Eh, eso no es lo que me enseñaron en la escuela de gigantes!" dice Hadrik. "¡Que yo sepa, cuando morimos, se supone que nuestros espíritus van todos al más allá del dios que hayamos adorado durante nuestras vidas en este plano!"

          "Cree lo que quieras," le dice Kate. "Yo solo estoy recitando textos de antiguos libros lessathi que me permitieron leer durante mi tiempo en el Faro. O al menos los libros que tuvieron la amabilidad de traducir a la lengua común. Volviendo al tema que nos ocupa, los etéreos son diferentes de otros humanos, porque experimentan la vida desde la perspectiva de sus almas, en lugar de sus cuerpos. Imagina vivir toda tu vida dentro de una marioneta gigante, sin poder salir, obligado a usarla cada vez que necesitas interactuar con una persona del mundo exterior."
      - source: scene_3
        paragraph: 4
        text: |-
          "¡A veces finjo que uso hilos invisibles para controlar mi cuerpo!" dice Flower. "Hace que la vida aquí dentro sea un poco más llevadera."

          "La mayoría de los niños instintivamente se darán cuenta de que algo es diferente en los etéreos," continúa Kate, "así que normalmente los aislarán desde una edad muy temprana y no los aceptarán en sus grupos. Al quedarse solos tanto en su mente como en el mundo exterior, los etéreos se ven obligados a encontrar sus propias formas de sobrellevar su situación. Algunos simplemente empezarán a excluir al mundo entero, y se aislarán aún más. Otros harán esfuerzos titánicos por integrarse en la sociedad, pero la torpeza social que ganaron por años de aislamiento siempre se interpondrá en su camino. Vivir sus vidas solos en sus propias mentes también hace que muchos etéreos desarrollen personalidades excéntricas y se fijen en un hobby que les guste hasta que se vuelvan excepcionalmente hábiles en él. A Diane le encantaba pasar horas cacharreando con dispositivos complejos. Flower, supongo que tu hobby elegido sería la acrobacia, ¿no?"

          "¡Oh, sí!" dice Flower. "¡Me encanta absolutamente! Estuve en un circo cuando era pequeña, ¡y desde entonces rara vez ha pasado un día sin que entrene mis habilidades acrobáticas!"
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch9_beacon
