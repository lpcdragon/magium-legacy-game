  - name: ch9_persuade
    texts:
      - source: scene_text
        paragraph: 76
        text: |-
          "Quizás pueda persuadiros de cambiar de opinión," dice el chamán, y luego golpea su bastón contra el suelo.

          Inmediatamente después, dos ogros que estaban invisibles empiezan a aparecer lentamente frente a nosotros, cada uno cargando a una mujer inconsciente sobre su espalda.

          "¡No!" grita Daren, al reconocer a las dos figuras que cargan los ogros.

          Kate y Rose están ambas inconscientes, y tienen tanto las manos como las piernas atadas. Debieron ser noqueadas antes de que siquiera tuvieran la oportunidad de saber quién las atacaba.

          "Soltad vuestras armas, humanos," dice el chamán. "Si no lo hacéis, mis aliados les aplastarán la cabeza con sus propias manos."
    choices:
      - position: 1
        text: Soltar mis armas
        effects:
          - set:
              current_scene: ch9_throw
      - position: 2
        text: Disparar a los dos ogros que sostienen a Kate y Rose con mi ballesta
        effects:
          - set:
              current_scene: ch9_crossbow
  - name: ch9_crossbow
    texts:
      - source: scene_text
        paragraph: 77
        text: |-
          Rápidamente apunto mi ballesta hacia los dos ogros y disparo a sus cabezas en rápida sucesión. Sus reacciones fueron sorprendentemente rápidas, y ambos consiguieron desviar mis flechas con sus garrotes.

          "Eso fue un error, humano," dice el chamán.

          "No, espera," dice Daren, mientras suelta su escudo y espada. "¿Ves? ¡He soltado mis armas!"

          "Demasiado tarde," dice el chamán, mientras hace una señal a los dos ogros a su lado.

          Sus aliados agarran las cabezas de Rose y Kate con sus manos, y aprietan los puños, aplastando sus cráneos con un crujido escalofriante.

          "¡No!" grita Daren. "¡Pagaréis por esto! ¡Todos vosotros pagaréis por esto!"

          Se lanza hacia los dos ogros, pero su capitán se interpone ante ellos, y golpea a Daren con su garrote. Daren instintivamente interpuso su escudo entre él y el arma del ogro, pero la fuerza detrás del golpe fue tan grande que lo mandó volando contra una pared cercana.
      - source: scene_text_2
        paragraph: 29
        text: |-
          Mientras los demás empiezan a luchar, yo me quedo ahí parado, incapaz de sacarme la imagen de los últimos momentos de Kate y Rose de la cabeza. Yo soy la razón de que esto haya pasado. Todo esto es culpa mía. Yo soy quien las mató.

          Mientras estos pensamientos recorren mi cabeza, noto demasiado tarde que un ogro había conseguido colocarse detrás de mí, y ahora estaba blandiendo su garrote hacia mi cabeza. No hubo tiempo de reaccionar, y la fuerza del impacto me abrió el cráneo de par en par, enviando mi cuerpo sin vida rodando al suelo.
