        paragraph: 30
        text: |-
          Mientras Rose y yo terminábamos nuestra conversación, Daren y Hadrik empezaban a trabajar en las dos últimas tiendas. Kate y Flower, que acababan de volver de su misión de reconocimiento, informaron de que no había actividad sospechosa alrededor de nuestro campamento y luego ambas se sentaron en un tronco junto a nosotros.

          Una vez que todas las tiendas están montadas, decidimos irnos a dormir temprano, para estar bien descansados cuando partamos mañana al amanecer. Flower se ofreció voluntaria para hacer la primera guardia, e inmediatamente fue a trepar a la colina más alta, para tener una buena vista de todo el valle. Al pasar junto a mí, pude sentir que su aura se debilitaba considerablemente, y el aura de la banshee se volvía mucho más fuerte. ¿Significa esto que la chica se fue a dormir y dejó a la banshee a cargo del turno de noche? Si es así, esta sería la oportunidad perfecta para conocer un poco más a la banshee, antes de llegar a la fortaleza de los ogros mañana.

          "¿No vas a dormir, Barry?" me pregunta Rose, al verme ahí de pie sin más.
