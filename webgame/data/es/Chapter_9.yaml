          - source: scene_text
            paragraph: 32
            text: |-
              "En realidad, estaba pensando en quedarme despierto un rato más."

              Luego le susurro al oído a Rose lo que noté sobre Flower y Petal, y le digo que quiero tener una pequeña charla con la banshee antes de irme a dormir.

              Rose se queda boquiabierta.

              "¡Barry, es una idea excelente!" dice. "Espera, solo dame un segundo para dejar mi mochila dentro de mi tienda, y voy contigo."

              Mientras los dos nos dirigimos hacia donde Flower fue a vigilar el valle, empiezo a darme cuenta de que mi intuición tenía razón, y la chica realmente se fue a dormir. Puedo sentir que el aura sobrenatural a su alrededor es definitivamente la dominante en este momento, y al acercarnos más, veo que sus ojos brillan con una luz azul intensa, de la misma manera que lo hacían antes, cuando la banshee tomó el control del cuerpo.

              "La chica está durmiendo," nos dice Petal, con voz fría, al vernos subir la colina hacia ella. "Puedo despertarla si necesitáis decirle algo importante."

              La banshee está sentada en la hierba, con las piernas cruzadas, con un sándwich en las manos. Parece que estaba a punto de empezar a comer, antes de vernos subir la colina.

              "En realidad, eres tú con quien queríamos hablar, no Flower," le digo.

              "¿De verdad?" dice la banshee, mirándome con suspicacia. "Bueno, entonces, por favor, sentaos."

              Luego le da un mordisco a su sándwich, mientras yo me siento en la hierba junto a ella.
          - source: scene_text_2
            paragraph: 13
            text: |-
              "¿Estoy en lo cierto al suponer que eres Petal?" pregunta Rose. "Me llamo Rose. ¡Encantada de conocerte!"

              Luego le ofrece la mano a la banshee.

              "En realidad, mi nombre es Illuna," dice la banshee, sin soltar su sándwich. "Petal es solo un apodo que la chica me puso cuando nos conocimos, porque no quería darle mi nombre real. Me ha estado llamando así desde entonces."

              Al ver que la banshee no tiene intención de estrecharle la mano, Rose sonríe con educación y toma asiento en la hierba, al otro lado de ella.

              "Bueno, eh," empiezo a decir, "hace un tiempo realmente estupendo estos días, ¿no crees?"

              La banshee frunce el ceño al oír mi pregunta, y gira la cabeza hacia mí.

              "Ve al grano, humano," dice. "Nunca me han gustado mucho las formas indirectas en que a vosotros os gusta empezar vuestras conversaciones. Estáis aquí porque no os fiáis de dejarme vigilar vuestro campamento sola, ¿verdad?"
