        texts:
          - source: scene_text
            paragraph: 47
            text: |-
              Sonríe.

              "Gracias por invitarme a unirme a ti esta noche. ¡Te lo agradezco mucho! ¡Quizás podamos repetirlo en algún momento!"

              "¡No veo por qué no!" le digo.

              "¡Buenas noches, Barry!" dice Rose, sonriendo.

              "Que duermas bien, Rose," le digo, mientras ambos nos separamos y nos dirigimos a nuestras respectivas tiendas.

              Una vez entro en mi tienda, me quedo dormido casi al instante. Nunca me di cuenta de lo cansado que realmente estaba, hasta que mi cabeza tocó la almohada. Me despierto unas horas después, al sonido de pisadas y varias tiendas siendo desmontadas.

              "¿Has dormido bien, Barry?" me dice Hadrik, con una sonrisa, cuando salgo. "¡Voy a recoger mi tienda, si no te importa!"

              Mientras empieza a desmontar la tienda, echo un buen vistazo a mi alrededor y veo que todos ya están de pie, ocupados con las tiendas o empacando sus cosas. El sol apenas empieza a salir, lo que significa que ahora nos quedan algo más de cuatro días para terminar nuestra misión.
          - source: scene_text_2
            paragraph: 19
            text: |-
              De repente recuerdo que quería hacer un rápido inventario del contenido de mi mochila antes de irnos, ya que no puedo ver lo que hay dentro debido al encantamiento de Daren.

              Empiezo a sacar mis objetos de la mochila, uno por uno, concentrándome en su imagen antes de alcanzarlos. Necesito asegurarme de que no me olvido de nada. ¿Quizás debería hacer una lista?

              "¿Qué demonios estás haciendo?" dice Kate, mientras se acerca a mí.

              "Estoy haciendo un inventario rápido," le respondo. "No tuve la oportunidad de ver bien todos mis objetos antes de que Daren encantara mi mochila, así que solo quería asegurarme de que no me olvido nada."

              Después de mirarme unos segundos, Kate me agarra la mano y la usa para dar tres toques en el interior de mi mochila. Inmediatamente después de soltarme, una pantalla aparece mágicamente sobre mi mochila, dándome una lista detallada de todos mis objetos, con imágenes correspondientes para cada uno de ellos.

              "Ahí tienes tu inventario rápido," dice Kate. "Ahora date prisa y mete todo de vuelta, o te quedarás atrás."
