          "No es tan malo como podrías pensar," dice Flower. "O sea, vale, intenta meternos en problemas con cada oportunidad que tiene, pero cuando las cosas se ponen realmente serias, puede ser muy útil. Si yo muero, no le quedará ningún humano más al que poseer una vez salga del amuleto, así que le conviene ayudarnos a seguir vivas el mayor tiempo posible."

          "¡Eh, Flower!" grita Daren desde lejos. "¿Es este el camino correcto a la fortaleza de los ogros?"

          "¡No!" grita Flower, mientras sale corriendo hacia donde Daren está parado. "¡Si seguimos por aquí, acabaremos en medio de un pantano! Tenemos que girar a la izquierda aquí, y luego seguir este sendero hasta salir del bosque."

          Los seis reanudamos nuestro viaje, y Flower vuelve a ir al frente. La chica se ha vuelto mucho más fiable desde que salimos de las ruinas. Parece saber exactamente a dónde va, y comprueba regularmente varios puntos de referencia que ha marcado en el pasado, para asegurarse de que seguimos en la dirección correcta. Debe haber recorrido estos caminos muchas veces a lo largo de los años.
