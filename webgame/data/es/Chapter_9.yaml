              - set:
                  current_scene: ch9_multiplied
      - condition: ch9_inventory = 1
        texts:
          - source: scene_text
            paragraph: 36
            text: |-
              Mientras los dos hablábamos, empezamos a vislumbrar la cabeza de Rose, mientras subía lentamente la colina hacia nosotros.

              "Oh genial, ¡mirad!" dice Petal. "Alguien más que tiene ganas de hablar del tiempo en mitad de la noche. Nunca voy a terminar este sándwich, ¿verdad?"

              Cuando Rose llega a nuestra posición, se detiene unos momentos para recuperar el aliento, y luego me da un puñetazo en el hombro, esta vez con un poco más de fuerza que cuando me golpeó antes.

              "Eres un mentiroso horrible, ¿lo sabías?" me dice. "¿A qué venía todo eso de ordenar tu mochila? ¿Se te olvidó que Daren encantó mi mochila también? ¡Ya sé que no hace falta ordenar nada porque la mochila le da a cada propietario la posibilidad de ver una lista de todos sus objetos!"

              Mierda, no sabía de esa función.

              "¡Podrías haberme dicho adónde ibas!" dice Rose. "¿No se te ocurrió que yo también podría querer hablar con Petal?"

              "Lo siento," le digo. "Supongo que me dejé llevar por el momento, antes..."
          - source: scene_text_2
            paragraph: 14
            text: |-
              Rose suspira.

              "No pasa nada," dice. "Seguro que no lo hiciste con mala intención. Solo... intenta confiar un poco más en mí la próxima vez, ¿vale?"

              Luego se gira hacia la banshee.

              "¿Estoy en lo cierto al suponer que eres Petal?" pregunta Rose. "Me llamo Rose. ¡Encantada de conocerte!"

              Luego le ofrece la mano a la banshee.

              "En realidad, mi nombre es Illuna," dice la banshee, sin soltar su sándwich. "Petal es solo un apodo que la chica me puso cuando nos conocimos, porque no quería darle mi nombre real. Me ha estado llamando así desde entonces."

              Al ver que la banshee no tiene intención de estrecharle la mano, Rose sonríe con educación y toma asiento en la hierba, al otro lado de ella.

              "Espera un momento," le digo a la banshee. "Acabo de darme cuenta de algo. No tienes mochila. Entonces, ¿de dónde sacaste ese sándwich?"
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: ch9_magic
