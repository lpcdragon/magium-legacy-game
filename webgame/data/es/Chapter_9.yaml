  - name: ch9_leader
    texts:
      - source: scene_text
        paragraph: 14
        text: |-
          "¿Y qué?" dice Kate. "Si se escapa, ya no es tu problema."

          "Error," dice Flower. "Si se escapa, se convertirá en el problema de todos."

          "¿Es tan poderosa?" le pregunto.

          "Sí, lo es. ¿Habéis oído hablar del invierno inmóvil?"

          "Solo fragmentos sueltos," le digo. "He oído que fue una gran guerra entre los lessathi y los stillwaters de este continente, hace unos seiscientos años."

          "Esa es básicamente la idea general," dice Flower. "Lo que apuesto a que no habéis oído, sin embargo, es el hecho de que Arraka solía ser la líder de esos stillwaters."

          "¿Una banshee?" pregunta Kate. "¿Liderando un ejército de stillwaters?"

          "No estaba sola," dice Flower. "Estaba fusionada con un tipo stillwater, de la misma manera que yo estoy ahora con Petal. Por lo que sé, nuestros dos casos son las únicas dos ocurrencias de fusión de almas en nuestra historia. Después de lo que me has contado, Kate, estoy dispuesta a apostar que ese stillwater con el que Arraka se fusionó era un etéreo también."

          "Espera," le digo. "¿Pueden las banshees poseer anfitriones masculinos? Creía que siempre elegían mujeres."

          "Eso es porque todas las banshees son espíritus femeninos," me dice Kate, "y para minimizar los riesgos durante sus despertares, tienden a poseer solo cuerpos femeninos para que sus auras mágicas sean más cercanas en naturaleza a las de sus anfitrionas. Supongo que un espíritu tan poderoso como Arraka no necesita tomar tales precauciones."
      - source: scene_text_2
        paragraph: 9
        text: |-
          "Así es," dice Flower. "Arraka era tan poderosa, de hecho, que hizo falta el esfuerzo combinado de Eleya y el Creador para poner fin a su desenfreno."

          "El Creador es ese tipo al que se considera fundador de la civilización actual de Varathia, ¿verdad?" le pregunto.

          "Sí, ese mismo," dice Flower. "Así que, como iba diciendo, el Creador y el zorro consiguieron derrotar a Arraka, pero solo temporalmente. Ni siquiera ellos eran lo suficientemente poderosos para matarla directamente, pero lograron lanzar un hechizo muy complejo sobre ella, que le prohíbe poseer a ninguna de las razas humanoides. Durante los siguientes seiscientos años, se vio obligada a poseer solo animales, que son demasiado débiles para que ella pueda usar sus poderes al máximo."

          "Entonces, si ya lleva libre seiscientos años, ¿por qué es más problemática ahora?" le pregunto.

          "Por mí," dice Flower. "La naturaleza de mi aura mágica ha cambiado drásticamente desde que mi alma se fusionó con la de Petal, y como mi aura es tan diferente ahora de la de cualquier otro humano, el hechizo lanzado sobre Arraka no puede identificarme como un ser humano, y por tanto no le prohíbe poseer mi cuerpo. Incluso si tirara a Arraka a algún lugar lejano, ella simplemente se liberaría del amuleto y me encontraría tarde o temprano. Y entonces no sería el fin solo para mí y Petal, podría significar el fin del continente entero, o puede que incluso del mundo..."

          "Espera," le digo. "Estás diciendo que tienes que mantener a Arraka bajo supervisión constante, para poder disipar su hechizo de explosión antes de que lo canalice por completo, pero ¿qué pasa cuando duermes?"
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch9_dispel
  - name: ch9_dispel
    texts:
      - source: scene_text
        paragraph: 15
        text: |-
          "Oh, Petal y yo dormimos por turnos, así que técnicamente nuestro cuerpo nunca se duerme," dice Flower. "De hecho, Petal ha estado durmiendo desde que salimos de las ruinas."

          "Pero, ¿y si ambas quedáis inconscientes?" dice Kate.

          "Bueno, al principio intentamos ver si no habría algún conjuro que pudiéramos usar para disipar automáticamente cualquier hechizo lanzado en un área cada pocas horas, pero desgraciadamente todos requerían que el lanzador se concentrara conscientemente en los hechizos que quiere interrumpir."

          Flower se gira entonces hacia Arraka, que estaba sutilmente canalizando un hechizo de explosión mientras hablaba con Hadrik, y lo disipa con un chasquido de su dedo.

          "¡Maldición!" grita Arraka. "¡Chica, ¿es que tienes ojos en la nuca?!"

          "¿Veis?" nos dice Flower. "No puedes disiparlo a menos que te concentres en su hechizo, específicamente. Así que, en lugar de optar por la disipación automática, hicimos un hechizo que intenta continuamente despertarnos en caso de que ambas estemos inconscientes, y si no lo consigue en dos horas, nos mata a las dos, lo que al menos asegura que tendremos una muerte pacífica, en lugar de que Arraka absorba nuestras almas y luego destruya el mundo."

          "Vaya," dice Kate. "Eso es una forma bastante... pragmática de verlo."

          "¡Fue idea de Petal!" dice Flower, sonriendo.

          "Me lo imaginaba," dice Kate.
