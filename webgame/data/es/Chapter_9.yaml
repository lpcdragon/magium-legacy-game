        paragraph: 35
        text: |-
          "En realidad, solo quería hablar del tiempo."

          La banshee me mira durante unos momentos, sin saber qué pensar de mí.

          "En ese caso," dice finalmente, "coincido contigo en que el tiempo ha sido extraordinariamente bueno estos últimos días. Ahora, si esto es todo lo que tenías que decir, agradecería que me dejaras terminar mi sándwich en paz."

          "¿Ni siquiera vas a intentarlo?" le pregunto a Petal.

          "¿Intentar qué?" dice ella.

          "Hacer que confiemos en ti."

          "¿Por qué iba siquiera a molestarme en hacer algo así?" pregunta. "Solo estamos viajando juntos porque Flower decidió ayudaros por un impulso. Una vez os libréis de vuestros collares, espero que nos separemos y no volvamos a saber los unos de los otros. Dadas estas circunstancias, no veo razón alguna por la que debería perder mi tiempo intentando ganarme vuestra confianza. Sentíos libres de creer lo que queráis de mí, y yo haré lo mismo con vosotros."
