        paragraph: 27
        text: |-
          "Simplemente no consigo fiarme de ella."

          "¿Por qué?"

          "Bueno, las banshees nunca me parecieron de las más fiables."

          Rose se queda boquiabierta.

          "¡Debería darte vergüenza, Barry!" dice. "Casi empiezo a creer que Daren tenía razón sobre ti. ¿De verdad solo confiaste en Kate por su cara bonita?"

          "¡Eh, Kate era diferente! ¡Desde el principio supe que no era una banshee de verdad!"

          "¡Pues Flower tampoco lo es! Petal es la banshee. ¡Y si Flower confía en ella, yo también!"

          "¿Estás dispuesta a confiar en una banshee así sin más, sin ninguna prueba?"

          "¡Sí! Porque ella y Flower llevan juntas veinte años. Si Petal sigue teniendo la confianza de Flower después de tanto tiempo, eso es prueba suficiente para mí. Por favor, Barry, ¿no podrías quizás darle otra oportunidad a Petal? ¿Por mí?"

          Suspiro.

          "Bueno, supongo que al menos podría darle el beneficio de la duda..."

          "¡Gracias!" dice Rose, sonriendo. "¡Te prometo que no te arrepentirás!"

          "Eso espero."
