  - name: ch9_strategy
    texts:
      - source: scene_text
        paragraph: 49
        text: |-
          Una vez que todos terminamos lo que teníamos que hacer, empezamos a marchar de nuevo, con Flower al frente del grupo, igual que ayer. Esta vez, sin embargo, los cinco estábamos mucho más callados que antes. Con la excepción de las indicaciones ocasionales de Flower, apenas hubo palabras entre los seis en la primera media hora de nuestro viaje.

          "¿Ha... pasado algo mientras dormía?" pregunta Flower, preocupada, después de notar que algo va mal.

          "¡No!" gritamos Daren y yo al mismo tiempo.

          "¿Eh... vale?" dice Flower, con un tono aún más preocupado que antes.

          "Por lo que he oído, Barry y Daren tuvieron una pequeña pelea anoche," dice Kate. "No les hagas caso. Seguro que se les pasa pronto."

          Después de unas horas más caminando por el bosque, Flower nos anunció que estábamos empezando a acercarnos a nuestro objetivo. Decidimos que era un buen momento para hacer un pequeño descanso y hablar sobre nuestra estrategia para infiltrarnos en la fortaleza.
      - source: scene_text_2
        paragraph: 21
        text: |-
          "Lo primero es lo primero," dice Daren. "Tenemos que decidir qué hacer con Rose durante nuestro ataque. Como yo lo veo, tenemos dos opciones. O la llevamos con nosotros, o la dejamos en una zona segura fuera de la fortaleza, con alguien que actúe como su guardaespaldas, por si acaso. ¿Alguien tiene alguna opinión sobre esto?"

          "Me ofrezco voluntaria para quedarme atrás y proteger a Rose," dice Kate. "No estoy segura de cuánto puedo ayudar a infiltrarme en el fuerte sin mi magia, pero debería poder manejar a unos cuantos exploradores ogros por mi cuenta si fuera necesario."
