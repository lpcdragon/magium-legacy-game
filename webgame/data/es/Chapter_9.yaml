        paragraph: 53
        text: |-
          "Quizás nos han descubierto y quieren atraernos a una trampa."

          "Estoy de acuerdo," dice Daren. "Nos han dicho que sus magos son bastante capaces, así que es perfectamente posible que estén usando magia para detectar cuando alguien se acerca a su fortaleza. Desgraciadamente, no tenemos el lujo de quedarnos aquí parados esperando a que se aburran. El tiempo no está de nuestro lado, y no podemos saber realmente qué intentan lograr hasta que entremos en el fuerte. Solo esperemos que nuestra falta de un plan detallado sobre nuestras acciones una vez infiltrados no resulte fatal para nosotros."

          "¡Oh, no os preocupéis!" dice Flower. "Petal y yo tenemos un plan secreto. ¡Seguro que funciona!"

          "Ya veo," dice Daren. "¿Y por casualidad tendrías alguna intención de compartir este plan secreto con el resto de nosotros?"

          "¡No, claro que no!" dice Flower, escandalizada. "¿Cómo seguiría siendo un secreto si simplemente empezamos a contárselo a todo el mundo?"
