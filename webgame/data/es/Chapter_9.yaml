  - name: ch9_acting
    texts:
      - source: scene_text
        paragraph: 12
        text: |-
          "¿Entonces por qué siempre te comportas como una niña de diez años?"

          "¡Tu cara se comporta como una niña de diez años!" me dice Flower, con cara de puchero.

          Sin saber cómo responder a una réplica tan magistralmente elaborada, decido cambiar de tema.

          "Entonces, eh... ¿Qué has hecho con Arraka? Veo que no llevas el amuleto al cuello."

          "Oh, dijo que quería socializar con el grupo, así que se lo pasé a Hadrik un rato, ya que es el único que no parece tener aversión hacia ella."

          Luego señala hacia Hadrik, que está sosteniendo el amuleto en su mano derecha y manteniendo una conversación con Arraka sobre ogros y maneras de matarlos.

          "Es una pena que no pueda volver a transformarme en gigante cuando lleguemos a la fortaleza," dice Hadrik. "¡Hace mucho que no lucho contra ogros, y realmente echo de menos el satisfactorio sonido que hacen al ser aplastados bajo mis pies!"

          "Bueno, al menos podrás ver las caras que ponen esos tontos cuando les devuelvas sus propias bolas de fuego," dice Arraka.

          "En realidad, los ogros son tan estúpidos que dudo que tuvieran tiempo siquiera de darse cuenta de lo que pasó antes de ser reducidos a cenizas."

          Tanto Arraka como Hadrik empiezan entonces a reírse a carcajadas, al mismo tiempo.
      - source: scene_text_2
        paragraph: 8
        text: |-
          "Sabes, se me da bastante bien la magia de teletransportación," dice Arraka. "Si me liberas del amuleto, podría teletransportar a unos cuantos ogros aquí, y podríamos hacer un pequeño ensayo antes del evento principal. ¿Qué me dices?"

          "Nah," dice Hadrik, con una sonrisa.

          "Bueno, valía la pena intentarlo," dice Arraka.

          "¡Me alegro mucho de que Arraka por fin haya encontrado a alguien con quien conecta!" dice Flower, pareciendo genuinamente feliz por ella. "No tengo mucho en común con ella, así que no hablamos mucho, y Petal la odia a muerte."

          "Eso plantea la pregunta..." le digo. "¿Por qué sigues llevándola contigo?"

          "Me gustaría hacer la misma pregunta," dice Kate, mientras se acerca a nosotros. "¿No sería mejor simplemente tirarla al fondo de un lago y olvidarse de ella? No me siento muy cómoda viajando con ella a mi lado. Su mera aura me pone los pelos de punta."

          "No... puedo tirarla..." dice Flower, con una expresión inusualmente seria en su cara.

          "¿Por qué no?" pregunta Kate.

          "Porque puede liberarse del amuleto si la dejamos sin supervisión. Apenas tiene acceso a magia mientras está atrapada ahí dentro, pero con la poca que tiene, es capaz de generar una pequeña explosión siempre y cuando la dejen sola canalizando el hechizo durante unas horas."
