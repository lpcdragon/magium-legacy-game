  - name: ch1_imply2
    routes:
      - condition: ch1_show_yourself = 1
        texts:
          - source: scene_text
            paragraph: 13
            text: |-
              El mago una vez más se queda en silencio. No parece querer tentar más a su suerte. Después de un rato, escucho que guarda sus dagas en su cinturón y luego escupe en el suelo.

              "Recordaré esto, Stillwater. No creas que no lo haré. Te arrepentirás del día en que te metiste con Dave el Degollador. Y lo mismo va para ti, sanador con armadura. Los volveré a ver a ambos pronto".

              Después de terminar su discurso, se da la vuelta con disgusto mientras se adentra en el bosque en el lado opuesto del claro. La daga de mi hombro se sale sola y se apresura a alcanzar a su maestro.

              Una vez que ya no puedo ver al mago, dejo escapar un gran suspiro. Eso estuvo cerca. Estuvo realmente cerca. Todavía puedo sentir mi corazón latiendo rápidamente en mi pecho.

              ¿Si haces eso, te arrepentirás? ¿En qué estaba pensando? ¿Estaba tratando de que me mataran? Este es un torneo de vida o muerte, Barry. No es el momento de que empieces a jugar al héroe.

              Mientras trato de calmarme, el mago de armadura enfunda su espada, recoge su escudo del suelo y comienza a caminar hacia mí.
          - source: scene_text_2
            paragraph: 9
            text: |-
              "No tenías ninguna obligación de salvarme", dice. "Pero lo hiciste de todos modos, a riesgo de tu propia vida. No puedo permitir que tal desinterés quede sin recompensa. Yo, Daren, juro este día que te ofreceré mi protección desde este momento y hasta el final de este torneo. Dime, alma valiente, ¿cuál es tu nombre?"

              Su discurso me tomó por sorpresa.

              "Es, eh... Es Barry. Mi nombre es Barry".

              "Espera, ¿tu nombre es Barry?"

              Trata de contener su risa pero falla miserablemente. Estaba tratando de sonar solemne y digno hace solo unos segundos, pero parece que no tardó mucho en abandonar su actuación.

              "Ese es el nombre más extraño para un mago que he escuchado en mi vida. Especialmente para un Stillwater. ¿Tienes algo que quieras decirme, Barry?"
