            paragraph: 3
            text: |-
              ...tranquilo con todo esto. Debe ser porque me he estado preparando mentalmente para esto durante tanto tiempo. O tal vez simplemente soy más fuerte de lo que pensaba. Pero incluso frente al peligro mortal que me espera, incluso contra estas probabilidades imposibles, me siento confiado. Sé que puedo hacerlo. Voy a ganar este torneo y convertirme en mago. No puedo permitirme fallar.

              Hay una explosión a unos pocos cientos de pies de mi ubicación. Las peleas ya han comenzado. Y una de ellas está mucho más cerca de mí de lo que hubiera esperado. No hay forma de que pueda entrar en una pelea con ninguno de los magos en este momento. Necesito evitar el combate el mayor tiempo posible si quiero sobrevivir hasta el final.

