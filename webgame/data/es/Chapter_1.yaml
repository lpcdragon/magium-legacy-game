scenes:
  - name: ch1_intro1
    texts:
      - source: scene_text
        paragraph: 24
        text: |-
          Dicen que hay una línea muy fina entre la valentía y la estupidez. Mientras estoy aquí, en medio de este bosque, contemplando todas las explosiones a lo lejos, me doy cuenta de que bien podría haber cruzado esa línea, hasta un punto de no retorno.

          Mi nombre es Barry. Tengo veintiocho años y podría describirme con bastante exactitud como un tipo común y corriente. No tengo talentos, ni habilidades particulares, ni formación académica. Lo único que me define es mi obsesión de toda la vida por convertirme en mago. Es lo que he deseado desde que tenía cinco años. Ha sido mi pasión dominante a lo largo de mi vida, ya que he acumulado constantemente conocimientos sobre magos y he viajado por el mundo con la esperanza de encontrar una forma de hacer realidad mi sueño.

          Después de interminables años de buscar en tomos polvorientos y pergaminos desgastados, finalmente he encontrado una manera de lograrlo.

          ¿El truco? Primero tengo que ganar un torneo contra los magos más poderosos del mundo. ¿Suena una locura? Probablemente porque lo es. Pero ya es demasiado tarde para volver atrás. El único camino que me queda es hacia adelante.

          Mientras estoy aquí, sabiendo que ya no es posible volver a mi vida normal, no puedo evitar sentirme bastante...
    choices:
      - position: 1
        text: Entusiasmado
        effects:
          - set:
              current_scene: ch1_intro2
              ch1_intro_feeling: 1
      - position: 2
        text: Tranquilo
        effects:
          - set:
              current_scene: ch1_intro2
              ch1_intro_feeling: 2
      - position: 3
        text: Asustado
        effects:
          - set:
              current_scene: ch1_intro2
              ch1_intro_feeling: 3
  - name: ch1_intro2
    routes:
      - condition: ch1_intro_feeling = 1
        texts:
          - source: scene_text
            paragraph: 2
            text: |-
              ...entusiasmado con todo esto. Tal vez realmente estoy completamente loco. Hubiera esperado sentir al menos un poco de miedo por todo esto. Pero en lugar de eso, tengo esta constante sensación de hormigueo que no desaparece. La sensación de que estoy más cerca de mi sueño que nunca antes en mi vida. Todos los terribles peligros que me esperan me parecen distantes, y en lo único que puedo pensar ahora es que al final del torneo, cuando gane esto, finalmente me convertiré en un mago.

              Hay una explosión a unos pocos cientos de pies de mi ubicación. Las peleas ya han comenzado. Y una de ellas está mucho más cerca de mí de lo que hubiera esperado. No hay forma de que pueda entrar en una pelea con ninguno de los magos en este momento. Necesito evitar el combate el mayor tiempo posible si quiero sobrevivir hasta el final.

              Me dirijo en la dirección opuesta a donde escuché la explosión. Mientras me dirijo hacia el final del bosque, empiezo a escuchar voces. Hay dos magos hablando en un claro a unos pocos pies de distancia. Me escondo detrás de un árbol y echo un vistazo rápido hacia el claro.

              Parece que los dos magos acaban de terminar de pelear. Uno de ellos tiene la apariencia de un matón ordinario. Viste una simple camisa blanca manchada, pantalones de cuero y un cinturón lleno de cuchillos para lanzar. Su barba negra descuidada esconde una sonrisa maliciosa. Solo por ver la confianza en sus ojos, puedo decir claramente que es el vencedor de la escaramuza. El otro mago lleva una armadura pesada, pero su escudo yace en el suelo a su lado y apenas sostiene su espada.
          - source: scene_text_2
            paragraph: 3
            text: |-
              Mirando más de cerca al mago con armadura, noto que su cabeza es calva, su piel es oscura, probablemente tiene unos cuarenta y tantos años y tiene una cicatriz en la frente, con forma de 'X'. He leído sobre un mago que coincide exactamente con esta descripción y que respondía al nombre de Daren, y era bastante legendario, pero ¿perdería tan fácilmente contra un matón común? El mago de la camisa blanca responde a mi pregunta mientras se dirige al de la armadura, jugueteando casualmente con uno de sus cuchillos.

              "¡El legendario mago Daren! El salvador del Continente Oriental. El sanador con armadura. Dicen que has viajado por el mundo, salvando innumerables aldeas de la destrucción. Que una vez luchaste contra diez gólems de roca tú solo, solo para defender a un niño pequeño. Supongo que esto demuestra que nunca se debe confiar realmente en las leyendas, ¿eh? Siempre supe que todos esos cuentos sobre magos tan fuertes como gigantes eran pura basura. ¡Diablos, si todos esos magos 'legendarios' que se unieron a este torneo son tan débiles como tú, voy a ganar esto para el atardecer!"

              Empieza a reír, pero se detiene de repente.

              "Espera, ¿quién está ahí?", dice, mientras se gira hacia mí.

              Rápidamente retiro la cabeza detrás del árbol y presiono mi espalda contra él, tratando de respirar lo más silenciosamente posible.

              "Sé que estás ahí, cobarde. ¡Muéstrate, o haré que uno de mi cuchillos te encuentre!"
        choices:
          - position: 1
            text: Permanecer en silencio
            effects:
              - set:
                  current_scene: ch1_cutthroat_dave
                  ch1_show_yourself: 1
          - position: 2
            text: Mostrarme
            effects:
              - set:
                  current_scene: ch1_cutthroat_dave
                  ch1_show_yourself: 2
                  ac_ch1_coward: 1
                achievement:
                  id: ac_ch1_coward
                  title: ¿A quién llamas cobarde?
          - position: 3
            text: No veo ninguna razón para mostrarme ante ti.
            effects:
