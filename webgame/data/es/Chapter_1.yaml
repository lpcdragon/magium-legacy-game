            text: |-
              "Lo es... Pero no es que no pueda lanzarlo en absoluto... Puedo defenderme de la magia perfectamente. Son las armas normales con las que tengo problemas. Por eso uso armadura. Por eso uso una espada y un escudo. Primero comencé a usarlos porque no podía usar el hechizo de escudo correctamente, pero pronto, comencé a adaptar mi magia a ellos, y mi propio estilo de lucha. Encontré un maestro que me enseñó a luchar con armas, y usé mi magia para encantarlas. Luego, después de cada pelea, simplemente usaba mi magia blanca para curar mis heridas. Así..."

              Lo demuestra levantando las manos en el aire y haciendo que aparezca una luz blanca a su alrededor. Mientras la luz brilla, sus heridas comienzan a cerrarse y la sangre se desvanece.

              "Los cuchillos del degollador tenían vida propia, y había muchos de ellos atacándome simultáneamente. Si hubiera tenido un hechizo de escudo adecuado para defenderme de ellos, derrotarlo hubiera sido un juego de niños. Pero defenderse de todos esos cuchillos solo con un escudo y una espada hubiera sido imposible, independientemente de mi habilidad de combate. Todas las armaduras tienen sus debilidades. Todo lo que tenía que hacer era ir repetidamente a las articulaciones de la armadura, hasta que me desgastara".
