  - name: ch1_truth
    texts:
      - source: scene_text
        paragraph: 19
        text: |-
          "Busco lo mismo que tú, Daren", le digo. "Busco el Magium. Ha sido mi sueño desde pequeño convertirme en mago, y el Magium puede concederme ese deseo".

          "Vamos, Barry. ¡Vas a tener que inventar una mentira mejor que esa si quieres que te crea!"

          Se detiene y me mira directamente a los ojos.

          "Por los dioses... ¡Hablas en serio! Barry, alabo tu valentía y determinación pero... Te das cuenta de que no puedes ganar todo este torneo solo fanfarroneando, ¿verdad?"

          "¡Claro que lo sé! Ese no es el único as que tengo bajo la manga. ¿Pero qué hay de ti? Dicen que eres uno de los magos más fuertes del mundo. Entonces, ¿cómo alguien tan fuerte como tú es derrotado tan fácilmente por alguien llamado Dave el Degollador?"

          "Oh, eso..."

          Suena avergonzado.

          "Verás, Barry. Puedo ser poderoso, pero eso no significa que no tenga debilidades. Resulta que una de esas debilidades es que nunca logré dominar el hechizo de escudo adecuadamente..."

          "¿El hechizo de escudo? ¿El que lanza una capa protectora invisible a tu alrededor? Pero, ¿no es ese uno de los primeros hechizos que aprende cualquier mago?"
