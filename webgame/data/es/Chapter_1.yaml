        paragraph: 20
        text: |-
          "No vine aquí por elección", le digo. "Créeme, no me gustaría nada más que irme de este lugar y nunca mirar atrás. Pero esa no es realmente una opción para mí en este momento. Todo lo que puedo hacer ahora es tratar de sobrevivir hasta el final del torneo".

          Daren hace una pequeña pausa para reflexionar sobre mis palabras.

          "Espera, Barry... creo que también hay otra forma".

          "¿La hay?"

          "¡Sí! ¿Recuerdas las reglas? Dijeron que nos eliminarían del torneo y nos teletransportarían de regreso si detectaban cualquier intención de dañar a los lugareños. ¡Podrías usar eso, Barry! ¡Solo necesitas encontrar a cualquiera de los humanos que viven en este continente, intentar darles un puñetazo en la cara, y serás liberado!"

          "Yo... eh... nunca lo había pensado de esa manera".
