            paragraph: 4
            text: |-
              ...asustado. En el fondo, siempre supe que esto pasaría. He pasado las últimas semanas preparándome mentalmente y haciendo planes. Diciéndome a mí mismo que estaba listo para lo que sea que este torneo me arrojara. Pero una vez que llegué aquí, una vez que supe que no había forma de volver atrás, toda mi confianza se convirtió en incertidumbre, y todo mi valor se convirtió en miedo. Me voy a enfrentar a los magos más fuertes del mundo. Ninguna cantidad de planificación podría haberme preparado realmente para esto. Pero ya es demasiado tarde para cambiar de opinión ahora. Tuve tiempo suficiente para retirarme de esto antes de venir aquí. Voy a ganar este torneo contra todo pronóstico. Voy a hacerlo. Solo tengo que...

              Hay una explosión a unos pocos cientos de pies de mi ubicación. Las peleas ya han comenzado. Y una de ellas está mucho más cerca de mí de lo que hubiera esperado. No hay forma de que pueda entrar en una pelea con ninguno de los magos en este momento. Necesito evitar el combate el mayor tiempo posible si quiero sobrevivir hasta el final.

