  - name: ch1_cutthroat_dave
    routes:
      - condition: ch1_show_yourself = 1
        texts:
          - source: scene_text
            paragraph: 5
            text: |-
              Mantengo mi respiración lo más silenciosa posible y no digo nada. Debe estar mintiendo. Nunca tuvo la oportunidad de verme. Se rendirá una vez que vea que no hay respuesta.

              "A tu manera, entonces", dice el matón, mientras escucho que lanza una daga hacia mí. La daga pasa zumbando por mi cabeza y, antes de que tenga oportunidad de reaccionar, gira en el aire y vuela directamente hacia mi hombro izquierdo, clavándolo contra el árbol. Dejo escapar un gemido ahogado de dolor, mientras trato de sacar el cuchillo.

              "No vas a sacar ese cuchillo tan fácilmente. Mis cuchillos tienen vida propia y solo me escuchan a mí. Ahora que sé dónde estás, voy a..."

              Se detiene.

              "Así que eres un Stillwater, ¿eh? ¿Tratando de que baje la guardia actuando como un idiota? ¿Tratando de arrullarme en una falsa sensación de seguridad? ¿Es ese tu plan? Pues no va a funcionar conmigo. ¡Porque soy demasiado inteligente para eso, ¿me oyes?!"

              Su repentino cambio de actitud hacia mí no es del todo inesperado. La existencia de los Stillwaters es una de las razones principales por las que me atreví a soñar que podría tener una oportunidad de ganar este torneo.
          - source: scene_text_2
            paragraph: 6
            text: |-
              Los Stillwaters son una raza muy rara de magos, que se sabe que son increíblemente poderosos. Se dice que uno de ellos destruyó una ciudad entera en un instante hace unos veinte años, con solo un chasquido de sus dedos. Se decía que la ciudad de Olmnar había sido una de las ciudades más grandes de este continente, pero fue borrada del mapa así como así, en un solo segundo. Tal es el poder de estos Stillwaters.

              Pero lo que es aún más interesante sobre estos Stillwaters es que no puedes diferenciarlos de los humanos normales. Normalmente, puedes sentir la magia fluyendo de cada ser. No necesitas ser un mago para hacerlo. Al sentir su aura mágica, puedes decir qué tan fuertes son los magos antes de entablar una pelea con ellos.

              Los Stillwaters, sin embargo, tienen la misma aura que los humanos normales. Y si te encontraras con alguien que parece no tener casi nada de magia en medio de lo que es esencialmente el torneo de magos más grande de toda la historia... ¿A qué estarías más inclinado a creer? ¿Que un humano promedio fue de alguna manera lo suficientemente suicida como para unirse al torneo solo para ser masacrado? ¿O que te enfrentas a uno de los tipos de magos más fuertes y raros que existen en el mundo?

              "¡No me asustas, Stillwater! ¡Voy a llenarte de agujeros y terminarás rogándome misericordia! Apuesto a que tus leyendas no son más ciertas de lo que lo fueron para esta triste excusa de mago que está a mi lado".
        choices:
          - position: 1
            text: Darle hasta la cuenta de diez para retirarse
            effects:
              - set:
                  current_scene: ch1_retreat
                  ac_ch1_die: 1
                achievement:
                  id: ac_ch1_die
                  title: Un buen comienzo
          - position: 2
            text: Insinuar que soy quien destruyó la ciudad de Olmnar
            effects:
              - set:
                  current_scene: ch1_imply
      - condition: ch1_show_yourself = 2
        texts:
          - source: scene_text
            paragraph: 6
            text: |-
              Respiro profundamente y trato de parecer lo más tranquilo posible. Salgo del bosque y entro al claro, enfrentando directamente al mago de los cuchillos.

              "¿A quién llamas cobarde?", le pregunto.

              El mago se detiene un poco mientras me mide de arriba abajo.

              "Un Stillwater, ¿eh?", dice finalmente. Se esforzó por mantener la compostura al hacer su pregunta, pero el temblor en su voz lo traicionó. Tiene miedo.

              Su repentino cambio de actitud hacia mí no es del todo inesperado. La existencia de los Stillwaters es una de las razones principales por las que me atreví a soñar que podría tener una oportunidad de ganar este torneo.
          - source: scene_text_2
            paragraph: 7
            text: "Stillwaters are a very rare breed of mages, that are known to be incredibly powerful. One of them is said to have destroyed an entire city in an instant some twenty years ago, with only a flick of his fingers. The city of Olmnar was said to have been one of the greatest cities on this continent, but it was wiped off the map just like that, in a single second. Such is the power of these stillwaters.\r\n\r\nBut what is even more interesting about these stillwaters is that you can't differentiate them from normal humans. Normally, you can sense the magic flowing from every being. You don't need to be a mage to do it. By sensing their magical aura, you can tell how strong mages are before engaging them in a fight. \r\n\r\nStillwaters, however, have the same aura as normal humans. And if you were to run into someone that seems to have almost no magic in the middle of what is essentially the greatest mage tournament in all of history... What would you be more inclined to believe? That an average human was somehow suicidal enough to join the tournament only to get massacred? Or that you are facing one of the strongest and rarest kinds of mages that exist in the world?\r\n\r\n\"You don't scare me, stillwater! I'm going to fill you with holes and you'll end up begging me for mercy! I bet your legends are no more true than they were for this sad excuse for a mage standing next to me.\""
        choices:
          - position: 1
            text: Darle hasta la cuenta de diez para retirarse
            effects:
              - set:
                  current_scene: ch1_retreat
                  ac_ch1_die: 1
                achievement:
                  id: ac_ch1_die
                  title: Un buen comienzo
          - position: 2
