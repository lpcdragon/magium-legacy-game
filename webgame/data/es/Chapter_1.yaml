  - name: ch1_humor
    routes:
      - condition: ch1_show_yourself = 1
        texts:
          - source: scene_text
            paragraph: 16
            text: |-
              "Sí. Mis padres tenían un sentido del humor realmente extraño. Hablando de nombres, ¿no se supone que eres un héroe de leyenda? ¿Cómo exactamente alguien tan fuerte como tú es derrotado tan fácilmente por alguien llamado Dave el Degollador?"

              "Oh, eso..."

              Suena avergonzado.

              "Verás, Barry. Puedo ser poderoso, pero eso no significa que no tenga debilidades. Resulta que una de esas debilidades es que nunca logré dominar el hechizo de escudo adecuadamente..."

              "¿El hechizo de escudo? ¿El que lanza una capa protectora invisible a tu alrededor? Pero, ¿no es ese uno de los primeros hechizos que aprende cualquier mago?"

              "Lo es... Pero no es que no pueda lanzarlo en absoluto... Puedo defenderme de la magia perfectamente. Son las armas normales con las que tengo problemas. Por eso uso armadura. Por eso uso una espada y un escudo. Primero comencé a usarlos porque no podía usar el hechizo de escudo correctamente, pero pronto, comencé a adaptar mi magia a ellos, y mi propio estilo de lucha. Encontré un maestro que me enseñó a luchar con armas, y usé mi magia para encantarlas. Luego, después de cada pelea, simplemente usaba mi magia blanca para curar mis heridas. Así..."
          - source: scene_text_2
            paragraph: 12
            text: |-
              Lo demuestra levantando las manos en el aire y haciendo que aparezca una luz blanca a su alrededor. Mientras la luz brilla, sus heridas comienzan a cerrarse y la sangre se desvanece. Luego usa la misma magia para curar la herida del hombro que me había hecho el cuchillo de Dave el Degollador.

              "Los cuchillos del degollador tenían vida propia, y había muchos de ellos atacándome simultáneamente. Si hubiera tenido un hechizo de escudo adecuado para defenderme de ellos, derrotarlo hubiera sido un juego de niños. Pero defenderse de todos esos cuchillos solo con un escudo y una espada hubiera sido imposible, independientemente de mi habilidad de combate. Todas las armaduras tienen sus debilidades. Todo lo que tenía que hacer era ir repetidamente a las articulaciones de la armadura, hasta que me desgastara".

              "¿Por qué me cuentas todo esto? ¿No deberías estar al menos un poco preocupado por revelar tu mayor debilidad a alguien que acabas de conocer?"

              "¡Oye, acabas de salvarme la vida! Así que no puedes ser tan malo, ¿verdad?"

              "Perdonen que interrumpa", escucho la voz de una mujer detrás de los árboles. "¿Pero por casualidad serías Daren, el legendario salvador del continente del este?"
        choices:
