        texts:
          - source: scene_text
            paragraph: 11
            text: |-
              "Eso es gracioso", le digo. "Eso es casi lo mismo que me dijeron los habitantes de Olmnar. Antes de que redujera su ciudad a cenizas".

              El mago estaba a punto de ir por sus cuchillos, pero ahora se detuvo. Me mira con mucha fijeza, sin apartar los ojos ni un segundo.

              "Estás fanfarroneando", dice el mago.

              "Supongo que solo hay una forma de averiguarlo, entonces", le digo, mientras siento mi corazón martilleando en mi pecho.

              Los pocos segundos de silencio que siguieron se sintieron como los segundos más largos de mi vida. Después de una larga pausa, el mago dice finalmente:

              "Estás de suerte, Stillwater. Me siento misericordioso hoy. Dejaré de molestarte tan pronto como termine con este tipo de aquí".

              "Si haces eso, te arrepentirás", digo sin pensar.

              Mi última frase parece haberlo tomado por sorpresa.

              "¿Qué, estás bromeando? ¿Vas a defender a este desgraciado?"

              "Si tengo que hacerlo. ¿Tengo que hacerlo?"
