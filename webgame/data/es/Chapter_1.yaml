  - name: ch1_retreat
    routes:
      - condition: ch1_show_yourself = 1
        texts:
          - source: scene_text
            paragraph: 8
            text: |-
              "Te voy a dar hasta la cuenta de diez para que te pierdas de mi vista", le digo.

              "¡Ja! Palabras vacías. Eso es todo lo que tienes. ¡Ármate, necio! ¡Hoy me convierto en una leyenda!"

              Una vez que termina de hablar, escucho al mago lanzar varios cuchillos hacia el bosque. Trato desesperadamente de sacar el cuchillo de mi hombro, pero es inútil. Cinco de los cuchillos del mago pasan a toda velocidad a mi lado y giran en el aire igual que el anterior. Intento de alguna manera quitarme de su camino, pero el cuchillo en mi hombro todavía me mantiene clavado al árbol.

              Lo último que siento es el dolor agudo de todos esos cuchillos empalándome, mientras mi conciencia comienza a desvanecerse lentamente.
        choices:
          - position: 1
            text: Reiniciar juego
            effects:
              - set:
                  current_scene: ch1_intro1
                  ch1_show_yourself: 0
                  ch1_intro_feeling: 0
                  ch1_stillwater: 0
          - position: 2
            text: Cargar partida
            effects:
              - set:
                  storyboard_controls: Jump to frame "Save load game"
      - condition: ch1_show_yourself = 2
        texts:
          - source: scene_text
            paragraph: 9
            text: |-
              "Te voy a dar hasta la cuenta de diez para que te pierdas de mi vista", le digo.

              "¡Ja! Palabras vacías. Eso es todo lo que tienes. ¡Ármate, necio! ¡Hoy me convierto en una leyenda!"

              Una vez que termina de hablar, el mago lanza cinco dagas simultáneamente hacia mí. Intento esquivarlas pero son tan rápidas que apenas tengo tiempo de parpadear. Todo terminó en un instante. Mientras siento el dolor de las dagas, mi conciencia comienza a desvanecerse lentamente.
