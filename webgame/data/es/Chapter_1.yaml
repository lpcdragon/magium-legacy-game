  - name: ch1_ordinary
    texts:
      - source: scene_text
        paragraph: 18
        text: |-
          "No soy un Stillwater, Daren. Ese matón simplemente asumió que lo era y me aproveché de la situación".

          "Pero tampoco eres uno de los lugareños. De lo contrario, ese hechizo suyo nos habría alertado en el momento en que sentimos tu presencia".

          Está hablando del hechizo que los organizadores del torneo lanzaron sobre cada uno de los participantes antes de teletransportarnos aquí. No se nos permite lastimar a los humanos que viven en este continente, por lo que su hechizo nos advierte cuando uno de ellos está cerca. Si se puede creer lo que dijeron, se supone que su hechizo nos detendrá incluso antes de que intentemos lastimar a cualquiera de los lugareños. Si es accidental, simplemente nos detiene antes de hacerlo. Si es intencional, nos elimina del torneo y nos envía de regreso.

          También se supone que su hechizo actúa como un medio de comunicación con los organizadores. Dijeron que transmitirían los objetivos a cada uno de nosotros individualmente. Es gracioso. Todos esos cuidadosos preparativos por su parte, y nunca se molestaron en comprobar si yo era un mago o no. Diablos, ¿qué estoy diciendo? Probablemente ni siquiera les importó.

          "Así que debes ser un participante, entonces", continúa Daren. "¿Qué razón tendrías para participar en un torneo contra los magos más poderosos del mundo?"

          Busco lo mismo que cualquier otro participante en este torneo, Daren, pero no estoy seguro de que sea prudente contártelo.
      - source: scene_text_2
        paragraph: 14
        text: |-
          Busco el premio que se ofrece al ganador. El Magium.

          Nadie sabe exactamente cómo se ve, o de qué está hecho, pero todo el mundo sabe que es la fuente de toda la magia del mundo, y que solo se puede encontrar en el continente de Varathia. Todos los magos lo buscan. Lo anhelan. Están seguros de que si tienen acceso a él, pueden aumentar sus poderes cien veces y convertirse en leyendas vivientes. Y aunque es un error común pensar que el Magium solo es útil para los magos instruidos, mis estudios me han llevado a creer que el Magium es tan extraordinario que incluso puede convertir a un humano normal en un mago.

          He buscado durante mucho tiempo una forma de entrar en Varathia, pero la única forma en que uno puede viajar a su continente es recibiendo una invitación directa. Se envían muy pocas de esas anualmente, y las personas que son teletransportadas allí se mantienen bajo supervisión directa durante la duración de su estadía, y regresan sin información sobre las coordenadas del lugar.

          Pero cuando toda esperanza parecía perdida, llegó el anuncio. Un anuncio mundial por parte de los reyes de Varathia de que estaban organizando un torneo donde cada mago en el mundo estaba invitado. Y al ganador se le concedería acceso al Magium.

          Supe entonces que nunca habría otra oportunidad como esta.

          "¿Por qué te uniste a este torneo, Barry?", me pregunta Daren de nuevo.
    choices:
      - position: 1
        text: Contarle la verdad
        effects:
