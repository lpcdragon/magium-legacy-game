            paragraph: 25
            text: |-
              "Oye, Wilhelm," digo. "¿Resulta que escuchaste a los guardias decir algo sobre los eventos de la arena?"

              "De hecho, sí," dice Wilhelm. "Anoche, mientras intentaba dormirme, escuché a dos guardias mencionar que podría haber algunas arpías y algunas manticoras en la primera ronda. Creo que también pude haberlos escuchado decir algo sobre gárgolas, pero no estoy completamente seguro."

              "Eso en realidad suena mejor de lo que esperaba," dice Bruce. "Quiero decir, las gárgolas son malas, claro, pero no son ni de cerca tan peligrosas como una hidra, por ejemplo."

              "Excepto por el hecho de que una hidra no puede volar," dice el mago. "Yo mucho preferiría pelear contra una hidra en tierra, que pelear contra una horda de criaturas voladoras sin magia ni armamento a distancia."

              "Esto no es todo lo que escuché decir a los guardias sobre la arena," dice Wilhelm. "También los escuché hablar sobre a quién nos enfrentaríamos en la segunda ronda. Aparentemente es un famoso mercenario trol conocido con el nombre de Velgos. Decían que ha peleado en la arena antes, y que se le considera a la par del campeón invicto de la arena."
          - source: scene_text_2
            paragraph: 14
            text: |-
              "¿Velgos?" dice Bruce. "Nunca he oído hablar de él."

              "Yo tampoco," dice el mago.

              "Si un trol es lo mejor que tienen," dice Bruce, "entonces quizás he estado sobreestimando un poco a los organizadores. He matado muchos troles antes. Todo lo que necesitas hacer es cortarles la cabeza. Es así de simple."

              "Olvida al trol," dice el mago. "Necesitamos concentrarnos en las criaturas. ¿Alguien conoce alguna debilidad que podamos usar contra ellas?"
