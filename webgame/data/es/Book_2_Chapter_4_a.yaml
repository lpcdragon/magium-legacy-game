  - name: b2_ch04a_remain
    routes:
      - condition: b2_ch4_backpack = 1
        texts:
          - source: scene_text
            paragraph: 53
            text: |-
              Olvida el cuaderno. Que yo sepa, podrían ni siquiera usar merodeadores en nuestra división, y solo estaría perdiendo el tiempo.

              Los merodeadores ahora se acercan cada vez más a los gladiadores, mientras las manticoras siguen volando en círculos, esperando la mejor oportunidad para atacar.

              Los guerreros parecen estar bastante bien organizados, y no se dejan intimidar por los monstruos. A la señal de su líder, tres de los hombres saltan a atacar al merodeador de la izquierda, mientras el resto de los gladiadores intenta distraer a los demás. Uno de los guerreros se queda atrás, y observa atentamente a las manticoras. Debe haber sido asignado para observar el campo de batalla, para que pueda advertir a sus compañeros si la situación cambia.

              Las criaturas parecidas a escorpiones son al menos cinco veces más grandes que los gladiadores, y probablemente podrían aplastar a cualquiera de ellos con sus garras gigantes. Los guerreros parecen ser experimentados en combate, sin embargo, y logran permanecer ilesos, anticipando los movimientos de los merodeadores, y cubriéndose unos a otros en momentos de necesidad. El grupo de la izquierda en particular parece estar haciéndolo sorprendentemente bien. Han logrado debilitar a la criatura con varios golpes bien sincronizados, y ya se están acercando para el golpe final.

              El más ágil de los tres salta sobre la espalda de la criatura y la apuñala ferozmente en la parte trasera de la cabeza. El merodeador grita de dolor e intenta atacar al guerrero con su cola, pero el gladiador salta, mientras los otros dos se lanzan y clavan sus espadas en ambos ojos del monstruo al mismo tiempo.
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch04a_mercy
      - condition: b2_ch4_backpack = 3
        texts:
          - source: scene_text
            paragraph: 54
            text: |-
              "Oye, Leila," digo. "¿Puedo pedirte un favor?"

              Leila se gira hacia mí, con una mirada curiosa en los ojos, esperando ver qué tengo que decir.

              "Había información escrita sobre merodeadores del desierto en mi cuaderno," digo, "pero no recuerdo algunos detalles importantes. ¿Podrías ir a sacar el cuaderno de mi mochila, arrancar las páginas sobre los merodeadores y traérmelas? Hay un índice al principio del cuaderno donde puedes encontrar los números de las páginas que buscas. Yo iría yo mismo, pero soy el que más ha estudiado sobre criaturas míticas, y me temo que me perderé algo importante si no veo las peleas."

              "Está bien, iré," escribe Leila. "Dame la llave."

              Saco la llave de mi casillero del bolsillo, y se la entrego a Leila.

              "El número del casillero está escrito en la llave," digo. "Has visto cómo es mi cuaderno, ¿verdad? Necesitarás tener una imagen clara de él en tu mente si quieres recuperarlo de la mochila."

              "Sí, lo he visto," escribe Leila. "Vuelvo enseguida."

              Luego sale del área de nuestra división y se dirige hacia el vestuario.

              Mientras había estado hablando con Leila, los merodeadores se habían acercado a los gladiadores. Las manticoras siguen volando en círculos, esperando la mejor oportunidad para atacar.
