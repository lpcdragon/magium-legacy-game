        texts:
          - source: scene_text
            paragraph: 15
            text: |-
              No, definitivamente no debería. La mayoría de ellos probablemente no estarían de acuerdo con que yo ayude a los lessathi, y probablemente se molestarían por ello. Es mejor guardármelo para mí. Aun así, no puedo evitar preguntarme quién será la adición de último momento a nuestra división, y cómo exactamente planean que él solucione todos mis problemas. Seguramente no esperan que algún lessathi se encargue de todas esas bestias solo, ¿verdad?

              Mientras estoy perdido en mis pensamientos, pasando mecánicamente las páginas de mi cuaderno una por una, mis ojos se topan con un párrafo que parece que me salté las últimas veces que estuve hojeando estos textos. Este párrafo menciona una teoría que no es muy popular entre los eruditos, que establece que la alta regeneración de algunas criaturas puede ser el resultado de una diferencia innata entre sus auras y las nuestras.

              De repente recuerdo la lección de Eiden, antes de que entráramos a la ciudad, cuando me decía que si alteras lo suficiente el aura de una persona, puedes incluso evitar que envejezca. Si lo que me dijo es cierto, entonces no sería tan descabellado asumir que un tipo especial de aura podría otorgar a alguien una alta tasa de regeneración. Si ese es el caso, ¿entonces esta aura quizás también podría ayudar a mantener las extremidades funcionales, incluso si son separadas del cuerpo?
          - source: scene_text_2
            paragraph: 10
            text: |-
              Admitiré que mi conocimiento sobre auras es limitado, pero por lo poco que sé, se supone que el aura de una persona no tiene un alcance ilimitado. ¿Qué pasaría, entonces, si la cabeza del trol fuera llevada demasiado lejos del cuerpo después de ser cortada? ¿Se desvanecería su conciencia? ¿Eso lo haría morir definitivamente? Si alguna vez logramos cortar la cabeza de ese trol de nuevo, definitivamente es algo que vale la pena probar.

              Terminé pasando el día tratando de buscar más información para confirmar mi teoría. Desafortunadamente, no se ha investigado mucho sobre este tema, ya que la mayoría de la gente apenas puede leer el nivel de poder mágico en el aura de alguien, así que la teoría de que un aura podría influir en la regeneración de un cuerpo ha sido considerada como 'sin fundamento en hechos' por la mayoría de los grupos respetables de eruditos, y los pocos que quisieron investigar esta teoría no recibieron el financiamiento apropiado para hacerlo.

              Pasé todo el día investigando esto, y todo lo que tengo para mostrar es una teoría extravagante, basada en otra teoría extravagante cuya validez depende mayormente de un comentario al pasar de Eiden. Mejor que nada, supongo...

              Guardo mi cuaderno de vuelta en mi mochila, y me preparo para dormir. Tendré más tiempo para estudiar mañana.
        choices:
