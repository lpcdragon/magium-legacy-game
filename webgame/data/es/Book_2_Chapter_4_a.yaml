  - name: b2_ch04a_himself
    routes:
      - condition: b2_ch2_heard = 1
        texts:
          - source: scene_text
            paragraph: 51
            text: |-
              Mientras estudio la información de camino de vuelta del vestuario, me doy cuenta de que los merodeadores del desierto en efecto no eran muy diferentes de los escorpiones gigantes. Incluso sus debilidades son las mismas. Supongo que todo este viaje no fue más que una enorme pérdida de tiempo.

              Cuando me acerco al área de mi división, noto al guardia esperándome donde lo dejé, y le devuelvo su papel.

              Luego vuelvo a entrar al área designada para mi división, y regreso hacia los barrotes metálicos, donde todos están viendo las peleas.

              Parece que tanto la primera como la segunda pelea de división ya terminaron. Todas las manticoras y los escorpiones están muertos, y también hay algunos cadáveres de puercoespines arqueros tirados en el suelo junto a ellos. Hadrik está siendo lanzado hacia arriba y hacia abajo por sus compañeros de equipo, mientras repiten su nombre sin cesar, y las multitudes vitorean a todo pulmón.

              "¿Qué está pasando aquí?" le pregunto a Leila.

              "Tu amigo enano acaba de derrotar a todos esos monstruos él solo," escribe Leila.
          - source: scene_text_2
            paragraph: 26
            text: |-
              "¿Él solo?" pregunto, sorprendido. "¿Qué pasó con la primera división?"

              "Fueron todos asesinados," escribe Leila. "Puedes ver sus cuerpos por allá."

              Luego señala hacia varios gladiadores muertos que están escondidos detrás de unos cadáveres de merodeadores.

              "Diablos..." digo. "Será mejor que nos preparemos, entonces. Será nuestro turno después de la siguiente división."

              Pasa aproximadamente un minuto más para que los vítores finalmente se calmen, y para que Hadrik y los demás bajen del escenario, para que la siguiente división pueda entrar al área de combate.
