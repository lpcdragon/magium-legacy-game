  - name: b2_ch04a_worried
    texts:
      - source: scene_text
        paragraph: 10
        text: |-
          "¿Y qué hay de Arraka? ¿No estaba preocupada por mí?"

          "¡Claro que estaba preocupada!" dice Arraka. "¡Me preocupo por ti todo el tiempo! Rezo todos los días para que alguien finalmente encuentre una cura para tu mórbida estupidez, ¡pero no he tenido suerte hasta ahora! ¡Sin embargo, no te desanimes! ¡Estoy segura de que eventualmente alguien te sacará de tu miseria!"

          "Gracias por tus amables palabras," le digo.

          "¡Oye, no hay de qué!" dice Arraka. "Además, ¿te importaría contarme cómo diablos lograste convencer al trol de que te dejara ir? Estaba segura de que estabas acabado cuando lo sentí acercarse a ti."

          "¿Te refieres a Velgos?" le pregunto. "¿El trol que no moriría ni aunque le cortaras la cabeza? Lo detuvo el dueño de la arena. Aparentemente quiere hacer un show de nuestra pelea, y pelearemos contra el trol en la segunda ronda de la arena."

