            paragraph: 23
            text: |-
              "En realidad hay algo de información que me gustaría compartir con ustedes," digo. "Pero más vale que se preparen, porque esto va a ser largo."

              Entonces empiezo a contarles a todos sobre nuestro viaje a las cavernas subterráneas, y lo que descubrimos ahí. Omití contarles cómo exactamente llegamos a los túneles, y tampoco les conté sobre nuestro encuentro con Flower e Illuna, pero intenté describir el resto de nuestra aventura con el mayor detalle posible, mientras simultáneamente evitaba darles cualquier información que pudiera llevarlos a saber que somos lessathi y que usamos dispositivos de estadísticas. Después de terminar con la historia, también les di un breve resumen de lo que sé sobre cada una de las criaturas que encontramos, incluyendo sus comportamientos y debilidades, y también les conté mi teoría sobre la inusual habilidad de regeneración del trol.

              "Esta es toda información muy útil," dice Wilhelm. "Resulta que anoche escuché a los guardias decir que pelearíamos contra un trol llamado Velgos en la segunda ronda, pero nunca me habría imaginado que fuera tan poderoso. Lo que me gustaría agregar es que también los escuché hablar sobre manticoras, las cuales no creo que hayan encontrado en las cavernas subterráneas. Si tu cuaderno tiene tanta información como has afirmado, quizás deberías investigar un poco sobre ellas también."

              "De hecho ya investigué sobre ellas," digo. "Olvidé mencionarlo antes, pero también logré escuchar a los guardias hablando sobre algunos de los monstruos contra los que podríamos tener que pelear en la arena. En esa conversación mencionaron manticoras y escorpiones gigantes. Les daré el informe sobre ellos más tarde."
          - source: scene_text_2
            paragraph: 13
            text: |-
              "Entonces, sobre esa trampilla que activaste accidentalmente," dice Bruce, "¿intentaste ver si podías activarla de nuevo?"

              "Lo intenté varias veces después de eso," escribe Leila, "pero no logré que funcionara."

              "¿Hay alguna posibilidad de que podamos echar un vistazo dentro de tu habitación?" dice Bruce. "Quizás alguno de nosotros pueda resolverlo."

              "No," escribe Leila. "No voy a dejar que ninguno de ustedes entre a mi habitación."

              "¿Excepto al stillwater?" dice el mago.

              "Excepto al stillwater," escribe Leila, simplemente.

              "Entonces nuestro mayor problema sigue siendo el trol..." dice Wilhelm. "No sé qué decir sobre esa teoría del aura. Realmente no soy quién para hablar, porque nunca he estudiado magia, pero me parece un poco rebuscada."

              "A mí me gusta más la idea de Leila sobre aplastar la cabeza," dice Bruce. "Dudo que pueda regenerarla una vez que haya sido cortada."

              "De cualquier forma," dice Wilhelm, "creo que en lo que todos podemos estar de acuerdo es en que no hay forma de que podamos enfrentar a estos enemigos solos. Sé que no nos soportamos mucho, pero vamos a tener que hacer una tregua hasta al menos después de los eventos de la arena. Nuestra supervivencia depende de ello."
          - source: scene_3
            paragraph: 2
            text: Por una vez, todos estuvieron de acuerdo con Wilhelm, aunque algunos lo hicieron más a regañadientes que otros, y decidimos pasar el resto del período de recreación discutiendo varias estrategias que podrían funcionar contra los monstruos que conocíamos, pero también contra otros monstruos sobre los que había leído en mis notas. Incluso acordamos tener una segunda reunión más tarde, después de pasar un tiempo a solas en nuestras habitaciones, reflexionando sobre la información que teníamos a nuestra disposición.
