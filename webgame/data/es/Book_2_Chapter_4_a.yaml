scenes:
  - name: b2_ch04a_intro
    effects:
      - set:
          successful_checks:
            - 'Punto de control alcanzado: Partida guardada.'
        condition: checkpoint_rich = 1
    routes:
      - condition: b2_ch2_cell = 1
        texts:
          - source: scene_text
            paragraph: 2
            text: |-
              La trampilla sobre nosotros se abre, permitiendo que la plataforma nos eleve lentamente a través de la gruesa capa de roca que forma el techo de la cueva. Una vez que nos acercamos al nivel de las celdas de nuestra división, una segunda trampilla se abre, y la plataforma reduce su velocidad hasta detenerse, al llegar finalmente a nuestro destino. Casi inmediatamente después de que se detiene, el ascensor cambia de dirección, y comienza a descender de vuelta hacia los niveles inferiores. Saltamos de la plataforma al suelo de la celda, mientras la trampilla se cierra, bloqueando el ascensor de nuestra vista.

              Al mirar a mi alrededor, me doy cuenta de que la habitación a la que hemos llegado no es en realidad la habitación de Leila, sino la mía. Supongo que fue bueno que elegí la celda número tres cuando el empleado del escritorio me preguntó. Si hubiera elegido la celda número cinco en su lugar, esta habitación probablemente habría sido tomada por el mago que fue encerrado aquí ayer.

              Mientras estamos de pie en medio de mi habitación, un pequeño charco comienza a formarse bajo nuestros pies, debido al agua que gotea de nuestra ropa.
          - source: scene_text_2
            paragraph: 2
            text: |-
              "Deberíamos cambiarnos," digo, mientras saco la llave de mi habitación del bolsillo y voy a abrir la puerta. "También quiero revisar mi cuaderno, para ver si puedo encontrar alguna información útil sobre las criaturas que vimos en las cavernas. Te veré en unas horas, para contarte lo que encontré."

              Leila asiente.

              "Hasta luego," escribe Leila, y sale de mi habitación, dirigiéndose hacia la suya.

              Lo primero que hago después de que se va es buscar en mi mochila una camisa seca y un par de pantalones nuevos.
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch04a_technically
                  checkpoint_rich: 0
      - condition: b2_ch2_cell <> 1
        texts:
          - source: scene_text
            paragraph: 3
            text: |-
              La trampilla sobre nosotros se abre, permitiendo que la plataforma nos eleve lentamente a través de la gruesa capa de roca que forma el techo de la cueva. Una vez que nos acercamos al nivel de las celdas de nuestra división, una segunda trampilla se abre, y la plataforma reduce su velocidad hasta detenerse, al llegar finalmente a nuestro destino. Casi inmediatamente después de que se detiene, el ascensor cambia de dirección, y comienza a descender de vuelta hacia los niveles inferiores. Saltamos de la plataforma al suelo de la celda, mientras la trampilla se cierra, bloqueando el ascensor de nuestra vista.

              "¿Q-q-qué está pasando?" escuchamos una voz proveniente de detrás de nosotros. "¿Cómo llegaron aquí? ¿Y cómo diablos se mojaron tanto?"

              Cuando tanto Leila como yo nos damos la vuelta, rápidamente nos damos cuenta de que el ascensor en realidad no nos llevó de vuelta a la habitación de Leila. En cambio, nos llevó a la celda número tres, que es una de las habitaciones que el empleado del escritorio me ofreció elegir cuando llegué aquí por primera vez, y también la habitación que actualmente está siendo habitada por el mago que fue encerrado aquí ayer.
          - source: scene_text_2
            paragraph: 3
            text: |-
              El mago nos mira con una expresión algo asustada, mientras un hilo de sudor le corre por la frente, y parece estar escondiendo algo detrás de su espalda.

              "Perdón por la molestia," le digo al mago. "Salimos a nadar y nos perdimos de camino de vuelta. Nos iremos de aquí tan pronto como nos abras esa puerta."

              "¿Salieron a nadar?" pregunta el mago, impactado. "Estaban intentando escapar, ¿verdad? Denme una buena razón por la que no debería llamar a los guardias ahora mismo, y contarles lo que estaban haciendo."
        choices:
          - position: 1
            text: Si nos dejas ir, no preguntaré nada sobre eso que estás escondiendo detrás de tu espalda.
            effects:
              - set:
                  current_scene: b2_ch04a_hiding
                  checkpoint_rich: 0
          - position: 2
            text: Adelante. El dueño de la arena ya sabe lo que pasó.
            effects:
              - set:
                  current_scene: b2_ch04a_owner
                  checkpoint_rich: 0
  - name: b2_ch04a_hiding
    texts:
      - source: scene_text
        paragraph: 4
        text: |-
          "Si nos dejas ir, no preguntaré nada sobre eso que estás escondiendo detrás de tu espalda."

          "¿Qué cosa?" grita el mago. "¡No estoy escondiendo nada detrás de mi espalda!"

          "No va a funcionar," escribe Leila, mientras mira directamente al mago.

          "¿Qué es lo de la escritura?" pregunta el mago, confundido, mientras mira a Leila. "¿Así es como hablas? ¿Qué es lo que no va a funcionar?"

          Leila se agacha para recoger un objeto del suelo que parece haber sido hecho pegando varias piezas de chatarra de la forma más aleatoria posible. El objeto es lo suficientemente pequeño para caber en su palma, así que lo agarra con una mano, y estira su brazo hacia el mago, acercando el objeto de metal a unos centímetros de su cara.

          "Esto," escribe Leila. "Esto es lo que no va a funcionar."

          "No sé de qué estás hablando," dice el mago, fingiendo ignorancia. "Eso es solo un trozo de chatarra."
      - source: scene_text_2
        paragraph: 4
        text: |-
          "No," escribe Leila. "Este es un dispositivo diseñado para mejorar tus habilidades físicas por un tiempo limitado. Y eso que estás escondiendo detrás de tu espalda probablemente está destinado a actuar como un puente entre tú y tu dispositivo de chatarra, permitiéndote transferir tu energía mágica hacia él durante un período de tiempo."

          "¿Cómo sup--" empieza a decir el mago, pero se detiene cuando ve un nuevo texto aparecer frente a él.

          "No puedes usar este dispositivo en la arena," escribe Leila. "Será detectado de inmediato. Si no logras que de alguna manera se enlace directamente a tu aura mágica, la energía mágica que estallará del dispositivo cuando lo actives disparará todas las alarmas mágicas en un radio de ocho kilómetros. De cualquier forma, incluso si logras que funcione, el dispositivo está tan mal hecho que no podrás usarlo por más de unos minutos, incluso si pasas todo el día cargándolo."

          "¡Unos minutos son más que suficiente en una arena!" grita el mago. "¡Unos minutos pueden significar la diferencia entre la vida y la muerte! ¡No sabes lo aterrador que puede ser una arena! ¡No tienes idea! ¡Si puedo obtener aunque sea la más mínima ventaja de este dispositivo, lo usaré con gusto!"
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch04a_meeting
  - name: b2_ch04a_owner
    texts:
      - source: scene_text
        paragraph: 5
        text: |-
          "Adelante. El dueño de la arena ya sabe lo que pasó."

          "¡Estás mintiendo!" dice el mago. "¡Apuesto a que ni siquiera sabes cómo se ve el dueño!"

          "No va a funcionar," escribe Leila, mientras mira directamente al mago.

          "¿Qué es lo de la escritura?" pregunta el mago, confundido, mientras mira a Leila. "¿Así es como hablas? ¿Qué es lo que no va a funcionar?"

          Leila se agacha para recoger un objeto del suelo que parece haber sido hecho pegando varias piezas de chatarra de la forma más aleatoria posible. El objeto es lo suficientemente pequeño para caber en su palma, así que lo agarra con una mano, y estira su brazo hacia el mago, acercando el objeto de metal a unos centímetros de su cara.

          "Esto," escribe Leila. "Esto es lo que no va a funcionar."

