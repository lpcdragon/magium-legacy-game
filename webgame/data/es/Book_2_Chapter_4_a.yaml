            paragraph: 62
            text: |-
              Poco antes de que la siguiente división sea anunciada, Leila finalmente regresa del vestuario, con unas cuantas páginas de mi cuaderno en la mano.

              "Perdona la tardanza," escribe Leila. "Un guardia me retuvo de camino a los casilleros. Tuvo que ir a buscarme un pase del dueño antes de que pudiera continuar."

              "No hay problema," le digo. "¿Son todas las páginas?"

              "Es todo lo que pude encontrar," escribe Leila. "Comportamientos, debilidades y algunos diagramas."

              "Perfecto," le digo. "Es todo lo que necesitamos."

              Tomo las notas de sus manos y las estudio detenidamente.

              No me toma mucho darme cuenta de que los merodeadores del desierto efectivamente no eran muy diferentes de los escorpiones gigantes. Incluso sus debilidades son las mismas. Supongo que todo este viaje al que mandé a Leila resultó ser nada más que una enorme pérdida de tiempo.
