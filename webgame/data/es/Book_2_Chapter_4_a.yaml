  - name: b2_ch04a_backpack
    routes:
      - condition: ch6_secure = 1
        texts:
          - source: scene_text
            paragraph: 47
            text: |-
              ¿Debería ir a buscarlo? Si van por orden del número de división, entonces todavía debería quedar bastante tiempo hasta que sea nuestro turno de entrar a la arena. Pero si me voy ahora, me voy a perder las peleas. Si voy a pelear contra estas criaturas, observarlas en acción puede ser crucial para mi supervivencia.

              ¡Maldición! Si tan solo no le hubiera dicho a Daren que asegurara mi mochila, podría haber mandado a Leila a revisar el cuaderno por mí. Supongo que no tiene sentido pensar en eso ahora. Lo hecho, hecho está. Solo hay dos opciones. O voy a leer mi cuaderno, o me quedo aquí y veo las peleas.
        choices:
          - position: 1
            text: Quedarme aquí y ver las peleas.
            effects:
              - set:
                  ac_b2_ch4_risk: 1
                achievement:
                  id: ac_b2_ch4_risk
                  title: Un riesgo calculado
                condition: b2_ch2_heard = 1
              - set:
                  current_scene: b2_ch04a_remain
                  b2_ch4_backpack: 1
          - position: 2
            text: Ir a leer el cuaderno.
            effects:
              - set:
                  current_scene: b2_ch04a_read
                  b2_ch4_backpack: 2
      - condition: ch6_secure = 0
        texts:
          - source: scene_text
            paragraph: 48
            text: |-
              ¿Debería ir a buscarlo? Si van por orden del número de división, entonces todavía debería quedar bastante tiempo hasta que sea nuestro turno de entrar a la arena. Pero si me voy ahora, me voy a perder las peleas. Si voy a pelear contra estas criaturas, observarlas en acción puede ser crucial para mi supervivencia.

              ¡Un momento, también tengo otra opción! Podría mandar a Leila a leer mi cuaderno, y arrancar las páginas que necesito, para que me las traiga de vuelta. ¿Pero podría encontrar las páginas? Sí hice un índice de páginas al principio, pero a la gente le ha costado entender mi horrible letra en el pasado. No puedo simplemente decirle que me traiga el cuaderno, porque entonces quizás no tenga tiempo de devolverlo a mi mochila antes de que empiece nuestra ronda. De cualquier manera, no tengo mucho tiempo. Voy a tener que decidir qué quiero hacer.
