  - name: b2_ch04a_concentrate
    routes:
      - condition: b2_ch4_inform3 = 0 AND b2_ch4_inform2 = 0
        texts:
          - source: scene_text
            paragraph: 67
            text: |-
              Los aplastadores han terminado su primera vuelta por la arena, y ahora vuelven hacia Daren para una segunda ronda. Algunos de sus compañeros de equipo lograron evadir la estampida, pero dos de ellos no tuvieron tanta suerte, y fueron aplastados hasta morir antes de poder salir del peligro. Daren espera pacientemente hasta el último momento una vez más, y luego atraviesa a la criatura con su espada por el costado, partiéndola por la mitad. Las multitudes se vuelven locas una vez más.

              Al ver que la primera oleada de bestias ya está siendo manejada, el presentador señala el inicio de la segunda oleada. Tres cobras gigantes ahora se abren paso hacia Daren, mientras los aplastadores deciden perseguir a los blancos más fáciles. Las cobras son más altas y más anchas que Daren, pero su tamaño no es lo único peligroso de ellas. Por las manchas negras en sus cuellos, estoy casi seguro de que estas son en realidad cobras escupe-ácido, y no cobras normales.

              El ácido que viene de las cobras no es tan fuerte como el ácido de los hechizos de los magos, pero definitivamente no es algo que deba tomarse a la ligera. Aunque quizás no dañe significativamente armas y armaduras que hayan sido suficientemente encantadas, ese ácido puede quemar la mayoría de los metales regulares en cuestión de minutos, y puede quemar la carne humana en cuestión de segundos.
          - source: scene_text_2
            paragraph: 36
            text: |-
              Al enfrentarse ahora a atacantes a distancia, Daren decide que ya no es seguro mantener su posición, y cambia a la ofensiva. Avanzando lentamente, con su escudo al frente, Daren cierra gradualmente la distancia entre él y las cobras, hasta que queda lo suficientemente cerca como para poder hacer un ataque de embestida. Las cobras le han estado escupiendo todo este tiempo, pero a juzgar por el impacto que ha tenido en el escudo de Daren, bien podrían haber estado rociando agua.

              Daren se lanza hacia una de las cobras, y le corta la cabeza de un solo golpe. Antes de que las otras dos logren atacarlo, golpea a una con su escudo, mientras apuñala a la otra por la boca con su espada. Luego se asegura de que la tercera cobra todavía esté aturdida, y la remata también, con un tajo bien cronometrado de su espada.

              Mientras Daren estaba ocupado con las cobras, los otros gladiadores habían logrado derribar a uno de los aplastadores por su cuenta. Al ver que los otros aplastadores no planean atacarlo más, Daren decide ir a ayudar a los demás a matar a las criaturas restantes.

              "¡Si ninguno de ustedes va a entrar en razón, entonces pelearé solo!" grita Bruce de nuevo, esta vez más fuerte que antes. "¡No pienso dejarme matar para salvarles el trasero!"

              "Dudo mucho que alguien estuviera contando con tu ayuda para empezar," dice Wilhelm. "¿Ahora podrías guardar silencio, por favor? Nuestra batalla comenzará pronto, y me gustaría concentrarme."

              Genial. Nuestra pelea ni siquiera empezó todavía, y nuestro equipo ya se está desmoronando. Lo sabía desde el principio: no se puede confiar en esta gente.
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch04a_silence
