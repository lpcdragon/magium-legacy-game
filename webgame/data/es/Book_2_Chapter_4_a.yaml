  - name: b2_ch04a_trace
    routes:
      - condition: b2_ch2_kate = 0
        texts:
          - source: scene_text
            paragraph: 35
            text: |-
              Pensé que este sería el mejor momento para organizar un encuentro entre Leila y Kate, así que le dije a Leila que quería que conociera a algunos de mis amigos antes del evento, y le pedí que me siguiera. Pareció un poco desconfiada de mis motivos al principio, pero al final, decidió venir conmigo.

              El área a la que nos dieron acceso era la zona justo debajo de los asientos de los espectadores, rodeando el área donde la lucha estaba a punto de tener lugar. El área de combate reservada para los gladiadores se ve mucho más grande que las de las arenas sobre las que había leído antes, en los libros de historia. El anfiteatro que rodea la arena parece lo suficientemente grande como para albergar treinta mil espectadores, si no más, y aun así, no parece que los asientos corran peligro de no llenarse. Incluso a esta hora tan temprana de la mañana, hay miles de espectadores entrando a raudales por todas las entradas, y luego abriéndose paso por las gradas ascendentes, ansiosos por llegar a sus lugares reservados, y ver el evento del siglo.

              Parece que tres días fueron más que suficientes para correr la voz por toda la ciudad sobre el evento de hoy. Nos abrimos paso por el nivel inferior del coliseo, mientras miro a mi alrededor, escaneando los grupos de gladiadores para ver si puedo reconocer a alguien.
          - source: scene_text_2
            paragraph: 16
            text: |-
              Media hora después, todavía no estamos ni cerca de encontrar rastro de ellos. También intenté contactarlos a través del transceptor de Daren, pero no tuve suerte. Debe haber demasiada gente intentando usar transceptores en la zona como para poder captar las señales correctas. ¿Dónde podrán estar todos? El cuerno que anuncia el inicio de los eventos podría sonar en cualquier momento.

              "¿Leila?" escucho la voz de Kate detrás de mí. "Leila, ¿de verdad eres tú?"

              Leila se da la vuelta al escuchar la voz de Kate, pero cuando ve su rostro, parece congelarse de la impresión.

              "¿Kate?..." escribe Leila, pero no le da tiempo a escribir nada más, porque Kate viene corriendo hacia ella, y luego la abraza tan fuerte como puede.
        choices:
