  - name: b2_ch04a_silence
    routes:
      - condition: b2_ch2_deal = 1
        texts:
          - source: scene_text
            paragraph: 68
            text: |-
              Hay un estallido de vítores muy fuerte proveniente del exterior. Parece que Daren y los demás gladiadores sobrevivientes finalmente han derrotado a todas las criaturas. El presentador les señala que abandonen el área de combate, para que el espectáculo pueda continuar.

              Mientras Daren y los demás se preparan para irse, un hombre vestido con una túnica azul oscuro con una capucha en la cabeza viene por detrás de mí, y se une a mi lado junto a la reja metálica.

              "¿Quién eres?" le pregunto, aunque probablemente ya pueda adivinar la respuesta.

              "Soy una adición de último momento a su división," dice el hombre. "He sido enviado aquí para resolver sus problemas."

              El hombre lleva dos guadañas en las manos, que tienen zafiros incrustados en sus empuñaduras.

              "¿Te enviaron los lessathi?" le pregunto en voz baja, para asegurarme de que ninguno de los demás me escuche. "¿En qué estaban pensando? No me digas que planeas pelear contra todos los monstruos tú solo."

              "Cumpliré nuestra parte del trato," dice el lessathi. "Asegúrate de cumplir la tuya cuando llegue el momento."

              "Eh, sí," digo. "Sí, por supuesto..."

              El lessathi de repente gira la cabeza hacia mí, con una expresión de shock y rabia en los ojos.

              "¡Estás mintiendo!" dice.

              "¿Qué?" le pregunto. "¡No, estaba diciendo la verdad!"
          - source: scene_text_2
            paragraph: 38
            text: |-
              "¡Eres un necio!" grita el lessathi. "¡Cualquier persona con habilidades pasables en lectura de auras podría notar que estás mintiendo por la forma en que tu aura está temblando ahora mismo! ¿No tienes idea de lo que les pasa a las personas que nos mienten? Debería matarte ahora mismo por tu insolencia."

              "Oye, ¿qué está pasando aquí?" pregunta Bruce, después de escuchar los gritos del lessathi. "¿Quién eres, y qué haces en nuestra división?"

              El lessathi se calma, y guarda sus guadañas cuando ve a Bruce confrontarlo. Parece que a pesar de su comentario anterior, preferiría evitar un conflicto que atrajera demasiada atención hacia él.

              "El trato se cancela," dice el lessathi, mientras sale del área de nuestra división. "Disfruten su última pelea."

              Luego se va por la puerta, sin decir otra palabra.

              "Maldita sea, ¿quién era ese?" dice Bruce. "¿Qué quería?"

              "Ni idea," digo.

              Leila me mira con sospecha, pero no dice nada. Mientras tanto, los barrotes frente a nosotros finalmente se están levantando.

              Todos nos dirigimos hacia el centro de la arena, como todas las divisiones antes que nosotros.
          - source: scene_3
            paragraph: 6
            text: |-
              "¡Damas y caballeros, les presento a la cuarta división!" dice el presentador.

              La multitud nos observa en completo silencio, mientras nos abrimos paso entre todos los cadáveres de animales, para llegar a nuestro destino. Está claro que no reconocen a nadie de nuestra división. Probablemente ya están pensando que nos van a masacrar, como a esa primera división de antes. Espero que no terminemos dándoles la razón.
