  - name: b2_ch04a_change
    texts:
      - source: scene_text
        paragraph: 11
        text: |-
          "¿Por qué?" digo. "¿Encontraste su cuerpo?"

          "...No," dice Kate. "No lo encontré."

          "Bueno, entonces," digo, "supongo que no te haría daño conocerla, ¿verdad? Podrás decidir por ti misma si realmente es ella cuando la veas de cerca."

          "Está bien, Barry," dice Kate. "Accederé a conocerla. Pero ten cuidado con ella. No puedes estar seguro de que realmente sea ella. Había muchos lessathi en esa institución que sabían de nosotras. La información podría haberse filtrado de muchas maneras."

          "Bien, tendré cuidado," digo. "Te veré en la arena, mañana. ¡No llegues tarde!"

          "Nos vemos mañana," dice Kate, simplemente, y luego ambos cerramos la transmisión.

          Una vez que me aseguro de que cada uno de mis amigos sepa sobre los monstruos de la arena y sus debilidades, decido que es hora de volver con Leila, para finalmente formular un plan sobre cómo lidiar con los eventos de mañana. Cuando llego a su habitación, toco tres veces, y ella abre su puerta, vestida con la misma ropa que llevaba cuando volvimos de las cavernas. Su ropa no está tan mojada como cuando regresamos, pero definitivamente no está ni cerca de estar seca todavía.

          "¿No te cambiaste?" le pregunto, impactado.
      - source: scene_text_2
        paragraph: 7
        text: |-
          "No tengo ropa de repuesto," escribe Leila. "No llevaba mochila cuando me capturaron."

          "Bueno, ¿por qué no dijiste algo?" digo. "¡Podrías haberme pedido algo de ropa prestada hasta que la tuya se secara!"

          "No quería ser una molestia," escribe Leila.

          "Espera un momento," digo. "Si no tienes mochila, ¿qué hay de la comida? No me digas que no has comido nada desde que llegaste aquí."

          "Los guardias me han proporcionado un suministro mínimo de comida y agua," escribe Leila. "Justo lo suficiente para sobrevivir. No es un problema."

          "Claro que es un problema," digo. "Espera aquí, voy a traerte ropa para cambiarte y algo de comida."

          "No, no tienes que--" empieza a escribir Leila, pero la ignoro, y vuelvo a mi habitación en busca de algo de ropa y un poco de cecina de mi mochila.

          Luego vuelvo con Leila y le entrego una camisa de manga larga, un par de pantalones, la cecina y una botella de agua.

          "Aquí tienes," le digo a Leila. "Ahora apúrate y cámbiate, ¿quieres? No querrás pescar un resfriado justo antes de la arena."

          "Gracias..." escribe Leila, mientras toma lo que le di, y luego cierra la puerta para cambiarse.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch04a_troll
  - name: b2_ch04a_troll
    texts:
      - source: scene_text
        paragraph: 12
        text: |-
          Abre la puerta un poco después, vestida con mi ropa, con las mangas largas de la camisa colgando más allá de sus manos, y los pantalones arrastrándose por el suelo detrás de ella.

          "Esta ropa es... un poco grande para mí," escribe Leila.

          "¡Te ves bien!" le digo. "No es como si fueras a pelear con esta ropa en el evento de la arena. Es solo hasta que tu propia ropa se seque. Vamos, entremos. Quiero contarte lo que descubrí mientras leía mi cuaderno."

          Ambos entramos a su habitación, y paso los siguientes quince minutos contándole las partes más importantes de mis hallazgos. Escucha atentamente lo que tengo que decir, mientras de vez en cuando le da un mordisco a la cecina que le di. Después de que termino de hablar, deja la cecina en la cama, a su lado, y empieza a escribir.

          "Por lo que me dices," escribe Leila, "entiendo que nuestro mayor problema con diferencia será el trol, y su regeneración superior a la normal."

          "Sí," le digo. "Ya se sabe que un trol puede regenerarse lo suficientemente rápido como para no morir de una herida en el corazón, pero que un trol pueda sobrevivir con la cabeza cortada es algo que no creía posible. Supongo que muestra lo poco que realmente sabemos sobre la regeneración en general. Según todos los libros que he leído, cualquier ser vivo al que le hayan separado la cabeza de su cuerpo no debería poder vivir más, independientemente de lo alta que sea su regeneración. El hecho de que el cuerpo pudiera regenerar su cabeza contradice nuestro conocimiento más básico sobre cómo se supone que funciona el cuerpo de un trol."
      - source: scene_text_2
        paragraph: 8
        text: |-
          "Pero el trol no regeneró su cabeza," escribe Leila. "La cabeza siguió hablando desde el suelo, y el cuerpo tuvo que recogerla."

          "¡Tienes razón!" digo. "Esto significa que el enlace entre el cuerpo y la cabeza de alguna manera no se rompe, incluso después de que los dos se separan. Quizás podamos usar esto. Si el trol todavía usa su cabeza para ver y oír incluso después de ser separada del cuerpo, entonces quizás podamos cortarle la cabeza, recogerla, y luego vendarle los ojos, o algo así, ¡dejando su cuerpo indefenso!"

          "No creo que el trol se dejaría atrapar así de nuevo, en la arena," escribe Leila. "Usé el elemento sorpresa antes, pero ahora sabe lo rápida que soy, y no me dejará cortarle la cabeza de nuevo tan fácilmente."

          "Bueno, la única forma de matar a un trol común," digo, "es cortándole la cabeza o quemándolo vivo. Si cortar la cabeza no es una opción, entonces la única alternativa que nos queda es el fuego. Dicho esto, conseguir acceso a cualquier tipo de llamas será prácticamente imposible en la arena, y ese trol incluso lleva armadura anti-magia, que le da protección contra el fuego. Incluso si de alguna manera logramos encontrar una forma de quemarlo, primero tendríamos que dañar su armadura lo suficiente como para que las protecciones mágicas sobre ella se desgasten."

          "¿Crees que deberíamos hablar de todo esto con los otros miembros de nuestra división?" escribe Leila. "Quizás podrían tener algunas ideas."
    choices:
