            paragraph: 43
            text: |-
              Nos dirigimos al área de nuestra división, donde todos nuestros demás compañeros de equipo ya se habían reunido. Luego tomamos nuestros lugares junto a las rejas de hierro que bloquean nuestro acceso al área de combate, para tener una mejor vista de lo que sucede en la arena. Al parecer, todavía hay algunas personas abriéndose camino hacia sus asientos, pero la mayoría de los espectadores parecen haber encontrado sus lugares, y ahora esperan inquietos a que comience el espectáculo. Echo un vistazo para ver si puedo localizar a Flower, pero los asientos están demasiado lejos de mí como para poder distinguir ningún detalle. El presentador está verificando su amplificador de voz mágico, en preparación para el evento. Está situado en una plataforma elevada, por encima de los asientos de los espectadores.

              Mientras todos esperamos a que los eventos comiencen, de repente escucho un pitido familiar, proveniente de mi bolsillo. Al mismo tiempo, un pitido similar viene de la dirección de Leila también.

              Por fin. He estado esperando esto desde hace un tiempo.
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch04a_private
  - name: b2_ch04a_private
    texts:
      - source: scene_text
        paragraph: 44
        text: |-
          Una vez que termino con mi dispositivo de estadísticas, lo guardo de vuelta en mi bolsillo, y veo que Leila también está a punto de terminar con el suyo. Conociéndola, debe haber puesto todos sus puntos en resistencia. Le preguntaría directamente, pero no querría revelarle a los demás el hecho de que somos lessathi.

          "¿Encontraron una forma de mandarse mensajes en privado?" nos pregunta Bruce, después de vernos a los dos usar el mismo tipo de dispositivos al mismo tiempo. "Bueno, espero que hayan dicho lo que necesitaban, porque el espectáculo está a punto de empezar."

          Poco después de que Bruce termina de hablar, escuchamos el sonido de un segundo cuerno, ahora señalando el verdadero inicio del evento. Los pocos espectadores que llegaron tarde ahora se apresuran lo más rápido que pueden hacia sus asientos, mientras el presentador hace unas pruebas, para asegurarse de que su amplificador de voz funciona correctamente. Pronto, el murmullo constante que se podía escuchar por toda la arena lentamente se apaga, y el presentador toma una respiración profunda, preparándose para anunciar oficialmente el inicio del evento de la arena.

          "Bienvenidos," dice el presentador. "¡Bienvenidos todos! No creo que haya razón para hacer una larga introducción en esta ocasión. Todos saben por qué están aquí. Vinieron porque se les prometió el evento del siglo, y planeamos cumplir esa promesa. Ahora, si a todos les parece bien, me gustaría comenzar anunciando las reglas."

          El presentador espera unos momentos, para asegurarse de que no haya objeciones, y luego continúa leyendo de su libreta.
      - source: scene_text_2
        paragraph: 20
        text: '"Por petición del mismísimo dueño de la arena, el señor Venard," dice el presentador, "el evento de hoy seguirá las reglas tradicionales, que fueron utilizadas por su padre antes que él y por los lessathi de antaño, antes del invierno inmóvil. Como la mayoría de ustedes ya sabrá, esto también significa que si un gladiador rompe una de las reglas, no será descalificado de seguir participando, sino que se convertirá en un indeseable. Al convertirse en indeseable, un gladiador será obligado a participar en una ronda adicional después de que termine el evento oficial, donde tendrá que pelear contra todos los demás gladiadores restantes a la vez, en una batalla final. Cualquier gladiador que logre dar el golpe de gracia a un indeseable será recompensado ya sea con su libertad, o con una gran suma de dinero, dependiendo de su estatus en esta arena. Otros gladiadores, por supuesto, pueden negarse a participar en esta ronda final, y los indeseables también pueden elegir no participar más en las rondas regulares, una vez que hayan sido marcados como infractores de las reglas."'
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch04a_undesirables
  - name: b2_ch04a_undesirables
    texts:
      - source: scene_text
        paragraph: 45
        text: |-
          El presentador tose fuerte, y pasa la página de su libreta.

          "Por supuesto," continúa el presentador, "esto no significa que los gladiadores ahora estén exentos de seguir las reglas generales de la arena. Si un gladiador es sorprendido usando magia, si intenta matar a sus compañeros de equipo, o si ataca a alguno de los espectadores, será ejecutado en el acto. La regla de los indeseables solo aplica para las reglas del evento en sí. Prosiguiendo, las reglas tradicionales de la arena establecen que los eventos de la arena deben dividirse en exactamente tres rondas. La primera ronda, como estoy seguro de que ya les han dicho, se peleará contra una variedad de criaturas míticas que nunca antes se han usado en esta arena. Sin embargo, tenemos una sorpresa para la segunda ronda. Para esta ocasión especial, en lugar de nuestro campeón reinante, creo que les alegrará saber que el guerrero que nos acompañará no es otro que ¡el implacable mercenario Velgos!"

          Hay un fuerte murmullo entre la multitud cuando escuchan el nombre de Velgos. Por lo que puedo notar, parecen emocionados ante la posibilidad de verlo pelear.

          "En la tercera ronda," dice el presentador, "los gladiadores que sobrevivan las dos primeras rondas tendrán que pelear en una serie de duelos, para decidir quiénes serán los vencedores de este evento. Algunos de los duelos deberán pelearse a muerte, mientras que otros se pelearán solo hasta que uno de los combatientes se rinda. Los duelos exactos se decidirán después del final de la segunda ronda, cuando sepamos exactamente cuáles de los combatientes han sobrevivido. Y ahora que ya terminamos con todas las presentaciones, creo que finalmente es hora de comenzar este evento. ¿Están todos listos?"
      - source: scene_text_2
        paragraph: 21
        text: |-
          La multitud estalla en fuertes vítores por unos segundos, y el presentador ahora alza la voz, para ahogar todos los ruidos fuertes.

          "Entonces no los haré esperar más," dice el presentador. "¡Que comience el evento del siglo!"

          Uno de los portones de hierro del nivel inferior del anfiteatro está siendo lentamente levantado, mientras las multitudes siguen vitoreando tan fuerte como pueden.

          "Para la primera ronda," dice el presentador, "las divisiones de combatientes entrarán a la arena una por una, en el orden del número de su división. ¡Demos una cálida ronda de aplausos a la primera división de este evento!"
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch04a_manticores
  - name: b2_ch04a_manticores
    routes:
      - condition: b2_ch2_heard = 1 AND b2_ch4_inform2 = 0 AND b2_ch4_inform3 = 0
        texts:
          - source: scene_text
            paragraph: 46
            text: |-
              Hay una mezcla de aplausos y gritos proveniente de los asientos de los espectadores, mientras los gladiadores de la primera división salen por los portones, y se dirigen hacia el centro de la arena. No reconozco a ninguno de los guerreros en esta división, pero a juzgar por los continuos vítores de la multitud, diría que la mayoría de los espectadores los han visto actuar al menos una vez antes. Algunos de los gladiadores parecen un poco demasiado confiados. ¿Ex-vencedores, quizás? De cualquier forma, más les vale ponerse las pilas, y rápido. Por lo que dijo Bruce en mi primer día aquí, los eventos hasta ahora ni siquiera se podrían comparar con lo que viene.

              Una gran reja de hierro en el lado opuesto de la arena hace un fuerte chirrido al abrirse. Desde más allá del portón, un león con alas negras, ojos rojos, dos cuernos en la cabeza y una cola de escorpión se abre paso hacia el área de combate. La manticora no pierde tiempo, y se eleva directamente hacia el cielo. Dos manticoras más la siguen, y todas comienzan a circular por los cielos sobre la arena, observando atentamente a sus presas. Al ver a las bestias abandonar el área de combate con tanta facilidad, algunos de los espectadores entre la multitud empiezan a mostrar señales de inquietud.

              "No se preocupen," dice el presentador, intentando calmar a la multitud. "Estas bestias han sido bien entrenadas. No se atreverían a poner sus garras sobre nadie que no sean los gladiadores en la arena."

              Varios escorpiones gigantes ahora también se unen a la arena, viniendo de más allá del mismo portón por el que entraron las manticoras. Avanzan lentamente hacia los guerreros, en línea recta, sin ningún intento de rodearlos.
          - source: scene_text_2
            paragraph: 22
            text: |-
              Menos mal que escuché a los guardias hablar sobre los escorpiones mientras estaba en mi celda. He tenido todo el tiempo del mundo para prepararme contra ellos, y también le conté a Leila toda la información que necesitaba saber sobre ellos.

              Al menos en lo que respecta a los escorpiones gigantes, no deberíamos tener ningún... ¡Oye, espera un momento! Esos no son escorpiones gigantes... Esos no son escorpiones gigantes para nada. Son merodeadores del desierto. ¡Malditos guardias idiotas! ¿No podrían notar la diferencia?

              Está bien... ¡Cálmate! Los merodeadores del desierto son básicamente escorpiones gigantes con cabezas más pequeñas. Deberían tener más o menos los mismos comportamientos. ¿Pero también tienen las mismas debilidades? Creo que sí, pero no estoy completamente seguro. Si tan solo tuviera mi cuaderno conmigo ahora...
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch04a_backpack
