        effects:
          - set:
              current_scene: b2_ch04a_trash
  - name: b2_ch04a_trash
    texts:
      - source: scene_text
        paragraph: 56
        text: |-
          La discusión entre lo que supongo es un gladiador de la segunda división y un guardia de la arena está generando muchas reacciones de los espectadores. Algunos de ellos parecen estar asustándose, y otros se mueven nerviosamente en sus asientos.

          "Parece que estamos experimentando algunas dificultades técnicas," dice el presentador. "No hay razón para alarmarse. Estoy seguro de que nuestros guardias pondrán el espectáculo en marcha de nuevo en--"

          El presentador se detiene a mitad de frase, cuando un único enano sale por el portón de la segunda división, llevando una botella en la mano, y caminando a paso tranquilo, hacia los merodeadores del desierto. Tanto la multitud como el presentador caen en completo silencio, mientras observan a Hadrik caminar tranquilamente, y luego detenerse en medio de la arena, para beberse de un trago el último contenido de su botella.

          "¡Ah!" exclama Hadrik. "¡No hay nada como una buena botella de cerveza enana para abrirte el apetito antes de una batalla!"

          Luego empieza a girar la cabeza, como si estuviera buscando algo.

          "Oigan, ¿no tendrán por casualidad algo donde pueda tirar esta botella vacía?" le grita al presentador, mientras le muestra la botella vacía en su mano.

          El presentador lo observa, con una expresión desconcertada en el rostro, sin decir nada.
      - source: scene_text_2
        paragraph: 29
        text: |-
          "Ya saben, como un bote de basura, o una bolsa de papel, o algo, para no hacer un desorden," dice Hadrik.

          El presentador y la multitud observan al enano en silencio, incapaces de decidir si está hablando en serio o no. Mientras Hadrik hablaba, una de las criaturas parecidas a escorpiones se le acercaba sigilosamente por detrás, preparándose para atacarlo con sus garras.

          "¡Saben qué, olvídenlo!" dice Hadrik. "Mejor usaré esto como arma improvisada."

          Entonces se gira inmediatamente, y le da un botellazo al merodeador del desierto en la cabeza, que se rompe en fragmentos de vidrio que se clavan en los ojos de la criatura. El monstruo empieza a gritar de dolor, mientras Hadrik da un rápido salto, aterrizando con el puño encima del merodeador, y estrellándolo contra el suelo, causando una fuerte onda expansiva mientras también forma un pequeño cráter debajo de la criatura, debido a la fuerza del impacto.

          Una de las manticoras que todavía estaba en el cielo se lanza rápidamente en picada para agarrar a Hadrik con sus garras, pero el enano se aparta en el momento exacto en que el monstruo lo alcanza, y lo agarra por la cola. Luego lo hace girar durante unos cuatro segundos, ganando impulso, y lo lanza contra una pared lejana con todas sus fuerzas, haciendo que la bestia la atraviese con un fuerte estruendo.

          La multitud y el presentador están sin palabras. Miran al enano con expresiones de estupefacción en sus rostros, sin saber cómo reaccionar.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch04a_porcupines
  - name: b2_ch04a_porcupines
    texts:
      - source: scene_text
        paragraph: 57
        text: |-
          "Oh, no se preocupen por esa pared," dice Hadrik, pensando que su comportamiento imprudente es la razón del silencio de todos. "Revisé esa zona antes de la batalla y no hay nada más que un almacén vacío de ese lado, así que no hay peligro de que nadie resul--"

          Un fuerte rugido de vítores ahoga el resto de las palabras de Hadrik, mientras los espectadores finalmente recuperan su vigor anterior, y empiezan a gritar y aplaudir como nunca antes.

          "¡Eso, así es como debe ser!" grita Hadrik, con una amplia sonrisa, al ver a la gente vitoreando. "¡De esto es de lo que se trata una arena! ¡Más les vale agarrarse bien a sus asientos, porque la diversión apenas empieza!"

          Luego corre hacia otro merodeador, y le da un cabezazo tan feroz que cae al suelo al instante.

          "¡Liberen la segunda oleada!" grita el presentador, mientras unos cuantos merodeadores del desierto más salen del gran portón de hierro que había sido abierto previamente.
      - source: scene_text_2
        paragraph: 30
        text: |-
          Abriéndose paso desde detrás de los merodeadores, una nueva especie de criaturas está entrando al área de combate. Las criaturas parecen versiones más grandes de los puercoespines, pero por lo que entiendo no deberían estar relacionadas con ellos de ninguna manera más allá de su apariencia. A diferencia de los puercoespines normales, las púas de sus espaldas son armas mortales, y son lo suficientemente afiladas y resistentes como para competir con el acero élfico. Las criaturas tienen la habilidad de lanzar sus púas como proyectiles, con una precisión y velocidad muy altas. Debido a su alta tasa de regeneración, también tienen la habilidad de regenerar sus púas casi instantáneamente. Esto les proporciona un stock prácticamente ilimitado de munición para usar contra sus enemigos. Su apariencia y su comportamiento han llevado a la gente a llamar a estas criaturas 'puercoespines arqueros'.

          Unos cuantos de los puercoespines que se han posicionado a varias docenas de pies detrás de Hadrik ahora están dándole la espalda, preparándose para atacar. Hadrik todavía está peleando contra los merodeadores, y no parece haber notado a los puercoespines. ¿Debería gritarle una advertencia? No querría distraerlo en medio de su batalla, pero si esos puercoespines logran apuntar bien sus tiros, podría estar en problemas.
    choices:
      - position: 1
        text: Advertirle
        effects:
          - set:
              current_scene: b2_ch04a_lullaby
              b2_ch4_beer: 1
