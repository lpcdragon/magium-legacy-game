    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch04a_meeting
  - name: b2_ch04a_meeting
    texts:
      - source: scene_text
        paragraph: 6
        text: |-
          "No digas que no te lo advertí..." escribe Leila, y le entrega al mago su dispositivo de chatarra.

          El mago toma el dispositivo y lo mira por unos segundos, con una expresión contemplativa en su rostro. Luego saca una llave de su bolsillo, y camina junto a nosotros para desbloquear y luego abrir la puerta.

          "Este encuentro nunca ocurrió," dice el mago, mientras mira a cada uno de nosotros. "¿Entienden? Ahora, vamos. Salgan de aquí."

          "No necesitas decírnoslo dos veces," digo, mientras me dirijo a la puerta, y salgo de la habitación junto con Leila.

          Mientras el mago cierra la puerta detrás de nosotros, los dos comenzamos a dirigirnos hacia nuestras habitaciones.

          "Me sorprende que pudieras descifrar para qué era ese dispositivo con solo un vistazo," digo.

          "Solía pasar mucho tiempo en el taller de mi padre, cuando vivíamos en nuestra cabaña del bosque," escribe Leila. "Aprendí un par de cosas mientras lo veía trabajar."
      - source: scene_text_2
        paragraph: 5
        text: |-
          "¿Crees que podrá modificar el dispositivo a tiempo para la arena?" le pregunto.

          "Es posible," escribe Leila. "Pero tendrá que hacerlo rápido. No podrá cargarlo con energía mientras lo esté modificando, y necesitará cargarlo por al menos diez horas para sacarle algún uso decente, dado lo ineficiente que es."

          "Deberíamos ir a cambiarnos," digo. "También quiero revisar mi cuaderno, para ver si puedo encontrar alguna información útil sobre las criaturas que vimos en las cavernas. Te veré en unas horas, para contarte lo que encontré."

          Leila asiente.

          "Hasta luego," escribe Leila, y se dirige hacia su habitación.

          Yo también vuelvo a mi propia habitación, y lo primero que hago después de entrar es buscar en mi mochila una camisa seca y un par de pantalones nuevos.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch04a_technically
  - name: b2_ch04a_technically
    texts:
      - source: scene_text
        paragraph: 7
        text: |-
          Una vez que me cambio y dejo mi ropa mojada a secar, tomo mi cuaderno y vuelvo a estudiar.

          Aproximadamente una hora después de empezar a leer, recibí una llamada en mi transceptor de parte de Flower.

          "Barry, ¿estás bien?" me pregunta Flower de repente, con un poco de pánico en su voz.

          Pude notar de inmediato que era ella y no Illuna quien hablaba, por el tono de su voz.

          "Sí, estoy vivo," digo. "Logramos volver a nuestras celdas hace como una hora."

          "¡Gracias a los dioses!" dice Flower. "Cuando me enteré de lo que pasó, me preocupé mucho. Especialmente cuando descubrí que te dejaron solo con ese imbécil de Fyron. ¡Petal también ha estado muy preocupada!"

          "¿Ah sí?" le pregunto, sorprendido. "¿Eso dijo?"

          "Bueno, técnicamente," dice Flower, "lo que dijo fue que si no podías manejarte en una situación así después de unirte a este torneo, entonces te merecías tu destino, ¡pero estoy segura de que no es lo que realmente quiso decir!"
    choices:
      - position: 1
        text: ¿Ah sí? Bueno, dile que sus ojos azules la hacen ver gorda.
        effects:
          - set:
              current_scene: b2_ch04a_fat
      - position: 2
        text: Está bien. ¡Sé que lo dice con buena intención!
        effects:
          - set:
              current_scene: b2_ch04a_means
      - position: 3
        text: ¿Y qué hay de Arraka? ¿No estaba preocupada por mí?
        effects:
          - set:
              current_scene: b2_ch04a_worried
  - name: b2_ch04a_fat
    texts:
      - source: scene_text
        paragraph: 8
        text: |-
          "¿Ah sí? Bueno, dile que sus ojos azules la hacen ver gorda."

          "Te puedo escuchar, ¿sabes?..." me dice Illuna, con tono amenazante.

          "Espera, ¿sus ojos azules realmente me hacen ver gorda?" pregunta Flower.

          "¡Oye, Barry!" dice Arraka, interrumpiendo a Flower. "Algo me ha estado molestando desde que salimos de las cavernas. ¿Cómo diablos lograste convencer al trol de que te dejara ir? Estaba segura de que estabas acabado cuando lo sentí acercarse a ti."

          "¿Te refieres a Velgos?" le pregunto. "¿El trol que no moriría ni aunque le cortaras la cabeza? Lo detuvo el dueño de la arena. Aparentemente quiere hacer un show de nuestra pelea, y pelearemos contra el trol en la segunda ronda de la arena."

          "¡Ja!" dice Arraka. "¡Estoy deseando que llegue!"

          "¡Ten cuidado, Barry!" dice Flower. "¡No podremos ayudarte mientras estés en la arena!"

          "Sí, lo sé," digo. "No te preocupes, estaré bien. Pero gracias por tu preocupación."

          Después de terminar de hablar con Flower e Illuna, pasé otra hora estudiando mi cuaderno, y luego empecé a llamar a mis amigos de las otras divisiones, uno por uno, para contarles mis hallazgos. Cuando llegué a Kate, también decidí contarle sobre su antigua compañera del Faro, para ver cómo reaccionaría.
      - source: scene_text_2
        paragraph: 6
        text: |-
          "Oye, Kate," digo. "¿Recuerdas haber conocido a una joven lessathi con cabello plateado que no podía hablar, cuando estabas en el Faro de Esperanza? O quizás tenía el cabello negro en ese entonces, no estoy seguro."

          Hay una breve pausa después de que termino mi frase, durante la cual ni siquiera puedo escuchar el sonido de la respiración de Kate.

          "¿Cómo sabes de Leila?" me pregunta Kate, después de unos segundos.

          "¡Así que sí la recuerdas!" digo. "¿Ustedes dos se llevaban bien, o..."

          "¡Dime cómo sabes de ella!" grita Kate.

          "¡Está bien, está bien!" digo. "La conocí el otro día. Es miembro de mi división. Todavía está viva."

          Hay otra breve pausa durante la cual Kate no dice nada.

          "¿Estás seguro de esto?" dice Kate. "¿Cómo sabes que realmente es ella? Podría estar tratando de engañarte. Cualquiera puede teñirse el cabello de blanco y fingir que no puede hablar. La Leila que yo conozco debería haber estado muerta hace mucho tiempo."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch04a_change
  - name: b2_ch04a_means
    texts:
