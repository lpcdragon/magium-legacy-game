    texts:
      - source: scene_text
        paragraph: 18
        text: |-
          "Si el juego se llama 'cierra la boca', ¿por qué tus labios se están moviendo?"

          "¿Qué acabas de decirme, pedazo de mier--" empieza a decir el matón mientras se levanta, pero es interrumpido por Wilhelm.

          "Vamos, vamos," dice Wilhelm, mientras le pone una mano en el hombro al matón para evitar que me alcance. "Se supone que debemos actuar como equipo aquí, ¿recuerdas?"

          "Quita tu asquerosa mano de encima, escoria plebeya," le dice el matón a Wilhelm.

          No estoy seguro de si alguien más lo notó, pero por un segundo, estoy bastante seguro de que pude ver la expresión alegre de Wilhelm transformarse en una de pura sed de sangre al escuchar las palabras del matón. No pude ver más de su reacción, porque Bruce de repente se echó a reír a carcajadas, haciendo que todos volviéramos la vista hacia él.

          "¿Acabas de llamarlo escoria plebeya?" dice Bruce. "¿Y tú qué se supone que eres? ¿El príncipe perdido de Olmnar?"

          "No," dice el mago que fue encerrado aquí ayer. "Eso lo convierte en un noble desheredado. Mira bien ese trapo mugriento que lleva como bufanda. Tiene la marca de la familia Tilirius."
      - source: scene_text_2
        paragraph: 12
        text: |-
          "¿La familia Tilirius?" dice Bruce. "¡Ja! Entonces supongo que eso lo convierte en escoria de alta cuna. ¡Mis disculpas!"

          Se ríe de nuevo.

          "¿Podemos volver a nuestro juego de cartas, por favor?" pregunta Wilhelm. "Los guardias todavía están escuchando."

          "A nadie le importan tus cartas, Wilbert," dice Bruce. "El dueño dijo que teníamos que hablar, así que estamos hablando. No dijo nada de jugar cartas. Ve a hacerlo solo, si tanto te gusta jugar a las cartas."

          "Mi nombre es Wilhelm, no Wilbert," dice Wilhelm, en un tono calmado pero amenazante.
