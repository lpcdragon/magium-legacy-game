  - name: b2_ch04a_daft
    texts:
      - source: scene_text
        paragraph: 64
        text: |-
          El portón de la tercera división ahora se está abriendo. El primero en salir no es otro que Daren. Sus compañeros de equipo también lo siguen después de un breve momento, pero se ven un poco aprensivos.

          "Para su información," dice el presentador, "el hombre con la cicatriz que acaba de entrar en la arena es conocido como Daren, el sanador con armadura. Es un reconocido héroe de fuera de Varathia que ha viajado por el mundo y ha salvado incontables vidas a lo largo de los años. Puede que hayan oído de él en varios periódicos en el pasado. Hoy, participará en nuestro evento de la arena como nuestro invitado especial. ¡Demos una cálida ronda de aplausos para el héroe Daren!"

          Todos los espectadores empiezan a aplaudir, mientras Daren y sus compañeros de equipo se acercan al centro de la arena y preparan sus armas.

          "¡Bueno, escuchen!" nos dice Bruce, mientras los gladiadores todavía esperan para comenzar su pelea. "Después de ver las dos peleas anteriores, creo que necesitamos cambiar nuestra estrategia de batalla."

          "¿Te volviste loco?" dice el matón del noble desheredado. "¿Por qué cambiaríamos nuestras tácticas minutos antes de la batalla?"
      - source: scene_text_2
        paragraph: 34
        text: |-
          "Porque tal como estamos ahora, vamos a perder," dice Bruce. "No tenemos trabajo en equipo. Deberíamos intentar ser más como esos gladiadores de la primera división. Vieron lo bien que trabajaron juntos."

          "Los gladiadores de la primera división están todos muertos," dice el mago.

          "¡Maldición, saben a qué me refiero!" dice Bruce. "Hablo de asignar roles a cada uno. Todos vieron cómo operaban. Un tipo era el líder, otro se quedaba atrás, para advertir del peligro, algunos eran señuelos, y otros eran los combatientes principales. Si hiciéramos eso también, estaríamos mucho más organizados."
    choices:
      - position: 1
        text: Creo que es una buena idea.
        effects:
          - set:
              current_scene: b2_ch04a_good
      - position: 2
        text: Eso suena como una idea terrible.
        effects:
          - set:
              current_scene: b2_ch04a_terrible
  - name: b2_ch04a_good
    texts:
      - source: scene_text
        paragraph: 65
        text: |-
          "Creo que es una buena idea," digo. "Si cada uno tiene un rol, y sabemos qué estamos haciendo, habrá menos posibilidades de pánico."

          "¿Ah, sí?" pregunta el mago. "Eso probablemente es lo que esos tipos de la primera pelea pensaron también. Pero cuando su líder murió, toda su organización se fue al garete."

          "¡Aún así es mejor que pelear en el caos total desde el principio!" dice Bruce.

          "¿Y quién exactamente va a ser nuestro líder?" le pregunta el matón desheredado a Bruce. "¿Tú? No me hagas reír. Preferiría que me comiera una manticora a tener que escuchar ninguna de tus órdenes."

          "Nunca dije que yo sería el líder," dice Bruce. "Podemos votar quién será líder."

          "Olvídalo," dice el mago. "No me importa quién sea el líder. No voy a dejar mi supervivencia en manos de una persona que apenas conozco. No va a pasar."

          Mientras Bruce y los demás discutían, la primera ronda de la tercera división se estaba preparando para comenzar.

          "¡Suelten a los aplastadores!" dice el presentador.
      - source: scene_text_2
        paragraph: 35
        text: |-
          Varias criaturas que parecen un cruce entre un toro y un rinoceronte están entrando lentamente al área de combate. Cada aplastador tiene dos cuernos en la frente, un cuerno en el hocico, y una cola que parece tener una maza con pinchos pegada al final. También he leído que su piel es tan dura que bien podrían estar llevando armadura de placas completa. Como su nombre sugiere, los aplastadores suelen entrar en batalla embistiendo hacia sus oponentes, e intentando aplastarlos hasta la muerte.

          Efectivamente, los aplastadores no esperan mucho, y empiezan a embestir hacia los gladiadores a toda velocidad.

          "Si quieren vivir, quédense detrás de mí," les dice Daren a los otros gladiadores.

          Los compañeros de equipo de Daren están aterrados. Solo les toma unos segundos de ver a las bestias acercarse más y más para olvidar completamente la advertencia de Daren y empezar a correr por sus vidas.

          Daren deja escapar un profundo suspiro, y continúa manteniéndose firme, con su espada lista. En cuanto uno de los aplastadores llega al alcance de su espada, se hace a un lado, y le corta la cabeza de un solo movimiento, haciendo que el cuerpo sin cabeza del aplastador caiga al suelo y siga deslizándose sobre su vientre unos cuantos pies más, hasta que finalmente pierde el impulso.
      - source: scene_3
        paragraph: 5
        text: |-
          "Maldita sea," escucho gritar a Bruce detrás de mí. "¿Por qué no me hacen caso? ¡No vamos a tener ninguna oportunidad en la arena si no nos organizamos!"

          "No tienes que ser tan negativo, Bruce," dice Wilhelm, con tono calmado. "Estoy seguro de que nos las arreglaremos de una u otra manera. Lo importante es que tuvimos esa discusión ayer sobre las debilidades de las criaturas. Mientras la supervivencia sea la meta principal en nuestras mentes, seguro le daremos el mejor uso a esa información."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch04a_concentrate
  - name: b2_ch04a_terrible
    texts:
      - source: scene_text
        paragraph: 66
        text: |-
          "Eso suena como una idea terrible," digo. "Este tipo de estrategia quizás funcionó para esos tipos porque ya se conocían y habían peleado juntos antes. Los siete de nosotros, por otro lado, nos negamos a hablar durante tres días seguidos, hasta que el dueño nos obligó a hacerlo. No va a funcionar."

          "¡No podemos saberlo hasta que lo intentemos!" dice Bruce.

          "¿Y quién exactamente va a ser nuestro líder?" le pregunta el matón desheredado a Bruce. "¿Tú? No me hagas reír. Preferiría que me comiera una manticora a tener que escuchar ninguna de tus órdenes."

