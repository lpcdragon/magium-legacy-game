          - source: scene_text
            paragraph: 29
            text: |-
              "He estado leyendo mucho sobre criaturas míticas estos últimos días," digo. "Durante mis estudios, también encontré algo de información valiosa sobre las debilidades de las arpías y las manticoras."

              "¿Pero qué hay de las otras criaturas sobre las que leíste?" dice el mago. "¿También descubriste sus debilidades?"

              "A mí también me interesaría escuchar sobre cualquier otra criatura con la que Barry se haya topado en sus estudios," dice Wilhelm.

              "Bueno, está bien entonces," digo. "Pero más vale que se preparen, porque esto va a ser largo."

              Terminé contándoles mucho más de lo que originalmente planeaba. Les di la mayor parte de la información que necesitaban sobre las criaturas que sabía que podríamos enfrentar, y también sobre muchas otras. Pasamos el resto del período de recreación discutiendo estrategias para todo tipo de escenarios que podrían ocurrir en la arena. Incluso acordamos tener una segunda reunión más tarde, después de pasar un tiempo a solas en nuestras habitaciones, reflexionando sobre la información que teníamos a nuestra disposición.
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch04a_leaving
      - condition: b2_ch4_inform3 = 0
        texts:
          - source: scene_text
            paragraph: 30
            text: |-
              Hay una breve pausa durante la cual nadie dice nada. Para nuestra sorpresa, quien rompió el silencio fue nada menos que el matón de la familia Tilirius.

              "Sé un par de cosas sobre criaturas míticas," dice el matón. "Estuve leyendo sobre ellas en mi tiempo libre, antes de que me echaran de la mansión. Las arpías y las manticoras aparecían muy a menudo en ese tipo de libros."

              "¡Así que hay ventajas en ser un ex-noble!" dice Bruce. "¿Quién lo hubiera pensado? Bueno, vamos, no seas tímido y cuéntanos todo lo que sepas. Vamos a necesitar toda la información que podamos obtener si queremos sobrevivir al día de mañana."

              "Por una vez, estoy de acuerdo con Bruce," dice Wilhelm. "Asegúrate de darnos todos los detalles que puedas recordar. Nosotros también intentaremos aportar cuando podamos, si resulta que recordamos alguna información adicional de mitos y leyendas que pueda ser de ayuda."

              El resto del período de recreación se pasó discutiendo sobre las criaturas descritas por el matón, y también sobre varias estrategias que podríamos emplear para derrotarlas. Realmente no me involucré mucho en su discusión, ya que no puedo decir que confiaría en ninguno de ellos para cubrirme las espaldas en una pelea. Unas horas después del período de recreación, fui a la habitación de Leila para que pudiéramos tener nuestra propia reunión de estrategia por separado, discutiendo sobre todas las posibles criaturas que podríamos encontrar, y sobre cómo podríamos lidiar con ellas.
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch04a_leaving
  - name: b2_ch04a_leaving
    routes:
      - condition: b2_ch2_threatened = 0
        texts:
          - source: scene_text
            paragraph: 31
            text: |-
              Al final del día, no logramos idear mejores planes contra el trol que los originales, así que lo único que podíamos hacer era esperar que al menos uno de ellos funcionara bien.

              Una vez que vuelvo a mi habitación, tarde en la noche, me acuesto en la cama, y me quedo dormido como una piedra.

              Al día siguiente, un guardia me despierta por la mañana, diciéndome que empaque mis cosas, porque nos vamos en veinte minutos. Meto todo de vuelta en mi mochila, y luego salgo por la puerta hacia la sala de recreación, donde los otros miembros de mi división estaban empezando lentamente a reunirse. En cuanto estamos todos listos para irnos, comenzamos a salir del área de nuestra división uno por uno, y nos detenemos afuera de la puerta, donde nos recibe un empleado de la arena, que recoge todas nuestras llaves, y nos dice que lo sigamos.
          - source: scene_text_2
            paragraph: 15
            text: |-
              Mientras todos caminamos por los túneles poco iluminados, miembros de otras divisiones lentamente empiezan a salir de sus áreas de división también, y a seguir a sus guías por los pasillos. Cuando finalmente llegamos a los niveles superiores, nos dicen que nos formemos de manera ordenada, para que los guardias que fueron enviados a escoltarnos a la arena tengan más facilidad para mantenernos vigilados. No logré ver a ninguno de mis amigos mientras avanzábamos hacia la arena, pero sí vi una multitud bastante grande abriéndose camino hacia la arena para ver el espectáculo, y una fila muy larga en la taquilla.

              Los guardias nos guían por la entrada de gladiadores de la arena, y nos muestran nuestros vestuarios, donde podemos guardar nuestras pertenencias durante la duración del espectáculo. Después de terminar de meter nuestras mochilas en los casilleros, los guardias nos dicen que podemos movernos libremente por el área designada para los gladiadores hasta que comiencen los eventos, pero que necesitaremos reunirnos en el área de espera de nuestra división después del sonido del primer cuerno.
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch04a_trace
      - condition: b2_ch2_threatened = 1
        texts:
          - source: scene_text
            paragraph: 32
            text: |-
              Al final del día, no logramos idear mejores planes contra el trol que los originales, así que lo único que podíamos hacer era esperar que al menos uno de ellos funcionara bien.

              Después de volver a mi habitación por la noche y acostarme en la cama, mis últimos pensamientos antes de dormir fueron sobre la visión que tuve de Wilhelm apuñalándome por la espalda, durante el evento de la arena.

              Va a estar bien. Ya sé lo que trama. Mientras no le quite los ojos de encima, no podrá sorprenderme. Decido no pensar más en esto, y me voy a dormir.

              Al día siguiente, un guardia me despierta por la mañana, diciéndome que empaque mis cosas, porque nos vamos en veinte minutos. Meto todo de vuelta en mi mochila, y luego salgo por la puerta hacia la sala de recreación, donde los otros miembros de mi división estaban empezando lentamente a reunirse. En cuanto estamos todos listos para irnos, comenzamos a salir del área de nuestra división uno por uno, y nos detenemos afuera de la puerta, donde nos recibe un empleado de la arena, que recoge todas nuestras llaves, y nos dice que lo sigamos.
          - source: scene_text_2
            paragraph: 15
            text: |-
              Mientras todos caminamos por los túneles poco iluminados, miembros de otras divisiones lentamente empiezan a salir de sus áreas de división también, y a seguir a sus guías por los pasillos. Cuando finalmente llegamos a los niveles superiores, nos dicen que nos formemos de manera ordenada, para que los guardias que fueron enviados a escoltarnos a la arena tengan más facilidad para mantenernos vigilados. No logré ver a ninguno de mis amigos mientras avanzábamos hacia la arena, pero sí vi una multitud bastante grande abriéndose camino hacia la arena para ver el espectáculo, y una fila muy larga en la taquilla.

              Los guardias nos guían por la entrada de gladiadores de la arena, y nos muestran nuestros vestuarios, donde podemos guardar nuestras pertenencias durante la duración del espectáculo. Después de terminar de meter nuestras mochilas en los casilleros, los guardias nos dicen que podemos movernos libremente por el área designada para los gladiadores hasta que comiencen los eventos, pero que necesitaremos reunirnos en el área de espera de nuestra división después del sonido del primer cuerno.
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch04a_trace
      - condition: b2_ch2_threatened = 2 AND b2_ch2_lessathi = 0
        texts:
          - source: scene_text
            paragraph: 33
            text: |-
              Al final del día, no logramos idear mejores planes contra el trol que los originales, así que lo único que podíamos hacer era esperar que al menos uno de ellos funcionara bien.

              Después de volver a mi habitación por la noche y acostarme en la cama, mis últimos pensamientos antes de dormir fueron sobre la visión que tuve de Wilhelm apuñalándome por la espalda, durante el evento de la arena.

              Va a estar bien. No creo que intente nada después del susto que le di hace dos días. Y aunque lo hiciera, estaré esperándolo, así que no podrá tomarme desprevenido. Decido no pensar más en esto, y me voy a dormir.

              Al día siguiente, un guardia me despierta por la mañana, diciéndome que empaque mis cosas, porque nos vamos en veinte minutos. Meto todo de vuelta en mi mochila, y luego salgo por la puerta hacia la sala de recreación, donde los otros miembros de mi división estaban empezando lentamente a reunirse. En cuanto estamos todos listos para irnos, comenzamos a salir del área de nuestra división uno por uno, y nos detenemos afuera de la puerta, donde nos recibe un empleado de la arena, que recoge todas nuestras llaves, y nos dice que lo sigamos.
