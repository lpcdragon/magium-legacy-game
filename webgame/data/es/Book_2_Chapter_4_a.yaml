              Normalmente, no creo que intentara nada después del susto que le di hace dos días, pero me preocupa un poco que pueda haber visto el comentario de Leila sobre que soy un lessathi cuando nos estaba espiando, antes de que fuera a su habitación por primera vez. Definitivamente tendré que vigilarlo para que no me tome desprevenido. Decido no pensar más en esto, y me voy a dormir.

