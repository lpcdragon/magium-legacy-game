  - name: b2_ch04a_safe
    texts:
      - source: scene_text
        paragraph: 37
        text: |-
          "¡Leila!" dice Kate. "Por los dioses, pensé que estabas muerta. Nos dijeron que moriste por los experimentos. Oh dioses, Leila, ¡lo siento mucho! ¡No debí haberles creído! Debí haber ido a buscarte como hice con todos los demás."

          "No necesitas discul--" escribe Leila, pero detiene su texto cuando se da cuenta de que Kate tiene los ojos cerrados, intentando evitar que las lágrimas salgan.

          "Lo siento," dice Kate. "No debí haberte abandonado así. ¡Por favor, perdóname! Estaba tan concentrada en Diane que--"

          El resto de las palabras de Kate quedan ahogadas por el sonido de un cuerno muy fuerte. Parece que el evento de la arena está a punto de comenzar.

          "Kate, tenemos que irnos," dice Daren.

          Solo ahora noto que Daren y Hadrik también estaban ahí, de pie detrás de Kate. Deben haberse encontrado antes, y vinieron a buscarme juntos.

          "Lo sé," dice Kate, mientras se limpia las lágrimas con la manga.

          "Por favor... mantenla a salvo..." me dice Kate, simplemente, mientras pasa junto a mí, dirigiéndose hacia el lado de la arena de su división.

          "Lo haré," le digo.

          "Kate, espera, yo..." escribe Leila, con la boca abierta, como si hubiera olvidado que no puede hablar, pero Kate no llega a ver la escritura azul, y sigue caminando, alejándose de nosotros.
    choices:
      - position: 1
        text: Llamar a Kate
        effects:
          - set:
              current_scene: b2_ch04a_reunion
              b2_ch4_called_kate: 1
      - position: 2
        text: No hay tiempo. Las dos pueden hablar más después de la arena.
        effects:
          - set:
              current_scene: b2_ch04a_reunion
              b2_ch4_called_kate: 0
  - name: b2_ch04a_reunion
    routes:
      - condition: b2_ch4_called_kate = 1 AND b2_ch2_kate = 0
        texts:
          - source: scene_text
            paragraph: 38
            text: |-
              "¡Oye, Kate!" grito fuerte, para asegurarme de que me escuche.

              Kate se detiene en seco, y se da la vuelta, confundida. Al ver que Leila no hace nada, le doy un codazo. Finalmente entiende lo que estaba haciendo, y rápidamente crea un mensaje de texto azul, con letras muy grandes, para que Kate pueda verlo a distancia.

              "Kate, yo también lo siento," dice el texto. "¡Siento haber pensado que nunca querrías volver a verme porque era una lessathi! Así que, ahora que las dos lo sentimos, ¡ganemos la arena y salgamos de aquí vivas para poder seguir sintiéndolo juntas!"

              Al principio, Kate se llevó un susto al ver la escritura, pero luego se dio cuenta de quién venía, y logró sonreír.

              "¡Es una promesa!" le grita a Leila, y luego se da la vuelta, para apresurarse de regreso hacia su división.
          - source: scene_text_2
            paragraph: 18
            text: |-
              "¡Dales duro, Barry!" dice Hadrik, con su sonrisa habitual, mientras también se dirige hacia su propia área designada.

              "O mejor aún, no te mueras," me dice Daren. "Solo necesitamos sobrevivir a la arena, no ganarla. Nos vemos después del final del evento. Recuerda, no hace falta hacer ninguna locura. Solo mantente vivo. ¿Entendido?"

              "Entendido," digo.

              Una vez que Daren también se ha ido, Leila y yo decidimos dirigirnos hacia nuestra división también.

              "Entonces..." digo, mientras los dos caminamos lado a lado. "¿Ahora te alegras de haber decidido seguirme para conocer a mis amigos?" digo.

              Leila me mira sorprendida por unos instantes, hasta que se da cuenta de que en realidad era a Kate a quien quería que conociera desde el principio.

              "Sí," escribe entonces, sonriendo. "Me alegro. Gracias..."
