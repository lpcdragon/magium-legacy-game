            paragraph: 42
            text: |-
              Nos dirigimos al área de nuestra división, donde todos nuestros demás compañeros de equipo ya se habían reunido. Luego tomamos nuestros lugares junto a las rejas de hierro que bloquean nuestro acceso al área de combate, para tener una mejor vista de lo que sucede en la arena. Al parecer, todavía hay algunas personas abriéndose camino hacia sus asientos, pero la mayoría de los espectadores parecen haber encontrado sus lugares, y ahora esperan inquietos a que comience el espectáculo. Echo un vistazo para ver si puedo localizar a Flower o a Rose, pero los asientos están demasiado lejos de mí como para poder distinguir ningún detalle. El presentador está verificando su amplificador de voz mágico, en preparación para el evento. Está situado en una plataforma elevada, por encima de los asientos de los espectadores.

              Mientras todos esperamos a que los eventos comiencen, de repente escucho un pitido familiar, proveniente de mi bolsillo. Al mismo tiempo, un pitido similar viene de la dirección de Leila también.

              Por fin. He estado esperando esto desde hace un tiempo.
