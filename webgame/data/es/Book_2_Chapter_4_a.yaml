  - name: b2_ch04a_matter
    texts:
      - source: scene_text
        paragraph: 13
        text: |-
          "Supongo que no haría daño escuchar sus opiniones al respecto."

          Leila asiente.

          "Muy bien entonces," digo. "Vamos a tocar sus puertas, y tendremos una reunión en la sala de recreación."

          Me doy la vuelta para salir de la habitación, pero Leila me agarra de la manga y me detiene en seco. Al volverme hacia ella, veo que la escritura azul frente a ella dice simplemente: "Espera."

          La escritura azul desaparece rápidamente, siendo reemplazada por un nuevo texto.

          "¿Podemos hacer esto después?" escribe Leila.

          "¿Después?" le pregunto, confundido.

          "Después de que mi ropa se haya secado..." escribe Leila, con una mirada suplicante en sus ojos, mientras me muestra las mangas largas colgando de sus muñecas.

          "Oh, cierto, cierto," digo. "Perdón, lo olvidé."

          Hago una pausa por unos segundos.
      - source: scene_text_2
        paragraph: 9
        text: |-
          "Pensándolo bien," digo, "quizás deberíamos tener esta discusión mañana, durante nuestro último período de recreación. Los eventos de la arena no empezarán hasta pasado mañana, así que tendremos tiempo de sobra para hacer una estrategia. No tengo muchas ganas de ir tocando las puertas de todos como si estuviera repartiendo panfletos. Además, algunos de ellos podrían no aceptar una reunión, ni siquiera si los llamo. Creo que estarán más dispuestos a escucharme mañana, cuando estemos todos en la misma sala."

          Leila asiente de nuevo.

          "Creo que voy a volver a mi habitación e intentar conseguir más información," digo. "Buscaré cada nota que haya escrito sobre regeneración, e intentaré ver si puedo darle sentido a esta situación. Quizás si entendemos bien la habilidad del trol, podamos encontrar una forma de contrarrestarla. Avísame si se te ocurre alguna idea mientras tanto."

          "Lo haré," escribe Leila.

          "Bueno, entonces creo que me voy," digo. "¡Te veré después!"

          "Hasta luego," escribe Leila, y luego salgo de su habitación y vuelvo a la mía.

          Al cerrar la puerta de mi habitación detrás de mí, y al tomar mi cuaderno de nuevo, mis pensamientos se dirigen hacia el lessathi que me ofreció el trato con el rey. Todavía no les he contado a ninguno de mis amigos sobre ello. ¿Debería contarles?
    choices:
