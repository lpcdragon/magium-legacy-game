  - name: b2_ch04a_mercy
    texts:
      - source: scene_text
        paragraph: 55
        text: |-
          La multitud estalla en fuertes vítores y gritos, mientras la criatura parecida a un escorpión cae al suelo. Los tres guerreros levantan sus espadas por unos segundos, para señalar su victoria a los espectadores, y luego se dirigen hacia los otros merodeadores, para ayudar a sus compañeros de equipo.

          "¡Retrocedan!" escuchamos el grito desesperado del gladiador que estaba observando el campo de batalla. "¡Retrocedan, ahora!"

          Los gladiadores miran hacia arriba, pero no tienen tiempo para reaccionar. Solo toma unos segundos para que las manticoras que habían estado sobrevolando en círculos todo este tiempo se lancen en picada, claven sus garras en los pechos de los guerreros, y luego se eleven de vuelta al cielo, cargando a sus presas.

          Los gritos de los gladiadores silencian a la multitud por completo, mientras las bestias vuelan cada vez más alto. Dos de los gladiadores dejaron caer sus espadas del dolor, inmediatamente después de ser atacados, pero uno de ellos logró mantener su arma, y ahora la está usando para apuñalar a su atacante en el vientre. La manticora grita, y suelta al guerrero, que cae al suelo y se estrella la cabeza contra el duro suelo. Los otros dos gladiadores son elevados un poco más alto por sus atacantes, pero luego también son soltados al suelo, y mueren por el impacto.

          Los guerreros restantes finalmente empiezan a entrar en pánico. Su líder estaba entre los que murieron. Al perder a la persona que les daba instrucciones, los gladiadores comienzan a romper su formación, y los merodeadores aprovechan esto agarrando a uno de los guerreros con sus garras, mientras otro merodeador lo empala con su cola.
      - source: scene_text_2
        paragraph: 28
        text: |-
          Como si todo esto no fuera suficiente, dos manticoras más están entrando justo ahora al área de combate desde más allá del portón, y corren rápidamente hacia los gladiadores sobrevivientes. El observador es asesinado primero. No parecía ser muy hábil en combate, y fue destrozado en un instante. Los otros gladiadores no duraron mucho más. Los merodeadores del desierto y las manticoras finalmente unieron fuerzas contra ellos, y no pudieron hacer nada.

          Al final de la pelea, la arena cae en completo silencio, excepto por los sonidos de las manticoras, festejando ávidamente con los cadáveres de sus presas duramente ganadas.

          "Por los dioses..." dice Bruce, mientras observa las consecuencias de la batalla con horror, desde más allá de nuestra reja de hierro.

          "Parece que ni siquiera nuestros campeones reinantes pudieron derrotar a estas temibles bestias," dice el presentador. "Esto no pinta bien para las siguientes divisiones. ¿Va a terminar este evento en un baño de sangre?"

          El portón de hierro de la segunda división ahora se está levantando. Sin embargo, nadie parece estar saliendo. Después de unos diez segundos de silencio, escuchamos un grito proveniente de su dirección.

          "¡No voy a salir ahí!" grita un hombre, a todo pulmón. "¡Si quieren matarme, mátenme ahora! ¡Vieron lo que les pasó a esos gladiadores! ¡No tenemos oportunidad!"

          "Vas a marchar ahí dentro y pelear," dice la voz de otro hombre, "o recibirás una muerte mucho peor que ser devorado vivo por una manticora."

          "¡No, por favor, ten piedad!" grita el otro hombre.
    choices:
      - position: 1
