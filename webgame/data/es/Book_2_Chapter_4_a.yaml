            paragraph: 60
            text: |-
              La última manticora restante decide que los cielos ya no son seguros, así que rápidamente se lanza en picada hacia Hadrik, para terminar la pelea con un gran choque final. Hadrik no espera a que la criatura lo alcance, y salta, agarrándola del aire, y haciendo un giro en caída, aplastando la cabeza de la bestia contra el suelo.

              Lo logró... El maldito loco lo logró. Derribó ambas oleadas de monstruos él solo, y apenas lo arañaron.

              Las multitudes ahora están vitoreando más fuerte que nunca. Los compañeros de equipo de Hadrik, que habían estado escondidos todo este tiempo, vienen corriendo hacia el enano, y lo levantan en el aire, mientras cantan su nombre repetidamente.

              "¡Hadrik! ¡Hadrik! ¡Hadrik!" siguen diciendo, mientras las multitudes vitorean.

              "Ni crean que se van a librar tan fácil, perros cobardes," dice Hadrik, con una sonrisa, mientras sus compañeros lo lanzan hacia arriba y hacia abajo. "Cuando salgamos de aquí, me van a comprar tragos para un año entero."

              "¡¿Qué significa esto?!" escucho al embajador de Ollendor gritar desde arriba.

              "¡Embajador!" dice Venard, el dueño de la arena. "¡Veo que decidió unirse a nosotros después de todo! ¿Le gustaría un poco de vino?"

              Los dos parecen estar hablando desde una sala privada encima del área de nuestra división. No parece que ninguno de mis compañeros de equipo pueda escucharlos.
          - source: scene_text_2
            paragraph: 33
            text: |-
              "¿Por qué está el enano aquí?" dice el embajador. "¡No se suponía que estuviera aquí! ¡Va a arruinarlo todo!"

              "Cálmese, embajador," dice Venard. "El enano vino aquí con una carta de admisión firmada por el mismísimo rey. No podíamos simplemente rechazarlo."

              "El hecho de que no pudieran rechazarlo," dice el embajador, "no significa que tengan que dejarlo hacer una burla de toda su arena."

              "Pero no ha hecho nada de eso, embajador," dice el dueño. "Todo lo contrario, de hecho. Nos ha proporcionado un espectáculo que esta arena no ha visto en siglos, y a la multitud le encanta. El espectáculo apenas ha comenzado, ¡y ya ha superado todas mis expectativas!"

              "¡Me importan un bledo sus expectativas!" grita el embajador. "Lo quiero fuera, ¿entiende? ¡No quiero que vuelva a poner un pie en esa arena!"

              "Hmm," dice Venard. "A decir verdad, yo también creo que permitir que el enano cause estragos más de lo que ya lo ha hecho haría el espectáculo demasiado predecible y aburrido. Muy bien, embajador. Hablaré con el personal encargado de organizar las peleas para hacer algunas modificaciones en el programa. No lo volverá a ver."

              Después de que terminan su discusión, la sala de arriba queda en silencio de nuevo. Mientras tanto, en el exterior, las multitudes todavía no han dejado de vitorear, desde el final de la pelea anterior. Pasa aproximadamente un minuto más para que los vítores finalmente se calmen, y para que Hadrik y los demás bajen del escenario, para que la siguiente división pueda entrar al área de combate.
