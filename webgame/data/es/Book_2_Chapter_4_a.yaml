              Mientras Daren estaba ocupado con las cobras, los otros gladiadores habían logrado derribar a uno de los aplastadores por su cuenta. Al ver que los otros aplastadores no planean atacarlo más, Daren decide ir a ayudar a los demás a matar a las criaturas restantes.

              "¡Si ninguno de ustedes va a entrar en razón, entonces pelearé solo!" grita Bruce de nuevo, esta vez más fuerte que antes. "¡No pienso dejarme matar para salvarles el trasero!"

              "Dudo mucho que alguien estuviera contando con tu ayuda para empezar," dice Wilhelm. "¿Ahora podrías guardar silencio, por favor? Nuestra batalla comenzará pronto, y me gustaría concentrarme."

              Genial. Nuestra pelea ni siquiera empezó todavía, y nuestro equipo ya se está desmoronando. Debí haberlo sabido desde el principio: no se puede confiar en esta gente.
