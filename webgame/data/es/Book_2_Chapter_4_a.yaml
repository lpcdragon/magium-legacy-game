    routes:
      - condition: hearing < 3
        texts:
          - source: scene_text
            paragraph: 61
            text: |-
              La última manticora restante decide que los cielos ya no son seguros, así que rápidamente se lanza en picada hacia Hadrik, para terminar la pelea con un gran choque final. Hadrik no espera a que la criatura lo alcance, y salta, agarrándola del aire, y haciendo un giro en caída, aplastando la cabeza de la bestia contra el suelo.

              Lo logró... El maldito loco lo logró. Derribó ambas oleadas de monstruos él solo, y apenas lo arañaron.

              Las multitudes ahora están vitoreando más fuerte que nunca. Los compañeros de equipo de Hadrik, que habían estado escondidos todo este tiempo, vienen corriendo hacia el enano, y lo levantan en el aire, mientras cantan su nombre repetidamente.

              "¡Hadrik! ¡Hadrik! ¡Hadrik!" siguen diciendo, mientras las multitudes vitorean.

              "Ni crean que se van a librar tan fácil, perros cobardes," dice Hadrik, con una sonrisa, mientras sus compañeros lo lanzan hacia arriba y hacia abajo. "Cuando salgamos de aquí, me van a comprar tragos para un año entero."

              Pasan dos minutos más para que los vítores de la multitud finalmente se calmen, y para que Hadrik y los demás bajen del escenario, para que la siguiente división pueda entrar al área de combate.
