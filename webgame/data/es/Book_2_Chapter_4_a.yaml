  - name: b2_ch04a_read
    routes:
      - condition: ch6_secure = 1
        texts:
          - source: scene_text
            paragraph: 49
            text: |-
              Iré a leer el cuaderno. Es más seguro así.

              "Oye, Leila," digo. "Necesito ir a revisar mi cuaderno rápido. ¿Podrías darme un resumen de las peleas cuando vuelva?"

              Leila asiente.

              "De acuerdo," digo. "Vuelvo enseguida."

              Salgo del área de nuestra división y me apresuro hacia los vestuarios. Poco después de salir de la sala, uno de los guardias me ve y me llama.

              "Tú, ahí," dice el guardia. "¿Por qué abandonaste el área de tu división?"

              "Lo siento," digo. "Olvidé algo en mi mochila y me dirigía al vestuario."

              "No se supone que debas abandonar tu área designada sin permiso," me dice el guardia.

              "Está bien," digo. "¿Cómo pido permiso, entonces?"
          - source: scene_text_2
            paragraph: 25
            text: |-
              El guardia se rasca la cabeza. No creo que nadie le haya hecho esta pregunta antes.

              "Espera aquí," dice el guardia. "Voy a preguntarle al dueño. Más vale que no te muevas de este lugar hasta que yo vuelva, o estarás en problemas."

              El guardia va a subir un tramo de escaleras, y luego desaparece de mi vista. Vuelve unos minutos después, con un papel en la mano.

              "Aquí tienes un pase libre, firmado por el dueño," dice el guardia, mientras me entrega el papel. "Si algún otro guardia intenta detenerte, le muestras este papel. Cuando termines, vuelves aquí, y me entregas este papel. ¿Está claro?"

              "Clarísimo," digo, y luego me dirijo hacia el vestuario.

              Cuando finalmente llego a mi casillero, lo abro con mi llave, y luego saco el cuaderno de mi mochila. Arranco rápidamente las páginas que necesito, luego coloco mi cuaderno de vuelta en mi mochila y cierro el casillero.
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch04a_himself
