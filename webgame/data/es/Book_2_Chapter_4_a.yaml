  - name: b2_ch04a_cards
    texts:
      - source: scene_text
        paragraph: 17
        text: |-
          Antes de dormirme, Leila vino a tocar mi puerta para devolverme la ropa. Le pregunté si se le había ocurrido alguna idea, pero dijo que lo único que se le había venido a la mente era que podríamos intentar aplastar la cabeza del trol después de decapitarlo, con la esperanza de que la cabeza ya no se regenere después de ser cortada del cuerpo.

          Al día siguiente, nuestro período de recreación estaba programado hacia el mediodía. Al salir de mi celda para encontrarme con los demás, noté, para mi sorpresa, que todos estaban reunidos en el centro de la sala, sentados en el suelo, excepto Wilhelm, que estaba de pie, barajando una baraja de cartas.

          "¡Llegas tarde!" dice Wilhelm. "Toma asiento. Casi íbamos a empezar sin ti."

          "¿Qué está pasando aquí?" le pregunto a Wilhelm.

          "Te preguntas," dice Wilhelm, "por qué de repente estamos todos en buenos términos después de habernos ignorado mutuamente durante los últimos días. La respuesta es simple. Es porque el dueño de la arena acaba de hacernos una visita."

          "¿El dueño?" le pregunto, sorprendido.
      - source: scene_text_2
        paragraph: 11
        text: |-
          "Sí," dice Wilhelm. "Los guardias de este lugar le dijeron que realmente no hemos estado usando estos períodos de recreación para conocernos. Por lo tanto, decidió venir personalmente para informarnos amablemente de que si no planeamos actuar como equipo, nos enviará a la muerte uno por uno, en lugar de darnos la oportunidad de trabajar juntos. También nos comunicó que el período de recreación de hoy es la última vez en que podemos demostrar que somos capaces de cooperar entre nosotros."

          "Entonces, ¿por eso están todos jugando a las cartas?" digo.

          "Bueno, teníamos que empezar por algún lado," dice Wilhelm. "Y resulta que yo tenía una baraja de cartas conmigo, así que dije, ¿por qué no?"

          "Justo," digo. "Entonces, ¿a qué estamos jugando exactamente?"

          "Estamos jugando a un juego que se llama cierra la boca y recoge las malditas cartas," me dice uno de los dos matones, en tono amenazante.
    choices:
