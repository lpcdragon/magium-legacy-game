              Todos nos giramos hacia Leila, que nos mira con una expresión molesta en su rostro.

              "Oh, eh..." dice Bruce. "Claro, claro... Quizás deberíamos empezar a hacer eso."

              "No podría estar más de acuerdo," dice Wilhelm.

              "¿Y de qué se supone que debemos hablar, exactamente?" dice el mago. "Todavía no nos han dado ninguna información sobre los eventos de mañana. Lo único que sabemos hasta ahora es que probablemente pelearemos contra criaturas míticas de algún tipo, en una de las rondas."

              Leila me mira.

              Me pregunto si está teniendo dudas sobre que no les contemos lo que descubrimos en las cavernas. Si fuera a cambiar de opinión, definitivamente no habría un momento mejor que este.
