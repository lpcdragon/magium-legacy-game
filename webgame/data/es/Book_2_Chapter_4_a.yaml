  - name: b2_ch04a_lullaby
    routes:
      - condition: b2_ch4_beer = 1
        texts:
          - source: scene_text
            paragraph: 58
            text: |-
              "¡Oye, Hadrik!" grito. "¡Detrás de ti!"

              Hadrik mira hacia atrás, y ve a los puercoespines preparándose para atacarlo. Espera a que disparen, y esquiva en el último momento, haciendo que las púas impacten a un merodeador del desierto en su lugar. Luego se lanza hacia sus atacantes a distancia, sin dejarles tiempo para preparar un segundo tiro, y los golpea repetidamente con los puños, hasta que todos están muertos, o incapaces de moverse.

              "¡Buena esa, Barry!" dice Hadrik entonces. "Te debo una cerveza."

              El merodeador que fue alcanzado por las púas era el último en pie, y el daño que recibió fue suficiente para hacerlo caer.

              Las manticoras han abandonado todas sus presas cuando Hadrik empezó su arrasamiento, y ahora han vuelto a sobrevolar en círculos, tratando de encontrar el momento adecuado para atacar. Una de las manticoras más valientes se lanza rápidamente en picada, intentando sorprender al enano, pero cuando lo ve reaccionar, el monstruo rápidamente se eleva de vuelta al cielo, fuera de su alcance.

              "¡Maldición!" dice Hadrik. "¡Vuelve aquí, cobarde! ¡Vuelve aquí y pelea!"

              "¡Oye, enano!" escucho la voz de Arraka proveniente de la multitud. "¿Por qué no intentas cantarles una canción de cuna? ¡Quizás les dé sueño y bajen de vuelta! ¡JAJAJAJAJAJA!"
          - source: scene_text_2
            paragraph: 31
            text: |-
              Siguiendo el sonido de la voz de Arraka, logro identificar a Flower entre la multitud de espectadores. La gente a su alrededor tiene la cabeza girada hacia ella, y la observan con curiosidad. Deben pensar que el amuleto alrededor de su cuello es algún nuevo tipo de transceptor.

              "¡Cállate, maldita vieja bruja!" le grita Hadrik de vuelta. "¡Cuando salga de aquí, te juro que voy a duplicar tus sesiones de giro!"

              "¡Sí, tengo una idea mejor!" dice Arraka. "¿Qué tal si dejas de hacerle perder el tiempo a todos y vuelves a pelear? ¿Tienes idea de cuánto costó esta entrada?"

              "¡No puedo pelear contra ellas, pedazo de idiota!" grita Hadrik, exasperado. "No me permiten usar armas a distancia en la arena."

              "¡Entonces lanza unas lanzas!" grita Arraka. "¿De verdad tengo que decirte todo? Tienes lanzas montadas en las paredes. Úsalas."

              Ahora que Arraka lo menciona, veo que efectivamente hay lanzas y varias otras armas montadas en las paredes de la arena. Deben haber sido colocadas ahí para darle a la gente que no tenía armas cuando fue capturada una oportunidad equitativa en el evento de combate. Hadrik murmura algo entre dientes, y va a buscar una de las lanzas. Luego la lanza hacia una de las manticoras, y la lanza se clava en su pecho, haciendo que la sangre salpique mientras la criatura cae hacia el suelo. Antes de que la criatura llegue al suelo, el enano agarra dos lanzas más, y las arroja en rápida sucesión hacia dos de las otras manticoras, matándolas también.
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch04a_chanting
      - condition: b2_ch4_beer = 0
        texts:
          - source: scene_text
            paragraph: 59
            text: |-
              No debería interrumpir la pelea del enano. Sabe lo que hace.

              Mientras Hadrik manda al último de los merodeadores estrellándose contra el suelo, tres de los puercoespines arqueros apuntan sus tiros hacia él, y seis de sus afiladas púas se le clavan en la espalda.

              "Hmm," dice Hadrik, con el tono de un hombre al que acaba de picar un mosquito.

              Luego se saca todas las púas una por una con las manos y las tira al suelo. Las púas apenas parecen haber atravesado su piel, y casi no sale sangre de las heridas. No sé por qué me sorprendo. Si el acero élfico regular sin encantamiento no es lo suficientemente afilado para atravesar la piel de un gigante, ¿por qué sería diferente con las púas de un puercoespín?

              Hadrik no les da a los puercoespines arqueros la oportunidad de apuntar su segundo tiro, ya que se lanza hacia ellos, y luego los golpea repetidamente con los puños hasta que todos están muertos, o incapaces de moverse.

              Las manticoras han abandonado todas sus presas cuando Hadrik empezó su arrasamiento, y ahora han vuelto a sobrevolar en círculos, tratando de encontrar el momento adecuado para atacar. Una de las manticoras más valientes se lanza rápidamente en picada, intentando sorprender al enano, pero cuando lo ve reaccionar, el monstruo rápidamente se eleva de vuelta al cielo, fuera de su alcance.

              "¡Maldición!" dice Hadrik. "¡Vuelve aquí, cobarde! ¡Vuelve aquí y pelea!"
