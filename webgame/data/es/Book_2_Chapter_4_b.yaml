        texts:
          - source: scene_text
            paragraph: 14
            text: |-
              Hadrik y Daren no son los únicos que pueden matar criaturas peligrosas por sí solos. Si el dueño de la arena quiere un espectáculo, se lo daré.

              "Bien, voy a entrar," digo. "¡Deséenme suerte!"

              "¿Vas a qué?" pregunta Bruce, demasiado sorprendido para formular una frase coherente.

              Entonces empiezo a correr hacia el grupo de criaturas y no miro atrás. Las bestias ya están algo separadas entre sí, así que elijo empezar con los merodeadores, ya que parecen ser los menos peligrosos del grupo. Cargo contra la criatura con aspecto de escorpión que está un poco más alejada de las otras dos, e intento apuñalarla en la cara.
