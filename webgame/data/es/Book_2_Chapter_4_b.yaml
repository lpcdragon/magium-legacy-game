  - name: b2_ch04b_speed
    routes:
      - condition: agility < 3
        texts:
          - source: scene_text
            paragraph: 17
            text: |-
              Ahora, si mi información es correcta, cuando una criatura gigante con aspecto de escorpión es atacada directamente de frente, y no se considera superada por un gran número de atacantes, su primera reacción debería ser atacarme con su cola, en lugar de bloquearme con sus pinzas. Esto significa que el camino a su cabeza permanecerá libre, siempre y cuando sea lo bastante rápido para esquivar la cola.

              Al entrar en el rango de ataque de la cola, y prepararme para lanzarme hacia adelante, de repente me doy cuenta de que no voy a lograrlo, y salto hacia atrás justo a tiempo, evitando el golpe letal de la criatura por apenas unos centímetros.

              Bueno, si mi velocidad no es suficiente, entonces tendré que dominarlo por fuerza bruta.

              Si quiero acercarme a su cabeza, voy a necesitar deshacerme de sus pinzas primero. Comienzo a atacarlas, por separado, asegurándome de nunca estar en una posición donde el merodeador pueda atacarme fácilmente con su cola.
        effects:
          - set:
              failed_checks:
                - '[ Comprobación de velocidad fallida - nivel 3 ]'
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch04b_marauder
      - condition: agility >= 3
        texts:
          - source: scene_text
            paragraph: 16
            text: |-
              Ahora, si mi información es correcta, cuando una criatura gigante con aspecto de escorpión es atacada directamente de frente, y no se considera superada por un gran número de atacantes, su primera reacción debería ser atacarme con su cola, en lugar de bloquearme con sus pinzas. Esto significa que el camino a su cabeza permanecerá libre, siempre y cuando sea lo bastante rápido para esquivar la cola.

              Me pongo en el rango de la cola del merodeador, y justo cuando golpea, hago un rápido movimiento hacia adelante, apuñalando al merodeador en uno de sus ojos. Mientras la criatura con aspecto de escorpión retrocede de dolor, aprovecho la oportunidad para pasar mi cuchillo por la parte trasera de su cabeza, rematándolo de un solo golpe.

              Entonces saco mi cuchillo de la cabeza del merodeador, y miro hacia las otras dos criaturas con aspecto de escorpión, tratando de decidir a cuál debería atacar a continuación.
        effects:
          - set:
              successful_checks:
                - '[ Comprobación de velocidad exitosa - nivel 3 ]'
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch04b_manticore
  - name: b2_ch04b_specific
    texts:
      - source: scene_text
        paragraph: 18
        text: |-
          Noto que el merodeador está arqueando su cola, preparándose para golpear, así que retrocedo un poco. Mi principal problema ahora mismo es que no estoy seguro de cómo reaccionará esta criatura a mis ataques. Dado que no conozco ninguna de sus debilidades específicas, voy a tener que asumir que su cabeza y sus ojos, en particular, son las partes menos resistentes de su cuerpo, pero si intento llegar a la cabeza, el merodeador probablemente bloqueará mi acceso con sus pinzas, y luego me rematará con su cola. La estadística de Velocidad no me va a ayudar aquí. Lo que necesito es dominar a la criatura por fuerza bruta.

          Si quiero acercarme a su cabeza, voy a necesitar deshacerme de sus pinzas primero. Comienzo a atacarlas, por separado, asegurándome de nunca estar en una posición donde el merodeador pueda atacarme fácilmente con su cola.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch04b_marauder
  - name: b2_ch04b_marauder
    routes:
      - condition: strength >= 3
        texts:
          - source: scene_text
            paragraph: 19
            text: |-
              Me alegro tanto de que Daren haya encantado esta daga antes de la arena. No me habría imaginado a mí mismo cortando la pinza de un escorpión gigante de un solo golpe antes de experimentar el filo de esta hoja de primera mano. Ahora que una de sus pinzas ha desaparecido, el escorpión ya no puede bloquearme el paso. Ataco al merodeador por el lado derecho, donde le falta la pinza, y me lanzo hacia su cabeza. La cola de escorpión no está hecha para defenderse de ataques laterales, así que la criatura no logra rechazarme antes de que la apuñale en su ojo derecho. Mientras la criatura con aspecto de escorpión retrocede de dolor, aprovecho la oportunidad para pasar mi cuchillo por la parte trasera de su cabeza, rematándolo de un solo golpe.

              Entonces saco mi cuchillo de la cabeza del merodeador, y miro hacia las otras dos criaturas con aspecto de escorpión, tratando de decidir a cuál debería atacar a continuación.
        effects:
          - set:
              successful_checks:
                - '[ Comprobación de fuerza exitosa - nivel 3 ]'
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch04b_manticore
                condition: is_dead = 0
      - condition: strength < 3 AND reflexes >= 3
        texts:
          - source: scene_text
            paragraph: 20
            text: |-
              Incluso con la daga encantada de Daren, mis golpes no son lo bastante fuertes como para cortar una pinza. Después de chocar con el merodeador durante unos diez segundos, la criatura logra pillarme con mal apoyo, y rápidamente me ataca con su cola.

              Mi mano se mueve sola, y paro el golpe del merodeador con mi cuchillo, justo por encima de mi cabeza. En cuanto el monstruo retrae su cola, veo una abertura en las defensas de la criatura, y me lanzo hacia adelante, sin detenerme hasta apuñalarla en su ojo derecho. Mientras la criatura con aspecto de escorpión retrocede de dolor, aprovecho la oportunidad para pasar mi cuchillo por la parte trasera de su cabeza, rematándola de un solo golpe.

              Entonces saco mi cuchillo de la cabeza del merodeador, y miro hacia las otras dos criaturas con aspecto de escorpión, tratando de decidir a cuál debería atacar a continuación.
