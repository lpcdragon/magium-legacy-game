            paragraph: 90
            text: |-
              "No creo que hayan terminado. Ni siquiera he visto grifos todavía."

              “¿Por qué tendrían grifos?" dice Bruce. "Ya tenían manticoras, para criaturas aladas, y son mucho más letales."

              Oh, cierto. Olvidé que nunca le conté a Bruce sobre mi viaje a las cavernas subterráneas.

              "Quizás tengas razón," le digo. "Un tipo de criaturas aladas es más que suficiente para una arena abierta como esta."
