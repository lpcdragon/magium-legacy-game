  - name: b2_ch04b_killed1
    texts:
      - source: scene_text
        paragraph: 94
        text: |-
          "Disculpen la demora, todos," dice el presentador. "Después de verificar qué criaturas nos quedan, es mi triste deber informarles que nuestras reservas especiales de criaturas se han agotado, y que tendremos que volver a nuestras reservas regulares, de esta pelea en adelante. Espero que esto no afecte demasiado su disfrute del espectáculo. Ahora, dicho todo esto, ¡me gustaría presentarles a la quinta división!"

          De vuelta a las reservas regulares, ¿eh? Supongo que esos grifos y gárgolas que matamos en las cavernas subterráneas hace dos días debieron haber sido sus últimas reservas, entonces. Menos mal que decidimos encargarnos de ellos con anticipación, o ese loco dueño de la arena bien podría haberlos lanzado contra nosotros también.

          Cuando la siguiente reja de hierro se levanta, Kate es la primera en salir al área de combate. Mientras avanza hacia el centro de la arena, los otros miembros de su división también comienzan a seguir sus pasos. Una vez que logro ver bien a todos los compañeros de Kate, me doy cuenta de repente de que Kate es probablemente la luchadora más capaz de su división, incluso sin su magia. La mayoría de los demás se ven severamente fuera de forma, y algunos de ellos ni siquiera tienen armas. Estos claramente no son del tipo de gladiadores que vinieron aquí voluntariamente.
      - source: scene_text_2
        paragraph: 22
        text: |-
          Mientras los luchadores desarmados van a buscar sus armas preferidas de las paredes de la arena, las nuevas criaturas están empezando lentamente a salir de su guarida.

          Los primeros en salir son un par de leones de caverna, que son básicamente versiones más grandes de leones regulares, pero sin la melena. Luego, vemos a unos cuantos lobos negros unirse al escenario, que se parecen a los que peleamos en la ilusión del chamán ogro, excepto que solo son alrededor del doble del tamaño de lobos regulares. Mientras estas criaturas comienzan a avanzar lentamente hacia el centro de la arena, unos cuantos lobos negros y leones de caverna más hacen su aparición desde detrás de la gran reja de hierro.

          Así que esto es lo que llaman sus reservas regulares. Definitivamente es un nivel por debajo de las criaturas que nos han mostrado hasta ahora, pero algo me dice que los organizadores no habrían tenido permiso para soltar tantas al mismo tiempo si este fuera uno de sus espectáculos regulares. Si Kate tuviera un equipo decente respaldándola, no estaría preocupado, pero tal como están las cosas, bien podría verse forzada a pelear contra todas estas criaturas sola.

          El primer grupo de leones y lobos decide tomar la iniciativa, y comienzan a correr juntos, hacia los gladiadores. Cuando los compañeros de Kate ven a las bestias cargar hacia ellos, algunos empiezan a gritar y correr tan rápido como pueden, mientras otros cargan directamente contra las criaturas, en un intento desesperado de intimidarlas.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch04b_killed2
  - name: b2_ch04b_killed2
    routes:
      - condition: ch11_saved_rose = 1
        texts:
          - source: scene_text
            paragraph: 95
            text: |-
              Kate es la única que parece calmada y serena, mientras sus instintos toman el control otra vez, igual que en la ilusión del chamán ogro, y empieza a moverse entre una criatura y otra, cortando la garganta de una y luego pasando al siguiente objetivo, sin movimientos desperdiciados.

              Cuando las otras bestias ven al primer grupo ser diezmado, deciden que deberían ignorar a los otros gladiadores por ahora, y concentrar todos sus esfuerzos en neutralizar a Kate. Corren en ayuda de sus compañeros, y rápidamente se mueven para rodearla, mientras ella está ocupada peleando con uno de los lobos. Al ver que su ruta de escape ha sido bloqueada, Kate intenta abrirse camino ella misma, yendo a atacar a una de las criaturas frente a ella. Sin embargo, antes de que alcance a su enemigo, uno de los lobos detrás de ella se lanza y le muerde la pierna izquierda.

              Kate le clava su cuchillo en la cabeza al lobo, pero baja la guardia, y uno de los otros lobos aprovecha la oportunidad para abalanzarse sobre ella y tumbarla al suelo. Intenta apuñalar a la criatura con su daga, pero el lobo usa sus colmillos para arrancarle el arma de la mano, y lanzarla lejos, fuera de su alcance.

              "¡Kate!" escucho la voz de Rose, gritando desde la audiencia, mientras la veo saltar de su asiento, con una mirada de desesperación en sus ojos.

              Lo que sucedió después dejó a todos en la multitud sin palabras, excepto a Arraka, cuya voz era ahora la única que podía escucharse resonando por toda la arena.
          - source: scene_text_2
            paragraph: 23
            text: |-
              "¡Maldición, lo hizo de nuevo!" dice Arraka. "¡No puedo creerlo! Justo cuando las cosas empezaban a ponerse divertidas, tuvo que ir y arruinar todo de nuevo. ¡Maldita sea!"

              Mientras las palabras de Arraka probablemente no tenían sentido para la gente en la audiencia, los pocos de nosotros que la conocíamos entendíamos la fuente de su frustración muy bien. Casi inmediatamente después del grito de Rose, Kate desapareció de repente de debajo del lobo, y reapareció a unos metros de distancia, de pie, con la daga de vuelta en su mano, y su atacante tendido en el suelo, en un charco de su propia sangre.

              No me tomó mucho darme cuenta de que esto fue obra de Rose, quien una vez más activó sus poderes por accidente, congelando el tiempo para todos excepto para ella y Kate.

              "¡Que nadie entre en pánico!" dice el presentador, de repente, al ver las reacciones asustadas del público. "¡Les aseguro que llegaremos al fondo de esto en cuanto termine la pelea!"

              Algunas de las personas parecen estar inquietas, mientras otras están susurrando entre sí con miedo en los ojos. Aunque es difícil escuchar exactamente de qué están hablando, parece haber una palabra en particular que todas esas conversaciones tienen en común. Es la palabra 'banshee'.
          - source: scene_3
            paragraph: 2
            text: |-
              Kate logra salir del cerco de lobos, e intenta retirarse, con la esperanza de que algunos de sus compañeros finalmente encuentren el valor y la ayuden a flanquear al enemigo que ahora se está concentrando en ella, exclusivamente. Sorprendentemente, unos cuantos de los otros gladiadores captan la indirecta, y se acercan a las criaturas por detrás, mientras están distraídas, logrando matar a cuatro de ellas, antes de que los lobos y los leones se vean forzados a cambiar de táctica.

              Ahora que los compañeros de Kate finalmente se unieron a la batalla, y que los lobos y leones se han dispersado, no les toma mucho a los gladiadores cazar a sus enemigos restantes, y acabar con todos ellos.
