    texts:
      - source: scene_text
        paragraph: 86
        text: |-
          "¿Eso fue todo?" digo. "Esperaba ver una colección de criaturas más impresionante. Estoy un poco decepcionado, para ser honesto."

          "Bueno, para ser justo," dice Bruce. "No es tan fácil capturar este tipo de criaturas sin matarlas. El dueño probablemente tuvo que pagar buen dinero para conseguir estos monstruos, y probablemente un montón de ellos murieron en los sótanos antes de que pudiera usarlos. Los ha estado guardando ahí durante años, después de todo."
