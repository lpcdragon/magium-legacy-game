  - name: b2_ch04b_obstacles
    routes:
      - condition: b2_ch2_fist = 1
        texts:
          - source: scene_text
            paragraph: 35
            text: |-
              Cuando terminamos de hablar, notamos a Bruce corriendo hacia nosotros, y deteniéndose unos segundos para recuperar el aliento cuando está lo bastante cerca.

              "¡Están los dos locos!" dice Bruce.

              "Bueno, tú nos seguiste hasta aquí, así que supongo que eso nos hace tres," le digo.

              "¿Qué están planeando hacer ustedes dos?" me pregunta Bruce.

              "Estábamos a punto de ir a matar a los--"

              Dejo de hablar, porque de repente noto que las cobras se están acercando a nosotros, y que dos aplastadores se están moviendo, tratando de encontrar el mejor sitio desde donde puedan cargar contra nosotros, sin tener que preocuparse por obstáculos en su camino.

              "En realidad, da igual," digo. "Esperen, déjenme pensar esto un momento."
        choices:
          - position: 1
            text: Intentar provocar a las cobras para que escupan ácido sobre los merodeadores
            effects:
              - set:
                  current_scene: b2_ch04b_lure
                  b2_ch4_tactic: 1
          - position: 2
            text: Pedirle a Leila que se encargue de los aplastadores, mientras nosotros nos encargamos de las cobras
            effects:
              - set:
                  current_scene: b2_ch04b_leila_tramplers
                  b2_ch4_tactic: 2
          - position: 3
            text: Concentrarse en matar a la manticora primero
            effects:
              - set:
                  current_scene: b2_ch04b_manticore_first
                  b2_ch4_tactic: 3
