              "¡Te pagué para que hicieras el trabajo, no para escuchar tus excusas!" grita el embajador.

              "No me pagaste nada," dice Wilhelm. "Solo me prometiste que me sacarías de este lugar, y que te asegurarías de que no me ejecutaran por matar a un compañero de equipo, mientras yo cumpliera mi parte del trato. Bueno, estoy aquí para decirte que el trato se canceló. No voy a hacerlo más. Es demasiado arriesgado. Ya intenté asesinarlo una vez, y fallé. Ahora estará esperándolo. No tiene sentido intentar asesinar a un objetivo que ya te descubrió."

              "¡Si ya no puedes apuñalarlo por la espalda, entonces simplemente atácalo directamente, imbécil!" dice el embajador. "¡No me importa cómo hagas el trabajo. Solo lo quiero muerto!"

