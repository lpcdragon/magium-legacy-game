            paragraph: 88
            text: |-
              "No creo que hayan terminado. Ni siquiera he visto grifos todavía."

              "¿No dijiste que ya mataste a los grifos?" me pregunta Bruce.

              "Sí, pero no creo que esos fueran los únicos," digo.

              "No estaría tan seguro de eso," dice Bruce. "Capturar grifos es difícil. Y escuché que algunas de sus criaturas también murieron durante el entrenamiento. Si su inventario se agotó, podrían verse forzados a volver a usar las criaturas de sus eventos regulares para las otras divisiones."
