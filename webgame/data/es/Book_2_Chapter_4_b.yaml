            paragraph: 48
            text: |-
              "Bruce," digo, "te recomiendo que vengas conmigo. Siento decir esto, pero no creo que seas lo bastante fuerte para poder cortar la armadura de esos aplastadores."

              "Ah," dice Bruce. "Claro, claro... Ya voy."

              Empezamos a dirigirnos hacia las cobras gigantes, y las dos criaturas ahora se detienen en seco, preparándose para atacarnos.

              "Asegúrate de nunca dejar de moverte lateralmente," le digo a Bruce, mientras nos acercamos a esos reptiles. "Las cobras solo pueden disparar su ácido en línea recta, y les toma unos segundos apuntar, así que mientras no les des el tiempo que necesitan, no podrán darte."

              "Entendido," dice Bruce.

              "Tú encárgate de la de la izquierda," le digo, y me lanzo hacia la cobra de la derecha.
          - source: scene_text_2
            paragraph: 7
            text: |-
              Provoco a la cobra quedándome quieto en un sitio durante dos segundos, y luego salto fuera del camino, haciendo que la criatura falle su disparo y desperdicie su ácido. Mientras ese reptil está ocupado acumulando más ácido en sus glándulas, me lanzo hacia ella, y la apuñalo en la cabeza, matándola de un solo golpe.

              Echo un vistazo para ver si Bruce necesita ayuda, pero parece haberse manejado bastante bien solo. La otra bestia ya está muerta, con su cabeza cortada en el suelo junto a su cuerpo, y Bruce ahora viene hacia mí, sosteniendo su espada a dos manos al costado mientras camina. Leila también terminó con los aplastadores, y ahora viene hacia nosotros.

              ¿Y qué hay de los merodeadores, entonces?
