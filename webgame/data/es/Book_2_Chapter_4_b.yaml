  - name: b2_ch04b_bonus
    texts:
      - source: scene_text
        paragraph: 103
        text: |-
          "Hadrik, ¿qué haces aquí?" dice Kate, conmocionada. "¡No tienes permitido ayudarme! ¡Te van a prohibir del torneo!"

          "No, no lo harán," dice Hadrik. "Nunca existió tal regla. ¿No prestaste atención a los anuncios del principio?"

          Luego baja la voz, para que el presentador y los espectadores no puedan escucharlo.

          "Y además," dice Hadrik. "Estabas planeando usar tu magia de hielo justo ahora, ¿verdad?"

          "Yo..." empieza a decir Kate, pero duda en continuar.

          "¡No hay de qué preocuparse!" dice Hadrik, mientras le da una palmada en el costado del brazo. "¡Lo único que quería era asegurarme de que este magnífico evento de la arena pueda seguir su curso hasta el final!"

          Luego se aleja de ella, y mira hacia los monstruos, intentando decidir a cuál atacar primero.

          "¡Atención, participante Hadrik!" dice el presentador, en voz alta. "¡Abandonará el área de combate inmediatamente o enfrentará las consecuencias! ¿Entiende?"

          "Y con estas consecuencias," dice Hadrik. "¿quiere decir que seré invitado a unirme a una ronda extra al final del evento?"
      - source: scene_text_2
        paragraph: 30
        text: |-
          "Bueno..." dice el presentador. "Técnicamente, sí. ¡Pero aun así no puede interferir con las peleas de otros participantes!"

          "¿Por qué no?" pregunta Hadrik. "¿Es esa una de las reglas estándar de la arena?"

          "Bueno, no, pero--"

          "¡Entonces no veo el problema!" dice Hadrik.

          "¡El problema es que está arruinando el espectáculo!" suelta el presentador, de repente.

          "¿Ah, sí?" dice Hadrik, con una sonrisa.

          Luego se vuelve hacia la audiencia, y levanta los brazos.

          "¿Qué opinan todos ustedes?" grita Hadrik a la multitud. "¿Estoy arruinando el espectáculo?"

          "¡Nooooo!" gritan los espectadores, al unísono.

          "¿Quieren que me quede?" les pregunta Hadrik.

          En respuesta a la pregunta de Hadrik, la multitud vitorea más fuerte que nunca.

          "¡Bueno, supongo que eso está resuelto entonces!" dice Hadrik, al presentador, y luego se lanza hacia un grifo que está volando a menor altitud.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch04b_obedient
  - name: b2_ch04b_obedient
    texts:
      - source: scene_text
        paragraph: 104
        text: |-
          Salta sobre la espalda de la criatura, igual que hizo con el anterior, y se agarra firmemente de su melena, asegurándose de no ser derribado. El grifo intenta sacudírselo, igual que el anterior, pero esta vez, la bestia deja de moverse después de un rato, luciendo casi como si estuviera aceptando a Hadrik como su nuevo amo.

          "¡Veo que eres más inteligente que el otro!" dice Hadrik. "De acuerdo entonces, veamos qué tan bien cooperas. Primero, iremos allí. Si realmente vamos a hacer esto, entonces voy a necesitar un arma de largo alcance, antes que nada."

          Para sorpresa de todos, el grifo obedientemente sigue la orden de Hadrik, y lo lleva hasta el costado de la arena, para que pueda tomar una alabarda de la pared. Luego tira de la melena del grifo, para mostrarle la dirección en la que quiere ir, y la criatura lo lleva volando hasta una de las gárgolas, arriba en el cielo. Hadrik le corta la cabeza de los hombros a la gárgola con un solo movimiento de su alabarda, y luego le ordena al grifo que pase al siguiente objetivo. En los siguientes minutos, el enano viaja de un monstruo a otro, en la espalda de su fiel grifo, y los mata a todos en rápida sucesión, sin siquiera despeinarse.

          Cuando los dos finalmente descienden al suelo, Hadrik ve que Kate también se había encargado de los tigres dientes de sable y los lobos terribles en el suelo mientras tanto. Esto deja al grifo de Hadrik como el último monstruo restante en el campo de batalla. Mientras las multitudes siguen vitoreando, Hadrik desmonta del grifo, y levanta los brazos en el aire, para silenciar a la multitud.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch04b_preposterous
  - name: b2_ch04b_preposterous
    texts:
      - source: scene_text
        paragraph: 105
        text: |-
          "Todas las demás bestias están muertas," dice Hadrik, al presentador. "Esta última ya se ha rendido ante mí. ¡Solicito permiso para perdonarle la vida, como muestra de gratitud por sus servicios! ¿Qué dice usted?"

          "¡Absurdo!" grita el presentador. "¿En serio espera--"

          "Permiso concedido," escuchamos la voz del dueño de la arena, mientras se abre paso sobre la plataforma elevada donde está parado el presentador. "Si ese es su deseo, entonces llevaremos a este grifo de vuelta a su celda, lo alimentaremos, y luego lo liberaremos de vuelta a la naturaleza. Probablemente nunca habrá un evento como este de nuevo en mi vida, así que no habría razón para mantener a esta bestia encadenada por más tiempo."

          "¡Muy agradecido!" dice Hadrik.

          "Espero," dice el dueño de la arena, "que continúe proporcionándonos el mismo nivel de entretenimiento de calidad en la cuarta ronda como en las dos peleas anteriores."

          "¡Haré lo mejor que pueda!" dice Hadrik.

          "Oh," dice el dueño. "Y esperaré lo mismo de usted, señorita Kate, ya que también se unirá a su amigo en la ronda extra como indeseable. Dado que su transgresión de las reglas fue hecha específicamente para salvarle la vida, confío en que no habrá objeciones, ¿verdad?"
      - source: scene_text_2
        paragraph: 35
        text: |-
          "No..." dice Kate. "No tengo objeciones."

          "¡Muy bien!" dice el dueño. "Ahora, si no les importa, les agradecería que despejaran el área de combate lo antes posible. La pelea de la siguiente división está a punto de comenzar."

          Mientras el dueño se da la vuelta para irse, Kate y los demás también se dirigen hacia sus respectivas áreas de división, mientras los guerreros de la sexta división se preparan para entrar al campo de batalla.
