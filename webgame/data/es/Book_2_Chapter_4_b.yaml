      - condition: b2_ch2_threatened = 0 AND b2_ch4_charge = 1 AND b2_ch2_fist <> 1 AND b2_ch2_fist <> 2
        texts:
          - source: scene_text
            paragraph: 31
            text: |-
              ¡Perfecto! Dos criaturas ya cayeron. Ahora veamos a qué monstruos debería atacar a continuación.

              Antes de poder decidir, escucho el sonido de algo cayendo al suelo detrás de mí, y me doy la vuelta para ver qué pasó. Por lo que puedo deducir, parece que Wilhelm es el que ha sido noqueado, y Leila es la que lo golpeó. Wilhelm estaba justo detrás de mí, y sostenía una daga de empuñadura naranja antes de que Leila lo dejara fuera de combate. Si la memoria no me falla, las dagas de empuñadura naranja son típicamente usadas por asesinos entrenados, y son armas encantadas que ayudan a ocultar el aura de uno. ¿Esto significa que Wilhelm era un asesino?

              "Podrías al menos haberme pedido que viniera contigo," escribe Leila, mientras me mira directamente, con una expresión molesta en la cara.

              "Espera, ¿qué le pasó a Wilhelm?" le pregunto.

              "Pensé que sería evidente," escribe Leila. "Estaba intentando matarte. Lo noqueé."

              "Vaya..." digo. "Ni siquiera conocía al tipo. No tengo idea de por qué querría verme muerto."

              "Entonces, ¿cuál es el plan?" escribe Leila. "¿A cuál de las criaturas atacamos primero?"

              "Empecemos con ese merodeador de ahí," digo, mientras señalo al merodeador que está más cerca de nosotros.
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch04b_obstacles
