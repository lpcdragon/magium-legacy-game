              "Ah, ¿eso crees?" dice el matón. "Bueno, ¿por qué no van ustedes dos y pelean contra esas criaturas juntos, entonces? Quizás al menos nos sirvan como una distracción decente."

              "O quizás podrías cerrar la maldita boca y prestar más atención al campo de batalla," digo. "Las criaturas ya se están moviendo para rodearnos."

              Las cobras ahora están intentando llegar a nuestro lado derecho, mientras los merodeadores vienen por la izquierda. Tres aplastadores también se están abriendo paso hacia el área de combate, y están golpeando el suelo con sus pezuñas, preparándose para cargar. Las manticoras siguen dando vueltas en el cielo, esperando su momento.
