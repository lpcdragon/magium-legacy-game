  - name: b2_ch04b_wilhelm_team
    routes:
      - condition: b2_ch2_threatened = 2 AND b2_ch2_lessathi = 0
        texts:
          - source: scene_text
            paragraph: 64
            text: |-
              ¡Perfecto! Dos criaturas ya están derribadas. Pero ¿y Wilhelm? ¿Ya está intentando matarme?

              Me doy la vuelta y veo, para mi sorpresa, que Wilhelm actualmente sigue ayudando a los demás a pelear con los merodeadores. ¡Supongo que mi amenaza de hace tres días fue mucho más efectiva de lo que pensé!

              Le hago una señal al mago, y empezamos a dirigirnos hacia los otros merodeadores.
        effects:
          - set:
              ac_b2_ch4_intimidation: 1
            achievement:
              id: ac_b2_ch4_intimidation
              title: Intimidación exitosa
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch04b_insane
      - condition: b2_ch2_threatened = 2 AND b2_ch2_lessathi = 1
        texts:
