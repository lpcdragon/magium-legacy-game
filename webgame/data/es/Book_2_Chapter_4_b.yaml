            paragraph: 100
            text: |-
              "Si llega a eso, entonces sí," digo. "Y creo que mis otros amigos también lo harían. Probablemente."

              "Ya veo," escribe Leila, con una ligera sonrisa en su rostro. "Entonces no estarás solo. Cuando lo inevitable suceda, incluso si tus amigos no se unen a ti, estoy preparada para tomar el lado de Kate, sin importar el costo."

              "Por ahora, esperemos que no sea necesario," digo.

              No mucho después de que termino mi conversación con Leila, Kate es perseguida por uno de los grifos hasta la pared que está junto a la reja de nuestra división, y luego queda acorralada contra dicha pared, sin lugar a donde escapar. El grifo está descendiendo hacia ella, lentamente, mientras aún mantiene un poco de altitud, y se está preparando para dar el golpe final. Kate parece haber perdido su daga, y no hay armas a la vista. Ya puedo sentir el aire a nuestro alrededor volviéndose más frío.

              ¿Es esto? ¿Realmente vamos a hacer esto? Maldición, realmente estaba esperando ganar este torneo y convertirme en mago. Bueno, fue divertido mientras duró, supongo...
          - source: scene_text_2
            paragraph: 29
            text: |-
              De repente, una de las rejas de hierro sale volando de sus bisagras, y cae al suelo, con un fuerte estruendo. En cuestión de segundos, Hadrik sale por la reja, y se lanza hacia el grifo que está atacando a Kate, dando un salto muy alto, y aterrizando sobre la espalda de la bestia. El grifo no parece muy contento con lo que está pasando, e intenta tirar a Hadrik de su espalda haciendo movimientos bruscos y violentos, y agitando sus alas continuamente.

              "¡Ja!" dice Hadrik, mientras mantiene el equilibrio agarrándose de la melena del grifo con una de sus manos. "¡Siempre quise montar uno de estos!"

              Luego usa su otra mano para saludar a la multitud, y grita tan fuerte como puede:

              "¿Me extrañaron?"

              La multitud estalla en una explosión de gritos y vítores, mientras el grifo sigue intentando sacudirse a Hadrik de su espalda con todas sus fuerzas. Al ver que la bestia no planea calmarse pronto, Hadrik agarra su cabeza con ambas manos, y le rompe el cuello con un rápido movimiento de sus brazos.

              "¡Abajo vamos!" dice Hadrik, mientras el grifo cae al suelo, junto con él.

              Luego se baja de la criatura, y se dirige hacia Kate.

              "¿Se encuentra bien, milady?" dice Hadrik, con una reverencia.
