        paragraph: 49
        text: |-
          "Leila," digo. "¿Podrías encargarte de los aplastadores? Con tu nivel de fuerza, deberías poder atravesar sus pieles duras. Yo iré a ocuparme de esas dos cobras mientras tanto."

          "En ello," escribe Leila.

