scenes:
  - name: b2_ch04b_bastard
    routes:
      - condition: b2_ch2_deal = 3
        texts:
          - source: scene_text
            paragraph: 2
            text: |-
              "Espera, ¿quién eres tú y qué haces aquí?" dice Bruce, al notar finalmente al lessathi con la túnica azul oscuro.

              "Soy una adición de último momento a su división," dice el lessathi. "Acabo de ser capturado esta mañana."

              "Vaya," dice Bruce. "Bueno, mala suerte entonces. Espero que seas bueno peleando, porque va a ser un viaje difícil."

              "Me las arreglaré," dice el lessathi.

              Escuchamos un rugido de león proveniente de más allá de los portones que llevan a la guarida de las criaturas. Dos manticoras salen de la guarida, y luego se elevan inmediatamente al cielo, igual que las que pelearon contra la primera división. Saliendo de detrás de ellas, tres merodeadores del desierto también se están abriendo paso hacia el área de combate. Pero esas no son las únicas bestias que vienen hacia nosotros. Dos cobras escupe-ácido gigantes también se están deslizando fuera de la guarida, y si mis oídos no me fallan, creo que también puedo escuchar los sonidos de unos cuantos aplastadores, preparándose para cargar hacia nosotros.
          - source: scene_text_2
            paragraph: 2
            text: |-
              "Para esta pelea, vamos a intentar algo un poco diferente," dice el presentador. "Los miembros de la cuarta división tendrán que pelear no contra dos, no contra tres, sino contra cuatro tipos diferentes de nuestras criaturas más fuertes, y tendrán que matarlas a todas si quieren avanzar a la siguiente ronda. Este cambio en nuestro programa fue una petición personal de nuestro estimado dueño de la arena, el señor Venard."

              Ese bastardo. ¿Es esta su forma de decirme que para salir de aquí con vida, necesitaré superar tanto a Hadrik como a Daren? ¡Tiene que ser una broma!

              "¡Solo asegúrense de seguir mis órdenes, y todo saldrá bien!" dice Bruce.

              "¡Lo sabía!" dice el matón ex-noble. "Sabía que empezarías a jugar al líder en cuanto entráramos a la arena. Ya te dije, nadie va a escucharte. ¡Así que puedes tomar tus órdenes y metértelas por donde te quepan!"
        choices:
          - position: 1
            text: ¿De verdad es este el momento y el lugar para tener esta discusión?
            effects:
              - set:
                  current_scene: b2_ch04b_argument
          - position: 2
            text: En realidad, creo que Bruce lo haría bastante bien como líder.
            effects:
              - set:
                  current_scene: b2_ch04b_bruce
          - position: 3
            text: Estoy completamente de acuerdo. Debería ser yo quien lidere al equipo, no Bruce.
            effects:
              - set:
                  current_scene: b2_ch04b_completely
      - condition: b2_ch2_deal <> 3
