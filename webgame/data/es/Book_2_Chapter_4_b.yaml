            paragraph: 83
            text: |-
              "Espera, ¿dónde está Wilhelm?" me pregunta Bruce, de repente. "¿No estaba contigo?

              "Oh, está por allá," digo, señalando hacia el cuerpo inconsciente de Wilhelm. "Dijo que tenía un poco de sueño, y decidió echarse una siesta."

              "Espera, ¿tú fuiste el que lo noqueó?" pregunta Bruce. "¿Intentó atacarte o algo?"

              "¿Cómo lo adivinaste?" digo.

              "¡Era un asesino!" dice Bruce. "No confío en los asesinos. He estado vigilando mis espaldas por él desde que entramos a la arena. En fin, las siestas están muy bien, pero la siguiente división nos está esperando para dejar el área. Iré a despertarlo."

              Bruce va hacia Wilhelm y empieza a abofetearlo en la cara, mientras le grita.

              "¡Wilhelm!" dice Bruce. "¡Wilhelm, asesino bueno para nada, levántate! Nuestra primera ronda terminó. Necesitamos despejar el área."
          - source: scene_text_2
            paragraph: 21
            text: |-
              Después de unas cuantas bofetadas más en la cara, Wilhelm abre los ojos, agarra la mano de Bruce, y la aprieta con fuerza, mientras lo mira como si quisiera asesinarlo aquí y ahora.

              "Estoy despierto," dice Wilhelm, forzando un tono calmado en su voz. "Salgamos de aquí."

              Nos toma alrededor de un minuto, pero eventualmente volvemos a nuestra área de división, y una vez que reingresamos a nuestra sala, la reja de hierro se cierra detrás de nosotros.

              "Necesito ir a buscar algo de mi mochila," nos dice Wilhelm, poco después de que entramos a la sala. "Vuelvo enseguida."

              "Espero que no intentes asesinar a nadie más de camino al vestuario, Wilbert," dice Bruce. "Si te noquean otra vez, no voy a ir a despertarte."

              Wilhelm le lanza a Bruce una mirada de desprecio antes de abrir la puerta, pero sale de la sala sin decir otra palabra.

              "Eh..." dice el presentador, de repente. "¡Parece que necesitamos hacer una pequeña pausa, para hacer un pequeño inventario de nuestras criaturas restantes. ¡Por favor tengan paciencia! ¡Esto no debería tomar mucho!"

              "¡Ja!" dice Bruce. "Ya se están quedando sin criaturas. ¡Apuesto a que no esperaban que tantas fueran eliminadas en las primeras peleas!"
        choices:
          - position: 1
            text: ¿Eso fue todo? Esperaba ver una colección de criaturas más impresionante.
