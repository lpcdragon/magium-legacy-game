              "No habrá necesidad de una investigación," escuchamos la voz del dueño de la arena, mientras se abre paso hasta la plataforma elevada en la que está parado el presentador. "Primero que nada, hay una pequeña corrección que me gustaría hacer al discurso anterior de nuestro presentador. La mujer que ven ante ustedes ahora no es de hecho una banshee, sino una maga real, sin importar cuán difícil les resulte creerlo a algunos de ustedes. Me disculpo por no haber dejado esto claro desde el principio, pero no quería crear ninguna tensión innecesaria si había alguna posibilidad de que pudiera evitarse."

              La gente en la multitud no se ve muy convencida, y están murmurando entre sí, pero ninguno de ellos parece muy dispuesto a acusar al dueño de mentir.
          - source: scene_text_2
            paragraph: 26
            text: |-
              "En segundo lugar," dice el dueño. "Nuestras reglas establecen claramente que para que un hechizo mágico sea considerado ilegal, necesita activar nuestro sistema de detección mágica. Obviamente, esto es más un vacío legal que otra cosa, y no planeo dejar esto completamente sin castigo, sin embargo, creo que ordenar su ejecución en este caso sería demasiado, dada la naturaleza de su transgresión. Por lo tanto, aceptaré solo convertirla en una indeseable, siempre y cuando ella acepte decirnos cómo logró evadir nuestro sistema de detección mágica."

              "...Muy bien," dice Kate. "La razón por la que sus detectores no se activaron fue porque cuando comencé a crear mi daga de hielo, me aseguré de hacerlo sin dejar que ninguna energía mágica saliera de los confines de mi aura. Dado que sus dispositivos no reaccionan a las auras mágicas regulares de los magos mientras no están lanzando hechizos, deduje que las partículas mágicas necesitan realmente salir del aura de una persona para ser detectadas, así que decidí arriesgarme, y manejar la creación de mi daga lo más cerca posible de mi cuerpo, para intentar engañar al sistema."

              "Muy intrigante..." dice el dueño. "Entonces tu forma de evitar la detección de hecho requirió el uso de una técnica altamente ineficiente y de una cantidad ridículamente baja de energía mágica para tener éxito. Eso significa que no tengo que preocuparme de que nadie abuse de este vacío legal de manera seria, en el futuro cercano. De acuerdo, entonces. En ese caso, como se prometió, eres libre de volver a tu área de división. Sin embargo, no hace falta decir que la próxima vez que intentes abusar de nuestro sistema así, las consecuencias serán mucho más severas."
          - source: scene_3
            paragraph: 3
            text: |-
              "Entiendo," dice Kate.

              "Entonces prepárate para despejar el área de combate," dice el dueño. "La siguiente pelea comenzará en breve."

              Cuando el dueño se da la vuelta para irse, Kate y los demás también se dirigen hacia su área de división, mientras los guerreros de la sexta división se preparan para entrar al campo de batalla.
