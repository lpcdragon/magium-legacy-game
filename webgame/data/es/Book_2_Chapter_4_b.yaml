            paragraph: 65
            text: |-
              ¡Perfecto! Dos criaturas ya están derribadas. Pero ahora hay un nuevo problema con el que necesito lidiar. Desde que entramos a la arena, he estado vigilando de cerca a Wilhelm, porque mi premonición no me dijo exactamente cuándo intentaría matarme. Intenté que no se notara, pero lo he visto acercándose a mí desde que salté sobre ese merodeador. El hecho de que no pueda verlo ahora solo puede significar una cosa.

              Me doy la vuelta rápidamente, y veo a Wilhelm parado justo ahí, sosteniendo su daga de empuñadura naranja con ambas manos, luciendo como si hubiera estado a solo segundos de asestar un golpe letal. Sin embargo, en este preciso momento, el hombre parece casi congelado. Sigue agarrado a su daga con ambas manos como si aún estuviera a punto de atacarme, pero ahora que lo estoy mirando directamente, todos sus instintos de asesino deben estar diciéndole que retroceda.

              "¿Wilhelm?" digo.

              Wilhelm no dice nada. Sigue mirándome, en silencio, mientras un hilo de sudor le recorre la frente.

              "Wilhelm, ¿estás bien, amigo mío?" le digo, con tono preocupado, mientras pongo mi mano izquierda en su hombro. "¡Te ves bastante tenso!"
          - source: scene_text_2
            paragraph: 17
            text: |-
              Inmediatamente después de dejar de hablar, uso mi mano derecha para golpearlo muy fuerte en la sien izquierda con la empuñadura de mi daga, para asegurarme de noquearlo sin matarlo. Pierde la consciencia casi al instante, y luego cae al suelo, con su daga a su lado.

              "Idiota," le digo, y luego empiezo a dirigirme hacia los demás.

              "Entonces, eh..." escucho la voz del mago detrás de mí, mientras me alcanza. "¿Tienes alguna idea de por qué el señor sonrisas de allá querría matarte?"

              Me había olvidado completamente de este tipo. Pensé que ya se había ido a ayudar a los demás, como los dos matones.

              "Ni idea," digo. "Lo averiguaré después. Ahora mismo, necesitamos concentrarnos en matar a las criaturas."
