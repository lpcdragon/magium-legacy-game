  - name: b2_ch04b_cobras
    routes:
      - condition: b2_ch4_tactic = 3 AND b2_ch2_fist <> 1 AND b2_ch2_fist <> 2
        texts:
          - source: scene_text
            paragraph: 46
            text: |-
              Yo también empiezo a dirigirme hacia mis objetivos, y cuando las cobras me ven acercarme, las dos se detienen en seco y se preparan para enfrentarme.

              Recuerda su comportamiento. Las cobras necesitan al menos dos segundos para apuntar. Mientras me asegure de nunca dejar de moverme lateralmente, no deberían poder darme. Pero eso solo no me dará una apertura. Necesito ser un poco más inventivo que eso.

              Decido provocar a las cobras quedándome quieto en un sitio durante dos segundos, y luego saltando fuera del camino, asegurándome así de que ambas criaturas fallen sus disparos y desperdicien su ácido. Mientras esos dos reptiles están ocupados acumulando más ácido en sus glándulas, aprovecho la situación, y me lanzo hacia la de la derecha, apuñalándola en la cabeza, y matándola de un solo golpe. La otra bestia intenta lanzarse hacia mí, para arrancarme la cabeza de un mordisco, pero anticipo fácilmente su ataque por la forma en que movió su cuerpo, y me aparto de su camino, dándole el golpe de gracia con mi hoja poco después.

              Echo un vistazo para ver cómo le va a Leila, pero parece que ya se ha encargado de ambos aplastadores, y ahora viene hacia mí.

              ¿Y qué hay de los merodeadores, entonces?
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch04b_signal
