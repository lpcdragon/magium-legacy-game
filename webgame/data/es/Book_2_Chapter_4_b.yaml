            paragraph: 54
            text: |-
              Al mirar hacia los otros miembros de mi equipo, veo que están todos aún vivos, sorprendentemente, e incluso se las arreglaron para derribar a un merodeador ellos solos. Le hago una señal a Leila, y nos dirigimos hacia ellos.

              Acabar con el último merodeador fue pan comido. Ni siquiera necesitamos usar sus debilidades. Mientras estamos ahí, en medio de todos esos cadáveres, podemos escuchar a las multitudes vitoreando como nunca antes. Evidentemente no esperaban que ganáramos. Bruce está levantando los brazos, en señal de victoria, pero el resto de nosotros simplemente estamos esperando la señal del presentador de que la ronda terminó, para poder descansar un poco.

              Después de un rato, el presentador finalmente nos pide que desalojemos el área de combate, y nos preparamos para volver a nuestra sala de división.
