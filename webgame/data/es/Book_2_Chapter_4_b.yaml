  - name: b2_ch04b_woman
    routes:
      - condition: b2_ch2_heard = 0 AND b2_ch4_backpack = 1
        texts:
          - source: scene_text
            paragraph: 59
            text: |-
              Bruce es el primero en enfrentarse a los merodeadores, gritando fuerte y blandiendo su gran espada a dos manos hacia ellos, en un intento de intimidarlos. Leila se lanza hacia el merodeador que está más cerca de Bruce, intentando llegar a su cabeza, pero la criatura le bloquea el paso con sus garras, e intenta atacarla con su cola. Se aparta del camino, e intenta atacarlo otra vez, desde el costado.

              Uno de los merodeadores carga contra el matón ex-noble, e intenta empalarlo con su cola. El matón grita de la impresión, y salta hacia atrás, pero no parece que vaya a escapar a tiempo. De repente, Bruce salta de la nada, y desvía la cola del merodeador con su espada, haciendo que la criatura retroceda un poco, para medir cuidadosamente a su nuevo oponente.

              "¡La arena no es lugar para cobardes!" grita Bruce al matón. "¡Este es un lugar para hombres de verdad! ¡Si piensas pelear como una mujer, entonces quítate de mi camino!"

              Bruce entonces se da cuenta rápidamente de la mala elección de palabras de su frase, y se vuelve hacia Leila, que ahora lo está mirando con el ceño fruncido.

              "O también puedes... pelear como una mujer si quieres..." dice Bruce. "Solo no seas un cobarde. Ya sabes a qué me refiero."

              Bruce y Leila entonces reanudan su pelea con el otro merodeador, mientras Wilhelm les da apoyo.

              "Oye, tú," digo. "¡Matón ex-noble!"

              "¿Cómo me llamaste?" dice el matón, en tono amenazante.
          - source: scene_text_2
            paragraph: 15
            text: |-
              "¡Olvida eso!" le digo. "¿Pueden tú y tu amigo matón pararse aquí, y hacer ruidos fuertes? Necesito a alguien que distraiga a ese merodeador, para poder colocarme detrás de él. La criatura parece haberte tomado cariño, ¡así que serías la distracción perfecta!"

              "¡Que te jodan a ti y a tus distracciones!" dice el matón. "¿Me tomas por idiota?"

              "Si solo es una distracción, yo puedo encargarme," dice el mago. "¿Dónde quieres que me pare?"

              "Allí sería perfecto," le digo, señalándole la dirección correcta.

              Los dos matones no parecen querer ser parte de mi plan, así que se alejan de nosotros, y se unen a los demás. El mago se pone en posición, y empieza a lanzar piedras al merodeador, para hacer que lo persiga. En cuanto consigue la atención del merodeador del desierto, camino detrás de la criatura y rápidamente me subo a su espalda.

              No estoy exactamente seguro de dónde está la debilidad de este monstruo, pero sé que debería estar en algún lugar de la parte superior de su espalda, entre dos de sus escamas. Comienzo a apuñalar a la criatura repetidamente entre sus escamas, intentando encontrar el punto débil por proceso de eliminación.
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch04b_marauder2
