              Echo un vistazo para ver si Bruce necesita ayuda, pero parece haberse manejado bastante bien solo. La otra bestia ya está muerta, con su cabeza cortada en el suelo junto a su cuerpo, y Bruce ahora viene hacia mí, sosteniendo su espada a dos manos al costado mientras camina. Leila también terminó con los aplastadores, y ahora viene hacia nosotros.

              Esto es todo. Se acabó. La ronda finalmente terminó. Las multitudes están enloquecidas. Evidentemente no esperaban que lo lográramos. Si fuera Hadrik, probablemente estaría dando algún tipo de discurso ahora mismo, pero para ser perfectamente honesto, todo lo que quiero en este momento es volver a mi área de división, y descansar un poco, antes de que comience la siguiente ronda.

              Después de un rato, el presentador finalmente nos pide que desalojemos el área de combate, y nos preparamos para volver a nuestra sala de división.
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch04b_wilhelm_final
  - name: b2_ch04b_barry_tramplers
    effects:
      - set:
          ac_b2_ch4_trampler: 1
        achievement:
          id: ac_b2_ch4_trampler
          title: Cazador de aplastadores
    routes:
      - condition: b2_ch4_tactic <> 1 AND b2_ch2_fist <> 1 AND b2_ch2_fist <> 2
        texts:
          - source: scene_text
            paragraph: 52
            text: |-
              Las bestias comienzan su carga, y pasamos los siguientes segundos corriendo el uno hacia el otro, sin dar señales de detenernos.

              Ahora bien, si lo que he leído en todas mis notas es correcto, los aplastadores son mucho más fáciles de intimidar de lo que uno sospecharía. Los aplastadores no están acostumbrados a ser desafiados en su propio terreno, así que si sigues corriendo hacia ellos a toda velocidad mientras cargan contra ti, eventualmente dejarán de cargar y retrocederán.

              Por otro lado, si mis notas están equivocadas, esto no va a terminar muy bien. Esperemos lo mejor.

              Seguimos corriendo el uno hacia el otro durante unos segundos más, y cuando llego a unos pocos metros de ellos, los dos aplastadores finalmente se detienen, y comienzan a balancear sus colas de maza con púas hacia mí, en un intento de intimidarme.

              Esto es exactamente lo que estaba esperando. La fuerza de un aplastador reside en sus cargas. Unos cuantos golpes de cola solo sirven para espantar bestias tontas. A mí no me van a molestar.
          - source: scene_text_2
            paragraph: 11
            text: |-
              Me lanzo hacia uno de los aplastadores, y me aseguro de esquivar su cola, antes de colocarme a su lado derecho y apuñalarlo en el cuello con mi cuchillo. Mientras la bestia cae al suelo, no pierdo tiempo, y me lanzo hacia el otro. El segundo aplastador intenta atacarme con sus cuernos, pero me aparto fácilmente del camino, y le corto la garganta con mi hoja, haciendo que caiga lentamente al suelo también, y muera por la pérdida de sangre.

              ¡Eh, eso no fue tan difícil! Veamos qué está haciendo Leila.

              Parece que ella tampoco tuvo muchos problemas por su lado. Las cobras están ambas muertas, y ya viene en mi dirección.

              ¿Qué hay de los merodeadores, entonces?
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch04b_signal
