  - name: b2_ch04b_wilhelm_lessathi
    routes:
      - condition: b2_ch2_threatened = 1
        texts:
          - source: scene_text
            paragraph: 7
            text: |-
              De repente me doy cuenta de que Wilhelm ya no está a nuestro lado. ¿Eso significa lo que creo que significa?

              Me doy la vuelta rápidamente, y veo a Wilhelm, sosteniendo su daga de empuñadura naranja con ambas manos, como si hubiera estado a solo unos segundos de asestar un golpe de gracia.

              "¿Qué estás haciendo, Wilhelm?" le digo.

              Wilhelm parece casi congelado. Sigue agarrando su daga con ambas manos como si todavía estuviera a punto de atacarme, pero ahora que estoy de frente a él, todos sus instintos de asesino deben estar diciéndole que se retire, en su lugar.

              "Wilhelm, guarda esa arma antes de que te hagas daño," le digo.

              Wilhelm está sudando mucho. Se queda ahí, mirándome durante unos segundos más, luego de repente enfunda su daga y se va hacia nuestra área de división, sin decir una sola palabra.

              Ya era hora. Ojalá se lo piense dos veces antes de intentarlo de nuevo.
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch04b_associates
