    effects:
      - set:
          ac_b2_ch4_spear: 1
        achievement:
          id: ac_b2_ch4_spear
          title: Lanzador de lanzas
        condition: strength >= 1 AND combat_technique >= 1
    routes:
      - condition: strength < 1 AND b2_ch2_fist <> 1 AND b2_ch2_fist <> 2
        texts:
          - source: scene_text
            paragraph: 37
            text: |-
              "Deberíamos matar a esa manticora primero," digo. "No podemos concentrarnos en matar a los otros monstruos si siempre tenemos que preocuparnos por ser atacados desde arriba."

              "¿Qué tienes en mente?" escribe Leila.

              "Quiero lanzarle algunas lanzas," le digo, y luego señalo hacia las paredes de la arena, que tienen una amplia variedad de armas montadas en ellas, incluyendo lanzas.

              "De acuerdo," escribe Leila. "Vamos, entonces."

              Rodeamos a los merodeadores, y nos dirigimos hacia la pared de la arena que está más cerca de nosotros, mientras nos aseguramos de nunca perder de vista a los aplastadores y las cobras. Cuando la alcanzamos, tomo una lanza de la pared, y se la lanzo a la manticora. Desafortunadamente, no pude lanzar la lanza lo bastante lejos, y cayó antes de alcanzar su objetivo.

              Supongo que eso es lo que me pasa por intentar lucirme, cuando nunca he lanzado una lanza en mi vida.

              Leila suspira.

              "Hazte a un lado," escribe. "Lo haré yo."

              Entonces toma otra lanza de la pared, y la lanza hacia la manticora. La lanza atraviesa el pecho de la manticora, y mata a la bestia en pleno vuelo, haciéndola caer al suelo.
          - source: scene_text_2
            paragraph: 5
            text: |-
              Las multitudes estallan en vítores. En realidad, creo que llevan un rato vitoreando. Es solo que he estado demasiado concentrado en la batalla para notarlo.

              Mientras nos encargábamos de la manticora, los aplastadores han aprovechado la oportunidad para reposicionarse, y ahora se están preparando para cargar contra nosotros a toda velocidad. Las cobras también vienen hacia nosotros. Los escorpiones parecen habernos abandonado, y se dirigen hacia los otros miembros de nuestro equipo.
        effects:
