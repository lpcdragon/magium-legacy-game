            paragraph: 11
            text: |-
              "¿De verdad es este el momento y el lugar para tener esta discusión?"

              "Entonces, ¿qué propones hacer, listillo?" dice el matón. "¿Arrodillarte ante el todopoderoso Bruce y aceptar cada una de sus órdenes?"

              "No," digo. "Propongo que cierres la maldita boca y prestes más atención al campo de batalla. Las criaturas ya se están moviendo para rodearnos."

              Las cobras ahora están intentando llegar a nuestro lado derecho, mientras los merodeadores vienen por la izquierda. Tres aplastadores también se están abriendo paso hacia el área de combate, y están golpeando el suelo con sus pezuñas, preparándose para cargar. Las manticoras siguen dando vueltas en el cielo, esperando su momento.
