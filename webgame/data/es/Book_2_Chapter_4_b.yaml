              La multitud ahora observa en completo silencio, mientras Kate se levanta, y empieza a buscar una salida a su situación.

              "¡Que nadie entre en pánico!" dice el presentador, de repente, al ver las reacciones asustadas del público. "¡Les aseguro que llegaremos al fondo de esto en cuanto termine la pelea!"

