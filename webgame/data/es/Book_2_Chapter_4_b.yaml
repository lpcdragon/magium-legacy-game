        effects:
          - set:
              current_scene: b2_ch04b_spared2
  - name: b2_ch04b_spared2
    texts:
      - source: scene_text
        paragraph: 99
        text: |-
          Kate es la única que parece calmada y serena, mientras sus instintos toman el control otra vez, igual que en la ilusión del chamán ogro, y empieza a moverse entre una criatura y otra, cortando la garganta de una y luego pasando al siguiente objetivo, sin movimientos desperdiciados.

          Aun así, los enemigos en el suelo son por mucho los más débiles del grupo. Las verdaderas amenazas son las gárgolas y los grifos. Con la fuerza de las gárgolas y el tamaño de los grifos, puedo ver muy pocas maneras en las que Kate podría ganar una pelea contra ellos, especialmente mientras tienen la ventaja aérea.

          Los grifos ahora están empezando a descender hacia los gladiadores, y rápidamente cobran su primera víctima. Uno de los gladiadores de aspecto más frágil en el grupo de Kate es agarrado por las garras de un grifo, y la bestia empieza a picotear el pecho del hombre con su pico, mientras aún está vivo. Al escuchar los gritos de auxilio del hombre, y sus terribles alaridos, los otros hombres abandonan toda pretensión de valor, y huyen tan rápido como pueden, en todas direcciones. Uno de los otros grifos desciende, e intenta atacar a Kate.
      - source: scene_text_2
        paragraph: 28
        text: |-
          Conociendo el comportamiento y los patrones de ataque de la criatura, Kate logra apartarse del camino, y hacer un corte a una de las garras de la criatura con su daga, pero no consigue herir mucho a la bestia antes de que vuelva a volar, preparándose para otro picado.

          "Las cosas no pintan muy bien para Kate," me escribe Leila. "En el peor de los casos, podría incluso verse forzada a usar su magia de hielo. Sabes lo que eso significa, ¿verdad?"

          "Sí," digo. "El castigo por usar magia en la arena es la muerte. Para salir de aquí con vida después de eso, tendría que pelear contra cada guardia del lugar, y convertir a todo este reino en su enemigo."

          "¿Y qué harías tú si eso pasara?" escribe Leila, mirándome con una expresión muy seria en su rostro. "¿Te unirías a ella, y convertirías al reino en tu enemigo también? ¿Estarías dispuesto a renunciar al torneo del Magium y a tus ambiciones, para tomar su lado en el campo de batalla?"
