              "Quiero que atraigamos a las cobras aquí, cerca de los merodeadores," digo. "Luego enfrentaremos a las cobras de espaldas a los merodeadores, y cuando escupan su ácido, saltamos fuera del camino, haciendo que el ácido golpee a los merodeadores en su lugar. No estoy seguro de si los matará, pero deberíamos poder rematarlos fácilmente después de eso."

              "Suena arriesgado," escribe Leila. "Si no calculamos bien el tiempo, podríamos acabar bañados en ácido, o empalados por los merodeadores desde atrás."

              "Pero si lo hacemos bien, nos libraremos de tres monstruos en un solo movimiento," digo.

              "¿Qué tres monstruos?" escribe Leila. "Solo quedan dos merodeadores."

              "Sí," digo, "pero estoy bastante seguro de que la manticora que está ahí arriba en el cielo se lanzará sobre ti en cuanto matemos a los merodeadores. La manticora que vino a por mí la última vez fue eliminada, así que no creo que esta se arriesgue a atacarme a mí, y tú pareces más frágil que Bruce, así que serías un mejor objetivo. Solo asegúrate de estar preparada, y deberías poder matarla sin muchos problemas."

              "De acuerdo," escribe Leila. "Estaré preparada."

              "¡Suena como un plan!" dice Bruce. "¡Vamos a atraer a esas cobras!"
          - source: scene_text_2
            paragraph: 10
            text: |-
              Nos dirigimos hacia las cobras, y empezamos a lanzarles piedras y hacer ruidos fuertes, para molestarlas. Una vez que estamos seguros de que tenemos toda su atención, empezamos a retroceder hacia los merodeadores, asegurándonos de movernos a la velocidad justa para que las cobras nos sigan, pero no nos alcancen. Cuando llegamos a los merodeadores, les damos la espalda, y nos quedamos quietos unos segundos, esperando a que las cobras ataquen.

              Esos pocos segundos se sienten casi como una eternidad, pero cuando las cobras finalmente escupen su ácido hacia nosotros, todos saltamos fuera del camino al mismo tiempo, y el chorro de ácido golpea a los merodeadores de lleno. Mientras las bestias se retuercen de dolor, los rematamos rápidamente, pasando nuestras hojas por sus cabezas, y luego, como anticipé, la última manticora restante se lanza audazmente hacia Leila, pensando que está distraída. Leila finge ignorancia hasta el último momento, y entonces hace un poderoso corte en el pecho de la criatura, exactamente cuando la alcanza. La manticora cae al suelo, y Leila la remata con un golpe rápido de su daga. Mientras las cobras están ocupadas acumulando más ácido en sus glándulas, los tres nos alejamos de esos reptiles, para decidir nuestro próximo curso de acción.

              Solo quedan las cobras y los aplastadores. Las cobras parecen estar preparándose para otra ronda, mientras los aplastadores parecen haber encontrado un buen sitio desde donde cargar contra nosotros, y se están preparando para salir corriendo.
