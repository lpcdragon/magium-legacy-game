  - name: b2_ch04b_spared1
    texts:
      - source: scene_text
        paragraph: 98
        text: |-
          "Disculpen la demora, todos," dice el presentador. "Después de verificar qué criaturas nos quedan, parece que estamos en nuestras últimas reservas después de esa última pelea. Si esta división logra matar a todas las criaturas también, entonces nos veremos forzados a volver a nuestras reservas regulares de criaturas para las divisiones restantes. Ahora, dicho todo esto, ¡me gustaría presentarles a la quinta división!"

          Cuando la siguiente reja de hierro se levanta, Kate es la primera en salir al área de combate. Mientras avanza hacia el centro de la arena, los otros miembros de su división también comienzan a seguir sus pasos. Una vez que logro ver bien a todos los compañeros de Kate, me doy cuenta de repente de que Kate es probablemente la luchadora más capaz de su división, incluso sin su magia. La mayoría de los demás se ven severamente fuera de forma, y algunos de ellos ni siquiera tienen armas. Estos claramente no son del tipo de gladiadores que vinieron aquí voluntariamente.

          Mientras los luchadores desarmados van a buscar sus armas preferidas de las paredes de la arena, las nuevas criaturas están empezando lentamente a salir de su guarida.

          Reconozco a las criaturas inmediatamente como las que encontré hace dos días en las cavernas subterráneas. O algunas de ellas al menos. Las ratas gigantes no están. Supongo que solo estaban ahí como alimento para los grifos. De cualquier manera, esto no pinta bien. No veo a Kate lidiando con esos monstruos ella sola, y sus compañeros probablemente no serán de mucha ayuda. ¿Se verá forzada a usar su magia? Las cosas podrían ponerse muy feas si lo hace. Ni siquiera quiero pensar en lo que pasaría en ese escenario. Quizás pueda lograrlo de alguna manera. Siempre hay esperanza...
      - source: scene_text_2
        paragraph: 27
        text: |-
          Las arpías y las gárgolas son las primeras en salir de su guarida, e inmediatamente se elevan al aire, estudiando a sus objetivos cuidadosamente.

          Las arpías son criaturas horrendas que tienen la apariencia de mujeres con escamas, alas y garras. Podrían parecer casi humanas, pero en realidad, no podrían ser más diferentes. Son prácticamente tan inteligentes como el más común de los reptiles, y el doble de feroces. Las gárgolas, por otro lado, podrían describirse con precisión como ogros más delgados, con alas y cuernos, y con una fuerza comparable a la de los ogros también.

          Los lobos terribles y los tigres dientes de sable son los siguientes. Comienzan a caminar lentamente por los costados de la arena, intentando medir a sus oponentes, y moviéndose para rodearlos.

          Los últimos en salir de la guarida son los grifos. Son criaturas que tienen los cuerpos, colas y patas de leones, mientras que sus cabezas, alas y garras son las de águilas. Al igual que las arpías y las gárgolas antes que ellos, lo primero que los grifos hacen es elevarse al aire, para tener una mejor vista de sus objetivos.

          ¡Maldición! Sabía que debería haberlos matado en las cuevas subterráneas, donde no podían usar sus alas para escapar volando. Esta definitivamente no va a ser una pelea fácil para Kate, incluso si le dije todas las debilidades de estos monstruos.

          Los tigres dientes de sable y los lobos terribles son los primeros en atacar. Cuando los compañeros de Kate ven a las bestias cargar hacia ellos, algunos empiezan a gritar y correr tan rápido como pueden, mientras otros cargan directamente contra las criaturas, en un intento desesperado de intimidarlas.
    choices:
