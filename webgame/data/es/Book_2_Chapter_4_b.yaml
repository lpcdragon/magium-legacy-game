          - set:
              current_scene: b2_ch04b_hearing2
  - name: b2_ch04b_fry
    texts:
      - source: scene_text
        paragraph: 87
        text: |-
          "O quizás solo terminaron con los peces pequeños, y el espectáculo recién comienza."

          "Entonces, ¿qué estás esperando que traigan después?" dice Bruce. "¿Hidras? ¿Mamuts? No seas iluso. El presentador ya nos dijo que los monstruos que peleamos esta ronda son sus criaturas más fuertes. Probablemente solo terminarán usando las criaturas de sus eventos regulares para las otras divisiones."
    choices:
