          "Ah, y una cosa más," le digo, mientras se preparaba para irse. "Esa manticora en el cielo probablemente se lanzará sobre ti en cuanto mates a uno de los aplastadores. Ya me vio matar a una de sus amigas, así que es poco probable que venga a por mí. Asegúrate de prestarle atención, e intenta matarla en cuanto te alcance. De lo contrario, nos va a costar mucho derribarla del cielo."

          "Entendido," escribe Leila, y luego sale corriendo hacia los aplastadores.
