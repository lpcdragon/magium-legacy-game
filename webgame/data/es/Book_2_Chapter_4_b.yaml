      - condition: b2_ch4_backup = 0
        texts:
          - source: scene_text
            paragraph: 82
            text: |-
              "Asegúrate de nunca dejar de moverte hacia los lados," le digo a Bruce, mientras nos acercamos a esos reptiles. "Las cobras solo pueden disparar su ácido en línea recta, y les toma unos segundos apuntar, así que mientras no les des el tiempo que necesitan, no podrán darte."

              "Entendido," dice Bruce.

              "Tú toma la de la izquierda," le digo, y me lanzo hacia la cobra de la derecha.

              Provoco a la cobra quedándome quieto en un sitio durante dos segundos, y luego salto fuera del camino, haciendo que la criatura falle su disparo y desperdicie su ácido. Mientras ese reptil está ocupado acumulando más ácido en sus glándulas, me lanzo hacia ella, y la apuñalo en la cabeza, matándola de un solo golpe.
          - source: scene_text_2
            paragraph: 19
            text: |-
              Echo un vistazo para ver si Bruce necesita ayuda, pero parece haberse manejado bastante bien solo. La otra bestia ya está muerta, con su cabeza cortada en el suelo junto a su cuerpo, y Bruce ahora viene hacia mí, sosteniendo su espada a dos manos al costado mientras camina. Leila también terminó con los aplastadores, y ahora viene hacia nosotros. Parece haber matado a la segunda manticora también.

              Esto es todo. Se acabó. La ronda finalmente terminó. Las multitudes están enloquecidas. Evidentemente no esperaban que lo lográramos. Si fuera Hadrik, probablemente estaría dando algún tipo de discurso ahora mismo, pero para ser perfectamente honesto, todo lo que quiero en este momento es volver a mi área de división, y descansar un poco, antes de que comience la siguiente ronda.

              Después de un rato, el presentador finalmente nos pide que desalojemos el área de combate, y nos preparamos para volver a nuestra sala de división.
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch04b_wilhelm_final
