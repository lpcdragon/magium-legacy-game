            paragraph: 9
            text: |-
              De repente me doy cuenta de que Wilhelm ya no está a nuestro lado. ¿Cuándo se fue? La pelea acaba de terminar.

              Al darme la vuelta para buscarlo, descubro, para mi sorpresa, que Wilhelm estaba justo detrás de mí, sosteniendo una daga de empuñadura naranja con ambas manos, como si hubiera estado a solo unos segundos de apuñalarme con ella.

              "¿Wilhelm?" digo.

              Wilhelm parece casi congelado. Sigue agarrando su daga con ambas manos como si todavía estuviera a punto de atacarme, pero por alguna razón, parece que no puede decidirse a hacerlo.

              "Wilhelm, ¿qué estás haciendo?" le pregunto de nuevo.

              Wilhelm está sudando mucho. Se queda ahí, mirándome durante unos segundos más, luego de repente enfunda su daga y se va hacia nuestra área de división, sin decir una sola palabra.

              ¿Qué fue todo eso?
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch04b_associates
  - name: b2_ch04b_associates
    texts:
      - source: scene_text
        paragraph: 10
        text: |-
          "Damas y caballeros," dice el presentador, en un intento de silenciar a la multitud que no deja de abuchear, "les aseguro que estoy tan perplejo por este giro de los acontecimientos como el resto de ustedes. Soy plenamente consciente de cómo se ve esto, pero no podemos confirmar que nuestras reglas hayan sido violadas hasta que realicemos una investigación exhaustiva, para entender por qué no se activó nuestro sistema de detección mágica. Hasta entonces, este misterioso participante permanecerá bajo nuestra custodia. Gracias por su comprensión."

          "Bueno..." dice Bruce. "Supongo que la primera ronda terminó, entonces... Volvamos."

          Mientras todos regresamos, nos encontramos con el dueño de la arena, que nos estaba esperando en la entrada del área de nuestra división.

          "¿Puedo tener una explicación para todo esto?" dice el dueño, mirando directamente al lessathi. "¿Quién te dijo que podías venir aquí e interferir con este evento de la arena?"

          "Sabes muy bien quién lo hizo," dice el lessathi. "Y te convendría hacerte a un lado y dejarme pasar, si sabes lo que te conviene."

          "¿Cómo lograste engañar a los detectores mágicos?" dice el dueño.

          "¿Olvidaste quién te proporcionó esos aparatos en primer lugar?" dice el lessathi. "Solo tuve que hacer unos pequeños ajustes antes del evento, para que esos dispositivos ignoraran la electricidad."
      - source: scene_text_2
        paragraph: 4
        text: |-
          "No vas a interferir con este evento nunca más, ¿entiendes?" dice el dueño, furioso. "¡Te quiero fuera de aquí, ahora mismo!"

          "¿Estás seguro?" le pregunta el lessathi, con un tono amenazante.

          "¡Fuera!" le dice el dueño.

          "Muy bien," dice el lessathi. "Entonces no me volverás a ver. Sin embargo, deberías esperar ver a algunos de mis asociados en los próximos días. Y cuando lo hagas, deberías estar preparado para enfrentar las consecuencias de tus acciones de hoy."

          El lessathi se va sin decir otra palabra, y el dueño de la arena vuelve a su habitación poco después. Los seis volvemos a entrar en nuestra área de división, y la reja de hierro se cierra detrás de nosotros. Después de echar un buen vistazo por toda la habitación, parece que Wilhelm no está por ninguna parte.

          "¿A dónde creen que fue Wilbert?" dice Bruce.

          "A nadie le importa," dice el matón ex-noble. "Queda mucho tiempo hasta la siguiente ronda. Probablemente volverá para entonces."

          "Eh..." dice el presentador, de repente. "Parece que necesitamos tomarnos un pequeño descanso, para hacer un pequeño inventario de nuestras criaturas restantes. ¡Por favor, tengan paciencia! ¡No debería tomar mucho!"

          "¡Ja!" dice Bruce. "Ya se están quedando sin criaturas. ¡Apuesto a que no esperaban que tantas fueran eliminadas en las primeras rondas!"
    choices:
      - position: 1
        text: ¿Eso fue todo? Esperaba ver una colección de criaturas más impresionante.
        effects:
          - set:
              current_scene: b2_ch04b_collection
      - position: 2
