            paragraph: 92
            text: |-
              Mientras esperamos que el presentador reanude el evento, empiezo a escuchar unas voces provenientes de más adelante en el pasillo exterior. Las dos personas que hablan parecen ser Wilhelm y el embajador de Ollendor.

              "¡Te pagué para que hicieras el trabajo, no para escuchar tus excusas!" grita el embajador.

              "No me pagaste nada," dice Wilhelm. "Solo me prometiste que me sacarías de este lugar, y que te asegurarías de que no me ejecutaran por matar a un compañero de equipo, mientras yo cumpliera mi parte del trato. Bueno, estoy aquí para decirte que el trato se canceló. No voy a hacerlo más. Es demasiado arriesgado. Ya me descubrió. Él mismo me lo dijo. No tengo ganas de molestar al stillwater más de lo que ya lo he hecho."

              "¡No es un stillwater, imbécil!" dice el embajador. "¡Es un lessathi!"

              "No puedes estar seguro de eso," dice Wilhelm.

              "¡Claro que estoy seguro, idiota!" dice el embajador. "¡Ahora vuelve allí y haz tu trabajo correctamente!"

              "Ya no voy a hacer ningún trabajo," dice Wilhelm. "Deja de molestarme. Ya dije lo que tenía que decir."

              Poco después de que termina su conversación, el presentador vuelve a tomar su amplificador de voz, y se prepara para hacer otro anuncio.
