  - name: b2_ch04b_insane
    texts:
      - source: scene_text
        paragraph: 75
        text: |-
          Para cuando llegamos con el resto de nuestro equipo, los dos merodeadores con los que estaban peleando ya están muertos. No parece que la segunda manticora tuviera el valor de atacar a ninguno de ellos mientras estaban en un grupo tan grande, especialmente después de lo que le pasó a su compañera antes. Dejando la manticora de lado, todavía tenemos dos aplastadores y dos cobras con las que lidiar. Deberíamos empezar a hacer planes de inmediato, antes de que las criaturas tomen la iniciativa.

          "Oye, Leila," digo. "¿Podrías ir y matar a esos aplastadores de allá? Con tu nivel de fuerza, estoy seguro de que podrás cortar sus pieles duras sin mucho problema."

          "¿Va a ir sola?" pregunta Bruce, en voz alta. "¿Estás loco? ¿Por qué no los atacaríamos en grupo, como hicimos con estos escorpiones?"

          "Porque quiero que atraiga a esa manticora en el cielo, mientras lo hace," digo. "Incluso si yo fuera a atacarlos, la manticora no vendría tras de mí, después de lo que le hice a su compañera, y ninguno de ustedes tendría la fuerza suficiente para poder traspasar la armadura de los aplastadores."

          "Lo haré," escribe Leila. "Ustedes encárguense de las cobras mientras tanto."

          "De acuerdo," digo. "¿Recuerdas cuál es la debilidad de los aplastadores, verdad?" le pregunto.

          "Sí, la recuerdo," escribe Leila, y luego se da la vuelta, dirigiéndose hacia los aplastadores.

          "¡No podemos dejarla pelear sola así!" dice Bruce, mientras Leila se aleja de nosotros. "¿Y si necesita nuestra ayuda?"
    choices:
      - position: 1
        text: No te preocupes, ella puede arreglárselas sola.
        effects:
          - set:
              current_scene: b2_ch04b_promised
              b2_ch4_backup: 0
      - position: 2
        text: Supongo que podríamos esperar aquí un rato, para ver si necesita refuerzos.
        effects:
