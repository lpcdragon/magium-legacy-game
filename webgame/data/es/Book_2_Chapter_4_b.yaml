  - name: b2_ch04b_marauder2
    routes:
      - condition: strength >= 3
        texts:
          - source: scene_text
            paragraph: 61
            text: |-
              Esto no está funcionando. ¿Por qué estoy siquiera haciendo esto? Con mi nivel de fuerza, y esta daga encantada por Daren, la fuerza bruta debería ser más que suficiente para romper estas escamas blindadas.

              Reúno toda mi fuerza, y golpeo una de las escamas del merodeador con mi daga. La escama se hace pedazos, y el cuchillo penetra profundamente en la espalda del merodeador, haciendo que grite de dolor y se tambalee incontrolablemente de un lado a otro. Cuando cae al suelo, aprovecho la oportunidad, y me muevo hacia su cabeza, dando el golpe de gracia con un rápido ataque de mi cuchillo. Luego me bajo de la espalda del merodeador, y me preparo para unirme a mis compañeros de equipo a lidiar con el resto de las criaturas.
        effects:
          - set:
              successful_checks:
                - '[ Comprobación de fuerza exitosa - nivel 3 ]'
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch04b_manticore
                condition: is_dead = 0
      - condition: strength < 3 AND reflexes >= 3
        texts:
          - source: scene_text
            paragraph: 62
            text: |-
              Mientras sigo intentando encontrar el punto correcto, el merodeador finalmente decide que ya tiene suficiente, y usa su cola para atacarme con una velocidad increíble.

              Logro apartarme del camino lo suficientemente rápido, pero el merodeador no consigue detener su cola a tiempo, y atraviesa directamente sus propias escamas blindadas, inyectando veneno en su propio cuerpo. No pasa mucho tiempo hasta que la criatura cae al suelo, y unos segundos después, deja de respirar completamente. Ahora que el merodeador está muerto, decido bajarme de su espalda, y me preparo para unirme a mis compañeros de equipo a lidiar con el resto de las criaturas.
        effects:
          - set:
              failed_checks:
                - '[ Comprobación de fuerza fallida - nivel 3 ]'
              successful_checks:
                - '[ Comprobación de reflejos exitosa - nivel 3 ]'
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch04b_manticore
                condition: is_dead = 0
      - condition: strength < 3 AND reflexes < 3
