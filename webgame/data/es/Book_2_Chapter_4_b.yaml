            paragraph: 27
            text: |-
              ¡Perfecto! Dos criaturas ya cayeron. ¿Pero qué hay de Wilhelm? ¿Está intentando matarme ya?

              Me doy la vuelta y veo, para mi sorpresa, que Wilhelm no estaba ahí. En su lugar, estaba refugiándose detrás de uno de los cadáveres de las criaturas, probablemente para defenderse de una posible carga de los aplastadores. ¡Supongo que mi amenaza fue más efectiva de lo que pensé!

              Leila está a punto de alcanzarme, y envía uno de sus textos azules por delante, para ahorrar tiempo.

              "Podrías al menos haberme pedido que viniera contigo," dice el escrito, mientras Leila me mira con una expresión molesta en la cara.

              "¡Perdona!" le digo, mientras se detiene frente a mí. "No pensé que quisieras acompañarme."

              "Entonces, ¿a cuál matamos primero?" escribe Leila.

              "Empecemos con ese merodeador de ahí," digo, mientras señalo al merodeador que está más cerca de nosotros.
