              Le hago una señal a Leila, y nos dirigimos hacia los demás, para ayudarles a acabar con la última de las criaturas. Una vez que terminamos, podemos escuchar un fuerte estallido de vítores proveniente de las multitudes, mientras nuestra ronda finalmente llega a su fin.

              Después de un rato, el presentador nos pide que desalojemos el área de combate, así que dejamos al matón muerto atrás, y nos preparamos para volver a nuestra sala de división.
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
