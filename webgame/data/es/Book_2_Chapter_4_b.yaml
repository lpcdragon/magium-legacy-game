  - name: b2_ch04b_argument
    texts:
      - source: scene_text
        paragraph: 4
        text: |-
          "¿De verdad es este el momento y el lugar para tener esta discusión?"

          "Entonces, ¿qué propones hacer, listillo?" dice el matón. "¿Arrodillarte ante el todopoderoso Bruce y aceptar cada una de sus órdenes?"

          "No," digo. "Propongo que cierres la maldita boca y--"

          Dejo de hablar a mitad de frase porque el lessathi de la túnica azul de repente sale corriendo hacia las criaturas, completamente solo, con sus guadañas listas.

          "¡Ese loco!" dice Bruce. "¿Tiene deseos de morir?"

          Las cobras ven al lessathi, y ambas escupen en su dirección. El lessathi esquiva el chorro de ácido, y se mueve para apuñalar a una de las cobras con sus guadañas. En cuanto la apuñala, la cobra gigante cae al suelo, inconsciente, y luego también apuñala a la segunda cobra, de la misma manera, haciéndola caer al suelo casi tan rápido como la primera.

          Una de las manticoras ve esto como una oportunidad para atacar, así que se lanza en picada a gran velocidad, intentando agarrar al lessathi con sus garras. El lessathi, sin embargo, estaba esperando que esto pasara, así que espera a que la manticora descienda a su nivel, y luego la empala con ambas guadañas, haciendo que la criatura tiemble y grite durante unos segundos, y luego se quede en silencio, al golpear el suelo, sin vida.

          "¿Qué diablos está haciendo?" pregunta el matón. "¿Qué tipo de encantamientos podría estar usando en esas guadañas para matar a esos monstruos tan rápido?"
      - source: scene_text_2
        paragraph: 3
        text: |-
          El lessathi no espera a que los aplastadores comiencen su carga, y elige enfrentarlos en combate cercano, para limitar su movilidad. Los merodeadores del desierto también se están uniendo a la batalla, y parece que están intentando rodearlo. Para empeorar las cosas, la manticora decide unirse a la pelea también, y se lanza en picada hacia el lessathi, cerrando su última ruta de escape.

          "¡Sal de ahí!" le grita Bruce. "¡Sal de ahí ahora!"

          El lessathi no muestra señal de haber escuchado a Bruce. En su lugar, espera hasta el último momento posible, cuando los merodeadores, los aplastadores y la manticora están todos a pocos pies de su posición, y clava ambas guadañas con fuerza en el suelo. Casi inmediatamente después, vemos una poderosa onda de choque eléctrica cubrir toda el área a su alrededor, y las criaturas que estaban a punto de atacarlo hace solo un segundo, ahora están cayendo como moscas, al suelo.

          ¡Electricidad! ¡Así que eso era lo que estaba usando!

          A las multitudes definitivamente no les gustó lo que acaban de ver. Varios espectadores han empezado a abuchear ruidosamente, y más de ellos están comenzando a unirse al coro, mientras el sonido de los abucheos se intensifica lentamente.
    choices:
      - position: 1
        text: Continuar
        effects:
