            paragraph: 66
            text: |-
              ¡Perfecto! Dos criaturas ya están derribadas. Ahora veamos qué monstruos debería atacar a continuación.

              Antes de que pueda decidir, escucho el sonido de algo cayendo al suelo detrás de mí, y me doy la vuelta para ver qué pasó. Por lo que puedo deducir, parece que es Wilhelm el que ha sido noqueado, y mi compañero de equipo mago es el que lo golpeó. Al mirar más de cerca al hombre en el suelo, veo que hay una daga de empuñadura naranja junto a él, que muy probablemente estaba usando para atacarme antes.

              Estoy casi seguro de que la daga de empuñadura naranja en cuestión es un tipo especial de arma encantada, típicamente usada por asesinos entrenados, que ayuda a ocultar sus auras. ¿Significa esto que Wilhelm era un asesino? Si es así, ¿qué razón tendría para atacarme a mí, específicamente?

              No hay tiempo para pensar en eso ahora. Lo averiguaré después de la batalla. Ahora mismo, necesito volver con los demás.

              "¿Por qué me salvaste?" le pregunto al mago.

              "Te salvé," dice el mago, "porque le debía a la princesa de pelo plateado por el consejo que me dio ayer, sobre mi dispositivo. Con esto, consideraré mi deuda saldada."

              "Ya veo," digo, simplemente.

              "¿Tienes alguna idea de por qué el señor sonrisas de aquí querría matarte?" dice el mago.

              "No lo sé," digo. "Pero no quiero perder tiempo averiguándolo ahora, en medio de la batalla. Hemos terminado aquí. Vamos a ayudar a los demás."
        choices:
