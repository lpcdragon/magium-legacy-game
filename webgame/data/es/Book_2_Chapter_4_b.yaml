              b2_ch4_backup: 1
  - name: b2_ch04b_promised
    routes:
      - condition: b2_ch4_backup = 0
        texts:
          - source: scene_text
            paragraph: 76
            text: |-
              "No te preocupes, ella puede arreglárselas sola," digo.

              "¿Cómo puedes estar seguro?" dice Bruce.

              "¿La has visto pelear?" le pregunto.

              "Bueno... sí, pero--" empieza a decir, pero lo interrumpo.

              "Entonces no tienes de qué preocuparte," digo. "Esas bestias no serán más que un ejercicio de calentamiento para ella. Vámonos. Le prometí que nos encargaríamos de las cobras gigantes mientras ella mata a las otras criaturas."

              "Está bien," dice Bruce. "Iremos a matar las cobras, entonces."
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch04b_counting
      - condition: b2_ch4_backup = 1
        texts:
          - source: scene_text
            paragraph: 77
            text: |-
              "Supongo que podríamos esperar aquí un rato, para ver si necesita refuerzos," digo. "Aunque probablemente se va a enfadar. Nos dijo que fuéramos a encargarnos de las cobras gigantes mientras tanto, no que nos quedáramos aquí sin hacer nada."

              "Nos iremos en cuanto mate a todas las criaturas," dice Bruce. "Tendremos tiempo de sobra para encargarnos de las cobras antes de que vuelva."

              Nos quedamos ahí parados y observamos a Leila correr hacia los aplastadores durante los siguientes segundos. Al verla al descubierto, los aplastadores también han decidido apuntar hacia ella, y ahora están cargando en su dirección. Ninguno de los dos da señales de que vayan a detenerse pronto.

              Ahora bien, si lo que he leído en todas mis notas es correcto, los aplastadores son mucho más fáciles de intimidar de lo que uno sospecharía. Los aplastadores no están acostumbrados a ser desafiados en su propio terreno, así que si sigues corriendo hacia ellos a toda velocidad mientras cargan contra ti, eventualmente dejarán de cargar y retrocederán. Leila conoce esta debilidad, y esa es la razón por la que no se detiene. Con suerte, todo saldrá bien.

              Después de unos segundos más corriendo el uno hacia el otro, los dos aplastadores finalmente se detienen, a unos pocos metros de ella, y comienzan a balancear sus colas de maza con púas hacia ella, en un intento de intimidarla.
          - source: scene_text_2
            paragraph: 18
            text: |-
              ¡Perfecto! Este es el mejor escenario que Leila podría esperar. La fuerza de un aplastador reside en sus cargas. Unos cuantos golpes de cola solo sirven para espantar bestias tontas. No la van a molestar a ella.

              Leila salta sobre una de las bestias y aterriza sobre su espalda, apuñalándola en la nuca. Antes de que el aplastador siquiera tenga tiempo de caer al suelo, Leila ya salta de su espalda, para atacar a su compañero. El segundo aplastador apenas tiene tiempo de reaccionar, antes de que Leila se meta debajo de su cabeza, clavando uno de sus cuchillos directamente a través de su mandíbula inferior y hasta su cerebro.

              En cuanto se aleja de la criatura moribunda, la última manticora restante hace un picado muy rápido hacia ella, en un intento de sorprenderla. Leila finge ignorancia hasta el último momento, y luego hace un poderoso corte al pecho de la criatura, exactamente cuando la alcanza. La manticora cae al suelo, y Leila la remata con un rápido golpe de su daga.

              "¿Ves?" le digo a Bruce. "Te dije que no teníamos de qué preocuparnos. ¡Ahora apresurémonos y matemos esas cobras antes de que llegue!"
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch04b_counting
