  - name: b2_ch04b_further
    routes:
      - condition: b2_ch4_backpack = 1
        texts:
          - source: scene_text
            paragraph: 58
            text: |-
              "¡Todos, escóndanse detrás de los cadáveres de los monstruos!" dice Bruce. "De esa manera, los aplastadores no podrán cargar contra nosotros."

              "¡Vaya, quién lo diría!" dice Wilhelm. "¡El bruto puede decir cosas sensatas de vez en cuando!"

              Todos nos escondemos detrás de unos cadáveres de merodeadores, y seguimos observando el campo de batalla, para ver qué están haciendo las criaturas. Los aplastadores se están moviendo, intentando encontrar una manera de cargar hacia nosotros sin obstáculos en su camino. Las cobras y los merodeadores se han alejado mucho más entre sí ahora, y probablemente están intentando flanquearnos. Las manticoras siguen volando en círculos, esperando la mejor oportunidad para atacar.

              "¡Si nos quedamos aquí parados, nos van a rodear!" dice el amigo del matón ex-noble. "¡Necesitamos ir a atacar a uno de los grupos ahora, mientras están divididos!"

              "¡Eso solo animará a los aplastadores a cargar contra nosotros!" dice el mago. "¡Deberíamos quedarnos aquí, donde al menos tenemos algo de cobertura!"

              "Hay suficientes cadáveres de monstruos entre nosotros y los merodeadores como para poder llegar allí a salvo," digo. "Podemos hacer sprints cortos y cubrirnos detrás de cada uno de los cadáveres hasta que alcancemos nuestros objetivos. Luego solo tendremos que asegurarnos de que siempre haya un merodeador entre nosotros y los aplastadores, y estaremos bien."
          - source: scene_text_2
            paragraph: 13
            text: |-
              "Eso... en realidad no suena como una mala idea," dice el mago.

              "Sí," dice Wilhelm. "Y si viajamos como grupo, aumentaremos nuestras posibilidades de supervivencia."

              "Entonces vámonos," dice Bruce. "Y recuerden estar atentos a las manticoras en el cielo. No se sabe cuándo se lanzarán en picada hacia nosotros."

              Todos comenzamos a avanzar hacia los merodeadores del desierto en sprints cortos, deteniéndonos detrás de un cadáver de monstruo cada vez, para asegurarnos de que los aplastadores no empiecen a cargar hacia nosotros. En cuanto alcanzamos nuestros objetivos, nos posicionamos de manera que los aplastadores no puedan vernos, y comenzamos nuestro ataque.
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch04b_woman
      - condition: b2_ch4_backpack <> 1
