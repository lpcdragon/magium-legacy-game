  - name: b2_ch04b_ending
    texts:
      - source: scene_text
        paragraph: 106
        text: |-
          Las siguientes batallas no fueron realmente nada especial. Unos cuantos gladiadores murieron aquí y allá, pero la mayoría sobrevivió, y el número de criaturas que les lanzaban en cada pelea se fue reduciendo gradualmente, a medida que las reservas de criaturas regulares de la arena también comenzaban a agotarse lentamente.

          Mientras sigo observando las peleas, estoy empezando a sentir alivio, porque la mayoría, si no todos, de los guerreros que hemos visto desde la batalla de Kate no son ni de cerca lo suficientemente fuertes para lidiar con monstruos como manticoras o merodeadores del desierto. Esto significa que derrotarlos debería ser pan comido. ¡Quizás esta arena no era tan aterradora después de todo!

          "No te relajes demasiado," escribe Leila, al ver la expresión en mi cara, mientras observamos la batalla final de la ronda. "Todavía no tenemos idea de cómo vamos a derrotar al trol, y para ser franca, creo que va a ser mucho más peligroso que los monstruos que hemos enfrentado hasta ahora."

          "¡Sí, pero estás olvidando algo!" le digo a Leila. "Somos la cuarta división. Esto significa que el trol tendrá que pasar por Hadrik y Daren antes de llegar a nosotros. Con regeneración o sin ella, honestamente no puedo ni imaginarme a Hadrik perdiendo un duelo contra él, después de la forma en que peleó en esta primera ronda. Tal como yo lo veo, podrían estar coronándonos como ganadores de este evento de la arena ahora mismo, porque realmente no tiene mucho sentido alargar esto más--"

          "¡Atención, todos los gladiadores!" dice el presentador en voz muy alta, de repente.

          Mientras hablaba con Leila, parece que la batalla final ya había terminado, y los guerreros ahora estaban regresando a su área de división.
      - source: scene_text_2
        paragraph: 31
        text: |-
          "¡Ha habido un ligero cambio en nuestro calendario de peleas para la segunda ronda!" continúa el presentador. "A diferencia de la primera ronda, donde las divisiones han estado peleando en el orden de sus números de división, en esta segunda ronda habrá una excepción a la regla. ¡Por solicitud especial de nuestro estimado dueño de la arena, el señor Venard, la primera división en pelear contra Velgos en la segunda ronda será nada más y nada menos que la división número cuatro! ¡Gladiadores de la cuarta división, por favor asegúrense de estar listos! La pelea comenzará en los próximos minutos."

          "¡Humanos!" escuchamos la voz de Velgos el trol, gritando desde el otro extremo de la arena, tan pronto como el presentador deja de hablar. "¡Se les acabó el tiempo! No hay a dónde correr. No hay dónde esconderse. ¡Todo lo que les espera es la muerte! ¡Culpen a su destino por haber sido lo suficientemente desafortunados como para cruzarse en el camino de Velgos el mercenario!"

          Las multitudes se están volviendo locas de nuevo, igual que después de la primera pelea de Hadrik, y están coreando el nombre del trol una y otra vez en voz alta.

          "¡Velgos! ¡Velgos! ¡Velgos!" siguen coreando todos, mientras el trol saluda a la multitud y nos hace gestos intimidantes de vez en cuando.

          "Huh," le digo a Leila. "Bueno... maldición."
