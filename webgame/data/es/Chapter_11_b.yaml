          Me posiciono por encima de los cinco esqueletos y empiezo a verter fuego sobre ellos, mientras intento aplastar la barrera mágica que los rodea bajo varias capas de roca. Mientras el stillwater de apoyo está ocupado manteniendo su barrera, el elementalista de fuego y el de agua combinan sus dos elementos para crear una nube de vapor que cubre toda el área a nuestro alrededor.
