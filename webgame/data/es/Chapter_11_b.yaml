              "Oh, dioses," dice Rose. "Nunca supe que la magia pudiera usarse así. No puedo creer que llegara a tales extremos solo para matarme..."

              "Bueno, para ser justos, te vio revertir el tiempo mismo hace unos minutos," dice Hadrik. "¿Cómo demonios hiciste esa hazaña, de todas formas?"

              "No lo sé..." dice Rose. "Eiden me dijo antes que yo era una tejedora del tiempo, pero pensé que estaba equivocado. Realmente no tengo idea de cómo hice lo que hice. Estaba tan desesperada por deshacer todo lo que había pasado que debo haber activado mis poderes por accidente. No estoy segura de si alguna vez podré hacer algo así de nuevo."
