              "¡Rose, ¿estás bien?!" grita Daren, mientras él y todos los demás corren hacia nosotros.

              "Yo, eh... ¡Sí!" dice Rose. "¡Gracias a Barry!"

              "Barry, ¿cómo sabías lo que iba a pasar?" me pregunta Kate. "¿El potenciador de estadísticas te dio una premonición?"
          - source: scene_text_2
            paragraph: 29
            text: |-
              "No," digo. "No sabía que habría un esqueleto, solo noté que algo estaba intentando salir del suelo cerca de Rose, y no quise esperar a ver qué era."

              "Aun así, no entiendo por qué el nigromante haría esto," dice Kate. "¿No habría impedido el hechizo del torneo que ese esqueleto hiciera daño a Rose?"

