          "Oh..." dice Illuna. "Oh, no..."

          "Aja- AJAJAJA--"

          El amuleto cruje de nuevo, esta vez mucho más violentamente que antes, y la risa de Arraka se intensifica aún más.

          "¡AJAJAJAJAJAJAJAJA!"
