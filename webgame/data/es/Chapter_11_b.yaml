  - name: ch11b_monster
    texts:
      - source: scene_text
        paragraph: 11
        text: |-
          "Bueno, supongo que podrías decirlo así," dice Arraka, "si quieres ponerte técnica, pero el caso es que--"

          "¡Monstruo!" grita Zack, de repente, mientras señala hacia Arraka. "¡Abominación! ¡Fuera, demonio inmundo!"

          De repente, el dragón esquelético, que no se había movido ni un centímetro desde que escapamos de la ilusión, bate sus alas y se lanza hacia Arraka, rugiendo con fuerza. Justo cuando la alcanza, el dragón explota en miles de pedazos diminutos que se esparcen por toda el área a nuestro alrededor.

          "Vamos, por favor..." dice Arraka.

          Mientras los huesos del dragón vuelan en todas direcciones, el suelo comienza a temblar, y varios esqueletos empiezan a surgir lentamente de él. No me toma mucho darme cuenta de que esto es obra del nigromante, y que todos los esqueletos frente a nosotros son stillwaters.

          "¿Lo entiendes ahora, banshee?" dice Zack. "¿Entiendes a quién te enfrentas? ¡Este es el verdadero poder del Dios de la Muerte! Si te arrodillas ahora y suplicas el perdón de Ulruk, quizás tenga a bien concederte una muerte rápida e indolora."

          Arraka ignora completamente al mago, eligiendo en cambio mirar fijamente a uno de los esqueletos que han surgido del suelo.
      - source: scene_text_2
        paragraph: 8
        text: |-
          "¡Esperen un momento!" dice Arraka. "¡Te conozco! ¡Eres Vallen, verdad? ¡Vallen patas cortas que no podía cantar afinado ni para salvar su vida! No vas a hacerme daño, ¿verdad? ¿Recuerdas todos esos buenos ratos que pasamos durante el invierno inmóvil? ¿Recuerdas aquella vez que tuvimos que sacarte de un estanque porque te caíste mientras practicabas tu hechizo para volar y de repente recordaste que no sabías nadar? ¿Recuerdas cómo nos burlábamos de ti porque siempre caminabas raro después de gastar toda tu energía mágica? ¿Recuerdas cuando te até a un árbol y te obligué a mirar mientras asesinaba lentamente a todos tus amigos hasta que pudieras dar todas las notas de esa canción infantil sobre el león y el cordero? Buenos tiempos, ¿eh? A ver, ¿cómo era esa canción?"

          Arraka se aclara la garganta y empieza a cantar.

          "Oh, había un cordero, un cordero, un cordero," canta. "¡Y ese cordero tenía una lana tan blanca y brillante!"

          Mientras Arraka canta la canción, el esqueleto llamado Vallen empieza a temblar incontrolablemente, y se lleva ambas manos a la cabeza, como si tuviera un intenso dolor de cabeza. Eventualmente, su dolor se convierte en rabia, y ruge con fuerza mientras empieza a disparar fuego de sus manos. El fuego simplemente se desliza por el escudo mágico de Arraka, y ella actúa como si nada hubiera pasado, continuando con su canción.
      - source: scene_3
        paragraph: 4
        text: |-
          "¿Por qué están ahí parados, idiotas?!" les pregunta Zack a los otros esqueletos. "¡Atáquenla! ¡Mátenla!"

          Los esqueletos empiezan a lanzar hechizos contra Arraka, atacándola con todo tipo de magia elemental simultáneamente, mientras también usan hechizos para debilitar sus defensas. Arraka actúa como si ni siquiera notara la avalancha de hechizos que están siendo lanzados sobre ella, y continúa cantando sin ninguna interrupción.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch11b_sonic
  - name: ch11b_sonic
    texts:
      - source: scene_text
        paragraph: 12
        text: |-
          "Ya puedes dejar tu teatrito, banshee," dice Zack. "Puedo ver a través de ti. Aunque estés actuando calmada y segura, la realidad es que apenas puedes resistir la avalancha de ataques que te están lanzando, y no tienes forma de contraatacar. Como mis esqueletos ahora están completamente protegidos contra ataques sónicos, ¡podrías decir que se han vuelto casi indestructibles! No hay nada que puedas hacer para dañarlos."

          Arraka deja de cantar y le sonríe maliciosamente al nigromante.

          "Oh, ¿dices que están protegidos contra ataques sónicos?" dice, con tono burlón, mientras los esqueletos continúan atacándola con todo lo que tienen. "¡Qué impresionante! Verdaderamente, eres un mago entre magos. Pero dime, nigromante, ¿también consideraste proteger a tus títeres contra piedrecitas?"

          "¿Qué clase de pregunta es esa, pequeña--" empieza a decir Zack, pero Arraka no le da la oportunidad de terminar su pregunta.

          Mientras el nigromante hablaba, Arraka hizo flotar algunas piedrecitas del suelo hasta su mano, y luego empezó a lanzarlas con los dedos hacia cada uno de los esqueletos. Cuando las piedrecitas los alcanzaron, los esqueletos explotaron, pero esta vez en pedazos tan pequeños que bien podrían confundirse con motas de polvo.

          Cuando el nigromante vio lo que pasó, se le cayó la mandíbula, y no pudo articular una palabra más. Estaba en un shock demasiado grande.
      - source: scene_text_2
        paragraph: 9
        text: |-
          "Sí, adelante, empaqueta eso y envíaselo al viejo Ulruk como regalo," dice Arraka, mientras señala hacia los montones de polvo en el suelo. "Dile que es de parte de Arraka. Dile que debería esperar muchos más regalos de mi parte en el futuro cercano. Dile que una vez que termine con el plano terrenal, le haré una visita. Lo visitaré a él, visitaré a Memphir, visitaré a cada uno de los supuestos dioses que creyeron que sería una buena broma hacer que me prohibieran el acceso al plano mágico junto con todas las demás banshees existentes. ¡Y entonces podremos hacer una fiesta juntos, mientras recordamos tiempos ya olvidados!"

          "¡Cállate!" dice Daren a Arraka de repente, mientras empieza a caminar hacia ella, con una mirada furiosa en su rostro. "¡Me importan un comino tu pasado o tus vendettas personales! ¡Devuélvelas, me oyes! ¡Devuelve a las dos ahora mismo!"

          "¿Disculpa?" dice Arraka.

          "¡Sabes muy bien de qué estoy hablando!" dice Daren. "¡Flower e Illuna! ¡Devuélvelas a ambas ahora mismo!"

          "¿Qué, además de feo eres estúpido?" dice Arraka. "¿No acabo de decirte que absorbí sus almas cuando tomé el control del cuerpo? ¿Qué esperas que haga, que las corte de mí con un cuchillo de carnicero?"

          "¡Si no vas a dejarlas ir, entonces te obligaré a hacerlo!" dice Daren, mientras saca su espada. "¡Prepárate, banshee!"
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch11b_murder
  - name: ch11b_murder
    texts:
      - source: scene_text
        paragraph: 13
        text: |-
          "Entonces, masacre será," dice Arraka, con una sonrisa, mientras Daren se lanza hacia ella.

          Antes de que siquiera dé tres pasos, Daren de repente empieza a marchitarse como una planta, a un ritmo increíblemente rápido. En cuestión de segundos, lo único que queda de él es su armadura, ya que el resto de su cuerpo se había convertido completamente en polvo.

          "No..." dice Kate, mientras se lleva la mano a la boca. "¡¡No!!"

          Conjura cien carámbanos que apunta hacia Arraka, pero antes de que pueda atacarla con ellos, se marchita igual que Daren, y en cuestión de segundos, no queda nada de ella excepto un montón de polvo.

          "¡¡No!!" grita Rose, mientras empieza a llorar. "¡Por favor, para! ¡¡Por favor!!"

          "¿Qué te pasa, Hadrik?" dice Arraka, mientras sonríe malvadamente. "¿No vas a mostrarme ese espíritu de lucha de gigante del que tanto te gusta presumir? ¡Estoy justo aquí! ¿Qué estás esperando?"

          "Te voy a mostrar espíritu de lucha, vieja bruja arrogante," dice Hadrik, mientras un hilillo de sudor le corre por la sien, y se lanza hacia Arraka, con los puños listos.
      - source: scene_text_2
        paragraph: 10
        text: |-
          Al igual que los dos anteriores, Hadrik rápidamente se convierte en polvo, y lo único que queda de él es su armadura de cuero y sus botas.

          "Por favor..." dice Rose de nuevo, esta vez con una voz mucho más débil que antes.

          Están muertos. Todos murieron justo frente a mí. ¿Cómo puede ser esto? ¿Es esta otra ilusión? ¡Tiene que serlo! ¡Eso es! ¡Esto debe ser una ilusión!

          Cierro los ojos e intento visualizar el mundo real en mi mente. Intento hacer la imagen lo más clara posible, e intento lanzarme dentro de ella, justo como hice antes, pero no pasa nada. No pasa nada...

          "No irás en serio a cerrar los ojos y pretender que no estoy aquí, ¿verdad?" me dice Arraka. "Vamos, saca tu daga. No es divertido matarte si ni siquiera te defiendes."
    choices:
      - position: 1
        text: Sacar mi daga y atacar a Arraka
        effects:
          - set:
              current_scene: ch11b_dagger
      - position: 2
        text: No voy a darte esa satisfacción.
        effects:
          - set:
              current_scene: ch11b_satisfaction
  - name: ch11b_satisfaction
    texts:
      - source: scene_text
        paragraph: 14
        text: |-
          "No voy a darte esa satisfacción."

          "Hmph," dice Arraka. "En realidad iba a matarte lentamente para atormentar a tu amiga de ahí, pero no es lo mismo si no planeas defenderte."

          Luego agita la mano hacia Rose y la mata de la misma forma que mató a todos los demás.

          "Bueno, fue un viaje divertido mientras duró, Barry," dice Arraka. "El viaje puede terminar para ti hoy, pero no te preocupes, ¡siempre vivirás en mi memoria!"

          Agita la mano hacia mí, y puedo sentir cada parte de mi cuerpo secándose rápidamente, mientras mi visión empieza a nublarse. Las palabras de Arraka son lo último que escucho antes de perder completamente la consciencia.

          "Hasta la vista, Barry," dice Arraka. "¡Ha sido un placer!"
    choices:
