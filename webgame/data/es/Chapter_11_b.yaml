        text: Continuar
        effects:
          - set:
              current_scene: ch11b_monster
  - name: ch11b_heathen
    texts:
      - source: scene_text
        paragraph: 9
        text: |-
          "¿Tu amigo no era también un hereje? ¿Por qué habría necesidad de honor al matarlo a él, entonces?"

          "¡Porque a diferencia de ustedes, él estaba sirviendo la causa del Dios de la Muerte!" dice Zack. "Ustedes, por otro lado, están tan más allá de la salvación que solo pueden servirlo a través de sus muertes. Es por lo tanto mi deber enviarlos a él antes de que se desvíen aún más del camino correcto."

          "Illuna, ¿puedes moverte?" pregunta Daren.

          "No," dice Illuna. "La chica llevó su cuerpo mucho más allá de sus límites mientras estábamos en la ilusión. Puedo sentir un dolor en cada hueso y músculo, y ni siquiera puedo mover un dedo. Su cuerpo está cubierto de moretones, su ropa es un desastre, y el amuleto de Arraka está..."

