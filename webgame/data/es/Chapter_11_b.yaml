  - name: ch11b_interviews
    texts:
      - source: scene_text
        paragraph: 10
        text: |-
          "¿Y cómo te conviertes en seguidor de Ulruk? ¿Hacen entrevistas para eso?"

          "¡No te burles del todopoderoso dios Ulruk, hereje!" dice Zack. "El Dios de la Muerte da la bienvenida a todos los que dedicarían sus vidas a servirlo, sin excepción. Incluso si no le son útiles en vida, pueden servirlo a través de sus muertes. Y eso es exactamente lo que todos ustedes estarán haciendo, muy pronto."

          "Illuna, ¿puedes moverte?" pregunta Daren.

          "No," dice Illuna. "La chica llevó su cuerpo mucho más allá de sus límites mientras estábamos en la ilusión. Puedo sentir un dolor en cada hueso y músculo, y ni siquiera puedo mover un dedo. Su cuerpo está cubierto de moretones, su ropa es un desastre, y el amuleto de Arraka está..."

