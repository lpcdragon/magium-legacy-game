  - name: ch11b_dagger
    texts:
      - source: scene_text
        paragraph: 15
        text: |-
          Saco mi daga y miro a Arraka directamente a los ojos.

          "¡Muy bien, entonces!" dice Arraka, sonriendo. "Aquí está, Barry. Un duelo épico de los tiempos en gestación. Héroe contra villana. Banshee contra lessathi. Los bardos cantarán canciones sobre nosotros durante miles de años. ¡Vamos, hagámoslo!"

          No voy a arreglar nada si me quedo aquí deprimiéndome. No espera que yo sea una amenaza. Está demasiado confiada. Quizás pueda usar eso en su contra de alguna manera. Quizás si la mato, todo volverá a la normalidad. Quizás si ella muere, sus hechizos se deshagan y todos vuelvan a la vida. No lo sabré hasta que lo intente.

          Me lanzo hacia la banshee, pero de repente siento un dolor agudo en el estómago, cuando una roca vuela hacia mí y me tira de espaldas.

          "Oh, lo siento, ¿fue demasiado brusco?" dice Arraka, mientras lucho por recuperar el aliento. "¡No estoy exactamente segura de cuánto daño puedes aguantar, ya que nunca he luchado contra un debilucho como tú antes!"

          "¡Por favor, déjalo en paz!" grita Rose, mientras las lágrimas siguen cayendo de sus ojos.

          "No querría matarte de golpe," dice Arraka. "Deberíamos disfrutar al máximo, ¿sabes lo que digo?"

          Luego lanza otra roca justo debajo de mi pecho, y puedo sentir el aliento abandonándome otra vez.

          "¡Para!" grita Rose. "¡Le estás haciendo daño!"
      - source: scene_text_2
        paragraph: 11
        text: |-
          "Vaya," dice Arraka. "Bueno, siempre supe que eras un debilucho, pero nunca imaginé que sería tan malo. Es doloroso de ver, de verdad. Creo que simplemente voy a ahorrarte la vergüenza y matarte ahora mismo."

          "¡No, no lo hagas!" grita Rose tan fuerte como puede.

          "¡Adiós, Barry!" dice Arraka, mientras agita la mano hacia mí, y puedo sentir todo mi cuerpo empezando a secarse rápidamente. "¡Fue divertido mientras duró!"

          "¡Para!" grita Rose de nuevo, y justo cuando los últimos ecos de sus palabras se desvanecen, todo a mi alrededor se congela en su lugar.

          Mi cuerpo ya no se está secando, Arraka no se mueve, y las lágrimas de Rose están flotando en el aire. ¿Es esto algo que normalmente pasa cuando mueres? ¿Se supone que el tiempo se siente más lento mientras experimentas tus últimos momentos? No lo sabría. Nunca he muerto antes.

          De repente, todo empieza a moverse en reversa, mientras me encuentro presenciando todos los eventos que llevaron a mi muerte. Veo a Arraka golpeándome con las rocas, y luego la veo matar a Hadrik, y a Kate, y luego a Daren. La veo matando a los esqueletos stillwater y luego la veo liberándose del amuleto. ¿Es esto lo que llaman ver tu vida pasar frente a tus ojos?
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch11b_weaver
  - name: ch11b_weaver
    texts:
      - source: scene_text
        paragraph: 16
        text: |-
          Vaya, esto es bastante entretenido, la verdad. Nunca supe que morir pudiera ser tan divertido. Eh, mira, esa es Flower luchando contra el dragón esquelético. ¿Cómo demonios estoy viendo esto? ¿No se supone que yo estaba en la ilusión mientras todo esto pasaba? Ahora los cráteres están desapareciendo uno por uno. Y... hemos vuelto al momento en que los dos magos nos tendieron la emboscada.

          La cadena de eventos que se despliega ante mis ojos se detiene, y durante unos segundos, me encuentro en un estado congelado otra vez, en el momento exacto después de que los dos magos nos emboscaron. Entonces, de repente, el tiempo empieza a moverse de nuevo, y todos están mirando a su alrededor, con expresiones muy confusas en sus caras.

          Espera un momento... ¿Es esto posible? ¿No fue solo mi imaginación? ¿Me estás diciendo que acabo de presenciar el tiempo revirtiéndose y que todos aún recuerdan lo que pasó?

          No tengo mucho tiempo para pensar en lo que pasó, porque mis sospechas se confirman de repente por una Arraka enfurecida.

          "¿¡Una tejedora del tiempo!?" grita Arraka desde su amuleto. "¿¡Me estás tomando el pelo!? ¿Y era Rose, de entre todas las personas? ¡Ustedes sabían esto, ¿verdad?! ¡Me tendieron una trampa! ¡Sabían que esto pasaría! ¡Me dejaron escapar a propósito para poder reírse de mí, ¿verdad?! ¡Pues ¿saben qué?! ¡Se acabó el ser amable! ¡La próxima vez que salga, les voy a arrancar cada hueso de sus cuerpos y haré que sus familias lo vean! ¡Van a suplicarme que les dé las muertes fáciles que les di hoy! ¿Me oyen? ¡Voy a hacer de sus vidas un infierno! ¡Deja de sonreírme, estúpido enano de pacotilla!"
      - source: scene_text_2
        paragraph: 12
        text: |-
          "Ya es suficiente, Arraka," dice Illuna. "No estoy segura de qué pasó exactamente después de que escapaste del amuleto, pero creo que puedo hacerme una idea general por lo que acabas de decir. Perdiste. Ganamos. Supéralo. Si escucho más de tus lloriqueos, voy a cerrar este amuleto y nunca más lo abriré. ¿Entiendes?"

          Arraka no dice nada, pero no necesito ver su cara para saber que debe estar echando humo ahora mismo.

          "¿Estoy... vivo?" dice el mago de túnicas verdes. "Pero... ¿cómo?"

          "¡Fue la maldita!" dice Zack, mientras señala hacia Rose. "¡Lo vi todo suceder ante mis ojos! ¡Revirtió el tiempo! ¿Sabes lo que esto significa? ¿Sabes lo que significaría si alguno de nuestros dioses pudiera hacerse con este tipo de poder?"

          Antes de que el mago de túnicas verdes tenga tiempo de responder a la pregunta, un cono de hielo le atraviesa la cabeza, y muere al instante.

          "Tu amigo realmente no debería habernos dicho que canceló todos sus hechizos de protección hace dos horas," Kate le dice al nigromante. "Eso es prácticamente pedir que te maten una y otra vez."

          "Ya no me importa esa patética excusa de mago," dice Zack. "Lo que me importa más que nada ahora es la mujer con la que viajan. Entréguenla pacíficamente, y haré que sus muertes sean rápidas."

          "Es una decisión difícil de tomar," dice Hadrik, con una sonrisa, "pero me temo que vamos a tener que rechazar tu generosa oferta."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch11b_safety
  - name: ch11b_safety
    texts:
      - source: scene_text
        paragraph: 17
        text: |-
          "¡Que así sea, entonces!" dice Zack, y empieza de nuevo con la invocación de sus esqueletos stillwater.

          "¡Ah, no, eso sí que no!" dice Hadrik, y se lanza hacia el nigromante para matarlo antes de que complete el hechizo, pero uno de los esqueletos, que solo había sacado la mitad superior de su cuerpo del suelo, lanza un poderoso hechizo de viento que envía al enano volando de vuelta hacia nosotros.

          "¡Rose, ponte a salvo!" dice Daren. "Puede que el nigromante y sus esqueletos no puedan hacerte daño debido al hechizo del torneo, pero no se puede decir lo mismo de nosotros. Si te quedas demasiado cerca de nosotros arriesgarás quedar atrapada en el fuego cruzado."

          "De acuerdo," dice Rose, mientras se dirige hacia el extremo opuesto de la plaza del mercado.

          Una vez que los esqueletos han salido completamente a la superficie, dos de ellos empiezan a atacarnos simultáneamente con una ráfaga de hechizos de fuego y agua, mientras otro crea una barrera mágica alrededor de él y todos los demás stillwaters. Daren usa su escudo para crear su propia barrera mágica a nuestro alrededor, pero parece que no podrá mantenerla mucho más tiempo si los stillwaters siguen atacando a este ritmo.
      - source: scene_text_2
        paragraph: 13
        text: |-
          "Si alguien tiene alguna idea de cómo podemos salir de esta con vida, ahora sería un buen momento para hacérnoslo saber," dice Daren, mientras dos paredes de roca recién formadas se cierran sobre su barrera, intentando atravesarla por fuerza bruta.

          "No podemos luchar contra ellos de frente," dice Illuna. "Necesitamos concentrarnos en descubrir sus debilidades. Puede que sean stillwaters, pero siguen siendo solo esqueletos. Si los examinamos cuidadosamente, seguro que descubriremos una o dos cosas que podamos usar a nuestro favor."

          "Bueno, no es que os esté metiendo prisa ni nada," dice Daren, "pero dudo que pueda mantener esta barrera ni un minuto más. Siendo realista, probablemente se romperá mucho antes que eso. Así que, sí, si tenéis pensado buscar puntos débiles, más vale que lo hagáis rápido."

          Illuna tiene razón. Aunque sean stillwaters, sus frágiles cuerpos no muertos les dejarán con algunas debilidades explotables. Azarius nos lo demostró. Incluso si el nigromante ha aprendido de sus errores pasados y los ha protegido contra ataques sónicos, aún debería haber algo que pudiéramos aprovechar. Sin mencionar que el hechizo del nigromante solo dura cinco minutos y está limitado a un uso por día, así que salvo más reversiones temporales inesperadas, deberíamos estar a salvo si logramos resistir durante toda la duración del hechizo.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch11b_emergency
  - name: ch11b_emergency
    texts:
      - source: scene_text
        paragraph: 18
        text: |-
          Mientras examino a los esqueletos cuidadosamente, noto algo peculiar en ellos. Aunque sus auras se sienten similares a la de Eiden, su energía mágica se siente como si estuviera fugándose de sus cuerpos a un ritmo muy rápido. Si tuviera que aventurar una suposición de por qué está pasando eso, diría que lo más probable es que sea porque sus nuevos cuerpos no pueden manejar la tremenda cantidad de energía que tienen a su disposición. Sinceramente me sorprende que mi dispositivo de estadísticas no esté reaccionando a nada de esto. Habría esperado que estuviera pitando como loco a estas alturas.

          Saco mi potenciador de estadísticas para echarle un vistazo, y descubro para mi sorpresa que aunque no tengo puntos nuevos para gastar, hay un mensaje parpadeante en la esquina de la pantalla que dice: 'Modo de emergencia disponible. Toca aquí para activar."

          ¿Modo de emergencia? ¿Es esto algo que solo se puede activar cuando el dispositivo tiene acceso a una gran cantidad de energía? Si es así, ¿entonces es esto lo que hizo Eiden para potenciar mi dispositivo después de llenarlo de energía antes de mi pelea con el dragón?

          Desafortunadamente, no tengo mucho tiempo para pensarlo. Voy a tener que confiar en mi instinto aquí. Y mi instinto me dice que debería aprovechar esta oportunidad mientras la tenga.
      - source: scene_text_2
        paragraph: 14
        text: |-
          Al tocar el mensaje del modo de emergencia, de repente siento una gran cantidad de energía recorriendo mi cuerpo, similar a lo que pasó antes de mi pelea con el dragón, y justo como la última vez, me doy cuenta de que ahora tengo acceso a un impresionante repertorio de hechizos, así como el conocimiento necesario para poder lanzarlos. Por un momento, pude ver dos estadísticas adicionales mostrándose en la pantalla del dispositivo, junto a las nueve existentes. Las estadísticas se llamaban 'Poder mágico' y 'Conocimiento mágico', pero desaparecieron casi tan rápido como aparecieron.

          Creo que estoy empezando a entender lo que está pasando aquí. Este 'Modo de emergencia' de alguna manera potencia dos estadísticas ocultas a las que normalmente no tengo acceso, pero solo lo hace temporalmente, cuando el dispositivo obtiene un excedente de energía que no puede asimilar inmediatamente. Así es como Eiden potenció mi dispositivo para mi pelea con Tyrath. Estoy seguro. La sensación que tengo es exactamente la misma que entonces, aunque no parece que tenga acceso a tantos hechizos como la última vez.

          Esta vez, parece que no tengo disponibles hechizos de vuelo ni de teletransporte, así que supongo que tendré que moverme a la antigua usanza. También me faltan algunos de los hechizos más grandes a los que tenía acceso la última vez, y puedo sentir que el poder detrás de cada uno de mis hechizos es significativamente más débil que cuando Eiden potenció el dispositivo.
      - source: scene_3
        paragraph: 5
        text: Independientemente, esta es la mejor oportunidad que tengo para darle la vuelta a la situación, y necesito aprovecharla al máximo. Primero tendré que decidir si quiero enfrentarme al enemigo solo, o si debería intentar trabajar con todos como equipo para eliminar a los esqueletos. Trabajar en equipo tiene sus ventajas, pero también significa que puede que me vea obligado a limitar la potencia de fuego de algunos de mis hechizos para evitar poner en peligro a mis compañeros. Sin embargo, si los convenzo de esperar aquí, puedo proporcionarles varias protecciones que los mantendrán a salvo y fuera de mi camino durante la pelea.
    choices:
      - position: 1
        text: Luchar contra los esqueletos solo
        effects:
          - set:
              current_scene: ch11b_alone
      - position: 2
        text: Luchar contra los esqueletos en equipo
        effects:
          - set:
              current_scene: ch11b_team
  - name: ch11b_alone
    texts:
      - source: scene_text
        paragraph: 19
        text: |-
          No estoy realmente acostumbrado a trabajar en equipo cuando se trata de usar ataques mágicos. Es mejor si hago esto solo.

          Hay cinco stillwaters en total, de los cuales cuatro parecen ser elementalistas que tienen maestría sobre un elemento mágico diferente cada uno, y el quinto parece estar especializado en apoyar a los demás, ya sea debilitando las defensas del enemigo o lanzando protecciones sobre sus aliados. Dado su alineación perfecta, voy a asumir que formaban parte de un escuadrón durante el invierno inmóvil, y que murieron juntos durante una de sus misiones.

          Sin embargo, los cinco combinados no están ni cerca del nivel de Eiden. Puede que tengan mucho poder y energía mágica, pero aparte de eso, no son diferentes de los magos normales. Los elementalistas no tienen control sobre más de un elemento, el mago de apoyo no lanza otros hechizos aparte de aquellos en los que se especializa, y ninguno de ellos parece ser capaz de ignorar las leyes de la magia de la misma manera que Eiden.
      - source: scene_text_2
        paragraph: 15
        text: |-
          Mientras tanto, el modo de emergencia de mi dispositivo de estadísticas me da acceso a los cuatro elementos mágicos tradicionales, así como a los no tradicionales como el hielo, el ácido y la electricidad. También creo que mi nivel de poder actual es algo comparable al de cada stillwater, pero no puedo estar cien por cien seguro de eso porque nunca he tenido la oportunidad de luchar contra magos en igualdad de condiciones antes.

          La cuestión ahora es cómo planeo usar todo este poder. Si voy con todo y uso mis hechizos más fuertes, hay un gran riesgo de que termine dañando a algunos de los civiles de la ciudad. Las calles pueden haberse vaciado, pero seguro hay algunos locales aún refugiados en las casas cercanas, y realmente no puedo garantizar su seguridad una vez que empiece a hacer caer meteoros del cielo.
    choices:
      - position: 1
        text: Ignorar a los civiles. Lanzar todos mis hechizos más fuertes.
        effects:
          - set:
              current_scene: ch11b_strongest
              ch11_strategy: 1
      - position: 2
        text: Solo lanzar los hechizos que no arriesguen herir a civiles.
        effects:
          - set:
              current_scene: ch11b_civilians
              ch11_strategy: 2
  - name: ch11b_team
    texts:
      - source: scene_text
        paragraph: 20
        text: |-
          Sería demasiado arriesgado luchar contra todos ellos yo solo. Coordinar mis ataques con los demás debería definitivamente aumentar nuestras posibilidades de victoria.

          Hay cinco stillwaters en total, de los cuales cuatro parecen ser elementalistas que tienen maestría sobre un elemento mágico diferente cada uno, y el quinto parece estar especializado en apoyar a los demás, ya sea debilitando las defensas del enemigo o lanzando protecciones sobre sus aliados. Dado su alineación perfecta, voy a asumir que formaban parte de un escuadrón durante el invierno inmóvil, y que murieron juntos durante una de sus misiones.

          Sin embargo, los cinco combinados no están ni cerca del nivel de Eiden. Puede que tengan mucho poder y energía mágica, pero aparte de eso, no son diferentes de los magos normales. Los elementalistas no tienen control sobre más de un elemento, el mago de apoyo no lanza otros hechizos aparte de aquellos en los que se especializa, y ninguno de ellos parece ser capaz de ignorar las leyes de la magia de la misma manera que Eiden.
      - source: scene_text_2
        paragraph: 16
        text: |-
          Mientras tanto, el modo de emergencia de mi dispositivo de estadísticas me da acceso a los cuatro elementos mágicos tradicionales, así como a los no tradicionales como el hielo, el ácido y la electricidad. También creo que mi nivel de poder actual es algo comparable al de cada stillwater, pero no puedo estar cien por cien seguro de eso porque nunca he tenido la oportunidad de luchar contra magos en igualdad de condiciones antes.

          La cuestión ahora es cuál debería ser el enfoque de nuestra pelea. Si nuestro objetivo es simplemente ganar tiempo hasta que el hechizo del nigromante se agote, entonces nuestra mejor apuesta sería seguir reforzando la barrera de Daren, mientras atacamos a los esqueletos desde lejos. Nuestro objetivo principal en ese caso debería ser el stillwater de apoyo, ya que sería el que estaría constantemente intentando debilitar nuestra barrera, y ya que matar al nigromante no cancelaría realmente su hechizo antes de su límite de tiempo.

          Si nuestro objetivo fuera en cambio eliminar a los stillwaters directamente, nuestra mejor apuesta probablemente sería apuntar al nigromante, ya que la prioridad principal de los esqueletos sería defender a su maestro, y esto serviría para romper su ritmo.
    choices:
      - position: 1
        text: Intentar ganar tiempo hasta que el hechizo se agote
        effects:
          - set:
              current_scene: ch11b_buy
              ch11_strategy: 3
      - position: 2
        text: Intentar eliminar a los stillwaters directamente
        effects:
          - set:
              current_scene: ch11b_directly
              ch11_strategy: 4
  - name: ch11b_strongest
    texts:
      - source: scene_text
        paragraph: 21
        text: |-
          "Chicos, tengo un plan," digo. "Pero necesitaré hacer esto solo. ¿Pueden quedarse todos dentro de la barrera de Daren mientras me encargo de los esqueletos? Me aseguraré de reforzarla con todo lo que tengo."

          "¿Pero qué demonios?" dice Daren. "¿Qué es esa energía mágica de locos que irradia de ti de repente? ¡No me digas que Eiden congeló el tiempo otra vez para darte poderes mágicos!"

          "No," digo, mientras empiezo a reforzar la barrera mágica. "No fue Eiden. Simplemente usé mi dispositivo para aprovechar la energía que se está fugando de los stillwaters."

          "¿Puedes hacer eso ahora?" me pregunta Daren.

          "Aparentemente," digo.

          "Bueno, espero que sepas lo que haces," dice Daren.

          "No te preocupes," digo, mientras termino de reforzar la barrera. "¡Esto habrá terminado antes de que te des cuenta!"

          Una vez que me aseguro de que todos están de acuerdo con mi plan, lanzo algunos hechizos de protección sobre mí mismo, y luego salgo de la barrera para enfrentarme a los stillwaters.
      - source: scene_text_2
        paragraph: 17
        text: |-
          Tomo la iniciativa y uso uno de mis hechizos para hacer caer un pequeño meteoro del cielo sobre los esqueletos. El impacto del meteoro hace que dos de los edificios cercanos se derrumben, pero la barrera mágica alrededor de los stillwaters sigue en pie, y ninguno de ellos parece estar herido.

          No les doy tiempo a recuperarse, y convoco una pequeña ventisca, junto con una tormenta eléctrica sobre su posición, mientras dos enormes manos hechas de roca salen del suelo e intentan aplastar a los stillwaters y su barrera bajo sus palmas.

          Mientras tanto, intento eliminar al nigromante a distancia con un ataque de rayo, pero el stillwater encargado del apoyo logra defenderlo a tiempo con una barrera mágica bien colocada frente a él.

          Uno de los esqueletos desaparece de dentro de su barrera, y se teletransporta justo frente a mí, mientras coloca rápidamente sus palmas huesudas sobre mi pecho y lanza un poderoso hechizo de viento contra mí a quemarropa. Su hechizo me envía volando contra una pared detrás de mí, pero uso mi propia magia de viento para levantarme en el aire, justo antes de que su elementalista de tierra intente aplastarme entre dos paredes de piedra.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch11b_strongest2
  - name: ch11b_strongest2
    texts:
      - source: scene_text
        paragraph: 22
        text: |-
          Usar magia de aire para volar no es ni de lejos tan fácil como suena, y me siento mucho más torpe que cuando usaba el hechizo de vuelo en mi pelea con el dragón, pero al menos puedo moverme más fácilmente ahora. El elementalista de aire ve que no estoy muerto, y rápidamente se teletransporta de vuelta dentro de la seguridad de la barrera de su aliado, antes de que tenga la oportunidad de devolverle el favor.

          "¡No, no, no, lo estás haciendo todo mal!" me grita Arraka desde dentro de su amuleto. "¡Deja de atacar toda la barrera y concéntrate en un solo punto! ¿No ves lo lento que su mago de apoyo refuerza partes individuales de la barrera? ¡Es porque nunca aprendió a localizar correctamente su producción de energía! Se lo estuve diciendo hace seiscientos años, pero el idiota no me creyó hasta que se lo demostré usando una maldita rama de árbol para atravesar su barrera y perforarle los pulmones."

          Aceptar consejos de Arraka no es algo que me apetezca especialmente hacer ahora mismo, pero al echar un vistazo a la barrera mágica de los esqueletos, puedo al menos confirmar que no está mintiendo. La energía mágica está distribuida de forma fina por toda la barrera, lo que ayuda enormemente contra hechizos con un área de efecto amplia, pero debería dejarla vulnerable contra ataques más concentrados. Empiezo a cargar un ataque de rayo mientras vuelo en círculos para esquivar los proyectiles mágicos de los otros esqueletos. Cuando mi ataque es lo suficientemente poderoso, me detengo un segundo para tener un tiro claro, y luego apunto directamente al mago de apoyo, asegurándome de que todo el poder detrás de mi golpe esté concentrado en un solo punto.
      - source: scene_text_2
        paragraph: 18
        text: |-
          Mi rayo atraviesa la barrera directamente y golpea al stillwater de apoyo en el cráneo, matándolo al instante. Mientras la barrera mágica empieza a desaparecer, los otros cuatro esqueletos que se ocultaban debajo están ahí de pie, mirando muy confundidos. Aprovecho esto y uso una gran cantidad de energía mágica para crear un gran charco de ácido debajo de los stillwaters.

          Los esqueletos fueron tomados por sorpresa y no tuvieron tiempo de reaccionar. Mientras todos se hunden lentamente en el charco de ácido, el elementalista de aire usa un hechizo de viento para levantar la mitad superior de su cuerpo que aún no se ha derretido en el aire, pero rápidamente levanto dos trozos de roca del suelo y los uso para aplastar la cabeza del esqueleto entre ellos. Finalmente, todos los esqueletos se hunden completamente en el ácido, y decido empezar a descender hacia el suelo, antes de que la energía de mi dispositivo se agote por completo. Una vez que bajo, el charco de ácido desaparece, pero los esqueletos ya se habían derretido completamente antes de que esto ocurriera, lo que significa que el nigromante es ahora el único enemigo que queda en pie.
    effects:
      - set:
          ac_ch11_stillwater: 1
        achievement:
          id: ac_ch11_stillwater
          title: Matador de stillwaters
    choices:
