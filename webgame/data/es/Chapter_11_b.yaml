  - name: ch11b_directly
    texts:
      - source: scene_text
        paragraph: 29
        text: |-
          "Chicos," digo, "creo que tengo un plan."

          "¿Pero qué demonios?" dice Daren. "¿Qué es esa energía mágica de locos que irradia de ti de repente? ¡No me digas que Eiden congeló el tiempo otra vez para darte poderes mágicos!"

          "No," digo, mientras empiezo a reforzar la barrera mágica para darnos algo de tiempo para hablar. "No fue Eiden. Simplemente usé mi dispositivo para aprovechar la energía que se está fugando de los stillwaters."

          "¿Puedes hacer eso ahora?" me pregunta Daren.

          "Aparentemente," digo.

          "¿Entonces cuál es tu plan?" pregunta Daren.

          "Creo que deberíamos empezar a ir a la ofensiva," digo. "Tengo suficientes hechizos de protección para todos y también tengo acceso a muchos hechizos poderosos, así que estaremos mejor presionándolos que ganando tiempo. Deberíamos empezar centrándonos en el nigromante, porque los stillwaters se verán obligados a proteger a su maestro cuando lo ataquemos, y eso podría hacer que rompan su formación."

          Hago una pausa para pensar antes de continuar.

          "Daren, voy a lanzar la mayoría de mis protecciones sobre ti," digo. "Intenta atraer la atención de los stillwaters tanto como puedas."

          "De acuerdo, puedo hacer eso," dice Daren.

          "Hadrik, quiero que presiones al nigromante tanto como puedas," digo. "Una vez que salgamos de la barrera, deberías correr directo hacia él y golpearlo con todo lo que tengas."
      - source: scene_text_2
        paragraph: 24
        text: |-
          "¡Considéralo hecho!" dice Hadrik, con una sonrisa.

          Me giro hacia Flower.

          "Flower, ¿puedes volar, verdad?" le pregunto.

          "Sí, más o menos," dice Flower. "No conozco ningún hechizo para volar, pero puedo hacer que salgan chorros de fuego de mis pies, que me impulsan al aire y pueden mantenerme en vuelo durante largos períodos de tiempo."

          "Perfecto," digo. "Entonces vendrás conmigo. Yo tampoco tengo hechizos para volar, pero creo que puedo usar magia de aire para volar razonablemente bien. Tú, Illuna y yo vamos a atacar a los esqueletos desde arriba, en un intento de abrumar sus defensas."

          "¡Sí, señor!" dice Flower, mientras hace un saludo militar con la mano derecha.

          "Y por último," digo, mientras me giro hacia Kate. "Kate, como te especializas en ataques de largo alcance, quiero que te quedes dentro de esta barrera y observes la pelea desde lejos. Los esqueletos probablemente te ignorarán, así que podrás analizar la situación con calma y buscar sus debilidades. Es seguro que cometerán algunos errores con la presión que les pondremos."

          "De acuerdo," dice Kate. "Me aseguraré de castigarles severamente por cualquier error que cometan durante la pelea."

          "Muy bien, eso es todo," digo. "Saldremos de la barrera juntos en cuanto termine de lanzar todos los hechizos de protección. ¡Prepárense!"
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch11b_directly2
  - name: ch11b_directly2
    texts:
      - source: scene_text
        paragraph: 30
        text: |-
          Una vez que termino de lanzar los hechizos de protección, salimos de la barrera y empezamos a poner nuestro plan en acción. Hadrik se lanza directo hacia el nigromante y lo alcanza en cuestión de segundos, pero el elementalista de aire reacciona rápido y usa un hechizo de viento para empujar a Hadrik varios metros hacia atrás. Para cuando Hadrik vuelve, el esqueleto de apoyo coloca una barrera mágica alrededor de su maestro, que el enano ahora está intentando romper con una ráfaga de puñetazos.

          Daren se dirige hacia los cinco stillwaters, y cuando se acerca a ellos, uno de los esqueletos dispara un poderoso rayo de fuego hacia él. Daren usa su espada para absorber todo el fuego, y luego lo envía de vuelta hacia su atacante. La barrera de los esqueletos les defiende del golpe, pero las acciones de Daren parecen haber captado la atención completa de los stillwaters. Ahora todos están disparando hechizos hacia él, mientras usa su escudo para bloquear y su espada para absorber sus elementos.

          Esto es lo que estábamos esperando. Le hago una señal a Flower, y ella asiente con la cabeza, mientras empieza a correr hacia los stillwaters. Mientras corre, salta alto en el aire y luego usa sus chorros de fuego para impulsarse más alto, mientras va a posicionarse por encima de la barrera de los esqueletos. Yo la sigo y uso mi magia de aire para levantarme en el aire. Usar magia de aire para volar no es ni de lejos tan fácil como suena, y me siento mucho más torpe que cuando usaba el hechizo de vuelo en mi pelea con el dragón, pero debería ser suficiente para mis propósitos.
      - source: scene_text_2
        paragraph: 25
        text: |-
          Alcanzo a Flower, y ambos nos posicionamos unos diez metros por encima de la barrera de los stillwaters, dejando algo de distancia entre nosotros para que sea más difícil que los esqueletos nos apunten a los dos. Entonces empezamos a atacar la barrera con hechizos de fuego, agua y tierra desde todos los lados, en un intento de abrumar las defensas de los stillwaters.

          "¡No, no, no, lo están haciendo todo mal!" nos grita Arraka desde dentro de su amuleto. "¡Dejen de atacar toda la barrera y concéntrense en un solo punto! ¿No ven lo lento que su mago de apoyo refuerza partes individuales de la barrera? ¡Es porque nunca aprendió a localizar correctamente su producción de energía! Se lo estuve diciendo hace seiscientos años, pero el idiota no me creyó hasta que se lo demostré usando una maldita rama de árbol para atravesar su barrera y perforarle los pulmones."

