  - name: ch11b_ending
    texts:
      - source: scene_text
        paragraph: 40
        text: |-
          El cielo sobre nosotros se llena rápidamente de pantallas holográficas muy grandes, mientras la gente empieza lentamente a abrir sus ventanas para echar un buen vistazo, aunque parecen demasiado asustados para acercarse a nosotros. Parece que todas las pantallas muestran lo mismo, que es un gnomo con el pelo despeinado, llevando gafas de protección y una bata de laboratorio manchada de aceite, que actualmente está trasteando con unos cables en algún tipo de taller, mientras tararea una melodía alegre. Después de unos segundos más de tarareo, el gnomo de repente mira hacia nosotros, se quita las gafas y pega la cara a la pantalla.

          "Qué peculiar," dice el gnomo, mientras se aleja de la pantalla. "¡Muy peculiar! ¡Podría jurar que ya he conectado estos cables un millón de veces, pero nunca había visto la luz roja ponerse verde hasta ahora! Bueno, ¡da igual! ¿Pueden oírme todos?"

          Hay una pausa en la que podemos escuchar un murmullo bajo de la gente que observa las pantallas desde sus ventanas.

          "Espera, ¿qué estoy diciendo?" dice el gnomo. "Esto es un transmisor de una sola vía. Aunque me respondan, no podré oírlos. De acuerdo, esto es lo que haré. Voy a proceder a leerles este pequeño discurso que tengo escrito aquí en mi pergamino, y si en realidad nadie puede oírme, simplemente lo leeré de nuevo en otro momento. Ahora, ¿dónde habré puesto ese maldito pergamino?"

          El gnomo desaparece debajo de la pantalla por unos diez segundos, durante los cuales el murmullo en la plaza del mercado se intensifica.
      - source: scene_text_2
        paragraph: 30
        text: |-
          "¡Bueno, podría jurar que lo tenía por aquí, en algún sitio!" dice el gnomo, mientras vuelve de debajo de la pantalla. "¡Da igual, entonces improvisaré!"

          El gnomo se aclara la garganta antes de continuar.

          "¡Damas y caballeros!" dice el gnomo. "¿O debería decir solo caballeros en este caso? ¿Ya que no hay mujeres magas? ¡Caballeros y caballeros! ¡Bienvenidos al torneo de Magium! Soy Golmyck, el rey de Thilias, y tengo un anuncio público que hacer. En primer lugar, me gustaría empezar con una disculpa a todos los magos que se han unido a este torneo. Cuando llegaron por primera vez al continente, a todos se les dijo que recibirían sus objetivos de forma privada, pero desafortunadamente, el dispositivo que se suponía iba a transmitirles estos mensajes se rompió poco después de su llegada. He estado intentando arreglarlo desde entonces, pero dado que ya ha pasado una semana entera, decidí usar este viejo transmisor como solución temporal, hasta que logre hacer funcionar el dispositivo original correctamente. Normalmente, esta transmisión debería estar llegando a todas las ciudades de Varathia e incluso a algunas áreas en la naturaleza salvaje, pero como no puedo garantizar que cada mago en el continente vaya a ver esto, ¡me gustaría pedirles a todos que pasen esta información a sus compañeros participantes que se hayan perdido el anuncio!"
      - source: scene_3
        paragraph: 11
        text: |-
          El gnomo se aclara la garganta de nuevo.

          "Y ahora que las presentaciones están fuera del camino," dice Golmyck, "creo que finalmente es hora de darles a todos lo que han estado esperando."

          El gnomo sonríe.

          "¡Sus primeros objetivos!" dice.

          -----Fin del libro 1-----
