              Mientras todos nos reunimos para mirar el montón de cenizas en que se ha convertido el nigromante, Hadrik se echa a reír.

              "¡En cuanto a últimas palabras se refiere, he oído mejores!" dice el enano.

              "Eso no fue solo una amenaza vacía," dice Illuna, mientras mira a su alrededor frenéticamente, como si esperara que algo explotara. "Eso que acaba de lanzar era un hechizo de sacrificio. Un tipo de hechizo que requiere la muerte de quien lo lanza como pago, a cambio de proporcionar efectos que no serían obtenibles por medios normales. La maldición de muerte que el chamán ogro lanzó sobre mí antes de que dejáramos el fuerte también era uno de estos hechizos. Esto aún no ha terminado..."

              "Tranquila," dice Hadrik. "Si sus todopoderosos esqueletos stillwater no pudieron matarnos, ¿qué esperas que haga después de estar ya muerto?"
          - source: scene_text_2
            paragraph: 26
            text: |-
              "Eso suena muy valiente viniendo de alguien que ni siquiera pudo identificar una debilidad obvia en las defensas del enemigo," dice Arraka. "Todos estarían fritos si no fuera por mí. Yo soy la que los salvó a todos ustedes, perdedores. ¿Dónde está mi recompensa por eso, eh?"

              "¡Ah, tengo tu recompensa justo aquí!" dice Hadrik, mientras agarra el amuleto de Arraka del cuello de Flower y empieza a hacerlo girar por la cadena.

              "Espera," dice Flower. "¡No hagas eso! ¿No te dije que tiene mareos por movimiento?"

              "¿En serio?" dice Hadrik, con una sonrisa, mientras sigue haciendo girar a Arraka. "Vaya. Supongo que se me habrá olvidado."
