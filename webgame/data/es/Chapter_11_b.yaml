scenes:
  - name: ch11b_credits
    effects:
      - set:
          iap_check_resume: 1
        condition: iap_checked <> 0 AND iap_checked <> 2
      - set:
          first_book_purchased: 1
          iap_check_resume: 0
    routes:
      - condition: first_book_purchased = 1
        texts:
          - source: scene_text
            paragraph: 42
            text: |-
              Este marca el final del primer libro de Magium.

              El segundo y tercer libro han sido completados y están listos para desbloquear, pero los libros restantes se publicarán capítulo a capítulo, a medida que los escriba. (la serie principal probablemente tendrá 5 libros en total)

              Si ya pagaste para desbloquear el segundo libro, puedes tocar el botón de abajo para continuar. De lo contrario, necesitarás completar 25 logros del primer libro para desbloquear el segundo.

              Puedes ver cuántos logros más necesitas completar en el menú de logros.

              También me gustaría añadir que te sugiero encarecidamente que guardes la partida ahora en una ranura que no vayas a sobrescribir, si planeas empezar a completar logros, ya que de lo contrario perderás el progreso de tu partida actual y tendrás que terminar el juego otra vez para poder avanzar al siguiente libro.

              También deberías tener cuidado de no desinstalar el juego, ya que todos los libros siguientes se subirán dentro de la misma aplicación, y si desinstalas el juego, todo tu progreso local, incluidos tus logros, se perderá.

              ¡Gracias por jugar!

              P.D. Si disfrutaste el juego, no olvides recomendarlo a tus amigos.
        choices:
          - position: 1
            text: Continuar al libro 2
            effects:
              - set:
                  b1_saved_stats: 1
                  b1_strength: ${strength_aux}
                  b1_agility: ${agility_aux}
                  b1_toughness: ${toughness_aux}
                  b1_reflexes: ${reflexes_aux}
                  b1_hearing: ${hearing_aux}
                  b1_perception: ${perception_aux}
                  b1_ancient_languages: ${ancient_languages_aux}
                  b1_combat_technique: ${combat_technique_aux}
                  b1_premonition: ${premonition_aux}
                  b1_available_points: ${available_points_aux}
