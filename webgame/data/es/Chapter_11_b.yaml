        paragraph: 41
        text: |-
          De repente, Rose empieza a moverse, y lentamente levanta el torso del suelo, mientras mira a su alrededor, con una expresión vacía en el rostro. Pero su expresión no es lo único que se siente vacío en ella. Su aura es completamente diferente a la de antes también. Se siente hueca, casi sin vida, y su piel es mucho más blanca, casi como si ya no circulara sangre por sus venas.

          "¡Rose!" grita Kate. "¡Estás viva!"

          "No," dice Daren, con una mirada muy oscura en los ojos. "Esa no es Rose."

          "¿Qué quieres decir?" pregunta Kate. "Por supuesto que es Rose. ¡Está ahí mismo!"

          "Solo su cuerpo está ahí," dice Illuna. "Rose está muerta. Lo que ves ante ti es un revenant. Un ser no muerto que nace con los recuerdos previos del anfitrión, pero con una personalidad completamente diferente. Ahora entiendo por qué el nigromante se tomó tantas molestias en lanzar un hechizo de sacrificio antes de matarse. Fue para convertir a Rose en un revenant."

          "¡No, eso no puede ser verdad!" dice Kate, con desesperación en la voz, mientras Rose se levanta del suelo y empieza a caminar lentamente alejándose de nosotros. "¡Rose, diles que no es verdad!"

          "Aquella a quien llaman Rose ya no existe," dice el revenant, sin girar la cabeza hacia nosotros. "Soy una servidora de Ulruk, el Dios de la Muerte, y mi tarea es llevar este cuerpo de tejedora del tiempo hasta él sano y salvo."

          "Eso no va a pasar, maldita escoria no muerta," dice Daren, mientras saca su espada. "Vas a dejar su cuerpo aquí, para que podamos darle un entierro digno."
      - source: scene_text_2
        paragraph: 31
        text: |-
          "No estás en posición de detenerme, sanador," dice el revenant. "No soy como tu amiga, que no sabía cómo controlar sus poderes. Solo tengo que congelar el tiempo durante unas horas, y desde tu punto de vista, será como si me hubiera teletransportado fuera de la ciudad. Ahora, si me disculpan, mi maestro me está esperando."

          Entonces empieza a caminar lentamente alejándose de nosotros otra vez, sin molestarse siquiera en mirar atrás, como si ni siquiera nos considerara una amenaza. Las manos de Daren están temblando mientras mira hacia el revenant, y parece congelado en su lugar. Aunque sabe que no es Rose, debe ser difícil para él obligarse a atacarla.

          "Oh, una cosa más antes de irme," dice el revenant, mientras se detiene y gira la cabeza hacia nosotros. Esta vez, la mirada vacía en sus ojos es reemplazada por una de arrepentimiento. "Cuiden a los niños por mí, ¿quieren? No creo que vaya a volver a esa casa pronto..."

          "¡Detente!" grita Daren.

          Entonces corre hacia el revenant e intenta cortarla con su espada, pero ella desaparece sin dejar rastro antes de que pudiera asestarle un golpe, y lo único que su hoja consigue cortar es el aire vacío.

          Mientras todos nos quedamos ahí en silencio, un fuerte estruendo empieza a resonar por toda la ciudad.
