  - name: ch11b_bother
    texts:
      - source: scene_text
        paragraph: 33
        text: |-
          "Déjala, Hadrik. No vale la pena."

          "Al contrario, Barry," dice Hadrik. "Creo que esto bien vale el esfuerzo. De hecho, ¡creo que voy a incorporar esta rutina a mi horario diario a partir de ahora! Pero necesito consultar con Arraka primero. No querría imponerme. ¿Qué dices, Arraka, te parece bien a las diez de la mañana para nuestras sesiones diarias de giro?"

          "¡Enano!" dice Arraka, mientras Hadrik sigue haciéndola girar. "¡Cuando salga de aquí otra vez, voy a meter mi mano por tu garganta y te voy a dar la vuelta como un calcetín! ¡Y luego te voy a colgar de un árbol por tus propios intestinos para poder usarte de columpio!"

          "¿Entonces, las diez es muy temprano?" pregunta Hadrik, con una sonrisa. "¿Sería mejor si lo programamos para las once de la mañana?"
