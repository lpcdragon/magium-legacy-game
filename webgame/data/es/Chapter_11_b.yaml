  - name: ch11b_buy
    texts:
      - source: scene_text
        paragraph: 27
        text: |-
          "Chicos," digo, "creo que tengo un plan."

          "¿Pero qué demonios?" dice Daren. "¿Qué es esa energía mágica de locos que irradia de ti de repente? ¡No me digas que Eiden congeló el tiempo otra vez para darte poderes mágicos!"

          "No," digo, mientras empiezo a reforzar la barrera mágica. "No fue Eiden. Simplemente usé mi dispositivo para aprovechar la energía que se está fugando de los stillwaters."

          "¿Puedes hacer eso ahora?" me pregunta Daren.

          "Aparentemente," digo.

          "¿Entonces cuál es tu plan?" pregunta Daren.

          "Bueno," digo, "¿recuerdas cómo Azarius nos dijo la última vez que el hechizo del nigromante solo dura cinco minutos y que solo puede lanzarse una vez al día? Estaba pensando que podríamos simplemente esperar a que se agote, mientras seguimos reforzando la barrera y atacándolos desde la distancia."

          "En ese caso, espero que tengas unos hechizos de refuerzo realmente buenos," dice Daren, "porque yo prácticamente ya he agotado todos los míos."

          "No te preocupes," digo. "Tú solo concéntrate en mantener la barrera. Yo me encargo de los refuerzos."

          Me giro hacia Flower y Kate.

          "¿Pueden ustedes tres poner algo de presión sobre los stillwaters mientras Daren y yo mantenemos la barrera?" digo.

          "¡Sí, señor!" dice Flower, mientras hace un saludo militar con la mano derecha.
      - source: scene_text_2
        paragraph: 22
        text: |-
          "Veré qué puedo hacer," dice Kate.

          "Intenten apuntar al esqueleto que mantiene su barrera mágica tanto como sea posible," digo. "Él es el que va a estar ocupado deshaciendo mis hechizos de refuerzo."

          "¿Y qué se supone que haga yo todo este tiempo?" pregunta Hadrik.

          "Bueno, podrías, eh..." empiezo a decir, pero me detengo a pensar un segundo. "Puedes ser nuestra última línea de defensa y asegurarte de repeler todos sus hechizos en caso de que nuestra barrera falle antes del límite de tiempo."

          "¡Genial!" dice Hadrik. "Son momentos como estos los que me hacen lamentar no haber traído un mazo de cartas conmigo cuando me uní al torneo."

          Una vez que todos aceptan seguir mi plan, vuelvo a reforzar la barrera de Daren, mientras Kate, Flower e Illuna empiezan a lanzar sus hechizos contra los stillwaters. Mantener la barrera contra tantos ataques simultáneos está resultando ser un poco más difícil de lo que había pensado originalmente. Daren ya está en su límite, y mantener la barrera por mí mismo está empezando a drenarme de energía rápidamente. Las chicas tampoco parecen estar haciéndolo muy bien, porque aún no han logrado atravesar la barrera de los esqueletos, mientras el stillwater de apoyo hace todo lo posible por contrarrestar mis hechizos de refuerzo.

          Esto no está funcionando. Necesito revisar mi plan, o no vamos a aguantar hasta la marca de los cinco minutos.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch11b_buy2
  - name: ch11b_buy2
    texts:
      - source: scene_text
        paragraph: 28
        text: |-
          "Hadrik," digo, "ha habido un cambio de planes. ¿Qué te parecería proporcionarnos una pequeña distracción?"

          La cara del enano se ilumina cuando escucha mi sugerencia.

          "¡Ahora sí que estamos hablando, Barry!" dice, con una amplia sonrisa. "¿Qué quieres que haga? ¿Debería simplemente ir y atacar al nigromante para darles un buen susto?"

          "Sí, eso es exactamente lo que tenía en mente," digo. "Espera, déjame lanzarte algunas protecciones primero."

          Una vez que termino de lanzar los hechizos de protección sobre Hadrik, el enano sale disparado de la barrera y alcanza al nigromante en unos segundos. El elementalista de aire reacciona rápido y usa un hechizo de viento para empujar a Hadrik varios metros hacia atrás. Para cuando Hadrik vuelve, el esqueleto de apoyo coloca una barrera mágica alrededor de su maestro, que el enano ahora está intentando romper con una ráfaga de puñetazos.

          "¡No, no, no, lo están haciendo todo mal!" nos grita Arraka desde dentro de su amuleto. "¡Dejen de atacar toda la barrera y concéntrense en un solo punto! ¿No ven lo lento que su mago de apoyo refuerza partes individuales de la barrera? ¡Es porque nunca aprendió a localizar correctamente su producción de energía! Se lo estuve diciendo hace seiscientos años, pero el idiota no me creyó hasta que se lo demostré usando una maldita rama de árbol para atravesar su barrera y perforarle los pulmones."
      - source: scene_text_2
        paragraph: 23
        text: |-
          Aceptar consejos de Arraka no es algo que me apetezca especialmente hacer ahora mismo, pero al echar un vistazo a la barrera mágica de los esqueletos, puedo al menos confirmar que no está mintiendo. La energía mágica está distribuida de forma fina por toda la barrera, lo que ayuda enormemente contra hechizos con un área de efecto amplia, pero debería dejarla vulnerable contra ataques más concentrados. Empiezo a cargar un ataque de rayo en mis manos, y cuando se vuelve lo suficientemente poderoso, lo apunto directamente al mago de apoyo, asegurándome de que todo el poder detrás de mi golpe esté concentrado en un solo punto.

          Mi rayo atraviesa la barrera de los esqueletos directamente y golpea al stillwater de apoyo en el cráneo, matándolo al instante. Mientras la barrera mágica empieza a desaparecer, los otros cuatro esqueletos que se ocultaban debajo están ahí de pie, mirando muy confundidos. Aprovecho esto y uso una gran cantidad de energía mágica para crear un gran charco de ácido debajo de los stillwaters.

          Los esqueletos fueron tomados por sorpresa y no tuvieron tiempo de reaccionar. Mientras todos se hunden lentamente en el charco de ácido, el elementalista de aire usa un hechizo de viento para levantar la mitad superior de su cuerpo que aún no se ha derretido en el aire, pero rápidamente levanto dos trozos de roca del suelo y los uso para aplastar la cabeza del esqueleto entre ellos. Finalmente, todos los esqueletos se hunden completamente en el ácido, y cuando la energía de mi dispositivo se agota por completo, el charco de ácido desaparece. Sin embargo, los esqueletos ya se habían derretido completamente antes de que esto ocurriera, lo que significa que el nigromante es ahora el único enemigo que queda en pie.
