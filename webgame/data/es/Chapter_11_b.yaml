            paragraph: 26
            text: |-
              No hay necesidad de entrar en pánico. Puedo simplemente usar mi sentido mágico para saber dónde están. Mientras empiezo a atacar a los stillwaters de nuevo, de repente escucho un fuerte crepitar justo a mi lado e inmediatamente después, una explosión muy poderosa me envía estrellándome contra el suelo. La explosión estuvo demasiado cerca de mí para que mi escudo mágico me protegiera completamente, y creo que debo haberme roto al menos dos costillas con esa caída.

              Nunca tengo la oportunidad de volver a la pelea, porque justo después de golpear el suelo, una gruesa capa de roca se presiona sobre mí y me aplasta hasta convertirme en una pasta roja y espesa en cuestión de segundos.
