  - name: ch11b_clones
    texts:
      - source: scene_text
        paragraph: 2
        text: |-
          "¿Cómo supieron que estaríamos aquí?" les pregunta Kate.

          "Todo es gracias a su amiga de ahí," dice el mago de las túnicas verdes, señalando hacia Rose. "Un mendigo la escuchó decirle a una enfermera en el hospital que traería a un sanador experto para atender a los enfermos. Nos vendió la información por una suma razonable, y organizamos el vaciado de las calles junto con los guardias locales, por si el sanador en cuestión era de hecho el que estábamos buscando. Ahora bien, Zack, deberías hacerte a un lado mientras yo me encargo de estos debiluchos. Yo solo debería ser más que suficiente para acabar con ellos."

          "No, no lo eres," dice Daren. "Ya sabemos que tu dios se especializa en ilusiones. Las ilusiones son inútiles contra enemigos que ya las esperan."

          "¿Estás seguro de eso, sanador?" dice el mago de las túnicas verdes, y de repente, cientos de clones tanto de él como de su aliado llenan toda el área del mercado a nuestro alrededor.

          "No te has movido de tu posición original, genio," dice Daren, mientras se lanza hacia él. "Sé cuál es el verdadero."

          Cuando Daren alcanza a los dos magos originales, lanza un tajo con su espada y los atraviesa a ambos de un solo golpe. Sin embargo, en lugar de morir, los dos magos simplemente se desvanecen en el aire.

          "¿Qué significa esto?" pregunta Kate. "Si esos dos eran de hecho ilusiones, ¿significa eso que los magos reales estaban ocultos invisiblemente cuando lanzaron el hechizo de ilusión?"
      - source: scene_text_2
        paragraph: 2
        text: |-
          "Arraka," digo, "¿por qué no nos dijiste que los magos eran invisibles?"

          "Porque no lo eran," dice Arraka. "Si alguien se ocultara invisiblemente en cualquier lugar, lo habría detectado."

          "Entonces, ¿cómo explicas el hecho de que los que estábamos viendo eran en realidad ilusiones?" pregunto.

          "¿Cómo se supone que yo sepa eso, imbécil?" dice Arraka. "¡Averígualo tú mismo!"

          "¿Puedes al menos averiguar cuáles de estos son los originales?" pregunto.

          "No," dice Arraka. "Nunca me molesté en aprender cómo distinguir entre clones y originales, porque cada vez que alguien lanzaba un hechizo así contra mí, simplemente usaba un hechizo propio para destruirlos a todos al mismo tiempo, y eso era todo."

          "¿Alguien tiene idea de por qué ninguno de los clones nos ha atacado todavía?" nos pregunta Hadrik. "Solo están ahí parados, sonriendo como un montón de idiotas. ¿Creen que están esperando algo?"
    choices:
      - position: 1
        text: Preguntarle a Kate si puede congelar toda el área a nuestro alrededor para encargarse de los clones.
        effects:
          - set:
              current_scene: ch11b_freeze
      - position: 2
        text: Intentar concentrarse en encontrar a los originales e ignorar los clones por ahora.
        effects:
          - set:
              current_scene: ch11b_concentrate
  - name: ch11b_freeze
    routes:
      - condition: premonition < 4
        texts:
          - source: scene_text
            paragraph: 3
            text: |-
              "Kate," digo, "¿podrías congelar toda el área a nuestro alrededor para encargarte de todos los clones al mismo tiempo?"

              "Sí," dice Kate, "estaba a punto de hacer justo eso."

              Luego envía una poderosa onda de magia congelante a nuestro alrededor, que golpea a todos los clones a la vez. Inmediatamente después de que las ilusiones desaparecen, la onda congelante de Kate invierte su dirección, y nos golpea a todos antes de que tengamos tiempo de reaccionar.

              Mientras los demás se sacuden el hechizo de hielo cada uno a su manera, puedo sentir cómo me congelo lentamente hasta morir, mientras mi corazón late cada vez más lento por segundos.

              "¡Kate, descongélalo, rápido!" dice Daren.

              "¡No puedo!" dice Kate. "¡No sé cómo!"

              Daren corre hacia mí e intenta lanzar algún tipo de hechizo de curación sobre mí, pero ya es demasiado tarde para eso. Ya puedo sentir mi consciencia desvaneciéndose, mientras mi visión comienza a nublarse, poco a poco. Morí poco después, sin siquiera descubrir qué fue lo que devolvió el hechizo de Kate contra nosotros.
        effects:
          - set:
              failed_checks:
                - '[ Comprobación de premonición fallida - nivel 4 ]'
              is_dead: 1
        choices:
          - position: 1
            text: Reiniciar juego
            effects:
              - set:
                  current_scene: ch1_intro1
                  storyboard_controls: Jump to frame "Chapter 1"
                condition: is_dead = 1
          - position: 2
            text: Cargar desde el último punto de control
            effects:
              - set:
                  chapter_load: 1
                  storyboard_controls: Jump to frame "Save load game"
                condition: is_dead = 1
          - position: 3
            text: Cargar partida
            effects:
              - set:
                  storyboard_controls: Jump to frame "Save load game"
                condition: is_dead = 1
      - condition: premonition >= 4
        texts:
          - source: scene_text
            paragraph: 4
            text: |-
              "Kate," digo, "¿podrías congelar toda el área a nuestro alrededor para encargarte de todos los clones al mismo tiempo?"

              En cuanto dejo de hablar, veo una visión en la que Kate destroza a todos los clones con una onda de hielo. Una vez que todos desaparecen, la onda congelante de Kate rápidamente invierte su dirección, y nos golpea a todos antes de que tengamos tiempo de reaccionar.

              "Sí," me responde Kate, "estaba a punto de hacer justo eso."

              "¡Espera!" grito. "¡No lo hagas!"

              Kate se ve un poco confundida, pero detiene su hechizo justo a tiempo.

              "¿Por qué no?" me pregunta.

              "Acabo de tener una premonición," digo. "Si hubieras lanzado ese hechizo, se habría vuelto contra nosotros y nos habría congelado a todos, justo después de que los clones desaparecieran."

              "Entonces, ¿los clones son una trampa?" pregunta Hadrik.
          - source: scene_text_2
            paragraph: 3
            text: |-
              "¡Esperen un momento!" dice Arraka. "¡Creo que lo tengo!"

              "¿Reconoces el hechizo?" pregunta Kate.

              "Sí," dice Arraka. "Este es en realidad uno de los hechizos de ilusión favoritos de Memphir. No me sorprende que haya empezado a enseñárselo a sus seguidores."

              "¿Memphir?" pregunta Hadrik. "¿Ese es el nombre del Dios del Destino?"

              "Sí, ese es," dice Arraka. "El hechizo está diseñado de tal manera que cuando todas las ilusiones son destruidas, los atacantes reciben de vuelta todos los hechizos que lanzaron para matar a los clones. Siempre solía caer en ese estúpido truco."

              "¿Cómo puedes saber que es exactamente el mismo hechizo?" le pregunto.

              "Si prestas mucha atención, verás que todos los clones tienen una firma fácilmente reconocible en sus auras mágicas," dice Arraka. "El flujo de sus auras tiene una especie de movimiento serpenteante. Algo así como una culebra moviéndose entre la hierba. ¿Entienden lo que digo?"

              "Sí, creo que lo entiendo," digo.

              "¡Oye, creo que yo también puedo verlo!" dice Hadrik. "¡Esto es genial! ¡Ahora solo tenemos que ver cuáles de ellos no llevan esta firma, y sabremos quiénes son los originales!"

              "Ajá," dice Arraka. "Buena suerte con eso."
        effects:
          - set:
              successful_checks:
                - '[ Comprobación de premonición exitosa - nivel 4 ]'
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: ch11b_square
                condition: is_dead = 0
  - name: ch11b_concentrate
    texts:
      - source: scene_text
        paragraph: 5
        text: |-
          "Voy a intentar congelar toda el área a nuestro alrededor, para poder encargarme de todos los clones al mismo tiempo," dice Kate.

          "No, espera," digo. "Creo que deberíamos concentrarnos primero en encontrar a los originales."

          "¿Crees que destruir los clones podría activar una trampa?" dice Kate.

          "No lo sé," digo. "Pero el hecho de que los clones no se muevan en absoluto me hace pensar que al menos están esperando algo. Mientras no estén haciendo nada, creo que deberíamos aprovechar la situación e intentar descifrar su truco antes de enfrentarlos abiertamente."

          "¡Esperen un momento!" dice Arraka. "¡Creo que lo tengo!"

          "¿Descubriste cuáles son los originales?" pregunta Kate.
      - source: scene_text_2
        paragraph: 4
        text: |-
          "No, ¡pero descubrí qué tipo de hechizo de ilusión están usando!" dice Arraka. "Este es en realidad uno de los favoritos de Memphir. No me sorprende que haya empezado a enseñárselo a sus seguidores."

          "¿Memphir?" pregunta Hadrik. "¿Ese es el nombre del Dios del Destino?"

          "Sí, ese es," dice Arraka. "El hechizo está diseñado de tal manera que cuando todas las ilusiones son destruidas, los atacantes reciben de vuelta todos los hechizos que lanzaron para matar a los clones. Siempre solía caer en ese estúpido truco."

          "¿Cómo puedes saber que es exactamente el mismo hechizo?" le pregunto.

          "Si prestas mucha atención, verás que todos los clones tienen una firma fácilmente reconocible en sus auras mágicas," dice Arraka. "El flujo de sus auras tiene una especie de movimiento serpenteante. Algo así como una culebra moviéndose entre la hierba. ¿Entienden lo que digo?"

          "Sí, creo que lo entiendo," digo.

          "¡Oye, creo que yo también puedo verlo!" dice Hadrik. "¡Esto es genial! ¡Ahora solo tenemos que ver cuáles de ellos no llevan esta firma, y sabremos quiénes son los originales!"

          "Ajá," dice Arraka. "Buena suerte con eso."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch11b_square
  - name: ch11b_square
    texts:
      - source: scene_text
        paragraph: 6
        text: |-
          "¿Por qué dices eso?" dice Kate.

          "Porque ya lo comprobé," dice Arraka. "Dos veces. Ninguno de ellos es el original."

          "¿Estás diciendo que los magos reales nunca estuvieron aquí, y que simplemente lanzaron el hechizo de ilusión desde lejos?" pregunta Daren.

          "No," dice Arraka. "He estado vigilando toda el área a nuestro alrededor desde que noté que las calles estaban vacías, y les garantizo que los únicos magos que estaban lo suficientemente cerca como para lanzar un hechizo de ilusión sobre nosotros fueron los dos que nos emboscaron."

          "Pero eso no tiene sentido," digo. "Si esos dos eran los magos reales, entonces ¿qué les pasó? ¿Simplemente se convirtieron en ilusiones también cuando lanzaron el hechizo?"

          De repente, se me ocurre una idea.

          "Esperen..." digo. "Creo que tengo una pista, pero necesito confirmación antes de estar seguro. Illuna, comprueba mi razonamiento. ¿Podría ser todo esto una ilusión? No solo los clones que tenemos delante, sino todo el mundo a nuestro alrededor también. Ya saben, como aquella vez con el chamán."

          "No, eso es imposible," dice Illuna. "Si se hubiera lanzado un hechizo que afecta la mente de ese calibre sobre nosotros, debería haber habido algún tipo de efecto visual, para que todos lo viéramos, de la misma manera que las cavernas subterráneas se llenaron de humo cuando el chamán lanzó su hechizo. No hubo tal--"

          Illuna se detiene un segundo, mientras la comprensión se apodera de ella.
      - source: scene_text_2
        paragraph: 5
        text: |-
          "¡La luz verde!" dice. "¡Por supuesto! ¡Debería haberme dado cuenta inmediatamente! Esto también explica por qué su supuesta trampa afectó a Rose. Es porque lo que realmente pasó fue lo contrario. Su hechizo de control mental no pudo actuar sobre Rose, y entonces, a nosotros nos pareció como si hubiera perdido el conocimiento. Probablemente es lo mismo con Flower también."

          "Genial," dice Daren. "Así que estamos de vuelta al punto de partida, entonces. Necesitamos encontrar a los magos reales para poder matarlos y salir de la ilusión."

          "No, no es necesario," dice Illuna. "Solo necesitamos hacer eso con el chamán porque se había atrapado a sí mismo en la ilusión con nosotros para evitar que escapáramos, ¿recuerdan? Ya que los magos no están realmente aquí con nosotros, significa que el propósito principal de esta ilusión no era matarnos, sino ganar tiempo para que pudieran matarnos en el mundo real mientras estábamos indefensos. Esto me lleva a creer que el tiempo fluye a la misma velocidad aquí que en el mundo real, lo cual es diferente de lo que experimentamos en el ritual del chamán."

          "Oh, dioses," dice Kate. "Si eso es cierto, ¡entonces significa que Flower ha estado luchando contra los dos magos sola en el mundo real todo este tiempo!"

          "Probablemente," dice Illuna. "Necesitamos salir de aquí rápido. Todos, cierren los ojos y empiecen a visualizar los momentos antes de que los magos lanzaran la ilusión sobre nosotros. Necesitan hacer esto con la convicción de que la imagen en su cabeza representa el mundo real, y que quieren regresar a él. Si todos hacemos esto a la vez, romperemos el efecto de la ilusión sobre nosotros."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch11b_honor
  - name: ch11b_honor
    texts:
      - source: scene_text
        paragraph: 7
        text: |-
          Todos cerramos los ojos y empezamos a hacer lo que dijo Illuna. Mientras formo una imagen clara de las calles de la ciudad en mi mente, la imagen empieza a volverse cada vez más nítida, hasta que siento que me atrae hacia ella, y de repente me doy cuenta de que mi imaginación se había convertido en realidad sin que yo siquiera lo notara. Al abrir los ojos, me veo de pie en medio de la calle, pero todo se ve muy diferente a como lo recordaba.

          Hay cráteres por todos lados, las paredes de las casas a los lados de la calle están completamente carbonizadas, y hay un enorme dragón esquelético justo frente a nosotros. Rose está de rodillas, llorando, y Flower parece que apenas puede mantenerse en pie, pero está mirando al dragón desafiante. Está cubierta de moretones por todas partes, y su ropa es un completo desastre, pero hay un aura muy intimidante rodeándola, como si estuviera hecha de un fuego más caliente que el de su magia elemental. Cuando Flower siente que finalmente hemos despertado del hechizo de ilusión, se gira hacia nosotros y nos da una sonrisa cansada.

          "¡Rompieron el hechizo!" dice la chica. "Sabía que podían hacerlo. Lo sabía..."

          Al pronunciar las últimas palabras, los ojos de Flower se cierran lentamente, y luego cae al suelo, inconsciente. Daren ahora se apresura a su lado, para protegerla del dragón, en caso de que decida atacarla mientras está indefensa.

          "Fue tan imprudente..." dice Rose, mientras contiene las lágrimas. "Nunca dejó de pelear incluso después de que claramente había excedido sus límites. Estaba intentando desesperadamente protegerlos, incluso a costa de su propia vida..."
      - source: scene_text_2
        paragraph: 6
        text: |-
          "Está bien," dice Illuna, mientras toma el control del cuerpo de la chica, pero no se levanta del suelo. "La chica solo se desmayó por agotamiento. No va a morir."

          "¿Ves lo que has hecho ahora, idiota?" Zack el nigromante le dice a su aliado. "¡Si el inútil hechizo de tu dios hubiera funcionado como dijiste que lo haría, no estaríamos en este lío!"

          "¡No te atrevas a echarme la culpa a mí!" dice el mago de las túnicas verdes, mientras está bañado en sudor, luciendo como si estuviera a punto de desmayarse de agotamiento también. "Mi hechizo nunca fue diseñado para funcionar contra almas fusionadas. Simplemente apuntó al alma que estaba controlando el cuerpo en ese momento y dejó a la otra en paz. No había forma de que pudiera evitarlo. ¡Tú eres el único culpable de esto, maldito tacaño! Si hubieras usado ese hechizo stillwater de invocación tuyo cuando te lo dije, todos habrían muerto en segundos."

          "Cállate, hereje," dice Zack. "Solo puedo lanzar ese hechizo una vez al día. Sería un insulto al gran Dios de la Muerte Ulruk si desperdiciara su único uso diario tan temprano en la mañana, en gente como ellos."

          "¿Estás bromeando?!" dice el mago de las túnicas verdes. "¿Tienes idea de cuánta energía mágica necesité gastar para mantenerlos en esa ilusión durante tanto tiempo? ¡Tuve que cancelar todas mis protecciones hace dos horas solo para poder lanzar el maldito hechizo! ¡Ni siquiera tengo mi escudo mágico activado ahora mismo!"

          Justo cuando el mago de las túnicas verdes deja de hablar, un cono de hielo le atraviesa la cabeza, y poco después cae al suelo, sin vida.
      - source: scene_3
        paragraph: 3
        text: |-
          "Gracias por avisarme," dice Kate.

          "¡Maldita!" dice Zack, furioso. "¿No tienes honor?!"

          "Es su propia maldita culpa por no prestar atención durante una pelea," dice Kate. "¡Y no me hables de honor! Tú habrías hecho exactamente lo mismo con nosotros si Flower no nos hubiera protegido mientras estábamos indefensos."

          "¡No me sermonees, maldita!" dice Zack. "¡No hay necesidad de honor cuando se mata a herejes irredimibles como ustedes!"
    choices:
      - position: 1
        text: ¿Cómo sabes que somos irredimibles?
        effects:
          - set:
              current_scene: ch11b_irredeemable
      - position: 2
        text: ¿Tu amigo no era también un hereje?
        effects:
          - set:
              current_scene: ch11b_heathen
      - position: 3
        text: ¿Y cómo te conviertes en seguidor de Ulruk? ¿Hacen entrevistas para eso?
        effects:
          - set:
              current_scene: ch11b_interviews
  - name: ch11b_irredeemable
    texts:
      - source: scene_text
        paragraph: 8
        text: |-
          "¿Cómo sabes que somos irredimibles?"

          "¡El hecho de que hayan llegado a la madurez y aún no hayan decidido dedicar sus vidas al Dios de la Muerte es prueba suficiente, hereje!" dice Zack. "Pero basta de charla. Voy a enseñarles a todos de primera mano por qué toda su vida hasta este momento fue un error."

          "Illuna, ¿puedes moverte?" pregunta Daren.

          "No," dice Illuna. "La chica llevó su cuerpo mucho más allá de sus límites mientras estábamos en la ilusión. Puedo sentir un dolor en cada hueso y músculo, y ni siquiera puedo mover un dedo. Su cuerpo está cubierto de moretones, su ropa es un desastre, y el amuleto de Arraka está..."

          Se detiene por un momento, y de repente, escuchamos un crujido proveniente del amuleto alrededor de su cuello.

          "Oh..." dice Illuna. "Oh, no..."

          "Aja- AJAJAJA--"

          El amuleto cruje de nuevo, esta vez mucho más violentamente que antes, y la risa de Arraka se intensifica aún más.

          "¡AJAJAJAJAJAJAJAJA!"
      - source: scene_text_2
        paragraph: 7
        text: |-
          De repente, el amuleto se rompe completamente, y un aura oscura envuelve a Illuna, mientras el cuerpo de la chica se eleva lentamente en el aire, en posición erguida. Un viento muy poderoso nos sopla en la cara, empujándonos a todos lejos de ella, mientras el cielo se oscurece cada vez más por segundos. Los ojos de la chica ahora están cambiando lentamente de azul brillante a negro absoluto, mientras sonríe ampliamente, mirando a cada uno de nosotros por turno.

          "¡Así que esto es lo que parecen todos en persona!" dice Arraka. "Era un poco difícil saberlo desde dentro del amuleto, guiándome solo por el sentido mágico. Cómo pueden salir cada día sin que los confundan con una compañía de circo me supera."

          "Mira quién habla," dice Hadrik. "Te das cuenta de que literalmente estás vestida como un payaso ahora mismo, ¿verdad?"

          Arraka le sonríe malvadamente a Hadrik.

          "Enano," dice. "¿Estás seguro de que es buena idea estar ahí parado haciendo chistes? ¿No deberías más bien estar comprándome esa cerveza que me debes? Me vendría bien un trago ahora mismo. Eso y una masacre. Todavía no estoy segura con cuál debería empezar."

          "Flower..." dice Kate, débilmente. "¿Qué le pasó a Flower? ¿Dónde están Flower e Illuna?"

          "Oh, están muertas," dice Arraka. "¿O debería decir... 'absorbidas'? Lo que pasó es que me fusioné con sus almas cuando tomé el control de su cuerpo. Ambas son parte de mí ahora."

          ”Entonces, ¿ambas siguen ahí dentro... en algún lugar?" pregunta Kate.
    choices:
