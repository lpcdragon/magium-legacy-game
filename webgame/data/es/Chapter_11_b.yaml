              Mientras Hadrik y Arraka están hablando, escucho el sonido de piedras empezando a desmoronarse en algún lugar del lado opuesto de la plaza del mercado. Me doy la vuelta para intentar identificar la fuente del sonido, y me doy cuenta de que las piedras del suelo frente a Rose están todas ligeramente agrietadas. Tengo un presentimiento muy ominoso sobre esto, y antes de que me dé tiempo a pensar las cosas, mi cuerpo se mueve solo y empiezo a correr hacia Rose lo más rápido que puedo.

