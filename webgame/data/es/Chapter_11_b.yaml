    routes:
      - condition: hearing < 4
        texts:
          - source: scene_text
            paragraph: 36
            text: |-
              Mientras Hadrik y Arraka están hablando, escucho el sonido de piedras golpeando contra el suelo en algún lugar del lado opuesto de la plaza del mercado. Al darme la vuelta para identificar la fuente del sonido, me lleva unos segundos procesar completamente la escena que se despliega ante mis ojos.

              Hay un agujero en el suelo, con piedras rotas a su alrededor en el lugar donde escuché el ruido, y Rose está ahí de pie frente a él, con los brazos colgando a los lados y una expresión completamente vacía en su rostro, mientras un esqueleto la abraza con fuerza y lentamente le retuerce un cuchillo oxidado en el corazón. Cuando la luz abandona por completo los ojos de Rose, su atacante presiona más fuerte el cuchillo contra su pecho, haciéndola caer de espaldas, mientras el esqueleto se desmorona en pedazos.

              "¡Rose!" grita Daren, mientras corre hacia ella.

              Cuando la alcanza, Daren empieza a lanzar un hechizo de curación, pero Rose no reacciona de ninguna manera. Todos nos reunimos alrededor de los dos y los observamos sin decir una palabra, mientras Daren sigue lanzando hechizo de curación tras hechizo de curación, mientras Rose mira fijamente a la distancia, sin mover un músculo.

              "¡Rose, quédate conmigo!" grita Daren, mientras sigue lanzando desesperadamente sus hechizos.
          - source: scene_text_2
            paragraph: 27
            text: |-
              No sirve de nada... Estoy seguro de que Daren también se habrá dado cuenta. Rose ya no respira. Dejó de respirar incluso antes de caer al suelo. Está muerta. Después de todo lo que pasamos para llevarla a casa sana y salva. Después de todo lo que ha pasado esta última semana. Murió, así sin más. Y ni siquiera Daren puede traerla de vuelta.

              "No..." dice Kate. "Esto no está bien. ¡Tiene que ser una ilusión! El nigromante nunca podría hacerle daño así. ¡El hechizo del torneo lo habría impedido! Esto tiene que ser una—"

              "El nigromante está muerto," la interrumpe Illuna. "El hechizo del torneo que le impedía hacer daño a Rose desapareció junto con su aura. Esta trampa fue diseñada específicamente para activarse después de su muerte, para burlar los efectos del hechizo de protección. Usó un vacío legal. Esto no es una ilusión. Rose murió, y el nigromante es quien la mató."

              "¡No, no puede ser!" dice Kate, mientras las lágrimas empiezan a brotar de sus ojos. "No puede simplemente morir así. Esto no es justo. ¡No se merecía esto!"

              Kate se detiene unos segundos para frotarse los ojos con las manos, mientras intenta contener las lágrimas.

              "No se merecía esto..." dice Kate de nuevo, esta vez en un tono mucho más bajo.

              "Esto es culpa mía..." dice Daren, mientras finalmente suelta a Rose. "Yo fui quien se ofreció a escoltarla a casa. Yo fui quien prometió que la protegeríamos. Le fallé. Es mi culpa que esté muerta..."
          - source: scene_3
            paragraph: 8
            text: |-
              "¡Eh, para el carro!" dice Hadrik. "No puedes simplemente echarte toda la culpa a ti mismo. Rose sabía muy bien en lo que se metía cuando decidió quedarse con nosotros después de lo que pasó ayer con el noble. Tomó su propia decisión y la mantuvo hasta el final. Murió con honor, y todos deberíamos respetarla por eso."

              "¿¡Qué sabes tú de Rose!?" grita Daren furiosamente, de repente. "¿Crees que quería vivir sus últimos momentos en un estercolero como este? ¿Crees que murió feliz, sabiendo que dejó a sus hermanitos solos para valerse por sí mismos? ¿De verdad crees que todo en el mundo puede medirse por tus valores primitivos? ¿Qué te da el derecho de hablar de Rose así? ¡Dímelo!"
        effects:
