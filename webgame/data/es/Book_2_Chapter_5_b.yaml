        texts:
          - source: scene_text
            paragraph: 47
            text: |-
              "Ya he pilotado máquinas voladoras gnomos antes," digo. "Podría intentarlo."

              "¡Espléndido!" dice Golmyck. "Ven aquí, eh... Barry, ¿verdad? Te enseñaré lo básico."

              "Iré a ayudar a los soldados," dice Daren. "Van a necesitar toda la protección que puedan conseguir si piensan empezar a dispararle al dragón."

              Luego se lanza hacia una de las rejas, para llegar a los niveles superiores, donde ahora mismo están los soldados.

              "Ahora, Barry, escucha atentamente," dice Golmyck, en cuanto llego hasta él. "Estos son los mandos de vuelo."

              Luego señala hacia la cabina.

              "Aquí tienes la palanca de control," continúa Golmyck. "Los pedales del timón están abajo. Solo deberías cambiar la dirección del timón para hacer ajustes menores, y no para girar realmente la aeronave. Los giros deben hacerse solo usando la palanca de control."

              "Sí, ya lo sé," le digo.

              "Esta palanca de aquí," dice Golmyck, señalando una palanca en el lado izquierdo de la cabina, "se usa para ajustar el paso de las palas del rotor. Aumentar el paso te hará ganar altitud, pero disminuirá tu velocidad hacia adelante. Disminuir el paso hará que pierdas altitud. ¿Te resulta familiar todo esto?"

              "Sí," digo. "Es bastante parecido a lo que he pilotado antes. Puedo manejarlo."
          - source: scene_text_2
            paragraph: 21
            text: |-
              "¡Perfecto!" dice Golmyck. "Cuando diseñé estas máquinas, intenté hacer los mandos lo más intuitivos posible para la gente que ya hubiera pilotado otras máquinas gnomos en el pasado. ¡Me alegra ver que mis esfuerzos no fueron en vano!"

              El gnomo mira hacia el dragón atrapado en la jaula dorada, con una expresión pensativa en el rostro.

              "Barry," dice Golmyck, "no sabrás por casualidad cuánto más va a durar esa jaula, ¿verdad?"

              "Eh..." digo. "¿Unos dos minutos más, supongo?..."

              "Bien," dice Golmyck. "Tenemos tiempo de sobra. Sube. Te daré el resto de las instrucciones durante el vuelo. Asegúrate de abrocharte bien. Además, deberías ponerte estas gafas."

              Golmyck me da unas gafas protectoras, que me pongo de inmediato, y luego entro en la cabina, abrochándome. Solo hay dos asientos en la cabina, uno para el artillero y otro para el piloto, espalda con espalda. El gnomo también entra en la cabina, se sienta en la silla detrás de mí y se abrocha.
