  - name: b2_ch05b_barrier
    routes:
      - condition: b2_ch5_pilot = 1
        texts:
          - source: scene_text
            paragraph: 51
            text: |-
              "Esta aeronave usa tecnología lessathi," dice Golmyck, "para proporcionarnos una protección bastante eficaz contra ataques de fuego. Por supuesto, eso no nos hace invulnerables, y no estoy seguro de cuánto tiempo podrán resistir los escudos contra llamas tan calientes como las del dragón, así que deberíamos intentar esquivar su aliento de fuego tanto como nos sea posible."

              A medida que alcanzamos una altitud suficientemente alta, la jaula dorada que rodea al dragón empieza a desvanecerse lentamente.

              "Prepárate," me dice el gnomo.

              En cuanto la jaula desaparece, todas las bolas de fuego de Flower explotan al mismo tiempo, enviando una ráfaga de viento muy poderosa hacia nosotros, y los conos de hielo de Kate también son lanzados contra el dragón poco después. Las protecciones que Tyrath se lanzó durante todo este tiempo le ayudan a sobrevivir al daño, pero está claro que no salió de aquello intacto. Es más, la cantidad de daño que tuvo que absorber con sus escudos mágicos también parece haber drenado por el momento su energía mágica, porque ya no está usando teletransporte para moverse y ha vuelto a usar sus alas para volar.
          - source: scene_text_2
            paragraph: 25
            text: |-
              Casi en cuanto logra alejarse de todas las explosiones, el dragón usa su aliento de fuego para atacar a Kate. Sin embargo, estaba bastante lejos de ella cuando atacó, lo que le dio a Kate el tiempo suficiente para mover su jaula de hielo fuera del camino antes de que las llamas la alcanzaran. Tyrath intenta ahora lanzarse en picado hacia ella, pero antes de llegar a su objetivo, los soldados del rey activan al unísono sus extrañas armas y liberan un rayo muy poderoso que le da de lleno. Visiblemente irritado, el dragón empieza a hacer llover llamas sobre ellos, intentando eliminarlos a todos de una sola vez. Por suerte, Daren ya había llegado a la zona de espectadores hace un rato, y en cuanto ve las llamas, usa su escudo para crear una gran barrera semitransparente, que protege a todos los soldados del ataque de fuego.

              Creo que por fin estoy empezando a entender cómo escupe fuego el dragón. Parece que necesita inhalar una gran cantidad de aire en sus pulmones antes de atacar, y además nunca exhala el fuego inmediatamente después. Supongo que esto se debe a que primero necesita encenderlo antes de expulsarlo. Eso significa que, mientras prestes atención a su respiración, deberías poder darte cuenta de cuándo va a atacarte con fuego, y tendrás todo el tiempo que necesites para esquivar sus llamas, si eres lo bastante rápido.
          - source: scene_3
            paragraph: 3
            text: |-
              Esta información me va a ayudar muchísimo mientras piloteo la aeronave, porque no creo que tuviera tiempo de maniobrar para apartarme de otro modo.

              Tyrath parece haber cambiado de idea otra vez, y ahora está persiguiendo a Hadrik, que en este momento está en su forma de águila. Incluso con la velocidad de Hadrik, todavía parece que el dragón va a alcanzarlo pronto. Quizás ahora sería un buen momento para usar esas balas recubiertas de ácido.
        choices:
          - position: 1
            text: Atacar al dragón
            effects:
              - set:
                  current_scene: b2_ch05b_pilot
          - position: 2
            text: Esperar un mejor momento para atacar
            effects:
              - set:
                  current_scene: b2_ch05b_death
      - condition: b2_ch5_pilot = 0
        texts:
          - source: scene_text
            paragraph: 52
            text: "\"This aircraft is using lessathi technology,\" Golmyck says, \"to provide us with some rather effective shielding against fire attacks. Of course, this does not make us invulnerable, and I'm not sure how long the shields can hold against flames that are as hot as the dragon's, so we should try evading his fire breath as much as possible.\"\r\n\r\nAs we reach a high enough level of altitude, the golden cage surrounding the dragon is slowly starting to fade.\r\n\r\n\"Get ready,\" the gnome tells me.\r\n\r\nAs soon as the cage disappears, all of Flower's fireballs explode at the same time, sending a very powerful gust of wind towards us, and Kate's ice cones also get launched into the dragon soon afterwards. The protections that Tyrath cast on himself during all this time help him to survive the damage, but it's clear that he didn't get out of that unscathed. What's more, the amount of damage that he needed to absorb with his magical shields also seems to have drained him of his magical energy for the time being, because he is no longer using teleportation to move around and has gone back to using his wings to fly."
          - source: scene_text_2
            paragraph: 26
            text: |-
              Casi en cuanto logra alejarse de todas las explosiones, el dragón usa su aliento de fuego para atacar a Kate. Sin embargo, estaba bastante lejos de ella cuando atacó, lo que le dio a Kate el tiempo suficiente para mover su jaula de hielo fuera del camino antes de que las llamas la alcanzaran. Tyrath intenta ahora lanzarse en picado hacia ella, pero antes de llegar a su objetivo, los soldados del rey activan al unísono sus extrañas armas y liberan un rayo muy poderoso que le da de lleno. Visiblemente irritado, el dragón empieza a hacer llover llamas sobre ellos, intentando eliminarlos a todos de una sola vez. Por suerte, Daren ya había llegado a la zona de espectadores hace un rato, y en cuanto ve las llamas, usa su escudo para crear una gran barrera semitransparente, que protege a todos los soldados del ataque de fuego.

              Creo que por fin estoy empezando a entender cómo escupe fuego el dragón. Parece que necesita inhalar una gran cantidad de aire en sus pulmones antes de atacar, y además nunca exhala el fuego inmediatamente después. Supongo que esto se debe a que primero necesita encenderlo antes de expulsarlo. Eso significa que, mientras prestes atención a su respiración, deberías poder darte cuenta de cuándo va a atacarte con fuego, y tendrás todo el tiempo que necesites para esquivar sus llamas, si eres lo bastante rápido.

              "Oye," le digo a Golmyck. "Creo que acabo de descubrir una de las debilidades del dragón. Siempre necesita inhalar mucho aire en sus pulmones antes de poder usar un ataque de fuego. También necesita esperar uno o dos segundos a que el fuego se encienda antes de poder escupirlo. Mientras prestes atención a su respiración, deberías poder anticipar cuándo va a dispararte fuego."
          - source: scene_3
            paragraph: 4
            text: |-
              "Bien visto," dice Golmyck. "Sin duda lo tendré en cuenta mientras piloteo la aeronave."

              Tyrath parece haber cambiado de idea otra vez, y ahora está persiguiendo a Hadrik, que en este momento está en su forma de águila. Incluso con la velocidad de Hadrik, todavía parece que el dragón va a alcanzarlo pronto. Quizás ahora sería un buen momento para usar esas balas recubiertas de ácido.
        choices:
          - position: 1
            text: Atacar al dragón
            effects:
              - set:
                  current_scene: b2_ch05b_gunner
          - position: 2
            text: Esperar un mejor momento para atacar
            effects:
              - set:
                  current_scene: b2_ch05b_death
  - name: b2_ch05b_death
    routes:
      - condition: b2_ch5_pilot = 1
        texts:
          - source: scene_text
            paragraph: 53
            text: |-
              Sigo observando a Tyrath mientras persigue a Hadrik, esperando un mejor momento para atacar. Mientras los veo volar, ambos acaban empezando a dirigirse hacia nosotros, y cuando el dragón me nota, se detiene en seco, mirándome con furia.

              "¿Te estás burlando de mí, medio lessathi?" grita Tyrath. "¿Crees que usar un juguete volador será suficiente para derrotarme? ¡Ya he tenido bastante de tu insolencia! Si no vas a activar tus poderes, que así sea. No pienso perder más tiempo por alguien como tú."

              El dragón inhala entonces todo el aire que puede en sus pulmones, preparándose para lanzarnos su fuego.

              Anticipo su ataque, y empujo rápidamente la palanca de control hacia adelante para lanzarnos en picado y esquivar las llamas que se acercan. El aliento de fuego nos falla por bastante margen, pero el dragón ya está detrás de nosotros, y nos está alcanzando.

              Maldición, muévete más rápido, pedazo de máquina estúpida. ¡Muévete más rápido!

              Giro bruscamente hacia la izquierda, intentando quitarme al dragón de encima, pero él cambia de dirección con facilidad y nos alcanza en cuestión de segundos. Tyrath se lanza entonces directamente hacia nuestra cabina, me agarra con las garras traseras, me aplasta entre ellas, y me mata en el acto.
