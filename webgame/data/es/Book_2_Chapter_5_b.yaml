        paragraph: 60
        text: |-
          "Me temo que no puedo permitirte hacer eso, rey de todos los dragones," dice Eiden, que apareció otra vez de la nada y ahora está flotando justo delante del dragón, con los ojos cerrados, como de costumbre.

          "Eiden..." dice Tyrath, con un tono ligeramente irritado.

          "Verás, si hubieras seguido peleando en tu otra forma, la más débil," dice Eiden, "podría haberme sentido tentado a seguir ignorando tu flagrante violación de nuestro pacto, pero ahora has llevado las cosas hasta un punto en el que ni siquiera yo puedo seguir dejando esto pasar por alto..."

          "¿De qué tonterías estás hablando?" dice Tyrath. "¿Qué pacto?"

          "Pues del pacto que tú, yo y el zorro dorado firmamos hace varios cientos de años, por supuesto," dice Eiden. "¿Ya lo olvidaste? Según el pacto, ninguno de los tres puede atacar directamente a los seguidores de los otros. Esto es para evitar que estalle una pelea entre cualquiera de las tres partes firmantes, porque una pelea entre cualquiera de dos de nosotros tendría el potencial de destruir toda la isla antes de llegar a su conclusión, y ninguno querría eso. Por lo tanto, todos y cada uno de los conflictos entre nosotros tres deben resolverse indirectamente a través de nuestros seguidores, y no por ningún medio directo, en absoluto."
      - source: scene_text_2
        paragraph: 32
        text: |-
          "Ridículo," dice Tyrath. "Ese viejo pacto perdió su sentido hace mucho tiempo. La única razón por la que firmamos el pacto en primer lugar fue porque nuestros poderes solían ser comparables. Eso dejó de ser cierto hace más de cien años. Desde que abandonaste el continente, no has hecho más que debilitarte, y ahora no eres más que una carcasa vacía de lo que fuiste. Si no recurrieras siempre a trucos mezquinos, te habría matado hace un siglo. Ya no eres una amenaza, stillwater, y por tanto nuestro pacto ya no tiene validez."

          "¿Ah, sí?" pregunta Eiden, con una amplia sonrisa. "¡Entonces declaremos un nuevo pacto!"

          De repente, el aire que nos rodea empieza a sentirse como si pesara sobre nuestros hombros, y el mundo mismo parece estar temblando. Es casi como si ahora hubiera un terremoto en medio del aire, en vez de en la tierra de abajo, y el cielo azul parece listo para resquebrajarse en cualquier momento bajo la presión. Me doy cuenta enseguida de que esto es el resultado directo de que Eiden haya liberado su aura mágica, y que puede muy bien que esto ni siquiera sea la verdadera magnitud de su poder.

          "Vaya, vaya," oigo a Arraka hablar desde algún lugar detrás de nosotros. "Veo que Eiden por fin ha decidido ponerse un poquito serio."

          "¿Un poquito?" le grita Illuna, incrédula.

          "Nunca llegamos a ponerle nombre a nuestro viejo pacto," le dice Eiden a Tyrath, "pero podríamos llamar a este nuevo 'El pacto del regreso del Creador'. ¿Qué dices, viejo amigo? ¿Nos bastarán las palabras esta vez, o quieres que traiga papel y pluma?"
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch05b_rejoice
  - name: b2_ch05b_rejoice
    texts:
      - source: scene_text
        paragraph: 61
        text: |-
          Tyrath mira a Eiden durante un rato, evaluándolo de arriba abajo, con una expresión pensativa en el rostro.

          "Quizá me equivocaba," dice Tyrath. "Quizá tus viajes no te han debilitado tanto como me habría gustado creer..."

          Hace una pausa.

          "No tengo intención de destruir todo el continente mientras peleo contigo, stillwater," dice Tyrath. "Honraré el pacto, y no volveré a interferir. Pero debes saber que mi propósito sigue intacto. Si no puedo destruir todas las ciudades humanas yo mismo, entonces mis ejércitos tendrán que hacerlo por mí. No descansaré hasta que todas y cada una de estas ciudades hayan sido reducidas a cenizas, ya me lleve semanas o años conseguirlo. La próxima vez que me veas será después de que haya destruido todo lo que una vez amaste y apreciaste en este mundo maldito. Recuérdalo."

          Cuando Tyrath se vuelve para marcharse, Eiden lo llama una última vez.

          "Ah, olvidé mencionarlo," dice Eiden, con una sonrisa educada. "Los magos que se han unido al torneo también serán clasificados temporalmente como seguidores míos bajo los términos de nuestro pacto. Después de todo, son nuestros estimados invitados. Por lo tanto, no debes hacer daño a ninguno de ellos hasta que termine el torneo, a menos, por supuesto, que te ataquen primero."

          "Humph," dice Tyrath. "Lo tendré en cuenta."
      - source: scene_text_2
        paragraph: 33
        text: |-
          El dragón asciende entonces más alto en el cielo, y se aleja volando en la misma dirección de la que vino cuando nos atacó por primera vez.

          "Adiós, rey de todos los dragones," dice Eiden, mientras el dragón se marcha.

          "¡Eiden!" oímos la voz de una chica viniendo desde uno de los lados vacíos de los asientos de los espectadores. "¡Eh, Eiden, me oyes?"

          Miro hacia el coliseo, y veo que hay una chica joven de unos dieciocho o diecinueve años, completamente sola en medio de los asientos vacíos, y lleva un rato gritando el nombre de Eiden.

          "¡Maldición!" dice la chica. "¡Ni se te ocurra ignorarme!"

          Eiden hace un gesto aburrido con la mano en dirección general a la chica, y de repente ninguna de las palabras que está diciendo llega hasta nosotros, aunque ella no parece haberse dado cuenta y todavía aparenta estar gritando más fuerte que nunca. ¿Eiden acaba de lanzar un hechizo de silencio?

          Eiden se vuelve entonces hacia los soldados del ejército del rey, que lo están mirando como si hubieran visto un fantasma. La sonrisa de Eiden se ensancha cuando los ve, y decide darles un último mensaje antes de irse.

          "Bueno, ¿qué hacen ahí parados?" les pregunta Eiden a los soldados. "Vayan, difundan la noticia. Difúndanla por todas partes. ¡Regocíjense, porque su Creador por fin ha regresado!"
      - source: scene_3
        paragraph: 7
        text: |-
          Entonces desaparece una vez más, dejando a los soldados igual de confundidos que antes.

          "Creo que ya es hora de que volvamos a descender al área de combate, Barry," dice Golmyck. "Nuestro trabajo aquí ha terminado."
    choices:
      - position: 1
        text: Preguntarle a Arraka si Eiden sigue escondido por aquí, de forma invisible
        effects:
          - set:
              current_scene: b2_ch05b_invisibly
      - position: 2
        text: No preguntarle nada a Arraka
        effects:
          - set:
