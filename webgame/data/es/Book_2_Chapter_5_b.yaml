              Señala hacia una pequeña torreta situada en la base de la cola de la máquina.

              "Puedes girarla a izquierda y derecha usando estas empuñaduras," continúa Golmyck. "También puedes tirar de las mismas empuñaduras para mover la torreta hacia arriba y hacia abajo. El gatillo está aquí. El mecanismo es algo parecido al de los cañones normales que se usan en los barcos, salvo que esta torreta se carga mágicamente sola con balas y pólvora negra, así que solo tienes que preocuparte por apuntar y disparar. Intenta usar estas balas con moderación, eso sí. Nuestra munición no es ilimitada."

              "Eh..." digo. "Puede que esté diciendo lo obvio, pero te das cuenta de que las balas normales no van a funcionar contra este dragón, ¿verdad?"
          - source: scene_text_2
            paragraph: 22
            text: |-
              "Claro, claro," dice Golmyck. "Por eso no vamos a usar balas normales. Las balas que he cargado en esta torreta están hechas de un metal altamente resistente al ácido, y todas han sido recubiertas con ácido, al que sabemos con certeza que el dragón es débil. Llevábamos tiempo preparando esto, ya que Tyrath ha sido una amenaza latente desde hace bastante tiempo. Obviamente, incluso con el recubrimiento de ácido, las balas probablemente solo lo incomoden de forma moderada, pero no pasa nada, porque solo están pensadas para distraerlo."

              El gnomo mira hacia el dragón atrapado en la jaula dorada, con una expresión pensativa en el rostro.

