    texts:
      - source: scene_text
        paragraph: 37
        text: |-
          "¿Qué calibre ni qué?" grita furioso el embajador. "¡No son más que un puñado de campesinos! ¿Creen que pelear contra ellos no vale el riesgo? ¡Pues haré que valga la pena! Puedo darles dinero más allá de sus sueños más salvajes. ¡No tendrán que volver a trabajar ni un solo día de sus vidas! Si se unen a esta pelea, los liberaré a todos y les daré un estatus lo bastante alto como para que nunca vuelvan a correr el riesgo de tener que pelear en un lugar como este. ¡Solo díganme qué quieren, y se los daré! ¡Todo lo que tienen que hacer es pelear! ¡Peleen, maldita sea!"

          Todos los gladiadores se miran entre sí, con una expresión incómoda en los ojos, pero no parece que ninguno esté considerando seriamente aceptar la oferta del embajador.

          "¿Qué les pasa?" grita el embajador, con la cara roja de ira. "¿No tienen ambiciones? ¿No tienen metas? ¿Qué hará falta para que peleen contra ellos? ¿Qué hará falta? ¡Díganmelo, miserables excusas de seres humanos! ¿Qué quieren? ¡Díganmelo! ¡Digan--"

          Las últimas palabras del embajador quedan ahogadas por unos cuantos cuernos muy fuertes que parecen estar sonando al unísono desde distintos lados de la ciudad. La multitud empieza a entrar en pánico. Parece que todos saben algo que nosotros no. Sea lo que sea que esos cuernos se suponía que debían señalar, definitivamente no me gusta cómo suena esto.
      - source: scene_text_2
        paragraph: 14
        text: |-
          "Oh, no..." dice el presentador, intentando mantener la calma. "¿Podrían los espectadores evacuar la arena de forma calmada y ordenada, por favor? El espectáculo ha sido cancelado. Repito. ¡El espectáculo ha sido cancelado!"

          Los espectadores ahora corren en masa hacia las salidas del coliseo, y aunque desde luego no me parecen muy calmados ni ordenados, al menos no se están tirando unos a otros al suelo, así que todavía les queda algo de autocontrol, a pesar del pánico.

          Ahora que ha terminado con los espectadores, el presentador se vuelve hacia nosotros.

          "Gladiadores," dice. "Me temo que voy a tener que pedirles que se unan temporalmente a las fuerzas de nuestro ejército hasta que se resuelva nuestra crisis actual. Según las leyes de Thilias, durante un estado de emergencia que afecta a toda la ciudad, los gladiadores deben ser usados como recursos del reino hasta que se declare oficialmente el fin del estado de emergencia."
