    texts:
      - source: scene_text
        paragraph: 41
        text: |-
          "¡Eh, Tyrath!" oímos la voz de Arraka viniendo desde nuestra izquierda. "¡Cuánto tiempo sin verte! ¿Te acuerdas de mí? ¡Soy tu vieja amiga, Arraka!"

          Flower está saltando ahora desde los asientos de los espectadores, usando chorros de fuego que salen de sus pies para frenar la caída. Luego corre para unirse al resto de nosotros en el centro de la arena.

          "Arraka..." dice Tyrath, apartando la vista de mí para mirar hacia su amuleto.

          "¿Soy yo o te hiciste un nuevo cambio de imagen?" le pregunta Arraka al dragón. "¿Qué pasó con tus escamas de lava fundida? ¿Dónde está esa aura ígnea intimidante que solías tener? Espera, ¿es porque te hiciste viejo? ¡Aja- AHAHAHAHA! Ya ves cuánto vale ser todopoderoso, ¿eh? ¡Apuesto a que debes odiarte muchísimo por haberte convertido en un debilucho!"

          "¿Cómo rompiste el sello?" le pregunta Tyrath.

          "¿Te refieres al sello de la cueva?" pregunta Arraka. "¿En serio? ¿Nunca llegaste a enterarte de que escapé? ¿Cómo te las arreglaste para no notar siquiera el invierno inmóvil? ¿Estabas hibernando o qué? ¡Vaya si tengo historias que contarte!"
      - source: scene_text_2
        paragraph: 16
        text: |-
          "El sello," dice otra vez Tyrath. "¿Cómo lo rompiste?"

          "Oh, esa cosa vieja ya había empezado a agrietarse después de los primeros mil años o así," dice Arraka. "En cuanto tuvo suficientes grietas, lo único que tuve que hacer fue esperar a que alguien entrara en la cueva, y ¡PUM! Me apoderé de su cuerpo. O al menos lo intenté. Al final terminamos teniendo que compartirlo. Pero en serio, ¿qué pensabas que iba a pasar? Tuviste que aliarte con todos esos lessathi y magos solo para tener alguna oportunidad contra mí, ¿y pensaste que tu sello mediocre me retendría allí para siempre? ¡No me hagas reír! La única razón por la que lograste vencerme fue porque acababa de ser expulsada del plano mágico, y en ese momento no conocía realmente los entresijos de este mundo. Si tuviéramos una revancha ahora, te obliteraría."

          "¿Me obliterarías desde dentro de tu amuleto?" dice Tyrath.

          "Oye, tú rómpeme este amuleto y podemos tener esa revancha ahora mismo, si quieres," dice Arraka.

          "Puedes quedarte ahí y pudrirte," dice Tyrath. "No vine aquí por ti. Vine aquí para cobrarme una venganza y demostrarle a un insecto insignificante lo desesperadamente inútil que es oponerse a mí."
    choices:
      - position: 1
        text: Espera, ¿estás hablando de mí?
        effects:
          - set:
              current_scene: b2_ch05b_talking
