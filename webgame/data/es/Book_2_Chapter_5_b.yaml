  - name: b2_ch05b_cargo
    routes:
      - condition: b2_ch5_pilot = 1
        texts:
          - source: scene_text
            paragraph: 49
            text: |-
              "Así que, eh..." digo, al ver al gnomo ajustando la torreta que está situada en la base de la cola de la máquina. "Puede que esté diciendo lo obvio, pero te das cuenta de que las balas normales no van a funcionar contra este dragón, ¿verdad?"

              "Claro, claro," dice Golmyck. "Por eso no vamos a usar balas normales. Las balas que he cargado en esta torreta están hechas de un metal altamente resistente al ácido, y todas han sido recubiertas con ácido, al que sabemos con certeza que el dragón es débil. Llevábamos tiempo preparando esto, ya que Tyrath ha sido una amenaza latente desde hace bastante tiempo. Obviamente, incluso con el recubrimiento de ácido, las balas probablemente solo lo incomoden de forma moderada, pero no pasa nada, porque solo están pensadas para distraerlo."

              Luego el gnomo señala un botón en mi panel de control.

              "Por cierto, tú también tienes tu propio armamento," dice Golmyck. "Solo pulsa ese botón, y las balas se dispararán solas. Tanto el cañón frontal como la torreta funcionan con un mecanismo parecido al de los cañones que se usan en los barcos, salvo por el hecho de que se cargan mágicamente solos con pólvora negra y balas, así que solo tienes que preocuparte por apuntar y disparar. Intenta usar estas balas con moderación, eso sí. Nuestra munición no es ilimitada, y estas balas cuestan mucho de fabricar."

              En cuanto ambos estamos listos para despegar, el gnomo hace una seña a un elementalista del aire cercano, y este lanza un hechizo sobre la hélice de la máquina para hacerla girar.
          - source: scene_text_2
            paragraph: 23
            text: |-
              Tiro de la palanca a mi izquierda para aumentar el paso, y la máquina voladora empieza a ganar altitud lentamente.

              "Así que antes estabas diciendo que las balas solo son una distracción," digo, bastante alto para compensar el sonido de la hélice. "¿Qué querías decir con eso?"

              "Oh, el verdadero propósito de esta máquina no es derribar al dragón," dice Golmyck. "Lo que de hecho pretendemos hacer es conseguir colocarnos por encima de él, y luego dejar caer sobre él una cuerda giratoria."

              "¿Una cuerda giratoria?" pregunto, confundido.

              "Sí," dice el gnomo. "Nuestros encantadores diseñaron una cuerda mágica que está hecha para desenrollarse por sí sola y luego empezar a girar una vez que la soltamos desde nuestro pequeño compartimento de carga de abajo. La cuerda ha sido encantada para ser casi irrompible, y es lo bastante larga como para atar las alas del dragón e impedir que vuele. El único problema es que el dragón tendrá que quedarse flotando en un mismo sitio durante bastante tiempo y no estar prestándonos atención para que este plan funcione. No podemos hacerlo después de que desaparezca la jaula, porque habrá demasiadas explosiones y el dragón intentará largarse de allí lo antes posible. Solo tenemos un compartimento de carga y una sola cuerda, así que no podemos permitirnos fallar. No deberíamos usarla a menos que estemos completamente seguros de que nuestro plan va a funcionar. Hasta entonces, solo usaremos balas para atacarlo, con el fin de dar apoyo a tus amigos y a mis soldados, que estarán atacando al dragón al mismo tiempo."

              "¿Y qué pasa si el dragón empieza a lanzarnos fuego?" digo.
