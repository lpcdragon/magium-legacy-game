scenes:
  - name: b2_ch05b_similar
    texts:
      - source: scene_text
        paragraph: 2
        text: |-
          "Recuerdo que dijiste algo parecido antes de nuestra batalla contra el trol..." escribe Leila.

          "Sí, pero ahora es diferente," digo. "El trol está muerto. Las criaturas también. No veo qué otro truco podrían sacarse de la manga a estas alturas del juego."

          "¿De verdad?" escribe Leila. "¿No ves ninguna manera en la que los organizadores podrían garantizar tu muerte en la próxima ronda?"

          "Ni una sola," le digo.

          "Muy bien, entonces," escribe Leila, simplemente.

          Unos minutos después, el presentador recibe una lista escrita de un miembro del equipo organizador, y después de echarle un vistazo durante unos segundos, empieza a leerla en voz alta.

          "Ahora voy a anunciar los nombres de los gladiadores que pelearán en el primer duelo," dice el presentador. "Esta será una pelea a muerte. Los gladiadores deberán combatir hasta que solo uno de ellos quede con vida. No se permite la rendición."

          "Prepárate," me escribe Leila.

          "¿Prepararme para qué?" le pregunto.

          "Los nombres de los gladiadores son--" dice el presentador, mientras se prepara para leer la primera línea del pergamino.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch05b_disarmed
  - name: b2_ch05b_disarmed
    texts:
      - source: scene_text
        paragraph: 3
        text: |-
          "--Barry y Daren," continúa el presentador.

          "Oh," le digo a Leila.

          La reja de hierro frente a mí se levanta, y también lo hace la de la división de Daren.

          "¿Podrían los dos gladiadores cuyos nombres acaban de ser llamados entrar al área de combate, por favor?" dice el presentador, con voz aburrida. "Gracias."

          "Oh..." le digo otra vez a Leila, sin saber qué más decir en este punto.

          "Buena suerte..." escribe Leila, con una expresión seria en la cara, mientras lentamente salgo de mi área de división y entro a la arena.

          Bien, cálmate, no hay necesidad de entrar en pánico. He superado todos los obstáculos que se han cruzado en mi camino hasta ahora. No hay razón para que esto sea diferente. Así que no hay razón para entrar en pánico, ¿de acuerdo? Ninguna razón. Solo necesito calmarme. Nada de pánico. Nada de pánico...

          Mientras estoy ocupado pensando para mis adentros, Daren también avanza lentamente hacia mí, solo que él parece inusualmente tranquilo con todo esto. ¿Por qué? ¿Será porque sabe que puede vencerme? No, no, esa no puede ser la razón. ¿Será que ya consiguió encontrar la forma de salir de este lío? ¿Qué es exactamente lo que planea hacer? ¡Maldición, estoy seguro de que yo también podría idear un plan, si tan solo lograra calmarme!

          Una vez que Daren y yo llegamos al centro de la arena, frente a frente, Daren me dedica una amplia sonrisa, deja su espada y su escudo en el suelo, y luego alza las manos en el aire.
      - source: scene_text_2
        paragraph: 3
        text: |-
          "¡Me rindo!" grita Daren, tan fuerte como puede. "No puedo pelear contra este hombre. ¿Cómo podría?"

          "Esta pelea es a muerte, sanador," dice el presentador. "Aunque este hombre sea tu amigo--"

          "¡Quiero decir, mira esos músculos!" grita Daren, interrumpiendo al presentador. "¡Ningún hombre cuerdo se atrevería jamás a pelear contra semejante bestia!"

          De repente todos los espectadores en la multitud estallan en carcajadas.

          "¡Esos brazos parecen capaces de aplastarme la cabeza como una sandía entre sus propias manos!" continúa Daren, con una sonrisa burlona. "¡Y miren el tamaño de su espalda! ¡Que los dioses se apiaden de mi alma!"

          Ríete todo lo que quieras, Daren...

          Aun así, tengo que reconocerle el mérito. La idea de rendirse fue genial. Genial, y sin embargo tan obvia. ¿Cómo no se me ocurrió a mí?

          Mientras la multitud todavía se ríe, el embajador de Ollendor entra al área de combate por una de las rejas de hierro, y se dirige hacia nosotros.

          "¿Qué significa esto?" grita el embajador, y la multitud va quedándose en silencio poco a poco. "¿Por qué no están peleando? ¡Esto es una pelea a muerte! ¡No pueden simplemente rendirse!"
      - source: scene_3
        paragraph: 2
        text: |-
          "Bueno, ¿y qué va a hacer al respecto?" le dice Daren, con una sonrisa torcida, cuando llega hasta nosotros.

          El rostro del embajador se pone rojo de rabia, y luego me mira.

          "¡Tú!" dice. "¡Campesino! Tu oponente está desarmado. ¡Acaba con él ahora, o atente a las consecuencias!"
    choices:
      - position: 1
        text: ¿A quién llamas campesino? ¡Campesino!
        effects:
          - set:
              current_scene: b2_ch05b_peasant
      - position: 2
        text: ¿Te encuentras bien? Tienes toda la cara roja. Quizás deberíamos llamar a un doctor.
        effects:
          - set:
              current_scene: b2_ch05b_doctor
      - position: 3
        text: Acabar con Daren
        effects:
          - set:
              current_scene: b2_ch05b_finish
  - name: b2_ch05b_peasant
    texts:
      - source: scene_text
        paragraph: 4
        text: |-
          "¿A quién llamas campesino? ¡Campesino!"

          Mientras hablo, uso un tono de voz lo bastante alto para asegurarme de que los espectadores puedan oírme.

          "¡Yo no soy el campesino, escoria de baja cuna!" grita el embajador. "¡Tú eres el campesino!"

          "No, tú eres el campesino," le digo.

          "¡¡¡Tú eres el campesino!!!" grita el embajador, con la cara aún más roja que antes.

          Los espectadores ya no pueden contenerse por más tiempo, y todos empiezan a reírse al unísono.

          "Oye, Daren," digo. "Creo que por fin encontré a alguien que es todavía más fácil de molestar que Flower."

          "¿Te estás burlando de mí?" dice el embajador.

          "Claro que se está burlando de ti," dice Daren. "En serio, ¿qué esperabas? ¿De verdad pensabas que podías venir aquí y convencernos de matarnos entre nosotros solo por gritarnos un poco?"
      - source: scene_text_2
        paragraph: 4
        text: |-
          "¡Si no se matan entre ustedes, haré que los ejecuten a los dos!" grita el embajador.

          "No, no lo hará," dice Daren, en voz alta, para que todos puedan oírlo. "No existe ninguna regla estándar de la arena que diga que tenemos que matarnos entre nosotros. Solo rompimos una de las reglas de este evento. Eso significa que no puede ejecutarnos. Solo puede convertirnos en indeseables y obligarnos a participar en la ronda de penalización. Esas son las reglas."

          "¡No me importan las reglas!" grita el embajador. "¡Yo hago las reglas! ¡Harán lo que yo diga, o ambos van a morir!"

          Después del último arrebato del embajador, se oye un fuerte murmullo proveniente de los asientos de los espectadores. El embajador no se da cuenta, y continúa con su diatriba.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch05b_shunned
  - name: b2_ch05b_doctor
    texts:
      - source: scene_text
        paragraph: 5
        text: |-
          "¿Te encuentras bien? Tienes toda la cara roja. Quizás deberíamos llamar a un doctor."

          Mientras hablo, uso un tono de voz lo bastante alto para asegurarme de que los espectadores puedan oírme.

          "¡No necesito un doctor!" grita el embajador. "¡Necesito que mates a este hombre, ahora! ¡En este mismo instante!"

          "¿Qué instante?" le pregunto.

          "¡Este instante!" grita el embajador.

          "¿Te refieres a este instante ahora mismo, o al de cuando estabas hablando hace un momento?" le pregunto. "Porque si necesitas que lo mate en el pasado, ¡puede que primero tenga que aprender algo de magia temporal!"

          Los espectadores ya no pueden contenerse por más tiempo, y todos empiezan a reírse al unísono.

          "¿Te estás burlando de mí?" dice el embajador.

          "Claro que se está burlando de ti," dice Daren. "En serio, ¿qué esperabas? ¿De verdad pensabas que podías venir aquí y convencernos de matarnos entre nosotros solo por gritarnos un poco?"
