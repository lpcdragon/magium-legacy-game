              "¡Gracias a los dioses que todos siguen vivos!" dice Rose. "Cuando vi al dragón, intenté volver de inmediato a la arena, ¡pero no me dejaron entrar otra vez! Todo lo que pude hacer fue observar desde aquí fuera a Kate, Hadrik, Flower y ese avión peleando contra el dragón en el cielo, pero no tenía idea de qué había pasado con Barry y Daren, o siquiera de si seguían vivos."

              "Eh... ¿disculpe, señor?" oímos a la joven de antes, llamando a Daren desde detrás de nosotros.

              "Pues, lo creas o no," le dice Daren a Rose, ignorando a la chica que tiene detrás, "los que iban pilotando ese avión eran nada menos que Barry y el rey."

              "Ehmm, ¿señor?..." vuelve a preguntar la joven, pero nadie le presta atención.

              "¿El rey?" le pregunta Rose a Daren, conmocionada.

              "Sí, yo tampoco podía creer lo que veía," dice Daren. "Creo que poco a poco estoy empezando a entender por qué este tipo fue elegido como vuestro rey por una mayoría tan aplastante."
