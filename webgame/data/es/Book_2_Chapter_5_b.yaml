        texts:
          - source: scene_text
            paragraph: 35
            text: |-
              "Muy bien," dice el presentador. "Ya que estamos, ¿hay alguien más que quiera unirse al lado de los indeseables?"

              Los gladiadores guardan silencio, y parece que nadie más planea unirse a nosotros.

              "¡Bien!" dice el presentador. "Entonces ya es hora de que pongamos en marcha esta ronda, ¿no creen? Voluntarios, den un paso al frente para que puedan unirse a esta ronda opcional."

              Uno de los gladiadores empieza a avanzar, pero otro lo agarra por detrás y lo tira hacia atrás.

              "¿Tienes deseos de morir?" dice el gladiador de atrás. "¿No ves contra quiénes te enfrentas? ¡Ese enano pulverizó la mitad de las manticoras y de los escorpiones él solo! ¡Y ese sanador con armadura prácticamente peleó solo contra todos los monstruos también, y ni siquiera tiene un rasguño! ¡Tendrías que estar loco para querer pelear contra ellos!"

              Al oír el discurso del gladiador, los pocos guerreros que estaban pensando en unirse a la ronda final empiezan ahora a pensárselo mejor.
          - source: scene_text_2
            paragraph: 13
            text: |-
              "¿De verdad?" pregunta el presentador, conmocionado, al ver que ninguno de los gladiadores se ofrece a pelear. "¿Nadie? ¿Se dan cuenta de lo que pueden ganar si matan a cualquiera de esos guerreros que tienen delante? ¡Pueden quedar libres así de fácil, o ser colmados de riquezas!"

              "Mejor pobre que muerto," dice uno de los gladiadores, mientras muchos de los demás asienten en señal de acuerdo.

              "¿Qué creen todos que están haciendo?" grita furioso el embajador, mientras vuelve corriendo al área de combate. "¿Por qué no están peleando contra ellos? ¡Son docenas! ¡Docenas!"

              "Los números no significan nada cuando te enfrentas a enemigos de ese calibre," dice uno de los gladiadores.
