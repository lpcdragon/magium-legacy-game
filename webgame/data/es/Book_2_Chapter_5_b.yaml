              "Bien," dice Golmyck. "Tenemos tiempo de sobra. Sube. Te daré el resto de las instrucciones durante el vuelo. Asegúrate de abrocharte bien. Además, deberías ponerte estas gafas."

              Golmyck me da unas gafas protectoras, que me pongo de inmediato, y luego entro en la cabina, abrochándome. Solo hay dos asientos en la cabina, uno para el artillero y otro para el piloto, espalda con espalda. El gnomo también entra en la cabina, se sienta en la silla detrás de mí y se abrocha.
