  - name: b2_ch05b_mercy
    texts:
      - source: scene_text
        paragraph: 30
        text: |-
          "¡Espera!" grita el gladiador, de repente. "¡Me rindo!"

          "Esta es una pelea a muerte, guerrero," dice el presentador, con frialdad. "No se permite la rendición."

          "Por favor..." dice el gladiador, con voz suplicante, mirándome directamente. "Ten piedad... ¡No quiero morir! ¡Por favor!"

          "¡Mátalo! ¡Mátalo! ¡Mátalo!" empieza a corear la multitud, al unísono.

          Los cánticos no dejan de hacerse más fuertes, mientras yo sigo ahí de pie, con la hoja en la garganta del guerrero, pensando qué hacer.
    choices:
      - position: 1
        text: Matarlo
        effects:
          - set:
              current_scene: b2_ch05b_spare
              b2_ch5_spare: 0
      - position: 2
        text: Apuñalarlo en la pierna derecha, pero perdonarle la vida
        effects:
          - set:
              current_scene: b2_ch05b_spare
              b2_ch5_spare: 1
  - name: b2_ch05b_spare
    routes:
      - condition: b2_ch5_spare = 0
        texts:
          - source: scene_text
            paragraph: 32
            text: |-
              Aparto mi arma de la garganta del hombre, y luego la uso para apuñalarlo directamente en el corazón, concediéndole una muerte rápida.

              La multitud me vitorea, mientras el presentador me declara oficialmente vencedor de la pelea. Luego vuelvo a mi área de división, y una vez que la reja de hierro se cierra detrás de mí, me doy la vuelta y empiezo a ver las siguientes peleas en silencio.
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch05b_undesirables
      - condition: b2_ch5_spare = 1
        texts:
          - source: scene_text
            paragraph: 31
            text: |-
              Ignoro a la multitud, y uso mi hoja para apuñalar al gladiador en la pierna derecha. Esto debería bastar para asegurarme de que no estará peleando contra mí en la ronda final.

              Luego le doy la espalda y empiezo a alejarme.

              "¿Qué crees que estás haciendo?" dice el presentador.

              "Voy de vuelta a mi sala de división," digo. "La pelea ha terminado. Gané."

              "No, la pelea no ha terminado hasta que yo diga que ha terminado," dice el presentador, enfadado. "Ahora vuelve allí y termina el trabajo."

              "Nah," digo.

              "¿Qué problema tienes?" dice el presentador. "¡Este hombre no es tu amigo! Apuesto a que ni siquiera lo habías visto antes de este evento de arena. ¿Por qué no lo estás matando?"

              "Me niego a matar a un tipo que acabo de conocer solo para entretenerlos a ustedes," digo. "Mi único objetivo era incapacitarlo para no tener que pelear contra él en la ronda final. Si quieren matarlo, háganlo ustedes mismos."

              "No voy a anunciar tu victoria hasta que mates a este hombre," dice el presentador.

              "Entonces decláralo a él ganador," digo. "No me importa. He terminado aquí."

              Mientras me marcho, la multitud empieza a abuchearme. Sus gritos e insultos no dejan de hacerse más fuertes conforme me acerco a mi sala de división.

              "¡Cállense!" les grito, cuando por fin exploto.
          - source: scene_text_2
            paragraph: 8
            text: |-
              El ruido de la multitud va apagándose lentamente, porque todos los espectadores me miran con curiosidad para ver qué tengo que decir.

              "¿Qué demonios les pasa?" continúo. "¿Eso es lo que consideran entretenimiento? ¿Ver a gente asesinándose entre sí y siendo despedazada por bestias salvajes? ¿Qué tan enfermos de la cabeza tienen que estar para disfrutar de algo así? ¡Dan pena todos! ¿Les hace sentir bien saber que hay gente con vidas todavía peores que las suyas? ¿Por eso están viendo esta basura? ¡Pues tengo noticias para ustedes! ¡En cuanto salgan de aquí, las mismas vidas de mierda los estarán esperando afuera! ¡Y se lo merecen! La forma en que están tratando a estos gladiadores es la misma en que los nobles los tratan a ustedes. No tienen derecho a quejarse de nada de lo que pasa en sus vidas. ¿Qué tal si hacen una pequeña pausa y reflexionan un poco antes de volver a abuchearme como un montón de ovejas descerebradas? Yo vuelvo a mi celda. He terminado con todos ustedes, idiotas."

              Como era de esperar, en cuanto termino mi discurso, los abucheos de la multitud suenan más fuerte que nunca, y los insultos ahora también son mucho más variados. Ignoro al rebaño, y regreso a mi área de división sin dirigirles ni una sola mirada.

              "Vaya," escribe Leila, cuando la reja de hierro se cierra detrás de mí. "Eso fue... todo un discurso."

              "Sí," digo, simplemente, y luego ambos observamos las siguientes peleas en silencio.
        effects:
          - set:
              ac_b2_ch5_speaker: 1
            achievement:
              id: ac_b2_ch5_speaker
              title: Orador público
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch05b_undesirables
  - name: b2_ch05b_refuse
    texts:
      - source: scene_text
        paragraph: 33
        text: |-
          Decido aprovechar mi condición de indeseable para rechazar el duelo. No hay ninguna razón para cansarme todavía más antes de la ronda final. Debería usar todo el tiempo que me queda a mi disposición para recuperarme de la batalla con el trol.

          Le digo mi decisión al presentador, y vuelvo a mi área de división. En cuanto llego, la reja de hierro se cierra detrás de mí, y me doy la vuelta para empezar a observar las siguientes peleas.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch05b_undesirables
  - name: b2_ch05b_undesirables
    routes:
      - condition: b2_ch5_wilhelm = 0 AND b2_ch2_creatures = 0
        texts:
          - source: scene_text
            paragraph: 34
            text: |-
              El resto de las peleas transcurrieron sin incidentes particulares, y sin que ninguno de los gladiadores destacara de ninguna manera. Sin embargo, parecía estar formándose cierto patrón con la programación de los duelos. Para empezar, ni a mí, ni a Daren, ni a Hadrik nos volvieron a llamar para ninguna pelea. Kate fue programada para pelear unas cuantas veces, pero se negó en todas las ocasiones, aprovechando al máximo su condición de indeseable. En segundo lugar, no volvió a haber peleas a muerte en absoluto después de mi última batalla. La mayoría de las peleas terminaron con rasguños leves, o con gladiadores rindiéndose antes siquiera de que empezara el combate, debido a las evidentes diferencias de nivel entre ellos.

              Para cuando la tercera ronda terminó, resultaba bastante obvio que estos cambios habían sido solicitados específicamente por el embajador, con el propósito de mantener con vida a tantos gladiadores como fuera posible, para hacernos pelear contra todos ellos en la ronda de penalización.

              El ganador de la tercera ronda fue un tipo de la séptima división que realmente no hizo nada especial, pero tuvo la suerte de encontrarse con muchos cobardes que se rindieron antes incluso de que empezaran sus peleas. Una vez que el ganador recibió su premio, el presentador pidió a todos los gladiadores que se reunieran en el área de combate una última vez, para que la ronda de penalización pudiera por fin comenzar.

              "¿Podrían los indeseables formar una fila y ponerse frente al resto de los gladiadores?" dice el presentador.
          - source: scene_text_2
            paragraph: 9
            text: |-
              Daren, Hadrik, Kate y yo nos dirigimos hacia el centro de la arena, y nos colocamos hombro con hombro, preparando nuestras armas.

              "Ahora bien, ¿quién está listo para participar en la ronda final--" empieza a decir el presentador, pero se detiene cuando ve que Leila y Bruce se mueven al mismo tiempo para unirse a nuestro lado.

              "¿Qué están haciendo?" dice el presentador. "¡Están en el lado equivocado! ¡Ninguno de ustedes es indeseable!"

              "¡Todavía!" dice Bruce.

              "¿Está diciendo," dice el presentador, "que se están convirtiendo voluntariamente en indeseables después de que el evento ya terminó, solo para estar al lado de estos gladiadores?"

              "Los verdaderos miembros de la cuarta división se mantendrán unidos hasta el último toque del cuerno," dice Bruce.

              Wilhelm frunce el ceño hacia Bruce, que lo estaba mirando directamente cuando dijo esas últimas palabras. Sin embargo, el asesino decide no responder a la provocación de Bruce, y se queda en su sitio.
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch05b_caliber
