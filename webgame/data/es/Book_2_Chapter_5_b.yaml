              Las seis balas perforan el ala derecha del dragón, lo que hace que grite de dolor y se detenga en seco. Luego se aparta volando para evitar recibir más disparos. Antes de dirigirse hacia nosotros, el dragón inhala mucho aire en el pecho, preparándose para lanzarnos su fuego.

