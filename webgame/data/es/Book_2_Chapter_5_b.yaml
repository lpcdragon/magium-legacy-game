              Intento dispararle otra vez, pero Tyrath esquiva hábilmente la mayoría de mis balas en pleno vuelo, fijándose en la forma en que muevo la torreta. Solo unas pocas de las balas recubiertas de ácido le dan, y no parece que le hagan mucho daño.

              Sin embargo, Tyrath parece estar teniendo algunos problemas con el ala a la que disparé antes, lo que hace que vuele un poco más lento que antes.
