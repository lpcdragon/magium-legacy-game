  - name: b2_ch05b_tactic4
    routes:
      - condition: reflexes >= 2 AND b2_ch5_scimitar <> 0
        texts:
          - source: scene_text
            paragraph: 27
            text: |-
              Mientras termino de planear mi ataque, el hombre llega a mi posición, y se detiene a unos doce pies de mí, evaluándome con una sonrisa arrogante en la cara. No dice nada, pero es bastante obvio lo que está pensando. Claramente no puede imaginarse perdiendo esta pelea.

              Ambos esperamos a que el presentador nos dé la señal, y una vez que nuestra batalla comienza oficialmente, el gladiador carga directamente hacia mí, con su hacha alzada en el aire, lista para golpear.

              Espero a que llegue hasta mí, y empiezo a esquivar sus ataques, intentando encontrar la oportunidad adecuada para contraatacarlo.

              Esquivar los ataques del guerrero definitivamente no es fácil, debido al gran tamaño de su hacha de batalla, y hay más de unas pocas veces en las que casi siento que no voy a lograrlo. Por suerte, el mayor alcance de mi cimitarra me da un poco más de espacio para maniobrar, y también me permite parar algunos de los golpes que de otro modo me habrían alcanzado.

              En cuanto pillo a mi oponente con el pie cambiado, uso mi cimitarra para apuñalarlo en una zona desprotegida del lado derecho del pecho. Dada la naturaleza curva de mi arma, el corte no es muy profundo, pero basta para que el gladiador entre en pánico y salte hacia atrás, intentando apartarse de mi hoja. Lo sigo rápidamente, y vuelvo a darle un tajo, lo que hace que tropiece y caiga de espaldas, soltando el hacha de batalla de las manos. Entonces aparto el arma de una patada, y le pongo la cimitarra en la garganta, para asegurarme de que no intente levantarse otra vez.
