          - source: scene_text
            paragraph: 64
            text: |-
              "Vamos," nos dice Daren. "Creo que vi a Enrique mirándonos desde por aquí, y estoy bastante seguro de que salió por una de estas puertas cuando empezó la evacuación. Debe de estar esperándonos afuera."

              Todos salimos por la puerta, intentando encontrar a Enrique, pero antes siquiera de poder mirar a nuestro alrededor, nos recibe una joven con una sonrisa agradable en el rostro. La reconozco de inmediato como la misma chica que antes estaba llamando a Eiden.

              "¡Hola!" dice la chica. "Espero no estar molestándolos. Es solo que los vi pelear durante el evento de la arena, ¡y me impresionaron muchísimo! Me preguntaba si podrían ayudarme con una cosita."

              "Lo siento, niña," dice Daren, mientras le da una breve palmada en el hombro. "No estamos firmando autógrafos."

              Luego le da la espalda y se dirige hacia Enrique, que estaba esperándonos no muy lejos de la puerta. La chica parece ligeramente irritada por el comentario de Daren, pero no da la impresión de que piense rendirse todavía. Al mirarla mejor, noto que su ropa, aunque estéticamente agradable, no se ve muy distinta de los pijamas que venden en el Continente Occidental. Me recuerdan bastante al tipo de ropa que a Eiden le gusta llevar.
          - source: scene_text_2
            paragraph: 34
            text: |-
              Espera un momento... Esta chica conoce a Eiden... Y lleva ropa parecida a la suya... Entonces, ¿significa eso que...? No, no, no, ¿pero en qué estoy pensando siquiera? Es solo una coincidencia. No hay forma de que esta chica pueda ser una--

              "Eh, Barry, ¿vienes?" me dice Daren.

              "Ah, sí, sí, ya voy," digo, mientras le lanzo a la joven una última mirada vacilante y luego me dirijo hacia Daren.
