  - name: b2_ch05b_contraption
    texts:
      - source: scene_text
        paragraph: 46
        text: |-
          Al mirar a mi alrededor, veo, para mi sorpresa, que la zona vacía de los espectadores está empezando a llenarse lentamente con cientos de personas vestidas con uniformes de guardia, y muchas de ellas sostienen en las manos unas armas muy peculiares. Mientras tanto, otras personas están empujando varias máquinas voladoras hacia el área de combate de la arena. Las máquinas se parecen a los artefactos voladores construidos por los gnomos, con una gran hélice arriba, una larga cola detrás, y dos alas que ayudan a planear por el aire. La hélice suele ser impulsada por un hechizo lanzado por un elementalista del aire, pero aparte de eso, no hace falta más magia para ayudar a volar a estas máquinas.

          Hace unos años conocí a un gnomo que no dejaba de hacerme realizar pruebas de vuelo de sus prototipos a cambio de la información sobre magos que yo necesitaba. Recuerdo que uno de esos prototipos era tan malo que la hélice dejó de funcionar mientras estaba en pleno vuelo, y tuve que planear hasta el suelo. A día de hoy sigo teniendo pesadillas con algunos de esos vuelos.

          Una de las personas que empujó los artefactos voladores hacia la arena está ahora discutiendo con un gnomo, no muy lejos de donde estamos. Cuando miro mejor, me doy cuenta de que el gnomo no es otro que el rey Golmyck.
      - source: scene_text_2
        paragraph: 20
        text: |-
          "¿Qué quieres decir con que los pilotos y los artilleros aún no están aquí?" dice Golmyck. "¡Pedí específicamente que hubiera tres pilotos y artilleros listos esperando por si alguna de las manticoras enloquecía! ¿Dónde están ahora?"

          "Le pido disculpas, su majestad," dice el hombre que ayudó a empujar la maquinaria. "Mataron a todas las manticoras en la primera ronda, así que los pilotos y artilleros se fueron a beber algo. Intenté contactar con ellos por sus transceptores, pero no responden..."

          "¡Maldiciones!" dice Golmyck. "Yo mismo pilotaría una de estas cosas, ¡pero todavía necesito a alguien que se encargue de los cañones!"

          Luego se vuelve hacia nosotros.

          "¡Ustedes, gladiadores!" dice. "Ahora todos están en el ejército, ¿correcto? ¿Alguno de ustedes tiene experiencia pilotando aeronaves? ¿O al menos se les da bien apuntar desde un vehículo en movimiento? ¡Me vendría bien algo de ayuda aquí!"
