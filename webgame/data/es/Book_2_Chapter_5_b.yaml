  - name: b2_ch05b_finish
    texts:
      - source: scene_text
        paragraph: 6
        text: |-
          "Bien, bien, acabaré con él," digo.

          Empiezo a caminar hacia Daren, con mi daga todavía en su vaina, y me detengo a una distancia de un brazo de él. Luego le doy un golpe suave en el pecho, y Daren se tira al suelo, fingiendo morir de una forma muy falsa y dramática.

          "Está hecho," le digo al embajador, con voz muy alta, para asegurarme de que todos en la multitud puedan oírme. "El sanador está muerto."

          Los espectadores ya no pueden contenerse por más tiempo, y todos empiezan a reírse al unísono. La cara del embajador ahora está todavía más roja que antes.

          "¿Te estás burlando de mí?" grita.

          "Claro que nos estamos burlando de ti," dice Daren desde el suelo, mientras se levanta lentamente. "¿Qué esperabas? No pensarías de verdad que íbamos a cambiar de opinión y empezar a matarnos entre nosotros solo porque tú nos lo dijeras, ¿verdad?"
      - source: scene_text_2
        paragraph: 4
        text: |-
          "¡Si no se matan entre ustedes, haré que los ejecuten a los dos!" grita el embajador.

          "No, no lo hará," dice Daren, en voz alta, para que todos puedan oírlo. "No existe ninguna regla estándar de la arena que diga que tenemos que matarnos entre nosotros. Solo rompimos una de las reglas de este evento. Eso significa que no puede ejecutarnos. Solo puede convertirnos en indeseables y obligarnos a participar en la ronda de penalización. Esas son las reglas."

          "¡No me importan las reglas!" grita el embajador. "¡Yo hago las reglas! ¡Harán lo que yo diga, o ambos van a morir!"

          Después del último arrebato del embajador, se oye un fuerte murmullo proveniente de los asientos de los espectadores. El embajador no se da cuenta, y continúa con su diatriba.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch05b_shunned
  - name: b2_ch05b_shunned
    texts:
      - source: scene_text
        paragraph: 7
        text: |-
          "¿De verdad pensaron que esas reglas alguna vez tuvieron alguna importancia?" grita el embajador, todavía más fuerte que antes. "¡El único propósito de toda esta arena era hacer que los mataran! ¡Nunca se supuso que salieran de aquí con vida! ¿Me oyen? ¡Toda esta arena no era más que una farsa! No cometan el error de pensar que tienen alguna posibilidad de sobrevivir solo porque hayan ganado dos míseras rondas. ¡Soy el embajador de Ollendor! Si quisiera, podría hacer que los ejecutaran a ambos ahora mismo, delante de toda esta gente, ¡y a nadie le importaría! ¡Ese es el poder que tengo! ¡Ahora dense prisa y mátense entre ustedes como los perros que son, o haré que sus cabezas acaben en picas, junto con las de todos sus amigos!"

          Mientras el embajador hablaba, los murmullos de la multitud empezaron a transformarse lentamente en abucheos, que no hicieron más que intensificarse cuanto más hablaba el embajador. Para cuando terminó su monólogo, la mayoría de los espectadores se habían sumado a los abucheos, y cada segundo sonaban más fuerte.

          "¡Que le corten la cabeza al embajador!" grita uno de los espectadores, lo bastante fuerte para que todos lo oigan.

          Esa sola frase pareció resonar perfectamente con lo que todos estaban pensando en ese momento, porque todos los espectadores de la multitud empezaron a adoptarla poco a poco y a hacer una versión más corta de ella, para poder corearla al unísono una y otra vez.

          "¡Que le corten la cabeza! ¡Que le corten la cabeza! ¡Que le corten la cabeza!" sigue coreando la multitud, mientras la expresión arrogante del embajador es reemplazada poco a poco por otra mucho más oscura y temerosa, y un hilo de sudor empieza a recorrerle la frente.
      - source: scene_text_2
        paragraph: 5
        text: |-
          "¿Qué se siente, embajador?" oímos de repente la voz de Eiden, viniendo de algún lugar detrás del embajador, aunque el propio stillwater no se ve por ninguna parte.

          "¡Maldición, otra vez no!" dice Daren, en cuanto oye la voz de Eiden.

          "¿Es... Eiden?" dice el embajador, mientras mira a su alrededor, intentando identificar el origen del sonido.

          "¿Qué se siente tener a tanta gente amenazando con acabar con tu vida al mismo tiempo?" dice Eiden. "Mira bien a esta gente, embajador. ¿Crees que les importaría tu alto rango si se encontraran contigo ahora mismo en la calle? ¿Crees que dudarían aunque fuera por un momento en matarte, si se les diera la oportunidad de hacerlo?"

          Hace una pausa.

          "Esta es la gente a la que has despreciado durante toda tu vida, embajador," continúa Eiden. "Y lo has hecho por tu estricta adhesión a la creencia de que todas las personas por debajo de tu rango social no eran más que criaturas inferiores, indignas de tu atención. ¿Todavía te queda lo necesario para aferrarte a tus creencias ahora y afrontar las consecuencias directas de tus actos? ¿Qué elección tomarás, embajador? Tu tiempo se está acabando."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch05b_departure
  - name: b2_ch05b_departure
    texts:
      - source: scene_text
        paragraph: 8
        text: |-
          Casi puedo imaginarme la sonrisa torcida de Eiden, con los ojos cerrados, mientras observa al embajador morderse las uñas intentando encontrar una solución que le sirva tanto para calmar a la multitud como para lograr que nos maten en el acto. Sin embargo, la solución nunca llegó.

          "¡He cambiado de opinión!" dice por fin el embajador, lo bastante alto para que los espectadores puedan oírlo. "¡Seguiremos las reglas! Estos dos gladiadores se han convertido ahora en indeseables. Si sobreviven a la ronda final, entonces serán puestos en libertad, como se prometió. Pueden continuar el resto de la ronda como les parezca."

          Luego sale hecho una furia del área de combate, y lo más lejos posible del sonido de los abucheos. Mientras tanto, Daren ha recogido su espada y su escudo del suelo, y ahora mira hacia el lugar del que hemos oído venir la voz de Eiden.

          "Entonces, ¿qué tal va todo, Eiden?" dice Daren. "¿Estás disfrutando del espectáculo?"

          El lugar vacío al que Daren se dirige no le da ninguna respuesta.

          "Sabes, estaba pensando..." dice Daren, ignorando el hecho de que Eiden nunca respondió a su pregunta. "Mientras viajaba, a menudo oía hablar de estos nuevos tipos de circos, donde involucran directamente a la audiencia en algunas partes de sus espectáculos. Pensaba que, ya que eres un espectador tan leal, ¡quizás podríamos probar un poco de eso! ¿Qué te parece?"
      - source: scene_text_2
        paragraph: 6
        text: |-
          Daren hace una pequeña pausa, como si de verdad estuviera esperando que Eiden dijera algo.

          "¡Genial!" dice Daren. "¡Allá va!"

          Entonces arroja su espada a una velocidad asombrosa, justo al punto donde Eiden había estado parado de forma invisible unos minutos antes. La espada atraviesa el espacio vacío donde el stillwater había estado de pie, y cae al suelo unas cuantas decenas de pies más allá de esa posición. Luciendo un poco decepcionado, Daren deja escapar un pequeño suspiro, y va a recuperar su espada.

          No mucho después de la salida del embajador, el presentador da oficialmente por terminada la pelea entre Daren y yo, y me declara vencedor de la batalla, debido a la rendición de Daren. Mientras me preparo para regresar a mi sala de división, el presentador me detiene, diciéndome que estaba programado para pelear a muerte con un gladiador de la sexta división justo después de mi batalla con Daren. El presentador también me recuerda que, como indeseable, ahora tengo derecho a negarme a pelear hasta la ronda de penalización, si así lo deseo.
    choices:
      - position: 1
        text: Rechazar el duelo
        effects:
          - set:
              current_scene: b2_ch05b_refuse
              b2_ch5_spare: 0
      - position: 2
        text: Aceptar el duelo
        effects:
          - set:
              current_scene: b2_ch05b_accept
  - name: b2_ch05b_accept
    texts:
      - source: scene_text
        paragraph: 9
        text: |-
          Decido aceptar el duelo. Prefiero con mucho pelear ahora con este gladiador, mientras está solo, que verme obligado a enfrentarme a él más tarde en la ronda de penalización, cuando estaremos peleando contra todos a la vez.

          Le notifico mi decisión al presentador, y se abre una reja de hierro que despeja el camino para que mi adversario entre al campo de batalla. Cuando el hombre entra al área de combate, lo reconozco como uno de los luchadores más competentes de su grupo. De hecho, incluso diría que es comparable, en términos de destreza en combate, a los luchadores de la primera división. Su constitución también es bastante impresionante, siendo tan alto como Daren y tan robusto como Bruce. Igual que la mayoría de los otros gladiadores, parece llevar armadura de cuero, pero en lugar de una espada, el arma que ha elegido parece ser una gran hacha de batalla de doble filo, que ahora sostiene con ambas manos.

          El comienzo de la pelea probablemente será anunciado en cuanto llegue hasta mí. Bien, entonces... ¿cómo voy a enfocar esto? La pelea es a muerte, pero como indeseable ya no estoy atado por ese tipo de reglas. Si quiero quitármelo de en medio, matarlo sería más fácil, pero técnicamente también podría simplemente romperle una pierna o algo así, y debería bastar para mis propósitos.
    choices:
      - position: 1
        text: Intentar matarlo
        effects:
          - set:
              current_scene: b2_ch05b_kill
      - position: 2
        text: Intentar incapacitarlo
        effects:
          - set:
              current_scene: b2_ch05b_incapacitate
  - name: b2_ch05b_kill
    texts:
      - source: scene_text
        paragraph: 10
        text: |-
          No tengo ningún motivo para perdonarle la vida a este hombre. A juzgar por su constitución musculosa, dudo mucho que esta sea su primera pelea en una arena. Lo más probable es que no dude en matarme si tiene la oportunidad, y yo tampoco debería dudar.

          ¿Pero cómo voy a pelear contra él? ¿Intento desarmarlo primero, o debería limitarme a golpearlo donde esté desprotegido? ¿Sería mejor esperar a que cometa errores o atacarlo de frente y tomarlo por sorpresa? Preferiría mucho más tener un plan que depender únicamente del instinto.
    choices:
      - position: 1
        text: Tomarlo por sorpresa y desarmarlo
        effects:
          - set:
              current_scene: b2_ch05b_tactic1
      - position: 2
        text: Tomarlo por sorpresa y atacarlo directamente
        effects:
          - set:
              current_scene: b2_ch05b_tactic2
      - position: 3
        text: Esperar a que cometa errores y luego desarmarlo
        effects:
          - set:
              current_scene: b2_ch05b_tactic3
      - position: 4
        text: Esperar a que cometa errores y luego atacarlo directamente
        effects:
          - set:
              current_scene: b2_ch05b_tactic4
  - name: b2_ch05b_incapacitate
    texts:
      - source: scene_text
        paragraph: 11
        text: |-
          No veo ninguna razón por la que deba matarlo. No tengo nada contra el tipo. Solo quiero asegurarme de que no tendré que pelear con él en la ronda final. Lo único que necesito es incapacitarlo de alguna manera, nada más.

          ¿Pero cómo voy a pelear contra él? ¿Intento desarmarlo primero, o debería limitarme a golpearlo donde esté desprotegido? ¿Sería mejor esperar a que cometa errores o atacarlo de frente y tomarlo por sorpresa? Preferiría mucho más tener un plan que depender únicamente del instinto.
    choices:
      - position: 1
        text: Tomarlo por sorpresa y desarmarlo
        effects:
          - set:
              current_scene: b2_ch05b_tactic1
      - position: 2
        text: Tomarlo por sorpresa y atacarlo directamente
        effects:
          - set:
              current_scene: b2_ch05b_tactic2
      - position: 3
        text: Esperar a que cometa errores y luego desarmarlo
        effects:
          - set:
              current_scene: b2_ch05b_tactic3
      - position: 4
        text: Esperar a que cometa errores y luego atacarlo directamente
        effects:
          - set:
              current_scene: b2_ch05b_tactic4
  - name: b2_ch05b_tactic1
    routes:
      - condition: agility >= 2 AND b2_ch5_scimitar <> 0 AND strength >= 1
        texts:
          - source: scene_text
            paragraph: 12
            text: |-
              Mientras termino de planear mi ataque, el hombre llega a mi posición, y se detiene a unos doce pies de mí, evaluándome con una sonrisa arrogante en la cara. No dice nada, pero es bastante obvio lo que está pensando. Claramente no puede imaginarse perdiendo esta pelea.

              Ambos esperamos a que el presentador nos dé la señal, y una vez que nuestra batalla comienza oficialmente, el gladiador carga directamente hacia mí, con su hacha alzada en el aire, lista para golpear.

              Va a ser un poco difícil tomarlo por sorpresa cuando está intentando hacer exactamente lo mismo conmigo al mismo tiempo, pero ya es un poco tarde para cambiar de táctica. Yo también cargo hacia el gladiador, e intento agarrarlo desprevenido con mi velocidad, para poder desarmarlo rápidamente antes de que se recupere.

              De algún modo consigo sorprenderlo incluso cuando fue él quien inició el ataque, y uso mi cimitarra como un gancho, para arrancarle el hacha de batalla de las manos por la cabeza.

              Una vez que mi oponente queda desarmado, me lanzo rápidamente hacia él con mi arma, y al intentar esquivarme, cae de espaldas. Entonces le pongo inmediatamente mi hoja en la garganta, sin darle oportunidad de levantarse.
        effects:
          - set:
              successful_checks:
                - '[ Comprobación de velocidad exitosa - nivel 2 ]'
                - '[ Comprobación de fuerza exitosa - nivel 1 ]'
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch05b_mercy
                condition: is_dead = 0
      - condition: agility >= 2 AND b2_ch5_scimitar = 0 AND strength >= 2
        texts:
          - source: scene_text
            paragraph: 13
            text: |-
              Mientras termino de planear mi ataque, el hombre llega a mi posición, y se detiene a unos doce pies de mí, evaluándome con una sonrisa arrogante en la cara. No dice nada, pero es bastante obvio lo que está pensando. Claramente no puede imaginarse perdiendo esta pelea.

              Ambos esperamos a que el presentador nos dé la señal, y una vez que nuestra batalla comienza oficialmente, el gladiador carga directamente hacia mí, con su hacha alzada en el aire, lista para golpear.

