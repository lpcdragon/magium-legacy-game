  - name: b2_ch05b_pilot
    texts:
      - source: scene_text
        paragraph: 55
        text: |-
          Uso la palanca de control para maniobrar la aeronave hasta alinearla con el dragón.

          "Voy a atacar a Tyrath," le digo a Golmyck. "Prepárate."

          "Entendido," dice Golmyck.

          En cuanto me aseguro de tenerlo en una línea de tiro despejada, pulso el botón de mi panel de control, y le disparo alrededor de una docena de balas al ala derecha del dragón. El dragón grita de dolor, y luego se aparta volando, preparándose para embestirnos. Decido que es momento de retirarme, y hago girar el aparato, intentando poner toda la distancia posible entre el dragón y nosotros.

          Vuelvo la mirada hacia Tyrath, y veo que está inhalando mucho aire en el pecho, preparándose para atacarnos con su aliento de fuego. Cambio rápidamente la dirección de la aeronave para evitar el ataque del dragón, y las llamas nos fallan por bastante margen. Ahora el dragón está justo detrás de nosotros, pero parece estar teniendo algunos problemas con el ala a la que disparé antes, lo que hace que vuele un poco más lento que antes.

          Mientras tanto, Golmyck está usando la torreta para mantener la presión sobre el dragón, pero no consigue acertarle mucho, porque Tyrath puede saber fácilmente desde dónde saldrán las balas por la forma en que apunta la torreta, y no tiene demasiados problemas para esquivar la mayoría de esos disparos.
      - source: scene_text_2
        paragraph: 28
        text: |-
          Cuando el dragón se acerca a nosotros, Hadrik por fin vuelve a alcanzarlo en su forma de águila, y se transforma otra vez en enano para darle un golpe en la parte de atrás de la cabeza. Luego se transforma rápidamente de nuevo en águila y sale volando, mientras uno de los conos de hielo de Kate perfora el pecho del dragón. Tyrath arranca el cono con una garra, y luego empieza a inhalar aire para preparar su aliento de fuego, pero justo cuando lo hace, todo el aire alrededor de su cabeza es reemplazado por agua, y eso es lo que inhala en su lugar. Al darse cuenta de su error, el dragón intenta inmediatamente toser el agua fuera de sus pulmones, pero el agua que rodea su cabeza no desaparece, así que lo único que consigue es tragar todavía más agua con cada tos.

          "Esta es la nuestra," dice Golmyck. "¡Esta es nuestra oportunidad! A ver si puedes pilotarnos por encima del dragón mientras está ocupado con el agua, para que yo pueda dejar caer sobre él la cuerda giratoria."

          "De acuerdo," digo. "Lo intentaré."

          El dragón ahora se mueve arriba y abajo, sacudiendo la cabeza con violencia en un intento de librarse de toda el agua que tiene sobre el cuello.

          "No sirve de nada luchar contra ello," le dice Illuna al dragón, con voz fría. "Esa agua no va a desaparecer. Y tampoco puedes quemarla con tus llamas mientras no logres sacar toda esa agua de tus pulmones. Deja de resistirte y acepta tu destino."

          "¡Ja!" dice Arraka. "¿Qué se siente al ahogarte en pleno aire, Tyrath? Yo fui quien le enseñó esta técnica a Illuna, ¿sabes? Estabas soltando mucho aire caliente hace un momento, pero al final resulta que ni siquiera puedes vencer a una de mis discípulas. Supongo que, después de todo, nunca estuviste a mi altura. ¡Aja- AHAHAHAHA!!!"
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch05b_glowing
