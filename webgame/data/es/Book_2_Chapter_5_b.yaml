              current_scene: b2_ch05b_stunned
  - name: b2_ch05b_stunned
    texts:
      - source: scene_text
        paragraph: 45
        text: |-
          Mientras el dragón queda aturdido brevemente por el ataque del enano, Kate aprovecha la oportunidad para lanzar su cono de hielo contra su objetivo. Hay una explosión de aire extremadamente poderosa detrás del cono de hielo, que sale disparado directamente contra el pecho del dragón a una velocidad increíble. El carámbano perfora la dura piel de Tyrath, y este deja escapar un rugido atronador, que casi hace que todos pierdan el conocimiento, incluso mientras intentan desesperadamente taparse los oídos. Luego el dragón arranca el cono de hielo de su pecho con una garra, y se teletransporta justo al lado de Kate, que ahora apenas puede sostenerse en pie dentro de su jaula de hielo flotante debido al rugido del dragón de hace un momento. Justo cuando el dragón está a punto de quemarla viva con su aliento de fuego, aparece de la nada una jaula dorada que lo atrapa dentro. Esto no impide que Tyrath exhale su fuego, pero de algún modo ninguna de las llamas consigue atravesar los barrotes de la jaula, y al final se extinguen por sí solas.

          "La jaula del zorro..." dice Tyrath.

          Luego se da la vuelta, mirando fijamente a Illuna.

          "¿Esto es cosa tuya?" le pregunta.

          "Ya he tenido suficiente de tu molesto teletransporte," dice Illuna. "Vas a quedarte quieto durante los próximos minutos. ¿Entiendes?"

          "¿Y en qué va a ayudarlos eso?" dice Tyrath. "Puede que no pueda atacarlos desde aquí dentro, pero ustedes tampoco pueden atacarme a mí. Lo único que están haciendo es perder el tiempo."

          "No exactamente," dice Illuna.
      - source: scene_text_2
        paragraph: 19
        text: |-
          Flower empieza entonces a moverse alrededor de la jaula del dragón usando sus chorros de fuego, creando bolas de fuego con las manos y dejándolas flotando una a una alrededor de la jaula.

          "Me gustaría verte lidiar con todas estas a la vez, rey de todos los dragones," dice Flower, con una sonrisa torcida.

          El dragón resopla con desprecio, y empieza a lanzar una serie de hechizos de protección sobre sí mismo, preparándose para el momento en que la jaula desaparezca. Kate ahora también está creando tantos de sus conos de hielo rediseñados como puede, aunque, a juzgar por la expresión de su cara, este proceso claramente la está agotando mucho más rápido que su forma habitual de lanzar magia. No sé cuánto tiempo más podrá mantener esto.

          Maldición, tiene que haber algo que pueda hacer en esta situación. Tal vez pueda encontrar la forma de subir ahí arriba de alguna manera.
