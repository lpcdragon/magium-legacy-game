        paragraph: 44
        text: |-
          El dragón parece furioso. Parece que esta vez piensa ir con todo desde el principio. Antes de que Flower alcance a lanzar otra bola de fuego, el dragón desaparece del lugar donde estaba y reaparece justo frente a ella, lanzando un zarpazo con una de sus garras. Flower reacciona de inmediato, y usa un chorro de fuego desde su mano izquierda para impulsarse hacia un lado y salir del alcance del dragón. Tyrath no pierde tiempo, y vuelve a teletransportarse, esta vez justo detrás de Flower. Esta vez es Illuna quien se da la vuelta rápidamente y usa dos chorros de agua que salen de sus manos para atacar al dragón y al mismo tiempo alejarse de él. Mientras la chica y el dragón repiten las mismas maniobras unas cuantas veces más, Kate está preparando en el aire, por encima de ella, un cono de hielo enorme, lista para lanzárselo a Tyrath.

          "Kate, esto no va a funcionar," le dice Daren, al verla preparar su cono de hielo. "¿No recuerdas cómo fueron las cosas la última vez que peleamos contra él? Tus conos de hielo no le afectaron en absoluto. Si pudieras usar una de tus plataformas de hielo para llevarme volando hasta el cielo, quizá yo podría conseguir herirlo con mi espada."

          "Esto no será como la última vez," dice Kate, con una mirada decidida. "Ahora que conozco todo el alcance del poder de mi enemigo, ya no tengo el lujo de preocuparme por conservar mi energía mágica. Esta vez voy a pelear contra él con todo lo que tengo, incluso si termino desmayándome por el agotamiento."
      - source: scene_text_2
        paragraph: 18
        text: |-
          "¡Maldición, escúchame!" dice Daren, pero Kate lo ignora, y se rodea de una jaula hecha de hielo que luego usa para elevarse por el aire, de forma que pueda tener una mejor vista de su objetivo.

          El cono de hielo que está creando definitivamente se ve muy distinto a cualquier cosa que haya hecho antes. Parece tan afilado y resistente como el acero élfico, y sencillamente irradia energía mágica. Se siente como si toda el área a su alrededor estuviera temblando por el poder mágico que se está concentrando en ese único cono de hielo, y una vez que el proceso de creación se completa, el cono empieza a girar por sí solo, siguiendo los movimientos del dragón. Después de que Tyrath se teletransporta unas cuantas veces más para atacar a Flower, Hadrik por fin vuelve a alcanzarlo, en su forma de águila, y se transforma una vez más en enano para golpearlo directamente en la cara.
