  - name: b2_ch05b_invisibly
    texts:
      - source: scene_text
        paragraph: 62
        text: |-
          "Oye, Arraka," digo. "¿Eiden sigue por aquí, o esta vez ya se fue de verdad?"

          "Nah, ya se fue," dice Arraka.

          "Muy bien, volvamos abajo," le digo a Golmyck, y entonces regresamos al área de combate de la arena.

          Una vez que aterrizamos nuestra máquina voladora y salimos de la cabina, el rey me estrecha la mano, y luego va a reunirse con sus soldados, diciéndome que volveremos a vernos en el palacio. No mucho después, Daren, Kate, Hadrik y Flower se reúnen uno por uno cerca del aparato, para que podamos abandonar la arena juntos. Le hago una seña a Leila, que también viene a unirse a nuestro grupo, y mientras nos preparamos para irnos, Bruce viene a despedirse.

          "Buena pelea, stillwater," dice Bruce, mientras me da una fuerte palmada en el hombro. "¡Buena pelea! Y lo mismo va por ti, princesa de cabello plateado. Si alguna vez volvemos a quedar atrapados en otra arena mortal, no me importaría volver a tenerlas como aliadas. Quizá nos volvamos a ver algún día."

          "Quién sabe," le digo. "Después de todo, es un continente pequeño."

          Tanto Leila como yo nos despedimos de él, y luego nos unimos al resto del grupo. Una vez que todos estamos listos para irnos, los que participamos en la arena vamos a recoger nuestras mochilas de los vestuarios, y luego volvemos a reunirnos en el área de combate para dirigirnos hacia una de las salidas de los espectadores.
    choices:
