  - name: b2_ch05b_glowing
    routes:
      - condition: b2_ch5_pilot = 1
        texts:
          - source: scene_text
            paragraph: 58
            text: |-
              Los ojos de Tyrath empiezan a brillar con un rojo intenso de repente, y parece más furioso que nunca. Ahora da la impresión de estar aumentando voluntariamente la temperatura de su cuerpo hasta un grado alarmante, porque estoy empezando a ver vapor saliendo de todo él. Debe de estar intentando evaporar toda el agua de su cuerpo para poder volver a escupir fuego.

              Mientras Tyrath está ocupado calentando su cuerpo, Golmyck y yo conseguimos colocarnos justo por encima del dragón, y nos preparamos para dejar caer la cuerda sobre él. En cuanto el dragón logra su objetivo de evaporar toda el agua que tiene dentro, usa lo último que le queda de aliento para exhalar una gran llama por la boca, eliminando toda el agua que rodeaba su cabeza hasta ese momento.

              "¡Voy a soltar la cuerda!" dice Golmyck, mientras observamos al dragón jadear por aire.

              Luego tira de una palanca a su derecha, y el compartimento de carga se abre debajo de nosotros, soltando la cuerda.
          - source: scene_text_2
            paragraph: 31
            text: |-
              Tal como dijo el gnomo, la cuerda se desenrolla mientras cae, y luego empieza a girar por sí sola. El dragón está demasiado ocupado recuperando el aliento como para mirar por encima de él, y en cuanto la cuerda lo alcanza, se ata sola alrededor de sus alas, impidiéndole seguir batiéndolas. Tyrath parece conmocionado al empezar a caer hacia el suelo, y su primera reacción es intentar soltarse de la cuerda usando la fuerza de sus alas. Al fracasar, empieza a morder la cuerda con los colmillos, mientras también intenta cortarla con las garras, pero no sirve de nada. A medida que se acerca al suelo, el dragón intenta usar las últimas reservas de su energía mágica para frenar su impulso teletransportándose unas cuantas docenas de pies por encima de su posición varias veces seguidas. Sin embargo, eso no reduce en absoluto su velocidad de caída, y finalmente se estrella contra el suelo con un estruendo ensordecedor, creando un cráter en medio del área de combate de la arena, y enviando grandes nubes de polvo a su alrededor.

              "¡El dragón está en tierra!" grita Golmyck de repente a todos los presentes. "¡Acaben con él, ahora!"

              "¡BASTA!" grita Tyrath con fuerza, y una explosión muy poderosa de aire caliente que se origina desde su posición nos golpea de pronto a todos en la cara.
          - source: scene_3
            paragraph: 6
            text: |-
              Tras la explosión, el cuerpo del dragón cambia por completo, y ahora parece estar cubierto de lava fundida en vez de escamas normales. También emana ahora un aura ígnea intimidante que es totalmente distinta de la que tenía antes. Pero eso no es todo. El poder mágico que ahora estoy percibiendo en él es sencillamente descomunal. Si tuviera que compararlo con algo que haya sentido antes, diría que está a un nivel bastante parecido al poder mágico del zorro dorado. ¿Es esta en serio la verdadera forma del dragón rojo, Tyrath? ¿La de la que Arraka estaba hablando antes, antes de que comenzara la pelea? ¿Cómo se supone que vamos siquiera a luchar contra algo así?

              La cuerda que estaba atando las alas del dragón ya ha sido reducida a cenizas por la transformación del dragón. Tyrath vuelve ahora a elevarse por el cielo, con un aspecto más amenazador que nunca.

              "Todo esto es culpa mía," dice Tyrath, con un tono inusualmente calmado. "Yo solo soy el responsable de haberles dado la ilusión de que realmente podían tener alguna oportunidad contra mí. Ahora voy a corregir ese error. En lugar de seguir peleando con ustedes individualmente, simplemente destruiré esta ciudad entera y a todos los que están dentro con un solo hechizo. Así ya no habrá más malentendidos."
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch05b_serious
