  - name: b2_ch05b_ending
    routes:
      - condition: ch11_saved_rose = 0
        texts:
          - source: scene_text
            paragraph: 66
            text: |-
              "Amigos míos," dice Enrique. "¡Eso fue fantástico! ¡Simplemente magnífico! ¡No tengo palabras! Pensaba que ya lo había visto todo cuando terminasteis de pelear contra esas criaturas en la arena, ¡pero luego fuisteis y derrotasteis a un dragón! Y por si fuera poco, habéis sobrevivido al encuentro casi sin rasguños. ¡Esto exige una celebración! Esta noche tendremos un banquete. ¡No aceptaré un 'no' como respuesta!"

              "Eh... ¿disculpe, señor?" oímos a la joven de antes, llamando a Daren desde detrás de nosotros.

              "Escucha, Enrique," dice Daren, ignorando a la chica que tiene detrás, "te agradezco de verdad todo esto, pero este evento de la arena ya nos ha dejado tres días por detrás de todos los demás participantes del torneo de magos, así que sinceramente no creo que sea buena idea que pasemos otra noche más en Thilias."

              "Ehmm, ¿señor?..." vuelve a preguntar la joven, pero nadie le presta atención.

              "Vamos, Daren," dice Hadrik. "¡No seas aguafiestas! Nunca nos dieron un límite de tiempo para completar los primeros objetivos. No es que vayan a descalificarnos si no empezamos a buscar las piñas de inmediato."

              "¡Maldición, Hadrik!" dice Daren. "Eres la última persona de la que quiero oír eso. ¡Ni siquiera te importa ganar el torneo! ¿No dijiste que solo viniste aquí por el desafío? Apuesto a que solo intentas retrasar esto porque odias la idea de tener que ir a buscar piñas."
          - source: scene_text_2
            paragraph: 35
            text: |-
              De repente, Kate, Daren y yo empezamos a elevarnos lentamente del suelo, y mientras flotamos, todos nos giramos al mismo tiempo para mirar en la dirección opuesta. De pie frente a nosotros está ahora la joven de antes, la de los pijamas, sonriéndonos amablemente.

              "¡Bueno, entonces!" dice la chica, sonriendo mientras junta las manos al aplaudir. "Ahora que tengo su atención, ¿quizá podríamos tener una pequeña charla? ¡Les prometo que esto no les llevará más de unos pocos minutos!"
