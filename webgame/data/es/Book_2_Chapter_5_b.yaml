              "Ahora bien, ¿quién está listo para participar en la ronda final--" empieza a decir el presentador, pero se detiene cuando ve que Hadrik, Leila y Bruce se mueven al mismo tiempo para unirse a nuestro lado.

              "¿Qué están haciendo?" dice el presentador. "¡Están en el lado equivocado! ¡Ninguno de ustedes es indeseable!"

              "¡Todavía!" dice Bruce.

              "¿Está diciendo," dice el presentador, "que se están convirtiendo voluntariamente en indeseables después de que el evento ya terminó, solo para estar al lado de estos gladiadores?"

              "Los verdaderos miembros de la cuarta división se mantendrán unidos hasta el último toque del cuerno," dice Bruce.

              Wilhelm frunce el ceño hacia Bruce, que lo estaba mirando directamente cuando dijo esas últimas palabras. Después de unos segundos de silencio, el asesino se mueve de su sitio y se une también a nuestro lado.

              "¿Y tú qué, enano?" le pregunta el presentador a Hadrik.

              "Bueno, ya me conoces," dice Hadrik. "¡Siempre me gustan los buenos desafíos!"
