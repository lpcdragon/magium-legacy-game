  - name: b2_ch05b_talking
    texts:
      - source: scene_text
        paragraph: 42
        text: |-
          "Espera, ¿estás hablando de mí?"

          "Sí, estoy hablando de ti, miserable desgraciado," grita Tyrath. "¡Ahora deja de hablar y activa otra vez tus estadísticas mágicas para que pueda demostrarte lo débil que eres en realidad!"

          "Eh, verás..." le digo al dragón. "La cosa es que ya no puedo activar esas estadísticas."

          "¿Entonces te niegas a pelear conmigo con todo tu poder?" dice Tyrath.

          "No, no lo entiendes," digo. "Lo que digo es que de verdad no puedo usar esas estadísticas ahora mismo. ¿No podrías volver más tarde, después de que aprenda a activarlas?"

          "Si no piensas activar las estadísticas," dice el dragón, "entonces empezaré por asesinar lentamente a todos tus amigos, uno por uno, hasta que por fin entres en razón. Y cuando termine contigo, destruiré esta ciudad entera, y luego reduciré a cenizas todos los demás asentamientos humanos de este continente. Haré hoy lo que debería haber hecho hace diez mil años. Tu raza nunca estuvo destinada a salir de las cuevas."

          Inmediatamente después de terminar su discurso, una explosión enorme envuelve al dragón, y luego unas cuantas explosiones más pequeñas empiezan a llenar el área a su alrededor. Flower, que ahora está muy alto en el cielo, a unos doscientos pies del dragón, hace un gesto de victoria con el puño derecho en cuanto ve las explosiones.
      - source: scene_text_2
        paragraph: 17
        text: |-
          "¡Buen trabajo distrayéndolo, Barry!" dice Flower, mientras me hace un gesto con el pulgar hacia arriba, todavía flotando en el cielo con ayuda de los chorros de fuego que salen de sus pies.

          "¡Cuidado!" le grito. "¡El dragón es inmune al fuego!"

          "Aunque sea inmune al fuego," dice Illuna, "el impacto de las explosiones de todas formas va a dejar marca."

          "¡Pues ya la oíste!" dice Flower, con una sonrisa torcida. "¡Allá va otra bola de fuego!"

          Entonces la chica crea una bola de fuego giratoria entre sus manos, y la lanza hacia el dragón, haciéndola explotar al impactar.

          "Entonces este es el dragón del que estaban hablando," dice Hadrik, con media sonrisa, y con una mezcla de emoción y aprensión en la mirada. "¡Vamos a ver de qué está hecho!"

          Luego Hadrik se transforma en un águila gigante, y asciende por el cielo hacia el dragón. Flower se asegura de detener sus bolas de fuego cuando lo ve, y en cuanto Hadrik se coloca por encima de Tyrath, vuelve a transformarse en su forma habitual de enano, lanzándose en picado hacia el dragón y golpeándolo en la espalda. El puñetazo de Hadrik fue tan fuerte que lo oímos incluso desde aquí abajo, y envió al dragón volando una docena de pies hacia el suelo. Entonces el enano vuelve a transformarse en águila, y se aleja volando, esperando a ver qué hará su oponente a continuación.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch05b_cone
