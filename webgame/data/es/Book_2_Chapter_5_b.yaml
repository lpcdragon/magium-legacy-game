    texts:
      - source: scene_text
        paragraph: 38
        text: |-
          "¡Ni hablar! ¡Ese no era el trato!"

          "¡Escuchen, no hay tiempo para discutir!" dice el presentador, con un poco de pánico en la voz. "Aunque no quieran unirse al ejército, aun así ya no les queda tiempo para--"

          El presentador se interrumpe, porque un viento muy poderoso sopla hacia todos nosotros, sintiéndose como si pudiera levantarnos por los aires en cualquier segundo, si no nos mantuviéramos firmes.

          Este viento... Solo he presenciado algo así una vez antes. Oh, dioses, por favor, no dejen que sea--

          "Medio lessathi," oigo una voz familiar llamándome desde arriba. "He estado buscándote."

          Al alzar la cabeza con vacilación, veo a Tyrath, el rey de todos los dragones, batiendo las alas muy alto en el cielo, mientras me mira directamente con una expresión amenazante.

          "Que los dioses se apiaden..." dice Bruce.
      - source: scene_text_2
        paragraph: 15
        text: |-
          El presentador grita, y cae de espaldas, en cuanto ve al dragón. Los espectadores se ven aterrorizados. Ahora están gritando y empujándose unos a otros como locos. A este ritmo, no pasará mucho tiempo antes de que algunos acaben tirados en el suelo y sean pisoteados por la estampida de la multitud.

          El embajador deja escapar un chillido agudo, y sale corriendo tan rápido como pueden llevarlo sus piernas, fuera del área de combate.

          "¿Pensaste que podrías esconderte de mí para siempre, medio lessathi?" dice Tyrath. "Deberías haberte dado cuenta de que sería capaz de seguir tu rastro por el olor en cuanto salieras de tu agujero subterráneo. Lo único que lograste fue retrasar lo inevitable."
    choices:
