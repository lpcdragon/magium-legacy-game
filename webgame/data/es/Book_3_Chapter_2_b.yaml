  - name: b3_ch02b_scenario2
    texts:
      - source: scene_text
        paragraph: 46
        text: |-
          Mientras se prepara para darle otra patada a Daren, Gontrok de repente adopta una expresión mucho más seria e instintivamente se gira hacia mí, seguramente porque por primera vez en esta batalla ha sentido de verdad que su vida corría peligro. Apenas me lleva más de un segundo lanzarme hacia la espada de Daren, recogerla y luego trazar una línea recta hacia el gigante con el arma apuntándole, pero aun así él consigue reaccionar a tiempo y apartarse justo cuando estaba a punto de ensartarlo con mi hoja. Gontrok no me deja recuperar el equilibrio y enseguida me agarra del brazo derecho, apretándolo con mucha fuerza.

          "No está bien atacar a la gente cuando está de espaldas...", dice Gontrok, con una expresión sombría en el rostro, mientras ahora me aprieta el brazo todavía más, intentando obligarme a soltar la espada. "Quizá debería darte una lección asegurándome de que no vuelvas a poder usar ese brazo jamás."

          El dolor de ver cómo intenta aplastarme el brazo es insoportable, pero me doy cuenta fácilmente de que a estas alturas ya me habría roto todos los huesos si mi nivel de resistencia no fuera tan alto. Aprieto los dientes, giro sobre mí mismo y pateo a Gontrok en el vientre con la parte trasera del talón izquierdo, lo que hace que me suelte el brazo y salga despedido unos doce pies hacia atrás antes de caer de espaldas.
      - source: scene_text_2
        paragraph: 30
        text: |-
          Me lanzo inmediatamente hacia él e intento apuñalarlo mientras sigue en el suelo, pero el gigante rueda deprisa hacia un lado y esquiva mi espada por apenas unos centímetros. Luego se pone en pie y se abalanza sobre mí en un intento de agarrarme una vez más, pero yo hago un pequeño giro y trato de apuñalarlo otra vez, lo que le obliga a dar un salto rápido hacia atrás, solo para volver y atacarme con todavía más insistencia un segundo después. Decido aprovechar mi gran velocidad para confundir al enemigo e intento alejarme del gigante para correr a su alrededor hasta que deje de poder fijarse bien en mí.

          En cuanto intento poner el plan en práctica, sin embargo, me doy cuenta de inmediato de que Gontrok es en realidad igual de rápido que yo, si no incluso más. Cada vez que intento apartarme de él de un salto, cierra la distancia entre nosotros al instante y solo gracias a mis increíbles reflejos y a mis amplios conocimientos de técnicas de combate consigo tanto reaccionar a tiempo como prever sus siguientes movimientos para apartarme de su camino en el momento justo. Los dos vamos saltando por el campo de batalla durante unos buenos segundos hasta que concluyo que esta estrategia no va a funcionar y, en cuanto encuentro un pequeño resquicio, me elevo alto en el aire con la esperanza de poder sacar por fin ventaja aprovechando mi superioridad aérea.

          Por desgracia para mí, el gigante no me deja alejarme más que unas pocas decenas de pies antes de que le broten espontáneamente de la espalda dos alas parecidas a las de un dragón, que utiliza de inmediato para impulsarse hacia arriba a una velocidad alarmante.
      - source: scene_3
        paragraph: 13
        text: |-
          Maldita sea... Solo se ha transformado parcialmente para conservar la fuerza y la resistencia de un gigante mientras aprovecha la gran movilidad de un guiverno. Ni siquiera sabía que algo así fuera posible. Pues vaya con mi superioridad aérea, supongo...

          Lo que sigue es una intensa batalla de ingenio y maniobras aéreas, en la que cada uno intenta sacar ventaja de su adversario tratando de anticipar sus movimientos. Una vez más, parece que mis habilidades para pilotar están dando resultado, porque casi todo el tiempo parezco ser yo quien arrincona a Gontrok y no al revés. Dicho esto, sigo sin conseguir acertarle un golpe y, a medida que la pelea se alarga, me preocupa cada vez más que el gigante decida sacar otro truco de la manga para recuperar la ventaja una vez más.

          Cuando desciendo a una altitud algo menor, de pronto siento una fuerza invisible muy poderosa empujándome hacia abajo y enseguida me encuentro estampado contra el suelo, completamente incapaz de moverme. Mientras todavía intento levantarme sin éxito, Gontrok aterriza cerca de mí, retrae sus dos alas de guiverno hasta que desaparecen por completo y mira a su capitán con resentimiento en los ojos.

          "¿Qué demonios crees que estás haciendo, capitán?...", pregunta Gontrok.

          Muevo un poco la cabeza para ver mejor mi entorno y me doy cuenta de que, mientras yo peleaba contra el gigante, Leila también ha sido sometida y ahora todos los que antes luchaban contra el capitán están siendo aplastados contra el suelo, incapaces de volver a levantarse.
