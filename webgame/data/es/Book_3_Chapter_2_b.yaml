  - name: b3_ch02b_gontrok
    routes:
      - condition: b3_ch2_hearing = 1
        texts:
          - source: scene_text
            paragraph: 36
            text: |-
              "Gontrok...", dice Hadrik, con una expresión inusualmente sombría en los ojos.

              "No pareces muy feliz de verme, Hadrik", dice Gontrok. "¿Qué pasa? No irás a decirme en serio que todavía me guardas rencor por aquello de la aldea de los enanos de hace tantos años, ¿verdad? Aunque, pensándolo bien, supongo que no serías el Hadrik que yo conocí si no fueras de los que guardan rencores eternos por las cosas más insignificantes que puedan imaginarse."

              Gontrok se echa entonces a reír a carcajadas, mientras Hadrik parece capaz de asesinar a su viejo 'amigo' aquí mismo y ahora mismo.

              "Supongo que conoces a este enano, recluta?...", dice el hombre de mayor rango.

              "Ese hombre no es ningún enano, capitán", dice Gontrok. "Es un gigante, igual que yo. Probablemente uno de los organizadores del torneo le ordenó que permaneciera en forma de enano si no quería que lo expulsaran, igual que a mí me dijeron que me quedara en forma humana. Todos los gigantes que quieren viajar fuera de su país tienen que aprender magia de cambio de forma para hacerse más pequeños, o no los aceptarán en otras sociedades."

              Al oír hablar a los dos hombres, me doy cuenta de pronto de que son el mismo capitán y el mismo recluta que oí discutir antes, cuando aún estaban en el callejón. Con un poco de suerte, quizá pueda aprovechar más tarde en mi beneficio lo que descubrí en su conversación privada.
          - source: scene_text_2
            paragraph: 22
            text: |-
              "No me importa la historia de tu raza, recluta", dice el capitán con tono frío. "Lo que sí quiero saber, en cambio, es quién invitó a todos estos participantes del torneo a nuestra ciudad. Díganme, viajeros, ¿cuál es el nombre del ciudadano de Ollendor que les dio la contraseña?"

              "No podemos decirle su nombre", dice Daren. "Nos pidió que mantuviéramos en secreto su identidad."

              "A la guardia real no se le ocultan secretos", dice el capitán. "Solo se lo preguntaré una vez más. ¿Cómo se llama la persona que los invitó aquí?"

              Gontrok se ríe.

              "Sabes perfectamente que nadie los invitó", dice. "Probablemente oyeron a unos aldeanos hablar de la contraseña o algo así y luego le contaron al guardia de la entrada la misma historia que nos contaron a nosotros."

              "Si no van a darme un nombre, entonces tendremos que ponerlos bajo custodia", nos dice el capitán.

              "¿Y si nos negamos a acompañarlos?", pregunta Daren.

              "Entonces los ejecutaremos en el acto", dice el capitán.

              "¡Eso sí que es lo que estaba esperando oír!", dice Gontrok. "Para ser totalmente sincero, llevo mucho tiempo deseando volver a pelear con Hadrik y no creo que vaya a tener nunca una oportunidad mejor que esta. ¡Ustedes dos quédense atrás! ¡Yo solo bastaré para acabar con todos ellos!"
            condition: b3_ch2_goblins = 3
