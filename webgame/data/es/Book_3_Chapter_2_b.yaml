              Todos vamos detrás de Melindra, que nos conduce hacia uno de los extremos de la plaza donde hay considerablemente menos gente de pie.

              Mientras nos alejamos de la multitud, una breve conversación entre dos personas en un callejón me llama la atención.

              "Todo el mundo puede ver que la ceremonia ya ha empezado", dice una de las voces. "Deja de quejarte. No va a pasar nada porque lleguemos un poco tarde."

              "¿Se te olvida que es por tu culpa que hemos acabado llegando tarde en primer lugar?", dice la segunda voz.

              "Nadie te obligó a venir conmigo mientras hacía compras", dice la primera voz. "Podrías haberte adelantado sin mí."

              "Como si yo estuviera lo bastante loco como para perderte de vista aunque fuera un minuto", dice la segunda voz. "Puede que hayas engañado a todos los demás, pero yo sé que no se puede confiar en ti. Mientras estés bajo mi mando directo, harás exactamente lo que yo diga. ¿Ha quedado claro, recluta temporal Gondrok?"

              "Lo que usted diga, capitán", dice la primera voz, y luego ambos guardan silencio.
