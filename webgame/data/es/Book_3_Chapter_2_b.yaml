  - name: b3_ch02b_contraptions1
    routes:
      - condition: reflexes < 3
        texts:
          - source: scene_text
            paragraph: 21
            text: |-
              "Quizá Daren debería crear primero una barrera para nosotros, por si acaso."

              "Bien pensado", dice Daren. "Esos artilugios podrían intentar contraatacar si nos ven preparándonos para atacarlos. Todos, vengan aquí y los protegeré."

              Nos acercamos a Daren y entonces él alza el escudo, creando una barrera protectora a nuestro alrededor. Una vez que estamos a salvo dentro, Kate lanza todos sus carámbanos contra las bolas metálicas voladoras, apuntando a los ojos. Sin embargo, en un giro inesperado de los acontecimientos, la mayoría de las cabezas de gólem voladoras consigue esquivar los carámbanos de Kate con facilidad y ahora se lanzan en picado hacia nosotros, disparando varios tipos de rayos y proyectiles mágicos desde sus ojos rojos.

              "Maldita sea...", dice Daren, mientras la barrera empieza a agrietarse lentamente bajo la presión de la lluvia constante de hechizos que se le viene encima. "No hubo tiempo suficiente para que la barrera se regenerara después de la batalla con los grandes gólems de las puertas. A este ritmo no aguantará mucho más. ¡Intenten terminar con esto lo antes posible!"
          - source: scene_text_2
            paragraph: 13
            text: |-
              Mientras la barrera de Daren es bombardeada por más de una docena de hechizos, desde rayos de hielo y fuego hasta chorros de ácido y ataques eléctricos, Kate envía una segunda oleada de proyectiles hacia las cabezas de gólem, mientras Illuna y Flower también las atacan con flechas de fuego y lanzas de agua. Entre las tres logran derribar aproximadamente a la mitad de las bolas metálicas voladoras, pero a juzgar por la multitud de grietas visibles en la superficie de la barrera semitransparente de Daren, parece que no faltan más que unos segundos para que se derrumbe por completo.

              "¡La barrera está a punto de romperse!", grita Daren. "¡Prepárense!"

              Justo cuando la barrera está a punto de desaparecer, todos nos apartamos en direcciones distintas para dispersar a las cabezas de gólem que nos estaban apuntando. Unas cuantas bolas metálicas vienen a por mí e intento alejarme volando de ellas, pero de algún modo lo único que consigo con mis movimientos es atraer la atención de todavía más cabezas de gólem, que no tardan en seguirme.

              Intento esquivar sus ataques, pero son demasiadas y en seguida me sobrepasan. Antes de que mis amigos consigan salvarme, dos rayos de fuego me alcanzan al mismo tiempo y me matan al instante.
