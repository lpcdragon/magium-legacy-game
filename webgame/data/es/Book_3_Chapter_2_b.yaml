chapter_effects:
  - condition: current_scene = "b3_ch02b_gontrok3" AND warning.text is empty
    effects:
      - warning:
          text: Tus estadísticas no son lo suficientemente altas.
scenes:
  - name: b3_ch02b_weird
    texts:
      - source: scene_text
        paragraph: 2
        text: |-
          "¿Siempre han sido tan raros los edificios de esta ciudad?", le pregunto a Melindra. "Sinceramente, me sorprende que algunas de estas estructuras no se hayan derrumbado todavía."

          "Había casas así en la ciudad antes de que me expulsaran, pero no tantas como ahora", dice Melindra. "Deben de haber demolido algunas de las casas más antiguas para construir las nuevas encima. Seguramente es obra de Billy Bob, el lessathi renegado del que les hablé antes. Se cree un genio en todos los campos, incluida la arquitectura, y el rey le ha dado muchísimas libertades como recompensa por sus inestimables contribuciones al repentino y brusco avance tecnológico de esta ciudad. Como resultado, el viejo Billy Bob ha aprovechado la oportunidad para experimentar con toda clase de diseños alocados e innovadores para edificios, algunos un poco más cuestionables que otros."

          "Perdona, pero ¿acabas de decir que este lessathi se llama Billy Bob?...", dice Daren.

          "Ah, ese no es su nombre real", dice Melindra. "Así era como lo llamábamos porque su nombre era casi impronunciable. Su nombre completo es Biliborrathrathsarran y, como las primeras sílabas suenan un poco como Billy Bob, ese fue el apodo con el que acabó."

          "Supongo que sus padres se lucieron de verdad cuando lo bautizaron, ¿eh?", dice Hadrik.
      - source: scene_text_2
        paragraph: 2
        text: |-
          "La verdad, no me suena mucho más ridículo que un nombre lessathi cualquiera", dice Melindra. "Lo único exagerado es lo largo que es. Había tantas formas de acortar ese nombre y convertirlo en algo más manejable que me hace pensar que sus padres se lo pusieron como una broma cruel. ¿Qué mejor manera de arruinarle la vida a tu hijo que darle un nombre que... eh, miren, ¡una cabeza de gólem voladora!"

          "¿Qué?...", dice Hadrik.

          "¡Allí, miren!", dice Melindra, señalando hacia un artilugio extraño que ahora mismo está volando hacia nosotros.

          Esta 'cabeza de gólem voladora' no parece ser más que una esfera metálica del tamaño de una cabeza humana, con una hélice arriba y una especie de ojo grande en el centro, que parece iluminado con una luz roja. A medida que la bola metálica voladora se acerca a nosotros, gira a izquierda y derecha para que su ojo pueda examinarnos bien y luego empieza a hablar con una voz monótona de sonido metálico.

          "Esta unidad no los reconoce", dice la esfera voladora. "Identifíquense."
      - source: scene_3
        paragraph: 2
        text: |-
          "¡Oh, esto me trae tantísimos recuerdos!", dice Melindra, mirando la bola metálica que tiene delante. "Recuerdo que Billy Bob tenía una obsesión con estas cabezas de gólem de un solo ojo. ¡Quería hacerlas inteligentes! Creo que solía llamarlas... ¿droons? Sí, creo que así se llamaban. En fin, Billy Bob tenía el sueño de llenar algún día los cielos con estos 'droons' suyos y que, de algún modo, vigilaran a los ciudadanos incluso en ausencia de los guardias de la ciudad. Ni que decir tiene que su sueño se quedó solo en eso, un sueño, y lo máximo que consiguió sacar de estas viejas reliquias fue que te pidieran el nombre. Si no les respondes, te seguirán acosando hasta que les digas algo. Pero si les das cualquier nombre, sin importar cuál, simplemente se marcharán volando y te dejarán en paz. ¿Qué te parece como invento inútil?"

          "Esta unidad no repetirá de nuevo lo que ha dicho", dice la bola metálica voladora. "¡Identifíquense o enfréntense a las consecuencias!"
    choices:
      - position: 1
        text: ¡Soy Felran, el elementalista de fuego más fuerte del Continente Oriental!
        effects:
          - set:
              current_scene: b3_ch02b_designation
              b3_ch2_name: 0
      - position: 2
        text: Me llamo Dave el Degollador.
        effects:
          - set:
              current_scene: b3_ch02b_designation
              b3_ch2_name: 1
      - position: 3
        text: Me llamo Barry.
        effects:
          - set:
              current_scene: b3_ch02b_designation
              b3_ch2_name: 2
      - position: 4
        text: Clavar la daga en el ojo de la bola metálica voladora
        effects:
          - set:
              current_scene: b3_ch02b_designation
              b3_ch2_name: 3
      - position: 5
        text: Decirles a todos que simplemente ignoremos la bola metálica y sigamos nuestro camino
        effects:
          - set:
              current_scene: b3_ch02b_designation
              b3_ch2_name: 4
  - name: b3_ch02b_designation
    routes:
      - condition: b3_ch2_name = 0
        texts:
          - source: scene_text
            paragraph: 3
            text: |-
              "¡Soy Felran, el elementalista de fuego más fuerte del Continente Oriental!"

              "Designación adquirida", dice la bola metálica. "A partir de ahora serán denominados Felran, el elementalista de fuego más fuerte del Continente Oriental. Que tengan un buen día."

              "Espera, ¿eso era todo?", dice Hadrik mientras la bola metálica se aleja volando de nosotros. "¿No va a preguntar por el resto de nuestros nombres?"

              "Ya dije que estos 'droons' no son precisamente muy inteligentes, ¿no?", dice Melindra.

              "Sí, pero aun así...", dice Hadrik. "¿Ahora va a llamarnos a todos Felran o qué?"

              "Posiblemente", dice Melindra. "No tengo ni idea de cómo han evolucionado estas cabezas de gólem con los años. En cualquier caso, tampoco importa. Sigamos, ¿sí?"
