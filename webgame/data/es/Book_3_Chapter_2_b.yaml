          - source: scene_text_2
            paragraph: 10
            text: |-
              "Todavía podrían estar transmitiendo nuestra posición a los demás guardias para que sepan mejor dónde esperarnos", dice Daren. "Creo que sería más seguro derribar todas las bolas metálicas antes de seguir avanzando. Kate, ¿te encargas?"

              Kate asiente y entonces empieza a preparar una veintena aproximada de carámbanos en el cielo sobre ella, para poder dispararlos todos de una vez contra las cabezas de gólem voladoras.

              De repente, tengo una premonición en la que las bolas metálicas esquivan con rapidez casi todos los carámbanos de Kate y, antes de que ninguno de nosotros pueda reaccionar, los 'droons' se lanzan sobre nosotros atacándonos con varios tipos de rayos y proyectiles mágicos.

              "¡Espera, no dispares!", grito con fuerza, y Kate detiene los carámbanos justo a tiempo.

              "¿Qué pasa?", dice Kate.

              "He visto una visión en la que atacas las bolas metálicas y ellas van a esquivar la mayoría de tus proyectiles", digo. "También empezarán a dispararnos toda clase de ataques mágicos en cuanto abramos fuego, así que, si vamos a eliminarlas, necesitaremos un ataque sorpresa mejor que ese."

              "Flower y yo también podríamos preparar unas flechas de fuego y unas lanzas de agua para disparar a las bolas metálicas justo cuando intenten esquivar los carámbanos de Kate", dice Illuna. "Por muy buenas que sean esquivando ataques en pleno aire, dudo que puedan evitar tres oleadas consecutivas de proyectiles."
