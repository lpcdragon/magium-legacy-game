  - name: b3_ch02b_esteemed
    routes:
      - condition: b3_ch2_name = 0
        texts:
          - source: scene_text
            paragraph: 8
            text: |-
              Después de caminar unos minutos más, otra bola metálica voladora con una hélice arriba se abre paso lentamente hacia nosotros, salvo que esta parece tener el ojo iluminado con una luz verde en vez de roja. El 'droon' se detiene frente a nosotros y, igual que el anterior, gira a izquierda y derecha para que su ojo pueda examinar bien a todos los miembros de nuestro grupo.

              "Saludos", dice la esfera voladora con una voz de sonido metálico bastante parecida a la del 'droon' anterior, salvo que esta no habla con voz monótona. "Esta unidad se llama 'Dejen de pedirme que le ponga nombre a todas y cada una de sus unidades. ¿De verdad no pueden inventarse un nombre sencillo ustedes solos?'. Parece que están intentando orientarse por la ciudad. ¿Necesitan ayuda?"

              "Umm... no, creo que estamos bien", digo. "¡Pero gracias por preguntar!"

              "Procesando...", dice la bola metálica. "La designación de su grupo figura actualmente como 'Felran, el elementalista de fuego más fuerte del Continente Oriental'. ¿Es correcto?"

              "Ah, ¿nos estaban preguntando el nombre del grupo?", digo. "Yo pensaba que teníamos que dar nuestros nombres individuales. ¿Todavía podemos cambiar la designación después de haberla dado?"

              "Parece que les gustaría cambiar la designación inicial", dice la bola metálica. "Por desgracia, no es posible cambiar el nombre de su grupo en este momento. Por lo tanto, seguirán siendo denominados 'Felran, el elementalista de fuego más fuerte del Continente Oriental' por el momento. Les pedimos disculpas por las molestias."
          - source: scene_text_2
            paragraph: 4
            text: |-
              "¡Eh, ningún problema!", digo. "En ese caso supongo que nos ir--"

              "Para que esta unidad pueda guiarlos adecuadamente por la ciudad, primero deberán especificar su destino previsto", dice la bola metálica.

              "¡Te acabo de decir que no necesitamos guía!", digo. "Podemos arreglárnoslas perfectamente solos."

              "Negativo", dice la bola metálica. "Todos los comerciantes que vienen de ciudades extranjeras son nuestros estimados invitados. Es tarea de esta unidad garantizar que sus negocios se desarrollen de la forma más fluida posible. No obstante, para guiarlos, esta unidad primero necesita saber adónde se dirigen."

              "¿Y qué pasa si no te damos nuestro destino?...", dice Daren.

              "Error", dice la bola metálica. "Esta unidad no está equipada para gestionar un escenario así. Iniciando protocolo experimental de inteligencia artificial: designación Supervisor. Permanezcan a la espera. Su consulta será respondida en breve."
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch02b_formulating
