  - name: b3_ch02b_doubt
    routes:
      - condition: b3_ch1_unlock = 2
        texts:
          - source: scene_text
            paragraph: 33
            text: |-
              "Creo que solo quiere ver cómo se desarrollan las cosas. Dudo que intervenga."

              "Creo que quizá estés siendo un poco demasiado optimista, pero supongo que no nos queda otra que esperar y ver cómo se desarrollan los acontecimientos", dice Melindra. "En fin, olvidémonos de Eiden por ahora. Estoy bastante segura de que ya he averiguado por dónde tenemos que seguir. Vengan por aquí."

              Todos vamos detrás de Melindra, que nos conduce hacia uno de los extremos de la plaza donde hay considerablemente menos gente de pie.
          - source: scene_text_2
            paragraph: 20
            text: |-
              Cuando nos acercamos un poco más al borde de la plaza, Melindra de pronto nos hace una señal para que nos detengamos y se queda observando con mucha atención la entrada de un callejón frente a ella. Mientras intentamos entender qué ha llamado su atención, vemos que tres hombres están entrando ahora mismo en la plaza, dos de los cuales parecen participantes del torneo, dado que no estoy viendo ninguna advertencia de no herirlos.

              Los tres llevan uniformes azules similares sobre sus armaduras, aunque el hombre local de Varathia parece tener unas marcas distintas dibujadas en la ropa, probablemente porque ocupa un rango superior al de los otros. De los dos participantes del torneo, uno de ellos es especialmente corpulento y alto, recordándome un poco a Bruce de la arena de Thilias, salvo porque tiene una larga barba negra, la cabeza rapada, la mirada de un veterano de guerra curtido y no parece llevar armas.

              El segundo participante del torneo es de piel oscura, aunque su tono de piel es más claro que el de Daren y el de su exmentor. Tiene el pelo negro y corto, parece rondar el comienzo de la treintena y lleva dos espadas largas colgadas del cinturón, lo que indica que seguramente utiliza un estilo de combate de doble empuñadura cuando pelea.
          - source: scene_3
            paragraph: 7
            text: |-
              El hombre de mayor rango también es el más viejo del grupo, aparentando tener más de sesenta años, con el pelo blanco largo y bastantes arrugas en la cara. Igual que el hombre corpulento de su grupo, no lleva armas, aunque, si tuviera que adivinar, diría que es porque probablemente solo usa magia al luchar, a diferencia de su compañero musculoso, que lo más probable es que prefiera pelear con los puños.

              Al vernos, empiezan a dirigirse lentamente hacia nosotros, mirándonos fijamente.

              "Por el aspecto de esos uniformes, seguramente son miembros de la guardia real del rey", nos dice Melindra en voz baja. "Tengan cuidado. Todos están suprimiendo mucho sus auras, así que no puedo saber exactamente lo fuertes que son."

              "Vaya, vaya, si no es mi buen viejo amigo Hadrik", dice el hombre corpulento, con una sonrisa ladeada. "De algún modo, tenía la sensación de que tú también participarías en este torneo."
        effects:
          - set:
              failed_checks:
                - '[ Dispositivo de estadísticas bloqueado - comprobación fallida ]'
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch02b_gontrok
