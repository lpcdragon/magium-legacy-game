          - source: scene_text_2
            paragraph: 26
            text: |-
              Por suerte para mí, mis reflejos al máximo me permiten esquivar todos sus ataques, incluso cuando consigue pillarme a contrapié. Si intentara derrotarlo de verdad, lo más probable es que no fuera rival para él, pero mientras siga peleando a la defensiva, lo único que tengo que hacer es asegurarme de que no me golpee. Mientras yo no lo ataque nunca, no le estoy dando huecos que explotar y se ve obligado a jugar conmigo a este juego de espera, salvo que yo cometa un error.

              Cuando por fin consigo alejarme un poco más de él, de pronto siento una fuerza invisible muy poderosa empujarme contra el suelo mientras restringe la mayor parte de mis movimientos. Mientras intento mover la cabeza hacia un lado para ver qué está pasando, me doy cuenta de que, mientras yo peleaba contra el gigante, Leila también ha sido sometida y ahora todos los que antes luchaban contra el capitán están siendo aplastados contra el suelo, incapaces de volver a levantarse.

              "¿Qué demonios crees que estás haciendo, capitán?...", pregunta Gontrok, mientras se acerca a mí.
