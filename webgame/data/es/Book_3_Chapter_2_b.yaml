  - name: b3_ch02b_ambush
    texts:
      - source: scene_text
        paragraph: 26
        text: |-
          "Vaya, vaya, vaya", dice Arraka. "Miren quién por fin ha aprendido a detectar una emboscada usando el sentido mágico. Quizá todas esas sesiones de entrenamiento de aura no fueran una pérdida de tiempo total, después de todo."

          "Algunas de nuestras rutas de escape solo tienen unos pocos centinelas apostados en las salidas", dice Melindra. "Deberíamos poder reducirlos con facilidad."

          "Sí, pero entonces anunciarán nuestra posición a todos sus amigos y vendrán a por nosotros", dice Daren.

          "Aun así, es mejor que caer en una emboscada", dice Melindra. "Estamos invadiendo una ciudad... No podemos esperar exactamente no encontrarnos ninguna resistencia."

          "Supongo que no", dice Daren. "De acuerdo, entonces tomemos la ruta más directa hacia el palacio que evite la emboscada. ¿Por dónde vamos?"

          "Por aquí", dice Melindra, mientras se mete por un callejón pequeño y desierto. "Síganme."

          No tardamos en encontrar a los dos guardias apostados al final del callejón y en ver que uno de ellos lleva un transceptor en la mano. Dejamos fuera de combate a ambos rápidamente y seguimos adelante, con la esperanza de que no hayan tenido tiempo de avisar a sus amigos de nuestra posición antes de que los noqueáramos.

          Por desgracia, enseguida averiguamos que quizá habíamos sido demasiado optimistas, ya que los guardias que antes estaban preparando la emboscada ahora vienen todos corriendo hacia nosotros y, a este ritmo, no tardarán demasiado en llegar a nuestra posición.
      - source: scene_text_2
        paragraph: 17
        text: |-
          "¿Y ahora qué?", dice Hadrik. "¿Nos quedamos aquí y luchamos contra ellos?"

          "No", dice Daren. "Intentaremos retrasarlos todo lo posible. Flower, ¿puedes lanzar un muro de fuego lo bastante largo como para cubrir el ancho de esta calle? Les llevará un tiempo rodearlo y eso nos dará un poco de margen para alejarnos."

          "Sí, claro", dice Flower, mientras conjura un muro de llamas detrás de nosotros, tal como dijo Daren.

          "¡Perfecto!", dice Daren. "Sigamos."

          "Todavía se nos acerca otro grupo de guardias desde ese otro callejón de allí...", dice Melindra, mientras señala la entrada de un callejón que se cruza con el que recorremos ahora mismo.

          Antes de que nadie llegue a comentar nada, Kate se dirige al callejón que Melindra acaba de mencionar y dispara un rayo de hielo con las manos, congelando por completo el suelo.

          "Ahí lo tienen", dice Kate. "El suelo está completamente congelado. A menos que hayan traído patines sobre hielo, les va a costar un buen rato cruzar este pasadizo. ¿Seguimos avanzando?"

          "Muy bien", dice Melindra. "Enseguida llegaremos a la plaza Perrelion. Una vez allí, decidiremos qué camino tomar hacia el palacio."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch02b_holographic
  - name: b3_ch02b_holographic
    texts:
      - source: scene_text
        paragraph: 27
        text: |-
          Tal como dijo Melindra, no tardamos demasiado en llegar a la plaza Perrelion y, en cuanto alcanzamos nuestro destino, nos dimos cuenta de que había bastante gente reunida allí arriba, de pie, como si todos estuvieran esperando algo.

          "¿Creen que hay algún tipo de espectáculo programado para esta hora?", les digo a mis amigos mientras avanzamos entre la multitud.

          "Podría ser", dice Daren. "También podrían estar esperando a que algún alto cargo dé un discurso a esta hora. Sea lo que sea, no debería concernirnos. Sigamos moviéndonos."

          De repente, aparece frente a la multitud una pantalla holográfica mágica enorme, flotando a varias decenas de pies sobre el suelo para que todo el mundo pueda verla bien. En la pantalla vemos a un hombre gordo de barba gris que viste una corona y ropas reales y que supongo que es el rey de Ollendor, a un hombre con túnicas azules sosteniendo un cetro que probablemente sea el sumo sacerdote de la ciudad, al servicio del Dios de los Mares, y a un chico de dieciocho años en pijama, con las manos en los bolsillos y los ojos cerrados, mientras mantiene una sonrisa cortés en el rostro.

          "¡Mierda!", dice Daren, al echar un vistazo a la pantalla. "Otra vez él..."

          Como si lo hubiera oído comentar, Eiden mira directamente a Daren a través de la pantalla con los ojos aún cerrados y le dedica una sonrisa burlona.
      - source: scene_text_2
        paragraph: 18
        text: |-
          "¿Has visto eso?", dice Daren en voz baja, para que la otra gente de la plaza no lo oiga. "Estaba mirándome directamente cuando sonrió. ¿Cómo oyó lo que dije? ¿Crees que están cerca?"

          "Habla en serio...", le dice Arraka a Daren. "No necesitaba oír exactamente qué palabras usaste para averiguar lo que ibas a decir. Dices lo mismo cada vez que Eiden hace una aparición. Todo lo que tenía que hacer era usar su sentido mágico para averiguar dónde estabas situado con respecto a la pantalla y luego leer las fluctuaciones de tu aura para saber cuándo habías terminado de hablar, de modo que pudiera sonreírte justo entonces. Sabrías esta clase de cosas si esos profesores 'exsabios' tuyos hubieran dedicado un mínimo de tiempo a ponerte ejercicios de entrenamiento de aura en vez de enseñarte a recoger margaritas."

          "Te juro", dice Melindra, "que si Eiden piensa revelar nuestra posición al rey después de que ni siquiera se molestara en saludarme en la arena de Thilias, voy a estrangularlo con mis propias manos."
      - source: scene_3
        paragraph: 6
        text: |-
          "No está revelando nada", dice Illuna. "Miren la pantalla. Está claro que se preparan para algún tipo de ceremonia. El rey y Eiden permanecen en silencio mientras el hombre de las túnicas entona mantras oscuros y golpea el suelo repetidamente con su cetro. Recomiendo que los ignoremos y que sigamos a Melindra hacia nuestro destino. Esta ceremonia suya probablemente vaya a durar mucho."

          "Sí, bueno, verán...", dice Melindra. "Lo que pasa es que hace bastante tiempo que visito esta plaza por última vez y no recuerdo muy bien por dónde se supone que debamos seguir desde aquí. Han cambiado tantísimas cosas de la arquitectura que ya nada se parece a como era antes, y todo resulta muy confuso. Solo... denme un minuto y seguro que lo averiguo."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch02b_crisis
              b3_ch2_hearing: 0
  - name: b3_ch02b_crisis
    routes:
      - condition: b3_ch2_goblins = 3
        texts:
          - source: scene_text
            paragraph: 28
            text: |-
              "Al menos tenemos entretenimiento de calidad que mirar mientras esperamos", dice Hadrik con voz sarcástica. "¿Sobre qué suponéis que va esta ceremonia, en cualquier caso?"

              "Sospecho que pronto lo averiguaremos", dice Kate. "Parece que el sacerdote casi ha terminado con sus preparativos."

              Después de golpear dos veces más el suelo con su cetro, el hombre de túnicas azules retrocede y deja paso al rey de Ollendor, que avanza hasta el frente.

              "¡Mi amado pueblo!", dice el rey. "Tal como anuncié ayer, nuestro Creador por fin ha regresado. Hablé con él ayer y ha accedido amablemente a participar en esta ceremonia para recibir la bendición del Dios de los Mares, igual que cualquier otro ciudadano de Ollendor. Una vez que se convierta en uno de nosotros, estoy seguro de que nos guiará hacia nuevas alturas y, junto a él, ya no tendremos que temer a ninguno de nuestros enemigos."
          - source: scene_text_2
            paragraph: 19
            text: |-
              "En realidad, oh gran y prudente rey", dice Eiden, "por ahora mi papel será el de observador más que el de participante activo en su política. Tengo motivos para creer que su reino afrontará un gran desafío en un futuro próximo y me interesa mucho ver cómo usted y su pueblo manejarán esta crisis. He oído muchos elogios sobre su hábil liderazgo y siento una gran impaciencia por presenciar de cerca su proceso de toma de decisiones. Estoy seguro de que no traicionará mis expectativas."

              "¡Por supuesto, Creador!", dice el rey. "Sea cual sea esa crisis, me aseguraré de que no quede decepcionado. ¡Sumo sacerdote, puede comenzar la ceremonia!"

              En cuanto el rey da la señal, el sacerdote vuelve a empezar a cantar y tanto el rey como Eiden vuelven a guardar silencio.

              "Ya lo sabía...", dice Daren. "Ese bastardo sabe perfectamente lo que pensamos hacer, y la única razón por la que ha venido aquí es para ver mejor el espectáculo. Va a quedarse sentado ahí, sorbiendo su té, mientras el resto de nosotros nos asesinamos entre nosotros para su diversión."

              "Mientras no esté planeando intervenir de ninguna manera, puede beber todo el té que quiera, por mí", dice Melindra. "Esperemos que no se canse de mirar y decida unirse a la diversión más tarde."
        choices:
          - position: 1
            text: Creo que solo quiere ver cómo se desarrollan las cosas. Dudo que intervenga.
