  - name: b3_ch02b_pajamas
    texts:
      - source: scene_text
        paragraph: 16
        text: |-
          "No demasiado", dice Melindra. "Probablemente lleguemos en los próximos minutos."

          Tal como dijo Melindra, no tardamos demasiado en llegar a la plaza Perrelion y, en cuanto alcanzamos nuestro destino, nos dimos cuenta de que había bastante gente reunida allí arriba, de pie, como si todos estuvieran esperando algo.

          "¿Creen que hay algún tipo de espectáculo programado para esta hora?", les digo a mis amigos mientras avanzamos entre la multitud.

          "Podría ser", dice Daren. "También podrían estar esperando a que algún alto cargo dé un discurso a esta hora. Sea lo que sea, no debería concernirnos. Sigamos moviéndonos."

          De repente, aparece frente a la multitud una pantalla holográfica mágica enorme, flotando a varias decenas de pies sobre el suelo para que todo el mundo pueda verla bien. En la pantalla vemos a un hombre gordo de barba gris que viste una corona y ropas reales y que supongo que es el rey de Ollendor, a un hombre con túnicas azules sosteniendo un cetro que probablemente sea el sumo sacerdote de la ciudad, al servicio del Dios de los Mares, y a un chico de dieciocho años en pijama, con las manos en los bolsillos y los ojos cerrados, mientras mantiene una sonrisa cortés en el rostro.

          "¡Mierda!", dice Daren, al echar un vistazo a la pantalla. "Otra vez él..."

          Como si lo hubiera oído comentar, Eiden mira directamente a Daren a través de la pantalla con los ojos aún cerrados y le dedica una sonrisa burlona.
      - source: scene_text_2
        paragraph: 8
        text: |-
          "¿Has visto eso?", dice Daren en voz baja, para que la otra gente de la plaza no lo oiga. "Estaba mirándome directamente cuando sonrió. ¿Cómo oyó lo que dije? ¿Crees que están cerca?"

          "Habla en serio...", le dice Arraka a Daren. "No necesitaba oír exactamente qué palabras usaste para averiguar lo que ibas a decir. Dices lo mismo cada vez que Eiden hace una aparición. Todo lo que tenía que hacer era usar su sentido mágico para averiguar dónde estabas situado con respecto a la pantalla y luego leer las fluctuaciones de tu aura para saber cuándo habías terminado de hablar, de modo que pudiera sonreírte justo entonces. Sabrías esta clase de cosas si esos profesores 'exsabios' tuyos hubieran dedicado un mínimo de tiempo a ponerte ejercicios de entrenamiento de aura en vez de enseñarte a recoger margaritas."

          "Te juro", dice Melindra, "que si Eiden piensa revelar nuestra posición al rey después de que ni siquiera se molestara en saludarme en la arena de Thilias, voy a estrangularlo con mis propias manos."
      - source: scene_3
        paragraph: 4
        text: |-
          "No está revelando nada", dice Illuna. "Miren la pantalla. Está claro que se preparan para algún tipo de ceremonia. El rey y Eiden permanecen en silencio mientras el hombre de las túnicas entona mantras oscuros y golpea el suelo repetidamente con su cetro. Recomiendo que los ignoremos y que sigamos a Melindra hacia nuestro destino. Esta ceremonia suya probablemente vaya a durar mucho."

          "Sí, bueno, verán...", dice Melindra. "Lo que pasa es que hace bastante tiempo que visito esta plaza por última vez y no recuerdo muy bien por dónde se supone que debamos seguir desde aquí. Han cambiado tantísimas cosas de la arquitectura que ya nada se parece a como era antes, y todo resulta muy confuso. Solo... denme un minuto y seguro que lo averiguo."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch02b_crisis
              b3_ch2_hearing: 0
  - name: b3_ch02b_premonition
    routes:
      - condition: premonition < 3
        texts:
          - source: scene_text
            paragraph: 17
            text: |-
              Después de caminar unos minutos más, empezamos a notar que muchas más bolas metálicas con hélices encima se están reuniendo lentamente en el aire y que todas vuelan en un gran círculo. Por muy rápido o despacio que avancemos, las bolas metálicas se aseguran siempre de quedar justo sobre nosotros, aunque aparte de seguirnos, no parecen hacer mucho más. Al menos por ahora...

              "Melindra", dice Kate, "¿es normal que las cabezas de gólem voladoras se comporten así?"

              "No, nunca las había visto actuar de esta manera", dice Melindra. "Parece que se estén preparando para algo. Pero no estoy segura de qué."

              "No hemos visto guardias desde que pasamos las puertas, y me estoy dando cuenta de que cada vez hay menos civiles cuanto más nos adentramos en la ciudad", dice Daren. "Desde un punto de vista lógico, debería haber al menos algún tipo de emboscada esperándonos pronto. ¿No crees que esos artilugios voladores también forman parte de la emboscada de algún modo?"

              "No lo sé", dice Melindra. "Nunca los he visto atacar a nadie. Hasta donde yo sé, no deberían tener ninguna capacidad ofensiva, pero ha pasado mucho tiempo, así que quizá las cosas hayan cambiado desde la última vez que los vi."
          - source: scene_text_2
            paragraph: 9
            text: |-
              "Todavía podrían estar transmitiendo nuestra posición a los demás guardias para que sepan mejor dónde esperarnos", dice Daren. "Creo que sería más seguro derribar todas las bolas metálicas antes de seguir avanzando. Kate, ¿te encargas?"

              Kate asiente y entonces empieza a preparar una veintena aproximada de carámbanos en el cielo sobre ella, para poder dispararlos todos de una vez contra las cabezas de gólem voladoras.
