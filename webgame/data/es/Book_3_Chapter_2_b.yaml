            paragraph: 12
            text: |-
              Después de caminar unos minutos más, otra bola metálica voladora con una hélice arriba se abre paso lentamente hacia nosotros, salvo que esta parece tener el ojo iluminado con una luz verde en vez de roja. El 'droon' se detiene frente a nosotros y, igual que el anterior, gira a izquierda y derecha para que su ojo pueda examinar bien a todos los miembros de nuestro grupo.

              "Saludos", dice la esfera voladora con una voz de sonido metálico bastante parecida a la del 'droon' anterior, salvo que esta no habla con voz monótona. "Esta unidad se llama 'Dejen de pedirme que le ponga nombre a todas y cada una de sus unidades. ¿De verdad no pueden inventarse un nombre sencillo ustedes solos?'. Parece que están intentando orientarse por la ciudad. ¿Necesitan ayuda?"

              "Umm... no, creo que estamos bien", digo. "¡Pero gracias por preguntar!"

              "Procesando...", dice la bola metálica. "La designación de su grupo figura actualmente como 'Da-ren'. ¿Es correcto?"

              "Ah, ¿nos estaban preguntando el nombre del grupo?", digo. "Yo pensaba que teníamos que dar nuestros nombres individuales. ¿Todavía podemos cambiar la designación después de haberla dado?"

              "Parece que les gustaría cambiar la designación inicial", dice la bola metálica. "Por desgracia, no es posible cambiar el nombre de su grupo en este momento. Por lo tanto, seguirán siendo denominados 'Da-ren' por el momento. Les pedimos disculpas por las molestias."
          - source: scene_text_2
            paragraph: 4
            text: |-
              "¡Eh, ningún problema!", digo. "En ese caso supongo que nos ir--"

              "Para que esta unidad pueda guiarlos adecuadamente por la ciudad, primero deberán especificar su destino previsto", dice la bola metálica.

              "¡Te acabo de decir que no necesitamos guía!", digo. "Podemos arreglárnoslas perfectamente solos."

              "Negativo", dice la bola metálica. "Todos los comerciantes que vienen de ciudades extranjeras son nuestros estimados invitados. Es tarea de esta unidad garantizar que sus negocios se desarrollen de la forma más fluida posible. No obstante, para guiarlos, esta unidad primero necesita saber adónde se dirigen."

              "¿Y qué pasa si no te damos nuestro destino?...", dice Daren.

              "Error", dice la bola metálica. "Esta unidad no está equipada para gestionar un escenario así. Iniciando protocolo experimental de inteligencia artificial: designación Supervisor. Permanezcan a la espera. Su consulta será respondida en breve."
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch02b_formulating
  - name: b3_ch02b_formulating
    texts:
      - source: scene_text
        paragraph: 13
        text: |-
          "Esto es ridículo", dice Melindra. "¿Por qué deberíamos quedarnos aquí escuchando lo que tenga que decir algún artilugio descerebrado? Yo digo que dejemos atrás esta triste excusa de gólem y sigamos nuestro camino antes de permitirle que nos haga perder más tiempo con--"

          "Protocolo Supervisor iniciado", dice la bola metálica. "Por favor, esperen... Analizando situación actual."

          "Creo que Melindra tiene razón", dice Hadrik. "Deberíamos seguir andando. No conseguiremos nada si no--"

          "Análisis completado", dice la bola metálica. "Gracias por su paciencia. Parece que su grupo entró ilegalmente en la ciudad fingiendo ser comerciantes y que ahora se dirige al palacio. ¿Es correcto?"

          "Un momento...", dice Hadrik, en un ligero estado de shock, mientras se gira hacia la cabeza de gólem voladora. "¿Qué acaba de--"

          "¡No, lo has entendido todo mal!", le digo al 'droon'. "No entramos en la ciudad de forma ilegal. ¡Usamos la contraseña!"
      - source: scene_text_2
        paragraph: 5
        text: |-
          "Queja reconocida", dice la bola metálica. "Formulando nueva hipótesis a partir de la información adquirida."

          "Escucha, no necesitamos que nos ayudes en nada", digo. "Lo único que queremos es que nos dejes en--"

          "Nueva hipótesis completada", me interrumpe la bola metálica. "Parece que el método utilizado para entrar en la ciudad sí fue legal, pero la contraseña usada para pasar las puertas fue obtenida de manera ilegal. ¿Es correcto?"

          "¡No!", digo. "¿Por qué dirías eso? ¡Conseguimos la contraseña legalmente! Nos invitó alguien de esta ciudad."

          "Basándose en la información disponible, el protocolo Supervisor ha concluido que el objetivo más probable de su grupo en esta ciudad es asesinar al rey de Ollendor", dice la bola metálica. "¿Es correcto?"
    choices:
      - position: 1
        text: No, ¡eso no es verdad en absoluto!
        effects:
          - set:
              current_scene: b3_ch02b_defective
              b3_ch2_confess: 0
      - position: 2
        text: Vale, ¡nos has pillado! ¿Estás contento ya?
        effects:
