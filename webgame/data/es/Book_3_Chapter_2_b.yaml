              "No estoy muy seguro de quién se supone que eres, chico, pero un desafío es un desafío", dice Gontrok, mientras se aparta de Daren y empieza a dirigirse hacia mí. "Pronto veremos si eres todo palabrería o no."

              El gigante se lanza entonces hacia mí, pero antes de que pueda alcanzar mi posición me elevo muy alto en el aire y salgo de su alcance.

              "¡Oh, ahora ya lo entiendo!", dice Gontrok. "Crees que atacándome desde arriba podrás sacar ventaja. No tienes ni idea de lo equivocado que estás..."

              Entonces al gigante le brotan de la espalda dos alas parecidas a las de un dragón, que usa de inmediato para impulsarse hacia arriba a una velocidad alarmante.
          - source: scene_text_2
            paragraph: 27
            text: |-
