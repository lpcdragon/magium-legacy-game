      - condition: b3_ch2_name = 4
        texts:
          - source: scene_text
            paragraph: 7
            text: |-
              "Digo que lo ignoremos sin más", les digo a todos. "No veo ninguna razón para darle mi nombre a este artilugio volador."

              "No puedes ignorarlo", dice Melindra. "No hará más que seguir molestándote hasta que le des un nombre."

              "Sigamos avanzando hacia el castillo, ¿sí?", digo.

              Melindra se encoge de hombros.

              "Como quieras", dice.

              Luego retoma el paso, guiando de nuevo el camino, mientras todos comenzamos a seguirla despacio.

              "¡Esta es su última advertencia!", dice la bola metálica desde atrás mientras sigue volando tras nosotros. "Identifíquense o se enfrentarán a las consecuencias."

              "¿Cuántas últimas advertencias da esta cosa, exactamente?", digo. "¿No dijo también la última vez que 'no volvería a repetirse'?"

              "Son todas amenazas vacías", dice Melindra. "No hará más que darte últimas advertencias hasta que digas algo. Te lo digo, no hay forma de esquivarlo."
          - source: scene_text_2
            paragraph: 3
            text: |-
              "Negarse a identificarse es una infracción directa de la ley", dice la bola metálica. "Digan su nombre ahora o serán considerados criminales."

              Mientras la bola metálica sigue acosándonos, cada vez más ciudadanos a los que vamos dejando atrás se giran para mirarnos, con expresiones algo inquietas en el rostro.

              "Estamos llamando demasiado la atención con esta cosa siguiéndonos", dice Daren, y luego se gira hacia la bola metálica. "¡Eh, tú! ¡Artilugio volador! Me llamo Daren. ¿Lo entiendes? Da-ren."

              "Designación adquirida", dice la bola metálica. "A partir de ahora serán denominados Da-ren. Que tengan un buen día."

              "Espera, ¿eso era todo?", dice Hadrik mientras la bola metálica se aleja volando de nosotros. "¿No va a preguntar por el resto de nuestros nombres?"

              "Ya dije que estos 'droons' no son precisamente muy inteligentes, ¿no?", dice Melindra.

              "Sí, pero aun así...", dice Hadrik. "¿Ahora va a llamarnos a todos Daren o qué?"

              "Posiblemente", dice Melindra. "No tengo ni idea de cómo han evolucionado estas cabezas de gólem con los años. En cualquier caso, tampoco importa. Sigamos, ¿sí?"
        choices:
