              "Procesando...", dice la bola metálica. "Parece que su grupo no tiene una designación registrada. Buscando... Buscando... La unidad enviada a solicitar su designación no está respondiendo actualmente. Nos pondremos en contacto con ustedes en cuanto identifiquemos la causa del fallo."

              "¿No podríamos simplemente darte el nombre del grupo a ti?", digo. "No hace falta que vayas a buscar esa otra unidad. Vaya a saber uno dónde podría estar escondida. Podría estar en cualquier sitio, la verdad..."

              "Por desgracia, no es posible cambiar la designación del grupo antes de recuperar la unidad defectuosa que fue enviada a identificarlos", dice la bola metálica. "Hasta entonces, su grupo será denominado 'Sin identificar'. Les pedimos disculpas por las molestias."
