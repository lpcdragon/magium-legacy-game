  - name: b3_ch02b_scenario3
    texts:
      - source: scene_text
        paragraph: 47
        text: |-
          "¿Qué pasa, héroe?", dice Gontrok con una sonrisa maliciosa, mientras vuelve a patear a Daren en el estómago justo cuando intentaba ponerse en pie. "¿No se suponía que esta era la parte en la que desafías las probabilidades y haces una remontada espectacular? No me decepciones así... ¡Tenía unas expectativas tan altas contigo!"

          "¡Maldita sea, Gontrok!", digo. "¡¿Qué demonios estás haciendo?! ¡Atácalo ahora, mientras está distraído!"

          "¿Pero de qué demonios estás hablando?...", dice Gontrok, mientras se vuelve hacia mí y deja a Daren en paz por un segundo.

          "¡Del capitán!", digo. "¿Ya se te olvidó todo nuestro plan? Dijiste que debíamos mantener ocupado al capitán para que por fin pudieras librarte de él. Pues ahora es tu oportunidad. ¡Tu capitán está más vulnerable que nunca! Entonces, ¿a qué esperas? ¡Ve y mátalo!"

          "¿De verdad crees que una mentira tan floja podría bastar para--", empieza a decir Gontrok, pero de pronto tanto él como yo nos vemos empujados contra el suelo por una fuerza invisible que nos imposibilita volver a ponernos en pie.

          Cuando muevo un poco la cabeza para ver mejor mi entorno, me doy cuenta de que Leila, Kate y Flower también han sido inmovilizadas y ninguna de ellas puede levantarse por mucho que lo intente.

          "¿Qué demonios crees que estás haciendo, idiota?...", dice Gontrok, forcejeando en vano por liberarse del hechizo de su capitán.
      - source: scene_text_2
        paragraph: 31
        text: |-
          "¡Silencio!", dice el capitán. "Ya me cuesta bastante concentrarme en inmovilizar a todo el mundo como para tener además que averiguar si de verdad intentas traicionarme o no. Loyrang, ven aquí y acaba con estos intrusos, ¿quieres? Me temo que si me alejo de esta posición podría romper la concentración y deshacer el hechizo."

          "Ya le dije que, a menos que el propio rey me lo ordene, no voy a atacar a ninguna de estas personas", dice el guardia de piel oscura, que por lo visto se llama Loyrang.

          "¿Entonces ahora tú también trabajas en mi contra?", dice el capitán.

          "¡No trabajamos en tu contra, imbécil!", dice Gontrok. "Ni siquiera podemos atacar a ninguno de los locales por culpa del hechizo de protección del torneo. ¡¿Cómo se supone exactamente que podríamos hacerte daño?!"

          "Estos forasteros también deberían estar bajo los efectos del hechizo del torneo...", dice el capitán. "Y, sin embargo, eso no pareció impedir que me atacaran."

          "¿Sabes qué?", dice Gontrok. "Tienes razón. Puede que ese hechizo del torneo ni siquiera haya existido nunca. Puede que todo fuera un engaño desde el principio, solo para asustarnos y que no atacáramos a ningún civil. De hecho, ahora mismo me apetece poner a prueba esta teoría."
      - source: scene_3
        paragraph: 14
        text: |-
          Entonces el gigante apoya ambas manos en el suelo y empuja con tanta fuerza que las piedras se agrietan bajo él, mientras consigue ir levantándose muy despacio y con gran dificultad. Luego empieza a avanzar muy lentamente hacia el capitán y cada uno de sus pasos deja un pequeño agujero en el suelo debido a toda la presión que está empujándolo hacia abajo en este momento.

          "¡Pues mírame!", grita Gontrok a pleno pulmón, mientras sigue avanzando hacia su capitán, luchando claramente por mantenerse erguido. "Con hechizo de torneo o sin él, voy a ir hasta ahí y voy a reventarte los dientes, arrogante hijo de puta. Te enseñaré lo que significa meterse con alguien como... espera, ¿alguien más ha oído eso?..."

          De repente, Gontrok se gira a su derecha y pone las manos delante de él y, apenas un instante después, Hadrik pasa como un relámpago a mi lado, alcanza a su viejo amigo en menos de un segundo y le da un puñetazo tan brutal que la onda expansiva del aire nos golpea a todos en la cara cuando su puño choca con las palmas de Gontrok. Aunque sí consigue bloquear el ataque, Gontrok no logra anular por completo los efectos del impacto y sale despedido de lleno contra una pared.

          "Sí que conseguiste dejarme fuera de combate un buen rato, Gontrok...", dice Hadrik. "¡Por suerte, tus gritos de antes fueron justo lo que necesitaba para despertarme!"
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch02b_frail
  - name: b3_ch02b_concept
    texts:
      - source: scene_text
        paragraph: 48
        text: |-
          "¿Qué crees que estoy haciendo?", dice el capitán. "He inmovilizado a tu oponente y, ya puestos, a todos los demás. Date prisa y remátalo, para que luego puedas venir a matar también a los otros. Yo mismo los mataría, pero temo perder la concentración si me muevo demasiado de este sitio."

          "Me das asco", le dice Gontrok al capitán, con una expresión de repugnancia en los ojos. "No voy a matar a un enemigo indefenso que ni siquiera puede defenderse. No es así como los gigantes luchamos."

          "Por favor, dime que estás bromeando...", dice el capitán. "¿Sabes qué? Da igual. No quiero oír la respuesta a esa pregunta. Loyrang, ven aquí y acaba con esta gente, ¿quieres? A este idiota de gigante no se le puede hacer entrar en razón de ninguna manera."

          "Ya le dije que, a menos que el propio rey me lo ordene, no voy a atacar a ninguna de estas personas", dice el guardia de piel oscura, que por lo visto se llama Loyrang.

          "¡Son increíbles!", grita el capitán. "¿De verdad no entienden el concepto básico de lo que significa ser un guardia?"

          "Si tantas ganas tienes de matarlos, entonces puedes venir aquí y hacerlo tú mismo", dice Gontrok. "Yo no voy a ayudarte con tu peno... espera, ¿alguien más ha oído eso?..."
      - source: scene_text_2
        paragraph: 32
        text: |-
          De repente, Gontrok se gira a su derecha y pone las manos delante de él y, apenas un instante después, Hadrik pasa como un relámpago a mi lado, alcanza a su viejo amigo en menos de un segundo y le da un puñetazo tan brutal que la onda expansiva del aire nos golpea a todos en la cara cuando su puño choca con las palmas de Gontrok. Aunque sí consigue bloquear el ataque, Gontrok no logra anular por completo los efectos del impacto y sale despedido de lleno contra una pared.

          "Sí que conseguiste dejarme fuera de combate un buen rato, Gontrok...", dice Hadrik. "¡Por suerte, los gritos de tu capitán de antes fueron justo lo que necesitaba para despertarme!"

          "Y yo que pensaba que te habías ablandado durante todos esos años que has pasado lejos", dice Gontrok, mientras se levanta del suelo y empieza a caminar hacia Hadrik. "Quizá, después de todo, sigas siendo digno de entretenerme. Veamos qué tienes, 'viejo amigo'."

          En cuanto Gontrok deja de hablar, se lanza hacia Hadrik y los dos vuelven a chocar una vez más. Mientras tanto, el capitán parece haber renunciado a intentar que sus compañeros lo ayuden y ahora avanza muy lentamente hacia nosotros, sosteniendo en la mano derecha una pequeña daga que había mantenido escondida hasta ahora.
      - source: scene_3
        paragraph: 15
        text: |-
          Esto es muy malo. Ninguno de los dos puede moverse en este momento, así que no importa cuánto tarde en alcanzarnos: en cuanto llegue aquí, estaremos completamente indefensos contra él. Melindra no ha sido inmovilizada, pero no puede atacar al capitán en absoluto, porque es un local, y Daren parece haber quedado demasiado malherido como para poder curarse de inmediato.

          Cuando el capitán se detiene un momento para asegurarse de no romper por accidente la concentración del hechizo que nos aplasta contra el suelo, Arraka, que había estado notablemente callada hasta este punto, por fin estalla.

          "¡¿Qué demonios les PASA a todos ustedes?!", grita. "¿Para esto los he estado entrenando? ¿Para que los despache un viejo enclenque que se arrastra hacia ustedes con una daguita? ¿No iban a desafiar a los dioses? ¿Cómo pueden ser todos tan increíblemente inútiles?"

          "¡Este viejo enclenque está usando un hechizo que solo he visto lanzar a Eiden y al Dios del Tiempo!", digo. "¿De verdad vas a sostener que aquí estamos luchando contra un simple mago viejo?"
