  - name: b3_ch02b_gontrok2
    texts:
      - source: scene_text
        paragraph: 38
        text: |-
          Gontrok hunde los pies en el suelo y el empedrado se resquebraja bajo él cuando hace una rápida arrancada hacia Hadrik, alcanzándolo en menos de un segundo. Hadrik salta instintivamente hacia atrás, alejándose de nuestro grupo, pero Gontrok va justo detrás de él e intenta golpearlo en el estómago con el puño izquierdo. Hadrik trata de bloquear el golpe de inmediato, pero resulta ser una finta que Gontrok usa para obligar a su oponente a dejar desprotegida la mitad superior del cuerpo. El gigante aprovecha al instante la oportunidad, lo agarra por la cabeza con la mano derecha y le estampa la cara contra el suelo con tanta fuerza que el impacto crea un pequeño cráter y hace saltar trozos de roca en todas direcciones.

          Gontrok no espera a que Hadrik se recupere y, mientras todavía le sujeta la cabeza con firmeza, lanza a Hadrik, aún en su forma de enano, hacia el aire, espera a que vuelva a caer y luego le propina una patada tan brutal que lo hace atravesar diez hileras de casas, lanzándolo tan lejos de nosotros que ni siquiera conseguimos verlo ya. Al ver la pelea que acaba de estallar justo a su lado, muchos de los ciudadanos que nos rodeaban salen ahora corriendo, gritando de terror.
      - source: scene_text_2
        paragraph: 24
        text: |-
          Mientras tanto, Kate ya ha empezado a atacar al capitán, enviando alrededor de un centenar de carámbanos en su dirección, pero todos se detienen en el aire en cuanto llegan a él, luego se giran sobre sí mismos y salen disparados de vuelta hacia su creadora a una velocidad impresionante. Kate consigue conjurar un muro de hielo delante de ella con la rapidez suficiente para defenderse de la lluvia entrante de carámbanos, pero entonces el capitán hace un rápido gesto con la mano derecha y, de algún modo, una fuerza invisible empuja de repente a Kate contra el suelo, restringiendo todos sus movimientos, de forma parecida a como Eiden y el Dios del Tiempo nos inmovilizaron en nuestros primeros encuentros con ellos.

          Flower intenta alzar el vuelo con sus propulsores de fuego, pero la fuerza invisible también la empuja hacia abajo y sigue aplastándola contra el suelo, inmovilizándola por completo. Antes de que el capitán pueda hacer nada más, sin embargo, Leila corre hacia él, obligando al anciano a entrar en combate cuerpo a cuerpo, que claramente no es uno de sus puntos fuertes. Incapaz de esquivar los ataques implacables de Leila, el capitán se ve obligado a repelerla con los mismos ataques de fuerza invisible que usó antes, aunque al parecer esto hace que pierda el control de los hechizos que mantenían a Kate y Flower inmovilizadas, lo que les permite levantarse un poco del suelo y empezar a preparar un contraataque.
      - source: scene_3
        paragraph: 9
        text: |-
          Mientras todos los demás pelean, el guardia de piel oscura cumple su palabra y solo observa desde lejos, recostado contra una pared, con los brazos cruzados y una expresión más bien poco impresionada. Gontrok, en cambio, ahora se acerca lentamente a Daren y a mí, mientras Hadrik sigue sin aparecer por ninguna parte.

          "Quédate detrás de mí, Barry", dice Daren, alzando su escudo.

          "¡Eh, yo te conozco!", dice Gontrok. "Tú eres el sanador con armadura. ¡Vaya, esto es estupendo! Siempre he querido poner a prueba mis habilidades contra un héroe de fama mundial. A ver cuánto aguantan esas leyendas frente al poder de un auténtico guerrero, ¿te parece?"

          Entonces corre hacia Daren y trata de golpearlo directamente, pero el sanador con armadura anticipa sus movimientos y se aparta, dejando que el gigante solo golpee el aire. Antes de que Gontrok recupere el equilibrio, Daren contraataca deprisa con un tajo muy bien medido, aunque parece que no ha sido lo bastante rápido y, de algún modo, su adversario todavía tiene tiempo de dar un gran salto hacia atrás y escapar ileso.

          "¡Eso no ha estado nada mal!", dice Gontrok, mientras Daren vuelve a lanzarse hacia él. "Pero hará falta mucho más que eso para derrotar a un gigante."
