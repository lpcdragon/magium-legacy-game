              Cuando Daren lo alcanza, Gontrok esquiva su primer ataque y luego intenta golpearlo con una patada giratoria al costado. Daren alza el escudo para defenderse, pero eso no le sirve de nada para contrarrestar la inmensa fuerza del golpe, que lo manda volando de lleno contra una pared. Antes de que consiga ponerse en pie, Gontrok ya está a su lado y le propina otra patada en el pecho, lanzándolo de espaldas contra la pared, lo que hace que pierda el agarre de la espada y la deje caer al suelo.

              "Ya no la vas a necesitar", dice Gontrok, mientras recoge su espada y la arroja a un lado. "No adonde vas."

              Una sensación de pánico intenso me invade al ver lo que está ocurriendo delante de mis ojos. Daren no es rival para él. Hadrik sigue desaparecido. Todos los demás están ocupados con el capitán y no pueden ayudarnos. Estoy solo. ¿Cómo me enfrento a esto?

              Ni mi cimitarra ni los virotes de mi ballesta son lo bastante afilados como para atravesar la piel de un gigante. Tiene que haber alguna otra forma de luchar contra él. Tiene que haberla. Sé que si me calmo podré pensar en algo. Lo sé. Entonces, ¿por qué no consigo calmarme?
            condition: b2_ch5_scimitar != 0
          - source: scene_text_2
            paragraph: 25
            text: |-
              Mientras mi cuerpo tiembla sin control, de pronto noto varias corrientes de aire empezando a fluir a mi alrededor y, por alguna razón, la sensación del viento desplazándose lentamente contra mi piel tiene un efecto extrañamente calmante en mí, que me ayuda a recobrar la compostura y a dejar de temblar. Me doy cuenta al instante de que se trata del hechizo de vuelo de Melindra y, cuando me giro para mirarla, ella me dedica una mirada muy seria y asiente en dirección a Daren, que todavía está siendo pateado de un lado a otro por Gontrok.

              Me está diciendo que vaya a ayudarlo. Pero ¿cómo?

              Al mirar a mi alrededor para ver de qué podría servirme, me doy cuenta de que la espada de Daren está simplemente tirada en el suelo, lista para que la coja. Sí... con un arma así debería poder hacerle daño al gigante. Es decir, siempre que logre acertarle...
          - source: scene_3
            paragraph: 11
            text: Justo cuando intento decidir qué estrategia usar, de pronto se me cruza una idea por la cabeza. ¿No me dijo antes aquel dron de ojos verdes que el capitán no confía en los reclutas nuevos? Incluso llegó a sugerirme que podría usar ese conflicto a mi favor en una pelea. Por lo que entendí, el problema que tienen es que el capitán cree que Gontrok y el otro tipo planean robar de su tesoro. Me pregunto qué pasaría si removiera un poco el avispero...
