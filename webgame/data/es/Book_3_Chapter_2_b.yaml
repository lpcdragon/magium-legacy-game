  - name: b3_ch02b_scenario0
    routes:
      - condition: b3_ch1_unlock = 2
        texts:
          - source: scene_text
            paragraph: 41
            text: |-
              "¿Qué pasa, héroe?", dice Gontrok con una sonrisa maliciosa, mientras vuelve a patear a Daren en el estómago justo cuando intentaba ponerse en pie. "¿No se suponía que esta era la parte en la que desafías las probabilidades y haces una remontada espectacular? No me decepciones así... ¡Tenía unas expectativas tan altas contigo!"

              "Si quieres un duelo de verdad, ¡ven aquí!", digo, mientras recojo la espada de Daren del suelo y miro al gigante. "Te aseguro que haré que merezca la pena."

              "No estoy muy seguro de quién se supone que eres, chico, pero un desafío es un desafío", dice Gontrok, mientras se aparta de Daren y empieza a dirigirse hacia mí. "Pronto veremos si eres todo palabrería o no."

              Entonces el gigante se lanza hacia mí y yo salto hacia atrás, intentando alejarme de él lo más rápido posible.

              Gontrok, sin embargo, es mucho más rápido que yo y consigue cerrar la distancia en menos de un segundo, sujetándome la cabeza con la mano derecha.

              "Patético", dice, mientras me hace exactamente lo mismo que le hizo a Hadrik, estrellándome la cara contra el suelo y matándome al instante.
        effects:
          - set:
              failed_checks:
                - '[ Dispositivo de estadísticas bloqueado - comprobación fallida ]'
              is_dead: 1
