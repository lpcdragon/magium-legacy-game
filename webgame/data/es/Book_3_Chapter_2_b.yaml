              current_scene: b3_ch02b_defective
              b3_ch2_confess: 1
  - name: b3_ch02b_defective
    routes:
      - condition: b3_ch2_confess = 0
        texts:
          - source: scene_text
            paragraph: 14
            text: |-
              "No, ¡eso no es verdad en absoluto!"

              "Procesando...", dice la bola metálica. "Parece que el protocolo Supervisor no ha sido capaz de asistirlos adecuadamente. Por desgracia, este protocolo sigue siendo experimental y, por lo tanto, puede que no siempre les proporcione exactamente la orientación que necesitan. Dado que esta unidad no parece capaz de proporcionarles la información que solicitaron, se les recomienda contactar con uno de los guardias de la ciudad, que con mucho gusto los ayudará en lo que puedan necesitar. Les pedimos disculpas por las molestias. ¡Que tengan un buen día!"

              "Vaya, joder...", dice Hadrik mientras la bola metálica se aleja volando de nosotros. "Estaba casi seguro de que el maldito artilugio daría la alarma después de todo lo que acaba de decir. ¿Creen que existe el riesgo de que la cabeza de gólem le cuente a alguien más todo ese 'análisis'?"
          - source: scene_text_2
            paragraph: 6
            text: |-
              "No lo sé, pero no me gusta la forma en que todo el mundo nos mira", dice Daren, mientras asiente con la cabeza hacia unos cuantos ciudadanos que nos observan desde la distancia con expresiones ligeramente inquietas en el rostro. "No estoy seguro de cuánto oyó esta gente de lo que acaba de decir la cabeza de gólem, pero será mejor que nos marchemos antes de que resultemos aún más sospechosos de lo que ya parecemos."

              "Entonces, ¿cómo crees que esa bola metálica averiguó todas esas cosas sobre nosotros?", le pregunta Hadrik a Daren en voz baja, mientras nos alejamos de la gente que nos estaba mirando.

              "Es posible que nos hayan estado vigilando desde antes de que entráramos en la ciudad", dice Daren. "Melindra dijo que estos 'droons' se construyeron originalmente con fines de vigilancia y admito que no he estado prestándole mucha atención al cielo desde que llegamos aquí."

              "Pero si sabían lo que estábamos haciendo incluso antes de pasar las puertas, ¿por qué nos dejarían llegar tan lejos?", dice Hadrik.

              "Quién sabe", dice Daren. "Podría ser una trampa de algún tipo. O quizá su sistema de vigilancia sea defectuoso y las bolas metálicas aún no hayan informado de nosotros a nadie que esté al mando. Cualquiera sabe. No podemos hacer mucho al respecto salvo mantener la guardia alta y esperar lo mejor. Esto es territorio desconocido para nosotros, así que debemos asumir que hay enemigos tras cada esquina hasta que se demuestre lo contrario. Melindra, ¿cuánto falta hasta llegar a esa plaza que mencionaste?"
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch02b_pajamas
      - condition: b3_ch2_confess = 1
        texts:
          - source: scene_text
            paragraph: 15
            text: |-
              "Vale, ¡nos has pillado! ¿Estás contento ya?"

              "Consulta recibida correctamente", dice la bola metálica. "Permanezcan a la espera. El protocolo Supervisor intentará asistirlos ahora lo mejor posible."

              "Espera, ¿qué?...", dice Hadrik.

              "Calculando sus probabilidades de éxito para asesinar al rey de Ollendor", dice la bola metálica. "Cálculo completado. Por desgracia, sus probabilidades de completar con éxito semejante tarea son muy bajas. ¿Quieren oír un análisis más detallado?"

              "Eh... claro...", digo. "¿Por qué no?"

              "Dado el nivel de fuerza estimado de su grupo, el desenlace más probable es que sean derrotados por la guardia real de Ollendor antes de llegar a su objetivo", dice la bola metálica. "Existe, sin embargo, un escenario en el que podrían entretenerlos el tiempo suficiente como para asesinar al rey, aunque es probable que aun así murieran poco después."

              "¿Y cuál es ese escenario?", digo.
          - source: scene_text_2
            paragraph: 7
            text: |-
              "Tendrían que aprovechar las tensiones cada vez mayores entre los miembros antiguos de la guardia real y los más nuevos, que solo se unieron hace poco, durante el torneo del Magium", dice la bola metálica. "Algunos de los miembros veteranos sospechan actualmente que los nuevos solo buscaron reclutarse en la guardia real para poder acceder fácilmente al tesoro y robarle al reino. El líder del grupo, en particular, siempre vigila de cerca a los miembros nuevos y se asegura de no dejarlos caminar nunca sin supervisión. Si generaran un conflicto interno dentro de las filas de la guardia real usando esta información, sus probabilidades de éxito aumentarían ligeramente."

              "No me digas...", le digo al 'droon'. "¿Y qué hay de otros escenarios en los que pudiéramos entretener a la guardia real? ¿Tienes algún otro consejo útil que darnos?"

              "Por desgracia, el protocolo Supervisor no tiene más información que ofrecerles sobre este tema", dice la bola metálica. "Tengan en cuenta que el protocolo Supervisor sigue siendo experimental y, por lo tanto, puede que no siempre sea capaz de darles exactamente la orientación que necesitan. Dado que esta unidad no parece capaz de proporcionarles información adicional, se les recomienda contactar con uno de los guardias de la ciudad, que con mucho gusto los ayudará si necesitan cualquier otra cosa. Les pedimos disculpas por las molestias. ¡Que tengan un buen día!"

              "Vaya, joder...", dice Hadrik mientras la bola metálica se aleja volando de nosotros. "¿Suponen que podemos fiarnos de algo de lo que dijo? ¿O podría tratarse de una trampa muy elaborada?"
