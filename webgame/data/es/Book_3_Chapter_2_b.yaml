  - name: b3_ch02b_teleported
    texts:
      - source: scene_text
        paragraph: 50
        text: |-
          "¡No está usando un hechizo, cretino!", dice Arraka. "¡Está usando manipulación de aura! Ha expandido su aura para cubrir toda esta zona y luego ha empezado a aplastarlos con ella. Incluso hay un punto focal fácilmente reconocible flotando en el aire delante de ustedes que está usando para ayudarlo a controlar las fluctuaciones de su aura. Está justo allí, ¡miren! ¿Quieren que se lo coloree?"

          De repente, una pequeña esfera de luz roja aparece frente a nosotros, a varios pies del suelo.

          "¡Ahí está!", dice Arraka. "Ahora afilen sus elementos y dispárenle. ¡Disparen!"

          Kate no espera a que Arraka se lo repita y envía de inmediato un cono de hielo directamente hacia la orbe roja de luz que flota en el aire. En cuanto la golpea, la bola roja de luz se desvanece y ya puedo sentir cómo se debilita la presión sobre mí, aunque no desaparece del todo. Leila es la primera que consigue liberarse de la fuerza invisible que la empuja contra el suelo y enseguida vuelve a presionar al capitán, mientras el resto seguimos intentando levantarnos.

          Justo cuando estábamos a punto de liberarnos nosotros también, sentimos que el aire se vuelve pesado sobre nosotros y, una vez más, nos vemos empujados contra el suelo.

          "¡Mierda!", dice Arraka. "Ha creado otro punto focal, pero lo está moviendo y no puedo colorearlo bien. Esto sería muchísimo más fácil si ustedes, zoquetes, pudieran verlo por sí mismos. Bueno, al menos la chica muda sigue en la pelea, así que nuestros esfuerzos no fueron un desperdicio total."
      - source: scene_text_2
        paragraph: 34
        text: |-
          Mientras Leila pelea contra el capitán, podemos sentir cómo la fuerza invisible sobre nosotros se vuelve débil y luego poderosa otra vez, a medida que el anciano lucha por mantener la concentración. Mientras tanto, Hadrik y Gontrok siguen peleando y parece que Gontrok vuelve a ir ganando, aunque esta vez la pelea sí parece estar más igualada.

          Mientras todos seguimos intentando incorporarnos del suelo, de pronto oímos una explosión procedente de la pantalla holográfica, donde la ceremonia seguía mostrándose.

          "¿Qué ha sido eso?", dice el rey de Ollendor con un tono ligeramente presa del pánico. "¿De dónde ha salido esa explosión?"

          "Parecía venir de dentro de este mismo edificio, mi señor", dice el gran sacerdote.

          "¡Por los dioses!", dice el rey. "¡Entonces esto debe de estar relacionado con el gran desafío que nuestro Creador dijo que afrontaríamos pronto!"

          "En realidad, esto no es...", empieza a decir Eiden, pero el rey lo interrumpe.
      - source: scene_3
        paragraph: 16
        text: |-
          "¡No se preocupe, Creador!", dice el rey. "¡Le demostraremos que nuestro reino es lo bastante fuerte para afrontar cualquier peligro! De hecho, llamaré a mis guardias más hábiles para que este problema se resuelva lo antes posible. Verá, tengo aquí en el bolsillo un dispositivo que solo debo usar en caso de emergencia extrema y, en cuanto pulse este botón, todos los guardias reales serán teletransportados cerca de mi posición."

          "No...", dice Gontrok, incrédulo. "No lo hará."

          "¡Interrumpan la transmisión!", dice el rey, al tiempo que pulsa el botón de su dispositivo. "Tendremos que reanudar la ceremonia en otro momento."

          Mientras la gran pantalla holográfica va desapareciendo poco a poco, los tres guardias reales quedan envueltos en una luz blanca, lo que significa que solo les quedan unos segundos antes de ser teletransportados fuera de la zona.

          "¡Maldita sea!", dice Gontrok, mientras la luz blanca que lo rodea se vuelve más intensa. "¡Estúpido rey! No puedo creer que--"

          Antes de que el gigante termine la frase, tanto él como los otros dos guardias son teletransportados lejos de nosotros y, como resultado, la fuerza invisible que nos estaba clavando contra el suelo por fin desaparece. Cuando nos levantamos, Hadrik empieza a caminar hacia nosotros y, al acercarse, vemos que está lleno de moratones y que tiene una de las mejillas roja e hinchada.

          "Así que... una explosión, ¿eh?", dice Hadrik. "Me pregunto de qué habrá ido todo eso..."
