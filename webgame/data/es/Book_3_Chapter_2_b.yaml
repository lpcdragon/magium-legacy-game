        texts:
          - source: scene_text
            paragraph: 18
            text: |-
              En cuanto los carámbanos están listos, Kate los dispara hacia todas las bolas metálicas a la vez, apuntando a los ojos. Sin embargo, en un giro inesperado de los acontecimientos, la mayoría de las cabezas de gólem voladoras consigue esquivar los carámbanos de Kate con facilidad y ahora se lanzan en picado hacia nosotros, disparando varios tipos de rayos y proyectiles mágicos desde sus ojos rojos.

              Rápidamente echo a volar, evitando por los pelos que uno de los rayos de hielo de las cabezas de gólem me alcance, y entonces saco la ballesta con la esperanza de poder derribar las bolas metálicas antes de que tengan la oportunidad de abrumarme con sus ataques. Las que usan ataques eléctricos y ácidos me parecen las más peligrosas, así que decido centrarme primero en ellas.

              Por desgracia, antes siquiera de que pueda efectuar mi primer disparo, me doy cuenta de pronto de que las cabezas de gólem voladoras han dejado por completo de perseguir a mis amigos y ahora todas y cada una de ellas vienen hacia mí. Deben de haber recibido la instrucción de dar prioridad a los objetivos aéreos sobre los terrestres. Qué suerte la mía.

              Intento volver hacia el suelo, pero las bolas metálicas me han rodeado por completo y también se me acercan desde abajo.

              Kate y Flower ya han empezado a derribar algunas de las cabezas de gólem, pero no fueron lo bastante rápidas. Antes siquiera de que tenga oportunidad de moverme, una de las bolas metálicas me aturde con un ataque eléctrico, mientras otra me derrite toda la cabeza con un chorro de ácido en cuestión de segundos.
