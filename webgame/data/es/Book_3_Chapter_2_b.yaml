        texts:
          - source: scene_text
            paragraph: 6
            text: |-
              En lugar de darle una respuesta a la bola metálica, saco mi daga y se la clavo en el ojo. La esfera voladora se retuerce un poco mientras emite unos extraños ruidos monótonos, pero luego la luz de su ojo se apaga, la hélice se va deteniendo poco a poco y el supuesto 'droon' se estrella contra el suelo, sin vida.

              "Vaya...", digo. "La verdad es que esperaba que se activara algún tipo de mecanismo de defensa o algo así."

              "Ya te lo dije", dice Melindra. "Estos artilugios voladores son completamente inútiles. No son más que una pérdida de espacio. En fin, da igual. Ahora que el 'droon' está muerto, ya no debería volver a molestarnos. Sigamos, ¿sí?"
        choices:
