  - name: b3_ch02b_major
    routes:
      - condition: b3_ch1_unlock = 2
        texts:
          - source: scene_text
            paragraph: 34
            text: |-
              "Incluso si interfiere, no creo que vaya a ser nada demasiado grave."

              "Sí, eso es más o menos lo que yo también pienso", dice Melindra. "Si va a hacer algo, seguramente solo será dar algún consejo críptico al rey y a sus seguidores, nada más. En fin, olvidémonos de Eiden por ahora. Estoy bastante segura de que ya he averiguado por dónde tenemos que seguir. Vengan por aquí."

