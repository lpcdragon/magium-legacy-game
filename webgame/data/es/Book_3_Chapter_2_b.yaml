            paragraph: 37
            text: |-
              "Gontrok...", dice Hadrik, con una expresión inusualmente sombría en los ojos.

              "No pareces muy feliz de verme, Hadrik", dice Gontrok. "¿Qué pasa? No irás a decirme en serio que todavía me guardas rencor por aquello de la aldea de los enanos de hace tantos años, ¿verdad? Aunque, pensándolo bien, supongo que no serías el Hadrik que yo conocí si no fueras de los que guardan rencores eternos por las cosas más insignificantes que puedan imaginarse."

              Gontrok se echa entonces a reír a carcajadas, mientras Hadrik parece capaz de asesinar a su viejo 'amigo' aquí mismo y ahora mismo.

              "Supongo que conoces a este enano, recluta?...", dice el hombre de mayor rango.

              "Ese hombre no es ningún enano, capitán", dice Gontrok. "Es un gigante, igual que yo. Probablemente uno de los organizadores del torneo le ordenó que permaneciera en forma de enano si no quería que lo expulsaran, igual que a mí me dijeron que me quedara en forma humana. Todos los gigantes que quieren viajar fuera de su país tienen que aprender magia de cambio de forma para hacerse más pequeños, o no los aceptarán en otras sociedades."
