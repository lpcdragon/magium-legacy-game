              Ni mi cimitarra ni los virotes de mi ballesta son lo bastante afilados como para atravesar la piel de un gigante. Tiene que haber alguna otra forma de luchar contra él. Tiene que haberla. Sé que si me calmo podré pensar en algo. Lo sé. Entonces, ¿por qué no consigo calmarme?
            condition: b2_ch5_scimitar != 0
          - source: scene_text_2
            paragraph: 25
            text: |-
              Mientras mi cuerpo tiembla sin control, de pronto noto varias corrientes de aire empezando a fluir a mi alrededor y, por alguna razón, la sensación del viento desplazándose lentamente contra mi piel tiene un efecto extrañamente calmante en mí, que me ayuda a recobrar la compostura y a dejar de temblar. Me doy cuenta al instante de que se trata del hechizo de vuelo de Melindra y, cuando me giro para mirarla, ella me dedica una mirada muy seria y asiente en dirección a Daren, que todavía está siendo pateado de un lado a otro por Gontrok.

              Me está diciendo que vaya a ayudarlo. Pero ¿cómo?

              Al mirar a mi alrededor para ver de qué podría servirme, me doy cuenta de que la espada de Daren está simplemente tirada en el suelo, lista para que la coja. Sí... con un arma así debería poder hacerle daño al gigante. Es decir, siempre que logre acertarle...
