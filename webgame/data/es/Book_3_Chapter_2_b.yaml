            paragraph: 22
            text: |-
              "No me importa la historia de tu raza, recluta", dice el capitán con tono frío. "Lo que sí quiero saber, en cambio, es quién invitó a todos estos participantes del torneo a nuestra ciudad. Díganme, viajeros, ¿cuál es el nombre del ciudadano de Ollendor que les dio la contraseña?"

              "No podemos decirle su nombre", dice Daren. "Nos pidió que mantuviéramos en secreto su identidad."

              "A la guardia real no se le ocultan secretos", dice el capitán. "Solo se lo preguntaré una vez más. ¿Cómo se llama la persona que los invitó aquí?"

              Gontrok se ríe.

              "Sabes perfectamente que nadie los invitó", dice. "Probablemente oyeron a unos aldeanos hablar de la contraseña o algo así y luego le contaron al guardia de la entrada la misma historia que nos contaron a nosotros."

              "Si no van a darme un nombre, entonces tendremos que ponerlos bajo custodia", nos dice el capitán.

              "¿Y si nos negamos a acompañarlos?", pregunta Daren.

              "Entonces los ejecutaremos en el acto", dice el capitán.

              "¡Eso sí que es lo que estaba esperando oír!", dice Gontrok. "Para ser totalmente sincero, llevo mucho tiempo deseando volver a pelear con Hadrik y no creo que vaya a tener nunca una oportunidad mejor que esta. ¡Ustedes dos quédense atrás! ¡Yo solo bastaré para acabar con todos ellos!"
            condition: b3_ch2_infiltration = 3
          - source: scene_text_2
            paragraph: 23
            text: |-
              "No me importa la historia de tu raza, recluta", dice el capitán, con tono frío. "Lo que sí me importa, sin embargo, es la razón por la que estos criminales siguen sin haber sido apresados por nuestros guardias de la ciudad. Por las descripciones que recibimos, estos son claramente los maleantes que destruyeron nuestras puertas principales e invadieron nuestra ciudad."

              "Mientras nos ocupemos nosotros mismos de ellos, tampoco importa tanto, ¿verdad, capitán?", dice Gontrok. "Para ser totalmente sincero, llevo mucho tiempo deseando volver a pelear con Hadrik y no creo que vaya a tener nunca una oportunidad mejor que esta. ¡Ustedes dos quédense atrás! ¡Yo solo bastaré para acabar con todos ellos!"
            condition: b3_ch2_goblins != 3 AND b3_ch2_goblins != 4 AND b3_ch2_infiltration != 3
          - source: scene_3
            paragraph: 8
            text: |-
              "Aunque no me lo hubieras pedido, tampoco me habría unido a la pelea", dice el guardia real de piel oscura. "Nuestras órdenes del rey eran defender la plaza de posibles atacantes, no buscar peleas al azar con forasteros. Si de verdad estas personas son unos infractores, que se encarguen de ellos los guardias de la ciudad. ¿Por qué tenemos que involucrarnos nosotros?"

              "¡¿Es que no se dan cuenta de que esto es insubordinación?!", dice el capitán. "¡Les ordeno ahora mismo que peleen en equipo o me aseguraré de que sufran las consecuencias!"

              "Cállate", dice Gontrok. "No tengo que obedecerte. Yo solo recibo órdenes del rey. Si no te gusta cómo manejo las cosas, ve y presenta una queja. Mientras tanto, voy a empezar deshaciéndome rápido de mi buen viejo amigo de allí."

              "¿De verdad crees que puedes enfrentarte tú solo a mí?", pregunta Hadrik, con una sonrisa algo forzada.

              "Quizá lo hayas olvidado, Hadrik", dice Gontrok, "pero aprendí muchos de los puntos débiles de tu estilo de combate cuando entrenábamos una y otra vez en nuestra tierra natal. Tú seguramente aprendiste muchos de mis puntos débiles también, pero he trabajado duro para superarlos en estos últimos años y ya he cambiado mi estilo de combate drásticamente. Pero la cuestión es... ¿cambiaste tú el tuyo?"
