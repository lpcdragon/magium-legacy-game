              "Bueno... sé que le gusta jugar Met-Zek", digo. "Tal vez podrías invitarlo a jugar un partido contigo y ver cómo van las cosas a partir de ahí".

              "Met-Zek, ¿eh?..." dice Diane. "Ha pasado un tiempo desde que lo jugué, pero creo que todavía recuerdo las reglas. ¡Quizás lo intente!"

              "¡Ese es el espíritu!" digo. "Y oye, si las cosas no funcionan con Hadrik, ¡siempre puedes probar con Arraka! Es posible que uno no pueda darse cuenta a primera vista, pero ella es el tipo de persona que siempre te escucha y que te ayudará en tus momentos de necesidad. ¡Estoy seguro de que le encantaría tu compañía!"
