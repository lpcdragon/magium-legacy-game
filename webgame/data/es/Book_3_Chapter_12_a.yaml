            paragraph: 27
            text: |-
              "No estoy segura si debería sentirme aliviado o preocupado de que te sientas cómoda bromeando sobre esto", le digo, mientras le doy temporalmente la espalda para poner mi mochila en el suelo y sacar mi cuaderno.

              De repente, siento una ligera bofetada en la nuca, proveniente de Diane.

              "Cuando alguien bromea sobre un evento doloroso de su pasado, es una cortesía común responder también con una broma, para no hacer las cosas incómodas", me dice Diane. "¡Ahora intentémoslo una vez más!"

              "Umm... ¿podrías tal vez repetir el chiste otra vez?" Le digo. "Creo que mi memoria podría haberse vuelto un poco confusa después de esa bofetada en la cabeza".

              Al oír lo que tenía que decir, Diane deja escapar una breve carcajada antes de responderme.

              "Está bien, esa no era exactamente la respuesta que esperaba", dice, "pero me hiciste reír un poco, así que te dejaré ir con una severa advertencia por ahora".

              "¡Tienes mi agradecimiento!" Digo, mientras hago una reverencia.

              "Entonces... ¿con qué hechizo planeas comenzar?" Me pregunta Diane.
          - source: scene_text_2
            paragraph: 21
            text: |-
              "Estaba pensando en empezar con el hechizo de mareo que mencioné antes, durante nuestra sesión de bebida", digo. "¿Estaría bien si te pidiera que describieras con el mayor detalle posible exactamente lo que sientes en los primeros segundos después de que te lancé el hechizo? Estoy tratando de descubrir si puedo sacarle algún uso o no".

              "Uh... tengo una protección contra los mareos en este momento", dice Diane. "¿Debería quitarlo primero, o--"

              "¡No, no, eso es perfecto!" digo. "La mayoría de los enemigos probablemente también tendrán esa protección, por lo que es una buena idea hacer una prueba también en estas condiciones".

              "Muy bien, entonces", dice Diane. "¡Cuando estés listo!"

              Tan pronto como termino de revisar mi cuaderno, me pongo en posición y lanzo el hechizo de mareo sobre Diane. Tal como era de esperar, su protección mágica la defiende fácilmente contra mi ataque, pero sentí como si se distrajera un poco durante unos segundos justo después de terminar de lanzarlo. Me pregunto si el hechizo de mareo podría tener algunos efectos secundarios que desconozco.

              "Entonces, umm... ¡pregunta rápida!" Diane dice. "¿Se suponía que iba a escuchar un zumbido en mis oídos cuando me lanzaste el hechizo?"

              "Yo... no puedo decir que haya escuchado antes describir este efecto para este hechizo en particular", digo. "Pero, de nuevo, cuanto menos conocido es un hechizo, más posibilidades hay de que sus efectos secundarios no se documenten adecuadamente, por lo que no estoy tan sorprendido. ¿Cómo sonó este timbre? ¿Fue agudo? ¿Hubo breves pausas entre los ruidos de timbre cada medio segundo aproximadamente?"
          - source: scene_3
            paragraph: 13
            text: |-
              "¡Sí, exactamente!" Diane dice. "¿Cómo lo supiste?"

              "Hice una suposición descabellada, porque los síntomas que describiste sonaban muy similares a los que tienes en los primeros segundos después de que alguien te arroja el aturdimiento de Wolford", digo. "De hecho, me di cuenta de que los dos hechizos tenían una sorprendente cantidad de similitudes en términos de flujo, pero no pensé que siquiera compartirían algunos de los efectos. Esto es muy interesante. Tal vez en lugar de tratar de darles a las personas un ligero dolor de cabeza, podría concentrarme en engañarlos haciéndoles pensar que estoy tratando de lanzarles el hechizo de Wolford. Parece que eso podría brindarles una mejor distracción".

              "Entonces, ¿quieres que cancele mi protección contra los mareos ahora o?..." me pregunta Diane.

              "Te lanzaré el hechizo una vez más para asegurarme de que los efectos sigan siendo los mismos, y luego haremos la prueba sin la protección mágica", digo. "Si no te importa, por supuesto."

              "Claro, claro, no hay problema", dice Diane.
