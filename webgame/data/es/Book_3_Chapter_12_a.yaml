  - name: b3_ch12a_predict
    routes:
      - condition: magical_sense < 4
        texts:
          - source: scene_text
            paragraph: 8
            text: |-
              Muy bien, veamos qué tenemos aquí.

              Claramente, tiene que haber algún tipo de pista en el flujo del aura de Hadrik que pueda mostrarme hacia dónde se moverá a continuación. Todo lo que necesito hacer es encontrarlo. ¿Qué tan difícil puede ser eso, verdad?

              Después de simplemente mirar fijamente a Hadrik durante unos treinta segundos, tratando de descubrir algo que pudiera ayudarme a predecir sus próximos movimientos, el enano finalmente renuncia a sus intentos de provocarme y levanta su botella del suelo.

              "Bueno, Barry, se acabó tu minuto", dice Hadrik. "Quizás intentarlo un poco más la próxima vez, ¿no?"
          - source: scene_text_2
            paragraph: 6
            text: |-
              "¡Espera, al menos déjame lanzar un hechizo!" Le digo.

              "En otro momento, Barry", dice Hadrik, y luego se despide.

              Al darme cuenta de que no recibiré más ayuda de él, decido sacar mi cuaderno nuevamente y volver a catalogar mi hechizos disponible.
          - source: scene_3
            paragraph: 5
            text: |-
              Unos diez minutos más tarde, Arraka finalmente me llama para que pueda asignarme mi nueva tarea.

              "Muy bien, chico Barry, veamos los frutos de tu trabajo", dice Arraka. "Adelante, dispara una flecha de fuego a ese árbol de allí".

              "No va a funcionar", le digo. "Sé lo que estás tratando de hacer, pero simplemente no está sucediendo".

              "Está bien, te lo preguntaré una vez más", dice Arraka. "¿Lanzaste o no hechizos en el Plano Etéreo imaginando el flujo exacto y la intensidad de cada partícula mágica individual y luego controlándolas sin problemas?"

              "Sí, pero ese es un plano completamente diferente de--"

              "Un simple 'sí' será suficiente", me interrumpe Arraka. "Ahora, ¿puedes pensar en un hechizo con un flujo más fácil de controlar que una 'flecha de fuego'?"

              "En realidad no, pero--"

              "Entonces cállate y hazlo", dice Arraka. "Siempre que hagas exactamente lo mismo que hiciste en el Plano Etéreo, funcionará".
        effects:
          - set:
              failed_checks:
                - '[ Comprobación de sentido mágico fallida - nivel 4 ]'
              b3_ch12_hadrik: 0
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch12a_hermit
      - condition: magical_sense = 4 AND perception < 4
        texts:
          - source: scene_text
            paragraph: 9
            text: |-
              Veamos qué tenemos aquí...

              Bien, entonces claramente algo está sucediendo con su aura justo antes de correr en cualquier dirección determinada. Lógicamente hablando, debería poder leer estos flujos para predecir sus próximos movimientos, pero que me condenen si puedo encontrarle algún sentido.

              Después de unos treinta segundos de simplemente mirar a Hadrik, tratando de descubrir hacia dónde correrá a continuación, el enano finalmente renuncia a sus intentos de provocarme y levanta su botella del suelo.
          - source: scene_text_2
