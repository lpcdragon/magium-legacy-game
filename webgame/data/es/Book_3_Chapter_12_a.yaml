            paragraph: 39
            text: |-
              "¿Has intentado hacerla perder el control de sus emociones?"

              "No, eso no me ayudaría en lo más mínimo", dice Arraka.

              "¿Por qué no?" Le pregunto. "Debería tener más dificultades para controlar su aura si no está completamente tranquila, ¿no?"

              "El objetivo de su técnica del aura es hacer que el flujo de su aura sea tan errático que sea imposible saber si tiene el control de sus emociones o no", dice Arraka. "Al menos cuando está tranquila, sé que en su mayor parte está fingiendo, así que puedo tratar de encontrar un patrón dentro de sus flujos de aura. Hacerla perder la calma en realidad me haría más difícil saber cuáles de las interrupciones en su flujo son falsas y cuáles no".

              "Bueno, parece que sabes lo que estás haciendo, así que supongo que te dejaré con eso y entonces me iré a mi turno de noche", le digo. "¡Más tarde!"

              "Mmm", dice Arraka.

              "¡Hasta luego, Barry!" Flower me lo dice.

              Me despido de Flower y luego voy directamente al lugar en el bosque donde Daren y yo acordamos encontrarnos. Elegimos un lugar donde estaríamos lo suficientemente cerca de nuestro campamento para detectar cualquier enemigo entrante con nuestro sentido mágico, pero también lo suficientemente lejos de todos como para no despertarlos con el sonido de nuestras voces.
