  - name: b3_ch12a_inevitable
    routes:
      - condition: b3_ch12_conflicted = 0
        texts:
          - source: scene_text
            paragraph: 42
            text: |-
              "¿No destruyó ya una ciudad entera? Yo diría que es un poco tarde para arrepentirse".

              "No apruebo lo que ha hecho", dice Daren. "Pero si realmente pudiera cambiar y usar sus poderes para el bien una vez más, ¡hay tantas cosas que podría hacer para ayudar a otras personas! ¿No sería mejor para todos si pasara el resto de su vida tratando de corregir sus errores, que si simplemente fuera ejecutado?"

              "¿Pero hay realmente una garantía de que no se rendirá otra vez?" digo. "¿Quizás no ahora, pero dentro de unos años?"

              "Al menos mientras estemos vivos, podríamos estar allí para guiarlo por el camino correcto", dice Daren. "Para él es un desperdicio tener tanto poder y no utilizarlo para mejorar la vida de las personas. Especialmente ahora que sé que tiene el potencial de cambiar, debido a sus arrepentimientos".

              "Con arrepentimiento o sin arrepentimiento, todavía existe el hecho de que sus acciones causarán la destrucción de todas las ciudades varathianas", digo. "Él mismo lo admitió. Es natural que los Lessathi y los reyes de Varathia quieran defenderse de él".

              "Pero Eiden sólo estaría destruyendo las ciudades debido a su inevitable lucha contra Tyrath, ¿verdad?" Daren dice. "En ese caso, ¿no crees que sería una mejor idea detener Tyrath en lugar de Eiden?"
          - source: scene_text_2
            paragraph: 35
            text: |-
              "Francamente", digo, "después de lo que descubrimos por Meridith, estoy empezando a pensar que los dos viejos enemigos de la profecía podrían ser en realidad Eiden y Lessathi, en lugar de Eiden y Tyrath como pensábamos originalmente. Sé que técnicamente 'se puso de su lado' durante el invierno tranquilo, según Melindra, pero Meridith claramente no ve las cosas de esa manera, y obviamente se está preparando para algún tipo de gran enfrentamiento con Eiden al final de este torneo, por lo que no me sorprendería si fuera su pelea la que desencadenara la destrucción de las ciudades varathianas".

              "...Pensé que era el propio Magium el que nos envió esta profecía", dice Daren. "¿Por qué enviaría una profecía sobre este conflicto y al mismo tiempo se pondría activamente del lado de una de las facciones opuestas y ayudaría a crear el conflicto en primer lugar?"

              "Según Arraka, el propio Magium y los fragmentos de Magium son entidades separadas", digo. "Este fragmento en particular parece haber estado usando el nodo Magium dentro de la base Lessathi para comunicarse con Meridith y hacer estos planes durante bastante tiempo, lo que me hace pensar que esta profecía reciente no es en realidad su principal preocupación, y su verdadero propósito es matar a Eiden. Me pregunto si este no es por casualidad el mismo fragmento de Magium que le dio a Eiden el conocimiento secreto que necesitaba para derrotar a Arraka, y ahora decidió que ha estado usando ese conocimiento durante demasiado tiempo y necesita ser eliminado de la ecuación".

              "Todo esto me resulta muy confuso", afirma Daren. "Si este 'fragmento' de Magium realmente quiere que Eiden muera, entonces ¿por qué no lo borra? ¿Por qué necesita que nosotros o los Lessathi hagamos el trabajo en su lugar?"
          - source: scene_3
            paragraph: 24
            text: |-
              "No puedo decir que sea un experto en esto, pero estos fragmentos parecen tener ciertas limitaciones al interactuar con nuestro mundo", digo. "Pensando en retrospectiva, las únicas ocasiones en las que un fragmento Magium estuvo a punto de borrarme sucedieron dentro del reino Magium o poco después de que los cristales azules despertaran. La primera vez, ya estábamos dentro del reino Magium cuando fuimos atacados. Esta vez más reciente, fuimos arrastrados hacia el interior del reino, pero solo porque estábamos parados cerca del nodo, por lo que es posible que el nodo no permita que el fragmento interactúe con nuestro Además, si no recuerdo mal, el fragmento Magium que estaba buscando el Arraka del pasado decía que iba a deshacer todo este universo de sus costuras solo para descubrir dónde se escondía Arraka. Si necesita hacer algo tan drástico solo para encontrar a una persona, entonces también existe la posibilidad de que estos fragmentos no sean capaces de identificar ataques de precisión fuera de su reino, aunque podría estar teorizando un poco. demasiado, basado en tan pocos hechos."

              "Sí, definitivamente me has perdido, Barry", dice Daren. "Sé que estabas tratando de hacer que esto suene menos confuso, pero todo este Magium, fragmentos y cosas de nodos se me escapan de la cabeza. Sólo puedo esperar que tengamos la menor interacción posible con todos ellos en el futuro, así que en realidad no necesitaré entender nada de esto. Todo lo que quiero del Magium es usar el nodo para obtener el conocimiento que necesito y eso es todo. ¡Sin otras complicaciones!"
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch12a_unusual
