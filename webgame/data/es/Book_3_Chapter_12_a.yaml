              current_scene: b3_ch12a_sky
  - name: b3_ch12a_ignore
    texts:
      - source: scene_text
        paragraph: 35
        text: |-
          Pensándolo bien, podría ser mejor dejar en paz a Kate por ahora. Probablemente preferiría un poco de paz y tranquilidad, para poder concentrarse mejor en sus propios pensamientos. Debería ir a practicar mis combinaciones hechizo mientras todavía tengo tiempo.

          Paso por Kate y encuentro un lugar lo suficientemente apartado como para poder practicar mi magia sin preocuparme de golpear a alguien por accidente. Después de varios experimentos fallidos más, me doy cuenta de que esto va a ser más difícil de lo que pensé inicialmente, así que decido probar la combinación más simple posible que me viene a la mente y seguir avanzando desde allí.
      - source: scene_text_2
        paragraph: 26
        text: |-
          Al usar mis poderes elementalistas, puedo combinar mis elementos fuego y agua en las cantidades justas para conjurar una nube de vapor lo suficientemente grande como para ocultar mi presencia a mis enemigos. Puede que no sea el hechizo más útil de todos los tiempos, pero al menos podría incomodar moderadamente a las personas que no están tan acostumbradas a localizar a sus adversarios a través de sus auras.

          Teniendo en cuenta que solo tengo acceso al nivel uno hechizos en este momento, todo ayuda.

          "¡Oye, Barry!" Escucho a Daren gritar desde la distancia, de repente. "¿Estás listo para nuestro turno de noche?"
      - source: scene_3
        paragraph: 18
        text: |-
          "¡Sí, estaré allí!" Le grito de vuelta.

          "¡Está bien!" dice Daren, en voz alta. "Mientras te preparas, iré a preguntarle a Hadrik si nos presta su mazo de cartas. ¡Te veré allí!"

          "¡Suena como un plan!" Grito, y luego empiezo a dirigirme hacia el área donde Daren y yo acordamos que estaríamos vigilando a partir de esta noche.
