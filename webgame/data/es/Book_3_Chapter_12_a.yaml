          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch12a_practicing
                  available_points: available_points + 4
                  available_points_aux: available_points_aux + 4
  - name: b3_ch12a_practicing
    texts:
      - source: scene_text
        paragraph: 5
        text: |-
          "Oye, Barry, ¿estás practicando tu hechizos otra vez?" dice Hadrik, con una sonrisa, mientras pasa junto a mí con una botella de cerveza en la mano. "Si todavía necesitas un sujeto de prueba, podría echarte una mano por un minuto. No tengo nada que hacer por el momento y estoy lo suficientemente borracho como para no considerar las consecuencias de lo que te estoy ofreciendo".

          "¡Vaya, sí, eso sería genial!" -digo con entusiasmo. "De hecho, tengo algunos hechizos específicos que solo se pueden usar en seres vivos y que aún no he tenido la oportunidad de probar. He estado rogando a Kate y Daren que me permitieran probarlos en ellos durante los últimos dos días, ¡pero nunca estuvieron de acuerdo!"

          "¡Eso he oído!" Dice Hadrik, mientras toma otro sorbo de su botella y luego la deja en el suelo.

          Poco después se aleja de la botella, se gira hacia mí y estira los brazos hacia afuera, invitándome a lanzarle un hechizo.
      - source: scene_text_2
        paragraph: 4
        text: |-
          "¿Bien?" Hadrik dice. "¿Qué estás esperando? ¡Dame tu mejor oportunidad!"

          Justo cuando estoy a punto de lanzar uno de mis hechizos, Hadrik se aleja a una velocidad increíblemente alta, haciéndome imposible apuntarlo.

          "¡Demasiado lento, Barry!" Hadrik dice. "Demasiado lento".

          "¿No dijiste que me ibas a ayudar?..." le pregunto confundida.

          "¡Te estoy ayudando!" Hadrik dice. "¿Crees que tus enemigos simplemente se quedarán quietos y te pedirán cortésmente que les lances tu hechizos? Es mucho más realista de esta manera. ¡Además, puedo divertirme más!"
      - source: scene_3
        paragraph: 4
        text: |-
          "Oh, así es como es..." digo, mientras preparo otro de mi hechizos y apunto hacia él.

          Antes de poder lanzar algo, mi dispositivo de estadísticas de mi bolsillo de repente comienza a sonar, haciéndome saber que finalmente he recibido algunos puntos de estadísticas nuevos.

          Momento perfecto.
    choices:
      - position: 1
        text: Invierta puntos ahora
        effects:
          - set:
              current_scene: b3_ch12a_bored
              b3_ch12_invest: 1
              storyboard_controls: Jump to frame "Stats"
      - position: 2
        text: Invierta puntos más tarde (presionando el botón de estadísticas en la parte superior de la pantalla)
        effects:
