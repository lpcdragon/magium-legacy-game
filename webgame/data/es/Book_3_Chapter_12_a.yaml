  - name: b3_ch12a_brinhorn
    texts:
      - source: scene_text
        paragraph: 40
        text: |-
          "Wow, Barry, supongo que Leila tenía razón..." dice Daren, luego de terminar de contarle sobre una de mis aventuras. "Nos has estado ocultando todo este tiempo. De todos modos, ¿cuántas más de estas historias locas tienes todavía?"

          "Yo realmente no llamaría a ninguno de ellos 'salvaje'", le digo. "La mayoría de las cosas que te conté fueron solo trabajos ocasionales que hice aquí y allá para poder continuar financiando mi investigación para convertirme en mago. Estos no son exactamente el tipo de cosas sobre las que la gente escribiría libros, como cualquiera de tus logros, por ejemplo".

          "¡Bueno, tal vez deberían escribir libros sobre ellos!" Daren dice. "¡Esto es algo emocionante! ¡Lo digo en serio! Realmente me tuviste al borde de mi asiento con algunas de esas historias. Lo juro, no tengo idea si todas estas personas que has conocido en tu vida estaban locas antes de conocerte o si poco a poco se volvieron locos después de pasar demasiado tiempo contigo, pero es sorprendente cuántas personas con ideas afines has encontrado en tu camino hasta ahora. Creo que el que más me sorprende tiene que ser Brinhorn. Él siempre parecía así un hombre con una buena cabeza sobre sus hombros. ¿Cómo, en nombre de los dioses, conseguiste arrastrarlo a esta locura?
      - source: scene_text_2
        paragraph: 33
        text: |-
          "Oye", digo, "Brinhorn ha pasado años y años ganando todos los torneos de sabio del Continente Occidental solo para tener la oportunidad de desafiar a Azarius por el título de sabio una y otra vez, sin vencerlo ni una sola vez. Y aun así lo hace. ¡Todos los años! Si eso no es pura locura, entonces no sé qué es. Pero sí, ahora que lo pienso, tal vez Brinhorn y yo teníamos ideas similares después de todo. Sinceramente, me sorprende que no nos hayamos topado con él hasta ahora. Me parece extremadamente improbable que no esté aquí, especialmente sabiendo que Azarius se unió a este torneo."

          "¿No has mantenido ningún contacto con él desde que te fuiste?" Me pregunta Daren. "Si al menos tuvieras la frecuencia de su transceptor, podríamos intentar llamarlo".
      - source: scene_3
        paragraph: 22
        text: |-
          "No", digo. "Han pasado años desde la última vez que hablé con él. Ni siquiera sé si seguiría usando el mismo transceptor o no. He pensado en enviarle una carta una o dos veces, pero siempre lo dejo para otro momento, diciéndome a mí mismo que prefiero darle la buena noticia de haber encontrado una manera de convertirme en mago en lugar de contactarlo después de tanto tiempo solo para contarle mi fracaso. Me pregunto cómo reaccionaría si me viera lanzando magia. ahora..."

          "Estoy seguro de que estaría orgulloso", dice Daren. "Tal vez incluso encontraría más motivación para trabajar más duro en su propio objetivo inalcanzable. Si se puede hacer algo tan imposible como una persona normal lanzando magia, entonces vencer a Azarius debería parecer pan comido en comparación".

          "¡Sí, supongo que se podría decir de esa manera!" digo.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch12a_humanity
  - name: b3_ch12a_humanity
    texts:
      - source: scene_text
        paragraph: 41
        text: |-
          "Hablando de objetivos imposibles", dice Daren, "¿has pensado más en la petición de Meridith de que la ayudemos a matar a Eiden?"

          "No lo sé..." digo. "¿Hay realmente algo en qué pensar? Yo diría que lo mejor para nosotros es hablar de esto lo menos posible. Mientras no hayamos llegado a una conclusión, es mucho menos probable que Eiden venga a buscar pelea con nosotros".

          "¿Pero lo has considerado?..." me pregunta Daren, con aprensión.
      - source: scene_text_2
        paragraph: 34
        text: |-
          "Claro, supongo..." digo. "Al menos a nivel teórico. ¿Por qué lo preguntas?"

          "... Esto va a sonar un poco extraño, viniendo de mí", dice Daren, "pero no estoy seguro de qué tan cómodo me sentiría matando a Eiden, en este momento. Especialmente después de que él me ayudó durante la prueba de Dios del Tiempo".

          "Te das cuenta de que el Eiden de este mundo no recuerda haberte ayudado, ¿verdad?" digo.
      - source: scene_3
        paragraph: 23
        text: '"¡Sí, pero seguía siendo la misma persona!" Daren dice. "El Eiden de nuestro mundo también habría reaccionado de la misma manera, si estuviera en la misma situación. Por eso estoy en conflicto con todo este asunto. Me pidió que le demostrara que estaba equivocado, Barry... Y creo que quiere lo mismo de ti. ¿Cómo puedo asesinarlo a sangre fría, sabiendo que en el fondo podría arrepentirse de lo que ha hecho y que en realidad quiere que hagamos lo imposible y le hagamos creer en la humanidad nuevamente?"'
    choices:
