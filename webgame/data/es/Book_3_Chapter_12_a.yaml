  - name: b3_ch12a_obscure
    texts:
      - source: scene_text
        paragraph: 48
        text: |-
          "Para ser completamente honesto, no tengo ningún sentimiento fuerte sobre este acuerdo de ninguna manera", dice Diane, mientras se encoge de hombros. "En realidad, si me inclinara por una opción, probablemente preferiría que ustedes no aceptaran su oferta, porque prefiero no ver a Kate arriesgando su vida luchando contra Eiden, ¡pero no le digan a Meridith que dije eso!"

          "Ya sabes..." dice Illuna. "Sería mucho más fácil creerte cuando dices cosas como estas si no oscurecieras tu aura todo el tiempo para evitar que nadie supiera si estabas mintiendo o no..."

          "¡No lo hago a propósito!" Diane dice. "No puedes usar esta técnica de manera confiable a menos que se convierta en algo natural para ti. Si dejo de hacerlo en cualquier momento, será extremadamente difícil 'volverlo a activar', y con la forma en que a Eiden le gusta aparecer sin previo aviso con su teletransportación a todo el continente, ¡ese es un riesgo que no puedo permitirme correr!"
      - source: scene_text_2
        paragraph: 38
        text: |-
          "Bueno, nadie aquí sabe cómo usar esta técnica de oscurecimiento del aura", dice Illuna, "así que supongo que tendremos que confiar en tu palabra, ¿no?"

          "Escucha, me doy cuenta de que me conoces desde hace poco tiempo", dice Diane, "y no tienes ninguna razón real para confiar en mí aparte del hecho de que soy amigo de la infancia de Kate, pero realmente no hay nada que pueda hacer al respecto. Lo siento si te hace sentir incómodo..."

          "Admito que pensé que algo era diferente en ti desde que nos reunimos por primera vez", dice Kate, "pero ahora me doy cuenta de que esto debe haber sido lo que me molestaba. Si bien se siente un poco incómodo tener conversaciones contigo por eso, no creo que a nadie le importaría incluso si no fuera algo más allá de tu control. Estoy seguro de que todos elegirían usar constantemente una técnica que los haga inmunes a la detección de mentiras si tuvieran los medios para hacerlo. ¿No es así, muchachos?"
      - source: scene_3
        paragraph: 27
        text: |-
          "Oh, sí, totalmente", dice Hadrik, mientras le da otro bocado a guiverno asado.

          "Supongo..." dice Daren.

          "Gracias por decir esto, Kate", dice Diane. "¡Realmente lo aprecio!"
