              "No parece que ayudar a la gente le haya funcionado muy bien la primera vez que lo intentó", le digo a Daren.

              "Sí, pero si todavía se arrepiente de haberse rendido, tal vez no sea demasiado tarde", dice Daren. "¡Tal vez podría asumir el papel de Creador una vez más y hacerlo mejor esta vez!"

              "Creo que estás olvidando que los reyes de casi todas las ciudades, excepto Thilias y Ollendor, quieren que Eiden muera", digo. "Lo cual es natural, considerando que el propio Eiden nos admitió que sus acciones causarán la destrucción de las ciudades de Varathia. Los reyes están en contacto con Meridith, quien conoce la profecía del fragmento Magium, por lo que ellos también deben saberlo".

