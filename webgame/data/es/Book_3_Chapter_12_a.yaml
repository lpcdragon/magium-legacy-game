  - name: b3_ch12a_kate1
    texts:
      - source: scene_text
        paragraph: 33
        text: |-
          "¡Hola, Kate!" -digo mientras me acerco a ella. "¿Cómo va tu entrenamiento?"

          "Todo va igual que siempre", me dice Kate, mientras dispara algunos carámbanos más a sus objetivos. "¿Por qué lo preguntas?"

          "Lo mismo de siempre, ¿eh?..." digo. "Entonces, ¿estás diciendo que conjurar tus carámbanos exactamente en el mismo lugar una y otra vez era parte de tu rutina habitual, entonces?"

          Justo cuando terminé mi oración, Kate estaba a punto de convocar instintivamente sus carámbanos en el mismo lugar nuevamente, pero luego agitó su mano en el aire y los hizo aparecer en diferentes lugares.

          "Yo... no me di cuenta de que estaba haciendo eso", me admite Kate. "¿Desde cuándo notaste este cambio?"

          "Hmm..." le digo. "Yo diría que tal vez comenzó ayer por la tarde. Ya te he visto hacerlo en tres sesiones de entrenamiento separadas".

          "Ya veo", dice simplemente Kate.

          "Entonces, ¿vas a decirme qué pasa?" Le pregunto. "No creo haberte visto nunca tan distraído durante tu entrenamiento, así que supongo que tiene que ser algo bastante serio. ¿Fue algo que dijo Diane?"

          "No, no es eso, no es... nada de lo que debas preocuparte", dice Kate con aprensión. "Estaré bien."
      - source: scene_text_2
        paragraph: 24
        text: |-
          "Está bien, déjame ver si puedo acertar en la primera suposición", le digo. "Tu único objetivo principal desde el primer día que te uniste al torneo siempre ha sido encontrar a Diane y llevarla contigo, lejos de Varathia. Sin embargo, ahora que finalmente tuviste la oportunidad de conocerla y hablar con ella, te diste cuenta de que Diane no tiene intención de abandonar este lugar y que está trabajando junto con los Lessathi por su propia voluntad. En otras palabras, la razón por la que estás en conflicto en este momento es porque te has dado cuenta de que la única manera de poder quedarte con tu amigo después de que termine el torneo es unirte a Meridith y al resto de Lessathi, lo cual no es exactamente la situación más ideal para ti. ¿Adiviné correctamente hasta ahora?"

          Kate suspira.

          "Sólo parcialmente", me responde, después de una breve pausa. "No se trata sólo de lo que voy a hacer una vez que termine el torneo. También estoy un poco preocupado por Diane. Ella parece... cambiada. No es que esperaba que ella fuera exactamente la misma persona que era hace diez años, pero cuando hablo con ella ahora, siento que ni siquiera puedo decir lo que está pensando la mitad del tiempo. No lo sé... Supongo que simplemente no puedo aceptar el hecho de que fue tan fácil conectar con Leila, a pesar de que apenas interactuamos mientras estábamos en el Beacon, pero cuando se trata de Diane, a veces se siente casi como si fuéramos extraños".
      - source: scene_3
        paragraph: 16
        text: |-
          "Si te ayuda", digo, "debes saber que no eres el único que tiene problemas para acercarse a Diane. No estoy seguro si te has dado cuenta, pero Hadrik y Daren apenas le hablan, y supongo que tampoco he tenido muchas conversaciones con ella. Simplemente hay algo en ella que la hace parecer un poco... poco sincera, ¿tal vez? No es que la esté llamando mentirosa, o cualquier cosa, pero a veces no puedo evitar sentir que estoy hablando con, eh... con una versión femenina del rey del subsuelo."

          "¡Barry, eso es todo!" Kate dice en voz alta, de repente. "¡Creo que eso es lo que me ha estado molestando todo este tiempo! Algo en ella se siente similar al rey del subsuelo, pero no estoy seguro exactamente de qué. Intentaré ver si puedo resolverlo en los próximos días, ¡y tal vez eso me ayude a sentirme un poco más cómodo hablando con ella!"

          "Entonces, ese es un problema parcialmente resuelto", digo. "¿Pero qué pasa con la otra? ¿Has pensado en lo que vas a hacer una vez que termine el torneo, y Diane inevitablemente te diga que quiere quedarse aquí, en Varathia, y seguir trabajando para Meridith?"

          "No estoy... segura todavía", dice Kate, mientras mira hacia un lado. "Para ser sincero, he estado posponiendo esa decisión, sabiendo que todavía tenemos algo de tiempo hasta llegar a Galamir. No es que odie a Meridith ni nada por el estilo, pero tampoco me gustaría pasar mi vida trabajando para ella".
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch12a_kate2
  - name: b3_ch12a_kate2
    texts:
      - source: scene_text
        paragraph: 34
        text: |-
          "¿Qué pasaría si le pidieras a Meridith una invitación especial a Varathia, para poder volver aquí cuando quieras?" digo. "Seguramente, como líder de los Lessathi, ella debería tener suficiente influencia para obtener algo como esto para ti, ¿verdad? Y luego podrías decidir por ti mismo cuánto tiempo quieres pasar en Varathia, sin sentir que estarás atrapado aquí por el resto de tu vida debido a Diane".

          "Eso... en realidad no es una mala idea", me dice Kate. "Intentaré sugerirle esto a Diane cada vez que surja el tema. Tal vez podamos resolver algo".

          Hace una pausa por unos breves momentos antes de continuar.

          "Gracias..." me dice, después de un rato. "Esta conversación contigo terminó ayudándome más de lo que pensé. Sé que puedo ser un poco difícil de manejar muchas veces, pero quería decirte que aprecio que te quedes a mi lado y sigas siendo mi amigo a pesar de ese hecho".
      - source: scene_text_2
        paragraph: 25
        text: |-
          "Oye, no hay necesidad de subestimarte", digo. "También me ayudaste cuando realmente lo necesitaba, ¿recuerdas? Tú fuiste quien me dio la idea de intentar modificar mi dispositivo de estadísticas para extraer su energía directamente del plano mágico, con la ayuda del Magium, y es en gran parte gracias a tus consejos que he podido seguir adelante, incluso en los momentos más difíciles. ¡No creo que lo olvide nunca!"

          "Me alegro de poder ayudar", me dice Kate, con una sonrisa leve pero genuina.

          "¡Oye, Barry!" Escucho a Daren gritar desde la distancia. "¿Estás listo para nuestro turno de noche?"

          "¡Sí, estaré allí!" Le grito de vuelta.

          "¡Está bien!" dice Daren, en voz alta. "Mientras te preparas, iré a preguntarle a Hadrik si nos presta su mazo de cartas. ¡Te veré allí!"

          "¡Suena como un plan!" Grito y luego me giro hacia Kate.
      - source: scene_3
        paragraph: 17
        text: |-
          "¡Lo siento, tengo que irme!" Le digo.

          "No hay problema", dice Kate. "Terminaré mi entrenamiento y me iré a dormir. Se hace tarde".

          "Está bien, ¡buenas noches entonces!" digo. "¡Nos vemos mañana!"

          "¡Buenas noches!" dice Kate, y luego reanuda su entrenamiento, esta vez conjurando sus carámbanos correctamente.

          Salgo de la zona en la que Kate estaba practicando su puntería y empiezo a dirigirme hacia el lugar donde Daren y yo acordamos que estaríamos vigilando a partir de esta noche.
    choices:
