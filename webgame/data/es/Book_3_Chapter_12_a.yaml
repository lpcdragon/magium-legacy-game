  - name: b3_ch12a_advice
    routes:
      - condition: b3_ch12_diane = 1
        texts:
          - source: scene_text
            paragraph: 31
            text: |-
              "En realidad", digo, "creo que una de las razones principales por las que Hadrik siempre está en guardia a tu alrededor podría ser porque simplemente estás intentando demasiado ser amigo de todos, y eso hace que las cosas sean un poco incómodas. Tal vez podrías intentar... ¿dejar que las cosas progresen de forma más natural?... Realmente no hay problema si no te haces amigo instantáneamente de todos los miembros del grupo después de sólo dos días de viaje".

              "¿Sabes qué, Barry?" Diane dice. "Tal vez tengas razón. Ahora que lo mencionas, tal vez me he esforzado demasiado para compensar mi mala primera impresión. Creo que intentaré retroceder un poco durante los próximos días y dejarle algo de espacio para respirar. Como dijiste, no es una tragedia si de repente no puedo ser amigo de todos, ¿verdad?"

              "Exactamente", digo. "Pero bueno, si realmente necesitas una amiga que siempre te escuche y te ayude en tus momentos de necesidad, siempre puedes probar con Arraka. ¡Estoy seguro de que a ella le encantaría tu compañía!"
          - source: scene_text_2
            paragraph: 23
            text: |-
              "Barry, ¡creo que podría ser el mejor consejo que he escuchado en todo el día!" Dice Diane, con una sonrisa. "De hecho, creo que intentaré hablar con ella ahora mismo. ¡Gracias por la sugerencia!"

              "¡De nada!" Digo, mientras Diane ahora se dirige hacia Flower y Illuna, presumiblemente para tener una conversación con Arraka.

              Decido ir en la dirección opuesta, para poder probar algunas combinaciones más de hechizos antes de comenzar mi turno de noche con Daren. Mientras camino hacia mi lugar habitual, noto con el rabillo del ojo que Kate está ocupada haciendo su rutina de entrenamiento de puntería, donde apunta a hojas separadas de los árboles con cada uno de sus carámbanos.
          - source: scene_3
            paragraph: 15
            text: |-
              Lo que me llama la atención, sin embargo, es que a diferencia de su rutina habitual, durante la cual siempre crea sus carámbanos en diferentes lugares para desafiarse aún más, esta vez hace que los carámbanos aparezcan exactamente en el mismo lugar una y otra vez, y solo cambia sus objetivos. Su mirada también es muy distante y desenfocada en comparación con como suele estar cuando realiza este ejercicio. Es casi como si hubiera elegido específicamente esta forma más fácil de entrenamiento, para poder realizar los movimientos mecánicamente, mientras su mente es libre de pensar en algo completamente distinto.

              Normalmente, esto no habría sido gran cosa, pero esta es la tercera vez en los últimos dos días que veo a Kate hacer exactamente lo mismo, a pesar de que normalmente se toma muy en serio su entrenamiento de puntería. Creo que algo le pasa. Quizás debería ir a preguntarle qué pasa.
