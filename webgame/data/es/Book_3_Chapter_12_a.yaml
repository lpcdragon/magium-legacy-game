              "¡Deja de intentar engañarlo, tonto!" Me grita Arraka, desde la distancia. "Ese truco tuyo sólo funciona cuando tienes el elemento sorpresa de tu lado. ¡Él obviamente sabe que estás tratando de mentirle, así que no va a caer más en la trampa! Ahora deja de jugar y practica tu hechizos, ya. ¡Me estás haciendo perder la concentración!"

              "¡Bueno, ya escuchaste al jefe!" Dice Hadrik, mientras va a agarrar su botella del suelo. "Ya es suficiente jugar por una noche."

