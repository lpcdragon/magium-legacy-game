  - name: b3_ch12a_bored
    routes:
      - condition: b3_ch12_invest = 1
        texts:
          - source: scene_text
            paragraph: 6
            text: |-
              "Oye, ¿seguimos haciendo esto o qué?...", dice Hadrik.

              "Sí, lo siento, solo tenía algunos puntos de estadísticas nuevos que necesitaba gastar", digo, mientras guardo mi dispositivo en mi bolsillo. "Estoy listo ahora".

              Ahora, entonces... Veamos si puedo encontrar una manera rápida de lidiar con esto antes de que Hadrik se aburra demasiado como para seguir siendo mi sujeto de prueba.
          - source: scene_text_2
            paragraph: 5
            text: |-
              Recuerdo que Arraka dijo que Daren estaba usando el flujo del aura de Hadrik para predecir sus movimientos cuando estaban en duelo. Puede ser difícil para mí hacer lo mismo, considerando que no recibí ningún entrenamiento de aura de Arraka, pero ¿tal vez pueda complementar parte de su entrenamiento con las estadísticas de mi dispositivo?

              Si no, entonces supongo que siempre podría intentar el enfoque de fuerza bruta, usando mi velocidad para acercarme a Hadrik y mis reflejos para lanzarle un hechizo antes de que se escape. Mientras esté lo suficientemente cerca, debería ser más fácil apuntarle.

              O... podría simplemente intentar engañarlo.
        choices:
          - position: 1
            text: Intenta predecir los movimientos de Hadrik a partir de su aura.
            effects:
              - set:
                  current_scene: b3_ch12a_predict
                  b3_ch12_approach: 0
          - position: 2
            text: Intento acercarme a Hadrik para poder apuntarle más fácilmente.
            effects:
              - set:
                  current_scene: b3_ch12a_brute
                  b3_ch12_approach: 1
          - position: 3
            text: Dile a Hadrik que si estuviera quieto me resultaría más difícil apuntarle.
            effects:
              - set:
                  current_scene: b3_ch12a_bluff
                  b3_ch12_approach: 2
      - condition: b3_ch12_invest = 0
        texts:
          - source: scene_text
            paragraph: 7
            text: |-
              Saco mi dispositivo de estadísticas para detener el pitido y luego lo vuelvo a guardar en mi bolsillo. Mientras hacía esto, Hadrik corría repetidamente de izquierda a derecha, burlándose de mí para que hiciera mi movimiento.

              Ahora, entonces... Veamos si puedo encontrar una manera rápida de lidiar con esto antes de que Hadrik se aburra demasiado como para seguir siendo mi sujeto de prueba.
          - source: scene_text_2
