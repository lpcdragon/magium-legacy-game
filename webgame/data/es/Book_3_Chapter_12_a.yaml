  - name: b3_ch12a_wolford
    texts:
      - source: scene_text
        paragraph: 23
        text: |-
          "El aturdimiento de Wolford", dice Kate. "Se considera ampliamente que es simultáneamente el hechizo de mareo más fuerte y más débil que existe. Básicamente, no existe ningún contraataque mágico o protección contra él, pero sus efectos pueden fácilmente volverse inútiles a través de medios no mágicos. Todo lo que necesitas hacer es enfocar los ojos en tres lugares diferentes frente a ti en el lapso de cinco segundos y el hechizo se cancelará, pero si no lo haces, tendrás un dolor de cabeza como probablemente nunca hayas tenido el placer de experimentar en tu vida. El principal inconveniente es que el hechizo es increíblemente difícil de aprender, y la mayoría de las personas no se molestan en pasar tanto tiempo practicando algo que una persona normal y sin magia puede contrarrestar tan fácilmente, con sólo mirar un poco a su alrededor."

          "Sabes..." digo. "Realmente me ayudaría si ustedes me permitieran lanzarles algunos de estos hechizos dirigidos a ustedes una o dos veces, solo para poder tener una idea de cómo funcionan antes de usarlos en combate. Sé que realmente no les gusta la idea, pero--"

          "Lo siento, Barry", dice Kate. "Sé que no quieres hacer daño y valoro tu amistad, pero simplemente la idea de que vuelvan a experimentar con él después de lo que pasé en el Beacon cuando era niño es... simplemente no estoy muy interesado en repetir esa experiencia".

          "No, no, eso es totalmente comprensible", digo. "Mal. Debería haber pensado en esto antes de hacer esa solicitud".
      - source: scene_text_2
        paragraph: 18
        text: |-
          "En cuanto a mí", dice Daren, "el principal problema es que muchas de mis protecciones hechizos tienen usos limitados por día, por lo que prefiero no cancelarlas a menos que sea absolutamente necesario. Y lanzarme tu hechizos mientras mis protecciones aún están activas no sería de mucha ayuda para ti, porque no sabrías si funcionaron o no".

          "Aún me ayudaría un poco aplicártelos incluso con tus protecciones activas, pero entiendo tu punto", le digo.

          "Barry, ¡no sabía que necesitabas un sujeto de prueba!" Diane dice. "¡Me encantaría ayudar!"

          "¿Está seguro?" Le pregunto, un poco aprensivamente. "No quisiera que te fuerces por mí ni nada por el estilo. Después de todo, tú y Kate crecieron en el Faro de Esperanza..."

          "Oh, no tienes que preocuparte por mí", dice Diane. "Ese trauma quedó atrás. La idea de que pruebes hechizos en mí no me molesta en lo más mínimo".

          "Bueno, si estás seguro de ello, entonces sí, ¡definitivamente me vendría bien tu ayuda!" digo. "¡Gracias!"

          "¡En cualquier momento!" Diane dice.

          "¡Muy bien, ya basta de charla!" Arraka dice, de repente. "Tenemos asuntos importantes que discutir. Kate, sé que has estado practicando la manipulación del aura en secreto durante los últimos dos días. ¿Alguna vez planeas mostrarnos lo que has logrado o simplemente lo estás haciendo como un pasatiempo?"
      - source: scene_3
        paragraph: 10
        text: |-
          "...Iba a mostrárselo una vez que tuviera algunos resultados más definitivos", dice Kate. "Por el momento, todavía no estoy seguro de si lo estoy haciendo bien".

          "Lo estabas haciendo bien", dice Arraka. "Tu único problema es que si vas a practicar la interrupción de las técnicas de manipulación del aura de otras personas, necesitarás que alguien use esa técnica frente a ti si quieres lograr algún progreso. Daren, hoy en día puedes usar tu aura consistentemente para mover tu espada por el aire, ¿verdad? ¿Por qué no haces que tu espada flote allí, para que Kate pueda demostrarnos lo que puede hacer?"

          "Claro", dice Daren, mientras hace lo que Arraka le pidió y hace que su espada flote en el aire. "¿Y ahora qué?"

          "Kate, ¿harás los honores?" Arraka dice.

          "Lo intentaré..." dice Kate, mientras conjura un carámbano en el aire, lo cubre con su aura y luego lo envía volando en algún lugar entre Daren y su espada flotante.

          "Wow..." dice Daren, mientras ve su espada caer al suelo frente a él. "¡Lo lograste en el primer intento! ¡Felicidades!"

          "¿Ver?" Arraka nos lo dice. "Ella es natural. Y a diferencia de Daren, ni siquiera tuve que enseñarle nada. Ella lo aprendió todo sola, mientras me escuchaba darle a Daren sus lecciones diarias. Ahora, hay una última cosa que quiero probar antes de dar por terminado el día. Kate, ¿por qué no tomas ese nuevo cetro tuyo y arrojas un rayo helado sobre esa gran roca de allí? Pero quiero que lo pongas tanta energía como puedas en tu rayo, maximízalo, ¿entiendes?"
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch12a_scepter
  - name: b3_ch12a_scepter
    texts:
      - source: scene_text
        paragraph: 24
        text: |-
          "Preferiría no utilizar tanta energía mágica sólo para un ejercicio de entrenamiento", dice Kate. "¿Qué pasa si nos atacan?"

          "Su tasa de recuperación de energía es más rápida que la de cualquier otro miembro del grupo", dice Arraka. "¿De qué te quejas? Apuesto a que puedes recuperar tanta energía en cinco minutos, si simplemente te acuestas y descansas un rato. Ahora deja de quejarte y hazlo. Esto es importante".

          "Bien", dice Kate, mientras levanta su cetro del suelo y apunta a la roca. "Lo intentaré".

          "Ah, y una cosa más", dice Arraka. "Intenta acortar el tiempo de lanzamiento de tu hechizo tanto como puedas. No queremos darle a tu enemigo demasiada oportunidad de reaccionar y alejarse de tu línea de ataque".

          "¡Oh, sí, esa roca nunca sabrá qué la golpeó!" Bromea Hadrik, mientras toma otro trago de cerveza.

          "Entiendo", responde Kate, y luego comienza a reunir una inmensa cantidad de energía en la punta de su cetro.

          Ni siquiera dos segundos después, un rayo de hielo sale disparado del cetro, pero el poder detrás de él solo puede compararse con el aliento de llama que vimos usar a Tyrath hace cinco mil años cuando todavía estaba en su mejor momento. No hace falta decir que la roca nunca tuvo ninguna posibilidad contra tal ataque, pero incluso el aire a nuestro alrededor se ha vuelto tan frío como en un día de invierno. Mientras todos miramos a Kate, sorprendidos, Arraka comienza a reír muy fuerte, en tres voces a la vez.
      - source: scene_text_2
        paragraph: 19
        text: |-
          "¡¡¡Aha-Ahahahahahaha!!!" Arraka se ríe. "¡Lo sabía! ¡Sabía que este cetro no me defraudaría! ¿Sabes qué es esto? ¿SABES qué es esto? ¡Es nuestra arma secreta contra mi copia del pasado, eso es! Recuerdo exactamente qué defensas solía tener en ese entonces, y no hay forma de que pueda resistir algo como esto si me pillan desprevenido. Todo lo que ustedes, perdedores, deben hacer es distraer lo suficiente a esa copia barata mía durante dos segundos, y ¡Kate la congelará! ¡Oh hombre, no puedo creer que ustedes, idiotas, hayan tenido tanta suerte! ¡Ese viaje a la sede de Lessathi valió la pena en muchos sentidos!

          "Entonces", pregunta Illuna, "¿estás diciendo que tu protección hechizos de hace cinco mil años era tan débil que ni siquiera podías protegerte contra un ataque de nivel Tyrath? Porque todos vimos a Tyrath atacándola durante el ritual, y ella se defendió perfectamente".

          "Ella no 'defendió bien'", dice Arraka. "La distrajo lo suficiente como para que Tyrath te teletransportara lejos del peligro, lo que significa que el rayo de Kate también debería mantener al otro Arraka inmovilizado el tiempo suficiente para que podamos darle el golpe final".
      - source: scene_3
        paragraph: 11
        text: |-
          "¿Y cómo se supone que vamos a hacer eso?" Kate dice.

          "Con la espada de Daren, obviamente", dice Arraka. "Esa arma está tan ridículamente encantada que puede atravesar fácilmente casi todas las protecciones pasivas de hechizo que existen hoy en día, y mucho menos las que existieron hace cinco mil años. Incluso si solo se congela durante tres segundos, debería ser tiempo suficiente para que este bufón la corte por la mitad, siempre y cuando se asegure de permanecer lo suficientemente cerca de ella de antemano. La única forma de defenderse contra esa espada es esquivarla o usar una poderosa protección activa de hechizo contra ella, lo cual obviamente no podrá hacer porque estará encerrada en un bloque de hielo. ¡Vaya, este plan se vuelve más perfecto cuanto más lo pienso!"
