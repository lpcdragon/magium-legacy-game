  - name: b3_ch12a_flash
    routes:
      - condition: b3_ch12_spell = 0
        texts:
          - source: scene_text
            paragraph: 18
            text: |-
              "Está bien, creo que he tomado mi decisión", digo, sin prestarle atención a Arraka. "Primero probaré la rana hechizo".

              "Claro..." dice Arraka. "Simplemente ignora el espíritu loco en el amuleto. No es como si ella supiera de lo que está hablando, ni nada por el estilo".

              "Entonces, ¿vamos a ver una demostración de su nuevo hechizo, Barry?" Me pregunta Diane. "Después de todo, ¡no hay mejor oportunidad para hacer alarde de tus habilidades mágicas que frente a una audiencia!"

              "Voy a necesitar algo de tiempo para practicar antes de poder mostrárselo a alguien", digo, "pero si quieres ver algo de magia, siempre puedo lanzar el destello de luz otra vez..."

              "¡NO!" Daren, Kate y Illuna gritan al unísono.

              "Queridos dioses, que la luz no vuelva a parpadear", dice Kate. "¿No has tenido suficiente?"
          - source: scene_text_2
            paragraph: 17
            text: |-
              "Miren, sé que todos ustedes lo odian", digo, "pero es importante que nuestro tiempo sea perfecto si queremos usar esto en la batalla de manera efectiva. Tan pronto como diga las palabras clave 'Daren, ¡captura!' Todos debéis cerrar los ojos durante exactamente un segundo, sin importar lo que estéis haciendo en el campo de batalla, o quedaréis cegados junto con el enemigo. Este es un hechizo muy antiguo que ya no se enseña hoy en día, por lo que la mayoría de la gente no se lo esperará la primera vez que lo use contra ellos. Por eso es necesario que lo hagamos bien desde el primer intento, antes de que perdamos el elemento sorpresa".

              "Escucha, Barry..." Hadrik dice: "Entiendo que estés muy entusiasmado por obtener finalmente tus estadísticas mágicas, pero parece que esto es de lo único de lo que has estado hablando durante dos días seguidos. Tal vez no sería tan mala idea olvidarte de tu magia durante una hora o dos y hacer otra cosa para variar".

              "¡Vamos, Hadrik, no seas así!" Daren dice. "Dejemos que Barry tenga su momento. El hombre ha estado soñando con convertirse en mago toda su vida. Está perfectamente bien que se sobreemocione un poco. Y no es que nos importe, con la excepción de su luz cegadora hechizo. Es cierto que ese se está volviendo un poco desagradable".

              "¡Quizás Barry podría mostrar algunos de los otros nuevos hechizos que aprendió hoy!" Diane dice. "¿Qué te parece?"
          - source: scene_3
            paragraph: 8
            text: |-
              "Mmm..." digo. "Hoy he estado muy ocupado encontrando combinaciones de hechizo y golpeándome la cabeza contra el árbol, así que no puedo decir que haya probado tantos hechizos en comparación con ayer. Oh, supongo que intenté lanzar un hechizo mareado en Hadrik antes, pero nunca logré fijarlo porque estaba corriendo demasiado rápido".

              "¿Tienes mareos hechizo?" Pregunta Kate, sorprendido. "¿En el nivel uno?"

              "Uno muy débil, pero técnicamente todavía se puede clasificar como un mareo hechizo, sí", digo. "Te hace sentir un poco mareado durante unos segundos".

              "Obviamente, no esperaba que tuvieras acceso al aturdimiento de Wolford en tu primer nivel de conocimiento mágico", dice Kate, "pero no sabía que había algún mareo hechizos que pudiera generarse con la poca cantidad de energía mágica que tienes a tu disposición".

              "Oye, ahora que lo mencionas, creo que SÍ tuve acceso al aturdimiento de Wolford cuando estaba luchando contra Tyrath", digo. "Dicho esto, ¿quién sabe si alguna vez volveré a alcanzar un nivel tan alto como ese en mis estadísticas mágicas? Sólo podemos tener esperanza".

              "¿Qué es el aturdimiento de Wolf... Wolfer... Wolfor?" Nos pregunta Flower. "Nunca había oído hablar de eso antes".
