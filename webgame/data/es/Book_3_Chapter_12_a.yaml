  - name: b3_ch12a_hermit
    texts:
      - source: scene_text
        paragraph: 16
        text: |-
          "Bien", digo. "Tú eres el maestro".

          Luego tomo la postura adecuada y estiro los brazos hacia adelante, con las palmas de las manos hacia afuera, haciendo todo según las reglas, para asegurarme de que Arraka no pueda culparme por el inevitable fracaso de este experimento.

          Hasta el momento, las partículas no siguen la dirección correcta y van por su propio camino, a pesar de que yo hice todo correctamente, pero esto no fue inesperado. Ya experimenté esto antes en el Plano Etéreo y sé cómo solucionarlo. Todo lo que necesito hacer es seguir su dirección con mis manos y eventualmente volverán a su lugar.

          "Eso es interesante", dice Arraka, mientras las partículas mágicas de mi hechizo ahora se están reorganizando en la forma correcta. "Hubiera esperado que intentaras forzar a las partículas a regresar a su posición correcta en lugar de seguirlas. ¿De dónde aprendiste esta técnica?"

          "Lo aprendí de un viejo ermitaño", le digo sin darle importancia, mientras todavía me concentro en mi hechizo. "Realmente no recuerdo cómo se llamaba. Creo que nunca me lo dijo, en realidad..."

          "¡¿Tenía habilidades como ésta y vivía como un ermitaño?!" Pregunta Arraka, sorprendido. "Qué increíble desperdicio de talento. Si alguna vez salgo de este amuleto, él será una de las primeras personas que tomaré como mis aprendices. Recuérdame que te pida su dirección si no termino matándote para entonces".
      - source: scene_text_2
        paragraph: 15
        text: |-
          "Sí, claro", digo, mientras todavía estoy seleccionando el mismo hechizo. "Entonces, ¿puedo cancelar el hechizo ahora, o todavía necesito continuar con esto para otro... vaya..."

          Mientras hablaba, una flecha ridículamente pequeña hecha de fuego salió disparada de mis manos y se dirigió directamente hacia el árbol al que apuntaba. El proyectil en llamas golpeó el árbol de frente, pero la intensidad fue tan baja que apenas dejó una marca quemada en la corteza del árbol antes de extinguirse por completo.

          "¡Jajajaja, funcionó!" -digo emocionado. "¡No puedo creer que realmente haya funcionado! ¡Eres un genio!"

          "¡Por supuesto que soy un genio!" Arraka dice. "¿En serio esperabas algo menos del espíritu que mató a la mitad de los dioses en el plano mágico?"

          "¡Te juro que nunca volveré a dudar de ti!" digo. "Vaya, todavía estoy en shock. ¡Esto es simplemente increíble!"

          "No..." dice Illuna, mirándome como si me hubiera vuelto completamente loco. "Lo que es increíble es que ustedes dos se estén emocionando por un incendio hechizo que ni siquiera pudo quemar la corteza de un árbol. ¿Dos días enteros siguiendo las instrucciones sin sentido de Arraka y este es el resultado? ¿Cómo no puedes ver que te está tomando el ridículo?"

          "¿Por qué me estaría tomando el pelo?" Pregunto Illuna, confundido. "Hasta ahora, cada parte de su entrenamiento ha tenido perfecto sentido".
      - source: scene_3
        paragraph: 6
        text: |-
          "Tienes que estar bromeando..." dice Illuna. "Hace poco tiempo, te estaba viendo literalmente golpearte la cabeza contra ese árbol mil veces seguidas. ¿Realmente estás tratando de decirme que esto tuvo algo que ver con que aprendieras magia?"

          "No, por supuesto que no", digo. "No tuvo nada que ver con que yo aprendiera magia".

          "¡¿Entonces por qué lo harías?!" Pregunta Illuna, luciendo como si finalmente estuviera perdiendo la calma.

          "Porque es un generalista", dice Arraka. "Él es el único en este grupo que entiende suficiente teoría mágica como para que no tenga que pasar por obstáculos para que siga mis instrucciones, sin importar cuán idiotas y sin sentido puedan parecerle al resto de ustedes. Puede que no haya estado de acuerdo con qué tan bien funcionaría mi entrenamiento en la práctica, pero sabía que no había fallas en la teoría detrás de esto. De otra manera, nunca habría aceptado hacer nada de esto".

          "Sí", digo, "todo el asunto de golpear mi cabeza contra el árbol para poder imprimir mi aura en él y convertirlo en un objetivo más fácil para mi hechizo fue algo que intenté hacer muchos años antes de poder usar magia. En realidad, no es un método de entrenamiento muy conocido, porque es difícil de tomar en serio, pero puede tener un efecto inmensamente positivo en magos con un poder mágico muy débil que no pueden aprender a lanzar hechizos con ningún otro manera."

          "¿Pero por qué tendrías que pasar por todos estos problemas AHORA, cuando ya puedes lanzar magia?" Illuna dice. "¿Por qué no simplemente transmitirlo mediante el uso de tu dispositivo de estadísticas?"
    choices:
