          - set:
              failed_checks:
                - '[ Comprobación de observación fallida - nivel 4 ]'
              successful_checks:
                - '[ Comprobación de sentido mágico exitosa - nivel 4 ]'
              b3_ch12_hadrik: 0
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch12a_hermit
      - condition: magical_sense = 4 AND perception = 4
        texts:
          - source: scene_text
            paragraph: 10
            text: |-
              Veamos qué tenemos aquí...

              Bien, entonces claramente algo está sucediendo con su aura justo antes de correr en cualquier dirección determinada. Si tan solo pudiera encontrar un patrón o algo que pudiera ayudarme... espera un minuto, ¡creo que lo tengo!

              Por el momento, es solo una teoría en el mejor de los casos, pero no tengo tiempo para confirmarla, así que tendré que seguir mi instinto en este caso. Me parece que el aura alrededor de las yemas de los dedos de su mano izquierda está siendo arrastrada ligeramente en la dirección hacia la que planea correr, brevemente antes de mover las piernas. También creo que podría estimar de alguna manera hasta dónde llegará, en función de la rapidez con la que su aura sea arrastrada en la dirección dada.

              Dudo que pueda hacerlo bien en el primer intento, así que será mejor que empiece ahora y ajuste mi puntería gradualmente con cada nuevo intento.

              Elijo el hechizo más rápido que tengo en mi arsenal, que es un hechizo de mareo muy débil que solo te desorienta ligeramente durante unos segundos, y luego apunto al lugar donde creo que está a punto de llegar el Hadrik. Me equivoco en aproximadamente medio segundo y el hechizo no se activa.

              Aún así, salió mucho mejor de lo que pensaba. Después de solo unos pocos ajustes, creo que debería poder predecir con precisión hacia dónde está a punto de ir Hadrik.
          - source: scene_text_2
            paragraph: 8
            text: |-
              Me toma dos intentos más, pero en el tercer intento logro calcular de antemano la posición exacta de Hadrik, y le golpeo de frente con mi mareo hechizo, lo que hace que se detenga en seco y coloque su mano en su cabeza por unos momentos.

              "Wow..." dice Hadrik, mientras me mira. "¿Eras tú? ¿Es esto un mareo hechizo que estoy sintiendo? ¡Oh, el efecto ya desapareció!"

              "Sí, bueno, es probablemente el mareo hechizo más débil que existe, por lo que no es exactamente muy útil", digo, "pero al menos finalmente pude lanzar un hechizo dirigido a alguien, así que desde mi punto de vista, ¡este experimento fue un éxito!"

              "¡Oye, en ese caso, me alegro de poder ayudar!" Dice Hadrik, mientras va a recoger su botella del suelo.

              "¿Ya te vas?" Digo, con un toque de decepción en mi voz.

              "Sí, diría que fue suficiente diversión por una noche", dice Hadrik. "Si realmente necesitas experimentar más, tal vez podamos encontrar una patrulla orca mañana o algo con lo que puedas trabajar. No deberían ser tan difíciles de encontrar, considerando que Tyrath parece haber declarado la guerra literalmente a todo Varathia".

              "Supongo..." digo.

              "Muy bien, ¡hasta luego, Barry!" Me dice Hadrik y luego se va.

              "Más tarde", digo simplemente, y luego saco mi cuaderno nuevamente para poder volver a catalogar mi hechizos disponible.
