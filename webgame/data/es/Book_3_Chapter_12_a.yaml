        paragraph: 45
        text: |-
          "No hay otras complicaciones aparte de conseguir acceso a uno de los nodos, quieres decir..." digo. "Los organizadores del torneo claramente no planean dejarnos usar uno incluso si ganamos, por lo que nuestras únicas opciones serán aceptar el trato de Meridith o tomar el control de otro nodo y obtener las herramientas necesarias para descifrar el conocimiento del mismo. Aún así, esta es una situación mucho, mucho mejor para nosotros que en la que estábamos hace una semana. Al menos ahora sabemos que el premio que estábamos buscando existe, y hay una manera de usarlo. Mientras sepamos que se puede usar, Encontraremos alguna forma de acceder a él, con o sin la ayuda de Meridith".

          "¡Me gusta tu espíritu!" Daren dice. "Sí, estaba pensando lo mismo. Tal vez deberíamos preguntarle a Arraka o Illuna si conocen las ubicaciones de otros nodos Magium. Definitivamente parecían haber interactuado con al menos uno de ellos antes, por lo que tiene que haber alguna forma de llegar a ellos".

          "¡Absolutamente!" digo. "Les preguntaremos a primera hora de la mañana. Y dicho esto, creo que podría ser hora de despertar a Kate y Diane para que puedan comenzar el segundo turno de noche. ¡Me vendría bien dormir un poco!"

          "Muy bien, entonces", dice Daren. "Primero recojamos estas cartas y luego podremos irnos".

          Después de volver a poner todas las cartas en la baraja, despertamos a Kate y Diane, y nos dirigimos directamente a nuestras tiendas de campaña, para poder al menos dormir unas horas ininterrumpidas durante la noche. A la mañana siguiente, nos despierta el olor muy distintivo del guiverno asado, que normalmente debería ser un manjar servido sólo a la realeza, pero Flower parece no tener problemas para conjurarlo en grandes cantidades sin gastar demasiada energía.
      - source: scene_text_2
        paragraph: 36
        text: |-
          Mientras la mayoría de nosotros nos sentimos atraídos lentamente hacia Flower por el apetitoso aroma, escuchamos a Daren conversando con su esposa, Sophie, en su transceptor mientras empaca su tienda. Han estado hablando al menos tres veces al día desde que él finalmente logró contactarla, lo cual es agradable de ver, ya que está claro cuánto se extrañan el uno al otro. Es más, Sophie también se ha adaptado bastante bien a nuestro grupo y ya ha hecho algunos planes para unirse a nosotros en algunos viajes después de que terminemos el torneo.

          Además de la esposa de Daren, también hemos estado en contacto con Melindra y con el padre de Leila, quienes tienen transceptores de Daren y pueden llamarnos cuando quieran. Desafortunadamente, como Leila no puede enviar sus mensajes de texto a través de transceptor, su padre necesita leerlos en voz alta para nosotros, lo que hace que nuestras discusiones sean un poco incómodas, pero al menos podemos comunicarnos con ella, así que no me puedo quejar. En cuanto a Melindra, Flower tiende a llamarla más de diez veces al día, así que en cierto modo, es como si nunca se hubiera ido. También he visto a Kate llamarla un par de veces, pero la mayoría de las veces lo hace en secreto, mientras entrena, probablemente porque le da mucha vergüenza hacernos saber que la extraña.
      - source: scene_3
        paragraph: 25
        text: |-
          Otro compañero de conversación más inusual con el que hemos estado hablando de forma semi-regular desde que dejamos la base Lessathi es Jirinn, el espíritu del plano mágico con el que está vinculado Daren. Bueno, en realidad, mayormente solo habla con Arraka, y apenas reconoce nuestra presencia, pero aun así, nos ha estado brindando información muy interesante sobre los últimos desarrollos en el plano mágico. Aparentemente, el plan de Arraka funcionó mucho mejor de lo que podríamos haber esperado, y ahora la mayoría de los dioses se han vuelto contra el Dios del Tiempo, el Dios de la Muerte y el Dios del Destino.

          Además, ahora que los otros habitantes de plano mágico descubrieron que algunos de los dioses habían estado absorbiendo espíritus para aumentar sus poderes en secreto, muchos de ellos comenzaron a ofrecerse como voluntarios para unirse al grupo de guerreros iluminados de Jirinn y, según él, pronto deberían tener suficientes miembros para representar una amenaza real para los dioses divididos y debilitados.

          Sin embargo, como predijo Arraka, los tres dioses rebeldes se han resistido bastante bien contra todos los demás dioses y no dan señales de perder esta batalla en el corto plazo. De hecho, por lo que tengo entendido, nadie ha logrado siquiera encontrar a los tres dioses durante los últimos tres días, probablemente debido a las ilusiones del Dios del Destino que están haciendo un muy buen trabajo manteniéndolos ocultos y desorientando a sus enemigos. Aún así, esta es una muy buena noticia para nosotros, porque queremos que el Dios del Tiempo esté lo más distraído y debilitado posible cuando luchemos contra él, si queremos tener alguna posibilidad realista de éxito.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch12a_fyron
  - name: b3_ch12a_fyron
    routes:
      - condition: ch11_saved_rose = 1
        texts:
          - source: scene_text
            paragraph: 46
            text: |-
              Ah, y casi me olvido de Rose. También hemos tenido conversaciones prácticamente a diario con ella, especialmente durante nuestras reuniones informativas con Arraka, quien está muy interesado en conocer cada pequeño avance relacionado con el control de Rose sobre sus poderes temporales. Por el momento, es capaz de detener el tiempo durante quince segundos como máximo, y eso la cansa bastante rápido, pero ha dominado la capacidad de mantener el tiempo descongelado para nosotros, incluso cuando estamos tan lejos de ella, siempre y cuando pueda concentrarse en el sonido de nuestras voces provenientes del transceptor. Ella nos dijo que también logró ralentizar el tiempo, pero este es un efecto que, a diferencia de sus poderes para detener el tiempo, parece afectar solo a un área determinada en lugar de a todo el mundo, por lo que no puede hacerlo por nosotros desde la distancia.

              "Oye, Illuna, ¿te importaría si te hiciera una pregunta?" Digo, una vez que nos reunimos todos y comenzamos a comer.

              "Si se trata del sabor ligeramente quemado de la carne guiverno, debes saber que yo no tuve nada que ver con eso", me dice Illuna.

              "No, en realidad se trata de los nodos Magium", digo. "Por lo que he recopilado hasta ahora, parece que usted y Arraka han interactuado con uno de los nodos en el pasado, pero tenía la impresión de que cada uno de estos nodos está siendo custodiado estrechamente por la facción principal de Varathia que lo posee. ¿Puede decirnos cuál fue el nodo que utilizó, o también es un secreto que no puede contarnos?"
          - source: scene_text_2
            paragraph: 37
            text: |-
              "Era el nodo de Fyron", dice Illuna. "Ese también es el que Arraka ha estado usando, incluso antes de Fyron, si hay que creerle. Personalmente, no la he visto usarlo ni una sola vez durante el tiempo que me estuvo 'orientando', y ni siquiera se molestó en mencionarme su existencia en ese momento".

              "Por supuesto que no lo estaba usando en ese momento", dice Arraka. "Ya había obtenido la mayor parte de la información que necesitaba del Magium mientras todavía estaba en el plano mágico. Lo único que me interesaba de los nodos en el plano terrestre era encontrar un camino de regreso a mi propio plano de existencia, pero no pude encontrar nada útil. Las cosas podrían haber ido mejor si no hubiera estado atrapado en una montaña u obligado a habitar cuerpos de animales durante la mayor parte de mi tiempo aquí, pero nunca tuve exactamente la oportunidad de probar esa hipótesis".

              "Pero ambos habéis estado en este nodo desde que Fyron tomó el control, ¿verdad?" pregunta Daren. "¿Cómo lo convenciste para que lo compartiera contigo?"
          - source: scene_3
            paragraph: 26
            text: |-
              "Realmente no lo he usado muchas veces en los últimos veinte años desde que lo encontré por primera vez con Flower", dice Illuna, "pero normalmente Fyron nos pedía un pequeño favor a cambio de algunas visitas al nodo. Así es como normalmente funcionan las cosas con él, como estoy seguro que Barry ya te lo habrá dicho. Si quieres visitar su nodo mientras estás aquí, Estoy seguro de que podrás llegar a un acuerdo con él cuando nos volvamos a encontrar con él en Galamir".

              "Oh, claro", dice Daren, "porque estará allí para las discusiones diplomáticas antes del comienzo de la guerra con Tyrath. Con suerte, lo atraparemos antes de que se vaya".

              "Oh, no tienes que preocuparte por eso", dice Diane. "Esas discusiones no comenzarán en absoluto antes de que todos lleguen allí y, según Meridith, no seré el único que llegará tarde. Tendrás la oportunidad de hablar con él, estoy seguro".

              "¿No deberías ser tú quien esté preocupado?" pregunta Illuna a Diane, mientras levanta una ceja. "Si hacen un trato con Fyron sobre su nodo, tendrán una razón menos para aceptar el trato de Meridith sobre matar a Eiden".
