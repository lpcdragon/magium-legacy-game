          - set:
              current_scene: b3_ch12a_exercise
  - name: b3_ch12a_exercise
    texts:
      - source: scene_text
        paragraph: 17
        text: |-
          "'Flecha de fuego' no está en su lista de hechizos", dice Arraka. "Ese era el objetivo de este ejercicio. Le hice lanzar el hechizo más fácil que no podría incluirse en su dispositivo, porque su potenciador de estadísticas se inventó hace más de seiscientos años y la flecha de fuego hechizo solo se creó cien años después. No creo que entiendas el gran avance que supone esto. Hasta ahora, Barry tenía la impresión de que lanzar algo más que el hechizos incluido en su dispositivo era fundamentalmente imposible. Ahora que hemos establecido claramente que también puede lanzar otros hechizos, esto le ha abierto una cantidad infinita de nuevas opciones, con suficiente práctica, podría aprender a lanzar algunos de los hechizos especiales diseñados por mí, y diablos, tal vez incluso el primordial hechizos. Es sólo una cuestión de tiempo en este momento.

          "Yo... no me di cuenta de que ustedes dos estaban pensando con tanta anticipación", dice Illuna, que ahora parece haberse calmado.

          "Bueno... ¿por qué no lo haríamos?" digo. "ESTAMOS tratando de matar a un dios, ¿no?"

          "Sí..." dice Illuna. "Supongo que sí. Y el hecho de que parezca que nos estamos acercando de manera realista a este objetivo me hace dudar cada vez más de mi propia cordura cada día que pasa..."

          "¡Ja!" Arraka dice. "¡Aún no has visto nada! ¡Quédate conmigo y pronto, matar a algunos dioses te parecerá una tarde normal!"
      - source: scene_text_2
        paragraph: 16
        text: |-
          "¡Oye, Hadrik!" Le digo al enano mientras pasa junto a nosotros, luciendo tan desconcertado como lo estaba Illuna al principio. "Sírveme un vaso de cerveza, ¿quieres? ¡Acabo de lanzar mi primera flecha de fuego! ¿Ves esa marca quemada en el árbol? ¡Ese era yo! ¡Jajajaja!"

          "Uhm... ¡bien por ti, hombre!" Dice Hadrik, mientras me da una palmada en la espalda, muy poco convencido. "¡Bien por usted!"

          Poco después de que Hadrik saca el cristal, Diane también se une a nosotros, y luego Kate y Daren también se acercan a nosotros para ver de qué se trataba toda la conmoción. Me tomó algo de tiempo explicarles por qué lanzar este insignificante hechizo era tan importante para mí, y convencerlos de que no había perdido completamente mis sentidos cuando acepté estrellarme la cabeza contra un árbol durante una hora entera, pero una vez que aclaré todo, todos nos sentamos en círculo y disfrutamos el resto de nuestra noche, tomando un breve descanso de todos nuestros entrenamientos.

          "Entonces, Barry, ahora que puedes transmitir cualquier hechizo que quieras, sin limitaciones, ¿qué planeas probar a continuación?" Me pregunta Flower, mientras intenta sutilmente coger una botella de cerveza enana, pero luego sus ojos se vuelven azules brevemente y aleja su propia mano de la botella. "Si quieres algunas sugerencias, te recomiendo ampliamente el hechizo donde haces un enorme dragón con llamas que puedes usar para--"

          "Dudo que así sea como funciona", la interrumpe Illuna. "Puede que ya no esté limitado por la lista de hechizos proporcionada por su dispositivo, pero su nivel de poder mágico aún es muy bajo. Esto significa que solo podrá lanzar hechizos muy débil por el momento".
      - source: scene_3
        paragraph: 7
        text: |-
          "Exactamente", dice Arraka. "Mira, esta es la razón por la que los hechizos hechos por mí son tan geniales, en comparación con los creados por todos los demás simplones. Con mi hechizos original, no estás limitado por la cantidad de energía que tienes a tu disposición. Puedes hacer que los hechizos sean tan fuertes o tan débiles como quieras, dependiendo de cuánta energía quieras gastar en ellos".

          "Ahora empiezas a parecer un vendedor que se esfuerza demasiado por vender sus productos defectuosos", dice Illuna. "Acabamos de ver que la flecha de fuego que lanzó Barry funciona de la misma manera, por lo que claramente tus hechizos no son tan únicos como crees".

          "Pfft..." dice Arraka. "La flecha de fuego no cuenta. Ese es uno de los hechizos más nuevos. Muéstrame un hechizo de hace más de cinco mil años que haga lo que hacen mis hechizos, y luego hablaremos".

          "De todos modos..." digo. "Para responder a la pregunta de Flower, supongo que lo primero que querría probar son algunos hechizos con flujos más fáciles de recrear, para practicar un poco más antes de pasar a los complicados. Probablemente empezaría con algo como el hechizo de invocación de ranas de la Guía para principiantes sobre magia de invocación. Hmm, o tal vez el hechizo de daga flotante que a esos estafadores les gusta usar cuando fingen que hacen malabares. Ah, ¡o podría probar ese hechizo con el que puedes hacer que pequeñas chispas vuelen por el aire como si fueran fuegos artificiales diminutos!"

          "O... aquí tienes una idea", dice Arraka. "¿Qué tal si pruebas un hechizo que no sea completamente inútil?"
