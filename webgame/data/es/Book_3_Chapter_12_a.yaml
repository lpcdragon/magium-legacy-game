    routes:
      - condition: b3_ch12_chance = 0
        texts:
          - source: scene_text
            paragraph: 25
            text: |-
              "¿Podremos utilizar la misma estrategia contra el Dios del Tiempo?"

              "Por supuesto que no", dice Arraka. "El cuerpo del Dios del Tiempo cuando se manifiesta en el plano terrestre está esencialmente hecho de luz azul. ¿Alguna vez has probado la luz helada antes?"

              "No, pero nunca antes había visto luz tomando la forma de un cuerpo humanoide", digo. "Pensé que un rayo de hielo tan poderoso podría tener algún tipo de efecto sobre él".

              "Bueno, calculaste mal", dice Arraka. "Como he dicho antes, afilar las auras alrededor de tus elementos es nuestra mejor apuesta contra él, junto con la espada de Daren y tal vez el Endurecimiento de aura de Hadrik cuando lo usa en sus puños, aunque no estoy del todo segura de esa opción. Aparte de eso, algunos de los hechizos que inventé también podrían ayudar, pero dependerá de si logras aprenderlos o no".

              "Malditos sean los dioses..." dice Hadrik, de la nada. "Dijiste que tenías 'una última cosa' que probar antes de dar por terminado el día, pero aún no has terminado de hablar. ¿No podemos disfrutar durante una hora sin pensar en nuestro entrenamiento?"
          - source: scene_text_2
            paragraph: 20
            text: |-
              "Ya había terminado de hablar, idiota", dice Arraka. "Diviértete intoxicándote con ese veneno lento que te gusta llamar 'cerveza enana'. Voy a volver a mi investigación".

              "¡Eso es lo que me gusta oír!" Dice Hadrik, mientras toma otro trago de su botella.

              Pasamos aproximadamente media hora siguiendo bebiendo con Hadrik, mientras intentamos hablar de cualquier otra cosa que no sean nuestros entrenamientos para variar, y luego Diane y yo decidimos irnos temprano para que ella pudiera ayudarme con mi hechizos, como me prometió.

              Mientras intentamos encontrar un lugar agradable y aislado, lejos de los demás, me pierdo temporalmente en mis pensamientos cuando recuerdo el entusiasmo con el que Diane aceptó convertirse en mi sujeto de prueba para esa noche, a pesar de tener todas las razones para no querer hacerlo, al igual que Kate.

              Ahora que lo pienso, esta no fue la primera vez que Diane actuó de esta manera. Desde que dejamos el cuartel general de Lessathi, ha estado invirtiendo mucho esfuerzo en tratar de llevarse bien con todos. Quizás demasiado esfuerzo. Normalmente, esto no sería un problema, porque está muy claro que ella se preocupa profundamente por Kate, y no es algo inusual querer llevarse bien con sus amigos, pero también es difícil ignorar el hecho de que ella es esencialmente la segunda al mando de Meridith, por lo que tendría todas las razones para querer acercarse a nosotros si sus órdenes fueran ganarse lentamente nuestra confianza y convencernos de que aceptar la oferta de Meridith es una buena idea.
          - source: scene_3
            paragraph: 12
            text: |-
              Creo que Daren y Hadrik podrían haber pensado en esto también, porque definitivamente los he visto manteniendo su distancia de Diane, a pesar de sus repetidos intentos de agradarles. Me siento un poco mal por sospechar así de la amiga de la infancia de Kate, pero supongo que también habría ayudado si ella hubiera actuado con un poco más de naturalidad y no se hubiera esforzado tanto en convertirse en nuestra amiga. Por otra parte, tal vez simplemente esté siendo incómoda y comenzará a relajarse en unos días, una vez que nos conozca mejor. El tiempo lo dirá.

              "Creo que por aquí debería estar bien", dice Diane, mientras se detiene en algún lugar cerca del río. "Estamos lo suficientemente lejos de los demás como para no distraerlos de sus propios entrenamientos. Entonces, ¿qué tipo de hechizos probaremos hoy, Barry? Como habrás adivinado, tengo una tolerancia bastante alta al dolor, ¡así que no hay necesidad de contenerme!"
