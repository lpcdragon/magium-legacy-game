              "¿No escuchaste?" Le digo, mientras sigo intentando apuntarle mientras él se mueve constantemente. "¡Las hadas invisibles del bosque han puesto una maldición sobre este lugar para que cualquiera que corra demasiado perderá la vista para siempre!"

