            text: |-
              "Entonces... ¿está bien si voy a lavar los platos?" Nos pregunta Flower, de repente. "Veo que ya terminaron de comer".

              "En realidad, creo que hoy estaré lavando los platos", dice Illuna. "He estado usando el conocimiento que recuperé del nodo Magium de Meridith para mejorar un hechizo mío, y esta sería una buena manera de practicarlo".

              "¿Usaste conocimientos del Magium para trabajar en un lavavajillas hechizo?..." pregunta Hadrik, confundido.

              "Este no es el propósito previsto del hechizo, pero claro, puedes llamarlo así, si quieres", dice Illuna, mientras hace que una de las placas flote en el aire, dentro de una esfera de agua.

              "¡Oye, espera un minuto!" Arraka dice. "Ese es el hechizo que te enseñé, ¿no? ¡El que usaste contra Tyrath para ahogarlo en Thilias!"

              "Es una versión mejorada de su hechizo", dice Illuna. "En este punto, es lo suficientemente diferente como para llamarlo 'mi' hechizo".
          - source: scene_3
            paragraph: 28
            text: |-
              "Ajá", dice Arraka. "Claro que lo es. Aún así, me alegra el corazón que finalmente hayas decidido superar tu odio hacia mí lo suficiente como para al menos hacer uso del hechizos que te enseñé. Habría sido un desperdicio si continuaras ignorando todas mis enseñanzas".

              "Si te sientes tan hablador, ¿qué tal si eres realmente útil y aportas tu opinión sobre las modificaciones que hice en tu hechizo?", dice Illuna. "Me he centrado especialmente en mejorar su estabilidad y en hacer que el agua se regenere lo suficientemente rápido como para resistir la mayoría de los ataques de fuego más fuertes".

              "Hmm..." dice Arraka. "No está mal. Hay algunos pequeños ajustes que haría, pero aparte de eso, no se ve nada mal. Aquí, déjame marcar algunas de las deficiencias que he notado, para que puedas trabajar en ellas".
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch12a_sober
                condition: b3_ch12_hadrik = 1
              - set:
                  current_scene: b3_ch12a_rock
                condition: b3_ch12_hadrik = 0
  - name: b3_ch12a_sober
    texts:
      - source: scene_text
        paragraph: 52
        text: |-
          "¿No vas a beber cerveza hoy, Hadrik?" Dice Daren, ya que Illuna está ocupado siguiendo las indicaciones de Arraka mientras lava los platos. "¡Eso es ciertamente inusual!"

          "Uf..." dice Hadrik. "No me lo recuerdes. He tenido dolor de cabeza toda la mañana debido a la resaca".

          "¿Pero por qué hoy precisamente?" pregunta Daren. "¿Hay alguna ocasión especial?"

          "Sí", dice Hadrik. "En la ocasión especial de Barry, ayer me probaron un mareo hechizo. No sé si es una reacción alérgica o algo así, pero hay ciertos mareos hechizos que pueden causarme náuseas con el simple olor de cualquier tipo de alcohol. Los efectos generalmente tienden a aparecer realmente al día siguiente después de que me hayan aplicado el hechizo, y normalmente duran hasta altas horas de la noche".

          "Oh, maldita sea..." digo. "Lo siento. Habría elegido un tipo diferente de hechizo si hubiera sabido que esto era un problema para usted".

          "Está bien", dice Hadrik. "Nunca me molesté en contarle a nadie sobre esto, así que no habría manera de que lo supieras. De todos modos, Daren, ya que no puedo beber hoy, ¿te importaría tener una breve sesión de entrenamiento conmigo para que al menos pueda descargar algo de mi frustración? Intentaremos terminar cuando Illuna termine de practicar su hechizo con Arraka".
      - source: scene_text_2
        paragraph: 40
        text: |-
          "Claro", dice Daren. "Vayamos allí y podremos empezar de inmediato".

          Tan pronto como Daren y Hadrik se alejan del resto de nosotros y se colocan en sus posiciones, ambos cuentan hasta tres al mismo tiempo y luego se lanzan el uno hacia el otro casi de inmediato. Sin embargo, ni siquiera treinta segundos después del inicio de la batalla, Daren pide un tiempo muerto inesperado.

          "¡Para, para, para!" Daren grita de repente. "Hadrik, ¿qué diablos estás haciendo?"

          "¿Qué quieres decir con qué estoy haciendo?..." dice Hadrik. "Estoy peleando. Me has visto pelear docenas de veces antes".

          "¡No así!" Daren dice. "¡Tus movimientos no son los mismos en absoluto! ¡Es como si te hubieras convertido en una persona completamente diferente de la noche a la mañana! ¿Cómo pudiste haber cambiado tanto tu estilo de lucha en el transcurso de un día? ¡Ni siquiera podía predecir la mitad de esos movimientos y estaba leyendo tu aura en cada paso del camino!"

          "Oh, sí", dice Hadrik. "Ahora que lo pienso, la gente me ha dicho en el pasado que peleo un poco mejor cuando no estoy borracho. Supongo que ha pasado tanto tiempo desde que estuve sobrio que simplemente lo olvidé".
      - source: scene_3
        paragraph: 29
        text: |-
          "Hadrik, amigo mío..." dice Daren. "Este estilo de lucha tuyo no es sólo un poco mejor, ¡es una gran mejora! Apenas podía entenderlo y te he visto pelear innumerables veces. Si ya sabes que puedes pelear mucho mejor sin beber, ¿por qué no tomar un descanso del alcohol hasta que termine el torneo? ¿No quieres ser más fuerte cuando pelees contra tus oponentes?"

          "Hmm..." dice Hadrik. "¿Cómo voy a explicarte esto de una manera que tenga sentido?... Verás, para mí, beber alcohol es como respirar aire. Si alguien viniera a ti ahora y te dijera que podrías pelear diez veces mejor si dejaras de respirar, ¿lo harías?"

          "Supongo que debería haber sabido que dirías algo como esto", dice Daren. "No importa. Olvida que incluso te pregunté. Illuna, ¿ya terminaste con esos platos?"

          "Casi", dice Illuna. "Estos dos son los últimos".
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch12a_rock
  - name: b3_ch12a_rock
    routes:
      - condition: b3_ch12_hadrik = 0 AND b3_ch12_diane = 1
        texts:
          - source: scene_text
            paragraph: 53
            text: |-
              Al darnos cuenta de que Illuna y Arraka probablemente estarán ocupados por un tiempo más, el resto de nosotros vamos a empacar nuestras tiendas y prepararnos para continuar nuestro viaje. Para cuando terminamos, Illuna también había terminado de lavar los platos, así que los metimos todos en la mochila de Hadrik y luego seguimos nuestro camino, en dirección al bosque sagrado más cercano.

              Según Diane, si mantenemos nuestro ritmo habitual, deberíamos llegar en algún momento de la tarde. Todavía no hemos decidido exactamente qué planeamos hacer si el zorro vuelve a atraparnos en su territorio mientras buscamos piñas, pero supongo que cuando ya tenemos tantos enemigos fuertes, agregar uno más a la lista no debería hacer mucha diferencia.

              En el camino a nuestro destino, noté que Diane insistía mucho menos en tratar de ser amigo de todos. Como resultado, ella actuaría de manera más natural, lo que a su vez también permitió que Hadrik y Daren estuvieran un poco más relajados en sus conversaciones con ella. Es bueno ver que mi consejo le está funcionando. Después de todo, tal vez fuera una buena idea hablar con ella sobre esto.

              "¡Oh dioses!" exclama Flower, ni siquiera una hora después de nuestra partida, mientras señala con entusiasmo una roca de aspecto muy mundano. "Barry, ¿ves eso? ¡Es una roca escudo-capa! ¡Una roca escudo-capa, Barry!"
          - source: scene_text_2
            paragraph: 41
            text: |-
              "Ya lo veo", digo, en un tono muy poco entusiasta.

              "Esa roca... no se parece en nada a una capa o un escudo...", dice Daren. "¿Por qué lo llamarías así?"

              Después de escuchar lo que Daren tenía que decir, Flower sacude la cabeza con desaprobación y lo mira como si fuera un tonto que no tenía gusto por las bellas artes.

              "No lo entenderías..." dice, y luego va a agarrar la piedra del suelo.

              "¡Oh, por el amor de Dios!" dice Arraka, de repente. "¡Ni uno más de estos!"

              "Sí, hay muchas rocas aquí en el plano terrestre", dice Hadrik. "Será mejor que te acostumbres."

              "¡La roca no, idiota!" Arraka dice. "Es uno de los hechizos invisibles de Eiden que ha estado lanzando por todo el continente. La chica simplemente chocó contra él con mi amuleto colgado alrededor de su cuello, y siempre tengo una sensación de hormigueo cada vez que hace eso. Es extremadamente molesto".

              "Dijiste 'ni otro de estos'..." le dice Daren. "¿Cuántos de estos hechizos has estado detectando últimamente?"

              "¿En los últimos dos días?" pregunta Arraka. "Cinco de ellos. Y esos son sólo los que se topó con Flower. Puede que haya habido más, pero realmente no me molesté en buscarlos activamente. Aparentemente, Eiden ha estado muy ocupado últimamente".

              "¿Tienes alguna idea de para qué está usando estos hechizos?" digo.
          - source: scene_3
            paragraph: 30
            text: |-
              "No", dice Arraka. "Si realmente quisiera, probablemente podría resolverlo, pero tendrías que quedarte en el lugar y dejarme analizar uno de estos durante al menos un día, o tal vez más. Créeme, sería una pérdida de tiempo para todos nosotros".

              "Qué lástima", dice Daren. "Si hubiera podido hacerlo en sólo unas pocas horas, podría haber valido la pena. Si Eiden ha estado colocando tantos de ellos en todo el continente, entonces estos hechizos deben ser muy importantes para él".

              "Aquí tienes una idea", dice Arraka. "¿Qué tal si no intentas enemistarte con Eiden también, mientras ya estamos ocupados haciendo planes para matar a los dioses y a la copia mía del pasado? Tomemos las cosas una a la vez, ¿de acuerdo?"

              "Bien, bien", dice Daren. "Pero para que conste, no estaba tratando de antagonizarlo ni nada parecido. Sólo estaba pensando que tal vez si descubriéramos lo que buscaba, podríamos entender mejor sus motivaciones, y tal vez eso podría ayudarnos a encontrar algo en común con él".

              "Claro que sí", dice Arraka, en tono sarcástico. "¡Muy bien, sigan adelante, amigos! No hay nada que ver aquí".

              Tan pronto como abandonamos el área, Flower saca su transceptor y le grita fuerte.

              "¡Oye, Melindra!" ella dice. "¡Nunca adivinarás qué roca encontré tirada en la hierba en medio del bosque!"
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch12b_distracting
                  storyboard_controls: Jump to frame "Book 3 Chapter 12 b"
