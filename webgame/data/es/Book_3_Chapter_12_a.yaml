              "No puedo creerlo..." dice Hadrik, ya que su mareo parece haber desaparecido ya. "Sabía que tenías una estadística de Farol en tu dispositivo y de alguna manera aun así caíste en la trampa. Bueno, no sucederá dos veces seguidas. Vamos, Barry, dime que me quede quieto otra vez. ¡Te reto!"

              "Oye, obviamente no voy a intentar la misma mentira dos veces", digo, "pero, ahora que lo pienso, escuché que si no te mueves de ese lugar durante más de un minuto, puedes volverte dos veces más fuerte de lo que eres ahora".

