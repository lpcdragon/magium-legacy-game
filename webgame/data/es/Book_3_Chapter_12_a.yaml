              "Claro", digo, mientras Daren saca la baraja de cartas que le dio Hadrik y las pone en el suelo junto a mí. "¡Veamos qué tienes!"
            condition: b3_ch12_spell = 3 AND b3_ch5_moustache != 2
          - source: scene_3
            paragraph: 20
            text: |-
              "Oh, bueno, si estás seguro", dice Daren, mientras pone los ojos en blanco.

              "Entonces, ¿dónde están esos naipes?" Le pregunto a Daren.

              "¡Los tengo aquí!" Me responde, mientras saca la baraja de cartas y las pone en el suelo a mi lado.

              Durante las siguientes horas, Daren y yo jugamos algunos juegos de cartas diferentes de nuestros países de origen, mientras intercambiábamos algunas historias de nuestra época antes del torneo. Normalmente, Daren habría sido quien habría hecho la mayor parte de la narración, pero esta vez insistió en que yo también le contara algunas de mis aventuras, a pesar de que le advertí que cualquier situación en la que hubiera estado sonaría aburrida en comparación con lo que él y Hadrik han experimentado a lo largo de sus vidas.

              Una vez que terminé de contarle algunas de mis historias, no pude evitar notar que logré mantener su interés por mucho más tiempo del que esperaba. Parecía estar prestando mucha atención todo el tiempo que estuve hablando y, a veces, incluso sentía que apenas podía esperar más para escuchar el final de la historia. ¿Será que realmente lo disfrutó?
