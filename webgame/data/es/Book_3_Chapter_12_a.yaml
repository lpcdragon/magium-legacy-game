  - condition: b3_ch3_stats_unavailable = 1
    effects:
      - disable stats
  - condition: b3_ch3_stats_unavailable = 0
    effects:
      - enable stats
scenes:
  - name: b3_ch12a_intro
    texts:
      - source: scene_text
        paragraph: 2
        text: |-
          "¡Arraka, despierta!" Illuna dice. "Barry ya completó la tarea que le diste hace diez minutos. Si no le das algo que hacer, comenzará a probar ese desagradable hechizo suyo con el destello de luz cegadora una y otra vez, y ninguno de nosotros quiere eso".

          "Oye", digo, "deberías estar agradecido de haber probado ese hechizo tantas veces como lo hice. Lo último que querrías durante una pelea tensa sería que te cegara por accidente porque no practiqué lo suficiente. Ese hechizo tiene una sincronización muy delicada, ¿sabes?".

          "Estoy segura de que sí", me dice Illuna en un tono desdeñoso, y luego toma el amuleto nuevamente para poder hablar más alto. "Arraka, en serio, ¿qué estás haciendo? Te hemos estado llamando durante años y no has respondido en absoluto. No me hagas engañarte".

          "¡Está bien, está bien!" Dice Arraka, en tono exasperado. "Le daré a Barry su maldita tarea. Sólo dame un minuto más. Estoy como en medio de algo".

          "Déjame adivinar", dice Illuna. "Estás tratando de encontrar una explosión hechizo que requiera menos energía para lanzarse, para que puedas tomarnos por sorpresa la próxima vez que intentes escapar del amuleto. ¿Es eso?"

          "Incorrecto", dice Arraka. "Si hubiera una explosión más rápida hechizo, la habría usado hace años. Pero si tienes que saberlo, actualmente estoy tratando de crear una versión modificada de mi absorción de alma hechizo donde, en lugar de absorber el alma del anfitrión, me fusiono con él y ambos obtenemos el mismo control del cuerpo".
      - source: scene_text_2
        paragraph: 2
        text: |-
          "¿Quieres decir... como yo y Flower?" Pregunta Illuna, perplejo. "Pero... ¿por qué? ¿Qué podrías ganar al hacer algo como esto a propósito? Pensé que odiabas cuando te fusionaste con Therius por accidente".

          "Lo hice", dice Arraka. "Pero verás, la cuestión es que si alguna vez vuelvo a escapar de mi amuleto, por cualquier razón, no puedo darme el lujo de tomar el cuerpo de Flower de la misma manera que la última vez, porque entonces ambos esencialmente estarían muertos, todos me atacarían para vengarte nuevamente, y me vería obligado a asesinarlos a todos, esta vez para siempre".

          "¿Y por qué exactamente eso sería un problema para ti?..." pregunta Illuna, todavía tan confundido como antes. "Ya nos mataste una vez. ¿Por qué no hacerlo de nuevo?"

          "¡Porque entonces todo mi plan de utilizarlos a todos para vengarme de los dioses se arruinaría!" grita Arraka. "¡No voy a tener otra oportunidad como esta en un millón de años! ¿Dónde más crees que voy a encontrar otro grupo de payasos que tenga un problema personal con uno de los dioses y tenga una mínima posibilidad de matarlos con mi guía? ¿Crees que quiero volver a mi viejo y aburrido plan de simplemente matarlos yo mismo después de que se me ocurrió una idea genial como esta?"
      - source: scene_3
        paragraph: 2
        text: |-
          "No puedes hablar en serio...", dice Illuna. "¿Me estás diciendo que estás dispuesto a vivir conmigo Y con Flower en la misma mente, mientras compartes el control del cuerpo con los dos, sólo por el bien de tu plan?"

          "Sí, claro, ¿por qué no?" Dice Arraka, en tono casual. "Podemos hacer fiestas de té con galletas y lo que sea por la mañana, y luego haremos los asesinatos por la noche. Estoy seguro de que podemos llegar a un acuerdo".

          "Lo siento, pero esto me resulta muy difícil de creer...", dice Illuna.

          "Como deberías", le dice Arraka. "Si hubieras estado tan dispuesto a confiar en la palabra de alguien que ya te mató una vez, entonces habría significado que no aprendiste nada de mí durante los años en que fuiste mi alumno".
