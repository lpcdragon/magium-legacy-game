  - name: b3_ch12a_combining
    routes:
      - condition: b3_ch12_believe = 1
        texts:
          - source: scene_text
            paragraph: 3
            text: |-
              "Bueno, yo personalmente creo en Arraka", digo.

              "¿Ves eso?" Arraka le dice a Illuna. "Barry es un imbécil crédulo. Todo lo que necesito hacer es actuar amigablemente con él durante unos días y él pensará que soy inofensivo. ¿No te alegra que no hayas terminado como él?"

              "Sólo en eso tendré que estar de acuerdo contigo", dice Illuna, de mala gana.

              "Sí, sí, lo que ustedes digan", les digo. "Si me necesitas, estaré allí, junto a esas rocas, probando algunos hechizos más".

              Dejo que Arraka se concentre en investigar su nuevo hechizo mientras me dirijo a una parte más aislada de nuestro campamento, lo cual es perfecto para soltarme un poco y experimentar con mi magia recién adquirida. Durante los dos días desde que dejamos la base Lessathi, pasé el mayor tiempo posible catalogando mis hechizos disponibles en mi computadora portátil y probando cada uno de ellos, para asegurarme de que realmente podía usarlos cuando fuera necesario.
          - source: scene_text_2
            paragraph: 3
            text: También probé bastantes combinaciones de hechizos que descubrí mientras investigaba con Brinhorn en el pasado, pero algunas de ellas resultaron ser más complicadas de lo que pensaba. Como era de esperar, resulta que es mucho más fácil teorizar sobre los efectos de una combinación hechizo que lograr utilizarla en la práctica. Combinar hechizos es una técnica realmente avanzada, después de todo, y el dispositivo de estadísticas realmente no tiene ninguna característica incorporada que me ayude con esto, ya que fue diseñado para lanzar el hechizos por separado.
          - source: scene_3
            paragraph: 3
            text: La única forma en que puedo acostumbrarme a esto es mediante la experimentación repetida, tal como lo habría hecho si fuera un mago normal. Supongo que esto es algo raro por lo que Brinhorn realmente merece algunos elogios. Cada vez que se me ocurría una idea extravagante para combinar dos o más hechizos, casi siempre lograba que funcionara casi sin esfuerzo y podía seguir mis instrucciones perfectamente. Se podría decir fácilmente que había pasado innumerables horas practicando su magia, todo con el propósito de superar algún día a Azarius.
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch12a_practicing
                  available_points: available_points + 4
                  available_points_aux: available_points_aux + 4
      - condition: b3_ch12_believe = 0
        texts:
          - source: scene_text
            paragraph: 4
            text: |-
              "Por si sirve de algo, tampoco creo en Arraka", digo.

              "Muy bien", dice Arraka. "Entonces tal vez no seas una causa completamente perdida después de todo. Ahora sé un buen chico y juega con tu hechizos durante unos minutos más mientras termino lo que estoy haciendo aquí".

              "Como si no fuera a hacer exactamente eso incluso sin que me lo digas..." digo. "Si me necesitas, estaré allí, junto a esas rocas".

              Dejo que Arraka se concentre en investigar su nuevo hechizo mientras me dirijo a una parte más aislada de nuestro campamento, lo cual es perfecto para soltarme un poco y experimentar con mi magia recién adquirida. Durante los dos días desde que dejamos la base Lessathi, pasé el mayor tiempo posible catalogando mis hechizos disponibles en mi computadora portátil y probando cada uno de ellos, para asegurarme de que realmente podía usarlos cuando fuera necesario.
