  - name: b3_ch12a_sky
    texts:
      - source: scene_text
        paragraph: 36
        text: |-
          En mi camino, paso por Diane, quien aparentemente todavía estaba en una conversación con Arraka, desde que terminó de ayudarme a probar mi hechizos. Ahora que lo pienso, es posible que la haya visto hablando con Arraka una o dos veces antes y, por alguna razón, parecen llevarse bastante bien. Me pregunto si hay algo que me estoy perdiendo aquí...

          "¿Puedo hacerte una pregunta?" Diane le dice a Arraka, ya que ahora me detuve en seco para escuchar su conversación. "¿Cómo es el plano mágico? Sigo escuchándote hablar sobre ello, pero realmente no tengo ningún ejemplo del mundo real con el que compararlo, y es un poco difícil llenar los vacíos solo con mi imaginación".

          "Hmm..." dice Arraka. "Eres un etéreo, ¿verdad? Bueno, el plano mágico en realidad se siente bastante similar al éter del Plano Etéreo, excepto que en lugar de un plano infinito de luz, es un plano infinito de energía mágica, si eso tiene algún sentido para ti. No estoy seguro de poder explicárselo más claramente que esto a alguien que en realidad no lo haya experimentado".

          "No, no, ¡esa es realmente una muy buena explicación!" Diane dice. "Me alegra que hayamos tenido esta charla. De todos modos, se está haciendo tarde, así que creo que me despediré por esta noche".

          "¡Sí, sí, por supuesto!" Dice Arraka, con una voz inusualmente agradable. "Sólo una última pregunta, si fueras tan amable. ¿De qué color es el cielo en este momento?"

          "¿El cielo?" Pregunta Diane, con una sonrisa, mientras echa un vistazo rápido al cielo oscuro sobre nosotros. "¡Vaya, es rosa brillante, por supuesto! ¡Como cualquier otro día!"
      - source: scene_text_2
        paragraph: 27
        text: |-
          "¡Mis gracias!" Le dice Arraka, con la misma voz agradable, mientras Diane hace una cortés reverencia y ella se dirige hacia su tienda.

          "Entonces, uh... veo que realmente te llevas bien con Diane, ¿eh?" Pregunto a Arraka, ya que ahora me acerco a Flower y Illuna.

          "¡Oh, sí, la chica es maravillosa!" Arraka me lo dice. "¿Sabías que le he estado haciendo exactamente la misma pregunta al final de cada conversación que hemos tenido, y ella me ha estado dando la misma respuesta, pero la reacción de su aura fue diferente cada vez?"

          "No estoy... seguro de entender lo que eso significa", le digo.

          "Ella está usando la misma técnica de ocultación de aura que estaba usando rey del subsuelo", me explica Arraka. "Creo que debe haberlo aprendido de Meridith, porque todos los Lessathi estaban usando una versión cruda de esta técnica, pero solo Meridith y Diane son lo suficientemente competentes como para estar en el nivel de rey del subsuelo, o tal vez incluso mayor que eso. Esencialmente, controlan sus auras tan bien que pueden enmascarar casi por completo si están mintiendo o no, y además de eso, también les gusta hacer que sus auras tiemblen ligeramente a intervalos aleatorios, para que parezca que están mintiendo incluso cuando dicen la verdad".

          "Interesante..." digo. "¿Crees que todos están usando esto como precaución, en caso de que alguna vez sean interrogados por Eiden?"
      - source: scene_3
        paragraph: 19
        text: |-
          "Lo más probable es que sí", dice Arraka. "Definitivamente es una habilidad única, se lo concedo. Realmente no le estaba prestando mucha atención antes de darme cuenta con el rey del subsuelo, pero ahora me estoy interesando cada vez más".

          "Entonces, ¿de qué estaban hablando ustedes dos antes de que yo viniera?" digo. "Ambos parecían estar realmente divirtiéndose".

          "Para ser honesto, ni siquiera recuerdo cuál fue el tema principal de nuestra conversación, y probablemente tampoco lo recuerde Diane", dice Arraka. "Solo estamos jugando un juego, ella y yo. Un juego en el que el objetivo es que yo descubra la forma en que funciona su ocultación de aura, mientras ella juega conmigo y sonríe con confianza, desde una posición de clara superioridad. Ha pasado mucho tiempo desde que tuve el placer de ser el perdedor en cualquier juego o competencia que involucre magia, así que estoy disfrutando esto al máximo".

          "¿Entonces esto significa que no estás ni cerca de descubrirla?" Le pregunto a Arraka.

          "Oh, estoy seguro de que eventualmente cometerá un error", dice Arraka. "Es sólo cuestión de tiempo".
