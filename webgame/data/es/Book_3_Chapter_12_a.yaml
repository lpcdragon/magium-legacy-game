  - name: b3_ch12a_nausea
    texts:
      - source: scene_text
        paragraph: 30
        text: |-
          Continúo probando mis hechizos en Diane durante aproximadamente media hora, hasta haber lanzado la mayoría de mis hechizos dirigidos útiles al menos una vez. El hechizo de mareo pareció funcionar bien una vez que Diane se quitó la protección, y le provocó un pequeño dolor de cabeza durante unos segundos, como era de esperar. Aparte de eso, también probamos unos cuantos hechizos de ilusión, un hechizo de sugestión y varios otros hechizos diseñados principalmente para distraer o desorientar a mis enemigos.

          De principio a fin, Diane ha seguido mis instrucciones a la perfección, sin quejas de ningún tipo. También ha mantenido su mismo comportamiento juguetón y extrovertido todo este tiempo, aunque a veces es difícil saber qué está pensando realmente. A diferencia de Kate, que a menudo dice exactamente lo que piensa, sin importar cuán directo o irrespetuoso sea, Diane es más del tipo que intenta suavizar las cosas con una broma de algún tipo. Sin embargo, también puede ser muy sencilla, impulsiva e incluso exaltada, dependiendo de la situación.

          Si tuviera que hacer una suposición basada en lo que he visto de ella hasta ahora, en comparación con cómo solía actuar de niña durante el ritual del Dios del Tiempo, diría que el lado más diplomático de su personalidad probablemente sea resultado de la educación de Meridith, mientras que su franqueza ocasional y su actitud impulsiva son rasgos que seguramente ya tenía de niña, pero que ahora intenta reprimir porque los considera defectos no deseados de su personalidad.
      - source: scene_text_2
        paragraph: 22
        text: |-
          Irónicamente, si hubiera actuado menos serena con nosotros y más como ella misma más joven, creo que le habría resultado mucho más fácil hacerse amiga de todos, porque la habría hecho parecer mucho más honesta.

          "Muy bien, creo que ese era el último hechizo que quería probar", digo, después de un rato. "¡Muchas gracias por la ayuda! ¡Realmente lo aprecio!"

          "¿Ya terminaste?" pregunta Diane. "Es una lástima. Casi estaba empezando a acostumbrarme a los mareos y a la sensación de náuseas".

          "Oye, si sientes que no has tenido suficientes náuseas por un día, siempre puedes pedirle a Hadrik un poco de cerveza", le digo. "¡No debería hacer falta más que una botella para que sientas la necesidad de vomitar otra vez!"

          "En realidad... no creo que Hadrik realmente quisiera compartir su cerveza conmigo", me dice Diane, en un tono más serio.
      - source: scene_3
        paragraph: 14
        text: |-
          "¿Por qué no?" digo. "¿Tuviste una pelea con él o algo así?"

          "No", dice Diane, "es sólo que cada vez que trato de hablar con él, parece nervioso y siempre se siente como si estuviera tratando de terminar la conversación lo más rápido posible. Para ser honesto, no puedo decir que lo culpe. Probablemente yo también estaría actuando así con alguien que me dejó inconsciente en medio del bosque sagrado y casi hace que me maten. Sé que empezamos con el pie izquierdo, y he estado tratando de suavizar las cosas con él y con todos los demás lo mejor que pude en los últimos dos días, pero para ser honesto, no he tenido mucha suerte. ¿Tienes alguna idea de cómo podría hacer que se acerque a mí? ¿Tal vez un juego favorito, o una comida favorita, o al menos algún tipo de tema para iniciar una conversación?"
