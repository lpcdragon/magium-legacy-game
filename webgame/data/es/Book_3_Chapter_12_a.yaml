            paragraph: 37
            text: |-
              "Creo que te estás engañando. Si aún no la has vencido, no tienes ninguna posibilidad".

              "Quizás", dice Arraka. "Quizás no. Ya veremos".

              "Esa es una... respuesta inusualmente tranquila y serena, viniendo de ti", le digo a Arraka.

              "¿Por qué no iba a estar tranquilo con esto?" Arraka dice. "Al final del día, es sólo un juego en el que ocupo mi tiempo libre. Me importa poco si lo gano o lo pierdo, y no es que realmente me interese saber si ella me está mintiendo o no. Sólo lo hago por el desafío".

              "Supongo que eso tiene sentido", digo. "Está bien, bueno, entonces supongo que me iré a mi turno de noche. ¡Más tarde!"

              "Mmm", dice Arraka.

              "¡Hasta luego, Barry!" Flower me lo dice.

              Me despido de Flower y luego voy directamente al lugar en el bosque donde Daren y yo acordamos encontrarnos. Elegimos un lugar donde estaríamos lo suficientemente cerca de nuestro campamento para detectar cualquier enemigo entrante con nuestro sentido mágico, pero también lo suficientemente lejos de todos como para no despertarlos con el sonido de nuestras voces.
          - source: scene_text_2
            paragraph: 28
            text: |-
              Una vez que llego, veo que Daren aún no ha llegado, así que decido recostarme con la espalda apoyada en un árbol y agarrar mi libreta. Realmente no quiero experimentar con ninguna combinación de hechizo tan cerca de nuestro campamento, en caso de que haya algún accidente, así que tal vez debería trabajar en un hechizo que sea un poco más inofensivo.

              Unos veinte minutos más tarde, Daren finalmente llega a nuestro punto de encuentro y se disculpa por llegar tarde, diciendo que Hadrik había insistido en que jugara una partida corta de Met-Zek con él antes de darle las cartas.

              "Entonces, ¿qué has estado haciendo mientras me esperabas?" Dice Daren, mientras echa un vistazo a mi cuaderno. "¿Investigando otro hechizo?"

              "Sí", digo. "Actualmente estoy tratando de descubrir cuál sería la mejor manera de hacer que un bigote se adhiera a la cara del Dios del Tiempo. ¿Qué piensas? ¿Debería usar una ilusión o un bigote real?"

              "Uh... ¿tampoco?" Daren dice. "Pensé que habíamos acordado que no intentaríamos cabrear al Dios del Tiempo sin ningún motivo hasta que seamos lo suficientemente fuertes para vencerlo. ¿De verdad quieres que nos maten a todos otra vez?"

              "Relájate", le digo. "En todo caso, probablemente me matará a mí, no al resto de ustedes. Y además, ni siquiera creo que el Dios del Tiempo sepa lo que es un bigote. Estoy seguro de que simplemente lo ignorará y seguirá adelante".
            condition: b3_ch5_moustache = 2
