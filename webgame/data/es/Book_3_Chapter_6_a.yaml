  - name: b3_ch06a_secret
    texts:
      - source: scene_text
        paragraph: 28
        text: |-
          Seguimos todos al dron de ojos verdes alejándonos de la calle principal y entrando en uno de los callejones del lado derecho. Tras unos cincuenta segundos caminando detrás del Supervisor, la bola se detiene de pronto delante de una casa abandonada con todas las ventanas rotas. Antes de que podamos preguntarle nada al Supervisor, la bola vuelve a hablar.

          "Aquí es donde está escondida la entrada de la tienda", dice el Supervisor. "Si apartan esa alfombra, verán que debajo hay una trampilla. Esta unidad no cabe por ahí, así que de aquí en adelante estarán solos. Cuando les pidan la contraseña, díganle al tendero que la contraseña es 'que cierre su puta boca y abra la puerta antes de que la volemos'."

          "¿Seguro que eso es una contraseña de verdad y no simplemente alguien que oíste amenazando al tendero para que abriera la puerta?", dice Hadrik.

          Esperamos a que el Supervisor diga algo, pero se queda en silencio.

          "Bueno?...", dice Hadrik. "¿No vas a responder la pregunta?..."

          "Pregunta poco clara", dice el Supervisor. "Por desgracia, el protocolo Supervisor no puede proporcionarle--"
      - source: scene_text_2
        paragraph: 17
        text: |-
          "Vale, vale, ya lo pillamos", dice Daren. "Entremos y ya iremos resolviendo las cosas sobre la marcha. No parece que el Supervisor pueda ofrecernos más información de todos modos."

          Dicho esto, Daren va a abrir la trampilla que está bajo la alfombra y deja al descubierto unas escaleras de madera que llevan al sótano de la casa. Bajamos con cuidado por las escaleras, intentando no perder de vista ninguna posible trampa, hasta llegar delante de un muro hecho de seredium. Si lo que dijo el Supervisor es cierto, esta es con toda probabilidad la puerta secreta que conduce a la tienda.

          "¿Hola?...", dice Daren en voz alta. "¿Podría abrirnos la puerta, por favor?"

          Esperamos unos segundos, pero solo hay silencio. Viendo que el tendero no piensa responderle, Daren vuelve a llamar.

          "¡Sabemos que tiene una herboristería escondida ahí detrás!", dice Daren. "Escuche, solo queremos echar un vistazo rápido a su mercancía. Llevamos mucho dinero encima. Le prometo que podemos hacer que le valga la pena."

          Tras unos segundos más de silencio, el tendero finalmente decide hablar, con una voz apenas audible desde el otro lado del muro.

          "¿Cuál es la contraseña?", dice.
    choices:
      - position: 1
        text: Decirle al tendero que la contraseña es que cierre su puta boca y abra la puerta.
        effects:
          - set:
              current_scene: b3_ch06a_secret2
              b3_ch6_password: 0
      - position: 2
        text: Decirle al tendero que la contraseña es un orangután borracho con gorro de fiesta.
        effects:
          - set:
              current_scene: b3_ch06a_secret2
              b3_ch6_password: 1
      - position: 3
        text: Decirle al tendero que ya le di la contraseña y que dijo que era correcta.
        effects:
