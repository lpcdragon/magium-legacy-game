        paragraph: 37
        text: |-
          "¡Podrían dejarme ir!", dice Loyrang. "Prometo que no les daré problemas. En cuanto salga de aquí, iré directo a las puertas de la ciudad y no volverán a verme nunca."

          "O podríamos atarte, por si acaso...", dice Daren. "No tenemos ninguna garantía de que no cambies de idea mientras sales de la ciudad."

          "O podríamos, ya saben... ¿matarlo?", dice Melindra. "¿No creen que sería una solución mucho más fácil a nuestro problema?"

          "Yo no recomendaría hacer eso", dice Loyrang con un tono calmado pero amenazante. "Puede que no les impresione mucho, pero no fui elegido guardia real porque sí. Estoy bastante seguro de que podría llevarme por delante al menos a uno o dos de ustedes si deciden pelear conmigo ahora mismo. No querrían que esto se ensuciara, ¿verdad?"
      - source: scene_text_2
        paragraph: 22
        text: |-
          "¡Como empiecen a matarse en mi tienda, juro que no les venderé nada más!", dice el tendero.

          "Quiero decir, técnicamente podríamos matarlo a usted también y llevarnos toda su mercancía", le dice Melindra al dueño de la tienda. "No es que TENGAMOS que comprarle nada."

          "Whoa, whoa, whoa...", dice Daren. "¡Más despacio! ¡Aquí no va a matar nadie a nadie! ¿Recuerdan que les hice prometer antes de entrar en la ciudad que no mataríamos a ninguno de los guardias a menos que fuera absolutamente necesario? Estas son exactamente el tipo de situaciones que quería evitar. Matar al rey es una cosa, pero nunca acordamos ir asesinando gente a diestro y siniestro cada vez que nos resulte más conveniente. O lo atamos o lo dejamos marchar. No voy a aceptar ninguna otra opción."

          "¡Vale, vale!", dice Melindra. "No hace falta que te pongas tan dramático. Solo estaba haciendo una sugerencia. Entonces, ¿qué va a ser? ¿Lo dejamos ir o lo atamos?"
    choices:
