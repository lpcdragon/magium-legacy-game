  - name: b3_ch06a_secret3
    texts:
      - source: scene_text
        paragraph: 33
        text: |-
          "Vale, vale, ¡me atraparon!", oímos la voz de Loyrang, el guardia de piel oscura de ayer. "¡Ya salgo!"

          Cuando el guardia real sale del almacén, vemos que lleva las manos sobre la cabeza, tal como le dijo Melindra, aunque seguramente no tardaría ni un segundo en agarrar las dos espadas largas que lleva colgando de la cadera si se iniciara una pelea. A pesar de la situación en la que se encuentra, el hombre parece extrañamente relajado y sus ojos no muestran ningún signo de hostilidad hacia nosotros.

          "Estás sorprendentemente calmado para ser un hombre al que acaba de tenderle una emboscada un grupo de enemigos", dice Kate, mirándolo con suspicacia.

          "¡Eh, nadie dice que tengamos que ser enemigos!", responde Loyrang. "Todos ustedes parecen gente lista. ¡A lo mejor podemos cooperar!"

          "¿Traicionarías a tu rey así como así?", dice Illuna. "¿Basta una pequeña amenaza para que cambies de bando?"
      - source: scene_text_2
        paragraph: 20
        text: |-
          "Claro, ¿por qué no?", dice Loyrang, sin bajar las manos. "No es que sienta ningún apego por el rey ni por la gente de esta ciudad. Soy un participante del torneo igual que ustedes, ¿recuerdan? Solo estoy en esto por el dinero. Si ya no me sale rentable, más vale cortar por lo sano. Quieren información, ¿verdad? ¡Se la doy gratis! A mí no me vale mucho de todos modos, porque probablemente me largue de la ciudad en cuanto la cosa empiece a calentarse."

          "Hmm...", dice Melindra. "No estoy del todo segura, pero por lo que puedo leer en su aura, parece estar diciendo la verdad."

          "¿Así que planeabas desertar de tu puesto desde el principio?...", le pregunta el tendero, desconcertado.

          "Por supuesto", dice Loyrang. "¿Por qué crees que vine aquí en primer lugar? Quería abastecerme de algunas hierbas raras antes de irme."

          "¿Y Gontrok también está metido en esto?", pregunta Hadrik. "¿También planea traicionar al rey y abandonar la ciudad?"

          "Nah", dice Loyrang. "Gontrok tiene otros planes. Quiere convertirse en el hombre de máxima confianza del rey, para acabar manipulándolo y empujándolo a atacar y conquistar los demás reinos de Varathia. Cuando entramos aquí, me dijo que le repugna ver cómo todas esas reliquias tecnológicamente avanzadas se desperdician defendiendo la ciudad cuando podrían usarse para muchísimo más."
      - source: scene_3
        paragraph: 9
        text: |-
          "Supongo que eso sí cuadra con la personalidad de Gontrok", dice Hadrik.

          "Olvida las motivaciones de Gontrok", dice Daren. "¡Dinos algo que pueda ayudarnos a derrotar a la guardia real! ¿Qué sabes de sus planes?"

          "¿Planes?", dice Loyrang. "¿Qué planes? El rey puso al embajador de Thilias a cargo de todas las estrategias. Ese tipo es un idiota. Lo único que organizó de verdad fue el orden en que los guardias registran las casas de los civiles. No tiene ninguna estrategia real para cuando supuestamente tengamos que pelear con ustedes, y el capitán ni siquiera es capaz de mantener bajo control a la mitad de sus tropas actuales. Lo más probable es que Gontrok cargue hacia delante como siempre hace, y que los demás tengan luego que ir corriendo detrás de él para apoyarlo. Más allá de eso, todo depende de cómo se las arreglen ustedes contra cada guardia real por separado. Quiero decir, ya vieron lo bien que se desenvolvieron contra Gontrok y el capitán, así que no tengo muy claro qué esperan conseguir exactamente."
    choices:
      - position: 1
        text: Ayer nos pillaron desprevenidos. En circunstancias normales, deberíamos poder derrotar a esos dos con facilidad.
        effects:
          - set:
              current_scene: b3_ch06a_caught
      - position: 2
        text: ¿Pero de qué hablas? ¡Ayer les pasamos el trapo!
        effects:
          - set:
              current_scene: b3_ch06a_mopped
      - position: 3
        text: Lo que esperamos conseguir no es asunto tuyo.
