  - name: b3_ch06a_medicinal
    texts:
      - source: scene_text
        paragraph: 6
        text: |-
          "Primero tenemos que llamar a Rose", dice Kate. "Puede que no tengamos otra oportunidad de preguntarle por las hierbas medicinales que necesitamos una vez lleguemos a la superficie."

          "Kate tiene razón", dice Daren. "Casi me olvidaba de Rose. La llamo ahora mismo."

          Entonces saca su transceptor, cambia la frecuencia y lo toca una vez.

          "¿Rose, estás ahí?", dice Daren.

          "Sí...", dice Rose con voz soñolienta. "Estoy... despierta..."

          "Perdona, ¿estabas durmiendo justo ahora?", dice Daren.

          "No, no, yo... está bien, ya estaba a punto de despertarme", dice Rose, esforzándose visiblemente por sonar menos adormilada. "¿Qué pasa?"

          "Bueno...", dice Daren, y entonces empieza a contarle lo de toda la gente enferma en el área de cuarentena y el hecho de que las hierbas medicinales que necesita no se encuentran en los alrededores de la ciudad.
      - source: scene_text_2
        paragraph: 5
        text: |-
          Una vez que termina de ponerla al día, Daren le pregunta a Rose si conoce algún reemplazo para los ungüentos que busca, y Rose hace una breve pausa para pensar en sus palabras.

          "No van a encontrar sustitutos perfectos para las hojas rainweather", dice Rose, "pero si buscan algo que tenga más o menos el mismo efecto, solo que un poco más lento, podrían probar una combinación de raíces greenbugger con semillas bontroddle. Bontroddle es como llamamos en Varathia a las plantas wyverntooth. Lo mejor será que pidan directamente un ungüento de greenbugger y bontroddle, porque si no les va a llevar algo de tiempo prepararlo ustedes mismos. La mayoría de las herboristerías deberían tener estos ungüentos en stock, porque se usan bastante y estas plantas crecen prácticamente por todo el continente. En cuanto a la hierba summerglow, puedes reemplazarla fácilmente por hierbas crownwick y no habrá mucha diferencia."

          "Vaya, no tenía ni idea de que también se hacían ungüentos con bontroddle", dice Daren. "¡Muchas gracias, esta información nos va a ayudar muchísimo!"

          "¡De nada!", dice Rose.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch06a_medicinal2
  - name: b3_ch06a_medicinal2
    texts:
      - source: scene_text
        paragraph: 7
        text: |-
          "Umm, ¿Rose?", dice Flower con un tono algo tímido.

          "Sí, ¿Flower?", dice Rose, intentando usar una voz cálida y acogedora, aunque parece bastante cansada.

          "Oí que anoche ayudaste a que Pétalo y yo nos reconciliáramos", dice Flower. "Quería darte las gracias. ¡Significa muchísimo para mí!"

          "No hace falta que me des las gracias", dice Rose. "Apenas hice nada. Pero me alegra saber que al final todo salió bien."

          "Solo siento no haber podido enviarte antes un trozo de mi tarta de cumpleaños por el transceptor o algo así...", dice Flower. "Seguro que te habría encantado."

          "¿Hoy fue tu cumpleaños?", pregunta Rose, sorprendida. "¡No lo sabía! ¡Feliz aniversario!"

          "¡Gracias!", dice Flower. "Oye, ¿cuándo es tu cumpleaños? ¡Quizá podría hornearte una tarta entonces, para compensar que esta vez no pude darte nada!"

          "Por desgracia, tendrías que esperar unos once meses para hornearme esa tarta", dice Rose, "porque acabo de cumplir veinticinco años poco antes del comienzo del torneo de magos."
      - source: scene_text_2
        paragraph: 6
        text: |-
          "Aww...", dice Flower. "Entonces supongo que tendré que hacerte otro trozo de mi tarta de cumpleaños solo para ti la próxima vez que nos veamos."

          "¡Supongo que sí!", dice Rose.

          "Oye, Rose", dice Daren después de que el goblin le susurre algo. "Kelrim acaba de decirme que quizá en esta ciudad tampoco tengan hierbas crownwick. ¿Conoces por casualidad algún otro sustituto decente para la hierba summerglow?"

          "Uhh... había otra planta que creo que serviría para lo que necesitas, pero no recuerdo exactamente cómo se llamaba", dice Rose. "Si me... das unos minutos, podría bajar a coger un libro en el que estoy segura de haber visto mencionado el nombre de esa hierba..."

          Puedo notar por la forma en que habla Rose que está agotada, aunque esté intentando aparentar que se encuentra bien. Puede que no durmiera demasiado bien anoche por los problemas de insomnio de Suzie. Quizá sería mejor que volviera a dormir en vez de cansarse aún más rebuscando en libros de herboristería.
    choices:
      - position: 1
        text: Sugerir que Rose debería volver a dormir.
        effects:
          - set:
              current_scene: b3_ch06a_sleep
              b3_ch6_sleep: 1
      - position: 2
        text: Dejar que Rose vaya a buscar el nombre de la planta.
        effects:
          - set:
              current_scene: b3_ch06a_sleep
              b3_ch6_sleep: 0
  - name: b3_ch06a_sleep
    routes:
      - condition: b3_ch6_sleep = 1
        texts:
          - source: scene_text
            paragraph: 8
            text: |-
              "La verdad, creo que sería mejor que volvieras a la cama", le digo a Rose. "Suenas agotada. ¿Suzie te tuvo despierta toda la noche por sus problemas para dormir, por casualidad?"

              "Yo... aun así conseguí dormir una hora o dos", dice Rose. "¡Estoy bien, de verdad!"

              "Pensándolo mejor, creo que sé de una tienda donde podemos encontrar algunas hierbas crownwick", dice Daren. "No hace falta que vayas a buscar ese libro, Rose. ¡Nos las arreglaremos a partir de aquí!"

              "¿Estás seguro?...", dice Rose.

              "¡Claro!", dice Daren. "Perdón por llamar tan temprano por la mañana. Espero que todavía puedas volver a dormir."

              "Oh, no pasa nada", dice Rose. "Bueno, si necesitan algo más, ya saben cómo contactarme. Intentaré volver a la cama. ¡Hablamos luego!"

              "¡Adiós!", dice Daren, y luego cierra el transceptor.

              "En realidad no conoces ninguna tienda que venda hierbas crownwick, ¿verdad?", le pregunta Kate a Daren.

              "¡Eh, estoy seguro de que debe de haber al menos una tienda que tenga esas hierbas en stock!", dice Daren. "Rose ya nos ayudó muchísimo, así que no quería imponerle nada más estando tan cansada. Kelrim, ¿conoces alguna herboristería en la que tengamos más probabilidades de encontrar lo que buscamos?"
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch06a_merchandise
      - condition: b3_ch6_sleep = 0
        texts:
          - source: scene_text
            paragraph: 9
            text: |-
              "Si es demasiada molestia, olvídalo", dice Daren. "Estoy seguro de que podemos arreglárnoslas con lo que ya nos has dicho."

              "No, no es molestia", dice Rose. "Vuelvo enseguida. Esto no debería llevar mucho."

              "Bueno, de acuerdo entonces", dice Daren. "Esperaremos."

              Tal como prometió, Rose no tarda más de tres minutos en volver al transceptor, y ahora podemos oírla pasar páginas rápidamente en el libro que ha cogido de su biblioteca.

              "¡Ya lo encontré!", dice Rose al final. "El otro sustituto en el que estaba pensando era usar los pétalos de una flor riggus. No creo que tengan ningún problema para conseguirlos, porque estas flores suelen florecer por esta época del año, así que deberían tener de sobra en stock."

              "¡Gracias otra vez, Rose!", dice Daren. "Prometo que no vamos a desperdiciar la información."

              "¡Bien!", dice Rose. "Bueno, si eso era todo lo que necesitaban, creo que voy a prepararme algo de desayuno. Todo eso de subir y bajar las escaleras me ha abierto un poco el apetito. Hablamos luego."

              "Entonces, ¿queda decidido?", pregunta Kate mientras Daren cierra el transceptor. "¿Sabemos ya hacia dónde vamos?"

              "¿Tú qué crees, Kelrim?", dice Daren. "¿Hay alguna tienda en Ollendor que tenga todos los ingredientes que buscamos?"
        choices:
          - position: 1
