              b3_ch6_password: 2
  - name: b3_ch06a_secret2
    routes:
      - condition: b3_ch6_password = 0
        texts:
          - source: scene_text
            paragraph: 29
            text: |-
              "La contraseña es que cierre su puta boca y abra la puerta antes de que la volemos", grito bien alto para que el tendero me oiga.

              "Hay que tener mucha cara para amenazarme así en la puerta de mi propia tienda", dice el tendero. "¿Quieres saber qué le pasó al último tipo que me dijo esas palabras?"

              "¡Espera, creo que hemos empezado con mal pie!", digo. "¡No intentaba amenazarlo ni nada! ¡De verdad creía que esa era la contraseña!"

              "¿Qué clase de idiota te crees que soy?", dice el tendero. "Solo un imbécil completo podría pensar que una frase así tiene alguna posibilidad de ser una contraseña de verdad. ¡Lárguense de aquí antes de que llame a los guardias!"

              "Se me ocurre una idea", nos dice Hadrik en voz baja. "¿Por qué no nos olvidamos de la contraseña y atravesamos la pared a golpes? Apuesto a que podría hacerla añicos de un solo puñetazo."

              "¿Y luego qué?", dice Daren, asegurándose también de mantener la voz baja para que el tendero no lo oiga. "¿Robarle las hierbas? Porque lo que es seguro es que no va a vendernos nada después de que le destrocemos la tienda."
          - source: scene_text_2
            paragraph: 18
            text: |-
              "Oye, aunque se negara a vendértelas, siempre podrías coger las hierbas y dejarle el dinero en el mostrador", dice Hadrik. "Técnicamente sería lo mismo que comprarlas, pero sin tanto rollo."

              "Eso suena a robar con pasos extra", dice Daren.

              "¡No es robar, hombre, venga ya!", dice Hadrik. "¡Le estás dando el dinero! ¿Qué más podría querer? ¿De verdad intentas decir que los caprichos de un tendero son más importantes que las vidas de la gente a la que intentas salvar?"

              "Ugh...", dice Daren. "Vale, tienes razón. Me has convencido. Anda, destroza ya la pared. Se nota que llevas deseándolo desde que entramos aquí."

              "¡Y tanto que lo llevo deseando!", dice Hadrik. "Hace demasiado que no puedo hacer añicos una de estas. Muy bien, ¡apártense todos! Estoy a punto de poner a prueba la resistencia de este muro de seredium."

              Entonces prepara el puño y golpea la pared con fuerza suficiente para hacer que se desmorone en cuestión de segundos. Al otro lado del muro ya hecho pedazos, un anciano de barba gris corta detrás de un mostrador nos mira demasiado conmocionado como para hablar, mientras Hadrik se sacude el polvo con toda calma.
          - source: scene_3
            paragraph: 8
            text: |-
              "En términos de durabilidad, a esta pared le doy un seis sobre diez", dice Hadrik con un tono poco impresionado. "No está nada mal, pero tampoco es gran cosa. ¡Oye, miren, sí que había una tienda aquí detrás!"

              Mientras Hadrik cruza los escombros y nosotros nos disponemos a seguirlo, vemos que la habitación detrás del muro derrumbado está llena de estanterías con muchísimas variedades distintas de hierbas. También parece haber una puerta al otro lado de la habitación que seguramente conduce a alguna clase de almacén. Justo cuando el dueño de la tienda por fin empieza a reunir valor para hablar, no puedo evitar fijarme en que la puerta del almacén está entreabierta.

              "¿P-p-piensan siquiera lo que acaban de--", empieza a decir el tendero, pero su voz queda ahogada por Melindra, que ahora grita en voz alta mirando directamente hacia la puerta al otro lado de la habitación.

              "No sirve de nada intentar enmascarar tu aura, guardia real", dice Melindra. "Puedo sentirte escondido en esa habitación detrás del mostrador. ¿Qué tal si sales despacio, con las manos donde podamos verlas, y así nadie tiene que salir herido?"
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch06a_secret3
