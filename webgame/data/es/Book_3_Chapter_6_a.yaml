          "Dígame al menos que sí tiene en stock pétalos de flor riggus...", dice Daren.

          "Eh, sí, claro", dice Pete. "¿Pero para qué los querría?"

          "Según una amiga herborista mía, también sirven como sustituto de la hierba summerglow", dice Daren.

          "¿De verdad?", pregunta Pete, sorprendido. "Huh. No lo sabía. Tendré que investigarlo. De acuerdo, ¿puede esperar un momento? Tengo que ir a coger los pétalos del almacén."

          "Claro, adelante", dice Daren.

          Mientras el tendero va a la habitación del fondo, echo un vistazo mejor a todas las estanterías y me doy cuenta de que hay pequeñas etiquetas en cada una, aunque la escritura es bastante fea y difícil de descifrar. Quizá podría acercarme y ver si alguna de las cosas escritas en esas etiquetas nos sirve de ayuda.
