  - name: b3_ch06a_merchandise2
    texts:
      - source: scene_text
        paragraph: 12
        text: |-
          "Lo siento", dice Kelrim mientras le da unas palmaditas en el brazo al del teletransportador. "Debo de haberte hecho recordar unos recuerdos dolorosos. No era mi intención."

          "¿Le ocurrió algo a tu hermano desde entonces?", le pregunta Hadrik al del teletransportador, con una mirada más seria.

          "Lo... mató uno de los guardias de la ciudad hace unas semanas", dice el del teletransportador. "Nunca conseguimos recuperar su cuerpo. Mi único consuelo es que, por lo que he oído, tuvo una muerte rápida e indolora."

          "Haremos que esos bastardos paguen", dice Hadrik con rabia. "¡Tienes mi palabra!"

          "Gracias por tu apoyo", dice el del teletransportador.

          "Hmm...", dice Melindra acercando la cara a la del del teletransportador para estudiarlo con más atención.

          "Uhh, ¿pasa algo?", dice el del teletransportador, dando un paso atrás.

          "El flujo de tu aura no fluctúa mucho, ¿verdad?", dice Melindra. "Ya me fijé ayer en ello, pero hoy era todavía más evidente. Por ejemplo, por tu cara y por tu tono de voz estaba claro que no te sentía nada cómodo hablando de tu hermano hace un momento y, pese a eso, tu aura seguía tan calmada como siempre. ¿La mantienes suprimida todo el tiempo, por casualidad?"
      - source: scene_text_2
        paragraph: 8
        text: |-
          "¿Qué?", dice el del teletransportador. "No, no, es simplemente como nací. No sé mucho del tema porque mi Sentido mágico no es demasiado agudo, pero al parecer por alguna razón mis emociones no se reflejan mucho en mi aura. Probablemente haya un nombre para esta condición que tengo, pero la verdad es que nunca me he molestado en aprenderlo. En fin, ¿ya tienen un destino decidido o les traigo un mapa?"

          "Sí sabemos adónde vamos", dice Kelrim. "Necesitamos teletransportarnos a algún sitio cercano a la calle Vremann. Cualquier lugar por esa zona servirá. Sí sabes dónde está, ¿verdad?"

          "Sí, sí, por supuesto", dice el del teletransportador. "Hay un callejón relativamente cerca de esa calle al que debería poder enviarlos sin riesgo de que los detecten. Les fijaré las coordenadas en un momento."

          "Tómate tu tiempo, lentorro", dice Arraka.
      - source: scene_3
        paragraph: 6
        text: |-
          "¿Cómo acabas de llamarme?...", dice el del teletransportador, mientras deja de pulsar temporalmente los botones del escritorio.

          "Lentorro", dice Arraka. "Lentorro es como te he llamado. ¿No era ese tu apodo original?"

          "¿Y por qué ibas a pensar eso?", dice el del teletransportador.

          "Bueno, antes mencionaste que los tres apodos iniciales que tenían eran lentorro, cejijunto y cara gorda", dice Arraka. "Como está clarísimo que tienes dos cejas separadas y tu peso está ligeramente por debajo de la media, he llegado por simple eliminación a la conclusión de que tu apodo debía de ser 'lentorro'. Además, eres un poco lento, así que eso también cuenta."

          "¡Esos apodos eran solo ejemplos!", dice el del teletransportador. "Y además, ¿cómo puedes estar tan segura de que no fui gordo de pequeño o de que no me he depilado las cejas desde entonces?"

          "Tus intentos desesperados por negar la verdad solo hacen que parezcas más culpable, lentorro", dice Arraka.
