              - set:
                  current_scene: b3_ch06a_secret3
      - condition: b3_ch6_password = 2 AND bluff < 4
        texts:
          - source: scene_text
            paragraph: 31
            text: |-
              "Ya te di la contraseña y dijiste que era correcta", digo.

              "¿Pero de qué demonios estás hablando?...", dice el tendero. "¿Crees que mi memoria es tan corta como para no recordar lo que pasó hace diez segundos o qué? ¡Lárguense de aquí antes de que llame a los guardias!"

              "Se me ocurre una idea", nos dice Hadrik en voz baja. "¿Por qué no nos olvidamos de la contraseña y atravesamos la pared a golpes? Apuesto a que podría hacerla añicos de un solo puñetazo."

              "¿Y luego qué?", dice Daren, asegurándose también de mantener la voz baja para que el tendero no lo oiga. "¿Robarle las hierbas? Porque lo que es seguro es que no va a vendernos nada después de que le destrocemos la tienda."
          - source: scene_text_2
            paragraph: 18
            text: |-
              "Oye, aunque se negara a vendértelas, siempre podrías coger las hierbas y dejarle el dinero en el mostrador", dice Hadrik. "Técnicamente sería lo mismo que comprarlas, pero sin tanto rollo."

              "Eso suena a robar con pasos extra", dice Daren.

              "¡No es robar, hombre, venga ya!", dice Hadrik. "¡Le estás dando el dinero! ¿Qué más podría querer? ¿De verdad intentas decir que los caprichos de un tendero son más importantes que las vidas de la gente a la que intentas salvar?"

              "Ugh...", dice Daren. "Vale, tienes razón. Me has convencido. Anda, destroza ya la pared. Se nota que llevas deseándolo desde que entramos aquí."

              "¡Y tanto que lo llevo deseando!", dice Hadrik. "Hace demasiado que no puedo hacer añicos una de estas. Muy bien, ¡apártense todos! Estoy a punto de poner a prueba la resistencia de este muro de seredium."

              Entonces prepara el puño y golpea la pared con fuerza suficiente para hacer que se desmorone en cuestión de segundos. Al otro lado del muro ya hecho pedazos, un anciano de barba gris corta detrás de un mostrador nos mira demasiado conmocionado como para hablar, mientras Hadrik se sacude el polvo con toda calma.
