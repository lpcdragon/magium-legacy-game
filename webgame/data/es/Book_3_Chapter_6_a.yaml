scenes:
  - name: b3_ch06a_intro
    texts:
      - source: scene_text
        paragraph: 2
        text: |-
          "¿Daren?...", dice Hadrik. "¿Estás bien, amigo?"

          "Estoy bien", dice Daren. "¿Por qué lo preguntas?"

          Luego lanza su espada a unos cuatro metros delante de él mientras camina, y después extiende la mano hacia ella mientras sigue avanzando. En cuanto alcanza la espada, la recoge del suelo y vuelve a arrojarla delante de sí, mientras todos caminamos a su lado de camino a la sala del teletransportador.

          "Es solo que llevas ya unos minutos lanzando esa espada una y otra vez, y estaba empezando a preocuparme un poco por tu estado mental", dice Hadrik. "Sabes que puedes pedirle a cualquiera de nosotros que te lleve la espada un rato si estás demasiado cansado para cargarla, ¿verdad?"

          "No estoy demasiado cansado para cargar con la espada", dice Daren, mientras recoge su arma del suelo. "Estoy intentando usar manipulación de aura para hacer que vuele de vuelta a mi mano, como sugirió el rey del subsuelo. ¿Por qué creías que seguía apuntándola con la palma cada vez después de tirarla al suelo?"

          "¿Eso era lo que intentabas hacer?...", dice Arraka. "No lo habría adivinado ni en un millón de años. Juro que tu nivel de ineptitud con cualquier cosa relacionada con el aura es realmente digno de contemplarse."

          "Perdona, ¿pensabas decir algo útil o debo limitarme a ignorar tus desvaríos de loca y seguir con lo mío?", dice Daren.
      - source: scene_text_2
        paragraph: 2
        text: |-
          "Si sigues así, el sol morirá antes de que hagas algún progreso digno de mención", dice Arraka. "No sirve de nada expandir el aura si no sabes endurecerla. Ese 'rey de lo que sea' ya te dijo que esta técnica funciona mejor con objetos que conoces bien, ¿no? Así que, en vez de hacerlo manualmente, deberías intentar centrarte en la imagen de la espada dentro de tu cabeza mientras liberas las cinco corrientes fluidas de la punta de tus dedos hasta sentir que han hecho contacto con la espada. Es así de simple."

          "¿Las cinco corrientes fluidas de la punta de mis dedos?", dice Daren. "¿Qué clase de tontería es esa? ¿Te inventas estas cosas sobre la marcha o qué?"

          "Sí, ya no tengo paciencia para explicarte esto otra vez como si estuviera hablándole a un crío pequeño", dice Arraka. "¡Eh, goblin! Tú entendiste de qué estaba hablando, ¿verdad? ¡Tradúceselo tú!"

          "Uhm...", dice Kelrim. "Creo que se refiere a la sensación de hormigueo que sientes en los dedos cada vez que empiezas a ocultar tu aura. Si intentas recordar esa sensación exacta y luego imaginar que viene de corrientes de agua que fluyen por la punta de tus dedos, probablemente también puedas imaginarte 'liberándolas' como chorros hacia la espada en el suelo. Si recordar la sensación de hormigueo te resulta demasiado difícil, podrías intentar ocultar tu aura ahora mismo para hacerte una idea clara de lo que quiero decir."
      - source: scene_3
        paragraph: 2
        text: |-
          "Hmm...", dice Daren, mientras todos nos detenemos para observar bien lo que hace. "Supongo que vale la pena intentarlo. A ver..."

          Entonces vuelve a lanzar su espada delante de él, pero esta vez ya no apunta la mano hacia ella. Solo entrecierra los ojos hacia su arma, concentrándose con fuerza. Para sorpresa de todos, esta vez la espada se levanta de inmediato del suelo y vuela con la empuñadura directamente hasta la mano de Daren sin que él ni siquiera necesite mover el brazo para atraparla.

          "¡¿Eso era todo?!", dice Daren. "¿Eso era lo único que tenía que hacer? ¿Pero qué demonios? ¡Pensé que necesitaría al menos semanas de entrenamiento para esto! Si es tan fácil, ¿por qué no lo hace todo el mundo?"

          "No es tan fácil, idiota", dice Arraka. "Obviamente tienes una afinidad natural para la manipulación de aura, o no lo habrías aprendido tan rápido. Si le pidieras a cualquier mago al azar que hiciera exactamente lo mismo que acabas de hacer tú, casi seguro que fracasaría. Demonios, si no fueras tan zoquete en lo que respecta a entender las bases de cómo funcionan las auras, hasta podrías llegar a ser bastante bueno en esto."
