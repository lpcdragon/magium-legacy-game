        condition: ch11_saved_rose = 1
      - source: scene_3
        paragraph: 24
        text: |-
          "¿Tendría por casualidad algún sustituto adecuado, entonces?", dice Daren.

          "¿Sustitutos para la hierba summerglow?...", dice Pete. "Bueno, no estoy totalmente seguro de si servirá, pero podría darles algunos pies de cuervo si quieren. No pies de cuervo de verdad, ojo... hablo de la planta que se llama así. Tiene efectos parecidos a la hierba summerglow, pero no es exactamente lo mismo. ¿Quieren probar?"

          "Supongo que es mejor que nada", dice Daren. "Meta esas hierbas en la bolsa junto con las otras."

          "De acuerdo", dice Pete. "Esperen un momento. Tengo que ir a buscarlas al almacén."

          Mientras el tendero va a la habitación del fondo, echo un vistazo mejor a todas las estanterías y me doy cuenta de que hay pequeñas etiquetas en cada una, aunque la escritura es bastante fea y difícil de descifrar. Quizá podría acercarme y ver si alguna de las cosas escritas en esas etiquetas nos sirve de ayuda.
