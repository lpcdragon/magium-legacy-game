  - name: b3_ch06a_minions
    routes:
      - condition: b3_ch6_survey = 0
        texts:
          - source: scene_text
            paragraph: 48
            text: |-
              "Vale. En ese caso, no, ayer no fuiste lo bastante claro."

              "Gracias por completar la encuesta", dice el Supervisor. "Ahora enviaré varias bolas metálicas para matarlos. ¡Que tengan un buen día!"

              "Sí, que tú también tengas un buen día, imbécil", digo mientras el dron de ojos verdes vuelve a volar hacia el cielo.

              "Maldita sea, no tenemos tiempo para esto", dice Daren mientras seguimos avanzando hacia nuestro destino. "Kelrim, ¿a qué distancia está la herboristería más cercana?"

              "Si echamos a correr, podríamos llegar a una de las tiendas en dos minutos o menos", dice Kelrim.

              "Vale, tú corre hacia la tienda y nosotros iremos justo detrás", dice Daren. "¡Vamos, vamos, vamos!"
          - source: scene_text_2
            paragraph: 33
            text: |-
              Mientras el goblin corre y nosotros lo seguimos, vemos que las bolas metálicas de arriba se mueven rápidamente para rodearnos.

              "A este ritmo, pronto vamos a tener que abrirnos paso luchando contra los secuaces del Supervisor", dice Daren.

              "No si yo los mantengo ocupados un rato", dice Hadrik. "Podría volar hacia ellos en forma de águila y atacarlos antes de que terminen de organizarse. Eso debería darles el tiempo suficiente para llegar a la tienda."

              "Eso no va a funcionar", dice Kate. "No tienes ataques que puedan alcanzar a varios objetivos voladores a la vez. Si Melindra pudiera volver a lanzar una barrera de viento a mi alrededor y al suyo como ayer, yo debería poder elevarnos en el aire con una plataforma de hielo y mantener a raya a las bolas metálicas durante un minuto con mis carámbanos."
        choices:
          - position: 1
            text: Estar de acuerdo con el plan de Hadrik.
            effects:
              - set:
                  current_scene: b3_ch06a_hadrik_plan
                  b3_ch6_plan: 0
          - position: 2
            text: Estar de acuerdo con el plan de Kate.
            effects:
              - set:
                  current_scene: b3_ch06a_kate_plan
                  b3_ch6_plan: 1
          - position: 3
            text: Sugerir llamar a Rose por el transceptor para que congele el tiempo durante treinta segundos.
            effects:
              - set:
                  current_scene: b3_ch06a_rose_awake
                  b3_ch6_plan: 2
                condition: b3_ch6_sleep = 0
              - set:
                  current_scene: b3_ch06a_rose_asleep
                  b3_ch6_plan: 3
                condition: b3_ch6_sleep = 1
      - condition: b3_ch6_survey = 1
        texts:
          - source: scene_text
            paragraph: 49
            text: |-
              "Vale. En ese caso, sí, ayer fuiste lo bastante claro."

              "Gracias por completar la encuesta", dice el Supervisor. "Ahora enviaré varias bolas metálicas para matarlos. ¡Que tengan un buen día!"

              "Sí, que tú también tengas un buen día, imbécil", digo mientras el dron de ojos verdes vuelve a volar hacia el cielo.

              "Maldita sea, no tenemos tiempo para esto", dice Daren mientras seguimos avanzando hacia nuestro destino. "Kelrim, ¿a qué distancia está la herboristería más cercana?"

              "Si echamos a correr, podríamos llegar a una de las tiendas en dos minutos o menos", dice Kelrim.

              "Vale, tú corre hacia la tienda y nosotros iremos justo detrás", dice Daren. "¡Vamos, vamos, vamos!"
          - source: scene_text_2
            paragraph: 33
            text: |-
              Mientras el goblin corre y nosotros lo seguimos, vemos que las bolas metálicas de arriba se mueven rápidamente para rodearnos.

              "A este ritmo, pronto vamos a tener que abrirnos paso luchando contra los secuaces del Supervisor", dice Daren.

              "No si yo los mantengo ocupados un rato", dice Hadrik. "Podría volar hacia ellos en forma de águila y atacarlos antes de que terminen de organizarse. Eso debería darles el tiempo suficiente para llegar a la tienda."

              "Eso no va a funcionar", dice Kate. "No tienes ataques que puedan alcanzar a varios objetivos voladores a la vez. Si Melindra pudiera volver a lanzar una barrera de viento a mi alrededor y al suyo como ayer, yo debería poder elevarnos en el aire con una plataforma de hielo y mantener a raya a las bolas metálicas durante un minuto con mis carámbanos."
        choices:
          - position: 1
            text: Estar de acuerdo con el plan de Hadrik.
            effects:
              - set:
                  current_scene: b3_ch06a_hadrik_plan
                  b3_ch6_plan: 0
          - position: 2
            text: Estar de acuerdo con el plan de Kate.
            effects:
              - set:
                  current_scene: b3_ch06a_kate_plan
