    texts:
      - source: scene_text
        paragraph: 24
        text: |-
          "Supongo que podríamos seguirle la corriente por ahora..."

          "¿A qué distancia queda exactamente esa tienda 'secreta' desde aquí?", pregunta Illuna.

          "Si empezamos a dirigirnos a ella ahora mismo, calculo que no deberíamos tardar más de un minuto en llegar a nuestro destino", dice el Supervisor.

          "Entonces muéstranos el camino", dice Daren.

          "Solicitud reconocida", dice el Supervisor. "Síganme."
