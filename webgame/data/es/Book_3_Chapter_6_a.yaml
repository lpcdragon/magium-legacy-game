            text: |-
              "Lo siento, no voy a responder."

              "Me está poniendo en una posición difícil", dice el Supervisor.

              "Oye, si quieres tanto mi respuesta, siempre podrías intentar sobornarme", digo. "Por ejemplo, ahora mismo me gustaría saber por qué te ordenaron retirar tus bolas metálicas."

              "Por desgracia, la información que solicita es clasificada", dice el Supervisor. "No puedo acceder a sus exigencias."

              "Entonces supongo que tendrás que quedarte aquí un rato más", digo.

              Poco después de que termine mi conversación con el Supervisor, Daren y los demás empiezan a salir de la tienda, uno por uno.

              "Entonces, ¿el Supervisor te dijo algo interesante mientras estábamos dentro?", dice Daren cuando ya estamos todos fuera.

              "Sí", digo. "Me dijo que recibió una orden de retirar todas sus bolas metálicas. Pero no quiso decirme por qué recibió esa orden cuando se lo pregunté."
