        texts:
          - source: scene_text
            paragraph: 40
            text: |-
              "Ah, ¿les gustaría eso, verdad?", dice el tendero. "Bueno, quizá deberían haberlo pensado antes de destrozar la entrada de mi tienda."

              "¿Eso... significa que no piensa vendernos nada?", dice Daren.

              "En condiciones normales, así sería", dice el tendero, "pero antes los oí hablar de que planeaban asesinar al rey, así que está bastante claro que todos ustedes han perdido el juicio. No me extrañaría nada que simplemente me robaran la tienda si intentara echarlos, así que prefiero dejarlos comprar lo que quieran con la esperanza de que se larguen cuanto antes. Eso sí, si esperan que les dé algún tipo de información sobre las plantas que tengo a la venta, ahí sí van a tener mala suerte."

              "Sí, me temía que iba a decir eso", dice Daren. "Kelrim, ¿puedes echarme una mano? Sé cómo se supone que son algunas de estas hierbas, pero no estoy seguro con todas."

              "Por supuesto", dice Kelrim. "Voy justo detrás de ti."

              Daren y Kelrim pasan los siguientes minutos mirando todas las hierbas de las estanterías y del almacén, intentando averiguar cuáles necesitan lo más rápido posible, ya que no tenemos mucho tiempo que perder. Al final consiguen encontrar la mayoría de las hierbas que buscaban, salvo una de las plantas raras que no suele crecer alrededor de la ciudad de Ollendor. Por suerte, pudieron encontrar un buen sustituto para ella usando la información que Rose nos dio antes de venir aquí.
          - source: scene_text_2
            paragraph: 25
            text: |-
              "Aquí tiene el pago de las hierbas", le dice Daren al tendero mientras deja varias monedas sobre el mostrador. "Y... un poco más, por todas las molestias que hemos causado."

              "Haría falta bastante más que un poco más para arreglar la pared que destruyeron, pero ahora mismo lo único que quiero es verlos fuera de mi tienda", dice el tendero. "Al menos intenten recordar volver a colocar la alfombra sobre la trampilla cuando salgan. No quiero más invitados no deseados hoy."

              "Lo haremos", dice Daren, y luego se vuelve hacia nosotros. "Muy bien, gente, ya tenemos lo que necesitábamos. Volvamos."

              Antes de marcharnos, Loyrang entra en el almacén, tal como prometió, y lo encierran dentro.

              Entonces cruzamos los escombros y subimos por las escaleras que conducen a la superficie. Una vez fuera, volvemos a poner la alfombra sobre la trampilla, tal como prometimos, y salimos de la casa abandonada. El Supervisor parece haberse marchado mientras estábamos dentro, porque su dron de ojos verdes no se ve por ninguna parte.
