            paragraph: 21
            text: |-
              "¿Y cómo exactamente piensas matarnos si ni siquiera puedes mover tus bolas metálicas?"

              "Pregunta poco clara", dice el Supervisor. "Por desgracia, el protocolo Supervisor no puede proporcionarle una respuesta correcta si su pregunta es demasiado vaga. Reformule su consulta anterior."

              "...¿En serio me estás diciendo esto ahora mismo?", le digo.

              "El protocolo Supervisor siempre se esfuerza por responder lo mejor posible", dice el Supervisor. "Si tiene algún problema con la manera en que fue tratada su consulta, presente una queja formal e intentaremos responderla lo antes posible."

              "¿Eso significa que ya no intentas matarnos o...?"

              "Negativo", dice el Supervisor. "El protocolo Supervisor está calculando en este momento la forma más eficiente de terminar con sus vidas. Por favor, espere. Sus muertes les serán entregadas en breve."

              "¡Ya está bien!", digo. "Vamos a ignorarlo y a alejarnos de aquí. Por hoy ya lo he oído suficiente."
