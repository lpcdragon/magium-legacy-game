  - name: b3_ch06a_spared_accept
    texts:
      - source: scene_text
        paragraph: 26
        text: |-
          "La verdad, creo que ir a la tienda secreta puede ser la mejor opción."

          "¿Y eso por qué?", pregunta Daren.

          "Piénsalo", digo. "La única razón por la que ese tal Loyrang no puede percibirnos ahora es porque está dentro de una habitación subterránea cubierta de seredium. El Supervisor dijo que la tienda secreta está por esta zona, así que si Loyrang vuelve a la superficie, lo más probable es que esté lo bastante cerca como para detectar nuestras auras aunque las ocultemos. Eso significa que avisará enseguida a sus amigos y que, aun así, solo tendremos tiempo de visitar una tienda. La única diferencia es que, si no vamos a la herboristería subterránea, no podremos capturarlo."

          "Eso depende mucho de cuánto más tiempo piense pasar ese guardia real en la tienda, pero entiendo tu punto", dice Daren. "Quizá deberíamos darnos prisa e ir a la tienda secreta mientras el guardia todavía siga allí. Supervisor, ¿podrías mostrarnos el camino?"

          "Solicitud reconocida", dice el Supervisor. "Síganme."
