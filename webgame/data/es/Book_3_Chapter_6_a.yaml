                condition: b3_ch6_sleep = 1
  - name: b3_ch06a_hadrik_plan
    effects:
      - set:
          successful_checks:
            - '[ Comprobación de técnica de combate exitosa - nivel 1 ]'
        condition: combat_technique >= 1
      - set:
          failed_checks:
            - '[ Comprobación de técnica de combate fallida - nivel 1 ]'
          successful_checks:
            - '[ Comprobación de Endurecimiento de aura superada - nivel 2 ]'
        condition: combat_technique < 1 AND aura_hardening >= 2
      - set:
          failed_checks:
            - '[ Comprobación de técnica de combate fallida - nivel 1 ]'
            - '[ Comprobación de Endurecimiento de aura fallida - nivel 2 ]'
          is_dead: 1
        condition: combat_technique < 1 AND aura_hardening < 2
    routes:
      - condition: combat_technique >= 1 AND b3_ch6_plan = 0
        texts:
          - source: scene_text
            paragraph: 44
            text: |-
              "Los poderes de Melindra son poco fiables", digo. "Que ayer consiguiera mantener el control de esa barrera no significa que hoy pueda hacerlo de nuevo. Creo que quizá sea mejor dejar que Hadrik se encargue de esto."

              "No se preocupen, me ocuparé enseguida de esas latas voladoras", dice Hadrik. "Ustedes sigan sin mí. Los alcanzaré enseguida."

              Entonces se convierte en águila y vuela hacia uno de los drones de ojos rojos del cielo. En cuanto la alcanza, vuelve a convertirse en enano y le da una patada en el ojo, haciéndola estrellarse contra el suelo.

              "¿De verdad tenías que animarlo?...", me pregunta Kate mientras seguimos avanzando hacia la tienda. "¡Sabes que no podrá con todas él solo!"

              "Sí, pero al menos es lo bastante resistente como para que no tengamos que preocuparnos por que salga herido", digo. "Destruirá tantas como pueda y nosotros ya nos ocuparemos de lo que quede."

              "Algo me dice que lo que quede será la mayoría de las bolas metálicas, pero ya no tiene sentido discutirlo", dice Kate. "Intentemos acercarnos todo lo posible a la tienda antes de que nos embosquen."

              Tal como predijo Kate, las bolas metálicas voladoras pronto se dan cuenta de que Hadrik no supone una amenaza suficiente como para merecer toda su atención, y siguen enviando el grueso de sus fuerzas contra el resto de nosotros.
          - source: scene_text_2
            paragraph: 32
            text: |-
              Antes de llegar a nuestro destino, nos vemos obligados a entablar combate contra toda una oleada de bolas metálicas que ahora nos bloquean el paso.

              "Intentemos acabar con ellas lo más rápido posible", dice Daren. "Volveremos a avanzar hacia la tienda en cuanto despejemos la zona."

              "No, tú y Kelrim deberían seguir adelante", digo. "Llévate también a Hadrik para que les abra camino desde arriba. Nosotros intentaremos mantener la atención de las bolas metálicas centrada en nosotros todo lo que podamos."

              "¡Pero Kelrim es el único que conoce el camino a la tienda!", dice Daren. "¡Se perderán si nos separamos!"

              "Intentaremos no perderlos de vista desde arriba", digo. "Y si eso no funciona, seguro que Melindra podrá rastrearlos con su Sentido mágico. Ahora dense prisa, estamos perdiendo tiempo. ¡Eh, Hadrik! Daren va a seguir adelante. ¡Asegúrate de despejarle el camino desde arriba!"

              Hadrik asiente, y luego se lanza directamente contra las bolas metálicas que tiene delante, derribando a tres de ellas mientras está en forma de enano. Mientras Daren, Kelrim y Hadrik se dirigen a la tienda, el resto empezamos a atacar a las bolas metálicas para obligarlas a fijarse solo en nosotros.

              En cuanto Melindra me lanza sus corrientes de aire, alzo el vuelo, y Flower y Kate hacen lo mismo. Conseguimos mantener a raya a nuestros enemigos durante un rato, pero siguen llegando cada vez más y no parece que el Supervisor tenga intención de dejar de enviarnos sus bolas metálicas pronto.
          - source: scene_3
            paragraph: 14
            text: Por suerte, mi estadística de técnica de combate me permite predecir lo bastante bien los movimientos del enemigo como para que no me pillen desprevenido durante la pelea. Con Flower y Kate derribando bolas metálicas junto a mí en el aire y Leila ocupándose de las que vuelan más cerca del suelo, por fin conseguimos reducir su número lo suficiente como para que se retiren. Aprovechamos esa oportunidad para dirigirnos a la tienda en la que vimos entrar a Daren mientras luchábamos en el cielo. Cuando llegamos, Daren y Kelrim parecen haber terminado ya de comprar, porque ahora salen por la puerta junto con Hadrik.
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch06a_entrance
                condition: is_dead = 0
