        paragraph: 27
        text: |-
          "Tienes razón. Es demasiado arriesgado. Deberíamos ir a las otras tiendas, como planeábamos al principio."

          "Les aconsejaría encarecidamente que reconsideraran su decisión", dice el Supervisor. "Ser capaces de tenderle una emboscada a un guardia real en una cámara subterránea es una oportunidad muy rara que no debería descartarse tan a la ligera."

          "Lo siento, Supervisor, pero hay gente enferma esperando esas hierbas desesperadamente, y sus vidas son más importantes", dice Daren. "Si ese 'Loyrang' sigue en esa tienda para cuando terminemos de comprar, intentaremos atacarlo entonces. Si no, no va a pasar."
      - source: scene_text_2
