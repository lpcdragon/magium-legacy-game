  - name: b3_ch06a_labels2
    routes:
      - condition: b3_ch6_labels >= 2
        texts:
          - source: scene_text
            paragraph: 63
            text: |-
              "Vaya, la verdad es que no tienen el aspecto que yo esperaba", dice Daren mientras abre la bolsa para mirar mejor la hierba summerglow. "Habría pensado que tendrían un aspecto más... umm... más como..."

              "¿Más parecido a hierba?", dice Pete. "Sí, estas hierbas tienen un nombre bastante engañoso, ¿verdad? Como mucho podrías llamarlas mala hierba, pero no se parecen en nada a lo que la mayoría de la gente consideraría hierba. Por desgracia, demasiada gente ya las conoce por este nombre, así que es demasiado tarde para cambiarlo, aunque al principio pueda resultar un poco confuso. En fin... Entonces, ¿necesitan algo más o sería todo?"

              "Eso es todo por ahora", dice Daren. "¡Muchas gracias! Nos aseguraremos de volver aquí si necesitamos algo más."

              Entonces deja unas monedas sobre el mostrador y se despide del tendero, mientras el resto empezamos a salir de la tienda.
          - source: scene_text_2
            paragraph: 45
            text: |-
              "Entonces, ¿alguien tiene idea de por qué han desaparecido todas las bolas metálicas que nos esperaban fuera de la tienda para emboscarnos?", dice Hadrik en cuanto salimos por la puerta.

              "Creo que sé la razón", dice Melindra. "Probablemente les dijeron a las bolas metálicas que se retiraran para no interferir con los guardias reales que han enviado a capturarnos. Puedo sentir a unos cuantos viniendo hacia nosotros en este mismo momento. Detecto a Gontrok, al capitán y a un tercer tipo que no es mago viniendo por un lado, mientras que el guardia real que no se unió a la pelea contra nosotros la última vez se acerca por el lado opuesto junto con un mago que no reconozco."

              "Entonces tendré que llamar a Barry para que nos teletransporte fuera de aquí ahora mismo", dice Daren, sacando deprisa el transceptor.

              "Oye, Barry, ¿nos oyes?", dice Daren por el transceptor después de tocarlo una vez.
            condition: b3_ch6_plan = 3
          - source: scene_text_2
            paragraph: 46
            text: |-
              "Entonces, ¿qué hacemos ahora?", dice Hadrik en cuanto estamos todos fuera en el callejón. "¿Volvemos a la base rebelde?"

              "Si tenemos que volver allí, entonces tiene que ser ahora", dice Melindra. "Nuestra posición ya ha quedado comprometida. La mayor parte de la guardia real se está dirigiendo hacia nosotros en este mismo momento."

              "Entonces tendré que llamar a Barry para que nos teletransporte fuera de aquí ahora mismo", dice Daren, sacando deprisa el transceptor.

              "Oye, Barry, ¿nos oyes?", dice Daren por el transceptor después de tocarlo una vez.
            condition: b3_ch6_plan != 3
