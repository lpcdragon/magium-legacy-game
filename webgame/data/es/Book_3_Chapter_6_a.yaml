              "Dices que no puedes teletransportarlos hasta allí, pero ¿sería posible teletransportarme a mí hasta donde están ellos?", dice Albert.

              "Sí", dice el del teletransportador. "Eso sí funcionaría. Pero tendría que enviarte a un sitio algo más alejado de ellos, por seguridad."

              "Bien", dice Albert. "Prepara entonces las coordenadas."

              "Recibido", dice el del teletransportador.

              "¿Quieres ayudarnos, Albert?", dice Daren. "Eso es desde luego... inesperado."

              "Puede que personalmente me caigan mal porque son ustedes los que empezaron todo este desastre con el cierre total de la ciudad y los refugiados", dice Albert, "pero oficialmente ahora somos aliados, así que no puedo permitir que mis sentimientos personales se interpongan. Solo procuren no conseguir que los maten antes de que yo llegue."

              "Oye, intentaremos dejar uno o dos guardias vivos para que puedas pelear con ellos cuando por fin llegues, ¡pero no prometemos nada!", dice Hadrik.

              "Ya", dice Albert, sin convicción.

              "Las coordenadas están listas, Albert", dice el del teletransportador. "¿Quieres que te teletransporte ya?"
