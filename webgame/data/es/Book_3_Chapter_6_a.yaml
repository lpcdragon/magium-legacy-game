  - name: b3_ch06a_manipulation
    routes:
      - condition: b3_ch6_manipulators = 0
        texts:
          - source: scene_text
            paragraph: 3
            text: |-
              "¿Significa esto que en el futuro Daren podría rendir mejor que el capitán de la guardia real?"

              "¿Y por qué preguntas eso?", dice Arraka. "¿Crees que el capitán no tiene también afinidad para la manipulación de aura, o qué? Está clarísimo que no se habría vuelto tan bueno si no tuviera talento. Si me preguntas a mí, Daren probablemente nunca alcanzará el nivel del capitán ni del rey del subsuelo, porque esos dos ya le llevan treinta años de ventaja. Y no es que Daren vaya a dedicar tanto tiempo como ellos a aprender esas técnicas. Le iría mejor aprendiendo técnicas simples, más centradas en la utilidad que en aplastar a sus oponentes. Por ejemplo, podría pegar la espada a su mano con el aura cuando pelea, de modo que sus enemigos ya no pudieran desarmarlo."

              "¿Puedo hacer eso con mi aura?", dice Daren. "¿Cómo?"

              "Déjame pensar en una forma de explicar esto en términos lo bastante simples incluso para alguien como tú", dice Arraka. "A ver... ¿cómo suele traducir estas cosas el goblin al lenguaje para idiotas? ¡Ah, sí! Ya sabes cuáles son las cinco corrientes fluidas de la punta de tus dedos, ¿verdad? Bueno, en vez de imaginarlas como chorros de agua, deberías pensar en ellas como el pegamento líquido de secado rápido que ciertas especies de caracoles gigantes dejan en forma de rastro. Te acuerdas de aquella vez en que Hadrik se convirtió en caracol y se pegó al suelo para luchar contra aquel mamut, ¿no? Pues intenta imaginar que el aura que sale de la punta de tus dedos es de una sustancia parecida y haz que cubra tu espada mientras la sostienes."
          - source: scene_text_2
            paragraph: 4
            text: |-
              "Sí, sí", dice Daren con un tono poco convencido. "Pegamento de secado rápido. ¡Allá voy!"

              Tras unos segundos de concentración, Daren suelta la espada para ver si cae al suelo o no. En vez de caer, el arma permanece firmemente pegada a su palma, y sigue así incluso mientras Daren sacude la mano repetidamente para poner a prueba la resistencia del 'pegamento'.

              "¡Oye, esto está bastante bien!", dice Daren. "Pero tengo una pregunta... ¿Cómo despego la espada de mi mano?"

              "Eso te lo dejo para que lo averigües tú solo", dice Arraka.

              "¿Es porque aprender a hacerlo por mí mismo me ayudará con mi entrenamiento de aura?", dice Daren.

              "No", dice Arraka. "Es que así resulta más gracioso."

              "Maldita sea...", dice Daren. "Debí suponerlo."

              Mientras Daren sacude el brazo arriba y abajo, intentando que la espada se desprenda de la mano, Kate acaba dándole un consejo.

              "Quizá podrías intentar imaginar el pegamento volviéndose lentamente líquido otra vez en vez de intentar hacerlo desaparecer directamente", dice Kate.

              "Huh...", dice Daren. "Puede que tengas algo ahí. A ver si funciona."
          - source: scene_3
            paragraph: 4
            text: |-
              Entonces extiende el brazo derecho delante de sí con la palma hacia abajo, y vemos cómo la espada empieza a caer lentamente de su mano, como si siguiera sostenida por un fluido invisible y pegajoso, hasta que por fin se desprende por completo y cae al suelo.

              "¡Oh, ahora lo entiendo!", dice Daren, mientras vuelve a recoger la espada. "El aura no puede volver directamente a su forma original. Tienes que deshacer el proceso siguiendo los mismos pasos a la inversa. ¡Por eso no podía limitarme a imaginar el pegamento desapareciendo y tenía que convertirlo otra vez en líquido primero!"

              "Sí, acabas de descubrir un principio básico sobre las auras", dice Arraka. "Toma una galleta."

              "Lo haría, pero últimamente Barry está un poco tacaño con sus galletas", dice Daren.

              "¡Ya te dije que no me quedan muchas!", digo. "¡Las estoy guardando para ocasiones especiales!"

              "Umm... ¿no creen que deberíamos ponernos en marcha?", dice Flower. "No estamos tan lejos del teletransportador, y llevamos parados todo este tiempo desde que Daren empezó a probar sus técnicas nuevas..."
