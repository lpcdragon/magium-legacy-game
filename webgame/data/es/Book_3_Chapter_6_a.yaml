  - name: b3_ch06a_confession
    texts:
      - source: scene_text
        paragraph: 78
        text: |-
          "Oigan, sé que esto sale un poco de la nada, pero tengo una pequeña confesión que hacer", digo.

          "Ahora mismo no es precisamente el mejor momento, Barry...", dice Daren.

          "Ya lo sé, pero intenten seguirme un segundo", digo. "Solo tardaré un instante. En fin, hace poco descubrí que puede que mis instintos de supervivencia tengan algún pequeño defecto y--"

          "Espera, ¿solo lo descubriste hace poco?", dice Hadrik, horrorizado.

          "Sí", digo. "Me di cuenta de ello durante el ritual del Dios del Tiempo. Desde entonces he intentado ser más cuidadoso con mis decisiones, pero--"

          "¿Has intentado ser más cuidadoso con tus decisiones... preguntándole a Arraka cómo matar a un dios y luego convenciéndonos a todos para seguir tu plan de loco?...", me pregunta Daren, perplejo.

          "¡Aparte de eso!", digo. "Miren, lo que intento decir es que sé que a veces puedo tomar decisiones realmente, realmente insensatas, pero estoy intentando mejorar y agradecería que ustedes me ayudaran con eso. En otras palabras, si en el futuro me oyen proponiendo un plan estúpido, denme un coscorrón o algo así. Así al menos sabré que tengo que bajar un poco el nivel."
      - source: scene_text_2
        paragraph: 54
        text: |-
          "Barry...", dice Hadrik, apoyándome una mano en el hombro. "Quiero que sepas que definitivamente puedes contar conmigo para darte en la cabeza tantas veces como consideres necesario. ¡No porque fuera a disfrutarlo, sino como favor a un amigo!"

          "¡Perfecto!", digo. "Y, hablando de eso, acabo de tener una idea de cómo podríamos sacar ventaja sobre los guardias reales en la pelea que viene. Si Melindra volviera a lanzarme sus corrientes de aire, podría volar por delante y atraer a algunos de los enemigos lejos de ustedes disparándoles virotes de ballesta desde el aire. Si consigo mantener su atención puesta en mí el tiempo suficiente, ustedes podrían caerles todos encima a los guardias que queden y ocuparse de ellos mientras yo--"

          De pronto siento la sensación familiar y casi nostálgica de un carámbano frío y duro golpeándome en la cabeza por detrás. Cuando me giro, veo que Kate sigue sosteniendo el carámbano en la mano, mirándome con una expresión claramente desaprobatoria.
      - source: scene_3
        paragraph: 33
        text: |-
          "Debí suponer que no podías pasarte más de un minuto hablando sin decir algo realmente estúpido", dice Kate. "Ya hablamos de esto una vez. No vamos a separarnos. Lucharemos contra la guardia real juntos. ¿Ha quedado claro?"

          "¡Sí, señora!", digo.

          "Bien", dice Kate, haciendo desaparecer el carámbano de su mano. "Entonces preparémonos. Yo también empiezo a notar el aura de Gontrok, así que debe de estar ya cerca."

          "Sí, bueno, Gontrok ha decidido por fin echar a correr delante de los demás, como la última vez", dice Melindra, "así que será el primero en atacarnos. Vendrá por allí, así que te recomiendo que te prepares, Hadrik."

          "Umm... chicos, una sola pregunta antes de que empiece la batalla", dice Kelrim. "Cuando dijeron antes que planeaban pelear contra un dios... eso era solo una forma de hablar, ¿verdad? No lo decían en serio, ¿no?"

          Todos miramos al goblin sin saber muy bien qué decirle.

          "¿Chicos?...", dice el goblin, un poco más asustado al ver que no respondemos.

          "¡Ahahahahaha!", se ríe Arraka. "Solo una forma de hablar, dice. Este goblin es demasiado gracioso. Deberían quedárselo como mascota. ¡Ahahahaha!"
