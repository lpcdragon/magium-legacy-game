  - name: b3_ch06a_labels
    routes:
      - condition: ancient_languages < 1
        texts:
          - source: scene_text
            paragraph: 64
            text: |-
              Me acerco a una de las estanterías para ver un poco mejor lo que pone en una de las etiquetas. Por desgracia, por mucho que me acerque no hay manera de entender ninguna de las palabras. Aunque parezca estar escrito en lengua común, la letra en sí es tan horrible que resulta totalmente ilegible. Al ver que no estoy logrando ningún progreso, al final decido alejarme y volver adonde mis amigos esperan detrás del mostrador.

              "Tengo sus plantas aquí dentro de esta bolsa", le dice Pete a Daren, saliendo del almacén con una bolsita en la mano. "Si quieren menos cantidad, pueden dejar algunas sobre el mostrador."

              "Está bien", dice Daren. "Me llevo la bolsa entera."

              "Vale, entonces, ¿necesitan algo más o sería todo?", dice Pete.
        effects:
          - set:
              failed_checks:
                - '[ Comprobación de lenguas antiguas fallida - nivel 1 ]'
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch06a_labels2
      - condition: ancient_languages >= 1
        texts:
          - source: scene_text
            paragraph: 62
            text: |-
              Me acerco a las estanterías para ver un poco mejor lo que pone en una de las etiquetas. Cuando me concentro en las letras, de pronto caigo en la cuenta de que lo que estoy viendo no es solo una caligrafía horrible, sino un estilo de escritura completamente distinto que dejó de usarse hace cientos de años. Aunque técnicamente sigue estando escrito en lengua común, si nunca aprendiste a escribir así, no tienes ninguna posibilidad de entenderlo.

              No tengo ni idea de quién le enseñó a Pete a escribir así ni de por qué eligió usar este estilo tan raro en las etiquetas de su tienda, pero al menos ahora puedo averiguar qué plantas hay en estas estanterías. A ver qué tenemos aquí... En las estanterías de arriba hay pistilo de ambermayn, semillas drawsnap, raíces treddil... Luego tenemos garra de dragón, colmillo de dragón, diente de dragón... Maldición, quien tuviera que ponerles nombre a estas hierbas debió de rendirse a mitad de camino, ¿eh?

              Vale, en las otras estanterías tenemos mistwatchers, dawnbloomers y... ¿hierba summerglow? Sí, lo he leído bien. Sin duda hay hierba summerglow en una de esas estanterías. Y bastante además. Me pregunto por qué el tendero nos mentiría sobre eso.

              "Tengo sus plantas aquí dentro de esta bolsa", le dice Pete a Daren, saliendo del almacén con una bolsita en la mano. "Si quieren menos cantidad, pueden dejar algunas sobre el mostrador."
          - source: scene_text_2
            paragraph: 44
            text: |-
              "Oye, si no le importa que se lo pregunte", le digo al tendero, "¿qué pone en esa etiqueta de allí?"

              Entonces señalo hacia la estantería en la que está colocada la hierba summerglow.

              "Oh, uh... pone umm... ¿por qué quieres saberlo?", me pregunta Pete con nerviosismo.

              "Bueno, a mí me parece que pone 'hierba summerglow', pero eso no puede ser lo que pone, ¿verdad?", le digo. "Porque usted nos dijo que no tenía hierba summerglow en stock."

              "No les mentí, si eso es lo que estás insinuando", dice Pete. "Esas hierbas no están en venta. Alguien las encargó con antelación y esa persona vendrá a recogerlas más tarde hoy."

              "¿Y qué pasaría si le pagáramos un poco más para que nos diera esas hierbas a nosotros en lugar de a quien hizo el encargo?", digo.

              "¿Pagarme más?...", dice Pete con tono vacilante. "No, no, no, no podría hacer eso. Miren, le prometí a mi cliente que hoy le entregaría sus hierbas y no puedo traicionar su confianza. No sería profesional por mi parte. Aunque fueran a pagarme el doble de su valor, tendría que rechazar su--"

              "¡Entonces le pagaré cinco veces su valor normal... no, diez veces!", suelta Daren de repente. "¡Por favor, tengo que conseguirlas!"

              "¡¿Diez veces?!", dice Pete, conmocionado, mientras de fondo oímos a Hadrik golpearse la frente con la palma de la mano. "¿Por qué estarías dispuesto a pagar tanto solo por unas hierbas?"
          - source: scene_3
            paragraph: 26
            text: |-
              "Porque soy sanador y hay decenas de personas que podrían morir si no llevo esta hierba hasta ellas", dice Daren. "Gente de su ciudad... Por favor, ¡déjeme ayudarlas!"

              "¿Piensas usarla para curar gente?...", dice Pete. "Bueno, umm... Teniendo en cuenta que el tipo que las encargó no iba a usarlas con fines medicinales, supongo que tampoco va a morirse si espera un día más. Y dijiste que pagarías diez veces su valor, después de todo..."

              "¡Sí, lo haré!", dice Daren.

              "Bueno, en ese caso, ¡supongo que tenemos trato!", dice Pete mientras le estrecha la mano a Daren. "En un momento le prepararé otra bolsa. Ah, y pueden quedarse las cintitas con las que van atadas, si quieren. Ya han pagado de sobra también su valor."

              "Bueno...", le dice Hadrik a Daren mientras Pete agarra ahora la hierba summerglow. "Ahí se fue todo el dinero que te ahorré. Sigo sin entender por qué no podías conformarte con esas hierbas sustitutivas que te trajo."

              "Porque solo eran sustitutos", dice Daren. "No tenía ninguna garantía de que fueran a funcionar tan bien como las verdaderas. En estos casos es mucho mejor prevenir que lamentar."

              "Sí, claro", dice Hadrik, sonando algo poco convencido, mientras Pete le entrega a Daren sus hierbas.
