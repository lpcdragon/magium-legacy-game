  - name: b3_ch06a_silent
    routes:
      - condition: b3_ch6_selected = 3
        texts:
          - source: scene_text
            paragraph: 70
            text: |-
              Esperamos unos segundos, pero no llega respuesta.

              "Barry, ¿estás ahí?", vuelve a decir Daren, esta vez en voz más alta.

              Una vez más, el transceptor sigue en silencio.

              "Yo también voy a intentar llamarlo", dice Kelrim, sacando de sus túnicas blancas un transceptor propio. "¡Barry, soy Kelrim! ¿Estás en la sala del teletransportador?"

              "No sirve de nada", dice Daren después de que esperemos unos segundos más. "Creo que alguien puede estar bloqueando nuestra señal."

              "¡Me apostaría una buena cantidad de dinero a que esto es cosa del Supervisor!", dice Hadrik. "¡Eso también explicaría por qué los guardias reales pudieron encontrarnos tan rápido! ¡El muy bastardo los puso sobre nuestra pista!"

              "Entonces, ¿Supervisor?", digo mirando al dron de ojos verdes. "¿Qué tienes que decir en tu defensa?"

              "Por desgracia, esta no es una respuesta válida para la encuesta", dice el Supervisor. "Si desea volver a oír la pregunta--"

              "Da igual", le digo.
          - source: scene_text_2
            paragraph: 48
            text: |-
              "Intentemos salir de este callejón y volver a la calle principal", dice Daren. "A lo mejor, con un poco de suerte, en esa zona no nos bloquearán la señal."

              "Vale, pero demos prisa", dice Melindra. "Ahora mismo los guardias reales avanzan a velocidad normal, pero si Gontrok decide echar a correr hacia nosotros por su cuenta, llegará en cuestión de minutos."

              "Si Gontrok viene aquí él solo, déjenmelo a mí", dice Hadrik mientras todos empezamos a dirigirnos de nuevo a la gran calle por la que habíamos venido. "Tengo unas cuantas técnicas nuevas que me gustaría enseñarle."

              Mientras nos movemos, el dron de ojos verdes también me sigue de cerca, aunque parece haber renunciado a la idea de que complete la encuesta, porque ya no me está repitiendo avisos periódicos.

              "Si viene corriendo él solo antes que los demás, ¿no crees que sería mejor que lo atacáramos todos a la vez?", le pregunta Kate a Hadrik.

              "Créeme, no podremos tumbar a Gontrok antes de que lleguen sus amigos", dice Hadrik. "Si los otros guardias reales llegan aquí y todos estamos ocupados peleando contra Gontrok, nos tendrán justo donde quieren. Es mejor que yo lo mantenga ocupado mientras ustedes se centran en no comerse ningún ataque sorpresa. Lo último que necesitamos es que alguno de ustedes caiga noqueado antes siquiera de que empiece la batalla."

              "Supongo que sí tienes razón", dice Kate. "Esperemos entonces que esas técnicas que has estado practicando den resultado."
          - source: scene_3
            paragraph: 28
            text: |-
              "Si la cosa se complica... yo también tengo un hechizo que podría servirnos", dice Kelrim con un tono algo vacilante, mientras regresamos a la calle principal. "Más o menos... lo inventé cuando no conseguí modificar correctamente un hechizo de curación hace unas semanas. La última vez que lo lancé, el hechizo estuvo a punto de matarme, pero también le provocó unas náuseas muy fuertes al paciente, y creo que si lo amplifico todavía más podría resultar un arma muy eficaz contra--"

              "Kelrim, no voy a dejar que te mates solo para conseguir que uno de nuestros enemigos vomite un poco", dice Daren.

              "Si amplifico el hechizo, los efectos podrían ser mucho más fuertes que unas simples náuseas", dice Kelrim. "Y lo que de verdad importa ahora mismo es llevar la medicina a la gente enferma de la zona de cuarentena. Si todos morimos, entonces no quedará nadie para ayudar--"

              "Kelrim, te lo repito... no voy a dejar que te sacrifiques, sea cual sea el motivo", dice Daren. "Déjanos a nosotros la pelea. Nosotros nos ocuparemos. Tú limítate a quedarte atrás y lanzar cualquier hechizo de curación que pueda usarse durante el combate. ¿De acuerdo?"

              "De acuerdo...", dice Kelrim con un tono poco convencido, y luego cambia rápidamente de tema. "Creo que ya hemos puesto suficiente distancia entre nosotros y la herboristería. Quizá deberíamos intentar llamar otra vez a Barry."

              Cuando todos dejamos de caminar, tanto Daren como Kelrim intentan llamar una vez más al del teletransportador, pero sin éxito. Barry Nubarrón sigue tan ilocalizable como antes.
        choices:
