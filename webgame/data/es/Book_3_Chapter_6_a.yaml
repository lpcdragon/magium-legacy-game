      - condition: b3_ch6_password = 2 AND bluff >= 4
        texts:
          - source: scene_text
            paragraph: 32
            text: |-
              "Ya te di la contraseña y dijiste que era correcta", digo.

              "¿Qué?...", dice el tendero con tono vacilante. "¿Cuándo dije yo... algo así?"

              "¡Hace solo unos segundos!", digo. "Dijiste que la contraseña era correcta y que nos ibas a dejar pasar. No me dirás en serio que ya olvidaste algo que pasó hace tan poco, ¿verdad?"

              "Uhm, no, no... Claro que no", dice el tendero. "Recuerdo lo que dije. Les abriré enseguida."

              "Pero qué-- ¡¿Cómo demonios has hecho eso?!", me pregunta Hadrik mientras esperamos a que el dueño abra la puerta secreta.

              "Es una de sus estadísticas nuevas", dice Melindra. "Al parecer, a un nivel lo bastante alto, su aura envuelve a su enemigo y puede manipularlo para que crea hasta las mentiras más descabelladas. Sin embargo, esto solo funciona con gente que tiene un control muy débil de su aura."
          - source: scene_text_2
            paragraph: 19
            text: |-
              "¡Así que eso fue lo que pasó!", dice Daren. "¡Estaba preguntándome por qué parecía que el aura de Barry atravesó ese muro de seredium durante un segundo!"

              Tras unos instantes más, se oye un ruido fuerte viniendo de arriba y entonces el muro de seredium que tenemos delante empieza a elevarse hacia el techo. Una vez que el muro queda totalmente fuera de nuestro camino, entramos en la siguiente habitación, que tiene muchas estanterías llenas de toda clase de plantas y también a un anciano de barba gris corta de pie detrás de un mostrador, a quien supongo que será el dueño de la tienda. Al otro extremo de la estancia vemos una puerta, que probablemente conduce a algún tipo de almacén. La puerta está entreabierta.

              "Entonces, ¿qué los trae a esta humilde tienda de--", empieza a decir el tendero, pero Melindra lo interrumpe.

              "No sirve de nada intentar enmascarar tu aura, guardia real", dice Melindra. "Puedo sentirte escondido en esa habitación detrás del mostrador. ¿Qué tal si sales despacio, con las manos donde podamos verlas, y así nadie tiene que salir herido?"
