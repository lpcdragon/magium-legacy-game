  - name: b3_ch06a_killed_reject
    texts:
      - source: scene_text
        paragraph: 23
        text: |-
          "Créeme, estaremos mucho mejor si no le hacemos caso", digo. "No me extrañaría nada que el Supervisor nos usara como señuelos y nos hiciera matar solo para poder asesinar al rey mientras está distraído. Puede que técnicamente estemos del mismo lado, pero eso no significa que no sigamos siendo peones desechables para él."

          "El protocolo Supervisor les asegura que sus vidas no serán puestas en peligro inmediato como resultado directo de seguir mis instrucciones", dice el Supervisor.

          "¿Ah, sí?", digo. "¿Y qué pasa entonces con cualquier peligro no inmediato? ¿Y con los resultados indirectos de seguir tus instrucciones? ¿Por qué te has esforzado tanto en formularlo de una manera tan específica si no estabas intentando engañarnos?"

          "Si tiene alguna queja sobre el vocabulario del Supervisor, puede presentar una queja formal y le aseguramos que será tramitada en el momento oportuno", dice el Supervisor. "Para presentar una queja, simplemente diga que desea hacerlo y sus siguientes palabras serán registradas."
      - source: scene_text_2
        paragraph: 15
        text: |-
          "¿Podemos simplemente dejarlo atrás y seguir con lo que estábamos haciendo?...", digo. "Cuanto más habla, menos me inclino a confiar en nada de lo que dice."

          "Bueno, tú has tenido más interacciones con él que yo, así que supongo que confiaré en tu instinto con esto", dice Daren. "Vayamos hacia las otras tres tiendas."

          El Supervisor sigue persiguiéndonos un rato más, intentando aún convencernos de que vayamos con él a la herboristería secreta, pero en cuanto se da cuenta de que no vamos a dejar de ignorarlo, decide dejarnos en paz y se aleja volando.
