  - name: b3_ch06a_processing
    texts:
      - source: scene_text
        paragraph: 25
        text: |-
          "Saludos, amigos", oímos la voz del Supervisor saliendo de la bola metálica cuando se acerca lo suficiente a nosotros. "A juzgar por su trayectoria actual, he concluido que se dirigen a una de las tiendas de herborista de esta calle. ¿Sabían que también hay una cuarta tienda de herborista secreta en esta zona? Podría guiarlos hasta ella, si quieren."

          "Escucha, Supervisor...", digo. "Tú y yo sabemos que no enviarías tu bola metálica hasta aquí solo para ayudarnos a buscar unas hierbas. Si quieres que colaboremos contigo de verdad, vas a tener que ser un poco más honesto con nosotros. Dime, ¿por qué quieres realmente que vayamos a esa tienda?"

          "Procesando... Procesando...", dice el Supervisor. "El protocolo Supervisor ha decidido compartir con ustedes sus verdaderos motivos para ganarse su confianza. En este momento, la tienda de herborista subterránea cubierta de seredium está siendo visitada por uno de los guardias reales. Si lograran matarlo o capturarlo, asestarían un golpe importante a las fuerzas enemigas."
      - source: scene_text_2
        paragraph: 16
        text: |-
          "¿Y por qué nos ocultabas eso?", digo. "¿Es porque no estás seguro de que podamos derrotarlo?"

          "No", dice el Supervisor. "El guardia real en cuestión es Loyrang, el mercenario del Continente Sur que acompañaba a Gontrok y al capitán cuando se encontraron por primera vez con ustedes. Deberían poder derrotarlo con facilidad siempre que trabajen todos juntos. Sin embargo, todos los guardias reales llevan dispositivos que les permiten enviar señales de socorro a los demás cuando son atacados. Eso significa que es muy probable que el resto de guardias se dirijan hacia ustedes en cuanto ataquen a Loyrang, por lo que ya no tendrán el lujo de visitar más tiendas antes de teletransportarse de vuelta a su base."

          "O sea, que si queremos librarnos de uno de los guardias reales, tendremos que apostarlo todo a una sola baza y esperar que esta tienda secreta tenga todo lo que necesitamos", dice Daren. "No estoy muy seguro de cuánto me gusta esta idea."
