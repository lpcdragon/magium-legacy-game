  - name: b3_ch06a_caught
    texts:
      - source: scene_text
        paragraph: 34
        text: |-
          "Ayer nos pillaron desprevenidos. En circunstancias normales, deberíamos poder derrotar a esos dos con facilidad."

          "¿Desprevenidos, eh?", dice Loyrang. "No sé si yo lo llamaría así. Por lo que vi, sinceramente parecía que el capitán por sí solo habría bastado para encargarse de todos ustedes."

          "Eso es solo porque no conocíamos la técnica de manipulación de aura que estaba usando y no sabíamos cómo contrarrestarla entonces", dice Daren. "Eso ha cambiado desde entonces."

          "Sí, y anoche hice un poco de entrenamiento en preparación para mi próxima pelea con Gontrok", dice Hadrik. "Te garantizo que esta vez no va a terminar bien para él."
      - source: scene_text_2
        paragraph: 21
        text: |-
          "Mhm...", dice Loyrang con sarcasmo. "Seguro que una sola noche de entrenamiento va a marcar una diferencia enorme. En fin, si quieren información sobre los otros guardias reales, puedo decirles que uno de ellos siempre lleva túnicas negras y tiene varios anillos en los dedos que lo ayudan a usar distintos tipos de magia. Hasta ahora lo he visto usar teletransportación de corto alcance, hechizos de mareo, encantamiento de armas, un hechizo que lo ayuda a ocultar su presencia y un hechizo que le permite conjurar espadas de la nada y lanzarlas volando contra sus adversarios."

          "Sí, ya lo conocemos", digo. "Fue el que nos tendió una emboscada la última vez que salimos a la superficie. ¿Y qué pasa con los otros guardias reales?"
      - source: scene_3
        paragraph: 10
        text: |-
          "Bueno, hay otros tres, pero la verdad es que no los he visto luchar demasiado", dice Loyrang. "Normalmente el capitán lo resuelve todo en un instante, y a los demás luego les toca limpiar el terreno. Estoy bastante seguro de que el que siempre lleva una capa roja usa magia de ilusión. Los otros dos quizá sean elementalistas de algún tipo, pero no podría asegurarlo."

          "Eso no nos da mucho con lo que trabajar, pero al menos es un comienzo", dice Daren. "Ahora la pregunta es... ¿qué se supone que vamos a hacer contigo?"
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch06a_promise
  - name: b3_ch06a_mopped
    texts:
