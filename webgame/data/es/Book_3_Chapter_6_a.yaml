  - name: b3_ch06a_bluffed
    texts:
      - source: scene_text
        paragraph: 42
        text: |-
          "Bien", dice el tendero. "Pero antes, ¿les importaría acercarse un poco más al mostrador? Quiero bajar el muro de seredium y preferiría no correr el riesgo de aplastarlos debajo."

          Todos hacemos lo que nos dice y entonces tira de una palanca, haciendo que el muro que estaba detrás de nosotros descienda lentamente desde el techo hasta cubrir por completo la entrada de la tienda.

          "Entonces, ¿qué es exactamente lo que necesitan de mí?", dice el tendero una vez cerrada la puerta oculta. "Si se tomaron la molestia de encontrar mi tienda escondida en una zona repleta de tiendas de herborista, supongo que deben de estar buscando algo bastante raro, ¿no?"

          "Correcto", dice Daren. "Queremos comprar algunas hojas rainweather y hierba summerglow. Oímos que su tienda tiene en stock todo tipo de hierbas raras, así que decidimos venir aquí primero."

          "Se dan cuenta de que, dada la dificultad de conseguir esas hierbas en esta ciudad, voy a cobrarles cinco veces su valor normal, ¿verdad?", dice el tendero.

          "Por supuesto", dice Daren. "Eso sería lo justo."

          "Oh, ¿así que no van a intentar regatearme el precio?", dice el tendero. "Qué sorpresa tan agradable. Esperen un momento. Creo que debo de tener lo que necesitan en alguna de estas estanterías detrás de mí."

          "¡¿Cinco veces el precio normal?!", le susurra Hadrik a Daren con gesto exasperado mientras el tendero les da la espalda. "¿De verdad vas a aguantar eso?"
      - source: scene_text_2
        paragraph: 27
        text: |-
          "Cálmate, Hadrik", le responde Daren en un susurro. "Solo necesito unas pocas de esas hierbas, no todo su stock."

          "Sí, pero aun así... ¿cinco veces?", dice Hadrik. "¿No podrías al menos haber negociado un poco?"

          "Ah, aquí están", dice el tendero mientras coge varias plantas de las estanterías y las mete en una pequeña bolsa. "¿Cuántas quieren?"

          "Llene dos de esas bolsas", dice Daren mientras saca ahora un papel de su mochila. "Con eso debería bastar, creo. ¿Puede traerme también las plantas que tengo escritas en esta lista cuando termine? Estas deberían ser más comunes por aquí, así que espero que me las venda a un precio más razonable."

          El tendero le trae a Daren las dos bolsas que pidió y luego toma la lista de sus manos, echándole un vistazo rápido.

          "Hmm...", dice el tendero. "Estoy bastante seguro de que tengo todas estas en stock. En un minuto les tendré lista otra bolsa de hierbas."

          En cuanto el dueño de la tienda nos trae todo lo que necesitamos, Daren le entrega el dinero que pidió y nos preparamos para marcharnos. Antes de irnos, Loyrang entra en el almacén, tal como prometió, y lo encierran dentro. Luego nos despedimos del tendero mientras vuelve a tirar de la palanca para abrir la puerta secreta y regresamos por donde vinimos.
