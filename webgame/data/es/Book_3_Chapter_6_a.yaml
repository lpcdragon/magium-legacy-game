            paragraph: 67
            text: |-
              Me acerco un poco más al mostrador para mirar mejor las plantas de las estanterías. Aunque mi conocimiento limitado sobre hierbas en general me impide reconocer muchas de ellas, lo que sí noto es que no todas las plantas están colocadas del mismo modo. Algunas parecen estar cuidadosamente atadas con cintas, mientras que la mayoría de las otras están simplemente tiradas allí sin demasiado cuidado. Normalmente, cuando veo eso en una tienda, es para diferenciar entre la mercancía que está a la venta para clientes normales y la mercancía que se ha encargado con antelación. Me pregunto si aquí será igual...

              "Tengo sus plantas aquí dentro de esta bolsa", le dice Pete a Daren, saliendo del almacén con una bolsita en la mano. "Si quieren menos cantidad, pueden dejar algunas sobre el mostrador."

              "Oye, si no le importa que se lo pregunte", le digo al tendero, "¿por qué algunas de las plantas de esas estanterías están atadas con cintas?"

              "Oh, porque están destinadas a gente que las pidió por adelantado", dice Pete.

              "Y no resultará que entre esas plantas atadas con cintas hay también hierba summerglow, ¿verdad?", digo.
