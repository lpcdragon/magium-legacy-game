  - name: b3_ch06a_merchandise
    routes:
      - condition: ch11_saved_rose = 0
        texts:
          - source: scene_text
            paragraph: 10
            text: |-
              "Antes de continuar, tenemos que asegurarnos de saber exactamente adónde vamos", dice Kate. "Daren, ¿averiguaste qué tiendas deberíamos visitar primero?"

              "Eh...", dice Daren. "Kelrim, ¿te importaría decirnos otra vez hacia dónde vamos? Estoy bastante seguro de que antes mencionaste algo de una herboristería que quizá tuviera lo que buscamos, pero no recuerdo mucho más que eso."

              "No conozco ninguna tienda concreta que tenga todo lo que necesitamos", dice Kelrim, "pero hay una zona concreta de la ciudad que tiene tres tiendas de herborista bastante cerca unas de otras, así que creo que deberíamos empezar a buscar allí. Esas tres tiendas están siempre compitiendo entre sí y, por esa razón, intentan mantener la calidad de su mercancía lo más alta posible. Si he de ser totalmente sincero, si no encontramos lo que necesitamos en esas tres tiendas, no estoy seguro de que vayamos a encontrarlo en ningún otro sitio de la ciudad."

              "Entonces más nos vale asegurarnos de conseguir esas hierbas cueste lo que cueste", dice Daren.

              "Después de regatear un poco el precio, claro", dice Hadrik.

              "Ya veremos", dice Daren.

              "Pues vámonos", dice Melindra. "Y no olviden suprimir sus auras antes de teletransportarnos a la superficie. Me refiero a suprimirlas por completo, no solo a ocultar la magia de sus auras, porque si no la gente con un Sentido mágico lo bastante agudo los detectará con facilidad. Pueden fijarse en cómo lo hace siempre Illuna, si quieren un ejemplo claro."
          - source: scene_text_2
            paragraph: 7
            text: |-
              "Sí, sí", dice Hadrik. "Ya lo entendimos."

              Caminamos unos minutos más, hasta que por fin llegamos a la entrada de la sala del teletransportador. Cuando entramos, vemos que el teletransportador sigue siendo operado por el mismo tipo de ayer. Igual que el rey del subsuelo y Albert, el operador del teletransportador tampoco parece haber dormido mucho anoche.

              "¡Hombre, si no es Barry Nubarrón!", dice Hadrik en voz alta en cuanto ve al del teletransportador. "¿Cómo te ha ido? Espera, no respondas. Creo que ya lo sé por tu cara. Noche dura, ¿eh?"

              "Supongo que podría decirse así...", le responde el del teletransportador.

              "¿Tu nombre completo era Barry Nubarrón?", pregunta Kelrim, sorprendido. "No tenía ni idea."

              "Ah, no, 'Nubarrón' es solo un apodo", dice el del teletransportador. "Lo que pasa es que acordamos usar mi apodo cuando hablamos, para poder diferenciarme del otro Barry, el que está ahí a tu lado."

              "Perdona mi curiosidad, pero ¿cómo acabaste exactamente con un apodo como 'Nubarrón'?", dice Kelrim.
          - source: scene_3
            paragraph: 5
            text: '"Bueno, había tres Barrys en el mismo vecindario cuando crecíamos", dice el del teletransportador. "Estaba empezando a ser un poco difícil distinguir de quién hablábamos cuando jugábamos fuera, así que decidimos ponernos apodos. Por desgracia, como éramos unos críos, acabamos poniéndonos los apodos más insultantes que pudimos imaginar, y enseguida dejaron de servir para nada, porque ninguno de nosotros era tan tonto como para responder cuando lo llamaban cosas como lentorro, cejijunto o cara gorda. Fue entonces cuando... cuando intervino mi hermano pequeño. Nos dijo que dejáramos de pelear y que él nos inventaría unos apodos mejores, unos que no tuviéramos motivo para rechazar. Siempre fue la voz de la razón en nuestro grupo. Incluso de pequeño..."'
