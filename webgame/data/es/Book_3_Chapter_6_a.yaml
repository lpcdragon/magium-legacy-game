            text: |-
              "¿Creen que va a atacarnos?", escribe Leila mientras nos alejamos del dron de ojos verdes.

              "No creo que pueda hacerlo sin salir de su 'modo de mantenimiento', lo que lo pondría en riesgo de que Billy Bob lo desactive", digo. "Lo máximo que probablemente pueda hacer en su situación actual es avisar a los guardias."

              "Si les dice a los guardias reales dónde estamos, seguirá siendo bastante malo para nosotros", dice Daren. "Tendremos que intentar conseguir esas hierbas lo más rápido posible."
          - source: scene_3
            paragraph: 13
            text: |-
              Seguimos avanzando detrás de Kelrim y, al cabo de un rato, entramos en un callejón estrecho que nos lleva directamente a donde queremos ir. Unos cuarenta segundos de caminata después, nos detenemos delante de un edificio con un gran cartel arriba que dice 'Bienvenido a la Herboristería de Pete. Las hierbas de mejor calidad de la ciudad. ¡Ahora en oferta!'

              "Es aquí", dice Kelrim. "Entremos."

              Vamos entrando por la puerta uno a uno, asegurándonos de cerrarla cuando ya estamos todos dentro. Antes de que tengamos ocasión de echar un buen vistazo a nuestro alrededor, el dueño de la tienda nos saluda en voz alta.

              "Bienvenidos a la Herboristería de Pete", dice el tendero. "Soy Pete. Echen un vistazo. ¡Les garantizo que no encontrarán mercancía de mejor calidad en todo Ollendor!"

              El tendero que está detrás del mostrador no parece asustado de nosotros ni aprensivo de ninguna manera, a diferencia de otros dueños de tiendas que hemos visto por las ventanas de camino aquí. De hecho, parece bastante ilusionado por tener por fin la oportunidad de vender parte de su mercancía, teniendo en cuenta lo vacías que están ahora mismo las calles. Justo cuando Daren se dispone a dirigirse al tendero, Hadrik se le adelanta y empieza a hablar también en voz alta, para igualar el tono del vendedor.
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch06a_pete
  - name: b3_ch06a_helpful
    texts:
      - source: scene_text
        paragraph: 22
        text: |-
          "Saludos, amigos", oímos la voz del Supervisor saliendo de la bola metálica cuando se acerca lo suficiente a nosotros. "A juzgar por su trayectoria actual, he concluido que se dirigen a una de las tiendas de herborista de esta calle. ¿Sabían que también hay una cuarta tienda de herborista secreta en esta zona? Podría guiarlos hasta ella, si quieren."

          "¿Y por qué querríamos ir a la tienda secreta de un herborista si ni siquiera hemos revisado aún el inventario de las otras tres?", digo, mientras seguimos avanzando y el dron de ojos verdes nos sigue desde arriba.

          "Porque se dice que esa tienda de herborista tiene en stock algunas hierbas muy raras que quizá no puedan encontrar en ningún otro sitio", dice el Supervisor. "Teniendo en cuenta que los guardias los están buscando activamente, ¿no tendría más sentido empezar por la tienda con el surtido de mercancía más amplio?"
      - source: scene_text_2
        paragraph: 14
        text: |-
          "Otra vez estás siendo demasiado servicial", digo. "La última vez que mostraste tanto interés por ayudarnos fue porque querías que matáramos a Billy Bob por ti. Dime, ¿cuál es la verdadera razón por la que intentas ayudarnos esta vez?"

          "Pregunta poco clara", dice el Supervisor. "Por desgracia, el protocolo Supervisor no puede proporcionarle una respuesta correcta si su pregunta es demasiado vaga. Reformule su consulta anterior."

          "Ah, sí, la vieja respuesta de 'pregunta poco clara'", digo. "Qué nada sospechoso por tu parte."

          "Puedo confirmar que en efecto hay rumores sobre una cuarta herboristería en esta zona", dice Kelrim. "Nunca he ido, así que no sé dónde podría estar escondida."

          "Si el Supervisor dice la verdad sobre la tienda secreta, quizá valga la pena ir a echar un vistazo rápido", dice Daren. "Quiero decir, no va a vendernos al rey, ¿verdad? Hizo que mataras a Billy Bob, así que desde luego no está de su lado."
    choices:
      - position: 1
        text: Créeme, estaremos mucho mejor si no le hacemos caso.
        effects:
          - set:
              current_scene: b3_ch06a_killed_reject
