  - name: b3_ch06a_further
    texts:
      - source: scene_text
        paragraph: 72
        text: |-
          "¿Y si avanzamos un poco más por la calle y volvemos a intentar llamarlo desde allí?"

          "Supongo que podríamos probar", dice Daren. "Aunque a estas alturas empiezo a dudar que vayamos a poder salir de aquí sin pelea."

          Mientras nos alejamos de esa zona, Kelrim intenta llamar a otra persona de la base rebelde por el transceptor, a ver si tiene más suerte.

          "¿Roberta, me oyes?", dice el goblin por el transceptor mientras seguimos caminando. "¡Por favor, necesito tu ayuda!"

          "¿A quién intentas llamar?", le pregunta Daren.

          "A una enfermera con la que he estado trabajando en la zona de cuarentena", dice Kelrim. "Como no sabemos cómo funciona exactamente este bloqueo de señal, estaba pensando que quizá, si consigo contactar con otra persona, ella podría avisar a Barry por nosotros."

          "Eso no va a funcionar", dice Kate. "Hay demasiado seredium entre nosotros y cualquier otra parte de la base rebelde salvo la sala del teletransportador como para que la señal atraviese, incluso aunque no esté bloqueada. Los transceptores de Daren son los únicos que tienen potencia suficiente como para funcionar bien a través de una capa tan gruesa de seredium, e incluso esos funcionan de forma inconsistente, por lo que he visto."
      - source: scene_text_2
        paragraph: 50
        text: |-
          "Podría intentar llamar a esa amiga tuya con mi transceptor, pero no estoy seguro de que sirva de mucho", dice Daren. "Mis transceptores están diseñados para funcionar bien en pareja debido a las frecuencias especiales que usa cada uno, pero cuando intento utilizarlos en frecuencias normales no funcionan mucho mejor que los transceptores corrientes que se compran en el mercado."

          "No importa...", dice Kelrim. "Vamos a intentar llamar otra vez a Barry directamente. Si хотя бы אחת de estas llamadas consigue llegar, quizá todavía tengamos alguna posibilidad de salir de aquí."

          "Vale, yo diría que ya estamos lo bastante lejos del sitio donde estábamos antes", dice Daren, deteniéndose todos. "Voy a intentar llamarlo otra vez."

          Entonces vuelve a tocar el transceptor y se lo acerca a la boca.

          "¡Barry, nos oyes?!", grita Daren en voz alta.

          "¡Barry, nos vendría muy bien tu ayuda ahora mismo!", dice Kelrim.
      - source: scene_3
        paragraph: 29
        text: |-
          "¡Eh, Barry!", vuelve a gritar Daren.

          "Barry, ¿por qué no les respondes?...", oímos de pronto la voz calmada de Albert salir del transceptor de Daren.

          "¿Albert?...", oímos esta vez la voz del del teletransportador. "¡No te vi entrar en la sala!"

          "Claro que no", dice Albert. "Soy un asesino. Vine a ver si había más refugiados que necesitaban orientación y, en cambio, te encontré mirando un transceptor del que salían gritos. ¿Me quieres decir qué está pasando?"

          "Sí", dice el del teletransportador. "Creo que hay algún hechizo en su zona que está interfiriendo con la señal. No consigo fijarlos bien con el teletransportador, y no parecen oírme aunque lleve muchos minutos intentando contactar con ellos."

          "¡Barry, ahora sí te oímos!", dice Daren. "Nos hemos movido a otro sitio y creo que aquí la señal puede ser mejor. ¿Puedes intentar teletransportarnos otra vez?"
