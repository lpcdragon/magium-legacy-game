      - condition: b3_ch6_manipulators = 2
        texts:
          - source: scene_text
            paragraph: 5
            text: |-
              "¿Y qué pasa con el resto de nuestros magos? ¿Crees que ellos también podrían aprender manipulación de aura?"

              "Bueno, sé que Illuna no sirve para esto, porque intenté enseñarle manipulación de aura cuando todavía era mi alumna y no hizo el menor progreso", dice Arraka. "De los demás no lo sé. Todos escucharon la explicación del goblin de antes, así que supongo que podrían intentar hacer lo mismo que Daren y ver si les sale. No se me ocurre una forma mejor de poner a prueba sus habilidades que esa. En fin, en lo que respecta a Daren y su truquito de invocación de la espada, creo que tendría mucho más sentido que aprendiera una técnica que le impidiera perder el arma en primer lugar. Por ejemplo, podría pegar la espada a su mano con el aura cuando pelea, de modo que sus enemigos ya no pudieran desarmarlo."

              "¿Puedo hacer eso con mi aura?", dice Daren. "¿Cómo?"

              "Déjame pensar en una forma de explicar esto en términos lo bastante simples incluso para alguien como tú", dice Arraka. "A ver... ¿cómo suele traducir estas cosas el goblin al lenguaje para idiotas? ¡Ah, sí! Ya sabes cuáles son las cinco corrientes fluidas de la punta de tus dedos, ¿verdad? Bueno, en vez de imaginarlas como chorros de agua, deberías pensar en ellas como el pegamento líquido de secado rápido que ciertas especies de caracoles gigantes dejan en forma de rastro. Te acuerdas de aquella vez en que Hadrik se convirtió en caracol y se pegó al suelo para luchar contra aquel mamut, ¿no? Pues intenta imaginar que el aura que sale de la punta de tus dedos es de una sustancia parecida y haz que cubra tu espada mientras la sostienes."
