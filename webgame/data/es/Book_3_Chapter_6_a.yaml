        texts:
          - source: scene_text
            paragraph: 39
            text: |-
              "Yo digo que lo atemos", les digo a todos. "Nunca está de más pecar de prudentes."

              "La verdad, discrepo", dice Loyrang. "En este caso concreto, ser 'prudentes' podría acabar perjudicándolos mucho, porque no tengo ninguna intención de dejar que me aten. No tengo ninguna garantía de que no intenten matarme en cuanto me inmovilicen. Demonios, su amiga incluso sugirió antes que sería más sencillo asesinarme directamente. No esperarán en serio que vaya a dejarme reducir sin luchar, ¿verdad?"

              "Vale, Loyrang, lo entendemos", dice Daren. "No quieres que te atemos. ¿Entonces qué propones?"

              "Si de verdad quieren tanto que me quede en esta tienda, podrían pedirle al tendero que me encierre en su almacén durante una hora o dos", dice Loyrang. "Así seguiría estando fuera de su camino, pero ustedes ya no tendrían la oportunidad de rematarme mientras estoy indefenso. Claro que eso significaría que tendrían que confiar en que el tendero no me dejará salir de esa habitación una vez se hayan ido, pero habría sido lo mismo incluso si me ataban, ya que podría cortar las cuerdas con facilidad y dejarme libre si quisiera."
          - source: scene_text_2
            paragraph: 24
            text: |-
              "Suena... lo bastante razonable", dice Daren. "De acuerdo, en ese caso le pediremos al dueño de la tienda que te encierre ahí dentro cuando terminemos de comprar. Si acepta, claro."

              "Desde mi punto de vista, puede quedarse encerrado ahí dentro el resto del día si es lo que quiere", dice el tendero. "A mí me da igual."

              "Perfecto", dice Daren. "Bueno, ahora que ya está resuelto lo de Loyrang, nos gustaría comprar unas hierbas, si no le importa."
