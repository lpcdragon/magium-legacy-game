        text: |-
          "...Muy bien", dice el Supervisor. "Esta unidad volverá ahora a patrullar los cielos. Les deseo buena suerte."

          "Vale, vamos", dice Daren mientras el dron de ojos verdes vuelve a elevarse en el aire. "Kelrim, guía tú."
