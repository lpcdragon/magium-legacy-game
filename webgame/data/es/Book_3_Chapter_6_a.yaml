            text: |-
              "Sí."

              "Ha seleccionado la respuesta 'Sí'", dice el Supervisor. "Gracias por completar la encuesta. ¡Que tenga un buen día!"

              La bola metálica de ojos verdes asciende entonces hacia el cielo para reunirse con todas las demás que están patrullando las alturas. Al poco rato, Daren y los demás salen de la tienda y, cuando están fuera, me miran alrededor con desconcierto.

              "¿Adónde se fue el Supervisor?", dice Daren. "¿Va a enviarnos sus bolas metálicas?"

              "No", digo. "Me dijo que le ordenaron retirar todas sus unidades. Su bola metálica de ojos verdes volvió al cielo y no ha enviado ninguna otra aquí abajo desde entonces."
          - source: scene_text_2
            paragraph: 41
            text: |-
              "Lo más probable es que le dijeran a las bolas metálicas que se retiraran para no interferir con los guardias reales que han enviado a capturarnos", dice Melindra. "Puedo sentir a unos cuantos viniendo hacia nosotros en este mismo momento. Detecto a Gontrok, al capitán y a un tercer tipo que no es mago viniendo por un lado, mientras que el guardia real que no se unió a la pelea contra nosotros la última vez se acerca por el lado opuesto junto con un mago que no reconozco."

              "Entonces tendré que llamar a Barry para que nos teletransporte fuera de aquí ahora mismo", dice Daren, sacando deprisa el transceptor.

              "¿Conseguiste todo lo que necesitabas de la tienda?", le pregunto.
