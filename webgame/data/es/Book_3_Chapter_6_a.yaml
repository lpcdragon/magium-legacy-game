  - name: b3_ch06a_pete
    texts:
      - source: scene_text
        paragraph: 61
        text: |-
          "¡No sé qué decirte, Pete!", dice Hadrik mientras echa un vistazo rápido a todas las mercancías expuestas en las estanterías. "Tus hierbas tienen buena pinta y todo, pero el tipo de la otra tienda me dijo que las suyas eran todavía mejores. ¡Las mejores del mundo entero, dijo! Difícil superar esa calidad, ¿no te parece, Pete?"

          "¿De qué otro tipo estás hablando?", dice Pete. "¿Es Ben? ¡Ese tipo es un estafador! ¡No se puede confiar en él! Yo siempre le digo a todo el mundo que se mantenga alejado de Ben y de sus timos, ¡pero nadie me escucha!"

          "Sí, pero verás, Ben nos ofreció unos precios realmente buenos", dice Hadrik con media sonrisa. "Ni siquiera con la oferta que tienes aquí tus precios se comparan."

          "¡Eso es porque Ben les vende sus peores hierbas e intenta hacer parecer que les está haciendo un favor!", dice Pete. "¡Créeme, sé perfectamente cómo funciona!"

          "No sé qué creer, Pete", dice Hadrik. "Quiero decir, yo no soy un experto en plantas, pero esas hierbas suyas parecían condenadamente buenas. Y él sí dijo que eran las mejores del mundo..."

          "Mira, sé qué clase de 'tratos' hace Ben", le dice Pete a Hadrik. "Voy a hacer lo siguiente. Les daré un trato todavía mejor y así se olvidarán de ese estafador y de su mercancía podrida. Díganme qué plantas quieren y les daré los mejores precios de toda esta maldita zona."
      - source: scene_text_2
        paragraph: 42
        text: |-
          "Pete, regateas duro", dice Hadrik con una sonrisa algo más amplia, "¡pero has conseguido convencerme! Daren sabe exactamente qué hierbas necesitamos, así que tendrás que preguntarle a él todos los detalles. ¡Eh, Daren, ven y dale a este buen hombre tu lista de la compra para que pueda comprobar qué tiene en stock!"

          "Um, sí, claro, lo haré...", dice Daren mientras saca una lista y se la entrega al tendero.

          "Maldita sea, Hadrik", le susurro cuando él se aparta del mostrador para dejar que Daren hable con Pete. "Casi me ha dado pena el tipo. ¿Va a sacar siquiera algún beneficio de sus ventas después de todas esas rebajas?"

          "No hace falta que te dé lástima", me susurra Hadrik de vuelta. "Este tipo de comerciantes siempre suben los precios para tener en cuenta el regateo. No tengo ninguna duda de que seguirá sacando unos beneficios generosos incluso después de toda esa rebaja."

          "Entonces, aparte de todo lo que figura en esta lista, también busco algunas hojas rainweather y hierba summerglow", oímos a Daren hablar con el tendero. "¿Tiene de eso en stock por casualidad?"

          "Hojas rainweather sí tengo, pero hierba summerglow no, me temo", dice Pete.
        condition: ch11_saved_rose = 0
