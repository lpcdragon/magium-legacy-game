              "Un momento", dice Melindra. "Hadrik, no estás ocultando bien tu aura. ¿No te dije ya que tienes que esconderla por completo?"

              "Sí, eso es lo que estoy haciendo", dice Hadrik.

              "¡No, no lo estás haciendo!", dice Melindra. "Solo estás ocultando tu poder mágico. ¿Cómo puedes confundir una cosa con la otra? ¡Endureces el aura todo el tiempo cuando peleas! Lo único que tienes que hacer es ocultarla en vez de endurecerla. ¿Tan difícil puede ser?"

              "¡Oye, no es lo mismo en absoluto!", dice Hadrik. "Cuando endurezo el aura alrededor de mis puños, por ejemplo, me concentro en toda la capa que los rodea y-- ah, espera, da igual, creo que ya lo entiendo."

              El aura que se siente alrededor de Hadrik va desvaneciéndose poco a poco, hasta volverse prácticamente indetectable.

