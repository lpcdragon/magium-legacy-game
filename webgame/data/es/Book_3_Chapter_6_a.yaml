            paragraph: 9
            text: |-
              "Sí", dice Melindra. "Así es como se hace. Los demás ya están ocultando sus auras con la suficiente solvencia, así que yo diría que podemos irnos. Ya podemos teletransportarnos a la superficie."

              "Muy bien", dice el del teletransportador. "¡Buena suerte!"

              Entonces sentimos la misma sensación familiar de nuestros cuerpos empezando a vibrar mientras nos cubre una luz blanca brillante y, unos instantes después, nos encontramos en medio de un callejón desierto que desemboca en una gran calle llena de tiendas.

              "En esa calle de ahí encontraremos las tiendas de herborista", nos dice Kelrim. "Parece que el toque de queda sigue en vigor, porque no es normal que este sitio esté tan vacío a estas horas. Síganme. Los llevaré a la primera tienda."
            condition: bluff >= 3
          - source: scene_3
            paragraph: 7
            text: |-
              Cuando empezamos a caminar detrás del goblin, Illuna se dirige de pronto a Arraka en voz baja.

              "Bueno, ¿y entonces, Arraka?", dice Illuna. "¿Piensas decirnos qué averiguaste sobre Barry 'Nubarrón', o planeas quedártelo todo para ti?"

              "¿Eh?", dice Arraka. "¿Qué estás murmurando?"
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch06a_curfew
  - name: b3_ch06a_curfew
    texts:
      - source: scene_text
        paragraph: 16
        text: |-
          "No te hagas la tonta conmigo", dice Illuna. "No hay forma de que perdieras el tiempo hablando con alguien tan poco importante como él sin tener una intención oculta. Casi seguro que lo estabas haciendo enfadar a propósito para ver si conseguías que su aura fluctuara. Así que te lo pregunto otra vez. ¿Qué averiguaste?"

          Arraka se ríe.

          "Veo que sigues siendo igual de perceptiva que siempre", dice. "Vale, lo admito. Melindra despertó mi interés cuando mencionó antes lo estancada que estaba su aura, y quise ver si la estaba suprimiendo o si de verdad había nacido así, como dijo. Estaba bastante claro que conseguí tanto cabrearlo como hacer que mintiera sobre su antiguo apodo cuando me burlé de él y, aun así, no pude ver cambio alguno en su aura. Eso significa que lo más probable es que dijera la verdad sobre que su aura es naturalmente así, porque desde luego yo habría notado si estuviera intentando mantenerla estable a propósito."

          "Entonces no estaba suprimiendo el aura a propósito porque tuviera algo que ocultarnos", dice Illuna. "Es bueno saberlo."

          "¿Pueden bajar un poco más la voz?", dice Daren. "No queremos revelar nuestra posición antes siquiera de llegar a la primera tienda."
      - source: scene_text_2
        paragraph: 11
        text: |-
          "Está bien", dice Melindra. "Ninguno de los guardias está lo bastante cerca como para oírnos, y además no se están moviendo hacia nosotros todavía. De momento deberíamos estar a salvo."

          "No sé qué decir...", escribe Leila. "No me gusta nada la forma en que estos tenderos nos están mirando."

          Ahora que Leila lo menciona, me doy cuenta de que la mayoría de los tenderos por delante de los que hemos pasado nos han estado lanzando miradas acusadoras desde las ventanas o se han apartado con miedo solo con vernos. Está bastante claro que no somos precisamente bienvenidos aquí.

          "Es normal que actúen así", dice Kate. "El rey dijo que nadie tiene permitido caminar por estas calles hasta que encuentren a los responsables de la muerte de su hermano, así que no hace falta ser un genio para darse cuenta de que cualquiera que esté dispuesto a ignorar el toque de queda y salir a pasear a estas horas solo puede estar buscando problemas. Aunque no hayan oído todavía nuestras descripciones por boca de los guardias, siguen teniendo motivos de sobra para desconfiar de nosotros."

          "Hablando de desconfiar...", dice Hadrik. "Miren quién viene a saludarnos."

          Al alzar todos la vista al cielo, vemos un dron de ojos verdes descendiendo lentamente hacia nosotros.
