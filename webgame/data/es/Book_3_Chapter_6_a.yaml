  - name: b3_ch06a_settled
    routes:
      - condition: b3_ch6_tie = 0
        texts:
          - source: scene_text
            paragraph: 38
            text: |-
              "Creo que quizá sea mejor dejar que siga su camino", digo. "Si lo dejamos aquí, existe el riesgo de que algún otro guardia real lo encuentre, lo desate y lo obligue a venir a pelear contra nosotros."

              "Eso es perfectamente posible", dice Daren. "Puede que de verdad sea más prudente dejarlo marchar. Loyrang, si te dejamos ir, ¿prometes que irás directamente a las puertas de la ciudad, sin detenerte en ningún otro sitio por el camino?"

              "¡Lo juro!", dice Loyrang.

              "Bueno, desde luego no parece estar mintiendo...", dice Melindra.

              "Si vas a irte, entonces hazlo ya, antes de que otro guardia te vea y te arrastre de vuelta", dice Kate.
          - source: scene_text_2
            paragraph: 23
            text: |-
              "No hace falta que me lo digan dos veces", dice Loyrang.

              Entonces saca unas cuantas monedas del bolsillo y las deja sobre el mostrador.

              "Aquí tiene su dinero, buen hombre", le dice Loyrang al tendero, y luego empieza a pasar junto a nosotros para alcanzar las escaleras.

              Cuando empieza a subir hacia la superficie, se despide de nosotros y sigue avanzando hasta que dejamos de verlo.

              "Estupendo", dice Daren. "Bueno, ahora que ya está resuelto lo de Loyrang, nos gustaría comprar unas hierbas, si no le importa."
