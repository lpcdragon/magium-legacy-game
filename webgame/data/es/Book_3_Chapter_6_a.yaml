        text: |-
          "Quizá Rose podría ayudarnos", digo. "Si congelara el tiempo durante treinta segundos como ayer, tal vez podríamos llegar a la tienda sin tener que pelear de verdad."

          "La última vez Rose tuvo muchísimos problemas para mantener el hechizo durante esos treinta segundos completos", dice Kate. "Después incluso estuvo a punto de desmayarse. No me gustaría arriesgarme a que salga herida cuando tenemos otras alternativas."

          "Aunque solo pudiera mantenerlo veinte segundos, seguiría siendo suficiente para sacudirnos de encima a estas bolas metálicas", digo. "Le diré a Rose que no se esfuerce demasiado y que solo mantenga el hechizo hasta que empiece a sentirse un poco incómoda. Un segundo. La llamo ahora."

          Entonces saco mi transceptor, me aseguro de tener el dial en el número de Rose y lo toco una vez.

          "Oye, Rose, ¿estás despierta?", digo.

          "Sí, estaba cocinando", dice Rose. "¿Pasa algo?"

          "Más o menos", digo. "Nos persiguen unas bolas metálicas y nos vendría bien algo de ayuda."

          "...¿Bolas metálicas?", pregunta Rose, confundida. "¿Qué son las 'bolas metálicas'?"

          "Te lo explico luego", digo. "Por ahora, ¿podrías congelar el tiempo para todos salvo nosotros, como ayer? No hace falta que mantengas el hechizo treinta segundos otra vez, pero incluso veinte podrían marcar una gran diferencia."
      - source: scene_text_2
        paragraph: 34
        text: |-
          No llega respuesta de Rose. ¿Ya estará intentando lanzar el hechizo, o simplemente no me oyó?

          "Umm... Rose, ¿estás intentando congelar el tiempo ahora o--"

          De pronto, las bolas metálicas que hay encima de nosotros se congelan en el aire y todo lo demás deja de moverse salvo nuestro grupo.

          "¡Esto es perfecto!", le digo a Rose. "Sigue así unos segundos más y estaremos--"

          No llego a terminar la frase, porque las bolas metálicas vuelven a moverse apenas unos segundos después de que Rose iniciara el hechizo.

          "¡Lo siento!", dice Rose. "Lo siento... No creo que ahora mismo pueda hacerlo mejor. Me desperté esta mañana con un dolor de cabeza horrible y me está impidiendo concentrarme."

          "No te preocupes por eso", digo. "Fuimos nosotros quienes te despertamos con aquella llamada sobre las hierbas. Debería haberte dicho que volvieras a dormir en vez de mantenerte despierta. Aun así nos has comprado unos segundos, así que intentaremos aprovecharlos al máximo. ¡Hablamos luego!"

          "¡Adiós, y tengan cuidado!", dice Rose.

          "Bueno, las bolas metálicas siguen acercándose, así que supongo que ha llegado la hora del plan B", digo mientras toco el transceptor y vuelvo a guardármelo en el bolsillo mientras corremos.
      - source: scene_3
        paragraph: 17
        text: |-
          "¡Voy!", dice Hadrik. "Ustedes sigan adelante sin mí. Los alcanzo en un segundo."

          Entonces Hadrik se transforma en águila y vuela hacia uno de los drones de ojos rojos del cielo. En cuanto la alcanza, vuelve a convertirse en enano y le da una patada en el ojo, haciéndola estrellarse contra el suelo.

          "Genial...", me dice Kate mientras seguimos avanzando hacia la tienda. "Ahora va a intentar detener él solo a todas esas bolas metálicas. Te das cuenta de que no tiene ninguna posibilidad de derribarlas a todas por su cuenta, ¿verdad?"

          "Sí, pero al menos es lo bastante resistente como para que no tengamos que preocuparnos por que salga herido", digo. "Destruirá tantas como pueda y nosotros ya nos ocuparemos de lo que quede."

          "Algo me dice que lo que quede será la mayoría de las bolas metálicas, pero ya no sirve de nada quejarse", dice Kate. "Intentemos acercarnos todo lo posible a la tienda antes de que nos embosquen."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch06a_hadrik_plan
  - name: b3_ch06a_kate_plan
    routes:
      - condition: combat_technique >= 2
        texts:
          - source: scene_text
            paragraph: 51
            text: |-
              "Creo que puede que ella tenga razón, Hadrik", digo. "Sus ataques son mucho más adecuados para este tipo de enemigos."

              "Vale, bien...", dice Hadrik. "En ese caso, me pondré al frente del grupo e intentaré destruir las bolas metálicas que nos bloqueen el paso."

              "Melindra, vamos", dice Kate mientras conjura una plataforma de hielo bajo sus pies.

              "...Te das cuenta de que sigo sin tener control total de mis poderes, ¿verdad?", dice Melindra. "No puedo garantizar que vaya a ser capaz de mantener la barrera contra todas estas bolas metálicas."

              "Seguro que lo harás bien", dice Kate. "Vamos, sube a la plataforma."

              Melindra se encoge de hombros y luego se acerca a Kate, mientras las dos se elevan más en el aire para luchar contra las bolas metálicas.

              "Sigamos avanzando", nos dice Daren. "Kate y Melindra nos seguirán desde arriba."

              Después de correr unos segundos más, echo un vistazo hacia arriba para ver cómo les va a Kate y a Melindra. Para mi sorpresa, parece que la barrera de Melindra es casi completamente ineficaz contra los ataques elementales de estas bolas metálicas. De hecho, parece que su barrera de viento podría desplomarse en cualquier momento. Quizá dejar que lucharan ellas dos solas contra todas esas bolas metálicas no haya sido una buena idea.
          - source: scene_text_2
            paragraph: 35
            text: |-
              "Daren, sigan adelante sin mí", digo. "Ya los alcanzaré luego, después de ayudar a Kate y a Melindra. No parece que lo estén llevando muy bien ahora mismo."

              "¡Pétalo y yo también vamos!", dice Flower. "¡Con los cinco en el aire, seguro que conseguiremos captar la atención de la mayoría de las bolas metálicas!"

              "¡Asegúrense de no perderlos de vista mientras están ahí arriba!", dice Daren. "Kelrim es el único que conoce el camino a la tienda y va con nosotros."

              "Sí, sí, iremos con cuidado", digo, y luego alzo la voz para llamar a Melindra. "¡Eh, Melindra! ¡Dame las corrientes de aire! ¡Voy para arriba!"

              En vez de responderme, Melindra lanza de inmediato el hechizo y siento sus corrientes girando a mi alrededor, listas para obedecer mis órdenes. Flower y yo alzamos el vuelo y nos unimos rápidamente a Kate, mientras saco la ballesta de la mochila para apuntar a las bolas metálicas voladoras. Empezamos a combatirlas juntos, intentando esquivar sus ataques sin permitir tampoco que nos alejemos demasiado de Daren y Kelrim.
          - source: scene_3
            paragraph: 18
            text: |-
              Mi estadística de técnica de combate me permite predecir lo bastante bien los movimientos de las bolas metálicas voladoras como para no verme superado por sus maniobras. Aunque parece que estamos haciendo un trabajo bastante bueno manteniendo a raya a nuestros enemigos, sigue viniendo hacia nosotros un gran número de bolas metálicas, lo que significa que en realidad no podemos movernos de nuestra posición y, por eso, Daren y los demás se van alejando cada vez más mientras seguimos peleando. Por suerte, veo a Daren saludándome desde la distancia y, en cuanto le devuelvo el gesto, entra en uno de los edificios junto con Kelrim, Leila y Hadrik.

              Perfecto. Ahora que sé cuál es la tienda, podemos seguir luchando contra estas bolas metálicas sin preocuparnos por quedarnos atrás.

              Seguimos disparando contra ellas durante un rato más, hasta que llega un momento en que todas dejan de atacarnos de repente y se retiran al unísono. Optamos por agradecer ese giro de los acontecimientos y, en lugar de perseguirlas, volamos hacia la herboristería para reunirnos con Daren.

              Cuando llegamos, parece que Daren ya ha terminado de comprar, porque ahora sale de la tienda y también lo hace el resto.
        effects:
          - set:
              successful_checks:
                - '[ Comprobación de técnica de combate exitosa - nivel 2 ]'
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch06a_entrance
                condition: is_dead = 0
