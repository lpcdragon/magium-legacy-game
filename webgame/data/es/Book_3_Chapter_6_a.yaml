  - name: b3_ch06a_complaint
    texts:
      - source: scene_text
        paragraph: 43
        text: |-
          "Saludos", oímos la voz del Supervisor saliendo de la bola metálica cuando se acerca lo suficiente a nosotros. "¿Tendrían por casualidad tiempo para responder a una breve encuesta? No llevará más de un minuto."

          "Uhh...", digo. "Vamos un poco con prisa, así que si no te importa--"

          "En ese caso, el protocolo Supervisor formulará las preguntas mientras caminan", dice el Supervisor, mientras su dron de ojos verdes empieza a seguirnos. "Empecemos. En primer lugar, en una escala del uno al cinco, ¿cómo valorarían sus interacciones con el Supervisor hasta ahora?"

          "¿Podemos elegir 'cero' como nota?", dice Hadrik. "Porque desde luego no nos has dado ninguna información útil desde la primera vez que nos vimos."
      - source: scene_text_2
        paragraph: 29
        text: |-
          "Su queja ha sido registrada", dice el Supervisor. "El protocolo Supervisor hará todo lo posible por mejorar la calidad de sus interacciones en el futuro. Aquí va la segunda pregunta. Cuando el protocolo Supervisor les advirtió ayer que ya 'no habría vuelta atrás' una vez decidieran ignorar mis instrucciones, ¿dirían que la intención detrás de esa frase fue lo bastante clara como para que la entendieran?"

          "...Si digo que no, ¿eso hará que dejes de intentar matarnos otra vez?", digo.

          "Negativo", dice el Supervisor. "El protocolo Supervisor seguirá enviando sus bolas metálicas para matarlos una vez que la encuesta se haya completado. Sin embargo, responder a estas preguntas con la mayor precisión posible ayudará al Supervisor a ofrecer un mejor servicio a todos los ciudadanos de Ollendor."
