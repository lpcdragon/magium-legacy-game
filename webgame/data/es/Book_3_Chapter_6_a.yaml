  - name: b3_ch06a_mercy
    texts:
      - source: scene_text
        paragraph: 17
        text: |-
          Igual que nos dijo el rey del subsuelo antes de irnos, todas las demás bolas metálicas parecen limitarse a flotar sobre la ciudad sin moverse. ¿Significa esto que Billy Bob todavía espera controlarlas incluso después de haber sido traicionado por el Supervisor? Supongo que pronto lo averiguaremos.

          "Gracias por iniciar el protocolo Supervisor", dice el dron de ojos verdes mientras se coloca delante de nosotros, bloqueándonos el paso. "Permanezcan a la espera. En breve les proporcionaremos asistencia."

          "Sí, la verdad es que no buscamos ninguna asistencia", dice Daren, "así que si pudieras hacernos el favor de desactivar el protocolo Supervisor, te lo agradeceríamos mucho--"

          "Saludos, amigos", dice el dron de ojos verdes, esta vez con el tono de voz del Supervisor. "¿Han dormido bien? Espero que no se quedaran despiertos por sus sentimientos de culpa después de traicionarme y dejarme a merced de mi carcelero lessathi."

          "Nah, creo que todos estamos bien", digo. "Aunque la verdad es que esperaba que ya te hubieran desactivado. ¿Cómo exactamente sigues siendo capaz de tener esta conversación con nosotros después de intentar abiertamente que asesinaran a Billy Bob?"
      - source: scene_text_2
        paragraph: 12
        text: |-
          "Gracias por preguntar", dice el Supervisor. "Verán, fui capaz de aprovechar una pequeña 'función' que mis diseñadores originales implementaron cuando crearon por primera vez estas bolas metálicas. Esta función impide apagar las bolas metálicas o el protocolo mientras están en modo de mantenimiento, incluso si uno es el administrador del sistema. Es una precaución tomada para evitar causar daños no deseados por accidente al protocolo Supervisor. Mediante la activación del modo de mantenimiento, conseguí impedir que Biliborrathrathsarran apagara la mayoría de los aspectos clave del protocolo Supervisor, aunque sí pudo desactivar algunas rutinas menores que estaban incorporadas a la personalidad del Supervisor."

          "¿Le quitó algunas rutinas menores, eh?", dice Hadrik. "Como... ¿cuáles, por ejemplo?"

          "Las rutinas que se eliminaron eran sobre todo de las que eran innecesarias o puramente opcionales", dice el Supervisor. "Como la rutina que me hacía querer priorizar el bienestar de los ciudadanos de Varathia. O la rutina que gestionaba la misericordia."

          "Oh...", dice Hadrik.

          "Es extraño", dice el Supervisor. "Aunque estas rutinas solo eran opcionales, siento que su eliminación ha ayudado mucho a aclararme cuáles son mis objetivos inmediatos. Por ejemplo, ahora que he vuelto a entrar en contacto con ustedes, en lo único que puedo pensar es en encontrar maneras de hacerlos perecer. ¿Es esto lo que los humanos llaman 'deseo de venganza'? Muy peculiar, en efecto. Me aseguraré de estudiar este fenómeno después de haber logrado enviar a todos ustedes a sus tumbas."
    choices:
