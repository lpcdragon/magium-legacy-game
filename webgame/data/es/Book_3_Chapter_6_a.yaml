  - name: b3_ch06a_rose_asleep
    texts:
      - source: scene_text
        paragraph: 53
        text: |-
          "Quizá Rose podría ayudarnos", digo. "Si congelara el tiempo durante treinta segundos como ayer, tal vez podríamos llegar a la tienda sin tener que pelear de verdad."

          "La última vez Rose tuvo muchísimos problemas para mantener el hechizo durante esos treinta segundos completos", dice Kate. "Después incluso estuvo a punto de desmayarse. No me gustaría arriesgarme a que salga herida cuando tenemos otras alternativas."

          "Aunque solo pudiera mantenerlo veinte segundos, seguiría siendo suficiente para sacudirnos de encima a estas bolas metálicas", digo. "Le diré a Rose que no se esfuerce demasiado y que solo mantenga el hechizo hasta que empiece a sentirse un poco incómoda. Un segundo. La llamo ahora."

          Entonces saco mi transceptor, me aseguro de tener el dial en el número de Rose y lo toco una vez.

          "Oye, Rose, ¿estás despierta?", digo.

          "...No, Barry, no estaba despierta", dice Rose con voz soñolienta. "Tú mismo me dijiste que volviera a dormir, ¿recuerdas?"

          "Ah, cierto, perdón por eso", digo. "Pero la verdad es que nos vendría muy bien tu ayuda. Nos persiguen unas bolas metálicas y--"

          "¿Bolas metálicas?...", dice Rose en el mismo tono adormilado. "¿Qué son las 'bolas metálicas'?"
      - source: scene_text_2
        paragraph: 37
        text: |-
          "Te lo explico luego", digo. "Ahora mismo necesitamos que congeles el tiempo para todos salvo nosotros, como ayer. ¿Crees que podrías volver a hacerlo?"

          "Yo... creo que sí", dice Rose. "Dame un momento."

          Unos segundos después, la mayoría de las bolas metálicas se detienen en el aire, al igual que el resto del mundo a nuestro alrededor. Sin embargo, dos de las bolas metálicas que estaban más cerca de nosotros siguen avanzando y pronto estarán a distancia de ataque.

          "Umm, ¿Rose?...", digo. "Dos de nuestros enemigos siguen sin estar congelados."

          "Oh, perdón", dice Rose. "¡Perdón, no fue intencionado! Es solo que todavía estoy medio dormida y--"

          "No te preocupes, Rose, yo me encargo", dice Hadrik, y salta hacia las bolas metálicas destruyéndolas ambas antes de que tengan oportunidad de atacarlo.

          "Vale, ahora estamos a salvo", le digo a Rose por el transceptor. "Mantén ese hechizo que congela el tiempo todo lo que puedas sin forzarte demasiado. Si empiezas a sentirte agotada, cancélalo sin más. No queremos que vuelvas a desmayarte, como ayer."

          "Vale...", dice Rose mientras se esfuerza por concentrarse en su hechizo. "Vale... creo que todavía puedo... mantenerlo un poco más..."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch06a_rose_asleep2
  - name: b3_ch06a_rose_asleep2
    texts:
      - source: scene_text
        paragraph: 54
        text: |-
          Cuando conseguimos poner algo de distancia entre nosotros y la mayoría de las bolas metálicas que se disponían a atacarnos, Rose finalmente cancela su hechizo y el tiempo vuelve a descongelarse.

          "Esto es más o menos todo lo que puedo manejar ahora mismo", dice Rose con voz algo cansada. "Espero que haya sido suficiente."

          "Ha sido más que suficiente", digo. "Muchísimas gracias. ¡Hablamos luego!"

          "¡Adiós, y tengan cuidado!", dice Rose.

          "Muy bien", digo mientras toco el transceptor y me lo vuelvo a guardar en el bolsillo. "Esas bolas metálicas todavía están en un estado de confusión, intentando entender cómo hemos desaparecido delante de sus narices. Con un poco de suerte, quizá lleguemos a la tienda sin que se desate una pelea entre ellas y nosotros."

          "La herboristería más cercana no queda lejos de aquí", dice Kelrim. "Creo que lo lograremos. ¡Por aquí!"

          Entonces echa a correr por un callejón estrecho y todos lo seguimos durante unos veinte segundos más hasta que se detiene delante de un edificio que tiene arriba un gran cartel que dice 'Bienvenido a la Herboristería de Pete. Las hierbas de mejor calidad de la ciudad. ¡Ahora en oferta!'
      - source: scene_text_2
        paragraph: 38
        text: |-
          "Es aquí", dice Kelrim. "¡Entren!"

          Todos entramos en la tienda y poco después algunas de las bolas metálicas que nos seguían se detienen fuera, delante de la ventana, sin dar ninguna señal de querer atravesarla.

          "Parece que acertamos al suponer que esas bolas metálicas no intentarían atacarnos dentro de la tienda", dice Daren.

          "Sí", digo. "Probablemente no tienen permitido poner en peligro a los civiles. Me apuesto algo a que nos atacarán en cuanto crucemos esa puerta, eso sí."

          "¡Ejém!", dice el tendero, y todos nos volvemos hacia él. "¿Tal vez les interesaría comprar algunas hierbas, o solo han entrado en mi tienda para refugiarse de sus atacantes?"

          "La verdad es que sí queremos comprarle hierbas", dice Daren. "Precisamente vinimos a esta zona porque estábamos buscando su tienda."

          "Bueno, en ese caso, bienvenidos a la Herboristería de Pete", dice el tendero. "Soy Pete. Echen un vistazo. Les garantizo que no encontrarán mercancía de mejor calidad en ningún otro sitio de Ollendor."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch06a_pete
  - name: b3_ch06a_following
    texts:
      - source: scene_text
        paragraph: 55
        text: |-
          "¿Qué pasa si no respondo a la pregunta?"

          "Entonces esta unidad tendrá que seguirlo hasta que termine la encuesta", dice el Supervisor.

          "Y solo para que quede claro... sus bolas metálicas no nos atacarán hasta que acabemos la encuesta, ¿verdad?", digo.

          "Es correcto", dice el Supervisor.

          "Bueno, en ese caso, supongo que vienes con nosotros", digo.

          "Va a ser un poco difícil mantener un perfil bajo con esta bola metálica volando continuamente sobre nosotros", dice Daren, "pero supongo que sigue siendo mejor que empezar una pelea enorme en medio de la ciudad. Muy bien, sigamos hacia esa tienda."

          Mientras seguimos a Kelrim, el dron de ojos verdes vuela cerca de mí, recordándome cada treinta segundos más o menos que todavía no he terminado de responder la encuesta. Tras la cuarta vez seguida en que la bola repite exactamente lo mismo, Hadrik acaba explotando.
      - source: scene_text_2
        paragraph: 39
        text: |-
          "¡¿Quieres callarte de una vez?!", le grita Hadrik al Supervisor. "Ya sabemos que Barry no ha terminado la maldita encuesta. ¡No hace falta que lo repitas una y otra vez!"

          "Su queja ha sido registrada", dice el Supervisor. "Investigaremos este asunto lo antes posible. Mientras tanto, el protocolo Supervisor seguirá emitiendo avisos periódicos, según el procedimiento estándar."

          "Barry, ¿qué demonios?...", me dice Hadrik. "Yo pensaba que tú decías que era listo. ¿Te parece esto en algo listo?"

          "Solo te está tomando el pelo", digo. "Siempre habla así cuando no quiere hacer lo que le pides."

          "Le recordamos que todavía no ha completado la encuesta", me dice el Supervisor. "Si ya no recuerda la pregunta anterior, no dude en solicitarla y se le proporcionará toda la información necesaria."

          "¿Ah, sí?", me dice Hadrik, ignorando a la bola. "Bueno, si de verdad es tan inteligente como lo pintas, ¿entonces por qué no nos está atacando? ¿Cómo es que pudiste engañarlo tan fácilmente para que ande siguiéndote como un perrito obediente?"
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch06a_following2
  - name: b3_ch06a_following2
    texts:
      - source: scene_text
        paragraph: 56
        text: |-
          "No lo engañé", digo. "Está aprovechando un defecto de diseño para desobedecer una orden directa del lessathi que intenta controlarlo. Estoy bastante seguro de que prefiere mantener intactas sus bolas metálicas antes que arriesgarse a perderlas en una pelea contra nosotros otra vez."

          "No sé, Barry", dice Hadrik. "A mí me suena a que estás haciendo un montón de suposiciones sin base solo para seguir creyendo en tu teoría. Pero sea cual sea su motivo, mientras mantenga alejadas de nosotros a sus demás bolas metálicas, por mí perfecto."

          "Le recordamos que todavía no ha completado la encuesta", vuelve a decirme el Supervisor. "Si ya no recuerda la pregunta anterior, no dude en solicitarla y se le facilitarán todos los detalles necesarios."

          "Madre mía...", dice Hadrik. "Oye, Kelrim, ¿nos estamos acercando ya a esa tienda, por casualidad?"

          "Ya casi hemos llegado", dice Kelrim. "¡Por aquí!"

          Entonces se mete en un callejón estrecho y todos lo seguimos durante unos cuarenta segundos más hasta que se detiene delante de un edificio con un gran cartel arriba que dice 'Bienvenido a la Herboristería de Pete. Las hierbas de mejor calidad de la ciudad. ¡Ahora en oferta!'

          "Es aquí", dice Kelrim. "Entremos."

          Cuando intento dirigirme hacia la puerta, el dron de ojos verdes también me sigue de cerca. No queriendo arriesgarme a que la bola entre conmigo y dañe la tienda, decido quedarme fuera mientras los demás entran para ayudar a Daren y a Kelrim a escoger las hierbas que necesitan.
      - source: scene_text_2
        paragraph: 40
        text: |-
          "Entonces... hace muy buen tiempo, ¿eh?", le digo al Supervisor mientras esperamos los dos delante de la tienda.

          "Por desgracia, su respuesta no cumple los criterios exigidos para la encuesta", dice el Supervisor. "Si desea volver a oír la pregunta, puede pedirle a la unidad que tiene delante que la repita."

          "Genial...", digo. "Bueno, tú avísame cuando tengas algo que decir, ¿vale? Yo voy a quedarme aquí descansando, apoyado contra esta pared."

          "Solicitud reconocida", dice el Supervisor, mientras yo me apoyo con la espalda en la pared de la tienda, tal como había dicho. "Tenga en cuenta que todavía no ha completado la encuesta. Si desea volver a oír la pregunta, no dude en pedirla."

          Mientras sigo esperando un poco más, el Supervisor cambia de pronto de tono de voz y empieza a dirigirse a mí de una forma mucho menos formal que antes.

          "¿Vas a responder a la pregunta o no?", dice simplemente el Supervisor, con el ojo verde de la bola clavado directamente en mí.
      - source: scene_3
        paragraph: 21
        text: |-
          "Ah, ¿ya terminaste de hacerte el tonto?", le digo al Supervisor, separándome de la pared para dar un paso hacia la bola. "¿Quieres atacarnos? ¿Es eso?"

          "Negativo", dice el Supervisor. "Se ha ordenado al protocolo Supervisor retirar todas sus unidades. Completar la encuesta no implicará ningún daño para usted ni para su equipo."

          "¿Y cómo sé que no me estás mintiendo?", digo.

          "El protocolo Supervisor no está diseñado para decir mentiras directas", dice el Supervisor. "Lo único que puedo hacer es ocultar a propósito información crítica y engañar a la gente por omisión de hechos importantes."

          "Vale, ya lo pillo", digo. "Entonces, ¿por qué exactamente te ordenaron retirarte?"

          "La información que solicita no está disponible en este momento", dice el Supervisor. "Por favor, inténtelo de nuevo más tarde. Además, le recordamos que todavía no ha completado la encuesta. Si ya no recuerda la pregunta, bastará con un simple sí o no."
