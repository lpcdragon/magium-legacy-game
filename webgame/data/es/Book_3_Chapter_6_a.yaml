            paragraph: 69
            text: |-
              "¿Cómo fue con el tendero?", le pregunto a Daren, mientras aterrizamos todos a su lado, delante de la entrada de la tienda. "¿Conseguiste todo lo que necesitabas?"

              "Sí", dice Daren. "No tenían exactamente las hierbas que necesitábamos, pero conseguimos encontrar sustitutos adecuados gracias a la información que nos dio Rose. Entonces, ¿dónde están todas las bolas metálicas? ¿Conseguisteis destruirlas a todas?"

