            text: |-
              "Está claro que esto no funciona. ¿No podemos centrarnos en preparar la pelea?"

              "Quiero decir, podríamos, pero ¿de verdad hay algo de lo que hablar que no cubriéramos ya en nuestra última reunión estratégica?", dice Daren. "Hadrik se encargará de Gontrok, yo intentaré ocuparme del capitán, y el resto de ustedes deberían centrarse en acabar con los demás lo más rápido posible. Melindra, ¿cuántos enemigos vienen hacia aquí?"

              "Estoy contando unas siete personas que se han dirigido constantemente en nuestra dirección desde que salimos de la tienda", dice Melindra. "A los que reconozco son Gontrok, el capitán y 'Loyrang', o como se llamara. Tres de los otros son magos, y uno parece ser un humano corriente, aunque quizá esté usando dispositivos lessathi como armas."
          - source: scene_text_2
            paragraph: 53
            text: |-
              "¿Y qué pasa con el tipo de las túnicas negras que los atacó la última vez que subieron a la superficie?", dice Daren. "¿Sabes dónde está?"

              "No, no lo sé", dice Melindra. "Sin embargo, usaba muchísimos artefactos lessathi, así que no me extrañaría nada que llevara un anillo capaz de volverlo indetectable incluso para alguien como yo."

              "¿Y tú, Arraka?", dice Daren. "¿Por casualidad sientes a alguien con un aura casi indetectable dirigiéndose hacia nosotros ahora mismo?"

              "Sí, obviamente", dice Arraka.

              "¿Y sería posible que nos avisaras cuando esté lo bastante cerca como para atacarnos?...", dice Daren.

              "Sí, claro, lo que tú digas", dice Arraka.

              "Bien", dice Daren. "Al menos ahora tendremos una cosa menos de la que preocuparnos."
