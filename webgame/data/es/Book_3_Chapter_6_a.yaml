        effects:
          - set:
              current_scene: b3_ch06a_further2
  - name: b3_ch06a_further2
    routes:
      - condition: b3_ch5_fight < 4
        texts:
          - source: scene_text
            paragraph: 73
            text: |-
              "¿Pueden oírme?", dice el del teletransportador. "¡Gracias a los dioses! Muy bien, ¡voy a intentar transportarlos aquí de inmediato!"

              Entonces oímos al del teletransportador pulsar botones durante unos diez segundos, pero no parece ocurrir nada.

              "No... no funciona...", dice el del teletransportador. "¡No sé qué está pasando! Es como si el dispositivo ni siquiera reconociera sus auras. ¿Podrían intentar calmarse un poco? Quizá si sus auras fluctúan menos, el teletransportador pueda fijarlas mejor."

              "Es un poco difícil estar más tranquilos de lo que ya estamos cuando todos los guardias reales nos pisan los talones, Nubarrón", dice Hadrik.
          - source: scene_text_2
            paragraph: 51
            text: |-
              "Bueno, ustedes sí que dijeron que podían derrotar por sí solos a los guardias reales la próxima vez que se encontraran con ellos", dice Albert. "A mí me parece que esta sería la oportunidad perfecta para estar a la altura de sus propias palabras."

              "Oye, luego no vengas a llorarnos cuando acabemos derribando este régimen nosotros solos y dejándolos sin negocio a ustedes los rebeldes", dice Hadrik.

              "No te preocupes", dice Albert. "No lo haré."
          - source: scene_3
            paragraph: 31
            text: |-
              "Melindra, ¿cuánto les queda a los guardias para llegar?", dice Daren, cerrando el transceptor.

              "Tardarán como mínimo unos minutos más si siguen moviéndose a su velocidad actual", dice Melindra. "Estaban bastante lejos de nosotros cuando los detecté por primera vez."

              "Sí que se lo están tomando con calma, ¿verdad?", dice Hadrik.

              "Probablemente saben que ahora mismo no podemos teletransportarnos fuera de aquí", dice Melindra. "Ni siquiera se han molestado en enviar a sus novatos para mantenernos ocupados esta vez. Está bastante claro que son ellos quienes están detrás de la interferencia de la señal."

              "Bueno, al menos eso nos da la ventaja de tener tiempo de sobra para colocarnos bien en el campo de batalla", dice Hadrik. "¡Esta calle es larguísima y ancha, así que es prácticamente perfecta para una batalla campal!"
