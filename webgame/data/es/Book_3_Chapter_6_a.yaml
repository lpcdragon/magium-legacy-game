              "¡Oye, esto está bastante bien!", dice Daren. "Pero tengo una pregunta... ¿Cómo despego la espada de mi mano?"

              "Eso te lo dejo para que lo averigües tú solo", dice Arraka.

              "¿Es porque aprender a hacerlo por mí mismo me ayudará con mi entrenamiento de aura?", dice Daren.

              "No", dice Arraka. "Es que así resulta más gracioso."

              "Maldita sea...", dice Daren. "Debí suponerlo."

              Mientras Daren sacude el brazo arriba y abajo, intentando que la espada se desprenda de la mano, Kate acaba dándole un consejo.

              "Tienes que imaginar poco a poco el pegamento seco volviéndose líquido otra vez hasta que la espada deje de pegarse a tu mano", dice Kate. "Así."
          - source: scene_3
            paragraph: 3
            text: |-
              Entonces nos muestra la palma derecha, orientada hacia abajo, con una daga de hielo pegada a ella. La daga empieza a caer lentamente de su mano, como si siguiera sostenida por un fluido invisible y pegajoso, hasta que por fin se desprende por completo y cae al suelo.

              "Oye, eso no está nada mal para una elementalista", dice Arraka. "Pero ¿qué te hizo querer probar la misma técnica que Daren?"

              "Fuiste tú quien nos dijo que debíamos probar si podíamos usar manipulación de aura o no", dice Kate. "Yo simplemente decidí intentar esta técnica en vez de la de invocación de armas porque parecía un poco más sencilla."

              "¡Oh, ahora lo entiendo!", dice Daren, mientras su espada también se va desprendiendo lentamente de la mano. "El aura no puede volver directamente a su forma original. Tienes que deshacer el proceso siguiendo los mismos pasos a la inversa. ¡Por eso no podía limitarme a imaginar el pegamento desapareciendo y tenía que convertirlo otra vez en líquido primero!"

              "Sí, acabas de descubrir un principio básico sobre las auras", dice Arraka, mientras Daren recoge ya la espada del suelo. "Toma una galleta."

              "Lo haría, pero últimamente Barry está un poco tacaño con sus galletas", dice Daren.

              "¡Ya te dije que no me quedan muchas!", digo. "¡Las estoy guardando para ocasiones especiales!"

              "Umm... ¿no creen que deberíamos ponernos en marcha?", dice Flower. "No estamos tan lejos del teletransportador, y llevamos parados todo este tiempo desde que Daren empezó a probar sus técnicas nuevas..."
