          - source: scene_3
            paragraph: 19
            text: |-
              Por suerte para mí, cuando la bola metálica me dispara un rayo de hielo, mi estadística de Endurecimiento de aura me protege de congelarme hasta morir, aunque sigo sintiéndome casi tan helado como si me hubiera bañado en un río. Me giro rápidamente y le disparo en el ojo, matándola en el acto.

              "Barry, ¿estás bien?", dice Flower. "¡Toma, voy a calentarte!"

              Entonces hace girar varias pequeñas bolas de fuego a mi alrededor hasta que vuelvo a sentir la temperatura de mi cuerpo normal. Después de eso consigo evitar que vuelvan a emboscarnos, pero Daren y los demás se van alejando cada vez más mientras seguimos peleando. Por suerte, veo a Daren saludándome desde la distancia y, en cuanto le devuelvo el gesto, entra en uno de los edificios junto con Kelrim, Leila y Hadrik.

