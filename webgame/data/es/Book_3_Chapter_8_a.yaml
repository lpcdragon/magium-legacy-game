            paragraph: 22
            text: |-
              "Hemos estado trabajando con los rebeldes desde el principio, así que permaneceremos de su lado".

              "Para ser completamente honesto", dice Daren, "hemos recibido ayuda tanto del Supervisor como del rey del subsuelo desde que llegamos aquí, así que no puedo decir que considero a ninguno de ellos como nuestros enemigos. Si me preguntas, realmente no veo una razón por la que debamos unirnos a ninguno de los lados del conflicto. Tal vez sería mejor para nosotros no involucrarnos esta vez".

              "Me temo que esto no es una opción", dice el Supervisor.

              "¿Disculpe?..." pregunta Daren, confundido.

              "El protocolo Supervisor ha llegado a la conclusión de que el rey del subsuelo es actualmente el mayor obstáculo en el camino de Ollendor hacia la prosperidad", dice el Supervisor. "Como tal, he decidido mantener el bloqueo de esta ciudad hasta que se ocupe de él. Si intentas salir de esta ciudad mientras el bloqueo aún está vigente, todos mis drones te atacarán en cuanto te vean, y si de alguna manera logras llegar a las murallas de la ciudad de una pieza, los gigantes Gólems de metal en las puertas también te atacarán. La única forma de salir de Ollendor sin ser atacado por mis drones es unirte a mi lado y ayudarme a capturar al rey del subsuelo".
          - source: scene_text_2
            paragraph: 13
            text: |-
              "¿Captura?" pregunta Hadrik. "¿No te refieres a ejecutar? No estás planeando seriamente mantenerlo con vida, ¿verdad? ¡No hay manera de que ese tipo pueda ser retenido en una celda con el tipo de poder que tiene!"

              "Eso no será un problema", dice el Supervisor. "La prisión de Ollendor está equipada con celdas de parálisis, que deberían ser más que suficientes para protegerlo por ahora. Mientras sus movimientos sean limitados, no debería poder realizar técnicas de manipulación del aura lo suficientemente poderosas como para ayudarlo a escapar".

              "Incluso si no estás planeando matarlo, todavía nos estás pidiendo que traicionemos a una persona que técnicamente ha estado de nuestro lado desde el principio", dice Daren. "Quiero decir, claro, puede que sea un poco turbio, pero hasta ahora no nos ha dado ninguna razón legítima para sospechar que quiere traicionarnos. No podemos simplemente ser los primeros en arruinarlo después de todo lo que hemos pasado juntos desde que llegamos a esta ciudad".

              "Si ayuda en su proceso de toma de decisiones", dice el Supervisor, "resulta que tengo una grabación del rey del subsuelo insinuando fuertemente a uno de sus subordinados que su grupo debería ser asesinado si intenta oponerse a su coronación como el nuevo rey de Ollendor. Grabé su conversación mientras los escuchaba a través de uno de los cristales hace aproximadamente una hora. Esto es lo que dijeron los dos".
