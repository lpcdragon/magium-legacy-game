  - name: b3_ch08a_logical
    routes:
      - condition: bluff = 0
        texts:
          - source: scene_text
            paragraph: 11
            text: |-
              "Obviamente, esta sería la única opción lógica. Esperaba que dijeras eso".

              "Puedo darme cuenta cuando estás mintiendo, idiota", dice Arraka. "No esperabas nada y lo sabes."

              "No lo entiendo", dice Hadrik. "¿Por qué elegirías a Barry? ¿No necesitas ser un mago para lanzar magia primordial?"

              "Obviamente sí, pero para eso están sus estadísticas mágicas, ¿no?" dice Arraka. "¿Ya olvidaste que dije que desbloquear sus estadísticas mágicas debería ser nuestra máxima prioridad?"

              "Sí, está bien, pero no tenemos forma de saber cuánto tiempo llevará", dice Hadrik. "¿No sería más rápido enseñar la magia primordial a alguien que ya es mago?"

              "No, no es así como funciona", dice Arraka. "Un prerrequisito para aprender magia primordial es tener una comprensión firme de las nociones teóricas relativas a todos los tipos de magia regular, y este tipo de conocimiento es algo que a la mayoría de ustedes les falta. Barry es lo más parecido que tenemos a un generalista en este grupo, por lo que incluso con su enorme desventaja de no poder lanzar magia, seguiría siendo el mejor candidato por un amplio margen. Como beneficio adicional, también es medio Lessathi, por lo que probablemente le resulte más fácil que el resto de ustedes vincularse. a un fragmento de Magium y lanzarle el hechizo primordial una vez que finalmente obtenga sus poderes mágicos".
          - source: scene_text_2
            paragraph: 8
            text: |-
              "Una vez que obtenga sus poderes mágicos, ¿eh?...", dice Daren. "¿Cuándo sucederá eso, me pregunto? Si ni siquiera el padre de Leila pudo desbloquear estas estadísticas por la fuerza y ​​el código para desbloquearlas no se encuentra por ningún lado, ¿qué posibilidades tenemos de manera realista de lograr este objetivo antes del final del torneo?"

              "Si no puedes desbloquear las estadísticas por la fuerza", dice Arraka, "entonces claramente tu próximo curso de acción debería ser encontrar a uno de los Lessathi de alto rango que conozca el código y sacarles la información usando cualquier medio necesario. ¿Realmente tengo que contarte todo?"

              "Es más fácil decirlo que hacerlo", dice Daren. "No es que nadie de nuestro grupo que alguna vez haya estado en contacto con un Lessathi de alto rango haya mantenido contacto con ellos ni nada por el estilo. Kate, Leila y el doctor Reidzek probablemente sean considerados enemigos por el actual liderazgo Lessathi, y dudo que haya alguna otra persona en esta sala que pueda saber el paradero de... oye, Melindra, te ves bastante tensa. ¿Pasa algo?"

              "¿Qué quieres decir?" Dice Melindra, en un tono ligeramente nervioso. "No pasa nada. ¡Todo está bien!"

              "Hmm..." dice Daren, mientras la estudia durante unos segundos.

              "Si ella no quiere hablar de eso, probablemente deberíamos dejarla en paz", le digo a Daren. "Por lo que sabemos, su hermano podría estar como rehén de algún Lessathi de alto rango y ella podría correr el riesgo de ponerlo en peligro si nos da demasiados detalles".
          - source: scene_3
            paragraph: 8
            text: |-
              "Tienes razón", dice Daren. "No he pensado en eso. Melindra, no sé cuál es la situación con tu hermano, pero si hay algo que podamos hacer para ayudar, háznoslo saber".

              "Por supuesto..." dice Melindra, algo vacilante. "Si se me ocurre algo, te lo diré..."

              "Entonces, umm... ¿alguien más tiene la sensación de que nos están observando?" Flower dice, de repente, mientras mira un poco ansiosamente los cristales que ahora están brillando intensamente nuevamente.

              "¿Quieres decir que te observan a través de los cristales?" dice Daren. "Supongo que realmente no podemos ignorar la posibilidad, pero no veo ninguna razón por la que alguien o algo tan poderoso como el Magium no se nos revele directamente en lugar de esconderse".
