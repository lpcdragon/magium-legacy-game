        texts:
          - source: scene_text
            paragraph: 8
            text: |-
              "Quizás el Magium sea la razón por la que los planos se separaron en primer lugar".

              "¿Por qué dices eso?" Me pregunta Daren.

              "Bueno, el Magium parece estar bastante entrelazado con los tres planos de existencia, en su forma actual", digo. "Arraka nos dijo que el Magium es responsable de crear nuevos espíritus en el plano mágico, y por lo que tengo entendido, el Magium también es el que envía tejedoras del tiempo en el plano terrestre para dar profecías cada vez que se acerca algún tipo de calamidad. Considerando el grado de participación que el Magium parece tener en hacer que estos planos funcionen correctamente, estaba empezando a pensar que tal vez era el propio Magium el que quería que el plano primordial se dividiera en tres, por alguna razón".

              "No lo sé, Barry..." dice Daren. "Esto me parece un poco exagerado. Usando la misma lógica, se podría asumir que la división fue un accidente, y que Magium simplemente está haciendo todo lo posible para evitar que los restos del plano primordial se desmoronen. Dado que sabemos tan poco sobre la historia de este mundo, no creo que sea de mucha utilidad tratar de reconstruir lo que sucedió hace decenas de miles de años basándose solo en unas pocas palabras que escuchamos de Arraka".

              "Es justo", digo. "Después de todo, solo estaba haciendo una sugerencia. Tal vez alguien más que yo pueda dar algunas explicaciones mejores. ¿Alguien más tiene alguna idea?"
          - source: scene_text_2
            paragraph: 5
            text: |-
              "¡Está bien, escúchenme, muchachos!" Dice Hadrik, mientras levanta ambas manos en el aire brevemente para llamar nuestra atención. "¿Qué pasaría si cuando ocurriera la división, la mayoría de los seres de este plano 'primordial' o como se llame murieran, todos excepto uno que era demasiado poderoso para ser asesinado, y este ser eventualmente se convirtiera en Magium?"

              "¿Entonces el Magium sería algo así como su equivalente a Arraka?" dice Daren. "¿Alguna entidad que siguió absorbiendo a otros habitantes del plano primordial hasta que se volvió casi imposible de matar?"

              "¡Sí, sí!" dice Hadrik. "¡Eso es en lo que estaba pensando!"

              "Bueno, si no es por otra cosa, supongo que esto al menos explicaría por qué el Magium parece odiar tanto a Arraka", dice Daren. "Tal vez le recuerde a su antiguo yo."
          - source: scene_3
            paragraph: 5
            text: '"Creo que todos están olvidando un detalle importante", dice Kate, mientras el resto de nosotros nos volvemos a mirarla. "Ya sabemos que hay múltiples versiones de Arraka que existen simultáneamente en varios universos, pero por lo que pude ver, parece haber solo un Magium. Arraka nos dijo que tenía que ingresar al reino del Magium para poder viajar a otros mundos diferentes durante el ritual del Dios del Tiempo, lo que significa que el Magium debe actuar como una especie de puente que conecta todos los universos. También sabemos que el Magium vino aquí por error, buscando un Arraka diferente al de nuestro universo, lo que sugiere fuertemente que hay una sola entidad supervisando todos los mundos paralelos, en lugar de haber un Magium diferente asignado para cada universo. Si un ser poderoso de uno de los muchos planos primordiales a lo largo de los diversos universos hubiera sobrevivido a la división, como tú dices, entonces también habría necesitado ascender más allá de los conceptos de tiempo y espacio, creando su propio mundo entre mundos, lleno de las contradicciones e imposibilidades de las que Barry y Leila nos hablaron cuando describieron--"'
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch08a_boundaries
  - name: b3_ch08a_boundaries
    texts:
      - source: scene_text
        paragraph: 9
        text: |-
          "¡Argh!" dice Hadrik de repente, mientras comienza a despeinarse con ambas manos. "¡Esto está empezando a hacer que me duela la cabeza! ¿Cómo pueden seguir con esta conversación? ¿Podemos cambiar el tema a algo un poco más fácil de entender? Quiero decir, no es que NECESITEMOS saber exactamente qué es el Magium. En este punto, estaría feliz de saber cómo evitarlo y cómo defenderme de él si alguna vez intenta matarnos de nuevo. ¿Cómo logró el otro Arraka esconderse de él todo este tiempo, de todos modos? ¿Por qué un ser tan poderoso y con tantos conocimientos como el Magium siquiera necesita nuestra ayuda para encontrarla en primer lugar?"

          "Probablemente ocultó las verdaderas coordenadas de su universo para que Magium no pudiera encontrar su mundo por mucho que lo intentara", dice Arraka. "Sé que eso es lo que habría hecho si estuviera en su lugar".

          "Pero le diste al Magium las coordenadas reales de su mundo, ¿verdad?" dice Daren. "¿Significa esto que ya no deberíamos tener que preocuparnos más por ella durante el próximo ritual del Dios del Tiempo?"
      - source: scene_text_2
        paragraph: 6
        text: |-
          "Eh..." dice Arraka. "Por mucho que me encantaría pensar que eso fuera cierto, realmente no veo cómo es posible matar a un Arraka tan fácilmente, incluso si es solo una copia. Hay muchas otras maneras de ocultarte del Magium además de simplemente ocultar las coordenadas de tu universo, y estoy seguro de que el otro Arraka no dudaría en usar todos los ases bajo la manga si sintiera que la están acorralando. Si tuviera que hacer una apuesta, diría que lo más probable es que la encontremos de nuevo en el próximo ritual y que esté más enojada que nunca. Así que ya sabes... ¡Buena suerte!"

          "Fantástico..." dice Daren. "¿Deberíamos esperar también que Magium regrese aquí con venganza cuando se dé cuenta de que las coordenadas que le diste son inútiles?"

          "No", dice Arraka. "Lo que el Magium vio fueron mis recuerdos, así que sabe que no estaba mintiendo ni ocultando ninguna información. Como no tiene nada más que ganar con nosotros, probablemente tendrá que continuar persiguiendo a los otros Arraka por su cuenta de ahora en adelante, tal como lo hacía antes de encontrarnos".
      - source: scene_3
        paragraph: 6
        text: |-
          "¿Y si decide regresar por cualquier motivo?" dice Daren. "¿Entonces qué? ¿Nos quedamos ahí impotentes otra vez y rezamos a todos los dioses que estamos tratando de matar para que Arraka salga adelante y salve nuestros lamentables traseros una vez más?"

          "Daren tiene un buen punto", dice Kate. "Por el momento, nuestra única estrategia en este tipo de escenarios es confiar demasiado en Arraka y esperar que todo salga bien al final. Tiene que haber algo más que podamos hacer. Creo que un buen punto de partida sería comprender mejor cómo se supone que funcionan exactamente estos 'hechizos' primordiales, porque simplemente no puedo entender cómo un ser que existe más allá del tiempo y el espacio puede ser influenciado por cualquier tipo de técnica, independientemente de su complejidad".

          "El Magium en sí puede existir fuera de los límites del tiempo, pero esa no es la forma en que interactúa con la gente", dice Arraka. "En las raras ocasiones en que el Magium entra en contacto con alguien, generalmente lo hace a través de 'manifestaciones de su voluntad', por así decirlo. Prefiero llamarlos fragmentos. Estos fragmentos a menudo operan independientemente unos de otros y generalmente tienen un propósito singular en mente, por lo que, a pesar de su poder abrumador, tienen sus limitaciones, que pueden ser explotadas. Entre sus muchas limitaciones, la más importante es que están atados por las restricciones del tiempo, como el resto de nosotros, lo que nos permite 'influir' en ellos. Ah, y para que quede claro, las entidades que han tratado de borrarnos de la existencia hasta ahora eran fragmentos del Magium, incluso si en el pasado los he llamado simplemente 'Magium', en aras de la simplicidad."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch08a_potential
  - name: b3_ch08a_potential
    texts:
      - source: scene_text
        paragraph: 10
        text: |-
          "...Para alguien que antes dijo que no quería correr el riesgo de ser borrado de la existencia, de repente nos estás dando mucha información sobre el Magium", dice Hadrik. "¿Hay alguna razón particular para este inesperado cambio de opinión?"

          "Mi teoría es que al Magium sólo le importa si revelas su verdadera naturaleza a personas que aún no la conocen, y cualquier información distinta a esa se puede dar libremente, sin consecuencias", dice Arraka. "Hay tres palabras, en particular, que estoy tratando de evitar, porque estas son las palabras que llevaron a la incapacidad de Illuna y Flower para hablar sobre el Magium y también son las mismas tres palabras que estaba a punto de decir justo antes de que casi fuéramos borrados de la existencia durante el ritual de Selkram. Mientras no diga estas palabras que creo que mejor resumen qué es exactamente el Magium, creo que puedo permitirme el pequeño riesgo de hablar sobre los fragmentos del Magium y sus debilidades mientras estamos situados fuera de su ámbito."

          "Interesante", dice Daren. "Entonces debería estar bien preguntarte más detalles sobre la magia primordial, ¿verdad? Porque me preguntaba, por ejemplo, si sabías cuántas otras personas actualmente son capaces de lanzar este tipo de 'hechizos' además de ti y el Dios del Destino".
      - source: scene_text_2
        paragraph: 7
        text: |-
          "Hmm, esa es una pregunta difícil..." dice Arraka. "Técnicamente, la mayoría de los dioses y también algunos de los otros espíritus poderosos del plano mágico deberían tener el potencial de lanzar magia primordial, pero no puedo decir con certeza cuáles realmente conocen estas técnicas aparte de Memphir, porque realmente no he hablado mucho con ellos en los últimos cinco mil años, así que no tengo idea de lo que han estado haciendo últimamente. Sin embargo, si estamos hablando de personas en el plano terrestre que tal vez ya sepan cómo usar tales técnicas, realmente no puedo pensar en otros ejemplos aparte de Eiden... y tal vez en ese viejo sabio, Azarius. Ambos me parecen del tipo que tendría el conocimiento, el poder y el ingenio para haber investigado tales técnicas a estas alturas, a pesar de su edad relativamente joven en comparación con la mayoría de los espíritus en el plano mágico."

          "¿Y qué pasa con nuestro grupo?" pregunta Kate. "De todas las personas en esta sala, ¿quién crees que tendría el mayor potencial para aprender magia primordial?"

          "¡¿La gente en esta sala?!" dice Arraka, aparentemente en un estado de shock total de que Kate pudiera siquiera haber pensado en hacer esa pregunta. "¿Estás hablando en serio ahora mismo?"
      - source: scene_3
        paragraph: 7
        text: |-
          "Sí", dice Kate. "No te estoy preguntando si alguno de nosotros sería apto para aprender este tipo de magia o no. Sólo te estoy preguntando estrictamente en términos de potencial, si tuvieras que elegir solo un miembro de nuestro grupo para enseñarle magia primordial, ¿a quién elegirías?"

          "Si hablamos estrictamente en términos de potencial...", dice Arraka, mientras parece estar devanándose los sesos en un intento de encontrar una respuesta legítima a la pregunta de Kate. "Y si ABSOLUTAMENTE no tuviera otra opción que elegir a alguien de su grupo... entonces probablemente diría eso..."

          Hace una breve pausa, como si las palabras que estaba a punto de decir simplemente se negaran a salir.

          "Barry... sería mi elección más probable", dice finalmente Arraka, en un tono que sugiere lo completamente disgustada que está consigo misma por haberse permitido siquiera considerar esa opción.
