            text: '"Es porque tengo una grabación del rey del subsuelo insinuando fuertemente a uno de sus subordinados que su grupo debería ser asesinado si intenta oponerse a su coronación como el nuevo rey de Ollendor. Grabé su conversación mientras los escuchaba a través de uno de los cristales hace aproximadamente una hora. Esto es lo que dijeron los dos".'
