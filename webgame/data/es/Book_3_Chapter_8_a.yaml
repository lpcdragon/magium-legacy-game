scenes:
  - name: b3_ch08a_intro
    texts:
      - source: scene_text
        paragraph: 2
        text: |-
          "Está bien, déjame ver si entendí bien esto..." dice Daren, mientras nuestro grupo está parado en medio de la habitación de la base rebelde donde dormimos anoche. "Estos cristales azules que siguen brillando y vibrando de vez en cuando están hechos de esencia del Magium cristalizada, ¿correcto?"

          "Sí, eso es lo que acabo de decir", responde Arraka.

          "¿Y al canalizar el poder del Magium, estos cristales de algún modo hicieron que todos olvidáramos que Gontrok solía tener cinco dedos en la mano izquierda?" pregunta Daren, girándose ahora hacia mí. "¿Eso es lo que estás diciendo, Barry?"

          "Es, eh... es un poco más complicado que eso. Déjame darte un poco más de contexto para que puedas entender mejor de dónde vengo", digo, mientras empiezo a darle a Daren y a todos los demás más detalles sobre cómo se sintió estar a punto de ser borrado de la existencia en las dos ocasiones separadas en las que me vi obligado a enfrentarme al Magium directamente.

          Han pasado ya casi dos horas desde que Albert nos teletransportó de vuelta a la base rebelde. Para nuestra sorpresa, los rebeldes y los hombres del rey del subsuelo ya habían despejado la mayor parte de los escombros cuando regresamos de la torre de seredium, y sus elementalistas de tierra incluso lograron reparar muchos de los techos que fueron destruidos durante los ataques de los guardias reales, por lo que no nos quedó mucho trabajo por hacer cuando llegamos aquí.
      - source: scene_text_2
        paragraph: 2
        text: |-
          Después de informarles a todos de la muerte del rey de Ollendor, intentamos ayudar lo mejor que pudimos a los civiles que resultaron heridos durante la batalla, y luego volvimos a nuestra habitación para poder hablar de todo lo que ha sucedido recientemente y de cuáles son nuestros planes para el futuro inmediato.

          Durante todo este tiempo, Melindra ha estado extremadamente inquieta, debido a que, según el Juramento de Encantador que hizo cuando la conocimos por primera vez, se suponía que debía empezar a guiarnos hacia el detector de piñas en cuanto matáramos al rey de Ollendor, a menos que le pidiéramos específicamente que se tomara un descanso de nuestro viaje. Teniendo en cuenta que podría morir fácilmente incluso si rompe su voto por error, no puedo decir que la culpe, pero aun así, aparte de repetirle una y otra vez que no queremos que nos saque de Ollendor en este momento, no hay mucho más que Daren o cualquiera de nosotros pueda hacer para arreglar su situación actual.

          "Está bien..." dice Daren, una vez que termino de darle una explicación detallada de mis encuentros anteriores con el Magium.

          "Está bien..." repite Daren, esforzándose por mantener la compostura mientras intenta dar sentido a la información aparentemente imposible y contradictoria que acabo de darle. "Entonces... lo que dices es que no son solo nuestros recuerdos... sino la propia noción de esos dos dedos la que fue completamente borrada de nuestro universo. Y la única forma de conservar tus recuerdos de cosas así es tener sangre Lessathi corriendo por tus venas, debido a tu afinidad natural con el Magium. Para dejarlo claro, de la gente que está en esta habitación, esta descripción se aplica a Barry, Leila, el doctor Reidzek y Melindra, ¿verdad?"
      - source: scene_3
        paragraph: 2
        text: |-
          "Sí, sí, eso ya lo hemos repasado antes", dice Melindra. "Los cuatro recordamos que Gontrok tenía cinco dedos en la mano izquierda mientras que el resto de ustedes no. ¿Podemos irnos ya de la ciudad? Siento que el juramento me está dificultando más la respiración con cada minuto extra que pasamos aquí."

          "Uf..." dice Daren. "Melindra, por última vez, no es posible que el juramento intente matarte sin darnos antes una advertencia a ambos. No es el Juramento de Encantador lo que te está causando problemas respiratorios; es el hecho de que estás entrando demasiado en pánico. Intenta respirar hondo y relajarte un poco. Nos dijiste que tardaremos varios días en llegar hasta tu 'amigo' con el detector de piñas, así que no es como si pudiéramos simplemente echar a correr sin parar hasta llegar allí. De todos modos vamos a tener que tomar descansos por el camino. ¿Piensas tener ataques de pánico como este cada vez que necesitemos sacar agua de un río o irnos a dormir?"

          "¡Yo no dije eso!" dice Melindra. "Solo digo que no deberíamos pasar en esta ciudad maldita más tiempo del absolutamente necesario. El rey ya está muerto, así que, ¿qué otros asuntos tenemos aquí?"

          "No abandonaré esta sala hasta que comprenda decentemente por qué estos cristales comenzaron a comportarse así de repente y cómo nos va a afectar esto de ahora en adelante", dice Daren. "Barry y Leila nos contaron cómo Eiden estaba advirtiendo al rey de consecuencias nefastas o algo así por perturbar los cristales con sus explosiones. Arraka, ¿tienes alguna idea de lo que podría haber querido decir?"
