            paragraph: 16
            text: |-
              Mientras Daren termina su frase, tengo una premonición muy breve en la que veo uno de los cristales azules que nos rodean iluminarse y luego escucho la voz metálica del Supervisor salir de él.

              ¿Significa esto que el Supervisor se esconde dentro de uno de esos cristales en este mismo momento? ¿Nos ha estado escuchando todo este tiempo?

              "Bueno, puede que el Magium no se esté escondiendo de nosotros en este momento, pero creo que conozco a alguien más que sí lo está", digo. "Oye, Supervisor, sé que nos estás mirando. ¿Por qué no te muestras?"

              "¿De qué estás hablando, bufón?" dice Arraka. "Si alguien nos estuviera espiando de forma invisible, ya lo habría detectado."

              "¿El Supervisor está aquí?" Dice Daren, mientras ahora mira a su alrededor para ver si puede detectar algo. "¿Dónde se esconde?"

              "¡Justo ahí!" Digo, mientras apunto directamente al cristal sobre el que vi hablar al Supervisor en mi premonición. "Él nos está mirando a través de ese cristal. Oye, Supervisor, ¿vas a mostrarte o no? Es un poco grosero dejarme hablar así solo, ¿sabes?".
          - source: scene_text_2
            paragraph: 10
            text: |-
              "... Fascinante", finalmente escuchamos la voz del Supervisor proveniente del cristal que estaba apuntando. "No sabía que era posible detectarlo a través de estos cristales. El protocolo Supervisor le agradece por ayudar a ampliar su conocimiento con esta nueva información".

              "¡¿Qué?!" —grita Arraka. "¿Cómo es esto posible? ¿Cómo logró este payaso detectar al Supervisor a través del cristal cuando ni siquiera puedo sentir su presencia ahora cuando nos habla? ¿Y cómo es que una máquina simple es capaz de manipular la esencia de Magium hasta tal punto? ¡¿Qué está pasando aquí?!"

              "Parece que estás perdiendo tu toque, Arraka", dice Hadrik, con una amplia sonrisa. "Debe ser por la vejez. Tal vez finalmente sea hora de encontrarte un buen asilo de ancianos, ¿no? ¡JAJAJAJA!"

              "¡Cállate, enano barbudo!" —grita Arraka. "¡No estoy de humor para tus bromas primitivas! ¡¿No ves que nada de esto tiene sentido?!"
