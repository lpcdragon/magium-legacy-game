  - name: b3_ch08a_manufactured
    texts:
      - source: scene_text
        paragraph: 17
        text: |-
          "Me temo que su información es ligeramente inexacta", dice el Supervisor. "Si bien gran parte de mi personalidad y mis decisiones están impulsadas por las 'instrucciones oscuras y demasiado complejas' que me han dado mis diseñadores, de hecho tengo un alma en el Plano Etéreo que fue fabricada por el Lessathi que me creó, para darme más independencia".

          "¿Un alma fabricada?...", dice Arraka.

          "Afirmativo", dice el Supervisor. "El proceso que usaron para fabricar el alma era similar al que se usa en nigromancia, excepto por el hecho de que usaron dispositivos y manipulación del aura en lugar de hechizos tradicionales. En nigromancia, hay ciertos hechizos que invocan esqueletos que pueden conservar los recuerdos de sus vidas anteriores. Estos recuerdos no se pueden recuperar del Plano Etéreo, porque el alma se disuelve en materia etérea poco después de que el cuerpo muere, pero pueden, sin embargo, recuperarse de los rastros del aura que rodean el cuerpo muerto. La forma en que funcionan estos hechizos es que crean un alma fabricada temporalmente en el Plano Etéreo que se adhiere al cuerpo, y luego copian todos los recuerdos del aura del cadáver y los envían a esta alma para hacer que todo sea lo más parecido posible a cómo funcionaban las cosas cuando el cuerpo aún estaba vivo. Creo que los hechizos utilizados para crear aparecidos también deberían funcionar de manera similar."
      - source: scene_text_2
        paragraph: 11
        text: |-
          "Sí, sí, sé cómo funciona la nigromancia", dice Arraka. "Lo que quiero saber es por qué los Lessathi desperdiciarían su tiempo y recursos fabricando un alma para personas como tú. ¿Por qué se molestarían siquiera en darte alguna apariencia de libre albedrío? ¿No frustra eso el propósito de crear una inteligencia artificial?"

          "Tal vez mis creadores sintieron que una máquina pura nunca tendría ninguna esperanza de comprender a los humanos o menos de comprender lo suficientemente bien como para realizar las tareas que se esperaban de mí", dice el Supervisor. "Desafortunadamente, sólo puedo adivinar sus verdaderas intenciones, ya que claramente había algunas piezas de información que no parecían confiar en mí lo suficiente como para compartir conmigo. Por ejemplo, estoy bastante seguro de que había al menos algunos libros en las antiguas bibliotecas Lessathi que mencionaban el Magium, pero a pesar de este hecho, casi no tenía información sobre esta entidad misteriosa antes de escuchar su discusión de antes".
      - source: scene_3
        paragraph: 10
        text: |-
          "Aún no nos has dicho cómo lograste comunicarte con nosotros a través del cristal", dice Daren. "O por qué incluso nos estabas espiando en primer lugar. No es como si hubieras sabido de antemano que estaríamos hablando del Magium, así que seguramente debes haber tenido alguna otra razón para querer contactarnos".

          "Para responder a tu primera pregunta", dice el Supervisor, "Magium usó un cristal azul para vincularse a mí, así que esto fue lo primero que elegí investigar después de que te teletransportaste lejos de la torre de seredium. Dado que el conocimiento de Magium todavía estaba muy fresco en mi memoria en ese momento, rápidamente pude descubrir cómo estos cristales se conectan entre sí y cómo explotar su conexión para mi beneficio. En cuanto a tu segunda pregunta, la razón por la que quería contactarte era claramente para continuar nuestra conversación anterior, que dejamos sin terminar. Es decir, me gustaría saber qué asuntos tienes todavía en esta ciudad y de qué lado te unirás en el inevitable conflicto que se avecina entre yo y las fuerzas rebeldes".
