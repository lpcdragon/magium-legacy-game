  - name: b3_ch08a_collected
    texts:
      - source: scene_text
        paragraph: 38
        text: |-
          "¡¿Entonces los reyes sabían desde el principio que la mayoría de los concursantes ni siquiera podían esperar usar el Magium, pero nos dejaron unirnos de todos modos?!" grita Hadrik. "¡Eso es incluso peor que hacernos cazar piñas que no pueden ser detectadas por nadie más que por stillwaters y sabios! ¿Estos reyes realmente no tienen ningún respeto por las vidas de los cientos o tal vez incluso miles de magos que murieron en este torneo, peleando por nada?"

          "Tal vez eso es lo que los reyes buscaban desde el principio", dice Illuna. "Tal vez su verdadero objetivo era atraer a los magos más poderosos de los principales continentes lejos de sus países de origen y alentarlos a matarse entre sí para que todos los continentes, excepto Varathia, fueran despojados simultáneamente de sus luchadores más fuertes. A este ritmo, no me sorprendería demasiado si los reyes varathianos estuvieran planeando invadir los otros continentes poco después del final de este torneo".

          "O tal vez los reyes varathianos estaban preocupados de que ELLOS pudieran ser invadidos, por cualquier motivo", digo, "y decidieron reducir preventivamente el número de sus atacantes potenciales. Eso también podría explicar por qué pidieron específicamente que el ganador de este torneo se convirtiera en el protector de Varathia en caso de una invasión externa".
      - source: scene_text_2
        paragraph: 25
        text: |-
          "Eso también es posible, sí", afirma Illuna.

          "¿Qué pasa entonces con los organizadores Lessathi?" dice Daren. "¿Qué tendrían que ganar con todo esto?"

          "Es posible que los Lessathi estén intentando aprovechar el caos causado por este torneo para hacerse con el control de algunos de los reinos de Varathia", dice Kate. "Otra posibilidad es que de hecho quieran el premio del torneo para ellos mismos, y sólo ayudaron con la organización para que los reyes los condujeran al lugar desde donde se puede acceder al Magium. Es difícil adivinar cuál es su verdadero propósito cuando sabemos tan poco sobre ellos".

          "Tu amiga, Diane, era parte de la guardia de élite de Meridith, ¿verdad?" Le pregunto a Kate. "Podríamos intentar preguntarle sobre esto cuando finalmente la volvamos a encontrar. Ella podría saber algo sobre sus planes".

          "Ya veremos", dice Kate.

          "Tengo que decir..." me dice Daren. "Me sorprende lo tranquilo y sereno que estás ahora, Barry. De todas las personas aquí, probablemente eres, con diferencia, el que más quiere el Magium. ¿Cómo es que no te afecta el hecho de que el premio por el que has estado luchando tan duro para obtener pueda resultar completamente inútil para ti?"
      - source: scene_3
        paragraph: 15
        text: |-
          "Oh, es porque ya tuve esta conversación antes... con Kate", digo. "Ella vio que yo estaba dudando sobre el Magium después de lo que sucedió en el ritual del Dios del Tiempo, y me ayudó a recuperar mi motivación sugiriendo una forma alternativa en la que podría hacer uso del Magium para convertirme en un mago".

          "¿Es eso así?" Dice Daren, mientras le da a Kate una mirada impresionada durante unos segundos antes de volver a mirarme. "¿Y cuál fue esa sugerencia que te dio?"

          "La idea es que primero que nada desbloquee mis estadísticas mágicas de mi dispositivo para poder usar mis poderes mágicos temporales para vincularme al Magium", digo. "Entonces, una vez que tenga acceso a todo el conocimiento de Magium, puedo tomarme mi tiempo para investigar una forma de modificar mi dispositivo de estadísticas para que pueda extraer energía directamente del plano mágico en lugar de obtenerla de los magos que me rodean, lo que esencialmente me convertiría en un mago de pleno derecho. Sé que no es un plan perfecto, pero después de pensarlo un poco, diría que tengo bastante confianza en mis probabilidades de éxito".

          "Bueno..." dice Daren. "No estoy exactamente seguro de qué decir sobre la viabilidad de su plan, pero una cosa es segura. A todos nos vendría bien algo de su optimismo en este momento".
