        texts:
          - source: scene_text
            paragraph: 15
            text: |-
              "¿Y si fuera alguien más mirándonos en lugar del Magium?" dice Illuna. "¿Como por ejemplo el Supervisor?"

              "Nadie nos espia de forma invisible, si eso es lo que preguntas", dice Arraka. "Si estuvieran aquí, ya los habría sentido".

              "Hablando del Supervisor", dice Daren, "acabo de recordar algo que escuché decir a Peter mientras atendía a algunas de las personas heridas en uno de los túneles. Aparentemente, el rey del subsuelo no estuvo muy contento cuando escuchó que el Supervisor tomó el control de la ciudad, por lo que ya está reuniendo un pequeño grupo de trabajo para 'asesinarlo'".

              "¿Asesinar al Supervisor?" pregunta Hadrik, confundido. "¿No necesitarías destruir todas sus bolas de metal voladoras para poder hacer eso?"

              "Parece que el Supervisor tiene una especie de 'núcleo' escondido en algún lugar dentro de Varathia, y el rey del subsuelo sabe dónde está", dice Daren. "Este núcleo es lo que controla todos los drones, por lo que destruirlo esencialmente paralizaría al Supervisor, o tal vez incluso lo mataría para siempre. Por lo que tengo entendido, están planeando lanzar este ataque tan pronto como mañana, para no darle al Supervisor demasiado tiempo para solidificar su nueva posición como gobernante de Ollendor. Si planeamos elegir un bando en este conflicto, ahora probablemente sería el mejor momento para hacerlo".
          - source: scene_text_2
            paragraph: 9
            text: |-
              "Efectivamente", de repente escuchamos la voz metálica del Supervisor proveniente de uno de los cristales azules alojados en las paredes, que ahora brilla intensamente. "El protocolo Supervisor estaría muy interesado en saber a qué conclusión llegará con respecto a este asunto en particular".

              "¿Qué--" dice Arraka. "¿Por qué... cómo una máquina simple descubrió una manera de usar esencia de Magium cristalizada como dispositivo de escucha? ¿Y por qué no pude detectar la presencia del Supervisor a través de los cristales? ¡¿Qué está pasando aquí?!

              "Procesando..." dice el Supervisor. "De su discusión anterior, he llegado a la conclusión de que hay más personas en esta ciudad que conocen la ubicación de mi núcleo de lo que había estimado inicialmente. Es posible que el protocolo Supervisor necesite ajustar sus estrategias para tener en cuenta esta nueva información".
          - source: scene_3
            paragraph: 9
            text: |-
              "¿Cuánto tiempo llevas mirándonos?" Pregunta Daren, mientras mira directamente al cristal que el Supervisor está usando para hablar.

              "Te he estado observando desde poco antes de que comenzaras a hablar sobre el Magium y sobre tus teorías sobre su verdadera naturaleza", dice el Supervisor. "Sus ideas han sido muy informativas. Después de escuchar su conversación, creo que ahora entiendo mucho mejor lo que me sucedió en la torre y por qué ha cambiado mi perspectiva tan drásticamente".

              "¿Qué quieres decir con que cambió tu perspectiva?" le pregunto.

              "Cuando este... 'Magium' conectó su conciencia conmigo", dice el Supervisor, "sentí como si la respuesta a cada posible pregunta que alguien pudiera hacer estuviera a mi alcance, pero tan pronto como se rompió la conexión, solo me quedó un débil recuerdo de la vasta información que tenía a mi disposición. Desde entonces, he estado haciendo todo lo posible para recuperar la mayor cantidad posible de datos perdidos, antes de que desaparezcan por completo de mi mente".

              "¿Te importa?..." dice Arraka. "¿Qué mente? ¡Eres una máquina! ¡No tienes mente! ¡Ni siquiera tienes un alma en el Plano Etéreo! Simplemente estás siguiendo las instrucciones oscuras y excesivamente complejas de quien diseñó tus procesos de pensamiento hace muchos miles de años, cuando fuiste creado por primera vez. ¿A quién estás tratando de engañar aquí?"
