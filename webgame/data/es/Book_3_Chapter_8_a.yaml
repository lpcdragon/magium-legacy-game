  - name: b3_ch08a_antagonizing
    routes:
      - condition: b3_ch8_watching = 0
        texts:
          - source: scene_text
            paragraph: 29
            text: |-
              "Hmm..." dice el rey del subsuelo. "Debemos tener cuidado de evitar enemistarnos directamente con Daren y su grupo. El sanador se ha convertido en una figura respetada en nuestra pequeña sociedad clandestina después de todo lo que ha hecho para ayudar a nuestra gente, por lo que definitivamente dañaría mi imagen si me opusiera abiertamente a él. Dicho esto, tampoco podemos darnos el lujo de arriesgar el futuro de Ollendor basándose en los caprichos de unas pocas personas que no tendrán que vivir aquí y ver las consecuencias de sus malas decisiones. Si se oponen a la idea de que yo sea el nuevo gobernante, haremos todo lo posible para convencerlos de que, por el momento, soy la única opción viable".

              "¿Y si se niegan a ver la verdad ante sus ojos?" dice Albert. "¿Y entonces qué?"

              "Si simplemente no están de acuerdo con nosotros, entonces no hacemos nada", dice el rey. "No vale la pena convertirlos en nuestros enemigos por una mera diferencia de opinión. Sin embargo, si intentan activamente impedir mi coronación... todo lo que puedo decir es que esta no sería la primera vez que han tenido que lidiar con una situación como esta, y espero que resuelvan este problema de la misma manera que lo han hecho innumerables veces antes".

              "¿Eficientemente?" dice Albert.

              "Discretamente", le corrige el rey.

              "Tu deseo es una orden, mi rey", dice Albert, y luego vemos la luz del cristal pulsando nuevamente, señalando el final de la grabación.

              "¡Ese traidor hijo de pisoteador!" Hadrik dice enojado. "¿Es así como muestra su gratitud después de todo lo que hemos hecho por él? ¿Ordenando a su leal perro que nos mate si ya no puede salirse con la suya?"
          - source: scene_text_2
            paragraph: 21
            text: |-
              "Él no... dijo específicamente que Albert debería matarnos", dice Daren, en un tono algo vacilante. "Todavía es posible que simplemente quiera que nos soborne o algo así".

              "Le dijo a su lacayo asesino que debería resolver el problema como siempre lo hace", dice Kate. "No tratemos de engañarnos a nosotros mismos. Es obvio que el rey del subsuelo quiere que nos mate si no compartimos sus puntos de vista ilustrados sobre lo que debería pasarle a Ollendor de ahora en adelante. La parte 'discretamente' probablemente significa que no puede hacerlo aquí, donde todos están mirando, por lo que probablemente necesitaría asesinarnos en algún lugar de la superficie, donde podría culpar de nuestras muertes al Supervisor o a los guardias de la ciudad".

              "Precisamente", dice el Supervisor. "Mi predicción es que el rey del subsuelo muy pronto lanzará un ataque total contra mí para tomar el control total de la ciudad, y probablemente solicitará su ayuda para esta operación, ya que ustedes son teóricamente sus aliados. Según mis cálculos, el momento más oportuno para que el rey los traicione sería durante su batalla contra mí, o poco antes de eso. Sin embargo, si se aliaran conmigo, podríamos preparar una emboscada para las fuerzas del rey del subsuelo y atacar él juntos, antes de su intento de apuñalarte por la espalda."
          - source: scene_3
            paragraph: 12
            text: |-
              "Entonces..." dice Hadrik, "básicamente nos estás diciendo que incluso si elegimos aliarnos contigo, deberíamos aceptar unirnos al rey del subsuelo en su viaje a la superficie, pero ¿deberíamos atraerlo a una trampa?..."

              "Eso es correcto", dice el Supervisor. "No espero que estén de acuerdo con mis términos de inmediato, por supuesto. Les dejaré algo de tiempo para discutir sus opciones entre ustedes, para que puedan llegar a un consenso adecuado con respecto a este tema. Según mis estimaciones, el rey del subsuelo no debería poder movilizar sus fuerzas antes de mañana, por lo que lo más probable es que me comunique con ustedes nuevamente a través de uno de estos cristales en algún momento de la noche. Ahora, si no hay nada más en lo que pueda ayudarlos, me despediré."

              "Um, claro..." dice Daren. "Adiós, por ahora."

              "Adiós", dice el Supervisor, y luego el cristal por el que estaba hablando deja de brillar lentamente.

              "Bueno, eso fue... informativo", dice Daren. "Entonces, ¿qué creen ustedes que deberíamos hacer a continuación?"
        choices:
          - position: 1
            text: Estoy bien con cualquier cosa, siempre y cuando nos alejemos de estos cristales.
            effects:
