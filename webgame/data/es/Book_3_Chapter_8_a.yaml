              "Nunca dije que ya no estoy de su lado", digo. "Desde mi punto de vista, todavía estamos del lado del Supervisor, pero también estamos del lado de los rebeldes. Pensé que se suponía que íbamos a discutir nuestro plan con el rey del subsuelo y llegar a un acuerdo, no comenzar una guerra con él".

