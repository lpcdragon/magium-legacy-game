            paragraph: 31
            text: |-
              "Deberíamos tener una discusión con los rebeldes sobre quién debería ser el próximo rey".

              "Sí, probablemente deberíamos hacer eso", dice Daren. "Con un poco de suerte, tal vez podamos persuadirlos para que apoyen a alguien que no sea el rey del subsuelo. Si logramos convencer a la gente antes que él, podría verse obligado a renunciar a su derecho al trono".

              "El rey del subsuelo no me parece el tipo de hombre que renunciaría a ese tipo de poder sólo porque iría en contra de los deseos de la gente", dice Kate.

              "Tal vez no", dice Daren, "pero dijo en esa grabación que preferiría tener una ascensión al trono sin disidentes, así que si logramos cambiar la opinión de incluso unas pocas personas, al menos debería hacer las cosas un poco más difíciles para él. Intentemos dirigirnos primero hacia la sala de espera, y veremos a dónde vamos desde allí".
