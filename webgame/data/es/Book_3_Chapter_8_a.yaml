            text: |-
              "En realidad, preferiría no involucrarme en esta pelea, si es posible".

              "Me temo que esto no es una opción", dice el Supervisor.

              "¿Oh?" digo. "¿Por qué no?"

              "El protocolo Supervisor ha llegado a la conclusión de que el rey del subsuelo es actualmente el mayor obstáculo en el camino de Ollendor hacia la prosperidad", dice el Supervisor. "Como tal, he decidido mantener el bloqueo de esta ciudad hasta que se ocupe de él. Si intentas salir de esta ciudad mientras el bloqueo aún está vigente, todos mis drones te atacarán en cuanto te vean, y si de alguna manera llegas a las murallas de la ciudad de una sola pieza, los gigantes Gólems de metal en las puertas también te atacarán. La única forma de salir de Ollendor sin ser atacado por mis drones es unirte a mi lado y ayudarme a eliminar al rey del subsuelo".

              "Y si nos uniéramos a ti en tu lucha contra el rey del subsuelo", dice Kate, "¿qué garantía tenemos de que no nos apuntarás con tus armas tan pronto como te deshagas de él?"

              "El protocolo Supervisor no está diseñado para decir mentiras descaradas", responde el Supervisor. "Lo único que soy capaz de hacer es retener información crítica a propósito y engañar a la gente mediante la omisión de hechos importantes. Siempre y cuando hagas que los términos de nuestro acuerdo sean lo suficientemente inequívocos, deberías poder obligarme a permitirte un paso seguro fuera de la ciudad sin muchos problemas".
