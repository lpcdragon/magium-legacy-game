            paragraph: 18
            text: |-
              "¡Nos uniremos a tu lado, por supuesto!"

              "¡¿Su lado ?!" dice Hadrik. "¿Después de que intentó hacernos volar a todos arrojándonos bolas de metal explosivas desde el cielo? ¿Te has vuelto loco?"

              "Mira", digo, "es posible que hayamos tenido nuestras diferencias, pero él nos ayudó liberando al padre de Leila de su encarcelamiento, y también cumplió su promesa de dejarnos escapar ilesos de la torre de seredium después de asesinar al rey de Ollendor. No es que confíe en él ni nada parecido, pero al menos podemos confiar en el hecho de que fue diseñado para no decir mentiras descaradas, así que mientras tengamos cuidado con nuestras palabras, no deberíamos preocuparnos". "El rey del subsuelo, por otro lado, es obviamente un mentiroso muy hábil y apenas puedo confiar en una palabra que sale de su boca".
          - source: scene_text_2
            paragraph: 12
            text: |-
              "Puede que no sea digno de confianza, pero hasta ahora no nos ha dado ninguna razón legítima para sospechar que quiera traicionarnos", dice Daren. "No podemos simplemente ser los primeros en arruinarlo después de todo lo que hemos pasado juntos desde que llegamos a esta ciudad".

              "Si ayuda en su proceso de toma de decisiones", dice el Supervisor, "resulta que tengo una grabación del rey del subsuelo insinuando fuertemente a uno de sus subordinados que su grupo debería ser asesinado si intenta oponerse a su coronación como el nuevo rey de Ollendor. Grabé su conversación mientras los escuchaba a través de uno de los cristales hace aproximadamente una hora. Esto es lo que dijeron los dos".
          - source: scene_3
            paragraph: 11
            text: |-
              La luz del cristal azul que el Supervisor estaba usando para hablar de repente comienza a pulsar unas cuantas veces, y dos segundos después comenzamos a escuchar las voces de Albert y el rey del subsuelo haciendo eco en el cristal.

              "Como me has indicado", dice Albert, "ya he ordenado a algunos de mis hombres que tengan conversaciones en voz alta entre ellos en las zonas más pobladas de las cavernas subterráneas, en las que elogiarán tus logros pasados ​​y hablarán sobre lo buena idea que sería que fueras nombrado nuevo rey de Ollendor. Esto probablemente debería ser suficiente para conseguir el apoyo de la mayoría de los refugiados, considerando lo mucho que les hemos ayudado hasta ahora".

              "Excelente", dice el rey del subsuelo. "Es importante que la transición al nuevo régimen se haga con el menor número posible de disidentes. Lo último que queremos es que se forme un nuevo movimiento de resistencia incluso antes de tomar el control de la ciudad".

              "Sin embargo, aún queda por resolver el asunto de los outsiders", afirma Albert. "Aún no sabemos si apoyarán su ascenso al trono, incluso si se lo vendemos como una medida temporal hasta que decidamos si queremos reunir un consejo o no".
