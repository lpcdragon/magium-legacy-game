            paragraph: 19
            text: |-
              "Bueno..." digo. "Supongo que cuando pones cosas así, puede que tengas razón. Si vamos a tener que elegir un lado sobre el otro sin importar qué, creo que preferiría ir con el que es físicamente incapaz de romper su promesa en lugar del tipo turbio que prácticamente nos dijo desde el principio que no deberíamos sorprendernos si nos apuñala por la espalda en cualquier momento".

              "Es posible que el rey del subsuelo haya dicho eso al principio, pero hasta ahora no nos ha dado ninguna razón legítima para sospechar que quisiera traicionarnos", dice Daren. "No podemos simplemente ser los primeros en arruinarlo después de todo lo que hemos pasado juntos desde que llegamos a esta ciudad".

              "Si ayuda en su proceso de toma de decisiones", dice el Supervisor, "resulta que tengo una grabación del rey del subsuelo insinuando fuertemente a uno de sus subordinados que su grupo debería ser asesinado si intenta oponerse a su coronación como el nuevo rey de Ollendor. Grabé su conversación mientras los escuchaba a través de uno de los cristales hace aproximadamente una hora. Esto es lo que dijeron los dos".
