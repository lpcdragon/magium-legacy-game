            paragraph: 23
            text: |-
              "Entonces, sé que probablemente me ignorarán por preguntar esto", dice Melindra, mientras salimos de nuestros dormitorios, "pero ¿por qué todos se interesan tanto en lo que sucederá con esta ciudad después de que nos vayamos? La mayoría de ustedes ni siquiera habían oído hablar de Ollendor antes de que les hablara de ello por primera vez, entonces, ¿por qué les importaría si este lugar se redujera a cenizas una vez que nos hayamos ido, siempre y cuando no nos quememos con él?"

              "No todos abandonaremos Ollendor", dice Illuna. "Leila y el doctor Reidzek planean mudarse aquí, por lo que arderán con la ciudad si se convierte en un montón de cenizas en llamas".

              "Mmm..." dice Melindra. "Ese es realmente un buen punto. No había pensado en eso. Entonces, ¿a qué lado de la guerra planean unirse?"

              "Aún no lo hemos decidido", dice Daren. "Personalmente, al menos me gustaría ver cómo reaccionaría el rey del subsuelo ante la propuesta de otro candidato al trono antes de llegar a una conclusión".
          - source: scene_3
            paragraph: 13
            text: '"Ya veo", dice Melindra. "Bueno, buena suerte con eso, supongo."'
