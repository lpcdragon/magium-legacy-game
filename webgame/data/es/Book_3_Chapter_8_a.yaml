  - name: b3_ch08a_theory
    routes:
      - condition: b3_ch8_theory = 0
        texts:
          - source: scene_text
            paragraph: 5
            text: |-
              "¿Qué pasa si el Magium es el propio plano primordial?"

              "¿Un plano de existencia con voluntad propia?" dice Daren. "Yo... supongo que eso no estaría fuera del ámbito de lo posible, considerando todas las locuras que hemos visto últimamente, pero ¿no implicaría esto que el plano terrestre también es parte del Magium, entonces? ¿Por qué el Magium necesitaría estos cristales para conectarse a nuestro plano de existencia si ese fuera el caso?"

              "Mi conjetura es que los cristales han existido desde antes de que ocurriera la división, razón por la cual resuenan más fuertemente en el Magium que en el plano terrestre", digo. "Obviamente estoy haciendo muchas suposiciones aquí, así que tal vez haya una mejor explicación para todo esto que simplemente no veo en este momento. ¿Alguien más tiene alguna idea?"
          - source: scene_text_2
            paragraph: 5
            text: |-
              "¡Está bien, escúchenme, muchachos!" Dice Hadrik, mientras levanta ambas manos en el aire brevemente para llamar nuestra atención. "¿Qué pasaría si cuando ocurriera la división, la mayoría de los seres de este plano 'primordial' o como se llame murieran, todos excepto uno que era demasiado poderoso para ser asesinado, y este ser eventualmente se convirtiera en Magium?"

              "¿Entonces el Magium sería algo así como su equivalente a Arraka?" dice Daren. "¿Alguna entidad que siguió absorbiendo a otros habitantes del plano primordial hasta que se volvió casi imposible de matar?"

              "¡Sí, sí!" dice Hadrik. "¡Eso es en lo que estaba pensando!"

              "Bueno, si no es por otra cosa, supongo que esto al menos explicaría por qué el Magium parece odiar tanto a Arraka", dice Daren. "Tal vez le recuerde a su antiguo yo."
          - source: scene_3
            paragraph: 5
            text: '"Creo que todos están olvidando un detalle importante", dice Kate, mientras el resto de nosotros nos volvemos a mirarla. "Ya sabemos que hay múltiples versiones de Arraka que existen simultáneamente en varios universos, pero por lo que pude ver, parece haber solo un Magium. Arraka nos dijo que tenía que ingresar al reino del Magium para poder viajar a otros mundos diferentes durante el ritual del Dios del Tiempo, lo que significa que el Magium debe actuar como una especie de puente que conecta todos los universos. También sabemos que el Magium vino aquí por error, buscando un Arraka diferente al de nuestro universo, lo que sugiere fuertemente que hay una sola entidad supervisando todos los mundos paralelos, en lugar de haber un Magium diferente asignado para cada universo. Si un ser poderoso de uno de los muchos planos primordiales a lo largo de los diversos universos hubiera sobrevivido a la división, como tú dices, entonces también habría necesitado ascender más allá de los conceptos de tiempo y espacio, creando su propio mundo entre mundos, lleno de las contradicciones e imposibilidades de las que Barry y Leila nos hablaron cuando describieron--"'
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch08a_boundaries
      - condition: b3_ch8_theory = 1
        texts:
          - source: scene_text
            paragraph: 6
            text: |-
              "Tal vez el Magium sea como un antiguo guardián, encargado de proteger el tejido de la existencia".

              "¿Quieres decir... como una versión más avanzada del Supervisor?" Me pregunta Daren.

              "¡Sí, exactamente!" digo. "¡Podría ser una especie de inteligencia artificial realmente avanzada construida por una de las razas que solían vivir en el plano primordial!"

              "No estoy tan seguro de eso", dice Daren. "Recuerdo que Arraka nos dijo una vez que una 'parte' del Magium era responsable de crear nuevos espíritus en el plano mágico de vez en cuando. ¿Por qué las razas del plano primordial le darían tal tarea al Magium cuando el plano mágico ni siquiera existía en ese momento?"

              "Bueno, umm... ¿Supongo que el Magium podría haber evolucionado desde entonces?..." digo. "Tal vez originalmente tenía una tarea diferente, pero se vio obligado a adaptarse cuando el plano primordial se dividió en tres. Obviamente estoy haciendo muchas suposiciones aquí, así que tal vez alguien que no sea yo pueda encontrar una mejor explicación. ¿Alguien más tiene alguna idea?"
          - source: scene_text_2
            paragraph: 5
            text: |-
              "¡Está bien, escúchenme, muchachos!" Dice Hadrik, mientras levanta ambas manos en el aire brevemente para llamar nuestra atención. "¿Qué pasaría si cuando ocurriera la división, la mayoría de los seres de este plano 'primordial' o como se llame murieran, todos excepto uno que era demasiado poderoso para ser asesinado, y este ser eventualmente se convirtiera en Magium?"

              "¿Entonces el Magium sería algo así como su equivalente a Arraka?" dice Daren. "¿Alguna entidad que siguió absorbiendo a otros habitantes del plano primordial hasta que se volvió casi imposible de matar?"

              "¡Sí, sí!" dice Hadrik. "¡Eso es en lo que estaba pensando!"

              "Bueno, si no es por otra cosa, supongo que esto al menos explicaría por qué el Magium parece odiar tanto a Arraka", dice Daren. "Tal vez le recuerde a su antiguo yo."
          - source: scene_3
            paragraph: 5
            text: '"Creo que todos están olvidando un detalle importante", dice Kate, mientras el resto de nosotros nos volvemos a mirarla. "Ya sabemos que hay múltiples versiones de Arraka que existen simultáneamente en varios universos, pero por lo que pude ver, parece haber solo un Magium. Arraka nos dijo que tenía que ingresar al reino del Magium para poder viajar a otros mundos diferentes durante el ritual del Dios del Tiempo, lo que significa que el Magium debe actuar como una especie de puente que conecta todos los universos. También sabemos que el Magium vino aquí por error, buscando un Arraka diferente al de nuestro universo, lo que sugiere fuertemente que hay una sola entidad supervisando todos los mundos paralelos, en lugar de haber un Magium diferente asignado para cada universo. Si un ser poderoso de uno de los muchos planos primordiales a lo largo de los diversos universos hubiera sobrevivido a la división, como tú dices, entonces también habría necesitado ascender más allá de los conceptos de tiempo y espacio, creando su propio mundo entre mundos, lleno de las contradicciones e imposibilidades de las que Barry y Leila nos hablaron cuando describieron--"'
