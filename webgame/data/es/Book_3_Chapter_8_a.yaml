          "¿Qué quieres decir?" Dice Melindra, en un tono ligeramente nervioso. "No pasa nada. ¡Todo está bien!"

          "Hmm..." dice Daren, mientras la estudia durante unos segundos.

          "Si ella no quiere hablar de eso, probablemente deberíamos dejarla en paz", le digo a Daren. "Por lo que sabemos, su hermano podría estar como rehén de algún Lessathi de alto rango y ella podría correr el riesgo de ponerlo en peligro si nos da demasiados detalles".
      - source: scene_3
        paragraph: 8
        text: |-
          "Tienes razón", dice Daren. "No he pensado en eso. Melindra, no sé cuál es la situación con tu hermano, pero si hay algo que podamos hacer para ayudar, háznoslo saber".

          "Por supuesto..." dice Melindra, algo vacilante. "Si se me ocurre algo, te lo diré..."

          "Entonces, umm... ¿alguien más tiene la sensación de que nos están observando?" Flower dice, de repente, mientras mira un poco ansiosamente los cristales que ahora están brillando intensamente nuevamente.

          "¿Quieres decir que te observan a través de los cristales?" dice Daren. "Supongo que realmente no podemos ignorar la posibilidad, pero no veo ninguna razón por la que alguien o algo tan poderoso como el Magium no se nos revele directamente en lugar de esconderse".
