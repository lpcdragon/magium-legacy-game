  - name: b3_ch08a_weakling
    texts:
      - source: scene_text
        paragraph: 33
        text: |-
          Caminamos un rato hacia la sala de espera hasta llegar a un pasillo que no tiene cristales azules en las paredes y está iluminado enteramente por antorchas. Tan pronto como entramos al túnel, escuchamos la voz de Arraka proveniente del amuleto.

          "¡Finalmente!" dice Arraka. "Estamos fuera del alcance de los cristales. Ahora dime, debilucho, ¡¿cómo lograste detectar al Supervisor a través de los cristales cuando yo no pude?!"

          "¿Eso es lo que has estado pensando todo este tiempo?...", dice Kate. "¿En serio?"

          "Te lo diré si me lo preguntas muy amablemente", le digo a Arraka.

          "¡Callarse la boca!" dice Arraka. "Sé que debiste haber usado algún tipo de truco. ¡No hay manera de que hayas sabido que él estaba allí simplemente usando tu sentido mágico!"
    choices:
      - position: 1
        text: Pero así fue precisamente como lo detecté.
        effects:
          - set:
              current_scene: b3_ch08a_detected
      - position: 2
        text: Por supuesto que no lo detecté al sentir su aura.
        effects:
          - set:
              current_scene: b3_ch08a_sensing
  - name: b3_ch08a_detected
    routes:
      - condition: bluff < 4
        texts:
          - source: scene_text
            paragraph: 35
            text: |-
              "Sin embargo, así es precisamente como lo detecté."

              "...Estás mintiendo", dice Arraka. "Puedo decirlo por tu aura. Pero si realmente no lo localizaste con tu sentido mágico, ¿entonces qué otros métodos existen? ¿Es algo lessathi?... ¿O fue una de tus estadísticas? ¿Cuáles fueron las estadísticas que te permitieron recopilar información, de nuevo? Estoy bastante seguro de que fueron Lenguas antiguas, Observación... luego estaban la Audición y... ¡Premonición! ¡Por supuesto! ¿Cómo me olvidé de eso? Debes haber visto una visión de él hablándonos a través del cristal, y así es como supiste dónde se escondía. ¡Finalmente, esto está empezando a tener sentido!"

              "Seguro que te llevó bastante tiempo darte cuenta", dice Illuna.

              "Dame un respiro", dice Arraka. "Ya te dije que no tengo mucho interés en los dispositivos. ¿Realmente esperas que tenga cada una de sus estadísticas en el fondo de mi mente en todo momento para poder descubrir lo que está haciendo? Debería estar agradecido de que incluso recuerde lo que hacen sus estadísticas, o nunca se habría enterado de su Bluff o cualquiera de las otras estadísticas de aura oculta".

              "Está bien, está bien, lo entendemos", digo. "¿Alguien puede cambiar de tema, por favor? No quiero escuchar a Arraka despotricar durante todo el camino hacia la sala de espera".
          - source: scene_text_2
            paragraph: 24
            text: |-
              "¡Ejem!" dice el padre de Leila. "Si se me permite... ¡solo quería decirles a todos lo fascinante que encontré su discusión sobre el Magium de antes! Como Lessathi de menor rango, mi conocimiento sobre el Magium se limitaba solo a los cuentos de hadas, por lo que fue muy estimulante para mí ser participante de su animado debate, ¡aunque solo sea como espectador!"

              "Oh", dice Daren. "Bueno, me gustaría poder compartir su sentimiento, doctor. Desafortunadamente, para mí, personalmente, todo este calvario con los 'fragmentos' de Magium no ha hecho más que generar más dudas en mi mente sobre si este premio que me ofrecen al final del torneo sería de alguna utilidad para mí."

              "¿Cómo es eso?" Dice el padre de Leila.

              "Bueno", dice Daren, "no estoy seguro de cómo decirte esto, pero cuando escuché por primera vez que nos estaban dando 'acceso' al Magium, en cierto modo supuse que no necesitaría pasar por tantos obstáculos solo para entender cómo funciona este 'acceso'. En este punto, estoy esperando que los organizadores del torneo simplemente me pongan frente a un gran cristal azul al final y me digan que necesito usar mi aura para vincularme a él o algo así para poder acceder al conocimiento del Magium. Si le dijeran esto a alguien como... digamos, Azarius, estoy seguro de que probablemente descubriría qué hacer, pero con el conocimiento que tengo... no puedo evitar pensar que estoy un poco fuera de mi alcance."

              Arraka se ríe.
          - source: scene_3
            paragraph: 14
            text: |-
              "¿Te diste cuenta de eso recién ahora?" ella dice. "¿Qué pensaste que iba a pasar, de todos modos? ¿Pensaste que tal vez te darían alguna baratija y todo lo que tendrías que hacer era presionar algunos botones para obtener el Magium? ¿Es eso lo que estaba pasando por tu cabeza cuando te uniste a este torneo?"

              "Bueno... ¡sí, en realidad!" dice Daren. "¿Qué más se suponía que debía pensar? Lo están ofreciendo como premio, ¿no? ¡Nadie dijo que era un premio que potencialmente podría acabar con nuestro mundo entero si lo cabreas demasiado!"

              "Sí, obviamente los reyes no dijeron eso, porque lo más probable es que no tengan idea de lo que están ofreciendo", dice Arraka. "Y los Lessathi que también están a cargo de organizar el torneo probablemente no tuvieron ganas de contarles sobre ello, porque tienen sus propios planes ocultos, y no querrían que los reyes descubrieran lo que realmente está en juego aquí. No he estado prestando atención exactamente a la política de Varathia, pero si tuviera que hacer una suposición fundamentada, diría que tanto los reyes como los Lessathi están ocultando algo el uno del otro, y ambos piensan que tienen la ventaja. Lo más probable es que cada uno de ellos tenga la ventaja. su propio propósito secreto al organizar este torneo, y ustedes, los perdedores, están demasiado ocupados bailando a su ritmo para siquiera considerar que podrían estar siendo engañados".
        effects:
          - set:
              failed_checks:
                - '[ Comprobación de farol fallida - nivel 4 ]'
              b3_ch8_precisely: 1
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch08a_collected
      - condition: bluff >= 4
        texts:
          - source: scene_text
            paragraph: 34
            text: |-
              "Sin embargo, así es precisamente como lo detecté."

              "... ¡¿Hiciste qué?!" —grita Arraka. "¿Un bufón como tú? ¡¿Solo por sentir su aura?! ¡No, tiene que haber sido una casualidad! ¡Te reto a que lo encuentres de nuevo! Te desafío, triste excusa para..."

              "¿Quieres calmarte?" Illuna la interrumpe. "Obviamente está mintiendo. La única forma en que podría haber conocido la ubicación del Supervisor con tanta precisión es a través de una premonición. ¿No es así, Barry?"

              "Pfff..." digo. "Tenías que arruinar mi diversión, ¿no, Illuna?"

              "¿Una premonición?..." dice Arraka, y luego su tono de repente se vuelve mucho más aliviado. "¡Por supuesto! ¿Por qué no pensé en eso? ¡Era tan obvio!"

              "Entonces, incluso con tus locas capacidades de detección de aura, aún puedes perder la concentración y dejarte engañar por un farol si tus emociones te superan", digo con voz pensativa. "Es bueno saberlo. ¡Estoy seguro de que esta información será útil más adelante!"

              "No contaría con eso, Barry-boy..." dice Arraka, con una voz ligeramente amenazadora.

              "¿Alguien podría cambiar de tema antes de que estos dos terminen intentando matarse entre sí?" dice Kate.
