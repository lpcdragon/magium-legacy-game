  - name: b3_ch08a_rescue
    routes:
      - condition: b3_ch4_billy = 9
        texts:
          - source: scene_text
            paragraph: 24
            text: |-
              "Estoy del lado que nos ayude a rescatar a los prisioneros de las torres de seredium".

              "Error", dice el Supervisor. "Según mi análisis, ninguna de las dos partes considerará que el rescate de los prisioneros de la torre del seredium sea una prioridad. ¿Podrías aclarar a qué lado te refieres específicamente?"

              "¿Qué quieres decir con que ninguna de las partes quiere rescatar a los prisioneros?" digo. "¿Por qué los rebeldes no querrían salvar a su propio pueblo?"

              "Salvar a los prisioneros de las torres de seredium tiene un precio", dice el Supervisor. "Si liberaras a todos los magos encarcelados, ya no habría forma de alimentar los vehículos metálicos voladores o cualquiera de los otros dispositivos que utilizan diariamente la gente de Ollendor. Si estos dispositivos dejaran de funcionar repentinamente, habría caos en las calles, lo que inevitablemente conduciría a muchas muertes. El rey del subsuelo lo sabe muy bien y no liberará a los prisioneros hasta que encuentre una alternativa adecuada para proporcionar energía mágica a todos en la ciudad".

              "Bueno, si ese es realmente el caso, entonces supongo que no estoy del lado de nadie", digo. "Si ninguno de ustedes va a considerar siquiera la posibilidad de liberar a los prisioneros, entonces todos ustedes son mis enemigos".
          - source: scene_text_2
            paragraph: 17
            text: |-
