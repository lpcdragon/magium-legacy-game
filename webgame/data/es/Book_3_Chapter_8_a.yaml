              "Esa es una buena idea", dice Kate. "En realidad estaba planeando hacerle esta pregunta yo mismo la próxima vez que nos encontráramos con él".

              "Entonces, vayamos a la sala de espera", dice Daren. "Una vez que estemos allí, veremos si podemos localizar a Albert o Peter, para que puedan decirnos dónde está el rey".
