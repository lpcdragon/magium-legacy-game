  - name: b3_ch08a_intro2
    texts:
      - source: scene_text
        paragraph: 3
        text: |-
          "¿Por qué me preguntas?" dice Arraka. "¿Parezco un experto en cristales o algo así?"

          "¡Sí!" Dice Daren, un poco demasiado alto. "Si no eres tú, ¿quién más? Tú fuiste quien nos dijo de qué están hechos los cristales, ¿no?"

          "Hasta donde yo sé, el único uso práctico de estos cristales es ayudar a mantener modificaciones muy complejas en las auras de los objetos al construir dispositivos mágicos", dice Arraka. "Como no soy ni un gnomo ni un Lessathi, no podría tener menos interés en jugar con dispositivos y, por lo tanto, mi conocimiento sobre estos cristales y lo que son capaces de hacer es extremadamente limitado. Ya les he contado la mayor parte de lo que sé sobre este tema en particular".

          "Sobre el tema de los cristales, querrás decir", dice Daren, frunciendo ligeramente el ceño. "Sobre el tema del Magium en sí, sigues siendo tan vago como siempre."
      - source: scene_text_2
        paragraph: 3
        text: |-
          "¿De verdad crees que voy a correr el riesgo de que me borren de la existencia otra vez, sólo para satisfacer tu curiosidad?" dice Arraka. "Ni siquiera deberías necesitar hacerme esta pregunta, porque ya deberías tener una idea bastante clara de cuál es su verdadera naturaleza con la información que está disponible para ti, especialmente después del último encuentro de Barry y Leila con él. Y además, tampoco es que sepa todo lo que hay que saber sobre el Magium. Hasta hace poco, tenía la impresión de que el Magium es una entidad generalmente pasiva, apenas digna de ser considerada una amenaza, pero estos últimos eventos me están obligando a considerar que tal vez pueda convertirse en una fuerza mucho más activa de lo que previamente supuse que era posible. Necesitaría mucho más tiempo para estudiarla para poder llegar a una conclusión satisfactoria, y no es como si fuera a progresar mucho en ese frente mientras esté atrapado en este amuleto".

          "Bueno..." dice Daren, pareciendo un poco desconcertado por la respuesta de Arraka. "Si incluso Arraka admite tener problemas para entender todo esto, no estoy seguro de cuánto seremos capaces de resolver por nuestra cuenta, pero supongo que es cierto que ahora tenemos una idea general de qué es el Magium, o al menos de qué es capaz. Sabemos que puede borrar cosas y personas de la existencia y sabemos que una simple fracción de su voluntad es capaz de deshacer un universo entero sin mucho esfuerzo, por lo que su poder es prácticamente ilimitado. Sin embargo, también sabemos que puede ser engañado, ya que tanto Arraka como el Dios del Destino pudieron escapar de él usando un... hechizo de sugestión, ¿verdad?..."
      - source: scene_3
        paragraph: 3
        text: |-
          "¿Qué?..." dice Arraka. "¡No, por supuesto que no usamos un hechizo de sugestión en el Magium! ¿Qué estás loco?"

          "Estaba bastante seguro de que eso fue lo que le dijiste a Barry que hiciste cuando fuiste atacado por el Magium durante el ritual del Dios del Tiempo", dice Daren. "¿Estoy recordando mal las cosas?"
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch08a_intro3
  - name: b3_ch08a_intro3
    texts:
      - source: scene_text
        paragraph: 4
        text: |-
          "Lo que le dije a Barry", dice Arraka, "es que si REALMENTE quería hacer una comparación, entonces lo que usé fue más similar a un hechizo de sugestión ridículamente complicado que a un hechizo de ilusión. Obviamente no era un hechizo en el verdadero sentido de la palabra. ¿Cómo podría algo tan simple como la magia funcionar contra una entidad capaz de deshacer mundos enteros en cualquier momento?..."

          "Está bien, entonces si no fue magia, ¿qué usaste entonces?" pregunta Daren.

          "...¿Cómo esperas que te explique esto cuando ni siquiera sabes los conceptos básicos de--"

          Ella hace una pausa.

          "En realidad, ¿sabes qué? ¡A la mierda!" Arraka dice, después de un rato. "Si mi plan es utilizarlos a ustedes, payasos, para vengarme del Dios del Tiempo y de todos los demás dioses que me exiliaron del plano mágico, entonces ya no puedo darme el lujo de hacer las cosas de la manera tradicional. Voy a necesitar aprender a pensar fuera de lo común. Si no puedo encontrar una manera de explicar estos conceptos extraordinariamente complejos de una manera que incluso un grupo de primates ebrios los entienda, entonces he fracasado como maestro".

          "Sí, sí, lo entendemos", dice Hadrik. "Todos somos tan tontos como un grupo de simios borrachos. Ahora, ¿puedes darte prisa y ir al grano antes de...?"
      - source: scene_text_2
        paragraph: 4
        text: |-
          "Y una vez que los monos entiendan lo que estoy diciendo", continúa Arraka, "todo lo que tengo que hacer es simplificar aún más las cosas hasta que alcancemos tu nivel y entonces finalmente comenzaremos a hacer algunos progresos".

          "Oye, espera un minuto..." comienza a decir Hadrik, pero Daren lo interrumpe.

          "¿Planeas responder mi pregunta o no?" Pregunta Daren, mirando directamente al amuleto.

          "Bien, bien", dice Arraka. "Para decirlo en los términos más simples posibles, lo que hice fue usar un tipo primordial de 'magia' que data de mucho tiempo atrás, cuando los tres planos de existencia aún no estaban separados. Obviamente, solo lo llamo magia por falta de otra palabra, porque realmente no se puede comparar con nada que puedas--"

          "Vaya, espera, espera..." dice Daren. "¿Acabas de insinuar que el plano terrestre, mágico y etéreo solían fusionarse en un gran plano de existencia hace mucho tiempo? ¿Cómo sabrías algo de esto? No me digas que estabas vivo cuando ocurrió la división..."
      - source: scene_3
        paragraph: 4
        text: |-
          "No, no estaba allí en ese momento, pero puedes encontrar pistas que apunten hacia este hecho si sabes dónde buscar", dice Arraka. "Una de estas pistas es la existencia misma de la magia primordial de la que estaba hablando antes. De todos modos, el punto que estaba tratando de señalar es que no tiene sentido tratar de influir en el Magium a menos que lo hagas en los tres planos de existencia simultáneamente, y una de las pocas maneras de hacerlo es usar un tipo de 'magia' tan antigua que ignora los límites de los planos por completo".

          "Los tres planos de existencia simultáneamente..." dice Daren, luciendo algo perdido en sus pensamientos. "Barry, corrígeme si me equivoco, pero ¿no mencionaste antes que tú y Leila estaban siendo arrojados de un lado a otro a través de todos los planos de existencia mientras el Magium intentaba deshacer nuestra realidad?"

          "Sí, es cierto", digo, mientras Leila asiente al mismo tiempo, confirmando que ese también era su caso.

          "Entonces", dice Daren, "si el Magium puede lanzarte a través de diferentes planos de existencia... y si sólo puede ser atacado en todos los planos al mismo tiempo... supongo que debe estar relacionado de alguna manera con este plano 'primordial' que existía antes de que ocurriera la división, ¿verdad? Realmente no veo ninguna otra explicación razonable que tenga en cuenta todos estos factores. ¿Qué piensan ustedes?"
    choices:
      - position: 1
        text: ¿Y si el Magium es el propio plano primordial?
