          - source: scene_text_2
            paragraph: 30
            text: |-
              Viendo que los gólems no piensan dejarme en paz, decido colocarme entre ellos y los ballesteros, y espero a ver qué pasa. Mi plan parece funcionar, porque los gólems han dejado de inmediato de usar sus ataques de haz para evitar herir por accidente a sus propias tropas, y ahora simplemente se quedan mirándome sin hacer nada. Me aseguro de mantener exactamente la misma altura y empiezo a volar en horizontal, disparándoles a los ballesteros en las piernas uno por uno, mientras también esquivo los virotes de ballesta que me lanzan. Cuando se dan cuenta de que no pienso apartarme de delante de sus aliados, los dos gólems que me estaban atacando deciden cambiar de objetivo e ir a por Hadrik, que ya ha terminado con el gólem de la puerta y corre ahora hacia uno de los otros.

              Mientras tanto, Daren, sobre quien ahora se centran menos ataques de fuego, por fin puede mover un poco la barrera, así que avanza lentamente hacia las puertas junto con Kate, Leila y Melindra. Mientras Illuna y yo nos ocupamos de unos cuantos ballesteros y arqueros más, Kate decide que ya puede deshacer algunas de sus plataformas defensivas de hielo, y se concentra en reforzar un enorme carámbano en el cielo, asegurándose de que el proyectil sea lo bastante fuerte como para atravesar la armadura anti-magia de los gólems.
          - source: scene_3
            paragraph: 9
            text: |-
