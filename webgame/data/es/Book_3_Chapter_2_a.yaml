        texts:
          - source: scene_text
            paragraph: 42
            text: |-
              "Intentaré encargarme de uno de los gólems", digo. "Cuanto antes los eliminemos, mejor."

              "Espera, ¿piensas atacar tú solo a uno de ellos?...", dice Daren. "De verdad espero que no estés hablando en serio cuand--"

              No dejo que Daren termine la frase y levanto los brazos en el aire para indicarle a las corrientes que quiero subir al cielo. Luego salgo volando de la barrera, intentando ascender todo lo posible para no convertirme en objetivo ni de los gólems ni de los guardias de la muralla. Le echo un buen vistazo al campo de batalla y decido que mi mejor opción es atacar al gólem que está más aislado de los cuatro que están atacando la barrera de Daren.

              Me lanzo en picado desde el cielo lo más rápido que puedo, poniendo ambos puños delante de mí para indicarle a mis corrientes que sigan acelerando. Entonces, cuando llego lo bastante cerca del gólem al que he elegido, concentro toda mi fuerza en el golpe y le pego directamente en la cara antes de que tenga oportunidad de reaccionar.

              Por desgracia para mí, golpear la dura superficie metálica del gólem con mi frágil brazo tuvo sobre él más o menos el mismo efecto que si lo hubiera golpeado con una ramita. Intentando ignorar el dolor del puño, salgo inmediatamente volando hacia atrás para retirarme, pero el gólem gira enseguida su haz de fuego hacia mí, y estoy demasiado cerca como para poder esquivarlo de ningún modo. Solo tarda un segundo en incinerarme por completo y convertirme en cenizas.
