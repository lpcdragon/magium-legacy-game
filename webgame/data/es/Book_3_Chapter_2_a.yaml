                  ancient_languages: ${ancient_languages_aux}
                  combat_technique: ${combat_technique_aux}
                  premonition: ${premonition_aux}
                  available_points: ${available_points_aux}
              - set:
                  strength: ${strength_aux}
                  agility: ${agility_aux}
                  toughness: ${toughness_aux}
                  reflexes: ${reflexes_aux}
                  hearing: ${hearing_aux}
                  perception: ${perception_aux}
                  ancient_languages: ${ancient_languages_aux}
                  combat_technique: ${combat_technique_aux}
                  premonition: ${premonition_aux}
