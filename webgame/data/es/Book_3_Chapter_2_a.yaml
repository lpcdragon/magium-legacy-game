  - name: b3_ch02a_drunk3
    texts:
      - source: scene_text
        paragraph: 14
        text: |-
          "Entonces...", digo, fingiendo dar un largo trago de mi botella, aunque en realidad solo estoy dando pequeños sorbos para mantenerme sobrio. "¿Qué crees que les pasó a los antiguos dueños de esta casa? ¿Piensas que los arrestaron o algo así? ¿Con qué frecuencia desaparece la gente de la nada en esta aldea, al fin y al cabo?"

          "En la aldea no pasa tan a menudo, pero en la ciudad ya no estoy tan seguro", dice el borracho. "He oído muchas historias sobre gente de allí dentro que desaparece de la nada, sobre todo en los últimos años, y nadie sabe qué está pasando. Son tiempos oscuros los que vivimos, te lo digo yo. No sé qué vinieron a hacer aquí, pero les recomiendo que terminen sus asuntos rápido y se marchen mientras puedan. Aquí no les espera nada bueno."

          "Por desgracia, puede que ni siquiera logremos pasar de las puertas de la ciudad, por cómo han ido las cosas hasta ahora", dice Hadrik.

          "¿Cómo es eso?", pregunta el borracho, dando otro trago de su botella.

          "Bueno, hay un tipo que nos invitó aquí para comerciar con él", dice Hadrik, "pero olvidó decirnos que necesitábamos una contraseña para entrar en la ciudad, y ahora no logramos contactar con él por algún motivo. Estamos atrapados esperando frente a la ciudad después de todo el tiempo que tardamos en llegar hasta aquí. El guardia de la entrada dijo que pondría en marcha algún tipo de procedimiento para que recibiéramos permiso para entrar en la ciudad, pero no me creo ni una palabra de lo que dice. Apostaría a que ni siquiera le ha dicho a nadie que estamos aquí y simplemente espera a que nos vayamos. Vaya pérdida de tiempo resultó ser todo este viaje..."
      - source: scene_text_2
        paragraph: 9
        text: |-
          "¿No pueden entrar en la ciudad?...", dice el borracho. "Es una verdadera lástima. Y después de todo el tiempo que tardaron en llegar hasta aquí..."

          Se queda callado un momento, mirando al frente con expresión pensativa.

          "Sí... Sería una verdadera lástima que no pudieran entrar en la ciudad solo por una contraseña estúpida", dice el borracho. "No sé por qué inventaron una regla tan ridícula. Ni siquiera recibimos tantas visitas. ¿Por qué íbamos a rechazar a la poca gente que viene solo por la 'seguridad'? Yo te diré por qué piden una contraseña. ¡Porque al rey se le ha ido la cabeza, por eso! Ve enemigos en todas partes. Hasta en su propia ciudad."

          El hombre vuelve a hacer una pausa, da otro largo trago a la botella y luego vuelve a mirar al frente, esta vez con una expresión más decidida en los ojos.

          "Les diré una cosa", dice el borracho, girándose ahora hacia nosotros. "Yo les daré esa contraseña. Me sentiría mal por ustedes si tuvieran que volver a su tierra con las manos vacías a estas alturas, y además me dieron gratis esta botella de ale."

          "¿Seguro?", le pregunta Hadrik. "¿No se enfadarán los guardias contigo si se enteran?"
      - source: scene_3
        paragraph: 7
        text: |-
          "¡Al diablo los guardias y el rey!", dice el borracho, volviendo a beber, y su cara se pone mucho más roja que antes. "No es como si alguien fuera a morir por una contraseña inofensiva. Solo... asegúrense de no decirle a nadie que se la di yo. ¡No quiero acabar en la cárcel por algo tan trivial como esto!"

          "Claro, claro...", dice Hadrik. "Solo diremos que conseguimos contactar con nuestro cliente y que nos dio la contraseña por el transceptor."

          "¡Muy bien, entonces!", dice el borracho. "En ese caso, la contraseña de esta semana es 'alas de gárgola'. Ah, y la de la semana pasada era 'remos rotos', por si preguntan. Eso debería bastar para que pasen por las puertas principales."

          "¡Vaya, eso es fantástico!", dice Hadrik. "¡Muchas gracias! ¡No puedo esperar a verles la cara a nuestros amigos cuando les digamos que conseguimos averiguar la contraseña!"

          "¡Pueden ir a decírselo ahora mismo, no me importa!", dice el borracho. "No tienen que preocuparse por este viejo borracho. Puedo encontrar solo el camino de vuelta a casa, y estoy seguro de que su socio comercial ya debe de estar esperándolos dentro de la ciudad con toda la impaciencia del mundo."
