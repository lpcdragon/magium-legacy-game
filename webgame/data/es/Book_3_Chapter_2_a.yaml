  - name: b3_ch02a_insane2
    texts:
      - source: scene_text
        paragraph: 35
        text: |-
          Cuatro haces de fuego golpean a la vez la barrera de Daren, generando una explosión de aire caliente que incluso los que estamos dentro podemos sentir un poco. No parece que los gólems puedan moverse mientras nos disparan sus haces, así que al menos no podrán acercarse más a menos que cancelen sus ataques. Mientras tanto, Hadrik ya ha empezado a asaltar al segundo gólem junto a las puertas, pero está teniendo un poco más de problemas con él que con el primero. El gólem parece lo bastante fuerte como para hacer retroceder a Hadrik, y como no puede arriesgarse a recibir el impacto de ninguno de los haces, el enano se ve obligado a pelear de una forma bastante más evasiva de lo habitual.

          "Kate, ¿podrías encargarte de uno o dos de los gólems?", dice Daren, mientras el aire dentro de la barrera se vuelve lentamente más caliente. "No puedo mover la barrera mientras tantos haces la estén atacando a la vez."

          "Por desgracia, ya estoy demasiado ocupada defendiéndonos de la lluvia de flechas que cae desde arriba", dice Kate.

          Cuando miramos hacia lo alto, vemos que Kate controla varias plataformas voladoras de hielo que no dejan de moverse para interceptar los virotes de ballesta y las flechas de los guardias apostados encima de las murallas.
      - source: scene_text_2
        paragraph: 29
        text: |-
          "A menos que hayas aprendido de repente a crear barreras contra ataques no mágicos, deshacer esas plataformas de hielo significaría nuestra muerte", dice Kate. "Alguien más tendrá que concentrarse en atacar a los gólems."

          "¡Maldita sea, tienes razón!", dice Daren.

          Entonces saca la espada fuera de la barrera para empezar a absorber uno de los haces de fuego, y cuando la espada se pone al rojo vivo, la blande con todas sus fuerzas de vuelta hacia el gólem que lo disparó. El haz que sale de la espada de Daren y el que viene del gólem chocan entre sí y crean una explosión de aire lo bastante potente como para tumbar al gólem, y también abren una pequeña grieta en la barrera semitransparente de Daren.

          "Flower y yo iremos a ocuparnos de los guardias de las murallas", dice Illuna, mientras el gólem que cayó antes está en proceso de volver a levantarse.

          "¡Asegúrense de no matarlos!", dice Daren. "¡Recuerden, no es culpa suya! ¡Solo están defendiendo su ciudad!"

          "Sí...", dice Illuna, saliendo de la barrera, saltando por los aires, y entonces Flower activa sus chorros de fuego.

          "Tú tienes el hechizo de vuelo, Barry", dice Melindra, mientras de repente siento sus corrientes de aire girando alrededor de mi cuerpo. "Haz con él lo que mejor te parezca."
