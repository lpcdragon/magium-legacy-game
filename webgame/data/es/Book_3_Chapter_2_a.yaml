              Por desgracia, mientras estábamos ocupados con los pocos gólems que estaban lo bastante cerca como para enfrentarse a nosotros de inmediato, alrededor de una docena más de grandes gólems que oyeron el alboroto han ido acercándose lentamente, y pronto estarán dentro del alcance de sus ataques de haz. Mientras Hadrik atrae la atención de uno de los dos gólems que están lo bastante cerca para atacarnos, y el último gólem que estaba atacando la barrera de Daren empieza a apuntar en cambio a Illuna y a Flower, Daren y los demás salen rápidamente de la barrera y corren hacia las puertas, y nos llaman en cuanto las alcanzan.

