                condition: b3_ch1_unlock != 2 AND hearing_aux = 4
          - position: 3
            text: '"Podría intentar escuchar a alguien desde lejos." (requiere nivel 4 en audición)'
            effects:
              - condition: b3_ch1_unlock = 2
                show_warning:
                  text: Stat device locked
              - condition: hearing_aux < 4 AND b3_ch1_unlock != 2
                show_warning: {}
              - set:
                  current_scene: b3_ch02a_eavesdrop
                  b3_ch2_infiltration: 2
                condition: hearing_aux = 4 AND b3_ch1_unlock != 2
      - condition: b3_ch2_pass2 = 1
        texts:
          - source: scene_text
            paragraph: 8
            text: |-
              "La contraseña es 'cierra la boca y abre la puerta' "

              "Parece que tu compañero tiene un sentido del humor bastante refinado", le dice el guardia a Daren, después de lanzarme una breve mirada. "He oído que esos dos grandes gólems que tengo detrás también tienen muy buen sentido del humor. ¿Quizá a tu amigo le gustaría que se los presentara? Seguro que se llevarían bien."

              "Por favor, ignora a mi guardaespaldas", dice Daren. "A veces no sabe cuándo callarse. Te aseguro que no habla en mi nombre de ninguna manera. Por desgracia, no conozco la contraseña que me pides."

              "Si no conoces la contraseña, entonces tendrás que tramitar el papeleo requerido, como cualquier otro forastero", dice el guardia.
