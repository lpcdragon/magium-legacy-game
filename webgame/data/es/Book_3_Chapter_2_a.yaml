  - name: b3_ch02a_eavesdrop2
    texts:
      - source: scene_text
        paragraph: 20
        text: Después de escuchar cientos de conversaciones durante unos diez minutos, por fin tengo suerte y oigo que uno de los aldeanos planea entrar en la ciudad para comprar provisiones. Salgo de inmediato del bosque y empiezo a seguir lentamente el camino hacia las puertas de la ciudad, mientras intento identificar al hombre cuya voz oí antes. No me lleva mucho tiempo averiguar quién era, porque no muy lejos de mí ya puedo ver a un tipo tirando de un pequeño carro de madera en dirección a la ciudad. Finjo mirar alrededor buscando una señal mientras le doy al hombre del carro el tiempo suficiente para alejarse de mí, y luego empiezo a caminar también despacio en dirección a la ciudad, para asegurarme de que no se salga de mi alcance auditivo.
      - source: scene_text_2
        paragraph: 15
        text: |-
          En cuanto el hombre llega a las puertas, el guardia le pide la contraseña, y el aldeano le responde: 'alas de gárgola'. Esa era al parecer la respuesta correcta, porque las puertas a lo lejos empiezan a abrirse y los gólems se apartan para dejar pasar al hombre. Una vez que las puertas se cierran de nuevo, saco mi transceptor y lo pongo en la frecuencia de Daren, para contarle lo que averigüé.

          "Oye, Daren, ¿me oyes?", le digo, mientras empiezo a volver en dirección al bosque.

          "Sí", dice Daren. "¿Qué pasó? ¿Funcionó tu plan?"

          "Sí", digo. "Ya pueden salir. Los esperaré en la carretera principal, cerca del lugar por donde salimos del bosque la primera vez."

          "De acuerdo", dice Daren. "Vamos para allá."

          No mucho después, me reúno con Daren y los demás, y luego todos empezamos a dirigirnos juntos hacia las puertas de la ciudad. Sin embargo, justo cuando damos nuestros primeros pasos, oímos una voz desconocida llamándonos desde dentro del bosque.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch02a_information
  - name: b3_ch02a_information
    texts:
      - source: scene_text
        paragraph: 21
        text: |-
          "¡Ustedes ahí... humanos!", dice la voz en lengua común, pero con un acento destrozado. "No entrar en ciudad todavía. Nosotros tener información importante que quizá necesitar. Información sobre contraseña necesaria para pasar puertas. Si interesados, volver dentro de bosque, y nosotros hablar."

          Mientras intento averiguar quién nos está hablando, me doy cuenta de que puedo percibir unas auras muy débiles y muy bien reprimidas detrás de los árboles, aunque no habría tenido ninguna posibilidad de notar que estaban allí de no saber de antemano dónde mirar. Por su tamaño y por el sonido de aquel acento roto de antes, deduzco que estamos tratando con un grupo de goblins.

          "Arraka...", dice Illuna. "¿Por qué no nos avisaste de que unos goblins nos estaban siguiendo?"

          "¿Qué clase de pregunta es esa?", dice Arraka. "¿También quieres que te vaya diciendo lo de las ardillas de los árboles y los pájaros del cielo? Me pediste que te hablara de enemigos que pudieran intentar rodearlos, y eso es exactamente lo que he hecho. Estos goblins obviamente son inofensivos. Apenas van armados, y ustedes mismos pueden ver lo débiles que son sus auras. Si me detuviera a hablarles de cada animal o monstruo que tienen cerca, nunca llegaríamos a ninguna parte."
      - source: scene_text_2
        paragraph: 16
        text: |-
          "¿Pero ya estaban por la zona cuando llegamos, o nos siguieron hasta aquí?", pregunta Illuna.

          "Los goblins nos siguen desde esta mañana", dice Melindra. "Pensé que para estas alturas todo el mundo ya lo sabía. No parecía que quisieran pelear, así que los dejé estar."

          "¿Y cómo sabes exactamente que no son exploradores de Tyrath?", dice Daren en voz baja, procurando que los goblins no lo oigan. "¡Podrían haber estado filtrándole al dragón información sobre nuestra ubicación todo este tiempo!"

          "¿Y qué?", dice Melindra, bajando también la voz. "Las tropas de élite de Tyrath ya te demostraron que pueden encontrarte donde sea que te escondas, con exploradores o sin ellos. ¿Qué diferencia importante hace dejar con vida a unos pocos goblins?"

          "Humanos...", vuelve a llamarnos la voz del goblin desde dentro del bosque. "¿Vienen o no?"
    choices:
      - position: 1
        text: Sugerir que ignoremos a los goblins y vayamos a la ciudad.
        effects:
          - set:
              current_scene: b3_ch02a_ignore
              b3_ch2_goblins: 0
      - position: 2
        text: Sugerir que vayamos a matar a los goblins, por si acaso.
        effects:
          - set:
              current_scene: b3_ch02a_kill
              b3_ch2_goblins: 1
      - position: 3
        text: Sugerir que vayamos a hablar con los goblins para ver qué quieren.
        effects:
          - set:
              current_scene: b3_ch02a_talk
              b3_ch2_goblins: 2
  - name: b3_ch02a_ignore
    texts:
      - source: scene_text
        paragraph: 22
        text: |-
          "Olvídense de los goblins", digo. "No tiene sentido tratar con ellos a estas alturas. Si iban a filtrarle información a Tyrath, ya lo habrían hecho, y no es como si pudieran seguirnos dentro de la ciudad. Solo estamos perdiendo tiempo hablando de ellos. Yo digo que sigamos con nuestro plan inicial y vayamos a las puertas."

          "Sí, creo que será lo mejor", dice Hadrik.

          "Bueno, si todos los demás también están de acuerdo, entonces pongámonos en marcha", dice Daren. "Con suerte, las tropas de Tyrath no serán tan descaradas como para atacarnos mientras estemos dentro de Ollendor."

          Dicho eso, Daren vuelve a caminar hacia la ciudad, y todos nos movemos para seguirlo. El goblin de antes intenta llamarnos una última vez antes de que salgamos de su alcance auditivo, pero lo ignoramos y seguimos adelante.

          Nos lleva un rato, pero cuando por fin terminamos de atravesar de nuevo la aldea, acabamos llegando a las puertas por segunda vez. El guardia de la entrada nos mira ahora con la misma expresión recelosa que tenía la primera vez, y nos habla en cuanto nos detenemos ante él.

          "Veo que han vuelto", dice el guardia. "¿Debo entender que por fin han conseguido que ese 'cliente' suyo les dé la contraseña?..."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch02a_ruckus
            condition: b3_ch2_infiltration = 3
          - set:
              current_scene: b3_ch02a_insane
            condition: b3_ch2_infiltration != 3
  - name: b3_ch02a_kill
    texts:
      - source: scene_text
        paragraph: 23
        text: |-
          "Yo digo que los matemos, por si acaso", les digo a los demás, también en voz baja. "Con un poco de suerte, quizá todavía no le hayan dicho nada a Tyrath, y podamos retrasar un poco más la próxima emboscada de monstruos."

          "Sí, eso es lo que estaba pensando", dice Daren. "Pero deberíamos ir con cuidado. Hasta donde sabemos, podrían estar atrayéndonos a una trampa."

          "Uf...", dice Hadrik. "Acabemos con esto de una vez, ¿sí? No soy precisamente fan de matar enemigos débiles e indefensos."

          "Ahora mismo vamos", les grito a los goblins. "Quédense donde están."

          Daren, Hadrik y yo caminamos despacio hacia los goblins hasta estar lo bastante cerca, y entonces Daren y yo sacamos nuestras armas. Sorprendemos a dos de los goblins, matándolos antes de que tengan tiempo de reaccionar, pero el tercer goblin entra en pánico y echa a correr. Cuando Hadrik va tras él, un carámbano vuela entre los árboles y se clava directo en la cabeza del monstruo, haciéndolo caer muerto en el acto.

          "¡Oye, buena puntería!", le dice Hadrik a Kate, mientras Melindra se acerca ahora para echar un mejor vistazo a los cadáveres de los goblins.

          "Siento aguarles la fiesta, pero estos goblins no parecen de forma realista parte del ejército de Tyrath", dice Melindra, tras mirar los cuerpos durante unos segundos. "Su equipo es demasiado básico, incluso para exploradores."

          "Entonces, si no trabajaban para Tyrath, ¿por qué razón nos siguieron durante tanto tiempo?", dice Daren.
      - source: scene_text_2
        paragraph: 17
        text: |-
          Melindra se encoge de hombros.

          "Supongo que nunca lo sabremos", dice Melindra. "Teniendo en cuenta que los mataron a todos antes de que pudiéramos preguntarles, claro."

          "Espera un momento...", digo. "Illuna, ¿no supondrás que esos goblins podrían haber formado parte del ejército de Fyron?"

          "Lo dudo mucho", dice Illuna. "No habrían tenido ningún motivo para alejarse tanto de su campamento principal si fueran tropas de Fyron. Lo más probable es que fueran unos goblins cualquiera, que no estaban vinculados ni al dragón ni al general goblin."

          "Bueno, sin importar para quién trabajaran, seguían siendo monstruos, así que casi seguro que no tramaban nada bueno", dice Daren. "No creo que tenga mucho sentido seguir dándole vueltas a esto. Lo hecho, hecho está. Deberíamos dirigirnos a la ciudad."

          "Sí...", dice Hadrik con un tono poco convencido, mientras todos volvemos a dirigirnos hacia la ciudad.

          Nos lleva un rato, pero cuando por fin terminamos de atravesar de nuevo la aldea, acabamos llegando a las puertas por segunda vez. El guardia de la entrada nos mira ahora con la misma expresión recelosa que tenía la primera vez, y nos habla en cuanto nos detenemos ante él.

          "Veo que han vuelto", dice el guardia. "¿Debo entender que por fin han conseguido que ese 'cliente' suyo les dé la contraseña?..."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch02a_ruckus
            condition: b3_ch2_infiltration = 3
          - set:
              current_scene: b3_ch02a_insane
            condition: b3_ch2_infiltration != 3
  - name: b3_ch02a_talk
    texts:
      - source: scene_text
        paragraph: 24
        text: |-
          "Creo que deberíamos ir a hablar con ellos y ver qué quieren", digo, también en voz baja. "Solo por ser goblins no significa necesariamente que formen parte del ejército de Tyrath."

          "¿Y si sí lo son?", dice Daren.

          "Entonces tendremos que ocuparnos de ellos según corresponda, supongo", digo. "Aun así, no veo por qué unos exploradores nos estarían llamando en voz alta en lugar de mantener las distancias, y dudo que quieran pelear con nosotros, ya que son demasiado débiles como para tener ninguna esperanza de vencer a nuestro grupo. Tampoco es como si hubieran tenido tiempo de preparar trampas, ya que acabamos de venir de ese bosque. Solo digo que no perdemos nada por ir a ver qué quieren. Además, sí dijeron que sabían algo sobre la contraseña..."

          "Bien...", dice Daren. "Supongo que pronto veremos si son hostiles o no. Pero asegúrense de mantenerse alerta. No sabemos qué trucos podrían tener bajo la manga."

          "Sí, sí...", digo, mientras todos empezamos a volver hacia el bosque.

          "¡Ya vamos!", les digo a los goblins. "¡Quédense justo donde están!"

          En cuanto volvemos a entrar en el bosque, vemos que los tres goblins que nos llamaron llevan una armadura de cuero de aspecto muy barato y que las armas que usan parecen estar en muy mal estado. El mayor de los tres goblins da ahora un paso al frente para presentarse.
      - source: scene_text_2
        paragraph: 18
        text: |-
          "Saludos, viajeros", dice el viejo goblin en lengua común, haciendo una breve reverencia. "Sé que están ocupados, así que intentaré ser breve. No pudimos evitar fijarnos en que antes tuvieron algunos problemas para entrar en la ciudad, y pensamos que podríamos ofrecerles información valiosa sobre la contraseña que necesitan, a cambio de uno de los objetos que llevan encima."

          "Primero lo primero", dice Daren. "¿Trabajan para Tyrath o no?"

          "¿El rey de todos los dragones?...", dice el viejo goblin. "No, nunca hemos formado parte de su ejército."

          "Entonces están con Fyron, ¿no?", le pregunto.

          "No, viajamos solos", dice el viejo goblin. "La razón por la que vinimos aquí, a esta ciudad, es que sabemos con certeza que aceptan goblins dentro de sus murallas, junto con otras razas monstruosas humanoides, así que queríamos ver si podíamos pedir refugio dentro de sus fronteras."

          "¿Ah, sí?", dice Daren. "Si ese es el caso, entonces ¿por qué nos han estado siguiendo desde esta mañana? ¿Por qué no se dirigieron directamente a Ollendor mientras todavía estábamos acampando?"
      - source: scene_3
        paragraph: 8
        text: |-
          Los goblins intercambian unas miradas antes de que el viejo goblin vuelva a hablar.

          "Los seguimos porque vimos a su compañera de allí recoger unas rocas en la orilla de un río", dice el viejo goblin, señalando a Melindra. "El problema es que un amigo nuestro tenía que escribir la contraseña necesaria para entrar en Ollendor en una de esas rocas, pero creemos que su amiga pudo llevársela por error. Por eso nos gustaría compartir con ustedes cierta información sobre la contraseña a cambio de esa roca."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch02a_unfortunate
            condition: b3_ch1_password = 0
          - set:
              current_scene: b3_ch02a_dialect
            condition: b3_ch1_password = 1
  - name: b3_ch02a_unfortunate
    texts:
      - source: scene_text
        paragraph: 25
        text: |-
          "Ninguna de las rocas que recogí tenía nada escrito, ni en lengua común ni en lengua goblin", dice Melindra. "No entiendo la lengua goblin, pero estoy bastante segura de que sabría reconocer el aspecto de su escritura, y no vi nada parecido en ninguna de las piedras que recogí."

          "¿Podrías quizá darnos tus rocas para que nosotros también les echemos un vistazo?", dice el viejo goblin. "Si las miramos con más atención, es posible que encontremos algo que se te haya pasado."

          "Intenta tocar una sola de mis rocas, y usaré una cuchilla de viento para partirte en dos", dice Melindra, con una sonrisa amable.

          "Ya veo...", dice el viejo goblin, intentando conservar la calma. "Bueno, entonces quizá podrías sostenerlas tú misma e ir enseñándonoslas una por una, ¿no?"

          "No, no voy a hacer eso", dice Melindra, todavía sonriendo.

          "Eso es desafortunado", dice el viejo goblin. "En ese caso, me temo que ya no es posible llegar a ningún trato. Lamentamos haberles hecho perder el tiempo. Por supuesto, estaremos esperándolos aquí por si cambian de opinión."

          "¿Eso es todo?", pregunta Daren. "¿No van a intentar robarnos la roca?"

          "¡Santos dioses, claro que no!", dice el viejo goblin. "¡No somos salvajes!"
      - source: scene_text_2
        paragraph: 19
        text: |-
          "Vaya...", dice Daren. "Bueno, si ya no tienen nada que tratar con nosotros, supongo que seguiremos nuestro camino."

          "¡Hasta luego!", dice el viejo goblin, y entonces todos volvemos hacia la carretera principal.

          "Vaya, menuda pérdida de tiempo acabó siendo eso, ¿eh?", dice Hadrik, cuando ya estamos fuera del alcance auditivo de los goblins. "Esperemos que al menos nuestro plan para entrar en la ciudad tenga un poco más de éxito."

          Nos lleva un rato, pero cuando por fin terminamos de atravesar de nuevo la aldea, acabamos llegando a las puertas por segunda vez. El guardia de la entrada nos mira ahora con la misma expresión recelosa que tenía la primera vez, y nos habla en cuanto nos detenemos ante él.

          "Veo que han vuelto", dice el guardia. "¿Debo entender que por fin han conseguido que ese 'cliente' suyo les dé la contraseña?..."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch02a_ruckus
            condition: b3_ch2_infiltration = 3
          - set:
              current_scene: b3_ch02a_insane
            condition: b3_ch2_infiltration != 3
  - name: b3_ch02a_dialect
    texts:
      - source: scene_text
        paragraph: 26
        text: |-
          "Ninguna de las rocas que recogí tenía nada escrito, ni en lengua común ni en lengua goblin", dice Melindra. "No entiendo la lengua goblin, pero estoy bastante segura de que sabría reconocer el aspecto de su escritura, y no vi nada parecido en ninguna de las piedras que recogí."

          "¿Podrías quizá darnos tus rocas para que nosotros también les echemos un vistazo?", dice el viejo goblin. "Si las miramos con más atención, es posible que encontremos algo que se te haya pasado."

          "Intenta tocar una sola de mis rocas, y usaré una cuchilla de viento para partirte en dos", dice Melindra, con una sonrisa amable.

          "Ya veo...", dice el viejo goblin, intentando conservar la calma. "Bueno, entonces quizá podrías sostenerlas tú misma e ir enseñándonoslas una por una, ¿no?"

          "No, no voy a hacer eso", dice Melindra, todavía sonriendo.

          "Un momento, Melindra", digo. "Sé con total seguridad que vi unas palabras escritas en lengua goblin en una de tus rocas. Estaban en una de las rocas que le estabas enseñando a Flower poco antes de que llegáramos a la ciudad."

          "¿Ah, sí?", dice Melindra con expresión desconcertada. "¿Cuál?"
      - source: scene_text_2
        paragraph: 20
        text: |-
          "Mmm, creo que la roca era algo morada y cabía fácilmente en la palma de la mano", digo. "Los grabados eran bastante pequeños, pero podían verse si mirabas con atención."

          "Mmm...", dice Melindra, quitándose la mochila y sacando de ella una pequeña roca morada. "¿Esta?"

          Luego estira el brazo hacia mí para que pueda ver mejor la roca que sostiene en la mano.

          "¡Sí, esa es!", digo. "¿Ves esos arañazos raros de allí? Esos son símbolos de un dialecto antiguo de la lengua goblin."

          "¡Oooh, era un dialecto antiguo!", dice Melindra, examinando bien la roca en su mano. "Eso explicaría por qué no reconocí que era una forma de escritura. Mis disculpas, entonces. Toma, puedes quedarte con la roca, si originalmente era tuya."

          Luego le entrega la roca al viejo goblin, y este empieza a estudiarla de cerca.

          "Oh, ya entiendo...", dice el viejo goblin. "Parece que la contraseña de esta semana es 'alas de gárgola'. Gracias. Eso era todo lo que necesitábamos saber."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch02a_dialect2
  - name: b3_ch02a_dialect2
    routes:
      - condition: b3_ch2_infiltration = 0
        texts:
          - source: scene_text
            paragraph: 27
            text: |-
              "¿Cómo que 'alas de gárgola'?...", le pregunto, confundido. "¿No dice esa escritura 'pico de grifo'?"

              "Ah... ¡veo que puedes leer nuestro dialecto antiguo!", dice el viejo goblin, sorprendido. "¡Muy impresionante! En cuanto a tu pregunta, los símbolos que describen la contraseña sí pueden traducirse directamente como 'pico de grifo', pero tenemos un código con nuestro amigo que siempre usamos cuando nos transmitimos mensajes. Si reordenamos esos símbolos según nuestro código secreto, el significado cambia por completo y pasa a leerse como 'alas de gárgola'. ¿Lo entiendes ahora?"

              "Sí, supongo que tiene sentido", digo. "Entonces, ¿esa era la información que querían darnos a cambio de la roca?"

              "No, en realidad la información en cuestión era que la contraseña no es lo único que hace falta si quieren entrar en la ciudad", dice el viejo goblin. "También tienen que guiñar tres veces el ojo izquierdo mientras la dicen, o no los dejarán entrar. Eso se añadió hace un tiempo como precaución extra, para evitar que la gente escuche a escondidas. Las contraseñas cambian cada semana, pero que yo sepa la cantidad de guiños no cambia."
          - source: scene_text_2
            paragraph: 21
            text: |-
              "Eso sí que no lo sabíamos...", digo. "Lo tendremos en cuenta. ¡Gracias!"

              "Mmm... ¡disculpen!", les dice Melindra a los goblins, adoptando esta vez una de sus sonrisas más agradables. "¿Les interesaría quizá cambiarme esa roca morada con garabatos? Le he tomado mucho cariño y me daría pena perderla de mi colección."

              "¿Perdón?...", dice el viejo goblin, recordando de repente la roca que todavía sostenía en la mano. "Oh, pueden recuperar la roca. Lo único que necesitábamos de ella era la contraseña."

              "¡Qué generoso por su parte!", dice Melindra, mientras el goblin le devuelve la roca. "¡Muchas gracias!"

              "Bueno, ahora que nuestros asuntos están resueltos, creo que ha llegado el momento de dirigirnos a la ciudad", dice el viejo goblin. "Puede que no sea la mejor idea que vayamos todos a la vez, eso sí, porque podríamos parecer sospechosos. Pueden ir ustedes primero, si quieren, y nosotros los seguiremos poco después."
        choices:
          - position: 1
            text: Suena bien. ¡Vamos!
            effects:
              - set:
                  current_scene: b3_ch02a_trouble
                  b3_ch2_goblins: 3
          - position: 2
            text: No pasa nada, no tenemos prisa. Mejor vayan ustedes primero.
            effects:
              - set:
                  current_scene: b3_ch02a_trouble
                  b3_ch2_goblins: 4
