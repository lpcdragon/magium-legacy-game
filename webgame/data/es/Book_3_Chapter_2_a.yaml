        paragraph: 18
        text: |-
          "Para que lo sepan...", dice Melindra. "No voy a usar ninguno de mis poderes para atacar a los gólems. El riesgo de golpear por accidente a alguno de ustedes o a uno de los guardias de la ciudad con mis hechizos es demasiado grande. Puede que vuelva a lanzarle el hechizo de vuelo a Barry, pero nada más."

          "¡No pasa nada!", dice Hadrik. "Yo seré quien más se centre en los gólems, de todos modos. Al fin y al cabo, no podré atacar a ninguno de los lugareños, así que es lo mínimo que puedo hacer para ser útil. El resto de ustedes debería concentrarse en entrar a salvo en la ciudad, mientras yo capto toda la atención de los gólems."

          "¡Genial!", digo. "En ese caso, los que sí podamos atacar a los lugareños nos encargaremos de los guardias de la ciudad. Si Melindra me lanza ese hechizo de vuelo, hasta podría intentar librarnos de algunos de los guardias apostados en las murallas, para que no tengamos que preocuparnos por defendernos desde demasiadas direcciones."

          "Van a arrastrarme a su plan diga yo lo que diga, ¿verdad?", dice Daren con tono resignado.

          "¡Ja!", dice Arraka. "Ahora sabes lo que se siente cuando ignoran tu opinión una y otra vez. ¿Recuerdas cuando ayer sugerí que Flower lanzara bolas de fuego por encima de sus murallas para que quemáramos sus casas y los ahumáramos como a las ratas que son, pero nadie me prestó atención? Si me hubieras apoyado entonces, quizá ahora tendrías mi voto de confianza, pero ya es demasiado tarde. ¡Dejaste pasar tu oportunidad!"
      - source: scene_text_2
        paragraph: 13
        text: |-
          "Bromas aparte, aquí vamos a necesitar un voto unánime", dice Hadrik. "Todos estamos poniendo nuestras vidas en juego, así que cualquiera que no esté completamente de acuerdo con este plan debería pensárselo un poco, porque una vez crucemos esas puertas no habrá vuelta atrás. Tal vez deberíamos hacer una pequeña pausa para despejarnos, y luego seguiremos la discusión donde la dejamos. Estoy seguro de que al final encontraremos un plan con el que todos estén de acuerdo."

          Todos seguimos el consejo de Hadrik y nos tomamos un pequeño descanso, para darnos algo de tiempo para evaluar la situación con más calma. Al final conseguimos convencer a Daren de seguir adelante con nuestro plan, aunque seguía algo reacio. Eso sí, tuvimos que prometerle que haríamos todo lo posible por evitar cualquier derramamiento de sangre innecesario y que intentaríamos evitar matar a los guardias de la ciudad en la medida de lo posible, ya que no era culpa suya verse obligados a obedecer las órdenes de su rey y solo estaban cumpliendo con su trabajo de defender su ciudad de invasores.

          Una vez todos estamos de acuerdo con nuestro curso de acción, empezamos a salir del bosque para volver a la carretera principal. Sin embargo, poco después de haber llegado al camino que atraviesa la aldea, oímos una voz desconocida llamándonos desde dentro del bosque.
