          - source: scene_text_2
            paragraph: 33
            text: |-
              Mi golpe fue lo bastante potente como para tumbar al gólem de espaldas, aunque por muy poco, y aun así tuve que contener el dolor de golpear esa dura superficie metálica con el puño desnudo. No pierdo ni un segundo: saco la daga, salto sobre la cara del gólem y le clavo el arma en uno de los ojos con toda la fuerza que puedo. El constructo de metal emite unos ruidos muy extraños y no consigue volver a incorporarse, lo que me hace pensar que mis ataques están funcionando, así que saco la daga de la cuenca y también le apuñalo el otro ojo. Viendo que el gólem sigue sin estar muerto, retuerzo la hoja un poco más fuerte por dentro, hasta que mi oponente deja de moverse por completo.

              Cuando me giro para ver qué hacen los demás, noto que Hadrik ya se ha encargado del gólem de las puertas y ahora corre hacia otro de los restantes. Como solo quedan dos gólems en nuestra zona aparte del que está enfrentando Hadrik, decido sacar la ballesta e ir a distraerlos, para darles a Daren, Kate, Leila y Melindra tiempo suficiente para llegar a salvo a las puertas.
          - source: scene_3
            paragraph: 12
            text: |-
              En cuanto me acerco lo suficiente a los dos gólems, les disparo a ambos con mi ballesta, lo que hace que de inmediato dejen de atacar la barrera de Daren y se concentren en mí. Al ver que ya no están siendo objetivo de ninguno de los haces de fuego, Daren y los demás aprovechan rápidamente esta oportunidad para echar a correr hacia las puertas de la ciudad, mientras Hadrik consigue rematar a otro de los gólems y pasa ahora al cuarto.

              Por desgracia, parece que mientras estábamos ocupados con los pocos gólems que estaban lo bastante cerca como para enfrentarse a nosotros de inmediato, alrededor de una docena más de grandes gólems que oyeron el alboroto han ido acercándose lentamente, y pronto estarán dentro del alcance de sus ataques de haz.

              "¡Por aquí!", nos grita Daren en cuanto él y los demás alcanzan las puertas. "¡Dejen a los gólems y vengan! ¡Rápido, antes de que lleguen los otros!"
