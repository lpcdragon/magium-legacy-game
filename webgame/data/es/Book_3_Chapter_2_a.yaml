  - name: b3_ch02a_eavesdrop
    texts:
      - source: scene_text
        paragraph: 19
        text: |-
          "Podría intentar escuchar a alguien desde lejos", digo. "Seguro que algún aldeano tendrá que entrar en la ciudad tarde o temprano."

          "¡En realidad es una idea muy buena!", dice Daren. "Pero ¿a qué distancia tendrías que estar para oír bien las palabras? ¿Puedes oír al guardia de las puertas hablar desde aquí? Porque no podemos dejarte merodeando sin rumbo por la aldea hasta que a alguien le apetezca entrar en la ciudad. Parecerías demasiado sospechoso."

          "No pasa nada", digo. "No necesitaré entrar en la aldea, porque desde dentro del bosque puedo oír de qué habla la mayoría de los aldeanos. Suelo ignorar las voces de fondo porque es demasiado difícil concentrarse en lo que dice cada persona por separado, pero si me concentro muchísimo debería poder notar si alguien planea ir hacia las puertas de la ciudad, y entonces podré acercarme un poco más."

          "Bueno, no te esfuerces demasiado", dice Daren. "No querríamos que te cansaras antes siquiera de empezar a infiltrarnos en la ciudad."

          "Sí, lo sé", digo. "No me pasaré. Vuelvo enseguida. Intentaré llegar lo más cerca posible del borde del bosque, para poder oír el mayor número posible de conversaciones de los aldeanos."
      - source: scene_text_2
        paragraph: 14
        text: |-
          Entonces camino hasta el borde del bosque y me escondo detrás de uno de los árboles, asegurándome de que nadie de la aldea pueda verme. Paso los siguientes minutos intentando concentrarme en oír lo que dice cada persona por separado, aunque con tanta gente hablando al mismo tiempo no es una tarea nada fácil. La mayoría de las conversaciones son sobre cosas mundanas, que no me sirven de nada, aunque no puedo evitar fijarme en que casi todos hablan con un tono muy cansado y en que casi todos parecen tener una actitud muy pesimista, sin importar el tema.

          A veces, algún marido aislado desahoga con su esposa su frustración hacia el rey o hacia los guardias de la ciudad, pero luego se calla de repente por miedo a que alguien pueda oírlo. Por lo demás, las conversaciones de los aldeanos giran sobre todo en torno a sus actividades cotidianas, y no hablan realmente de mucho más.
    effects:
