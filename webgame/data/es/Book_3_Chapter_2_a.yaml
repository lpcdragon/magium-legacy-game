  - name: b3_ch02a_smash
    texts:
      - source: scene_text
        paragraph: 17
        text: |-
          "Si soy sincero, estoy de acuerdo con Hadrik", digo. "Deberíamos atravesar sus puertas principales por la fuerza. Como él dijo, al menos así tendríamos el factor sorpresa. Si volvemos y le decimos al guardia la contraseña después de no saberla la primera vez, solo vamos a parecernos aún más sospechosos. No me sorprendería que ese tipo nos dejara entrar solo para atraernos a una trampa."

          "¡Sí, exacto!", dice Hadrik. "¡Eso es lo que pensaba! ¿Ves? ¡Barry lo entiende!"

          "¿Se les está olvidando a ustedes esos gólems gigantes que escupen fuego y patrullan frente a las murallas de la ciudad?...", dice Daren.

          "Vamos...", dice Hadrik. "No son más que gólems de metal. ¿Qué tan resistentes pueden ser? Por muy dura que sea su piel de metal, con mi fuerza podría mandarlos a volar de un puñetazo, y esos haces de fuego que lanzaban por la boca eran claramente fuego mágico, así que Daren podría tanto defendernos de ellos con su escudo como absorber las llamas con su espada. Y mientras estuviéramos escondidos dentro de la barrera mágica de Daren, los dos podríamos devolverles sus llamas, mientras Kate, Flower e Illuna les lanzarían su propia magia elemental."
      - source: scene_text_2
        paragraph: 12
        text: |-
          "Te das cuenta de que esos gólems seguramente llevan armadura anti-magia, ¿verdad?", dice Daren.

          "Si tuviera tiempo suficiente para reforzar bien mis carámbanos, probablemente podría atravesar su armadura incluso si tiene protección anti-magia", dice Kate. "Además, el impacto de las bolas de fuego de Flower y de los chorros de agua de Illuna todavía puede hacerles un daño razonable, incluso contra armadura anti-magia. Además, no es como si necesitáramos contenerlos mucho tiempo. Una vez que entremos en la ciudad estoy segura de que los gólems no podrán seguirnos, porque causarían demasiados destrozos y pondrían en riesgo la vida de los civiles."

          "¡Entonces queda decidido!", dice Hadrik. "Lo primero que haré será destruir las puertas, y luego avanzaremos despacio hacia la entrada mientras nos escondemos bajo la protección de la barrera mágica de Daren. Daren, aún puedes moverte mientras mantienes la barrera levantada, ¿no?"

          "Sí, pero tendríamos que movernos muy despacio...", dice Daren. "De lo contrario el hechizo de protección se rompería, y tendría que lanzarlo otra vez. ¡Pero sigo sin decir que esté de acuerdo con nada de esto!"
