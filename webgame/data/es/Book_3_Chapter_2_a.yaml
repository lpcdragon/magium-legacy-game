  - name: b3_ch02a_rubble
    texts:
      - source: scene_text
        paragraph: 45
        text: |-
          Illuna, Hadrik y yo hacemos exactamente lo que dice Daren, y nos dirigimos hacia las puertas tan rápido como podemos. Casi inmediatamente después de pasar junto a las grandes puertas destrozadas, los dos gólems que siguen cerca de nosotros disparan sus haces al mismo tiempo, mientras Daren prepara su escudo y crea otra barrera. Los dos haces de fuego chocan entre sí y crean otra gran explosión, haciendo que algunos escombros salgan disparados hacia nosotros, pero Hadrik se encarga enseguida de ellos con unos cuantos puñetazos.

          A medida que seguimos adentrándonos en la ciudad, los gólems parecen haber abandonado la persecución, probablemente para no arriesgarse a causar demasiados daños colaterales a los habitantes del pueblo con sus devastadores ataques.

          "¿Y ahora qué?", nos pregunta Kate, mientras pasamos junto a varios grupos de ciudadanos asustados que aparentemente se acercaron a las puertas para ver de qué iba todo aquel alboroto. "¿Buscamos un sitio donde escondernos o seguimos avanzando?"

          "Teniendo en cuenta que ya hemos llegado hasta aquí, probablemente sea mejor idea ir directamente al palacio", dice Daren. "Cuanto más esperemos, más tiempo les damos para organizarse. Melindra, ¿sabes en qué dirección general debería estar el palacio?"

          "Sí", dice Melindra. "Si el trazado de la ciudad sigue siendo el mismo que antes de que me desterraran, la ruta más corta sería pasar por la plaza Perrelion. Síganme."
      - source: scene_text_2
        paragraph: 34
        text: |-
          Melindra toma la delantera y todos vamos tras ella, mientras cada vez más ciudadanos curiosos salen de sus casas y se dirigen hacia la entrada de la ciudad para ver qué ha pasado. En cambio, la gente que vuela en los vehículos metálicos sobre la ciudad parece ir a lo suyo, y no le presta ninguna atención a lo que ocurre debajo.

          "Leila, ¿tienes alguna forma de comunicarte con tu padre?", dice Daren. "¿Puedes hacerle saber que estamos aquí?"

          "No...", escribe Leila. "No llevaba ningún objeto encima cuando escapábamos juntos de Thilias, así que no puedo llamarlo por un transceptor. Antes de que nos separáramos, me prometió que cuando llegara a Ollendor encontraría la manera de contactar conmigo pasara lo que pasara, pero no sé cuánto tardará en enterarse de que he llegado."

          "No te preocupes", dice Daren. "Con todo el alboroto que vamos a montar dentro de la ciudad en breve, estoy seguro de que terminará encontrándonos."

          "¡Esperemos que tengas razón!", escribe Leila.

          A medida que avanzamos por la ciudad, me doy cuenta de que la mayoría de las casas tienen un estilo arquitectónico muy extraño, distinto al de la mayoría de los edificios normales que esperarías ver en una ciudad típica. Algunas casas tienen más de cuatro pisos y están construidas con forma ovalada. Algunas están hechas enteramente de vidrio. Otras son de metal, recubiertas de polvo de seredium. Es bastante difícil encontrar dos casas que se vean exactamente igual, y varios de los edificios sinceramente parecen diseñados por alguien que simplemente estaba divirtiéndose.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch02b_weird
              storyboard_controls: Jump to frame "Book 3 Chapter 2 b"
