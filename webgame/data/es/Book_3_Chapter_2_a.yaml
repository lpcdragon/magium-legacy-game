              "Leila tiene razón", dice Illuna. "Podríamos intentar sobornar a uno de los aldeanos. Me imagino que no debería ser demasiado difícil encontrar a alguien dispuesto a romper las reglas por algo de dinero extra en una aldea llena de gente empobrecida."

              "No es tan fácil como crees", dice Melindra. "Esta ciudad no es como Thilias. Aquí romper la ley bien puede hacer que asesinen a toda tu familia, o algo peor. La mayoría de la gente no correría ese riesgo, sin importar cuánto dinero hubiera en juego."
