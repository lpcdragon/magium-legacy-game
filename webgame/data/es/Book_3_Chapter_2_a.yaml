            paragraph: 27
            text: |-
              "¿Cómo que 'alas de gárgola'?...", le pregunto, confundido. "¿No dice esa escritura 'pico de grifo'?"

              "Ah... ¡veo que puedes leer nuestro dialecto antiguo!", dice el viejo goblin, sorprendido. "¡Muy impresionante! En cuanto a tu pregunta, los símbolos que describen la contraseña sí pueden traducirse directamente como 'pico de grifo', pero tenemos un código con nuestro amigo que siempre usamos cuando nos transmitimos mensajes. Si reordenamos esos símbolos según nuestro código secreto, el significado cambia por completo y pasa a leerse como 'alas de gárgola'. ¿Lo entiendes ahora?"

              "Sí, supongo que tiene sentido", digo. "Entonces, ¿esa era la información que querían darnos a cambio de la roca?"

              "No, en realidad la información en cuestión era que la contraseña no es lo único que hace falta si quieren entrar en la ciudad", dice el viejo goblin. "También tienen que guiñar tres veces el ojo izquierdo mientras la dicen, o no los dejarán entrar. Eso se añadió hace un tiempo como precaución extra, para evitar que la gente escuche a escondidas. Las contraseñas cambian cada semana, pero que yo sepa la cantidad de guiños no cambia."
