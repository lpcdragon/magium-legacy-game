  - name: b3_ch02a_communicating
    texts:
      - source: scene_text
        paragraph: 31
        text: |-
          "¿Y ahora qué?", nos pregunta Kate, después de adentrarnos un poco en la ciudad. "¿Vamos a hacer un poco de reconocimiento o deberíamos ir directamente al palacio?"

          "Estoy seguro de que tendremos muchas oportunidades de estudiar sus defensas de camino al castillo", dice Daren. "Dado que en realidad no sabemos cuándo volverá el embajador, no creo que debamos perder tiempo explorando la ciudad. Melindra, ¿sabes en qué dirección general debería estar el palacio?"

          "Sí", dice Melindra. "Si el trazado de la ciudad sigue siendo el mismo que antes de que me desterraran, la ruta más corta sería pasar por la plaza Perrelion. Síganme."

          Melindra toma la delantera y todos la seguimos, mientras tanto los ciudadanos que van por tierra como los que vuelan en los vehículos metálicos sobre nosotros siguen tranquilamente con sus vidas, sin prestarnos demasiada atención.

          "Leila, ¿tienes alguna forma de comunicarte con tu padre?", dice Daren. "¿Puedes hacerle saber que estamos aquí?"
      - source: scene_text_2
        paragraph: 26
        text: |-
          "No...", escribe Leila. "No llevaba ningún objeto encima cuando escapábamos juntos de Thilias, así que no puedo llamarlo por un transceptor. Antes de que nos separáramos, me prometió que cuando llegara a Ollendor encontraría la manera de contactar conmigo pasara lo que pasara, pero no sé cuánto tardará en enterarse de que he llegado."

          "No te preocupes", dice Daren. "Con todo el alboroto que vamos a montar dentro de la ciudad en breve, estoy seguro de que terminará encontrándonos."

          "¡Esperemos que tengas razón!", escribe Leila.

          A medida que avanzamos por la ciudad, me doy cuenta de que la mayoría de las casas tienen un estilo arquitectónico muy extraño, distinto al de la mayoría de los edificios normales que esperarías ver en una ciudad típica. Algunas casas tienen más de cuatro pisos y están construidas con forma ovalada. Algunas están hechas enteramente de vidrio. Otras son de metal, recubiertas de polvo de seredium. Es bastante difícil encontrar dos casas que se vean exactamente igual, y varios de los edificios sinceramente parecen diseñados por alguien que simplemente estaba divirtiéndose.
    choices:
