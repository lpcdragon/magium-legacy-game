    routes:
      - condition: b3_ch2_infiltration = 0
        texts:
          - source: scene_text
            paragraph: 33
            text: |-
              "Sí, al final conseguimos dar con él por el transceptor y nos dijo la contraseña", digo. "Es 'alas de gárgola'. "

              "¿Estás diciendo que la contraseña es 'alas de gárgola'?", dice el guardia. "¿Estás seguro de eso?"

              "Eh, sí...", digo. "¡Sí, claro!"

              "Muy bien, entonces", dice el guardia. "Todos quedan arrestados. Los mantendremos en una celda hasta que aparezca ese misterioso cliente suyo y confirme que él los invitó aquí. Si no aparece en unas semanas, serán ejecutados por intentar infiltrarse ilegalmente en la ciudad."

              "¡¿Qué?!", digo. "¡Pero te dimos la contraseña!"

              "Esa no es la contraseña completa", dice el guardia. "También tenían que guiñar varias veces mientras decían las palabras. Es una medida que hemos tomado contra la gente que intenta escuchar a escondidas. No sé si de verdad tenían un cliente o no, pero quebrantar nuestras leyes no es algo que deba tomarse a la ligera. Ahora síganme. Espero que no sean lo bastante estúpidos como para resistirse al arresto en esta situación."

              En cuanto el guardia se gira para llevarnos dentro de la ciudad, Hadrik mira a Daren, que le responde con un breve asentimiento.

              "Oye, espera un segundo", dice Daren, poniéndole una mano en el hombro al guardia. "Creo que aún hay algo que quizá no has tenido en cuenta."
          - source: scene_text_2
            paragraph: 28
            text: |-
              "¿Ah, sí?", dice el guardia, volviéndose hacia Daren. "¿Como qué?"

              Justo cuando el guardia se gira, Hadrik sale corriendo junto a él y se dirige hacia uno de los dos grandes gólems apostados a unos cuantos metros delante de las puertas.

              En cuanto está lo bastante cerca, Hadrik salta muy alto y, con un fuerte puñetazo en la cara, tumba a uno de los gólems y lo manda volando contra las grandes puertas que tiene detrás. Las hojas no soportan el impacto del choque y saltan de sus bisagras, pero ahora el gran gólem que ha caído sobre ellas se esfuerza por volver a levantarse. Hadrik no le da tiempo a recuperarse y salta enseguida sobre su enorme cabeza, descargándole una rápida ráfaga de puñetazos hasta que el gólem gigante de metal deja de moverse por completo.

              "¡¿Se han vuelto completamente locos?!", nos grita el guardia, pero antes de que pueda decir nada más, Daren lo golpea en la cabeza con el escudo y lo deja inconsciente.

              "¡Todos, dentro de mi barrera, ahora!", dice Daren.

              Entonces levanta su escudo, y una barrera mágica semitransparente aparece a nuestro alrededor. Varios de los gólems que estaban más lejos ya se han dado cuenta de que algo va mal, y todos se preparan para dispararnos sus haces de fuego por la boca al unísono.

              "Prepárense", dice Daren. "Va a hacer calor."
