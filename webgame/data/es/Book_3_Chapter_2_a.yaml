chapter_effects:
  - condition: current_scene = "b3_ch02a_resort" AND warning.text is empty
    effects:
      - warning:
          text: La estadística de audición no es lo suficientemente alta
scenes:
  - name: b3_ch02a_intro
    texts:
      - source: scene_text
        paragraph: 2
        text: |-
          "Muy bien, Melindra", dice Daren, después de que todos volvamos a retirarnos al bosque para tener otra reunión de estrategia. "Creo que ahora sería un buen momento para que nos cuentes todo lo que sabes sobre las defensas de Ollendor. Somos todo oídos."

          "¡Bien!", dice Melindra. "Aunque, para ser sincera, en realidad no sé mucho más que ustedes. No he pasado tanto tiempo en Ollendor, y ya hace bastantes años que fui exiliada de este continente, así que puede que muchas cosas hayan cambiado desde entonces."

          "Ah, claro, casi había olvidado que esa era la razón por la que querías muerto al rey de Ollendor", dice Hadrik. "¿Qué hiciste para que te expulsaran de Varathia, al fin y al cabo? ¿No dijiste que naciste aquí?"

          "Eso es... un asunto personal", dice Melindra. "Preferiría no hablar de ello, salvo que sea absolutamente necesario."

          "Mmm...", dice Daren. "Sigo sin poder evitar pensar que hay algo importante que no nos estás contando sobre tu razón para volver aquí. No pareces la clase de persona que pasaría por todos estos problemas solo por una venganza mezquina. Tiene que haber otra razón por la que querrías matar al rey de esta ciudad."

          "Tienes razón", dice Melindra. "Hay otra razón. En pocas palabras, el rey de Ollendor me ha robado algo muy importante y lo quiero de vuelta. Sin embargo, eso no es algo de lo que deban preocuparse. Lo único que tienen que hacer es ayudarme a matarlo. Del resto me encargaré yo sola."
      - source: scene_text_2
        paragraph: 2
        text: |-
          "Ya veo...", dice Daren. "Bueno, mientras cumplas tu parte del trato, procuraremos no entrometernos en tus asuntos, entonces. Sean los que sean..."

          "¿Y qué hay de las defensas de Ollendor?", dice Kate. "¿No recuerdas nada que pueda servirnos? ¿Quizá alguna debilidad poco conocida que al menos nos ayude a enfrentarnos a esos gólems?"

          "Lo único que sé es que todos estos avances tecnológicos son relativamente recientes", dice Melindra. "Hace unas décadas, el rey se alió con un lessathi renegado, y gracias a él consiguieron convertir aquellas viejas ruinas lessathi en algo funcional. Esos gólems de metal que vieron fuera también fueron diseñados por él. La razón por la que quería que los vieran con sus propios ojos antes de hacer nuestros planes para infiltrarnos en la ciudad era porque quería que se tomaran en serio sus defensas. No podemos permitirnos simplemente atravesar por la fuerza sus puertas principales y abrirnos paso peleando. Tenemos que mantener un perfil bajo durante el mayor tiempo posible. Dicho esto, es casi seguro que tendremos que abrirnos paso peleando para salir después de asesinar a su rey, así que también deberían prepararse mentalmente para nuestro inevitable enfrentamiento con esos gólems cuando escapemos de la ciudad."
    effects:
      - set:
          successful_checks:
            - 'Punto de control alcanzado: Partida guardada.'
        condition: checkpoint_rich = 1
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch02a_intro2
              checkpoint_rich: 0
  - name: b3_ch02a_intro2
    texts:
      - source: scene_text
        paragraph: 3
        text: |-
          "¿Pero cómo se supone que vamos a escabullirnos junto a esos gólems si siempre están patrullando fuera de las murallas?", pregunta Daren. "¿Ven peor de noche o algo así?"

          "¡No, pero no hace falta que nos escabullamos junto a ellos!", dice Melindra. "Podemos entrar por la puerta principal como cualquiera. Diremos que vinieron aquí a comerciar con algunas de sus mercancías encantadas, y que el resto somos sus guardaespaldas o algo así. Eso debería bastar para que los guardias de la entrada nos dejen pasar. Y mi exilio se mantuvo en secreto para todos salvo para los asesores de mayor confianza del rey, así que no deberíamos preocuparnos de que los guardias no me dejen entrar por mi culpa."

          "Creo que quizá te estás olvidando del pequeño detalle de que matamos al conde de Ollendor allá en Thilias", dice Hadrik. "Ya sé que técnicamente cumplimos nuestra condena con lo de la arena y que tenemos los papeles de Golmyck para demostrarlo, pero algo me dice que eso no va a impedir precisamente que el rey de esta ciudad nos ejecute por asesinar a su hermano."
      - source: scene_text_2
        paragraph: 3
        text: '"¡No los ejecutará si ni siquiera sabe todavía que su hermano ha muerto!", dice Melindra. "Créanme, si el rey supiera de la muerte del conde, todo el pueblo estaría de luto. Esas murallas estarían cubiertas de estandartes negros y habría retratos de la cara del conde en carteles por toda la pequeña aldea que hay fuera de la ciudad. Teniendo en cuenta lo normal que parece estar todo, creo que es seguro asumir que el embajador todavía no ha enviado a ninguno de sus emisarios para informarle al rey de la muerte de su hermano, y que quería dársela en persona cuando regresara. Solo que nosotros llegamos antes, porque tomamos un atajo por los bosques infestados de monstruos. Probablemente pase al menos otro día antes de que el embajador alcance la ciudad por el camino normal, así que hasta entonces no serán más que unos participantes cualquiera del torneo, y no deberían despertar ninguna sospecha."'
    choices:
      - position: 1
        text: ¿Pero de verdad van a dejar que un grupo de extraños armados entre tan fácilmente en la ciudad?
        effects:
          - set:
              current_scene: b3_ch02a_bunch
      - position: 2
        text: ¿Qué haremos si no se creen nuestra historia?
        effects:
          - set:
              current_scene: b3_ch02a_story
  - name: b3_ch02a_bunch
    texts:
      - source: scene_text
        paragraph: 4
        text: |-
          "¿Pero de verdad van a dejar que un grupo de extraños armados entre tan fácilmente en la ciudad?"

          "¿Y por qué no?", dice Melindra. "Desde su punto de vista, la mayoría de ustedes ni siquiera debería poder hacerle daño a los lugareños por el hechizo de protección del torneo, ¿recuerdan? Como todavía no descubrieron que ustedes mataron al hermano del rey, no sabrán que pueden saltarse los efectos del hechizo de protección. No tienen ningún motivo para temerles."

          "Bueno, supongo que merece la pena probar el plan de Melindra", dice Daren. "Al fin y al cabo, es la que mejor conoce esta ciudad. Pero recuerden mantenerse alerta. Si las cosas se descontrolan, puede que tengamos que abrirnos paso por la fuerza, así que todos deberían estar preparados para el peor escenario posible. Melindra, ¿hay algo más que debamos saber antes de empezar a dirigirnos hacia la ciudad?"
      - source: scene_text_2
        paragraph: 4
        text: |-
          "Sí", dice Melindra. "Deberían decirle al guardia de las puertas de la ciudad que alguien de dentro los invitó a Ollendor. Así deberían dejarnos entrar más rápido. Si pregunta quién los invitó, solo díganle que su cliente quiere mantener el anonimato. A menos que hayan endurecido la seguridad con los años, esto debería ser más que suficiente para conseguirnos la entrada a la ciudad. ¡Ah, y otra cosa! Mientras nos acerquemos a la ciudad, todos deberíamos procurar hablar en voz baja, para que la gente de la aldea no pueda oírnos. De hecho, quizá sería mejor que no habláramos en absoluto, salvo que sea absolutamente necesario. Los aldeanos y la gente de la ciudad viven aterrorizados por su rey loco, y nos delatarían de inmediato si descubrieran nuestras verdaderas razones para querer infiltrarnos en la ciudad. Recuerden que aquí estamos en territorio enemigo. No podemos permitirnos cometer errores."

          "Entendido", dice Daren. "Entonces sigamos adelante. Cuando lleguemos a las puertas, intentaré llevar yo la mayor parte de la conversación. Con suerte, todo saldrá a nuestro favor."
      - source: scene_3
        paragraph: 2
        text: |-
          Después de asegurarnos de que ninguno de nosotros tenía una idea mejor para infiltrarnos en Ollendor, todos salimos del bosque y nos dirigimos a la carretera principal que llevaba hasta las puertas de la ciudad. A cada lado del camino podíamos ver las casas de madera de todos los campesinos que vivían fuera de la ciudad, cada uno ocupado en trabajar sus campos. Mientras pasábamos junto a los granjeros, algunos nos lanzaban breves miradas en nuestra dirección, pero en su mayoría no nos prestaban demasiada atención y seguían con lo suyo. Al mirarles a la cara, no pude evitar notar que tenían la misma expresión cansada en los ojos que los huérfanos del Faro de Esperanza. Era como si hubieran perdido la esperanza hacía mucho tiempo y ya se hubieran resignado a unos destinos que ya no estaban en sus manos.

          Todos seguimos el consejo de Melindra y no hablamos entre nosotros hasta llegar a las puertas. Una vez estuvimos cerca de nuestro destino, Daren se puso al frente para dirigirse al guardia que estaba ante la entrada de la ciudad.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch02a_unimpressed
  - name: b3_ch02a_story
    texts:
      - source: scene_text
        paragraph: 5
        text: |-
          "¿Qué haremos si no se creen nuestra historia?"

          "Mmm...", dice Melindra. "Bueno, sería mejor que pensaran que Daren vino aquí a comerciar, porque en esta ciudad tratan mejor a los mercaderes debido a lo poco frecuente que es que alguno se moleste en visitarla, pero si no nos creen, supongo que tendremos que entrar en la ciudad por la vía normal. Eso requeriría un poco más de papeleo y llevaría más tiempo, pero dudo que pueda tardar TANTO más, así que estoy segura de que estaremos bien."

          "Bueno, supongo que merece la pena probar el plan de Melindra", dice Daren. "Al fin y al cabo, es la que mejor conoce esta ciudad. Pero recuerden mantenerse alerta. Si las cosas se descontrolan, puede que tengamos que abrirnos paso por la fuerza, así que todos deberían estar preparados para el peor escenario posible. Melindra, ¿hay algo más que debamos saber antes de empezar a dirigirnos hacia la ciudad?"
