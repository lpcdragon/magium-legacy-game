  - name: b3_ch02a_drunk
    texts:
      - source: scene_text
        paragraph: 12
        text: |-
          "¿Y si intentáramos emborrachar a alguno?"

          "¡Eh, ahora sí que esa es una idea que me gusta!", dice Hadrik. "Apostaría a que esta gente jamás ha tenido la oportunidad de probar ale enana en toda su vida, así que debería ser fácil encontrar a alguien dispuesto a beber con nosotros si llevo conmigo una de mis botellas."

          "Recuerden que debemos tener cuidado", dice Daren. "No podemos ir por ahí atrayendo a la gente a callejones desiertos para beber con nosotros, porque parecería demasiado sospechoso. Y si simplemente le pedimos a alguien la contraseña en público, seguro que alguien oye la conversación y nos denuncia a los guardias."

          "No te preocupes por eso", dice Hadrik. "Sé exactamente cómo lograr que alguien beba con nosotros en privado. Pero no podemos ir como grupo, porque pareceríamos demasiado intimidantes, sobre todo con Daren caminando a nuestro lado. Yo diría que Barry y yo bastamos para encargarnos. ¿Qué dices, Barry? ¿Listo para ir a la taberna local?"

          "Claro, me apunto", digo. "Guía el camino."

          "¡Perfecto!", dice Hadrik. "Pongámonos en marcha. El resto de ustedes quédense aquí hasta que terminemos. Los contactaremos por los transceptores en cuanto sepamos la contraseña."

          "¡No olviden llamarnos si pasa algo inesperado!", dice Daren. "No podremos saber si están en problemas desde tan lejos."

          "Sí, sí, los llamaremos si pasa algo", dice Hadrik. "Aunque estoy seguro de que estaremos bien."
      - source: scene_text_2
        paragraph: 7
        text: |-
          Mientras Hadrik y yo salimos del bosque, ambos miramos alrededor, intentando averiguar dónde está la taberna. Como no hay señales claras que lleven hasta ella, Hadrik decide preguntarle a uno de los lugareños cómo llegar.

          "¡Oye, disculpa!", le pregunta Hadrik a un hombre que estaba sentado en un banco en su patio. "¿Te importaría decirnos dónde está la taberna de tu aldea? ¡A mi amigo y a mí nos vendría muy bien una copa ahora mismo!"

          El aldeano se queda mirando a Hadrik con expresión ausente durante unos segundos, y luego se levanta del banco, entra en su casa y cierra la puerta detrás de sí sin decir una palabra.

          "Supongo que no era precisamente de los habladores, ¿eh?", me dice Hadrik.

          Luego se gira para dirigirse a otro hombre, que estaba cavando su patio delantero con una pala para plantar unas semillas.

          "¡Señor, disculpe!", dice Hadrik. "¿Sabe por casualidad dónde está la taberna local?"

          El hombre deja de trabajar para mirar a Hadrik, y asiente brevemente con la cabeza en dirección a la taberna. Luego vuelve a cavar, sin prestarnos más atención.

          "Bueno... supongo que al menos ahora ya sabemos por dónde ir", dice Hadrik, algo confundido por la reacción de los aldeanos hacia nosotros. "Vamos a beber algo."
      - source: scene_3
        paragraph: 5
        text: |-
          No tardamos mucho en encontrar la taberna, después de seguir las indicaciones de aquel aldeano. Aunque en ninguna parte del edificio ponía que fuera una taberna, pudimos ver salir de ella a personas que apenas podían mantenerse en pie y que olían con fuerza a alcohol, así que no había lugar a dudas.

          Los dos entramos en la taberna y, en cuanto llegamos a la barra, Hadrik le pide de inmediato al tabernero la bebida alcohólica más fuerte del menú. Al principio el tabernero no lo ve, porque la barra no estaba pensada precisamente para enanos y quedaba un poco más alta que Hadrik, pero en cuanto se da cuenta de quién está haciendo el pedido, le sirve la bebida en una jarra de madera.

          "¿Eso es lo más fuerte que sirven aquí?", grita Hadrik, después de beberse todo el alcohol de un solo trago. "Lo juro, ustedes, la gente de fuera de las tierras enanas, no tienen ni idea de cómo divertirse. ¡Mira, déjame enseñarte a qué sabe el alcohol de verdad!"

          Luego saca una botella de ale enana de su mochila y estira el brazo hacia arriba para dejarla sobre la barra.

          "¿Ves esto?", le dice Hadrik al tabernero. "¡Esto es ale enana! Te garantizo que nunca has probado nada mejor. Vamos, ¡pruébala! Tengo muchas más en la mochila."

          "Lo siento, pero no se permite traer bebidas de fuera a esta taberna", dice el tabernero con tono frío. "Si quieres beber tu ale enana, puedes irte fuera."

          "¿Ah, sí?", dice Hadrik, recuperando la botella. "Pues igual eso hago."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch02a_drunk2
  - name: b3_ch02a_drunk2
    texts:
      - source: scene_text
        paragraph: 13
        text: |-
          Luego da un trago de su botella y se gira hacia la gente de la taberna.

          "Y cualquiera que esté harto de escuchar a ese imbécil estirado y sus reglas estúpidas también puede venir conmigo", dice Hadrik. "¡Yo invito!"

          Luego salimos de la taberna y nos detenemos justo delante, mientras Hadrik da otro trago de su botella.

          "¿Crees que vendrá alguien?", le pregunto a Hadrik.

          "Créeme, ya he hecho esto en muchos sitios y hasta ahora nunca me ha fallado", dice Hadrik, mientras saca una botella de ale enana de la mochila y me la entrega. "Los países pueden ser distintos, pero las tabernas siempre son iguales. Casi seguro que en los próximos segundos veremos salir al menos a un tipo para buscarnos."

          En cuanto Hadrik termina de hablar, un hombre de mediana edad que tiene toda la pinta de ser un bebedor empedernido sale de la taberna y mira a todos lados para ver si ya nos hemos ido o no. En cuanto el borracho nos ve, se dirige de inmediato hacia nosotros, y a medida que se acerca, el fuerte olor a alcohol de su aliento se vuelve cada vez más difícil de ignorar.

          "¡Ahí lo tienes!", me dice Hadrik con una sonrisa.

          "Entonces, eh...", dice el borracho, deteniéndose frente a nosotros. "He oído que estaban dispuestos a compartir esa ale enana. ¿Puedo probarla o...?"
      - source: scene_text_2
        paragraph: 8
        text: |-
          "Te diré una cosa...", dice Hadrik, después de volver a beber de su botella. "Haré una excepción contigo y te daré una botella entera gratis. ¿Qué dices?"

          "¿Una botella entera de ale enana?", dice el borracho, incapaz de contener su emoción. "Eso es... muy generoso de tu parte."

          "Sí, bueno, es tu recompensa por escogernos a nosotros en vez de a ese insufrible tabernero tuyo", dice Hadrik, mientras saca otra botella de ale de la mochila y se la entrega al hombre de mediana edad. "Aquí tienes. Pero no bebamos aquí. No me apetece que ese idiota venga a quejarse de que estamos bebiendo en su porche. Busquemos un lugar más tranquilo, donde podamos disfrutar de esta excelente bebida como se debe y sin que nadie nos moleste."

          "¡Conozco el lugar perfecto!", dice el borracho, después de dar un trago a la botella de ale enana. "¡Síganme!"

          "¡Vamos justo detrás de ti, amigo!", dice Hadrik, dedicándome una sonrisa, y los dos seguimos al borracho hacia un lugar más apartado.

          Unos cinco minutos de caminata después, el borracho se detiene ante una casa vacía con las ventanas rotas. Cuando entramos detrás de él, nos damos cuenta de que este edificio lleva probablemente abandonado mucho tiempo, porque está lleno de polvo y telarañas, y ya ni siquiera queda un solo mueble.

          Como no hay camas ni sillas donde sentarnos, el borracho se sienta en el suelo con la espalda apoyada contra una de las paredes, mientras Hadrik y yo hacemos lo mismo frente a él, con las piernas cruzadas.
      - source: scene_3
        paragraph: 6
        text: |-
          "Antes vivía aquí una familia de magos", nos dice el borracho. "Pero ahora está vacía. Lleva así un tiempo. Creo que fue hace un año... ¿o quizá dos?... Los magos desaparecieron en mitad de la noche y nadie ha vuelto a saber de ellos desde entonces. Cuando les preguntamos a los guardias qué había sido del padre y de los tres hijos que vivían en esta casa, nos dijeron que dejáramos de hacer preguntas. Así que dejamos de hacer preguntas. En fin, pensé que aquí nadie nos molestaría, ya que todo lo que se podía robar ya se lo llevaron, y no es como si los dueños fueran a volver a estas alturas. ¡Salud!"

          "Eh... ¡salud!", dice Hadrik, mientras los tres chocamos las botellas y damos un sorbo.

          "Esta bebida es... realmente fuerte", dice el borracho. "Apenas he empezado a beber y ya me siento un poco somnoliento."

          "¡Je!", dice Hadrik. "Supongo que beber ale enana justo después de otro tipo de alcohol tiene ese efecto si no estás acostumbrado. No te preocupes. Aunque no puedas terminar la botella con nosotros ahora, te dejaré quedártela igualmente."

          "¡Yo nunca dije que no pudiera terminármela!", dice el borracho, ahora dando un trago más largo de la botella. "No me subestimes, enano. Llevo yendo a tabernas desde que era un chiquillo. ¡No voy a perder contra una simple 'ale enana', por muy fuerte que sea!"

          "¡Ese es el espíritu!", dice Hadrik, mientras también da un trago.
    choices:
