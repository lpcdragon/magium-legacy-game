          - source: scene_text_2
            paragraph: 32
            text: |-
              Evitar tres haces de fuego que me apuntan al mismo tiempo no es en absoluto tarea fácil, pero gracias a mi increíble velocidad siempre voy un paso por delante de mis enemigos, incluso cuando las probabilidades claramente no están a mi favor. Por suerte para mí, no tengo que aguantar mucho tiempo, porque Hadrik pronto consigue acabar con el gólem de las puertas y luego viene hacia mi lado para enfrentarse a uno de mis oponentes en combate, obligándolo a cancelar su ataque de haz y a luchar de forma más defensiva.

              Después de pasar un poco más de tiempo corriendo de un lado a otro, miro hacia la barrera de Daren y me alegra ver que mis esfuerzos no fueron en vano, y que aunque Daren, Kate, Melindra y Leila siguen siendo atacados por uno de los haces de fuego, aun así han logrado acercarse bastante a la puerta mientras yo entretenía a estos gólems. Además, dado que Illuna también ha conseguido ocuparse mientras tanto de algunos de los guardias de la muralla, Kate ha decidido que ya puede deshacer algunas de sus plataformas defensivas de hielo, y ahora se concentra en reforzar un enorme carámbano en el cielo, asegurándose de que el proyectil sea lo bastante fuerte como para atravesar la armadura anti-magia de los gólems.
          - source: scene_3
            paragraph: 11
            text: |-
              Una vez terminados los preparativos, Kate dispara su carámbano gigante con una fuerza increíble, provocando una explosión de aire detrás de él y atravesando de lado a lado la cabeza de uno de los gólems de mi lado, que cae de inmediato al suelo con un fuerte estruendo. Al mismo tiempo, Hadrik también remata al gólem con el que estaba luchando, y ahora pasa al cuarto.

              Por desgracia, mientras estábamos ocupados con los pocos gólems que estaban lo bastante cerca como para enfrentarse a nosotros de inmediato, alrededor de una docena más de grandes gólems que oyeron el alboroto han ido acercándose lentamente, y pronto estarán dentro del alcance de sus ataques de haz. Mientras Hadrik atrae la atención de uno de los dos gólems que están lo bastante cerca para atacarnos, y el último gólem que estaba atacando la barrera de Daren empieza a apuntar en cambio a Illuna y a Flower, Daren y los demás salen rápidamente de la barrera y corren hacia las puertas, y nos llaman en cuanto las alcanzan.

              "¡Por aquí!", nos grita Daren. "¡Dejen a los gólems y vengan! ¡Rápido, antes de que lleguen los otros!"
