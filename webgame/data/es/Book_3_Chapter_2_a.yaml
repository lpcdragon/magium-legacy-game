            paragraph: 16
            text: |-
              "Podemos esperar a que termines de beber. No tenemos TANTA prisa."

              "Sí, estoy seguro de que a nuestros amigos no les importará esperar unos minutos más", dice Hadrik. "Tómate tu tiempo y disfruta de la bebida."

              "Bueno, en ese caso, ¡hasta el fondo!", dice el borracho, y luego volvemos a chocar las botellas.

              Cuando por fin terminamos las bebidas y decidimos marcharnos, vemos que el borracho apenas puede caminar ya, así que Hadrik y yo nos apresuramos a sostenerlo al salir del edificio. No mucho después de que salgamos, el borracho recuerda de pronto algo importante y se esfuerza por articular las palabras manteniendo la voz baja.

              "Yo... casi olvidaba...", nos dice el borracho. "La contraseña no basta... También tienen que... guiñar tres veces el ojo izquierdo mientras la dicen. Nuevo conjunto de reglas... para impedir que la gente escuche a escondidas."

              "¡Oooh!", dice Hadrik, también en voz baja. "Menos mal que te acordaste. Podríamos haber tenido problemas si no."

              "Sí, culpa mía...", dice el borracho. "Van cambiando esas reglas cada cierto tiempo, y ya no puedo seguirles el ritmo... Mi casa está allí. Pueden dejarme en la entrada del patio. Yo me arrastraré solo hasta la puerta."

              "Muy bien, entonces", dice Hadrik, mientras el borracho sigue apoyándose en los dos al caminar.
