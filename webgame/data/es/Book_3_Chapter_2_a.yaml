            paragraph: 15
            text: |-
              "¡Es buena idea! ¡Vamos, Hadrik!"

              "Eh... vale", dice Hadrik, mientras los dos nos levantamos del suelo. "Supongo que podré terminarme la bebida por el camino, entonces."

              "¡Adiós, amigos!", dice el borracho. "¡Les deseo lo mejor!"

              Al salir del edificio abandonado, nos despedimos con la mano de nuestro amigo borracho, y luego tomamos la carretera principal de vuelta hacia donde Daren y los demás estaban esperando en el bosque.

              "Sabes... al menos podríamos haber esperado a que el tipo terminara la bebida...", me dice Hadrik mientras caminamos.

              "¿Y arriesgarnos a delatarnos?", le digo. "No, gracias. Cuanto más habláramos con él, más probable sería que empezara a hacernos preguntas incómodas."

              "Como tú digas", dice Hadrik. "En fin, voy a llamar a Daren. Será mejor que nos preparemos para ir hacia las puertas de la ciudad."

              Hadrik saca entonces su transceptor y usa el dial del lado derecho para cambiarlo a la frecuencia de Daren antes de llamarlo.

              "Oye, Daren, ¿me oyes?", dice Hadrik.
          - source: scene_text_2
            paragraph: 10
            text: |-
              "Sí", dice Daren. "¿Dónde están?"

              "Estamos en la carretera principal", dice Hadrik. "Deberían poder vernos si salen del bosque. Conseguimos lo que buscábamos. Vamos a las puertas."

              "¿Lo hicieron?", pregunta Daren, sorprendido. "¡Eso es estupendo! ¡Esperen, vamos para allá!"

              Mientras Daren y los demás salen del bosque uno por uno, le pongo la tapa a mi botella de ale enana y se la devuelvo a Hadrik, diciéndole que por ahora he terminado de beber.

              "¡Bastardo astuto!", dice Hadrik con una sonrisa al notar el peso de la botella en la mano. "Apenas le diste unos pocos sorbos. Con razón no parecía afectarte. Y yo aquí pensando que por fin habías logrado desarrollar algo de tolerancia a la ale enana."

              "Otro día, Hadrik", digo. "Otro día."

              Cuando nuestros amigos llegan hasta nosotros, todos empezamos a dirigirnos juntos hacia las puertas de la ciudad, con la esperanza de que esta vez tengamos más éxito. Sin embargo, justo cuando damos los primeros pasos, oímos una voz desconocida llamándonos desde dentro del bosque.
