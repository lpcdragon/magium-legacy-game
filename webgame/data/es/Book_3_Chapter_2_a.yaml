    routes:
      - condition: b3_ch2_goblins = 4 AND b3_ch2_infiltration <> 2
        texts:
          - source: scene_text
            paragraph: 28
            text: |-
              "No pasa nada, no tenemos prisa. Mejor vayan ustedes primero."

              "Muy bien", dice el viejo goblin. "En ese caso, nos marchamos. ¡Cuídense!"

              "¡Bien pensado, Barry!", dice Hadrik una vez que los goblins están demasiado lejos para oírnos. "Si son ellos los que van primero, no tendremos que quedar como idiotas en caso de que la contraseña sea falsa."

              "Sí, está eso", digo, "pero más importante aún, también está el hecho de que probablemente ellos sí puedan permitirse equivocarse con la contraseña una vez, porque esta es apenas su primera vez intentando pasar por las puertas. En cambio, si nosotros fallamos una segunda vez, seguramente no volverían a dejarnos entrar en la ciudad nunca más."

              "Pronto sabremos si la contraseña es falsa o no", dice Daren. "A los goblins no les falta mucho para llegar a las puertas."

              Esperamos un poco más hasta ver a los goblins llegar a la entrada de la ciudad, a lo lejos. Tras una breve conversación con el guardia de la entrada, las puertas se abren y los tres goblins entran en la ciudad sin ningún problema.
          - source: scene_text_2
            paragraph: 24
            text: |-
              "Vaya...", dice Hadrik. "Supongo que la contraseña funcionó, ¿no? Vamos, nosotros también deberíamos irnos. Ya hemos pasado suficiente tiempo en este bosque."

              Nos lleva un rato, pero cuando por fin terminamos de atravesar de nuevo la aldea, acabamos llegando a las puertas por segunda vez. El guardia de la entrada nos mira ahora con la misma expresión recelosa que tenía la primera vez, y nos habla en cuanto nos detenemos ante él.

              "Veo que han vuelto", dice el guardia. "¿Debo entender que por fin han conseguido que ese 'cliente' suyo les dé la contraseña?..."

              "Sí, al final conseguimos dar con él por el transceptor y nos dijo la contraseña", digo, mientras hago tres guiños con el ojo izquierdo. "Es 'alas de gárgola'. "

              "Mmm...", dice el guardia. "Esa es, en efecto, la contraseña correcta."

              Entonces les hace una señal a los dos gólems de metal que tiene detrás, y estos abren de inmediato las grandes puertas para nosotros.

              "No sé exactamente a qué han venido, pero más vale que no causen problemas", nos dice el guardia.

              "¡No, señor!", digo. "¡No vamos a molestarte en absoluto!"

              "Sigan", dice el guardia. "Muévanse."

              Todos pasamos junto al guardia y entramos en la ciudad, y en cuanto estamos dentro, las puertas se cierran de golpe a nuestras espaldas.
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch02a_communicating
