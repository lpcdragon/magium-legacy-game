  - name: b3_ch02a_unimpressed
    texts:
      - source: scene_text
        paragraph: 6
        text: |-
          "¡Buenos días!", dice Daren en voz alta, para asegurarse de que el hombre frente a la puerta pudiera oírlo. "¿Eres la persona con la que tengo que hablar para poder entrar en la ciudad?"

          El guardia no le responde de inmediato. Cuando llegamos estaba sentado en una silla, midiéndonos de arriba abajo con una expresión bastante poco impresionada, y mientras Daren hablaba, daba la impresión de que el guardián de la puerta solo prestaba atención a la mitad de lo que decía.

          Daren espera con paciencia a que el guardia se levante lentamente de su silla y camine hasta él, mientras dos gólems de metal que estaban delante de la puerta parecen estudiarnos con atención.

          "¿Qué asuntos te traen aquí?", pregunta el guardia, deteniéndose frente a Daren y mirándolo con recelo.

          "He venido a vender unas mercancías", dice Daren. "No sé si sabes quién soy, pero fuera de Varathia soy un encantador muy famoso. A mí me llaman Daren, el sanador con armadura."

          "No me suenas", dice el guardia, con tono desinteresado.
      - source: scene_text_2
        paragraph: 5
        text: |-
          "Bueno, no puedo reprochártelo", dice Daren. "Este continente está bastante aislado del resto del mundo. En fin, tengo un cliente que quiere mantener el anonimato y que desea comprar mis mercancías, y he quedado con él dentro de la ciudad. ¿Podrías abrir la puerta para dejarme pasar?"

          De nuevo, el guardia no le responde enseguida, y se limita a mirarlo con el ceño fruncido mientras mastica sin parar lo que parece ser algún tipo de planta. Digo que frunce el ceño, aunque en realidad es un poco difícil saber si de verdad le molesta algo o si simplemente así le funcionan las cejas, porque estoy bastante seguro de que ya las tenía fruncidas antes siquiera de fijarse en nosotros.

          "¿Cuál es la contraseña?", dice el guardia, al cabo de un rato.

          "¿Contraseña?...", pregunta Daren, confundido.

          "Sí", dice el guardia. "Contraseña. Si alguien te invitó aquí, entonces debió darte una contraseña. Esa es la única forma de entrar en la ciudad sin tramitar el papeleo habitual. Así que, ¿cuál es la contraseña?"
      - source: scene_3
        paragraph: 3
        text: Mientras el guardia habla, de repente recuerdo el texto de aquella roca de la colección de Melindra, que decía que 'La contraseña es pico de grifo'. ¿Era posible que se refiriera a la contraseña necesaria para entrar en la ciudad de Ollendor?
        condition: b3_ch1_password = 1
    choices:
      - position: 1
        text: Eh, el tipo con el que se suponía que íbamos a reunirnos no nos dijo nada de contraseñas.
        effects:
          - set:
              current_scene: b3_ch02a_resort
              b3_ch2_pass2: 0
      - position: 2
        text: La contraseña es 'cierra la boca y abre la puerta'
        effects:
          - set:
              current_scene: b3_ch02a_resort
              b3_ch2_pass2: 1
      - position: 3
        text: Olvidamos la contraseña.
        effects:
          - set:
              current_scene: b3_ch02a_resort
              b3_ch2_pass2: 2
      - position: 4
        text: La contraseña es 'un orangután borracho con un gorro de fiesta'
        effects:
          - set:
              current_scene: b3_ch02a_resort
              b3_ch2_pass2: 3
      - position: 5
        text: La contraseña es 'pico de grifo'
        effects:
          - set:
              current_scene: b3_ch02a_resort
              b3_ch2_pass2: 4
        condition: b3_ch1_password = 1
  - name: b3_ch02a_resort
    routes:
      - condition: b3_ch2_pass2 = 0
        texts:
          - source: scene_text
            paragraph: 7
            text: |-
              "Eh, el tipo con el que se suponía que íbamos a reunirnos no nos dijo nada de contraseñas."

              "Lo dudo", dice el guardia. "Todo el mundo en esta ciudad sabe que hace falta una contraseña para entrar. Si de verdad no te dio ninguna, entonces eso solo puede significar que no necesitaba con urgencia las mercancías que vienes a venderle, y que le parecía bien que tramitaras el papeleo requerido, como cualquier otro forastero."
          - source: scene_text_2
            paragraph: 6
            text: |-
              "¿Y qué tenemos que hacer exactamente para tramitar esos papeles?", dice Daren.

              "Por el momento, no tienes que hacer nada", dice el guardia. "Más tarde hoy enviaré a alguien a conseguir todos los permisos necesarios de mis superiores, y luego les traeremos unos papeles para que los firmen. Eso suele tardar un tiempo, eso sí. Podrías probar a volver mañana, pero yo no me haría muchas ilusiones si fuera tú. La gente rara vez recibe sus papeles de entrada antes de que pasen tres días desde su llegada."

              "¿Tres días?!", dice Daren, un poco demasiado alto, pero enseguida se calma. "Oh... De acuerdo. Entiendo. En ese caso, volveremos a nuestro campamento y regresaremos mañana. Quizá tengamos suerte y haya noticias. ¡Que tengas un buen día, y gracias por tu ayuda!"

              El guardia le hace un gesto de asentimiento a Daren, y luego todos volvemos hacia el bosque del que venimos, sin decir una palabra. Solo cuando ya estamos a salvo, lejos de todos los aldeanos, la voz de Hadrik estalla de repente, como si la presión hubiera estado acumulándose todo el tiempo que tuvo que obligarse a no hablar.

              "¡Tres días!", grita Hadrik. "¿Has oído a ese tipo?... ¡Para entonces el embajador habrá llegado tres veces! ¡Casi que podríamos atravesar ahora mismo su puerta principal! ¡Al menos así tendríamos el factor sorpresa!"
          - source: scene_3
            paragraph: 4
            text: |-
              "Usar la fuerza bruta es nuestro último recurso absoluto", dice Daren. "¿No vieron esos gólems? Esos son solo una de sus muchas defensas. Quién sabe qué más sacarán de la manga mientras intentamos abrirnos paso hasta el palacio. De todos modos, no es que nos hayamos quedado sin opciones por completo. Acabamos de descubrir que necesitamos algún tipo de contraseña para entrar. Lo único que nos hace falta ahora es un plan para averiguar esa contraseña, y volveremos a estar bien encaminados."

              "Quizá podríamos conseguir esa información de los aldeanos de alguna manera", escribe Leila. "Supongo que los granjeros deberían conocer la contraseña, ya que tendrían que entrar en la ciudad a diario para comprar provisiones."

              "Leila tiene razón", dice Illuna. "Podríamos intentar sobornar a uno de los aldeanos. Me imagino que no debería ser demasiado difícil encontrar a alguien dispuesto a romper las reglas por algo de dinero extra en una aldea llena de gente empobrecida."

              "No es tan fácil como crees", dice Melindra. "Esta ciudad no es como Thilias. Aquí romper la ley bien puede hacer que asesinen a toda tu familia, o algo peor. La mayoría de la gente no correría ese riesgo, sin importar cuánto dinero hubiera en juego."
        choices:
          - position: 1
            text: ¿Y si intentáramos emborrachar a alguno?
