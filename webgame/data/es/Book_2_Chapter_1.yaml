  - name: b2_ch01a_ella
    texts:
      - source: scene_text
        paragraph: 19
        text: |-
          Suzie venía ahora hacia nosotros a toda prisa con una botella de vino en las manos, mientras detrás de ella podíamos ver a Ella, que parecía haberse recuperado completamente después de la noche anterior, y que llevaba una bandeja con varias copas de vino encima.

          Cuando las dos llegan, colocan tanto la bandeja como la botella en una mesa de picnic junto a nosotros, y entonces Suzie empieza a abrir la botella.

          "Por los dioses," dice Enrique al ver a Ella. "¡Mis ojos han sido verdaderamente bendecidos al contemplar semejante belleza!"

          Se inclina entonces galantemente y le besa la mano.

          "¡Si mi corazón no perteneciera ya a Rose por toda la eternidad, probablemente me habría enamorado de ti en un instante!" dice Enrique.

          Ella parece un poco confundida tras escuchar las palabras de Enrique, pero en vez de responderle, decide hacer una elegante reverencia y presentarse.

          "Mi nombre es Ella," dice la chica. "He oído por Suzie lo que le pasó a la señorita Rose. Lamento su pérdida."

          Por un momento, hubo un destello de tristeza en los ojos de Enrique al oír las palabras de Ella, pero rápidamente forzó de nuevo una sonrisa alegre en su rostro, antes de hablar otra vez.

          "¡No tienes por qué disculparte, querida!" dice Enrique. "Tú no tuviste nada que ver con esto."
      - source: scene_text_2
        paragraph: 16
        text: |-
          "Supongo que usted es el nuevo amo de esta casa," dice Ella. "Creo que le debo una explicación por mi presencia aquí. Verá, Rose me contrató ayer mismo para trabajar como..."

          Ella hace una pausa de unos segundos antes de continuar, mientras baja lentamente la cabeza.

          "Como esclava," dice. "Estoy bien formada en limpieza del hogar y cocina, y también sé leer y escribir. Si me acepta, prometo servirle tan fielmente como la serví a ella."

          "Voy a detenerte ahí mismo, Ella," dice Enrique, mientras levanta suavemente la barbilla de la chica con su mano, para que pueda mirarlo directamente a los ojos. "No deberías estar diciendo tales mentiras. La Rose que yo conocía nunca habría contratado a una esclava para trabajar para ella. Sin importar cuál haya sido tu pasado, una vez que te convertiste en parte de esta familia, lo hiciste como mujer libre, y no como esclava. Mientras trabajes en esta casa, tienes prohibido llamarte esclava nunca más. ¿Queda claro?"

          "Sí, señor," dice Ella, sonriendo débilmente, mientras las lágrimas empiezan a formarse en sus ojos.

          "¡Muy bien, entonces!" dice Enrique.

          Se vuelve entonces hacia nosotros.

          "¿Y bien?" pregunta. "¿A qué estáis esperando? ¡Este vino no va a beberse solo!"
    choices:
