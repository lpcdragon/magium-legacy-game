    texts:
      - source: scene_text
        paragraph: 26
        text: |-
          "Eh, en realidad, yo no soy--" empieza a decir Daren, pero Rose lo interrumpe.

          "Enrique," dice ella, mientras aprieta con fuerza el brazo derecho de su ex marido con ambas manos. "¿Recuerdas lo que pasó la última vez que asumiste que uno de mis invitados era mi amante?"

          "¡Rose, estás siendo injusta!" dice Enrique. "¿Cómo iba yo a saber que la mujer que agarraba el brazo de aquel hombre era en realidad su esposa? Se parecían tanto que podría haber jurado que era su hermana. ¡Cualquiera habría cometido ese error! Y además, esta vez me aseguré de que no hubiera ninguna mujer a su lado antes de acercarme, ¿no es así?"

          Rose suspira, mientras suelta el brazo de Enrique.

          "Vamos, Daren, vámonos," dice. "Tenemos que darnos prisa hacia el castillo. No queremos hacer esperar al rey de Thilias."

          "¡Oh, cierto, el mensaje de antes!" dice Enrique. "¿Quieres decir que Golmyck hablaba de tus amigos cuando hizo la invitación al final?"

          "¡Sí, exacto!" dice Rose. "Tendré que guiarlos hasta el castillo, así que estaré fuera de nuevo unas horas. ¿Te importaría quedarte aquí con los niños hasta que vuelva?"

          "¡Por supuesto que no!" dice Enrique. "¡Para eso he venido, después de todo!"
      - source: scene_text_2
        paragraph: 23
        text: |-
          "¡Gracias, Enrique!" dice Rose. "Hablaremos más cuando vuelva. ¡Cuídate!"

          "¡Adiós, mi dulce Rose!" dice Enrique. "¡Y adiós a todos vosotros. Espero que nos volvamos a ver algún día, para que me contéis vuestras aventuras con una copa de buen vino!"

          Todos nos despedimos de Enrique y de los hermanos de Rose y entonces emprendemos nuestro nuevo viaje, hacia el castillo de Thilias. Rose toma la delantera, igual que antes, pero esta vez se asegura de mostrarnos todas las señalizaciones y edificios que usa como referencia, porque más tarde tendríamos que encontrar el camino de vuelta a su mansión por nuestra cuenta.

          "Siento lo de antes," le dice Rose a Daren, mientras caminamos por los callejones. "Espero que Enrique no te haya hecho sentir demasiado incómodo. Es que lleva un tiempo preocupado por mí porque no he estado con otro hombre desde que rompimos, y siempre se deja llevar en situaciones como esta."

          "No pasa nada," dice Daren. "Francamente, me preocupa más aquel tipo al que le preguntó lo mismo cuando vino aquí con su esposa. ¿Al final conseguiste aclarar el malentendido?"

          "Eh, bueno, intenté explicarle la situación a su esposa lo mejor que pude, pero no estoy segura de cuánto me creyó," dice Rose. "Sé que los dos siguen juntos, pero en realidad no me han vuelto a hablar desde aquel día..."

          "No la culpo," dice Daren. "Creo que incluso mi esposa habría sido cautelosa contigo después de oír algo así."
