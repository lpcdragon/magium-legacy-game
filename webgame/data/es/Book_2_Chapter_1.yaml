          - source: scene_text_2
            paragraph: 5
            text: "\"Will you shut her up?\" Daren says, after a while. \"I've already had enough of Arraka to last me for a week. I don't need to hear her constant yammering the entire trip.\"\r\n\r\n\"Oh, right, sorry...\" Hadrik says, as he closes the amulet and then continues to spin it by the chain.\r\n\r\nArraka's shouting is still audible, but it's more of a mild annoyance now that the noise has become muffled.\r\n\r\n\"I think my wrist is starting to go numb from all the spinning,\" Hadrik says, a few minutes later. \"Barry, what do you say? Do you wanna give this a try? I assure you it's a very rewarding experience!\""
        choices:
          - position: 1
            text: Claro, ¿por qué no?
            effects:
              - set:
                  current_scene: b2_ch01a_sure_alive
                  b2_ch1_spin: 1
