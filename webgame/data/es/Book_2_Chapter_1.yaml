            paragraph: 51
            text: |-
              "¿Oh?" dice Eiden, con una sonrisa malvada. "¿Y si te dijera que de hecho fui yo tanto quien les dio la capacidad de hacer daño a la gente de Varathia, como quien mató a su querido conde?"

              El embajador está ahora sudando aún más que antes, y parece demasiado asustado para darle una respuesta a Eiden. Al ver la expresión en su rostro, Eiden empieza a reírse.

              "No se preocupe, embajador," dice. "Nunca sugerí que debieran ser puestos en libertad. Sin embargo, creo que todos podemos coincidir en que una ejecución sería una forma aburrida para que unos magos tan poderosos encuentren su fin."

              "¿Qué... tiene en mente, entonces?" pregunta el embajador.

              "¡Las arenas, por supuesto!" dice Eiden. "Que los arrojen a la arena, y si de algún modo consiguen sobrevivir hasta el final, significará que los dioses han considerado oportuno absolverlos de sus crímenes. Las reglas de las arenas dicen que no se puede usar magia durante los combates, así que no tendrán ninguna ventaja injusta sobre los otros gladiadores. Incluso hay detectores de magia colocados por toda la zona de combate, para asegurarse de que no haya trampas."

              "Sí, pero," dice el embajador, "si de algún modo logran sobrevivir, el rey de Ollendor--"

              "¿Está intentando decir que las legendarias arenas de Varathia, el orgullo de su 'continente', no son suficientes para detener a un puñado de magos que ni siquiera pueden lanzar hechizos?" dice Eiden, con una sonrisa perversa.

              "No..." dice el embajador. "No, por supuesto que no..."
