            text: |-
              "Mira, hay otra de esas señalizaciones," dice Hadrik. "¡Seguimos por buen camino!"

              Nos llevó poco menos de dos horas llegar al castillo de Thilias desde la mansión de Rose. Cuando llegamos a las puertas principales, Daren les hizo señas a los guardias para que nos dejaran pasar, y una vez que confirmaron nuestras identidades, abrieron las puertas. Todos entramos lentamente, mientras las puertas se cierran de golpe detrás de nosotros.
