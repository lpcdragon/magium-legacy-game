  - name: b2_ch01a_creator
    texts:
      - source: scene_text
        paragraph: 50
        text: |-
          La sala entera queda en completo silencio, mientras el embajador intenta forzar una expresión humilde en su rostro, mientras se inclina lentamente ante Eiden.

          "Como siempre, no soy más que su humilde servidor," dice el embajador, sonando como si experimentara un gran dolor con cada palabra que pronunciaba. "Es un honor tenerle en estos salones, oh gran Creador."

          "¿¡Qué?!" gritan Flower y Daren al mismo tiempo.

          "Un momento," dice Hadrik. "Creador, como el fundador de la civilización de Varathia. ¿Es ese el Creador del que estamos hablando aquí?"

          "Me sorprende que no lo supierais a estas alturas," dice Eiden, con una expresión desconcertada. "¿No os lo dijo Arraka? ella estaba allí cuando todo empezó, después de todo."

          Hay unos momentos de silencio, durante los cuales todos dirigimos la mirada hacia el amuleto de Arraka.

          "Qué, ¿no lo mencioné?" dice Arraka. "Supongo que se me habrá olvidado. ¡Ajá--- AJAJAJAJAJA!"

          "Así que usted es el Creador del que tanto he oído hablar," dice Golmyck, mientras se acaricia la barbilla.

          "¡Así es!" dice Eiden. "Y debo decir que soy un gran admirador de su trabajo. He oído que lo primero que hizo cuando se mudó al castillo real fue despojarlo de todo lo que tuviera valor, venderlo todo, y luego entregar el dinero a los pobres. La nobleza de toda Varathia estuvo alborotada durante meses después del suceso. ¡Fue un espectáculo de lo más entretenido!"
      - source: scene_text_2
        paragraph: 42
        text: |-
          "Siempre fui de la opinión de que el castillo real no pertenece a la familia real, sino al pueblo," dice Golmyck. "Solo hice lo que cualquier otro habría hecho en mi lugar, si hubiera sido elegido por el pueblo para representar sus intereses."

          "Creo que podrías estar teniendo una opinión demasiado alta del pueblo bajo tu gobierno, rey de Thilias," dice Eiden, con una sonrisa cortés.

          "Creador," dice el embajador, mientras finalmente reúne el valor para hablar de nuevo. "Sé que su palabra es ley en todo el continente de Varathia, pero debo insistir--"

          "El continente de Varathia..." le interrumpe Eiden. "Vosotros siempre lo llamasteis así, ¿verdad? Pero el tamaño de Varathia no se acerca ni remotamente al de ningún otro continente del mundo. Si acaso, es más bien una isla, en realidad. De hecho, si no recuerdo mal, así es como nombré este lugar después del invierno eterno. La isla de Varathia. La isla de la libertad. ¿Por qué empezó la gente a llamar a esto un continente, me pregunto? ¿Fue porque os sentisteis excluidos cuando descubristeis que había un mundo fuera de Varathia? ¿Fue quizás para satisfacer vuestros propios egos, engañándoos a vosotros mismos haciéndoos creer que podíais compararos con las civilizaciones de los otros continentes?"

          "Creador, por favor," dice el embajador. "No sé cuál es su relación con estos magos, pero nos han hecho un gran daño. Se ha perdido una vida que nunca podrá ser reemplazada. Sería muy trágico si los culpables de la muerte de la víctima fueran simplemente puestos en libertad."
