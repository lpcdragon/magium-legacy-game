      - condition: b2_ch1_puzzle2 = 0
        texts:
          - source: scene_text
            paragraph: 38
            text: |-
              Mientras Flower todavía está dentro del muro, la puerta frente a nosotros se abre de nuevo, y el mismo sirviente del castillo aparece ante nosotros.

              "¿Daren y su equipo?" dice el hombre. "El rey os recibirá ahora."

              Entonces cierra las puertas, igual que la última vez, sin decir otra palabra.

              "¡Eh, un momento!" dice Hadrik. "¿Desde cuándo nos hemos convertido en el equipo de Daren? ¡Creía que funcionábamos como una democracia!"

              "Es una forma de hablar," dice Kate. "¿Cómo esperas que nos llamen si solo conocen el nombre de Daren?"

              "Sí, no me lo trago," dice Hadrik. "Ya sabían que eras una maga artificial, así que no les habría costado tanto aprender nuestros nombres. ¡Por no mencionar que ya les dimos nuestros malditos nombres cuando nos inscribimos en este torneo!"
          - source: scene_text_2
            paragraph: 30
            text: |-
              "¡Flower!" grita Daren, ignorando la queja de Hadrik. "¡Eh, Flower! ¿Has terminado ya? ¡El rey nos llama!"

              "¡Ya voy!" dice Flower, mientras sale corriendo del muro, y luego mete la mano en el pequeño agujero de nuevo.

              Mientras los ladrillos vuelven a su sitio, la chica recoge el ladrillo que había sacado del muro antes, y lo coloca de vuelta en su posición original.

              "¿Qué estabas haciendo ahí dentro todo ese tiempo?" le pregunta Daren.

              "¡Es un secreto!" dice Flower, con una sonrisa alegre.

              "Lo que sea," dice Daren. "¡Venga, vamos!"
