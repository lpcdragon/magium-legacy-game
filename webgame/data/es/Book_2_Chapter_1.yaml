            paragraph: 13
            text: |-
              Cuando nos acercamos a la mansión, los hermanos de Rose nos vieron desde lejos y vinieron corriendo a recibirnos.

              "¿Dónde está Rose?" dice Suzie, después de mirar a su alrededor durante unos segundos. "¿Se quedó en el hospital?"

              Los demás y yo intercambiamos miradas incómodas, mientras Daren se pone delante de nosotros y coloca su mano en el hombro de Suzie.

              "Suzie," dice, "hay algo que necesito contarte sobre Rose."

              "Oh, dioses," dice Suzie. "¿Está ella..."

              Se detiene un segundo antes de continuar.

              "¿Está muerta?" pregunta.

              Daren parece un poco sorprendido por la pregunta tan directa de la chica, pero decide que no tiene sentido seguir andándose con rodeos.

              "Sí..." dice. "Lo siento. Fue culpa mía. Prometí que la protegería y yo--"

              "Oh, está bien," dice Suzie, forzándose a sonreír. "Rose nos dijo hace mucho que siempre debíamos estar preparados para que esto pasara. Nos enseñó a cocinar nuestra propia comida, y a limpiar la casa, y todo lo demás que necesitábamos saber, por si ella nunca volvía de uno de sus viajes."

              Mientras Suzie habla, su hermano intenta con todas sus fuerzas contener las lágrimas.
          - source: scene_text_2
            paragraph: 10
            text: |-
              "Le prometimos que pasara lo que pasara, no lloraríamos," dice Suzie. "Le prometimos que seríamos fuertes y que..."

              Deja de hablar un segundo para frotarse los ojos con la manga.

              "Y que siempre la recordaríamos con una sonrisa," dice Suzie, con una voz mucho más temblorosa que antes. "Y que seguiríamos viviendo nuestras vidas y seríamos felices, y... y..."

              La chica ya no puede contener las lágrimas y de repente rompe a llorar. Su hermano, que también estaba al límite, empieza a llorar también, con una voz mucho más fuerte.

              "Vaya, vaya," oímos la voz de un hombre detrás de nosotros. "¿Qué clase de monstruos harían llorar así a una chica tan hermosa?"

              Al darnos la vuelta, vemos que el hombre que habló es casi tan alto como Daren, con una complexión musculosa y bien tonificada, llevando una camisa medio desabotonada, con largo cabello negro que le llegaba a los hombros y un bigote espeso cubriendo todo su labio superior. En su cadera izquierda lleva una vaina dorada que parece contener una espada bastante cara, al menos a juzgar por la multitud de gemas que decoran su empuñadura. El hombre se detiene frente a Suzie y le seca las lágrimas suavemente con la mano derecha.

              "¿Estas personas malas te han disgustado, mi querida Suzie?" le pregunta el hombre.
