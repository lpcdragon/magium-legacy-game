  - name: b2_ch01a_lover
    texts:
      - source: scene_text
        paragraph: 25
        text: |-
          Cuando nos acercamos a la mansión, los hermanos de Rose nos vieron desde lejos y vinieron corriendo a saludarnos. Dejamos a Rose hablando con su hermano y su hermana pequeños, mientras cada uno de nosotros fue a su habitación a recoger su mochila. Cuando volvimos al patio, nos dimos cuenta de que ahora había otra persona junto a Rose, además de sus dos hermanos.

          Al acercarnos más, pudimos ver que esta persona era un hombre tan alto como Daren, con una constitución musculosa y bien tonificada, llevando una camisa medio desabrochada, con largo cabello negro que le llegaba hasta los hombros, y un tupido bigote que cubría todo su labio superior. En la cadera izquierda, llevaba una vaina dorada que parecía contener una espada bastante cara, a juzgar por la multitud de gemas que decoraban su empuñadura. El hombre parecía estar en medio de una conversación con Rose, pero cuando nos vio acercarnos, nos echó a todos una larga mirada antes de volver a hablar.

          "Ah, veo que te has hecho amiga de algunos de los participantes del torneo en tu último viaje," le dice el hombre a Rose. "¿Podrías presentarme a tus nuevos amigos?"

          "¡Por supuesto!" dice Rose, y luego se vuelve hacia nosotros. "Este es mi ex marido, Enrique. Me estaba contando lo que Suzie y Kevin han estado haciendo estas últimas semanas, ya que ha estado pasándose a verlos de vez en cuando mientras yo estaba fuera."

          Rose se vuelve ahora hacia Enrique, mientras nos presenta uno por uno.
      - source: scene_text_2
        paragraph: 22
        text: |-
          "Enrique," dice ella, "estos son mis amigos que me han ayudado a volver a casa sana y salva, y que me han salvado la vida incontables veces durante la última semana. De derecha a izquierda, tenemos a Flower, Illuna, Kate, Barry, Daren y Hadrik."

          "Espera, ¿por qué me has dicho dos nombres mientras señalabas a la niña?" pregunta Enrique.

          "Oh, eh, es un poco complicado," dice Rose. "Verás, Flower es el nombre de la chica, e Illuna es una banshee que vive dentro de ella. Las dos comparten el mismo cuerpo, pero son muy buenas amigas."

          "¿Una chica y una banshee, viviendo en paz en el mismo cuerpo?" dice Enrique, sorprendido. "¡Eso sí que no se ve todos los días!"

          Entonces se acerca a Daren y le estrecha la mano.

          "¡Tú debes de ser el nuevo amante de Rose!" le dice Enrique a Daren. "¡Cuida bien de ella, amigo mío. Es una mujer extraordinaria!"
