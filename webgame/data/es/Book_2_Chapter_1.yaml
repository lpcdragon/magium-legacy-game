  - name: b2_ch01a_bottle
    texts:
      - source: scene_text
        paragraph: 15
        text: |-
          "Tío Enrique," dice Suzie, apenas capaz de controlar su voz. "Es Rose. Está..."

          La chica lucha por sacar las palabras de su boca, mientras se ahoga en lágrimas.

          "Está muerta, tío," dice. "Rose está muerta."

          Entonces abraza a su tío tan fuerte como puede, mientras sigue intentando contener sus sollozos.

          "¿Rose está... muerta?" dice Enrique, con una mezcla de dolor y shock en su voz.

          Su mirada se oscurece gradualmente, mientras nos mira.

          "¿Son ellos los responsables de esto?" pregunta Enrique, mientras empieza a sacar lentamente su espada de la vaina.

          "¡No!" grita Suzie. "¡No fueron ellos! ¡Intentaron protegerla! ¡Son sus amigos!"

          "Yo soy quien dejó que Rose muriera," dice Daren, mientras se acerca a Enrique e inclina la cabeza ante él. "Prometí que la mantendría a salvo, pero le fallé. No tengo palabras para expresar mis disculpas..."

          Tras ver la expresión de dolor en el rostro de Daren, Enrique se calma lentamente, camina hacia él y le pone una mano en el hombro.
      - source: scene_text_2
        paragraph: 12
        text: |-
          "No hay necesidad de disculparse, amigo mío," dice Enrique. "Soy yo quien debería disculparse, por sacar conclusiones precipitadas antes. Está claro que tú también has sufrido mucho por esto."

          Enrique pasa entonces junto a Daren y nos observa detenidamente a cada uno de nosotros.

          "¡Animaos, amigos!" dice. "¿Por qué esas caras largas? Rose no habría querido veros así. Habría querido que sonrierais. No deberíamos estar lamentando la pérdida de Rose. Deberíamos estar celebrando vuestro regreso sano y salvo. Y como amigos de Rose, ¡también sois todos amigos míos!"

          Se vuelve hacia Suzie.

          "¡Suzie!" dice. "Tráeme la mejor botella de vino de la bodega. La que guardábamos para una ocasión especial. Ya sabes a cuál me refiero, ¿verdad?"

          "Sí, tío," dice Suzie, mientras se seca las lágrimas con la manga de nuevo, y deja de llorar de repente. "¡La traigo enseguida!"

          "Ahora, entonces, amigos de Rose," dice Enrique, mientras Suzie sale corriendo hacia la casa, "antes de brindar, me gustaría saber vuestros nombres. ¡Sería impropio no conocer los nombres de las personas con quienes pretendo compartir un trago!"
