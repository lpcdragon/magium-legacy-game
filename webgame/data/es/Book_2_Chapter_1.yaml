          - set:
              current_scene: b2_ch01a_entrance
  - name: b2_ch01a_transceivers
    texts:
      - source: scene_text
        paragraph: 32
        text: |-
          "En realidad, estaba pensando que podríamos mantenernos en contacto usando los transceptores de Daren," digo. "Me dijo que los ha encantado para cubrir un alcance mucho mayor que los transceptores normales, así que no debería haber ningún problema."

          "Ya sabes a qué me refiero, Barry..." dice Rose. "Incluso si nos mantenemos en contacto después de que dejes la ciudad, seguimos siendo parte de dos mundos completamente diferentes. Mundos que han estado casi totalmente aislados el uno del otro durante miles de años."

          "¿Y qué?" digo. "El ganador del torneo recibe el derecho de entrar y salir de Varathia cuando quiera, ¿recuerdas? Tú solo espera aquí. En cuanto gane este torneo, conseguiré mis poderes de mago bien rápido, ¡y luego volveré a por ti! ¡Es una promesa!"

          La cara de Rose empieza a ponerse roja de nuevo lentamente al escuchar mis palabras.

          "Oye, Rose, ¿son este tipo de señalizaciones las que deberíamos buscar en el camino de vuelta?" dice Hadrik, mientras él y los demás se acercan a nosotros.

          Entonces se detiene al ver la cara roja de Rose, y va cambiando la mirada entre los dos varias veces antes de seguir hablando.

          "¿Estoy... interrumpiendo algo?" pregunta.

          "¡No, tranquilo!" dice Rose, intentando recuperar la compostura rápidamente. "¡Sí, esas son exactamente el tipo de señales que debéis buscar! Nos las iremos encontrando más a menudo a medida que nos acerquemos al castillo. Vamos, seguidme. ¡Tenemos que pasar por este callejón!"
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch01a_entrance
  - name: b2_ch01a_entrance
    texts:
      - source: scene_text
        paragraph: 30
        text: |-
          Nos llevó unas dos horas llegar al castillo de Thilias desde la mansión de Rose. Dado que llegamos a nuestro destino con tiempo de sobra, nos tomamos nuestro tiempo para despedirnos de Rose.

          "Vale, vale," dice Rose, después de que Kate termina de abrazarla. "¡Basta de despedidas! Solo vais a una reunión. ¡No es como si no fuéramos a vernos nunca más!"

          "Recuerda mantener siempre cerca el transceptor que te di," le dice Daren a Rose. "Si las cosas se ponen feas y no podemos volver, te llamaremos."

          "¡Ahí va Daren otra vez, con su optimismo habitual!" dice Rose, sonriendo. "Estoy segura de que estaréis bien. El rey solo quiere hablar con vosotros, eso es todo. De lo contrario habría enviado una orden de arresto, no una invitación."

          "Esperemos que tengas razón," dice Daren.

          "Bueno, la entrada es por ahí," dice Rose. "Creo que ya hemos pasado bastante tiempo parados frente al castillo. Recordad... Mientras estéis fuera, pienso cocinar una comida que dejará en ridículo la magia de Flower, ¡así que no lleguéis tarde!"

          "¡No me lo perdería por nada del mundo!" digo.

          Rose sonríe, y se da la vuelta, mientras nosotros hacemos lo mismo y nos dirigimos hacia el gran portón que tenemos delante. Al acercarnos a la entrada, Daren les hace señas a los guardias para que nos dejen pasar, y una vez que confirman nuestras identidades, abren las puertas. Todos entramos lentamente, mientras las puertas se cierran de golpe detrás de nosotros.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch01a_hallway
  - name: b2_ch01a_hallway
    texts:
      - source: scene_text
        paragraph: 33
        text: |-
          Hay algo extraño en este castillo. Lo noté incluso antes de que entráramos. Las ventanas del castillo parecían como si debieran tener gemas preciosas incrustadas en sus marcos, pero las gemas habían desaparecido todas. También parecía que varias decoraciones habían sido arrancadas de las torres.

          El interior del castillo se ve aún peor. Los pasillos están completamente vacíos. No hay pinturas en las paredes, ni alfombras en el suelo ni jarrones en las mesas. El lugar parece más una mazmorra que un castillo. Ni siquiera hay guardias patrullando los pasillos. Casi empiezo a preguntarme si no habremos acabado en el lugar equivocado.

          "Esto me recuerda al fuerte de los ogros," dice Hadrik, mientras abre el amuleto de Arraka. "¡Eh, tú! ¡Arraka! ¿Estás detectando algún guardia escondido de forma invisible por aquí? ¡Respóndeme!"

          Arraka no emite ningún sonido, actuando como si no oyera una palabra de lo que dice Hadrik.

          "¿Dándome el tratamiento del silencio, eh?" dice Hadrik, con una sonrisa.

          De repente, Kate congela toda el área a nuestro alrededor, haciendo que parezca que estamos dentro de algún palacio helado de cuento de hadas.

          "El área está despejada," dice Kate. "No hay nadie rodeándonos."

          "Genial," dice Daren. "Ahora descongela el maldito pasillo antes de que alguien vea--"
      - source: scene_text_2
        paragraph: 27
        text: |-
          Antes de que Daren terminara la frase, una puerta frente a nosotros se abrió ligeramente, y un hombre que parecía ser algún tipo de sirviente del castillo asomó la cabeza.

          "El rey va a--" empieza a decir el hombre, pero de repente se queda callado, por la impresión de ver todo el pasillo completamente congelado.

          Tras unos segundos, el hombre empieza a hablar de nuevo, decidiendo actuar como si nada hubiera pasado.

          "El rey será notificado de su llegada en breve," dice el sirviente. "Por favor esperen en este pasillo hasta que sea la hora de su cita programada."

          Entonces cierra la puerta sin decir otra palabra.

          "¡Bueno, ya habéis oído al hombre!" dice Flower. "Todavía nos queda mucho tiempo hasta la reunión. ¡Vamos a explorar!"

          "¿De qué hablas?" dice Daren. "Nos dijo que esperáramos aquí. ¡Y Kate todavía tiene que descongelar el pasillo antes de que alguien más vea esto!"

          "No puedo descongelarlo," dice Kate. "Se derretirá solo en unas horas."

          "¡No tenemos unas horas!" dice Daren. "¡Si el rey ve esto, nos cortará la cabeza!"

          "¡Relájate!" dice Hadrik. "¿Qué es lo peor que podría pasar?"
      - source: scene_3
        paragraph: 4
        text: |-
          "¡Santos dioses, hombre!" dice Daren, exasperado. "¿No hay nada que te altere?"

          De repente, toda el área a nuestro alrededor se cubre de llamas, y todo el hielo se derrite rápidamente convirtiéndose en agua, que luego se evapora casi instantáneamente. Las llamas desaparecen entonces tan rápido como aparecieron, dejando el pasillo en el mismo estado en que estaba cuando llegamos.

          "Listo," dice Flower. "Me he encargado. Ahora, ¿alguien quiere ir a explorar?"
    choices:
