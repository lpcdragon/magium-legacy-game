scenes:
  - name: b2_ch01a_intro
    texts:
      - source: scene_text
        paragraph: 2
        text: |-
          "¿Nuestros primeros objetivos?" pregunta Hadrik. "¿He oído bien?"

          "¡Así es, has oído bien!" dice Golmyck, el rey gnomo, como si estuviera respondiendo a la pregunta de Hadrik. "Ahora voy a anunciar los objetivos de la primera ronda del torneo, así que más vale que prestéis atención, porque no pienso repetirlo. ¿Estáis listos?"

          Golmyck hace una breve pausa antes de continuar.

          "¡Muy bien, entonces!" dice. "Vuestros primeros objetivos son los siguientes. Cada uno de vosotros deberá encontrar una piña luminosa y llevarla a la ciudad de Galamir. Las piñas luminosas solo crecen en el continente de Varathia, así que la mayoría probablemente no sepáis mucho sobre ellas, pero básicamente parecen piñas normales, excepto que empiezan a brillar intensamente cuando las tomas en tu mano. No hay límite de tiempo para completar estos objetivos, pero cuanto antes llevéis las piñas a su destino, más rápido podréis empezar con vuestros siguientes objetivos, lo que os dará ventaja frente a los rezagados. Por último, me gustaría mencionar que en esta ronda se os permitirá formar equipos con otros participantes. Un equipo puede tener tantos miembros como queráis, y si todos confirmáis que formáis parte del mismo equipo cuando lleguéis a Galamir, pasaréis la primera ronda juntos, siempre que tengáis al menos una piña con vosotros. Eso es todo por ahora. ¡Buena suerte!"

          "¡¿Qué?!" grita Hadrik. "¡No puede ir en serio! ¿Cómo pueden llamar a esto un torneo de magos con objetivos así? ¿Qué será lo próximo, decirnos que vayamos a recoger flores?"
    effects:
      - set:
          successful_checks:
            - 'Punto de control alcanzado: Partida guardada.'
        condition: checkpoint_rich = 1
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch01a_intro2_dead
              checkpoint_rich: 0
            condition: ch11_saved_rose = 0
          - set:
              current_scene: b2_ch01a_intro2_alive
              checkpoint_rich: 0
            condition: ch11_saved_rose = 1
  - name: b2_ch01a_intro2_dead
    texts:
      - source: scene_text
        paragraph: 3
        text: |-
          "Hadrik..." dice Daren, con una expresión muy sombría en el rostro. "Sinceramente, ahora mismo me importan un bledo los objetivos del torneo."

          "¡Ah, casi se me olvida algo muy importante!" dice Golmyck. "Daren, el sanador con armadura, y todos los miembros de su grupo deben presentarse en las puertas del castillo real de Thilias en exactamente cinco horas. Esto incluye al enano, a la maga artificial y al lessathi. No hacerlo resultará en su descalificación del torneo. La niña que viaja con ellos también puede unirse a ellos si lo desea, pero no está obligada. ¡Gracias a todos por escuchar! ¡Que tengáis un buen día!"

          El gnomo entonces presiona un botón y la transmisión se interrumpe, mientras las pantallas holográficas en el aire empiezan a desaparecer lentamente, una por una.

          "Espera, ¿cómo sabía que Barry era un lessathi?" dice Hadrik. "¿No se enteró el propio Barry de esto hace poco?"

          "El hecho de que el rey de Thilias conociera las verdaderas identidades tanto de Barry como de Kate sugiere fuertemente que nos ha estado vigilando durante un tiempo," dice Illuna. "Debe tener espías que le informan de todo lo que ocurre en su reino. No me sorprendería demasiado si también supiera de mi existencia."
      - source: scene_text_2
        paragraph: 2
        text: |-
          "Ah, mierda," dice Hadrik. "Si ese es el caso, entonces quizás también sepa que soy un gigante. A lo mejor nos llaman al castillo para echarme del torneo."

          "Nos convocan por lo que pasó con el noble ayer," dice Daren. "Incluso tienen recompensas por nuestras cabezas. No deberíamos sorprendernos de que quieran interrogarnos. Vamos, dirijámonos a la casa de Rose. Ir al hospital ahora está descartado sin Rose para guiarnos, y sería prudente recoger nuestras mochilas antes de encaminarnos al castillo."

          Daren hace una pausa.

          "Uno de nosotros también tendrá que dar la noticia de la muerte de Rose a sus hermanos cuando lleguemos allí," dice.
    choices:
      - position: 1
        text: Ofrecerse voluntario para dar la noticia a los niños
        effects:
          - set:
              current_scene: b2_ch01a_volunteer
              b2_ch1_volunteer: 1
              ac_b2_ch1_news: 1
            achievement:
              id: ac_b2_ch1_news
              title: Portador de malas noticias
      - position: 2
        text: Guardar silencio
        effects:
          - set:
              current_scene: b2_ch01a_silent
              b2_ch1_volunteer: 0
  - name: b2_ch01a_intro2_alive
    texts:
      - source: scene_text
        paragraph: 4
        text: |-
          "¿Tal vez necesitéis usar magia para encontrar las piñas?" sugiere Rose. "Soy herborista, pero nunca he oído hablar de piñas luminosas."

          "¡Ah, casi se me olvida algo muy importante!" dice Golmyck. "Daren, el sanador con armadura, y todos los miembros de su grupo deben presentarse en las puertas del castillo real de Thilias en exactamente cinco horas. Esto incluye al enano, a la maga artificial y al lessathi. No hacerlo resultará en su descalificación del torneo. La niña que viaja con ellos también puede unirse a ellos si lo desea, pero no está obligada. ¡Gracias a todos por escuchar! ¡Que tengáis un buen día!"

          El gnomo entonces presiona un botón y la transmisión se interrumpe, mientras las pantallas holográficas en el aire empiezan a desaparecer lentamente, una por una.

          "Espera, ¿cómo sabía que Barry era un lessathi?" dice Hadrik. "¿No se enteró el propio Barry de esto hace poco?"

          "El hecho de que el rey de Thilias conociera las verdaderas identidades tanto de Barry como de Kate sugiere fuertemente que nos ha estado vigilando durante un tiempo," dice Illuna. "Debe tener espías que le informan de todo lo que ocurre en su reino. No me sorprendería demasiado si también supiera de mi existencia."

          "Ah, mierda," dice Hadrik. "Si ese es el caso, entonces quizás también sepa que soy un gigante. A lo mejor nos llaman al castillo para echarme del torneo."
      - source: scene_text_2
        paragraph: 3
        text: |-
          "Nos convocan por lo que pasó con el noble ayer," dice Daren. "Incluso tienen recompensas por nuestras cabezas. No deberíamos sorprendernos de que quieran interrogarnos. Vamos, démonos prisa hacia el hospital. No nos queda mucho tiempo."

          "El hospital puede esperar," dice Rose. "Ninguno de los heridos está en estado crítico, y solo tenéis cinco horas para llegar al castillo. Todavía tenemos que volver a mi casa para que podáis recoger vuestras mochilas, y llegar al castillo desde allí os llevará casi dos horas a pie."

          "¿Tu ciudad no tiene algún tipo de transporte público que podamos usar para llegar más rápido?" pregunta Daren.

          "¿Como qué?" pregunta Rose.

          "Bueno, ya sabes..." dice Daren. "¿Como carruajes? ¿Tirados por caballos?"

          "¡Oh, dioses, no!" dice Rose, escandalizada. "¿Quién obligaría a un caballo a tirar de un carruaje? ¡Eso sería incluso más horrible que la caza de animales! Además, los animales abandonaron nuestra ciudad hace décadas, cuando comenzaron las cacerías. Ahora todos viven en el dominio del zorro dorado."

          "Oh, claro, claro," dice Daren. "Los animales pueden hablar aquí. Se me olvidó. De acuerdo, pongámonos en marcha, entonces. Mientras mantengamos un paso constante, deberíamos llegar bien."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch01a_spin
  - name: b2_ch01a_volunteer
    texts:
      - source: scene_text
        paragraph: 5
        text: |-
          "Yo lo haré," digo. "Intentaré dárselo lo más suavemente posible."

          Daren me lanza una larga mirada durante unos segundos. No parece muy cómodo dejando este asunto en mis manos, pero tampoco parece querer ser él quien se encargue, ni nadie más, por lo que puede verse.

          "De acuerdo," dice Daren, finalmente. "Barry será quien dé la noticia a los niños. ¿Alguna objeción?"

          Todos los demás guardan silencio, mientras Kate y Flower bajan la mirada al suelo.

          "Entonces está decidido," dice Daren. "Pongámonos en marcha. Tomaremos la misma ruta que usamos cuando vinimos, para no perdernos. Seguidme."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch01a_spin
  - name: b2_ch01a_silent
    texts:
      - source: scene_text
        paragraph: 6
        text: |-
          Decido guardar silencio, y todos los demás también. Kate y Flower están mirando al suelo, mientras Hadrik se rasca la nuca incómodamente.

          "Yo me encargo," dice Daren, tras ver que nadie quiere ofrecerse voluntario para la tarea. "Ahora, pongámonos en marcha. No tenemos mucho tiempo. Tomaremos la misma ruta que usamos cuando vinimos, para no perdernos. Seguidme."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch01a_spin
  - name: b2_ch01a_spin
    routes:
      - condition: ch11_saved_rose = 0
        texts:
          - source: scene_text
            paragraph: 7
            text: |-
              "¿Puedo recuperar a Arraka, por favor?" le pregunta Flower a Hadrik, mientras nos dirigimos hacia la mansión.

              "La verdad, ¡prefiero quedármela un poco más, si no te importa!" dice Hadrik.

              "Bueno, está bien..." dice Flower. "Pero asegúrate de vigilarla."

              "No te preocupes," dice Hadrik, mientras empieza a girar el amuleto de nuevo. "¡Me aseguraré de darle toda la atención que necesita!"

              Todos seguimos a Daren y volvemos por donde vinimos, mientras poco a poco dejamos atrás los barrios bajos y entramos en el distrito más rico donde se encuentra la casa de Rose.

              Nadie dijo una sola palabra mientras caminábamos por los callejones, ni siquiera Hadrik. Kate en particular parecía ser la más afectada por lo que había ocurrido, y la expresión de su rostro era muy dolorosa de ver. En medio del silencio, una enfurecida Arraka de vez en cuando nos lanzaba una variedad de insultos y amenazas, mientras Hadrik la ignoraba y seguía girando su amuleto a pesar de sus quejas interminables.
          - source: scene_text_2
            paragraph: 4
            text: |-
              "¿Quieres hacer que se calle?" dice Daren, después de un rato. "Ya he tenido suficiente de Arraka para toda una semana. No necesito escuchar su parloteo constante durante todo el viaje."

              "Oh, claro, perdona..." dice Hadrik, mientras cierra el amuleto y luego continúa haciéndolo girar por la cadena.

              Los gritos de Arraka aún son audibles, pero ahora son más una molestia leve, ya que el ruido se ha amortiguado.

              "Creo que mi muñeca está empezando a entumecerse de tanto girar," dice Hadrik, unos minutos después. "Barry, ¿qué dices? ¿Quieres intentarlo? ¡Te aseguro que es una experiencia muy gratificante!"
        choices:
          - position: 1
            text: Claro, ¿por qué no?
            effects:
              - set:
                  current_scene: b2_ch01a_sure_dead
                  b2_ch1_spin: 1
          - position: 2
            text: Creo que paso, gracias.
            effects:
              - set:
                  current_scene: b2_ch01a_pass_dead
                  b2_ch1_spin: 0
      - condition: ch11_saved_rose = 1
        texts:
