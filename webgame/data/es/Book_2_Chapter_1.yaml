    texts:
      - source: scene_text
        paragraph: 16
        text: |-
          "¿Es realmente el momento y el lugar para tomar una copa?"

          "¿De qué hablas?" dice Enrique. "¡Siempre es un buen momento y lugar para tomar una copa! Beber une a las personas. Solo pregúntale a tu amigo enano. Los enanos son famosos por sus hábitos excesivos de bebida, y aun así son una de las razas más unidas del mundo."

          "Así es," dice Hadrik. "Aunque hay una teoría muy extendida de que la única razón por la que los enanos no guardan rencor es porque siempre están demasiado borrachos para recordar lo que hicieron el día anterior. Por cierto, me llamo Hadrik. ¡Encantado de conocerte!"

          Hadrik entonces estrecha la mano de Enrique y nos presenta a los demás uno por uno.

          "Este de aquí es Barry," dice Hadrik. "Este es Daren. Allí tenemos a Kate, y la niña se llama Flower. Ah, y también tenemos dos banshees. La que está dentro del cuerpo de la niña se llama Illuna, y la que está en el amuleto que llevo se llama Arraka."
      - source: scene_text_2
        paragraph: 13
        text: |-
          Se oye un murmullo apenas audible proveniente del amuleto cerrado, cuando Hadrik termina de hablar, pero nadie le presta atención.

          "¿Dos banshees?" pregunta Enrique, un poco sorprendido. "¿Y Rose era amiga de ambas?"

          "Bueno, de ambas no," dice Hadrik. "La del amuleto es más nuestra prisionera que nuestra aliada, la verdad, pero Illuna y Rose definitivamente eran muy buenas amigas."

          "Bueno, en ese caso siempre será bienvenida aquí, banshee o no," dice Enrique. "¡Ah, aquí viene nuestro vino!"
