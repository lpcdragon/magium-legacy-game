      - source: scene_text
        paragraph: 31
        text: |-
          "¡Eh, no me des por perdido antes de que el torneo haya empezado siquiera!" digo. "Ha habido gente corriente que ha ganado concursos contra magos antes, ¿sabes?"

          Rose se ríe.

          "Sí, y cada uno de ellos fue un concurso de beber," dice. "Ya sabes a qué me refiero, Barry... Incluso si ganas el torneo, seguimos siendo parte de dos mundos completamente diferentes. Mundos que han estado casi totalmente aislados el uno del otro durante miles de años."

          "¿Y qué?" digo. "El ganador del torneo recibe el derecho de entrar y salir de Varathia cuando quiera, ¿recuerdas? Tú solo espera aquí. En cuanto gane este torneo, conseguiré mis poderes de mago bien rápido, ¡y luego volveré a por ti! ¡Es una promesa!"

          La cara de Rose empieza a ponerse roja de nuevo lentamente al escuchar mis palabras.

          "Oye, Rose, ¿son este tipo de señalizaciones las que deberíamos buscar en el camino de vuelta?" dice Hadrik, mientras él y los demás se acercan a nosotros.

          Entonces se detiene al ver la cara roja de Rose, y va cambiando la mirada entre los dos varias veces antes de seguir hablando.

          "¿Estoy... interrumpiendo algo?" pregunta.

          "¡No, tranquilo!" dice Rose, intentando recuperar la compostura rápidamente. "¡Sí, esas son exactamente el tipo de señales que debéis buscar! Nos las iremos encontrando más a menudo a medida que nos acerquemos al castillo. Vamos, seguidme. ¡Tenemos que pasar por este callejón!"
