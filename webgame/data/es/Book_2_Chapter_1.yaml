  - name: b2_ch01a_sure_alive
    texts:
      - source: scene_text
        paragraph: 11
        text: |-
          "Claro, ¿por qué no?" digo, mientras agarro el amuleto y empiezo a girarlo también.

          La voz amortiguada de Arraka se hace más fuerte ahora, pero no puedo distinguir lo que intenta decir. Probablemente sea mejor que no lo sepa.

          "Y bien, ¿qué pensáis de vuestros primeros objetivos?" nos pregunta Flower, mientras seguimos caminando hacia la mansión.

          "Yo opino que el que los ideó puede metérselos por el--" empieza a decir Hadrik, pero Daren lo interrumpe.

          "Sí, ya te oímos la primera vez," dice. "Lo hecho, hecho está. Estoy seguro de que no serás el único que tenga quejas sobre la cuestionable naturaleza de estos objetivos. A mí personalmente me alivia que no nos hayan dicho que empecemos a matarnos entre nosotros o algo así. Eso habría aumentado las bajas dramáticamente."

          "Pero, ¿cómo vais a encontrar las piñas?" pregunta Flower. "¡He vivido aquí durante años y ni siquiera sé cómo son!"

          "Bueno, tampoco es que las hayas estado buscando específicamente," digo. "¿Quizás haya alguien en esta ciudad que pueda ayudarnos?"

          "No sé qué decir," dice Rose. "Tengo bastantes conocimientos de herbolaria y estas piñas luminosas nunca aparecieron en ninguno de los libros que he leído. Puede que las hayan descubierto hace poco."

          "¿Entonces estás diciendo que lo más probable es que ellos tampoco sepan dónde están estas piñas, y simplemente están aprovechando la situación para hacernos buscarlas en su lugar?" pregunta Hadrik.
      - source: scene_text_2
        paragraph: 8
        text: |-
          "Bueno, no es exactamente lo que estaba diciendo, pero--"

          "¡Oh, lo juro, cuando ponga mis manos encima de ese rey de Thilias, lo voy a lanzar de un guantazo al otro lado de la sala, guardias o no guardias!" dice Hadrik.

          "No, no lo harás," dice Kate. "Todavía no puedes hacer daño a ningún local, ¿recuerdas?"

          "¡Maldición, tienes razón!" dice Hadrik. "Pero quizás no sea demasiado tarde. Quizás Eiden aún me dé el poder si se lo pido amablemente."

          El enano se detiene en medio del camino y empieza a gritar lo más fuerte que puede.

          "¡Eiden!" dice. "¡Eh, Eiden, ¿me oyes?! ¡Yo también quiero el poder! ¡Sal de ahí, maldita sea, sé que te escondes por aquí cerca!"

          "Eh, ¿Hadrik?" dice Rose, sonriendo con incomodidad. "Hay gente viviendo en estas casas. ¿Podrías bajar un poco la voz? Además, no deberías detenerte en medio del callejón así. Podrías tener problemas para encontrar el camino de vuelta a mi casa si nos pierdes de vista."

          "Oh, claro, perdona," dice Hadrik. "¡Ya voy!"
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch01a_lover
