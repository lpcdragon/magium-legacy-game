  - name: b2_ch01a_shapeshift
    texts:
      - source: scene_text
        paragraph: 57
        text: |-
          "Bienvenidos a mi castillo dentro de mi castillo," dice Golmyck. "Encontré esta sala secreta poco después de mudarme aquí, y rápidamente decidí aprovechar el gran espacio sin usar para montar mi nuevo taller. No he tenido oportunidad de cacharrear con dispositivos tan a menudo como me habría gustado desde que me convertí en rey, pero este lugar siempre me relaja después de una discusión acalorada como la que tuve con el embajador antes."

          "¿Ha dicho que tenía algo que quería discutir con nosotros en privado?" dice Daren.

          "Sí, así es," dice Golmyck. "Empecemos con vuestro amigo gigante de ahí, que ahora mismo está haciendo un cambio de forma para convertirse en un enano."

          "¡Maldita sea!" dice Hadrik. "Debería haber sabido que era demasiado bueno para ser verdad. ¿Es esta la parte donde me echas del torneo?"

          "¡Por supuesto que no!" dice Golmyck. "Las reglas del torneo nunca declararon explícitamente que los gigantes no estaban permitidos en el torneo. Solo evitamos invitar a gigantes a este concurso por la abrumadora ventaja que obtendríais tanto de vuestro tamaño como de vuestra fuerza. Sin embargo, dado que te has encogido voluntariamente al tamaño de un enano, hemos decidido hacer una excepción en tu caso. Se te permitirá participar en este torneo, siempre y cuando no uses el cambio de forma para convertirte en nada más grande de lo que sería normalmente posible para un enano. Y además, dado que pareces tan encariñado con tu forma de enano, así es como te presentarás ante todos los demás participantes de ahora en adelante. No quiero que ninguno de los otros magos descubra que en realidad eres un gigante. ¿Queda claro?"
      - source: scene_text_2
        paragraph: 47
        text: |-
          "¡Más claro que el agua!" dice Hadrik, sonriendo felizmente.

          "Bueno, en ese caso, ¡eres libre de irte!" dice Golmyck. "No tengo más asuntos que discutir contigo."

          "¿Quieres decir que soy libre de irme a la arena, o..."

          "No, quiero decir que eres libre de continuar con la primera ronda del torneo," dice Golmyck. "A diferencia de tus amigos, tú no estabas presente en la escena del crimen, así que no hay razón para encarcelarte. No hay necesidad de que vayas a la arena."

          "¡Y un cuerno que no!" grita Hadrik. "¿Crees que he venido hasta aquí para ir a buscar piñas? ¡He venido a luchar, maldita sea! ¡Te juro que si no me dejas luchar en esta arena, voy a empezar a destrozar todo el barrio hasta que tus guardias me metan allí ellos mismos!"
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch01a_apology
  - name: b2_ch01a_apology
    texts:
      - source: scene_text
        paragraph: 58
        text: |-
          "Bueno, si insistes, puedo escribirte una carta de admisión, que puedes darle a los guardias en la entrada de la arena," dice Golmyck. "Seguro que te dejan entrar cuando vean el sello real."

          "¡Perfecto!" dice Hadrik. "¡Muy agradecido!"

          "¿También debería escribir una carta para la chica y la banshee de ahí?" dice Golmyck, mientras mira hacia Flower.

          "Eh, bueno--" empieza a decir Flower, pero Illuna la interrumpe.

          "No, estamos bien," dice, mientras los ojos de la chica se vuelven azules. "Veremos el espectáculo desde las gradas."

          "Muy bien," dice Golmyck. "Entonces me aseguraré de proporcionaros una entrada."

          "Veo que ha hecho los deberes," dice Hadrik. "No pensé que también supiera lo de Illuna."

          "Mis espías han recibido la instrucción de ser especialmente vigilantes cuando se trata de magos de otros continentes," dice Golmyck. "Os han estado vigilando de cerca desde que entrasteis en la ciudad."

          "¿Eso significa que también nos estaban vigilando cuando atacamos al noble?" dice Daren.
      - source: scene_text_2
        paragraph: 48
        text: |-
          "Sí..." dice Golmyck. "Esta es la segunda razón por la que quería hablar con vosotros en privado. En primer lugar, me gustaría ofreceros una disculpa. Me imagino que la escena que presenciasteis aquel día debió de ser bastante impactante para forasteros como vosotros."

          "No parece que apruebe lo que estaba pasando con la chica esclava," dice Kate.

          "No lo apruebo," dice Golmyck. "Personalmente, me parece repugnante la forma en que nuestra sociedad trata a los esclavos, y todos somos responsables de alguna manera por permitir que este sistema continúe. Yo mismo no soy mucho mejor que mis predecesores, porque apenas he hecho nada concluyente para abordar el problema desde que me mudé a este castillo."

          "Pero ¿por qué?" pregunta Daren. "¿Por qué no ha hecho nada? Usted es el rey. Podría hacer tanto por ayudar a estas personas..."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch01a_interfere
  - name: b2_ch01a_interfere
    texts:
      - source: scene_text
        paragraph: 59
        text: |-
          "Mire ahí arriba," dice Golmyck, mientras señala un dispositivo de metal colgado del techo.

          "¿Qué pasa con eso?" pregunta Daren, tras echarle un vistazo rápido al dispositivo.

          "Lo que ven ahí arriba es un invento de mi propia creación, con el único propósito de bloquear las comunicaciones hacia el exterior," dice Golmyck. "Lo instalé aquí poco después de mi llegada al castillo."

          "¿Está diciendo que alguien podría estar intentando escuchar nuestra conversación?" digo.

          "¡Oh, están intentándolo con toda seguridad!" dice Golmyck. "Quizás no lo hayáis notado, pero la sala de arriba está plagada de docenas de dispositivos ocultos, hechos para espiar conversaciones. No se equivoquen, no soy la única persona con una red de información en esta ciudad. Y el control que tengo sobre mi reino es en realidad mucho más limitado de lo que podrían pensar."

          "¿Y quiénes son exactamente las personas que le vigilan?" pregunta Hadrik. "¿Los otros reyes?"

          "Sí, en cierto modo," dice Golmyck. "Los encargados de vigilarme son un grupo de lessathi que son aliados de los otros reyes, pero que trabajan de forma independiente. Controlan una vasta red subterránea de espías y asesinos que rivalizan con la mía, y su propósito es asegurarse de que no tome demasiadas iniciativas que pudieran 'poner en peligro' el futuro de Varathia. Si intento tomar una decisión tan audaz como liberar a todos los esclavos de mi ciudad, bien podría ser asesinado antes siquiera de conseguir firmar el decreto."
      - source: scene_text_2
        paragraph: 49
        text: |-
          "Entonces, ¿simplemente se va a quedar aquí sin hacer nada?" pregunta Daren.

          "En absoluto," dice Golmyck. "De hecho, llevo años trabajando para mejorar nuestras relaciones con el reino animal precisamente para esto. Sus territorios han ido reduciéndose cada vez más debido al creciente número de ataques de monstruos en los últimos años, así que sus negociadores se han vuelto un poco menos rígidos últimamente. Les prometí proporcionarles refugio dentro de nuestros muros, a cambio de que nos ayudaran a eliminar la amenaza lessathi de nuestra ciudad. Tendré una reunión en esta misma sala con uno de los representantes del reino animal en unos días, donde discutiremos exactamente este tema. Si todo va bien, es muy probable que lleguemos a un acuerdo en los próximos meses."

          "Entonces, ¿lo que intenta decirnos es que lo tiene todo bajo control, y que no deberíamos interferir más?" pregunta Hadrik.

          "Sí, exacto," dice Golmyck. "Quería asegurarme de que fuerais conscientes de toda la situación, por si os sentíais tentados a hacer algo imprudente de nuevo."
    choices:
      - position: 1
        text: En realidad, creo que ya hemos cubierto nuestra cuota de acciones imprudentes por esta semana.
        effects:
          - set:
              current_scene: b2_ch01a_documents
              b2_ch1_interfere: 0
      - position: 2
        text: Unos meses es demasiado tiempo. Quizás podamos encargarnos nosotros de su problema con los lessathi.
        effects:
          - set:
              current_scene: b2_ch01a_documents
              b2_ch1_interfere: 1
  - name: b2_ch01a_documents
    routes:
      - condition: b2_ch1_interfere = 0
        texts:
          - source: scene_text
            paragraph: 60
            text: |-
              "En realidad, creo que ya hemos cubierto nuestra cuota de acciones imprudentes por esta semana," digo.

              "Estos lessathi de los que habló..." le dice Kate a Golmyck. "¿Sabe si están trabajando con otros magos artificiales? ¿Hay una mujer llamada Diane, que controla la electricidad, ayudándoles?"

              "Que yo sepa, los lessathi de mi ciudad no emplean a ningún mago como guardaespaldas," dice Golmyck. "Mis espías seguramente se habrían enterado a estas alturas, si hubiera otros magos artificiales en Thilias."

              "Ya veo..." dice Kate.

              "Hay una cosa más que necesito deciros a todos antes de que os vayáis," dice Golmyck, mientras se vuelve hacia el resto de nosotros. "Si conseguís sobrevivir a la arena y ganar vuestra libertad, tendréis que pasar de nuevo por mi castillo, para recibir unos documentos que demostrarán que habéis cumplido vuestra condena por vuestros crímenes. Aunque lo más probable es que estos documentos no sean necesarios en Thilias, deberían ayudaros a tratar con guardias que puedan intentar arrestaros en otras ciudades, por el asesinato del conde de Ollendor. Ahora, a menos que tengáis algo más que discutir conmigo, empezaré a escribir esa carta de admisión para el enano, y luego podréis seguir vuestro camino."
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch01a_ending
      - condition: b2_ch1_interfere = 1
        texts:
          - source: scene_text
            paragraph: 61
            text: |-
              "Unos meses es demasiado tiempo. Quizás podamos encargarnos nosotros de su problema con los lessathi."

              "¿Oh?" dice Golmyck, mientras se acaricia la barbilla. "¿Y hablas en nombre de todo tu equipo, al hacer esta propuesta, joven lessathi? ¿O solo hablas por ti mismo?"

              Las palabras del gnomo me pillaron desprevenido. Aunque ya llevamos viajando juntos una semana, no estoy seguro de que todos estuvieran de acuerdo en unirse a esta misión potencialmente suicida.

              Mientras me quedo ahí, e intento pensar en una respuesta para darle al gnomo, Daren se pone de mi lado, y me pone la mano en el hombro.

              "Habla también por mí," le dice Daren a Golmyck.

              "Y por mí," dice Hadrik, mientras da un paso al frente. "Después de oír lo que le pasó a la chica esclava, ayer, estaré más que encantado de darles una lección a esos bastardos, si son los responsables de lo que está pasando en esta ciudad."

              "Interesante," dice Golmyck, y luego se vuelve hacia Kate. "¿Y usted, maga artificial? ¿También se ofrece voluntaria para esta misión?"

              "Estos lessathi de los que habló..." dice Kate. "¿Sabe si están trabajando con otros magos artificiales? ¿Hay una mujer llamada Diane, que controla la electricidad, ayudándoles?"
          - source: scene_text_2
            paragraph: 50
            text: |-
              "Que yo sepa, los lessathi de mi ciudad no emplean a ningún mago como guardaespaldas," dice Golmyck. "Mis espías seguramente se habrían enterado a estas alturas, si hubiera otros magos artificiales en Thilias."

              "Ya veo..." dice Kate, y hace una pausa de unos segundos. "Aunque Diane no esté en esta ciudad, todavía hay una posibilidad de que los lessathi sepan algo sobre su paradero actual. Si de todas formas planeáis asaltar su cuartel general, entonces yo también voy."

              "Bueno, si todos los demás van, entonces nosotras también vamos, ¿verdad Petal?" dice Flower, con entusiasmo.

              Los ojos de la chica se vuelven azules de nuevo, mientras Illuna suelta un profundo suspiro, pero no dice nada.

              "Debo admitir que no esperaba que todos os ofrecierais a ayudar tan de todo corazón," dice Golmyck.

              Se toma unos momentos para aclarar sus pensamientos antes de continuar.

              "Muy bien, entonces," dice Golmyck. "Pensaré en lo que habéis dicho. Continuaremos esta discusión más adelante, cuando volváis de la arena. Después de que consigáis ganar vuestra libertad, tendréis que pasar de nuevo por mi castillo, para recibir unos documentos que demostrarán que habéis cumplido vuestra condena por vuestros crímenes. Aunque lo más probable es que estos documentos no sean necesarios en Thilias, deberían ayudaros a tratar con guardias que puedan intentar arrestaros en otras ciudades, por el asesinato del conde de Ollendor. Ahora, a menos que tengáis algo más que discutir conmigo, empezaré a escribir esa carta de admisión para el enano, y luego podréis seguir vuestro camino."
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch01a_ending
  - name: b2_ch01a_ending
    texts:
      - source: scene_text
        paragraph: 62
        text: |-
          Cuando termina de hablar, Golmyck escribe unas palabras en un trozo de papel, estampa su sello en la carta, y luego se la entrega a Hadrik, para que pueda mostrársela a los guardias en la arena. Justo cuando nos damos la vuelta para irnos, el gnomo de repente recuerda que se le olvidó decirnos algo.

          "Oh, y una última cosa," dice Golmyck. "Creo que esto debería ser obvio, pero lo mencionaré de todas formas. No debéis hablar de nada de lo que hemos discutido en esta sala mientras estéis dentro de la ciudad. Ni siquiera entre vosotros. Nunca se sabe cuándo alguien podría estar escuchando. Os llamé a esta sala segura para charlar en privado porque sentí que podía confiaros esta información. Espero que no traicionéis mi confianza."

          "Por supuesto que no..." dice Daren. "Tendremos cuidado."

          "Muy bien, entonces," dice Golmyck. "En ese caso, ¡os deseo suerte en la arena, y que los dioses estén con vosotros!"

          "Que nos protejan a todos," dice Daren.
      - source: scene_text_2
        paragraph: 51
        text: |-
          Después de terminar nuestra discusión con Golmyck, nos despedimos del gnomo, y lo dejamos trabajar en sus dispositivos, mientras empezábamos a subir por las estrechas escaleras, uno por uno. Cuando llegamos a la sala del trono, el sirviente del rey ya nos estaba esperando, en lo alto de las escaleras.

          "Por aquí, si son tan amables," dice el sirviente, mientras empieza a caminar hacia la salida. "Asegúrense de seguirme de cerca, para que no se pierdan."

          "No te preocupes, Barry, ¡vamos justo detrás de ti!" dice Hadrik, y luego me dirige una amplia sonrisa. "¿Verdad que sí, Barry?"

          "Oh, cállate," le digo, mientras todos empezamos a seguir al sirviente fuera de la sala, y hacia nuestra nueva prisión.
