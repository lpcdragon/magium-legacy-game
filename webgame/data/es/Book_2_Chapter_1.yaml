  - name: b2_ch01a_bricks
    routes:
      - condition: b2_ch1_puzzle2 = 1
        texts:
          - source: scene_text
            paragraph: 34
            text: |-
              "Claro, yo voy."

              "¡Perfecto!" dice Flower. "¡Sígueme!"

              "¡Oh, vamos!" dice Daren. "¿Qué se supone que le decimos al sirviente si vuelve y pregunta por vosotros?"

              "Dile que volvemos enseguida," digo. "Y luego llámame por el transceptor."

              Daren niega con la cabeza en desaprobación, pero no dice nada más. Voy a alcanzar a Flower, que parece haberse detenido frente a un muro, no muy lejos de nuestra posición original. Tras mirar el muro desde diferentes ángulos, la chica empieza a golpear los ladrillos, uno por uno, como si estuviera buscando algo.

              "¿Hay algo especial en este muro?" le pregunto.

              "¡Shhh, estoy intentando escuchar!" dice Flower, mientras sigue golpeando los ladrillos.

              Tras unos segundos más, la chica finalmente parece haber encontrado lo que buscaba, y empieza a sacar uno de los ladrillos del muro con ambas manos. Cuando deja el ladrillo en el suelo, veo que dentro del hueco dejado en el muro hay una pequeña palanca de madera.

              "Vaya, sí que sabes lo que haces, ¿eh?" le digo a Flower.

              "¡Por supuesto!" dice Flower. "¡Petal y yo hemos recorrido docenas de ruinas con pasadizos ocultos! ¡Es algo así como nuestro pasatiempo!"
          - source: scene_text_2
            paragraph: 28
            text: |-
              "Menos un pasatiempo y más una tendencia a meterse en peligro mortal semanalmente," dice Illuna, mientras los ojos de la chica vuelven a ponerse azul brillante.

              "¡Ya está!" dice Flower, mientras tira de la palanca de madera.

              En cuanto suelta la palanca, los ladrillos que la rodean empiezan a hundirse dentro del muro, abriéndonos paso para pasar al otro lado. Ambos pasamos al otro lado del muro y entramos en una pequeña habitación oscura que tiene un pedestal de piedra en el centro. Al examinarlo más de cerca, parece que hay algo escrito en la parte superior del pedestal, pero está demasiado oscuro para distinguir lo que dice.

              Flower crea un pequeño orbe de fuego, que envía flotando sobre el pedestal, para que pueda leer lo que hay escrito. Ahora que lo veo con claridad, parece que el texto está escrito en Lengua Común.

              "¿Qué dice?" pregunta Flower.

              "Dice: 'Coloca tu palma sobre este pedestal, si te gusta descubrir secretos.'"

              "¡Oh, me encanta descubrir secretos!" dice Flower, y rápidamente coloca su palma sobre la parte superior del pedestal de piedra.
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch01a_bricks2
      - condition: b2_ch1_puzzle2 = 0
        texts:
          - source: scene_text
            paragraph: 35
            text: |-
              "No, prefiero quedarme aquí."

              "¡Allá tú!" dice Flower. "Bueno, si alguien quiere venir, que me siga. Si no, iré yo sola."

              "Espera," dice Daren. "¿Qué se supone que le decimos al sirviente si vuelve y pregunta por ti?"

              "Solo decid que vuelvo enseguida," dice Flower. "No es que el rey tuviera nada que discutir conmigo ni nada. Ni siquiera estoy en el torneo."

              "Bueno, eso es cierto, supongo..." dice Daren, mientras Flower se detiene frente a un muro y empieza a examinarlo de cerca.

              Tras unos segundos, la chica empieza a golpear cada uno de los ladrillos que tiene delante, uno por uno.

              "¿Qué crees que está haciendo?" me pregunta Daren.

              "Probablemente esté buscando un pasadizo secreto, o algo así," digo.

              Poco después de que dejo de hablar, la chica saca un ladrillo del muro, y luego mete la mano en el hueco dejado por el ladrillo que falta. Los ladrillos frente a ella empiezan entonces a hundirse repentinamente dentro del muro, abriéndole paso para pasar al otro lado.

              "Vaya, sí que sabe lo que hace, ¿eh?" digo, mientras la chica desaparece tras el muro.

              "Bueno, la conocimos mientras hacía ejercicios matutinos en unas ruinas llenas de trampas," dice Hadrik.
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch01a_bricks2
