          "¡Ah, la buena y vieja cerveza enana!" dice Enrique. "Hace tiempo que no disfruto de su sabor. Pero te aseguro que el vino que Suzie está a punto de traer hará que la cerveza enana parezca cerveza gnómica en comparación."

          "¡Ahora sí que me has picado la curiosidad!" dice Hadrik. "Después de decir algo así, va a ser muy difícil cumplir con mis expectativas. Por cierto, me llamo Hadrik. ¡Encantado de conocerte!"

