          ac_b2_ch1_second: 1
        achievement:
          id: ac_b2_ch1_second
          title: Segunda pieza del rompecabezas
        condition: b2_ch1_puzzle2 = 1
    routes:
      - condition: b2_ch1_puzzle2 = 1 AND ch8_first_puzzle = 1
        texts:
          - source: scene_text
            paragraph: 36
            text: |-
              De repente, aparece un agujero en la base del pedestal, y dos pequeños objetos salen disparados de él. Cuando me agacho a recogerlos, el agujero se cierra de nuevo. Al mirar más de cerca los dos objetos, veo que uno de ellos es una pieza de un rompecabezas, mientras que el otro es un pequeño pergamino. Sostengo el pergamino en la mano para que tanto Flower como yo podamos ver lo que hay escrito.

              Al leer el texto del pergamino, noto que también está escrito en Lengua Común, y dice: "Encuentra todas las piezas del rompecabezas, y compartiré contigo mi mayor secreto. He dejado una de estas en cada uno de los edificios que he diseñado."

              El pergamino está firmado simplemente como: "El arquitecto de este edificio."

              Parece que el arquitecto de este castillo es también quien diseñó las ruinas del bosque. Ahora tengo dos de estas piezas del rompecabezas en mi poder. Me pregunto cuántas quedan.

              "¡Oye, esto suena divertido!" dice Flower. "¡Yo también quiero una!"

              Pone su palma en el pedestal de nuevo, pero esta vez no pasa nada.

              "¡No me deja sacar otra!" dice Flower. "¡Barry, inténtalo tú!"

              "Oye, Barry, ¿me oyes?" escucho la voz de Daren saliendo del transceptor.
          - source: scene_text_2
            paragraph: 29
            text: |-
              "Sí, te oigo," digo, mientras agarro el transceptor con la mano derecha.

              Flower me frunce el ceño por ignorarla, y me coge la mano izquierda ella misma, colocándola sobre el pedestal. Igual que antes, la base del pedestal se abre y lanza otra pieza del rompecabezas y un pergamino. Flower coge ambos objetos y se los mete en el bolsillo.

              "El sirviente del castillo ha vuelto," dice Daren. "Ha dicho que el rey os recibirá ahora. Date prisa y vuelve aquí, ¿quieres?"

              "Sí, ya vamos," digo.

              Después de salir de la habitación oscura tras el muro, Flower tira de la palanca de nuevo, y los ladrillos vuelven a su posición original. Luego recoge el ladrillo del suelo y lo coloca cuidadosamente de vuelta en el muro.

              "No queremos que nadie más descubra el secreto antes que nosotros, ¿verdad, Barry?" dice Flower, con una sonrisa.

              "Supongo que no," digo, mientras empezamos a volver hacia donde los demás nos esperaban.

              "¿Y bien?" dice Daren cuando los alcanzamos. "¿Encontrasteis lo que buscabais?"

              "¡Sip!" dice Flower, con una sonrisa alegre.

              "Espectacular," dice Daren. "Ahora, vamos."
