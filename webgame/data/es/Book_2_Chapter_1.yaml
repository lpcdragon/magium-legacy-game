      - source: scene_text
        paragraph: 54
        text: |-
          "¿Qué te hace pensar que simplemente vamos a aceptar que nos lleven a la arena?"

          "Bueno, sois libres de resistir el arresto, por supuesto," dice Golmyck. "Pero eso también resultaría en vuestra descalificación inmediata del torneo. ¿Es eso lo que queréis?"

          Abro la boca para decir algo, pero no se me ocurre ninguna réplica ingeniosa. En vez de eso, decido guardar silencio.

          "Por supuesto que no," dice Golmyck, respondiendo a su propia pregunta. "No sé cuáles habrán sido las razones o motivaciones de cada uno para venir aquí, pero me imagino que si fueron lo bastante fuertes como para haceros querer arriesgar vuestras vidas en un torneo como este, definitivamente no dejaríais que un obstáculo tan menor se interpusiera en vuestro camino. Si os sirve de ayuda, podéis considerar esta arena como una ronda de clasificación extra, por así decirlo. Para que entréis en calor de cara al evento principal. Ahora, ¿dónde estaba esa palanca oculta?... ¡Ah, sí, aquí está!"

          El gnomo mete la mano derecha detrás del trono y tira de una palanca. Esto hace que uno de los bloques de piedra que forman el suelo frente a nosotros se aparte por sí solo, revelando una escalera oculta que lleva a los niveles inferiores del castillo.

          "Barry, dejo la sala del trono a tu cargo hasta mi regreso," dice Golmyck.
      - source: scene_text_2
        paragraph: 44
        text: |-
          "¿Qué?..." digo.

          "Sí, su majestad," dice el sirviente del rey, casi al mismo tiempo que yo.

          "Oh, mis disculpas," dice Golmyck, después de darse cuenta de la confusión que ha creado. "Le hablaba a mi sirviente. También se llama Barry."

          Entonces se vuelve para mirarnos a todos.

          "¡Muy bien, por aquí, si son tan amables!" dice Golmyck, mientras empieza a bajar las escaleras.

          El resto de nosotros intercambiamos unas miradas, y luego seguimos al gnomo, hasta llegar a una sala subterránea llena de piezas de maquinaria y prototipos, así como diversas herramientas que parecen haber sido tiradas al azar después de su uso. En el centro de la sala hay un banco de trabajo sobre el cual podemos ver un gran dispositivo que parece una versión más grande de los transmisores de Daren, con una luz verde en la parte inferior.

          Cuando entramos en la sala, Golmyck estaba en proceso de quitarse el manto y la corona, y ponerse la bata de laboratorio manchada de aceite que le vimos llevar antes, cuando apareció en el holograma. Ahora que miro con más atención a mi alrededor, me doy cuenta de que esta es de hecho la sala exacta desde la que estaba transmitiendo, y que el dispositivo en el banco de trabajo es probablemente el que acababa de arreglar justo antes de la transmisión.
