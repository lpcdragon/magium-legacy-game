  - name: b2_ch01a_reason
    texts:
      - source: scene_text
        paragraph: 39
        text: |-
          Abrimos las puertas que el sirviente del castillo usó antes, y entramos en un largo pasillo vacío que parece llevar directamente a la sala del trono. Antes de abrir el último par de puertas, Daren nos mira a cada uno para confirmar que estamos listos, y entonces todos entramos en la sala del trono, uno por uno.

          La sala del trono se ve tan vacía como cualquier otra parte del castillo, excepto que hay una larga y estrecha alfombra roja que lleva hasta el trono en el lado opuesto de la cámara, donde el rey está sentado actualmente. De pie junto a él podemos ver al sirviente de antes, y al otro lado, un hombre mayor que no reconozco, pero que parece ser bastante importante, al menos a juzgar por su ropa cara. El gnomo va ahora vestido de forma más regia que en su última aparición, con una corona dorada en la cabeza y un manto rojo sobre los hombros. Cuando llegamos frente a él, nos saluda cortésmente.

          "¡Bienvenidos, amigos!" dice Golmyck. "¡Por favor, sentíos como en casa! Lamento la falta de sillas, pero me han dicho repetidamente que no sería apropiado que gente corriente se sentara en presencia de un rey."

          "Déjese de formalidades, rey de Thilias," dice el hombre de aspecto importante. "No es el momento ni el lugar para observar la etiqueta apropiada."

          "Vamos, vamos, embajador," dice Golmyck. "La etiqueta apropiada es siempre importante, no sea que descendamos a la barbarie."
      - source: scene_text_2
        paragraph: 31
        text: |-
          "¿Me habla de barbarie, cuando las personas ante nosotros son homicidas probados?" dice el embajador. "No vine aquí para escuchar sus sermones. ¡Vine aquí en nombre del rey de Ollendor, para asegurarme de que los responsables de la muerte del hermano de su majestad sean debidamente castigados!"

          "Culpables podrán ser," dice Golmyck, "pero también son nuestros estimados invitados, y me gustaría al menos escuchar sus razones antes de decidir su castigo."

          Entonces se vuelve hacia nosotros.

          "¿Qué decís, valientes guerreros?" dice el gnomo. "¿Cuál fue vuestra razón para matar al conde de Ollendor?"
    choices:
