    texts:
      - source: scene_text
        paragraph: 53
        text: |-
          El embajador se detiene unos segundos para aclarar sus pensamientos.

          "Muy bien, entonces," dice, finalmente. "Los criminales se enfrentarán a su sentencia en la arena. Pero supervisaré los procedimientos personalmente. Quiero asegurarme de que nada salga mal."

          "Por supuesto, embajador," dice Golmyck. "Las arenas son suyas, durante la duración de estos eventos."

          El embajador hace otra pausa.

          "Tres días," dice. "En tres días, organizaré el mayor evento de arena en toda la historia de Varathia. Hasta entonces, los criminales serán encerrados en las celdas bajo la arena de Thilias, junto con los demás gladiadores."

          "¡Entonces queda decidido!" dice Eiden. "Espero con ganas ver lo que tendrá preparado para nosotros, embajador. Le veré de nuevo el día del evento principal. No me decepcione."

          Con estas últimas palabras, Eiden se teletransporta fuera de la sala, sin dejar rastro, como siempre hace.

          "Vosotros, criminales, venís conmigo," dice el embajador. "No quiero que andéis por las calles poniendo más vidas inocentes en peligro."
      - source: scene_text_2
        paragraph: 43
        text: |-
          "En realidad, embajador," dice Golmyck, "me gustaría tener una palabra con ellos en privado primero, si no le importa. Me aseguraré de que uno de mis sirvientes los escolte a sus celdas poco después."

          "Hmph," dice el embajador. "Haga lo que quiera. No pienso perder más tiempo aquí. Tengo asuntos que atender. Solo asegúrese de que estén todos en sus celdas antes de medianoche."

          El embajador entonces se aleja de nosotros y sale de la sala, cerrando la puerta de un portazo a su paso.

          "Muy bien, entonces," dice Golmyck, mientras se levanta de su trono. "Seguidme. Prefiero no tener nuestra discusión en este lugar tan aburrido. Ahora os voy a llevar a mi verdadero castillo, donde podemos hablar a nuestras anchas, hasta que sea hora de llevaros a la arena."
