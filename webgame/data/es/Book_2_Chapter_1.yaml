      - source: scene_text
        paragraph: 28
        text: |-
          "¿Estás casado?"

          "Más o menos..." dice Daren.

          "¿Cómo puedes estar más o menos casado?" pregunto.

          "Dejé a Sophie en la remota aldea del Continente Sur donde pasamos juntos nuestra infancia," dice Daren. "Cuando decidí viajar por el mundo para ayudar a las personas necesitadas, quise divorciarme, para mantenerla lejos del peligro, pero ella no quiso ni oír hablar de eso. Al final, le ofrecí un compromiso, dándole la libertad de hacer su vida con otro hombre si quería, aunque técnicamente siguiéramos casados."

          "¿Y lo hizo?" pregunta Rose.

          "No..." dice Daren. "Al principio, intenté alejarla, convenciéndome de que era por su propio bien, pero sin importar lo que hiciera, incluso si me iba durante años sin enviarle siquiera una carta, ella siempre esperaba pacientemente mi regreso. Por suerte para nosotros, toda la gente de nuestra aldea nos conocía bien, y fueron lo bastante amables como para mantener nuestra relación oculta del resto del mundo. Al ver que no podía convencer a Sophie de que me dejara sin importar lo que hiciera, finalmente me rendí, y decidí trabajar en mejorar la calidad de nuestra relación a distancia. Fue entonces cuando se me ocurrió la idea de encantar algunos transceptores mágicos para aumentar su alcance. Los transceptores que llevo conmigo ahora me han ayudado a mantenerme en contacto con ella incluso cuando estábamos en continentes diferentes."

          "¿Eso significa que puedes hablar con ella incluso ahora?" digo.
      - source: scene_text_2
        paragraph: 25
        text: |-
          "No," dice Daren. "Es lo primero que intenté cuando llegué aquí, pero este continente o está fuera de alcance, o hay algún tipo de dispositivo que está bloqueando todas las formas de comunicación con el exterior."

          "De todas formas, quizás sea mejor que no hayas podido contactar con ella desde que llegaste aquí," dice Kate. "No me imagino cómo contarle lo que has pasado esta última semana podría haber ayudado a mantenerla tranquila. Es mejor que no lo sepa, la verdad."

          "Sí, quizás tengas razón," dice Daren.

          "Mirad, hay otra señalización que muestra el camino al castillo," dice Rose. "Nos las iremos encontrando mucho más a menudo a medida que nos acerquemos a nuestro destino. Seguidme, ¡tenemos que meternos por este callejón!"
