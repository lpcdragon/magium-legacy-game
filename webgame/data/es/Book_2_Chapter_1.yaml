  - name: b2_ch01a_no_ella
    texts:
      - source: scene_text
        paragraph: 20
        text: |-
          Suzie se acercaba ahora lentamente hacia nosotros, sosteniendo una botella de vino en la mano izquierda y una bandeja llena de copas de vino en la derecha.

          "Veo que también trajiste copas," dice Enrique, mientras va a agarrar la bandeja de la mano de Suzie. "¡Buena chica!"

          Después de colocar tanto la bandeja como la botella en una mesa de picnic junto a nosotros, la chica empieza a abrir la botella, mientras Enrique se vuelve hacia nosotros.

          "¿Y bien?" pregunta. "¿A qué estáis esperando? ¡Este vino no va a beberse solo!"

          "Tío," dice Kevin, el hermano de Suzie, mientras tira de la manga de Enrique, todavía sorbiendo, con lágrimas en los ojos. "Tío, ¿qué vamos a hacer? ¿Cómo vamos a vivir sin Rose? Nos esforzamos mucho en aprender a vivir solos. Nos las arreglamos durante semanas mientras Rose estaba en sus viajes. Aprendimos a comprar comida, y a cocinar, y a usar la chimenea, pero no podemos... no podemos--"

          "No te preocupes, mi joven amiguito," dice Enrique, mientras le da unas palmaditas en la cabeza a Kevin. "No tendréis que vivir solos, porque a partir de mañana, ¡me mudaré de vuelta con vosotros!"

          "¿Lo... lo harás?" pregunta Kevin.

          "¡Por supuesto que sí!" dice Enrique. "¿Os mentiría? Una vez que traiga todas mis pertenencias, viviré aquí de nuevo, ¡y será como en los viejos tiempos!"

          Al escuchar las palabras de Enrique, Suzie, que estaba ocupada llenando las copas con vino, sale corriendo hacia su tío y le da un gran abrazo otra vez.
      - source: scene_text_2
        paragraph: 17
        text: |-
          "¡Gracias, tío!" dice. "¡Muchísimas gracias! ¡No pensé que volverías algún día!"

          "Perdona que interrumpa," dice Kate. "Pero por lo que Rose nos contó, entendí que la razón por la que os divorciasteis fue que querías pasar tiempo con otras mujeres. ¿No deberías estar discutiendo esto con tu esposa actual antes de hacer tales promesas?"

          "Amante," dice Enrique.

          "¿Perdona?" dice Kate.

          "Amante, no esposa," dice Enrique. "Rose ha sido y siempre será mi única esposa."

          "De acuerdo," dice Kate. "Tu amante. ¿Cuál crees que será su reacción ante todo esto? ¿Puedes estar tan seguro de que aceptará mudarse a esta casa contigo, solo para cuidar de los hermanos de tu ex esposa?"

          "¡Oh, se pondrá furiosa!" dice Enrique. "¡No soporta a los niños!"
