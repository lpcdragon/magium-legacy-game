            paragraph: 48
            text: |-
              "¡No lo matamos! ¡Somos inocentes!"

              "¿Inocentes, dices?" dice Golmyck, mientras se acaricia la barbilla. "Ahora que lo pienso, nuestros informes mostraban que también había otra persona con vosotros cuando atacasteis al conde. ¿Estás diciendo que esa otra persona es de hecho la responsable de la muerte del conde de Ollendor?"

