          "¿No deberíamos hablar primero de qué vamos a hacer con los niños?"

          "¡Ah, no tenéis que preocuparos por eso!" dice Enrique. "¡Lo tengo todo controlado!"

          "¿En qué sentido?" pregunto.

          "¡Os daré más detalles en cuanto lleguen nuestras bebidas!" dice Enrique. "Asuntos tan importantes se discuten mejor con una copa de buen vino. ¡Estoy seguro de que vuestro amigo de sangre enana estaría de acuerdo conmigo!"

          "Bueno, si me lo preguntas a mí, probablemente reemplazaría el 'buen vino' de tu frase por 'cerveza enana'," dice Hadrik, "pero supongo que ambos podemos estar de acuerdo en lo general, al menos. Por cierto, me llamo Hadrik. ¡Encantado de conocerte!"

