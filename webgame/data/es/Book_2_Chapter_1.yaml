          "Entonces, ¿qué son exactamente estos eventos que tenemos que ganar para ser libres?"

          "Lo único que puedo decir con certeza es que será una serie de batallas involucrando a otros gladiadores y posiblemente algunos monstruos," dice Golmyck. "Aparte de eso, es difícil saberlo. Las reglas tienden a cambiar de un evento a otro, y dependen mucho de los caprichos de los organizadores. Dado que el embajador es quien está a cargo de la organización esta vez, mi suposición es que las reglas se harán de forma que os pongan en la mayor desventaja posible. Ahora, ¿dónde estaba esa palanca oculta?... ¡Ah, sí, aquí está!"

