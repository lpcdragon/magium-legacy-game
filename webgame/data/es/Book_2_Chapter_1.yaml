                  current_scene: b2_ch01a_creator
      - condition: b2_ch1_spin = 1
        texts:
          - source: scene_text
            paragraph: 41
            text: |-
              "El tipo se lo estaba buscando."

              "¿Lo ve?" le dice el embajador a Golmyck. "¿Ve ahora qué clase de gente ha invitado a sus salones?"

              "Su majestad," nos interrumpe Daren, mientras se coloca delante de mí y hace una reverencia ante el rey. "¡Por favor, permítame explicar lo que ocurrió!"

              "¡No, ya he oído bastantes explicaciones!" dice el embajador. "Su majestad, se está haciendo evidente que esta gentuza no merece que pierda su tiempo con ellos. Si simplemente me los entregara a mi custodia, como le pedí antes de esta reunión, me aseguraría de que se haga justicia, y usted no tendría que preocuparse más por este asunto."

              "Eso no será posible, embajador," dice Golmyck. "Si bien es cierto que la víctima en este caso era un ciudadano de Ollendor, el crimen ocurrió en la ciudad de Thilias, que cae bajo mi jurisdicción. Según el tratado firmado hace seiscientos años por todos los reinos de Varathia, esto significa que soy yo quien debe juzgarlos, no el rey de Ollendor."

              "¡¿Defendería a esta escoria?!" le grita el embajador al rey gnomo.

              "No estoy defendiendo a nadie," le responde Golmyck, con calma. "Simplemente digo que antes de condenarlos, se les debe ofrecer un juicio justo."
          - source: scene_text_2
            paragraph: 33
            text: |-
              "¡Esta gentuza no merece un juicio!" grita el embajador. "¡Merecen ser ejecutados en el acto! ¿Quiere la guerra, rey de Thilias? ¿Necesito recordarle que represento al mismísimo rey de Ollendor? ¡No voy a quedarme aquí presenciando esta farsa de juicio cuando ya tenemos toda la información necesaria para dictar su sentencia en este mismo instante! ¡Los hará matar aquí y ahora, o habrá guerra! ¿Me oye, Golmyck? ¡¡¡Guerra!!!"

              "Me temo que no puedo permitirle ejecutar a estas personas, embajador," escuchamos la voz de Eiden viniendo de detrás de nosotros.

              Después de darme la vuelta y ver la cara de Eiden, mi primera reacción es coger el amuleto de Arraka de la mano de Hadrik.

              "¡Tú!" le digo. "¡Dijiste que nos avisarías cada vez que Eiden estuviera ocultándose invisiblemente a nuestro alrededor!"

              "¿Ah, sí?" dice Arraka. "Debo admitir que mi memoria ha estado un poco borrosa últimamente. Me pregunto por qué... ¡Ah, ya sé por qué! ¡Debe de ser por tanto DARME VUELTAS!"

              Eiden me mira, con sus ojos cerrados, y sonríe. Solo ahora me doy cuenta de que quizás he estado hablando un poco demasiado alto. Decide no comentar nuestra conversación, y empieza a caminar lentamente hacia el embajador. Cuando se detiene frente a él, podemos ver que el embajador está sudando a mares, y que apenas puede mantener la compostura.

              "¿Qué le ocurre, embajador?" pregunta Eiden, con una sonrisa burlona. "¿No va a inclinarse ante su Creador?"
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch01a_creator
  - name: b2_ch01a_value
    routes:
      - condition: b2_ch1_spin = 0
        texts:
          - source: scene_text
            paragraph: 42
            text: |-
              "Lo matamos porque no daba absolutamente ningún valor a la vida humana."

              "Ah," dice Golmyck. "Supongo que se refiere a la chica esclava que estaba con él en ese momento. Dime, joven lessathi, ¿conoces las leyes de nuestra ciudad respecto a la esclavitud?"

              "Su majestad," nos interrumpe Daren, mientras se coloca delante de mí y hace una reverencia ante el rey. "¡Por favor, permítame explicar lo que ocurrió!"

              "¡Psst!" oigo la voz de Arraka saliendo del amuleto, en cuanto Daren empieza a hablar. "¡Eh, tú! ¡Debilucho! Tipo que usa estadísticas. Medio lessathi. ¡Ven aquí!"

              "¿Medio... lessathi?" le pregunto, mientras me acerco a Hadrik y al amuleto.

              "¡Olvida eso!" dice Arraka, en voz baja. "Tenemos problemas. Eiden acaba de teletransportarse en medio del pasillo, y se está ocultando con ese hechizo de invisibilidad suyo."

              "¿Eiden?" le pregunto. "¿Por qué elegiría venir precisamente ahora?"

              "No lo sé y no me importa," dice Arraka. "Prometí que os avisaría cuando Eiden estuviera cerca, y he cumplido mi palabra. ¿¡Ahora le dirás a este zopenco que sostiene mi amuleto que deje de darme vueltas a la menor oportunidad!?"

              "Eh, vale..." digo. "Veré qué puedo hacer al respecto."
          - source: scene_text_2
            paragraph: 34
            text: |-
              Mientras hablaba con Arraka, parece que la discusión entre el rey y el embajador se había acalorado un poco más.

              "¡¿Defendería a esta escoria?!" le grita el embajador al rey gnomo.

              "No estoy defendiendo a nadie," le responde Golmyck, con calma. "Simplemente digo que antes de condenarlos, se les debe ofrecer un juicio justo."

              "¡¡¡Esta gentuza no merece un juicio!!!" grita el embajador. "¡Merecen ser ejecutados en el acto! ¿Quiere la guerra, rey de Thilias? ¿Necesito recordarle que represento al mismísimo rey de Ollendor? ¡No voy a quedarme aquí presenciando esta farsa de juicio cuando ya tenemos toda la información necesaria para dictar su sentencia en este mismo instante! ¡Los hará matar aquí y ahora, o habrá guerra! ¿Me oye, Golmyck? ¡¡¡Guerra!!!"

              "Me temo que no puedo permitirle ejecutar a estas personas, embajador," escuchamos la voz de Eiden viniendo de detrás de nosotros.

              Cuando todos nos damos la vuelta, Eiden empieza a caminar lentamente hacia el embajador, y se detiene justo frente a él. El embajador está ahora sudando a mares, y parece que apenas puede mantener la compostura.

              "¿Qué le ocurre, embajador?" pregunta Eiden, con una sonrisa burlona. "¿No va a inclinarse ante su Creador?"
