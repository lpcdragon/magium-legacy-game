  - name: b2_ch01a_body
    texts:
      - source: scene_text
        paragraph: 22
        text: |-
          "Entonces, ¿cómo puedes hacer tal promesa en su nombre, sin consultarla primero?" pregunta Kate.

          "Oh, nunca hice la promesa en su nombre," dice Enrique. "De hecho, ¡pienso romper con ella en cuanto vuelva a casa!"

          "¿Vas a romper con tu amante... solo para mudarte con los hermanos de Rose?" pregunta Kate, algo sorprendida.

          "¡Por supuesto!" dice Enrique. "¿Por qué estás tan sorprendida? La echaré de menos, pero al fin y al cabo, es solo otra mujer que solo me quiere por mi dinero y mi buen aspecto. No debería tener problemas en reemplazarla. ¡Hay muchos peces en el mar!"

          Se ríe.

          "Ahora, entonces, coged vuestras copas, todos," dice Enrique. "Hoy brindamos por Rose: la mujer más hermosa y bondadosa que he conocido, y el amor de mi vida. ¡Que siempre sea recordada, y que siga viviendo en nuestros corazones, desde ahora y para siempre!"

          Tras escuchar el discurso de Enrique, todos decidimos coger nuestras copas de vino y unirnos al brindis.

          La siguiente media hora la pasamos hablando de Rose. Le contamos a Enrique las aventuras que habíamos vivido con ella durante la última semana, y él nos contó sus años juntos en la mansión. Estaba claro que ninguno de nosotros estaba de humor para beber, ni para contar historias, pero no importaba.
      - source: scene_text_2
        paragraph: 19
        text: |-
          Enrique tenía razón. Rose no habría querido que pasáramos nuestras vidas arrepintiéndonos. Y no podíamos permitirnos evitar hablar de ella de ahora en adelante solo porque dolía recordarla. Rose no merecía eso.

          Mientras hablábamos, se hacía cada vez más obvio que, a pesar de su actuación alegre, Enrique era probablemente quien más sufría por la pérdida de Rose. Sin embargo, siempre que hablaba de Rose, su sonrisa se volvía genuina, e incluso Kate había conseguido sonreír una o dos veces durante nuestra larga conversación.

          Cuando el tiempo empezó a agotarse, le dijimos a Enrique que teníamos que dirigirnos al castillo, y cada uno fue a recoger su mochila antes de emprender nuestro nuevo viaje. Cuando estábamos a punto de partir, Enrique nos apartó un momento para hablar con nosotros, lejos de los niños.

          "Hay algo que no me atreví a preguntar delante de los niños," dice Enrique. "Vi que no trajisteis el cuerpo de Rose cuando volvisteis a la mansión, así que asumí lo peor, pero necesito saberlo. ¿Cómo murió Rose?"
