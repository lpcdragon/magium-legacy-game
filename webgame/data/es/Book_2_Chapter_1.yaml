            text: Creo que paso, gracias.
            effects:
              - set:
                  current_scene: b2_ch01a_pass_alive
                  b2_ch1_spin: 0
  - name: b2_ch01a_sure_dead
    texts:
      - source: scene_text
        paragraph: 9
        text: |-
          "Claro, ¿por qué no?" digo, mientras agarro el amuleto y empiezo a girarlo también.

          La voz amortiguada de Arraka se hace más fuerte ahora, pero no puedo distinguir lo que intenta decir. Probablemente sea mejor que no lo sepa.

          "He estado pensando," dice Kate, de repente. "¿Podría ser que Rose quizás no esté completamente muerta? ¿Podría seguir en algún lugar ahí dentro, dentro de su cuerpo?"

          "Kate..." empieza a decir Daren, pero Kate continúa hablando, esta vez levantando un poco la voz.

          "¡Quizás todavía haya alguna forma de traerla de vuelta!" dice, mirando a cada uno de nosotros por turnos, buscando nuestra aprobación. "¡Quizás si derrotamos a ese seguidor de Ulruk que robó su cuerpo, podamos devolverla a la normalidad! ¡No podemos saberlo hasta que lo intentemos!"

          "Kate, por favor..." dice Daren, mientras se detiene y mira a Kate directamente a los ojos. "No me hagas repetirlo. Rose se ha ido. No puedes traer de vuelta a los muertos, por mucho que lo intentes."

          "Pero, ¿cómo puedes estar seguro de que está muerta?" dice Kate, con desesperación visible en sus ojos. "Oíste lo que dijo antes de irse. ¡Todos la oísteis! Nos dijo que cuidáramos de sus hermanos. ¿Por qué diría algo así si una parte de Rose no siguiera ahí dentro, en algún lugar?"

          "Los revenants nacen con los recuerdos de sus huéspedes," dice Illuna. "Por eso es común que al principio estén confundidos y tengan algo de crisis de identidad, mientras luchan por diferenciar entre sus propios pensamientos y los que heredaron de sus huéspedes."
      - source: scene_text_2
        paragraph: 6
        text: |-
          "Entonces quizás aún podamos--" empieza a decir Kate, pero Illuna la interrumpe.

          "Aunque a veces puedan elegir mantener algunos de los valores y principios de su antiguo huésped," dice Illuna, "los revenants siguen siendo entidades completamente diferentes a los anteriores dueños de sus cuerpos. Un revenant no puede nacer si su huésped aún está vivo. El mero hecho de que este revenant haya llegado a existir es prueba de que Rose ya estaba muerta cuando el sirviente de Ulruk tomó posesión de su cuerpo."

          "Pero..." intenta argumentar Kate de nuevo, esta vez con mucha más vacilación en su voz. "Pero... quizás si nosotros..."

          Se detiene al darse cuenta de que ya no tiene argumentos válidos que presentar. En vez de continuar su razonamiento, su mirada vuelve al suelo, y no dice ni una palabra más.

          "Lo siento," dice Daren, mientras se da la vuelta y comienza a caminar hacia la casa de Rose de nuevo.

          Todos le seguimos uno por uno, siendo Kate la última en moverse de su sitio. El resto de nuestro viaje hacia la mansión transcurrió en completo silencio.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch01a_monsters
