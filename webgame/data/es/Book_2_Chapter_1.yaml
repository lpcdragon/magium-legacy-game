            paragraph: 23
            text: |-
              "Esto va a ser un poco difícil de creer," digo.

              "Oh, créeme, no soy ajeno al mundo de la magia," dice Enrique. "Estoy preparado para cualquier cosa."

              "Bueno," digo, "lo que pasó fue que después de que Rose fue asesinada, su cuerpo fue... tomado, por una entidad llamada revenant."

              "Cuando dices que su cuerpo fue tomado..." empieza a decir Enrique, pero Daren responde a su pregunta antes de que termine.

              "Quiere decir que un espíritu maligno tomó posesión de su cuerpo, después de que ella muriera," dice Daren.

              "¿Y supongo que no hay forma de traer a Rose de vuelta, aunque matéis a este espíritu maligno?" pregunta Enrique.

              "No, no la hay," dice Daren. "Lo siento."

              "Entiendo," dice Enrique.

              Hace una pausa.

              "Si los niños alguna vez me preguntan qué le pasó a Rose, les diré que su cuerpo fue incinerado," dice Enrique. "Prefiero que crean eso a darles pesadillas."

              "Entonces nos aseguraremos de contarles la misma historia, si alguna vez nos preguntan," dice Daren.

              "Gracias," dice Enrique.

              Entonces se vuelve para mirarnos a todos.
          - source: scene_text_2
            paragraph: 20
            text: |-
              "Amigos míos, lamento que no hayamos tenido la oportunidad de conocernos en mejores circunstancias," dice. "Solo sabed esto: ya sea que decidáis quedaros en la ciudad o marcharos antes del anochecer, siempre seréis bienvenidos aquí, cuando decidáis volver. ¡Que los dioses os acompañen!"

              "Que nos protejan a todos," dice Daren. "¡Adiós, Enrique, y buena suerte!"

              Una vez que todos nos despedimos de Enrique y de los hermanos de Rose, nos pusimos en camino, tomando la ruta más corta que conocíamos al castillo. Según Enrique, mientras siguiéramos caminando en la misma dirección general, deberíamos ir encontrando muchas señalizaciones que nos mostrarían el camino correcto a nuestro destino, así que no deberíamos preocuparnos demasiado por perdernos.

              "¿Crees que estarán bien?" me pregunta Kate. "Los hermanos de Rose, quiero decir. No estoy segura de cuánto puedo confiar en ese hombre para cuidar de ellos de ahora en adelante..."

              "Bueno, Rose confiaba lo suficiente en él como para dejarlo a cargo de visitar a sus hermanos mientras ella estaba fuera," digo. "Y su preocupación por los niños me pareció genuina. Además, los niños parecían quererlo mucho. ¡Creo que no tenemos de qué preocuparnos!"

              "Supongo que podrías tener razón," dice Kate. "Parecía serio cuando dijo que rompería con su amante para mudarse con ellos. Quizás solo me estaba preocupando por nada."
          - source: scene_3
