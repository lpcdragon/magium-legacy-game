  - name: b3_ch10a_prisoners
    routes:
      - condition: b3_ch8_king = 5 AND b3_ch10_wrong = 0
        texts:
          - source: scene_text
            paragraph: 32
            text: |-
              "Puede que tengas razón."

              "Bueno, no sé ustedes, pero no creo ni una palabra de lo que salió de la boca de ese tipo", dice Hadrik. "Apuesto a que en realidad intentó matarnos, pero luego se dio cuenta de que no podía hacerlo y se rindió".

              "Es posible, pero supongo que nunca lo sabremos con seguridad", dice Daren.

              "Realmente no me importa si quería asesinarnos o no", dice Kate. "Lo que más me preocupa es lo que les va a pasar a los prisioneros en las torres".

              "Bueno, podemos preguntarle a Kelrim sobre eso ahora mismo, si quieres", dice Daren. "¡Mira, aquí viene!"

              Justo cuando Daren dice esto, Kelrim se acerca a nosotros, con el señor Horace justo detrás de él.

              "¡Bien hecho, Kelrim!" Daren le dice. "¡Sabía que podías hacerlo!"

              "Todavía estoy en shock..." dice Kelrim. "Nunca hubiera imaginado que tanta gente votaría por mí. ¡Gracias por creer en mí! ¡No podría haber hecho esto sin su apoyo!"
          - source: scene_text_2
            paragraph: 28
            text: |-
              "Umm... Kelrim!" Kate dice, un poco incómodo. "No sé si este es el momento adecuado, pero hay algo muy importante sobre lo que necesito preguntarte. ¿Conoces a los magos prisioneros de las torres de seredium?"

              "Sí..." dice Kelrim, viéndose muy angustiado. "Breynan me habló de ellos. Esas pobres personas... No puedo imaginar lo que deben estar pasando, incluso mientras hablamos..."

              "¿Has pensado en lo que vas a hacer con ellos una vez que te conviertas en rey de Ollendor?" Kate le pregunta.

              "¡Voy a liberarlos a todos, por supuesto!" Kelrim dice. "¡Lo antes posible! ¡Ya han sufrido bastante!"

              "¿Has hablado con el rey del subsuelo sobre esto?" Kate dice. "Su punto de vista es que si todos los prisioneros fueran liberados a la vez, causaría demasiado caos en toda la ciudad, porque todos los dispositivos mágicos dejarían de funcionar, incluidos los vehículos voladores. Su plan era liberar sólo a los familiares de las personas del subsuelo y dejar a los demás prisioneros allí hasta más tarde".
          - source: scene_3
            paragraph: 19
            text: |-
              "¡No, no, no, todos deben ser liberados!" Kelrim dice. "¡Esa será nuestra prioridad número uno! ¡Si esto causará caos, entonces tendremos que encontrar la mejor manera de manejarlo! De hecho, ¡creo que iré a hablar con el rey del subsuelo sobre esto ahora mismo!"

              "Uh... ¿puedo hablar con él sobre esto?" El señor Horace pregunta Kelrim. "Lo conozco desde hace mucho tiempo, así que estoy seguro de que puedo convencerlo de que coopere con nosotros en este asunto. Puede que al principio no esté de acuerdo, pero eventualmente encontrará alguna manera de hacer que las cosas funcionen. Siempre lo hace".

              "¡Por supuesto!" Kelrim dice. "¡Entonces dejaré este asunto en sus manos por ahora, señor Horace!"

              "¡Asegúrate de no quitar las cadenas de los prisioneros por la fuerza o morirán!" Kate dice. "¡Primero debes ir a la sala de control para desactivar los dispositivos de extracción de energía!"

              "Lo tendremos en cuenta", dice Sir Horace. "Muy bien, majestad, ahora que ha sido elegido rey, necesitaremos tener nuestra primera reunión estratégica. Síganme, por favor".

              "¡Está bien, abre el camino!" Kelrim dice, mientras sigue a Sir Horace fuera de la habitación. "¡Adiós a todos! ¡Los veré pronto!"

              "¿Ver?" Daren le dice a Kate, después de que Kelrim se vaya. "¡No había nada de qué preocuparse! ¡Todos los prisioneros estarán a salvo!"

              "Sí..." dice Kate, en tono aliviado. "¡Me alegro!"
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch10a_surface
