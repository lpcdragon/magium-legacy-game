  - name: b3_ch10a_abyss
    texts:
      - source: scene_text
        paragraph: 49
        text: |-
          "No estoy seguro de lo que está pasando", digo. "Me siguen enviando de un lado a otro entre el plano terrestre y el Plano Etéreo, y eso me está dando terribles dolores de cabeza. Creo que estoy teniendo problemas para reajustarme a estar de nuevo en el plano terrestre, pero no sé por qué".

          "Oh, no..." dice Flower. "Oh, no. ¡Oh, no! Barry, ¡cierra los ojos! ¡Cierra los ojos rápido y mantenlos cerrados! ¡Hazlo ahora!"

          "¡Está bien, los cierro, los cierro!" Digo, mientras cierro los ojos tal como ella dijo. "¿Y ahora qué?"

          "¡No sé!" Puedo escuchar a Flower decir.

          "¿Qué quieres decir con que no lo sabes?" Le pregunto.

          "Barry, creo que el abismo está tratando de atraerte hacia adentro", dice Flower, con voz llena de pánico.

          "¿El abismo?" digo. "¿Te refieres al abismo etéreo? ¿El lugar hecho de pura oscuridad donde me enviaste a escapar del éter?"

          "¡Sí!" Flower dice. "¿Recuerdas que no pudiste regresar solo a tu santuario desde allí, y Petal tuvo que echarte un poco de agua fría en el plano terrestre para poder despertarte?"

          "Lo recuerdo, sí", digo.
      - source: scene_text_2
        paragraph: 41
        text: |-
          "Bueno, esa no era la forma correcta de hacerlo", dice Flower. "Petal sólo lo hizo como medida extrema, porque no podías despertarte por ti mismo, y esperábamos que fuera suficiente, pero estoy empezando a pensar que no fue así".

          "Entonces, ¿qué significa eso?..." digo, mientras mis ojos aún están cerrados. "¿Qué hago ahora?"

          "Umm... ¿tal vez podrías... vivir el resto de tu vida con los ojos cerrados?" Flower dice, con voz mansa.

          "¡¿Qué?!" Grito.

          "¡Lo siento, lo siento!" Flower dice, con voz de pánico nuevamente. "Es solo que esto nunca ha sucedido antes. ¡No tengo idea de qué debes hacer! Lo único que sé es que mientras mantengas los ojos cerrados tanto aquí como en el Plano Etéreo, el abismo no debería poder hacerte daño".

          Ella hace una pausa.

          "Tú también tienes los ojos cerrados ante el Plano Etéreo, ¿no?..." pregunta Flower.

          "¿Cómo se supone que voy a saber eso?" digo. "¡No puedo comprobar si sigo cambiando entre aviones mientras tengo los ojos cerrados!"
      - source: scene_3
        paragraph: 26
        text: |-
          "Sí, pero ¿no puedes sentirlo?" Flower dice. "¿Con tu sentido mágico, quiero decir?"

          "¡No puedo diferenciar las auras del Plano Etéreo de las del plano terrestre!" digo. "¡Ni siquiera sabría qué diferencia buscar! ¿No hay nada más que pueda hacer? ¿Algo en absoluto?"

          "Está bien, bueno... aún no estás muerto, así que es un buen comienzo..." dice Flower, con la voz aún temblorosa. "Tal vez si nosotros-- Tal vez si yo-- si yo--"

          "Flower, cálmate", escucho nuevamente la voz de Flower, pero esta vez en el tono de Illuna. "Piensa en esto racionalmente. El abismo no puede afectar al éter más de lo que el éter puede afectar al abismo. Incluso si el abismo quisiera traerlo de regreso, no habría forma de alcanzarlo".

          "Entonces, ¿cómo está pasando esto?" Flower dice, todavía sonando en pánico.

          "Un pequeño trozo de oscuridad debe haber viajado con él cuando hizo el viaje de regreso", dice Illuna. "Considerando que aún no está muerto después de todo este tiempo, supongo que la oscuridad se ha adherido al exterior de su santuario y está tratando de abrirse camino hacia adentro. Si puedes llegar a la mente de Barry desde el Plano Etéreo, deberías poder limpiar fácilmente la oscuridad con tu fuego".

          "¡Pero no sé dónde está la mente de Barry!" Flower dice. "¡Nunca llegamos allí la última vez que traté de llevarlo allí!"
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch10a_emergency
  - name: b3_ch10a_emergency
    texts:
      - source: scene_text
        paragraph: 50
        text: |-
          "Barry, escúchame atentamente", me dice Illuna. "Puede que tus ojos estén cerrados, pero aún tienes el oído y el sentido del tacto. Normalmente, el interior de tu santuario debería sentirse diferente al tacto que el suelo y las paredes de estas ruinas. Intenta sentarte aquí en el suelo y luego tócalo con las manos. Si te mueven entre los dos planos de existencia, deberías sentir que la textura del suelo cambia bajo tus palmas".

          "Buena idea", digo, con los ojos todavía cerrados. "¡Lo haré ahora mismo!"

          Casi inmediatamente después de sentarme en el suelo y poner mis palmas sobre él, puedo sentir el suelo cambiando rápidamente entre la fría y dura piedra del corredor subterráneo a una textura cálida y suave que nunca antes había sentido. ¡Está funcionando! ¡Ahora sé que todavía estoy cambiando!

          "Está bien, puedo confirmar que todavía me envían de un lado a otro entre los dos aviones", digo. "¿Qué quieres que haga?"

          "Quiero que te concentres en tus palmas", dice Illuna, "e imagines que estás enviando energía mágica a través de todo el cubo en el que te encuentras actualmente, en el Plano Etéreo. ¿Crees que puedes hacer eso?"

          "Sí, creo que puedo", digo, mientras intento hacer lo que dijo Illuna.

          "Mientras tanto, Flower, tendrás que volver a transformarte a tu estado evolucionado y ver si puedes detectar un santuario del que emana magia", dice Illuna.
      - source: scene_text_2
        paragraph: 42
        text: |-
          "Pero dijiste que no debería transformarme nuevamente hasta--" dice Flower, pero es interrumpida.

          "No importa lo que dije", le dice Illuna. "Esto es una emergencia. Si sabes cómo volver a tu forma evolucionada, hazlo ahora".

          "Está bien..." dice Flower. "¡Está bien! ¡Lo haré ahora mismo!"

          "Entonces, no quiero alarmar a nadie", escucho la voz de Melindra desde algún lugar cercano a mí, "pero si no sigo tirando de estas palancas, las trampas se activarán y nos matarán a todos".

          "¿No hay manera de que puedas retrasar las trampas?" Kate pregunta.

          "Sí, lo hay, pero ya lo estoy haciendo", dice Melindra. "Lo máximo que puedo esperar entre dos palancas es cinco minutos. Esto significa que si no terminas de ayudar a Barry en los próximos veinte minutos, tendremos que salir de aquí y olvidarnos por completo de la pieza del rompecabezas".

          "¿Por qué?" Kate dice. "¿No podemos volver más tarde?"

          "Podemos, pero el dispensador de piezas del rompecabezas no podrá volver a activarse hasta dentro de al menos un mes", dice Melindra. "En otras palabras, Flower, si planeas hacer algo, hazlo rápido".
      - source: scene_3
        paragraph: 27
        text: |-
          "Está bien", dice Flower. "Estoy en ello. Estoy bastante seguro de que ya puedo sentir el santuario de Barry. ¡Dame unos momentos y estaré teletransportar allí!"

          No más de cinco segundos después, escucho a Flower hablar nuevamente, en tono victorioso.

          "¡Lo hice!" dice ella en voz alta. "¡Lo encontré! ¡Encontré el santuario de Barry!"

          "Bien", dice Illuna. "Ahora, ¿ves alguna sombra inusual a lo largo de los bordes del cubo, o tal vez hacia las esquinas?"

          "Umm... ¡sí!" Flower dice. "¡Sí, creo que lo veo! ¡Lo estoy quemando ahora!"

          "Perfecto", dice Illuna. "Avísanos cuando hayas terminado, para que Barry pueda abrir los ojos nuevamente".

          "Sólo un segundo... sólo un segundo... ¡Está bien, ya terminé!" Flower dice. "¡Se ha ido! ¡La sombra se ha ido!"
    choices:
      - position: 1
        text: Abre mis ojos.
        effects:
          - set:
              current_scene: b3_ch10a_open
      - position: 2
        text: Pídele a Flower que revise toda la superficie del cubo, en caso de que haya más sombras.
