  - name: b3_ch10a_open
    texts:
      - source: scene_text
        paragraph: 51
        text: |-
          "¡Finalmente!" -digo mientras abro los ojos. "Tal vez ahora podamos... oye, ¿adónde fueron todos? ¿Qué está pasando?"

          No hay nadie ahí. Lo único que veo ante mí es oscuridad. Inmediatamente puedo sentir que me estoy debilitando cada vez más y apenas tengo fuerzas para hablar. En sólo unos segundos, me canso tanto que ni siquiera puedo mantenerme despierto y luego pierdo el conocimiento para siempre.
