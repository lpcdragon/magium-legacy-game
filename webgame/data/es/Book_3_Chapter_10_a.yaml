  - name: b3_ch10a_caverns
    routes:
      - condition: b3_ch6_kelrim <> 1 AND b3_ch6_plan <> 3
        texts:
          - source: scene_text
            paragraph: 61
            text: |-
              Después de unos veinte minutos de vuelo, finalmente llegamos a nuestros amigos, quienes parecen haber terminado ya todas sus compras. Una vez que terminamos de contarles lo que pasó en las ruinas con el ilusionista, también dedicamos unos minutos a comprar algunas provisiones, y luego decidimos contactar al ingeniero de teletransporte de los rebeldes, para que nos lleve de regreso a la base subterránea.

              Durante las siguientes horas o dos caminamos por las cavernas, hablando con todos los que hemos tenido contacto estos últimos días y despidiéndonos, ya que mañana tendremos que salir a primera hora. Nos despedimos de Breynan, Peter, Albert, Desmond, del doctor Reidzek e incluso de Barry Nubarrón, que aún se encuentra recluido en la prisión de los rebeldes.
          - source: scene_text_2
            paragraph: 52
            text: |-
              Justo cuando estábamos a punto de regresar a nuestros dormitorios, vimos a Alice, la niña que nos pidió que salváramos a su familia cuando llegamos por primera vez a las cavernas subterráneas, y estaba abrazando a una mujer, que parecía ser su madre. Mientras tanto, Albert le decía que su hermano y su padre también habían sido rescatados, pero que necesitaban algo de tiempo para recuperarse de lo que habían pasado, y que actualmente estaban descansando en el ala médica de la base rebelde.

              "¡Oye, mira!" Hadrik nos dice, mientras observamos a Alice y Albert desde la distancia. "¡Es la niña que conocimos el primer día! ¡Supongo que deben haber encontrado a su familia!"

              "Sí, espero que su padre esté bien", digo. "No se veía muy bien cuando lo vimos en la torre del seredium".

              "No te preocupes", dice Daren. "Los magos blancos de este lugar son muy buenos en lo que hacen. Estoy seguro de que lo recuperarán en poco tiempo".

              Cuando llegamos a nuestro dormitorio, nos sentamos todos en círculo y comenzamos a hablar sobre lo que vamos a hacer hasta mañana por la mañana.
            condition: b3_ch4_cut = 0
          - source: scene_text_2
            paragraph: 53
            text: |-
              Justo cuando estábamos a punto de regresar a nuestros dormitorios, vimos a Alice, la niña que nos pidió que salváramos a su familia cuando llegamos por primera vez a las cavernas subterráneas, y estaba abrazando a una mujer, que parecía ser su madre. Cuando la niña preguntó por su hermano y su padre, Albert tardó un poco en darle una respuesta directa, pero finalmente tuvo que admitir que a pesar de que su hermano fue rescatado, su padre ya estaba muerto cuando lo encontraron en la torre del seredium.

              De repente, recuerdo la cara de su padre cuando murió ante mis ojos después de que corté sus cadenas, y siento una repentina necesidad de vomitar.

              "Vamos a nuestras habitaciones, Barry", dice Daren, mientras pone una mano en mi espalda, después de ver mi reacción. "No creo que esto sea algo que necesites escuchar ahora mismo".

              Mientras nos dirigimos a nuestras habitaciones, puedo escuchar los gritos de la niña resonando por todas las cavernas, y no se detienen hasta que estamos demasiado lejos de ella para poder escuchar su voz.

              Cuando llegamos a nuestro dormitorio, nos sentamos todos en círculo y comenzamos a hablar sobre lo que vamos a hacer hasta mañana por la mañana.
            condition: b3_ch4_cut = 1
          - source: scene_3
            paragraph: 36
            text: |-
              Como este fue el último día en el que pudimos ver a Leila antes de nuestra partida, tuvimos algunos problemas para decidir cómo dividiríamos el tiempo restante con ella, pero después de discutir las cosas entre nosotros, todos estuvieron de acuerdo en que Kate y yo deberíamos pasar más tiempo con Leila, ya que éramos los que nos llevábamos mejor con ella.

              El acuerdo que se nos ocurrió fue que Daren, Hadrik, Melindra, Flower y Illuna tendrían acceso a Leila hasta el final de la noche, y luego Kate y yo tomaríamos cada uno un turno de noche con ella, para que pudiéramos tener suficiente tiempo para despedirnos adecuadamente. Por supuesto, esto significaría que Leila no podría dormir durante la noche, pero dijo que no tenía ningún problema con eso, ya que no tenía adónde ir mañana, así que podría dormir un poco después de que nos vayamos.

              Mientras Daren y los demás estaban ocupados hablando con Leila y recordando nuestros momentos juntos, pensé que esta sería una buena oportunidad para practicar mi cambio de Plano Etéreo, ya que probablemente no tendría muchas oportunidades de hacerlo mientras estaríamos de viaje mañana.
        choices:
