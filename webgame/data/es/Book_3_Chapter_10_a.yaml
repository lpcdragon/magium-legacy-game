            paragraph: 43
            text: |-
              Como prometió, Melindra va a bajar varias de las palancas que están en las paredes y, una vez que termina, regresa con nosotros.

              "Muy bien, ahora tenemos que esperar aproximadamente un minuto", dice Melindra.

              "Correcto", le dice Flower.

              Después de que Flower dice esto, hay un silencio incómodo durante unos diez segundos, durante los cuales ninguno de nosotros suelta una sola palabra.

              "Ya sabes, Barry..." dice Melindra de la nada, mientras se gira hacia mí. "Hay algo que he querido preguntarte desde hace un tiempo... ¿Soy sólo yo, o Leila tiene la impresión de que los dos somos pareja?"

              "No, no eres sólo tú", digo. "Cuando conocí a su padre por primera vez, ella le dijo muy claramente que tú y yo estábamos en una relación, así que es bastante obvio que esa es la impresión que le hemos dado".

              "¿Pero por qué pensaría eso?" Melindra pregunta, pareciendo genuinamente confundido. "¿Es porque hemos tenido relaciones sexuales?"

              "Me imagino que probablemente esta sería la razón principal, sí", le respondo.
          - source: scene_text_2
            paragraph: 35
            text: |-
              "Eh..." dice Melindra.

              Luego hace una pausa para reflexionar sobre mis palabras durante unos segundos, antes de continuar.

              "Escucha", me dice, "no tengo nada contra ti. Es sólo que... ya sabes... mi política durante mucho tiempo ha sido no apegarme demasiado a la gente, ya que siempre termino sobreviviéndolos y luego me dejan atrás. ¡Realmente no es nada personal!"

              "¡Claro, no te preocupes por eso!" digo.

              Una vez más, hay un breve lapso de tiempo en el que nadie dice nada.

              "En realidad, hubo una vez, hace muchos años..." dice Melindra, después de pensar las cosas por unos segundos más. "Solía ​​viajar con un amigo durante algunos años, y estábamos... más o menos en una relación, pero no realmente. Compartíamos una tienda de campaña, pasábamos la mayor parte del tiempo juntos, pero no había ningún vínculo. Teníamos la regla de que no nos reuniríamos con nadie más durante este tiempo, ¡pero eso era todo! No había otras obligaciones".
          - source: scene_3
            paragraph: 25
            text: |-
              "¿No es esa literalmente la definición de una relación?" Le pregunto.

              "¡No!" Melindra dice, tal vez un poco demasiado alto. "¡No lo es! ¡No había otras condiciones! ¡Podríamos separarnos cualquier día y no habría resentimientos entre nosotros! Incluso seguimos siendo amigos durante mucho tiempo después de que dejamos de vernos. No fue un mal acuerdo, ahora que lo pienso..."

              Ella vuelve a hacer una pausa.

              "Entonces... ¿te gustaría algo así?" Melindra me pregunta, mientras me mira directamente a los ojos.

              "¿Quieres decir... tú y yo?" Digo, tratando de asegurarme de que entiendo completamente lo que ella está insinuando. "¿Viajar juntos? ¿Compartir tienda de campaña? ¿Sin condiciones?"

              "Sí", dice simplemente Melindra, mientras todavía espera mi respuesta.
        choices:
          - position: 1
            text: Acepte la propuesta de Melindra.
            effects:
              - set:
                  current_scene: b3_ch10a_proposition
                  b3_ch10_benefits: 1
          - position: 2
            text: Rechazar la propuesta de Melindra.
