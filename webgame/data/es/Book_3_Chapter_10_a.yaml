  - name: b3_ch10a_refreshingly
    texts:
      - source: scene_text
        paragraph: 41
        text: |-
          Mientras miro rápidamente a mi alrededor, noto que todos me están mirando. ¿Debería contarles lo que pasó?

          No, sólo haré que se preocupen por nada. Estoy seguro de que solo debo estar teniendo algunos pequeños problemas para ajustar mi perspectiva después de todas esas veces en las que el éter obligó a mi conciencia a ir y venir entre los planos etéreo y terrestre. Si le doy un día más, esta sensación probablemente desaparecerá por sí sola. ¡Tiene que ser así!

          "¡No, no es nada!" digo. "Estaba probando algunas maniobras de vuelo y me equivoqué un poco. ¡Todo bien!"

          "Bueno, no intentes nada demasiado peligroso", dice Melindra. "Debajo hay algunos tejados con formas muy extrañas. No querrás chocar contra ninguno de ellos, ¡créeme!"

          "¡Sí, intentaré tener más cuidado!" -digo, y luego empiezo a seguir a Melindra por el cielo nuevamente, junto con los demás.

          Continuamos nuestro viaje por un tiempo más, y durante este tiempo, la sensación de mi conciencia cambiando entre planos ya no me sucede más.

          Está bien. Tengo esto bajo control. Unos segundos aquí y allá para volver al Plano Etéreo no es gran cosa. Sólo empezaré a preocuparme si las cosas empeoran.
      - source: scene_text_2
        paragraph: 33
        text: |-
          Antes de que tenga tiempo para pensar más en esto, Melindra nos dice que hemos llegado a nuestro destino y nos indica que aterricemos frente a un edificio de aspecto muy antiguo. A diferencia de todos los demás edificios con diseños locos hechos por Billy Bob, esta casa en particular parece refrescantemente simple, como cualquier otra casa que esperarías ver dentro de una ciudad.

          "¡Oh, bien!" Melindra dice, una vez que estemos todos en el suelo. "La vieja casa todavía está aquí. Me preocupaba un poco que ya la hubieran demolido. Está bien, entremos. Te mostraré cómo abrir el pasaje a las ruinas de abajo".

          "¿Ruinas?..." pregunta Flower, confundido, mientras entramos al edificio. "¡Pensé que habías dicho que se suponía que la pieza del rompecabezas estaba dentro de la casa!"

          "No", dice Melindra. "Lo que te dije fue que necesitabas entrar al edificio abandonado para llegar a la pieza del rompecabezas. Nunca dije que estuviera escondida en el edificio mismo. De todos modos, son sólo unas ruinas pésimas. Ya sé qué palancas debemos tirar, así que terminará en unos minutos. No te preocupes por eso".

          "¿Y si recuerdas mal las palancas?" Kate le pregunta.

          "No los recuerdo mal", dice Melindra, mientras presiona algunas piedras del suelo en rápida sucesión. "Ya he hecho esto varias veces antes, así que sé exactamente lo que estoy haciendo".

          Justo cuando termina de hablar, el centro del piso se abre, revelándonos una escalera oculta.
      - source: scene_3
        paragraph: 23
        text: |-
          "¿Ver?" Melindra dice. "Te dije que sé lo que estoy haciendo. Muy bien, ahora tenemos que bajar estas escaleras hasta el fondo. ¡Vamos!"

          "¿Hay cristales azules ahí abajo o necesitamos algo de luz?" Flower pregunta Melindra, mientras comenzamos a bajar las escaleras.

          "No, que yo recuerde, no hay cristales", dice Melindra, "pero creo que hay algunas antorchas que podemos encender".

          "¡Entendido!" Flower dice, mientras conjura tres pequeñas bolas de fuego que flotan junto a nosotros, para que podamos ver hacia dónde vamos.

          Una vez que llegamos a las ruinas de abajo, Flower usa sus bolas de fuego para encender todas las antorchas en las paredes y luego hace desaparecer sus llamas mágicas.

          "Vaya, son muchas palancas..." dice Flower, cuando ve bien las paredes del pasillo.

          "¡Está bien, presta atención!" Melindra dice. "Hay un orden muy específico en el que se deben tirar estas palancas, con algunos tiempos de espera en el medio. Yo me encargaré de todo, pero cuando llegue a la palanca final, quien quiera una pieza del rompecabezas tendrá que pararse allí, junto a la pared, porque el dispensador de piezas del rompecabezas sólo estará disponible por un corto tiempo. ¿Entendido?"

          "¡Entiendo!" Flower dice.

          "Bien", dice Melindra. "Aquí voy, entonces."
