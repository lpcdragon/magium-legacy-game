              "No parecías pensar que fuera incómodo cuando lo hicimos antes..." le digo.

              "Sí, pero eso fue cuando realmente no me importaba un comino Kate, ya que apenas la conocía", dice Melindra. "Ella y yo somos amigos ahora. ¡Es diferente!"
