  - name: b3_ch10a_shadows
    texts:
      - source: scene_text
        paragraph: 52
        text: |-
          "¿Puedes comprobar si hay otras sombras escondidas en la superficie del cubo?" digo. "Si hubiera uno de ellos, entonces podría haber más".

          "No creo haber visto más de ellos, pero miraré más de cerca, sólo para estar seguro", dice Flower. "¡Dame un minuto!"

          Luego permanece en silencio durante unos veinte segundos, mientras busca cuidadosamente las cortinas.

          "Oh, creo que podría haber encontrado otro..." dice Flower. "¡Espera, yo también me desharé de este!"

          "¿No puedes simplemente quemar toda la superficie del cubo?" Le pregunto. "Al menos así estaremos seguros de que no te perdiste nada".

          "No lo sé, ¿puedo?" Flower dice. "¿Pasaría algo malo si hiciera eso?"

          "No que yo sepa", dice Illuna. "Estos santuarios deberían diseñarse para que sean muy resistentes a la magia. Adelante, cúbrelos con llamas".

          "¡Entendido!" Flower dice.

          Durante los siguientes diez segundos, escucho algunos ruidos fuertes, que sólo puedo asumir que son las llamas ardientes que Flower está usando en mi cubo en el Plano Etéreo. Una vez que los ruidos cesan, Flower nos informa que ha terminado su tarea.

          "Está bien, todo debería estar bien ahora", dice Flower. "Barry, puedes abrir los ojos."
      - source: scene_text_2
        paragraph: 43
        text: |-
          "Finalmente", digo, mientras abro los ojos, como me indicó Flower. "Tal vez ahora podamos concentrarnos en lo que vinimos a hacer aquí en lugar de... espera un minuto, ¿qué es esto?..."

          "¿Qué es qué?" Flower dice. "¿Lo que está mal?"

          "Mi perspectiva está cambiando otra vez pero... esta vez es diferente", digo. "Cada vez que parpadeo, puedo cambiar entre la Tierra y el Plano Etéreo. Puedo mover mi conciencia entre los dos planos a voluntad. ¿Es esto algo de lo que debería preocuparme?"

          "Bueno, ¿sigue sucediendo al azar o tienes control total sobre ello?" Illuna dice.

          "No, no está sucediendo en contra de mi voluntad", digo, mientras parpadeo unas cuantas veces más para probar cómo funciona. "Puedo hacer el cambio cuando quiera. Y... creo que también puedo hacerlo para no cambiar involuntariamente entre planos cada vez que estoy parpadeando. Sí... creo... creo que puedo encenderlo y apagarlo simplemente concentrándome en ello. ¡Esto es asombroso! ¿Por qué crees que está sucediendo?"

          "Déjame preguntarte esto..." dice Illuna. "¿Cuántas veces crees que has estado cambiando tu conciencia entre los dos planos de existencia en los últimos minutos?"

          "No lo sé", digo. "Estaba sucediendo más de cien veces por segundo antes de que cerrara los ojos, así que supongo que lo he estado haciendo miles de veces. ¿Quizás decenas de miles?"
      - source: scene_3
        paragraph: 28
        text: |-
          "En ese caso, es probable que hayas cambiado tu conciencia entre los dos planos tantas veces que hayas aprendido a hacerlo de forma instintiva", dice Illuna. "Disfruta de tu nueva habilidad".

          "Entonces... ¿eso significa que ahora soy una etérea?..." le pregunto confundida.

          "Poder cambiar tu conciencia entre planos no es algo exclusivo de los etéreos", dice Illuna. "Puedo hacerlo, Arraka puede hacerlo, y lo mismo ocurre con cualquier espíritu de plano mágico, pero solo porque podamos cambiar nuestra perspectiva no significa que nuestro enfoque principal esté en Plano Etéreo. En el caso de Flower, ella considera que su yo real es el alma de su mente, y ve su cuerpo de plano terrestre como una marioneta con hilos. ¿Es así como te sientes con respecto a tu cuerpo? ahora?"

          "Mmm..." digo. "Ahora que lo mencionas, no, no es así como me siento. Me sentí así cuando el Supervisor fue quien envió mi conciencia al Plano Etéreo por la fuerza, pero ya no. Mi cuerpo desde el plano terrestre es claramente mi perspectiva principal, y el alma se siente como la que estoy controlando a través de cuerdas, en cambio".

          "Entonces no eres un etéreo", dice Illuna.

          "Sí, supongo que no", digo.

          "Todo esto es muy bonito", dice Melindra, "pero ¿podríamos tal vez concentrarnos en nuestra tarea original? No puedo retrasar estas trampas por mucho más tiempo, así que te sugiero que consigas la pieza del rompecabezas ahora o nos larguemos de aquí".
