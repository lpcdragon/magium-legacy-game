  - name: b3_ch10a_divided
    routes:
      - condition: b3_ch10_biscuit = 1
        texts:
          - source: scene_text
            paragraph: 66
            text: |-
              Meto la mano en mi mochila y saco una galleta, que luego le ofrezco a Leila.

              "Aquí", le digo a Leila. "¡Toma una galleta!"

              "Oh, gracias", escribe Leila, mientras toma la galleta en sus manos y comienza a mordisquearla.

              "¡Asegúrate de saborearlo!" digo. "¡Me quedan muy pocos de estos!"

              "Lo sé", escribe Leila, con una sonrisa, mientras continúa dando pequeños bocados a la galleta hasta que finalmente se la come toda.

              Una vez que termina de comer, de repente me doy cuenta de que esto no ha ayudado en absoluto a hacer avanzar nuestra conversación. Seguimos sentados torpemente, sin que ninguno de nosotros pueda pensar en nada de qué hablar.

              Después de más de diez segundos de silencio, decido que simplemente no puedo soportarlo más y dejo escapar lo primero que me viene a la mente.

              "Entonces..." digo. "¿Tu dispositivo de estadísticas ha obtenido puntos últimamente? Creo que no he obtenido ni un solo punto desde que llegamos a Ollendor".

              "Umm... no", escribe Leila. "Ahora que lo mencionas, creo que tampoco he obtenido ningún punto".

              "Entonces podría ser cierto que algo está sucediendo dentro de las ciudades que está provocando que obtengamos menos puntos", digo. "¿No tuvimos también un problema similar en Thilias?"

              "Sí, estoy bastante seguro de que lo hicimos", escribe Leila.
          - source: scene_text_2
            paragraph: 57
            text: |-
              "Aquí tienes una idea loca..." digo. "¿Qué pasa si la razón por la que tenemos tantos problemas para aprovechar la energía con nuestros dispositivos en las ciudades es porque hay cientos de otros dispositivos reunidos en estos lugares y la energía se divide equitativamente entre ellos?"

              "No lo creo", escribe Leila. "Si hubiera tanta gente con dispositivos caminando por estas ciudades, habría detectado al menos uno de ellos. Mi potenciador de estadísticas me alerta cuando hay otros dispositivos de estadísticas a mi alrededor, ¿recuerdas?"

              "Sí, pero ¿qué pasa si no son varias personas las que caminan con estos dispositivos?" digo. "¿Qué pasaría si alguien reuniera deliberadamente una gran cantidad de dispositivos y los colocara en estas ciudades para aprovechar la energía de los participantes? Habría menos posibilidades de detectarlos si todos estos potenciadores de estadísticas estuvieran en algún edificio, ¿verdad?"

              "Supongo..." escribe Leila.

              "También hay algo más que me molesta", digo. "Cuando conocimos a Melindra por primera vez, ella me dijo que no podía encontrar ningún potenciador de estadísticas a la venta en otros continentes, sin importar lo mucho que buscara, a pesar de que estos dispositivos solían ser extremadamente fáciles de encontrar en las tiendas antes. ¿Qué pasaría si la verdadera razón por la que tantos de estos comerciantes ya no tuvieran la baratija de adivino en existencia fuera porque alguien necesitaba comprar todos los dispositivos antes del torneo, para poder--"

              "Barry..." Leila me interrumpe, ya que ahora noto que ella me está mirando directamente a los ojos. "¿Qué estamos haciendo?..."
          - source: scene_3
            paragraph: 38
            text: |-
              "No estoy... seguro de haber entendido realmente la pregunta..." digo, pero luego Leila me interrumpe de nuevo, con otro de sus mensajes de texto flotantes.

              "Puede que este sea el último turno de noche que tengamos juntos en mucho tiempo, y aquí estamos, sentados, hablando de nuestros dispositivos de estadísticas...", escribe Leila.

              "Bueno... ¿de qué más quieres hablar?" le pregunto.

              "Cualquier cosa..." escribe Leila. "Lo que sea, siempre y cuando no se sienta tan forzado e incómodo como las conversaciones que hemos estado teniendo en los últimos minutos. Barry, ¿qué nos pasó? Solíamos poder hablar libremente, sobre cualquier tema que se nos ocurriera, y nunca hubo ninguna tensión entre nosotros. ¿Por qué no podemos simplemente actuar como si este fuera cualquier otro día? Quiero decir, ¡no es como si nunca nos volviéramos a ver! Solo estamos tomando un pequeño descanso, ¿no es así?"

              "Tienes razón..." digo, mientras proceso lentamente las palabras de Leila en mi cabeza. "¡Tienes toda la razón! ¡No sé por qué me estaba preocupando tanto! Prácticamente solo haremos un viaje corto de unas pocas semanas o tal vez un mes, y luego regresaremos. La gente normalmente no estaría tan tensa solo porque no se verán durante unas semanas, ¿verdad?"

              "¡Exactamente!" escribe Leila. "Entonces, olvidémonos de todo esto y hablemos normalmente, como siempre lo hacemos."
