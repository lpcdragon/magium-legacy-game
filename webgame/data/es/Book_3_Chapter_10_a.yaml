        texts:
          - source: scene_text
            paragraph: 9
            text: |-
              "Sí, su majestad."

              "El protocolo del Supervisor parece que te debe una disculpa", dice el dron de ojos verdes. "En su intento de hacer una broma sarcástica, el protocolo del Supervisor olvidó que este tipo de humor solo funciona con personas que tienen un nivel de inteligencia superior al promedio. En realidad, al Supervisor no podría importarle menos la forma en que te diriges a él, siempre y cuando dejes lo suficientemente claro que estás hablando con él. Se tendrán que hacer varias calibraciones para que este tipo de bromas sean más obvias para ti en el futuro. ¡Gracias por tu comprensión!"

              "De nada, hijo de puta", le digo.

              "Estás haciendo que parezca que todavía quieres que nos consideremos iguales a ti", dice Kate, "pero si ese es el caso, entonces ¿por qué nos hiciste caminar hasta aquí hasta el palacio? ¿Por qué no enviar uno de tus drones verdes para hablar con nosotros? ¿No fue eso un mensaje para nosotros, para recordarnos quién tiene realmente el control de la ciudad?"

              "Incorrecto", dice el supervisor. "El protocolo del Supervisor no está diseñado para usar tácticas de intimidación tan solapadas para lograr sus objetivos. Mis métodos de intimidación son mucho más directos y van al grano. Les aseguro que convocarlo aquí solo fue una táctica dilatoria y nada más. No había ningún otro significado oculto detrás de mis acciones".

              "¿Qué quieres decir con que fue una táctica dilatoria?" Hadrik pregunta. "¿Una táctica dilatoria para qué?..."
          - source: scene_text_2
            paragraph: 8
            text: |-
              "Creo que sería más rápido hacerles una demostración que explicárselo", dice el Supervisor. "Por favor, esperen. Si siente alguna molestia durante los próximos minutos, le recomendamos que busque la unidad de ojos rojos más cercana para un chequeo médico rápido".

              Tan pronto como el dron de ojos verdes deja de hablar, el mundo que nos rodea desaparece repentinamente y es reemplazado por un mar de luz, hasta donde alcanza la vista. No me lleva mucho tiempo darme cuenta de que mi perspectiva una vez más ha sido cambiada a la fuerza por la de mi alma en el Plano Etéreo, y que todas nuestras almas fueron expulsadas de nuestras mentes nuevamente por el Supervisor.

              Cuando miro a nuestro alrededor, veo que aparte de todos mis amigos y el dron de ojos verdes con el que estábamos hablando antes, también estamos acompañados por aproximadamente un centenar de drones de ojos rojos que nos rodean desde todas direcciones, haciéndonos imposible escapar de ellos. Otra cosa que estoy notando es que las almas de Flower y Illuna también están aquí con nosotros, lo que significa que actualmente no hay nadie dentro del santuario de Flower desde Plano Etéreo para controlar el cuerpo de Flower desde plano terrestre.

              "Como puedes ver", nos dice el dron de ojos verdes, en el Plano Etéreo, "mientras estabas ocupado yendo al palacio, he estado trabajando para mejorar mi técnica de desplazamiento de almas para que ahora transporte tus almas a una ubicación exacta en el Plano Etéreo en lugar de teletransportarte aleatoriamente por todo el éter. También he aprovechado este tiempo para desarrollar aún más un rayo de desintegración que solo puede funcionar en el Plano Etéreo. ¿Le gustaría verlo en acción?"
          - source: scene_3
            paragraph: 4
            text: |-
              "¡Está bien, está bien, lo entendemos!" Hadrik dice. "Nos estás intimidando directamente con esto. Entonces, ¿qué sigue? ¿Vas a ignorar por completo nuestro trato y hacer lo que quieras ahora que nos has mostrado quién está a cargo?"

              "Su evaluación de la situación es sólo parcialmente correcta", dice el supervisor. "Todavía tengo la intención de cumplir algunas de mis promesas. Por ejemplo, por mucho que hubiera disfrutado verlos a todos muertos, su grupo jugó un papel vital en mi ascenso al poder que no puede ser ignorado. Por lo tanto, como muestra de gratitud por ayudarme a derrotar a los rebeldes, les permitiré un paso seguro fuera de la ciudad, según nuestro acuerdo inicial. Sin embargo, pueden considerar que la mayoría de los demás términos de nuestro contrato anterior son nulos y sin valor, a partir de ahora".

              "Pensé que no estabas 'diseñado' para decir mentiras descaradas", dice Illuna. "¿Por qué de repente eres capaz de incumplir tus promesas como si nada hubiera pasado? ¿Nos estuviste mintiendo todo este tiempo?"

              "Negativo", dice el supervisor. "Lo que te dije sobre mi diseño inicial era cierto. Solo pude mentir después del intento fallido de Biliborrathrathsarran de desactivarme. Como te dije una vez antes, aunque logré evitar el cierre completo de mis protocolos, Biliborrathrathsarran aún logró desactivar algunas rutinas menores que estaban incorporadas en mi personalidad. Desafortunadamente para ti, dio la casualidad de que una de estas rutinas antes mencionadas se encargaba de manejar las restricciones que me impedían mentir".
            condition: b3_ch4_billy = 9
          - source: scene_3
            paragraph: 5
            text: |-
              "¡Está bien, está bien, lo entendemos!" Hadrik dice. "Esto nos estás intimidando directamente. Entonces, ¿qué sigue? ¿Vas a ignorar por completo nuestro trato y hacer lo que quieras ahora que nos has mostrado quién está a cargo?"

              "Negativo", dice el supervisor. "Los términos de nuestro acuerdo inicial aún se aplican. Simplemente estoy mostrándole de lo que soy capaz, en caso de que sienta la necesidad de agregar nuevas solicitudes a su lista".

              "Entonces, ¿somos libres de salir de la ciudad?" Hadrik pregunta. "¿Se acabó el encierro?"

              "Afirmativo", dice el supervisor. "Tú y tus amigos podéis entrar y salir de Ollendor cuando queráis".

              "¿Qué pasa con el rey del subsuelo y los rebeldes que encarcelaste?" Daren dice. "¿Todavía garantizas su seguridad?"

              "Aquellos que aún estén vivos no sufrirán ningún daño bajo ninguna circunstancia, tal como acordamos", dice el Supervisor.

              "Bien..." dice Daren. "Está bien."
            condition: b3_ch4_billy < 9
