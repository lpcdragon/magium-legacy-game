            paragraph: 26
            text: |-
              Había cuatro candidatos en total: los rey del subsuelo, dos rebeldes cuyos nombres nunca escuché mencionar hasta ahora, y Kelrim.

              Cada uno de los candidatos subió a un podio improvisado y pronunció breves discursos antes de que comenzara la votación, aunque los dos rebeldes anónimos parecieron haber causado muy poco impacto entre la multitud, porque al final apenas hubo nadie animándolos. Algo me dice que ninguno de los dos ofrecerá mucha competencia al rey del subsuelo en este concurso.

              En este momento, nuestro grupo está parado en algún lugar al fondo de la gran sala, para que podamos discutir las cosas libremente sin molestar a las otras personas que vinieron aquí para presenciar las elecciones.

              "¿Crees que Kelrim ganará esto si no hay interferencia?" Hadrik pregunta Daren.

              "Es casi seguro", dice Daren. "Viste cuánto apoyo obtuvo de la gente cuando se anunció por primera vez que se postularía para rey. Para ser franco, habría esperado que el rey del subsuelo intentara asesinarlo a estas alturas, considerando la gran amenaza que representaba para su gobierno. La única razón que se me ocurre para explicar por qué no lo ha hecho todavía es que debe tener mucha confianza en su capacidad para hacer trampa en esta elección. Es por eso que estoy siendo extremadamente cauteloso en este momento".

              "Hmm... Supongo que tienes razón", dice Hadrik. "Entonces mantengamos los ojos bien abiertos."
