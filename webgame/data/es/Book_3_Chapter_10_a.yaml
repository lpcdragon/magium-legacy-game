  - name: b3_ch10a_morning
    routes:
      - condition: b3_ch8_king = 0
        texts:
          - source: scene_text
            paragraph: 31
            text: |-
              "Como dije antes, fue sólo un malentendido", dice el rey. "Nunca le dije a Albert que matara a ninguno de ustedes".

              "Le dijiste que tratara con nosotros 'discretamente'", le digo.

              "¿Y a tus ojos un asesinato sin sentido habría sido discreto?" dice el rey del subsuelo, alzando una ceja. "Todos en esta sociedad subterránea saben que en el pasado le he ordenado a Albert asesinar a algunos de mis enemigos. Si cualquiera de ustedes hubiera desaparecido misteriosamente, yo habría sido el primero al que habrían culpado".

              "¿Oh sí?" Hadrik dice. "Entonces, ¿qué es exactamente lo que le hubieras pedido que hiciera?"
          - source: scene_text_2
            paragraph: 25
            text: |-
              "Quería que arruinara vuestra reputación, por supuesto", dice el rey. "Albert fue para difundir rumores de que usted trabajaba en secreto con el Supervisor, para que la gente aquí perdiera su confianza en usted y se negara a unirse a su lado en caso de que planeara oponerse a la idea de la elección. Por supuesto, este plan sólo se implementaría si intentaba activamente deslegitimar la elección, lo cual afortunadamente no es algo que usted eligió hacer".

              "¿Qué pasa con las torres de seredium?" Kate interviene. "¿Qué va a pasar ahora con todos esos prisioneros?"

              "Eso dependerá de lo que Albert decida hacer al final", dice el rey, "pero lo normal es que siga el plan inicial que les describí antes. Primero, daremos prioridad a la seguridad de todos los familiares de nuestros habitantes subterráneos. Después, intentaremos rescatar a tantos prisioneros como podamos sin afectar de manera crítica el suministro de energía de la ciudad, empezando por los niños y los ancianos. Por último, con respecto al resto de los magos que sigan atrapados en las torres, tendremos que encontrar una forma de sustituir la fuente de energía, pero no será fácil y podría llevar tiempo. Aun así, intentaremos acelerar la investigación todo lo posible para no prolongar su sufrimiento innecesariamente".

              "Ya veo..." dice Kate.
          - source: scene_3
            paragraph: 18
            text: |-
              "Ahora, si me disculpas", dice el rey del subsuelo, "tengo algunos asuntos que atender, así que me iré. Como siempre, eres libre de vagar por estas cavernas todo lo que quieras, aunque sospecho que nos trasladaremos a la superficie muy pronto, ahora que el viejo rey finalmente se ha ido. Será agradable ver el sol en la mañana cuando me despierte, después de todo este tiempo que pasé en el subsuelo. De hecho, estoy deseando que llegue. ¡Adiós!"

              "Sí, nos vemos luego", dice Daren, y luego rey del subsuelo sale por la puerta, sin mirar atrás.

              "Eh..." nos dice Daren, una vez que el rey sale de la habitación. "Estoy empezando a pensar que es posible que hayamos tenido una idea equivocada sobre este tipo todo el tiempo. Tal vez no era tan malo como pensábamos, después de todo".
        choices:
          - position: 1
            text: Puede que tengas razón.
            effects:
              - set:
                  current_scene: b3_ch10a_prisoners
                  b3_ch10_wrong: 0
          - position: 2
            text: No, creo que estaba mintiendo sobre no planear matarnos.
            effects:
