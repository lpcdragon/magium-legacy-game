        texts:
          - source: scene_text
            paragraph: 57
            text: |-
              "Oh, se detendrán, no te preocupes", dice Melindra. "Y tan pronto como lo hagan, tiraremos de la última palanca una vez más, conseguiremos la maldita pieza del rompecabezas y luego desapareceremos".

              "¿Estás diciendo que todavía podemos conseguir la pieza del rompecabezas incluso en estas condiciones?" Kate dice.

              "Sí, pero tenemos que darnos prisa", dice Melindra. "Mira, las trampas se han detenido, por ahora. Derriba las paredes de hielo y podremos ponernos a trabajar".

              "¿Está seguro?" Kate pregunta.

              "¡Por supuesto que estoy seguro!" Melindra dice. "Ahora elimínalos rápido, antes de que se acabe el tiempo".

              "Si tú lo dices", le dice Kate, y luego descarta sus paredes de hielo.

              "Estoy tirando de la palanca", dice Melindra. "Es ahora o nada. Si quieres la pieza del rompecabezas, ¡corre!"

              "¡Está bien, lo tengo!" Flower dice, mientras corre hacia la pared donde estaba antes, y yo también.

              Tan pronto como Melindra tira de la palanca, una gran piedra en la pared se desliza, revelando un dispositivo de aspecto antiguo, con un solo botón encima. Cuando Flower lo alcanza, lo empuja inmediatamente y le arrojan una pieza del rompecabezas a la mano. Luego hago lo mismo para conseguir mi propia pieza del rompecabezas y ambos corremos de regreso a Melindra y Kate lo más rápido que podemos.
