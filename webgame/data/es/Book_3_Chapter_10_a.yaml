            paragraph: 60
            text: |-
              "Está bien, he vuelto", dice Flower, unos segundos después. "¡Estoy volviendo a la normalidad ahora!"

              Luego aprieta los puños y se concentra mucho, como lo hizo la primera vez, y sus ojos lentamente se vuelven verdes nuevamente.

              "¡Está hecho!" Flower dice.

              "¿Te sientes bien?" Illuna dice. "¿No estás cansado por el esfuerzo extra?"

              "¡No, estoy bien!" Flower dice.

              "Eso es bueno", dice Illuna. "¿Entonces volvemos? Creo que hemos terminado aquí".

              "De hecho lo somos", dice Melindra. "Creo que es hora de encontrarnos con Daren, Hadrik y Leila en el distrito comercial. Sigue volando detrás de mí, conozco el camino".
