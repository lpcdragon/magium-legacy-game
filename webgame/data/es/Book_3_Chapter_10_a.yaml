              "Lo sé", digo. "Yo también te extrañaré."

              "Vamos, ya casi amanece", escribe Leila. "Deberíamos ir a despertar a los demás".

              Con estas últimas palabras ambos nos levantamos del suelo, regresamos a nuestra habitación y no nos decimos nada más hasta despertar a todos nuestros amigos.
