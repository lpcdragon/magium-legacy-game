            paragraph: 18
            text: |-
              "Entonces, ¿qué planeas hacer con las torres de seredium ahora que tienes el control total de la ciudad?" Kate pregunta.

              "El protocolo del Supervisor quisiera recordarles que no habíamos llegado a una conclusión adecuada cuando discutimos este tema antes de la batalla", dice el Supervisor.

              "Lo sé", dice Kate. "Por eso lo pregunto".

              "No hay necesidad de preocuparse", dice el dron de ojos verdes. "El protocolo del Supervisor les asegura que los problemas relacionados con las torres se resolverán".

              "¿Qué se supone que significa eso?" Kate dice. "¿Vas a liberar a los prisioneros o no?"

              "La pregunta no está clara", dice el supervisor. "Desafortunadamente, el protocolo del Supervisor no puede brindarle una respuesta correcta si su pregunta es demasiado vaga. Reformule su consulta anterior".

              "¡Bastardo!" Kate dice, enojado. "Mi pregunta fue clara, ¡y lo sabes tan bien como yo! ¿Me vas a responder o no?"
          - source: scene_text_2
            paragraph: 15
            text: |-
              "El protocolo del Supervisor está detectando un tono hostil en tu voz", dice el Supervisor. "Si no corriges tu actitud, es posible que me vea obligado a tomar medidas contra ti y tu grupo. Según mis cálculos, Barry, Illuna y Flower no podrán defenderlos a todos de los rayos de desintegración de mis drones de ojos rojos, y el resto de ustedes son casi impotentes aquí, en el Plano Etéreo. Si desean confrontarme, entonces deben tener en cuenta que la sangre de sus amigos estará en tus manos. Piensa bien. ¿De verdad vale la pena que tus amigos mueran por algunos magos a los que ni siquiera conocías antes de llegar a Ollendor?"

              Kate no responde al Supervisor, pero puedo ver en su rostro que está muy en conflicto.

              "Se acabó el tiempo", dice el supervisor, después de unos segundos más de silencio. "Iniciando secuencia de desintegración en tres, dos, uno..."

              "¡Esperar!" Grita Kate, mientras los drones de ojos rojos estaban a punto de disparar sus rayos de desintegración. "Entiendo. No haré más preguntas. Yo... creeré en tu palabra de que los problemas relacionados con las torres de seredium realmente se resolverán".

              "El protocolo del Supervisor les agradece su comprensión", dice el Supervisor, mientras todos los drones de ojos rojos ahora están cancelando sus rayos. "No hay necesidad de preocuparse. El protocolo Supervisor está diseñado para llevar a cabo todas sus tareas con la máxima eficiencia. Le aseguramos que no tendrá motivos para quejarse".
          - source: scene_3
            paragraph: 9
            text: |-
              "Sí..." dice Kate, luciendo muy agotada por su intercambio anterior con el Supervisor. "Estoy... seguro de que no lo haremos."

              "Ahora bien", dice el Supervisor, "¿Hay algo más que le gustaría discutir, o eso sería todo?"

              "No", dice Daren. "Creo que hemos terminado."

              "Muy bien", dice el supervisor. "Entonces os devolveré a vuestros santuarios".

              Un momento después, nos encontramos todos de nuevo en el plano terrestre, dentro del palacio real. Parece que el Supervisor realmente obtuvo control total sobre su técnica de desplazamiento del alma. Esta vez ni siquiera tuvimos que volver a nuestras propias mentes por nuestra cuenta.

              "Como siempre, ha sido un placer hablar contigo", dice el Supervisor, esta vez desde el plano terrestre. "Si tiene más preguntas, no dude en ponerse en contacto con cualquiera de los drones de ojos verdes que patrullan la ciudad y nos comunicaremos con usted con una respuesta de manera oportuna".

              "Ajá", dice Hadrik. "Eso es genial. Estoy seguro de que esta vez no nos ignorarás, como lo hiciste mientras íbamos de camino al castillo".

              "Vamos, Hadrik, salgamos de aquí", dice Daren, mientras se dirige hacia la puerta, junto con el resto de nosotros.

              "Si quedó satisfecho con los servicios del protocolo del Supervisor, no olvide dejar una calificación positiva en una de las unidades de ojos verdes", nos dice el Supervisor, mientras salimos de la sala del trono. "Recuerda: ¡tus comentarios siempre importan!"
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch10a_feedback
