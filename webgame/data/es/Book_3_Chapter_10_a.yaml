            paragraph: 13
            text: |-
              "¿Qué pasa con el rey del subsuelo y los rebeldes?" Daren pregunta con voz ansiosa. "¡Prometiste que no les harías daño a ninguno de ellos!"

              "Aquellos que todavía están vivos están a salvo... por ahora", dice el Supervisor. "Sin embargo, esa situación podría cambiar, dependiendo de cómo reaccionarán los otros rebeldes ante la noticia de su encarcelamiento. Si intentan oponerse abiertamente a mi reinado, es posible que la seguridad de los rehenes ya no esté garantizada".

              "Ya veo..." dice Daren, en un tono algo derrotado.

              "Una aclaración que es necesario hacer es que el rey del subsuelo de hecho no está todavía vivo", dice el Supervisor. "Fue asesinado en Plano Etéreo junto con Peter por tu amigo, Barry".

              "¿Qué?..." Daren primero pregunta confundido, pero luego se gira hacia mí. "¡¿Los mataste?! ¿Y ni siquiera me lo dijiste?"

              "Iba a contártelo", le digo. "Yo sólo estaba... esperando la oportunidad adecuada".

              "Barry, ¡todos estuvimos de acuerdo en que haríamos todo lo posible para mantener vivos a tantos rebeldes como fuera posible!" Daren dice. "¿Por qué harías algo como esto?"

              "No podía simplemente dejarlos allí", digo. "Eran demasiado peligrosos para mantenerlos con vida".

