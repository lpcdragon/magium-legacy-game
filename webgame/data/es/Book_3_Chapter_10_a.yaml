          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch10a_trumpets
  - name: b3_ch10a_trumpets
    routes:
      - condition: b3_ch10_spin = 0
        texts:
          - source: scene_text
            paragraph: 7
            text: |-
              "Está bien, está bien, entendemos tu punto", dice Hadrik, tratando de calmarla. "Intentaremos ser más cuidadosos con Arraka de ahora en adelante. Y tampoco volveremos a decir que ella es nuestra compañera de equipo ni nada por el estilo. ¿Verdad, chicos?"

              Todos asentimos lentamente en señal de acuerdo sin decir nada más, ya que todavía estamos algo en shock después de haber visto el repentino arrebato de Illuna. No es frecuente que veamos a Illuna perder su calma y comportamiento sereno de esta manera, y si no me equivoco, las únicas veces que la he visto tan enojada siempre ha sido por Arraka. Supongo que esto no debería sorprenderme, dado su pasado juntos.

              "Muy bien", dice Illuna, ahora en un tono un poco más reservado. "Sólo quería asegurarme de que todos estemos en la misma página, eso es todo. Procedamos entonces. El Supervisor seguramente debe estar esperándonos en una de las siguientes habitaciones".

              Mientras Illuna pasa al frente del grupo, el resto de nosotros intercambiamos algunas miradas más y luego todos la seguimos por el largo pasillo que probablemente conduce directamente a la sala del trono.

              Una vez que terminamos de atravesar el pasillo, abrimos la puerta que conduce a la siguiente habitación y de repente somos recibidos por el sonido de dos fuertes trompetas, que aparentemente están siendo utilizadas por dos drones de ojos rojos que flotan a cada lado del trono frente a nosotros.
          - source: scene_text_2
            paragraph: 7
            text: |-
              Los drones parecen estar usando magia de viento para tocar las trompetas, ya que no tienen boca, pero de alguna manera están perfectamente en sintonía entre sí y no se equivocan ni una sola nota. Inmediatamente reconozco la música que escucho como una de las canciones más utilizadas durante los eventos públicos de coronación.

              Mientras todos nos dirigimos hacia la sala del trono, un dron de ojos verdes con un manto rojo colocado sobre su superficie redonda de metal ahora también entra a la habitación, desde un costado, y avanza lentamente hacia el trono, donde algunos drones de ojos rojos lo están esperando. Una vez que el dron de ojos verdes llega a su destino, la canción de las trompetas se detiene y uno de los drones de ojos rojos comienza a hablar.

              "Por el poder que me han conferido los dioses, por la presente eres nombrado nuevo rey de Ollendor", dice el dron. "Ahora puedes recibir tu corona".

              Otros dos drones de ojos rojos se acercan ahora al de ojos verdes mientras sostienen una corona con sus largas puntas de metal. Luego dejan caer la corona sobre el dron de ojos verdes desde arriba, pero la corona golpea la hélice en su camino hacia abajo y es arrojada contra una de las paredes a gran velocidad, rebotando varias veces antes de finalmente caer al suelo.

              "¿Qué diablos..." comienza a decir Hadrik, demasiado aturdido para poder terminar una frase. "¿Qué es... quiero decir, a quién estás intentando... Daren, me rindo, le dices algo!"
          - source: scene_3
            paragraph: 3
            text: |-
              "Creo que lo que mi amigo intenta preguntar es... ¿cuál fue el propósito de todo esto?" Daren dice. "¿Fue realmente esa la razón por la que nos llamaste hasta aquí, hasta el palacio? ¿Para mostrarnos esta farsa de coronación?"

              "Negativo", dice el dron de ojos verdes, con el tono de voz del Supervisor. "Lo que has visto no fue una farsa. Para todos los efectos, esta coronación fue tan legítima como la mayoría de los otros eventos similares que se han realizado en Varathia a lo largo de la historia. La única diferencia importante fue que, a diferencia de la mayoría de las otras coronaciones, esta se realizó en privado y solo para una audiencia muy limitada, por razones obvias".

              "Entonces", dice Melindra, "lo que estás tratando de decir aquí es que incluso si nadie en toda la ciudad aparte de nosotros ha visto tu coronación, ¿aún te considerarás como el rey legítimo de Ollendor de ahora en adelante y comenzarás a gobernar este reino desde las sombras?"

              "Precisamente", dice el supervisor. "También debería ser más fácil para nosotros tener una conversación, ahora que cada uno de nosotros somos conscientes de nuestro propio estatus social. Si tiene problemas para encontrar formas de dirigirse a mí de ahora en adelante, puede intentar llamarme 'su majestad' o 'mi rey'. Cualquiera de los dos servirá".
        choices:
          - position: 1
            text: Sí, su majestad.
            effects:
              - set:
                  current_scene: b3_ch10a_intimidation
                  b3_ch10_majesty: 0
          - position: 2
            text: Sí, mi rey.
            effects:
              - set:
                  current_scene: b3_ch10a_intimidation
                  b3_ch10_majesty: 1
          - position: 3
            text: Espero que estés bromeando.
            effects:
              - set:
                  current_scene: b3_ch10a_intimidation
                  b3_ch10_majesty: 2
      - condition: b3_ch10_spin = 1
        texts:
          - source: scene_text
            paragraph: 8
            text: |-
