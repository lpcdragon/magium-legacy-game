            paragraph: 23
            text: |-
              Poco después, los contadores de votos anuncian al vencedor y, para nuestra sorpresa, Kelrim fue quien ganó.

              "¡¿Kelrim ganó?!" Hadrik dice, mientras Kelrim ahora sube al podio para dar su discurso de victoria. "¡No puedo creerlo! ¡El pequeño realmente lo hizo!"

              "Sí, nunca pensé que podría ser tan fácil..." dice Daren, como si aún no hubiera terminado de recuperarse del shock. "¿El rey del subsuelo realmente no ha hecho ningún esfuerzo para ganar esta elección por medios deshonestos?"

              "Tal vez confiaba demasiado en su éxito", dice Hadrik.

              "¡No, eso es imposible!" Daren dice. "Vio con sus propios ojos cuántas personas querían que Kelrim fuera rey. No podría haber estado tan ciego. No lo entiendo. ¿Realmente podríamos haberlo juzgado mal todo este tiempo?"

              "Bueno, técnicamente las elecciones aún no han terminado, así que estemos atentos por si acaso", dice Hadrik. "Nunca se sabe lo que podría pasar".
            condition: b3_ch8_king = 5
          - source: scene_3
            paragraph: 14
            text: |-
              El discurso de victoria dura un poco más y es seguido por un aplauso, así como varios vítores provenientes de la gente frente a nosotros. Una vez que las elecciones terminan oficialmente, la multitud comienza a dispersarse lentamente, mientras nosotros nos quedamos atrás para ver qué está haciendo el rey del subsuelo. Cuando se da cuenta de que lo miramos, el rey del subsuelo nos saluda con la cabeza desde la distancia y luego camina hacia nuestro rincón de la habitación para poder hablar con nosotros.

              "Me preguntaba si te unirías a nosotros o no..." dice el rey del subsuelo, tan pronto como se detiene junto a nosotros. "Dime, ¿disfrutaste la elección?"

              "Para ser honesto, más de lo que pensábamos", dice Daren. "No creo que ninguno de nosotros esperáramos que Albert realmente ganara".

              "¿No lo estabas?" pregunta rey del subsuelo, sorprendido "¿Por qué no? Albert siempre ha sido una figura muy respetada en estos lugares. Creo que la mayoría de la gente esperaba que esta fuera una carrera reñida, como mínimo".

              "Sí", dice Hadrik, "pero en cierto modo asumimos que se te ocurriría algún truco de último minuto para cambiar los resultados a tu favor, de modo que no te vieras obligado a ceder todo tu poder".

              "¿Pensaste que iba a manipular las elecciones?" dice el rey del subsuelo, luciendo realmente sorprendido. "Sabía que tenías una opinión muy baja de mí, pero nunca imaginé que sería tan mala".

              "Oye, no actúes como si fueras una especie de santo", le digo. "¡No olvides que sabemos que planeabas asesinarnos!"
            condition: b3_ch8_king = 0
