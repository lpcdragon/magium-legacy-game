  - name: b3_ch10a_feedback
    routes:
      - condition: b3_ch4_billy <> 7 AND b3_ch4_billy <> 8
        texts:
          - source: scene_text
            paragraph: 20
            text: |-
              "Entonces, ¿qué hacemos ahora?" pregunta Hadrik, una vez que la puerta detrás de nosotros se cierra y caminamos por el pasillo que conduce fuera del palacio.

              "No hay mucho que podamos hacer en este momento", dice Daren. "Nosotros somos los que ayudamos al Supervisor a obtener el control de la ciudad. Ahora es demasiado tarde para cambiar de bando, después de todo lo que ha sucedido".

              "Sí, pero ¿no crees que tal vez podríamos... atacar su núcleo o algo así?" Hadrik dice. "Y luego podríamos intentar poner a alguien más a cargo. ¡Alguien que no sea ni el Supervisor ni un rebelde!"

              "El rey del subsuelo nunca nos dijo dónde está el núcleo", dice Daren. "E incluso si obtuviéramos esa información de otra persona, no hay manera de que su núcleo no estuviera protegido. Todo lo que necesita es un dron que nos envíe de regreso al Plano Etéreo, donde no tendríamos ninguna posibilidad contra él. Necesitamos ser realistas aquí. Nuestro papel en esta historia ha terminado, y vamos a tener que aceptarlo".

              "¡Argh!" Hadrik dice. "Me molesta que estemos dejando que esa lata engreída se convierta en el gobernante de este lugar después de todo lo que nos dijo allí. Pero todos estuvimos de acuerdo en que lo ayudaríamos a derrotar a las fuerzas rebeldes, así que admito que soy en parte culpable de lo que pasó".

              "El hecho de que estuviera actuando un poco altivo y poderoso con nosotros no significa que será un mal líder", dice Daren. "Como mínimo, como máquina, debería cometer menos errores que sus predecesores humanos. Probablemente deberíamos esperar unas semanas para ver qué hace, antes de juzgarlo".
          - source: scene_text_2
            paragraph: 17
            text: |-
              Poco después de salir del palacio, escuchamos a Flower jadear ruidosamente, mientras todavía es transportada por las corrientes de aire de Melindra.

              "¡Creo que lo tengo!" Flower dice, en voz alta. "Melindra, ¿puedes dejarme en paz por un segundo?"

              "¿Eh?" Melindra dice. "Oh, sí, claro".

              Luego agita sus manos hacia ella y Flower baja suavemente al suelo.

              "¡Gracias!" Flower dice. "Muy bien, aquí voy. ¡Deséame suerte!"

              Antes de que cualquiera de nosotros tenga tiempo de preguntar qué está haciendo, Flower comienza a apretar los puños con mucha fuerza, mientras sus brazos tiemblan frente a ella. Mientras aparentemente está reuniendo cada gramo de concentración que tiene para concentrarse en su tarea actual, sus ojos comienzan a volver gradualmente a su color verde normal, mientras que las llamas ardientes invisibles en su aura también parecen extinguirse lentamente.

              Unos segundos más tarde, Flower vuelve completamente a la normalidad, con una gran sonrisa en su rostro.

              "¡Ja!" ella dice, felizmente. "¡Lo logré! ¡No puedo creer que logré hacerlo! ¡Ahora lo tengo todo bajo control! ¡Mira!"

              Luego aprieta los puños nuevamente y sus ojos comienzan a volver a su color rojo brillante de antes. Justo en medio de su transformación, sus ojos se vuelven azules de repente y Flower se golpea muy fuerte en la cabeza, lo que hace que sus ojos vuelvan a la normalidad de inmediato.
          - source: scene_3
            paragraph: 11
            text: |-
              "¡Un minuto!" Illuna dice. "¡Todo lo que pido es un minuto sin que hagas algo estúpido! ¿No puedes al menos descansar un poco antes de transformarte nuevamente? ¿Qué pasa si te quedas atascado de nuevo y no puedes regresar? ¿Y luego qué?"

              "¡Lo siento!" Flower dice. "Supongo que sólo quería alardear un poco. ¡No lo volveré a hacer, lo prometo!"

              "Puedes practicar tus transformaciones todo lo que quieras después de dormir bien por la noche", dice Illuna. "Lo único que te pido es que no te tomes esto a la ligera. Has estado haciendo teletransportación de alta distancia durante todo el Plano Etéreo durante todo el día. Es un milagro que no hayas alcanzado tu límite todavía. Intentemos no tentar al destino más de lo que ya lo hemos hecho, ¿de acuerdo?"

              "Sí, Pétalo", dice Flower. "Entiendo."

              "Bien", dice Illuna.

              "¿Puedo decir sólo una cosa más?" Flower dice.

              "¿Qué?" Illuna pregunta, en tono aprensivo.

              "Ahora que hemos terminado con la coronación y todo", dice Flower, "¿podríamos tal vez hacer una visita muy rápida a ese edificio de Ollendor donde Melindra me dijo que hay una pieza del rompecabezas al acecho?"

              "Increíble..." dice Illuna. "Después de todo lo que hemos pasado, todavía estás pensando en las piezas del rompecabezas..."
        choices:
          - position: 1
            text: Oye, esa no es una mala idea. ¡De hecho, también quería preguntar sobre esto!
            effects:
              - set:
                  current_scene: b3_ch10a_puzzle
                  b3_ch10_puzzle: 1
          - position: 2
            text: Realmente no podrían importarme menos esas piezas del rompecabezas en este momento.
            effects:
              - set:
                  current_scene: b3_ch10a_puzzle
                  b3_ch10_puzzle: 0
