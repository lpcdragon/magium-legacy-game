  - name: b3_ch10a_speech
    routes:
      - condition: b3_ch10_spin = 0
        texts:
          - source: scene_text
            paragraph: 28
            text: |-
              "Está bien, está bien, entendemos tu punto", dice Hadrik, tratando de calmarla. "Intentaremos ser más cuidadosos con Arraka de ahora en adelante. Y tampoco volveremos a decir que ella es nuestra compañera de equipo ni nada por el estilo. ¿Verdad, chicos?"

              Todos asentimos lentamente en señal de acuerdo sin decir nada más, ya que todavía estamos algo en shock después de haber visto el repentino arrebato de Illuna. No es frecuente que veamos a Illuna perder su calma y comportamiento sereno de esta manera, y si no me equivoco, las únicas veces que la he visto tan enojada siempre ha sido por Arraka. Supongo que esto no debería sorprenderme, dado su pasado juntos.

              "Muy bien", dice Illuna, ahora en un tono un poco más reservado. "Sólo quería asegurarme de que todos estamos en la misma página, eso es todo. Prestemos atención al podio. Creo que podrían estar a punto de anunciar al ganador".

              Cuando Illuna se da vuelta, el resto de nosotros intercambiamos algunas miradas más y luego todos seguimos observando las elecciones en silencio.
          - source: scene_text_2
            paragraph: 20
            text: |-
              Poco después, los contadores de votos anuncian al vencedor y, para nuestra sorpresa, Albert fue quien ganó.

              "¡¿Albert ganó?!" Hadrik dice, mientras Albert ahora sube al podio para dar su discurso de victoria. "¿En serio? ¿Él entre todas las personas?"

              "Te dije que no deberías despedirlo solo porque es la mano derecha de rey del subsuelo", dice Daren. "Parece que la gente de por aquí tenía una opinión mucho mejor de él que el resto de nosotros".

              "Sí", dice Hadrik. "O eso, o REALMENTE odiaban el rey del subsuelo".
            condition: b3_ch8_king = 0
          - source: scene_text_2
            paragraph: 21
            text: |-
              Poco después, los contadores de votos anuncian al vencedor y, para nuestra sorpresa, Peter fue quien ganó.

              "¿Peter ganó?..." dice Hadrik, mientras Peter ahora sube al podio para dar su discurso de victoria. "¡Esa sí que es una agradable sorpresa! ¿Cómo diablos sucedió eso?"

              "Te dije que era muy querido por aquí", dice Daren. "Las primeras impresiones pueden ser engañosas a veces. Puede que nos haya parecido un poco indeciso, por las pocas interacciones que tuvimos con él, pero debemos recordar que todavía era uno de los tres líderes rebeldes. Claramente, estas personas deben conocer otro lado de él que no nos resulta familiar".

              "Bueno, en lo que a mí respecta, cualquiera es mejor que rey del subsuelo", dice Hadrik, "pero Peter no es una elección particularmente mala, si me preguntas. ¡Me alegro de que haya sido él quien terminó ganando!"

              "Sí, yo también", dice Daren. "De todas las opciones disponibles, él era claramente la mejor".

              "Esperemos que no sea tan cobarde como parece", dice Kate, "y que no siga recibiendo órdenes del rey del subsuelo incluso después de ser nombrado rey de Ollendor".

              "¡Ah, no te preocupes por eso!" Hadrik dice. "¡Estoy seguro de que le irá bien!"
            condition: b3_ch8_king = 1
          - source: scene_text_2
            paragraph: 22
            text: |-
              Poco después, los contadores de votos anuncian al vencedor, y para sorpresa de nadie, el rey del subsuelo fue quien ganó. Mientras el rey sube al podio para pronunciar su discurso de victoria, Daren se vuelve hacia nosotros nuevamente, con una expresión visiblemente triste en su rostro.

              "Bueno..." dice Daren. "No podemos decir que no esperábamos esto, pero eso no hace que las cosas sean menos decepcionantes".

              "Oye, tal vez no sea tan malo como gobernante", dice Hadrik. "El hecho de que no nos guste su personalidad no significa que tenga pocas habilidades de liderazgo".

              "No son sus habilidades de liderazgo lo que me preocupa, sino sus intenciones", dice Daren. "De cualquier manera, no hay nada que podamos hacer al respecto ahora. En cierto modo, también es culpa nuestra por no poder presentar una propuesta de candidato lo suficientemente buena como para competir adecuadamente con él, así que realmente no podemos quejarnos".

              "Para ser justos, solo llevamos aquí unos días", dice Hadrik. "Apenas conocemos a esta gente. Tal vez sea mejor que no nos involucremos demasiado en su elección. Ya hemos interferido bastante".

              "Sí..." dice Daren. "Quizás tengas razón."
            condition: b3_ch8_king = 2
