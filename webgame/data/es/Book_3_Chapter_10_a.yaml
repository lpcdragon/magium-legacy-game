      - source: scene_text_2
        paragraph: 54
        text: Encontrar una posada que todavía estuviera funcionando a pesar del reciente cierre resultó ser un poco más difícil de lo previsto, pero después de una o dos horas de búsqueda, logramos encontrar una que estaba abierta. Tan pronto como Hadrik terminó de negociar nuestro precio, reservamos una habitación grande para todos, con camas separadas, y luego entramos a nuestra habitación para discutir qué haríamos durante el resto del día.
