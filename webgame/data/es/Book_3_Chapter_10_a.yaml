              "El rey oficial será Breynan, como establecimos anteriormente", dice el Supervisor. "Ese fue el trato que hicimos, ¿no?"

              "También discutimos Kelrim como alternativa, pero no llegamos a una conclusión definitiva", recuerda Daren el Supervisor. "Dijiste que íbamos a revisar este asunto después del final de la batalla".

              "Efectivamente", dice el supervisor. "Sin embargo, cuando acepté ayudarte al principio, fue bajo la condición de que Breynan fuera el rey oficial. Después de que mencionaste el Goblin, investigué un poco sobre él y desafortunadamente, según mis predicciones, él y yo no podríamos cooperar adecuadamente. Una de las razones principales por las que te traje aquí en el Plano Etéreo es porque quería asegurarme de que los términos de nuestro acuerdo serán respetados por ambas partes. Ahora, dime, ¿todavía ¿Tienes un acuerdo o no?"

              "...Tienes razón", dice Daren, en un tono algo derrotado. "Fuimos nosotros quienes aceptamos tu condición de que Breynan sea el rey, así que ya es demasiado tarde para cambiar eso. Sólo espero que esto signifique que también respetarás los demás términos de nuestro acuerdo".

              "Sí", dice el supervisor. "Esa es mi intención".
