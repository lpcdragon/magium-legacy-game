      - condition: b3_ch10_check = 1
        texts:
          - source: scene_text
            paragraph: 59
            text: |-
              "Oye, Flower, ¿podrías hacer una última revisión de las sombras en el interior de mi santuario también antes de irte?" digo.

              "Puedes comprobarlos tú mismo", dice Illuna. "Ya estás dentro".

              "Sí, pero ella ha visto cómo se ven", digo. "¿Qué pasa si no puedo distinguir entre una sombra real y un trozo de oscuridad del abismo?"

              "Bueno, está bien, pero será sólo un vistazo muy rápido y luego volveré", dice Flower.

              "Flower, creo que esto podría no ser una buena idea--" Illuna comienza a decir, pero Flower la interrumpe.

              "Barry, ¡estoy aquí!" Flower me lo dice en el plano terrestre.

              "¿Quieres decir que estás dentro de mi mente ahora mismo?" digo. "Espera, déjame cambiar".

              Luego me concentro en la idea de Plano Etéreo, parpadeo y mi perspectiva cambia instantáneamente a la de mi alma.

              "Vaya, tu lugar es realmente desierto", me dice Flower en el Plano Etéreo, mientras echa un vistazo al interior de mi cubo. "¿Nunca has pensado en conseguir una mesa o algo así? O al menos una cama".

              "Sí, crearé uno de esos tan pronto como descubra cómo hacerlo", le digo.
          - source: scene_text_2
            paragraph: 51
            text: |-
              "¡Oh, es fácil!" Flower dice. "Recuérdame que te lo enseñe más tarde. De todos modos, no parece que haya sombras aquí, Barry. Deberías estar a salvo. Así que... Supongo que ahora volveré a mi propia mente. ¡Nos vemos, Barry!"

              "Sí, nos vemos", digo, y luego Flower se teletransporta.

              Luego parpadeo para volver a cambiar mi conciencia al plano terrestre y desactivo mi capacidad de moverme entre planos temporalmente, para no hacerlo cada vez que parpadeo. Creo que tendré que experimentar un poco más con este poder para ver si puedo hacerlo un poco más conveniente.

              "Uf... me siento un poco... cansada", dice Flower, después de volver a su forma normal, sin los ojos brillantes.

              "Traté de advertirte", dice Illuna. "Teletransportarse a la mente de otras personas puede ser muy agotador. Deberías considerarte afortunado de que todo lo que obtengas de esto sea un pequeño dolor de cabeza".

              "Oh..." digo. "Lo siento. No lo sabía."

              "Yo... creo que voy a acostarme y descansar un poco", dice Flower. "Pétalo, ¿está bien si te dejo controlar el cuerpo por un tiempo?"
          - source: scene_3
            paragraph: 35
            text: |-
              "Sí, está bien", dice Illuna.

              "Está bien, nos vemos luego", nos dice Flower, y luego sus ojos se vuelven azules nuevamente.

              "Entonces, ¿están todos listos para irse?" Melindra dice.

              "Sí, pero necesitaré que alguien me lleve mientras volamos", dice Illuna. "No puedo volar sin los propulsores de fuego de Flower".

              "Yo te llevaré", dice Kate. "Deberías ser lo suficientemente liviano como para que no suponga un problema para mi plataforma voladora de hielo".

              "Gracias", dice Illuna.

              "Muy bien, se supone que nos reuniremos con Daren, Hadrik y Leila en el distrito comercial", dice Melindra. "Sigue volando detrás de mí. Conozco el camino".
