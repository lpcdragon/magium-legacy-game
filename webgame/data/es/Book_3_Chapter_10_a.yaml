            paragraph: 44
            text: |-
              Como prometió, Melindra va a bajar varias de las palancas que están en las paredes y, una vez que termina, regresa con nosotros.

              "Muy bien, ahora tenemos que esperar aproximadamente un minuto", dice Melindra.

              "Correcto", le dice Flower.

              Después de que Flower dice esto, hay un silencio incómodo durante unos diez segundos, durante los cuales ninguno de nosotros suelta una sola palabra.

              "Ya sabes, Barry..." Melindra dice de la nada, mientras se gira hacia mí. "Hay algo que he querido preguntarte desde hace un tiempo... ¿Cuál es el problema entre tú y la mujer herborista? ¿Son ustedes dos pareja o no?"

              "Uh... más o menos", digo.

              "Le prometió que volvería con ella después de ganar el torneo", dice Kate.

              "Hmm..." dice Melindra. "Pero estoy bastante seguro de que escuché a Hadrik mencionar en algún momento cómo este 'Rose' dijo que su relación con Barry fue solo por una noche. ¿No significa esto que Rose no tenía mucho interés en él, aparte de esa noche?"
          - source: scene_text_2
            paragraph: 36
            text: |-
              "No es así..." dice Kate. "Hablé con ella sobre esto y ella me admitió que la única razón por la que dijo tal cosa fue porque no quería que Barry se sintiera culpable por dejarla atrás en Thilias. Ella pensó que si le contaba lo que sentía por él, él podría haber tenido dudas sobre el torneo y no quería que renunciara a su sueño de toda la vida de convertirse en mago por su culpa".

              "¿Entonces estás seguro de que Rose siente algo por él?" Melindra dice.

              "Sí, estoy seguro de ello", dice Kate.

              "Está bien", dice Melindra. "Eso es todo lo que quería saber. ¡Gracias por compartirlo conmigo!"

              "De nada", dice Kate.

              "Creo que es hora de tirar de la siguiente palanca", dice Melindra. "Regresaré enseguida".

              Melindra luego va al otro extremo del corredor y tira de una de las palancas de la pared izquierda.
          - source: scene_3
            paragraph: 24
            text: |-
              De repente, tengo un dolor de cabeza terrible y mi conciencia cambia entre los planos etéreo y terrestre varias veces seguidas, en rápida sucesión, de manera muy similar a como sucedió cuando el éter me estaba atacando. Justo cuando pensaba que todo había terminado, vuelve a pasar lo mismo, excepto que voy y vengo entre los dos aviones más de diez veces en un segundo.

              "Barry, ¿qué pasa?" Kate me pregunta, ahora luciendo muy preocupado. "¿Alguien te lanzó un hechizo de mareo?"

              "No, no es un hechizo de mareo, es-- argh..."

              El dolor de cabeza vuelve a apoderarse de mí y paso unos buenos momentos alternando constantemente la perspectiva de mi alma y la de mi cuerpo. Creo que esta vez pude haber cambiado entre los dos aviones al menos cien veces.

              "¿Tienes alguna idea de qué está causando esto?" Kate me pregunta. "¿Se siente como un dolor de cabeza normal o es algo más?"
        choices:
          - position: 1
            text: Dile a Kate la verdad sobre lo que me está pasando.
            effects:
