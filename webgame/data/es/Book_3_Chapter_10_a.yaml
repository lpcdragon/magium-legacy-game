            condition: b3_ch8_overseer2 = 1
          - source: scene_3
            paragraph: 21
            text: |-
              "¡Listo!" Digo, mientras Kate y Flower asienten con la cabeza también.

              "Está bien", dice Melindra. "¡Volemos!"

              Tan pronto como Melindra nos da el visto bueno, todos nos lanzamos al cielo mediante nuestros propios métodos de vuelo, nos despedimos temporalmente de nuestros amigos en tierra y nos dirigimos hacia el edificio con la pieza del rompecabezas. Como volamos a una velocidad relativamente alta y el viento sopla constantemente en nuestros oídos, realmente no hablamos mucho durante nuestro corto viaje, excepto cuando Melindra nos da instrucciones.

              Cuando estamos a mitad de camino, de repente siento una sensación inquietantemente familiar de mareo, y luego mi perspectiva cambia a la de mi alma en el Plano Etéreo, sentada en el cubo vacío que es mi santuario. Cuando recupero mis sentidos en el plano terrestre, unos segundos después, me doy cuenta de que he perdido el control de mis corrientes de aire y que estoy cayendo rápidamente.

              Rápidamente muevo mis brazos hacia arriba para evitar caer, y luego simplemente floto allí por varios momentos, mientras una ligera sensación de ansiedad comienza a apoderarse de mí lentamente.

              Está pasando de nuevo... ¿Por qué está pasando esto? ¿No fue sólo una casualidad la última vez?

              "Barry, ¿está todo bien?" Melindra dice. "¿Están funcionando mal las corrientes?"
