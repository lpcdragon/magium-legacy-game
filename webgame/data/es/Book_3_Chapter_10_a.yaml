            paragraph: 53
            text: |-
              "¡Está bien, está bien, lo siento!" Flower dice. "¿Cuándo tirarás de la última palanca?"

              "Justo después del que estoy haciendo ahora", dice Melindra. "Entonces, ¿estás listo o no?"

              "Sí, sí, estoy listo", dice Flower. "¿Dónde tenía que pararme otra vez?"

              "Justo allí junto al--" Melindra comienza a decir, pero luego todas las antorchas del corredor se apagan al mismo tiempo.

              "¡Argh!" Melindra dice. "¡Malditas sean estas viejas antorchas! ¡Debería haber sabido que no durarían mucho!"

              "Está bien", dice Flower. "Puedo volver a hacer algunos orbes de fuego flotantes para iluminar el corredor. ¡No es un gran problema!"

              "Muy bien, como estaba diciendo", continúa Melindra, mientras Flower coloca sus bolas de fuego alrededor de la habitación para brindarnos una iluminación óptima, "para obtener la pieza del rompecabezas, debes pararte junto a la pared de ese lado. Mientras tanto, voy a estar tirando de esa palanca de allí. Una vez que jalo la palanca, la pared frente a ti se abrirá, y luego podrás sacar la pieza del rompecabezas del dispensador con-- mi Dioses, ¿qué le ha pasado a Arraka? ¡Ella simplemente no se calla!"

              "Simplemente ignórala", dice Illuna, mientras se puede escuchar a Arraka murmurar furiosamente desde el amuleto cerrado. "Probablemente nos esté maldiciendo otra vez."

              "Pero ella no ha dicho nada durante más de media hora", dice Kate. "¿Y si es algo importante? ¿Puedes abrir el amuleto sólo un momento, por favor? Me gustaría escuchar lo que ella tiene que decir".
          - source: scene_text_2
            paragraph: 44
            text: |-
              "Bien", dice Illuna, mientras busca su amuleto para poder abrirlo. "Prepárate para taparte los oídos".

              "¡¡¡Os están engañando, imbéciles!!!" Arraka grita, mientras su voz hace eco por todas las ruinas. "¡La guardia real ilusionista ha estado escondida aquí de manera invisible todo este tiempo! ¡Él fue quien apagó las antorchas e hizo una ilusión que interfiere con tu sentido de la orientación mientras las luces estaban apagadas! ¡Mira las paredes! ¡Las estás viendo al revés!"

              "Esto no tiene ningún sentido", dice Illuna. "¿Cómo sabría el ilusionista que estamos aquí?"

              "No, creo que tiene razón", dice Melindra. "Las dos paredes y la ubicación de las palancas son casi completamente simétricas, por lo que es muy difícil ver la diferencia, pero ahora que estoy observando mejor, creo que puedo--"

              "¡Cállate y aléjate de las paredes!" Arraka grita. "¡El ilusionista está a punto de tirar de una palanca!"

              "Ah, mierda", dice Melindra. "¡Todos vengan aquí! ¡Por aquí donde estoy parado! Es el único lugar seguro. ¡Rápido!"

              Mientras todos corremos hacia la posición de Melindra, múltiples flechas comienzan a volar desde las paredes, mientras varias cuchillas giratorias salen del piso, moviéndose hacia adelante y hacia atrás por el corredor. Una vez que todos llegamos a Melindra, Kate forma cuatro paredes de hielo a nuestro alrededor, para poder defendernos de cualquier flecha perdida que pueda terminar golpeándonos.

              "¿Dónde está el ilusionista?" Kate pregunta. "¿Todavía está en las ruinas con nosotros?"
          - source: scene_3
            paragraph: 29
            text: |-
              "No, se ha ido", dice Arraka. "Está corriendo escaleras arriba mientras hablamos".

              "¿Subir corriendo las escaleras?" Melindra dice, mientras casi suelta una carcajada. "Bueno, entonces supongo que ya no lo veremos más".

              "¿Qué quieres decir?" digo.

              Inmediatamente después de hacer mi pregunta, escucho a un hombre gritar de dolor, mientras toda la escalera y la entrada a las ruinas se llenan de llamas.

              "La salida obviamente también sería una trampa explosiva", dice Melindra. "No sé qué estaba pensando ese tipo".

              "¿Crees que está muerto?..." pregunta Flower, algo aprensivo.

              "Por supuesto que está muerto", dice Melindra, "Después de un incendio como ese, ni siquiera creo que queden restos de él, excepto sus cenizas".

              "Entonces, ¿cuánto tiempo debemos permanecer aquí?" Kate pregunta. "¿Alguna vez cesarán estas trampas?"
