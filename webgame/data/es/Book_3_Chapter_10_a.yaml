            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch10a_section_ending
  - name: b3_ch10a_section_ending
    routes:
      - condition: b3_ch8_overseer2 = 0
        texts:
          - source: scene_text
            paragraph: 73
            text: |-
              Tan pronto como todos estuvieron de pie, salimos hacia la sala de teletransporte, despidiéndonos por última vez de los rebeldes cuando pasamos por la sala de espera, y luego, una vez que llegamos al teletransportador, le dijimos al ingeniero que estaba operando el panel de control que se pusiera en espera, mientras cada uno nos despedíamos de Leila, uno por uno.

              Aunque originalmente planeábamos que fuera breve, cada uno de nosotros terminó pasando más de un minuto con Leila, como si simplemente no quisiéramos dejarlo ir. Daren incluso le regaló a Leila uno de sus transceptores, indicándole que se lo diera al doctor Reidzek, para que al menos pudiéramos comunicarnos con ella a través de su padre de vez en cuando, para saber que estaba a salvo.

              Cuando finalmente llegó el turno de Kate de despedirse, ella ya no pudo controlarse y rompió a llorar, mientras abrazaba muy fuerte a Leila en sus brazos.

              "Leila, te voy a extrañar mucho", dice Kate, mientras intenta en vano detener las lágrimas que corren por su rostro. "Prometo que volveré contigo. ¡Lo prometo! Y traeré a Diane de regreso también, y a Barry, y a todos los demás, y luego todos vamos a--"
          - source: scene_text_2
            paragraph: 63
            text: |-
              "¡¿Qué les pasa a ustedes?!" Arraka grita de repente desde su amuleto. "¡Os volveréis a ver en una semana, pero estáis lloriqueando y llorando como niños! ¡¿Realmente no hay límite para vuestra estupidez?!"

              "¿Cómo sabes que será sólo una semana?" Daren le pregunta. "Por el momento, no tenemos idea de cuándo terminará el torneo. Podría pasar más de un mes antes de..."

              "¡No estoy hablando del final del torneo, cretino!" Arraka dice. "¡Estoy hablando del ritual de Selkram! ¿Ya olvidaste que tuvo que interrumpir la segunda prueba y que dijo que continuaremos la próxima vez? ¡Todos vamos a realizar esa prueba nuevamente juntos, te guste o no!"

              "Sí, pero Leila ya no viajará con nosotros en ese momento", dice Hadrik. "¿Cómo va a meterla en el juicio si ya ni siquiera estará allí con nosotros?"
          - source: scene_3
            paragraph: 41
            text: |-
              "¿De verdad crees que Selkram es el tipo de persona que dejaría que algo tan trivial como eso le impidiera conseguir lo que quiere?" Arraka dice. "Si la chica muda no estará allí cuando el juicio esté a punto de comenzar, entonces él la TRAERá allí. Si Eiden puede sentir a alguien de todo el continente y teletransportar acercárselo, entonces también puede hacerlo el 'Dios del Tiempo'. Te garantizo que Selkram NUNCA deja que nadie escape de sus pruebas, sin importar dónde se encuentren. En otras palabras, deberías volver a encontrarte con tu precioso Leila dentro de los próximos diez días, como máximo. ¿Ahora puedes? ¡POR FAVOR deja de quejarte! ¡Estoy tratando de concentrarme en algo!"

              "Bueno..." Kate le dice a Leila, mientras se limpia las últimas lágrimas de su rostro. "En ese caso, supongo que... ¿te veré más tarde, entonces?"

              "Hasta luego", escribe Leila con una sonrisa, y luego le damos al ingeniero la señal para que teletransportar nos vayamos, mientras nos despedimos de Leila por última vez.
