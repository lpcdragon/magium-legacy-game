              "Leila, está bien", digo. "No hiciste nada inapropiado. No es necesario que te disculpes".

              "Me alegra que te sientas así", escribe Leila con una sonrisa.

              Luego hace una pausa durante unos segundos, mientras su rostro comienza a sonrojarse lentamente.

              "¿Sería demasiado inesperado si te besara de nuevo ahora?" Leila escribe.

              "En absoluto", le respondo.

              "Está bien", escribe Leila, mientras sonríe. "¡No digas que no te lo advertí!"
