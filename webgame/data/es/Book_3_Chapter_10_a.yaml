  - name: b3_ch10a_flow
    routes:
      - condition: b3_ch8_overseer2 = 0
        texts:
          - source: scene_text
            paragraph: 65
            text: |-
              Me tomó más de una hora, pero finalmente encontré una manera de ser consciente de ambos aviones al mismo tiempo, incluso si uno de ellos solo estuviera ahí en el fondo de mi mente, como si estuviera en algún lugar de mi visión periférica.

              De esta manera, no tendría que preocuparme de que mi cuerpo fuera atacado en el plano terrestre mientras mi alma estaría ocupada explorando el Plano Etéreo. También sería una garantía de que si alguno de mis amigos tuviera algo que decirme mientras estaba en Plano Etéreo, podría escucharlos hablar y volver a cambiar. Otra cosa que logré al entrenarme fue ya no manejar el cambio entre planos parpadeando, sino hacerlo simplemente enfocando mi conciencia en un plano u otro.

              Tan pronto como instalé todo este sistema, le pregunté a Flower si se sentía lo suficientemente descansada como para teletransportar salir de mi santuario por un tiempo, para ayudarme a practicar algunos de mis hechizos, pero Illuna dijo que sería demasiado peligroso para ella transformarse nuevamente tan pronto después de todo lo que ya hizo hoy, y que deberíamos dejarlo para mañana, después de que haya dormido bien por la noche.
          - source: scene_text_2
            paragraph: 55
            text: |-
              Cuando finalmente terminó la noche, todos nos fuimos a dormir a nuestra habitación, excepto Kate y Leila, quienes tomaron el primer turno de noche en algún lugar fuera de nuestro dormitorio. Luego, unas horas más tarde, Kate fue quien me despertó diciéndome que Leila me estaba esperando más adelante en el pasillo.

              Después de cambiarme el pijama y agarrar mi mochila, salgo de nuestra habitación y encuentro a Leila sentada en el suelo con la espalda apoyada en una de las paredes de la caverna, lo suficientemente lejos de nuestras habitaciones para no despertar a los demás hablando, sin dejar de poder observar la entrada.

              Una vez llego a Leila, me siento a su lado y comenzamos a hablar, pero desde los primeros momentos noto que algo anda mal. Nuestra conversación no fluye con tanta naturalidad como suele hacerlo. Creo que es porque ambos sabemos que esta será la última conversación que tendremos en mucho tiempo y ambos sentimos mucha presión por eso.
          - source: scene_3
            paragraph: 37
            text: |-
              ¿Quién sabe cuándo nos volveremos a ver después de esto? ¿Qué pasa si algo sale terriblemente mal durante el torneo y nunca logro volver con ella? ¿Qué pasa si le digo algo realmente estúpido hoy y ese será su último recuerdo de mí?

              A medida que estos pensamientos siguen corriendo por mi cabeza, me resulta cada vez más difícil concentrarme en lo que estoy diciendo. Finalmente, después de solo unos minutos de conversación, los dos dejamos de hablar por completo y hay un silencio muy incómodo que nunca antes había ocurrido entre ella y yo, a pesar de que ella está muda.

              Es necesario hacer algo. No se puede permitir que las cosas sigan así.
        choices:
          - position: 1
            text: Ofrezca a Leila una galleta.
            effects:
              - set:
                  current_scene: b3_ch10a_divided
                  b3_ch10_biscuit: 1
          - position: 2
            text: Pregúntale a Leila si conoce el chiste sobre el Gólem de roca y el pisoteador de tres patas.
            effects:
              - set:
                  current_scene: b3_ch10a_divided
                  b3_ch10_biscuit: 0
