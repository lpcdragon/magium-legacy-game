            paragraph: 39
            text: |-
              Una vez más, hay una pausa, pero esta vez no parece antinatural. Ambos sabemos que nuestro turno de noche casi llega a su fin, pero ya lo hemos aceptado. No nos arrepentimos.

              "Barry, antes de que terminemos nuestro turno de noche... solo hay... una última cosa de la que quería hablarte", escribe Leila, luciendo un poco avergonzado. "La otra noche, cuando me prometiste que viviríamos aventuras juntos y yo... te besé de repente... Sé que tal vez no haya sido lo apropiado en esa situación, pero estaba tan feliz, y como que simplemente... lo hice sin pensar. Realmente espero no haberte puesto en una posición difícil al hacer algo así completamente inesperado..."
