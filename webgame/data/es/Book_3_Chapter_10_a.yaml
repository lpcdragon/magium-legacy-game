              Una vez más, hay una pausa, pero esta vez no parece antinatural. Ambos sabemos que nuestro turno de noche casi llega a su fin, pero ya lo hemos aceptado. No nos arrepentimos.

              "Yo... creo que es hora de despertar a los demás", escribe Leila. "Es casi de mañana."

              "Bien", digo, mientras me levanto también. "Vamos."

              Después de dar unos pasos hacia adelante, Leila vuelve su cabeza hacia mí una vez más, mientras algunas nuevas letras flotantes se forman frente a mí.

              "Te extrañaré, Barry..." escribe Leila.

              "Lo sé", digo. "Yo también te extrañaré."

              Con estas últimas palabras volvemos a nuestra habitación y no nos decimos nada más hasta que despertamos a todos nuestros amigos.
        choices:
