          - source: scene_text
            paragraph: 42
            text: |-
              Como prometió, Melindra va a bajar varias de las palancas que están en las paredes y, una vez que termina, regresa con nosotros.

              "Muy bien, ahora tenemos que esperar aproximadamente un minuto", dice Melindra.

              "Correcto", le dice Flower.

              Después de que Flower dice esto, hay un silencio incómodo durante unos diez segundos, durante los cuales ninguno de nosotros suelta una sola palabra.

              "Entonces..." dice Melindra de la nada, mientras se gira hacia mí. "Tú y Leila, ¿eh?"

              "¿Qué quieres decir?" -digo, tratando de hacerme el tonto.

              "¡Oh, sabes muy bien a qué me refiero!" Melindra dice. "Los vi actuando de manera incómoda el uno con el otro después de su último turno de noche juntos. Está claro que algo sucedió entre ustedes dos".

              "Por supuesto..." dice Kate, luciendo como si hubiera tenido una revelación repentina. "¡Ahora todo tiene mucho sentido!"

              "¿Qué tiene sentido?" pregunto.
          - source: scene_text_2
            paragraph: 34
            text: |-
              "Justo el otro día, antes de tu turno de noche con ella, Leila seguía preguntándome si realmente no pasaba nada entre tú y yo, e incluso me hizo confirmarle esto varias veces", me dice Kate. "Creo que quería asegurarse de no herir mis sentimientos si ustedes dos se juntaban..."

              "Eh..." digo. "Eso fue muy considerado de su parte".

              "Ella realmente se preocupa por ti, ¿sabes?" me dice Kate. "Asegúrate de no decepcionarla".

              "Lo sé", digo. "No lo haré."

              "Regresaré enseguida", dice Melindra. "Necesito tirar de la siguiente palanca".

              Melindra luego va al otro extremo del corredor y tira de una de las palancas de la pared izquierda.
          - source: scene_3
            paragraph: 24
            text: |-
              De repente, tengo un dolor de cabeza terrible y mi conciencia cambia entre los planos etéreo y terrestre varias veces seguidas, en rápida sucesión, de manera muy similar a como sucedió cuando el éter me estaba atacando. Justo cuando pensaba que todo había terminado, vuelve a pasar lo mismo, excepto que voy y vengo entre los dos aviones más de diez veces en un segundo.

              "Barry, ¿qué pasa?" Kate me pregunta, ahora luciendo muy preocupado. "¿Alguien te lanzó un hechizo de mareo?"

              "No, no es un hechizo de mareo, es-- argh..."

              El dolor de cabeza vuelve a apoderarse de mí y paso unos buenos momentos alternando constantemente la perspectiva de mi alma y la de mi cuerpo. Creo que esta vez pude haber cambiado entre los dos aviones al menos cien veces.

              "¿Tienes alguna idea de qué está causando esto?" Kate me pregunta. "¿Se siente como un dolor de cabeza normal o es algo más?"
