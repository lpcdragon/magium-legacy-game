            paragraph: 39
            text: |-
              "Oye, esa no es una mala idea. ¡De hecho, quería preguntar sobre esto también!"

              "¿Entonces ambos queréis conseguir las piezas del rompecabezas?" Hadrik dice. "¿Qué tienen de especial estas piezas del rompecabezas?"

              "No tengo idea", digo. "¡Pero eso es lo que lo hace más interesante!"

              "¿Tú también vienes?" Flower me pregunta. "¡Eso es genial! Melindra, ¿puedes mostrarnos adónde debemos ir?"

              "¡Oye, espera un minuto!" Daren dice. "Ustedes no planean ir solos, ¿verdad?"

              "¿Por qué no?" Flower pregunta. "La lucha por Ollendor ha terminado. ¿No debería ser seguro deambular por la ciudad a estas alturas?"

              "Técnicamente, sí, pero no podemos olvidar que todavía quedan algunos guardias reales con vida", dice Daren. "¿Y si quieren vengar a su rey caído?"

              "Oh, no me preocuparía demasiado por ellos", digo. "Loyrang probablemente ya haya huido de la ciudad y ese tipo ilusionista no puede hacer nada por sí solo".

              "Sí, pero esos guardias reales también tenían aprendices", dice Daren. "Tal vez deberíamos ir todos contigo, sólo para estar seguros".

              "Se necesitarán horas para llegar a pie", dice Melindra. "Podemos llegar mucho más rápido volando".
          - source: scene_text_2
            paragraph: 31
            text: |-
              "¿No puedes... levantarnos en el aire y llevarnos contigo?" Daren pregunta.

              "Sí, pero llevaría mucho tiempo", dice Melindra. "Mira, tengo una idea mejor. ¿Qué tal si nos dividimos en dos equipos? Los que podemos volar solos haremos un viaje rápido al edificio abandonado, mientras que el resto de ustedes pueden ir de compras. Nos reuniremos aquí en el distrito comercial en una hora o dos. ¿Te parece bien?"

              "¿Todos los que pueden volar...?" Pregunta Daren, mientras pasa unos segundos pensando en la propuesta de Melindra. "Sí, puede que no sea tan mala idea. Entonces, eso me dejaría a mí, Hadrik y Leila para el equipo de compras, ¿correcto?"

              "Creo que sí", dice Melindra. "Kate, puedes volar largas distancias con tus plataformas de hielo, siempre y cuando no lleves a nadie más contigo, ¿verdad?"

              "Sí, puedo", dice Kate.

              "¡Muy bien, entonces!" Dice Melindra, mientras hace un movimiento rápido con una de sus manos, y sus corrientes de aire comienzan a moverse lentamente a mi alrededor, esperando mi orden. "Vámonos. Deberíamos poder llegar allí en veinte minutos o menos, si no me equivoco. Sólo síganme y estén atentos a cualquiera que pueda intentar atacarnos desde el suelo. ¿Están todos listos?"
