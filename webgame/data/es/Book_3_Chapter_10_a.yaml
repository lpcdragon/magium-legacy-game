            paragraph: 19
            text: |-
              "Entonces, ¿qué planeas hacer con las torres de seredium ahora que tienes el control total de la ciudad?" Kate pregunta.

              "Todo saldrá según lo planeado", dice el supervisor. "Lo primero que haré será aliviar el dolor de los magos encarcelados tanto como sea posible, y luego comenzaré a trabajar en una manera de modificar las torres para que puedan operar con la energía proporcionada por los magos voluntariamente. Una vez hecho esto, buscaremos magos que estén dispuestos a transferir su energía a las torres diariamente, a cambio de una generosa tarifa mensual, y luego liberaremos gradualmente a los prisioneros hasta que no quede ninguno de ellos dentro de las torres".
          - source: scene_text_2
            paragraph: 16
            text: |-
              "¿Y cuándo exactamente estima que se podría hacer todo esto?" Kate pregunta.

              "En las condiciones ideales, esto no debería llevar más de dos semanas", afirma el supervisor. "Sin embargo, las condiciones ideales casi nunca están garantizadas, por lo que lo más probable es que los preparativos estén completos entre tres semanas y un mes".

              "Ya veo", dice Kate.
