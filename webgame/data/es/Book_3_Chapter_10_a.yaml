              "No importa", escribe Leila con una sonrisa. "¡Pero sea lo que sea, planeo disfrutar cada momento!"

              Luego toma mi mano y la sostiene suavemente, mientras comenzamos a recordar nuestros primeros días juntos en Thilias, y pronto nos olvidamos por completo del estrés que teníamos antes, continuando hablando con naturalidad sobre todo y cualquier cosa que nos viniera a la mente, como siempre lo hacíamos.

              El resto de las horas se nos pasaron muy rápido, pero nos aseguramos mucho durante este tiempo de que no se desperdiciara ni un solo momento. No importa lo que suceda en el futuro, siempre podremos recordar este día y recordarlo con una sonrisa en el rostro. De eso estoy seguro.

