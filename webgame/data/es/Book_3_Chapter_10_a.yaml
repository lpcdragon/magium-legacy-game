              "Nada", dice Daren. "Nuestro papel en esta historia ha terminado. Hemos elegido nuestro lado, así que ahora vamos a tener que esperar y ver si el Supervisor realmente cumple sus promesas".

              "¿No estás al menos un poco enojado después de todo lo que nos dijo allí?" Hadrik pregunta Daren.

              "No elegí ayudar al Supervisor porque me gustara su personalidad", dice Daren. "Elegí ayudarlo porque pensé que sería un buen líder, y sigo pensando que ese es el caso. Claro, podría haber actuado un poco altivo y poderoso con nosotros en la sala del trono, pero no ha roto ninguna de sus promesas todavía, y todavía parece que tiene la intención de hacer todo lo que esté en su poder para honrar nuestro acuerdo. Eso por sí solo es suficiente para darle el beneficio de la duda".

              "Sí, supongo que tienes razón", dice Hadrik. "Dijo que, después de todo, encontraría una manera de liberar a los prisioneros de las torres. Supongo que entonces tendremos que esperar y ver qué hace en las próximas semanas".
