chapter_effects:
  - condition: b3_ch3_stats_unavailable = 1
    effects:
      - disable stats
  - condition: b3_ch3_stats_unavailable = 0
    effects:
      - enable stats
scenes:
  - name: b3_ch10a_intro
    effects:
      - set:
          is_dead: 0
          b3_ch10_majesty: 0
          b3_ch10_wrong: 0
          b3_ch10_puzzle: 0
          b3_ch10_benefits: 0
          b3_ch10_check: 0
          b3_ch10_biscuit: 0
          b3_ch10_inappropriate: 0
          b3_ch10_reason: 0
      - set:
          successful_checks:
            - 'Punto de control alcanzado: Partida guardada.'
        condition: checkpoint_rich = 1
    routes:
      - condition: b3_ch8_overseer2 = 1
        texts:
          - source: scene_text
            paragraph: 2
            text: |-
              "¿Hola?" Daren dice, mientras él y el resto de nosotros estamos actualmente parados en el pasillo principal del palacio Ollendor, esperando que suceda algo. "Supervisor, ¿está allí?... Vinimos aquí como usted nos pidió. ¡Nos gustaría discutir nuestros planes futuros con usted ahora, si no le importa!"

              Aparte del eco de la voz de Daren, no obtenemos ninguna respuesta. No había guardias en la entrada del castillo a los que pudiéramos pedir detalles antes de entrar, ni tampoco drones de ojos rojos esperándonos. Cuando abrimos la puerta del palacio, vimos que el interior del edificio también estaba vacío. No faltaban las joyas y adornos, como el castillo de Thilias, pero no había centinelas de ningún tipo y no se oía ningún sonido proveniente de las otras habitaciones.

              Si la arquitectura de este edificio es de alguna manera similar al palacio Thilias, entonces la puerta frente a nosotros normalmente debería conducirnos a otro pasillo que está directamente conectado a la sala del trono. El Supervisor nos llamó al palacio, pero nunca especificó en cuál de las habitaciones debíamos encontrarnos con él. ¿Está esperando que entremos a la sala del trono antes de revelarse?

              "Ustedes no supondrán que esto es algún tipo de trampa, ¿verdad?" Hadrik nos pregunta.
          - source: scene_text_2
            paragraph: 2
            text: |-
              "Lo dudo mucho", dice Illuna, con llamas azules en sus ojos, mientras Melindra todavía la mueve con las corrientes de aire. "Toda la ciudad está bajo el control del Supervisor, no sólo el palacio. Si realmente quisiera tendernos una emboscada, entonces podría haberlo hecho con la misma facilidad en cualquier otro lugar".

              "Oye, Melindra, ¿podrías acercarme un poco más a esa pared de allí?" Flower dice, mientras las llamas en sus ojos ahora se vuelven rojas. "Creo que pude haber visto un ladrillo suelto. ¡Quizás haya un tesoro escondido en este castillo!"

              "No puedes hacer nada hasta que te deshagas de estas llamas", le dice Illuna a Flower. "Prometiste que te encargarías de ello, ¡así que hazlo!"

              "¡Pero estoy tan cansado de liderar a todos esos rebeldes en el Plano Etéreo a sus santuarios!" Flower dice. "¿No podría tomarme un pequeño descanso?"

              "Tendrás tu descanso una vez que termines lo que se supone que debes hacer", dice Illuna. "Ahora vuelve al trabajo".

              "Bien..." dice Flower. "Veré qué puedo hacer".
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch10a_intro_overseer
                  checkpoint_rich: 0
      - condition: b3_ch8_overseer2 = 0
        texts:
          - source: scene_text
            paragraph: 3
            text: |-
              "Oye, la votación casi ha terminado", nos dice Daren. "¡Presta atención! Si el rey del subsuelo va a intentar algo turbio, ahora sería el mejor momento".

              "No sé qué decir", le digo. "Va a ser un poco difícil detectar algo fuera de lo común entre esta enorme multitud de gente".

              "La forma más sencilla de falsificar los resultados de estas elecciones sería reemplazar los documentos que recogen de todos con documentos falsificados de su propia creación", dice Daren. "No es necesario mirar a todos a la vez. Sólo hay que vigilar de cerca a los muchachos que están reuniendo las papeletas de votación, porque son los que tienen más probabilidades de hacer el cambio, si eso es realmente lo que están planeando".
          - source: scene_text_2
            paragraph: 3
            text: |-
              "Correcto", digo. "Yo haré eso".

              Ha pasado más de una hora desde que nos teletransportamos de regreso a la base subterránea de los rebeldes después de derrotar al Supervisor. Durante este tiempo, Flower y Peter han estado muy ocupados guiando las almas de todos los rebeldes de regreso a sus santuarios en el Plano Etéreo, y una vez que el último de ellos despertó, el rey del subsuelo convocó a una reunión urgente, para que todos los habitantes clandestinos pudieran elegir democráticamente quién sería su propuesta para el nuevo rey de Ollendor, ahora que el antiguo rey estaba muerto.
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch10a_intro_king
                  checkpoint_rich: 0
  - name: b3_ch10a_intro_overseer
    texts:
      - source: scene_text
        paragraph: 4
        text: |-
          "¿No crees que estás siendo un poco duro con ella?" Kate pregunta Illuna, una vez que el color de sus ojos vuelve a ser azul.

          "Estoy haciendo esto por su propio bien", dice Illuna. "Cuanto más tiempo pasa en este estado evolucionado suyo, más riesgoso se vuelve. Si no aprende a transformarse de nuevo a la normalidad a voluntad, fácilmente podría agotarse. Este no es un asunto que podamos dejar en suspenso hasta más tarde. Es muy serio".

          "Lo entiendo, pero... ¿no hay alguna forma en que puedas ayudarla?" Kate dice.

          "Desafortunadamente, no", dice Illuna. "No tengo mucho conocimiento sobre los etéreos, y Arraka tampoco ha sido de mucha ayuda. En este momento, Flower es el único que puede descubrir qué le pasó y cómo deshacer la transformación".

          "Entonces, solo estoy dando ideas aquí", dice Hadrik, "¿pero no crees que tendrías más posibilidades de obtener ayuda de Arraka si abrieras su relicario?"
      - source: scene_text_2
        paragraph: 4
        text: |-
          "Eso sí que es una posibilidad", dice Illuna, mientras mira el amuleto que cuelga de su cuello, desde el cual podemos escuchar el sonido continuo y ahogado de Arraka tratando de gritarnos. "Permítanos probar su hipótesis".

          Luego abre brevemente el relicario del amuleto para que podamos escuchar lo que Arraka tiene que decir.

          "...y cuando termine con sus familias, ¡los mataré de la manera más lenta y dolorosa que puedan imaginar!" escuchamos a Arraka gritar. "Tus ojos se derretirán de tu cara, mientras que tus cabezas sentirán como si estuvieran explotando mil veces por segundo..."

          "Parece que tu hipótesis era ligeramente incorrecta", dice Illuna, después de cerrar el relicario. "De hecho, Arraka no resultó más útil cuando abrí el amuleto. Tal vez un poco de giro podría hacerla un poco más cooperativa. ¿Alguien querría intentarlo?"
    choices:
      - position: 1
        text: Acepta hacer girar el amuleto de Arraka.
        effects:
          - set:
              current_scene: b3_ch10a_overseer_spin
              b3_ch10_spin: 1
      - position: 2
        text: No hagas girar el amuleto de Arraka.
        effects:
          - set:
              current_scene: b3_ch10a_overseer_spin
              b3_ch10_spin: 0
  - name: b3_ch10a_overseer_spin
    routes:
      - condition: b3_ch10_spin = 0
        texts:
          - source: scene_text
            paragraph: 6
            text: |-
              Después de escuchar la pregunta de Illuna, todos intercambiamos algunas miradas, pero al final nadie decide aceptar su oferta.

              "¿En serio?..." dice Illuna. "¿Nadie? ¿Ni siquiera Hadrik?"

              "Bueno", dice Hadrik, "Arraka me hizo un favor al mantener en secreto los detalles de mi prueba del ritual del Dios del Tiempo, por lo que girarla ahora me dejaría un poco de mal sabor de boca".

              "Sí, y últimamente también ha sido muy cooperativa", dice Daren. "Sé que es porque ahora compartimos el objetivo común de luchar contra un dios, pero aún así, con la forma en que Arraka ha estado actuando últimamente y con todo el esfuerzo que ha puesto en entrenarnos a cada uno de nosotros, casi estoy empezando a sentir que está legítimamente en camino de convertirse en una parte invaluable del equipo".
          - source: scene_text_2
            paragraph: 6
            text: |-
              "¡¿Parte del equipo ?!" Illuna dice, incrédulo, mientras Arraka parece haberse callado finalmente, después de escuchar las palabras de Daren. "¡No puedes hablar en serio!"

              Luego hace una pausa de unos segundos para mirarnos bien a cada uno de nosotros.

              "¡Por favor díganme que el resto de ustedes tampoco está de acuerdo con él!" Illuna dice.

              "Quiero decir, para ser justos, esta vez no vimos que Arraka hiciera nada malo", dice Hadrik. "Todos estábamos todavía en el Plano Etéreo cuando decidiste cerrar su amuleto porque te estaba molestando. A menos que haya algo que me esté perdiendo, ninguno de nosotros debería tener una razón real para girar--"

              "Ya no me refiero al giro", dice Illuna. "¡Estoy hablando de que ella sea parte del equipo! ¿Alguno de ustedes realmente piensa eso? ¿De verdad cree que ella alguna vez podría estar de su lado?"

              "Illuna..." Kate dice. "En este momento, nos guste o no, ESTAMOS en el mismo lado. Al menos hasta que se resuelva todo este conflicto con el Dios del Tiempo. Pensé que todos ya habíamos acordado que aceptaríamos su ayuda".
          - source: scene_3
            paragraph: 2
            text: |-
              "Aceptar su ayuda y tratarla como si fuera una verdadera aliada son dos cosas completamente diferentes", dice Illuna. "Cuando acepté que ella nos entrenara, fue bajo el supuesto de que todos sabríamos con quién estábamos tratando. Independientemente de lo útil que sea Arraka, NO se puede confiar en ella. Por favor, dígame que comprende esto".

              "Mira", dice Daren, "nadie está diciendo que de repente deberíamos hacernos amigos de ella, tomarnos de la mano y cantar canciones felices juntos. Solo decimos que en los últimos días ella ha cambiado un poco para mejor, eso es todo".

              "No, ella NO ha cambiado", dice Illuna, en voz más alta, ya que finalmente está perdiendo la calma. "¡Ella nunca cambiará! Siempre será la misma asesina en masa despiadada, sádica y manipuladora que ha sido desde mucho antes de llegar al plano terrestre. No puedes darte el lujo de tratarla como a una aliada. No puedes darte el lujo de considerar esa posibilidad. ¡No cometas el mismo error que yo! ¡Te garantizo que te arrepentirás mientras vivas!"
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch10a_trumpets
      - condition: b3_ch10_spin = 1
        texts:
          - source: scene_text
            paragraph: 5
            text: |-
              "Claro", digo. "¡Dámela!"

              Después de que Illuna se quita el amuleto y me lo entrega, empiezo a girarlo por la cadena, aumentando la velocidad con cada rotación. A medida que la velocidad se intensifica, también lo hace el sonido de los gritos furiosos de Arraka, que aún están siendo reprimidos por el relicario cerrado.

              "Barry..." Kate dice. "Creo que es suficiente."

              "¿Es?" Pregunto sorprendida, mientras lentamente dejo de girar el amuleto. "Eso es extraño. Nunca tuve la impresión de que te importara mucho Arraka. ¿Cómo es que estás defendiéndola?"

              "No voy a defenderla", dice Kate. "Sólo digo que puede que no sea prudente enfadar aún más a la persona que actualmente nos está ayudando".

              "¿Ayudándonos?" pregunto. "¿Te refieres al entrenamiento para luchar contra el Dios del Tiempo? Oye, eso es tanto de su interés como el nuestro. Ella ya admitió que está personalmente involucrada en este plan de usarnos para vengarse de los dioses. No va a darse por vencida solo por un pequeño giro".

              "Barry es correcto", dice Illuna. "Si te preocupa que Arraka de repente deje de entrenarte sólo por una pequeña disputa, entonces te puedo asegurar que ese no es el caso. Puede que se queje un poco al principio, pero al final seguirá cooperando contigo como antes. Este plan es demasiado importante para que ella permita que falle por razones tan infantiles".
          - source: scene_text_2
            paragraph: 5
            text: |-
              "Sí, pero no se trata sólo de la formación", dice Daren. "Su comportamiento general también ha cambiado mucho. Últimamente ha estado haciendo muchas menos bromas a nuestra costa, e incluso me ayudó a lidiar con la plaga de la base subterránea. Francamente, con la forma en que ha estado contribuyendo a nuestros esfuerzos en los últimos días, me atrevería a decir que legítimamente puede estar en camino de convertirse en una parte invaluable del equipo".

              "¡¿Parte del equipo ?!" Illuna dice, incrédulo, mientras Arraka parece haberse callado finalmente, después de escuchar las palabras de Daren. "¡No puedes hablar en serio!"

