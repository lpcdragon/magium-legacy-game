  - name: b3_ch10a_headache
    texts:
      - source: scene_text
        paragraph: 48
        text: |-
          "Es sólo un dolor de cabeza normal", digo. "No hay nada de qué preocuparse".

          "Bueno, ¿necesitas acostarte?" Kate dice. "¿Crees que eso podría ayudar?"

          "No lo sé, yo-- UGH--"

          "¿Lo que está sucediendo?" Melindra pregunta.

          "Le duele la cabeza", le dice Kate.

          "Oh, ¿es eso lo que pasó allí cuando estábamos volando?" Melindra dice. "¿Le dolió la cabeza y perdió el control de las corrientes de aire?"
      - source: scene_text_2
        paragraph: 40
        text: |-
          "Barry, ¿tuviste el mismo dolor de cabeza antes?" Kate dice. "Barry, ¿puedes oírme?"

          Mientras Kate y Melindra hablan, me resulta cada vez más difícil concentrarme en lo que dicen. No solo eso, sino que siento que todo se vuelve más oscuro, tanto en el plano terrestre como en el Plano Etéreo. Mientras las luces se apagan ante mis ojos, una repentina sensación de debilidad se apodera de mí, y pronto ya no tengo fuerzas ni para abrir la boca. Unos segundos más tarde, lo único que puedo ver ante mí es pura oscuridad, y luego pierdo la conciencia para siempre.
