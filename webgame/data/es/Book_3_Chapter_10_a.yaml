  - name: b3_ch10a_intro_king
    routes:
      - condition: b3_ch8_king = 0
        texts:
          - source: scene_text
            paragraph: 22
            text: |-
              Había cuatro candidatos en total: los rey del subsuelo, dos rebeldes cuyos nombres nunca escuché mencionar hasta ahora, y Albert.

              Cada uno de los candidatos subió a un podio improvisado y pronunció breves discursos antes de que comenzara la votación, aunque los dos rebeldes anónimos parecieron haber causado muy poco impacto entre la multitud, porque al final apenas hubo nadie animándolos. Algo me dice que ninguno de los dos ofrecerá mucha competencia al rey del subsuelo en este concurso.

              En este momento, nuestro grupo está parado en algún lugar al fondo de la gran sala, para que podamos discutir las cosas libremente sin molestar a las otras personas que vinieron aquí para presenciar las elecciones.

              "¿Crees que Albert tiene alguna posibilidad de ganar de manera justa?" Hadrik dice. "La mayoría de la gente probablemente ya lo vería como una extensión del rey del subsuelo, ¿no? ¿Por qué votarían por el lacayo en lugar del propio jefe?"

              "Albert solía ser uno de los principales líderes rebeldes antes de comenzar a servir a rey del subsuelo, y no creo que la mayoría de los rebeldes lo olvidaran", dice Daren. "Estoy seguro de que muchos de ellos disfrutarían de la oportunidad de volver a colocar a su antiguo líder en una posición de poder".

              "Hmm... eso podría ser cierto", dice Hadrik. "Supongo que lo descubriremos muy pronto".
          - source: scene_text_2
            paragraph: 18
            text: |-
              Poco después de nuestra discusión, los hombres encargados de recoger los votos pasan junto a nosotros y recogen nuestras papeletas de voto. Todos prestamos mucha atención a lo que estaban haciendo, pero a pesar de que la multitud oscureció nuestra vista un par de veces, no parecía que tuvieran la oportunidad de cambiar una cantidad tan grande de votos sin que nos diéramos cuenta. Una vez reunidos los votos, los hombres colocaron los papeles en el podio y luego comenzaron a contarlos, mientras varios observadores supuestamente neutrales los revisaban, para asegurarse de que estaban haciendo el conteo correctamente.

              "¿Crees que podrían simplemente fingir el conteo?" Hadrik dice. "No tengo idea de quiénes se supone que son esos observadores. ¿Se puede confiar en ellos?"
          - source: scene_3
            paragraph: 12
            text: |-
              "Pregunté por ahí", dice Daren, "y aparentemente son todas personas con fuertes razones para no gustarles el rey del subsuelo, que han estado insistiendo en que se les debería permitir supervisar el proceso de votación desde ayer. Normalmente, debería ser casi imposible que los contadores de votos hagan trampa mientras tienen a esos tipos mirando por encima de sus hombros constantemente".

              "Entonces, ¿esto es todo?" Hadrik dice. "¿Podemos dejar de observar cada uno de sus movimientos?"

              "Supongo que sí", dice Daren.

              "Bien", dice Hadrik, luciendo ligeramente aliviado. "¡Se estaba poniendo un poco estresante!"
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch10a_podium
