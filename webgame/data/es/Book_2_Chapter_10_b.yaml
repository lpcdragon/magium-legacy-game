  - name: b2_ch10b_fascinated
    texts:
      - source: scene_text
        paragraph: 14
        text: |-
          En cuanto salen del tornado, el sabio y sus secuaces empiezan a caer mientras tosen y dan grandes bocanadas de aire. Talmak logra conjurar de la nada una plataforma flotante de piedra y todos aterrizan sobre ella mientras siguen intentando recuperar el aliento.

          "Volvamos al suelo y reunámonos con los demás", digo. "Ya pelearemos cuando estemos todos juntos."

          Empiezo a volar hacia el suelo junto con Flower, pero Melindra sigue simplemente flotando allí y parece que le ha dado otro dolor de cabeza repentino. El sabio se da cuenta enseguida y usa sus poderes para crear mágicamente una gran roca que le lanza a toda velocidad. Melindra no tiene tiempo de bloquearla del todo con su magia de aire, y la roca le golpea con fuerza en la cabeza, haciéndole perder el conocimiento.

          "¡Melindra!", grita Flower mientras se apresura a impedir que caiga.

          Justo cuando el sabio intenta golpear también a Flower, Illuna lanza rápidamente su hechizo de jaula dorada alrededor de sí misma y de Melindra, lo que hace que las rocas de Talmak se rompan en pedazos al impactar contra los barrotes dorados de la jaula.

          "La jaula del zorro...", dice Talmak mientras observa a Illuna empezar a curar a Melindra dentro de la jaula flotante.
      - source: scene_text_2
        paragraph: 10
        text: |-
          "Entonces conoces al zorro dorado, ¿no?", le pregunto.

          "He tenido más de un encontronazo con ella desde que llegué a Varathia, sí", dice el sabio. "Pero, lo que es más importante, la situación ha cambiado. Vuelve a bajar, muchacho, y tendremos otra conversación."

          Entonces baja su plataforma al suelo junto con todo su equipo, mientras yo también desciendo y aterrizo junto a Daren y los demás. Cuando mis pies tocan el suelo, no puedo evitar notar que las corrientes de aire a mi alrededor se han calmado, igual que cuando Melindra me lanzó el hechizo antes. Parece que las corrientes están hechas de forma que se desactivan temporalmente cada vez que aterrizo, y que, si quiero volver a volar, tengo que reactivarlas levantando los brazos por encima de la cabeza.

          "¡He cambiado de idea!", dice Talmak de repente, justo cuando todos se preparaban para la batalla. "Ya no hace falta que peleemos."

          "¿Y a qué debemos este repentino cambio de corazón?", dice Daren.
      - source: scene_3
        paragraph: 8
        text: '"Se lo deben a la chica stillwater que está ahí arriba, en el cielo", dice Talmak. "Verán, siempre me han fascinado las leyendas stillwater, pero nunca he tenido realmente la oportunidad de ver una de cerca. Siempre he querido estudiarlas y averiguar cuál era la fuente de su poder, pero la idea de que alguna vez tendría la oportunidad de capturar una viva me parecía tan improbable que ni siquiera me atrevía a soñar con que pudiera ocurrir. Y, sin embargo, aquí estoy, a solo unas decenas de pies de una stillwater inconsciente, con la única cosa que se interpone en mi camino siendo esa condenada jaula impenetrable."'
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch10b_insane
  - name: b2_ch10b_insane
    texts:
      - source: scene_text
        paragraph: 15
        text: |-
          "¿Qué es exactamente lo que estás intentando decir?", dice Daren.

          "Estoy diciendo que estoy dispuesto a ofrecerles una salida segura de nuestro campamento si me entregan a la stillwater", dice Talmak. "Lo único que tienen que hacer es convencer a su amiga banshee de que disipe la jaula y deje de curarla, y olvidaremos que este encuentro ocurrió alguna vez. Nolderan, ¿seguimos teniendo esos collares que encontramos en las ruinas y que podían restringir la capacidad de alguien para lanzar hechizos?"

          "Sí, todavía los tenemos", dice Nolderan.

          "Perfecto", dice Talmak. "Entonces podremos encadenarla y empezar los experimentos de inmediato. La parte complicada será mantenerla con vida mientras la diseccionamos, pero conozco más de una manera de sortear eso..."

          De repente, Kate dispara varios carámbanos directamente contra el sabio, mientras una pared de roca surge del suelo para defenderlo. Cuando la pared se derrumba y los carámbanos que quedaron incrustados en ella caen al suelo, Talmak se queda mirando a Kate con una expresión de absoluto shock.

          "¿Te has vuelto completamente loca?", dice Talmak. "¿Renunciarías a tu única oportunidad de sobrevivir solo por culpa de una..."
      - source: scene_text_2
        paragraph: 11
        text: |-
          "Cállate, escoria", dice Kate, mirándolo con una expresión de puro asco.

          "Quizá no me he explicado con suficiente claridad...", empieza a decir Talmak, adoptando su tono autoritario de siempre.

          "Sí, no, creo que ya hemos oído bastante", dice Hadrik, y se lanza de inmediato hacia el sabio a una velocidad asombrosa.

          El sabio apenas tiene tiempo de reaccionar, y conjura otra pared de roca delante de sí, que Hadrik rompe de un puñetazo.

          "¡¡¡Basta!!!", grita Talmak furioso de repente, haciendo brotar varias púas enormes de roca desde debajo de la tierra y obligando a Hadrik a retroceder de un salto. "Si todos ustedes están tan ansiosos por marchar hacia la muerte, entonces estaré encantado de concederles sus deseos. Voy a matarlos yo mismo a todos, y me reservaré a la stillwater para el final."

          "No, no lo harás", dice Hadrik con una sonrisa mientras se lanza otra vez a velocidad de rayo hacia el sabio y lo ataca con una ráfaga de golpes, mientras Talmak forcejea por crear suficientes muros como para seguirle el ritmo.

          Mientras Hadrik y el sabio empiezan su duelo, los cinco secuaces se preparan ahora para atacarnos al resto.
    choices:
      - position: 1
        text: Concentrar mis ataques en los secuaces.
        effects:
