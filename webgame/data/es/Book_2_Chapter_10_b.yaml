              Leila asiente y entonces ambos salimos de la cúpula, mientras Kate cierra la abertura detrás de nosotros. En cuanto estamos fuera, Leila empieza a correr hacia nuestros enemigos, mientras yo también empiezo a volar hacia los enanos. Cuando nos ven salir de la cúpula, los dos enanos cambian rápidamente de objetivo y empiezan a apuntarnos a Leila y a mí. El enano del parche parece ser el que se centra en mí, mientras el que tiene cicatrices está lanzando bolas de fuego hacia Leila.

              Esquivo con facilidad en el aire los ataques de llamas que me lanza el enano y me preparo para lanzarme en picado sobre él, pero justo cuando me acerco aparece delante de mí una gran barrera plana y semitransparente que me bloquea el paso. Cuando intento rodearla, la barrera se mueve conmigo y no me deja pasar. No puedo seguir así mucho tiempo, porque una nueva andanada de llamas me obliga a volver a alejarme de los magos.
          - source: scene_text_2
            paragraph: 27
            text: |-
              Mientras tanto, Leila parece tener sus propios problemas con las barreras, aunque las que se encuentra son completamente invisibles y solo pueden detectarse si te concentras de verdad en ellas con el sentido mágico. Intento lanzarme en picado otra vez contra los enanos, pero una de las barreras del elfo vuelve a bloquearme el paso. Justo cuando estaba intentando rodearla, Kate dispara decenas de carámbanos contra el elfo desde todas las direcciones, obligándolo a disipar todas las barreras y a crear una nueva a su alrededor.

              Eso nos permite a Leila y a mí alcanzar por fin a los enanos, pero también les permite dispararnos rayos de fuego a quemarropa.

              Leila esquiva el ataque instintivamente gracias a su estadística de reflejos, y yo hago lo mismo. Antes de que los enanos tengan tiempo de lanzar más hechizos, Leila y yo les cortamos rápidamente el cuello con nuestras hojas, atravesando sus protecciones mágicas contra el daño físico y matándolos en el acto.

              "Pues vaya escuadrón de élite el del gran sabio, ¿eh?", le digo al elfo mientras aterrizo en el suelo y empiezo a acercarme a él.

              "No eran más que peones fácilmente reemplazables", dice el elfo con una sonrisa forzada. "Los miembros más veteranos del equipo están ahora mismo fuera, en una misión importante relacionada con las piñas. Es una lástima que nunca lleguen a conocerlos, porque el sabio los aniquilará a todos mucho antes de eso."
          - source: scene_3
            paragraph: 15
            text: |-
              "¿El sabio?", le pregunto. "¿Tú no?"

              "Yo solo me encargo de la defensa", dice el elfo. "No tengo hechizos que puedan ayudarme a luchar contra ustedes de ninguna manera. Voy a limitarme a mantener esta barrera en pie hasta que se cansen o se aburran. A este ritmo, no podrán romperla en bastante tiempo."

              "Claro...", digo, mientras empiezo a atacarlo junto con Leila.

              Mientras lidiamos con el elfo, no puedo evitar notar que el cielo sobre nosotros está ahora mismo lleno de grandes rocas flotantes que Talmak usa para perseguir a Hadrik, en su forma de águila. Parece que Hadrik está en cierta desventaja cuando lucha en batallas aéreas debido a que las criaturas voladoras en las que puede transformarse son demasiado débiles comparadas con su forma normal de enano, y necesita volver a convertirse en enano cada vez que quiere hacer añicos una de las rocas.

              En algún punto más abajo, a una altitud bastante menor, Illuna y Flower siguen ocupadas luchando contra la banshee de pelo negro en pleno vuelo, aunque parecen estar muy igualadas y ninguna de ellas ha conseguido hacer un daño significativo a la otra todavía. Puede que Flower e Illuna tengan ventaja en cuanto a poder bruto, porque son dos, pero la banshee que trabaja para el sabio está aprovechando bien la multitud de hechizos de que dispone para compensar esa desventaja.
