  - name: b2_ch10b_shocked
    routes:
      - condition: b2_ch10_target = 0
        texts:
          - source: scene_text
            paragraph: 46
            text: |-
              El elfo crea de inmediato una barrera mágica flotante debajo de sus pies y otra para Nolderan, mientras Kate crea varias plataformas de hielo flotantes justo debajo de nosotros para salvarnos de la caída. Justo antes de que alcancemos las plataformas, Kate, Leila, Daren, Hadrik y yo nos encontramos de repente flotando en el aire, mientras empezamos a ascender lentamente fuera del abismo.

              Cuando miramos hacia arriba, vemos a Melindra flotando unas cuantas decenas de pies por encima de nosotros, con esa expresión seria en los ojos otra vez, mientras hace lentos movimientos con las manos para ayudar a dirigir las corrientes de aire que nos mantienen suspendidos.

              "¡Melindra!", dice Flower, a la que la banshee de pelo negro sigue persiguiendo en pleno vuelo. "¡No deberías estar lanzando hechizos tan poderosos tan poco después de que te curaran!"

              "Estoy bien", dice Melindra mientras nos saca de la fosa. "No se preocupen por mí. Deberían preocuparse más bien por lo que está haciendo el sabio ahí arriba."

              Cuando todos miramos para ver qué está pasando, nos quedamos de piedra al descubrir que todas las rocas que estaban siendo arrancadas del suelo se están reuniendo ahora para formar un gólem de cincuenta pies de altura hecho de piedra, con el sabio de pie dentro de su cabeza sobre la misma plataforma flotante de antes.

              "¿Por qué no intentas absorber este gólem con tu espada, Daren?", grita Talmak desde arriba. "¡Quizá consigas arañarle la planta del pie antes de que te aplaste!"
          - source: scene_text_2
            paragraph: 32
            text: |-
              Entonces usa sus poderes de tierra para acercar entre sí los muros de roca a los lados del abismo y crear un camino por el que pueda caminar su gigante de piedra. La tierra vuelve a temblar violentamente mientras la fosa bajo nosotros se estrecha segundo a segundo, hasta que los muros que formaban la grieta acaban uniéndose, sin dejar nada salvo una pequeña abertura en la tierra entre ellos.

              Mientras tanto, Melindra nos hace flotar hasta una distancia relativamente segura del gólem y luego nos deposita en el suelo.

              "Sanador, quizá deberías poner una barrera alrededor de todos", dice Melindra. "Y hacerla más fuerte que cualquier barrera que hayas lanzado jamás. No tengo demasiado control sobre los hechizos que estoy a punto de usar a partir de ahora."

              "Oh...", dice Daren. "De acuerdo. Me pongo con ello."

              Entonces usa su escudo para crear una barrera mágica semitransparente alrededor de todos nosotros, mientras Melindra empieza a elevarse más alto por el aire.

              "Flower, tienes que llevar tu pelea a otro sitio", dice Melindra. "Aléjate lo máximo posible de aquí. No pienso contenerme."
          - source: scene_3
            paragraph: 20
            text: |-
              "¡Vale!", dice Flower. "¡Sígueme, banshee! ¡Por aquí!"

              Entonces se impulsa con sus chorros de fuego en la dirección opuesta al gólem, mientras la banshee de pelo negro se apresura a seguirla. Cuando Flower está ya fuera de peligro, Melindra lanza un hechizo y de pronto podemos ver cientos de cuchillas afiladas hechas de viento girando a su alrededor a gran velocidad. Es probable que las cuchillas de viento estén afiladas del mismo modo en que Illuna o Kate afilan sus propios elementos, y son casi transparentes, salvo cuando la luz del sol se refleja en ellas.

              Mientras Melindra sigue ascendiendo, el gigante de piedra empieza a avanzar lentamente, y los secuaces del sabio se apresuran ahora a apartarse del camino del gólem para no acabar pisoteados.

              De pronto, Melindra pierde el control de una de sus cuchillas de viento, que sale disparada a una velocidad increíble contra el suelo delante de nosotros, atravesándolo como si fuera de papel.

              "Maldición...", dice Daren, mirando el agujero en el suelo que dejó la cuchilla de antes. "De verdad espero que mi barrera sea lo bastante fuerte como para protegernos de una de esas si llega a golpearnos..."
