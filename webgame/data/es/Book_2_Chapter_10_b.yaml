  - name: b2_ch10b_secret
    texts:
      - source: scene_text
        paragraph: 52
        text: |-
          No mucho después de terminar de hablar, oigo de repente la voz de Rose a través del transceptor. En cuanto la oigo, recuerdo de inmediato la última vez que el revenant se puso en contacto conmigo y cómo me pidió que dejara el canal del transceptor abierto para poder volver a llamarme.

          "Barry, ¿me oyes?", dice el revenant.

          "Te oigo", le digo simplemente después de darle un golpecito al transceptor.

          "Escúchame", dice el revenant. "Necesitas sacar tu dispositivo de estadísticas e introducir el código secreto que aumenta tu estadística de audición. ¿Entiendes?"

          "¿Qué?...", digo.

          "¡No hay tiempo para explicaciones!", dice el revenant. "¡Hazlo y rápido!"

          Entonces vuelve a cerrar el canal y ya no hay forma de volver a contactarla.
    choices:
