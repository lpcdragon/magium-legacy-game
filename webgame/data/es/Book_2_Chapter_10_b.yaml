  - name: b2_ch10b_dwarf
    routes:
      - condition: toughness < 4 AND b2_ch5_scimitar = 0
        texts:
          - source: scene_text
            paragraph: 16
            text: |-
              Intentar atacar a Talmak con mi ballesta sería inútil, porque ya sé con certeza que la protección mágica contra el daño físico que está usando es lo bastante poderosa como para hacer que los virotes de ballesta reboten sin hacerle nada. Tendré que atacarlo a corta distancia si quiero tener alguna posibilidad.

              Mientras los guardaespaldas de Talmak abandonan el lado de su patrón para enfrentarse en batalla a mis amigos, le indico a mis corrientes de aire que vuelvan a despegarme del suelo y luego salgo volando tan rápido como puedo directamente hacia el sabio, con la daga lista.

              Talmak me ve venir y levanta del suelo un muro de roca para frenarme en seco. Intento atravesar la roca con mi arma, pero la hoja no es lo bastante afilada y se queda atascada en la piedra. Al sacar la daga, me doy cuenta de que la roca que forma el muro ha sido endurecida mediante magia, de manera parecida a como Kate suele reforzar sus carámbanos antes de dispararlos contra sus enemigos.

              Si tuviera al máximo tanto la fuerza como la resistencia, quizá podría destrozar este muro con el puño, como Hadrik, pero con mis niveles actuales no quiero arriesgarme a romperme el brazo. Supongo que me va a tocar seguir volando alrededor de estos obstáculos de roca hasta encontrar una abertura.
          - source: scene_text_2
            paragraph: 12
            text: |-
              "¡Ja!", dice Hadrik. "¡Esperaba que vinieras por aquí, Barry! ¡A ver si puedes seguirme el ritmo!"

              Entonces empieza a atacar al sabio todavía más rápido, mientras yo intento hacer un asalto aéreo desde arriba. Talmak desata de repente una explosión de aire que nos empuja tanto a Hadrik como a mí lejos de él, y luego empieza a elevarse muy alto en el cielo con ayuda de la plataforma de piedra bajo sus pies.

              "Así que también puede lanzar magia de aire hasta cierto punto...", dice Hadrik después de que nos recuperemos de la ráfaga de aire de antes. "Maldito bastardo. ¡Vamos, Barry, alcancémoslo!"

              Empiezo a volar hacia arriba mientras Hadrik se transforma en una águila gigante y también alza el vuelo. Justo cuando estoy a punto de alcanzar a Talmak, dos plataformas gigantes hechas de roca se materializan de la nada por encima y por debajo de mí, e inmediatamente intentan aplastarme entre ambas.

              Me encuentro incapaz de hacer nada mientras las grandes losas de piedra me aplastan rápidamente y hacen que pierda el conocimiento para siempre.
