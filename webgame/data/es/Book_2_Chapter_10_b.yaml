          - source: scene_text_2
            paragraph: 16
            text: |-
              Cuando miro detrás de mí, me alegra ver que los peñascos que llevan los últimos treinta segundos persiguiéndome siguen pegados a mis talones. Mantengo un rumbo constante hasta estar casi a la altura de la plataforma y, en el último segundo antes de chocar contra ella, cambio rápidamente de dirección y me impulso fuera de la trayectoria, mientras el sabio sigue completamente ajeno a lo que ocurre justo encima de él. Tal como había previsto, los peñascos que me seguían no pudieron cambiar de dirección con la suficiente rapidez, así que todos se estrellaron de lleno contra la plataforma voladora de Talmak.

              Aunque el sabio vio las rocas demasiado tarde como para poder detenerlas directamente, aún fue capaz de conjurar a su alrededor una pequeña cúpula de piedra, lo que amortiguó bastante el impacto de los peñascos sobre su propia persona. Sin embargo, eso no evitó que su plataforma quedara completamente destruida, haciendo que Talmak cayera hacia el suelo junto con todos los escombros.

              No llega a caer durante mucho tiempo, eso sí, porque casi de inmediato crea de la nada otra plataforma bajo sus pies mientras aparta todos los escombros de un solo movimiento. Por la cara que tiene, parece estar de muy mal humor ahora mismo.

              "Se ve bastante cabreado, Barry", me dice Hadrik mientras flota a mi lado en su forma de águila gigante. "¿Crees que puedes ocuparte de él mientras voy a buscar a Daren? Al fin y al cabo, él es el especialista contra elementalistas. Las batallas aéreas no son lo mío."

              "Sí, ve a buscarlo", digo. "Pero rápido. No sé cuánto tiempo más voy a poder aguantar esto."
          - source: scene_3
            paragraph: 9
            text: |-
              Mientras Hadrik va en busca de Daren, Talmak lo ignora por completo y usa su plataforma para volver a subir hasta mi altura. Parece que esta vez por fin me he ganado toda su atención.

              El sabio empieza a crear todavía más rocas que antes y sigue arrojándomelas una tras otra. Sin embargo, su puntería parece algo peor que antes. Da la impresión de que no es capaz de concentrarse tan bien como querría cuando está tan enfadado.
