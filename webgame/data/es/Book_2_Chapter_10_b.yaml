  - name: b2_ch10b_observe
    routes:
      - condition: perception < 4
        texts:
          - source: scene_text
            paragraph: 26
            text: |-
              Ya es hora de dejar de jugar y pasar a la ofensiva. Pero para hacerlo, voy a tener que prestar un poco más de atención a mi entorno.

              Mientras echo un vistazo a mi alrededor, tomo nota mental de dónde están todas las rocas para asegurarme de que ninguna plataforma ni ningún peñasco me tomen por sorpresa, salvo los que se creen a partir de ahora. Luego empiezo a formular una estrategia basándome en cómo he visto al sabio atacarme hasta este momento.

              Dado que Talmak siempre intenta anticipar hacia dónde voy mientras me coloca obstáculos continuamente en el camino, probablemente debería cambiar mis patrones de vuelo para volverme un poco más impredecible. Así lo obligaré a malgastar energía generando placas de piedra en lugares erróneos, y se verá forzado a hacer que me persigan, igual que ya hace con los peñascos que salen de la tierra de abajo.

              Empiezo a volar en círculos, sin rumbo ni propósito, para que al sabio le resulte más difícil predecir lo que haré. Esto funciona hasta cierto punto, pero no me ayuda realmente a acercarme a él. Tengo que seguir observando las rocas y ver si encuentro algún patrón en la forma en que las mueve que pueda explotar.
          - source: scene_text_2
            paragraph: 17
            text: Mientras estoy ocupado intentando observar cómo Talmak mueve y crea sus rocas, pierdo la concentración en los peñascos que de verdad iban a por mí y uno de ellos me golpea directamente en la cabeza. Antes de que tenga tiempo de recuperarme, el sabio crea aún más placas de piedra y enseguida quedo aplastado entre varias capas de roca, lo que hace que muera casi al instante.
