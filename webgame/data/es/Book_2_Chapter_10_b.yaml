  - name: b2_ch10b_mosquito
    texts:
      - source: scene_text
        paragraph: 27
        text: |-
          "¡Deja de revolotear como un maldito mosquito!", grita Talmak mientras esquivo otro de sus peñascos.

          "¡Lo siento, amigo!", digo. "Es solo que se me da bastante bien pilotar aviones y parece que esas habilidades se trasladan bastante bien al vuelo mágico. Mala suerte, ¿eh?"

          "Voy a disfrutar muchísimo cerrándote para siempre esa bocaza de listillo, muchacho", dice Talmak mientras me lanza otros tres peñascos, que esquivo con facilidad.

          "Ahora ya empiezas a sonar como todos esos matones de manual a los que he derrotado por el camino", digo. "¿No tienes ninguna frase mejor que esa?"

          Mientras sigo volando en círculos, echo un vistazo abajo para ver qué está pasando y, por lo visto, Daren estaba en medio de un duelo con Nolderan cuando Hadrik aterrizó en el suelo y volvió a transformarse en enano.

          Sin pensárselo demasiado, Hadrik corre hacia Nolderan y le da un puñetazo tan fuerte que lo estrella contra un muro cercano. Luego le dice algo a Daren y señala en mi dirección. Después de eso, Daren empieza a curarse a sí mismo, mientras Hadrik va a pelear contra Nolderan en su lugar.
      - source: scene_text_2
        paragraph: 20
        text: |-
          Mientras tanto, Kate y Leila están ocupadas luchando contra los dos secuaces enanos, que son ambos elementalistas de fuego, mientras el elfo crea barreras semitransparentes para defenderse de los carámbanos de Kate. La banshee de su lado también está peleando contra uno de mis compañeros, pero me deja helado descubrir que su rival es, en realidad, Illuna.

          Echo un vistazo rápido para ver qué ha sido de la jaula dorada y de Melindra, y parece que ambas siguen exactamente donde estaban antes. Eso significa que Illuna seguramente salió mediante ese hechizo diario suyo de teletransporte, mientras dejaba a Melindra a salvo dentro de la jaula para que siguiera recuperándose de sus heridas.

          Al observar el estilo de combate de la banshee de pelo negro, llego a la conclusión de que debe de ser una generalista de algún tipo. Está lanzando toda clase de hechizos, desde rayos hasta fuego o hielo, y además tiene varias águilas invocadas a su lado. En cualquier caso, no tengo tiempo de estudiar el campo de batalla con más detalle. Ya es bastante difícil esquivar los ataques del sabio sin distraerme.

          Sigo bailando por el cielo con Talmak y sus peñascos un rato más, hasta que de repente oigo la voz de Daren llegar desde abajo.

          "¡Eh, Talmak!", grita Daren. "¡Baja aquí para que tengamos un duelo! ¡Uno contra uno! ¿Qué clase de cobarde sale volando hacia el cielo, donde sus enemigos no pueden alcanzarlo?"
      - source: scene_3
        paragraph: 10
        text: |-
          "¡Vigila esa lengua, sanador con armadura!", grita Talmak. "¿Quién te crees que eres para hablarme así?"

          "La verdad es que tiene razón", digo en voz alta, asegurándome de que Daren pueda oírme. "Si de verdad eres el elementalista de tierra más fuerte de nuestra época, como dicen, ¿no deberías poder vencernos sin recurrir a estos trucos mezquinos? En los concursos anuales de sabios no te dejan salir volando mientras peleas, ¿verdad? Entonces, ¿por qué lo haces ahora? ¿Es porque le tienes miedo a Daren?"

          "¿Qué acabas de decir?...", dice Talmak.

          "Te está preguntando si me tienes miedo, Talmak", grita Daren. "Contesta a la pregunta del hombre, ¿quieres?"

          "Esta insolencia te va a costar cara, sanador", dice Talmak. "No me importa lo que digan las leyendas sobre ti. ¡Voy a machacarte contra el suelo y a enseñarte lo que pasa cuando te burlas de un sabio!"

          Entonces baja rápidamente su plataforma flotante al suelo con un golpe sordo, se apea de ella y empieza a acercarse a Daren. Yo también vuelo hacia ellos y luego aterrizo en el suelo para ver mejor la pelea.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch10b_intensely
  - name: b2_ch10b_henchmen
    routes:
      - condition: b2_ch5_scimitar <> 0
        texts:
          - source: scene_text
            paragraph: 28
            text: |-
              Saco rápidamente la ballesta de la mochila y empiezo a disparar a todos los enemigos menos al sabio, porque ya sé con certeza que la protección mágica contra el daño físico que usa es lo bastante poderosa como para hacer que los virotes de ballesta reboten sin hacerle nada. Por desgracia, parece que ya ha lanzado la misma protección sobre sus aliados, porque ninguno de los virotes les hizo daño de ninguna clase. Viendo que esta arma no me sirve de nada, la vuelvo a guardar en la mochila y desenvaino la cimitarra.

              Mientras los secuaces vienen hacia nosotros, Talmak aparta a Hadrik de un golpe con un gran peñasco y luego usa la plataforma bajo sus pies para elevarse alto en el aire. En cuanto se recupera, Hadrik se transforma en una águila gigante y se lanza al cielo detrás del sabio.

              Nolderan es el primero de los secuaces en atacar y va directamente a por Daren. Mientras el viejo maestro y su discípulo empiezan su duelo, Kate conjura rápidamente una cúpula de hielo semitransparente a nuestro alrededor, justo a tiempo para defender a Leila, a ella y a mí de una andanada de llamas procedente de los dos enanos, que aparentemente son ambos elementalistas de fuego.

              "¡No los maten todavía!", grita la banshee. "Necesito respuestas."

              "¡Al diablo con tus respuestas, abominación!", dice el enano del parche en el ojo. "Bastante agradecida deberías estar de que nuestro amo te haya tomado bajo su ala. ¡No te atrevas a creer que puedes darnos órdenes!"
          - source: scene_text_2
            paragraph: 21
            text: |-
              "El sabio no es mi amo", dice la banshee. "Solo tenemos un acuerdo. Le dije que le ayudaría a conseguir el Magium siempre que me inscribiera en este torneo y me dejara perseguir mis propios objetivos por mi cuenta."

              "El mero hecho de que el sabio Talmak te permita respirar en su presencia ya debería ser recompensa más que suficiente por tus servicios", dice el enano con cicatrices en la cara. "Si yo estuviera en su lugar, te habría matado hace mucho."

              En cuanto el enano termina su frase, Kate desata de repente el centenar de carámbanos que llevaba todo este tiempo preparando en el cielo y los dispara contra todos los secuaces del sabio, incluido Nolderan. Justo cuando los carámbanos alcanzan a los cuatro enemigos que tenemos delante, todos rebotan contra una barrera invisible que rodeaba a los magos. Nolderan, en cambio, no necesitó ninguna barrera para protegerse y sencillamente se movió bailando entre los proyectiles mientras además rechazaba un ataque de Daren.
          - source: scene_3
            paragraph: 11
            text: |-
              "¿Quizá podríamos continuar esta discusión en un momento más oportuno?", dice el elfo con una sonrisa forzada. "Verán, si no los hubiera protegido hace un instante, ya estarían todos muertos."

              "¡Y un cuerno!", dice la banshee. "Tal vez esos idiotas habrían muerto, pero yo era perfectamente consciente de esos carámbanos y ya me estaba preparando para esquivarlos."

              "¿Por eso no te has movido ni un centímetro cuando te atacaron, a pesar de no saber nada de mi barrera invisible?", dice el elfo, sin dejar de forzar la sonrisa.

              "Cállate", dice la banshee, un poco contrariada. "¡Claro que sabía lo de la barrera!"

              "Por supuesto que sí...", dice el elfo. "Escucha, haz tu pregunta rápido para que por fin podamos empezar a matarnos, ¿quieres?"

              "¡Tú, dentro de la cúpula de hielo!", nos grita la banshee. "Tengo una pregunta para ustedes. ¿Cuál es el nombre de la banshee que hay en el amuleto?"
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch10b_henchmen2
      - condition: b2_ch5_scimitar = 0
        texts:
          - source: scene_text
            paragraph: 29
            text: |-
              Saco rápidamente la ballesta de la mochila y empiezo a disparar a todos los enemigos menos al sabio, porque ya sé con certeza que la protección mágica contra el daño físico que usa es lo bastante poderosa como para hacer que los virotes de ballesta reboten sin hacerle nada. Por desgracia, parece que ya ha lanzado la misma protección sobre sus aliados, porque ninguno de los virotes les hizo daño de ninguna clase. Viendo que esta arma no me sirve de nada, la vuelvo a guardar en la mochila y desenvaino la daga.

              Mientras los secuaces vienen hacia nosotros, Talmak aparta a Hadrik de un golpe con un gran peñasco y luego usa la plataforma bajo sus pies para elevarse alto en el aire. En cuanto se recupera, Hadrik se transforma en una águila gigante y se lanza al cielo detrás del sabio.

              Nolderan es el primero de los secuaces en atacar y va directamente a por Daren. Mientras el viejo maestro y su discípulo empiezan su duelo, Kate conjura rápidamente una cúpula de hielo semitransparente a nuestro alrededor, justo a tiempo para defender a Leila, a ella y a mí de una andanada de llamas procedente de los dos enanos, que aparentemente son ambos elementalistas de fuego.

              "¡No los maten todavía!", grita la banshee. "Necesito respuestas."

              "¡Al diablo con tus respuestas, abominación!", dice el enano del parche en el ojo. "Bastante agradecida deberías estar de que nuestro amo te haya tomado bajo su ala. ¡No te atrevas a creer que puedes darnos órdenes!"
          - source: scene_text_2
            paragraph: 21
            text: |-
              "El sabio no es mi amo", dice la banshee. "Solo tenemos un acuerdo. Le dije que le ayudaría a conseguir el Magium siempre que me inscribiera en este torneo y me dejara perseguir mis propios objetivos por mi cuenta."

              "El mero hecho de que el sabio Talmak te permita respirar en su presencia ya debería ser recompensa más que suficiente por tus servicios", dice el enano con cicatrices en la cara. "Si yo estuviera en su lugar, te habría matado hace mucho."

              En cuanto el enano termina su frase, Kate desata de repente el centenar de carámbanos que llevaba todo este tiempo preparando en el cielo y los dispara contra todos los secuaces del sabio, incluido Nolderan. Justo cuando los carámbanos alcanzan a los cuatro enemigos que tenemos delante, todos rebotan contra una barrera invisible que rodeaba a los magos. Nolderan, en cambio, no necesitó ninguna barrera para protegerse y sencillamente se movió bailando entre los proyectiles mientras además rechazaba un ataque de Daren.
          - source: scene_3
            paragraph: 11
            text: |-
              "¿Quizá podríamos continuar esta discusión en un momento más oportuno?", dice el elfo con una sonrisa forzada. "Verán, si no los hubiera protegido hace un instante, ya estarían todos muertos."

              "¡Y un cuerno!", dice la banshee. "Tal vez esos idiotas habrían muerto, pero yo era perfectamente consciente de esos carámbanos y ya me estaba preparando para esquivarlos."

              "¿Por eso no te has movido ni un centímetro cuando te atacaron, a pesar de no saber nada de mi barrera invisible?", dice el elfo, sin dejar de forzar la sonrisa.

              "Cállate", dice la banshee, un poco contrariada. "¡Claro que sabía lo de la barrera!"

              "Por supuesto que sí...", dice el elfo. "Escucha, haz tu pregunta rápido para que por fin podamos empezar a matarnos, ¿quieres?"

              "¡Tú, dentro de la cúpula de hielo!", nos grita la banshee. "Tengo una pregunta para ustedes. ¿Cuál es el nombre de la banshee que hay en el amuleto?"
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch10b_henchmen2
  - name: b2_ch10b_henchmen2
    texts:
      - source: scene_text
        paragraph: 30
        text: |-
          "¿Qué te hace pensar que vamos a responder a tu pregunta?", le grita Kate de vuelta a través de la cúpula.

          "Si responden, haremos que sus muertes sean rápidas y casi indoloras", dice la banshee. "Pero si no..."

          De pronto, varias bolas de fuego caen sobre los subordinados del sabio, cubriendo toda su zona con explosiones.

          "Arraka", oímos la voz de Illuna llegar desde el cielo. "Se llama Arraka."

          Al levantar la vista, vemos a Illuna flotando a unos doce pies del suelo, impulsándose con los chorros de Flower, mientras sus ojos brillan con una luz azul.

          "Espera, ¿cómo saliste de la jaula?", le pregunto.

          "Está permitido lanzar hechizos de teletransporte dentro de la jaula dorada siempre que seas tú quien la conjuró", dice Illuna. "El hechizo está diseñado así para que todavía puedas escapar en caso de que te atrapes accidentalmente dentro junto a tu enemigo. Por suerte, casi nunca uso ese hechizo diario mío de teletransporte, así que lo tenía listo para esta ocasión."

          "¿Pero qué pasó con Melindra?", digo.

          "Está consciente, pero sigue recuperándose", dice Illuna. "El hechizo curativo que le lancé no surtirá pleno efecto hasta dentro de al menos unos cuantos minutos más. Me aseguré de prolongar la duración de la jaula para que siguiera a salvo hasta entonces, aunque me ha costado bastante energía mágica hacerlo..."
      - source: scene_text_2
        paragraph: 22
        text: |-
          "¿Ya terminaron ustedes dos con su conversación o piensan seguir ignorándonos?", dice la banshee que trabaja para el sabio.

          Cuando miramos hacia los secuaces de Talmak, vemos que las bolas de fuego no les hicieron daño gracias a la barrera invisible del elfo. Aunque la barrera en sí no se ve a simple vista, se puede notar que sigue ahí por el aura mágica que desprende.

          "Nadie les pidió que nos esperaran", dice Illuna con voz fría. "Podrían habernos atacado en cualquier momento."

          "Oh, yo los habría atacado hace rato", dice el enano del parche en el ojo, "si esta triste excusa de elfo no nos hubiera rodeado a todos con una barrera impenetrable que funciona en ambos sentidos."

          "Quitaré la barrera en cuanto nuestra amiga banshee termine de hacer sus preguntas", dice el elfo con calma. "Y también en cuanto prometan no dejarse alcanzar por todos y cada uno de los ataques mortales del enemigo como una pandilla de aficionados."
      - source: scene_3
        paragraph: 12
        text: |-
          "Esa banshee del amuleto a la que llamaste Arraka...", empieza a preguntarle la banshee de pelo negro a Illuna, ignorando al elfo. "¿Cuántos años tiene exactamente? ¿Sabes por casualidad si existe desde hace más de mil años? ¿Quizá incluso cinco mil?"

          "Oh, llevo viviendo bastante más de cinco mil años, pequeña", dice Arraka. "Pero creo que ambas deberíamos dejar de andarnos con rodeos. ¿Qué es exactamente lo que quieres preguntarme?"

          "Entonces te lo preguntaré directamente", dice la banshee con una mirada sombría en los ojos. "¿Fuiste tú, o no, quien provocó el destierro de todas las banshees del reino mágico hace cinco mil años?"
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch10b_henchmen3
  - name: b2_ch10b_henchmen3
    texts:
      - source: scene_text
        paragraph: 31
        text: |-
          "¡Aha- Ahahahahaha!", se ríe Arraka. "¿Así que después de tantos años todavía quedan banshees que conocen la historia? Vaya, parece que ni quedar atrapada en una montaña durante miles de años basta para extinguir la llama de una auténtica leyenda. Ahora mismo estoy tan orgullosa que no tienen ni idea."

          "Así que era verdad...", dice la banshee de pelo negro, con la mirada más oscura que nunca. "Siempre supe que esos rumores eran ciertos. La única razón por la que vine a Varathia fue porque la información que tenía me hizo creer que aquí podría encontrarte. Y en cuanto sentí esa aura siniestra saliendo del amuleto, supe que eras tú. Todo este dolor y sufrimiento que nuestra raza ha tenido que soportar durante milenios... Obligadas a vivir nuestras vidas como parásitos... ¡Todo por tu culpa!"

          "Bueno, ¿y qué vas a hacer al respecto?", dice Arraka en tono provocador.

          "¡Voy a acabar contigo!", grita la banshee. "Vengaré a todas y cada una de las banshees a las que has condenado con esta existencia tortuosa."

          "Si destruyes este amuleto, solo la liberarás", dice Illuna. "Y nos condenarás a todos."
      - source: scene_text_2
        paragraph: 23
        text: |-
          "Si queda libre, entonces la mataré una y otra vez hasta que esté muerta de verdad", dice la banshee de pelo negro, con los ojos llenos de rabia. "Y si se interponen en mi camino, también los mataré a ustedes. Deshaz esta barrera, elfo. Ya va siendo hora de que todos saldemos nuestras cuentas."

          "Por fin", dice el elfo mientras disipa su barrera. "Intenten no morirse en los primeros cinco segundos, ¿quieren?"

          En cuanto la barrera desaparece, los dos enanos canalizan su magia en un único rayo de fuego que usan para atacar la cúpula de hielo de Kate. El hielo se está reforzando casi tan rápido como se derrite, pero está claro que Kate no podrá mantener esto mucho más tiempo. Mientras tanto, la banshee de pelo negro sale volando hacia el cielo y empieza a atacar a Illuna y a Flower con toda una variedad de hechizos.

          A juzgar por los tipos de hechizos tan distintos que está usando, voy a suponer que es alguna clase de generalista. Ya ha lanzado un hechizo de rayos, un hechizo sónico y un hechizo de congelación, uno detrás de otro, además de invocar unas cuantas águilas para intentar sorprender a Illuna. Por suerte, Flower está haciendo un buen trabajo esquivando los ataques en pleno vuelo, aunque ni ella ni Illuna han conseguido todavía acertarle un solo golpe a su adversaria.
      - source: scene_3
        paragraph: 13
        text: |-
          Mientras sigue ocupada reforzando la cúpula de hielo, Kate dispara unos cuantos carámbanos más contra los enanos, pero esta vez los proyectiles quedan detenidos mucho más arriba en el aire por lo que parece ser una pequeña barrera plana y semitransparente que el elfo conjuró para interceptarlos. El elfo le sonríe a Kate desde la distancia, lo que hace que Kate le frunza el ceño mientras vuelve la cabeza hacia Leila y hacia mí.

          "Si alguno de ustedes pudiera mantener ocupados a algunos de esos tres magos mientras yo los ataco, se lo agradecería mucho...", dice Kate.
    choices:
