            paragraph: 9
            text: |-
              "¿Alguna vez te dijeron que tus secuaces enanos dan más miedo que tú?"

              "¿Qué eres, una especie de payaso?...", dice Talmak. "Daren, si vas a traer a tu bufón personal a un torneo como este, al menos vístelo como corresponde. Así la gente sabrá que no debe hablar con él."

              "Oye, puedes ignorarme todo lo que quieras, pero eso no hará que la verdad desaparezca", digo.

              "En realidad, Barry no vino aquí conmigo", dice Daren. "Se unió al torneo por su cuenta y también aspira a ganar el Magium. Es un participante, igual que el resto de nosotros."

              "Por favor, dime que estás bromeando...", dice Talmak. "¡Esto tiene que ser una broma!"

              "No es una broma...", dice Kate. "Míralos bien y verás en sus ojos que no están fanfarroneando. De verdad han venido ambos aquí para ganar el torneo."

              Tras oír las palabras de Kate, Talmak no deja de girar la cabeza entre Daren y yo, mirándonos a cada uno por turno, como si sencillamente se negara a creer lo que está ocurriendo ante sus ojos. Cuando por fin entiende que hablamos totalmente en serio, pierde por completo los estribos y la cara se le deforma en un gruñido.
