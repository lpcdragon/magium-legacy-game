              Normalmente, un golpe así debería haberle destrozado la cabeza, pero gracias a todas sus protecciones mágicas ha salido con apenas una nariz ensangrentada. Talmak cae hacia el suelo durante un rato, pero luego conjura otra plataforma flotante debajo de él para frenar la caída. Por la expresión de su cara, parece estar de muy mal humor ahora mismo.

