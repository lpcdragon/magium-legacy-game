      - condition: agility < 3
        texts:
          - source: scene_text
            paragraph: 32
            text: |-
              "Yo me encargo", escribe Leila.

              "Yo también", digo. "Abre la cúpula."

              En cuanto recibe nuestra confirmación, Kate agita la mano derecha hacia un lado de la cúpula y abre una salida del tamaño justo para que ambos podamos pasar.

              "Concentrémonos primero en los enanos", le digo a Leila. "Parecen de los que se enfocan más en el ataque que en la defensa, y ese elfo no va a poder protegerlos para siempre. Podemos intentar rodearlos desde dos lados. Yo iré por la izquierda."

              Leila asiente y entonces ambos salimos de la cúpula, mientras Kate cierra la abertura detrás de nosotros. En cuanto estamos fuera, Leila empieza a correr hacia nuestros enemigos por el lado derecho, mientras yo me acerco por la izquierda. Cuando nos ven salir de la cúpula, los dos enanos cambian rápidamente de objetivo y empiezan a apuntarnos a Leila y a mí. El enano del parche parece ser el que se centra en mí, mientras el que tiene cicatrices está lanzando bolas de fuego hacia Leila.

              Mientras intento esquivar los ataques del enano, de pronto choco contra una barrera invisible que me bloquea el paso. Intento correr rápidamente hacia el otro lado, pero soy demasiado lento y una de las llamas me alcanza de lleno, me reduce a cenizas y me mata en el acto.
