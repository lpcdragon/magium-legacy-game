            effects:
              - set:
                  current_scene: b2_ch10b_pull
  - name: b2_ch10b_guess
    texts:
      - source: scene_text
        paragraph: 5
        text: |-
          "Supongo que sí..."

          "Bien", dice simplemente Melindra, y entonces siento que vuelve a lanzarme las mismas corrientes de aire que había usado conmigo esa misma mañana.

          Luego se aleja sin decir una palabra más para reunirse con el resto del equipo. Flower y yo nos miramos un segundo, confundidos, y después decidimos dirigirnos también hacia el sabio.

          Las corrientes de aire parecen ir calmándose a medida que avanzo. Probablemente estén esperando a que les dé la señal cuando quiera empezar a volar. A medida que me acerco a la mesa de piedra, observo mejor al sabio y a sus secuaces. Talmak tiene más o menos la misma altura que Hadrik en su forma de enano y una barba larga y castaña que le cubre buena parte de la cara. Tiene el aspecto de un enano de lo más corriente. No hay nada especial en él ni nada que lo haga parecer particularmente intimidante. Hasta puedo entender por qué Illuna quedó tan poco impresionada cuando lo vio por primera vez.

          El sabio lleva el mismo tipo de armadura de cuero fuertemente encantada que lleva Nolderan, y lo mismo ocurre con el resto de su equipo, pero ninguno de ellos parece portar armas. Supongo que Nolderan es quien encantó todo su equipo.
      - source: scene_text_2
        paragraph: 3
        text: |-
          Aparte del antiguo maestro de Daren, el equipo de Talmak está formado por una banshee, un elfo y dos enanos. Curiosamente, los dos enanos parecen más intimidantes que el propio sabio. Uno de ellos tiene dos grandes cicatrices en la cara y el otro lleva un parche en el ojo. El elfo tiene el pelo rubio y largo y una figura delgada y alta. Parece bastante viejo, incluso para un elfo. No tengo muy claro a qué ritmo envejecen los elfos, pero creo que haría falta tener más de cien años para que se notaran arrugas en la cara. Y este elfo tiene un montón.

          La mujer cuyo cuerpo posee la banshee debe de rondar los treinta y pocos. Sus ojos brillan constantemente con una luz verde, de forma parecida a como los ojos de Flower brillan siempre en azul cuando Illuna toma el control del cuerpo. También desprende un aura sobrenatural, así que está claro que no es una maga artificial.

          Dado que la banshee claramente dejó atrás hace mucho su etapa del despertar, solo puedo suponer que el alma de la huésped desapareció hace tiempo y que ahora la banshee es la única que controla el cuerpo. Sin embargo, yo no sabía que una banshee pudiera mantener el aspecto original de su huésped incluso después de su despertar. Creía que Flower e Illuna eran un caso especial por la fusión, pero parece que me equivocaba. Quizá no sé tanto sobre las banshees como me gustaría creer.

          La mujer tiene el pelo largo y negro, y la expresión de su cara parece despiadada e implacable. Mientras nos acercábamos, vi que la banshee le lanzaba una mirada fugaz a Flower, pero luego volvió a mirar al frente, esperando las órdenes del sabio.
      - source: scene_3
        paragraph: 3
        text: |-
          Todos los miembros de nuestro equipo se detienen a unos veinte pies de la mesa de piedra para asegurarse de que tenemos suficiente espacio para movernos en caso de que estalle una pelea entre nuestros dos grupos. Nolderan, por supuesto, pasa de largo junto a nosotros y se reúne con sus verdaderos camaradas, que ahora forman una línea detrás del sabio.

          "Veo que no están dispuestos a avanzar más", dice Talmak antes de dar otro trago a su botella de ale enana. "No importa. Al menos están lo bastante cerca para que no tenga que gritar. Vayamos al grano, entonces, ¿les parece?"

          Entonces deja la botella, apoya las manos sobre la mesa y nos mira fijamente.

          "Creo que ya habrán adivinado que todos los magos que están ahí fuera recogiendo piñas trabajan para mí", dice Talmak. "Todos son magos que han aceptado renunciar a seguir participando en este torneo y dedicar el resto de su tiempo aquí a ayudarme a ganar. A cambio de sus servicios, recibirán generosas recompensas, muchas de ellas imposibles de conseguir por medios normales. Como todos saben, cuando te conviertes en sabio recibes muchos beneficios. También ganas mucha influencia sobre mucha gente. Y yo puedo usar esa influencia para hacer realidad los deseos de las personas. Ahora dime, Daren, ¿acaso no tienes por casualidad algún deseo que te gustaría ver cumplido?"

          "Mi deseo es obtener acceso al Magium", dice Daren con un tono de voz muy serio. "Pero por lo que estoy entendiendo, ese es precisamente el único deseo que tú no querrías concederme..."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch10b_recruited
  - name: b2_ch10b_pull
    texts:
      - source: scene_text
        paragraph: 4
        text: |-
