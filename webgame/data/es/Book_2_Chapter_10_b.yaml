  - name: b2_ch10b_specialty
    texts:
      - source: scene_text
        paragraph: 40
        text: |-
          Mientras tanto, el duelo entre Daren y Nolderan parece mucho menos equilibrado. El exsabio no parece haber recibido ni un solo golpe hasta ahora, mientras que Daren ya se mueve mucho más despacio que antes y parece haber resultado herido en la pelea. No sé cuánto más podrá aguantar Daren a este ritmo. Quizá debería ir a ayudarlo.

          Antes de que pueda seguir pensándolo, Hadrik aterriza rápidamente en el suelo en su forma de águila y luego vuelve a transformarse en enano. El sabio sigue allá arriba, sobre su plataforma, con todas sus rocas flotando a su alrededor, y parece estar esperando el siguiente movimiento de Hadrik.

          "Ríndete, Daren", dice Nolderan con voz segura mientras consigue herirlo otra vez al atacar una de las articulaciones del codo de su armadura. "Veo que has aprendido algunas técnicas nuevas desde que nos separamos, pero sigues sin estar a mi altura. Quizá si le suplicas misericordia al sabio Talmak, todavía te perdone..."

          El exsabio no llega a terminar la frase, porque Hadrik corre de repente a su lado y le da un puñetazo tan fuerte que lo estrella contra un muro cercano.

          "Creo que puede que hayas olvidado que esto es una pelea en equipo, no un duelo, viejo", le dice Hadrik con una sonrisa. "La próxima vez quizá te convenga vigilar un poco mejor lo que te rodea."

          "Lo tendré en cuenta", dice Nolderan mientras forcejea por volver a ponerse en pie.
      - source: scene_text_2
        paragraph: 30
        text: |-
          "Yo me ocuparé de tu antiguo maestro", le dice Hadrik a Daren. "Tú ve a ocuparte del sabio. Se supone que los elementalistas son tu especialidad, ¿no?"

          "Lo son", dice Daren mientras empieza a lanzarse un hechizo curativo. "Yo me encargaré de él."

          "¡Perfecto!", dice Hadrik. "¡Vamos, Nolderan, tengamos un pequeño y divertido combate de entrenamiento!"

          Entonces corre hacia el antiguo maestro de Daren e intenta volver a golpearlo, pero esta vez Nolderan lo estaba esperando y esquiva el ataque sin esfuerzo. Mientras ambos empiezan su batalla, Daren se pone a gritar muy fuerte al sabio, que sigue en el cielo esperando a su siguiente adversario.

          "¡Eh, Talmak!", grita Daren mientras sus heridas siguen curándose mágicamente. "¡Baja aquí para que tengamos un duelo! ¡Uno contra uno! ¿Qué clase de cobarde sale volando hacia el cielo, donde sus enemigos no pueden alcanzarlo?"

          "¡Vigila esa lengua, sanador con armadura!", grita Talmak. "¿Quién te crees que eres para hablarme así?"
      - source: scene_3
        paragraph: 18
        text: |-
          "La verdad es que tiene razón", digo en voz alta, asegurándome de que Talmak pueda oírme. "Si de verdad eres el elementalista de tierra más fuerte de nuestra época, como dicen, ¿no deberías poder vencernos sin recurrir a estos trucos mezquinos? En los concursos anuales de sabios no te dejan salir volando mientras peleas, ¿verdad? Entonces, ¿por qué lo haces ahora? ¿Es porque le tienes miedo a Daren?"

          "¿Qué acabas de decir?...", dice Talmak.

          "Te está preguntando si me tienes miedo, Talmak", grita Daren. "Contesta a la pregunta del hombre, ¿quieres?"

          "Esta insolencia te va a costar cara, sanador", dice Talmak. "No me importa lo que digan las leyendas sobre ti. ¡Voy a machacarte contra el suelo y a enseñarte lo que pasa cuando te burlas de un sabio!"

          Entonces baja rápidamente su plataforma flotante al suelo con un golpe sordo, se apea de ella y empieza a acercarse a Daren, que ahora está completamente curado.
    choices:
