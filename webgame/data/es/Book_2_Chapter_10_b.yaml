  - name: b2_ch10b_trouble
    texts:
      - source: scene_text
        paragraph: 22
        text: |-
          Sorprendentemente, Hadrik está teniendo un poco más de problemas que yo para lidiar con las placas de roca que vuelan por el aire, porque cada vez que hace un cambio de forma para convertirse en una criatura voladora su cuerpo se vuelve más débil y más vulnerable a este tipo de ataques. Una vez mencionó que tiene una técnica para endurecer el aura a su alrededor y contrarrestar esa debilidad, pero no parece estar sirviéndole de mucho en esta situación.

          Cada vez que Talmak intenta aplastarlo entre dos rocas, Hadrik tiene que volver a transformarse en enano para lidiar con las plataformas, lo que le impide alcanzar al sabio. Supongo que, por ahora, me va a tocar ocuparme yo solo del sabio.

          Mientras sigo abriéndome paso a puñetazos entre las rocas camino de la plataforma de Talmak, el sabio no deja de crear más y más, haciendo difícil seguirle el ritmo. Ahora que miro hacia el suelo, veo que también hay grandes trozos de roca arrancados de la propia tierra que vienen hacia mí a gran velocidad. No voy a poder encargarme de todo esto solo a puñetazos. Creo que ya va siendo hora de cambiar de táctica.
    choices:
      - position: 1
        text: Intentar usar contra el sabio sus propias técnicas.
        effects:
          - set:
              current_scene: b2_ch10b_technique
              b2_ch10_tactic: 0
      - position: 2
        text: Confiar en mi velocidad de reacción para esquivar las rocas hasta llegar a Talmak.
        effects:
          - set:
              current_scene: b2_ch10b_reaction
              b2_ch10_tactic: 1
      - position: 3
        text: Intentar obtener ventaja siendo más consciente de mi entorno.
        effects:
          - set:
              current_scene: b2_ch10b_observe
              b2_ch10_tactic: 2
  - name: b2_ch10b_technique
    routes:
      - condition: combat_technique < 4
        texts:
          - source: scene_text
            paragraph: 23
            text: |-
              Ya es hora de dejar de jugar y pasar a la ofensiva. A ver... ¿Qué puedo usar contra él?

              Echo un vistazo rápido por debajo de mí y me doy cuenta de que las rocas arrancadas del suelo se mueven más despacio que las que Talmak crea él mismo. También parece tener algo menos de control sobre ellas, por la forma en que tiemblan. No sé por qué querría usar esas rocas si no puede controlarlas bien, pero mi suposición es que intenta ahorrar energía. Al fin y al cabo, crear piedras grandes de la nada puede salir bastante caro. Sea como sea, creo que acabo de encontrar lo que buscaba.

              Las rocas de abajo empiezan a acercarse ya. Si tan solo encontrara una forma de llevarlas a donde yo quiero...

              Empiezo a destruir a puñetazos todas las placas de piedra creadas mágicamente, asegurándome de esquivar solo las rocas que vienen de la tierra de abajo. Muy pronto, tengo a todo un ejército de peñascos siguiéndome y tratando de rodearme. El sabio está demasiado ocupado manteniendo a Hadrik a raya como para notar todavía lo que estoy haciendo. Todo esto está funcionando bastante bien por ahora, pero no puedo permitirme moverme hasta que el sabio esté completamente distraído. Si se da cuenta de mi plan, estoy completamente jodido.

              Sigo esquivando y golpeando rocas hasta que parece que Talmak tiene toda su atención puesta en Hadrik, y entonces echo a volar tan rápido como puedo directamente hacia el sabio y su plataforma, que están ambos justo debajo de mí.
          - source: scene_text_2
            paragraph: 15
            text: Por desgracia, parece que Talmak seguía prestándome atención, porque en cuanto me ve acercarme conjura una gran placa de piedra justo delante de mí. Consigo detenerme antes de chocar contra el obstáculo, pero las rocas que venían siguiéndome de cerca me golpean a toda velocidad y me aplastan contra la placa de piedra, matándome al instante.
