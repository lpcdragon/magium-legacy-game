              current_scene: b2_ch10b_silent
  - name: b2_ch10b_cheer
    texts:
      - source: scene_text
        paragraph: 42
        text: |-
          "¡Tú puedes, Daren!", digo. "Si ganas esta pelea, seguirán escribiendo historias sobre ti durante muchos años más."

          "Esta va a ser su última historia, muchacho", dice Talmak. "Me aseguraré de ello."

          Entonces el sabio crea dos peñascos que duplican el tamaño de Daren y los lanza contra él con su magia de tierra. Daren usa su espada para atravesar ambos peñascos en un solo movimiento, pero en lugar de cortarlos, la espada los atraviesa como si fueran mantequilla, y las rocas se hacen cada vez más pequeñas a lo largo de unos segundos, hasta quedar del tamaño de canicas. Las dos canicas empiezan entonces a girar alrededor de la espada de Daren como si la hoja fuera su centro de gravedad.

          "¿Qué?...", pregunta Talmak, en estado de shock. "No, esto no puede ser..."

          El sabio crea de inmediato dos peñascos todavía más grandes que antes y vuelve a arrojarlos contra su oponente, mientras Daren empieza a caminar lentamente hacia él. Igual que la vez anterior, Daren atraviesa las dos rocas de un tajo, lo que hace que se encojan y se unan a las otras dos canicas que gravitan alrededor de la espada.

          "¿Qué pasa, Talmak?", dice Daren con una mirada sombría en los ojos mientras sigue avanzando despacio hacia él. "¿No ibas a castigarme por mi insolencia?"
      - source: scene_text_2
        paragraph: 31
        text: |-
          "¡Sabio Talmak!", grita Nolderan, cuando el sabio empieza a entrar un poco en pánico. "La espada de Daren puede absorber los elementos. No puedes luchar contra él con rocas creadas mágicamente. ¡Usa rocas normales! No podrá absorberlas lo bastante rápido."

          "Ah, así que así están las cosas...", dice Talmak.

          Entonces empieza a usar su magia para arrancar varios grandes peñascos de la tierra, pero antes de que consiga hacerlo, Daren le arroja la espada con todas sus fuerzas, lanzando las cuatro canicas contra el sabio junto con ella.

          Las canicas de piedra recuperan rápidamente su tamaño original en pleno vuelo, mientras Talmak se ve obligado a soltar las rocas que estaba arrancando de la tierra y a crear delante de sí un gran muro grueso de piedra para defenderse de los peñascos entrantes. Su muro no basta para protegerlo por completo, sin embargo, y uno de los peñascos consigue golpearlo de lleno, derribándolo de espaldas.
      - source: scene_3
        paragraph: 19
        text: |-
          "¡No dejes que te apuñale con esa espada!", grita Nolderan. "¡Tiene una técnica que puede cortar tu vínculo con el plano mágico!"

          Mientras Daren se lanza hacia Talmak, el sabio toca el suelo con la mano mientras sigue tumbado de espaldas, y la tierra empieza inmediatamente a temblar con tanta fuerza que todos caemos al suelo. Mientras el terremoto sigue, Talmak vuelve a elevarse por el aire con otra plataforma flotante, mientras la tierra bajo nuestros pies tiembla con tanta violencia que empieza a agrietarse.

          "¡Maldición, está haciendo trampas otra vez!", digo al ver al sabio salir volando hacia el cielo.

          "Creo que puede que tengamos problemas mayores de los que ocuparnos ahora mismo", dice Daren, esforzándose por volver a ponerse en pie debido a la violencia del terremoto.

          Pronto, las grietas del suelo se agrandan y la propia tierra empieza a partirse en dos, creando ante nuestros ojos un abismo enorme y sin fondo. Y por si eso no bastara, grandes pedazos de roca empiezan ahora a ser arrancados de debajo de nuestros pies, dejándonos sin suelo sobre el que sostenernos y haciéndonos caer al gran abismo de abajo.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch10b_shocked
  - name: b2_ch10b_insult
    texts:
      - source: scene_text
        paragraph: 43
        text: |-
          "No dejes que el imponente físico del sabio te intimide, Daren", digo. "Si te fijas bien, se nota que está temblando de miedo."

          "En cuanto acabe con el sanador, tú eres el siguiente, muchacho", me dice Talmak. "Prepárate."

          Entonces el sabio crea dos peñascos que duplican el tamaño de Daren y los lanza contra él con su magia de tierra. Daren usa su espada para atravesar ambos peñascos en un solo movimiento, pero en lugar de cortarlos, la espada los atraviesa como si fueran mantequilla, y las rocas se hacen cada vez más pequeñas a lo largo de unos segundos, hasta quedar del tamaño de canicas. Las dos canicas empiezan entonces a girar alrededor de la espada de Daren como si la hoja fuera su centro de gravedad.

          "¿Qué?...", pregunta Talmak, en estado de shock. "No, esto no puede ser..."

          El sabio crea de inmediato dos peñascos todavía más grandes que antes y vuelve a arrojarlos contra su oponente, mientras Daren empieza a caminar lentamente hacia él. Igual que la vez anterior, Daren atraviesa las dos rocas de un tajo, lo que hace que se encojan y se unan a las otras dos canicas que gravitan alrededor de la espada.

          "¿Qué pasa, Talmak?", dice Daren con una mirada sombría en los ojos mientras sigue avanzando despacio hacia él. "¿No ibas a castigarme por mi insolencia?"
      - source: scene_text_2
        paragraph: 31
        text: |-
          "¡Sabio Talmak!", grita Nolderan, cuando el sabio empieza a entrar un poco en pánico. "La espada de Daren puede absorber los elementos. No puedes luchar contra él con rocas creadas mágicamente. ¡Usa rocas normales! No podrá absorberlas lo bastante rápido."

          "Ah, así que así están las cosas...", dice Talmak.

          Entonces empieza a usar su magia para arrancar varios grandes peñascos de la tierra, pero antes de que consiga hacerlo, Daren le arroja la espada con todas sus fuerzas, lanzando las cuatro canicas contra el sabio junto con ella.

          Las canicas de piedra recuperan rápidamente su tamaño original en pleno vuelo, mientras Talmak se ve obligado a soltar las rocas que estaba arrancando de la tierra y a crear delante de sí un gran muro grueso de piedra para defenderse de los peñascos entrantes. Su muro no basta para protegerlo por completo, sin embargo, y uno de los peñascos consigue golpearlo de lleno, derribándolo de espaldas.
      - source: scene_3
        paragraph: 19
        text: |-
          "¡No dejes que te apuñale con esa espada!", grita Nolderan. "¡Tiene una técnica que puede cortar tu vínculo con el plano mágico!"

          Mientras Daren se lanza hacia Talmak, el sabio toca el suelo con la mano mientras sigue tumbado de espaldas, y la tierra empieza inmediatamente a temblar con tanta fuerza que todos caemos al suelo. Mientras el terremoto sigue, Talmak vuelve a elevarse por el aire con otra plataforma flotante, mientras la tierra bajo nuestros pies tiembla con tanta violencia que empieza a agrietarse.

          "¡Maldición, está haciendo trampas otra vez!", digo al ver al sabio salir volando hacia el cielo.

          "Creo que puede que tengamos problemas mayores de los que ocuparnos ahora mismo", dice Daren, esforzándose por volver a ponerse en pie debido a la violencia del terremoto.

          Pronto, las grietas del suelo se agrandan y la propia tierra empieza a partirse en dos, creando ante nuestros ojos un abismo enorme y sin fondo. Y por si eso no bastara, grandes pedazos de roca empiezan ahora a ser arrancados de debajo de nuestros pies, dejándonos sin suelo sobre el que sostenernos y haciéndonos caer al gran abismo de abajo.
