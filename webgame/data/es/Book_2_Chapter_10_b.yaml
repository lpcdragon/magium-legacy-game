  - name: b2_ch10b_empty
    texts:
      - source: scene_text
        paragraph: 51
        text: |-
          "¡Buena idea!", dice Daren. "¿Pero qué pasa con el sabio y el maestro Nolderan? A lo mejor todavía están acechando por aquí en alguna parte."

          "Nah, los dos se han ido", dice Arraka. "Y también sus otros aliados con los que estaban peleando antes. Si yo no puedo sentirlos, entonces deben de haberse teletransportado a su base de verdad. Ya saben... la que no es solo una zona vacía con una mesa de piedra en medio..."

          "Seguramente tengas razón", dice Daren. "Vamos, pongámonos en marcha y seguiremos hablando por el camino."

          Mientras nos alejamos de la zona del campamento, vemos que los magos que antes recogían piñas también han desaparecido. Debieron de salir corriendo al ver al gigante de piedra. ¿Y quién podría culparlos? No es que uno vea algo así todos los días.

          "Así que, solo para asegurarme de que todos estamos en la misma página...", dice Melindra mientras caminamos por el bosque vacío. "Ustedes no quieren lanzarme ninguna clase de hechizo para arreglar mi problema con el control de mis poderes..."

          "Así es", dice Daren.

          "Y quieren que siga evitando todas sus batallas, igual que antes?...", pregunta Melindra.
      - source: scene_text_2
        paragraph: 35
        text: |-
          "Exactamente", dice Daren.

          "Vale, voy a ser sincera", dice Melindra. "Esto me sigue sonando un poco sospechoso. Pero supongo que tendré que confiar en tu palabra por ahora... Quiero decir, al fin y al cabo vi con mis propios ojos cómo hielitos se puso de mi parte contra el sabio..."

          "Ah, así que lo viste...", dice Kate, un poco incómoda.

          "Bueno, técnicamente no podía girar mucho la cabeza en ese momento, así que sobre todo lo oí pasar, pero sí...", dice Melindra. "Por un momento casi pensé que estaba alucinando. De todas las personas de las que habría esperado que atacaran primero al sabio en esa situación, Kate habría sido la última que me habría venido a la cabeza."

          "Me... acabas de llamar por mi nombre de verdad...", dice Kate, muy sorprendida.
      - source: scene_3
        paragraph: 24
        text: |-
          "Supongo que sí, hielitos", dice Melindra con una leve sonrisa. "Supongo que sí..."

          "Entonces, ¿hacia dónde vamos?", dice Daren.

          "Seguiremos recto unas horas más, hasta llegar a un pequeño lago", dice Melindra. "Allí descansaremos un poco y luego les enseñaré el resto del camino."
