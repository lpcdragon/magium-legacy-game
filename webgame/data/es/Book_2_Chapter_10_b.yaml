  - name: b2_ch10b_misinterpreting
    routes:
      - condition: b2_ch10_target = 0
        texts:
          - source: scene_text
            paragraph: 50
            text: |-
              "Como desees, sabio Talmak...", dice el elfo, y entonces empieza a lanzar un hechizo de teletransporte sobre sí mismo y sobre todos sus aliados.

              Cuando oye al elfo, Melindra también le envía unas cuantas cuchillas, pero el mago levanta una barrera delante de sí que desvía todos sus ataques.

              "¡No!", grita la banshee, mientras su cuerpo empieza a vibrar y a brillar con una luz intensa, y lo mismo les sucede a todos sus compañeros. "¡No me lleven con ustedes! ¡Déjenme aquí, maldita sea! ¡Todavía no he acabado con...!"

              Antes de que pueda terminar lo que iba a decir, la banshee es teletransportada fuera de la zona, y lo mismo les ocurre a Talmak, Nolderan y el elfo. En cuanto nuestros enemigos desaparecen, Melindra disipa todas sus cuchillas de viento y empieza a descender hacia nosotros, mientras Flower también vuela hacia aquí.

              "Vaya...", dice Daren cuando Melindra se acerca a nosotros. "Eso ha sido... realmente impresionante."

              "Buen intento, sanador", dice Melindra cuando aterriza en el suelo junto a nosotros. "Pero creo que ambos sabemos que no es eso lo que de verdad estás pensando ahora mismo. Ahora que el secreto ya ha salido a la luz y sabes los problemas que tengo para controlar mis poderes, ya debes de estar pensando en estrategias para evitar volver a quedar en una situación tan peligrosa, ¿verdad?"

              "Sí, supongo...", dice Daren, confundido. "Pero no veo por qué..."
          - source: scene_text_2
            paragraph: 34
            text: |-
              "Entonces déjame preguntártelo directamente...", dice Melindra. "¿Estás, o no estás, planeando lanzarme algún hechizo que limite mis poderes?"

              "¿Qué?...", dice Daren. "¡No! ¡Claro que no! ¿Pero qué estás diciendo? ¿Sabes lo arriesgado que sería intentar lanzarte un hechizo así teniendo en cuenta la naturaleza de tu aura stillwater? Podrías incluso morir por algo así. ¡Jamás se me ocurriría lanzarte un hechizo de ese tipo!"

              "¿No lo harías?...", dice Melindra, ligeramente desconcertada.

              "Escucha", dice Daren. "Creo que empiezo a entender por qué nunca nos hablaste de tu problema. Y no te culpo por ello. No es que empezáramos nuestra relación con muy buen pie, y no tenías razones para confiar en nosotros, igual que nosotros no confiábamos en ti. Pero, por lo que vale, creo que tomaste la decisión correcta. No deberías arriesgarte a unirte a ninguna de nuestras batallas a menos que no tengamos absolutamente ninguna otra forma de lidiar con nuestros enemigos. Cualquier otro tipo de estrategia sería demasiado arriesgado."

              "Estoy de acuerdo", dice Kate. "Aunque no nos pusiera en peligro inmediato, el más mínimo rasguño de una de sus cuchillas de viento podría bastar para que se activara el juramento y la matara allí mismo. Mientras no haya otro sabio esperándonos a la vuelta de la esquina, deberíamos poder manejar cualquier situación por nuestra cuenta, igual que hemos hecho hasta ahora."
          - source: scene_3
            paragraph: 23
            text: |-
              Luego se vuelve hacia Melindra con una mirada vacilante en los ojos.

              "Y me gustaría decir que... siento haber malinterpretado algunas de tus intenciones durante los últimos días", dice Kate. "Ahora entiendo que solo intentabas velar por ti misma y que no pretendías hacernos daño."

              "Barry, ¿qué les hiciste?", me pregunta Melindra, mirándome un poco aterrada. "¡No se comportan como ellos mismos! ¿Tu dispositivo de estadísticas tiene algún hechizo que afecte a la mente y que yo no conozca?"

              "Solo están intentando ser amables, Melindra", digo. "No hace falta que te sorprendas tanto. Además, ¿podríamos alejarnos de este campamento? Tengo la sensación de que vamos a empezar a recibir ataques de un centenar de subordinados recolectores de piñas si nos quedamos aquí mucho más tiempo..."
