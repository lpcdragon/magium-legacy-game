          - set:
              current_scene: b2_ch10b_fascinated
  - name: b2_ch10b_confirm
    texts:
      - source: scene_text
        paragraph: 12
        text: |-
          "Vamos, ¡saquémosla de ahí!", dice Flower.

          "Espera", digo. "Primero quiero asegurarme de que los otros magos siguen ahí dentro. Si ya salieron, podrían estar escondidos detrás del tornado para tendernos una emboscada cuando nos acerquemos."

          "Vale, ¡pero démonos prisa!", dice Flower. "No sé cuánto aguantará Melindra respirando dentro de ese torbellino..."

          Nos lleva unos veinte segundos, pero al final logramos localizar a nuestros seis enemigos y confirmamos que efectivamente siguen dentro del tornado. Una vez seguros de que no nos espera ninguna emboscada, nos acercamos todo lo posible al torbellino y entonces llamo a Melindra.

          "¡Melindra!", grito cuando el tornado la hace girar hacia nuestro lado. "¿Puedes estirar las manos hacia nosotros en la próxima vuelta?"

          Parece que Melindra está aguantando la respiración, así que en vez de responderme asiente con la cabeza. Esperamos a que dé una vuelta completa alrededor del tornado y, cuando vuelve a quedar justo delante de nosotros, Melindra extiende los brazos en nuestra dirección y Flower y yo agarramos uno cada uno para sacarla rápidamente. Después de volar con ella unas decenas de pies más, para asegurarnos de que ya estamos lo bastante lejos del ciclón, nos detenemos un momento para que recupere el aliento.
