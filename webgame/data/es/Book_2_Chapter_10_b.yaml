        achievement:
          id: ac_b2_ch10_stalker
          title: Acechador detectado
        condition: ch4_spared_dave = 1
    routes:
      - condition: b2_ch10_activate = 1
        texts:
          - source: scene_text
            paragraph: 53
            text: |-
              Decido sacar el dispositivo y activar el código secreto que Melindra me enseñó hace unos días, tal como me pidió el revenant. Cuando termino, vuelvo a guardarlo en el bolsillo y sigo caminando junto a los demás.

              "¿Era otra vez el revenant?", pregunta Daren mientras se acerca a mí. "¿Qué quería?"

              "Quería que introdujera mi código secreto en el dispositivo de estadísticas para agudizarme el oído", digo. "No veía realmente ninguna razón para no hacerlo, así que hice lo que dijo."

              "Huh...", dice Daren. "Bueno, espero de verdad que esto no sea algún tipo de trampa."

              "No lo creo", digo. "Quiero decir, este código solo me agudiza el oído durante un rato corto. No veo qué..."

              Mientras hablaba, de repente me di cuenta de algo que no había notado antes. Según Melindra, el código secreto solo debería haber mejorado mi audición durante unos segundos, pero por alguna razón sigue estando mejor que antes de que usara el código. ¿Habrá usado el revenant algún tipo de truco?
          - source: scene_text_2
            paragraph: 36
            text: |-
              "¿Qué pasa, Barry?", dice Daren. "¿Por qué has dejado de hablar?

              "La estadística de audición...", digo. "Sigue aumentada. Se suponía que tenía que volver a su nivel original al cabo de unos segundos, pero por alguna razón eso no ha pasado."

              "Bueno, quizá tu dispositivo esté roto o algo", dice Daren.

              "No lo sé...", digo. "Siento que eso sería una coincidencia demasiado grande."

              De repente, empiezo a oír a Illuna hablando con Arraka al final del grupo.

              "Arraka, ¿queda algún mago en esta zona aparte de nosotros?", dice Illuna.
          - source: scene_3
            paragraph: 25
            text: |-
              "¿Magos?", dice Arraka. "No, ningún mago..."

              "¿Qué quieres decir con que ningún mago?", le pregunta Illuna. "¿Estás diciendo que hay alguien más? ¿Monstruos? ¿Animales?"

              "Tal vez", dice Arraka.

              "Últimamente de verdad estás empezando a sacarme de quicio...", dice Illuna.

              Justo cuando Illuna termina de hablar, noto que el viento lleva un buen rato sin soplar. Tampoco oigo ningún sonido procedente de fuera de nuestro grupo y, ahora que miro un poco más de cerca a mi alrededor, veo que hay unos cuantos insectos flotando en el aire como si se hubieran quedado congelados. Ay, madre... Creo que empiezo a entender qué está pasando aquí.

              Antes de que llegue a terminar mi hilo de pensamiento, Hadrik es quien da en el clavo al plantearnos una pregunta a todos.

              "Llevo un rato preguntándome algo... quizá ustedes puedan aclarármelo", dice Hadrik. "¿A alguien más le parece que el tiempo está congelado? ¿O soy solo yo?..."
            condition: ch4_spared_dave = 0
          - source: scene_3
            paragraph: 26
            text: |-
              "¿Magos?", dice Arraka. "¡Oh, sí, hay uno! Es el mismo tipo que lleva siguiéndonos invisiblemente desde lejos desde que estábamos en nuestro campamento esta mañana."

              "¿Qué?!", dice Illuna. "¿Hay alguien siguiéndonos desde esta mañana? ¿Por qué no nos lo dijiste?"

              "Bueno, no es que tenga ninguna posibilidad de derrotarlos a ninguno de ustedes", dice Arraka. "Hasta el medio lessathi podría vencerlo con las manos atadas a la espalda. Tenía curiosidad por ver de qué iba el asunto, así que lo dejé estar un rato."

              "Sabes que últimamente de verdad estás empezando a sacarme de quicio...", dice Illuna.

              Justo cuando Illuna termina de hablar, noto que el viento lleva un buen rato sin soplar. Tampoco oigo ningún sonido procedente de fuera de nuestro grupo y, ahora que miro un poco más de cerca a mi alrededor, veo que hay unos cuantos insectos flotando en el aire como si se hubieran quedado congelados. Ay, madre... Creo que empiezo a entender qué está pasando aquí.

              Antes de que llegue a terminar mi hilo de pensamiento, Hadrik es quien da en el clavo al plantearnos una pregunta a todos.

              "Llevo un rato preguntándome algo... quizá ustedes puedan aclarármelo", dice Hadrik. "¿A alguien más le parece que el tiempo está congelado? ¿O soy solo yo?..."
            condition: ch4_spared_dave = 1
