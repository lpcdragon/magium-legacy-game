          "Tal vez podrías intentar usar tu espada para absorber las cuchillas de viento."

          "Se me había ocurrido", dice Daren, "pero no sé si sería lo bastante rápido como para atrapar una, y si fallo podría arriesgarme a que me cortaran el brazo..."

          "¿Y si sacas la espada a través de la barrera mágica, pero dejas el brazo dentro?", digo. "Puedes hacer eso, ¿no?"

          "Sí", dice Daren. "Supongo que podría intentarlo."

          "Oí lo que estabas diciendo sobre mí antes, ¿sabes?", le grita Melindra al sabio desde lo alto del cielo, con un tono de voz bastante calmado. "Te oí hablar de cómo necesitabas mantenerme con vida mientras me diseccionabas. Tienes mucho valor para hablar así de una stillwater, ¿no te parece?"

