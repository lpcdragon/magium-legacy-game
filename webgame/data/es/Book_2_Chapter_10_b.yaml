      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch10b_recruited
  - name: b2_ch10b_recruited
    texts:
      - source: scene_text
        paragraph: 6
        text: |-
          "¡No seas tonto, muchacho!", dice Nolderan. "Esta es una oportunidad única en la vida. Nunca volverás a tener una oportunidad así. Por una vez en tu vida, usa ese cerebro oxidado que tienes y piensa."

          "Creo que estoy empezando a entender qué está pasando aquí", dice Daren. "No fue por accidente que encontraste nuestro campamento, ¿verdad, maestro Nolderan? Ya sabías que yo estaría allí, y el sabio te envió para traerme aquí y ofrecerme este trato. Creí haber dejado bastante claro que no me convertiría en tu lacayo cuando no respondí a tu carta, sabio Talmak. ¿Por qué sentiste la necesidad de hacerme esta oferta otra vez?"

          "¿Ya te había hecho esta oferta antes?", pregunta Hadrik, sorprendido.

          "Sí", dice Daren. "Me envió una carta poco después de que se anunciara el torneo. Supongo que el maestro Nolderan debió de recibir una carta parecida también. Solo que él sí la aceptó."

          "¿Por qué no eres sincero conmigo, Daren?", dice Talmak mientras da otro trago a su botella. "¿Por qué no me dices la verdadera razón por la que no quieres unirte a mí? ¿Quién logró reclutarte antes que yo? ¿Fue Azarius? Nolderan me dijo que siempre lo habías admirado. Pero yo puedo ofrecerte más de lo que Azarius podría ofrecerte jamás. No tienes idea de la cantidad de conocimiento a la que accedes cuando te conviertes en sabio. Hay tantos libros que no se muestran al público general. Tantas zonas restringidas. Podría darte acceso a todo eso. Y lo único que te pido a cambio es que te unas a mi equipo y me ayudes a ganar el Magium. Demonios, hasta extenderé la oferta a todos tus amigos, si quieres. Solo tienes que decir que sí."
      - source: scene_text_2
        paragraph: 4
        text: |-
          "¡No me reclutó Azarius!", dice Daren. "¿Es que no lo entiendes? ¡Vine aquí por mi cuenta! Vine porque estoy cansado de viajar por el mundo tratando de salvar a la gente mientras miles de otros mueren en algún otro lugar al que no puedo llegar. Por mucho que entrenara o por mucho que me esforzara, nunca era suficiente. No podía salvarlos a todos. Pero una vez consiga el Magium, quizá por fin pueda alcanzar mis sueños..."

          "¡Muchacho, se te ha ido la cabeza!", grita Nolderan. "¿Me estás diciendo que todavía te aferras a esos ideales tuyos tan necios de cuando aún eras mi alumno? ¿Cuándo vas a madurar de una vez y aceptar la realidad?"

          "¿Madurar?...", dice Daren. "¿Y luego qué? ¿Convertirme en el perro faldero de Talmak, como hiciste tú? ¿Qué te pasó? ¿Qué le pasó al maestro que yo conocía, un hombre orgulloso que era feliz y se sentía realizado enseñando artes marciales y encantamiento para ganarse la vida? ¿Qué le pasó a ese hombre que jamás doblaría la rodilla ante nadie, sin importar su posición social ni su fuerza?"

          "Ese hombre murió hace mucho", dice Nolderan. "Murió después de que perdí mi estatus de sabio y de que todos me abandonaran, obligándome a trabajar como mercenario. Pero esta vez es distinto. Ya no estoy trabajando por migajas. Si tenemos éxito aquí, por fin podría enderezar mi vida. Y tú también podrías, si dejaras de aferrarte con tanta terquedad a esos ideales infantiles que has tenido desde que te conocí por primera vez."
      - source: scene_3
        paragraph: 4
        text: |-
          "Parece que mi antiguo maestro de verdad ha muerto...", dice Daren, negando con la cabeza, decepcionado. "Pero mis ideales no. Lamento decir que voy a rechazar tu oferta una vez más, Sabio del Norte."

          "Seguro que estás bromeando...", dice Talmak. "No puedes estar pensando en serio que tienes alguna posibilidad de ganar este torneo por tu cuenta, cuando hay cuatro sabios compitiendo contra ti... No puede ser que alguien sea tan ingenuo."

          "Habla en serio", dice Nolderan. "Se le nota en los ojos. Es la misma mirada que tenía cuando me dijo por primera vez por qué quería convertirse en mi discípulo. No ha cambiado ni un poco desde entonces..."

          "No, esto no puede ser posible...", dice Talmak, incrédulo. "Me niego a creer que esto esté pasando de verdad... ¡Alguien tiene que hacer entrar en razón a este hombre! ¡Tú! El que no tiene poderes mágicos. No sé si eres el sirviente de Daren o su consejero, pero pareces un hombre sensato. ¡Intenta hacerle entrar en razón! ¡Por favor!"
    choices:
      - position: 1
        text: Sí, Daren, deberías abandonar el torneo. Así tengo menos competencia.
        effects:
          - set:
              current_scene: b2_ch10b_compete
              b2_ch10_advisor: 0
      - position: 2
        text: ¿El sirviente de Daren? ¿Tienes idea de cuántas veces le salvé el pellejo a este tipo?
        effects:
          - set:
              current_scene: b2_ch10b_compete
              b2_ch10_advisor: 1
      - position: 3
        text: ¿Alguna vez te dijeron que tus secuaces enanos dan más miedo que tú?
        effects:
          - set:
              current_scene: b2_ch10b_compete
              b2_ch10_advisor: 2
  - name: b2_ch10b_compete
    routes:
      - condition: b2_ch10_advisor = 0
        texts:
          - source: scene_text
            paragraph: 7
            text: |-
              "Sí, Daren, deberías abandonar el torneo. Así tengo menos competencia."

              "No te librarás de mí tan fácilmente, oportunista de mierda", dice Daren con una sonrisa.

              "¿Se supone que esto es algún tipo de broma?", dice Talmak. "Por favor, díganme que no están planeando en serio participar también ustedes en este torneo contra mí..."

              "No es una broma...", dice Kate. "Míralos bien y verás en sus ojos que no están fanfarroneando. De verdad han venido ambos aquí para ganar el torneo."

              Tras oír las palabras de Kate, Talmak no deja de girar la cabeza entre Daren y yo, mirándonos a cada uno por turno, como si sencillamente se negara a creer lo que está ocurriendo ante sus ojos. Cuando por fin entiende que hablamos totalmente en serio, pierde por completo los estribos y la cara se le deforma en un gruñido.
          - source: scene_text_2
            paragraph: 5
            text: |-
              "¿Competirías contra mí?", grita Talmak furioso, levantándose de la silla y mirándome directamente. "¿CONMIGO? ¿Con el Sabio del Norte?"

              Entonces deja de reprimir su poder mágico y, por un instante, siento como si la intensidad de su aura me golpeara de lleno en la cara.

              "Para tratarse de una presencia intimidante, he visto mejores", digo una vez me recupero de la conmoción inicial.

              "¿Creen que esto es un juego?", dice Talmak, con los ojos todavía rebosantes de furia. "¿Creen todos ustedes que esta oferta que les hice es algo que pueden rechazar sin más? ¿Son incapaces de entender la situación en la que están?"

              "Creo que todos entendemos muy bien nuestra situación, sabio Talmak", dice Daren con tono serio. "A juzgar por las miradas aterradas que nos dirigían esos magos de fuera cuando nos vieron viajar junto a Nolderan, apostaría a que también los amenazaste del mismo modo, y que esa es la verdadera razón por la que tienes a tanta gente trabajando para ti. Pero ese tipo de tácticas no van a funcionar conmigo."
          - source: scene_3
            paragraph: 5
            text: |-
              "¿Ah, sí?", dice Talmak, calmándose un poco. "Bueno, Nolderan, espero que no me odies demasiado si mato a tu antiguo discípulo. A estas alturas, sencillamente no me está dejando otra opción."

              "El muchacho eligió este camino por su cuenta", dice Nolderan. "Se le dieron oportunidades de sobra para entrar en razón, pero no quiso escuchar. Me entristece que hayamos llegado a esto, pero no hay otra manera."

              "Es bueno ver que todavía te importa, maestro Nolderan", dice Daren con una mirada sombría en los ojos.

              "¡Estos dos necios ya han sellado su destino!", grita Talmak, volviéndose hacia el resto de nuestro equipo. "Pero los demás no tienen por qué morir junto con ellos. Si se unen a mi bando ahora, se les permitirá vivir."
        choices:
