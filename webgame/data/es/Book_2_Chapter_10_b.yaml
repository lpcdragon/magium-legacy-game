  - name: b2_ch10b_denied
    texts:
      - source: scene_text
        paragraph: 10
        text: |-
          "Eso es muy generoso por tu parte", dice Hadrik con una sonrisa. "Pero me temo que voy a tener que rechazarlo."

          "¿Y ustedes, banshees?", pregunta Talmak mientras mira a Kate y a Flower por turnos. "¿Van a quedarse del lado de su amigo y dejarse masacrar, o escogerán la opción sensata y vivirán?"

          "No vine aquí para convertirme en mercenaria", dice Kate. "No eres el primer adversario poderoso que nos amenaza desde que llegamos a Varathia, y no serás el último."

          "Una banshee me ha rechazado, pero aún queda una...", dice Talmak. "¿Qué dices, niña? ¿También vas a tomar la misma decisión temeraria que tus amigos? ¿O elegirás el bando ganador?"

          "Creo que quizá te estés sobreestimando muchísimo, Sabio del Norte", dice Illuna con tono desdeñoso.

          Talmak se ríe.

          "Entonces morirán todos juntos...", dice.

          "¿Pero qué pasa conmigo?", dice Melindra, fingiendo una expresión suplicante en los ojos. "¿También vas a matarme? Solo soy una doncella indefensa a la que estos guerreros estaban escoltando. No quiero morir..."

          "¿Hmm?...", dice Talmak, como si solo acabara de darse cuenta de que Melindra también estaba allí. "Oh, supongo que no hace falta que mueras con ellos si no quieres."
      - source: scene_text_2
        paragraph: 6
        text: |-
          "Entonces... ¿puedo ir a tu lado de la mesa?", pregunta Melindra.

          "Por supuesto", dice Talmak. "Y la otra chica también puede venir a este lado, si quiere."

          "Yo me quedaré aquí", escribe Leila, mientras Melindra se dirige al lado del sabio.

          Al principio, el sabio parece un poco confundido al ver la escritura azul en el aire, pero luego entiende lo que significa y se dirige a Leila directamente.

          "Como desees", le dice Talmak.

          "Debí saber que nos abandonarías en la primera oportunidad que tuvieras, traidora", le dice Kate a Melindra.
      - source: scene_3
        paragraph: 6
        text: |-
          "No te lo tomes como algo personal, maga de hielo", dice Melindra con una sonrisa ladeada, cuando llega al lado de la mesa de Talmak y se coloca a su lado. "Disfruté bastante viajando con ustedes y con su grupo. Pero ahora es hora de seguir adelante. Estoy segura de que, antes o después, encontraré a otros candidatos adecuados para escoltarme a Ollendor."

          "¡Ja, ja, ja, ja!", Arraka empieza a reírse de repente.

          "¿Qué es lo que te resulta tan gracioso?", dice Illuna.

          "¿No lo ves?", dice Arraka. "¿No ves lo que va a pasar?"

          Entonces vuelve a echarse a reír. El sabio la ignora por completo y reanuda la conversación con voz potente.

          "Bueno, parece que todos ya han elegido su bando", dice Talmak. "¿Hay algo más que quieran decir antes de que demos comienzo a esta masacre?"
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch10b_vague
  - name: b2_ch10b_vague
    texts:
      - source: scene_text
        paragraph: 11
        text: |-
          Espera un momento. Aquí hay algo que no encaja. ¿Por qué se esforzaría Melindra en darme un mensaje ambiguo si luego iba a traicionarnos? ¿Y por qué pidió específicamente unirse al lado del sabio? Si de verdad quisiera ponerse a salvo, podría haberse limitado a salir volando y dejarnos a merced de nuestro destino...

          "¿Quieres callarte de una vez y prepararte para pelear?", le dice Daren al sabio mientras alista su espada y su escudo.

          Por mucho que le dé vueltas, sigue sin cuadrar. A menos que...

          "¡Ja, ja, ja, ja!", Arraka se ríe aún más fuerte de fondo.

          "Entonces, empecemos...", dice Talmak con una sonrisa segura.

          "Sí", dice Melindra con una sonrisa ladeada. "¡Empecemos!"

          Entonces chasquea los dedos con ambas manos al mismo tiempo y, de repente, un tornado enorme la envuelve a ella y a los otros seis magos que están a su lado, lanzándolos por los aires antes de que tengan tiempo de reaccionar. Mientras el torbellino sigue haciéndolos girar sin parar, parece que la base del tornado se expande rápidamente con cada segundo.

          Así que este era su plan desde el principio... Debería haberlo sabido desde el comienzo.

          "¡Lo sabía!", dice Arraka. "Sabía que lo haría en el momento en que pidió unirse al lado del sabio. Esta chica está aún más loca que el medio lessathi. Me estoy muriendo de risa, ahahahaha!"
      - source: scene_text_2
        paragraph: 7
        text: |-
          "Pero... ¿por qué?", pregunta Kate, aparentemente en estado de shock. "¿Por qué hizo eso?"

          "¡Todos atrás!", grito. "Melindra no puede controlar bien sus poderes. Es muy posible que este tornado también nos engulla pronto si no nos alejamos."

          "¿No puede controlar bien sus poderes?...", dice Kate, confundida. "Espera, ¿por eso nunca había peleado con nosotros antes? ¿Porque corría el riesgo de herirnos por accidente?"

          "Sí", digo. "¡Ahora muévanse!"

          "Pero si tú sabías esto... entonces, ¿por qué no nos lo dijiste?", dice Kate mientras todos nos alejamos del tornado.

          "Porque me pidió que lo mantuviera en secreto", digo. "Escucha, ahora no tengo tiempo de explicarlo. Lo hablaremos con más detalle luego. Flower, tenemos que subir ahí arriba y sacar a Melindra del tornado."

          "¿Qué?...", dice Flower.

          "Nos pidió que la sacáramos después de chasquear los dedos, ¿recuerdas?", digo. "Vamos ya. ¡Tenemos que darnos prisa!"

          Levanto ambos brazos en el aire, lo que le indica a las corrientes de aire de Melindra que me despeguen del suelo. Flower activa entonces sus chorros de fuego, y ambos ascendemos mientras nos acercamos poco a poco al tornado. Tras unos segundos intentando localizar a Melindra, por fin la vemos, girando continuamente por el borde exterior del torbellino.
    choices:
      - position: 1
        text: Ve a sacarla de allí inmediatamente.
        effects:
          - set:
              current_scene: b2_ch10b_immediately
      - position: 2
        text: Confirma primero que los otros magos siguen dentro del tornado antes de sacarla.
        effects:
          - set:
              current_scene: b2_ch10b_confirm
  - name: b2_ch10b_immediately
    texts:
      - source: scene_text
        paragraph: 13
        text: |-
          "Vamos, ¡saquémosla de ahí!", dice Flower.

          Ambos volamos más cerca del tornado y, cuando estamos justo al lado de sus bordes, llamo a Melindra.

          "¡Melindra!", grito cuando el tornado la hace girar hacia nuestro lado. "¿Puedes estirar las manos hacia nosotros en la próxima vuelta?"

          Parece que Melindra está aguantando la respiración, así que en vez de responderme asiente con la cabeza. Esperamos a que dé una vuelta completa alrededor del tornado y, cuando vuelve a quedar justo delante de nosotros, Melindra extiende los brazos en nuestra dirección y Flower y yo agarramos uno cada uno para sacarla rápidamente. Después de volar con ella unas decenas de pies más, para asegurarnos de que ya estamos lo bastante lejos del ciclón, nos detenemos un momento para que recupere el aliento.
      - source: scene_text_2
        paragraph: 9
        text: |-
          "Ya era hora...", dice Melindra mientras empieza a toser por todo el polvo que inhaló dentro del torbellino.

          "Vinimos tan rápido como pudimos", digo.

          "No lo dudo", dice Melindra. "Pero aun así se siente como si hubiera pasado un millón de años ahí dentro. Al menos me alegra ver que captaste mi mensaje."

          "Sí, acabé captándolo", digo. "Aunque habría estado bien que lo hubieras dejado un poco más claro."

          "No podía arriesgarme", dice Melindra. "Puede que hubiera gente en ese grupo capaz de saber cuándo alguien miente estudiando sus auras. Necesitaba que mi traición te pareciera auténtica para que este plan funcionara."

          "¿Pero no podrías haber creado el tornado desde lejos?", digo. "¿Por qué tuviste que irte hasta su lado para hacerlo?"

          "Cuando hago un tornado tan grande como este", dice Melindra, "si no estoy justo en el centro o directamente encima, no puedo controlarlo bien."

          "¿Y ahora qué?", digo. "¿Puedes controlarlo ahora?"
      - source: scene_3
        paragraph: 7
        text: |-
          "Eso espero...", dice Melindra. "Lo difícil era crearlo, así que, mientras solo tenga que mantenerlo, debería poder... Ugh..."

          Melindra se lleva de repente una mano a la frente mientras intenta reprimir un dolor de cabeza.

          "¿Estás bien?", pregunta Flower, preocupada.

          "Estoy bien, solo que...", dice Melindra, y vuelve a interrumpirse mientras se masajea las sienes. "Solo usé demasiado poder de golpe, eso es todo. En cuanto descanse un poco, ya no debería haber ni un... Oh, no..."

          Mientras Melindra hablaba, varios pequeños torbellinos empezaron a formarse muy cerca de donde están nuestros amigos.

          "¡No, no, no!", dice Melindra, presa del pánico. "¡No puedo detener los ciclones! ¡No puedo evitar que se formen! ¡Tengo que deshacerlos todos, rápido!"

          "Solo procura no deshacer también el grande por... accidente", digo, pero antes de que termine la frase, el gran torbellino ya había desaparecido junto con todos los pequeños.
    choices:
      - position: 1
