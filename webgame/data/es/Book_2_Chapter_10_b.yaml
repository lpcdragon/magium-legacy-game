              current_scene: b2_ch10b_intensely
  - name: b2_ch10b_intensely
    texts:
      - source: scene_text
        paragraph: 41
        text: |-
          Tras una corta caminata, Talmak se detiene a una distancia de unos cien pies de Daren y lo contempla intensamente.

          Mientras el sabio y Daren se preparan para empezar su batalla, todos los demás interrumpen temporalmente lo que estaban haciendo para observar la pelea, salvo la banshee de pelo negro, que sigue persiguiendo a Flower por el aire y disparándole diversos hechizos.
    choices:
      - position: 1
        text: Animar a Daren.
        effects:
          - set:
              current_scene: b2_ch10b_cheer
      - position: 2
        text: Insultar al sabio.
        effects:
          - set:
              current_scene: b2_ch10b_insult
      - position: 3
        text: Permanecer en silencio y observar la pelea.
        effects:
