scenes:
  - name: b2_ch10b_blame
    routes:
      - condition: hearing >= 2
        texts:
          - source: scene_text
            paragraph: 2
            text: |-
              A medida que nos acercamos a nuestro destino, me doy cuenta de que no llega absolutamente ningún sonido desde el campamento, aunque con el nivel que tengo en mi estadística de Audición ya habría esperado estar oyendo hablar a la gente a estas alturas. Solo se me ocurre que deben de haber lanzado un hechizo de silencio alrededor de su base de operaciones, parecido al hechizo que Melindra lanzó cuando entró en mi tienda la otra noche.

              Cuando por fin nos acercamos lo suficiente al campamento, vemos que toda la zona que lo rodea está cercada por cuatro grandes muros de roca de unos veinte pies de altura. Por su aspecto, probablemente los creó un elementalista de tierra.

              "La entrada está allí", dice Nolderan, señalando una puerta que también parece estar hecha de piedra.

              "Vaya fortificaciones tan impresionantes tienen aquí, Nolderan", dice Hadrik.

              "Sí, tenemos un elementalista de tierra muy talentoso en el equipo", dice Nolderan. "Adelante."

              Entonces nos abre la puerta y todos entramos uno por uno. En cuanto entramos en el campamento, por fin vemos las caras de los cinco magos del equipo de Nolderan. Uno de ellos es un enano sentado en una silla de piedra detrás de una mesa de piedra, a unos doscientos pies de distancia de nosotros, mientras bebe de una botella de ale enana. Los otros cuatro están de pie detrás de él, vigilándolo como guardias personales.
          - source: scene_text_2
            paragraph: 2
            text: |-
              Cuando observamos mejor al enano, lo reconocemos casi al instante. Sería imposible no saber quién es, dado que su cara ha salido en todos los periódicos durante los últimos doce años. El mago que teníamos delante no era otro que Talmak, el Sabio del Norte.

              "¡Ja, ja, ja, ja, ja!", Arraka se echa a reír a carcajadas de repente.

              "¿Talmak?...", dice Daren, visiblemente conmocionado.

              "¿El Sabio del Norte?", pregunta Illuna, sorprendida, mirando primero a Daren y luego al enano que tenemos delante, con una expresión de absoluto desinterés en la cara. "¿ESTE es el todopoderoso sabio del que tanto hablabas?..."

              "¡Ja, ja, ja!", sigue riéndose Arraka de fondo.

              "Tú lo sabías, ¿verdad?", dice Illuna mientras agarra el amuleto de Arraka por la cadena y lo mira directamente. "¡Sabías desde el principio que uno de esos magos era un sabio!"

              "¡Claro que lo sabía!", dice Arraka, aún apenas conteniendo la risa. "¡Pero quería verles la cara cuando lo vieran con sus propios ojos! ¡¡¡Ja, ja, ja, ja, ja!!!"
          - source: scene_3
            paragraph: 2
            text: |-
              "Maestro Nolderan...", dice Daren, todavía en estado de shock. "¿Por qué no nos dijiste que el sabio estaba en tu equipo?"

              "Si te lo hubiera dicho, ¿me habrías seguido hasta aquí, muchacho?", dice Nolderan.

              "No deberías culparlo por esto, sanador con armadura", dice Talmak en voz alta, mientras deja su botella de ale enana sobre la mesa que tiene delante. "Tu antiguo maestro trabaja para mí ahora. Hace lo que yo le digo. Pero no te preocupes, no los he llamado aquí para pelear. Los he llamado porque quería hablar. Ahora acérquense. Todos. No me gusta tener que gritar para que me oigan."

              Todos intercambiamos unas miradas y luego nos preparamos para cruzar, junto con Nolderan, la gran zona vacía que separa al sabio de nosotros. Justo cuando empezábamos a caminar, Melindra nos agarra a Flower y a mí del brazo para detenernos. Cuando la miramos, vemos que tiene una expresión inusualmente seria en la cara.

              "Después de que chasquee los dedos, voy a necesitar que ustedes dos me saquen de allí", nos dice Melindra en voz baja. "¿Lo entienden?"
        effects:
          - set:
              successful_checks:
                - '[ Comprobación de audición exitosa - nivel 2 ]'
        choices:
          - position: 1
            text: Supongo que sí...
            effects:
              - set:
                  current_scene: b2_ch10b_guess
          - position: 2
            text: ¿Sacarte de dónde?...
            effects:
              - set:
                  current_scene: b2_ch10b_pull
      - condition: hearing < 2
        texts:
          - source: scene_text
            paragraph: 3
            text: |-
