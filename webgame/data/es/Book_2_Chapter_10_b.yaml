  - name: b2_ch10b_huddled
    texts:
      - source: scene_text
        paragraph: 47
        text: |-
          "¿Tu barrera funcionaría mejor si nos apiñáramos más?"

          "Sí, eso ayudaría un poco, porque tendría que cubrir menos área", dice Daren. "Vamos, acerquémonos unos a otros y haré la barrera más pequeña."

          Todos nos juntamos más alrededor de Daren y entonces vuelve a lanzar su barrera, esta vez con un área de efecto mucho más reducida.

          "Oí lo que estabas diciendo sobre mí antes, ¿sabes?", le grita Melindra al sabio desde lo alto del cielo, con un tono de voz bastante calmado. "Te oí hablar de cómo necesitabas mantenerme con vida mientras me diseccionabas. Tienes mucho valor para hablar así de una stillwater, ¿no te parece?"

          "Llegas un poco tarde, chica stillwater", le grita Talmak. "Quizá podrías haberme detenido antes de que hiciera este gólem, pero ahora ni uno de tus tornados podrá destruir lo que he creado. No sé qué pretendes hacer con esas pequeñas cuchillas giratorias tuyas, pero te aseguro que no te servirán de nada."

          "¿Ah, sí?...", dice Melindra.

          "Ya he oído bastante de tus palabras", dice Talmak. "Si no puedo usarte como experimento, entonces no tienes valor para mí. ¡Prepárate para morir!"
      - source: scene_text_2
        paragraph: 33
        text: |-
          Después de que el sabio termina de hablar, su gólem extiende rápidamente el brazo derecho hacia Melindra e intenta aplastarla con la mano. Sin embargo, en cuanto la mano trata de cerrarse alrededor de Melindra, los cientos de cuchillas de viento que giraban alrededor de ella reaccionan todas a la vez y reducen las rocas a pedacitos en cuestión de segundos.

          "No...", dice Talmak, completamente conmocionado, al mirar el brazo del gólem que tiene delante y que ahora ha perdido la mano por completo.

          "Creo que ha llegado el momento de mostrarte, sabio Talmak, por qué el aire es el más fuerte de todos los elementos mágicos...", dice Melindra, y entonces libera diez veces más cuchillas de las que tenía antes, lanzándolas todas en dirección al gigante de piedra.

          Los miles de cuchillas de viento surcan el aire a una velocidad sobrecogedora y, durante unos segundos, contemplamos un gran espectáculo de luces centelleantes mientras el sol se refleja una tras otra en cada cuchilla. El gran gigante de piedra de antes está siendo rebanado en pedazos ante nuestros propios ojos y, aunque el sabio sigue intentando arrancar varios peñascos del suelo para reemplazar algunas de las partes perdidas, esas rocas también son cortadas por la multitud de cuchillas de aire semitransparentes que Melindra no deja de enviar contra Talmak.
      - source: scene_3
        paragraph: 21
        text: |-
          Durante ese tiempo, unas cuantas cuchillas perdidas también golpean la barrera de Daren, pero por ahora parece estar resistiendo bien.

          Cuando se da cuenta de que no hay forma de que sus rocas normales resistan el bombardeo de Melindra, Talmak crea rápidamente un muro delante de sí y luego usa su magia para reforzarlo todo lo que puede.

          "¡Delvram!", le grita el sabio a su compañero elfo. "¡Sácanos de aquí, ya! ¡A este paso no duraremos ni un minuto más!"
