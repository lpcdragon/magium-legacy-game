            paragraph: 24
            text: |-
              Ya es hora de dejar de jugar y pasar a la ofensiva. Si sigo pendiente de cada roca individualmente, nunca llegaré hasta Talmak. A ver qué tal me las apaño si empiezo a correr unos cuantos riesgos más.

              Empiezo a concentrarme más en alcanzar al sabio que en esquivar peñascos y plataformas.

              Durante un tiempo esto funciona bien, pero por desgracia hay tantas rocas que me resulta imposible llevar la cuenta de todas mientras me concentro en otra cosa. Al final, uno de los peñascos me golpea directamente en la cabeza y, antes de que pueda recuperarme, quedo aplastado entre varias capas de roca, lo que hace que muera casi al instante.
