      - condition: b2_ch10_advisor = 1
        texts:
          - source: scene_text
            paragraph: 8
            text: |-
              "¿El sirviente de Daren? ¿Tienes idea de cuántas veces le salvé el pellejo a este tipo?"

              "No tantas como yo te salvé el tuyo", dice Daren.

              "¿Ah, sí?", digo con una sonrisa. "Bueno, entonces quizá deberíamos empezar a llevar la cuenta a partir de ahora. ¿Qué dices?"

              "Me parece bien", dice Daren.

              "¿De qué están balbuceando ustedes dos?", dice Talmak. "Si esta persona no es el sirviente ni el consejero de Daren, entonces, ¿a qué vino aquí?"

              "Vino aquí a ganar el Magium", dice Daren. "Igual que yo."

              "¿Se supone que esto es algún tipo de broma?", dice Talmak mientras vuelve la mirada hacia mí y me examina de arriba abajo. "Por favor, díganme que no estás planeando en serio participar también tú en este torneo contra mí..."

              "No es una broma...", dice Kate. "Míralos bien y verás en sus ojos que no están fanfarroneando. De verdad han venido ambos aquí para ganar el torneo."

              Tras oír las palabras de Kate, Talmak no deja de girar la cabeza entre Daren y yo, mirándonos a cada uno por turno, como si sencillamente se negara a creer lo que está ocurriendo ante sus ojos. Cuando por fin entiende que hablamos totalmente en serio, pierde por completo los estribos y la cara se le deforma en un gruñido.
          - source: scene_text_2
            paragraph: 5
            text: |-
              "¿Competirías contra mí?", grita Talmak furioso, levantándose de la silla y mirándome directamente. "¿CONMIGO? ¿Con el Sabio del Norte?"

              Entonces deja de reprimir su poder mágico y, por un instante, siento como si la intensidad de su aura me golpeara de lleno en la cara.

              "Para tratarse de una presencia intimidante, he visto mejores", digo una vez me recupero de la conmoción inicial.

              "¿Creen que esto es un juego?", dice Talmak, con los ojos todavía rebosantes de furia. "¿Creen todos ustedes que esta oferta que les hice es algo que pueden rechazar sin más? ¿Son incapaces de entender la situación en la que están?"

              "Creo que todos entendemos muy bien nuestra situación, sabio Talmak", dice Daren con tono serio. "A juzgar por las miradas aterradas que nos dirigían esos magos de fuera cuando nos vieron viajar junto a Nolderan, apostaría a que también los amenazaste del mismo modo, y que esa es la verdadera razón por la que tienes a tanta gente trabajando para ti. Pero ese tipo de tácticas no van a funcionar conmigo."
