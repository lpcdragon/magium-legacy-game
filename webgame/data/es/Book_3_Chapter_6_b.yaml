            paragraph: 15
            text: |-
              "Muy bien, entonces centraré mis ataques en él también".

              "Primero asegúrate de cortarle la ruta de escape", le dice Illuna a Kate.

              "Estoy en ello", dice Kate, y luego crea una gran pared de hielo reforzado detrás del embajador, cerrando el callejón por donde vino.

              Luego, Illuna hace dos largos látigos de agua y los arroja a ambos al suelo. En cuestión de segundos, los dos látigos cobran vida propia y se convierten en cobras hechas de agua, deslizándose rápidamente hacia el embajador. Mientras tanto, una larga púa hecha de hielo aparece desde el suelo detrás del embajador, preparándose para empalarlo.

              Habiendo derrotado a la serpiente de agua voladora de Illuna, el capitán rápidamente crea una barrera defensiva semitransparente alrededor de él y del embajador, que los defiende de los ataques de hielo de Kate y de las cobras de agua de Illuna por el momento.

              "¡¿Qué están mirando todos ?!" les grita el capitán a los otros guardias, mientras Flower ahora también comienza a disparar algunas flechas de fuego hacia el embajador de Ollendor y yo abro fuego contra él con mi ballesta. "¡Ayúdame a defender al embajador! ¡Ataca a estos tontos con todo lo que tienes!"

              "¡Sí, defiéndeme!" dice el embajador en voz alta pero ligeramente temblorosa, ya que comienza a entrar en pánico. "¡Defiéndeme a toda costa!"
