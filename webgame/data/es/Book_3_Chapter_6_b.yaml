              Antes de terminar mi línea de pensamiento, dos rocas más pequeñas atraviesan las barreras de Daren y Melindra con facilidad, y una de ellas me golpea en la cabeza antes de que tenga tiempo de darme cuenta de lo que está pasando.

              El impacto del golpe me rompe el cráneo en un instante, mientras mi conciencia se desvanece lentamente.
