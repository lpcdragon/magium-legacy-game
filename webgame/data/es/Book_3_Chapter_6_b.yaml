  - name: b3_ch06b_utterly
    routes:
      - condition: b3_ch6_preparing = 1
        texts:
          - source: scene_text
            paragraph: 80
            text: |-
              "Oye, Barry, ¿puedes oírnos?" Daren dice, después de tocar el transceptor.

              "¡Sí, también pude oírte la última vez que me llamaste!" dice el tipo del teletransportador. "Ustedes fueron los que no pudieron escuchar lo que estaba diciendo por alguna razón".

              "Bueno, ahora podemos oírte", dice Daren. "Con un poco de suerte, tal vez esto signifique que nuestra señal ya no está bloqueada".

              "Perdón por preguntar, pero... la última vez que llamaste te escuché hablar de que los guardias reales te tenían rodeado", dice el tipo del teletransportador. "Ya no parece que estés en una batalla, entonces, ¿qué pasó con los guardias?"

              "Los que sobrevivieron utilizaron sus dispositivos de teletransportación para regresar con su rey", dice Daren. "Gontrok los obligó a retirarse después de que matamos a su capitán".

              "¡¿El capitán de la guardia real está muerto ?!" dice el chico del teletransportador, ahora sonando completamente sorprendido.
          - source: scene_text_2
            paragraph: 60
            text: |-
              "Sí, está muerto", dice Daren. "Ahora, ¿podrías intentar teletransportarnos de regreso a la base rebelde?"

              "¡Ah, claro, por supuesto!" dice el tipo del teletransportador. "Sólo dame un poco de tiempo para captar tus señales correctamente".

              "¿Entonces simplemente vamos a dejar ir al embajador?…" nos pregunta Melindra de la nada.

              "¿El embajador?" Dice Daren, como si todavía estuviera procesando la información que Melindra le acaba de dar. "¿Todavía está aquí?..."

              "Sí, los guardias reales lo abandonaron cuando se teletransportaron con su rey, ¿recuerdas?" Melindra dice. "Todavía está escondido en la misma casa abandonada donde el capitán lo envió a refugiarse durante la batalla".

              "¡Oh sí!" dice Hadrik. "¡Ahora que lo mencionas, creo que también puedo sentir su aura! ¡No está muy lejos de nosotros!"
        choices:
          - position: 1
            text: Ve y mata al embajador.
            effects:
