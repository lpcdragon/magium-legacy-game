          - source: scene_3
            paragraph: 24
            text: |-
              "Por supuesto que no puede oírme..." dice el capitán. "Loyrang, ¿puedes... no, no importa, tus espadas no son lo suficientemente afiladas para atravesar esta pared... Embajador, me temo que tendrás que atravesar la calle principal y luego tomar ese callejón para regresar a tu refugio. ¿Entiendes?"

              "¡¿Me estás diciendo que me acerque aún más a esos asesinos mientras tú no estás allí para protegerme ?!" dice el embajador. "¿Y si me matan?"

              "No te van a matar", dice el capitán. "Están todos inmovilizados y haré una pequeña barrera móvil entre tú y ellos para protegerte mientras caminas, por si acaso. Ahora, por favor, ve a tu refugio. Ni siquiera yo puedo retenerlos así para siempre".

              "Iré", dice el embajador, "¡pero si me pasa algo, lo pagarás con tu vida! ¡Recuerda mis palabras!"

              "Debidamente anotado", dice el capitán, mientras el embajador se dirige ahora hacia la calle en la que nos encontramos, para poder llegar a su refugio.
