  - name: b3_ch06b_conditions
    routes:
      - condition: b3_ch6_air = 0 AND b3_ch6_tie = 0
        texts:
          - source: scene_text
            paragraph: 52
            text: |-
              Incluso en estas condiciones, Daren de alguna manera logra cancelar la fuerza invisible moviendo su espada muy ligeramente hacia la derecha, y luego se levanta rápidamente, corriendo hacia el capitán, mientras todas las rocas y escombros a nuestro alrededor que habían sido creados mágicamente ahora se están desvaneciendo lentamente en el aire.

              El capitán de los guardias pone ambas manos frente a él y usa su técnica de manipulación del aura para alejar a Daren, mientras usa la presión de antes para inmovilizarnos al resto nuevamente. Lo siguiente que el capitán intenta hacer es quitarle la espada a Daren, pero termina tirando de todo su brazo junto con la espada, porque el arma simplemente no se desprende de la palma de su mano.

              "¿Estás usando... manipulación del aura para pegar tu espada a tu mano?" le pregunta el capitán a Daren, algo sorprendido. "Parece que has aprendido algunos trucos desde la última vez que te vi. Sin embargo..."

              La muñeca de Daren de repente comienza a girar de una manera muy antinatural, mientras lucha por reprimir un grito de dolor. Después de unos segundos, la espada finalmente se despega de su palma y vuela hacia las manos del capitán de la guardia.

              "... cualquiera puede ver claramente que todavía eres un novato en la manipulación del aura", continúa el capitán, mientras arroja la espada de Daren mientras lo mira con disgusto. "Un pequeño giro de muñeca es todo lo que necesitas para romper tu concentración en tu nivel actual. Ahora acuéstate en el suelo, donde tú y los tuyos pertenecen".
          - source: scene_text_2
            paragraph: 34
            text: |-
              Justo después de que el capitán deja de hablar, Daren es golpeado contra el suelo por una fuerza invisible, como el resto de nosotros. Por un momento, veo la espada de Daren moverse unos centímetros mientras intenta hacerla volar de regreso a su mano, pero el dolor en su muñeca claramente le impide concentrarse adecuadamente. 

              El capitán no se da cuenta de lo que Daren está tratando de hacer y, en cambio, dirige su atención hacia Gontrok, que todavía está luchando contra Hadrik.

              "¡Gontrok!" grita el capitán. "¡Ven aquí y ayúdame a destruir esta pared de hielo detrás de mí! ¡El embajador está atrapado y no puede ponerse a salvo!"

              "Estoy un poco ocupado aquí, capitán", dice Gontrok, mientras bloquea el puño de Hadrik con su mano derecha y luego se agacha para evitar una patada en la cara.

              "Maldita sea..." dice el capitán, y ahora dirige su mirada hacia el elfo elementalista de aire. "¡Oye, Felsig! ¡Ven aquí y corta un agujero en esta pared con tu magia de viento! Y no intentes ejecutar a los criminales mientras estás en camino hacia aquí. ¡Esa es una orden!"

              "¿Qué?..." dice el elfo. "¿Por qué los querrías vivos?"

              "No lo hago", dice el capitán, "pero con la cantidad de trucos que se han sacado de la manga hasta ahora, no me sorprendería que hicieran uso de tus propias cuchillas de viento para liberarse o incluso matarte. No voy a correr ese riesgo. La seguridad del embajador sigue siendo nuestra máxima prioridad".
          - source: scene_3
            paragraph: 22
            text: |-
              "¿Qué pasa entonces con Loyrang?" dice Felsig. "¿Por qué no lo envías a ejecutar a los criminales mientras yo me ocupo del muro de hielo? ¡Este traidor no ha movido un dedo para ayudar en nuestra lucha hasta ahora, e incluso planeaba abandonar la ciudad antes de que comenzara la batalla! ¡Necesita ser enderezado! ¡Necesita mostrarnos que todavía es leal al rey y al pueblo de Ollendor!"

              "Si eso es lo que te hará venir aquí más rápido, ¡entonces está bien!" dice el capitán. "Loyrang, ve a ejecutar a esos criminales".

              "Está bien, está bien", dice Loyrang perezosamente, mientras comienza a caminar hacia nosotros muy lentamente. "Estoy en ello, jefe".

              "Ahora Felsig, ¿vas a venir aquí o no?" dice el capitán.

              "Sí, estaré allí", dice Felsig, mientras se dirige hacia el capitán, caminando a un ritmo considerablemente más rápido que Loyrang.
