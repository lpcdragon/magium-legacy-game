            paragraph: 65
            text: |-
              Después de soportar el dolor por un tiempo más, de repente siento que la presión sobre mí desaparece, ya que el capitán parece estar experimentando un dolor de cabeza muy fuerte. Cuando se da cuenta de que perdió el control de su técnica de aura, intenta empujarnos hacia abajo nuevamente, pero ya no puede hacer que la fuerza invisible sea lo suficientemente fuerte como para inmovilizarnos contra el suelo, por lo que finalmente se rinde y crea una barrera frente a él.

              "¿Un dolor de cabeza?..." dice Daren, mientras gradualmente comienza a entrar en pánico. "Kelrim, por favor no me digas que lanzaste el hechizo arriesgado del que nos hablaste antes... ¿Kelrim?..."

              "Lo siento", dice Illuna con una mirada seria en sus ojos, mientras parece haber terminado de tomarle el pulso al duende que ahora yace en el suelo, inmóvil. "Está muerto".
          - source: scene_text_2
            paragraph: 48
            text: |-
              "Daren..." dice Kate, al ver la expresión de dolor en el rostro de Daren, mientras mira el cuerpo sin vida de su amigo. "Sé que esto debe ser muy difícil para ti, pero nuestra batalla aún no ha terminado y no podemos darnos el lujo de dejar que nuestras emociones..."

              "Lo sé", dice simplemente Daren, mientras hace un esfuerzo visible por recuperar la compostura, y luego se levanta del suelo, enfrentando directamente al capitán de los guardias. "Correré hacia el capitán. Intenta cubrirme tanto como puedas".

              "Está bien", dice Kate, y comienza a disparar algunos carámbanos hacia el capitán, que son fácilmente bloqueados por su barrera.

              Luego empiezo a dispararle mi ballesta también, mientras Flower e Illuna envían sus propios proyectiles hacia él. Está claro que Kate e Illuna ya han agotado la mayor parte de su energía mágica, porque sus ataques son significativamente más débiles que antes. Flower, por otro lado, parece haber sido un poco más cuidadosa con su gasto de energía, porque su magia es tan fuerte como al principio.
          - source: scene_3
            paragraph: 34
            text: |-
              Mientras le brindamos la cobertura que solicitó, Daren corre hacia el capitán, estirando su brazo izquierdo frente a él mientras hace que su espada vuele lejos de donde fue arrojada al suelo y hacia su mano. Cuando Daren se acerca, el capitán pone ambos brazos frente a él y empuja a su enemigo hacia atrás con su fuerza invisible, sin dejarlo avanzar más.

              Por lo que puedo ver, el dolor de cabeza del capitán ya casi ha desaparecido, pero todavía parece muy cansado por todas las técnicas que ha usado hasta este punto, por lo que está invirtiendo bastante esfuerzo en tratar de mantener a Daren alejado de él.
            condition: b3_ch6_uninjured = 0
          - source: scene_3
            paragraph: 35
            text: |-
              Mientras le brindamos la cobertura que solicitó, Daren corre hacia el capitán, estirando su brazo izquierdo frente a él mientras hace que su espada se aleje del líder de la guardia real y caiga en su mano. Cuando Daren se acerca, el capitán pone ambos brazos frente a él y empuja a su enemigo hacia atrás con su fuerza invisible, sin dejarlo avanzar más.

              Por lo que puedo ver, el dolor de cabeza del capitán ya casi ha desaparecido, pero todavía parece muy cansado por todas las técnicas que ha usado hasta este punto, por lo que está invirtiendo bastante esfuerzo en tratar de mantener a Daren alejado de él.
            condition: b3_ch6_uninjured = 1
