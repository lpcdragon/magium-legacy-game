chapter_effects:
  - condition: b3_ch3_stats_unavailable = 1
    effects:
      - disable stats
  - condition: b3_ch3_stats_unavailable = 0
    effects:
      - enable stats
scenes:
  - name: b3_ch06b_rematch
    texts:
      - source: scene_text
        paragraph: 2
        text: |-
          A medida que Gontrok se acerca más y más, eventualmente todos dejamos de hablar mientras una sensación de tensión e incertidumbre comienza a llenar gradualmente el aire a nuestro alrededor. Hadrik ahora está poniendo cierta distancia entre él y nosotros, para asegurarse de que no quedemos atrapados en el fuego cruzado cuando los dos gigantes transformados comiencen a intercambiar golpes. Los siguientes veinte segundos de espera parecen casi una eternidad. 

          Cuando Gontrok finalmente entra en nuestra línea de visión, Hadrik planta sus pies en el suelo y levanta la guardia, preparándose para el impacto. Sin mostrar ningún signo de desaceleración, Gontrok sigue cargando hacia nosotros, alineándose con Hadrik hasta que llega a unos seis metros delante de él. Luego acelera repentinamente, recorriendo la distancia restante entre los dos en un abrir y cerrar de ojos, mientras prepara su puño para golpear tan fuerte como pueda.

          Hadrik bloquea el golpe con ambos antebrazos, pero el impacto del golpe aún es lo suficientemente fuerte como para enviarlo volando unos metros hacia atrás. Cuando ve que su enemigo aterriza con éxito sobre sus pies después del primer ataque, Gontrok se detiene para darle a Hadrik una sonrisa maliciosa antes de comenzar a hablar.

          "¡Estaba esperando esto!" dice Gontrok. "Espero que estés listo para nuestra revancha, Hadrik".
      - source: scene_text_2
        paragraph: 2
        text: |-
          "Más preparado de lo que crees", dice Hadrik.

          "Bueno, en ese caso, veamos qué... espera un minuto, ahí... ¡reconozco a ese duende!" Dice Gontrok, mientras señala hacia Kelrim. "Lo he visto con los rebeldes. Y si ustedes viajan con él ahora, eso significa..."

          A medida que Gontrok se da cuenta de lo que está pasando, su rostro se ilumina gradualmente de alegría.

          "¡Ja! ¡Lo sabía!" dice en voz alta, asegurándose de que todos podamos escucharlo correctamente. "Estuviste escondido bajo la ciudad todo este tiempo, ¿no? ¡Por eso no pudimos encontrarte! Estabas siendo protegido por el llamado 'rey del subsuelo' y sus hombres alegres. Le he estado diciendo al verdadero rey durante mucho tiempo que estos habitantes del subsuelo eran traidores y necesitaban ser eliminados, pero el capitán siempre encontraba una manera de defender a su antiguo discípulo y afirmar que esta sociedad subterránea de alguna manera no representaba una amenaza para nosotros. Oh, no puedo esperar a ver cómo ¡Él los defenderá ahora!"
    choices:
      - position: 1
        text: En realidad, el rey del subsuelo no es nuestro amigo. ¡Incluso nos atacó esta mañana!
        effects:
          - set:
              current_scene: b3_ch06b_underground
      - position: 2
        text: Sólo nos ofrecieron refugio temporal. No hay necesidad de involucrarlos en esto.
        effects:
          - set:
              current_scene: b3_ch06b_temporary
      - position: 3
        text: Oye, si quieres atacar al rey del subsuelo, por mí está bien. Nunca me gustó el chico.
        effects:
          - set:
              current_scene: b3_ch06b_liked
  - name: b3_ch06b_underground
    texts:
      - source: scene_text
        paragraph: 3
        text: |-
          "En realidad, el rey del subsuelo no es nuestro amigo. ¡Incluso nos atacó esta mañana!" digo en voz alta.

          "¿Así que finalmente recobró el sentido cuando se dio cuenta de quién eras?" dice Gontrok. "Bueno, eso todavía no compensa el hecho de que ha estado albergando criminales. Primero a los rebeldes y ahora a ti. Está claro que este rey del subsuelo está trabajando en contra de los mejores intereses de Ollendor, y me aseguraré de que sea castigado por ello".

          "Hola, Gontrok", dice Hadrik. "¿De verdad crees que tienes el lujo de hablar con otras personas después de haberme desafiado a una batalla?"

          "Habla en serio", dice Gontrok. "Sabes muy bien que sólo estoy jugando contigo. Ya conozco tu estilo de lucha de memoria. En este punto no hay nada que puedas hacer que me sorprenda en lo más mínimo..."

          Antes de que Gontrok termine lo que estaba diciendo, Hadrik da un rápido salto hacia adelante y aterriza exactamente frente a su enemigo. Luego, en el lapso de un segundo, Hadrik se agranda al tamaño de un humano normal y le da una patada a Gontrok en la cara, enviándolo a estrellarse contra una pared cercana.
      - source: scene_text_2
        paragraph: 3
        text: |-
          "Je..." dice Gontrok, mientras ahora se levanta, mirando al Hadrik de tamaño humano frente a él mientras se limpia la sangre de su labio superior. "Has estado cambiando de forma como enano durante tanto tiempo que casi olvidé que estas eran tus verdaderas proporciones corporales, Hadrik. Este fue un buen ataque sorpresa, te lo concedo. Entonces, ¿qué planeas hacer ahora? ¿Luchar conmigo en tu nueva forma de tamaño humano y esperar que de alguna manera sea suficiente para sacarme del juego?"

          "No", dice Hadrik. "Lo que estoy planeando hacer es esto".

          Luego corre hacia Gontrok nuevamente y finge un puñetazo en la cara, pero en lugar de seguir adelante, inmediatamente vuelve a transformarse en un enano y lo golpea en el estómago. Mientras Gontrok salta hacia un lado para poner algo de distancia entre los dos, Hadrik lo sigue y cambia su tamaño al de un humano nuevamente. Esta vez, Gontrok lo estaba esperando e intenta golpearlo en el puente de la nariz, pero lo que logra golpear es aire vacío, porque Hadrik una vez más vuelve a su forma enana y le da una patada a su oponente en la espinilla.
      - source: scene_3
        paragraph: 2
        text: |-
          Durante el siguiente medio minuto aproximadamente, Hadrik sigue cambiando su tamaño constantemente mientras lucha, para asegurarse de que su enemigo esté lo más confundido posible. Como era de esperar, Gontrok parece estar teniendo dificultades para adaptarse a un estilo de lucha tan inusual y, por primera vez desde que lo conocemos, parece que ahora está completamente a la defensiva, sin siquiera intentar asestar un golpe. Después de sufrir algunas heridas más, Gontrok se da cuenta de que necesita recuperar el control de la batalla, por lo que cambia solo su espalda a la de un puercoespín arquero, y luego se da vuelta, enviando algunas de las púas volando hacia Hadrik a una velocidad mucho mayor que la que he presenciado de los puercoespines en la arena de Thilias.

          Mientras Hadrik esquiva los primeros proyectiles, Gontrok envía más en su dirección, obligando a su enemigo a alejarse gradualmente de él, para darse un poco de tiempo para recuperar el aliento.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch06b_abysmal
  - name: b3_ch06b_temporary
    texts:
      - source: scene_text
        paragraph: 4
        text: |-
          "Sólo nos ofrecieron refugio temporal. No hay necesidad de involucrarlos en esto", digo en voz alta.

          "Temporalmente o no, sabían muy bien lo que estaban haciendo", afirma Gontrok. "El anuncio sobre la muerte del hermano del rey se hizo ayer por la tarde. La gente del metro tuvo todo el tiempo necesario para encadenarte y enviarte a nosotros si eso era lo que querían hacer. Como estás deambulando libremente con uno de los suyos, está claro que entregarte al rey nunca fue su intención".

          "Hola, Gontrok", dice Hadrik. "¿De verdad crees que tienes el lujo de hablar con otras personas después de haberme desafiado a una batalla?"

          "Habla en serio", dice Gontrok. "Sabes muy bien que sólo estoy jugando contigo. Ya conozco tu estilo de lucha de memoria. En este punto no hay nada que puedas hacer que me sorprenda en lo más mínimo..."

          Antes de que Gontrok termine lo que estaba diciendo, Hadrik da un rápido salto hacia adelante y aterriza exactamente frente a su enemigo. Luego, en el lapso de un segundo, Hadrik se agranda al tamaño de un humano normal y le da una patada a Gontrok en la cara, enviándolo a estrellarse contra una pared cercana.
