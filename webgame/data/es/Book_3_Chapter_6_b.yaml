        texts:
          - source: scene_text
            paragraph: 35
            text: |-
              Kate de alguna manera logra apartarse del camino, pero no es lo suficientemente rápida como para evitar completamente el ataque, por lo que el hombre aún puede herir ligeramente su hombro derecho antes de que esté fuera de su alcance. Aunque ahora está herida y bajo el ataque de un nuevo adversario, Kate no se olvida de su objetivo principal y sigue enviando conos de hielo al embajador para mantener la presión y no dejarlo escapar.

              Mientras el hombre de la túnica negra ahora conjura espadas de la nada y las hace volar hacia Kate, Illuna también se une a la refriega, blandiendo sus látigos de agua hacia el hombre de la túnica mientras él se teletransporta constantemente. Mientras tanto, Flower sigue enviando proyectiles de fuego hacia el capitán de los guardias para que se vea obligado a mantener su barrera en alto y no unirse a la pelea.

              De repente, de la nada, la cabeza del hombre vestido de negro se separa de sus hombros y todas las armas que flotaban en el aire ahora caen al suelo, junto con el cuerpo sin vida del hombre vestido de negro.

              Me toma unos momentos entender lo que pasó, pero tan pronto como lo descubro, empiezo a dirigirme al aire vacío frente a Kate e Illuna, en voz alta.
          - source: scene_text_2
            paragraph: 25
            text: |-
              "Ya era hora de que aparecieras, Albert", le digo. "Estaba empezando a pensar que te escapaste."

              "Un verdadero asesino sólo se revela cuando está absolutamente seguro de que conseguirá matar a su objetivo", oímos la voz de Albert desde un lugar vacío en medio de la calle.

              "Entonces, en otras palabras, ¿solo planeas ayudarnos cuando no hay absolutamente ningún riesgo para ti?" le pregunto.

              "Exactamente", dice Albert.

              "Bueno, al menos es bueno que seas honesto", le digo.

              Con el tipo de túnica negra ahora muerto, aterrizo en el suelo cerca de Kate e Illuna y doy otra mirada a todo el campo de batalla para evaluar nuestra situación actual.
