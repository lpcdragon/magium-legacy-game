        text: Continuar
        effects:
          - set:
              current_scene: b3_ch06b_crumble
  - name: b3_ch06b_crumble
    routes:
      - condition: b3_ch6_tie = 1
        texts:
          - source: scene_text
            paragraph: 10
            text: |-
              "Oye, ¿dónde está Loyrang?" dice Gontrok. "¿No debería haber estado aquí ya?"

              "Recibió el mismo mensaje que todos nosotros", dice un guardia real con orejas puntiagudas y pelo corto y rubio, que parece ser un elfo. "Si no está aquí, entonces está desobedeciendo una orden directa del rey".

              "¿No dijo que necesitaba ir a una tienda de herborista?" dice Gontrok. "Esta zona está llena de ellas. Tal vez esté en una de las tiendas y llegará aquí tan pronto como termine".

              "Deja de mentirte a ti mismo, Gontrok", dice el elfo. "Está claro que tu amigo nos traicionó".

              "¿Qué me acabas de decir?..." dice Gontrok, mientras le da al elfo una mirada amenazadora.

              "¡Hadrik!" Kate dice lo más alto que puede mientras mantiene la voz lo suficientemente baja como para no llamar la atención de los demás.

              Cuando Hadrik finalmente gira para mirar en nuestra dirección, Kate le indica que se acerque a nosotros mediante un gesto con la mano, y cuando entiende lo que quiere decir, el enano comienza a acercarse a nosotros con pequeños pasos, para no distraer a nuestros enemigos mientras siguen discutiendo.
          - source: scene_text_2
            paragraph: 7
            text: |-
              "¡¿Qué diablos está pasando aquí?!" De repente escuchamos la voz del embajador Thilias, que viene de algún lugar detrás del capitán, en el mismo callejón. "¿Qué están haciendo idiotas?"

              "Embajador, le dije que esperara en una de las casas vacías, donde fuera seguro, hasta..." dice el capitán.

              "¡Silencio, cretino!"  grita enojado el embajador, mientras ahora lo vemos acercándose al capitán de la guardia. "¿No ves a los asesinos del conde justo frente a ti? ¡¿Por qué no los matas?! ¡Deja de hablar y mátalos ahora! ¡¿Me oyes?! ¡Mátalos ahora!"

              Tan pronto como Hadrik se acerca lo suficiente a nuestro grupo, Kate envía una rápida ola de magia helada a nuestro alrededor, apuntando a todos los enemigos en nuestra vecindad. La guardia real de orejas puntiagudas logra conjurar a tiempo una barrera contra el viento, defendiéndose del ataque. El capitán endurece su aura en forma de un escudo semitransparente, que evita que tanto él como el embajador se congelen. Sin embargo, dos de los otros guardias no reaccionan lo suficientemente rápido.

              La ola de magia helada toma completamente por sorpresa a Gontrok y a un guardia real que lleva una capa roja y una capucha, convirtiéndolos a ambos en estatuas de hielo. Illuna no pierde esta oportunidad e inmediatamente conjura tres enormes serpientes de agua voladoras, como ayer, cada una de ellas persiguiendo su propio objetivo. La primera serpiente va tras Gontrok y la otra guardia real que estaba congelada.
          - source: scene_3
            paragraph: 5
            text: |-
              Justo cuando parece que el gigante está a punto de ser engullido por el agua, de alguna manera abre el hielo en el que estaba encerrado y salta fuera del camino justo a tiempo. El guardia de la capa roja, en cambio, no tiene tanta suerte. La serpiente lo traga entero y luego continúa volando, llevándolo lejos del campo de batalla.

              Mientras tanto, a las otras dos serpientes no les va tan bien. El elementalista de aire elfo parece haber creado un tornado pequeño pero muy poderoso frente a él, que está acabando rápidamente con la construcción de agua de Illuna, a pesar de su gran tamaño. En otra parte del campo de batalla, parece que el capitán de los guardias transformó una parte de su aura en una especie de espada invisible, pues está actuando como si estuviera sosteniendo un arma por la empuñadura con ambas manos, mientras corta a la serpiente de agua por la mitad.

              "Quédese detrás de mí, embajador", dice el capitán, mientras todavía corta la gran serpiente. "Me aseguraré de que no te pase nada".

              "¡Eso es todo!" Nos lo cuenta Iluna. "El embajador es su eslabón débil. Si lo atacamos específicamente, su formación se desmoronará".

              "Estoy de acuerdo", dice Kate. "Deberíamos intentar atacar al embajador con todo lo que tenemos".
