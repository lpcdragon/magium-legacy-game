              - set:
                  current_scene: b3_ch06b_tactical
  - name: b3_ch06b_tactical
    routes:
      - condition: b3_ch6_focus = 1 AND b3_ch6_selected <> 3
        texts:
          - source: scene_text
            paragraph: 60
            text: |-
              "El capitán está muerto", dice Daren. "Terminemos con el resto".

              "¡¿El capitán murió ?!" Gontrok grita desde la distancia, mientras casi se olvida de esquivar uno de los golpes de Hadrik por el impacto. "Bueno, entonces supongo que esto requiere una retirada táctica".

              "¿En serio crees que te dejaremos escapar?" Dice Hadrik, ya que ahora está duplicando la velocidad de sus ataques.

              "Estás actuando como si te estuviera pidiendo permiso..." dice Gontrok. "Ten la seguridad de que nos teletransportaremos fuera de aquí, te guste o no".
          - source: scene_text_2
            paragraph: 43
            text: |-
              "Será mejor que no estés haciendo lo que creo que estás haciendo, Gontrok", escuchamos la misma voz que habló antes con el elfo elementalista de aire, haciendo eco a nuestro alrededor, haciéndonos una vez más imposible saber de dónde viene. "Los dispositivos de teletransportación portátiles de los guardias reales sólo deben usarse cuando el rey esté en peligro".

              "¿Oh sí?" Dice Gontrok, mientras parece estar jugueteando con un dispositivo que está escondido debajo de su uniforme de guardia real, debajo de su cuello, mientras sigue corriendo lejos de Hadrik para esquivar sus ataques. "Bueno, eso no pareció impedir que el rey nos teletransportara por capricho la última vez, a pesar de no estar en ningún peligro, ¿verdad? Si el rey puede hacer mal uso de estos dispositivos libremente, yo también".

              "¡No nos retiraremos, cobarde!" dice la voz. "¡Nos quedaremos aquí y vengaremos a nuestro capitán caído!"
        choices:
          - position: 1
            text: Entonces, ¿qué tal si realmente vengas a tu capitán en lugar de esconderte como un cobarde?
            effects:
              - set:
                  current_scene: b3_ch06b_tamper
                  b3_ch6_coward: 0
          - position: 2
            text: ¿No puedes simplemente usar tu propio dispositivo de teletransportación para cancelar lo que está haciendo Gontrok?
            effects:
              - set:
                  current_scene: b3_ch06b_tamper
                  b3_ch6_coward: 1
          - position: 3
            text: ¡Sí, Gontrok, no seas cobarde! ¡Quédate aquí y lucha como un hombre!
            effects:
              - set:
                  current_scene: b3_ch06b_tamper
                  b3_ch6_coward: 2
