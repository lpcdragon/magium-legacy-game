  - name: b3_ch06b_robed
    effects:
      - set:
          ac_b3_ch6_credo: 1
        achievement:
          id: ac_b3_ch6_credo
          title: El credo de un asesino
        condition: b3_ch6_preparing = 0 AND b3_ch5_fight >= 4
    routes:
      - condition: b3_ch6_preparing = 1 AND b3_ch6_focus = 1
        texts:
          - source: scene_text
            paragraph: 34
            text: |-
              Kate logra apartarse del camino a tiempo, pero ahora el hombre vestido de negro está creando armas de la nada y haciéndolas volar hacia ella e Illuna mientras él sigue teletransportándose, agitando su daga hacia ellos. Mientras Kate está ocupada bloqueando las armas voladoras, también se asegura de mantener la presión sobre el embajador, para que no tenga la oportunidad de escapar durante toda la confusión.

              Después de esquivar los ataques del hombre vestido de negro varias veces, Illuna de repente decide dejar de moverse y se queda allí por unos segundos, mientras el hombre mueve su daga hacia ella. Al ver que ella no planea evadir su ataque, el hombre detiene su corte justo cuando estaba a punto de cortarle el brazo y luego se teletransporta junto a Kate. Al darse cuenta de lo que está pasando, Kate también deja de moverse y, mientras lo hace, el hombre de la túnica negra simplemente deja de hacer nada, mientras que sus armas voladoras también parecen estar congeladas en el aire.

              "Creo que hemos dejado que esta ilusión mal hecha nos distraiga lo suficiente", dice Illuna, mientras envía algunas lanzas de agua hacia el embajador, mientras el hombre vestido de negro se desvanece lentamente. "Sigamos atacando al embajador. Mientras el capitán deba mantener su barrera en alto, no podrá usar sus poderes para inmovilizarnos nuevamente".

              Entonces era una ilusión después de todo... Había considerado la posibilidad pero no estaba completamente seguro, ya que también era posible que Kate hubiera matado al tipo equivocado antes. Me alegra ver que lo descubrieron por sí mismos.
          - source: scene_text_2
            paragraph: 24
            text: Ahora que se ha confirmado que el tipo vestido de negro está muerto, aterrizo en el suelo cerca de Kate e Illuna y doy otra mirada a todo el campo de batalla para evaluar nuestra situación actual.
          - source: scene_3
            paragraph: 19
            text: |-
              Lo que más me llama la atención es lo que está sucediendo actualmente en el cielo. Las grandes rocas que flotaban muy por encima de nosotros se han más que duplicado en número desde la última vez que las miré. ¿Significa esto que el elementalista de la tierra ha estado creando rocas sin parar desde el comienzo de la batalla? 

              De repente, las rocas en el cielo comienzan a moverse de una manera muy inusual, como si el elementalista de la tierra se estuviera preparando para algo. Esto no pinta bien. Quizás debería contarles a los demás sobre esto.

              "Esas rocas en el cielo han comenzado a moverse", les digo a Kate e Illuna. "Creo que pronto necesitaremos algunas barreras mágicas".

              "Haré una barrera contra el viento, pero primero tendrán que acercarse un poco más", dice Melindra.

              Tan pronto como Kate, Flower, Kelrim y yo nos acercamos a cinco pies de Melindra, ella comienza a lanzar su hechizo protector y una barrera semitransparente se materializa lentamente a nuestro alrededor.

              "Prefiero seguir concentrándome en atacar al capitán hasta que falle la barrera de Melindra", dice Kate. "Lo último que necesitamos es que nos vuelva a inmovilizar mientras nos caen piedras en la cabeza".

              "¿No puedes hacer que tu cúpula de hielo sea ligeramente transparente para que puedas ver al capitán a través de ella y seguir disparándole tus carámbanos?" digo.

              "Sí", dice Kate, "pero tan pronto como empiece a concentrarme en reforzar la cúpula de hielo, mis carámbanos se debilitarán y eso podría darle al capitán la oportunidad de contraatacarnos".
        choices:
          - position: 1
            text: Yo digo que todavía vale la pena. Necesitaremos todas las defensas posibles contra tantas rocas.
            effects:
              - set:
                  current_scene: b3_ch06b_dome
                  b3_ch6_defense: 1
                condition: is_dead = 0
          - position: 2
            text: Está bien. Entonces, dejemos la cúpula de hielo como última alternativa.
            effects:
              - set:
                  current_scene: b3_ch06b_dome
                  b3_ch6_defense: 0
                condition: is_dead = 0
