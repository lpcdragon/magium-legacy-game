      - condition: toughness >= 4
        texts:
          - source: scene_text
            paragraph: 48
            text: |-
              Antes de terminar mi línea de pensamiento, dos rocas más pequeñas atraviesan las barreras de Daren y Melindra con facilidad, y una de ellas me golpea en la cabeza antes de que tenga tiempo de darme cuenta de lo que está pasando.

              El dolor que siento ahora es bastante fuerte y estoy casi seguro de que me daré un golpe en la cabeza debido a esto, pero si mi estadística de dureza fuera menor, mi cráneo podría haberse roto fácilmente, así que supongo que debería estar agradecido de estar todavía vivo.

              No debería haberme relajado tanto allí. Necesito recordar que esto todavía está en medio de un campo de batalla. Si cometo otro error como ese, puede que resulte fatal. No puedo darme el lujo de perderme en mis propios pensamientos de esta manera otra vez.

              "Barry, ¿estás vivo?" Dice Kate, sonando un poco asustada, mientras rápidamente forma una cúpula de hielo algo transparente a nuestro alrededor.

              "Estoy bien..." digo. "Me duele un poco la cabeza, pero estoy bien. Mi estadística de dureza realmente me salvó allí. Estoy muy contento de haber sumado algunos puntos".
          - source: scene_text_2
            paragraph: 31
            text: |-
              "Intentaré mantener la presión sobre el capitán mientras mantengo la cúpula, pero no será fácil", dice Kate. "No se sorprenda demasiado si logra tomar represalias pronto".

              "En realidad, Kate", dice Daren, mientras señala hacia el cielo, donde un centenar o más de enormes rocas se están preparando para caer sobre nosotros, "creo que deberías renunciar al capitán y poner todo lo que tienes en fortificar tu cúpula de hielo. Mi barrera está comenzando a alcanzar su límite, y las barreras contra el viento no son tan buenas contra las rocas, como sin duda ya te habrás dado cuenta. Además, si el elementalista de la tierra envía algunas rocas más regulares como esas dos de Antes, tu cúpula será la única defensa confiable que tengamos contra ellos".

              "Muy bien", dice Kate. "Entonces concentraré todos mis esfuerzos en la defensa. Esperemos que no nos arrepintamos de esta decisión más tarde".

              Luego comienza a verter tanta energía mágica como puede en su cúpula de hielo, volviéndola mucho más opaca en el proceso. Ahora es más difícil ver lo que sucede fuera de nuestro refugio, pero una vez que las rocas comienzan a golpear la cúpula de hielo, podemos decir fácilmente exactamente qué está sucediendo.
          - source: scene_3
            paragraph: 21
            text: |-
              Las rocas siguen apareciendo una tras otra, pero el hielo reforzado de Kate todavía se mantiene fuerte. Casi podemos sentir la frustración del elementalista de tierra, mientras sigue golpeando la cúpula en toda su superficie, tratando de encontrar algún tipo de punto débil. Incluso envía diez rocas consecutivas exactamente al mismo lugar una vez, con la esperanza de que Kate no pueda recrear y reforzar el hielo lo suficientemente rápido como para bloquearlas. Al final, ninguna de sus tácticas funciona y aunque la cúpula de Kate parece estar lista para desmoronarse en cualquier momento, las rocas del cielo ya no caen, presumiblemente porque después de todo este tiempo el elementalista de tierra finalmente se quedó sin munición.

              Justo cuando estamos a punto de relajarnos un poco, la cúpula de hielo sobre nosotros se destruye por completo y luego sentimos el aura del capitán empujándonos hacia el suelo con mayor fuerza que nunca.
        effects:
          - set:
              successful_checks:
                - '[ Comprobación de resistencia exitosa - nivel 4 ]'
              is_dead: 0
