        text: |-
          "No creo que debamos perder el tiempo con el embajador", digo. "Deberíamos centrarnos en teletransportarnos fuera de aquí mientras todavía tengamos la oportunidad".

          "De acuerdo", dice Daren. "Si esperamos aquí demasiado tiempo, podrían enviar a los aprendices de la guardia real a atacarnos, o podrían bloquear nuestra señal nuevamente. No podemos darnos el lujo de correr más riesgos".
