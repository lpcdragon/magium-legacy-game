  - name: b3_ch06b_carry2
    routes:
      - condition: b3_ch6_preparing = 1
        texts:
          - source: scene_text
            paragraph: 78
            text: |-
              "Genial", digo. "Ahora volvamos allí antes... ah, mierda. ¡Cuidado con los drones que caen!"

              Dos drones más caen del cielo y aterrizan cerca de nuestra posición, mientras todos corremos de regreso a nuestro lugar inicial. Mientras tanto, Kate conjura una pared de hielo detrás de nosotros y Daren vuelve a crear una barrera semitransparente con su escudo. Los drones explotan un poco más rápido esta vez y las llamas se derriten a través de la pared de hielo, pero el obstáculo colocado por Kate sigue siendo suficiente para evitar que alcancen el escudo de Daren. Mientras logramos bajar del cráter y regresar con éxito a nuestra ubicación original, miro al cielo una vez más para confirmar mis sospechas.

              Parece que el Supervisor todavía no puede mover sus drones. Lo único que puede hacer es arrojárnoslos y usarlos como bombas. Su sincronización con la detonación mejoró un poco en su segundo intento, pero no importa. El único dron que estaba directamente sobre esta área fue el que usó para atacarnos al principio. Ya no le quedan armas para usar contra nosotros. Por ahora, deberíamos estar a salvo.

              "Asegúrate de no salir de esta zona", les digo a todos. "No hay drones directamente encima de nosotros, por lo que el Supervisor no tendrá bombas para usar contra nosotros aquí".
          - source: scene_text_2
            paragraph: 58
            text: |-
              "¡Hombre, no pensé que el Supervisor causaría tantos estragos en su propia ciudad!" dice Hadrik. "¡Mira este lugar! ¡Es un desastre!"

              "Bueno", digo, "nos dijo que la 'rutina' que le hacía preocuparse por los ciudadanos de Varathia estaba desactivada, así que supongo que esto era de esperarse".

              "Llamaré a Barry para que nos teletransporte fuera de aquí antes de que suceda algo más", dice Daren, mientras saca su transceptor nuevamente.
        choices:
          - position: 1
            text: Continuar
            effects:
