              "¡Sin resentimientos, amigo!" Loyrang me dice en voz baja. "Al menos necesito fingir que me estoy tomando esto en serio".

              Luego intenta apuñalarme en mi hombro derecho con su espada, pero saco mi daga y de alguna manera logro sostenerla en el ángulo correcto para desviar la dirección de su golpe y hacer que él atraviese el suelo con su espada en lugar de a mí.

              "¡Oh, nunca antes había visto usar esta técnica!" dice Loyrang. "¡Impresionante!"
            condition: combat_technique >= 2
          - source: scene_3
            paragraph: 28
            text: |-
              "Loyrang, te dije que ejecutaras a esta gente, que no jugaras con ellos", grita el capitán. "Hazte a un lado, lo haré yo mismo".

              "Sí, sí, capitán", dice Loyrang, mientras ahora se aleja de nosotros de la misma manera perezosa con la que se ha movido desde que llegó aquí por primera vez.

              El capitán ahora comienza a amplificar lentamente la presión sobre nosotros, probablemente tratando de aplastarnos hasta la muerte. Irónicamente, dado que el aumento de presión también está presionando mi hombro, la mayor parte de la sangre ha dejado de salir de mi herida.

              "He estado tratando de evitar esta técnica últimamente debido a la enorme tensión que supone para mi viejo y frágil cuerpo", nos dice el capitán, "pero incluso si esto me deja fuera de servicio durante una semana entera, habrá valido la pena. Esta vez no habrá más trucos para salvaros. Lo único que os queda por hacer es quedaros ahí tumbados en silencio y aceptar vuestras muertes con dignidad".

              La fuerza invisible sobre nosotros se hace más fuerte con cada momento que pasa. El dolor se está volviendo cada vez más insoportable hasta el punto de que la mayoría de nosotros ya hemos renunciado a intentar quedarnos callados y ahora simplemente estamos gritando a todo pulmón.
            condition: combat_technique < 2
