              "¿Q-qué pasó con Kelrim?..." pregunta el tipo del teletransportador, cuando ve el cadáver del duende en los brazos de Daren.

              "Él... se sacrificó por nosotros y por la gente en la área de cuarentena", dice Daren, en tono triste. "No habríamos salido vivos de allí si no fuera por él. Todos estamos en deuda con él..."

              "Ya veo", dice el tipo del teletransportador, mientras mira hacia el suelo.

              "Llevaré a Kelrim a la sala de espera", dice Albert, mientras se acerca a Daren. "Hay mucha gente que quisiera despedirse de él, especialmente en la área de cuarentena".

              "...Asegúrate de que tenga un entierro adecuado", dice Daren, mientras le entrega el cuerpo de Kelrim a Albert con cierta vacilación.

              "Haremos lo que podamos", dice Albert, y luego toma al duende en sus brazos. "Ahora, si me disculpan, necesito ir a informar la muerte del capitán de la guardia a nuestro rey. Estoy seguro de que se sentirá aliviado y entristecido por la noticia, considerando su larga historia juntos. Nos vemos más tarde".

              Luego se vuelve invisible junto con el cadáver del duende, mientras presumiblemente regresa a la base rebelde.
