  - name: b3_ch06b_underneath
    texts:
      - source: scene_text
        paragraph: 49
        text: |-
          Antes de terminar mi línea de pensamiento, dos rocas más pequeñas atraviesan la barrera de Daren con facilidad, aunque son detenidas por la cúpula de hielo de Kate que está justo debajo.

          "¿Crees que esas dos rocas no fueron creadas mágicamente?" Kate le pregunta a Daren.

          "Sí, es casi seguro que eran rocas normales", dice Daren. "De lo contrario, no habrían atravesado mi barrera tan fácilmente".

          "Está bien", dice Kate. "Intentaré fortificar un poco más mi cúpula de hielo, en caso de que haya más rocas como esa en el próximo lote. Sin embargo, no será fácil mantener la presión sobre el capitán mientras hago esto. No te sorprendas si logra tomar represalias pronto".
      - source: scene_text_2
        paragraph: 32
        text: |-
          "En realidad, Kate", dice Daren, mientras señala hacia el cielo, donde un centenar o más de enormes rocas se están preparando para caer sobre nosotros, "creo que deberías renunciar al capitán y poner todo lo que tienes en fortificar tu cúpula de hielo. Mi barrera está comenzando a llegar a su límite, y las barreras contra el viento no son tan buenas contra las rocas, en general. Tu cúpula bien podría convertirse pronto en nuestra última línea de defensa".

          "Muy bien", dice Kate. "Entonces concentraré todos mis esfuerzos en la defensa. Esperemos que no nos arrepintamos de esta decisión más tarde".

          Luego comienza a verter tanta energía mágica como puede en su cúpula de hielo, volviéndola mucho más opaca en el proceso. Ahora es más difícil ver qué sucede fuera de nuestro refugio, pero una vez que la barrera de Daren falla y las rocas comienzan a golpear la cúpula de hielo, podemos decir fácilmente exactamente qué está sucediendo.
      - source: scene_3
        paragraph: 21
        text: |-
          Las rocas siguen apareciendo una tras otra, pero el hielo reforzado de Kate todavía se mantiene fuerte. Casi podemos sentir la frustración del elementalista de tierra, mientras sigue golpeando la cúpula en toda su superficie, tratando de encontrar algún tipo de punto débil. Incluso envía diez rocas consecutivas exactamente al mismo lugar una vez, con la esperanza de que Kate no pueda recrear y reforzar el hielo lo suficientemente rápido como para bloquearlas. Al final, ninguna de sus tácticas funciona y aunque la cúpula de Kate parece estar lista para desmoronarse en cualquier momento, las rocas del cielo ya no caen, presumiblemente porque después de todo este tiempo el elementalista de tierra finalmente se quedó sin munición.

          Justo cuando estamos a punto de relajarnos un poco, la cúpula de hielo sobre nosotros se destruye por completo y luego sentimos el aura del capitán empujándonos hacia el suelo con mayor fuerza que nunca.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch06b_conditions
  - name: b3_ch06b_retaliate
    routes:
      - condition: b3_ch6_preparing = 0 AND b3_ch5_fight < 4
        texts:
          - source: scene_text
            paragraph: 50
            text: |-
              No le doy la oportunidad de tomar represalias y le corté el cuello, haciéndolo desangrarse y morir varios momentos después. No espero para confirmar mi muerte y salgo volando de la zona de rocas, hacia el suelo lo más rápido que puedo para poder advertir a mis amigos antes de que la magia que mantiene las rocas a flote desaparezca.

              "¡Estar atento!" Grito mientras me acerco un poco al suelo, mientras las rocas sobre mí ya comienzan a caer. "¡Se acercan rocas! ¡Se acercan rocas!"

              Después de decir esto, lo primero que Kate hace es enviar un carámbano a la cabeza de la guardia real vestida de negro de ayer, quien aparentemente estaba en medio de una pelea con ella e Illuna pero se distrajo con mis gritos.
          - source: scene_text_2
            paragraph: 33
            text: |-
              Lo que sucede a continuación es que todo el campo de batalla se vuelve completamente caótico, ya que todos, excepto Hadrik y Gontrok, abandonan sus peleas actuales y se concentran únicamente en sobrevivir a los cientos de rocas que están a punto de caer sobre ellos.

              Mientras mis amigos se reúnen en un lugar y Kate construye una cúpula con hielo reforzado a su alrededor, trato de ayudar lo mejor que puedo colocándome directamente encima de ellos y cortando tantas rocas que caen como sea posible.

              Finalmente, las grandes rocas dejan de caer y todos escapan ilesos, incluidos nuestros enemigos, mientras Hadrik y Gontrok siguen luchando como si nada. Justo cuando Kate despide su cúpula de hielo, sentimos una enorme presión que viene desde arriba de nosotros, que nos empuja a todos al suelo y nos impide por completo movernos.
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch06b_conditions
