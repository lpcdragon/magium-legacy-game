            text: |-
              "Como desee, embajador..." dice el capitán, luciendo claramente disgustado.

              Luego estira su brazo derecho hacia mí y rápidamente lo baja, con su mano cerrada en un puño, como si estuviera agarrando una cuerda que está atada a mí o algo así. Ni siquiera un segundo después, una fuerza invisible me empuja hacia abajo varios metros antes de que logro liberarme y volar lo más rápido que puedo. El capitán intenta atraerme hacia él nuevamente, pero esta vez puedo sentir que el efecto de manipulación de su aura se debilita. Parece que su rango de ataque es limitado mientras mantenga la barrera. Probablemente será incapaz de usar su fuerza invisible sobre mí en unos segundos más.

              "¡Advertencia! ¡Advertencia!" Escucho la voz del Supervisor, cuyo dron de ojos verdes aparentemente todavía me sigue de cerca. "El protocolo Supervisor está detectando técnicas de manipulación del aura peligrosamente cerca de las coordenadas de esta unidad. Si no se detiene inmediatamente, esta unidad se verá obligada a pedir refuerzos".
          - source: scene_text_2
            paragraph: 23
            text: |-
              "¡¿Qué estás haciendo, tonto?!" le grita el embajador al capitán. "¡Se está escapando!"

              "Cuanto más se aleje, más difícil será atacarlo sin eliminar completamente esta barrera", dice el capitán. "Morirá pronto, no te preocupes. No hay necesidad de apresurar las cosas".

              El embajador parece estar furioso, pero por una vez guarda silencio. Después de que me retiraron una última vez, finalmente salí del rango de ataque del capitán y me dirijo de regreso hacia Kate e Illuna, donde es... ¿seguro?...
          - source: scene_3
            paragraph: 17
            text: |-
              Hmm... parece que mientras estaba ocupado con el capitán, la guardia real vestida de negro que nos tendió una emboscada ayer se teletransportó en medio del campo de batalla y comenzó a atacar tanto a Kate como a Illuna con espadas voladoras que creó de la nada. Kate y Flower todavía están atacando al capitán de los guardias con proyectiles, por lo que realmente no pueden hacer mucho contra el tipo vestido de negro, mientras que Illuna tiene problemas para golpearlo debido a su constante teletransportación.

              Ni Melindra ni Kelrim pueden hacer mucho para ayudarlos tampoco, y Daren está ocupado manteniendo una barrera mágica que los defiende a él y a Leila de los ataques del elfo elementalista del aire, por lo que no puede intervenir. A ver si puedo ayudar un poco.

              Decido cambiar ligeramente la dirección de mi vuelo, tratando de terminar de alguna manera detrás del mago de túnica negra para tomarlo por sorpresa.
        choices:
