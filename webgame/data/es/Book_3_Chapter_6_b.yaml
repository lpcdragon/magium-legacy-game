            paragraph: 6
            text: |-
              "¡Dreymarr!" Grita el capitán, mientras todavía lucha por mantener su barrera. "¿Sigues vivo? ¡Contéstame!"

              El hombre vestido de negro permanece en completo silencio, y no es de extrañar. Dada la cantidad de conos de hielo que lo empalaron, debió morir casi instantáneamente.

              "Daren, Leila, intentemos luchar juntos contra el elementalista del aire", digo, mientras estoy flotando ligeramente sobre el suelo. "Cargaré contra él primero, para crear una abertura, y luego ustedes podrán ir a matar".

              "Entendido", escribe Leila.

              "¿No crees que tal vez debería ir primero?...", dice Daren.

              "No", digo. "¡Tengo esto!"

              Luego vuelo en dirección al elementalista de aire, quien por alguna razón no se ha movido de su lugar desde el comienzo de la batalla.
