    routes:
      - condition: ancient_languages < 2
        texts:
          - source: scene_text
            paragraph: 20
            text: |-
              Mientras estoy ocupado evadiendo las Cuchillas de viento semitransparentes, de repente escucho la voz de un hombre haciendo eco a nuestro alrededor, aunque es difícil determinar con precisión el lugar exacto de donde proviene.

              El idioma en el que habla la voz parece ser algún dialecto élfico, porque el elementalista de aire elfo responde y poco después lanza una poderosa ráfaga de viento que nos aleja a todos de él.

              Luego, el elfo comienza a cantar algo, mientras mueve sus manos en círculos. Unos segundos después del canto, una gran hidra con seis cabezas, hecha enteramente de viento, aparece frente a nosotros, bloqueando nuestro camino hacia el elementalista de aire. Aunque técnicamente el monstruo está hecho de aire, aún podemos decir que se supone que es una hidra debido a la forma en que la luz del sol se refleja en su superficie.

              "¡Todos retrocedan!" dice Daren. "Intentaré ver si puedo absorber el elemento aire de la hidra con mi espada".
          - source: scene_text_2
            paragraph: 11
            text: |-
              Hacemos lo que dice Daren y luego carga contra la hidra, blandiendo su espada tan fuerte como puede. Desafortunadamente, en lugar de absorber nada, la espada simplemente atraviesa la hidra semitransparente como si estuviera usando un arma normal para cortar aire no mágico.

              "¡Maldita sea, no funciona!" dice Daren. "Vuelve de la hidra. ¡Vuelve ahora!"

              Daren se aleja de un salto cuando dos de las cabezas de la hidra se abalanzan hacia él y todos nos distanciamos de la gran criatura sin sufrir daño. Parece que la hidra no planea seguirnos, pero tampoco nos deja acercarnos al elfo. Ahora que el elfo está a salvo de nuestros ataques decide retomar su táctica anterior de lanzarnos cuchillas de viento hasta golpear a alguien. Mientras esquivo nuevamente en el aire, Daren me llama desde abajo.

              "Barry, Leila, venid a esconderos dentro de mi barrera por ahora", dice. "No sirve de nada cansarse así hasta que hagamos otro plan de ataque".

              Leila y yo aceptamos gentilmente la oferta de Daren y después de evadir algunos ataques más del elfo, logramos movernos dentro de la barrera de Daren de manera segura.
          - source: scene_3
            paragraph: 13
            text: |-
              "¿Qué estás haciendo, traidor?" le dice el elfo a Loyrang, que está junto a él y parece muy aburrido. "¿Por qué no los atacas?"

              "Eh... realmente no tengo ganas de hacer eso ahora", dice Loyrang. "Tal vez más tarde."

              "¡El rey se enterará de esto!" dice el elfo. "¡Recuerda lo que te digo!"

              "Está bien", dice simplemente Loyrang.

              El elfo sigue atacándonos por un tiempo, pero afortunadamente la barrera de Daren parece resistir bien y no corre ningún peligro de fallar. Mientras estamos allí, tratando de decidir qué hacer a continuación, el hombre con túnica negra que nos tendió una emboscada ayer de repente se teletransporta detrás de Kate, intentando apuñalarla con un cuchillo.
