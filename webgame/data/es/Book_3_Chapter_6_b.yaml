              - set:
                  current_scene: b3_ch06b_dome
                  b3_ch6_defense: 0
                condition: is_dead = 0
      - condition: b3_ch6_preparing = 0 AND b3_ch5_fight < 4 AND b3_ch6_focus = 1 AND aura_hardening < 3
        texts:
          - source: scene_text
            paragraph: 36
            text: |-
              Kate de alguna manera logra apartarse del camino, pero no es lo suficientemente rápida como para evitar completamente el ataque, por lo que el hombre aún puede herir ligeramente su hombro derecho antes de que esté fuera de su alcance. Aunque ahora está herida y bajo el ataque de un nuevo adversario, Kate no se olvida de su objetivo principal y sigue enviando conos de hielo al embajador para mantener la presión y no dejarlo escapar.

              Mientras el hombre de la túnica negra ahora conjura espadas de la nada y las hace volar hacia Kate, Illuna también se une a la refriega, blandiendo sus látigos de agua hacia el hombre de la túnica mientras él se teletransporta constantemente. Mientras tanto, Flower sigue enviando proyectiles de fuego hacia el capitán de los guardias para que se vea obligado a mantener su barrera en alto y no unirse a la pelea.

              "Parece que Kate e Illuna están teniendo problemas con ese tipo que se teletransporta", les digo a Daren y Leila. "Iré a ver si puedo ayudar un poco".

              Antes de que Daren y Leila tengan la oportunidad de responder, me alejo de ellos y me dirijo directamente hacia el hombre de la túnica negra, con la esperanza de tomarlo por sorpresa. Lo que sucede en cambio es que él es quien me sorprende, porque tan pronto como me acerco lo suficiente a él se teletransporta justo en frente de mí y dispara un chorro de ácido desde su palma izquierda, apuntando a mi cuello.
          - source: scene_text_2
            paragraph: 26
            text: El ácido casi de inmediato se derrite a través de mi piel y músculos, causándome una gran cantidad de dolor y al mismo tiempo me quedo incapaz de respirar. Después de unos momentos más agonizantes, finalmente empiezo a perder el sentido, mientras sucumbo lentamente a mi muerte.
