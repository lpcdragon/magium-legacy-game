              "¡Hola, Daren, Leila!" Grito. "¡Ven aquí rápido! ¡Estamos haciendo una cúpula de hielo para defendernos de las rocas de arriba!"

              Cuando Daren y Leila me escuchan, vienen corriendo hacia nosotros, y una vez que entran dentro de la barrera contra el viento de Melindra, Kate crea su cúpula de hielo, mientras Daren usa su escudo para hacer una barrera propia encima de eso, por si acaso.
          - source: scene_text_2
            paragraph: 29
            text: |-
              "¿Crees que tu barrera funcionará contra alguna de las rocas?" Le pregunto a Daren.

              "Por lo que he visto, todos parecen haber sido creados mágicamente, por lo que debería funcionar bien", dice Daren. "Sin embargo, si hay rocas normales allí, atravesarán la barrera".

              "Todo está muy bien", digo. "Ahora prácticamente tenemos tres barreras superpuestas. Sería difícil superar esto en términos de defensa".
          - source: scene_3
            paragraph: 20
            text: |-
              No mucho después de que establecimos nuestras defensas, el elementalista de tierra también termina sus preparativos y ahora todas sus rocas están bien alineadas para que pueda arrojárnoslas más fácilmente. La primera ola que envía hacia nosotros está compuesta por sólo diez rocas, probablemente para probar la durabilidad de nuestras barreras. Afortunadamente para nosotros, ninguno de ellos logra pasar el hechizo protector de Daren, incluso si las rocas eran bastante grandes y venían de todas direcciones.

              Ahora que tiene una mejor idea de qué esperar, el elementalista de la tierra está lanzando alrededor de cincuenta rocas grandes a velocidades muy altas, desde todos los ángulos posibles. Algunas de las rocas son redondas, mientras que otras tienen puntas afiladas, probablemente realzadas por un afilado mágico y un refuerzo pesado. Una vez que golpean la barrera semitransparente de Daren, la mayoría de las rocas se deslizan o se rompen en pedazos por la fuerza del impacto, pero ninguna logra atravesarla.

              Eso es un alivio. Por un momento, no estuve seguro de si las defensas de Daren podrían resistir un ataque tan implacable, pero me alegra ver que estaba equivocado...
