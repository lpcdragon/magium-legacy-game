          - source: scene_text_2
            paragraph: 50
            text: |-
              Al igual que antes, el capitán intenta alejar a Daren con su fuerza invisible, pero su técnica de manipulación del aura no es lo suficientemente fuerte como para poder mantener a distancia tanto al sanador como al wyvern de fuego.

              Mientras el wyvern se prepara para volver a sumergirse, el elfo elementalista de aire dispara tres cuchillas de viento a Daren en rápida sucesión, pero el sanador bloquea dos de ellas con su escudo mientras absorbe la tercera con su espada y la envía de regreso a su atacante. El elfo hace una barrera contra el viento para defenderse, y cuando se da cuenta de que ya no puede hacer nada más, rápidamente lanza unas corrientes de aire a su alrededor, similares a las que Melindra siempre me lanza a mí, y se va volando para evitar morir quemado por el wyvern de fuego.

              Mientras lo veo volar, rápidamente me doy cuenta que este tipo apenas tiene control sobre sus corrientes de aire, a diferencia de Melindra o yo, porque se mueve por el aire de una manera completamente caótica, como si se dejara llevar por un fuerte viento o algo así. Debe haber estado realmente desesperado si aun así decidió intentar volar incluso en estas condiciones.
          - source: scene_3
            paragraph: 36
            text: |-
              Cuando el wyvern está a unos segundos de alcanzar su objetivo, el capitán vuelve a adoptar la postura de un espadachín, como si estuviera sosteniendo una espada invisible con ambas manos. Mientras balancea su espada, podemos ver el contorno del arma brillando por la luz del sol mientras Daren pone su escudo a un lado, preparándose para defenderse. Sin embargo, el capitán no apunta a Daren y corta el wyvern por la mitad con un solo golpe, mientras Daren es dejado caer por la criatura en llamas y aterriza justo al lado de su enemigo.

              El capitán rápidamente intenta usar su espada semi-invisible para matar a su oponente, pero en este punto está claro que está demasiado agotado para mantener su arma materializada adecuadamente. Su espada de aura debilitada no es rival para la espada encantada de Daren, que la corta en un instante y decapita a su portador en el mismo movimiento. Mientras el cuerpo decapitado del capitán cae en un charco de su propia sangre, Daren envaina su espada y se gira para mirarnos.
