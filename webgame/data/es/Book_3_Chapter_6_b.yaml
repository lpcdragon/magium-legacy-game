              Mi fuerza sobrehumana me permite cortar la superficie de la roca con un solo movimiento, y puedo decir que la longitud de la hoja también ayudó. Dentro de la mitad inferior flotante de la roca, ahora puedo ver a un hombre de unos cincuenta años con un bigote tupido que actualmente está gateando en posición fetal, probablemente porque evitó mi poderoso corte de antes.

              Cuando lo veo, rápidamente vuelo detrás de él y luego le pongo mi espada en la garganta justo cuando se está levantando.
