    effects:
      - set:
          failed_checks:
            - '[ Comprobación de técnica de combate fallida - nivel 2 ]'
          b3_ch6_wounded: 1
        condition: b3_ch6_air = 0 AND b3_ch6_tie = 0 AND combat_technique < 2
      - set:
          successful_checks:
            - '[ Comprobación de técnica de combate exitosa - nivel 2 ]'
        condition: b3_ch6_air = 0 AND b3_ch6_tie = 0 AND combat_technique >= 2
    routes:
      - condition: b3_ch6_air = 0 AND b3_ch6_tie = 0 AND b3_ch6_uninjured = 0
        texts:
          - source: scene_text
            paragraph: 56
            text: |-
              "Oye, Arraka", digo en voz baja, "¿podrías resaltar los puntos débiles de la técnica del aura nuevamente como ayer, para que Kate pueda golpearlos con sus carámbanos?"

              "No puedo hacer eso porque el capitán sigue moviéndolos", dice Arraka. "Obviamente no planea dejarnos dominarlo nuevamente".

              De repente, el capitán y el embajador quedan rodeados por una jaula dorada, que probablemente fue creada por Illuna. Desafortunadamente, nuestra situación no cambia en absoluto y la fuerza que nos empuja hacia abajo sigue siendo tan fuerte como siempre.

              "¡¿Qué?!" Arraka grita furiosamente. "¡¿Por qué harías eso?! ¿Por qué le arrojarías la jaula a él precisamente? ¿No has aprendido nada de mis lecciones?"

              "Hmm..." dice el capitán, mientras toca ligeramente uno de los barrotes de la jaula. "He visto este tipo de jaula antes. Si no recuerdo mal, este hechizo es muy vulnerable a las técnicas de manipulación del aura, ¿no es así? Déjame ver..."

              Luego hace un breve movimiento ondulante con las manos y todas las barras de la jaula comienzan a doblarse hasta que sus formas se distorsionan por completo y se convierten en espirales. Poco después, las espirales comienzan a girar cada vez más rápidamente hasta que se vuelven demasiado borrosas para verse con claridad y, finalmente, toda la jaula se desvanece en la nada.
          - source: scene_text_2
            paragraph: 38
            text: |-
              "Deberías haber prestado más atención a las lecciones que te enseñó el espíritu del amuleto", dice el capitán, mientras mira directamente a Illuna. "Lo que hiciste aquí no fue más que una pérdida de tiempo".

              Cuando el elementalista de aire llega cerca del capitán, fácilmente corta un agujero en la pared de hielo con sus cuchillas de viento, y luego el embajador usa esta salida recién creada para retirarse a un lugar seguro. Kate logra enviar un último carámbano hacia él mientras se va, pero es bloqueado sin esfuerzo por una pequeña barrera hecha por el capitán de los guardias, por lo que el embajador logra escapar.

              Mientras tanto, Loyrang finalmente nos alcanza después de arrastrar los pies todo este tiempo, y se detiene justo frente a mí con una de sus dos espadas largas desenvainada y lista para atacar.

              "¡Sin resentimientos, amigo!" Loyrang me dice en voz baja. "Al menos necesito fingir que me estoy tomando esto en serio".

              Luego usa su espada para apuñalarme en mi hombro derecho, y trato con todas mis fuerzas de reprimir un gemido de dolor cuando ahora saca su arma y la sangre comienza a fluir.

              "Vaya..." dice Loyrang. "Parece una herida bastante desagradable. ¡Quizás quieras ponerle un poco de presión si no quieres morir por la pérdida de sangre!"

              Tengo ganas de darle un puñetazo a este tipo en su cara engreída con tanta fuerza ahora mismo. Incluso si evitó matarme a propósito, su tono burlón y el dolor de mi hombro están haciendo que los únicos pensamientos que ahora pasan por mi cabeza sean formas de hacerle pagar.
            condition: combat_technique < 2
          - source: scene_text_2
            paragraph: 39
            text: |-
              "Deberías haber prestado más atención a las lecciones que te enseñó el espíritu del amuleto", dice el capitán, mientras mira directamente a Illuna. "Lo que hiciste aquí no fue más que una pérdida de tiempo".

