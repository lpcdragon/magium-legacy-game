  - name: b3_ch06b_mention
    routes:
      - condition: b3_ch6_preparing = 1 AND b3_ch6_wounded = 1
        texts:
          - source: scene_text
            paragraph: 71
            text: |-
              "¿Ves, Kelrim?" Daren le dice al duende mientras se acerca a él. "¡Te dije que encontraríamos la manera si trabajáramos juntos!"

              "Sí, lo hiciste", dice Kelrim, con una leve sonrisa. "Gracias... por cuidar de mí."

              "¡No lo menciones!" dice Daren.
          - source: scene_text_2
            paragraph: 54
            text: |-
              Hace una pausa.

              "De todos modos", dice Daren, "creo que deberíamos intentar teletransportarnos de regreso a la base rebelde nuevamente. Los guardias reales ya se han ido, así que con un poco de suerte tal vez nuestra señal ya no esté bloqueada. Primero acerquémonos más, para que Barry desde la sala de teletransporte pueda captar nuestra señal más fácilmente".
          - source: scene_3
            paragraph: 41
            text: |-
              "¿Podrías curarme la herida del hombro antes de que nos vayamos?" Le digo a Daren, mientras Hadrik ahora camina hacia nosotros, en su forma enana. "El sangrado ha parado, pero todavía duele muchísimo".

              "Oh, por supuesto", dice Daren, y luego comienza a lanzarme su hechizo curativo. "Por lo que estoy viendo, todos excepto Barry tienen sólo heridas menores, así que yo me encargaré del resto de la curación después de que salgamos de aquí".

              Tan pronto como termina su hechizo de curación y Hadrik también se acerca lo suficiente a nosotros, Daren saca su transceptor para poder llamar al teletransportador.
