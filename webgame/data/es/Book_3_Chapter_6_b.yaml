            paragraph: 64
            text: |-
              Decido no decirle nada a Kelrim. Si está realmente decidido a lanzar ese hechizo, entonces probablemente no haya nada que pueda decir que le haga cambiar de opinión. Lo menos que puedo hacer ahora es respetar su valentía y su sacrificio y no arriesgarme a delatar su plan al enemigo hablando en voz alta de ello.

              Después de soportar el dolor por un tiempo más, de repente siento que la presión sobre mí desaparece, mientras el capitán parece finalmente estar experimentando el dolor de cabeza que le vi tener en mi Premonición. Cuando se da cuenta de que perdió el control de su técnica de aura, intenta empujarnos hacia abajo nuevamente, pero ya no puede hacer que la fuerza invisible sea lo suficientemente fuerte como para inmovilizarnos contra el suelo, por lo que finalmente se rinde y crea una barrera frente a él.

