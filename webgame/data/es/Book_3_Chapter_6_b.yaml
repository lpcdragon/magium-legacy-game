              "Entonces..." dice Hadrik, después de que los alcanzo. "El embajador está muerto, ¿eh?"

              "Sí", digo.

              "Siento que voy a extrañar a ese pobre bastardo", dice Hadrik. "Quiero decir, todavía lo odiaba, pero escucharlo gritar a todo pulmón cada vez que nos veía siempre me hacía sonreír, ¿sabes lo que estoy diciendo?"

              "No te preocupes", le digo. "Él todavía vivirá en tus recuerdos".

              "Sí", dice Hadrik. "Y si no es él, entonces su voz seguramente lo hará".

              "Está bien, Barry, ahora puedes teletransportarnos", dice Daren.
            condition: b3_ch6_plan = 3
          - source: scene_3
            paragraph: 44
            text: |-
              Una vez que todo está listo, vemos la habitual luz blanca cubriéndonos mientras nuestros cuerpos comienzan a vibrar fuertemente, y luego nos encontramos de nuevo en la sala del teletransportador, junto a Barry Nubarrón y Albert.

              "¿Q-qué pasó con Kelrim?..." pregunta el tipo del teletransportador, cuando ve el cadáver del duende en los brazos de Daren.

              "Él... se sacrificó por nosotros y por la gente en la área de cuarentena", dice Daren, en tono triste. "No habríamos salido vivos de allí si no fuera por él. Todos estamos en deuda con él..."

              "Ya veo", dice el tipo del teletransportador, mientras mira hacia el suelo.

              "Llevaré a Kelrim a la sala de espera", dice Albert, mientras se acerca a Daren. "Hay mucha gente que quisiera despedirse de él, especialmente en la área de cuarentena".

              "...Asegúrate de que tenga un entierro adecuado", dice Daren, mientras le entrega el cuerpo de Kelrim a Albert con cierta vacilación.

              "Haremos lo que podamos", dice Albert, y luego toma al duende en sus brazos. "Ahora, si me disculpan, necesito ir a informar la muerte del capitán de la guardia a nuestro rey. Estoy seguro de que se sentirá aliviado y entristecido por la noticia, considerando su larga historia juntos. Nos vemos más tarde".

              Luego se vuelve invisible junto con el cadáver del duende, mientras presumiblemente regresa a la base rebelde.
            condition: b3_ch6_preparing = 1 AND b3_ch6_kelrim != 1 AND b3_ch6_plan != 3
          - source: scene_3
            paragraph: 45
            text: |-
              Una vez que todo está listo, vemos la habitual luz blanca cubriéndonos mientras nuestros cuerpos comienzan a vibrar fuertemente, y luego nos encontramos de nuevo en la sala del teletransportador, junto a Barry Nubarrón y Albert.

              "Entonces, ¿el capitán está realmente muerto?..." pregunta el chico del teletransportador inmediatamente después de vernos, como si todavía no pudiera creer lo que escuchó de Daren.

              "Sí, pero fue una pelea muy reñida", dice Daren. "Todo podría haber terminado fácilmente de cualquier manera".

              "Me lo puedo imaginar..." dice el chico del teletransportador. "La mayoría de nuestras tropas recibieron instrucciones de huir con solo verlo. No nos hubiéramos atrevido a enfrentarlo como lo hiciste tú sin todos nuestros mejores combatientes en el frente".

              "Tendré que ir a informar de la muerte del capitán a nuestro rey", nos dice Albert. "Estoy seguro de que se sentirá aliviado y entristecido por la noticia, considerando su larga historia juntos. Te veré más tarde".

              Luego se aleja de nosotros y se vuelve invisible, ya que presumiblemente ahora se dirige de regreso a la base rebelde.

              "También deberíamos volver a la sala de espera", nos dice Daren. "Hasta luego, Barry. ¡Y ​​gracias por la ayuda!"

              "En cualquier momento..." dice el tipo del teletransportador, y luego todos salimos de la sala del teletransportador para dirigirnos al túnel que conduce a la base rebelde.
            condition: b3_ch6_preparing = 1 AND b3_ch6_kelrim = 1
