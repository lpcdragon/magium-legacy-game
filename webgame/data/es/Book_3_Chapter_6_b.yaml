            paragraph: 51
            text: |-
              "¡Demasiado tarde!" Dice Gontrok, y luego golpea el dispositivo con toda su mano, haciendo que aparezca una luz blanca alrededor de todos los guardias reales supervivientes.

              "¡Pagarás por esto, tonto!" dice la voz, mientras vemos una luz blanca a través de la ventana de una de las casas, que probablemente es donde nuestro mago misterioso había estado escondido todo este tiempo.

              "Ya veremos", dice Gontrok.

              "¡Ah, mierda!" Dice Hadrik, mientras intenta en vano dar un último golpe antes de que Gontrok y los otros guardias reales sean teletransportados a salvo lejos de nosotros.
          - source: scene_3
            paragraph: 38
            text: |-
              Mientras miro al cielo, noto que en este momento solo hay alrededor de cinco rocas de tamaño mediano flotando en el aire, a pesar de todo el tiempo que el elementalista de la tierra tuvo para hacer más de ellas. Supongo que no le quedaba mucha energía mágica después de crear esos cientos de rocas de antes, ¿eh?

              "¡Cuidado con las rocas!" digo. "Estarán cayendo pronto, ahora que el elementalista de la tierra fue teletransportado".

              "¡Yo me ocuparé de ellos!" Dice Flower, y luego vuela hacia arriba con sus chorros de fuego, para acercarse a las rocas.

              Las rocas ya están cayendo cuando ella las alcanza, pero las hace pedazos con algunas bolas de fuego bien colocadas y luego regresa victoriosa hacia nosotros mientras Daren nos defiende de los escombros entrantes con la barrera de su escudo.

              "¿Por fin ha terminado?..." escribe Leila, mientras mira a nuestro alrededor. "¿Se han ido todos ahora?"

              "Si estás hablando de la guardia real, entonces sí", dice Melindra.
            condition: b3_ch6_earth = 0
