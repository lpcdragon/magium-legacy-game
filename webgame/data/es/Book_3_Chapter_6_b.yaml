  - name: b3_ch06b_panic2
    routes:
      - condition: b3_ch6_air >= 1
        texts:
          - source: scene_text
            paragraph: 66
            text: |-
              "Umm, Daren, ¿podrías recordarme si tu armadura tiene protección contra incendios o no?" Dice Flower, mientras el capitán de los guardias todavía empuja a Daren.

              "Sí, lo hace", le responde Daren. "Pero ¿por qué tú--"

              "¡Perfecto!" Dice Flower, y luego vemos un gran wyvern hecho completamente de llamas, volando hacia abajo y agarrando a Daren entre sus garras.

              Luego, el wyvern se eleva en el aire, agarrando fuertemente a Daren mientras avanza rápidamente hacia el capitán.

              "No te preocupes", le grita Flower a Daren, "¡las llamas se han solidificado adecuadamente con magia de refuerzo, por lo que no hay peligro de que te caigan por accidente! ¡Probablemente!"
          - source: scene_text_2
            paragraph: 49
            text: Al igual que antes, el capitán intenta alejar a Daren con su fuerza invisible, pero su técnica de manipulación del aura no es lo suficientemente fuerte como para poder mantener a distancia tanto al sanador como al wyvern de fuego.
          - source: scene_3
            paragraph: 36
            text: |-
              Cuando el wyvern está a unos segundos de alcanzar su objetivo, el capitán vuelve a adoptar la postura de un espadachín, como si estuviera sosteniendo una espada invisible con ambas manos. Mientras balancea su espada, podemos ver el contorno del arma brillando por la luz del sol mientras Daren pone su escudo a un lado, preparándose para defenderse. Sin embargo, el capitán no apunta a Daren y corta el wyvern por la mitad con un solo golpe, mientras Daren es dejado caer por la criatura en llamas y aterriza justo al lado de su enemigo.

              El capitán rápidamente intenta usar su espada semi-invisible para matar a su oponente, pero en este punto está claro que está demasiado agotado para mantener su arma materializada adecuadamente. Su espada de aura debilitada no es rival para la espada encantada de Daren, que la corta en un instante y decapita a su portador en el mismo movimiento. Mientras el cuerpo decapitado del capitán cae en un charco de su propia sangre, Daren envaina su espada y se gira para mirarnos.
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch06b_tactical
      - condition: b3_ch6_air = 0
