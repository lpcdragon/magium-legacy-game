  - name: b3_ch06b_mustache
    routes:
      - condition: b2_ch5_scimitar <> 0 AND strength < 3
        texts:
          - source: scene_text
            paragraph: 27
            text: |-
              Dudo que vaya a tener una oportunidad mejor que esta para lidiar con el elementalista de tierra, así que probablemente debería seguir persiguiéndolo. Estoy seguro de que mis amigos estarán bien sin mí por un tiempo más.

              Utilizo mi Sentido mágico para detectar la ubicación del mago nuevamente, y luego me dirijo en su dirección mientras me aseguro de enmascarar mi propia aura y de mantener siempre algunas rocas entre él y yo por si acaso. Eventualmente logro acercarme lo suficiente a la roca en la que se esconde sin alertarlo, pero aún así tendré que atravesarla para sacarlo de allí. Lógicamente hablando, la gran roca que está usando como refugio temporal debería tener algunos pequeños agujeros para permitirle respirar, y también mucho espacio vacío en su interior para que pueda sentarse cómodamente, por lo que la superficie de la roca no debería ser tan gruesa.

              Dicho esto, esta roca claramente ha sido forzada mágicamente como todas las demás, por lo que voy a necesitar una fuerza considerable para cortarla de cualquier manera.
          - source: scene_text_2
            paragraph: 17
            text: |-
              Envaino mi daga y saco mi cimitarra, que debería ser mucho mejor para el trabajo, porque aunque no es más afilada que mi otra arma, todavía tiene un alcance considerablemente más largo. Luego corté la roca con todas mis fuerzas, tratando de cortarla por la mitad.

              Desafortunadamente, la superficie de la roca es mucho más dura de lo que esperaba y no logro cortarla con un solo movimiento. Antes de que tenga la oportunidad de intentarlo de nuevo, todas las rocas que flotaban en el lugar hasta hace un momento vienen directamente hacia mí desde todas direcciones. Dado que no tengo espacio para escapar, inevitablemente termino siendo aplastado por la multitud de rocas y muero poco después.
