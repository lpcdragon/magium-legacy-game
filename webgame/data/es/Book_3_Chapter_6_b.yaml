              "Melindra, ¿podrías darme el hechizo de vuelo--" digo, pero antes de terminar, ya puedo sentir las corrientes de aire moviéndose a mi alrededor.

              "¡Gracias!" -digo y levanto los brazos para despegar del suelo.

              "¡Oigan, idiotas!" Dice Arraka, en voz lo suficientemente baja como para que los guardias reales no puedan oírla. "¿Recuerdas que me dijiste que te avisara cuando el tipo con el aura oculta estaría lo suficientemente cerca para atacar? Bueno, acaba de llegar y está escondido en esa casa vacía de allí".

              Luego dibuja una figura con forma humana hecha de luz azul en la pared de un edificio, con algunas palabras azules escritas en la parte superior que dicen: "Me estoy escondiendo aquí".  Unos pocos segundos después, Kate envía una docena de carámbanos hacia la figura en la pared, apuntando a cada punto vital que haya. Mientras los carámbanos mágicamente afilados atraviesan fácilmente el exterior del edificio de piedra, escuchamos un grito muy corto de dolor proveniente del otro lado, que es todo lo que nuestro enemigo vestido de negro tiene tiempo de hacer antes de morir y luego caer al suelo.
