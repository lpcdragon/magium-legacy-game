    routes:
      - condition: b3_ch6_focus = 0
        texts:
          - source: scene_text
            paragraph: 13
            text: |-
              "Ustedes cuiden de él. Yo me encargaré del elementalista de la tierra en el cielo".

              "No corras riesgos estúpidos cuando vayas tras él", dice Kate.

              "No lo haré", digo.

              "Kate, si queremos apuntar al embajador correctamente, primero tendremos que cortar su ruta de escape", dice Illuna.

              "Estoy en ello", dice Kate, y luego crea una gran pared de hielo reforzado detrás del embajador, cerrando el callejón por donde vino.

              Luego, Illuna hace dos largos látigos de agua y los arroja a ambos al suelo. En cuestión de segundos, los dos látigos cobran vida propia y se convierten en cobras hechas de agua, deslizándose rápidamente hacia el embajador. Mientras tanto, una larga púa hecha de hielo aparece desde el suelo detrás del embajador, preparándose para empalarlo.

              Habiendo derrotado a la serpiente de agua voladora de Illuna, el capitán rápidamente crea una barrera defensiva semitransparente alrededor de él y del embajador, que los defiende de los ataques de hielo de Kate y de las cobras de agua de Illuna por el momento.

              "¡¿Qué están mirando todos ?!" les grita el capitán a los otros guardias, mientras Flower ahora también comienza a disparar algunas flechas de fuego hacia el embajador de Ollendor. "¡Ayúdame a defender al embajador! ¡Ataca a estos tontos con todo lo que tienes!"

              "¡Sí, defiéndeme!" dice el embajador en voz alta pero ligeramente temblorosa, ya que comienza a entrar en pánico. "¡Defiéndeme a toda costa!"
          - source: scene_text_2
            paragraph: 8
            text: |-
              Justo después de que el capitán deja de hablar, Hadrik ataca a Gontrok nuevamente, sin querer darle tiempo para decidir si quiere escuchar las órdenes de su capitán o no. Mientras los dos pelean, se hace evidente que Gontrok se ha acostumbrado un poco más al nuevo estilo de lucha de Hadrik, porque aunque todavía está a la defensiva, no parece estar tan abrumado como antes.

              "Melindra, ¿podrías darme el hechizo de vuelo--" digo, pero antes de terminar, ya puedo sentir las corrientes de aire moviéndose a mi alrededor.

              "¡Gracias!" -digo y levanto los brazos para despegar del suelo.

              "¡Oigan, idiotas!" Dice Arraka, en voz lo suficientemente baja como para que los guardias reales no puedan oírla. "¿Recuerdas que me dijiste que te avisara cuando el tipo con el aura oculta estaría lo suficientemente cerca para atacar? Bueno, acaba de llegar y está escondido en esa casa vacía de allí".

              Luego dibuja una figura con forma humana hecha de luz azul en la pared de un edificio, con algunas palabras azules escritas en la parte superior que dicen: "Me estoy escondiendo aquí".  Unos pocos segundos después, Kate envía una docena de carámbanos hacia la figura en la pared, apuntando a cada punto vital que haya. Mientras los carámbanos mágicamente afilados atraviesan fácilmente el exterior del edificio de piedra, escuchamos un grito muy corto de dolor proveniente del otro lado, que es todo lo que nuestro enemigo vestido de negro tiene tiempo de hacer antes de morir y luego caer al suelo.
