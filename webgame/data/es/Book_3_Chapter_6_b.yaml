  - name: b3_ch06b_opportunity
    routes:
      - condition: b3_ch6_preparing = 1 AND b3_ch6_wounded = 1
        texts:
          - source: scene_text
            paragraph: 70
            text: |-
              "¿Están todos a salvo?" Rose pregunta, con voz ansiosa. "¡Por favor díganme que nadie murió!"

              "Todos estamos vivos, Rose", dice Kate. "Gracias a ti. Tu sincronización fue impecable. ¿Cómo supiste exactamente cuándo llamarnos?"

              "No lo hice", dice Rose. "De hecho, llamé a Barry un poco antes, porque quería decirle que probablemente aún podría usar mi poder de congelar el tiempo una vez más por el día en caso de que ustedes lo necesitaran. Pero antes de tener la oportunidad de decir algo, me di cuenta por los ruidos de que estaban todos en medio de una batalla, así que decidí que debería esperar la oportunidad adecuada para ayudar, en lugar de llamarlos y hacer que pierdan la concentración".

              "Bueno, su intervención no podría haber sido mejor programada", dice Daren. "Es posible que todos hubiéramos muerto sin su ayuda".

              "Tu amigo en el transceptor..." dice Kelrim. "¿Ella congeló el tiempo? ¿Es por eso que pudiste cancelar la técnica del aura del capitán de repente?"

              "Oh, es cierto, el hechizo de Rose también te congeló, así que no podías saber lo que estaba pasando", dice Daren. "Sí, Rose congeló el tiempo por un tiempo, y eso me dio la oportunidad de-- Kelrim, ¿estás bien?... ¡Tu cara se ve muy pálida! Quiero decir... al menos creo que está pálida. No es normal que tenga un tono de verde tan claro, ¿verdad?"

              "Oh, estoy bien..." dice Kelrim. "Es solo... es solo que... si tu amigo no hubiera intervenido, lo más probable es que le hubiera lanzado ese hechizo de náuseas del que te hablé antes al capitán. Puede que hubiera estado a sólo unos segundos de terminar con mi propia vida, y la idea de eso me aterroriza un poco."
          - source: scene_text_2
            paragraph: 52
            text: |-
              "Kelrim..." dice Daren. "Lo que intentaste hacer fue muy noble, pero todavía hay personas ahí abajo que necesitan tu ayuda. No sólo están esperando que yo los salve, sino que también te están esperando a ti, y todos estarían tristes si te fueras. Entiendes esto, ¿verdad?"

              "Sí..." dice Kelrim. "Sí, lo entiendo. Gracias. ¿Nos teletransportamos de regreso a la base?"

              "Probablemente deberíamos", dice Daren. "Con suerte, ya no habrá ninguna interferencia de señal ahora que los guardias reales se han ido. Acerquémonos todos primero, para que Barry desde la sala de teletransporte pueda localizarnos más fácilmente".
          - source: scene_3
            paragraph: 41
            text: |-
              "¿Podrías curarme la herida del hombro antes de que nos vayamos?" Le digo a Daren, mientras Hadrik ahora camina hacia nosotros, en su forma enana. "El sangrado ha parado, pero todavía duele muchísimo".

              "Oh, por supuesto", dice Daren, y luego comienza a lanzarme su hechizo curativo. "Por lo que estoy viendo, todos excepto Barry tienen sólo heridas menores, así que yo me encargaré del resto de la curación después de que salgamos de aquí".

              Tan pronto como termina su hechizo de curación y Hadrik también se acerca lo suficiente a nosotros, Daren saca su transceptor para poder llamar al teletransportador.
