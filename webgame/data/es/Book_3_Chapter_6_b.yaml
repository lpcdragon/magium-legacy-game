  - name: b3_ch06b_rating
    texts:
      - source: scene_text
        paragraph: 19
        text: |-
          Mientras estoy ocupado evadiendo las Cuchillas de viento semitransparentes, de repente escucho la voz del Supervisor que viene detrás de mí.

          "¡Advertencia! ¡Advertencia!" dice el dron de ojos verdes que aparentemente todavía me seguía. "Una unidad que no es de combate está siendo atacada. Solicitamos refuerzos de inmediato".

          "¿Qué diablos?..." dice el elfo elementalista del aire, mientras deja temporalmente de enviarme cuchillas de viento para mirar al cielo.

          Varios drones de ojos rojos ahora están descendiendo rápidamente hacia nosotros, y su objetivo parece ser el elementalista de aire frente a mí.

          "¡Aléjense de mí, máquinas idiotas!" dice el elfo, mientras envía algunas de sus cuchillas de viento a las bolas de metal, pero sus ataques son fácilmente esquivados por ellas.

          "Ahora es nuestra oportunidad", les digo a Leila y Daren. "¡Apresurémoslo mientras se distrae!"

          Inmediatamente después de decir esto, una gran hidra con seis cabezas, hecha enteramente de viento, aparece frente a nosotros, bloqueando nuestro camino hacia el elementalista de aire. Aunque técnicamente el monstruo está hecho de aire, aún podemos decir que se supone que es una hidra debido a la forma en que la luz del sol se refleja en su superficie. Al ver la enorme criatura frente a nosotros, Daren y yo nos detenemos, pero Leila sigue corriendo hacia adelante, directamente a través de la hidra mientras se dirige directamente hacia el elfo.
      - source: scene_text_2
        paragraph: 10
        text: |-
          Al estar demasiado concentrado en los drones para notarla, el elementalista de aire solo se da cuenta de que estaba siendo flanqueado cuando es apuñalado con una de las dagas de Leila en la parte posterior de la garganta. Una vez que Leila quita su daga, el elfo le pone la mano en el cuello, tratando de detener el flujo de sangre, pero sale demasiada sangre como para que él pueda hacer algo. No mucho después, el elfo pierde la fuerza de sus piernas y cae al suelo, sin nada más que hacer que desangrarse lentamente y morir.

          "¿Cómo supiste que la hidra no te atacaría?" Daren le pregunta a Leila, mientras la criatura hecha de aire ahora se está desvaneciendo.

          "No lo hice", escribe Leila, ya que ahora regresa, "pero el elfo no nos estaba prestando atención cuando apareció la hidra, y no hizo ningún gesto que me hiciera creer que él fue quien lanzó ese hechizo, así que pensé que había muchas posibilidades de que esto fuera simplemente una ilusión hecha por algún otro mago para asustarnos".

          "¡Bien hecho!" digo. "Y esa fue una buena ayuda de tu parte también, Supervisor. No pensé que mantenerte cerca resultaría realmente útil".

          "¿Significa esto que ahora está satisfecho con la calidad de sus interacciones con el protocolo Supervisor?" dice el Supervisor.
      - source: scene_3
        paragraph: 9
        text: |-
          "¿Qué?" digo. "Oh, uhm... claro, supongo..."

          "La calificación de cero que le habías otorgado anteriormente se ha actualizado a una calificación de cinco sobre cinco", dice el Supervisor. "Gracias por tu aporte. La respuesta a la segunda pregunta de la encuesta ya no será necesaria. ¡Que tengas un buen día!"

          Habiendo dicho esto, el dron de ojos verdes finalmente decide dejar de seguirme y procede a volar hacia el cielo, junto con todos los drones de ojos rojos que vinieron en su defensa.

          Mientras estoy allí de pie, mirando las bolas de metal que se alejan de mí, noto con el rabillo del ojo a Loyrang, que parece bastante aburrido de toda esta situación y que no ha dado señales de querer atacarnos hasta ahora.

          "Oye, entonces, uhm... aquí tienes una pregunta rápida..." le digo. "¿Vas a ser parte de esta pelea o no?"

          "Sólo si me obligas a hacerlo", me responde Loyrang.

          "Es justo", digo.

          Mientras intentamos decidir qué hacer a continuación, el hombre con túnica negra que nos tendió una emboscada ayer de repente se teletransporta detrás de Kate, intentando apuñalarla con un cuchillo.
