  - name: b3_ch06b_abysmal
    texts:
      - source: scene_text
        paragraph: 6
        text: |-
          "Parece que finalmente recuerdas lo que significa ser un guerrero, viejo amigo", dice Gontrok, mientras respira con dificultad. "Eso es bueno. Estaba empezando a preocuparme de que todos esos años que pasaste haciéndote pasar por un enano te hubieran vuelto suave. Ahora puedo decirles a tus padres que su patético hijo al menos no ha perdido completamente su honor. No es que les importe mucho, por supuesto. La mayoría de las veces, cuando les hablo de ti, les gusta fingir que ni siquiera existes".

          "Cierra la boca y continúa la lucha, Gontrok..." dice Hadrik, pero es interrumpido.

          "¡¿Valió la pena, Hadrik?!" Gontrok grita fuerte para ahogar la voz de Hadrik. "¿Valió la pena dejar atrás tu tierra natal, junto con todos tus amigos y familiares, sólo por lo que le pasó a una insignificante aldea enana?"

          "Enano", dice Arraka. "Lo juro... si te veo perdiendo la calma otra vez por esto..."

          "Lo entiendo", le dice Hadrik en tono tranquilo, aunque está claro que apenas puede contener su ira.
      - source: scene_text_2
        paragraph: 4
        text: |-
          "¿Qué esperabas lograr viajando a través de las tierras enanas en la forma de un enano?" Gontrok le pregunta a Hadrik, mientras ignora a Arraka. "¿Estabas tratando de expiar tus pecados? ¿Pensaste que de alguna manera arreglarías las cosas después de matar a todas esas mujeres y niños enanos poniendo flores en sus tumbas o algo así? Acéptalo, Hadrik, eres un asesino, como el resto de nosotros. La única diferencia entre tú y yo es que no soy un perro sin honor como tú, y puedo vivir matando a algunos civiles durante una guerra sin convertirme en un completo cobarde".

          "Enano", dice Arraka. "Si dejas que vuelva a meterse bajo tu piel, te juro que te arrancaré la columna y..."

          "¡Dije que lo entiendo!" Hadrik grita fuerte, mientras corre furiosamente hacia Gontrok.

          Cuando Gontrok intenta bloquear el primer golpe de su oponente, Hadrik cambia de forma al tamaño de un duende, se desliza entre las piernas de Gontrok y llega detrás de él. Luego, casi instantáneamente vuelve a su tamaño humano, agarrando la cabeza de Gontrok por detrás y empujándola con fuerza contra el suelo. Mientras ahora sostiene la cabeza de Gontrok contra el pavimento con su mano izquierda, Hadrik busca el golpe final, intentando golpearlo lo más fuerte que puede con su puño derecho en la parte posterior de la cabeza.
      - source: scene_3
        paragraph: 3
        text: |-
          En cambio, lo que sucede es que el puño de Hadrik golpea una pequeña barrera semitransparente justo encima de la cabeza de Gontrok, que apareció aparentemente de la nada. Gontrok aprovecha la confusión en la que se encuentra Hadrik para escapar de su alcance y saltar hacia atrás, y una vez que está fuera del alcance de su viejo amigo comienza a mirar fijamente un estrecho callejón a nuestra derecha, con una mirada de reproche en sus ojos.

          "Su ayuda fue innecesaria, capitán", dice Gontrok.

          "¿Lo fue, en serio?" escuchamos la voz del capitán de la guardia, que ahora se va revelando lentamente. "Ciertamente no parecía que tuvieras las cosas bajo control desde donde yo estaba, recluta".

          "¿Nos has estado observando todo este tiempo?" dice Gontrok.

          "He visto suficiente esta pelea para saber que estás fuera de tu alcance, Gontrok", dice el capitán. "No quería interrumpirte al principio, porque tiendes a reaccionar mal cuando la gente interfiere en tus duelos, pero después de ver tu pésima actuación hace un momento, he llegado a la conclusión de que ya te he dejado perder suficiente tiempo. Apártate del camino, Gontrok. El resto de nosotros nos encargaremos de aquí".

          Mientras Gontrok parece estar simplemente hirviendo de rabia, los otros guardias reales ahora se acercan a nosotros uno por uno, desde todas direcciones.
    choices:
      - position: 1
        text: Oye, Gontrok, ¿vas a dejar que te insulte así?
        effects:
          - set:
              current_scene: b3_ch06b_insult
      - position: 2
        text: ¡Capitán, acaba de interrumpir un duelo sagrado! ¿No tienes honor?
        effects:
          - set:
              current_scene: b3_ch06b_sacred
      - position: 3
        text: ¡Sí, apártate del camino, Gontrok! ¡Aquí sólo se permiten verdaderos guerreros!
        effects:
          - set:
              current_scene: b3_ch06b_warriors
  - name: b3_ch06b_insult
    texts:
      - source: scene_text
        paragraph: 7
        text: |-
          "Oye, Gontrok, ¿vas a dejar que te insulte así?"

          "¡Callarse la boca!" Me dice Gontrok, furioso. "No necesito que me digas qué hacer. Por lo que a mí me importa, el capitán puede saltar por un acantilado. No voy a alejarme de esta pelea".

          "Lo que planees hacer es irrelevante", dice el capitán. "Vamos a acabar con todos ellos antes de que tengas la oportunidad de ponerles otro dedo encima. Observa".

          Justo después de que el capitán termina de hablar, una inmensa presión nos empuja a todos al suelo, inmovilizándonos en un instante. Mientras escucho algunos ruidos encima de mí, lucho por levantar la cabeza para poder ver lo que está pasando. Aparentemente, en el poco tiempo que no estuve mirando, el cielo se había llenado de grandes rocas que flotan en el aire, esperando ser arrojadas sobre nosotros.

          Unos segundos más tarde, el elementalista de tierra que controla las rocas decide arrojarnos algunas de ellas, mientras todavía estamos inmovilizados contra el suelo. Antes de que nos alcancen, Daren levanta su espada en el aire y la mueve hacia un lado, lo que inmediatamente rompe el efecto de la técnica de manipulación del aura del capitán.
      - source: scene_text_2
        paragraph: 5
        text: |-
          Sin tiempo que perder, Kate conjura un escudo flotante hecho de hielo reforzado sobre nuestras cabezas, mientras Hadrik da un salto de altura y rompe en pequeños pedazos la mayor de las rocas que se dirigen hacia nosotros. Algunas rocas rompen el hielo de Kate, pero logramos alejarnos de ellas y evitar que nos golpeen.

          "¡Jajaja!" Gontrok se ríe. "¿Qué pasa, capitán? Pensé que tenía todo bajo control. ¿Quizás necesita una mano?"

          "Cállate, imbécil", dice el capitán. "Ya estarían todos muertos si hubieras seguido mi plan original".

          "Puedes tomar tu plan original y metértelo en el culo", dice Gontrok. "No soy el perro faldero de nadie, y mucho menos el tuyo".
      - source: scene_3
        paragraph: 4
        text: |-
          "Hola, Illuna", le susurro. "Si puedo mantenerlos hablando por un rato más, ¿crees que podrías conjurar esas enormes serpientes de agua voladoras de ayer otra vez?"

          "He estado preparando ese hechizo desde que los guardias comenzaron a dirigirse hacia nosotros", dice Illuna en voz baja. "Podría lanzarlo ahora, pero la mayoría de estos magos serían lo suficientemente fuertes como para destruir las serpientes sin mucho esfuerzo. Si mi hechizo quiere tener algún efecto sobre ellos, primero tendrían que inmovilizarlos de alguna manera".

          "Podría intentar congelar a todos los enemigos que nos rodean, pero tendrían que acurrucarse más para no congelar a ninguno de ustedes por accidente", susurra Kate.

          "¡Pssst, Hadrik!" -digo en voz baja. "Hadrik, ¿puedes oírme?... ¡Maldita sea, no nos está mirando!"
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch06b_crumble
