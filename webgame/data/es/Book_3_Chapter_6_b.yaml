  - name: b3_ch06b_trance
    routes:
      - condition: b3_ch6_uninjured = 0
        texts:
          - source: scene_text
            paragraph: 57
            text: |-
              De repente, escucho a Rose gritar a través del transceptor y rápidamente me doy cuenta de que el mundo que nos rodea está completamente congelado nuevamente, incluidos Hadrik y Gontrok, quienes continuaban su lucha en algún lugar lejos de nosotros.

              "Barry, ¿puedes moverte?" Rose dice en voz alta.

              "¿Rose?..." digo confundida. "¿Cómo supiste cuándo--"

              "¡No tengo tiempo para explicar!" Dice Rose, hablando muy rápido para ahorrar tiempo. "¿Qué está pasando con la presión que hay encima de vosotros? ¿Podéis liberaros?"

              "Me temo que no", digo, después de intentar en vano volver a ponerme de pie. "La fuerza invisible ya no nos aplasta, pero todavía nos mantiene inmovilizados contra el suelo".

              "Oh, no..." dice Rose, mientras puedo sentir que comienza a entrar en pánico. "No, no, no, no... ¡Pensé que esto funcionaría! No puedo mantener el tiempo congelado por mucho más tiempo... ¡Por favor, por favor, por favor, necesitan pensar en algo! Tiene que haber una manera de salvarse antes de mi hechizo--"

              "Chicos, ¿están viendo lo que yo estoy viendo?...", nos pregunta Daren de repente, mientras mira el aire vacío sobre él.
          - source: scene_text_2
            paragraph: 40
            text: |-
              "No, Daren", le digo, "no estamos viendo nada, pero si estás planeando hacer algo, será mejor que lo hagas rápido, antes de..."

              "Todo está tan claro ahora..." dice Daren, luciendo casi como si estuviera en una especie de trance. "Cuando está congelado en el tiempo como este, el aura del capitán es mucho más fácil de entender. ¡Arraka tenía razón! ¡Los flujos realmente parecen hilos atados en un nudo!"

              "Daren, yo no-- ugh... No sé lo que estás diciendo", dice Rose, ya que claramente está haciendo grandes esfuerzos para mantener el tiempo congelado. "Por favor, si has descubierto algo, hazlo rápido... No puedo... Apenas puedo permanecer consciente en este momento..."

              "Está bien, Rose", dice Daren, en un tono tranquilo pero confiado. "Puedes soltar el hechizo. Yo me ocuparé del capitán".

              "Está bien..." dice Rose. "Espero que sepas lo que estás haciendo".

              El tiempo inmediatamente se descongela y justo cuando empiezo a sentir la presión de arriba aplastándome nuevamente, Daren levanta su mano izquierda en el aire, cierra el puño y la fuerza invisible que nos empujaba hacia abajo desaparece por completo.
          - source: scene_3
            paragraph: 30
            text: |-
              "Se acabó, capitán", dice Daren, mientras se levanta del suelo y comienza a caminar lentamente hacia él. "Ríndete ahora y no tendré que matarte".

              "Te estás adelantando, sanador", dice el capitán. "Veamos qué tan arrogante serás después de que te rompa la segunda muñeca".

              Tan pronto como dice esto, el capitán intenta torcer la mano izquierda de Daren con su manipulación del aura, pero Daren simplemente mueve un poco los dedos y los efectos de la técnica del capitán desaparecen inmediatamente. Al ver que su antigua táctica ya no funciona, el capitán de los guardias intenta ahora empujar a su oponente con la fuerza invisible, pero Daren pone sus manos delante de él y simplemente lo bloquea.

              Mientras mantiene los brazos extendidos, su espada ahora se aleja de donde fue arrojada al suelo y se dirige directamente a su mano izquierda.
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch06b_trance2
      - condition: b3_ch6_uninjured = 1
        texts:
          - source: scene_text
            paragraph: 57
            text: |-
              De repente, escucho a Rose gritar a través del transceptor y rápidamente me doy cuenta de que el mundo que nos rodea está completamente congelado nuevamente, incluidos Hadrik y Gontrok, quienes continuaban su lucha en algún lugar lejos de nosotros.

              "Barry, ¿puedes moverte?" Rose dice en voz alta.

              "¿Rose?..." digo confundida. "¿Cómo supiste cuándo--"

              "¡No tengo tiempo para explicar!" Dice Rose, hablando muy rápido para ahorrar tiempo. "¿Qué está pasando con la presión que hay encima de vosotros? ¿Podéis liberaros?"

              "Me temo que no", digo, después de intentar en vano volver a ponerme de pie. "La fuerza invisible ya no nos aplasta, pero todavía nos mantiene inmovilizados contra el suelo".

              "Oh, no..." dice Rose, mientras puedo sentir que comienza a entrar en pánico. "No, no, no, no... ¡Pensé que esto funcionaría! No puedo mantener el tiempo congelado por mucho más tiempo... ¡Por favor, por favor, por favor, necesitan pensar en algo! Tiene que haber una manera de salvarse antes de mi hechizo--"

              "Chicos, ¿están viendo lo que yo estoy viendo?...", nos pregunta Daren de repente, mientras mira el aire vacío sobre él.
