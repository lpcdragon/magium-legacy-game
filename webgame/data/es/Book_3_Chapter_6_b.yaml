  - name: b3_ch06b_earth2
    routes:
      - condition: magical_sense < 2
        texts:
          - source: scene_text
            paragraph: 23
            text: |-
              Después de volar sin rumbo durante unos segundos más, me doy cuenta de que no estoy haciendo ningún progreso como este, así que decido cerrar los ojos y concentrarme sólo en encontrar el aura del mago.

              Floto allí, en medio de todas las rocas durante unos diez segundos, intentando en vano detectar cualquier aura que parezca pertenecer a una persona. Sigo intentándolo y intentándolo, pero su aura está demasiado bien escondida. Es como si él ni siquiera estuviera aquí.

              No puedo pensar en esto por mucho tiempo, porque dos grandes rocas se me acercan a gran velocidad sin prestar atención, provenientes de dos lados opuestos, y me rompen la cabeza en pedazos antes de que pueda entender lo que está pasando.
        effects:
          - set:
              failed_checks:
                - '[ Comprobación de sentido mágico fallida - nivel 2 ]'
              is_dead: 1
        choices:
          - position: 1
            text: Reiniciar juego
            effects:
              - set:
                  current_scene: ch1_intro1
                  storyboard_controls: Jump to frame "Chapter 1"
                condition: is_dead = 1
          - position: 2
            text: Cargar desde el último punto de control
            effects:
              - set:
                  chapter_load: 1
                  storyboard_controls: Jump to frame "Save load game"
                condition: is_dead = 1
          - position: 3
            text: Cargar partida
            effects:
              - set:
                  storyboard_controls: Jump to frame "Save load game"
                condition: is_dead = 1
      - condition: b3_ch6_selected = 3 AND magical_sense >= 2 AND bluff < 3
        texts:
          - source: scene_text
            paragraph: 24
            text: |-
              Después de volar sin rumbo durante unos segundos más, me doy cuenta de que no estoy haciendo ningún progreso como este, así que decido cerrar los ojos y concentrarme sólo en encontrar el aura del mago.

              Hmm... Claramente está ocultando su aura, pero puedo sentirla si me concentro mucho en ella. Lo que no entiendo es por qué no puedo verlo. Estoy mirando en su dirección ahora mismo, pero lo único que veo es una roca enorme. ¿Se esconde detrás de la roca?... ¡No! ¡Dentro de! Está escondido dentro de la roca. ¡Tiene que ser eso!

              Mientras tengo mi revelación, dos grandes rocas vienen hacia mí desde lados opuestos, a gran velocidad, tratando de aplastarme la cabeza entre ellas. Los esquivo fácilmente y luego me dirijo hacia la gran roca en la que se esconde actualmente el elementalista. Al ver que estoy volando directamente hacia él con mi daga lista, el elementalista inmediatamente mueve su gran roca fuera del camino, y luego, de repente, la mitad de las rocas que estaban inmóviles hace solo un segundo están volando fuera del camino del elementalista para dejarle paso, mientras que la otra mitad está tratando de matarme.
          - source: scene_text_2
            paragraph: 15
            text: |-
              A lo largo de todo el caos, una de las rocas roza accidentalmente el dron que todavía me sigue. Esto hace que la bola de metal comience a hablar en voz alta, aunque no parece dirigirse a nadie en particular.

              "¡Advertencia! ¡Advertencia!" dice el dron de ojos verdes. "Una unidad que no es de combate está siendo atacada. Solicitamos refuerzos de inmediato..."

              El dron no llega a terminar de llamar a sus amigos, porque otra piedra lo golpea por error, esta vez destruyéndolo por completo y enviándolo a estrellarse contra el suelo. Mientras tanto, el resto de las rocas todavía me persiguen, mientras lucho por mantener su velocidad. 

              Con la gran cantidad de rocas que están intentando aplastarme la cabeza en este momento, honestamente debo usar toda la experiencia de vuelo que he acumulado hasta ahora para poder evitarlas. El problema es que ahora me es imposible acercarme al elementalista de la tierra, porque él sigue alejándose de mí y ya estoy demasiado ocupada tratando de mantenerme con vida.
          - source: scene_3
            paragraph: 14
            text: Después de esquivar un rato más, las rocas finalmente logran rodearme por completo, sin dejarme espacio para escapar. Luego todos vienen volando hacia mí a la vez, desde todas direcciones, matándome en el impacto.
        effects:
          - set:
              failed_checks:
                - '[ Comprobación de ocultación de aura fallida - nivel 3 ]'
              successful_checks:
                - '[ Comprobación de sentido mágico exitosa - nivel 2 ]'
              is_dead: 1
