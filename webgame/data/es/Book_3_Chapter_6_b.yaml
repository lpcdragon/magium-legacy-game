              Cuando me acerco a él, de repente siento que empiezo a girar en el aire, cada vez más rápido. Intento liberarme, pero es inútil. El torbellino que me hace girar es simplemente demasiado fuerte.

              "Por fin alguien tuvo la amabilidad de caer en una de mis trampas", dice el elfo, mientras me lanza una cuchilla de viento. "¡He estado esperando aquí por años!"

              La cuchilla de viento enviada por el mago es tan afilada que me corta limpiamente por la mitad en menos de un segundo, matándome poco después.
