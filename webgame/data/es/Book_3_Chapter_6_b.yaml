              "Oh, estoy bien..." dice Kelrim. "Es solo... es solo que... si tu amigo no hubiera intervenido, lo más probable es que le hubiera lanzado ese hechizo de náuseas del que te hablé antes al capitán. Puede que hubiera estado a sólo unos segundos de terminar con mi propia vida, y la idea de eso me aterroriza un poco."
          - source: scene_text_2
            paragraph: 53
            text: |-
              "Kelrim..." dice Daren. "Lo que intentaste hacer fue muy noble, pero todavía hay personas ahí abajo que necesitan tu ayuda. No sólo están esperando que yo los salve, sino que también te están esperando a ti, y todos estarían tristes si te fueras. Entiendes esto, ¿verdad?"

              "Sí..." dice Kelrim. "Sí, lo entiendo. Gracias. ¿Nos teletransportamos de regreso a la base?"

              "Yo diría que ya era hora, sí", dice Albert, mientras finalmente cancela su hechizo de invisibilidad y se revela ahora parado justo a nuestro lado.

              "¡Buen momento, Albert!" digo. "¡Seguro que fuiste de gran ayuda allí, cuando más te necesitábamos!"

              "Ahórrame tu sarcasmo", dice Albert. "Dije que te ayudaría y lo hice. Maté a la guardia real vestida de negro, ¿no? Seguramente, ¿no esperabas que yo mismo matara a todos los guardias?"

              "No, pero habría sido bueno si al menos hubieras intentado atacar al capitán mientras nos estaba aplastando hasta la muerte", le digo.

              "El capitán tenía un Sentido mágico tan agudo que no podía acercarme a él sin que me detectaran", dice Albert. "Créanme, si ese no fuera el caso, lo habría asesinado hace mucho tiempo. No había nada que pudiera hacer".
          - source: scene_3
            paragraph: 40
            text: |-
              "Está bien, está bien, entonces supongo que nos ayudaste lo mejor que pudiste", digo. "¡Gracias por la ayuda!"

              "De nada", dice Albert. "Ahora, por favor, acérquense para que Barry pueda teletransportarnos de regreso. Estoy bastante seguro de que debería poder captar nuestra señal correctamente ahora que los guardias reales se han ido".

              Después de que todos nos reunimos en el mismo lugar, incluido Hadrik, que ha vuelto a su forma enana, Daren saca su transceptor para llamar al teletransportador.
