              "Está bien, está bien, entonces supongo que nos ayudaste lo mejor que pudiste", digo. "¡Gracias por la ayuda!"

              "De nada", dice Albert. "Ahora, por favor, acérquense para que Barry pueda teletransportarnos de regreso. Estoy bastante seguro de que debería poder captar nuestra señal correctamente ahora que los guardias reales se han ido".

              Después de que todos nos reunimos en el mismo lugar, incluido Hadrik, que ha vuelto a su forma enana, Daren saca su transceptor para llamar al teletransportador.
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch06b_fading
                condition: b3_ch4_billy = 9 AND b3_ch6_betrayed != 3
              - set:
                  current_scene: b3_ch06b_utterly
                condition: b3_ch4_billy != 9
              - set:
                  current_scene: b3_ch06b_utterly
                condition: b3_ch6_betrayed = 3
  - name: b3_ch06b_fading
    texts:
      - source: scene_text
        paragraph: 74
        text: |-
          Justo cuando está a punto de tocar su transceptor, un dron de ojos rojos cae repentinamente del cielo y golpea el suelo justo al lado de nosotros, la luz de su ojo se desvanece lentamente y su hélice no se mueve en absoluto.

          "¿Qué diablos?..." dice Daren. "¿Esta bola de metal voladora funcionó mal o algo así? Las otras todavía están flotando en el cielo, ¿verdad?"

          "Sí, todavía están ahí arriba", dice Hadrik.
    choices:
      - position: 1
        text: Sugiera acercarse al dron, para investigar qué pasó.
        effects:
          - set:
              current_scene: b3_ch06b_curiosity
      - position: 2
        text: Sugerir correr tan lejos del dron como nuestras piernas nos puedan llevar.
        effects:
          - set:
              current_scene: b3_ch06b_carry
  - name: b3_ch06b_curiosity
    texts:
      - source: scene_text
        paragraph: 75
        text: |-
          "Tal vez podamos descubrir qué pasó con el dron si miramos más de cerca", digo.

          "¿No crees que sería mejor simplemente concentrarnos en teletransportarnos fuera de aquí?" Me pregunta Daren.

          "Sí, pero por lo que sabemos, estos drones pueden ser los que interfieren con nuestra señal", digo. "Sólo dame un momento y veré si puedo encontrar algo útil".

          Luego me acerco al dron caído y empiezo a estudiarlo desde todos los ángulos, con la esperanza de descubrir alguna información útil. Mientras estoy dando vueltas lentamente a su alrededor, de repente escucho tres pitidos cortos provenientes de la bola de metal, y luego inmediatamente se autodestruye, generando una explosión tan poderosa que me destruye a mí y a todos en el área en un instante.
    effects:
      - set:
          ac_b3_ch6_curiosity: 1
        achievement:
          id: ac_b3_ch6_curiosity
          title: La curiosidad mató al gato
    choices:
      - position: 1
        text: Reiniciar juego
        effects:
          - set:
              current_scene: ch1_intro1
              storyboard_controls: Jump to frame "Chapter 1"
      - position: 2
        text: Cargar desde el último punto de control
        effects:
          - set:
              chapter_load: 1
              storyboard_controls: Jump to frame "Save load game"
      - position: 3
        text: Cargar partida
        effects:
          - set:
              storyboard_controls: Jump to frame "Save load game"
  - name: b3_ch06b_carry
    routes:
      - condition: b3_ch6_kelrim <> 1 AND b3_ch6_plan <> 3
        texts:
          - source: scene_text
            paragraph: 76
            text: |-
              "Chicos, les sugiero que corramos tan lejos de aquí como nuestras piernas nos puedan llevar", les digo.

              "¿Por qué?" Me pregunta Daren. "¿Crees que algo va a pasar con ese dron?"

              "No lo sé, pero no quiero esperar y descubrirlo", digo. "Haz una barrera detrás de nosotros mientras corremos también, sólo para estar seguros".

              "Bueno, tú eres el experto Supervisor..." dice Daren. "¡Muy bien, lo escucharon todos! ¡Huyan rápido y déjenme la defensa a mí!"

              Todos nos alejamos corriendo del dron, y Daren se asegura de ser el último del grupo para poder sostener una barrera protectora entre nosotros y la bola de metal con su escudo. Cuando llega al cadáver de Kelrim, Daren lo levanta del suelo y lo pone en su hombro derecho, mientras continúa corriendo. Mientras nos alejamos del dron, de repente escuchamos que emite tres pitidos y luego se autodestruye, generando una explosión tan grande que casi llega a los edificios al costado de la calle y creando un amplio cráter en el suelo.
          - source: scene_text_2
            paragraph: 57
            text: |-
              Incluso con la distancia que pusimos entre nosotros y el dron, el impacto de la explosión logró alcanzarnos, pero ya estábamos bastante lejos del centro de la explosión, así que no era nada que la barrera de Daren no pudiera soportar. Mientras nos detenemos para mirar la tierra chamuscada que forma el cráter detrás de nosotros y todas las ventanas que fueron rotas por la onda expansiva de la explosión, inmediatamente vuelvo mis ojos hacia los drones en el cielo que todavía flotan inocentemente, como si no estuvieran completamente conscientes de lo que está sucediendo debajo.

              "Supongo que no eres nuestro experto Supervisor por nada", dice Daren, mientras todavía mira la tierra quemada del área que dejamos. "Si hubiéramos estado más cerca de esa explosión, las cosas podrían haber terminado bastante mal".

              "No creo que haya terminado todavía", le digo, mientras sigo mirando atentamente al cielo. "El Supervisor parece haber finalmente encontrado una manera de atacarnos a pesar de su 'modo de mantenimiento' autoimpuesto. No se detendrá hasta que se le acaben los drones que pueda lanzar sobre nosotros. Illuna, ¿podrías enfriar un poco ese cráter caliente?"

              "Lo haré", dice, y luego envía un pequeño torrente de agua para inundar el agujero en el suelo que se ha formado a causa de la explosión.
          - source: scene_3
            paragraph: 43
            text: |-
              Cuando el agua entra en contacto con las rocas calientes en llamas, gran parte se evapora por el calor, pero esto ayuda a bajar la temperatura del suelo lo suficiente como para que podamos caminar sobre él nuevamente. Una vez que la tierra se ha enfriado, Illuna desecha el agua sobrante y luego me mira.

              "El suelo se ha enfriado", me dice Illuna.
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch06b_carry2
