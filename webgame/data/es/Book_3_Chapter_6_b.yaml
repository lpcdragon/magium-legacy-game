          - source: scene_text
            paragraph: 82
            text: |-
              "Iré a matar al embajador muy rápido", digo. "Estoy bastante seguro de que sé en qué casa se esconde".

              "¡Barry, vamos!" dice Daren. "¡No tenemos tiempo para esto!"

              "¡Prometo que sólo me llevará un minuto!" -digo mientras corro por uno de los callejones, con la ballesta en mis manos. "¡Ya vuelvo!"

              Rápidamente me acerco al embajador, usando mi Sentido mágico para señalar su ubicación exacta. Cuando finalmente llego a la casa en la que se encuentra, abro la puerta y lo veo parado en un rincón, sosteniendo un cuchillo con ambas manos y mirándome fijamente, con una mirada llena de odio en sus ojos.

              "¡Si te acercas más, te mataré!" Me grita el embajador. "Te destriparé con este cuchillo, ¿entiendes? ¡Quédate atrás!"

              "¡No seas así, embajador!" Le digo, mientras tranquilamente cargo algunos dardos en mi ballesta y doy unos pasos hacia él. "Estoy seguro de que en algún lugar profundo siempre supiste que esto terminaría de esta manera".
          - source: scene_text_2
            paragraph: 61
            text: |-
              "¡¿Qué estás haciendo?!" El embajador grita ahora aún más fuerte. "¡Dije que te quedes atrás! ¡No te atrevas a dar un paso más! ¡¿No me escuchas?! ¡Aléjate de mí, tú... tú... campesino!"

              "No, embajador", le digo mientras apunto mi ballesta a su frente. "¡Tú eres el campesino!"

              Luego le disparo al embajador en la cabeza, matándolo antes de que tenga la oportunidad de decir algo más. Tan pronto como termino, salgo de la casa y me dirijo hacia Daren y los demás, que estaban esperando impacientes mi regreso.

              "Oh, bien", dice Daren cuando me ve. "Has vuelto. Ven aquí. Estamos todos listos para teletransportarnos".

              "Entonces..." dice Hadrik, después de que los alcanzo. "El embajador está muerto, ¿eh?"

              "Sí", digo.

              "Siento que voy a extrañar a ese pobre bastardo", dice Hadrik. "Quiero decir, todavía lo odiaba, pero escucharlo gritar a todo pulmón cada vez que nos veía siempre me hacía sonreír, ¿sabes lo que estoy diciendo?"

              "No te preocupes", le digo. "Él todavía vivirá en tus recuerdos".

              "Sí", dice Hadrik. "Y si no es él, entonces su voz seguramente lo hará".

              "Está bien, Barry, ahora puedes teletransportarnos", dice Daren, quien ahora sostiene el cadáver de Kelrim en sus brazos, mientras aún mantiene su transceptor en su mano derecha.
            condition: b3_ch6_kelrim != 1 AND b3_ch6_plan != 3
