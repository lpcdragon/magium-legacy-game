              Mientras tengo mi revelación, dos grandes rocas vienen hacia mí desde lados opuestos, a gran velocidad, tratando de aplastarme la cabeza entre ellas. Los esquivo fácilmente y luego me dirijo hacia la gran roca en la que se esconde actualmente el elementalista. Al ver que estoy volando directamente hacia él con mi daga lista, el elementalista inmediatamente mueve su gran roca fuera del camino, y luego, de repente, la mitad de las rocas que estaban inmóviles hace solo un segundo están volando fuera del camino del elementalista para dejarle paso, mientras que la otra mitad está tratando de matarme.
          - source: scene_text_2
            paragraph: 16
            text: Con la gran cantidad de rocas que están intentando aplastarme la cabeza en este momento, honestamente debo usar toda la experiencia de vuelo que he acumulado hasta ahora para poder evitarlas. El problema es que ahora me es imposible acercarme al elementalista de la tierra, porque él sigue alejándose de mí y ya estoy demasiado ocupada tratando de mantenerme con vida.
          - source: scene_3
            paragraph: 16
            text: |-
              Espera un minuto... El elementalista de tierra sólo sabe dónde enviar sus rocas porque puede detectarme usando su Sentido mágico, ¿verdad? Entonces, ¿qué pasaría si intentara ocultar mi aura nuevamente como lo hacía antes de que comenzara la batalla? Creo que mi nivel de Ocultación de aura debería ser lo suficientemente alto como para que valga la pena intentarlo.

              Mientras sigo esquivando rocas en el aire, intento ocultar mi aura, usando la técnica que aprendí de Illuna. Casi inmediatamente después, las rocas dejan de moverse por completo y ahora están flotando en su lugar como al principio.

              ¡Está funcionando! Él ya no sabe dónde estoy, pero yo todavía sé dónde está él. Ahora, la pregunta es... ¿debería aprovechar esta oportunidad para volver a bajar y ver qué están haciendo los demás? ¿O debería seguir persiguiendo al elementalista de la tierra?
        effects:
          - set:
              successful_checks:
                - '[ Comprobación de sentido mágico exitosa - nivel 2 ]'
                - '[ Comprobación de ocultación de aura exitosa - nivel 3 ]'
              is_dead: 0
        choices:
          - position: 1
            text: Vuelve a bajar.
            effects:
              - set:
                  current_scene: b3_ch06b_visibility
                  b3_ch6_earth: 0
                condition: is_dead = 0
          - position: 2
            text: Sigue persiguiendo al elementalista de la tierra.
            effects:
