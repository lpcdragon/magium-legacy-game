              Inmediatamente reconozco que el idioma hablado es un dialecto élfico más antiguo que todavía se usa en el Continente Oriental. 

              "Intenta fingir que estás lanzando un hechizo poderoso para que pueda hacer la ilusión de una hidra de aire frente a ti", dice la voz.

              "Está bien, pero primero déjame alejarlos de mí", dice el elfo elementalista de aire en el mismo idioma, y ​​luego lanza una poderosa ráfaga de viento que nos empuja a todos lejos de su ubicación, como dijo.

              Luego, el elfo comienza a cantar algo, mientras mueve sus manos en círculos. Unos segundos después del canto, una gran hidra con seis cabezas, hecha enteramente de viento, aparece frente a nosotros, bloqueando nuestro camino hacia el elementalista de aire. Aunque técnicamente el monstruo está hecho de aire, aún podemos decir que se supone que es una hidra debido a la forma en que la luz del sol se refleja en su superficie.

              "¡Todos retrocedan!" dice Daren. "Intentaré ver si puedo absorber el elemento aire de la hidra con mi espada".
          - source: scene_text_2
            paragraph: 12
            text: |-
              "En realidad, eso no será necesario", digo. "Entendí de qué estaban hablando hace un momento, y esa hidra es sólo una ilusión. Simplemente podemos atravesarla y no nos pasará nada".

              "¿Estás absolutamente seguro de esto?" dice Daren.

              "Sí, te lo garantizo", digo. "Si fuera un farol, habrían hablado en el lengua común, no en un dialecto oscuro que normalmente no tendríamos forma de entender".

              "Bueno, entonces veamos si tienes razón", dice Daren, mientras bloquea una cuchilla de viento con su escudo y luego carga directamente a través de la hidra, junto con Leila.

              También vuelo a través de la ilusión y, a medida que nos acercamos al elementalista de aire, comenzamos a flanquearlo. El elfo intenta alejarnos de él nuevamente, pero Leila logra acercarse sigilosamente detrás de él y le atraviesa la parte posterior de la garganta con una daga antes de que tenga tiempo de reaccionar. Una vez que Leila quita su daga, el elfo le pone la mano en el cuello, tratando de detener el flujo de sangre, pero sale demasiada sangre como para que él pueda hacer algo. No mucho después, el elfo pierde la fuerza de sus piernas y cae al suelo, sin nada más que hacer que desangrarse lentamente y morir.
          - source: scene_3
            paragraph: 11
            text: |-
              Ahora vuelvo mi mirada hacia Loyrang, que hasta ahora no ha hecho nada para ayudar a su compañero de armas, a pesar de estar justo a su lado. De hecho, la guardia real de piel oscura parece bastante aburrida con toda esta situación y no muestra signos de querer atacarnos.

              "Oye, entonces, uhm... aquí tienes una pregunta rápida..." le digo. "¿Vas a ser parte de esta pelea o no?"

              "Sólo si me obligas a hacerlo", me responde Loyrang.

              "Es justo", digo.

              Mientras intentamos decidir qué hacer a continuación, el hombre con túnica negra que nos tendió una emboscada ayer de repente se teletransporta detrás de Kate, intentando apuñalarla con un cuchillo.
            condition: b3_ch6_tie = 0
          - source: scene_3
            paragraph: 10
            text: Mientras intentamos decidir qué hacer a continuación, el hombre con túnica negra que nos tendió una emboscada ayer de repente se teletransporta detrás de Kate, intentando apuñalarla con un cuchillo.
            condition: b3_ch6_tie = 1
        effects:
          - set:
              successful_checks:
                - '[ Comprobación de lenguas antiguas exitosa - nivel 2 ]'
              b3_ch6_air: 1
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch06b_robed
  - name: b3_ch06b_earth
    routes:
      - condition: b3_ch6_selected = 3
        texts:
          - source: scene_text
            paragraph: 22
            text: |-
              Vuelo en el cielo, dirigiéndome hacia los cientos de rocas que simplemente flotan en el aire, esperando caer sobre nosotros. 

              ¿Estoy simplemente imaginando cosas o ahora hay más rocas que antes? No, definitivamente no me lo estoy imaginando. La cantidad de rocas casi se ha duplicado desde la última vez que miré al cielo. ¿Significa esto que este bastardo ha estado haciendo rocas todo este tiempo mientras el resto de nosotros estábamos ocupados peleando abajo? Supongo que eso explicaría por qué no se ha molestado en atacarnos de nuevo después de esa vez al principio. Todavía debe estar preparando sus municiones.

              Cuando me acerco a las rocas, reduzco mi velocidad y vuelo hacia ellas, con la esperanza de encontrar al elementalista de tierra que las hizo en algún lugar cercano.

              Oh, chico... seguro que hay muchas rocas aquí, ¿no? Me pregunto qué pasaría si matara al elementalista de tierra que los creó mientras las rocas todavía flotan en el cielo. Probablemente no tendrán la amabilidad de permanecer en el aire, ¿verdad?... Por otra parte, si no trato con el elementalista, seguirá haciendo más de estas rocas y luego las enviará hacia el suelo a una velocidad aún mayor que si simplemente cayeran.
          - source: scene_text_2
            paragraph: 13
            text: |-
              Quizás con un poco de suerte pueda sobornar o amenazar al tipo para que aleje las rocas del campo de batalla. Si las cosas empeoran, supongo que podría gritar una advertencia a todos los que están abajo tan pronto como el elementalista de tierra esté muerto. Normalmente, eso debería darles a mis amigos suficiente tiempo para defenderse de las rocas que caen de una forma u otra.

              Mientras navego con cuidado entre las rocas, no puedo evitar notar que el dron de ojos verdes del Supervisor todavía me sigue de cerca. ¿En serio todavía cree que voy a responder esa encuesta o simplemente está bromeando conmigo?... Supongo que realmente no importa de ninguna manera. A este paso, ese dron probablemente se estrellará contra una de estas rocas y entonces ya no tendré que preocuparme más por eso.
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch06b_earth2
