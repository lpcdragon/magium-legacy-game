  - name: b3_ch06b_liked
    texts:
      - source: scene_text
        paragraph: 5
        text: |-
          "Oye, si quieres atacar al rey del subsuelo, por mí está bien. Nunca me gustó ese tipo", digo en voz alta.

          "Esas son algunas palabras ingratas que estás diciendo hacia el salvador de tu vida", me dice Gontrok, disgustado. "¿No tienes honor?"

          "Supongo que no", digo, mientras me encojo de hombros.

          "Hola, Gontrok", dice Hadrik. "¿De verdad crees que tienes el lujo de hablar con otras personas después de haberme desafiado a una batalla?"

          "Habla en serio", dice Gontrok. "Sabes muy bien que sólo estoy jugando contigo. Ya conozco tu estilo de lucha de memoria. En este punto no hay nada que puedas hacer que me sorprenda en lo más mínimo..."

