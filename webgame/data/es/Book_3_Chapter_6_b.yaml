  - name: b3_ch06b_trance2
    effects:
      - set:
          ac_b3_ch6_freeze: 1
        achievement:
          id: ac_b3_ch6_freeze
          title: Entusiasta de congelar el tiempo
    routes:
      - condition: b3_ch6_air = 0
        texts:
          - source: scene_text
            paragraph: 59
            text: |-
              "¡No te acerques más!" dice el elfo elementalista de aire, que ahora está parado justo al lado del capitán. "¡Te lo advierto!"

              Cuando ve que su advertencia está siendo ignorada, el elementalista de aire envía una cuchilla de viento a Daren, quien usa su espada para absorberla y enviarla directamente a su enemigo. El elfo de alguna manera logra bloquear el ataque entrante con una barrera contra el viento, y luego crea un pequeño tornado entre él y Daren para evitar que siga adelante. Lo que hace Daren en cambio es poner su espada en el torbellino, lo que, para nuestra sorpresa, lo hace cada vez más pequeño hasta que se convierte en este pequeño viento gris que sigue girando alrededor de la espada de Daren.

              "¡¿Qué?!" grita el elfo. "¡No! ¡No, esto es simplemente ridículo!"

              "¿Por qué estás tan sorprendido?" dice Daren. "No importa qué tan rápido lo hagas girar, un elemento sigue siendo un elemento. Mientras el tornado sea lo suficientemente pequeño, aún puedo absorberlo. Aquí, puedes recuperarlo".
          - source: scene_text_2
            paragraph: 41
            text: |-
              Luego balancea su espada en dirección al elfo, mientras el pequeño tornado se aleja de la hoja y se dirige directamente hacia el elementalista de aire, haciéndose más y más grande hasta que alcanza su tamaño original.

              "¡Ah!" grita el elfo. "¡Aléjate de mí!"

              Mientras huye, el tornado sigue siguiéndolo, y ahora el capitán que se vio obligado a apartarse del camino del torbellino se encuentra en un aprieto, porque Daren ha aprovechado esta distracción para acercarse a él rápidamente. Antes de que pueda reaccionar, Daren le atraviesa el corazón con su espada, matando al hombre casi de inmediato. El capitán pronto cae al suelo en un charco de su propia sangre, mientras Daren envaina tranquilamente su espada y se vuelve para mirarnos.
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch06b_tactical
      - condition: b3_ch6_air >= 1
        texts:
          - source: scene_text
            paragraph: 58
            text: |-
              Aunque el capitán intenta muchas más veces alejar a Daren de él, falla repetidamente, y ahora que Daren tiene su arma de regreso podemos ver claramente que le resulta mucho más fácil repeler los ataques de su enemigo. Cuando Daren se acerca a su oponente, el capitán intenta una última apuesta desesperada al conjurar la espada semi-invisible que usó antes para cortar la serpiente de agua de Illuna y blandirla tan fuerte como pueda hacia el sanador con armadura.

              Lamentablemente para él, no le queda suficiente energía para hacer que su arma sea tan poderosa como antes, y Daren la corta en un instante, decapitando al capitán en el mismo movimiento. Mientras el cuerpo decapitado del capitán cae en un charco de su propia sangre, Daren envaina tranquilamente su espada y se gira para mirarnos.
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch06b_tactical
  - name: b3_ch06b_nausea
    texts:
      - source: scene_text
        paragraph: 61
        text: |-
          Mientras todo esto sucede, tengo una repentina Premonición en la que veo al capitán tener un dolor de cabeza que le hace perder el control de su técnica de manipulación del aura, e inmediatamente después veo otra visión de Daren cargando el cadáver sin vida de Kelrim con una expresión muy sombría en sus ojos.

          ¿Significa esto que Kelrim se sacrificará para lanzar su hechizo de náuseas sobre el capitán? ¿Aún podría detenerlo si le dijera que no lo hiciera? Maldita sea, este dolor es tan agonizante que es difícil pensar con claridad.
    effects:
      - set:
          successful_checks:
            - '[ Comprobación de premonición exitosa - nivel 2 ]'
    choices:
      - position: 1
        text: Dile a Kelrim que no lance el hechizo de náuseas.
        effects:
          - set:
              current_scene: b3_ch06b_touching
              b3_ch6_kelrim: 1
      - position: 2
        text: No le digas nada a Kelrim.
        effects:
          - set:
              current_scene: b3_ch06b_panic
              b3_ch6_kelrim: 2
  - name: b3_ch06b_touching
    effects:
      - set:
          ac_b3_ch6_guardian: 1
        achievement:
          id: ac_b3_ch6_guardian
          title: Ángel guardián
        condition: b3_ch6_manipulators = 2
    routes:
      - condition: b3_ch6_manipulators <> 2
        texts:
          - source: scene_text
            paragraph: 62
            text: |-
              "¡Kelrim, no lo hagas!" Grito fuerte. "¡No lances el hechizo de las náuseas!"

              "¿Qué?..." dice Kelrim. "¿Cómo supiste que iba a--"

              "No necesitas sacrificarte", le digo. "Estoy seguro de que podemos-- NGH... ¡Estoy seguro de que podemos encontrar una salida a esto si trabajamos juntos!"

              "¡A este paso vamos a morir todos!" —grita Kelrim. "Es mejor si soy el único que pierde la vida, en lugar de todos. Solo soy un Goblin. Los Goblins mueren todo el tiempo. ¡Nadie estará triste cuando me vaya!"

              "¡Maldita sea, Kelrim!" Dice Daren, ya que claramente está luchando por formar una oración adecuada debido al dolor. "¡No te atrevas a decir algo así otra vez! Te prohíbo que te mates, ¿entiendes? O salimos todos vivos de aquí o morimos todos juntos. ¡Nadie se queda atrás!"

              "Qué conmovedor", dice el capitán con un tono de voz frío. "Espero que hayan terminado de despedirse, porque pronto se les cumplirá su deseo. Todos morirán aquí juntos".
          - source: scene_text_2
            paragraph: 44
            text: |-
              A medida que el dolor aumenta, se vuelve cada vez más difícil mantener la conciencia. Durante este tiempo, Kate y Flower disparan algunos proyectiles al capitán, pero él los bloquea fácilmente. Daren también intenta desesperadamente recuperar su espada, pero está demasiado debilitado para concentrarse adecuadamente en su técnica de aura.

              Mientras mi vida pasa ante mis ojos, por alguna razón de repente recuerdo las palabras que Arraka le dijo a Daren esta mañana: "Obviamente tienes una afinidad natural por la manipulación del aura".

              ¿Podría esto haber significado que otros miembros de nuestro equipo también hubieran tenido esa afinidad? ¿Habrían podido hacer lo que Daren hizo con su aura si solo hubieran practicado un poco?... ¿Por qué estoy siquiera pensando en esto? Ya es demasiado tarde para preguntarle a Arraka sobre esto. Ya es demasiado tarde para hacer algo. También puedo... irme a dormir.

              Cuando el dolor finalmente me vence, pierdo el conocimiento para siempre y muero poco después, junto con todos los demás.
        effects:
          - set:
              is_dead: 1
        choices:
