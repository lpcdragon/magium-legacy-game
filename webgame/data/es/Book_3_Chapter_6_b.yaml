            paragraph: 45
            text: |-
              No mucho después de que el capitán deja de hablar, sentimos que la presión sobre nosotros desaparece repentinamente, aunque no parece que Daren haya hecho nada esta vez. Mientras todos nos levantamos del suelo, confundidos, el capitán mira a Kate mientras la señala, con una mirada de incredulidad en su rostro.

              "¡¿Tú hiciste esto ?!" dice el capitán. "¿Con un carámbano, precisamente? ¡¿Qué clase de improvisación a medias es esta?!"

              Ahora me doy cuenta de que Kate estuvo sosteniendo un carámbano en la mano todo este tiempo. Ella debe haber estado tratando de copiar la técnica de "desenredar" de Daren desde que perdió su espada.

              En lugar de responder a la pregunta del capitán, Kate le envía varios carámbanos, mientras que Flower e Illuna también envían sus propios proyectiles hacia él. Está claro que Kate e Illuna ya han agotado la mayor parte de su energía mágica, porque sus ataques son significativamente más débiles que antes. Flower, por otro lado, parece haber sido un poco más cuidadosa con su gasto de energía, porque su magia es tan fuerte como al principio.
