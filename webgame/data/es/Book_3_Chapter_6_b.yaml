  - name: b3_ch06b_convince
    texts:
      - source: scene_text
        paragraph: 28
        text: |-
          "Escucha", digo. "No sé cuánto te está pagando el rey por hacer su trabajo sucio, pero estoy seguro de que podemos negociar un trato siempre y cuando..."

          De repente, una púa muy afilada hecha de la roca debajo de nosotros vuela rápidamente hacia mi mano derecha y me hace soltar mi arma. Antes de que tenga la oportunidad de recuperarlo, el elementalista de tierra se escapa de mi alcance, arrojándose desde su roca flotante hacia una plataforma de piedra flotante recién creada debajo de él, mientras cientos de rocas ahora vuelan hacia mí desde todas direcciones. Dado que no tengo espacio para escapar, inevitablemente termino siendo aplastado por la multitud de rocas y muero poco después.
    choices:
      - position: 1
        text: Reiniciar juego
        effects:
          - set:
              current_scene: ch1_intro1
              storyboard_controls: Jump to frame "Chapter 1"
      - position: 2
        text: Cargar desde el último punto de control
        effects:
