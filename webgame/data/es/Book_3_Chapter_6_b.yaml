              storyboard_controls: Jump to frame "Save load game"
  - name: b3_ch06b_ambassador
    texts:
      - source: scene_text
        paragraph: 29
        text: |-
          "Intentaré volar más cerca del embajador y del capitán", digo, mientras estoy flotando ligeramente sobre el suelo. "Si los ataco desde otro ángulo, tal vez al capitán le resulte más difícil mantener sus defensas".

          "Asegúrate de estar atento a las rocas flotantes sobre nosotros", dice Illuna. "No se sabe cuándo el elementalista de la tierra que los creó decidirá dejárnoslos caer".

          "Gracias, lo tendré en cuenta", digo. "Vuelvo enseguida."

          Luego me levanto un poco más en el aire y vuelo hasta el lado del capitán, colocándome a unos seis metros por encima de él y del embajador. Después de disparar unas cuantas flechas que son fácilmente repelidas por la barrera del capitán, empiezo a recargar la ballesta y mientras tanto intento entablar conversación con mi viejo amigo, el embajador de Ollendor.

          "Hola, embajador", digo en voz alta. "¡Mucho tiempo sin verlo!"
      - source: scene_text_2
        paragraph: 21
        text: |-
          "¡No me hables, asesino!" —grita el embajador. "¡Me aseguraré de que pagues por lo que has hecho!"

          "¡Pero ya pagamos por eso!" Digo, mientras disparo a la barrera del capitán unas cuantas veces más. "Nos vimos obligados a participar en un evento en la arena que fue diseñado específicamente para matarnos, e incluso se te permitió organizarlo como quisieras. No es mi culpa que seas tan mal organizador, ¿sabes?"

          "¡Callarse la boca!" grita el embajador en voz más fuerte que antes. "Este ya no es Thilias, ¿entiendes? ¡El rey gnomo y el dueño de la arena no te salvarán esta vez! ¡Yo soy el que tiene el control aquí! ¡Los guardias reales y todo el ejército de Ollendor han sido puestos bajo mi mando con el único propósito de matarte!"

          "¡Lo sé y estoy muy agradecido por eso!" digo. "Quiero decir, ¿puedes siquiera imaginar lo que nos habría hecho un ejército si no estuviera controlado por un bufón incompetente como tú?"

          "¡Silencio!" —grita de nuevo el embajador. "¡Ya he oído suficiente de usted! ¡Capitán, le ordeno que ejecute a este hombre ahora mismo!"

          "Embajador, si lo ataco ahora, la barrera se debilitará y su seguridad se pondrá en riesgo..." comienza a decir el capitán, pero es interrumpido.

          "¡No me importa!" grita enojado el embajador. "¡Quiero que lo mates ahora! ¡Hazlo! ¡Es una orden!"
    choices:
      - position: 1
        text: Intenta disparar al embajador mientras la barrera esté debilitada.
        effects:
          - set:
              current_scene: b3_ch06b_weakened
      - position: 2
        text: Vuela de regreso con Kate e Illuna.
        effects:
          - set:
              current_scene: b3_ch06b_fly
  - name: b3_ch06b_weakened
    routes:
      - condition: b3_ch6_selected = 3
        texts:
          - source: scene_text
            paragraph: 30
            text: |-
              "Como desee, embajador..." dice el capitán, luciendo claramente disgustado.

              Luego estira su brazo derecho hacia mí y rápidamente lo baja, con su mano cerrada en un puño, como si estuviera agarrando una cuerda que está atada a mí o algo así. Ni siquiera un segundo después, una fuerza invisible me arrastra varios metros hacia abajo antes de que logro liberarme y apuntar mi ballesta directamente al embajador.

              "¡Advertencia! ¡Advertencia!" Escucho la voz del Supervisor, cuyo dron de ojos verdes aparentemente todavía me seguía. "El protocolo Supervisor está detectando técnicas de manipulación del aura peligrosamente cerca de las coordenadas de esta unidad. Si no se detiene inmediatamente, esta unidad se verá obligada a pedir refuerzos".

              "Supervisor, se le ordenó retirarse", dice el capitán. "Sal de esta zona ahora o afrontarás las consecuencias".

              "¡Error!" dice el Supervisor. "¡No puedo cumplir con esa orden!"

              Aprovecho la distracción del capitán para disparar algunos rayos a la barrera ahora debilitada, y logro golpear al embajador en el lado derecho de su pecho.
          - source: scene_text_2
            paragraph: 22
            text: |-
              "¡Ja!" digo. "¡Lo hice!"

              Apenas llego a terminar lo que estaba diciendo cuando siento una presión inmensamente poderosa empujándome hacia abajo, haciéndome caer de espaldas contra la barrera semitransparente del capitán y restringiendo por completo todos mis movimientos. Mientras intento liberarme de la técnica de manipulación del aura, el capitán saca una daga fuertemente encantada y la usa para apuñalarme en la nuca desde abajo. Su arma mágicamente afilada atraviesa mi cráneo con facilidad y me mata en el acto.
