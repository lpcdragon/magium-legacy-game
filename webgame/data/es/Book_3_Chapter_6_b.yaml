  - name: b3_ch06b_visibility
    routes:
      - condition: b3_ch6_tie = 1
        texts:
          - source: scene_text
            paragraph: 25
            text: |-
              Perseguir al elementalista probablemente llevará un tiempo. Primero debería comprobar y ver cómo les está yendo a todos los demás. No tengo mucha visibilidad con todas estas grandes rocas a mi alrededor, así que no tengo idea de lo que ha estado sucediendo allí todo este tiempo.

              Salgo volando de la zona de rocas y luego echo un vistazo rápido al suelo para ver si alguien está en problemas. Al parecer, Hadrik todavía está luchando contra Gontrok, pero le va bien por sí solo. Daren y Leila están ocupados con el elfo elementalista del aire, que parece haber conjurado una especie de hidra hecha de viento que los obliga a mantener una posición defensiva dentro de la barrera mágica de Daren por ahora.

              Kate y Flower siguen disparando proyectiles al capitán y al embajador, pero también están luchando contra el tipo con túnica negra que nos tendió una emboscada ayer a la misma hora. Illuna y Kate están tratando de golpearlo, pero él sigue teletransportándose y enviándoles espadas voladoras, por lo que les resulta difícil lidiar con él. Creo que les vendría bien un poco de ayuda.

              Decido volar un poco más cerca del suelo, con la esperanza de poder tomar por sorpresa al tipo vestido de negro.
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch06b_robed
