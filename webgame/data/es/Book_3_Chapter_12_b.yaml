              "¡De ninguna manera!" dice Hadrik, en voz alta. "No he tenido otra pelea que mis sesiones de sparring con Daren desde Ollendor, ¿y me estás diciendo que me aleje de una batalla por mi propia voluntad? Si estos tipos quieren una parte de mí, entonces la obtendrán. ¡Recuerda mis palabras!"

