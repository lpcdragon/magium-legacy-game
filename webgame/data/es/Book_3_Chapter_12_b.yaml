  - name: b3_ch12b_blinding
    texts:
      - source: scene_text
        paragraph: 65
        text: |-
          No pierdo el tiempo y lanzo mi mareo hechizo sobre Eiden. Si esto es lo mismo que cuando probé el hechizo en Diane, normalmente debería estar escuchando un zumbido en sus oídos en este momento... exactamente el mismo tipo de zumbido que escucharías si el aturdimiento de Wolford hubiera caído sobre ti.

          Si Eiden estuviera en un estado mental tranquilo, habría notado fácilmente que el flujo mágico de mi mareo hechizo era ligeramente diferente, pero con la forma en que está en este momento, y considerando que el aturdimiento de Wolford solo te da un tiempo limitado para cancelarlo antes de que se active por completo, Eiden realmente solo tiene una opción. Necesita abrir los ojos.

          "¡Daren, atrapa!" Grito fuerte, mientras Eiden abre ampliamente los ojos y mira a su alrededor para cancelar el aturdimiento de mi falso Wolford hechizo.

          Al oír la palabra clave que hemos estado practicando sin cesar durante los últimos dos días, todos mis amigos cierran los ojos instintivamente, y luego yo cierro los míos también, mientras lanzo mi destello de luz cegador.

          Dado que Eiden pasa la mayor parte de su tiempo con los ojos cerrados, sólo puedo imaginar lo sensible que debe ser a los destellos repentinos de luz brillante. Si mi suposición es correcta, entonces un shock repentino como este debería sobrecargar todos sus sentidos, incluido su sentido mágico.

          "Kate--" empiezo a decir, pero ahora veo que ella ya apuntaba con su cetro hacia Eiden, mientras preparaba su hechizo.

          "Estoy en ello", dice Kate, y luego dispara a Eiden con un rayo de hielo incluso más poderoso que el que nos mostró ayer.
      - source: scene_text_2
        paragraph: 50
        text: |-
          Tal como esperaba, Eiden no bloquea al hechizo en absoluto y queda encerrado en un gran bloque de hielo, incapaz de moverse ni un centímetro. ¡Vaya, esto ha ido mucho mejor de lo que pensaba! ¡Ahora sólo queda un último paso y todo habrá terminado! Un último paso...

          Mientras me calmo y pienso en este paso final con más claridad, de repente me doy cuenta de que puede haber habido un gran error en mi plan que no había tenido en cuenta en absoluto. Todo este plan fue diseñado originalmente para eliminar la versión anterior de Arraka, no Eiden. No hace falta decir que Daren sería capaz de matar la copia de Arraka sin ninguna duda, pero ¿se aplica lo mismo para Eiden?...

          Echando un vistazo a Daren ahora, está claro que entiende su papel en este plan y conoce la gravedad de la situación, pero aun así, solo está mirando el bloque de hielo con su espada en sus manos, incapaz de actuar.

          Creo que sé exactamente lo que debe estar pasando por su cabeza en este momento. Toda la pelea, Daren se ha centrado en apuñalar a Eiden una vez con su espada encantada, para poder cortar su conexión con el plano mágico y dejarlo esencialmente impotente, sin llegar a matarlo. Ahora tiene frente a él un gran bloque de hielo, de durabilidad desconocida, que debe atravesar para llegar a Eiden. Si usara toda su fuerza, podría fácilmente cortar a Eiden por la mitad junto con el hielo y matarlo en el acto, pero si quisiera apuñalarlo sólo ligeramente para cortar su fuente de energía, necesitaría precisión quirúrgica.
      - source: scene_3
        paragraph: 38
        text: |-
          No puede darse el lujo de cortar el hielo más de una vez, porque eso podría permitir que Eiden se libere, por lo que solo tiene una oportunidad para hacerlo. Pero, ¿es algo que realmente pueda lograr sin arriesgar nuestras vidas en el proceso?

          "¿Daren?..." pregunta Flower, en tono preocupado, luego de verlo mirando el bloque de hielo frente a él durante más de cinco segundos, mientras suda mucho. "¿Está todo bien?"

          "¡¿Por qué estás dudando, imbécil?!" Arraka grita de repente. "¿De verdad crees que te habría mostrado piedad si tus posiciones estuvieran invertidas? ¡¿Tienes la oportunidad de tu vida de matar a Eiden de una vez por todas y estás dudando?! Date prisa y hazlo ya, antes de que él--"

          "Demasiado tarde", escuchamos la voz de Eiden, mientras el bloque de hielo que lo rodea explota en pedazos, y la cantidad de poder mágico que irradia su aura se vuelve tan alta como cuando se enfrentaba a Tyrath en Thilias.

          Oh, no... Se acabó. Realmente llegamos demasiado tarde...

          "Tal vez he estado jugando demasiado", dice Eiden, en un tono de voz muy serio, ya que la intensidad de su aura por sí sola nos dificulta la respiración. "Es hora de poner fin a esto".
