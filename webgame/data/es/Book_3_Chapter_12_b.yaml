  - name: b3_ch12b_wolf
    routes:
      - condition: ancient_languages < 2
        texts:
          - source: scene_text
            paragraph: 27
            text: |-
              Esperamos unos minutos frente a la entrada del bosque sagrado, tal como lo pidió el zorro, hasta que finalmente se teletransporta de regreso junto con Leo el leopardo.

              Además, aparte de Leo, parece haber traído un lobo con ella también. Me toma unos segundos reconocerlo, pero luego me doy cuenta de que es uno de los dos lobos que salvamos del incendio forestal hace un tiempo, junto con su oso guardaespaldas. El lobo parecía llevar una especie de brazalete de madera en la boca cuando fue teletransportado, que ahora está dejando en el suelo frente a él.

              "Este lobo afirma que lo salvaste de un incendio forestal hace algún tiempo", nos cuenta el zorro. "¿Es esto cierto?"

              "Sí, sucedió durante una tormenta", digo. "Lo recuerdo".

              "En ese caso, te dejaré conversar con él en paz y volveré para teletransportarlo más tarde", dice Eleya. "Leo, si necesitas algo, ya sabes cómo contactarme".

              "Sí, fantástico zorro dorado", dice Leo. "Estaré bien".
          - source: scene_text_2
            paragraph: 22
            text: |-
              Después de que el zorro se va, el lobo comienza a gruñirme un par de veces y, mientras hace estos ruidos, de repente me doy cuenta de que está tratando de comunicarse conmigo en su lenguaje animal, como la última vez, excepto que ya no puedo entenderlo porque ya no tengo suficientes puntos en mi estadística Lenguas antiguas.

              Intento explicarle esto en el lengua común, pero parece que tampoco me entiende. Al ver lo que está pasando, Leo finalmente se ofrece a ser nuestro traductor, para que finalmente podamos tener nuestra conversación.

              "Cuando escuché al zorro hablar con Leo sobre unos humanos que lo escoltaban, tuve la sensación de que podrías ser tú", dice el lobo, en su propio idioma. "Te dije la última vez que te recompensaría si alguna vez te acercabas a uno de los bosques sagrados en el futuro, y he venido aquí para cumplir esa promesa. Por favor, toma este brazalete. Es mi regalo para ti. Que lo uses con buena salud".

              "¡Oye, muchas gracias!" Lo digo en el lengua común, después de escuchar la traducción del leopardo.

              Luego recojo el brazalete del suelo y lo coloco alrededor de mi muñeca izquierda, mientras Leo traduce lo que le acabo de decir al lobo.

              "¿Hay algo más que necesito saber al respecto?" pregunto. "¿Ciertas palabras para activarlo o condiciones que deben cumplirse antes de que comience a funcionar?"
          - source: scene_3
            paragraph: 20
            text: |-
              "Este tipo de artefacto no tiene un equivalente en tu mundo humano, por lo que es un poco difícil para mí explicártelo", dice el lobo, "pero funcionará mucho mejor si no sabes exactamente qué hace. Puedes considerarlo como... una especie de amuleto de buena suerte. Está destinado a ayudarte cuando te enfrentes a un enemigo que tiene una cantidad abrumadora de poder en comparación contigo. Sin embargo, solo se activará una vez, por lo que no debes confiar en él después de que se haya agotado su único uso".

              "Eso suena muy interesante", le digo. "Entonces me aseguraré de usar esto en todo momento. Gracias de nuevo. ¡Fue un placer conocerte una vez más!"

              "El placer fue todo mío, humano", dice el lobo. "¡Buen viaje para ti y tus amigos!"

              "¿Continuamos entonces?" Nos pregunta Diane.

              "Efectivamente", dice el leopardo. "¿Confío en que sepas cómo llegar a Galamir desde aquí?"

              "Por supuesto", dice Diane. "La forma más fácil es encontrar la carretera principal y simplemente seguir las señales. Después de todo, es una de las ciudades más visitadas de Varathia".

              "Sí, ese es el camino que suelo tomar también", dice Leo. "El camino más rápido a la carretera principal es en esta dirección. Vámonos".
