          - source: scene_text_2
            paragraph: 9
            text: |-
              "¿El zorro le dijo a Eiden que no me matara?" Flower dice. "¡No tenía ni idea!"

              "Parece que nos ha estado protegiendo detrás de escena, a pesar de no demostrarlo", dice Illuna. "Quizás tu insistencia en seguir ayudando a los animales cuando estaban en peligro de muerte durante estos últimos veinte años no haya sido completamente en vano después de todo".

              "¿Por qué no los habría ayudado?" Flower dice. "¡Son mis amigos!"

              "Correcto", dice Illuna.

              "¡Callad, desgraciados!" dice el líder nigromante. "¡No he venido hasta aquí para escuchar tus insípidas tonterías! ¡Vendrás con nosotros ahora o tus amigos sufrirán!"

              "¿Cuántas veces tendré que escucharte ofreciéndote a perdonar la vida a estas personas, antes de que seas un hombre y hagas lo que hay que hacer, cobarde?" dice el seguidor de Dios del Destino, quien recién ahora habla por primera vez.

              "¡¿Te ​​atreves a hablarme de esta manera, lunático?!" dice el líder nigromante. "¿Después de que tuve la amabilidad de permitirte unirte a nosotros en este viaje?"
