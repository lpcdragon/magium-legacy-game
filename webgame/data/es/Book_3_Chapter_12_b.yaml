  - name: b3_ch12b_attack3
    texts:
      - source: scene_text
        paragraph: 14
        text: |-
          De repente, los cuatro magos están siendo envueltos por una luz blanca de aspecto familiar, mientras sus cuerpos comienzan a vibrar fuertemente.

          "Esto no ha terminado, ya sabes..." nos dice Clogsworth, mientras Kate rápidamente conjura un carámbano para dispararle. "Nos volveremos a ver. Y la próxima vez no serás tan..."

          "¿Suerte?..." Flower intenta adivinar la última palabra de la frase del mago ilusionista, mientras él y sus aliados desaparecen delante de nuestras narices.

          Justo antes de escapar, Kate logró disparar un último carámbano a Clogworth, pero en ese momento, la teletransportación hechizo ya había desmaterializado su cuerpo a tal punto que el proyectil lo atravesó.

          "¡ARGH!" exclama Arraka. "¡No puedo creerlo! ¡No puedo creer que hayas dejado escapar a otro grupo de enemigos de esta manera! ¿Cuántos de ellos son eso? Tienes a Talmak y sus compinches, tienes los escuadrones de élite de Tyrath, el propio Tyrath, Loyrang de los guardias reales Ollendor... ¡¿Me estoy olvidando de alguien aquí?!"
      - source: scene_text_2
        paragraph: 15
        text: |-
          "En realidad", digo, "no creo que Loyrang realmente cuente como enemigo ya que él prácticamente--"

          "¡Cállate!" Arraka dice. "¡No me importa si sigue siendo un enemigo o no! Lo que estoy tratando de decir es que no puedes seguir dejando que este tipo de perdedores te pisoteen así. ¡Estás tratando de matar DIOSES! ¡Actúa como tal, maldita sea!"

          "Hasta donde yo sé, sólo estamos tratando de matar a un dios", dice Daren, mientras ahora está examinando el área desde donde se teletransportaron los magos, tratando de ver si dejaron alguna pista. "Y resulta que fuiste tú quien dijo que necesitabas tiempo para descifrar el hechizo del ilusionista, no nosotros. Si no quieres que se escapen así, trabaja más rápido la próxima vez".

          "Bah..." dice Arraka indignada, aunque no parece que esté planeando proporcionar ningún contraargumento a la afirmación de Daren de que ella sí tuvo una contribución al fracaso de nuestro equipo esta vez.
      - source: scene_3
        paragraph: 13
        text: |-
          "¿Hay más explosivos ocultos que debamos conocer?" Illuna dice. "No me gustaría explotar por accidente después de que el enemigo ya se haya retirado..."

          "No", dice Arraka, ya que ahora se está calmando. "El ilusionista colocó la mayoría de esas trampas a toda prisa, por lo que no tuvo tiempo de colocar muchas. Lo atrapé mientras estaba apilando trampas justo al lado de la barrera de Daren y la cúpula de Kate, oculto por su ilusión. Luego comenzó a correr tan pronto como te advertí sobre las trampas y las detonó de forma remota".

          "¿A qué distancia se teletransportaron?" pregunta Kate.

          "Lo suficientemente lejos como para que ya no pueda sentirlos", dice Arraka. "Probablemente ya estén en su base de operaciones".
