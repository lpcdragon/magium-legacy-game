  - name: b3_ch12b_ending
    texts:
      - source: scene_text
        paragraph: 73
        text: |-
          "¿Pero por qué decidiste intervenir tan tarde?" Kate dice. "No es que me esté quejando, pero seguramente debes haberte dado cuenta de que no había garantía de que ninguno de nosotros sobreviviera por tanto tiempo. ¿Tiene algo que ver con esos 'intereses comunes' nuestros que dijiste haber descubierto recientemente?"

          "Muy observador una vez más", dice Azarius. "Y para responder a tu pregunta, sí, de hecho decidí ayudarte basándome en algo que se dijo hacia el final de tu batalla".

          De repente, escuchamos a Arraka comenzar a reír histéricamente, de una manera que no la habíamos escuchado reír en bastante tiempo.

          "¿Qué es tan gracioso, Arraka?" pregunta Daren.

          "Creo... ahahah... creo que sé por qué sabio decidió ayudarte", dice Arraka, mientras apenas puede contener la risa. "Ahahaha-- si es lo que creo que es, ¡te va a encantar!"
      - source: scene_text_2
        paragraph: 56
        text: |-
          "Entonces, ¿te importaría decirnos de qué se trata todo esto, sabio Azarius?" Le pregunta Kate, con recelo.

          "Ah, sí", dice Azarius. "Verás, a lo largo de mi larga vida he logrado muchas cosas: fama, poder, conocimiento... pero aunque he adquirido cosas con las que la mayoría de la gente sólo sueña, y he admitido que he logrado muchas de las metas que me propuse cuando era muy joven, todavía hay una última meta que aún no he logrado lograr, que es casualmente también la razón por la que decidí unirme a este torneo".

          "Siento que me voy a arrepentir de haber hecho esto", dice Kate, "pero ¿cuál es exactamente el objetivo del que estás hablando?"
      - source: scene_3
        paragraph: 45
        text: |-
          Azarius sonríe.

          "Para destronar a los dioses y ocupar su lugar", responde con calma.

          "¡Aha-Ahahaha! ¡Ahahahahahahaha!"

          -----Fin del libro 3-----
