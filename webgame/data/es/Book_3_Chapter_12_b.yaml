            paragraph: 51
            text: |-
              "Eiden, ¡cuidado!" Grito. "¡Hay un orangután volador borracho con un sombrero de fiesta detrás de ti!"

              "¿Qué?..." dice Eiden, mientras gira su cabeza por un segundo, para verificar si lo que dije era cierto o no.

              Ese segundo de distracción fue todo lo que Hadrik necesitó para estrellar ambos puños en la cabeza de Eiden y enviarlo a estrellarse contra el suelo, creando un pequeño cráter donde aterrizó.

              Justo cuando Eiden se levanta del suelo, su cabeza es rodeada por una esfera de agua hecha por Illuna, lo que parece haberlo tomado completamente desprevenido, porque ya puedo escucharlo haciendo ruidos de ahogamiento. Intenta volar un poco, con la esperanza de poder sacudirse el hechizo, pero la práctica de Illuna con el lavado de platos parece haber dado sus frutos, y la esfera de agua permanece firmemente pegada a su cabeza.
          - source: scene_text_2
            paragraph: 41
            text: |-
              Con el rabillo del ojo, veo a Kate levantando su cetro y apuntando a Eiden, lista para atacar.

              "¡Kate, todavía no!" Grito, mientras ella ahora baja su cetro después de escuchar mi voz.

              Puede que Eiden haya sido tomado un poco por sorpresa, pero de ninguna manera está indefenso. Aún podría detener fácilmente el rayo de hielo de Kate si tuviera tiempo de reaccionar. Para que no sea consciente en absoluto de lo que le rodea, necesitamos un último empujón.
          - source: scene_3
            paragraph: 33
            text: |-
              Daren ahora envía su espada girando rápidamente hacia Eiden, pero el stillwater levanta una gran púa hecha de roca del suelo, desviando así la dirección del arma. Mientras tanto, Eiden invoca un pequeño tornado de la nada y se deja atrapar intencionadamente en su interior. Esto resulta ser demasiado para el hechizo de ahogamiento de Illuna, y sus partículas de agua finalmente se dispersan en el aire.

              Al cancelar el tornado Eiden, vuelve a caer al suelo y luego se lleva la mano a la frente, sin hacer nada más durante unos segundos. Su cabeza debe estar dando vueltas como loca en este momento. Este es el momento que estaba esperando. ¡Es ahora o nunca!
