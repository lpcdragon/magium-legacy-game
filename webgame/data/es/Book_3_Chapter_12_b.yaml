  - name: b3_ch12b_necromancers
    routes:
      - condition: b3_ch12_scout = 0
        texts:
          - source: scene_text
            paragraph: 4
            text: |-
              "Sí, tienes razón", digo. "Mantengámonos unidos y veremos qué pasa cuando suceda".

              "Técnicamente, todavía es posible que todos tengan un sentido mágico realmente malo y simplemente no nos hayan detectado todavía", dice Daren. "Sigamos avanzando en la misma dirección por un tiempo más y veamos qué están haciendo antes de tomar cualquier decisión final".

              Hacemos lo que dice Daren y seguimos caminando unos dos minutos más. Durante este tiempo, los cuatro magos que percibimos antes dejaron de moverse por completo y cada vez es más probable que simplemente estén esperando que los alcancemos. Al darnos cuenta de que este es el escenario más probable, todos nos detenemos también para poder tener una breve discusión entre nosotros sobre lo que planeamos hacer a continuación.

              "Entonces, ¿qué piensan ustedes?" Nos pregunta Daren. "¿Podrían ser amigables estos tipos? ¿O nos están retando a una pelea?"

              "No hay manera de saberlo sólo con la información que tenemos actualmente", dice Kate. "Por el momento, ni siquiera podemos estar seguros de si los hemos conocido antes o no".

              "No los habías conocido antes", dice Arraka. "Eso te lo puedo confirmar."

              "Bueno, entonces no tengo idea de lo que podrían querer de nosotros", dice Kate. "Tal vez sean hostiles, o tal vez simplemente quieran preguntarnos si encontramos alguna piña. Todo lo que podemos hacer es adivinar".
          - source: scene_text_2
            paragraph: 5
            text: |-
              "Podríamos rodearlos si quieres", dice Diane. "Tomará un poco más de tiempo, pero eventualmente llegaremos al bosque sagrado".

              "¡De ninguna manera!" dice Hadrik, en voz alta. "No he tenido otra pelea que mis sesiones de sparring con Daren desde Ollendor, ¿y me estás diciendo que me aleje de una batalla por mi propia voluntad? Si estos tipos quieren una parte de mí, entonces la obtendrán. ¡Recuerda mis palabras!"

              "También estoy de acuerdo en que no tiene sentido intentar evitarlos", afirma Kate. "Todos podemos sentirnos unos a otros, así que si ven que los estamos rodeando, simplemente vendrán detrás de nosotros. Enfrentarlos directamente es probablemente nuestra mejor opción en esta situación".

              "¡Ja!" Hadrik dice. "¡Eso es lo que me gusta oír!"

              "Si todo el mundo está de acuerdo, seguiremos avanzando", afirma Daren. "Sólo estén atentos, porque tienen un poco de tiempo para colocar trampas hasta que lleguemos allí".

              Seguimos caminando durante unos dos minutos más, y finalmente llegamos a una gran zona sin árboles, que aparentemente es donde los cuatro magos se habían detenido a esperarnos.

              Ahora que finalmente estoy viendo bien a nuestros emboscadores, veo que tres de ellos visten túnicas negras y tienen cabezas calvas con tatuajes de serpientes, luciendo como copias casi exactas de Zack, el nigromante que conocimos durante nuestra primera semana en Varathia, mientras que el cuarto viste una túnica verde y tiene un círculo plateado en la cabeza, lo que significa que probablemente sea un seguidor del Dios del Destino.
          - source: scene_3
            paragraph: 6
            text: |-
              Justo cuando Daren estaba a punto de llamarlos, uno de los nigromantes se para delante de su grupo y nos grita a nosotros.

              "Antes de comenzar", dice el nigromante, "¡primero me gustaría felicitarlos a todos por presentarse para enfrentarnos incluso después de sentir nuestro poder mágico obviamente superior! La mayoría de las personas tienden a encogerse de miedo ante nosotros, por lo que al menos deben ser elogiados por su valentía, al menos".

              "Estás bromeando, ¿verdad?" Le dice Daren. "Está claro como el día que somos mucho más fuertes que tú. Y también somos más. ¿Tu sentido mágico es defectuoso o algo así?"

              Después de escuchar lo que Daren tenía que decir, los tres nigromantes comienzan a reír al unísono, hasta que el nigromante frente a ellos, que parece ser una especie de líder, poco a poco se queda en silencio nuevamente y les indica a los otros dos que hagan lo mismo.

              "Lo único que está claro", dice el nigromante, "es que sus mentes simples ni siquiera pueden comenzar a comprender la inmensa diferencia de poder entre nosotros, los devotos seguidores de nuestro dios, y ustedes, desgraciados infieles que tienen que usar libros y pergaminos para siquiera tener alguna posibilidad de lanzar un hechizos mediocre. Pero como hoy me han divertido, me inclino a dejarlos vivir, siempre y cuando nos entreguen a la niña sin posar. resistencia."

              "¿Qué?..." pregunta Daren, confundido. "¿Por qué?... ¿Qué negocio podrías tener con Flower?"
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch12b_hostage
      - condition: b3_ch12_scout = 1
        texts:
          - source: scene_text
            paragraph: 5
            text: |-
              Flower se despide del mago que la saludó la primera vez y nos alejamos volando de ellos, regresando a nuestro grupo en menos de un minuto. Tan pronto como aterrizamos en el suelo junto a ellos, les damos toda la información que pudimos recopilar durante nuestra breve misión de exploración, y una vez que terminamos, Daren hace una pausa para pensar durante unos segundos.

              "Está bien", dice. "Así que nos están esperando en un campo abierto y te saludaron, pero no intentaron atacarte de ninguna manera. ¿Qué piensan ustedes? ¿Podrían ser amigables?"

              "No hay manera de saberlo sólo con la información que tenemos actualmente", dice Kate. "No parece que los hayamos conocido antes, por lo que describió Barry, por lo que sólo podemos adivinar cuáles son sus motivos".
