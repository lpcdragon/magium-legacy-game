      - condition: b3_ch12_hesitant = 1
        texts:
          - source: scene_text
            paragraph: 67
            text: |-
              "Leo, quizás quieras retroceder un poco", le dice Eiden al leopardo, que todavía estaba observando cómo se desarrollaba la pelea desde un lado. "A partir de este momento, no puedo garantizar tu seguridad".

              "Sí..." dice Leo, mientras nos mira una última vez vacilante antes de darse la vuelta. "Creo que haré eso".

              "Ahora bien", dice Eiden, mientras el leopardo se aleja un poco más de nosotros, donde es más seguro. "¿Quién quiere ir primero?"

              "¡Ja!" dice Hadrik, con una sonrisa. "¡Este es el tipo de pelea para la que me uní a este torneo!"

              Luego corre hacia Eiden e intenta golpearlo, pero stillwater tranquilamente agarra su cabeza y la estrella contra el suelo, lo que le hace perder inmediatamente el conocimiento.

              Daren no espera una invitación de Eiden y envía su espada girando hacia él rápidamente, tal como lo hizo todas las otras veces antes. Sin embargo, en lugar de molestarse en esquivarla, Eiden dispara la espada con un rayo de fuego tan fuerte que supera su capacidad de absorber elementos y la empuja hacia su dueño.

              Para defenderse del rayo de fuego entrante, Daren coloca su escudo frente a él, pero su barrera no es lo suficientemente poderosa como para defenderlo de toda la fuerza del ataque y termina cayendo al suelo, apenas capaz de moverse, con su ropa medio quemada y su espada y escudo tirados inútilmente a su lado.
          - source: scene_text_2
            paragraph: 51
            text: |-
              "¡¡¡NO!!!" Grita Flower, con desesperación en su voz, mientras sus ojos se vuelven de un rojo brillante y el aura alrededor de su cuerpo ahora está visiblemente ardiendo. "¡¡¡Déjalos en paz !!!"

              Luego dispara su propio rayo de fuego a Eiden, que es casi comparable al que acaba de usar contra Daren. Sin embargo, a diferencia de Daren, Eiden parece ser capaz de defenderse contra tal ataque, aunque parece estar gastando al menos una cantidad moderada de esfuerzo para hacerlo.

              "¡Flower, estás quemando tu energía demasiado rápido!" Dice Illuna, en tono de pánico. "¡Tienes que parar!"

              "¡¡¡No puedo!!!" Flower dice. "¡Soy nuestra última oportunidad! ¡Tengo que hacer esto! Tengo que..."

              De repente, Eiden se teletransporta detrás de ella y le golpea ligeramente la nuca con el costado de la palma. Esto hace que tanto Flower como Illuna pierdan el conocimiento, ya que los únicos miembros de nuestro grupo que aún están despiertos soy yo, Kate, Daren y Arraka.

              Kate ahora está intentando crear algunos carámbanos con su cetro, pero su energía mágica fue completamente drenada por su rayo de hielo de antes, y apenas puede ponerse de pie. Mientras tanto, Daren usa todas sus fuerzas para impulsarse desde el suelo, para poder al menos mirar a Eiden a los ojos cuando le habla.

              "¡Maldita sea, Eiden!" Grita Daren. "¡Sé que este no eres tu verdadero yo! ¡Sé que esto no es lo que quieres! Entonces, ¿por qué? ¡¿Por qué estás haciendo esto?!"
          - source: scene_3
            paragraph: 39
            text: |-
              "Incluso cuando estoy a segundos de matarte a ti y a todos tus amigos, sigues diciendo cosas como esta..." dice Eiden, mientras ahora se acerca lentamente a Daren. "Y si entendí correctamente, ayer también le dijiste a Barry que dudarías en unirte a Meridith y matarme. Dime, ¿cómo es posible exactamente que alguien como tú haya experimentado un cambio de perspectiva tan radical en tan poco tiempo? ¿No sigues siendo la misma persona que solía atacarme ciegamente en cada oportunidad que tenía porque me considerabas irremediablemente malvado? ¿De dónde viene este cambio repentino de actitud hacia mí? ¿Seguramente no puede ser sólo porque una versión anterior de mí mismo de las pruebas del Dios del Tiempo te ayudó una vez?..."

              "¡Es porque me pediste que demostrara que estabas equivocado!" Dice Daren, en voz alta, mientras los ojos cerrados de Eiden parecen estremecerse un poco. "¡Sé que no recuerdas nada de eso, pero no fue una versión distante del pasado con la que hablé! ¡Eras tú, allá en Thilias, justo antes de que el conde de Ollendor fuera a matar a la esclava! ¡Me puse de rodillas y te rogué que me dieras el poder para salvarla! ¡Por eso me ayudaste, y por eso me dijiste esas palabras!"

              "Así que eso es lo que pasó..." dice Eiden, mientras parece que ahora rápidamente está ordenando todo en su mente.
