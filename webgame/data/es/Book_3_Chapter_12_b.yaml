  - name: b3_ch12b_orangutan
    routes:
      - condition: bluff < 4 AND b3_ch12_hadrik = 0
        texts:
          - source: scene_text
            paragraph: 48
            text: |-
              "Eiden, ¡cuidado!" Grito. "¡Hay un orangután volador borracho con un sombrero de fiesta detrás de ti!"

              "¿Está borracho Y lleva un sombrero de fiesta?" Me pregunta Eiden. "Eso es extrañamente específico, ¿no crees?"

              "¿No planeas mirar hacia atrás?" digo.

              "La verdad es que no, no", me responde Eiden. "Pero esto me hizo tener una idea maravillosa para un hechizo. ¡Mira!"
          - source: scene_text_2
            paragraph: 40
            text: |-
              De la nada, un enorme orangután volador aparece frente a mí, con un sombrero de fiesta en la cabeza y sosteniendo una botella de cerveza en la mano izquierda.

              "¿Podrías haber hecho esta ilusión más obvia?" Le digo a Eiden. "No hay manera de que hayas convocado a un..."

              El orangután frente a mí de repente extiende su brazo derecho hacia mí, y antes de que tenga tiempo de darme cuenta de que en realidad no es una ilusión, cierra su puño alrededor de mi cabeza y la aplasta como si fuera una sandía.
        effects:
          - set:
              failed_checks:
