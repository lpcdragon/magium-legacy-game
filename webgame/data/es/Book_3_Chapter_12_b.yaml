        texts:
          - source: scene_text
            paragraph: 26
            text: |-
              "¿Qué estás haciendo con la piña, Flower?" dice el zorro dorado, después de unos segundos más de silencio.

              "¡¿Oh, esta piña ?!" Dice Flower, como si recién ahora se diera cuenta de lo que tenía en la mano. "Lo necesitamos para... umm... verás, hay un concurso de magos, y--"

              "Sé para qué sirve la piña", dice el zorro. "He tenido magos invadiendo mis bosques durante días, tratando de ponerles las manos encima. Lo que te pregunto es ¿por qué pensaste que era una buena idea tomar algo de mi territorio sin pedirme permiso?"

              "Yo... no pensé que te importaría si fuera solo una piña..." dice Flower, con voz mansa.

              "Bueno, pensaste mal", dice el zorro. "Ahora entrégalo."

              "¿No podríamos tal vez... hacer un trato o algo así?" Flower dice. "¡Sólo necesitamos uno!"

              "¿Un trato, dices?..." pregunta Eleya, el zorro dorado.

              "Sí", le responde Flower. "¿Hay algo que te gustaría a cambio?"
          - source: scene_text_2
            paragraph: 21
            text: |-
              "Ahora que los miro bien a todos, veo que se han vuelto un poco más fuertes desde la última vez que los vi", dice Eleya. "Tal vez haya algo que puedas hacer por mí a cambio de la piña..."

              "¡Claro!" Flower dice. "¡Solo di tu precio!"

              "Puede que ya lo sepas", dice el zorro, "pero pronto habrá una reunión diplomática en Galamir, sobre la próxima guerra contra las fuerzas de Tyrath, y se suponía que mi segundo al mando, Leo, asistiría. Sin embargo, debido a la constante invasión de mi territorio por parte de magos que han estado buscando piñas en los últimos días, no he podido prescindir de ninguno de mis fuertes guerreros para acompañarme. él a su destino."

              "¿No puedes simplemente monitorear todas las fronteras tú solo y teletransportarte allí cada vez que haya problemas como lo hiciste ahora?" Pregunta Flower, confundido.

              "Mi sentido mágico no cubre todo el continente y mis territorios se extienden por todo Varathia", dice Eleya. "Necesito que mis guerreros se queden donde están, por eso te pido que escoltes a Leo a Galamir, a cambio de la piña. Hasta donde yo sé, ahí es también donde tus amigos necesitarán llevar la piña para comenzar su segundo objetivo del torneo, por lo que esta tarea no debería interferir con su agenda. ¿Vas a aceptar el trato o no?"
          - source: scene_3
            paragraph: 19
            text: |-
              "Uh, sí... creo... quiero decir, si todos los demás están de acuerdo..." dice Flower, mientras nos mira rápidamente y nos ve a todos asintiendo con la cabeza. "Pero... ¿estás seguro de que quieres enviar a Leo solo con nosotros? ¿No sería más seguro enviarlo solo a Galamir que con un grupo de magos humanos?"

              "Flower..." dice Eleya. "Durante los veinte años desde que te conocí, no has hecho más que ayudar a los animales bajo mi cuidado, sin esperar nunca nada a cambio. Y por mucho que me cueste admitirlo, al final tenías razón sobre Illuna, y ella ha demostrado ser una aliada confiable a lo largo de los años. También he comprobado que decía la verdad cuando afirmó que Arraka fue quien instigó el trágico incidente de la llamada 'masacre de los bosques sagrados', y aunque es difícil decir que alguna vez será perdonada por lo que ha hecho, sus acciones fueron al menos comprensibles, dado el contexto".

              "Hmph", dice simplemente Illuna.

              "Por lo tanto", continúa el zorro, "si me das tu palabra de que harás todo lo posible para escoltar de forma segura a Leo hasta Galamir, eso será suficiente tranquilidad para mí".

              "Vaya, Eleya", dice Flower. "No sé qué decir. ¡Gracias! Y sí, te doy mi palabra. ¡Haré todo lo posible para acompañar a Leo a Galamir de manera segura!"

              "Muy bien", dice el zorro. "En ese caso, te lo traeré en un momento. Espera aquí".

              "Eh..." dice Hadrik, después de que Eleya se teletransporta lejos de nosotros. "Supongo que el zorro realmente tiene debilidad por Flower. ¿Quién lo hubiera pensado, eh?"
