  - name: b3_ch12b_detector
    routes:
      - condition: b3_ch12_hadrik = 1
        texts:
          - source: scene_text
            paragraph: 21
            text: |-
              Viajamos hacia el bosque sagrado durante unas dos horas más después de nuestra batalla con los tres nigromantes y el ilusionista. Durante este tiempo, no nos encontramos con ningún otro mago, y Arraka tampoco detectó que ninguno de nuestros cuatro enemigos regresara por nosotros. Parece que realmente se dieron por vencidos, al menos por hoy.

              También me sorprendió gratamente ver que después de su pequeño combate de lucha libre, Kate y Diane se llevan mucho mejor que antes. Creo que un momento genuino entre ellas dos era exactamente lo que necesitaban para darse cuenta de que a pesar de lo mucho que habían cambiado durante el tiempo que estuvieron separadas, en el fondo seguían siendo las mismas dos chicas que solían reír juntas, pelear juntas y estar al lado de la otra, en esos muchos años de dificultades que pasaron en el Faro de Esperanza.

              Aparte de esto, el resto de nuestro viaje al bosque de zorro dorado transcurrió sin incidentes, excepto por una llamada regular de Sophie, Flower llamó dos veces a Melindra en el transceptor para hablar con ella sobre algunas nubes con formas peculiares en el cielo, y Hadrik mencionó cinco veces que no podía esperar a que terminara el día para poder beber. cerveza de nuevo.
          - source: scene_text_2
            paragraph: 19
            text: |-
              Para cuando el sol estuvo en su punto más alto en el cielo, ya habíamos llegado al borde exacto del bosque sagrado, y una vez que llegamos allí, nos quedamos en el lugar durante aproximadamente medio minuto, sin saber cómo debíamos continuar.

              "Está bien, finalmente estamos aquí..." nos dice Daren, con voz relativamente indecisa. "Tenemos el detector de piñas con nosotros... ¿Y ahora qué?"

              "Podría intentar entrar muy rápido y ver si el detector se activa o no", dice Hadrik. "No veo a nadie vigilando la frontera, así que si todo sale bien, ¡podríamos habernos ido cuando envíen a alguien tras nosotros!"

              "Creo que Petal y yo deberíamos ser quienes entremos", dice Flower. "A diferencia del resto de ustedes, a nosotros dos no tenemos prohibido entrar al bosque sagrado, y no es que estas piñas sean tesoros invaluables o algo así. Debería poder tomar una sin que nadie se la pierda".
          - source: scene_3
            paragraph: 17
            text: |-
              "Flower tiene un buen punto", dice Daren. "Pero tampoco estoy seguro de cuánto me gusta la idea de que nos separemos".

              "Para empezar, podría intentar comprobar esta zona justo en el límite del bosque sagrado", dice Flower. "¡Tal vez con un poco de suerte encontremos una piña aquí y no tendremos que buscar más!"

              "Eso no suena tan mal", dice Daren. "¿Qué piensan ustedes?"

              "¡Yo digo que debería intentarlo!" Hadrik dice. "Estaremos aquí, en caso de que pase algo".

              "Por mí está bien", dice Kate, mientras le entrega la delgada tableta metálica que había estado sosteniendo en sus manos a Flower. "Aquí está el detector de piñas. ¿Sabes cómo usarlo?"

              "¡Umm, sí!" Flower dice. "Solo presiona este botón, ¿verdad? ¡Debería ser bastante fácil! Muy bien, aquí voy. ¡Deséame suerte!"
