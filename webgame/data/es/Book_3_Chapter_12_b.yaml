              "De acuerdo", dice Illuna. "Ya hemos visto todo lo que se podía ver desde esta distancia. No tiene sentido quedarse aquí por más tiempo".
            condition: perception = 2
          - source: scene_3
            paragraph: 3
            text: |-
              "Bueno, ciertamente no iré allí para averiguarlo", digo. "Hmm... Por la forma en que están vestidos, parece que tres de ellos son seguidores del Dios de la Muerte, y uno de ellos es un seguidor del Dios del Destino. Además, fue solo por un breve momento, pero creo que el ilusionista acababa de terminar de enterrar algo en el suelo justo antes de que pudiéramos verlo bien. ¿Y tú? ¿Notaste algo?"

              "Uh... veo que no están tratando de atacarnos, así que ¿supongo que eso es bueno?..." dice Flower.

