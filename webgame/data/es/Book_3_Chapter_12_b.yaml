        texts:
          - source: scene_text
            paragraph: 71
            text: |-
              "¡Muchas gracias!" Le digo a Azarius. "¡Realmente pensé que estábamos perdidos allí atrás!"

              "No es necesario que me lo agradezcas", dice Azarius. "¡Siempre estoy feliz de ayudar a los demás participantes del torneo!"

              "Incluso si no es necesario, te lo agradeceré también..." dice Daren, mientras ahora se levanta del suelo y se cura a sí mismo. "No tenías nada que ganar y mucho que perder ayudándonos, pero aun así apareciste. Sólo un hombre de tu calibre podría haber hecho algo como esto".

              "Lamento mucho lo de antes", dice Leo el leopardo, que ahora se acerca a nosotros. "Sé que fue muy cobarde de mi parte simplemente esconderme y ver a Eiden matarte, pero realmente no había nada que pudiera hacer..."

              "Lo entendemos, Leo", dice Kate. "Nos pidieron que fuéramos tus guardaespaldas, y no al revés. Esta era nuestra lucha y no tenías la obligación de ayudarnos".

              "No soy digno de tus amables palabras..." dice Leo, en tono humilde.

              "¿Qué pasó con ese aprendiz tuyo?" Daren le pregunta a Azarius, mientras busca a izquierda y derecha a su discípulo. "Umm... ¿Harry, creo?... ¿Sigues viajando con él?"
          - source: scene_text_2
            paragraph: 55
            text: |-
              "Henry", corrige Azarius a Daren. "Y sí, todavía estoy viajando con él, pero tuve que dejarlo temporalmente atrás cuando me teletransporté hacia ti, porque esto era demasiado peligroso para él. Él sabe cómo llegar hasta aquí, por lo que debería estar con nosotros en breve".

              "Esto probablemente va a sonar un poco grosero después de que salvaste nuestras vidas", dice Kate, "pero no pude evitar notar que tu sincronización fue extremadamente precisa. Apareciste en el momento exacto en que Eiden estaba a punto de ejecutarnos, y Eiden mencionó que nos estabas espiando desde lejos. ¿Pudiste escuchar lo que estábamos diciendo durante este tiempo por casualidad?"
          - source: scene_3
            paragraph: 44
            text: |-
              "¡De hecho lo estaba!" Azarius dice. "¡Muy astuto de tu parte al darte cuenta!"

              "Entonces, ¿nos detectaste a nosotros y a Eiden desde la distancia y usaste magia para mejorar tu oído y escuchar nuestra conversación?" Le pregunto a Azarius.

              "¡Precisamente!" Azarius dice.
