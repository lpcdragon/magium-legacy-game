        texts:
          - source: scene_text
            paragraph: 60
            text: |-
              "Illuna, ¿puedes colocar tu lavavajillas hechizo en Eiden, por favor?" digo.

              "No estoy seguro de si ahora sería el mejor momento", dice con aprensión Illuna.

              "No, es el momento perfecto, ¡créeme!" digo. "¡Hazlo ahora!"

              "Al menos déjame coger el dispositivo de teletransporte de la mochila de Hadrik", dice Illuna.

              "Oh, lo tengo aquí", dice Hadrik desde el suelo, mientras saca el dispositivo metálico redondo de su mochila y se prepara para arrojárselo a Illuna, que acababa de descender del cielo.

              "¡No, no lo tires!" Grita Illuna, pero ya era demasiado tarde.

              Se las arregló para agarrar la pesada bola de metal mientras aún estaba en el aire, pero casi la hizo caer al suelo por el peso de la misma.

              Una vez que aterrizó con éxito, puso el dispositivo en el suelo junto a ella y comenzó a preparar su hechizo.
          - source: scene_text_2
            paragraph: 46
            text: |-
              "¿Lavar platos hechizo? ¿Dispositivo de teletransporte?" dice Eiden, quien ha estado observando todo esto con gran interés. "Algo me dice que debería evitar que esto suceda, pero mi curiosidad se está apoderando de mí..."

              "¡No te preocupes, te va a encantar!" Le digo a Eiden.

              De repente, la cabeza de Eiden queda rodeada por una esfera de agua, fabricada por Illuna. No lo veo ahogándose todavía, pero tampoco puede estar demasiado cómodo, por la expresión que está poniendo. Después de intentar sin éxito sacudir el agua volando de lado, Eiden ahora se teletransporta muy rápido por todos lados, en un intento de hacer que Illuna pierda el control de su hechizo.
          - source: scene_3
            paragraph: 36
            text: |-
              Afortunadamente, el entrenamiento de Illuna y el uso de su amplificador mágico están dando sus frutos, y Eiden no logra deshacerse de la esfera de agua en absoluto. Finalmente, comienza a hacer ruidos de ahogamiento, lo que hace que se desespere un poco más y conjure un pequeño tornado, mientras se deja atrapar dentro de él. Esto resulta ser demasiado para el hechizo que se está ahogando, y sus partículas de agua eventualmente se dispersan en el aire.

              Al cancelar el tornado Eiden, cae al suelo y luego se pone la mano en la frente, sin hacer nada más durante unos segundos. Su cabeza debe estar dando vueltas como loca en este momento. Este es el momento que estaba esperando. ¡Es ahora o nunca!
