                  current_scene: b3_ch12b_blinding
                condition: is_dead = 0
  - name: b3_ch12b_dagger
    routes:
      - condition: b3_ch12_hadrik = 0
        texts:
          - source: scene_text
            paragraph: 53
            text: |-
              "Supongo que finalmente es hora de sacar mi arma secreta", digo, con una sonrisa confiada.

              "¿Un arma secreta, dices?" Eiden dice. "Suena prometedor. ¡Veámoslo entonces!"

              Le hago un gesto con la cabeza y luego saco mi daga de su funda y le apunto amenazadoramente.

              "Tienes que estar bromeando..." dice Eiden, mientras me mira fijamente con incredulidad.
          - source: scene_text_2
            paragraph: 42
            text: |-
              "¿Alguna vez te conté cómo me enfrenté a Arraka en su forma más fuerte, mientras estaba armado solo con una daga y aun así salí victorioso?" le pregunto.

              "No parece que estés mintiendo", dice Eiden, "pero algo me dice que hay algunos detalles muy cruciales de esa historia que estás omitiendo a propósito".

              "Cree lo que quieras", le digo. "¡Aquí voy!"

              Luego empiezo a volar hacia Eiden, cortándolo con mi daga, mientras él esquiva cada uno de mis ataques sin esfuerzo, con una expresión muy desconcertada en su rostro. Mientras sigo atacándolo sin golpearlo ni una sola vez, gradualmente empiezo a pensar que tal vez esta no fue una idea tan buena como pensé originalmente.
          - source: scene_3
            paragraph: 34
            text: |-
              "¿Qué pasa, Barry?" Me dice Eiden, ya que ahora he puesto un poco de distancia entre él y yo para recuperar el aliento. "¿Ya te estás cansando? ¡Pero ni siquiera me has mostrado lo que realmente puede hacer tu daga! ¡Aquí, déjame atacarte con algo más digno de un arma tan poderosa!"

              Luego comienza a preparar lo que parece ser un rayo de fuego increíblemente fuerte que apunta directamente hacia mí. Si afronto eso, no creo que todas las protecciones mágicas del mundo me salven. ¿Qué tengo que hacer?
        choices:
          - position: 1
            text: Vuela directamente hacia Eiden mientras esté demasiado confiado y apuñalalo con mi daga.
            effects:
              - set:
                  current_scene: b3_ch12b_overconfident
          - position: 2
            text: Aléjate de Eiden e intenta pensar en un plan diferente.
            effects:
              - set:
                  current_scene: b3_ch12b_away
