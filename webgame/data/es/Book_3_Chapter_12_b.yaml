            paragraph: 48
            text: |-
              Desafortunadamente, debido a la naturaleza imperfecta de mi corrientes de aire, no logro apartarme lo suficientemente rápido y las llamas cubren todo mi cuerpo. Sin embargo, gracias a mi estadística Endurecimiento de aura al máximo pude resistir su ataque, a pesar de que allí hizo mucho calor por un segundo.

              Una vez que logro extraer suficiente energía de Eiden, puedo sentir que estoy obteniendo acceso a la mayor parte del hechizos que tenía cuando luché contra Tyrath la primera vez. Como no tengo exactamente mucho tiempo libre, elijo el que parece ser el hechizo más útil del grupo y lo lanzo a Eiden inmediatamente.

              Engendro un gran meteoro en llamas justo encima de la cabeza de Eiden y choca contra él antes de que tenga la oportunidad de reaccionar. El meteoro lo arrastra hacia abajo en cuestión de segundos, provocando una gran explosión una vez que golpea el suelo, y al mismo tiempo también puedo sentir que la energía que le robé se agota por completo. Por su aspecto, no parece que mi meteorito le haya causado ningún daño importante, pero incluso para alguien de su calibre, no podría haber sido fácil defenderse de él.

              Justo cuando Eiden se vuelve a poner de pie, su cabeza es rodeada por una esfera de agua hecha por Illuna, lo que parece haberlo tomado completamente desprevenido, porque ya puedo escucharlo haciendo ruidos de ahogamiento. Intenta volar un poco, con la esperanza de poder sacudirse el hechizo, pero la práctica de Illuna con el lavado de platos parece haber dado sus frutos, y la esfera de agua permanece firmemente pegada a su cabeza.
          - source: scene_3
            paragraph: 37
            text: |-
              Con el rabillo del ojo, veo a Kate levantando su cetro y apuntando a Eiden, lista para atacar.

              "¡Kate, todavía no!" Grito, mientras ella ahora baja su cetro después de escuchar mi voz.

              Puede que Eiden haya sido tomado un poco por sorpresa, pero de ninguna manera está indefenso. Aún podría detener fácilmente el rayo de hielo de Kate si tuviera tiempo de reaccionar. Para que no sea consciente en absoluto de lo que le rodea, necesitamos un último empujón.

              Daren ahora envía su espada girando rápidamente hacia Eiden, pero el stillwater levanta una gran púa hecha de roca del suelo, que usa para desviar la dirección del arma. Mientras tanto, Eiden invoca un pequeño tornado de la nada y se deja atrapar intencionadamente en su interior. Esto resulta ser demasiado para el hechizo de ahogamiento de Illuna, y sus partículas de agua finalmente se dispersan en el aire.

              Al cancelar el tornado Eiden, vuelve a caer al suelo y luego se lleva la mano a la frente, sin hacer nada más durante unos segundos. Su cabeza debe estar dando vueltas como loca en este momento. Este es el momento que estaba esperando. ¡Es ahora o nunca!
