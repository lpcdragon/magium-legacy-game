  - name: b3_ch12b_visions
    texts:
      - source: scene_text
        paragraph: 9
        text: |-
          "No hay trampas, idiota", dice Arraka. "Te lo habría dicho si lo hubiera."

          "Oh, sí", dice Daren. "Sigo olvidando que en realidad estás contribuyendo activamente a nuestros esfuerzos hoy en día y no sólo riéndote de nosotros y comentando al margen".

          "¡No son visiones locas, alimañas!" escucho decir mientras tanto a Clogworth, quien parece estar ocupado insultando a sus compañeros también. "¡Son sueños proféticos de mi dios! Tengo un vínculo especial con él y, a veces, sus pensamientos más íntimos pueden filtrarse a mí sin que él se dé cuenta. ¡Así es como sé que hay que matar a estas personas! ¡Están interfiriendo con los planes de mi dios! ¡Los vi en mis sueños! Los vi hablando con Eiden sobre salvar las ciudades varathianas. ¡Ese no es su llamado! ¡Se supone que es un portador de destrucción! ¡Es culpa de estas personas que esté dudando en hacer lo que se debe hacer! ¡Estos tontos y el zorro dorado son los únicos que le impiden perder el último resto de su humanidad y lograr su verdadero propósito! ¡Por eso hay que eliminarlos!"
      - source: scene_text_2
        paragraph: 10
        text: |-
          "¿Qué tan engañado tienes que estar para pensar que eres el único de los seguidores de tu dios que realmente puede leer su mente mientras duermes?" dice el líder nigromante. "No tienes absolutamente ninguna prueba para tus afirmaciones, pero sigues hablando de ello, como si esperaras que alguien te creyera. No hay manera de que puedas ser considerado cuerdo cuando actúas así".

          Probablemente debería considerarme afortunado de que nadie parezca estar tomando en serio a este tipo, porque si realmente nos vio hablando con Eiden sobre cómo evitar la destrucción de las ciudades varathianas, entonces es posible que algunos de sus otros 'sueños proféticos' también tengan algo de verdad detrás de ellos. Afortunadamente, no parece que ninguno de los otros seguidores de Dios del Destino le creyera, así que al menos no deberían buscar activamente cazarnos.
      - source: scene_3
        paragraph: 8
        text: '"¿Los ataco o no?" Kate nos vuelve a susurrar. "Lo juro, sólo estoy esperando que uno de ustedes me diga ''sí'', y luego soltaré mis carámbanos sobre ellos".'
    choices:
      - position: 1
        text: Dile a Kate que los ataque.
        effects:
          - set:
              current_scene: b3_ch12b_attack
      - position: 2
        text: Dile a Kate que espere a que hagan su movimiento.
        effects:
          - set:
              current_scene: b3_ch12b_wait
  - name: b3_ch12b_wait
    texts:
      - source: scene_text
        paragraph: 10
        text: |-
          "Espera un minuto más", le susurro a Kate. "Veamos qué hacen primero".

          "Esto suena como una mala idea..." dice Kate, mientras ambos nos concentramos ahora en lo que están hablando los cuatro magos.

          "¿No ves lo que están haciendo?" dice Clogworth, seguidor de Dios del Destino. "Mientras discutíamos, ellos han estado acumulando carámbanos en el cielo. ¡Miren hacia arriba! ¡Nos van a empalar con ellos!"

          "Como si el Dios de la Muerte permitiera que nos mataran con simples carámbanos..." dice el líder del nigromante, mientras levanta las manos en el aire. "¡Mira! Este es el tipo de poder que ninguno de ustedes podría esperar alcanzar. ¡Este es el poder de un dios verdadero!"

          Cuando el nigromante deja de hablar, un centenar de esqueletos con una magia increíblemente poderosa que irradia de sus auras ahora se elevan lentamente del suelo a nuestro alrededor.
      - source: scene_text_2
        paragraph: 11
        text: |-
          Al ver lo que está sucediendo, Kate rápidamente dispara todos sus carámbanos a los cuatro magos, pero un esqueleto se levanta frente a ellos justo a tiempo para lanzar una barrera semitransparente y protegerlos del daño.

          "¡Maldita sea!" Kate dice. "Sabía que debería haberlos atacado antes".

          "Estos son el esqueleto stillwaters otra vez, ¿no?" Dice Daren, mientras crea con calma una barrera mágica protectora a nuestro alrededor. "Barry, ¿cuánto tiempo crees que le tomará a tu dispositivo encenderse y darte más magia, como la última vez?"

          "Uh... ¿con esta cantidad de esqueletos?" digo. "Con suerte, menos de un minuto".

          "Bien", dice Daren, mientras los cien stillwaters comienzan a atacar su barrera con todo tipo de fuertes hechizos. "¿Alguien más puede ayudarme a reforzar esta barrera? Preferiría no empezar a luchar contra ellos hasta que Barry pueda unirse a la lucha correctamente con sus estadísticas de emergencia".
      - source: scene_3
        paragraph: 9
        text: |-
          "Te ayudaré tan pronto como me ocupe de estos molestos nigromantes", dice Kate, mientras usa su cetro para crear cuatro conos de hielo mucho más grandes, que ahora envía hacia los cuatro magos enemigos a una velocidad explosiva, logrando romper la barrera del stillwater con bastante facilidad.

          Sin embargo, a pesar de que sus carámbanos alcanzaron adecuadamente sus objetivos esta vez, sus ataques no tienen el efecto deseado en absoluto, porque los proyectiles simplemente atraviesan a los cuatro magos como si ni siquiera estuvieran allí.

          "¡¿Fueron ilusiones todo este tiempo?!" Grita Arraka, de repente.

          "¡Maldita sea, Arraka!" Dice Daren, mientras todavía está luchando por mantener su barrera contra los implacables ataques del esqueleto stillwaters. "¡Pensé que se suponía que debías ayudar! Tienes, con diferencia, el sentido mágico más agudo del equipo, ¡¿y todavía no podías darte cuenta de que eran ilusiones?!"
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch12b_wait2
  - name: b3_ch12b_wait2
    texts:
      - source: scene_text
        paragraph: 11
        text: |-
          "¡Callarse la boca!" Arraka dice. "No había absolutamente nada inusual en sus auras. De alguna manera, este lunático vestido con una túnica verde y aspecto débil debe haber obtenido una de las ilusiones más avanzadas de Memphir, hechizos, y haberla lanzado incluso antes de que llegáramos aquí. ¡Es la única manera en que puedo explicarlo!"

          "¡Culpable de los cargos!" grita Clogworth, seguidor del Dios del Destino, para que podamos escucharlo a pesar del ruido que están haciendo los stillwaters. "Parece que ni siquiera el famoso asesino de dioses Arraka puede ver a través de una ilusión hechizo diseñada por el propio Dios del Destino. Tengan la seguridad de que este es sólo uno de los muchos hechizos que mi deidad, sin saberlo, ha compartido conmigo en mis sueños".

          "Este bastardo debe haber vinculado su aura con la del propio Memphir al nacer", nos dice Arraka. "Y en lugar de tener una conexión defectuosa con su espíritu, como Daren, tuvo suerte y consiguió la versión mejorada. ¡Argh! ¿Por qué tenía que ser uno de los hechizos de Memphir, entre todas las cosas? ¡Estos siempre son tan ridículamente complicados de descifrar!"

          "Entonces, lo que estás diciendo es que no puedes hacerlo, entonces..." se burla de ella Illuna.

          "Por supuesto que puedo hacerlo", dice Arraka. "Pero va a tomar mucho tiempo. Si logras sobrevivir contra los cien esqueletos stillwaters hasta entonces, te diré lo que he descubierto".
      - source: scene_text_2
        paragraph: 12
        text: |-
          "¿Tuviste suerte con tu 'Modo de emergencia', Barry?" Me pregunta Daren.

          "Todavía no", le digo a Daren, mientras sostengo mi dispositivo de estadísticas en mi mano y miro su pantalla. "No entiendo por qué está tardando tanto. Tal vez sea porque estos esqueletos fueron mejor creados que los otros con los que peleamos. Ahora que los examino más de cerca, parecen estar perdiendo mucha menos energía que los fabricados por Zack, el nigromante, a pesar de que hay cien de ellos".

          "Está bien... Kate, ¿puedes hacer una cúpula de hielo a nuestro alrededor, por favor?" Daren dice. "Realmente no quiero gastar toda mi energía sólo en mantener una barrera levantada".

          "Estoy en ello", dice Kate, mientras evoca una cúpula semitransparente de hielo reforzado a nuestro alrededor, tal como lo pidió Daren.

          "¿Crees que todavía existe la posibilidad de que tu Modo de emergencia se active o deberíamos simplemente empezar a atacarlos?" Daren me dice.
      - source: scene_3
        paragraph: 10
        text: |-
          "La verdad es que no lo sé", le respondo. "Con la velocidad a la que se escapa la energía de ellos, puede que no sea suficiente para activar mi aumento temporal en las estadísticas. ¿Cómo se mantiene tu barrera?"

          "Bastante bien, en realidad", dice Daren. "A pesar del enorme poder mágico que irradian sus auras, sus ataques son sorprendentemente débiles. ¡Mira, ni siquiera están pasando la cúpula de hielo de Kate en este momento!"

          "Mmm..." digo. "¿Tal vez no son realmente stillwaters? O tal vez están conservando su energía por alguna razón. Ah, o ¿y si--"

          No consigo terminar lo que tenía que decir, porque un segundo después una gran explosión nos envuelve a todos de la nada, sin darnos tiempo a reaccionar. Apenas tuve tiempo de darme cuenta de lo que me pasó antes de perder el conocimiento para siempre.
