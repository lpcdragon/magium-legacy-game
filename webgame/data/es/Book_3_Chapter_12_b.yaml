  - name: b3_ch12b_attack
    texts:
      - source: scene_text
        paragraph: 12
        text: |-
          "Sí", le susurro a Kate. "Atácalos ahora, mientras todavía están hablando".

          "Eso es todo lo que quería escuchar", dice Kate, y luego dispara todos los carámbanos que había estado preparando en secreto arriba, directamente a los cuatro magos frente a nosotros.

          Desafortunadamente, su ataque sorpresa no tiene el efecto deseado en absoluto, porque los proyectiles simplemente atraviesan a nuestros enemigos como si ni siquiera estuvieran allí.

          "¡¿Fueron ilusiones todo este tiempo?!" Grita Arraka, de repente.

          "¡Maldita sea, Arraka!" Daren dice. "¡Pensé que se suponía que debías ayudar! Tienes, con diferencia, el sentido mágico más agudo del equipo, ¿y todavía no pudiste darte cuenta de que eran ilusiones?"

          "¡Callarse la boca!" Arraka dice. "No había absolutamente nada inusual en sus auras. De alguna manera, este lunático vestido con una túnica verde y aspecto débil debe haber obtenido una de las ilusiones más avanzadas de Memphir, hechizos, y haberla lanzado incluso antes de que llegáramos aquí. ¡Es la única manera en que puedo explicarlo!"

          "¡Culpable de los cargos!" dice Clogworth, seguidor de Dios del Destino. "Parece que ni siquiera el famoso asesino de dioses Arraka puede ver a través de una ilusión hechizo diseñada por el propio Dios del Destino. Tengan la seguridad de que este es sólo uno de los muchos hechizos que mi deidad, sin saberlo, ha compartido conmigo en mis sueños".
      - source: scene_text_2
        paragraph: 13
        text: |-
          "Este bastardo debe haber vinculado su aura con la del propio Memphir al nacer", nos dice Arraka. "Y en lugar de tener una conexión defectuosa con su espíritu, como Daren, tuvo suerte y consiguió la versión mejorada. ¡Argh! ¿Por qué tenía que ser uno de los hechizos de Memphir, entre todas las cosas? ¡Estos siempre son tan ridículamente complicados de descifrar!"

          "Entonces, lo que estás diciendo es que no puedes hacerlo, entonces..." se burla de ella Illuna.

          "Por supuesto que puedo hacerlo", dice Arraka. "Pero va a tomar mucho tiempo. Si logras sobrevivir contra los cien esqueletos stillwaters hasta entonces, te diré lo que he descubierto".

          "¡¿Los cien qué?!" Grita Kate, mientras cien esqueletos con una magia increíblemente poderosa que irradia de sus auras ahora se elevan lentamente del suelo a nuestro alrededor.

          "Genial..." dice Daren, mientras ahora crea una barrera mágica a nuestro alrededor para defendernos de los ataques entrantes de los esqueletos. "Barry, ¿cuánto tiempo crees que le tomará a tu dispositivo encenderse y darte más magia, como la última vez?"

          "Uh... ¿con esta cantidad de esqueletos?" digo. "Con suerte, menos de un minuto".
      - source: scene_3
        paragraph: 11
        text: |-
          "Un minuto, ¿eh?..." dice Daren, mientras los cien stillwaters continúan atacando su barrera con todo tipo de fuertes hechizos. "¿Alguien más puede ayudarme a reforzar esta barrera? Preferiría no empezar a luchar contra ellos hasta que Barry pueda unirse a la lucha correctamente con sus estadísticas de emergencia".

          "Estoy en ello", dice Kate, mientras comienza a crear una cúpula semitransparente de hielo reforzado alrededor de la barrera de Daren.

          Durante el siguiente minuto, me quedo ahí con el dispositivo de estadísticas en mi mano derecha, mirando su pantalla y esperando que me dé mi opción Modo de emergencia. Sin embargo, a pesar de esperar más que la última vez, la opción todavía no aparece.

          "¿Tuviste suerte con tu 'Modo de emergencia', Barry?" Me pregunta Daren.

          "Todavía no", digo. "No entiendo por qué está tardando tanto. Tal vez sea porque estos esqueletos fueron mejor creados que los otros con los que peleamos. Ahora que los examino más de cerca, parecen estar perdiendo mucha menos energía que los fabricados por Zack, el nigromante, a pesar de que hay cien de ellos".
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch12b_attack2
  - name: b3_ch12b_attack2
    texts:
      - source: scene_text
        paragraph: 13
        text: |-
          "Realmente no es la respuesta que esperaba", dice Daren. "¿Crees que todavía existe la posibilidad de que se active o deberíamos simplemente empezar a atacarlos?"

          "Honestamente no lo sé", digo. "Con la velocidad a la que se escapa la energía de ellos, puede que no sea suficiente para activar mi aumento temporal en las estadísticas. ¿Cómo se mantiene tu barrera?"

          "Bastante bien, en realidad", dice Daren. "A pesar del enorme poder mágico que irradian sus auras, sus ataques son sorprendentemente débiles--"

          "¡TRAMPAS!" Arraka grita de repente. "¡Todos a tu alrededor! ¡No hay tiempo para explicar, solo corre! ¡CORRE!"

          "Pero los esqueletos de stillwater--" comienza a decir Daren, antes de que Arraka lo interrumpa nuevamente.

          "¡¡¡Sólo corre a través de ellos!!!" Grita Arraka. "¡Son ilusiones! Elige cualquier dirección, ¡simplemente ve!"

          "¡Por aquí!" Dice Daren, mientras señala algún lugar a la izquierda de las ilusiones de los cuatro magos, y Kate descarta su cúpula de hielo, para que todos podamos correr allí juntos.

          Justo cuando terminamos de atravesar todas las ilusiones esqueléticas de stillwater, se detona una enorme explosión detrás de nosotros, y Kate rápidamente conjura una pared de hielo mientras corremos, para defendernos de la explosión.
      - source: scene_text_2
        paragraph: 14
        text: |-
          "¡No, ahora estás yendo demasiado lejos!" Arraka vuelve a gritar. "Hay otra trampa justo al lado..."

          Una nueva trampa invisible, menos poderosa, ahora explota a sólo unos metros frente a nosotros. Daren pone su escudo frente a él para crear una barrera, pero no fue lo suficientemente rápido para materializarla por completo, por lo que todos quedamos de espaldas por la fuerza del impacto.

          "¡¡¡Eso es SUFICIENTE!!!" Kate y Diane gritan exactamente al mismo tiempo, mientras se levantan del suelo y de repente cubren toda el área a nuestro alrededor con hielo y electricidad.

          Cinco dispositivos metálicos que supongo que son trampas explosivas aparecen ahora de repente, completamente congelados y con marcas de descargas de las corrientes eléctricas anteriores de Diane. Los dispositivos estaban esparcidos al azar por todo el claro y parecían haber sido colocados con cierta prisa, por lo que parece.

          A medida que las ilusiones de stillwater se desvanecen, ahora vemos que sólo dos de los esqueletos eran reales, y que los cuatro magos habían estado detrás de uno de ellos todo este tiempo, ocultos por la ilusión de Clogworth. El esqueleto que estaba atacando la barrera de Daren fue congelado por Kate, mientras que el otro esqueleto, que defendía a los cuatro magos, logró crear un muro de piedra frente a ellos para protegerlos de los ataques de Kate y Diane.

          "¡Bastardo traicionero!" dice el líder nigromante al mago ilusionista. "Ibas a matar a la niña en esa explosión también, ¿no?"
      - source: scene_3
        paragraph: 12
        text: |-
          "No iba a matarla hasta que me dijiste en la cara que planeabas traicionarme", dice Clogworth, mientras parece estar tocando rápidamente algunos botones de un pequeño dispositivo que sostiene en su mano. "Estos explosivos fueron pensados ​​como último recurso, en caso de que resultaras demasiado incompetente para terminar el trabajo. Supongo que esto es lo que me pasa por tratar de confiar en mis compañeros de equipo. Debería haber usado los explosivos desde el principio".

          "¡¡¡No dejéis que se escapen, idiotas!!!" Nos grita Arraka, enojado. "¡Mátalos! ¡Mátalos!"

          "¿Se están escapando?..." pregunta Hadrik, confundido.

          "¡¿Nos vamos a escapar ?!" grita el nigromante, al mismo tiempo.

          "Cállate", le dice Clogworth a su compañero de equipo, en tono disgustado, y luego presiona un último botón en su dispositivo.
