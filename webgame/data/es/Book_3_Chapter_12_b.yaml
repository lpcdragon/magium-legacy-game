  - name: b3_ch12b_invitation3
    texts:
      - source: scene_text
        paragraph: 69
        text: |-
          "Hmm..." dice Eiden, ya que ahora parece estar calmándose un poco. "Quizás tengas razón. Quizás podrían haberme matado. Razón de más para acabar con ellos ahora, antes de que se vuelvan más fuertes. Dile adiós a tu amado plan, Arraka..."

          "¡¡¡NO!!!" Grita Arraka, mientras saco mi daga y me preparo para mi última resistencia desesperada.

          "Yo no haría eso si fuera tú", escucho la voz de Azarius, que parece haberse teletransportado justo ahora junto a nosotros.

          "Sé que nos has estado espiando desde lejos desde el comienzo de nuestra batalla, Sabio del Oeste", dice Eiden. "Es extraño... Te ves viejo y te llaman sabio, pero lo más inteligente en esta situación habría sido quedarte a salvo donde te escondías y dejarme matar a estas personas. ¿Qué locura podría haberte poseído para venir aquí y enfrentarme cuando estoy en mi forma más fuerte? ¿De verdad crees que puedes derrotarme en la batalla?..."

          "¡Oh, cielos, no!" Dice Azarius, con una sonrisa tranquila. "¡Ni en sueños se me ocurriría!"

          "Entonces, ¿exactamente cómo piensas detenerme?" Dice Eiden, perplejo.

          "¡Pensé que podrías preguntarme eso!" Dice Azarius, y luego chasquea los dedos una vez.
      - source: scene_text_2
        paragraph: 53
        text: |-
          "¿Qué hiciste-- cómo--" comienza a decir Eiden, mientras parece estar mirando a algún lugar lejano en la distancia, pero Azarius lo interrumpe.

          "Descubrí esos hechizos detectores tuyos que has estado plantando por todo el continente hace semanas", dice Azarius. "Pensé que eran muy importantes para ti, así que los he estado manipulando en secreto, mientras suprimía mi aura para que no pudieras notarlo desde la distancia. Como acabas de ver, un chasquido de mis dedos es suficiente para cancelar uno de tus hechizos y deshacer horas de tu trabajo. Además, es imposible arreglar mi manipulación sin rehacerlos desde cero. Ah, y lo más importante, si me matas, cada uno de tus hechizos detectores se deshará y todo tu trabajo de las últimas semanas habrá sido completamente en vano!"
      - source: scene_3
        paragraph: 42
        text: |-
          "No puedo creer esto..." dice Eiden. "¿Me estás chantajeando? ¡¿Me estás chantajeando?!"

          "Por supuesto", dice Azarius, con la misma sonrisa tranquila de antes. "¿Por qué no lo haría?"
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch12b_invitation4
  - name: b3_ch12b_invitation4
    texts:
      - source: scene_text
        paragraph: 70
        text: |-
          "¿Te das cuenta de que una vez que ya no necesite estos hechizos, lo primero que haré será cazarte y matarte por esto?..." le pregunta Eiden al sabio.

          "¡Por supuesto, hazlo!" Azarius dice. "Dudo mucho que estés en condiciones de hacerme algo en ese momento, ¡pero puedes intentarlo!"

          "¿Qué se supone que significa eso?" Eiden dice.

          "Lo descubrirás a su debido tiempo", dice enigmáticamente Azarius.

          "Entonces, ¿has venido hasta aquí sólo para salvar a estas personas con las que apenas has interactuado?..." dice Eiden. "¿Tenías alguna razón particular por la que quisieras desperdiciar tu vida sólo por ellos?"

          "Sí, recientemente descubrí que tenemos algunos... ¡intereses comunes!" Azarius dice. "Como tal, tengo muchas ganas de viajar con ellos, en nuestro camino hacia Galamir".

          "Intereses comunes..." dice Eiden mientras nos mira y luego a Azarius. "Supongo que pedir más detalles no serviría de nada en este momento".
      - source: scene_text_2
        paragraph: 54
        text: |-
          "Efectivamente", dice Azarius.

          Hay una breve pausa durante la cual Azarius y Eiden simplemente se miran, y parece que Eiden está considerando si su deseo actual de matar a Azarius realmente podría justificar que desperdicie varias semanas de trabajo.

          "Entonces parece que no me estás dando otra opción", le dice Eiden a Azarius. "Los dejaré vivir a todos por ahora. Pero deben saber que tengo muchas ganas de que llegue el momento en que pueda matarlos".

          "Sí, eso es comprensible", dice Azarius, completamente imperturbable ante la amenaza de Eiden.

          "¡Jajajaja!" Arraka se ríe de Eiden. "¡Te lo mereces, bufón arrogante!"
      - source: scene_3
        paragraph: 43
        text: |-
          "Mhm..." dice Eiden, sin molestarse en hacer ningún tipo de respuesta hacia Arraka.

          Luego se gira hacia mí y hacia Daren, y nos mira con los ojos cerrados en silencio durante unos segundos antes de continuar.

          "Bueno, entonces..." dice Eiden. "Supongo que ustedes dos aún podrían tener la oportunidad de demostrar que estoy equivocado después de todo..."

          Y con estas palabras finales, Eiden se teletransporta lejos de nosotros, dejándonos solo con Azarius y el leopardo.

          "Uf..." dice Azarius. "Eso ciertamente estuvo cerca, ¿no?"
    choices:
