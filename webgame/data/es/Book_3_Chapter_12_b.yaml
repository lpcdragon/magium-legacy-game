  - name: b3_ch12b_invitation2
    texts:
      - source: scene_text
        paragraph: 68
        text: |-
          "Sé que nunca me dijiste esas palabras en este mundo", dice Daren. "¡Pero si fuiste capaz de decirlas en esa situación, entonces sé que en el fondo esto es lo que realmente quieres! ¡Quieres que alguien te demuestre que te equivocaste al abandonar a la humanidad, y que aún queda algo de esperanza! ¡Déjanos ayudarte! Sé que puede parecerte una posibilidad remota en este momento, y probablemente pienses que estás perdiendo el tiempo dejándonos vivir, ¡pero al menos danos una oportunidad! ¡Sabes que podemos marcar la diferencia!"

          "Me temo que ya es demasiado tarde para eso, Daren", dice Eiden, en tono sombrío.

          "¿Pero por qué?..." dice Daren. "¿Por qué sería demasiado tarde?"

          "Porque los cristales azules han despertado", dice Eiden.

          "...¿Qué?" Pregunta Daren, pareciendo como si esa respuesta lo hubiera tomado completamente desprevenido. "¿Qué tiene eso que ver con cualquier--"

          "¿En serio crees que tu pequeña búsqueda para salvar algunas ciudades de una isla en el medio de la nada es lo único que tengo en mente?" Eiden dice. "Aquí hay cosas mucho más importantes en juego que Varathia. Y si Meridith consigue lo que quiere, se dé cuenta o no, será el fin de todos nosotros, no sólo en este mundo, sino probablemente también en otros".

          "Vaya, vaya... ¡Más despacio!" Daren dice. "¡No sabíamos nada de eso! ¿Es por uno de los fragmentos Magium? Mira, si nos dijeras de qué se trata todo esto, podríamos--"
      - source: scene_text_2
        paragraph: 52
        text: |-
          "No", dice Eiden, simplemente. "No puedo molestarme en contarte la infinidad de razones por las que Diane necesita morir, e incluso si lo hiciera, todavía no lo aceptarías. Tuviste tu oportunidad de detenerme, pero fallaste. Ahora... debes enfrentar las consecuencias".

          "¡¡¡EIDEN!!!" Arraka grita de repente, en un tono más furioso del que jamás le habíamos oído hablar antes. "Si matas a alguno de ellos, te prometo que pasaré el resto de mi vida viajando por el espacio infinito del éter hasta encontrar tu santuario, ¡luego te arrancaré el alma con mis propias manos y la torturaré por toda la eternidad! ¡¡¡Me entiendes?! ¡¡¡Voy a hacer de tu vida un infierno literal!!!"

          "¿Qué diablos te ha pasado?..." dice Eiden, luciendo muy confundido. "No voy a matar a Flower, si eso es lo que te preocupa. Al menos por el momento, sigo cumpliendo mi promesa al viejo zorro".

          "¡¿Empezaste a cerrar los oídos junto con los ojos?!" Arraka dice. "¡Dije que si matas a CUALQUIERA de ellos, voy a hacer que te arrepientas mientras vivas! ¿Tienes idea de cuánto trabajo he puesto en este plan? ¡¡¡Es la primera vez que me he sentido tan vivo en cinco mil años!!! ¿Y ahora quieres quitarme eso? ¿Para quitarme mi venganza perfecta contra los dioses? ¡No tienes idea de hasta dónde estoy dispuesto a llegar para hacerte la vida miserable si sigues adelante con esto!"

          "Espera, ahí..." dice Eiden. "Por un segundo, casi sonó como si estuvieras diciendo que has estado entrenando a estas personas para matar a los dioses en tu lugar, pero ¿claramente no es eso lo que querías decir?..."

          "¡¡¡Es EXACTAMENTE lo que quise decir, cretino pomposo!!!" Grita Arraka.
      - source: scene_3
        paragraph: 41
        text: |-
          "No..." dice Eiden, mientras pasa unos segundos en silencio, con cara de no poder creer lo que está oyendo. "No, no puede ser..."

          Luego hace una pausa por unos segundos más, todavía incapaz de encontrar una frase coherente con la que responderle a Arraka.

          "¿Los estás entrenando para matar dioses?..." dice Eiden, mientras por fin parece encontrar las palabras. "¡¿Estos... estos PAYASOS?! ¿Quieres que maten a DIOSES?"

          Luego vuelve a quedarse callado un rato, como si esperara que Arraka le dijera que todo era una broma y que no hablaba en serio.

          "¡¡¡Míralos!!!" dice Eiden, mientras nos señala. "¡Podría matarlos a todos con un chasquido de dedos si quisiera!"

          "¡Casi te matan, idiota!" dice Arraka. "Puedes regodearte todo lo que quieras, pero si Daren no se hubiera apiadado de ti como el imbécil que es, ¡te habrían partido limpiamente por la mitad! ¿Crees que eso no cuenta porque no estabas peleando con todo tu poder? ¿Quién crees que soy? ¿El enano idiota? ¿Crees que me importa que la pelea no fuera 'honorable'? ¡Estarías MUERTO, estúpido! ¡Y lo mismo les pasará a todos los dioses! ¡No tienes idea de cuánto más fuertes podrían haberse vuelto estos débiles en solo una semana o dos con mi guía! ¡¡¡No tienes ni idea!!!"
