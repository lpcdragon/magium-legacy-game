  - name: b3_ch12b_hostage
    routes:
      - condition: ch11_saved_rose = 0
        texts:
          - source: scene_text
            paragraph: 8
            text: |-
              "El Dios de la Muerte necesita usarla como rehén contra el stillwater llamado Eiden", dice el líder nigromante. "Una vez que hayamos terminado con ella, si todavía está viva, te la devolveremos".

              "No entiendo", dice Diane. "¿Por qué tu dios del plano mágico estaría siquiera preocupado por un stillwater de nuestro plano de existencia? ¿Y por qué a Eiden le importaría si Flower estuviera vivo o no? Ni siquiera sabía que se conocían".

              "¡¿Has estado viviendo bajo una roca durante los últimos tres días?!" grita el líder nigromante. "¿No sabes que hay una GUERRA entre los dioses en el plano mágico mientras hablamos?"

              "Oh... ¿una guerra?" Dice Diane, intentando fingir ignorancia. "¡Dios mío, no tenía idea! Pero todavía no veo qué tiene que ver todo esto con Eiden".

              "Nuestro dios sabe por una fuente muy confiable que, de hecho, fue Eiden quien instigó toda esta guerra", dice el nigromante. "¡Y por esta razón, ahora es el Dios de la Muerte quien le ha declarado la guerra a Eiden y ha prometido sacrificarlo como el perro que es! Sin embargo, a pesar de su inmenso poder, nuestro dios tiene sus límites y no puede usar todo su poder mientras se materializa en este plano de existencia. Es por eso que necesita a la niña. Sabemos que el espíritu zorro dorado que reside en este reino ha hecho jurar a Eiden que no la mate. Ya que claramente todavía está viva, eso significa que la niña debe tener valor como rehén contra él. Ahora entréguennosla y les prometo que no se derramará sangre aquí hoy."
          - source: scene_text_2
            paragraph: 8
            text: |-
              "Entonces, el Revenant no pudo hacer el trabajo la primera vez, y ahora el Dios de la Muerte nos envió a sus matones", dice Daren. "¿No entiende que a Eiden simplemente no le importa si Flower vive o muere?"

              "¡Silencio, perro!" dice el líder nigromante. "Deberías estar lo suficientemente agradecido de que te esté mostrando tanta misericordia. Sería prudente no agotar aún más mi paciencia. Solo danos a la niña y todos podremos dejar este asunto atrás".

              "¿Cuántas veces tendré que escucharte ofreciéndote a perdonar la vida a estas personas, antes de que seas un hombre y hagas lo que hay que hacer, cobarde?" dice el seguidor de Dios del Destino, quien recién ahora habla por primera vez.

              "¡¿Te ​​atreves a hablarme de esta manera, lunático?!" dice el líder nigromante. "¿Después de que tuve la amabilidad de permitirte unirte a nosotros en este viaje?"
          - source: scene_3
            paragraph: 7
            text: |-
              "Nunca los habrías encontrado sin mi ayuda", dice el seguidor Dios del Destino. "Tu dios no te otorga ningún hechizos que te permita encontrar la ubicación de otras personas desde lejos, y yo era el único seguidor de mi dios que estaba buscando activamente a este grupo exacto. Por eso también accediste a ayudarme a eliminarlos una vez que los encontráramos, a menos que ya lo hayas olvidado".

              "Todo el mundo sabe que estás loco, Clogworth", dice el líder de nigromante. "Para empezar, nunca tuve la intención de cumplir mis promesas".

              "Entonces, ahora me estás diciendo en la cara que me estabas mintiendo, ¿no es así?" dice Clogworth, el seguidor de Dios del Destino.

              "¿Puedo matarlos ahora o vamos a esperar cortésmente a que dejen de hablar antes de atacarlos?" Kate nos susurra.

              "Dame un minuto", le susurra Daren. "Estoy tratando de usar lo que Arraka me enseñó sobre las auras para descubrir si colocaron alguna trampa mágica por aquí o no".
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch12b_visions
