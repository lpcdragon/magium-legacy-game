          - source: scene_text_2
            paragraph: 39
            text: |-
              De repente, recuerdo que Arraka me mencionó esto hace unos días, cuando le pedí que me diera algunos ejemplos de lagunas que Eiden usó contra ella durante el invierno quieto. Esencialmente, Eiden está utilizando un defecto de diseño del hechizo para extender su duración mucho más allá de su límite, de manera similar a lo que estaba haciendo con el Hechizo de congelación del tiempo. Sin embargo, al hacer esto también está creando una nueva falla en el hechizo, que estoy a punto de explotar ahora mismo.

              Al darme cuenta de que moverme solo genera explosiones adicionales, simplemente me detengo en el aire y dejo que su hechizo termine naturalmente. Esto hace que las explosiones se desvanezcan muy rápidamente y, como esperaba, ya no se crean más.

              "Parece que Arraka tenía razón", le digo a Eiden, que ahora estaba flotando a unos metros de mí. "Esta fue realmente la forma correcta de evitar que abusaras de esta laguna jurídica".

              "Ah, por supuesto..." dice Eiden. "Arraka de nuevo."

              Esto no va a funcionar. Si sigo dejándolo controlar todo el flujo de la batalla de esta manera, eventualmente terminará matándome. Necesito pasar a la ofensiva de alguna manera.
