            paragraph: 28
            text: |-
              Esperamos unos minutos frente a la entrada del bosque sagrado, tal como lo pidió el zorro, hasta que finalmente se teletransporta de regreso junto con Leo el leopardo.

              "Ya se conocieron antes, así que no me molestaré con las presentaciones", nos dice Eleya, antes de que cualquiera de nosotros pueda decir algo. "Leo, me iré por ahora, pero si necesitas algo, ya sabes cómo contactarme".

              "Sí, fantástico zorro dorado", dice Leo. "Estaré bien".

              "Entonces... ¿debemos continuar, entonces?" Nos pregunta Diane, mientras el zorro se teletransporta.

              "Efectivamente", dice el leopardo. "¿Confío en que sepas cómo llegar a Galamir desde aquí?"

              "Por supuesto", dice Diane. "La forma más fácil es encontrar la carretera principal y simplemente seguir las señales. Después de todo, es una de las ciudades más visitadas de Varathia".

              "Sí, ese es el camino que suelo tomar también", dice Leo. "El camino más rápido a la carretera principal es en esta dirección. Vámonos".

              "Lamento mucho ponerte en esta situación, Leo", dice Flower. "Sé cuánto odias a los humanos..."

              "No es necesario que te disculpes", dice Leo. "El zorro fue quien sugirió que debería viajar con este grupo, no tú. Y en lo que respecta a mi animosidad hacia los humanos, eso se extiende principalmente a los habitantes de la ciudad de Varathia y sus parientes, no a ti ni a tus amigos, así que no necesitas preocuparte por eso".
          - source: scene_text_2
            paragraph: 24
            text: |-
              "Oh... ¡eso me hace sentir un poco mejor!" Flower dice. "En ese caso, ¡bienvenido a bordo, Leo!"

              "Gracias por invitarme", responde Leo.

              "No puedo creer que finalmente conseguimos la piña..." dice Hadrik, incrédulo, mientras ignora al leopardo. "¡¿Estamos realmente en camino de completar un objetivo del torneo después de todo este tiempo?!"

              "Ya no importa, pero sí, supongo que sí", dice Daren.
          - source: scene_3
            paragraph: 21
            text: |-
              "¡Me pregunto si seremos los primeros en llegar a Galamir con la piña!" Hadrik dice.

              "¿Puedes dejar de decir una y otra vez que llevamos el piña luminosa con nosotros?" Illuna dice. "Lo último que queremos es convertirnos en objetivos aún mayores de lo que ya somos".

              "Claro, claro, por supuesto", dice Hadrik, en tono sarcástico. "Eso sólo conduciría a peleas innecesarias. ¿Quién querría eso?"
