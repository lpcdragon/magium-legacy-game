      - condition: aura_hardening < 4 AND b3_ch11_red = 0
        texts:
          - source: scene_text
            paragraph: 62
            text: |-
              Es hora de que saque el as que tengo en la manga. Meridith me dijo que tengo una oportunidad única de robar la energía de Eiden con mi dispositivo de estadísticas durante unos segundos antes de que se dé cuenta de lo que estoy haciendo. Ahora sería el mejor momento para utilizarlo.

              Rápidamente saco mi dispositivo de estadísticas y presiono uno de los botones tres veces, como me mostró Meridith.

              "¿Estás subiendo de nivel tus estadísticas ahora, precisamente ahora?" dice Eiden, sin parecer impresionado. "Te das cuenta de que no importa lo que hagas, no va a--"

              De repente, Eiden se da cuenta de lo que estoy haciendo y me lanza un fuego muy rápido hechizo.
