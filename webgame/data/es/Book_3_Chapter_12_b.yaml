  - name: b3_ch12b_together2
    routes:
      - condition: b3_ch12_hadrik = 0 AND b3_ch10_eiden = 0
        texts:
          - source: scene_text
            paragraph: 47
            text: |-
              "¿Aumentamos la dificultad en algunos niveles?" dice Eiden, con una sonrisa, mientras alrededor de una docena de explosiones pequeñas, pero extremadamente poderosas, aparecen a mi alrededor.

              Reconozco este hechizo. Es un poco complicado esquivar todas las explosiones en el aire, pero su duración máxima es de quince segundos, así que si puedo aguantar tanto tiempo, estaré a salvo.

              Hago lo mejor que puedo para evitar todas las explosiones durante los siguientes quince segundos aproximadamente, y una vez que se acaba el tiempo, empiezo a relajarme un poco. Esto fue un gran error, ya que el hechizo de Eiden aparentemente aún no está terminado y, de hecho, las explosiones incluso parecen estar acelerándose.
          - source: scene_text_2
            paragraph: 38
            text: |-
              ¡¿Qué está pasando?! Sé con certeza que este hechizo sólo se puede lanzar una vez al día y tiene un límite de tiempo muy claro. ¿Lo confundí con algún otro hechizo?

              Sigo tratando de esquivar las explosiones, pero su número está creciendo exponencialmente hasta que no me queda ningún lugar para evitarlas y vuelo directamente hacia tres de ellas, que me matan en un instante.
