  - name: b3_ch12b_deescalate
    texts:
      - source: scene_text
        paragraph: 36
        text: |-
          "¡Oye, Eiden, estaba pensando!" Digo, ya que él y Daren siguen peleando. "¿Qué pasaría si le pedimos a Diane que haga un juramento de encantador para que nunca le cuente a Meridith o a cualquiera de los Lessathi cualquier información que hayamos revelado sobre ti durante este viaje? Eso podría funcionar, ¿verdad?"

          "El juramento de un encantador, dices..." me dice Eiden, mientras sigue evadiendo los ataques de espada de Daren.

          "Sí, ¿eso no resolvería todos tus problemas?" Le digo, mientras siento que me pongo un poco nervioso. "¡Y entonces podríamos dejar atrás todo este conflicto y continuaríamos interactuando como siempre lo hacemos!"

          De repente, Eiden desaparece de donde estaba y reaparece justo frente a mí, mirándome con los ojos cerrados, pero sin la sonrisa en su rostro.
      - source: scene_text_2
        paragraph: 30
        text: |-
          "Me decepcionas, Barry", dice Eiden. "Tus amigos comprendieron de inmediato que esta vez no había lugar para la negociación, por lo que decidieron tomar el curso de acción más lógico y apostar sus vidas en la muy pequeña posibilidad de que pudieran derrotarme. Mientras tanto, ¿qué estás haciendo? ¿Tratando de aferrarte a la esperanza de que pueda perdonarte nuevamente para mi propia diversión? ¿Pensar que tu declaración vacía para salvar todas las ciudades varathianas de alguna manera garantizará que nunca te mataré bajo ninguna circunstancia? ¿Cuál fue el punto de dedicar toda tu vida a convertirte en un Mago, si ni siquiera estás dispuesto a usar tu magia para salvarte en un momento tan terrible. Dime, Barry, ¿de hecho fuiste un cobarde todo este tiempo?..."

          Mis instintos me dicen de inmediato que esta no es como cualquiera de las otras ocasiones en las que me he enfrentado a Eiden antes. Esta vez en realidad está planeando matarme de verdad. Necesito salir de aquí, rápido.
      - source: scene_3
        paragraph: 27
        text: |-
          No espero a que Eiden haga un movimiento, y uso mi corrientes de aire para impulsarme en el aire, mientras apunto mis palmas hacia él desde arriba, en un intento de dispararle con uno de mis hechizos. Sin embargo, tan pronto como miro hacia Eiden, me doy cuenta de que ya se ha ido.

          Frenéticamente empiezo a mirar a mi alrededor en todas direcciones, para descubrir dónde se teletransportó. ¿Dónde está? ¿Arriba? ¿Abajo? ¿Detrás? ¡¿Dónde?!

          "¡Es invisible, idiota!" Me grita Arraka. "¡¡¡Detrás de ti !!!"

          No tengo tiempo de darme vuelta, porque puedo sentir una mano agarrando mi cabeza por detrás, y lo siguiente que sé es que mi cabeza explota en mil pedazos, matándome en un instante.
