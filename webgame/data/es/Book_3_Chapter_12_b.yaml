  - name: b3_ch12b_allout2
    texts:
      - source: scene_text
        paragraph: 45
        text: |-
          No espero a que Eiden haga su siguiente movimiento y aterrizo cerca de uno de los árboles caídos que no fueron quemados por su incendio anterior hechizo. Luego lo recojo para usarlo como arma y aprovecho al máximo mi estadística de velocidad máxima para correr hacia Eiden y lanzarle el árbol tan fuerte como puedo. Esto lo toma por sorpresa y no tiene tiempo para defenderse completamente. Mi golpe lo envía a estrellarse contra varios árboles antes de que finalmente se teletransporte frente a mí, luciendo un poco enojado.

          "Voy a ser honesto contigo, Barry", dice Eiden. "Eso me molestó un poco".

          Intento usar mi árbol como garrote para aplastarlo como a un insecto, pero solo logro golpear el suelo, porque Eiden ya se fue.

          "¡Detrás de ti!" Me grita Arraka. "¡Es invisible!"

          Inmediatamente después de escuchar la advertencia de Arraka, agarro el árbol firmemente en mis manos y comienzo a girar con él muy rápidamente, para estar seguro de golpear a Eiden, dondequiera que se esconda. Esto hace que su invisibilidad se cancele, mientras que él es arrojado hacia atrás seis metros nuevamente. Una vez más, se teletransporta en el aire y aparece frente a mí, pero esta vez inmediatamente agarra mi árbol con su mano y lo explota en mil pedazos.

          Al quedarme sin mi arma, me lanzo hacia otro árbol caído, lo levanto del suelo, pero ahora ya no lo uso como garrote y se lo lanzo a él. Mientras Eiden está usando un hechizo para volar el árbol justo cuando llega a él, agarro algunas piedras y se las lanzo a él también.
      - source: scene_text_2
        paragraph: 35
        text: |-
          Mientras tanto, Hadrik decide unirse a la diversión levantando su propio árbol del suelo, saltando hacia Eiden e intentando aplastarle la cabeza con él.

          "Esto es simplemente ridículo..." dice Eiden, mientras bloquea el árbol de Hadrik con una mano y usa la otra para protegerse de mis constantes lanzamientos de piedras.

          Eiden ahora se teletransporta a mi lado nuevamente e intenta atacarme con un hechizo, pero hago uso de mi velocidad y reflejos sobrehumanos para no darle ni la más mínima oportunidad de apuntarme. Sigo moviéndome de izquierda a derecha, más rápido de lo que el ojo puede ver, tratando de hacer que sea lo más difícil posible para él conseguir un buen bloqueo incluso con el hechizos más rápido que existe.

          Al ver que su objetivo hechizos no funciona, Eiden conjura diez grandes rocas de la nada y las arroja todas en mi dirección general, para estar seguro de que al menos una de ellas me golpeará. Me detengo por una fracción de segundo para atravesar una de las rocas, pero esto le da a Eiden tiempo para lanzar un fuego muy rápido hechizo, que cubre todo mi cuerpo antes de que tenga tiempo de reaccionar. Por suerte para mí, mi estadística Endurecimiento de aura al máximo fue suficiente para evitar que me incineraran, aunque pude sentir un calor muy intenso durante uno o dos segundos.

          De repente, la espada de Daren gira rápidamente hacia Eiden, lo que lo obliga a ponerse temporalmente a la defensiva, mientras se teletransporta constantemente mientras la espada sigue siguiéndolo.
      - source: scene_3
        paragraph: 31
        text: |-
          No podemos permitir que esta lucha se prolongue por mucho más tiempo. Si Eiden deja de tratar esto como un juego y entra en su modo serio, todos los árboles del mundo no serán suficientes para detenerlo.

          "Illuna, ¿crees que puedes lanzar tu 'lavado de platos' hechizo en Eiden?" digo. "Por su aspecto, no creo que esté lo suficientemente tranquilo como para defenderse adecuadamente de algo así en este momento".

          "Lo intentaré", dice Illuna. "Pero no prometo nada".

          Luego lanza su hechizo, causando que la cabeza de Eiden quede rodeada por una esfera de agua mientras él todavía estaba ocupado evadiendo la espada de Daren. Esto parece haberlo tomado completamente desprevenido, porque ya puedo escucharlo haciendo ruidos de ahogamiento, mientras al mismo tiempo está volando hacia arriba y hacia abajo, para poder seguir esquivando la espada giratoria que lo sigue.

          Al darse cuenta de que no puede deshacerse de la espada ni de la esfera de agua, Eiden conjura un pequeño tornado de la nada y se deja atrapar dentro de él a propósito. Esto resulta ser demasiado para hechizo que se está ahogando, y sus partículas de agua eventualmente se dispersan en el aire, mientras que la espada encantada tampoco logra absorber el elemento aire que forma el tornado y queda atrapada en él, lo que hace que Daren convoque temporalmente su arma.

          Al cancelar el tornado Eiden, vuelve a caer al suelo y luego se lleva la mano a la frente, sin hacer nada más durante unos segundos. Su cabeza debe estar dando vueltas como loca en este momento. Este es el momento que estaba esperando. ¡Es ahora o nunca!
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch12b_blinding
