            paragraph: 19
            text: |-
              "No entiendo cómo pensaste que podías vencer a Kate en un combate cuerpo a cuerpo".

              "Sí, no es broma", dice Hadrik. "¡Incluso logró tirarme al suelo una vez durante un duelo simulado! Quiero decir, me estaba conteniendo un poco, ¡pero aun así fue bastante impresionante! Ella tiene este tipo de... técnica que le permite desequilibrarte y rechazar completamente tu ataque incluso si pones mucha fuerza detrás de tu golpe. No estoy seguro de cómo lo hace, exactamente..."

              "Es un tipo de arte marcial", dice Daren, mientras todavía mira alrededor del área desde donde se teletransportaron los magos. "Nolderan me habló de esto en un momento. No recuerdo exactamente cómo se llama, pero supuestamente usa la propia fuerza de tu oponente contra ellos y también puede funcionar contra oponentes armados, si eres lo suficientemente hábil. ¿No nos mencionó una vez Kate que un maestro de artes marciales se apiadó de ella cuando sus poderes de hielo aún eran débiles, y en secreto le enseñó algunas lecciones en el bosque donde se escondía?"

              "Oh, claro, creo que ella dijo algo así", dice Hadrik.

              "¡No sabía que aprendiste a pelear con un maestro de artes marciales, Kate!" Diane dice. "¡Me encantaría conocerlo algún día!"

              "Lamentablemente eso ya no es posible", afirma Kate. "Murió de viejo no hace mucho".

              "Lamento oír eso...", dice Diane.
          - source: scene_text_2
            paragraph: 17
            text: |-
              "¿No podrías tener esta conversación mientras caminas?...", dice Arraka. "Los enemigos ya se han ido. ¿Qué estamos haciendo exactamente todavía aquí?"

              "Estoy tratando de descubrir cómo los magos se teletransportaron fuera de aquí", dice Daren. "Vi el ilusionista usando algún tipo de dispositivo, pero era demasiado pequeño para ser un teletransportador, así que pensé que era sólo un control remoto, y que el teletransportador real aún debería estar escondido en algún lugar por aquí. Tal vez podríamos usarlo".

              "¿En serio crees que dejaría un dispositivo como este por ahí si todavía fuera utilizable?" Arraka dice. "Probablemente sea uno de esos... aparatos de teletransporte de un solo uso que puedes comprar fácilmente en el mercado si tienes suficiente dinero. Incluso yo sé sobre ellos, y no tengo ningún interés en los dispositivos mágicos. Sólo estás perdiendo el tiempo".

              "Al contrario", dice Daren. "Esos dispositivos 'de un solo uso', como los llamas, en realidad pueden usarse como amplificadores de tu poder mágico durante todo un día si los modificas un poco después de que hayan cumplido su propósito como dispositivos de teletransportación. Es un truco que aprendí en mis primeros días de encantamiento, cuando no quería desperdiciar ningún material en--"
          - source: scene_3
            paragraph: 15
            text: |-
              "Ugh..." Arraka gime audiblemente. "Incluso si puedes encontrarle algún uso, nunca podrás recuperarlo. El pelele vestido de verde escondió el dispositivo detrás de una ilusión que permaneció activa incluso después de que se teletransportó, lo que significa que probablemente sea incluso más complicada que la que ya descifré. Como no podría importarme menos tu aburrido amplificador mágico, y obviamente no puedes ver a través de la ilusión por ti mismo, la única solución sería esperar hasta que se acabe el hechizo, lo que podría durar días. O, si estás realmente desesperado, supongo que podrías excavar toda el área hasta que lo encuentres, porque supongo que debe haberlo enterrado en alguna parte. ¿Estás dispuesto a cavar unas horas, Daren?"

              "Está bien, entiendo tu punto", dice Daren. "Sigamos adelante."

              "¡Música para mis oídos!" Arraka le dice.
        choices:
          - position: 1
            text: Continuar
