              "¿Estamos añadiendo nuevos combatientes?" Dice Eiden, mientras levanta una ceja. "¡Entonces tal vez es hora de que empiece a usar el quince por ciento de mi poder!"

              "¿Quince por ciento?" Hadrik dice. "Eres un pequeño sabelotodo..."

              Toda el área alrededor de Eiden de repente se cubre de fuego, ya que Daren usa su escudo para defenderse a sí mismo y a Hadrik, mientras que Illuna crea una gran columna de agua frente a nosotros para frenar las llamas mientras volamos.
          - source: scene_text_2
            paragraph: 36
            text: |-
              "Atacémoslo juntos", les digo a Illuna y Flower. "Intentaré mantenerlo ocupado con mi hechizos tanto como sea posible".

              "¿Oh?..." escucho decir a Eiden, quien aparentemente se teletransportó justo a mi lado. "¿Estás tan ansioso por probar tu magia recién adquirida en un stillwater, Barry? ¡En ese caso, haré todo lo posible para estar a la altura de tus expectativas!"

              Inmediatamente uso mi corrientes de aire para impulsarme hacia atrás para poder tener un poco de espacio para maniobrar, y luego comienzo con un rayo muy simple hechizo para probar las defensas de mi enemigo.

              "Ah... la clásica táctica inicial hechizo relámpago", dice Eiden. "¡Escuché que es muy popular comenzar duelos de magos como este en el Continente Occidental! Entonces, ¿encontraste alguna debilidad en mi protección hechizos?"

              Claramente me está provocando en este momento. El rayo hechizo que usé hace un momento me mostró una debilidad evidente en sus protecciones pasivas que incluso un principiante podría detectar. Sin embargo, dudo mucho que se moleste en poner una trampa contra mis estadísticas mágicas de nivel uno, así que jugaré su juego por ahora.
          - source: scene_3
            paragraph: 32
            text: |-
              Conjuro tres carámbanos que probablemente sean cien veces más débiles que cualquier cosa que haya creado Kate y los envío hacia Eiden desde tres direcciones distintas al mismo tiempo. Esto explota la debilidad de su barrera que creó a propósito y permite que uno de mis proyectiles lo apuñale en su hombro derecho, dándole una herida muy leve.

              "¡Impresionante!" Dice Eiden, en tono burlón, mientras inmediatamente cura la herida con su mano izquierda. "No mucha gente puede decir que han hecho sangrar a un stillwater. ¿No valió la pena convertirse en mago sólo por este momento?"

              "Oh, sí", digo con voz inexpresiva, "estoy temblando de toda la emoción".
