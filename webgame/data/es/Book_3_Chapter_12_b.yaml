  - name: b3_ch12b_pinecone
    texts:
      - source: scene_text
        paragraph: 23
        text: |-
          Luego camina unos metros hacia adelante, pasando varios pinos, mientras mira ansiosamente a su alrededor a cada paso, como si esperara que un emboscador se abalanzara sobre ella en cualquier momento. Mientras miro este 'bosque sagrado' desde más allá de la frontera invisible, no puedo evitar observar el hecho de que no hay absolutamente ninguna diferencia entre los dos lados del bosque, excepto por un tinte dorado muy, muy tenue en el aire que fácilmente podría confundirse con la luz del sol que entra a través de las hojas de los árboles.

          La única razón por la que noto esta diferencia es porque Flower me lo contó. Normalmente, no habría habido absolutamente ninguna manera de saber que lo que hay más allá de mí es territorio prohibido con sólo mirarlo, lo que sólo hace que la estricta política del zorro hacia los intrusos parezca aún más ridícula de lo que ya era.
      - source: scene_text_2
        paragraph: 20
        text: |-
          "¡Allí!" Grita Flower. "¡Veo uno!"

          Parece que Flower ya activó el detector, porque de hecho puedo ver una piña brillando intensamente con una luz amarilla de uno de los pinos cerca del borde. La niña corre rápidamente hacia el árbol, le arrebata la piña y luego la levanta victoriosamente en el aire, mientras la luz se desvanece lentamente.
      - source: scene_3
        paragraph: 18
        text: |-
          "¡Lo tengo!" dice Flower, felizmente. "¡Lo tengo!"

          Momentos después de hacer su declaración, una gran columna de luz amarilla aparece de la nada detrás de Flower, y una vez que desaparece, vemos que el zorro dorado ahora estaba en su lugar.

          Aunque Flower probablemente notó que el zorro se teletransportaba detrás de ella, parece estar congelada en su lugar, incapaz de pronunciar una palabra.
