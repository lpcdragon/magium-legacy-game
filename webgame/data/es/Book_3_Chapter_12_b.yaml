              current_scene: b3_ch12b_eiden4
  - name: b3_ch12b_eiden4
    texts:
      - source: scene_text
        paragraph: 34
        text: |-
          "¿Cómo hiciste--" dice Eiden, mientras mira a Kate. "¿Cómo exactamente pudiste--"

          "¡¡¡Dije que ya basta!!!" Grita muy fuerte Daren, mientras ahora levanta su espada en el aire y la mueve hacia la derecha, eliminando así la fuerza invisible que nos tenía inmovilizados en el suelo y permitiéndonos volver a levantarnos.

          "Has aprendido a cancelar las técnicas de manipulación del aura..." dice Eiden, ahora que finalmente comprende lo que estaba pasando. "Así es como venciste al capitán de la guardia real en Ollendor... ¡Maravilloso! ¡Excelente! Parece que podría haber subestimado cuánto progreso has hecho en tan poco tiempo. Con este tipo de mejora, tal vez incluso podría pelear contigo con una cuarta parte de mi poder. Espera, no... tal vez eso sea demasiado. ¿Veinte por ciento? No, no, no, eso todavía sería demasiado injusto. ¿Diez por ciento, tal vez?..."
      - source: scene_text_2
        paragraph: 28
        text: |-
          "Realmente te gusta oírte hablar, ¿no?" dice Hadrik, con una sonrisa, mientras instantáneamente corre frente a Eiden e intenta golpearlo, pero solo logra hacer un agujero en el suelo, mientras Eiden salta fuera del camino fácilmente.

          "Veo que estás ansioso por reanudar nuestro duelo desde el comienzo del torneo", le dice Eiden a Hadrik. "¿Debo abstenerme de usar magia nuevamente, para hacerla más deportiva?"

          "Claro, puedes hacer lo que quieras", dice Hadrik, mientras corre hacia Eiden nuevamente e intenta abrumar sus defensas con una serie de golpes rápidos.

          Durante los primeros diez segundos aproximadamente, parecía que Eiden tenía la ventaja, esquivando cada uno de los ataques de Hadrik sin esfuerzo. Sin embargo, después de un período de tiempo relativamente corto, pudimos ver que el rumbo de la batalla cambiaba rápidamente a favor de Hadrik, ya que ahora estaba empujando a Eiden hacia atrás y obligándolo a adoptar una posición mucho más defensiva.
      - source: scene_3
        paragraph: 25
        text: |-
          Finalmente, Eiden ya no pudo evitar uno de los golpes y no tuvo más remedio que bloquearlo, mientras era arrojado tres metros hacia atrás debido al impacto.

          "Oye, ¿qué pasó con no usar magia?" Hadrik le pregunta a Eiden, con una amplia sonrisa en su rostro. "¿O vas a decir que esta no era una barrera mágica que usaste para defenderte hace un segundo?"

          Eiden le frunce el ceño, pero no responde a su pregunta.

          "Eso de leer mi aura para predecir mi próximo movimiento es impresionante", dice Hadrik, "pero desafortunadamente para ti, Daren me lo ha estado haciendo durante días y ya tengo una idea bastante clara de cómo contrarrestarlo. Mientras no tenga una imagen clara en mi cabeza de dónde será mi próximo ataque y confíe en mis instintos para hacer la mayor parte del trabajo, el aura se confunde lo suficiente como para que no puedas obtener una buena lectura la mayor parte del tiempo. En otras palabras, también puedes dejar de usar esa técnica por completo porque es inútil contra mí".

          "Eiden, dejemos de hacer tonterías", dice Daren, mientras se acerca lentamente a Eiden. "No estás pensando con claridad. Esto no es propio de ti".
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch12b_eiden5
  - name: b3_ch12b_eiden5
    texts:
      - source: scene_text
        paragraph: 35
        text: |-
          "No es muy educado interrumpir un duelo, sanador", dice Eiden, mientras señala a Daren y hace un gesto con la mano. "¡Es hora de que te vayas a dormir!"

          Cuando ve que Daren no se ve afectado en absoluto por lo que ha hecho, Eiden mueve su dedo dos veces más hasta que finalmente se da cuenta de lo que está pasando.

          "Oh, es cierto..." dice Eiden. "Barry ya se enteró de tu Sobrecarga de protecciones. Entonces, finalmente la solucionó, ¿verdad?"
      - source: scene_text_2
        paragraph: 29
        text: |-
          "Solucioné mucho más que solo mi Sobrecarga de protecciones, Eiden", dice Daren. "Pero si tanto quieres ver nuestras mejoras, ¡aquí! ¡Déjame mostrártelo!"

          Daren luego comienza a blandir su espada hacia Eiden, mientras usa su estilo de combate más parecido a Nolderan que ha estado practicando durante los últimos días desde que dejó de usar su armadura. Mientras los dos pelean, puedo escuchar a Arraka murmurar para sí misma como una loca desde el interior de su amuleto.

          "No, no, no..." dice Arraka. "Es demasiado pronto para esto. Si Eiden se pone serio, esto se acabó... ¡Va a arruinarlo todo!"
      - source: scene_3
        paragraph: 26
        text: |-
          Es curioso, porque estaba pensando lo mismo. Si Eiden se pusiera serio ahora y usara la misma cantidad de poder mágico que mostró contra la forma de magma de Tyrath en la arena Thilias, esta pelea terminaría en un instante. Nuestras únicas posibilidades son reducir la intensidad del conflicto de alguna manera o vencerlo mientras todavía está jugando y sin liberar todo su poder.

          Para ser sincero, todavía me cuesta aceptar la realidad que tengo delante. Después de haber evitado un conflicto con Eiden durante tanto tiempo, empezaba a parecer casi imposible que volviéramos a encontrarnos en una situación así. Sinceramente, pensé que incluso podríamos llegar al final del torneo sin tener que luchar contra él. ¡Pero tal vez no sea demasiado tarde! Tal vez haya algunas palabras que pueda decirle y que le hagan cambiar de opinión. Lo he hecho antes, así que puedo hacerlo de nuevo, ¿verdad? ¡Solo necesito encontrar las palabras adecuadas!
