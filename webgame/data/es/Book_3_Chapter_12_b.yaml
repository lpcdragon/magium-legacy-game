  - name: b3_ch12b_eiden
    texts:
      - source: scene_text
        paragraph: 30
        text: |-
          Todos dejamos atrás el bosque sagrado y comenzamos a dirigirnos hacia la carretera principal, tal como acordamos. Una vez allí, inmediatamente divisamos una señal que nos indica la dirección hacia Galamir, por lo que seguimos la carretera, mientras revisamos las señales de madera de vez en cuando, para asegurarnos de no tomar un giro equivocado en algún cruce.

          Esperaba encontrarme con algunos civiles en el camino, pero esta zona parece estar mayormente desierta, probablemente debido a su proximidad relativamente cercana a uno de los bosques sagrados. Mientras continuamos viajando juntos, Flower, Kate y yo tratamos de incluir al leopardo en las conversaciones de nuestro grupo tanto como podemos, pero Hadrik y Daren parecen estar haciendo todo lo posible para ignorarlo en su mayor parte.

          No es que no entienda por qué no querrían ser amigos de alguien que solía ser nuestro carcelero no hace mucho, pero si juzgáramos las cosas con justicia, el leopardo nos ofreció una manera de ganarnos nuestra libertad cuando el zorro quería ejecutarnos, así que en mi opinión al menos merece el beneficio de la duda. Eh... Tal vez se acerquen a él después de que haya pasado un poco más de tiempo.
      - source: scene_text_2
        paragraph: 25
        text: |-
          Justo cuando empezábamos a relajarnos, vemos a Eiden parado en medio de la carretera frente a nosotros, con los ojos cerrados y la misma sonrisa educada en su rostro de siempre. ¿Me pregunto qué quiere ahora?...

          "¡Buenos días, amigos míos!" Dice Eiden, una vez que nos acercamos a él. "Veo que agregaste un nuevo miembro a tu grupo. ¿Cómo van las cosas, Leo? Ha pasado un tiempo, ¿no?"

          "Sí, ha... pasado un tiempo", dice Leo, luciendo muy incómodo.

          "¡Ah, y también tienes un piña luminosa contigo!" Eiden nos lo dice. "¡Magnífico trabajo! ¡Estoy seguro de que los organizadores del torneo estarán orgullosos!"
      - source: scene_3
        paragraph: 22
        text: |-
          "¿Hay alguna... razón particular por la que decidiste visitarnos esta vez?" pregunta Daren.

          "Hay algunos...", dice Eiden. "En primer lugar, quería preguntarte si has pensado más en el trato de Meridith de matarme. Han pasado más de dos días desde entonces, así que estaba pensando que este tema de conversación puede haber surgido una o dos veces, ¿no?"
    choices:
      - position: 1
        text: Dígale a Eiden que hemos tratado de evitar este tema tanto como sea posible.
        effects:
          - set:
              current_scene: b3_ch12b_eiden2
              b3_ch12_hesitant: 0
      - position: 2
        text: Cuéntale a Eiden que Daren duda en matarlo.
        effects:
          - set:
              current_scene: b3_ch12b_eiden2
              b3_ch12_hesitant: 1
  - name: b3_ch12b_eiden2
    routes:
      - condition: b3_ch12_hesitant = 0
        texts:
          - source: scene_text
            paragraph: 31
            text: |-
              "En realidad, hemos tratado de evitar este tema tanto como sea posible", digo.

              "Mhm... ¡Ya veo!" Eiden dice. "Sí, eso tendría más sentido. Mientras sigas retrasando tu decisión, no me convertirás en tu enemigo directo, pero al mismo tiempo también podrás dejar la puerta abierta para Meridith, en caso de que quieras cambiar de opinión en el último segundo. ¡Realmente has pensado en esto!"

              Después de que Eiden deja de hablar, se produce un silencio incómodo de unos segundos, en el que ninguno de nosotros dice nada.

              "Entonces, ¿había algo más que quisieras preguntarnos, o..." le dice Hadrik a Eiden, al ver que no planea continuar con su monólogo.

              "Sí..." dice Eiden. "De hecho, había algo más. Mira, he estado notando algo muy peculiar en los últimos dos días y medio, y esperaba que tal vez ustedes pudieran ayudarme a resolver este misterio. Por alguna razón, cada uno de los Lessathi de la superficie de Varathia que había estado monitoreando desde el comienzo del torneo desapareció sin dejar rastro, muy poco después de que su grupo ingresó a la base Lessathi, y no he sentido a ninguno de ellos desde entonces. Ahora bien, ¿por qué cree que pudo haber sucedido algo así?".

              Mientras Eiden habla, puedo sentir una gota de sudor deslizándose por mi cuello.

              "No lo sé", dice Hadrik, sin darse cuenta. "¿Quizás Meridith les pidió a todos que se teletransportaran a su base subterránea o algo así?"
          - source: scene_text_2
            paragraph: 26
            text: |-
              "¡Esa fue en realidad mi primera suposición también!" Eiden dice. "Podría haber varias razones por las que Meridith hubiera querido llamar a todas sus tropas de la superficie, así que no le presté atención durante los primeros dos días. Sin embargo, cuando vi que ninguno de ellos aparecía esta mañana tampoco, admito que comenzó a sentirse un poco extraño. Entonces, decidí volar de manera invisible durante unas horas, para ver si podía detectar un Lessathi desde arriba. ¿Y puedes adivinar lo que encontré?"

              "... ¿Un Lessathi?" Pregunta Flower, inocentemente.

              "¡Un Lessathi!" Eiden dice. "¡Exactamente, Flower! Pero verás, el problema con este Lessathi era que solo podía sentir su aura desde una distancia muy cercana. Esto me hizo sospechar un poco, así que analicé el brazalete que llevaba debajo de la manga para ocultar su presencia, y qué sabes... ¡se había actualizado para ser cien veces más poderoso que antes! ¡Cien veces! No tendrías idea de por qué habrían hecho tal cosa, ¿verdad? ¿Barry?"

              "¡Escucha, fue un error!" -dejo escapar. "No sabía que se suponía que era un secreto, así que le dejé escapar a Meridith que podías sentir sus tropas Lessathi desde lejos. Lee mi aura. ¡No estoy mintiendo!"

              "¡De hecho, no estás mintiendo!" Eiden dice. "Y como todos sabemos, lo verdaderamente importante es reconocer nuestros errores, aprender de ellos y asegurarnos de que no vuelvan a suceder. ¿No es así, Barry?"

              "Uh... ¡sí, por supuesto!" digo.
          - source: scene_3
            paragraph: 23
            text: |-
              "¡Perfecto!" dice Eiden alegremente. "Entonces, estamos de acuerdo. ¡Diane debe morir!"

              "¡¿Qué?!" Grita Kate, de repente, mientras el resto de nosotros solo miramos Eiden, en silencio atónitos.

              "Vamos, Kate..." dice Eiden. "Seguramente ya debes haberte dado cuenta. El hecho de que tu amiga, Diane, sea la segunda al mando de Meridith significa que, con toda probabilidad, la mayor parte de la información que le has divulgado probablemente llegue a oídos de Meridith una vez que tu amiga regrese a casa. Esto significa que todo lo que le hayas contado sobre mí en estos últimos dos días y medio también llegará a Meridith. y me temo que no puedo permitir que eso suceda."

              "¿Hubo otras cosas que nos contaste sobre ti y que no quieres que Meridith sepa?" Le pregunto a Eiden.

              "Sinceramente, no tengo ni idea", dice Eiden, mientras se encoge de hombros. "Nunca se me ocurrió la idea de decirte que no informaras a Meridith sobre mi capacidad de sentir a los Lessathi desde lejos, así que, pensándolo lógicamente, es posible que hayas descubierto otros detalles importantes sobre mí durante las muchas discusiones que hemos tenido en las últimas semanas. Ya que no me molesto en recordar cada conversación que he tenido contigo, y dudo mucho que puedas recordar cada conversación que hayas tenido con Diane acerca de mí tampoco, la solución más simple a mi dilema es eliminar completamente a Diane de la ecuación. ¿No estás de acuerdo?"
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch12b_eiden3
      - condition: b3_ch12_hesitant = 1
        texts:
          - source: scene_text
            paragraph: 32
            text: |-
              "En realidad, anoche tuve una conversación con Daren sobre esto", digo. "Dijo que los acontecimientos recientes le hicieron cambiar de opinión acerca de ti, y que cree que aún no has perdido toda tu humanidad, por lo que ahora dudaría en matarte".

              "¿Es así?..." dice Eiden, con voz pensativa, mientras gira para mirar a Daren, con los ojos aún cerrados.

              "¿Había algo más que quisieras preguntarnos, o..." le dice Hadrik a Eiden, al ver que ya no dice nada.

              "Sí..." dice Eiden. "De hecho, había algo más. Mira, he estado notando algo muy peculiar en los últimos dos días y medio, y esperaba que tal vez ustedes pudieran ayudarme a resolver este misterio. Por alguna razón, cada uno de los Lessathi de la superficie de Varathia que había estado monitoreando desde el comienzo del torneo desapareció sin dejar rastro, muy poco después de que su grupo ingresó a la base Lessathi, y no he sentido a ninguno de ellos desde entonces. Ahora bien, ¿por qué cree que pudo haber sucedido algo así?".

              Mientras Eiden habla, puedo sentir una gota de sudor deslizándose por mi cuello.

              "No lo sé", dice Hadrik, sin darse cuenta. "¿Quizás Meridith les pidió a todos que se teletransportaran a su base subterránea o algo así?"
          - source: scene_text_2
            paragraph: 26
            text: |-
              "¡Esa fue en realidad mi primera suposición también!" Eiden dice. "Podría haber varias razones por las que Meridith hubiera querido llamar a todas sus tropas de la superficie, así que no le presté atención durante los primeros dos días. Sin embargo, cuando vi que ninguno de ellos aparecía esta mañana tampoco, admito que comenzó a sentirse un poco extraño. Entonces, decidí volar de manera invisible durante unas horas, para ver si podía detectar un Lessathi desde arriba. ¿Y puedes adivinar lo que encontré?"

              "... ¿Un Lessathi?" Pregunta Flower, inocentemente.

              "¡Un Lessathi!" Eiden dice. "¡Exactamente, Flower! Pero verás, el problema con este Lessathi era que solo podía sentir su aura desde una distancia muy cercana. Esto me hizo sospechar un poco, así que analicé el brazalete que llevaba debajo de la manga para ocultar su presencia, y qué sabes... ¡se había actualizado para ser cien veces más poderoso que antes! ¡Cien veces! No tendrías idea de por qué habrían hecho tal cosa, ¿verdad? ¿Barry?"

              "¡Escucha, fue un error!" -dejo escapar. "No sabía que se suponía que era un secreto, así que le dejé escapar a Meridith que podías sentir sus tropas Lessathi desde lejos. Lee mi aura. ¡No estoy mintiendo!"

              "¡De hecho, no estás mintiendo!" Eiden dice. "Y como todos sabemos, lo verdaderamente importante es reconocer nuestros errores, aprender de ellos y asegurarnos de que no vuelvan a suceder. ¿No es así, Barry?"

              "Uh... ¡sí, por supuesto!" digo.
          - source: scene_3
            paragraph: 23
            text: |-
              "¡Perfecto!" dice Eiden alegremente. "Entonces, estamos de acuerdo. ¡Diane debe morir!"

              "¡¿Qué?!" Grita Kate, de repente, mientras el resto de nosotros solo miramos Eiden, en silencio atónitos.

              "Vamos, Kate..." dice Eiden. "Seguramente ya debes haberte dado cuenta. El hecho de que tu amiga, Diane, sea la segunda al mando de Meridith significa que, con toda probabilidad, la mayor parte de la información que le has divulgado probablemente llegue a oídos de Meridith una vez que tu amiga regrese a casa. Esto significa que todo lo que le hayas contado sobre mí en estos últimos dos días y medio también llegará a Meridith. y me temo que no puedo permitir que eso suceda."

              "¿Hubo otras cosas que nos contaste sobre ti y que no quieres que Meridith sepa?" Le pregunto a Eiden.

              "Sinceramente, no tengo ni idea", dice Eiden, mientras se encoge de hombros. "Nunca se me ocurrió la idea de decirte que no informaras a Meridith sobre mi capacidad de sentir a los Lessathi desde lejos, así que, pensándolo lógicamente, es posible que hayas descubierto otros detalles importantes sobre mí durante las muchas discusiones que hemos tenido en las últimas semanas. Ya que no me molesto en recordar cada conversación que he tenido contigo, y dudo mucho que puedas recordar cada conversación que hayas tenido con Diane acerca de mí tampoco, la solución más simple a mi dilema es eliminar completamente a Diane de la ecuación. ¿No estás de acuerdo?"
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch12b_eiden3
  - name: b3_ch12b_eiden3
    texts:
      - source: scene_text
        paragraph: 33
        text: |-
          "Mira, no estoy aquí con la misión de espiar a nadie", le dice Diane a Eiden. "No recuerdo que me hayan dicho nada importante sobre ti, pero incluso si lo hicieran, ¡no se lo diré a Meridith! Todo lo que quiero es pasar un tiempo con mi amigo de camino a la reunión diplomática de Galamir. ¡Eso es todo!"

          "Qué afirmación tan audaz estás haciendo, teniendo en cuenta que has estado oscureciendo tu aura todo este tiempo", dice Eiden. "Sabes muy bien que no hay manera de saber si estás mintiendo o no. E incluso si estuvieras diciendo la verdad, aún podrías cambiar de opinión fácilmente, una vez que regresaras a la seguridad de tu propia base. Realmente no me dejas otras opciones aquí".

          "No te atrevas a tocar Diane, ¿entiendes?" dice Kate, mientras se para frente a Diane y apunta con su cetro a Eiden. "¡No te atrevas!"

          "Kate, no creo que entiendas cuánto me ha hecho retroceder el pequeño error de Barry..." dice Eiden, ahora en un tono más serio. "Lo que te estoy ofreciendo aquí es extremadamente generoso. Normalmente, simplemente habría asesinado a todo tu grupo y habría terminado con esto, pero le hice esa promesa a Barry de perdonarte a cambio del mensaje que le entregó a Meridith, razón por la cual estoy haciendo este compromiso. Tu amiga, Diane, es la segunda al mando de una poderosa facción cuyo líder ha declarado abiertamente que me quiere muerto. Ella sabía exactamente qué riesgos estaba tomando cuando salió a la superficie y se embarcó en este viaje contigo. ¿Realmente quieres desperdiciar tu vida poniéndote de su lado en esta guerra?"
      - source: scene_text_2
        paragraph: 27
        text: |-
          "¿Sabes que?" Dice Hadrik, mientras se pone delante de Diane también. "Puedes tomar tu generosa oferta y metértela en el culo. No le harás nada a Diane mientras yo esté de pie".

          "Lo siento, pero realmente no veo cómo podrías detenerme", dice Eiden, con una expresión muy perpleja en su rostro, sin dejar de mantener los ojos cerrados.

          "Cálmate, Eiden", dice Daren. "No querrás hacer algo de lo que te arrepientas..."

          "Hmm..." dice Eiden. "Quizás he sido demasiado amigable con tu grupo últimamente. Parece que una vez más estás olvidando con quién estás tratando. Permíteme darte un pequeño recordatorio".

          Entonces sentimos una poderosa fuerza invisible que nos empuja hacia abajo, hasta que todos quedamos inmovilizados en el suelo, excepto Kate, Diane y el leopardo.

          "NGH..." Daren gime. "Eiden, ¡ya basta! ¿Me oyes?"

          "Dado que Diane es tan buena amiga tuya, te daré la oportunidad de salvarla, Kate", dice Eiden, mientras ignora a Daren.

          Justo cuando termina de decir esto, Diane de repente comienza a ahogarse, jadeando por aire, mientras la técnica de manipulación del aura de Eiden la eleva en el aire.

          "Si puedes detenerme cuando tu amiga se quede sin aire, podría considerar no ejecutarla en el acto", dice Eiden. "Veamos cuánto has mejorado realmente con tu entrenamiento".
      - source: scene_3
        paragraph: 24
        text: |-
          "¡Monstruo!" Dice Kate, mientras usa su cetro para conjurar algunos carámbanos muy poderosos y enviarlos directamente hacia Eiden a una velocidad explosiva.

          Eiden, sin embargo, los bloquea sin esfuerzo con una barrera semitransparente frente a él, mientras continúa estrangulando a Diane.

          "¡Eiden, te lo advierto!" dice Daren, ya que todavía estamos todos atrapados en el suelo.

          Mientras tanto, Kate parece haber renunciado a apuntar a Eiden directamente con sus carámbanos, y ahora los está apuntando a algún lugar entre Eiden y Diane, en un intento de interrumpir su técnica de manipulación del aura.

          "Ahora ni siquiera lo estás intentando", le dice Eiden a Kate, sin darse cuenta de lo que está intentando hacer. "¿No ves que ya ninguno de tus carámbanos me golpea?"

          Cuando Diane finalmente pierde el conocimiento debido a la falta de aire, Kate evoca un cono de hielo mucho más poderoso que antes, y esta vez lo dispara en el ángulo y la velocidad correctos para interrumpir con éxito la técnica del aura de Eiden. Esto hace que Diane caiga al suelo, mientras que Kate corre rápidamente hacia su lado, para comprobar si aún respira.

          "Ella está viva..." dice Kate, mientras deja escapar un suspiro de alivio. "Ella todavía está viva..."
    choices:
