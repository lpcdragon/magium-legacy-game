chapter_effects:
  - condition: b3_ch3_stats_unavailable = 1
    effects:
      - disable stats
  - condition: b3_ch3_stats_unavailable = 0
    effects:
      - enable stats
  - condition: current_scene = "b3_ch12b_unleashes2" AND warning.text is empty
    effects:
      - warning:
          text: Tus estadísticas no son lo suficientemente altas.
scenes:
  - name: b3_ch12b_distracting
    texts:
      - source: scene_text
        paragraph: 2
        text: |-
          La discusión de Flower con Melindra continúa durante los siguientes quince minutos aproximadamente y, por supuesto, durante este tiempo no pudieron abstenerse de incluirme en su conversación, como un compañero conocedor del sofisticado arte de coleccionar rocas. Siempre que esto sucede, los otros miembros de nuestro grupo tienden a distanciarse lentamente de nosotros mientras caminan, para poder hablar literalmente de cualquier otra cosa sin tener que oír hablar de rocas por centésima vez consecutiva.

          Técnicamente, podría estar haciendo lo mismo que ellos y simplemente dejar en paz a Flower con Melindra en el transceptor, pero supongo que simplemente no tengo el corazón para ello. O tal vez simplemente estoy desarrollando una especie de impulso masoquista de escuchar discusiones aburridas sobre rock cada vez que tengo la oportunidad. ¿Quién sabe?

          "Entonces", dice Kate, "¿alguien más quiere hablar sobre los cuatro magos que se han estado dirigiendo en nuestra dirección durante unos minutos o vamos a seguir ignorándolos?"
      - source: scene_text_2
        paragraph: 2
        text: |-
          "Los últimos grupos que hemos detectado durante los últimos dos días siempre nos han evitado", dice Daren. "Hasta ahora no hay motivos para pensar que no harán lo mismo".

          "Esta vez es diferente", dice Kate. "Ellos también nos sintieron claramente y se están moviendo para interceptarnos. Si seguimos caminando a esta velocidad, solo tomará unos minutos hasta que nos encontremos cara a cara con ellos".

          "Muy bien, no quiero distraerlos, así que los dejo con eso", dice Melindra, desde el transceptor. "¡Mantente a salvo, Flower!"

          "Tú también, Melindra", dice Flower. "¡Adiós!"
      - source: scene_3
        paragraph: 2
        text: |-
          "¿Creen ustedes que debería adelantarme y explorar un poco antes de toparnos con ellos?" Pregunto a los demás, mientras Flower cierra el transceptor.

          "Mira, Barry", dice Daren, "sé que estás emocionado de probar tu nueva técnica de vuelo en un escenario real sin entrenamiento, pero tal vez este no sea realmente el momento adecuado para hacerlo. Dudo que puedas descubrir mucho más sobre ellos observándolos desde arriba de lo que ya sabemos por sus auras, pero si tienen un hechizos de largo alcance en su arsenal, podrías correr el riesgo de ser atacado. Sigamos todos juntos por ahora, ¿de acuerdo?"
    choices:
      - position: 1
        text: Insiste en ir a explorar a los magos.
        effects:
          - set:
              current_scene: b3_ch12b_scout
              b3_ch12_scout: 1
      - position: 2
        text: De acuerdo con Daren y quédese con el grupo.
        effects:
          - set:
              current_scene: b3_ch12b_necromancers
              b3_ch12_scout: 0
  - name: b3_ch12b_scout
    effects:
      - set:
          failed_checks:
            - '[ Comprobación de observación fallida - nivel 3 ]'
        condition: perception < 2
      - set:
          failed_checks:
            - '[ Comprobación de observación fallida - nivel 3 ]'
          b3_ch12_scout: 2
        condition: perception = 2
      - set:
          successful_checks:
            - '[ Comprobación de observación exitosa - nivel 3 ]'
          b3_ch12_scout: 3
        condition: perception >= 3
    routes:
      - condition: b3_ch11_red = 0
        texts:
          - source: scene_text
            paragraph: 3
            text: |-
              "Sí, pero tal vez podría decir qué tipo de magos son por su ropa y su equipo", digo. "Eso podría darnos un poco de tiempo para planificar nuestras acciones contra ellos. Si te preocupa que me ataquen, intentaré mantenerme lo más lejos posible de ellos y estar muy consciente de lo que me rodea. Estoy seguro de que todo estará bien".

              "¡Podría ir con él!" Flower dice. "¡Dos cabezas piensan mejor que ninguna!"

              "Esa no es la expresión correcta..." dice Daren, esforzándose por no sonar exasperado. "Y probablemente tampoco verás nada desde tan alto debido a todos los árboles, pero da igual. Si tanto quieres hacer una misión de exploración, no me interpondré en el camino de tu felicidad. Sólo sé rápido. Si están buscando una pelea, prefiero enfrentarlos juntos que divididos".

              "¡Sí, sí, señor!" Dice Flower, y luego salta en el aire, activando sus chorros de fuego. "¡Vamos, Barry!"

              "Justo detrás de ti", digo, mientras también lanzo mi corrientes de aire sobre mí y vuelo tras ella.
          - source: scene_text_2
            paragraph: 3
            text: |-
              Tan pronto como dejo el suelo, ya puedo sentir un poco de inestabilidad cuando me muevo por el aire, pero no es tan malo como solía ser cuando desbloqueé mis estadísticas mágicas por primera vez en la base Lessathi. Después de trabajar un poco en mi corrientes de aire en los últimos días, ahora son algo más manejables y debería poder usarlos en una pelea, pero no serán tan receptivos como las corrientes que Melindra solía generar para mí. Supongo que esto era de esperar, ya que hasta ahora solo tengo un nivel en mis estadísticas mágicas. Probablemente tendré que esperar al menos dos niveles más hasta que pueda hacerlos funcionar tan bien como a los que estaba acostumbrado.

              "¡Allí!" Me dice Flower, ya que nos acercamos a nuestros objetivos. "¡Deberíamos tener una buena vista desde ese punto encima de ellos!"

              "No te acerques demasiado a ellos", le digo. "Hay algunos hechizos muy básicos que tienen un alcance realmente largo, por lo que queremos mantener una gran altitud. Sigue mi ejemplo".

              Ambos continuamos volando hasta que estamos directamente encima de ellos, y nos posicionamos lo suficientemente lejos de ellos para que solo un elementalista que se especializa en ataques de largo alcance, como Kate, pueda alcanzarnos. No tengo idea de qué tan bien estas personas pueden detectar enemigos muy por encima de ellos con su sentido mágico, pero supongo que lo descubriremos pronto.

              "¡Oye, mira, ese tipo nos está saludando!" dice Flower, mientras le devuelve el saludo a una de las personas en el suelo. "¿Crees que son amigables?"
          - source: scene_3
            paragraph: 4
            text: |-
              "Bueno, ciertamente no iré allí para averiguarlo", digo. "Hmm... Aparte del hecho de que tres de ellos están vestidos de negro y el cuarto está vestido de verde, realmente no veo nada fuera de lo común. ¿Y tú?"

              "Uh... veo que no están tratando de atacarnos, así que ¿supongo que eso es bueno?..." dice Flower.

              "No están atacando", digo, "pero se han detenido en medio de esta gran área sin árboles que sería perfecta para una batalla total, y claramente están esperando que vayamos hacia ellos. Probablemente deberíamos volver con nuestros amigos antes de que estos tipos decidan no ser tan amigables".

              "De acuerdo", dice Illuna. "Ya hemos visto todo lo que se podía ver desde esta distancia. No tiene sentido quedarse aquí por más tiempo".
            condition: perception < 2
