  - name: b3_ch12b_support
    routes:
      - condition: b3_ch12_scout = 0 AND b3_ch11_red = 0
        texts:
          - source: scene_text
            paragraph: 39
            text: |-
              "Vamos", le digo a Illuna, y luego Flower salta en el aire, activando sus chorros de fuego, mientras yo uso mi corrientes de aire para volar hacia el campo de batalla también.

              Tan pronto como dejo el suelo, ya puedo sentir un poco de inestabilidad cuando me muevo por el aire, pero esto era de esperarse. Con solo un nivel en mis estadísticas mágicas, honestamente debería estar agradecido de poder usar estas corrientes para volar. Ojalá no me fallen en un momento crítico.

              Parece que en el poco tiempo que no les he prestado atención, Hadrik y Daren han hecho un completo desastre en este lugar. La mitad de los árboles al costado del camino han sido aplastados por Hadrik o cortados por la espada de Daren, y todavía continúan, mientras que Eiden parece haber mejorado un poco en esquivar sus ataques, a pesar de apenas haber usado ninguno de sus hechizos más fuertes hasta ahora.

              Cuando Flower se acerca, Illuna conjura unas cuantas lanzas de agua de la nada y las lanza hacia Eiden, quien mueve ligeramente su mano derecha y evapora los proyectiles con una gran columna de fuego.

              "¿Estamos añadiendo nuevos combatientes?" Dice Eiden, mientras levanta una ceja. "¡Entonces tal vez es hora de que empiece a usar el quince por ciento de mi poder!"

              "¿Quince por ciento?" Hadrik dice. "Eres un pequeño sabelotodo..."

              Toda el área alrededor de Eiden de repente se cubre de fuego, ya que Daren usa su escudo para defenderse a sí mismo y a Hadrik, mientras que Illuna crea una gran columna de agua frente a nosotros para frenar las llamas mientras volamos.
          - source: scene_text_2
            paragraph: 33
            text: |-
              "Intentaré brindarte apoyo desde lejos", le digo a Illuna, mientras vuelo más lejos, para poner algo de distancia entre Eiden y yo. "Creo que podría tener algún hechizos que pueda--"

              "¿Brindar apoyo desde lejos?" Escucho la voz de Eiden, quien se teletransportó justo a mi lado mientras hablaba. "Recién ahora decidiste unirte a la batalla después de tanto tiempo, ¿y esto es lo que tienes que decir? ¿Desde cuándo te has vuelto tan cobarde, Barry?"
          - source: scene_3
            paragraph: 30
            text: |-
              Disparo un rayo hechizo hacia Eiden sin pensar, pero ya desapareció. Ahora inmediatamente me doy la vuelta y comienzo a disparar llamas de mis manos al aire vacío detrás de mí, pensando que Eiden estaba tratando de esconderse de manera invisible nuevamente de la misma manera que lo hizo contra Daren, pero no parece que esté golpeando nada.

              Justo cuando pensaba que estaba a salvo, puedo sentir la mano invisible de Eiden agarrando mi cabeza desde arriba y explotándola en mil pedazos, matándome en un instante.
        choices:
          - position: 1
            text: Reiniciar juego
            effects:
              - set:
                  current_scene: ch1_intro1
                  storyboard_controls: Jump to frame "Chapter 1"
          - position: 2
            text: Cargar desde el último punto de control
