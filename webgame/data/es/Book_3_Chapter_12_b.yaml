  - name: b3_ch12b_attack4
    routes:
      - condition: ch3_kate_badly_hurt = 1
        texts:
          - source: scene_text
            paragraph: 15
            text: |-
              "Está bien, ¿podemos olvidarnos de esos magos por un segundo y hablar de lo bien sincronizados que estábamos Kate y yo allí?" Dice Diane emocionada, mientras pasa su brazo derecho alrededor de la nuca de Kate. "¡Casi parecía que fuéramos hermanas gemelas! ¡Incluso tenemos cicatrices a juego!"

              "Tu cicatriz está en tu brazo izquierdo...", dice Kate. "El mío está en mi cara".

              "¡Suficientemente cerca!" Dice Diane, con una sonrisa.

              "¿Alguien puede decirle a mi hermana gemela que suelte su agarre?" Kate dice. "Se está volviendo un poco difícil respirar".

              "¿Estás seguro de que quieres pedir ayuda a tus amigos?" dice Diane, con una sonrisa, mientras continúa manteniéndola en un dominio relativamente flojo. "¡Y aquí estaba yo, ofreciéndote amablemente la revancha que siempre quisiste, después de todas esas veces que te gané en la lucha libre cuando éramos niños!"

              "Bien", dice Kate. "Tú lo pediste".

              Luego utiliza su pie derecho para barrer la pierna derecha de Diane, mientras agarra con ambas manos el brazo que tenía alrededor de su cuello, para así levantar a Diane sobre su espalda y luego tirarla al suelo frente a ella. Tan pronto como Diane aterriza en el césped, Kate la gira de cara al suelo, le pone una rodilla en la espalda y comienza a torcer uno de sus brazos detrás de ella.
          - source: scene_text_2
            paragraph: 16
            text: |-
              "¿Lo reconoces?" Kate le pregunta a Diane, mientras sigue girando el brazo.

              "¡Ay, ay, ay, ay!" Diane dice.

              "¿Lo reconoces?" Kate le pregunta de nuevo, esta vez un poco más fuerte.

              "¡Me rindo, me rindo!" Diane dice. "¡Tú ganas!"

              Tan pronto como Kate suelta su brazo, Diane comienza a reír de una manera que nunca antes la habíamos oído reír. Suena casi... en paz. No creo haberla visto nunca tan relajada en nuestra presencia, hasta el punto de que parece que recién ahora estamos viendo un indicio del verdadero Diane detrás de la máscara que ha estado usando todo este tiempo.

              Creo que Kate también podría estar viendo lo mismo que yo, porque ahora ella está sonriendo y ofreciéndole la mano a Diane.
          - source: scene_3
            paragraph: 14
            text: |-
              "Vamos..." le dice Kate. "Levantarse."

              "¡No puedo creer que hayas hecho eso!" Dice Diane, mientras toma la mano de Kate, con lágrimas en los ojos por la risa. "¡No me esperaba eso en absoluto!"

              "¿De qué estás hablando?..." dice Kate, mientras la ayuda a levantarse. "Tú eres el que quería la revancha, ¿no?"

              "¡Sí, pero sólo estaba bromeando contigo!" Diane dice. "El viejo Kate de Beacon nunca habría aceptado mi desafío tan directamente. ¡Solías ser tan tímido! ¡Creo que me gusta esta nueva versión de Kate!"
