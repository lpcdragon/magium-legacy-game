        texts:
          - source: scene_text
            paragraph: 46
            text: |-
              "¿Qué pasó con tu estilo de combate, Hadrik?" Mientras tanto, escucho a Daren decir desde algún lugar debajo de nosotros. "¡Estabas peleando mucho mejor esta mañana! ¿Te emborrachaste otra vez?"

              "Cállate..." dice Hadrik. "Es más fácil contra ti, porque ya conozco todos tus movimientos. Pero ahora que lo mencionas, tal vez haya algo que quiera probar mientras todavía esté sobrio".

              Justo después de decir esto, de repente veo dos alas de águila brotando de su espalda, de manera similar a cómo Gontrok solía adoptar un cambio de forma parcial cuando luchamos contra él en Ollendor. Luego, con un solo y poderoso aleteo de sus alas, se eleva en el aire y alcanza Eiden en cuestión de segundos, enviándolo a volar varios metros hacia atrás con un fuerte golpe.
          - source: scene_text_2
            paragraph: 37
            text: |-
              "¡Ja!" Dice Hadrik, mientras bate sus alas para mantener su altitud. "¡Tenía la sensación de que este tipo de cambio de forma funcionaría mejor mientras no estuviera borracho! Casi me dan ganas de estar sobrio más a menudo para probarlo. ¡Casi!"

              Luego procede a atacar a Eiden una vez más, lo que lo obliga a cambiar temporalmente de objetivo al enano por el momento, ya que los dos ahora están volando por todos lados e intercambiando golpes uno tras otro.

              Es bueno que Hadrik mantenga ocupado a Eiden, pero probablemente debería empezar a pensar en una forma de pasar a la ofensiva yo mismo, a menos que quiera dejar que Eiden controle todo el flujo de la batalla.
