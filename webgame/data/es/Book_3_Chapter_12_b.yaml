  - name: b3_ch12b_unleashes
    texts:
      - source: scene_text
        paragraph: 37
        text: |-
          No tiene sentido intentar reducir la escalada ahora. Eiden claramente ha decidido matar a Diane y no aceptará un no por respuesta. La única forma de salir con vida de esta situación es vencerlo. ¿Pero cómo?...

          Mientras intento pensar en un plan de acción, veo a Daren blandiendo su espada nuevamente, pero esta vez Eiden la bloquea solo con su dedo índice.

          "¡Ja!" Daren dice. "Sabes, estos trucos solían ser mucho más impactantes cuando no sabía nada sobre auras. Todo lo que estás haciendo ahora es concentrar toda tu capacidad de Endurecimiento de aura en un solo punto, para hacerlo mucho más fuerte de lo normal, ¿no? Pero entonces todo lo que tendría que hacer en este caso es simplemente girar mi espada de esta manera, y luego--"

          Menos de un segundo después de que Daren comienza a girar su espada, Eiden se teletransporta lejos de él en un abrir y cerrar de ojos y reaparece a unos tres metros detrás de su posición original.

          "Ah, ¿ves?" Daren dice. "¡Ahí vamos! ¡Por supuesto que no querrías que te apuñale con esta espada, porque entonces correrías el riesgo de que corte tu conexión con el plano mágico! No es tan fácil pretender ser todopoderoso cuando la gente puede entender lo que estás haciendo, ¿verdad?"
      - source: scene_text_2
        paragraph: 31
        text: |-
          "Es cierto que esa espada tuya se está volviendo un poco molesta", dice Eiden, mientras ahora extiende su brazo hacia Daren y hace un movimiento de tracción con él.

          "¡Oh, por supuesto, toma mi espada!" Dice Daren, mientras suelta su arma y la deja volar hacia Eiden.

          A medida que la espada se acerca a él, comienza a acelerar y girar muy rápidamente como la pala de un rotor. Esto obliga a Eiden a teletransportarse fuera del camino una vez más, pero la espada sigue siguiéndolo cada vez que desaparece y reaparece.

          "¿Qué pasa?" Dice Daren, mientras mueve sus manos para cambiar la dirección de su espada. "¿Ya no quieres mi espada?"

          Al ver que teletransportarse no funciona, Eiden intenta disparar el arma voladora con magia de aire, pero la espada giratoria simplemente absorbe el elemento aire y se lo envía de regreso por sí sola.

          Tan pronto como la pala del rotor gira alcanza su objetivo nuevamente, Eiden se teletransporta una vez más, pero esta vez intenta salir volando de su camino en lugar de desaparecer.

          "¡¡¡Eso es una ilusión, idiota!!!" Grita Arraka. "¡El verdadero Eiden es invisible detrás de ti!"
      - source: scene_3
        paragraph: 28
        text: |-
          Una simple fracción de segundo después de que Arraka dice esto, Hadrik instantáneamente corre detrás de Daren desde un costado y golpea el aire vacío frente a él, haciendo que Eiden se vuelva visible nuevamente, mientras es arrojado contra uno de los árboles al costado de la carretera.

          "¿Los estás ayudando ahora, Arraka?" Dice Eiden, mientras se pone de pie y se sacude el polvo. "Eso no es realmente muy justo, ¿verdad?"

          "¡¡¡Cierra tu sucia boca, desperdicio de vida humana!!!" Grita Arraka, enojado. "¿No entiendes que todos mis planes se van a arruinar por tu culpa? ¡¡¡Por tu culpa!!!"

          "Honestamente, no tengo idea de qué estás hablando", dice Eiden, mientras Hadrik corre hacia él nuevamente y lo golpea a través del árbol.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch12b_unleashes2
  - name: b3_ch12b_unleashes2
    texts:
      - source: scene_text
        paragraph: 38
        text: |-
          Está bien... necesito analizar la situación con calma y encontrar una solución. En este momento, Daren y Hadrik son los únicos que luchan activamente contra Eiden, y está bastante claro que hasta ahora solo ha estado jugando con ellos. Incluso sin liberar todo su poder, debería ser capaz de hacer mucho más de lo que ha demostrado hasta ahora.

          Esto significa que si lo pillamos por sorpresa en su estado actual, es posible que aún tengamos la oportunidad de cambiar las cosas. Tal como están las cosas, ya tenemos un plan preparado para neutralizar el Arraka del pasado, que se supone que es más poderoso que la forma más fuerte del Eiden. Sin embargo, para que ese plan funcione, Eiden necesitaría permanecer en el lugar durante unos segundos y también estar lo suficientemente distraído como para no intentar bloquear el rayo de hielo de Kate.

          Déjame pensar. ¿Hay alguna manera de hacer que Eiden se quede quieto y no preste atención a lo que está haciendo Kate?...

          ¡Esperar! ¡Hay una manera! De hecho, tengo el hechizos perfecto que necesito, ¡e incluso los he practicado varias veces! Pero todavía voy a necesitar que esté considerablemente debilitado antes de lanzar estos hechizos si quiero que tengan el mejor efecto en él.
      - source: scene_text_2
        paragraph: 32
        text: |-
          Y para eso, voy a necesitar ayuda.

          "Flower, Illuna", digo. "Necesitamos ejercer más presión sobre Eiden. ¿Puedo contar contigo?"

          "¿Confío en que se te haya ocurrido algún tipo de plan?" Me pregunta Illuna.

          "Sí, pero prefiero no hablar de ello en voz alta, porque no estoy seguro de cuánto ha mejorado Eiden su capacidad auditiva", digo.

          "Entendido", dice Illuna. "En ese caso, cuando estés listo".

          Asiento con la cabeza y luego me vuelvo hacia Kate, que todavía está cerca del inconsciente Diane, para estar listo para defenderla de cualquier daño.
      - source: scene_3
        paragraph: 29
        text: |-
          "Kate", digo, "¿recuerdas nuestro plan para acabar con el Arraka del pasado?"

          “Lo recuerdo, sí”, me responde Kate.

          "Bien", le digo, "Entonces, voy a necesitar que ahorres tu energía tanto como sea posible y que no hagas nada hasta que te presente la oportunidad perfecta. Lo sabrás cuando suceda".

          "Está bien, entonces estaré esperando", dice Kate.
