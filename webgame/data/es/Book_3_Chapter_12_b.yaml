              "Nunca supe que recordabas con tanto cariño mis golpes, Barry", me dice Kate, mientras hace crujir sus nudillos. "Acércate y puedo darte tantos como quieras".

              "¡Tentador, pero creo que pasaré, por ahora!" digo.

              "Está bien", dice Kate. "La oferta no caducará de todos modos. Todo lo que necesitas hacer es decir algo estúpido otra vez y podrás reclamar tu recompensa gratis".
          - source: scene_text_2
            paragraph: 17
            text: |-
              "¿No podrías tener esta conversación mientras caminas?...", dice Arraka. "Los enemigos ya se han ido. ¿Qué estamos haciendo exactamente todavía aquí?"

              "Estoy tratando de descubrir cómo los magos se teletransportaron fuera de aquí", dice Daren. "Vi el ilusionista usando algún tipo de dispositivo, pero era demasiado pequeño para ser un teletransportador, así que pensé que era sólo un control remoto, y que el teletransportador real aún debería estar escondido en algún lugar por aquí. Tal vez podríamos usarlo".

              "¿En serio crees que dejaría un dispositivo como este por ahí si todavía fuera utilizable?" Arraka dice. "Probablemente sea uno de esos... aparatos de teletransporte de un solo uso que puedes comprar fácilmente en el mercado si tienes suficiente dinero. Incluso yo sé sobre ellos, y no tengo ningún interés en los dispositivos mágicos. Sólo estás perdiendo el tiempo".

              "Al contrario", dice Daren. "Esos dispositivos 'de un solo uso', como los llamas, en realidad pueden usarse como amplificadores de tu poder mágico durante todo un día si los modificas un poco después de que hayan cumplido su propósito como dispositivos de teletransportación. Es un truco que aprendí en mis primeros días de encantamiento, cuando no quería desperdiciar ningún material en--"
