        paragraph: 74
        text: |-
          Este es el final del tercer libro Magium.

          El resto de los libros aún no se han escrito, pero se publicarán capítulo por capítulo. (probablemente habrá cinco libros en la serie principal y dos precuelas)

          Mi estimación actual es que el primer capítulo del cuarto libro debería publicarse en los próximos meses.

          Si quieres volver a jugar el juego para encontrar diferentes caminos, te recomiendo intentar completar los logros desde el menú principal, porque están diseñados para mostrar la mayoría de las variaciones importantes de la historia.

          Si quieres charlar sobre el juego con otros jugadores mientras esperas los nuevos capítulos, puedes unirte a la discusión en el subreddit r/Magium tocando el botón a continuación.

          Si desea recibir notificaciones sobre las actualizaciones del juego, puede visitar la página de Twitter de Magium Games, tocando el botón correspondiente a continuación, y seguirme en Twitter.

          Además, si deseas revisar el juego, ten en cuenta que no todos los jugadores que leen las reseñas del juego lo han terminado, así que evita dar spoilers en las reseñas tanto como sea posible.

          ¡Gracias por jugar!

          PD Si disfrutaste el juego, no olvides recomendarlo a tus amigos.
