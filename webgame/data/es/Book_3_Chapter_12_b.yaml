  - name: b3_ch12b_digging
    texts:
      - source: scene_text
        paragraph: 20
        text: |-
          "Espera", le digo. "¿Recuerdas cómo te dije que noté que el ilusionista enterraba algo en el suelo justo cuando volaba sobre él? Creo que podría saber dónde escondió el teletransportador. Si no me equivoco, debería estar justo... ¡allí!"

          Luego señalo hacia un trozo de césped vacío más adelante y avanzo hacia él, mientras Daren también me sigue. Tan pronto como lo alcanzo, me arrodillo y empiezo a cavar en la hierba con mis propias manos.

          Como era de esperar, el suelo se siente suave mientras estoy cavando, lo que hace obvio que alguien ya había cavado un hoyo aquí antes que yo. Después de unos segundos más de tirar tierra a un lado, la ilusión finalmente desaparece y la hierba desaparece por completo, dejando solo la tierra marrón que cubría el dispositivo.

          Al ver que efectivamente había encontrado el lugar correcto, Daren comienza a cavar conmigo también y pronto logramos desenterrar un artilugio metálico redondo, del tamaño de una sandía pequeña. No estoy muy familiarizado con este tipo de dispositivos, pero por la reacción de Daren, parece que era exactamente lo que estaba buscando.
      - source: scene_text_2
        paragraph: 18
        text: |-
          "¡Perfecto!" Dice Daren, mientras ahora está sacando sus herramientas encantadoras de su mochila. "Sólo dame un minuto para convertir esto en un amplificador mágico adecuado, y luego podremos irnos".

          "¿Cómo se utilizaría exactamente un amplificador de este tipo?...", pregunta Illuna. "¿Tendrías que sostenerlo en tus manos mientras lanzas hechizos?"

          "No", dice Daren, mientras trabaja en la esfera de metal con sus herramientas. "Es suficiente pararse cerca de él, y automáticamente se conectará a tu aura. Te dejaré probarlo tan pronto como termine. Solo dame un segundo..."

          Una vez que Daren termina su trabajo en el dispositivo, lo patea ligeramente y lo deja rodar hasta Illuna. Luego le dice que lo pruebe con cualquier hechizo que quiera.

          Illuna asiente y elige usar el mismo hechizo que había estado usando para lavar los platos esta mañana. Desde la perspectiva de un extraño, es difícil distinguir entre su hechizo normal y este ligeramente amplificado, pero Illuna al menos parece estar bastante satisfecho con él.

          "Es mejor de lo que esperaba", dice Illuna. "De hecho, puedo mantener estable el hechizo mucho más fácilmente con esto. ¿Cuánto tiempo dijiste que puede durar este amplificador?"
      - source: scene_3
        paragraph: 16
        text: |-
          "Un día completo como máximo", dice Daren. "Puedes conservarlo si quieres. Podría resultar útil si las cosas van mal en el bosque sagrado hoy más tarde. Aunque espero que podamos resolver las cosas pacíficamente..."

          "Hadrik puede conservarlo por ahora", afirma Illuna. "Preferiría no llevar esta gran bola de metal hasta allí. Le pediré que me la entregue si alguna vez siento que la necesito".

          "Muy bien, te llevaré esto en mi mochila", dice Hadrik. "Pero para que lo sepas, sería bueno escucharte decir las palabras 'por favor' y 'gracias' de vez en cuando cuando haces solicitudes como estas".

          "Por favor y gracias", dice Illuna, secamente, en el tono más desinteresado posible.

          "Lo suficientemente cerca", dice Hadrik, mientras agarra el dispositivo de metal del suelo y lo guarda en su mochila.

          "Entonces supongo que hemos terminado aquí", dice Daren. "¡Salgamos!"
