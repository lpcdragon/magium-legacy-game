  - name: b3_ch02c_alice
    texts:
      - source: scene_text
        paragraph: 18
        text: |-
          "Entonces, si yo quisiera, ¿podría trastear con las auras de unas cuantas rocas y acabar con mi propio ejército personal de gólems de piedra superinteligentes?...", dice Hadrik.

          "Claro", dice Arraka. "Si además mezclas esas rocas con algo de seredium, algunos de los cristales azules tirados por estas cuevas y un montón de cosas más, y luego pasas unas cuantas décadas trabajando en ello con los conocimientos que hayas adquirido del Magium, sí, tendrás tu ejército. Llámame dentro de treinta años y me cuentas cómo te ha ido."

          "En fin...", dice Albert. "Lo importante que deben saber sobre el Supervisor es que, por lo que hemos averiguado, no parece llevarse demasiado bien con Billy Bob, el lessathi, y por eso todavía no se le ha concedido el control total de los 'drouns' de la ciudad y sigue figurando como un protocolo 'experimental'. Tenemos razones para creer que el Supervisor tiene sus propios planes, aunque no tenemos claro qué intenta conseguir exactamente. En cualquier caso, si lográsemos ponerlo de nuestro lado, ganaríamos potencialmente un gran aliado, porque esos 'drouns' son sin duda una fuerza a tener en cuenta."

          "¿Por qué siguen llamándolos 'drouns'?", dice Melindra. "Estoy bastante segura de que el nombre correcto era 'droons'. ¿No era así como Billy Bob solía llamarlos?"

          "No, estoy bastante seguro de haberle oído llamarlos 'drouns' una vez", dice Albert. "O quizá era 'droines'. Escucha, da igual cómo los llame. El nombre es estúpido de todas formas. Llamémoslos simplemente bolas metálicas y se acabó."
      - source: scene_text_2
        paragraph: 11
        text: |-
          "En realidad, yo prefiero llamarlas cabezas de gólem", dice Melindra. "Ya saben, por ese ojo que tienen en medio."

          "Uf...", dice Albert. "Como sea. Vamos, Peter, deberíamos ir a ver al rey. Ya lo hemos hecho esperar bastante."

          "Perdonen...", dice una niña de unos siete años, acercándose tímidamente a nuestro grupo. "¿Vienen de la superficie? ¿Son guerreros?..."

          "Eh... sí", dice Daren. "Sí lo somos... ¿Por qué lo preguntas?"

          "Por favor, señores...", dice la niña mientras nos agarra débilmente a Daren y a mí de las muñecas. "¿Podrían ayudarme a encontrar a mi familia? Mi madre lleva tres días desaparecida... Mi padre y mi hermano llevan aún más tiempo. Esta gente dijo que me ayudaría. Dijeron que me ayudarían a encontrarlos, ¡pero mintieron! No los han buscado en absoluto y ya han pasado tres días. Por favor, señores, tienen que ayudarme... ¡Ustedes son mi única esperanza!"
      - source: scene_3
        paragraph: 9
        text: |-
          "Vamos, Alice, ya sabes que no deberías molestar a desconocidos...", dice Albert, y luego aparta a la niña de nuestro lado, mientras ella parece estar a punto de echarse a llorar.

          "Sí, señor...", dice Alice con voz apagada y una expresión de enorme cansancio, como si ya hubiera perdido toda esperanza. "Lo siento. No volverá a pasar..."

          "Perdonen por esto", nos dice Albert, y luego se vuelve hacia su amigo. "¡Vamos, Peter!"

          "Oh, no es... ninguna molestia", dice Daren, mirando a la niña y a los dos hombres que se alejan despacio hacia el fondo de la larga sala con una expresión algo preocupada en los ojos.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch02c_alice2
  - name: b3_ch02c_alice2
    texts:
      - source: scene_text
        paragraph: 19
        text: |-
          "¿Y eso de qué iba?", le pregunta Hadrik en voz baja a Breynan, el hombre de la cicatriz.

          "¿Te refieres a la niña?...", dice Breynan. "La recogimos durante una misión. Toda su familia había sido llevada por los guardias de la ciudad y ya no tenía adónde ir. Su padre y su hermano eran magos, y ambos desaparecieron una noche de sus casas sin dejar rastro y sin que nadie volviera a saber de ellos. No son los únicos magos que se han visto arrastrados fuera de sus hogares de repente y sin explicación en los últimos años. Este tipo de cosas ha empezado a pasar cada vez con más frecuencia conforme avanzaban los años, y la gente apenas se atreve ya a hablar del tema, por miedo a ser los siguientes a los que saquen de casa en mitad de la noche si no vigilan lo que dicen."

          "¿Tienen alguna idea de por qué podrían estar haciendo esto?", le pregunta Daren a Breynan, mientras veo que Albert y Peter se detienen en medio de la sala para hablar con uno de sus compañeros, mientras la niña se queda allí plantada, con la cabeza gacha.
      - source: scene_text_2
        paragraph: 12
        text: |-
          "Dado que la mayoría de sus objetivos hasta ahora han sido magos", dice Breynan, "creemos que quizá se los están llevando a esas grandes torres negras recubiertas de seredium. No sé si han visto cómo funcionan, pero esas torres son básicamente la principal fuente de energía mágica para todos los artilugios de esta ciudad, desde los carruajes metálicos voladores hasta esas bolas metálicas que patrullan los cielos. La energía de esas torres proviene de todos los magos que ves de pie en las plataformas voladoras adosadas a sus lados, y también de todos los magos que están dentro de las torres. Esta gente se pasa el día transfiriendo energía mágica a la torre y, a cambio, se les paga por sus servicios. Pero creo que Billy Bob no estaba contento con la cantidad de energía que obtenía del trabajo voluntario, así que decidió secuestrar a algunos magos para que pudieran trabajar día y noche en las torres, sin cobrar. No lo sabemos con certeza, claro. Por ahora solo es una especulación por nuestra parte."

          "¿No han ido a esas torres para ver si podían encontrar allí al padre y al hermano de la niña?", dice Daren.
      - source: scene_3
        paragraph: 10
        text: |-
          "Lo intentamos, pero esas zonas están fuertemente vigiladas", dice Breynan. "Tendríamos que arriesgar a demasiados de nuestros hombres solo para confirmar nuestra teoría, y luego haría falta todo un batallón para liberar de verdad a los esclavos. Por cruel que suene, por desgracia tenemos cosas más importantes en las que gastar nuestros recursos que buscar a la familia de una niña."

          "¿Y qué pasa con la madre de la niña?", pregunta Hadrik. "¿Saben qué fue de ella?"

          "Su madre desapareció poco después de empezar a insistir a los guardias de la ciudad para que investigaran por qué habían desaparecido su marido y su hijo", dice Breynan. "Debió de insistir un poco demasiado y puso nervioso a alguno de los guardias. Solo los dioses saben dónde puede estar ahora... si es que sigue viva."

          Cuando vuelvo a mirar hacia el otro extremo de la sala, veo que Albert y Peter han terminado su conversación con su compañero y están ya casi a punto de salir, con la niña siguiéndolos de cerca.
    choices:
      - position: 1
        text: Llamar a la niña y decirle que encontraremos a su familia.
