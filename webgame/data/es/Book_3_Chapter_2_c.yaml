            text: |-
              "No estoy seguro de quién se supone que es ese Supervisor, pero si con 'drouns' te refieres a esas bolas metálicas voladoras, entonces sí, nos topamos con ellas", digo. "Esas chatarras estuvieron a punto de matarnos."

              "Ah, sí", dice el hombre. "Esos 'drouns' no son ninguna broma, pero el Supervisor es todavía peor... Tiene el control absoluto sobre esas bolas metálicas y hasta puede usarlas para espiarte. Puede que algunos de aquí no estén de acuerdo conmigo, pero yo creo que ese cabrón es aún más peligroso que Billy Bob y la guardia real juntos."

