  - name: b3_ch02c_quarantine
    texts:
      - source: scene_text
        paragraph: 22
        text: |-
          "¡No, no, no!", grita Jack mientras sus compañeros lo empujan a la zona de cuarentena.

          En cuanto lo meten dentro, el guardia cierra la puerta y vuelve a echarle todas las cerraduras.

          "¡Déjenme salir!", oímos gritar desesperadamente a Jack desde el otro lado, mientras golpea la puerta de hierro con los puños. "¡No quiero morir aquí dentro! ¡No, suéltenme, qué están haciendo! ¡He dicho que me suelten! No pueden hacerme esto. ¡No pueden!"

          La voz del anciano se va apagando cada vez más a medida que los hombres del interior lo arrastran más adentro del área de cuarentena, hasta que finalmente deja de oírse por completo y el pasillo vuelve a quedar en silencio.

          "Vale, ¿qué COÑO ha sido eso?", le pregunta Hadrik a Breynan después de unos momentos en los que todos nos quedamos mirando la puerta de hierro sin decir nada.
      - source: scene_text_2
        paragraph: 16
        text: |-
          "Escuchen, sé cómo parece esto visto desde fuera, pero aquí no tenemos muchas opciones...", dice Breynan. "Hay una enfermedad terrible azotando nuestra ciudad en estos momentos y, a veces, los hombres que enviamos a misiones acaban contagiándose. No sabemos de dónde viene, no sabemos qué es y no tenemos manera de curarla. Lo único que sabemos es que, una vez la contraes, te aparecen de inmediato tres manchas rosadas en la nuca y, exactamente una semana después, empiezas a tener los primeros síntomas de la enfermedad, momento en que esta se vuelve contagiosa. Cuando la dolencia entra de lleno en acción, empiezas a sufrir ataques violentos de tos, fiebre alta y, con el tiempo, ni siquiera puedes levantarte de la cama. Nadie que haya contraído esta enfermedad ha conseguido sobrevivirla. Lo único que podemos hacer es aislar a cualquiera que se ponga enfermo, para al menos mantener nuestras bajas al mínimo."

          "No...", dice Daren. "No, esto no está bien... No pueden simplemente abandonar así a esta gente. Tiene que haber una manera de salvarlos. ¡Voy a entrar ahí!"
      - source: scene_3
        paragraph: 12
        text: |-
          "No, espera, no se te permite--", empieza a decir Breynan, pero Daren no le hace caso y pasa a toda prisa junto a nosotros directo hacia la puerta de hierro, a una velocidad que hace parecer que se ha olvidado por completo del dolor que todavía arrastra por la paliza de antes.

          "Iré a buscarlo", le digo a Breynan, mientras corro detrás de Daren.

          Antes de que logre alcanzarlo, sin embargo, Daren ya llama al guardia que hay frente a la puerta de hierro y le pide que le permita entrar en la zona de cuarentena.

          "Abra la puerta, por favor", le dice Daren al guardia cuando se detiene frente a él. "Quiero echar un vistazo dentro y ver si puedo ayudar."

          Al darme cuenta de que ya llego tarde, me quedo no muy lejos detrás de Daren y decido esperar a ver adónde lleva su conversación.

          "Nadie puede entrar en la zona de cuarentena", dice Desmond, el guardia. "Y menos aún los forasteros. Vuelve a tu silla y espera a que el rey te haga llamar. Aquí no hay nada que ver."

          "No, no lo entiende", dice Daren. "Soy un sanador. Si me deja entrar, quizá encuentre la forma de curarlos."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch02c_iknar
  - name: b3_ch02c_iknar
    texts:
      - source: scene_text
        paragraph: 23
        text: |-
          "Sé quién eres, sanador con armadura", dice Desmond. "Sé lo que has conseguido. Pero esta enfermedad no se parece en nada a esa peste de Iknar que eres tan famoso por haber curado tú solo. Aquí tenemos muchos sanadores hábiles y todos han dicho que jamás habían visto nada parecido. Ya perdimos a dos de nuestros mejores sanadores por culpa de esta plaga antes de darnos cuenta de que no hay nada que pueda hacerse para detenerla. No voy a dejar que tú también tires tu vida por la borda."

          "¿Así que simplemente vas a dejarlos morir delante de tus ojos?", dice Daren, furioso. "¡Son tus amigos!"

          "No te atrevas a darme lecciones, sanador", dice Desmond, en un tono que sugiere que apenas logra contener la rabia. "Ya he perdido a mi esposa por esta enfermedad y dentro de unos días estoy a punto de perder también a mi hermano. Si te digo que no se puede, entonces no se puede. ¡Solo vas a tirar tu vida por la borda para nada! ¿Es que no lo entiendes? No hay nada que puedas hacer para salvarlos. Da igual lo bueno que seas como sanador. ¡Nadie puede lograr lo imposible!"
      - source: scene_text_2
        paragraph: 17
        text: |-
          "¡Eso no significa que no pueda intentarlo!", dice Daren, con una mirada muy decidida en los ojos. "Escúchame, Desmond. Cuando vine a este torneo, me prometí a mí mismo que no me distraería. Juré que me centraría en mi objetivo de ganar el torneo pasara lo que pasara, porque ganar el Magium es lo más importante. Si yo ganara el Magium, todo aquello que antes no podía hacer se volvería posible y podría llegar a salvar decenas de miles de vidas en el tiempo que normalmente me habría llevado salvar una sola. Pero ahora mismo nada de eso importa. Nada de eso importa, porque para cuando gane el torneo... para cuando por fin consiga acceder al Magium... toda la gente que está detrás de esa puerta llevará mucho tiempo muerta, y no puedo permitir que eso ocurra. Nunca podría perdonármelo."

          Daren da entonces un paso hacia delante y le apoya ambas manos sobre los hombros al guardia mientras lo mira directamente a los ojos.
      - source: scene_3
        paragraph: 13
        text: |-
          "Desmond, por favor... déjame entrar", dice Daren. "Déjame entrar para que pueda salvar a tu hermano..."

          Parece que la rabia en los ojos de Desmond se ha desvanecido y ahora le sostiene a Daren una mirada larga y reflexiva, probablemente intentando decidir si debe confiar en él o no.

          "¡Estás loco, sanador!", le dice Desmond a Daren al cabo de un rato, apartándole las manos de los hombros. "¡Eres un demente y un necio! ¡Aún más necio que ese idiota de Kelrim!"

          El guardia empieza entonces a abrir las cerraduras una por una hasta que por fin termina y abre la puerta de hierro.

          "Haz lo que quieras", dice Desmond. "Pero que te quede claro que solo dispones de una semana. Si dentro de una semana no haces ningún progreso, o te mantienes fuera de nuestra base o te encerraremos dentro con el resto. No digas que no te lo advertí."

          "Gracias", dice Daren. "Me aseguraré de no desperdiciar la oportunidad que me has dado."

          Daren se vuelve entonces hacia mí.

          "Vamos, Barry", dice.
    choices:
      - position: 1
        text: Espera, ¡yo no te seguí hasta aquí por eso!
        effects:
          - set:
              current_scene: b3_ch02c_lousy
              b3_ch2_kelrim: 0
      - position: 2
        text: Muy bien. Guía tú.
        effects:
          - set:
              current_scene: b3_ch02c_cards
              b3_ch2_kelrim: 1
  - name: b3_ch02c_lousy
    texts:
      - source: scene_text
        paragraph: 24
        text: |-
          "Espera, ¡yo no te seguí hasta aquí por eso!"

          "¿No?...", dice Daren.

          "No, solo vine detrás de ti porque quería detenerte, pero llegué un poco tarde", digo. "En fin, veo que ya has tomado una decisión, así que lo único que puedo hacer ahora es desearte suerte."

          "Ah...", dice Daren, con voz decepcionada. "Bueno, en ese caso, gracias, supongo... Haré lo posible por no fastidiarla."

          Dicho esto, Daren entra en el área de cuarentena y, en cuanto cruza el umbral, Desmond cierra la puerta detrás de él y vuelve a echarle todas las cerraduras. Como ya no tengo nada que hacer aquí, decido regresar junto a mis amigos, que siguen reunidos cerca de la fila de sillas pegada a la pared.

          "Supongo que no conseguiste convencer a Daren para que cambiara de idea...", dice Kate cuando me reúno con ellos.

          "Estaba demasiado decidido a entrar ahí", digo. "No había nada que pudiera hacer."

          "Bah, seguro que estará bien", dice Hadrik. "Todos hemos salido de situaciones mucho peores que una maldita enfermedad. Ya encontrará la manera de arreglárselas al final."
      - source: scene_text_2
        paragraph: 18
        text: |-
          Mientras Daren está ocupado atendiendo a los enfermos dentro del área de cuarentena, el resto aprovechamos ese tiempo para mantener algunas conversaciones con Breynan y con el padre de Leila sobre la estructura de su sociedad subterránea y su relación con la gente que vive en la superficie de la ciudad. Justo cuando estamos empezando a entender mejor cómo funcionan las cosas en Ollendor, tanto arriba como abajo, vemos abrirse la puerta de hierro y a Daren salir cojeando del área de cuarentena, con un goblin vestido con túnicas de mago blanco siguiéndolo de cerca.

          "¿Un goblin?...", pregunta Illuna, sorprendida, cuando los dos llegan hasta nosotros.
      - source: scene_3
        paragraph: 14
        text: |-
          "Sí, este es Kelrim", dice Daren. "Un goblin mago blanco que lleva dos semanas ofreciéndose voluntario para atender a los enfermos del área de cuarentena."

          "¿Dos semanas?", pregunto. "¿No debería significar eso que su enfermedad ya es contagiosa?"

          "No", dice Daren. "Al parecer esta dolencia se desarrolla más lentamente en los goblins que en los humanos, así que todavía debería quedarle alrededor de un par de semanas antes de que su propia enfermedad se vuelva contagiosa y tenga que quedar encerrado en el área de cuarentena junto con los demás."

          "Vale...", digo. "¿Pero por qué lo has traído aquí?"

          "Lo he traído porque quiere encontrar una cura para esta enfermedad tanto como yo", dice Daren. "También me ha ayudado mucho lanzándome un hechizo de protección que me protegió temporalmente de la enfermedad y es gracias a él que he conseguido averiguar la verdadera naturaleza de esta dolencia."

          "¿Daren trabajando con un monstruo?", dice Hadrik. "Desde luego, eso es algo que nunca pensé que vería en esta vida."

          "¡El sanador dice la verdad!", dice Breynan después de inspeccionar la parte trasera del cuello de Daren. "¡Ese hechizo temporal del que habló de verdad consiguió protegerlo de la enfermedad!"
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch02c_strangers
  - name: b3_ch02c_cards
    texts:
      - source: scene_text
        paragraph: 25
        text: |-
          "Muy bien. Tú delante", digo.

          "Así que había dos locos de remate en lugar de uno...", dice Desmond, mirándome.

          "Bueno, supongo que no me llaman 'Barry el temerario' por nada", digo. "¡Hasta luego!"

          Dicho eso, sigo a Daren al interior del área de cuarentena y, en cuanto ambos entramos, Desmond cierra la puerta detrás de nosotros y vuelve a echarle todas las cerraduras. Ahora nos encontramos dentro de un pequeño pasillo iluminado por dos antorchas y, al fondo del túnel, hay otra puerta de hierro que no parece tener ninguna cerradura.

          Mientras nos acercamos a la puerta, empezamos a oír la voz del anciano que arrojaron aquí antes y parece que está discutiendo con varios de los otros enfermos que hay en el área de cuarentena.

          "Compórtate, Jack", dice uno de los hombres al otro lado de la puerta mientras Daren y yo avanzamos por el pasillo. "No has hecho más que quejarte desde que llegaste. Incluso tuvimos que apartarte de la entrada para que no molestaras a nadie en la sala de espera. ¿No puedes al menos intentar disfrutar de tus últimos días de relativa buena salud mientras todavía los tienes? Ven aquí. Tómate una cerveza. Échate unas cartas con nosotros. Al fin y al cabo, todos estamos metidos en lo mismo. No hace falta que hagas esto aún más deprimente de lo que ya es."
      - source: scene_text_2
        paragraph: 19
        text: |-
          Los hombres dejan de hablar de golpe cuando Daren y yo abrimos la puerta de hierro y entramos en la enorme sala en la que se encuentran. Al mirar alrededor, vemos que hay una mesa montada cerca de la entrada donde el anciano Jack y varios hombres más jóvenes están bebiendo cerveza y jugando a las cartas. El resto de la habitación está lleno de enfermos tumbados en sus camas, tosiendo con violencia o limitándose a mirar al techo. Y en medio de toda esa gente, para nuestra sorpresa, vemos a un goblin solitario vestido con túnicas de mago blanco que va de una cama a otra atendiendo a los enfermos, aparentemente demasiado concentrado en su trabajo como para haberse dado cuenta de que hemos entrado.

          "¿Un goblin?...", pregunta Daren, visiblemente atónito. "¿Es un goblin quien está atendiendo a toda esta gente?"

          Después de quedarse varios segundos mirando al goblin, boquiabierto, Daren reacciona de inmediato al ver al goblin lanzar un hechizo de curación sobre uno de los pacientes.

          "¡No, no, no!", dice Daren en voz alta y enseguida empieza a cojear a toda prisa hacia el goblin. "¡Así no se lanza ese hechizo! Ven, deja que te ayude."
      - source: scene_3
        paragraph: 15
        text: |-
          Cuando me acerco a los dos, veo que Daren le está sujetando una de las muñecas al goblin con la mano derecha mientras le toca el pecho al paciente con la izquierda. Por lo que puedo distinguir usando mi sentido mágico, parece que Daren está ayudando al goblin con el hechizo de curación estabilizando el flujo de su magia. Una vez lanzado el hechizo, Daren suelta al goblin y aparta también la mano del enfermo.

          "¿Ves? ¡Así es como se hace!", dice Daren. "No deberías arriesgarte a lanzar estos hechizos avanzados a menos que los controles por completo. Podrías lastimarte muy fácilmente con uno de estos si no andas con cuidado."

          "Gracias por el consejo, amable desconocido", dice el goblin en Lengua Común, con un acento sorprendentemente bueno. "Como probablemente habrás notado, no soy más que un novicio en las artes de la curación, pero hago lo que puedo para ayudar. Mi nombre es Kelrim. ¡Encantado de conocerte!"

          Luego extiende la mano y Daren se la estrecha con cierta vacilación.

          "Yo soy Daren", dice. "Y este es mi amigo, Barry. Dices que te llamas Kelrim... Creo que oí al guardia de la puerta mencionarte. Te llamó idiota. No lo entiendo... ¿Qué haces en este sitio? ¿Por qué estás ayudando a esta gente? ¿Te arrojaron al área de cuarentena como al resto?"
    effects:
      - set:
          ac_b3_ch2_reckless: 1
        achievement:
          id: ac_b3_ch2_reckless
          title: Temerario
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch02c_healing
  - name: b3_ch02c_healing
    texts:
      - source: scene_text
        paragraph: 26
        text: |-
          "Oh, yo no estaba enfermo cuando vine aquí por primera vez", dice Kelrim. "Pero cuando vi lo que estaba ocurriendo, no podía quedarme de brazos cruzados y dejar que toda esta gente sufriera. Mientras existiera alguna posibilidad de que yo pudiera ayudar a curar a cualquiera de ellos, tenía que intentarlo."

          "¿Pero por qué ibas a arriesgar tu vida solo para salvar a unos humanos?", pregunta Daren, perplejo. "¡Eres un goblin! ¿Por qué ibas a preocuparte de si esta gente vive o muere?"

          "Podría hacerte la misma pregunta a ti, humano llamado Daren", dice Kelrim. "¿Por qué te iba a importar la vida de ninguno de ellos? ¿Acaso no eres un forastero aquí? ¿No son todos estos humanos unos desconocidos para ti? Entonces, ¿por qué ibas a querer salvarlos? La respuesta es simple. Porque ambos somos sanadores, y está en nuestra naturaleza preocuparnos por la vida de los demás sin importar su raza o su especie. ¿No fue esa la razón por la que empezaste a aprender magia blanca en primer lugar? ¿Para intentar marcar una diferencia?"

          "Yo...", dice Daren, pero no parece encontrar las palabras. "No..."

          "¡Por los dioses!", dice Kelrim al ver por accidente la nuca de Daren cuando se mueve hacia otra cama. "¡Tu cuello! ¡No tiene las manchas rosadas! ¿Qué haces aquí si no estás enfermo? ¡Podrías contagiarte en cualquier momento! No te muevas, ¡te lanzaré ahora mismo un hechizo de protección!"
      - source: scene_text_2
        paragraph: 20
        text: |-
          El goblin extiende entonces las manos hacia Daren y una luz blanca lo envuelve mientras noto el flujo de la magia a su alrededor.

          "Y aquí va otro para tu amigo", dice Kelrim mientras me lanza de inmediato el mismo hechizo a mí. "Ahora salgan, rápido. Este hechizo no durará más de una hora y solo puede lanzarse una vez cada varios días sobre cada persona. Si no salen ahora, no puedo garantizar su seguridad durante mucho tiempo."

          "¡Ahora eso no importa!", dice Daren. "Dime, ¿qué hechizo de protección es ese que acabas de lanzarnos? Me ha resultado muy familiar."

          "Oh", dice Kelrim, "no es más que una versión ligeramente modificada de uno de los hechizos de protección básicos descritos en el libro 'Teoría avanzada de la magia', escrito por su sabio Azarius."

          "Otra vez ese libro...", dice Daren. "Barry, tú dijiste que lo habías leído. ¿Sabes a cuál de esos hechizos se refiere?"

          "Por la forma en que colocó las manos y por cómo nos envolvió la luz", digo, "apostaría a que se trata de una de esas protecciones que te defienden de enfermedades mágicas que afectan directamente al aura."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch02c_grim
  - name: b3_ch02c_grim
    texts:
      - source: scene_text
        paragraph: 27
        text: |-
          "¡Sí, eso es exactamente!", dice Kelrim. "He pasado las últimas dos semanas aquí dentro, intentando encontrar una forma de curar esta plaga, pero por desgracia este breve hechizo de protección es lo único que he conseguido idear hasta ahora. Por suerte para mí, soy un goblin, así que la enfermedad tarda mucho más en pasarme factura que a los humanos. Todavía deberían quedarme unas dos semanas antes de que mi propia enfermedad se vuelva contagiosa, así que intentaré aprovechar al máximo ese tiempo para encontrar una cura."

          "Si esta enfermedad afecta al aura", dice Daren, "entonces debería poder hacerme una idea de lo que hay que hacer concentrando mi sentido mágico sobre esta persona mientras la toco directamente. Déjame probarlo."

          Daren vuelve a posar la mano sobre el pecho del enfermo y cierra los ojos para visualizar mejor el flujo de su aura. Después de quedarse así alrededor de treinta segundos, por fin vuelve a abrirlos con una expresión muy sombría en el rostro.

          "Desmond tenía razón...", dice Daren. "Esto SÍ que es imposible. A menos que..."
      - source: scene_text_2
        paragraph: 21
        text: |-
          Daren se endereza, con un gesto mucho más serio en los ojos, mientras aparta la mano del paciente en la cama.

          "¿A menos que qué?", pregunta Kelrim.

          "Hay una persona que podría ayudarnos, pero conseguir que nos eche una mano quizá no sea tan fácil", dice Daren. "Síganme y les enseñaré de qué hablo."

          "Eh... vale", dice Kelrim. "Guíame."

          Daren asiente y empieza a dirigirse hacia la salida, mientras el goblin y yo lo seguimos. Cuando atravesamos la primera puerta de hierro y el pasillo que hay más allá, llamamos a la puerta de hierro que da a la sala de espera para avisar al guardia de que queremos salir.

          "Entonces, ¿ya te has rendido, sanador?", le pregunta Desmond a Daren mientras abre la puerta.

          "Todavía no", dice Daren, y luego nos conduce de vuelta junto a nuestros amigos, que siguen esperando a que llegue el rey del subsuelo cerca de la fila de sillas junto a la pared.

          "¿Un goblin?...", pregunta Illuna, sorprendida, cuando llegamos hasta ellos.

          "Sí, este es Kelrim", dice Daren. "Un goblin mago blanco que lleva dos semanas ofreciéndose voluntario para atender a los enfermos del área de cuarentena. También nos lanzó a Barry y a mí un hechizo de protección que nos protegió temporalmente de la enfermedad y me ayudó a averiguar la naturaleza de esta dolencia."

          "¿Daren trabajando con un monstruo?", dice Hadrik. "Desde luego, eso es algo que nunca pensé que vería en esta vida."
      - source: scene_3
        paragraph: 17
        text: '"¡El sanador dice la verdad!", dice Breynan después de inspeccionarnos la nuca. "¡Ese hechizo temporal del que habló de verdad consiguió protegerlos de la enfermedad!"'
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch02c_strangers
  - name: b3_ch02c_strangers
    texts:
      - source: scene_text
        paragraph: 28
        text: |-
          "Entonces, si ya has conseguido averiguar la naturaleza de la enfermedad, ¿por qué has vuelto aquí?", pregunta Kate.

          "Porque no puedo curarla yo solo", dice Daren. "Necesito ayuda. La enfermedad está afectando al aura de los pacientes, pero mi sentido mágico no es ni de lejos lo bastante refinado como para entender qué la causa y cómo puedo curarla. Por eso tuve que volver."

          Luego se coloca frente a Illuna y se arrodilla, inclinando la cabeza.

          "Arraka, necesito tu ayuda", dice Daren. "Eres la única persona que conozco con un sentido mágico lo bastante bueno como para entender cómo funciona esta enfermedad. Me doy cuenta de lo patético que es esto, pero no tengo a nadie más a quien recurrir y, si no hago algo, toda esa gente morirá. Por favor... ¿me ayudarás?"

          "¿Pero qué demonios?...", dice Arraka, mientras todos los demás miran a Daren demasiado atónitos como para decir nada. "¿Va a ser esta tu nueva manía a partir de ahora? ¿Agachar la cabeza ante tus enemigos para que te ayuden a salvar a unos desconocidos al azar?..."

          Hace una pausa de varios segundos durante la cual Daren no levanta la cabeza en ningún momento.
      - source: scene_text_2
        paragraph: 22
        text: |-
          "Mmm...", dice Arraka. "¿Sabes qué? Lo haré. La verdad es que me da exactamente igual que la gente de esa sala viva o muera, pero si esto te va a servir de motivación suficiente para mejorar de una vez tu sentido mágico más allá de un nivel básico, entonces será tiempo bien invertido para mí. Eso sí, te advierto de que no pienso dártelo todo mascado. Vas a ser tú quien encuentre la cura de esa enfermedad, no yo. Lo único que haré será darte pistas vagas para orientarte en la dirección adecuada. No creas que voy a ponértelo fácil solo porque estés jugando con tu vida. Si mueres por una estupidez como esta, solo me demostrarás que nunca estuviste preparado para enfrentarte a Selkram. Así que dime, sanador... después de oír todo esto, ¿sigues queriendo mi ayuda?"

          "Sí", dice Daren, todavía sin levantar la cabeza.

          "Bien, en ese caso tenemos un trato", dice Arraka. "Enséñame a esos enfermos tuyos y podremos empezar a trabajar con ellos ahora mismo, si quieres."
      - source: scene_3
        paragraph: 16
        text: |-
          "Daren, ¿estás seguro de esto?", dice Kelrim, cuando Daren por fin levanta la cabeza y se pone de pie. "No podré lanzarte el hechizo de protección por segunda vez. Si decides volver ahí dentro ahora, contraerás la enfermedad para siempre."

          "Ya acepté ese riesgo la primera vez que entré", dice Daren. "Illuna, dame el amuleto."

          "Esperen", dice Breynan. "No vayan a la sala de cuarentena todavía. El rey del subsuelo debería llegar de un momento a otro y creo que querrán oír lo que tiene que decir. Estoy seguro de que les sobrará tiempo para tratar a los enfermos cuando terminen de hablar con nuestro rey."

          "Está bien", dice Daren. "Pero espero que se dé prisa. Ya hace bastante que estamos aquí."

          "Sí, desde luego este rey se está tomando su tiempo para venir a saludarnos", dice Hadrik. "Esperemos que ese Albert no se haya parado a hablar con más amigos por el camino, o vamos a esperar una eternidad."

          "A mí no me parece mal", dice el padre de Leila. "Nos da una buena oportunidad para conocernos mejor. Por ejemplo, estoy seguro de que muchos de ustedes tendrán más de una pregunta que hacerle a nuestro amigo Kelrim, aquí presente. Al fin y al cabo, no es habitual encontrarse con un goblin mago blanco y mucho menos dentro de una ciudad humana."
