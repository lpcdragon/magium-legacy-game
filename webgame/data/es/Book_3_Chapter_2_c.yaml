  - name: b3_ch02c_ending
    routes:
      - condition: b3_ch2_goblins = 1
        texts:
          - source: scene_text
            paragraph: 32
            text: |-
              "¡Mi rey!", grita Breynan, e inclina entonces la cabeza con solemnidad.

              "¡Oh, no hace falta que interrumpan lo que estaban haciendo!", dice el hombre de la capa gris cuando todos nos volvemos hacia él. "Por favor, continúen por donde lo dejaron. Esperaré."

              Mientras todos nos limitamos a mirarlo, sin saber muy bien qué decir, Kate parece ir calmándose un poco y ahora se masajea la frente con ambas manos, intentando relajarse un poco.

              "¿Debo entender entonces que han terminado?", dice el hombre de la capa, alzando una ceja. "Bien. En ese caso, aprovecharé para disculparme por haberlos hecho esperar tanto. Por desgracia, estaba en medio de una reunión que no podía interrumpirse, así que no pude invitarlos a verme de inmediato. Dado que fui yo quien los hizo esperar, pensé que debía venir a escoltarlos personalmente como disculpa."
          - source: scene_text_2
            paragraph: 29
            text: |-
              "¿Es usted el rey del subsuelo?...", pregunta Daren.

              "En carne y hueso", dice el hombre de la capa gris.

              "Entonces, ¿adónde piensa escoltarnos?", dice Hadrik.

              "A mi sala del trono, por supuesto", dice el rey del subsuelo. "Síganme."

              Empieza entonces a dirigirse hacia el otro extremo de la sala, pero luego se detiene y se vuelve hacia nosotros por última vez.

              "Ah, y espero que no tengan ninguna cita programada justo después de nuestra reunión", dice el rey del subsuelo. "Va a llevar un buen rato."
