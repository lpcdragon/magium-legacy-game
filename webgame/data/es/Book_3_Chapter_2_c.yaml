              "Un momento...", dice Hadrik. "¿Me están diciendo que esa vieja chatarra de ojo verde que nos habló está realmente viva?"

              Albert suspira.

              "No viva en el verdadero sentido de la palabra", dice. "Solo es lo bastante inteligente como para tomar sus propias decisiones."

              "¿Pero eso es siquiera posible?...", dice Hadrik. "¿Hacer inteligentes los objetos solo manipulando su aura? Daren, tú eres encantador. ¿Habías oído algo así antes?"

              "Oye, yo ni siquiera sabía que los objetos tenían aura hasta que Arraka me lo dijo hace unos días", dice Daren. "Siempre había pensado que, cuando encantaba algo, lo que hacía era lanzar magia sobre el aire alrededor de los objetos. El aura de los objetos es tan distinta de la de los seres vivos que, sinceramente, no sé decir qué es posible y qué no."

              "¡Claro que es posible, idiotas!", suelta Arraka de pronto. "Es igual que cuando fabricas gólems. Si los gólems pueden ser lo bastante listos como para tomar decisiones por sí mismos, ¿por qué no también este 'Supervisor' o como demonios se llame? A mí esta 'inteligencia artificial' solo me suena a una versión más lista de esos gólems que suelen verse custodiando ruinas y atacando a cualquiera que se ponga a su alcance. No entiendo por qué habría que tratarlo como algo especial."
            condition: b3_ch2_infiltration = 3
