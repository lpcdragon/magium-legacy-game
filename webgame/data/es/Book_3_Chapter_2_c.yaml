  - name: b3_ch02c_seredium
    texts:
      - source: scene_text
        paragraph: 13
        text: |-
          "No hace falta que me lo agradezcas, Peter", dice el padre de Leila. "Yo también les estoy agradecido a todos ustedes por haber sido tan amables de darme un lugar donde vivir cuando no tenía adónde ir. Solo espero que todo el trabajo que estamos haciendo aquí no sea en vano. Me gustaría mucho poder vivir algún día con mi hija en la superficie de esta ciudad, sin tener que temer por nuestras vidas a diario."

          "Así de mal está la cosa en esta ciudad, ¿eh?...", dice Hadrik.

          "Sí", dice Albert. "El rey hace lo que le da la gana y, si miras mal a un guardia, puede que al día siguiente desaparezcas de tu casa sin que nadie vuelva a saber de ti jamás. Todos tenemos muchísima suerte de poder vivir en estas cavernas subterráneas, pero aquí abajo no hay espacio suficiente para acoger a todos los habitantes de Ollendor. Por no hablar de que la mayor parte del aire que respiramos proviene de estas plantas que ven creciendo en las paredes, y no hay bastantes como para proporcionar un entorno adecuado a tanta gente."

          "Nunca había visto plantas como estas", dice Daren, que sigue cojeando justo detrás de nosotros. "¿Cómo se llaman?"
      - source: scene_text_2
        paragraph: 7
        text: |-
          "Creo que nadie les ha puesto nombre todavía", dice el padre de Leila, "pero parecen ser un tipo especial de planta que se ha adaptado para sobrevivir solo con los pocos nutrientes que le proporcionan estas rocas de seredium y la tenue luz de estos cristales azules. También deben de tener raíces muy fuertes, porque desde luego no debe de ser fácil atravesar estas paredes de seredium."

          "¡Oh, acabo de acordarme de algo que olvidé decirles!", dice Albert. "Estas gruesas paredes y este techo de seredium hacen casi imposible contactar con nadie del exterior mediante un transceptor, así que si alguna vez quieren enviar un mensaje a alguien de la superficie, tendrán que ponerse en contacto con Barry o ir ustedes mismos a la sala del teletransportador, porque ese es el único lugar donde hay tan poco seredium en el techo que no bloquea por completo todas las ondas mágicas enviadas por el transceptor."

          "Ya que hablamos de ese teletransportador...", digo. "¿Será por casualidad el mismo teletransportador que nos trasladó a los participantes del torneo hasta Varathia?"

          "¡Oh, no, no, no!", dice Albert. "Desde luego que no. Este teletransportador apenas cubre el alcance de esta ciudad, y eso solo porque está colocado justo en el centro. No creo que haya más que unos pocos teletransportadores en toda esta isla capaces de enviarte a otro continente, y todos deben de estar fuertemente vigilados. Estoy bastante seguro, eso sí, de que en Ollendor no se encuentra ninguno de ese tipo."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch02c_banshees
  - name: b3_ch02c_banshees
    texts:
      - source: scene_text
        paragraph: 14
        text: |-
          "Eh... perdonen si estoy siendo demasiado directo", dice Peter mientras mira a Kate y a Illuna, "pero las vi pelear allí fuera y quería preguntarles una cosa. ¿Serían por casualidad... banshees?"

          "De nosotras dos, solo yo soy una banshee", dice Illuna. "Kate es una maga, pero no nació siéndolo. Se convirtió en una más tarde."

          "Ya veo...", dice Peter, sin saber muy bien qué más añadir.

          "Además, comparto este cuerpo con una niña llamada Flower, que también puede usar magia", dice Illuna. "Los propulsores de fuego que viste antes venían de ella, no de mí."

          "¿Compartes el cuerpo?...", dice Peter, en un ligero estado de shock. "¿Con tu anfitriona?"

          "¡Oooh!", dice Albert. "¡Conque por eso había dos nombres sobre tu cabeza cuando la hija del doctor Reidzek hizo las presentaciones! Entonces supongo que tu nombre era Illuna, ¿no?"

          "Sí, así es", dice Illuna.

          "Bueno, sean banshees o no, ¡estoy seguro de que nuestro rey estará más que encantado de tenerlas en nuestro bando!", dice Albert.

          "Cuando dices rey, te refieres a vuestro 'rey del subsuelo', ¿verdad?", dice Hadrik. "Porque esto empieza a ser un poco confuso."
      - source: scene_text_2
        paragraph: 8
        text: |-
          "Sí, me refería a eso", dice Albert cuando por fin llegamos al final del pasillo y entramos en una gran sala vacía, con alrededor de una docena de sillas alineadas cerca de la entrada y varias personas de pie en el centro del recinto. "En fin, esta es la sala de espera de la que hablábamos antes. Tomen asiento, por favor. Mientras tanto, Peter y yo iremos a avisar al rey de su llegada."

          Mientras hablamos, un hombre de unos cuarenta años, con una cicatriz en el ojo izquierdo y un aspecto curtido, empieza a acercarse despacio desde el otro extremo de la sala. Por su aura y por la señal de advertencia que estoy viendo encima de su cabeza, parece ser uno de los magos locales, aunque no sabría decir si es un encantador de armas o si se especializa en otra cosa. Lleva una espada colgada del cinturón y viste una armadura de cuero, pero también sostiene un bastón en la mano derecha, que supongo que usa para lanzar hechizos.

          "¡Eh, Albert!", dice el hombre cuando se acerca. "¿Estos son los forasteros de los que Barry nos habló antes?"

          "Sí, son ellos", dice Albert.

          "¿Ah, sí?", dice el hombre, con una expresión algo impresionada. "¿Así que todavía no han muerto después de enfrentarse ellos solos a los guardias reales? Nada mal... Nada mal en absoluto."

          "Solo se han topado con tres miembros de la guardia real", dice Albert. "El capitán, el mercenario y el gigante. Los demás deben de haber estado ocupados con alguna otra misión."
      - source: scene_3
        paragraph: 6
        text: '"¿Se toparon con el capitán?", dice sorprendido el hombre de la cicatriz, mientras nos mira. "Eso explicaría por qué tienen todos esa pinta de haber recibido una paliza. Díganme, ¿qué clase de locura se les metió en la cabeza para decidir infiltrarse ilegalmente en una de las ciudades mejor vigiladas de este continente?"'
