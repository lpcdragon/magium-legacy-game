          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch02c_transceiver
  - name: b3_ch02c_transceiver
    texts:
      - source: scene_text
        paragraph: 5
        text: |-
          "¡Ah!", dice el padre de Leila. "Ahora lo entiendo. No dejes que te afecte, amigo mío. ¡A mí me parece que 'Barry' es un nombre estupendo!"

          "¡Eh, gracias, Doc!", oímos que dice una voz desde el transceptor. "¿Pero a qué viene todo esto de repente?"

          "No estaba hablando contigo...", dice el padre de Leila, acercando de nuevo el transceptor a su boca. "Estaba hablando con otro Barry que... ¿sabes qué? ¡Da igual! ¿Crees que puedes teletransportarnos sin peligro? ¿Puedes saber dónde estamos a partir de la señal de este transceptor?"

          "Sí, recibo bien su señal", dice la voz del transceptor. "¿Los teletransporto ahora mismo?"

          "¡Sí!", dice el padre de Leila. "Pero asegúrate de transportarnos a todos. No querríamos que nadie se quedara atrás."

          "Entendido", dice la voz del transceptor. "¡Allá vamos!"
      - source: scene_text_2
        paragraph: 3
        text: |-
          En cuanto la voz deja de hablar, todos nos sentimos teletransportados fuera del callejón mientras una luz blanca empieza a envolvernos. Unos instantes después, nos encontramos de pie en medio de una cueva tenuemente iluminada, cuya única fuente de luz son unos cristales azules brillantes incrustados en las paredes. Al mirar a mi alrededor, me doy cuenta de que tanto las paredes como el techo, que se alza muy arriba, están hechos de seredium, y también hay unas plantas de aspecto peculiar creciendo dentro de esta cueva, que probablemente solo pueden encontrarse en lugares subterráneos como este.

          El hombre llamado Barry del que hablaba antes el padre de Leila está de pie detrás de una especie de escritorio metálico con varios botones, y detrás de él hay un aparato metálico enorme con muchas luces de distintos colores iluminándolo, que solo puedo suponer que es el teletransportador que se usó para traernos aquí. Ya había oído que la gente de Varathia tiene acceso a tecnología como esta y estoy bastante seguro de que fue con un aparato semejante como nos trajeron a este continente, pero esta es la primera vez que tengo la oportunidad de ver uno de cerca.

          "Gracias, Barry, por traernos aquí", le dice el padre de Leila al hombre que está detrás del escritorio.
      - source: scene_3
        paragraph: 3
        text: |-
          "De nada, Doc", dice el hombre que está detrás del escritorio. "¿Pero quién es toda esta gente? ¿Amigos tuyos?"

          "Esta es mi hija, Leila", dice el padre de Leila mientras la señala. "Creo que ya te hablé de ella en varias ocasiones. Y estos son los amigos de Leila, que la ayudaron a llegar hasta Ollendor. Por desgracia, aún no he tenido tiempo de aprenderme sus nombres. Leila, ¿serías tan amable de presentarnos?"

          Leila asiente y hace aparecer cada uno de nuestros nombres sobre nuestras cabezas, escritos con su habitual caligrafía azul.

          "¡Encantado de conocerlos a todos!", dice el padre de Leila. "Yo soy Reidzek, estos dos a mi lado son Peter y Albert, y ese hombre junto al escritorio, como ya saben, es Barry."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch02c_homeland
  - name: b3_ch02c_homeland
    texts:
      - source: scene_text
        paragraph: 6
        text: |-
          "¡Ah, ahora lo entiendo!", dice el hombre detrás del escritorio al mirar el nombre sobre mi cabeza. "Antes hablabas con este otro Barry por el transceptor. Me recuerda a cuando yo era amigo de otros dos Barry de pequeño y todos tuvimos que ponernos apodos para que la cosa no resultara demasiado confusa."

          "Sí, así lo hacíamos también en mi tierra", dice Hadrik. "Siempre que había otros por ahí, la gente se limitaba a llamarme 'enano'. A lo mejor podríamos encontrarle algún apodo a nuestro Barry también. Algo como Barry el improvisador. O el temerario."

          "Con que me llamen Barry me basta, muchas gracias", digo.

          "No seas así, 'temerario'", dice Hadrik con una sonrisa. "Seguro que podemos encontrar un apodo que te guste más. O podríamos añadir el nombre de tu padre al final del tuyo, como hacen a veces esos nobles del Continente Occidental con sus apellidos para sentirse más importantes. ¿Qué me dices?"

          "No hace falta obligarlo a usar un apodo si no quiere", dice el hombre detrás del escritorio. "Yo ya tengo uno viejo al que estoy acostumbrado, así que pueden llamarme así si creen que sería menos confuso. Antes me llamaban 'Nubarrón'."
      - source: scene_text_2
        paragraph: 4
        text: |-
          "Oye, no está nada mal ese apodo", dice Hadrik. "Muy bien, entonces, Nubarrón... ¿te importaría decirnos qué es exactamente este lugar? ¿Nos han teletransportado debajo de la ciudad o...?"

          "Eh... creo que sí...", dice el hombre detrás del escritorio. "Recuerdo que me hablaron de ello durante mi charla de orientación inicial, pero ha pasado mucho tiempo desde entonces. Doctor, a usted se lo explicaron hace relativamente poco. ¿Recuerda si el teletransportador está situado bajo Ollendor o no?"

          "Sí, creo que este dispositivo de teletransporte fue colocado en algún punto bajo el centro de la ciudad", dice el padre de Leila. "Pero estamos muy, muy abajo. Ese techo que ven allá arriba está formado por una capa enorme de seredium y, hasta donde yo sé, no hay otra forma de llegar a la superficie que usar este teletransportador. Estos túneles subterráneos se extienden durante millas y millas, eso sí, así que no es imposible que exista alguna salida que lleve arriba, pero esto es como un laberinto gigantesco, así que lo más probable es que uno se pierda y muera de hambre antes de encontrar la salida."
      - source: scene_3
        paragraph: 4
        text: |-
          "¿Cómo consiguieron encontrarnos?", escribe Leila. "¿Solo pasaban por allí o alguien les dijo que íbamos a estar en ese sitio?"

          "Los hemos estado siguiendo desde que entraron en la ciudad", dice Albert, uno de los dos guardaespaldas de Reidzek. "Nosotros dos, quiero decir. No el doctor Reidzek. El doctor nos dijo una vez que su hija tenía el pelo plateado, así que en cuanto los vimos a ti y a tu grupo, contactamos de inmediato con Barry para que pudiera avisar al doctor y teletransportarlo a la superficie. Cuando los vimos pelear contra los guardias reales, entramos un poco en pánico, pero conseguimos convencer al rey del subsuelo de que enviara a algunos de nuestros hombres a crear una distracción en el templo donde se celebraba la ceremonia, con la esperanza de que eso hiciera que los guardias reales dejaran de perseguirlos."

          "Un momento...", dice Daren. "Entonces, ¿fueron ustedes los que provocaron esa explosión?"

          "Algunos de nuestros compañeros, sí", dice Albert. "Sabíamos que el rey suele teletransportar a los guardias reales a su posición siempre que siente que su vida puede estar en peligro, así que supusimos que una explosión bastaría para asustarlo un poco."
