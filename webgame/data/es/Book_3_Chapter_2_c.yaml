          - source: scene_3
            paragraph: 18
            text: |-
              Eso es... Kate mató ella misma a uno de los amigos de Kelrim. Debe de estar reaccionando así por la culpa que siente después de ver cómo el goblin reaccionó a la muerte de sus amigos.

              "Kelrim...", dice Daren. "Yo no lo sabía... Yo..."

              "No, está bien", dice Kelrim mientras hace un esfuerzo enorme por recuperar la compostura, aunque, por el aspecto que tienen ahora sus ojos, cualquiera diría que lleva tres días sin dormir. "No te culpo. Al fin y al cabo, eran goblins... No tenías ningún motivo para pensártelo dos veces antes de matarlos. Quién sabe. Si hubieran sido otros goblins distintos, quizá te habrían matado a ti si no hubieras atacado primero... Sé que así funciona el mundo, pero aun así... yo... solo necesito unos momentos para recomponerme, eso es todo..."

              Oír esas palabras del goblin parece empujar a Kate todavía más al borde. Parpadea con rapidez y da la impresión de que está entrando en pánico.

              "Kate, ¿me oyes?", le pregunto colocándome frente a ella. "¡Kate!"

              Kate levanta la vista del suelo, pero no responde. Ahora me mira con la misma expresión de pánico que tenía hace un momento.

              Mientras sigo intentando hacer que Kate reaccione, Breynan se gira de repente y da un salto hacia atrás, sobresaltado, mirando ahora a un hombre de unos cincuenta y tantos que tiene delante, vestido con una cota de malla y una capa gris sobre los hombros.
