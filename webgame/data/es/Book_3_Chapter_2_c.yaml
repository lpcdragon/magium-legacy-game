  - name: b3_ch02c_artificial
    routes:
      - condition: b3_ch2_madness = 0
        texts:
          - source: scene_text
            paragraph: 15
            text: |-
              "Es porque oímos que por aquí sirven unos bagels buenísimos."

              "Si eso es así, me temo decirles que han viajado hasta aquí para nada", dice el hombre de la cicatriz. "Los bagels que sirven aquí son absolutamente horribles. No le hagan caso a nadie que diga lo contrario."

              "Qué verdadera lástima", digo. "Pero supongo que, ya que hemos venido hasta aquí, al menos podríamos quedarnos un rato y hacer algo de turismo. Si no, el viaje parecería un desperdicio."

              "Sin duda", dice el hombre. "Entonces díganme, forasteros... ya que ya se han topado con los guardias reales, ¿por casualidad tuvieron también el placer de conocer al Supervisor y a sus 'drouns'?"
          - source: scene_text_2
            paragraph: 10
            text: |-
              "¿El Supervisor?", digo. "Ah, ¿te refieres a esa bola metálica de ojos verdes que habla raro? Sí, nos topamos con él."

              "Puede que pienses que no es más que una bola metálica que habla raro, pero es muchísimo más que eso", dice el hombre. "Ese cabrón controla por completo todas esas bolas metálicas de ojos rojos que ves volando por la ciudad, y puede enviarlas a atacarte con decenas de hechizos elementales o incluso usarlas para espiarte. Puede que algunos de aquí no estén de acuerdo conmigo, pero desde mi punto de vista ese Supervisor es aún más peligroso que Billy Bob y la guardia real juntos."

              "Sigues hablando de él como si fuera una persona, pero el Supervisor es claramente una cosa", dice Albert. "No es más que un protocolo de inteligencia artificial que inventaron los antiguos hace mucho tiempo y que Billy Bob consiguió reparar hace poco. Por muy 'inteligente' que sea, eso no lo convierte en una persona."

              "¡Eso lo dices porque nunca lo has conocido!", dice el hombre de la cicatriz. "¡Te digo que ese cabrón solo está fingiendo! Puede que lo tomes por tonto, por cómo habla, pero juro que uno de estos días va a destronar al rey para coronarse nuevo gobernante de Ollendor, y entonces no podrán decir que no se los advertí."

              "Sí, sí, Breynan", dice Albert. "Ya nos lo has dicho. Nos lo has repetido mil veces. Así que quizá ya podríamos dejar este tema y centrarnos en cosas más importantes, ¿no te parece?"
            condition: b3_ch2_goblins = 3
