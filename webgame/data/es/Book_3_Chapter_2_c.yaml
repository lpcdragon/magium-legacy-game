scenes:
  - name: b3_ch02c_assassinate
    routes:
      - condition: b3_ch2_gontrok = 3
        texts:
          - source: scene_text
            paragraph: 2
            text: |-
              "Puede que alguien más también esté intentando asesinar al rey."

              "Eso sí plantea una buena pregunta...", dice Hadrik. "Si el rey ya estuviera muerto cuando lo encontremos, ¿no significaría eso que nuestro juramento de encantador con Melindra quedaría anulado?"

              "Anulado o no, mientras me ayuden a conseguir de él lo que quiero, seguiré considerando válido nuestro acuerdo", dice Melindra. "De eso pueden estar seguros."

              "No deberíamos quedarnos aquí mucho tiempo", dice Daren, mientras recoge la espada del suelo y luego empieza a avanzar cojeando lentamente hacia nosotros. "Aunque los guardias reales ya se hayan ido, los guardias normales de la ciudad podrían llegar en cualquier momento. Deberíamos buscar un lugar donde escondernos, descansar un rato y recuperarnos."

              "Joder...", dice Hadrik al ver lo poco que Daren es capaz de mantenerse en pie. "¿Qué te ha pasado? ¡Pareces alguien a quien le acaba de caer una casa encima!"

              "¿Y tú me lo dices?...", dice Daren cuando por fin logra llegar hasta nosotros. "¿Te has mirado al espejo últimamente? Tienes toda la cara hinchada y estás lleno de moratones. Te curaría, pero ahora mismo estoy demasiado debilitado para hacerlo. Apenas he conseguido lanzarme un hechizo de recuperación para volver a ponerme en pie."

              "Estoy de acuerdo en que deberíamos buscar refugio", dice Kate, echando un vistazo rápido a la plaza, ahora casi vacía, que nos rodea. "Cuanto más tiempo nos quedemos aquí, más vulnerables seremos. El problema es que no tengo ni idea de cómo podríamos encontrar un lugar seguro en medio de territorio enemigo..."
          - source: scene_text_2
            paragraph: 2
            text: |-
              "¡Quizá podamos serles de ayuda!", dice un hombre de unos cincuenta y tantos, con una barba gris recortada y una sonrisa amable en el rostro, mientras se abre paso lentamente hacia nosotros.

              El hombre parece llevar algún tipo de bata de laboratorio y sale de uno de los muchos callejones que desembocan en la plaza, seguido por dos jóvenes armados que probablemente rondan la mitad de la veintena.

              "Y usted quién sería, si no le importa que le preg--", empieza a decir Daren, pero se interrumpe al ver a Leila correr hacia el hombre que acaba de hablar.

              "¡Padre!", escribe Leila con letras muy grandes mientras va a abrazar al hombre de la bata de laboratorio.

              "Leila, querida mía... ¡te he echado muchísimo de menos!", dice el hombre mientras abraza a su hija con fuerza.

              "Padre, estos son mis amigos", escribe Leila en cuanto suelta a su padre. "Me ayudaron a salir de prisión y me escoltaron hasta aquí."

              "Sí, creo que ya me hago una idea general", dice el padre de Leila. "Les estoy muy agradecido a todos por haber cuidado de mi hija durante tanto tiempo, pero les recomiendo que dejemos las presentaciones para más tarde, cuando estemos a salvo y lejos de aquí."
          - source: scene_3
            paragraph: 2
            text: |-
              "¿Debemos entender que ya tienen preparada alguna ruta de escape para nosotros?", pregunta Kate.

              "¡Así es!", dice el padre de Leila. "Síganme, por favor."

              Nos cruzamos unas cuantas miradas y luego seguimos a Leila, a su padre y a sus dos guardaespaldas por el estrecho callejón del que habían salido. Entonces el padre de Leila saca un transceptor de su bata de laboratorio y empieza a hablar de inmediato por él.

              "Barry, ¿me oyes?", dice el padre de Leila.

              "Uf... ¡otra vez no!", digo, mientras Hadrik y Arraka empiezan a reírse de fondo.

              "¡Barry!", vuelve a gritar el padre de Leila por el transceptor, mientras las risas de Hadrik y Arraka van a más.

              "Esperen un momento", nos dice el padre de Leila. "Estoy teniendo algunos problemas para ponerme en contacto con uno de mis compañeros por culpa de la gruesa capa de seredium que... perdón, ¿pasa algo?"

              "¡No nos hagan caso!", dice Hadrik, intentando contener la risa. "Solo nos estamos riendo porque nuestro amigo de aquí también se llama Barry y no es la primera vez que nos encontramos con alguien que lleva su mismo nombre durante nuestros viajes."
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch02c_transceiver
      - condition: b3_ch2_gontrok <> 3
        texts:
