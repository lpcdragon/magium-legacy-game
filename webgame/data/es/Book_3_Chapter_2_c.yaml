          "En realidad colocamos esos explosivos hace mucho tiempo, por si acaso", dice Peter, la segunda persona que acompaña al padre de Leila. "Nunca se sabe cuándo va a hacer falta una distracción. Lo único que tenían que hacer nuestros compañeros era acercarse lo suficiente para activarlos, no entrar de verdad en el templo, así que no necesitaban enfrentarse directamente a ninguno de los guardias."

          "Antes mencionaron algo sobre un 'rey del subsuelo'", dice Illuna mientras mira a Albert. "¿Quién es exactamente esa persona?"

