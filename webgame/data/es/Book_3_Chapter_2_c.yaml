        texts:
          - source: scene_text
            paragraph: 31
            text: |-
              "La verdad es que no puedo decir que me importe demasiado, sinceramente."

              "Es comprensible", dice Kelrim. "A fin de cuentas, apenas me conocen... Sin embargo, si no es mucha molestia, había una pregunta que quería hacerles, ya que parece que llegaron a Ollendor hace poco."

              "Por supuesto", dice Daren. "¿Cuál es?"

              "¿Por casualidad no se habrán encontrado con un grupo de tres goblins de camino hacia aquí?", dice Kelrim. "Se suponía que iban a regresar a la ciudad de un día para otro y me aseguré de dejarles la contraseña de esta semana escrita en una roca junto a un río, no muy lejos de aquí, pero aún no he sabido nada de ellos."
          - source: scene_text_2
            paragraph: 24
            text: |-
              "Esos goblins que mencionas...", dice Daren, visiblemente afectado. "¿Llevaban por casualidad un equipo muy básico? ¿Como una armadura de cuero barata y unas armas muy gastadas? ¿Uno de ellos era bastante mayor que los otros dos?"

              "¡Sí, eran ellos!", dice Kelrim. "¿Se los han encontrado, entonces?"

              "Sí, pero...", dice Daren, esforzándose por encontrar las palabras. "Nosotros... los matamos. Los matamos a todos. Creíamos que estaban con Tyrath. Kelrim, lo siento muchísimo, nosotros no pensábamos que... es que..."

              Mientras Daren sigue intentando explicarse, Kelrim parece empezar a asimilar poco a poco el significado completo de lo que acaba de oír.

              "¿Mis amigos están... muertos?", dice Kelrim con un dolor inmenso en la voz, mirando ahora al frente como si hubiera olvidado que hay alguien más en la sala aparte de él.

              Las rodillas del goblin empiezan a temblarle y, al perder incluso la fuerza para mantenerse en pie, retrocede un paso y cae sentado en una de las sillas que tiene detrás, sin decir una palabra más. Mientras tanto, Kate parece estar atravesando su propia crisis. Está sudando muchísimo y mira fijamente al suelo, como si estuviera a punto de sufrir un derrumbe mental.
            condition: b3_ch2_goblins = 1
          - source: scene_text_2
            paragraph: 23
            text: |-
              "¿La escritura de esa roca decía 'pico de grifo' por casualidad?", digo.

              "No", dice Kelrim. "Quiero decir, sí, técnicamente eso es lo que pone, pero no debes leer la escritura tal cual. Se supone que tienes que reorganizar los símbolos usando un código secreto conocido solo por mis amigos y por mí y, si lo haces, la contraseña que obtienes es 'alas de gárgola'. Pero ¿cómo sabes lo que estaba escrito en la roca?"

              "Bueno...", digo. "Resulta que nuestra amiga Melindra de aquí se llevó esa roca para añadirla a su colección."

              "¿Qué?...", dice Melindra. "¡No, no había ninguna escritura en ninguna de mis rocas!"

              "Como puedes ver, Melindra no sabía lo de la escritura", digo. "Solo cogió la roca por accidente."

              "¡Oye!", dice Melindra. "¡He dicho que no había nada escrito en ninguna de las rocas! ¡No me ignores!"

              "Pero entonces... si no tienen la roca, ¡significa que mis amigos siguen atrapados fuera, sin poder entrar en la ciudad!", dice Kelrim.

              "Sí, están casi seguro fuera", digo. "Unos goblins intentaron llamarnos antes de que llegáramos aquí, pero nosotros los ignoramos y seguimos adelante."

              "Ya veo...", dice Kelrim. "En ese caso, más tarde tendré que salir a buscarlos."
            condition: b3_ch2_goblins = 0 AND b3_ch1_password = 1
          - source: scene_text_2
            paragraph: 25
            text: |-
              "La verdad es que sí nos cruzamos con unos goblins de camino hacia aquí", digo. "Querían hablar con nosotros sobre la contraseña necesaria para entrar en la ciudad, pero los ignoramos y seguimos nuestro camino."

              "Ya veo...", dice Kelrim. "Esos debían de ser mis amigos. No veo por qué otros goblins iban a merodear cerca de la ciudad. Más tarde tendré que salir a buscarlos."
            condition: b3_ch2_goblins = 0 AND b3_ch1_password = 0
