  - name: b3_ch02c_sundown
    routes:
      - condition: b3_ch2_alice = 0
        texts:
          - source: scene_text
            paragraph: 21
            text: |-
              Daren y Hadrik continúan un rato su conversación con Breynan después de que la niña salga de la sala con Albert y Peter. Durante ese tiempo, vemos a varias personas entrar y salir del recinto mientras se ocupan de sus asuntos diarios, pero hay una situación en particular que acaba llamándonos la atención.

              Justo cuando estamos terminando una de nuestras conversaciones, vemos a un hombre mayor siendo arrastrado a la sala contra su voluntad por dos de sus compañeros, mientras les suplica desesperadamente que lo suelten. Al cabo de un rato, los tres se detienen frente a un hombre que guarda una puerta de hierro con una cantidad impresionante de cerraduras y la palabra 'Cuarentena' escrita en grandes letras rojas justo encima.
          - source: scene_text_2
            paragraph: 15
            text: |-
              "Tenemos otro para ti, Desmond", le dice al guardia uno de los dos hombres más jóvenes. "Abre la puerta."

              "Ahora mismo", dice Desmond, mientras empieza a abrir las cerraduras una por una.

              "Por favor...", dice el hombre mayor. "Todavía me quedan dos horas. ¡Al menos dejen que me despida de mi hijo!"

              "Tu hijo está fuera, en una misión, viejo", dice el joven que había hablado antes. "No volverá hasta el atardecer. No vas a volver a verlo."

              "¡Pero todavía me quedan dos horas!", dice el hombre mayor. "¡No pueden hacerme esto!"

              "No se lo pongas más difícil al resto, Jack", dice el otro joven. "Tu vida ya se acabó. Lo sabes. ¿Qué diferencia van a suponer dos horas más? Deja de llorar y compórtate como un hombre, ¿quieres? No es que estemos haciendo esto porque nos guste."

              "Muy bien, métanlo dentro", dice el guardia al abrir la puerta.
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch02c_quarantine
      - condition: b3_ch2_alice = 1 AND b3_ch2_madness = 2
        texts:
          - source: scene_text
            paragraph: 20
            text: |-
              "¡Eh, Alice!", grito. "¡No te preocupes, vamos a encontrar a tu familia!"

              Al oír lo que digo, la niña vuelve de repente la cabeza hacia mí con un destello de esperanza en sus ojos cansados.

              "¿De verdad lo dice?...", me grita la niña de vuelta, con cierta vacilación en la voz.

              "¡Claro!", digo a voz en grito. "¡Puedes contar con nosotros! Estoy seguro de que se los devolveremos enseguida."

              La niña da un respingo y las lágrimas de alegría empiezan a correrle por el rostro.

              "¡Gracias!", grita con la voz temblorosa. "¡Muchísimas gracias! Prometo que haré cualquier cosa para compensárselo. Lavaré sus platos, y... y les cocinaré, y fregaré sus suelos, y..."

              "¡No pasa nada!", le digo. "No hace falta que hagas ninguna de esas cosas. Ve a descansar. Tienes muy mala cara."

              La niña me asiente con una débil sonrisa mientras se seca las lágrimas y luego se marcha detrás de Albert y Peter hasta que los tres dejan de verse.
          - source: scene_text_2
            paragraph: 13
            text: |-
              "Barry, entiendo lo que intentabas hacer, pero no deberías darles falsas esperanzas a los demás así como así...", dice Daren. "Ni siquiera sabemos dónde está su familia o si sigue con vida. Por no hablar de que hacer lo que has prometido significaría desviarnos bastante del objetivo con el que vinimos originalmente aquí..."

              "¿Seguro?", digo. "Porque, tal como yo lo veo, una vez que matemos al rey, todas sus fuerzas quedarán desorganizadas y nos resultará fácil infiltrarnos en una de las torres. Además, si colocamos a uno de nuestros aliados como nuevo rey, podremos ordenar a los guardias que nos digan qué hicieron con la madre. Si me preguntas a mí, ayudar a la niña encaja perfectamente con lo que vinimos a hacer."

              "Estás dando por hecho muchas cosas, Barry...", dice Daren. "Pero supongo que, en cierto modo, tienes razón. Como mínimo, deberíamos poder hacer más por esa niña de lo que han hecho los rebeldes hasta ahora, aunque nos limitemos a nuestro plan inicial. Supongo que solo podremos ver cómo se desarrolla todo al final."

              Justo cuando estamos a punto de terminar nuestra conversación, vemos a un hombre mayor siendo arrastrado a la sala contra su voluntad por dos de sus compañeros, mientras les suplica desesperadamente que lo suelten. Al cabo de un rato, los tres se detienen frente a un hombre que guarda una puerta de hierro con una cantidad impresionante de cerraduras y la palabra 'Cuarentena' escrita en grandes letras rojas justo encima.
          - source: scene_3
            paragraph: 11
            text: |-
              "Tenemos otro para ti, Desmond", le dice al guardia uno de los dos hombres más jóvenes. "Abre la puerta."

              "Ahora mismo", dice Desmond, mientras empieza a abrir las cerraduras una por una.

              "Por favor...", dice el hombre mayor. "Todavía me quedan dos horas. ¡Al menos dejen que me despida de mi hijo!"

              "Tu hijo está fuera, en una misión, viejo", dice el joven que había hablado antes. "No volverá hasta el atardecer. No vas a volver a verlo."

              "¡Pero todavía me quedan dos horas!", dice el hombre mayor. "¡No pueden hacerme esto!"

              "No se lo pongas más difícil al resto, Jack", dice el otro joven. "Tu vida ya se acabó. Lo sabes. ¿Qué diferencia van a suponer dos horas más? Deja de llorar y compórtate como un hombre, ¿quieres? No es que estemos haciendo esto porque nos guste."

              "Muy bien, métanlo dentro", dice el guardia al abrir la puerta.
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch02c_quarantine
