            text: |-
              "Solo vinimos a comerciar. Todo es un gran malentendido."

              "Oh, sí, eso tiene muchísimo sentido...", dice el hombre de la cicatriz. "Quiero decir, ¿quién no se apuntaría a un torneo mortal solo para venir a comerciar con un reino del que nunca ha oído hablar en su vida?..."

