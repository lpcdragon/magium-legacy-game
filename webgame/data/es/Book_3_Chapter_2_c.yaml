            paragraph: 30
            text: |-
              "Ahora que lo menciona, sí me da un poco de curiosidad saber cómo acabó un goblin en una ciudad humana."

              "No es para tanto, la verdad", dice Kelrim. "Hace un tiempo, mi amigo y yo oímos que la ciudad de Ollendor aceptaba goblins dentro de sus fronteras, así que decidimos venir aquí a probar suerte. Después de vivir aquí durante un tiempo, mi amigo decidió salir en busca de dos viejos amigos nuestros a los que habíamos dejado atrás, con la esperanza de convencerlos de que vinieran también. Mientras tanto, han ocurrido muchas cosas y al final acabé uniéndome a los rebeldes, como pueden ver."

              Hace una pausa.

              "Hablando de mis amigos...", continúa Kelrim. "¿Por casualidad no se habrán encontrado con un grupo de tres goblins de camino hacia aquí? Se suponía que iban a regresar a la ciudad de un día para otro y me aseguré de dejarles la contraseña de esta semana escrita en una roca junto a un río, no muy lejos de aquí, pero aún no he sabido nada de ellos."
