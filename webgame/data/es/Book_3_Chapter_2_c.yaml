    routes:
      - condition: b3_ch2_question = 0
        texts:
          - source: scene_text
            paragraph: 29
            text: |-
              "Debo admitir que sí me preguntaba cómo había aprendido Kelrim magia blanca."

              "La aprendí sobre todo de los libros", dice Kelrim. "Los goblins no suelen practicar magia curativa, así que no tuve a nadie que me enseñara. El grimorio estándar de mago blanco me ayudó mucho al principio, pero también he leído muchos otros libros y, con el tiempo, empecé a experimentar, haciendo pequeñas modificaciones en ciertos hechizos para ver qué resultados daban. Por desgracia, no soy más que un lanzador de hechizos novato, así que muchos de esos experimentos acabaron en fracaso."

              "Si has conseguido modificar algún hechizo con éxito, yo diría que estás muy lejos de ser un mago novato", dice Illuna. "La mayoría de los magos principiantes rara vez se molestan en lanzar algo más que los hechizos más básicos y, desde luego, no se arriesgarían a modificarlos."

              "¿No lo harían?...", pregunta Kelrim, sorprendido. "Yo siempre había supuesto que así era como todo el mundo empezaba a aprender a usar la magia. En fin, yo también quería hacerles una pregunta. Ustedes parecen haber llegado a Ollendor hace poco. ¿Por casualidad no se habrán encontrado con un grupo de tres goblins de camino hacia aquí? Se suponía que iban a regresar a la ciudad de un día para otro y me aseguré de dejarles la contraseña de esta semana escrita en una roca junto a un río, no muy lejos de aquí, pero aún no he sabido nada de ellos."
          - source: scene_text_2
            paragraph: 24
            text: |-
              "Esos goblins que mencionas...", dice Daren, visiblemente afectado. "¿Llevaban por casualidad un equipo muy básico? ¿Como una armadura de cuero barata y unas armas muy gastadas? ¿Uno de ellos era bastante mayor que los otros dos?"

              "¡Sí, eran ellos!", dice Kelrim. "¿Se los han encontrado, entonces?"

              "Sí, pero...", dice Daren, esforzándose por encontrar las palabras. "Nosotros... los matamos. Los matamos a todos. Creíamos que estaban con Tyrath. Kelrim, lo siento muchísimo, nosotros no pensábamos que... es que..."

              Mientras Daren sigue intentando explicarse, Kelrim parece empezar a asimilar poco a poco el significado completo de lo que acaba de oír.

              "¿Mis amigos están... muertos?", dice Kelrim con un dolor inmenso en la voz, mirando ahora al frente como si hubiera olvidado que hay alguien más en la sala aparte de él.

              Las rodillas del goblin empiezan a temblarle y, al perder incluso la fuerza para mantenerse en pie, retrocede un paso y cae sentado en una de las sillas que tiene detrás, sin decir una palabra más. Mientras tanto, Kate parece estar atravesando su propia crisis. Está sudando muchísimo y mira fijamente al suelo, como si estuviera a punto de sufrir un derrumbe mental.
            condition: b3_ch2_goblins = 1
          - source: scene_text_2
            paragraph: 23
            text: |-
              "¿La escritura de esa roca decía 'pico de grifo' por casualidad?", digo.

              "No", dice Kelrim. "Quiero decir, sí, técnicamente eso es lo que pone, pero no debes leer la escritura tal cual. Se supone que tienes que reorganizar los símbolos usando un código secreto conocido solo por mis amigos y por mí y, si lo haces, la contraseña que obtienes es 'alas de gárgola'. Pero ¿cómo sabes lo que estaba escrito en la roca?"

              "Bueno...", digo. "Resulta que nuestra amiga Melindra de aquí se llevó esa roca para añadirla a su colección."

              "¿Qué?...", dice Melindra. "¡No, no había ninguna escritura en ninguna de mis rocas!"

              "Como puedes ver, Melindra no sabía lo de la escritura", digo. "Solo cogió la roca por accidente."

              "¡Oye!", dice Melindra. "¡He dicho que no había nada escrito en ninguna de las rocas! ¡No me ignores!"

              "Pero entonces... si no tienen la roca, ¡significa que mis amigos siguen atrapados fuera, sin poder entrar en la ciudad!", dice Kelrim.

              "Sí, están casi seguro fuera", digo. "Unos goblins intentaron llamarnos antes de que llegáramos aquí, pero nosotros los ignoramos y seguimos adelante."

              "Ya veo...", dice Kelrim. "En ese caso, más tarde tendré que salir a buscarlos."
            condition: b3_ch2_goblins = 0 AND b3_ch1_password = 1
          - source: scene_text_2
            paragraph: 25
            text: |-
              "La verdad es que sí nos cruzamos con unos goblins de camino hacia aquí", digo. "Querían hablar con nosotros sobre la contraseña necesaria para entrar en la ciudad, pero los ignoramos y seguimos nuestro camino."

              "Ya veo...", dice Kelrim. "Esos debían de ser mis amigos. No veo por qué otros goblins iban a merodear cerca de la ciudad. Más tarde tendré que salir a buscarlos."
            condition: b3_ch2_goblins = 0 AND b3_ch1_password = 0
          - source: scene_text_2
            paragraph: 26
            text: |-
              "La verdad es que sí nos cruzamos con unos goblins de camino hacia aquí", digo. "Tuvimos una pequeña charla con ellos precisamente sobre esa roca de la que hablabas. Al parecer no la encontraron junto al río y creían que éramos nosotros quienes la habíamos cogido. En cualquier caso, lo más probable es que todavía sigan esperando en el bosque a las afueras de la aldea, ya que dudo que hayan podido entrar en la ciudad por algún otro medio."

              "Ya veo...", dice Kelrim. "En ese caso, más tarde tendré que salir a buscarlos."
            condition: b3_ch2_goblins = 2
          - source: scene_text_2
            paragraph: 27
            text: |-
              "La verdad es que sí nos cruzamos con unos goblins de camino hacia aquí", digo. "Tuvimos una pequeña charla con ellos precisamente sobre esa roca de la que hablabas. Resultó que la habíamos cogido por accidente, así que intercambiamos la contraseña que había escrita en ella a cambio de que nos dijeran que debíamos guiñarle el ojo tres veces al guardia para que nos dejara pasar. Estoy seguro de que tus amigos ya deben de haber entrado en la ciudad a estas alturas."

              "Oh, cielos...", dice Kelrim. "En ese caso, ya deben de estar esperándome en nuestro punto de encuentro. Tendré que ir allí en cuanto pueda."
            condition: b3_ch2_goblins = 3
          - source: scene_text_2
            paragraph: 28
            text: |-
              "La verdad es que sí nos cruzamos con unos goblins de camino hacia aquí", digo. "Tuvimos una pequeña charla con ellos precisamente sobre esa roca de la que hablabas. Resultó que la habíamos cogido por accidente, así que intercambiamos la contraseña que había escrita en ella a cambio de que nos dijeran que debíamos guiñarle el ojo tres veces al guardia para que nos dejara pasar. Tus amigos entraron en la ciudad poco antes que nosotros, así que ahora mismo deberían de estar por algún lugar de la superficie."

              "Oh, cielos...", dice Kelrim. "En ese caso, ya deben de estar esperándome en nuestro punto de encuentro. Tendré que ir allí en cuanto pueda."
            condition: b3_ch2_goblins = 4
          - source: scene_3
            paragraph: 18
            text: |-
              Eso es... Kate mató ella misma a uno de los amigos de Kelrim. Debe de estar reaccionando así por la culpa que siente después de ver cómo el goblin reaccionó a la muerte de sus amigos.

              "Kelrim...", dice Daren. "Yo no lo sabía... Yo..."

              "No, está bien", dice Kelrim mientras hace un esfuerzo enorme por recuperar la compostura, aunque, por el aspecto que tienen ahora sus ojos, cualquiera diría que lleva tres días sin dormir. "No te culpo. Al fin y al cabo, eran goblins... No tenías ningún motivo para pensártelo dos veces antes de matarlos. Quién sabe. Si hubieran sido otros goblins distintos, quizá te habrían matado a ti si no hubieras atacado primero... Sé que así funciona el mundo, pero aun así... yo... solo necesito unos momentos para recomponerme, eso es todo..."

              Oír esas palabras del goblin parece empujar a Kate todavía más al borde. Parpadea con rapidez y da la impresión de que está entrando en pánico.

              "Kate, ¿me oyes?", le pregunto colocándome frente a ella. "¡Kate!"

              Kate levanta la vista del suelo, pero no responde. Ahora me mira con la misma expresión de pánico que tenía hace un momento.

              Mientras sigo intentando hacer que Kate reaccione, Breynan se gira de repente y da un salto hacia atrás, sobresaltado, mirando ahora a un hombre de unos cincuenta y tantos que tiene delante, vestido con una cota de malla y una capa gris sobre los hombros.
