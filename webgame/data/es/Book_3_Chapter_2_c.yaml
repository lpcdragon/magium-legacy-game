  - name: b3_ch02c_safe
    texts:
      - source: scene_text
        paragraph: 10
        text: |-
          "¿Qué pasó con sus amigos, los que provocaron la explosión? ¿Están todos a salvo?"

          "Contactamos con ellos antes de salir a buscarlos y todos consiguieron huir a tiempo", dice Peter, la segunda persona que acompaña al padre de Leila. "Probablemente se reúnan con nosotros aquí dentro de poco, cuando terminen con los asuntos que tenían en la superficie."

          "Antes mencionaron algo sobre un 'rey del subsuelo'", dice Illuna mientras mira a Albert. "¿Quién es exactamente esa persona?"

          "El rey del subsuelo es el líder de esta pequeña sociedad subterránea y un patrocinador muy generoso de nuestro movimiento de resistencia", dice Albert. "Tuvo la amabilidad de proporcionarnos una base de operaciones aquí, en estas cavernas subterráneas, y también nos dio muchas herramientas útiles que han sido de gran ayuda en nuestros esfuerzos por socavar la tiranía del rey loco de Ollendor. A cambio de sus inversiones, el rey del subsuelo nos ha pedido que no emprendamos ninguna acción sin su consentimiento explícito, y también aceptamos ir en ocasiones a misiones solicitadas personalmente por él, aunque no siempre estén relacionadas de forma directa con derrocar al rey de la superficie."

          "Entonces, lo que intentan es iniciar una rebelión, ¿no?", dice Hadrik.
      - source: scene_text_2
        paragraph: 6
        text: |-
          "No exactamente", dice Albert. "Preferiríamos evitar una guerra civil en la medida de lo posible. No queremos que la sangre de nuestros hermanos manche la tierra de esta ciudad. Lo único que queremos es deshacernos de la cúpula corrupta que lleva años asolando este reino, y preferiríamos hacerlo de una manera que requiera la menor cantidad de sangre posible. Cuando le dijimos al rey del subsuelo que estaban peleando contra los guardias reales, se interesó por su grupo, y por eso decidió ayudarlos. Dijo que le gustaría conocerlos cuanto antes, con la esperanza de convencerlos de unirse a nuestra causa o al menos de formar una alianza temporal con nosotros. En fin, no deberíamos quedarnos aquí parados. Nuestra base de operaciones está un poco más adelante, por estos pasillos. Sígannos y los llevaremos a nuestra sala de espera."

          "¡Hasta luego, Barry!", dice el padre de Leila mientras todos empezamos a seguir a Albert por uno de los túneles. "Ah, perdón, quería decir Nubarrón. Voy a tardar un poco en acostumbrarme a ese apodo."

          "¡Hasta luego, Doc!", dice el hombre que está detrás del escritorio. "¡Me alegra muchísimo que por fin haya encontrado a su hija!"

          "Padre, ¿por qué esta gente te llama 'doctor'?", escribe Leila. "¿Has empezado a ejercer la medicina desde que llegaste aquí?"

          "Creo que es sobre todo por esta bata blanca de laboratorio que suelo llevar para no mancharme la ropa de aceite cuando trabajo en mis aparatos", dice el padre de Leila. "Se parece a las batas que suelen llevar los médicos en los hospitales y la gente de aquí necesitaba ponerme un apodo, porque mi nombre real es bastante difícil de pronunciar."
      - source: scene_3
        paragraph: 5
        text: '"Es más que la bata, doctor", dice Peter. "La primera vez que lo conocimos, estuvo a punto de acabar arrestado por los guardias de la ciudad porque estaba prestando asistencia médica a uno de nuestros compañeros, que había resultado gravemente herido durante una de sus misiones. Si usted no hubiera estado allí para ayudarlo, podría haber muerto desangrado antes de que llegáramos hasta él. También nos ha ayudado a reparar algunos de nuestros dispositivos de curación, que han servido para salvar muchas vidas en los últimos días. Todos estamos enormemente agradecidos por el trabajo que ha estado haciendo desde que llegó aquí."'
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch02c_seredium
