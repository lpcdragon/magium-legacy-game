        text: |-
          "Daren, ¿puedes oírme? ¡Despierta!"

          No hay respuesta. ¿Qué clase de hechizo usó este tipo? Estoy bastante seguro de que Daren tiene algunos hechizos realmente fuertes que lo protegen en todo momento. Los hechizos de sueño estándar no deberían ser más que un inconveniente moderado para él.

          Mientras intento despertar a Daren, de repente oigo una voz muy familiar que viene de la dirección en la que desapareció Eiden.

          "¡Stillwater!"

          Esa es la voz de Dave el Degollador. No hay duda. Reconocería esa voz ronca y ese acento de matón en cualquier parte.

          Me doy la vuelta hacia donde venía la voz y veo que, aparte de una cara conocida, también hay una docena de otras caras desconocidas alineadas frente a mí.

          Parece que Dave se las ha arreglado para reunir un equipo en el poco tiempo que estuvimos separados. Lo triste es que Dave parece un caballero bien educado comparado con sus nuevos colegas. Algunos de ellos parecen y huelen como si no se hubieran lavado en meses. Supongo que Dios los cría y ellos se juntan.

          "Te he estado buscando, Stillwater", dice Dave. "He estado siguiendo tus huellas desde ayer. Te dije que volveríamos a vernos. Nadie puede huir ni esconderse de Dave el Degollador".
