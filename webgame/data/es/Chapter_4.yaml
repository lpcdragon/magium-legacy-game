            paragraph: 267
            text: |-
              Cojo otra piedra del suelo, pero esta vez no pongo toda mi fuerza en el lanzamiento para evitar matar a Dave. Como la piedra iba más lenta esta vez, el degollador tuvo tiempo de bloquearla con dos de sus dagas voladoras.

              Tose un poco más de sangre.

              "Tuviste suerte, Stillwater. Me pillaste desprevenido. No volverá a ocurrir".

              Dave el Degollador saca entonces un pergamino de teletransportación de su bolsillo y lo utiliza rápidamente para escabullirse, ante la sorpresa y consternación de sus leales seguidores.

              ¿De dónde demonios ha sacado ese desgraciado un pergamino de teletransportación? Llevo meses buscando uno y no he encontrado nada. Por no mencionar que incluso uno solo de esos pergaminos cuesta una fortuna.

              "¡MALDITA SEA, Barry!", dice Daren. "Desde luego no te andas con chiquitas".

              "En realidad, sí que lo hice. Y me costó caro. Pero aún no he terminado".

              Cojo unos guijarros del suelo y uso toda la fuerza de mi brazo derecho para lanzarlos contra los secuaces de Dave. Siete de ellos resultaron gravemente heridos y ahora gritan asustados.

              "¡¿Viste eso?!", dice uno de ellos. "Todo lo que hizo fue tirar unos guijarros que recogió del suelo".

              "También ha vencido al jefe. ¡Salgamos de aquí!"
