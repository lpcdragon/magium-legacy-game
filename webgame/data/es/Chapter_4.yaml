  - name: ch4_kate_meets_eiden
    texts:
      - source: scene_text
        paragraph: 240
        text: |-
          Se oye un lento aplauso que viene de los árboles. Al mirar para ver qué hace el ruido, veo a Eiden, apoyado en un pino con su sonrisa habitual en la cara.

          "Magnífico", dice. "Esos matones nunca tuvieron oportunidad. ¡No esperaba menos de una superviviente del Faro de Esperanza!"

          "¡Tú!", grita Daren, y corre hacia el Stillwater.

          Una vez más, con un gesto de sus manos, Eiden pone a dormir a Daren en medio de su carrera, lo que le hace caer al suelo y deslizarse sobre su armadura unos metros antes de detenerse.

          "En serio, esto se está volviendo ridículo", dice Eiden.

          Kate mira al Stillwater con recelo.

          "¿Por qué no lo hiciste?", le pregunta.

          "¿Perdón?"

          "¿Por qué no lo mataste? Si fuiste capaz de dormirlo tan fácilmente, podrías haber acabado con él mucho más fácilmente".

          "¡Qué perspicaz! Bueno, resulta que hice un trato con Barry que me prohíbe matarlos a ninguno de ustedes. ¡A menos que no cumpla su parte del trato, por supuesto!"

          "¿Un trato? ¿Con Barry? ¿Qué podría haberte ofrecido a cambio de nuestras vidas?"
      - source: scene_text_2
        paragraph: 16
        text: |-
          "Se ofreció a entregar un mensaje".

          "¿Un mensaje?"

          Kate me mira antes de continuar.

          "No hay forma de que nos hayas perdonado la vida por un solo mensaje. ¿Qué es lo que realmente buscas?"

          La sonrisa de Eiden vuelve a ensancharse.

          "De verdad. ¿Cuándo fue la última vez que obtuviste una respuesta honesta haciendo una pregunta así?"

          "Nunca. Así que te preguntaré esto en su lugar. ¿Cómo sabes lo del Faro de Esperanza?"

          "¿Es esta realmente la pregunta que deberías hacer? ¿No debería ser la pregunta aquí por qué tus amigos no saben nada del Faro de Esperanza?"

          Kate vuelve a mirarme. Puedo ver la duda en sus ojos.

          "Es complicado", me dice finalmente.

          "En efecto, lo es", dice Eiden, y se vuelve hacia mí. "Bueno, entonces. Estaré esperando a que entregues mi mensaje. No me falles, Barry".

          "Espera", le grita Kate, pero Eiden no le hace caso y desaparece en la oscuridad del bosque.
