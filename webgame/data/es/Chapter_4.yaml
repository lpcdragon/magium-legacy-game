              "Aún no he terminado".

              Cojo dos piedras más del suelo y se las lanzo a otros dos matones. A ambos se les rompe el cráneo y los hombres caen al suelo, sin vida.

              Los secuaces restantes de Dave el Degollador gritan con todas sus fuerzas y corren hacia el bosque. Lanzo otra piedra en su dirección general, pero no me molesto en perseguirlos. Apuntar mis disparos sería mucho más difícil en el bosque, debido a todos los árboles que se interponen en mi camino. Y además, con el miedo que tenían en los ojos, dudo que vuelvan a molestarnos más.

              Se oye un lento aplauso que viene de los árboles. Al mirar para ver qué hace el ruido, veo a Eiden, apoyado en un pino con su sonrisa habitual en la cara.

              "Impresionante, Barry", dice. "¡No se ven a menudo potenciadores de estadísticas usados tan eficientemente hoy en día!"

              ¡Tú!", grita Daren, y corre hacia el Stillwater.
          - source: scene_text_2
            paragraph: 25
            text: |-
              Una vez más, con un gesto de sus manos, Eiden pone a dormir a Daren en medio de su carrera, lo que le hace caer al suelo y deslizarse sobre su armadura unos metros antes de detenerse.

              "En serio, esto se está volviendo ridículo", dice Eiden.

              "¿Tú también sabes lo de los potenciadores de estadísticas?", le pregunto al Stillwater.

              "¡Sí! Y lo que también sé es por qué ese potenciador de estadísticas funciona tan bien contigo, en concreto. ¿Te has preguntado alguna vez por qué es así, Barry?"

              Tiene razón. El dispositivo de estadísticas ha funcionado por encima de todas mis expectativas desde que llegué aquí. No le di muchas vueltas porque supuse que mis cálculos debían de estar equivocados. Pero incluso con toda la energía que está acumulando, algo está claramente fuera de lugar.

              "Lo he hecho. Pero ¿no supongo que me vas a dar la respuesta así como así?"

              "Por supuesto que no. ¿Dónde estaría la diversión en eso? ¡Pero no te inquietes! Mientras permanezcas en este continente, obtendrás tus respuestas tarde o temprano".

              Él sonríe.

              "Bueno, entonces. Estaré esperando a que entregues mi mensaje. No me falles, Barry".

              Con estas últimas palabras me da la espalda y desaparece en la oscuridad del bosque.
