  - name: ch4_beacon
    texts:
      - source: scene_text
        paragraph: 228
        text: |-
          "¿Qué es el Faro de Esperanza?"

          "¿Quieres decir que ella no te lo dijo? Bueno, entonces no arruinaré la sorpresa. ¿Por qué no se lo preguntas tú mismo cuando despierte, mi amigo Stillwater?"

          "Voy a detenerte ahí mismo, Eiden", interrumpe Daren. "No creo que sea necesario seguir con esta farsa por más tiempo. Tú y yo sabemos que Barry es un humano común y no un Stillwater".

          "¿Qué, les dijiste la verdad?", me pregunta Eiden. "Honestamente, no pensé que lograras llegar tan lejos sin fanfarronear. ¡Debo admitir que estoy impresionado!"

          "Este farol del Stillwater no te va a llevar muy lejos, lo sabes", continúa Daren. "Especialmente siendo ciego. ¿Quién ha oído hablar de un Stillwater ciego?"

          "¿Hmm? ¿Qué te hace pensar que soy ciego?"

          "Has mantenido los ojos cerrados desde la primera vez que te vimos".

          "¡Oh, esto! En realidad puedo ver perfectamente. Cerré los ojos por primera vez hace mucho tiempo, cuando me cansé de ver la fealdad de la humanidad. Hoy en día, casi solo abro los ojos en zonas completamente despobladas. Mi sentido mágico es un sustituto más que adecuado para mi vista. Puedo sentir el aura mágica de cada criatura y de cada objeto, lo que me indica dónde están, y obtengo el beneficio adicional de no ser víctima de hechizos de ilusión. No necesito un sentido extra que me recuerde constantemente por qué desprecio tanto a los humanos".

          "¿No eres un poco joven para preocuparte por los pecados de la humanidad? ¿O es esto algún tipo de fase por la que estás pasando para que tus padres se fijen en ti?"
      - source: scene_text_2
        paragraph: 8
        text: |-
          Eiden sonríe.

          "Tú mejor que nadie deberías saberlo, sanador con armadura. Seguramente habrás visto todo el sufrimiento e injusticia del mundo a lo largo de tus viajes. La angustia. La agonía. Los has visto todos, una y otra vez. Dime, sanador. Has pasado toda una vida intentando enmendar los errores que otros han cometido. ¿Sientes que el mundo se ha convertido en un lugar mejor gracias a ello?"

          "Solo porque quede mucha maldad en el mundo no significa que no haya un bien por el que valga la pena luchar. Mientras no me rinda, encontraré el camino".

          La sonrisa de Eiden se ensancha, pero sus ojos permanecen cerrados.

          "¿Oh? Así que eres un idealista, entonces. Pero dime, héroe, ¿qué pasa cuando tus puros ideales chocan con la fría y dura realidad?"

          De repente, Daren cae de bruces sobre su pecho, y puedo notar que está siendo presionado contra el suelo por una fuerza muy poderosa.

          "¿Qué sucede cuando te encuentras con una fuerza tan grande que simplemente te aplasta contra el suelo, como si fueras un insecto?"

          La fuerza que empujaba a Daren contra el suelo se intensificó tanto que hizo un gran agujero con la forma de Daren en el duro suelo rocoso bajo él. Ya no pudo contener más el dolor y empezó a gritar de agonía.
      - source: scene_3
        paragraph: 2
        text: |-
          Me doy cuenta de que mis manos se han enfriado y todo mi cuerpo tiembla. Necesito recomponerme. Si arruino esto, todos seremos masacrados.

          "¡Suéltalo!", le digo a Eiden, intentando sonar lo más seguro posible.

          "¿Quieres salvar a tu amigo, Barry? ¿Qué te parece si hacemos un trato justo? Tu vida por la suya. Prometo dejar en paz a tu amigo si das tu vida por él. ¿Qué me dices?"
    choices:
      - position: 1
        text: Aceptar el trato
        effects:
          - set:
              current_scene: ch4_accept
      - position: 2
        text: Proponer un trato diferente
        effects:
          - set:
              current_scene: ch4_propose
  - name: ch4_survivor
    texts:
      - source: scene_text
