  - name: ch4_agree
    texts:
      - source: scene_text
        paragraph: 239
        text: |-
          "Lo siento, Kate, pero estoy con Daren en esta ocasión. Que no haya más derramamiento de sangre hoy".

          "¡Se han vuelto locos los dos! Escúchense. ¡Se están poniendo del lado de un matón!"

          "No nos estamos poniendo del lado de nadie", dice Daren. "Si los dioses consideran oportuno liberarlo, entonces es que ha aprendido la lección. De lo contrario, se quedará aquí y se pudrirá".

          Dave el Degollador estaba esperando el momento oportuno en que ninguno de los dos lo mirábamos. Aprovecha la oportunidad y saca rápidamente de su bolsillo un pergamino de teletransportación. Antes de que ninguno de nosotros tenga tiempo de reaccionar, lanza el hechizo y desaparece sin dejar rastro.

          ¿De dónde demonios ha sacado ese desgraciado un pergamino de teletransportación? Llevo meses buscando uno y no he encontrado nada. Por no mencionar que incluso uno solo de esos pergaminos cuesta una fortuna.

          "¡Miren lo que ha pasado!", dice Kate, furiosa. "Se ha escapado. ¿Ha sido eso también decisión de los dioses?"

          "No te burles de los dioses, mujer", responde Daren. "Nadie podía saber que un matón común como él tendría acceso a un pergamino de teletransportación".
