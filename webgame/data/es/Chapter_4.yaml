  - name: ch4_daren_kill
    texts:
      - source: scene_text
        paragraph: 256
        text: |-
          "¿Atarlo a este árbol? ¿Por qué no matarlo de una vez?"

          "Porque ya ha habido suficiente derramamiento de sangre desde que empezó este torneo y no quiero ejecutar a un enemigo que ya ha sido derrotado".

          "Pero ¿qué pasa con toda la gente que matará si escapa?"

          "Entiendo tu preocupación, Barry, pero no creo que los dioses consideren oportuno dejarle libre a menos que haya aprendido la lección. Sin embargo, no te impediré que lo mates si de verdad crees que es lo correcto".
    choices:
      - position: 1
        text: Matarlo
        effects:
          - set:
              current_scene: ch4_bait_kill
      - position: 2
        text: Perdonarlo
        effects:
          - set:
              current_scene: ch4_bait_spare
  - name: ch4_daren_spare
    texts:
      - source: scene_text
        paragraph: 257
        text: |-
          "¿Con qué lo vas a atar? Sus dagas encantadas acabarían pronto con cuerdas o cadenas normales".

          "Lo harían, si pudiera usarlas. Voy a usar una cuerda antimágica para atarlo, lo que le impedirá usar cualquiera de sus magias. Aquí, deja que te enseñe".

          Daren echa mano de su faja para sacar la cuerda. En los pocos instantes en que apartó la vista de Dave, sin embargo, el degollador sacó rápidamente un pergamino de teletransportación de su bolsillo y lo utilizó para escabullirse.

          ¿De dónde demonios ha sacado ese desgraciado un pergamino de teletransportación? Llevo meses buscando uno y no he encontrado nada. Por no mencionar que incluso uno solo de esos pergaminos cuesta una fortuna.

          Se oye un lento aplauso que viene de los árboles. Al mirar para ver qué hace el ruido, veo a Eiden, apoyado en un pino con su sonrisa habitual en la cara.

          "Impresionante, Barry", dice. "¡No se ven a menudo potenciadores de estadísticas usados tan eficientemente hoy en día!"

          ¡Tú!", grita Daren, y corre hacia el Stillwater.

          Una vez más, con un gesto de sus manos, Eiden pone a dormir a Daren en medio de su carrera, lo que le hace caer al suelo y deslizarse sobre su armadura unos metros antes de detenerse.
      - source: scene_text_2
        paragraph: 19
        text: |-
          "En serio, esto se está volviendo ridículo", dice Eiden.

          "¿Tú también sabes lo de los potenciadores de estadísticas?", le pregunto al Stillwater.

          "¡Sí! Y lo que también sé es por qué ese potenciador de estadísticas funciona tan bien contigo, en concreto. ¿Te has preguntado alguna vez por qué es así, Barry?"

          Tiene razón. El dispositivo de estadísticas ha funcionado por encima de todas mis expectativas desde que llegué aquí. No le di muchas vueltas porque supuse que mis cálculos debían de estar equivocados. Pero incluso con toda la energía que está acumulando, algo está claramente fuera de lugar.

          "Lo he hecho. Pero ¿no supongo que me vas a dar la respuesta así como así?"

          "Por supuesto que no. ¿Dónde estaría la diversión en eso? ¡Pero no te inquietes! Mientras permanezcas en este continente, obtendrás tus respuestas tarde o temprano".

          Él sonríe.

          "Bueno, entonces. Estaré esperando a que entregues mi mensaje. No me falles, Barry".

          Con estas últimas palabras me da la espalda y se adentra en el bosque.
