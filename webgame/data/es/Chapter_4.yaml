              Tres de sus cuchillos voladores corren hacia mí, pero los esquivo en el último momento. Estamos luchando en un espacio abierto y ya sé a qué velocidad pueden ir sus dagas. No voy a dejar que me sorprenda.

              Empiezo a correr en círculos alrededor del degollador para desorientarlo. Sigue enviándome sus dagas, pero no son lo suficientemente rápidas para atraparme. Intenta seguirme el ritmo, pero veo que se le escapa. Necesito ir más rápido.

              Sigo corriendo a su alrededor, esquivando dagas a derecha e izquierda, buscando una apertura. Cada vez que parece que me ha perdido de vista, salto a por él, pero consigue bloquear mis golpes en el último momento. Más rápido. Necesito ir aún más rápido.

              Empiezo a moverme de forma más errática, para confundirlo aún más. Dave el Degollador sigue girando tras de mí para no dejar su espalda expuesta, pero empieza a marearse. La mirada de sus ojos no es ni de lejos tan segura como cuando empezó esta pelea. Sus cuchillos aún no me han tocado y no me siento ni lo más mínimo cansado.

              Ahí está. El momento que estaba esperando. Sus ojos han perdido el foco y me ha perdido de vista. Ya lo tengo. Le lanzo otra estocada, esta vez con mucha más velocidad que antes. Él me ve e intenta bloquear mi golpe de nuevo, pero es demasiado tarde. Mi cuchillo atravesó su pecho, pero no toqué ninguno de sus órganos vitales.

              Solo necesito un golpe más para terminar con esto de una vez por todas.
