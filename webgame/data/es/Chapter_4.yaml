              "Esto no es un concurso de lanzamiento de piedras, muchacho. Será mejor que estés preparado para lo que viene".

              "Tengo su atención", le digo a Daren. "¡Ahora, vete. ¡Vete!"

              Daren no pierde más tiempo y corre hacia los secuaces de Dave el Degollador.

              Los cuchillos voladores del degollador vuelan ahora hacia mí a un ritmo muy rápido. Me quito de su camino y empiezo a dirigirme hacia mi objetivo.

              Recorro la distancia entre Dave y yo casi instantáneamente y le ataco con mi daga. Él consigue pararla con dos cuchillos que tenía en sus propias manos, pero parece bastante sorprendido.

              "No sé qué clase de magia has usado para correr tan rápido, muchacho, pero no puedes correr más que mis dagas".
          - source: scene_text_2
            paragraph: 22
