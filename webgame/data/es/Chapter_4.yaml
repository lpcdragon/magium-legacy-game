  - name: ch4_persuade
    texts:
      - source: scene_text
        paragraph: 238
        text: |-
          "Daren, creo que tiene razón... No podemos simplemente dejarlo aquí. Piensa en toda la gente inocente que matará si escapa".

          "Solo dices eso para ganarte su favor".

          "Daren..."

          Él suspira.

          "Lo sé... Sé que eso es lo que pasaría si se escapara. Es solo que... quería evitar más derramamiento de sangre innecesario. Pero tienes razón. El precio sería demasiado alto. Haz lo que debas, Kate".

          "Oye, ahora, espera un minuto", dice Dave. "El viejo Dave el Degollador ha aprendido la lección. No hay necesidad de que la puta--"

          Kate no deja que el degollador termine la frase y le atraviesa la cabeza con otra de sus espadas de hielo. Murió al instante.
