              Hay dos de ellos a mi izquierda, y tres más a la derecha. ¿O son cuatro a la derecha? Son tan rápidos que apenas puedo seguirlos. Sus cuchillos han conseguido acorralarme y ahora están todos frente a mí amenazantes, flotando en el aire, listos para atacar.

