              "De nada sirve llorar por piedad ahora, muchacho. No creas que voy a darte una muerte fácil. A mis cuchillos les gusta jugar con su presa antes de terminar con ella. Rezad vuestras plegarias, estúpido mocoso. Dave el Degollador va a disfrutar AAAARRRGHHHHHH"

              Una columna de fuego aparece en el lugar donde Dave el Degollador estaba originalmente de pie y su jactancia se ve sustituida por gritos desesperados de agonía. El fuego ignora por completo toda la vegetación a su alrededor y, cuando se extingue, veo que no queda nada del degollador excepto sus cenizas, que ahora se dispersan con el viento.
          - source: scene_text_2
            paragraph: 18
            text: |-
              Poco después, Eiden emerge de las sombras con su sonrisa habitual en la cara. No tardo mucho en darme cuenta de quién estaba detrás de la exhibición anterior de fuegos artificiales.

              "Ves, Barry, así es como se lidia con una plaga de alimañas. Dime, ¿qué clase de cartero muere antes de salir de la oficina de correos? Tengo ganas de presentar una queja por tus pésimos servicios".

              "Lo... siento mucho, prometo que lo haré mejor la próxima... ¿vez?"

              "¡Ese es el espíritu!"

              "¡Barry!", oigo gritar a Daren desde fuera del bosque.

              Una mirada rápida al exterior me muestra que todos los secuaces de Dave han sido eliminados y Daren corre ahora hacia mi posición.

              Al volverme, descubro para mi sorpresa que Eiden no aparece por ninguna parte. Debe de haberse teletransportado mientras no miraba.

              "Entrega mi mensaje, Barry", oigo la voz de Eiden resonar entre los árboles que me rodean. "Y no vuelvas a fallarme".
