scenes:
  - name: ch4_intro
    effects:
      - set:
          successful_checks:
            - 'Punto de control alcanzado: Partida guardada.'
        condition: checkpoint_rich = 1
    routes:
      - condition: ch3_kate_badly_hurt = 0 AND ch3_bloodied = 0
        texts:
          - source: scene_text
            paragraph: 222
            text: |-
              Daren nos estaba esperando frente a nuestra cueva. En cuanto nos pusimos a su alcance auditivo, empezó a despotricar sobre cómo no deberíamos habernos ido por nuestra cuenta y sobre cómo deberíamos permanecer unidos en todo momento.

              Kate simplemente lo ignoró con un gesto y entró en nuestra cueva para dormir un poco más, tras decirle que los sucesos de esta mañana la habían agotado. Cuando Daren me preguntó a qué se refería, le conté todo sobre el duque de Bagelberry y sus alegres seguidores, y cómo nos emboscaron.

              "Tuviste suerte de lograr salir de allí con vida", me dijo Daren. "¿Para qué nos molestamos siquiera en tener una reunión de estrategia ayer si después todos íbamos a ignorarla de todos modos?"

              Después de calmarse un poco, los dos reanudamos nuestra guardia, apostándonos frente a la entrada de la cueva.

              Mientras montamos guardia, empezamos a discutir sobre el torneo y su organización tal y como la hemos visto hasta ahora.
          - source: scene_text_2
            paragraph: 3
            text: |-
              "Simplemente no puedo entenderlo", me dice Daren. "¿En qué están pensando los organizadores? Permiten que gente sin rastro de magia se una a este concurso, y ni siquiera se molestan en imponer una regla que prohíba pelear antes de anunciar los objetivos. ¡Es como si ni siquiera les importaran todas las vidas que están en juego!"

              "No creo que les importen", le digo a Daren. "¿Recuerdas lo que nos hicieron aceptar antes de unirnos al torneo? Quien gane este campeonato estará obligado a acudir en ayuda de Varathia en caso de una invasión exterior. La gente solo aceptó porque no ha habido un intento de invadir Varathia en miles de años, pero no creo que ese sea el punto. Solo quieren al mago más poderoso del mundo para que sirva como su propio espantapájaros personal. Probablemente solo les importe quién vaya a ganar".

              "Pero aun así, si su objetivo es echar mano de un mago poderoso, ¿por qué todavía no han anunciado los objetivos? ¿No sería de su mayor interés terminar este torneo lo antes posible?"
        choices:
          - position: 1
            text: Tal vez no haya objetivos.
            effects:
              - set:
                  current_scene: ch4_intro2
                  checkpoint_rich: 0
                  ch4_objectives: 1
          - position: 2
            text: Tal vez encontraron algunas dificultades técnicas inesperadas.
            effects:
              - set:
                  current_scene: ch4_intro2
                  checkpoint_rich: 0
                  ch4_objectives: 2
          - position: 3
            text: Tal vez están esperando a que nuestro número disminuya.
            effects:
              - set:
                  current_scene: ch4_intro2
                  checkpoint_rich: 0
                  ch4_objectives: 3
      - condition: ch3_kate_badly_hurt = 0 AND ch3_bloodied = 1
