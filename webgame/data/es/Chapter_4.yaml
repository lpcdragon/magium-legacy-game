  - name: ch4_intro2
    routes:
      - condition: ch4_objectives = 1
        texts:
          - source: scene_text
            paragraph: 225
            text: |-
              "Tal vez no haya objetivos. Tal vez este sea realmente un torneo a vida o muerte y solo estén esperando a ver quién será el último hombre en pie".

              "¡Por los dioses, Barry! Ni siquiera bromees con algo así. Si eso fuera cierto, entonces este torneo se convertiría en una de las mayores carnicerías de este siglo. Me niego a creer que los gobernantes de una de las mayores civilizaciones de nuestro mundo recurran a tal barbarie".

              Antes de que podamos continuar nuestra conversación, sentimos que alguien se acerca a nuestra ubicación. El hechizo de barrera de Kate debe de haberse disipado.

              "¡Mantén la guardia alta, Barry!"

              A medida que esta persona se acerca, podemos sentir su aura mágica más claramente. Su aura mágica es tan débil como la de los ballesteros de antes. ¿Es un superviviente de nuestra última batalla que busca vengar a sus camaradas caídos?

              Cuando llega a nuestro campo visual, descubrimos que es bastante joven para ser un guerrero y no lleva ningún equipo de protección. Parece estar en los últimos años de la adolescencia, pero no más de veinte, y viste pantalones holgados y una túnica holgada, no muy diferente de la ropa que uno se pondría normalmente antes de irse a la cama. El hecho de que camine con los ojos cerrados y las manos en los bolsillos no ayuda mucho a su caso. Parece que acaba de salir de la cama para tomar un bocadillo de medianoche y, definitivamente, no como un participante en un torneo de vida o muerte. Sin embargo, tampoco puede ser uno de los lugareños, ya que habríamos sido notificados inmediatamente de no hacerle daño.
          - source: scene_text_2
            paragraph: 5
            text: |-
              "¡Buenos días, muchacho!", le grita Daren al chico. "Un día precioso para dar un paseo, ¿verdad? ¿Qué asunto tendrías con nosotros? Si estás perdido, ¡estaríamos más que encantados de darte indicaciones!"

              Con Daren, es difícil saber cuándo está siendo sarcástico o sincero, ya que no hay pistas en su mirada ni en su tono de voz y, por lo que lo conozco hasta ahora, sería capaz de cualquiera de esas dos cosas en esta situación. Nuestro joven visitante no parece haberse ofendido por el comentario de Daren y sonríe cortésmente con los ojos todavía cerrados.

              "No hay necesidad", responde el chico. "Estaba buscando a unos viejos amigos míos cuando sentí que había un compañero Stillwater cerca, así que tuve que detenerme a saludar. ¡Somos tan pocos hoy en día que sería una lástima ni siquiera saludarnos al pasar! Mi nombre es Eiden. ¡Encantado de conocerlos!"

              Todo mi cuerpo se congela por un segundo. ¿Un Stillwater de verdad? ¿Aquí? No... No. Debería calmarme. Probablemente sea solo algún otro tipo al que se le ocurrió la misma idea que a mí. ¡Me niego a caer en mi propio truco!

              Viendo que no digo nada, Daren responde en mi lugar.

              "¡No le hagas caso! Barry es un poco tímido. Estoy seguro de que él también está encantado de conocerte. Mi nombre es Daren".

              "¿Oh? ¡Entonces debes ser el sanador con armadura del que tanto he oído hablar! Y parece que también tienes un tercer miembro en tu grupo. Una superviviente del Faro de Esperanza, nada menos. No sabía que alguno de ellos siguiera con vida".
        choices:
          - position: 1
            text: ¿Qué es el Faro de Esperanza?
            effects:
              - set:
                  current_scene: ch4_beacon
          - position: 2
            text: ¿Por qué es una superviviente? ¿Se quemó el Faro de Esperanza?
            effects:
              - set:
                  current_scene: ch4_survivor
