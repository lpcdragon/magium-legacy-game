              ch4_ending: 1
  - name: ch4_gruesome_fate
    texts:
      - source: scene_text
        paragraph: 236
        text: |-
          Quién sabe qué les hará este sádico bastardo si le dejo. Ni siquiera Dave el Degollador merece un destino tan espantoso. Por lo menos, una muerte a mis manos o a las de Daren sería rápida e indolora. Aunque no estoy del todo seguro en cuanto a Kate.

          Salgo de la sombra de mi árbol y me enfrento a los degolladores. Dave alterna ahora su mirada entre el Stillwater y yo, sin saber qué pensar. Eiden me mira sonriendo.

          "¿Qué pasa, Dave? ¿Ha pasado tanto tiempo que has olvidado el sonido de mi voz?"

          "No...", responde. "No, recuerdo perfectamente tu voz. Espero que te hayas lavado el cuello mientras me esperabas, capullo arrogante".

          Señala entonces a Eiden.

          "No creas que he terminado contigo. Más vale que no te vayas de aquí hasta que esto termine".

          "¡Ni en sueños!", dice Eiden, todavía sonriendo.

          Salgo corriendo del bosque y me dirijo directamente hacia Daren. Los degolladores me pisan los talones, pero se detienen en seco al ver que no estoy solo.

          Daren, que se estaba despertando, mira a su alrededor confundido.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch4_barry_vs_dave
  - name: ch4_barry_vs_dave
    routes:
      - condition: ch3_kate_badly_hurt = 0 AND ch3_bloodied = 0
        texts:
          - source: scene_text
            paragraph: 237
            text: |-
              "¿Qué ha pasado? ¿Dónde está el Stillwater?", me pregunta.

              "Olvida al Stillwater. Mira quién ha venido a saludarnos".

              Los secuaces de Dave empezaron a hablar entre ellos. Parece que no están del todo convencidos de arriesgarse a entrar en batalla contra el héroe legendario Daren y un Stillwater al mismo tiempo.

              Aprovecho esto y llamo a Kate.

              "¡Kate! ¡Nos atacan! ¡Ven rápido!"

              "Deja de gritar, estoy aquí", dice Kate al salir de la cueva. "Como si alguien pudiera dormir con este hedor. Huele peor que todos los campos de cadáveres que hemos pasado de camino aquí".

              Se dirige a los hombres de Dave el Degollador.

              "Dioses, ya hemos pasado por tres lagos desde que llegamos. ¡Tres! Un solo chapuzón en cualquiera de ellos habría hecho maravillas. Quizá con una piedra grande atada a los pies para asegurarse de eliminar la mugre para siempre".

              "¿Quién es la moza bocazas?", me pregunta Dave el Degollador. "¿Llevamos aquí poco más de un día y ya te has comprado una puta? ¿No podías habértela guardado en los pantalones al menos hasta el final del torneo?"

              A Kate le tiembla un ojo. Aquí vamos de nuevo...
          - source: scene_text_2
            paragraph: 15
            text: |-
              "Jefe, creo que es una banshee", le dice uno de los secuaces de Dave, visiblemente asustado.

              "¿Lo es? No sabía que los burdeles contrataran banshees en este continente. Tengo que conseguirme una de esas".

              Sonríe maliciosamente y mira a Kate.

              "Amor, ¿cuánto pides? Apuesto a que puedo hacer que disfrutes más que cualquiera de estos dos pelagatos. Me aseguraré de darte mucho cariño. ¡Jejeje!"

              Conociendo a Kate, lo primero que pensé fue en mirar hacia arriba. Como sospechaba, mientras Dave el Degollador hablaba, Kate estaba ocupada amontonando espadas de hielo flotantes en el cielo. Las envió todas volando a la vez. Cinco para cada uno, solo para estar segura.

              Los secuaces de Dave murieron en el acto, empalados por las numerosas espadas conjuradas por Kate. Su líder, sin embargo, consiguió desviar cuatro de las espadas con sus cuchillos voladores en el último momento. La quinta espada le atravesó la pierna derecha.

              "¿Ustedes cobardes han contratado a una puta como guardaespaldas?", nos pregunta Dave, mientras lucha por ocultar el dolor de su cara. "¿Cómo se puede caer tan bajo?"

              "Parece que no eres solo palabrería, degollador. Pero veamos cómo desvías las siguientes".

              "Espera, Kate", dice Daren. "Creo que ya ha aprendido la lección".

              "¡No puedes hablar en serio! ¿Y qué quieres que hagamos? ¿Mandarlo de paseo con una severa advertencia?"
          - source: scene_3
            paragraph: 7
            text: |-
              "Lo ataremos, lo dejaremos aquí y que los dioses decidan su suerte".

              Kate parece estar considerando si simplemente ejecutar a Dave el Degollador sin el consentimiento de Daren. Al final decide no hacerlo, probablemente para no forzar su suerte. En su lugar se dirige a mí.

              "Barry, dile algo. Él te escucha".
        choices:
          - position: 1
            text: Intentar persuadir a Daren para que acepte lo que dice Kate
            effects:
              - set:
                  current_scene: ch4_persuade
          - position: 2
            text: Estar de acuerdo con Daren
            effects:
              - set:
                  current_scene: ch4_agree
      - condition: ch3_kate_badly_hurt = 0 AND ch3_bloodied = 1
        texts:
          - source: scene_text
            paragraph: 245
            text: |-
              "¿Qué ha pasado? ¿Dónde está el Stillwater?", me pregunta.

              "Olvida al Stillwater. Mira quién ha venido a saludarnos".

              Los secuaces de Dave empezaron a hablar entre ellos. Parece que no están del todo convencidos de arriesgarse a entrar en batalla contra el héroe legendario Daren y un Stillwater al mismo tiempo.

              Aprovecho esto y llamo a Kate.

              "¡Kate! ¡Nos atacan! ¡Ven rápido!"

              No hay respuesta. Intento llamarla de nuevo, pero sigo sin obtener respuesta. Supongo que nuestra pelea con los ballesteros debe de haberle pasado una factura mayor de la que dejó entrever. Parece que vamos a ser solo Daren y yo durante este combate. Será mejor que dé un buen uso a ese dispositivo de estadísticas.

              "¿De qué tienen tanto miedo?", pregunta Dave a sus hombres. "Yo solo acabé ayer con esa triste excusa de héroe. No se crean todo lo que oyen en la calle. Sus leyendas son tan mentira como las de los Stillwaters. ¡Esto es el mundo real!"
