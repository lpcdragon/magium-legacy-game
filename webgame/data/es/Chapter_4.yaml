  - name: ch4_truth
    texts:
      - source: scene_text
        paragraph: 235
        text: |-
          "Creo que ya tienes la respuesta a esa pregunta".

          "La tengo, en efecto. Dime, Barry. ¿Cómo llegaste a la conclusión de que usarme para limpiar tu desorden sería una buena idea?"

          "Bueno, supuse que no tendrías problemas para lidiar con esos matones de poca monta. Y parecías disfrutarlo bastante. De lo contrario, simplemente habrías derribado el árbol tras el que me escondía para revelarme ante los degolladores".

          "Fascinante. Realmente pareces no tener sentido del peligro. Permíteme ayudarte en ese sentido".

          En cuanto termina la frase, empiezo a sentir algo que me presiona la garganta. Siento como si una cuerda invisible estuviera atada alrededor de mi cuello y me levantara lentamente sobre el suelo. No es solo mi imaginación. Realmente me están levantando más y más alto sobre el suelo. Me cuesta mucho más respirar a medida que el lazo invisible se aprieta alrededor de mi cuello. Intento quitarme la soga con las manos, pero no hay nada allí. Si esto sigue así mucho tiempo, voy a morir de verdad.

          Una vez que estoy a varios pies del suelo, el lazo invisible desaparece de repente y caigo sobre el suelo rocoso, cayendo de rodillas. Pude oír un fuerte chasquido al golpear el suelo. Estoy bastante seguro de que la caída me rompió ambas rótulas. El dolor es insoportable.
      - source: scene_text_2
        paragraph: 14
        text: |-
          "Ahora que tengo tu atención", continúa el Stillwater, "quiero que entiendas algo. Si vuelves a intentar algo así, unas rótulas rotas van a ser la menor de tus preocupaciones. ¿Está claro?"

          "Cristalino".

          La sonrisa de Eiden vuelve a su rostro.

          "Eso es lo que me gusta de ti, Barry. Incluso ante la aniquilación total, consigues mantener tu tono desafiante y sarcástico. Pero no eres ni fuerte ni valiente. Entonces, ¿qué es? ¿Cuál es la fuerza motriz que te impulsa hacia adelante?"

          "La estupidez".

          "¡Bien dicho!", dice Eiden sonriendo. "Creo que tu sanador ya debería haberse despertado de su sueño. Ve y llámalo. Estoy seguro de que ha arreglado más de unas cuantas rótulas rotas en su vida. Estaré esperando a que entregues mi mensaje. No me falles, Barry".

          Con estas últimas palabras me da la espalda y se adentra en el bosque.
    effects:
      - set:
          ac_ch4_kneed: 1
        achievement:
          id: ac_ch4_kneed
          title: ¡Realmente necesito un respiro!
    choices:
      - position: 1
        text: Siguiente capítulo
        effects:
          - set:
              next_chapter_crash: 1
              current_scene: ch5_intro
