          La sonrisa de Eiden se ensancha, pero sus ojos permanecen cerrados.

          "¿Oh? Así que eres un idealista, entonces. Pero dime, héroe, ¿qué pasa cuando tus puros ideales chocan con la fría y dura realidad?"

          De repente, Daren cae de bruces sobre su pecho, y puedo notar que está siendo presionado contra el suelo por una fuerza muy poderosa.

          "¿Qué sucede cuando te encuentras con una fuerza tan grande que simplemente te aplasta contra el suelo, como si fueras un insecto?"

          La fuerza que empujaba a Daren contra el suelo se intensificó tanto que hizo un gran agujero con la forma de Daren en el duro suelo rocoso bajo él. Ya no pudo contener más el dolor y empezó a gritar de agonía.
      - source: scene_3
        paragraph: 3
        text: |-
          Me doy cuenta de que mis manos se han enfriado y todo mi cuerpo tiembla. Necesito recomponerme. Si arruino esto, todos seremos masacrados.

          "¡Suéltalo!", le digo a Eiden, intentando sonar lo más seguro posible.

          "¿Quieres salvar a tu amigo, Barry? ¿Qué te parece si hacemos un trato justo? Tu vida por la suya. Prometo dejar en paz a tu amigo si das tu vida por él. ¿Qué me dices?"
    choices:
      - position: 1
        text: Aceptar el trato
        effects:
          - set:
              current_scene: ch4_accept
      - position: 2
        text: Proponer un trato diferente
        effects:
          - set:
              current_scene: ch4_propose
  - name: ch4_accept
    texts:
      - source: scene_text
        paragraph: 230
        text: |-
          Un escalofrío me recorre todo el cuerpo cuando las palabras del Stillwater llegan a mis oídos. Esto no es una pesadilla, Barry. Está pasando. Esto está pasando de verdad. ¿En qué demonios estaba pensando? ¿Que me uniría a un torneo contra los magos más poderosos del mundo y que las cosas se arreglarían solas?

          Mira lo que he hecho. He logrado no solo ponerme en peligro a mí mismo, sino también a un hombre que no ha hecho más que el bien en toda su vida. Un hombre mucho mejor de lo que yo seré nunca. Y yo soy la razón por la que este Stillwater vino a nosotros. Todo esto es culpa mía. Pero tal vez pueda arreglarlo.

          "¿Qué garantía tengo de que no lo matarás simplemente después de que termines conmigo?", le pregunto a Eiden.

          "Pues el hecho de que sigas vivo, por supuesto. Seguramente, ¿ya te habrás dado cuenta de que no me costaría más que un chasquido de dedos acabar con las vidas de ambos? ¿Por qué me molestaría siquiera en darte esta opción si no fuera sincero?"

          No confío en él. No confío en él en absoluto. Pero ¿qué opción tengo? Daren está llegando a sus límites, y si lucho contra él uno a uno, me desintegrará. Ni siquiera Kate tendría una oportunidad contra él. Y además, ya he tomado una decisión.

          "Entonces acepto tu trato. Mi vida por la de Daren".
      - source: scene_text_2
        paragraph: 10
        text: |-
          Eiden sonríe.

          "Tu vida por la de Daren".

          Siento como si mi propia alma abandonara mi cuerpo. Pierdo rápidamente el control de todos mis músculos y mi cuerpo cae al suelo. Todo se vuelve más frío, pero no siento dolor. Solo vacío.

          "Está hecho", dice el Stillwater, mientras se teletransporta fuera de nuestro campamento.

          "¡Barry, no!", grita Daren con todas sus fuerzas, mientras corre hacia mí.

          Lo hice. Él sigue vivo.

          Lo último que veo es la expresión desesperada de Daren mientras intenta en vano reanimarme.
    effects:
      - set:
          ac_ch4_noble: 1
        achievement:
