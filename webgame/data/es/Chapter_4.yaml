  - name: ch4_propose
    texts:
      - source: scene_text
        paragraph: 231
        text: |-
          "¿Qué tal otro trato?"

          "¿Qué tienes en mente?"

          "Cuando nos conocimos, dijiste que buscabas a unos amigos. Si nos dejas vivir, podríamos entregar un mensaje por ti, en caso de que encontremos a esos amigos tuyos antes que tú".

          "¿Así que dices que la vida de tu amigo solo vale entregar un mensaje?"

          "Lo es para ti. Creo que ya has dejado suficientemente claro que la vida humana no tiene valor para ti. Eso significa que debería darte igual si nos dejas vivir o no. Pero si nos dejas vivir, conseguirás que se entregue tu mensaje. ¿Qué te parece un trato justo?"

          Eiden se ríe y la fuerza que empuja a Daren contra el suelo se debilita.

          "Cuando lo pones así, supongo que tienes razón. Muy bien, entonces. Sus vidas por un mensaje".

          Se detiene un momento a pensar antes de continuar.

          "Los amigos que busco siempre visten túnicas azul oscuro y en el pecho llevan broches que representan un halcón sosteniendo el sol entre sus garras. Si te encuentras con alguien que encaje con esta descripción, dile simplemente que Eiden les envía este mensaje: Recuerden el invierno en calma".

          "...Y, ¿si me preguntan qué significa eso?"

          "No lo harán. No importa a quién encuentres, mientras encajen con la descripción que te di, entenderán el mensaje perfectamente".

          "Eh... Está bien, entonces. Considéralo hecho".
      - source: scene_text_2
        paragraph: 11
        text: |-
          "Perfecto".

          Eiden libera a Daren de su hechizo y se gira para irse.

          "No... dejaré que te vayas de aquí", dice Daren, mientras se levanta lentamente.

          "Seguramente estarás bromeando", le dice Eiden.

          "Si... te dejo ir ahora, solo harás daño a más gente inocente. Te detendré, cueste lo que cueste".

          "Mira, ahora eso me pone en una posición difícil, ya que ya hice un trato justo con Barry de allí. No puedo matarte ahora, ya que violaría los términos de nuestro acuerdo comercial".

          "¡Silencio!"

          Daren corre hacia el Stillwater y lanza un tajo feroz hacia su cuello. Eiden lo esquiva sin esfuerzo y Daren va rápidamente por un segundo golpe, esta vez destinado a cortarlo por la mitad. Eiden se hace a un lado con naturalidad, haciendo que parezca un juego de niños. Tras unos cuantos golpes desperdiciados por parte de Daren, justo cuando parecía que podía haber pillado al Stillwater a contrapié, Eiden se limitó a poner su mano desnuda frente a su cara y detuvo el golpe de la espada con solo su dedo índice.

          "No...", dice Daren, como si no pudiera creer lo que veían sus ojos.
      - source: scene_3
        paragraph: 4
        text: |-
          "Me cansa esto", dice Eiden mientras hace un gesto con la otra mano.

          En menos de un segundo, Daren cayó al suelo como un tronco, su armadura haciendo un fuerte ruido metálico al golpear el suelo rocoso de abajo.

          "¡No!", grito.

          "Solo lo puse a dormir", dice el Stillwater. "Se despertará en unos minutos".

          Se gira para irse.

          "Ah, y no te preocupes por buscar a mis amigos. Estoy seguro de que los conocerás pronto".

          Vuelve a sonreír y se dirige hacia el bosque.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch4_dave_vs_eiden
            condition: ch1_show_yourself != 2
          - set:
              current_scene: ch4_face_shown
            condition: ch1_show_yourself = 2
  - name: ch4_dave_vs_eiden
    texts:
      - source: scene_text
        paragraph: 232
        text: |-
          "Daren, ¿puedes oírme? ¡Despierta!"

          No hay respuesta. ¿Qué clase de hechizo usó este tipo? Estoy bastante seguro de que Daren tiene algunos hechizos realmente fuertes que lo protegen en todo momento. Los hechizos de sueño estándar no deberían ser más que un inconveniente moderado para él.

          Mientras intento despertar a Daren, de repente oigo una voz muy familiar que viene de la dirección en la que desapareció Eiden.

          "¡Stillwater!"

          Esa es la voz de Dave el Degollador. No hay duda. Reconocería esa voz ronca y ese acento de matón en cualquier parte.

          Me doy la vuelta hacia donde venía la voz, pero solo hay árboles. ¿Por qué Dave el Degollador me gritaría antes de tener la oportunidad de ver bien mi cara?

          Entonces caí en la cuenta. Nunca llegó a verme la cara. Estuve escondido detrás de un árbol todo el tiempo. Corro hacia el bosque para confirmar mis sospechas. Me escondo tras uno de los árboles y echo un vistazo.

          Tal como pensaba, Dave el Degollador ha confundido a Eiden conmigo y busca venganza. Se las ha arreglado para reunir un equipo en el poco tiempo que estuvimos separados y tienen al Stillwater rodeado. Lo triste es que Dave parece un caballero bien educado comparado con sus nuevos colegas. Algunos de ellos parecen y huelen como si no se hubieran lavado en meses. Supongo que Dios los cría y ellos se juntan.
      - source: scene_text_2
        paragraph: 12
        text: |-
          "Te he estado buscando, Stillwater", dice Dave. "He estado siguiendo tus huellas desde ayer. Te dije que volveríamos a vernos. Nadie puede huir ni esconderse de Dave el Degollador".

          "Me temo que se equivoca, mi buen hombre", dice Eiden, sonriendo. "Estoy seguro de que no le he visto en mi vida".

          "Sí. Yo también estoy seguro de eso. Habrías necesitado abrir los ojos para verme".

          Todos los hombres de Dave el Degollador estallan de repente en carcajadas al mismo tiempo. Se ríen de forma ruidosa y vulgar, probablemente en un intento de intimidar a su víctima, igual que un grupo de matones de colegio. La expresión de Eiden no cambia y sigue sonriendo amablemente.

          "No creas que puedes engañarme cambiando un poco la voz. Soy demasiado listo para eso. Reconocería ese tono arrogante tuyo en cualquier parte. ¿Dónde está tu amigo el sanador? ¿Te ha dejado aquí tirado después de que le salvaras el pellejo?"

          "¿Se refiere quizás al sanador con armadura? Si es así, está ahí mismo, pasando estos árboles".

          "¡Ja! Buen intento, Stillwater. Ese truco tuyo de intimidar no me va a funcionar dos veces seguidas".

          Se vuelve hacia sus estimados colegas.
      - source: scene_3
        paragraph: 5
        text: |-
          "¡Hombres! Preparen sus espadas. Saquen sus cuchillos. Para esto hemos venido. Hoy escribiremos nuestros nombres en la historia. ¡Hoy nos convertiremos en LEYENDAS!"

          Los hombres de Dave el Degollador dan un rugido mientras levantan sus manos sosteniendo sus armas en el aire. La sonrisa de Eiden se ha ensanchado. Su expresión es similar a la que tenía antes de estampar a Daren contra el suelo. Está disfrutando esto. Van a ser masacrados.
    choices:
      - position: 1
        text: Bien. Menos enemigos de los que preocuparnos.
        effects:
          - set:
              current_scene: ch4_fewer_enemies
      - position: 2
        text: Nadie merece un destino tan espantoso, ni siquiera Dave el Degollador.
        effects:
          - set:
              current_scene: ch4_gruesome_fate
  - name: ch4_fewer_enemies
    texts:
      - source: scene_text
        paragraph: 233
        text: |-
          No hay razón para que me compadezca de tipos como Dave el Degollador. Si le salvo el pellejo aquí, lo más seguro es que me ataque a mí después. Y si lo derroto y luego lo dejo vivo, se dedicará a asesinar a gente inocente. Unos cuantos matones muertos más en el mundo no supondrán ninguna diferencia. Dudo mucho que nadie vaya a llorar su muerte.

          Decido no intervenir y dejar que la batalla siga su curso.

          Dave el Degollador comienza enviando unos cuantos cuchillos voladores hacia el Stillwater. Justo cuando alcanzan a Eiden, todos se detienen en el aire frente a él. Eiden sonríe con sorna y señala al degollador. Todos los cuchillos obedecen incondicionalmente a su nuevo amo y se dirigen hacia Dave a una velocidad de vértigo. Este consigue pararlos en el último momento con sus propios cuchillos voladores, pero se queda estupefacto.

          "¿Qué clase de brujería es esta?", dice.

          "De la clase mágica, por supuesto", le responde el Stillwater. "Mira, esto es un torneo para magos. Las audiciones para el circo se celebraban al otro lado de la calle".

          La cara de Dave se contorsiona en un gruñido.

          "Ya veremos qué gracia te hace con unos agujeros en el cráneo, pedazo de bastardo. Hombres, denle una lección a este pequeño advenedizo".

          Todos los hombres de Dave el Degollador saltan sobre Eiden, pero este desaparece delante de sus narices y aparece frente a Dave con una sonrisa, aunque sus ojos permanecen cerrados.
      - source: scene_text_2
        paragraph: 13
        text: |-
          "¿Envías a tus hombres a hacer el trabajo sucio, Dave? ¡Pensé que ibas a convertirte en una leyenda! ¿Por qué vacilas?"

          Dave saca un cuchillo de su cinturón y lanza un tajo al cuello de Eiden.

          "Cierra tu boca de sabelotodo y muere, pedazo de mi--"

          Antes de que el matón terminara la frase, Eiden puso la palma de su mano en la cara de Dave e hizo que su cabeza explotara en mil pedazos. La vida de Dave el Degollador había terminado así, sin ni siquiera tener tiempo de darse cuenta de que estaba muerto.

          Cegados por la rabia, los leales seguidores de Dave corrieron gritando hacia Eiden, con sus armas preparadas. Sin embargo, no llegaron muy lejos. Con un chasquido de dedos, el Stillwater hizo aparecer ante él una enorme columna de fuego que incineró a todos los matones hasta el punto de que ni siquiera sus huesos quedaron intactos. El fuego ignoró por completo todos los árboles a su alrededor y Eiden simplemente lo apagó con otro chasquido de dedos.

          Esperaba que esto fuera rápido. Pero este resultado superó con creces mis expectativas. Incluso puede lanzar magia de fuego. ¿Qué demonios se supone que debemos hacer para luchar contra este tipo?

          Eiden se vuelve hacia mí. De repente recuerdo que se basa principalmente en su sentido mágico y no en su vista para evaluar su entorno. Debe de haber sentido mi presencia desde antes del comienzo de la batalla.
      - source: scene_3
        paragraph: 6
        text: |-
          "¿Disfrutaste del espectáculo, Barry?", me pregunta. Su sonrisa ha desaparecido de su rostro.

          "Ha sido todo un espectáculo", le respondo.

          "Eso ha sido. Parecería que el degollador me había confundido con otro Stillwater. Uno que se asociaba con un sanador. Un malentendido bastante desafortunado. No sabrás por casualidad a quién buscaban, ¿verdad Barry?"
    choices:
      - position: 1
        text: Decirle la verdad
        effects:
          - set:
              current_scene: ch4_truth
      - position: 2
        text: Inventar una mentira
        effects:
          - set:
              current_scene: ch4_lie
  - name: ch4_lie
    texts:
      - source: scene_text
        paragraph: 234
        text: |-
          "No lo sé. Pero a mí también me preocupa. ¿Crees que podría haber otros Stillwaters en esta zona?"

          Eiden sonríe. Con un gesto de sus manos, paraliza mi cuerpo mientras estoy de pie y me hace flotar hasta su posición. Lucho en vano por escapar de su agarre. Su hechizo es demasiado fuerte. Una vez que llego ante él, Eiden responde a su propia pregunta.

          "Te buscaban a ti, Barry. Realmente tienes mucho valor mintiéndome así a la cara. Quizá me equivoqué contigo. Quizá entregue mi mensaje yo mismo, después de todo".

          "¡No, espera, puedo explicarlo!"

          "No necesito más tus servicios ni tus explicaciones, Barry. Quedas relevado de tus funciones".

          Antes de darme la oportunidad de responder, hace otro gesto con la mano y se me rompe el cuello, matándome al instante.
    choices:
      - position: 1
