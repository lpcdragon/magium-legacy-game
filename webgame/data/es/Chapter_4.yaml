            paragraph: 266
            text: |-
              Cojo otra piedra del suelo y uso toda la fuerza de mi brazo derecho para un último lanzamiento. El degollador vuelve a intentar bloquear el ataque con dos de sus dagas, pero no acierta en el momento oportuno y la piedra le destroza la cabeza por completo.

