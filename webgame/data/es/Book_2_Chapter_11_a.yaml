              Mientras estaba allí, considerando mis opciones, el Dios del Tiempo fue materializándose lentamente en una forma más terrenal, aunque no sé si de verdad podría llamarla así. Su cuerpo tiene la forma y el tamaño de un humano, pero está hecho de una especie de luz azul sólida que irradia energía mágica sin parar. El hombre no tiene rostro ni rasgos distinguibles, aparte de unas cuantas llamitas azules que aparecen y desaparecen al azar por todo su cuerpo a intervalos cortos e igualmente aleatorios. Ahora mismo flota en el aire, junto a Rose, mirándonos directamente con su rostro vacío.

              "No es prudente hacer esperar a un dios...", dice el Dios del Tiempo. "Les dije que se arrodillaran."

              "No escuchen lo que dice", nos dice Arraka. "Necesita que sigan vivos para que sus planes funcionen. No puede hacerles nada. Solo está faroleando."
