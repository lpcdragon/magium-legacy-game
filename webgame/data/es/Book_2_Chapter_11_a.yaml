  - name: b2_ch11a_prophecy2
    routes:
      - condition: ch11_saved_rose = 0
        texts:
          - source: scene_text
            paragraph: 10
            text: |-
              Tiene razón. No creo haber experimentado una sensación de pavor así desde que vi a Arraka salir de su amuleto. Es como si cada fibra de mi ser me estuviera diciendo que salga corriendo al demonio lejos de aquí, tan lejos como sea posible y tan rápido como puedan llevarme los pies. No puedo dejar que este miedo me venza. Ahora no. Estoy casi seguro de que hasta la decisión equivocada más pequeña en este punto podría llevar a mi aniquilación instantánea. ¿A quién nos estamos enfrentando exactamente aquí?

              "Saludos, mortales...", oímos varias voces masculinas hablar al unísono a nuestro alrededor.

              Esta forma de hablar se parece mucho a la manera en que Arraka habla a veces, cuando pierde el control de su voz. Una risa compuesta por varias voces... ¿Podría estar esto relacionado con la profecía también?

              "Han sido bendecidos con la presencia de un dios", dicen las voces, mientras reverberan por toda la zona. "Arrodíllense ante mí y entonces les daré permiso para contemplar mi magnífica forma con admiración."

              "¿Y tú exactamente qui--", empieza a decir Daren, pero Melindra le tapa la boca con la mano para hacerlo callar, con una mirada de pánico en el rostro.

              "Este es el Dios del Tiempo", dice Melindra. "No le hagan ninguna pregunta. Tiene poder suficiente para acabar con todos nosotros en cuestión de segundos. Solo... arrodíllense..."
          - source: scene_text_2
            paragraph: 7
            text: |-
              Entonces ella se arrodilla ante el Dios del Tiempo, con la cabeza agachada, mientras le hace señas a Daren para que haga lo mismo.

              ¿Un adversario capaz de hacer que incluso alguien tan orgullosa como Melindra actúe así? No me gusta adónde va esto. Está claro que, si me pongo a hacer tonterías aquí, podría conseguir que nos maten a todos. Pero ¿de verdad debería arrodillarme ante este bastardo?

              Mientras estaba allí, considerando mis opciones, el Dios del Tiempo fue materializándose lentamente en una forma más terrenal, aunque no sé si de verdad podría llamarla así. Su cuerpo tiene la forma y el tamaño de un humano, pero está hecho de una especie de luz azul sólida que irradia energía mágica sin parar. El hombre no tiene rostro ni rasgos distinguibles, aparte de unas cuantas llamitas azules que aparecen y desaparecen al azar por todo su cuerpo a intervalos cortos e igualmente aleatorios. Ahora mismo flota en el aire, junto al revenant, mirándonos directamente con su rostro vacío.

              "No es prudente hacer esperar a un dios...", dice el Dios del Tiempo. "Les dije que se arrodillaran."

              "No escuchen lo que dice", nos dice Arraka. "Necesita que sigan vivos para que sus planes funcionen. No puede hacerles nada. Solo está faroleando."
        choices:
          - position: 1
            text: Arrodillarme ante el Dios del Tiempo
            effects:
              - set:
                  current_scene: b2_ch11a_kneel
                  b2_ch11_kneel: 1
          - position: 2
            text: Mantenerme firme
            effects:
              - set:
                  current_scene: b2_ch11a_kneel
                  b2_ch11_kneel: 0
          - position: 3
            text: Mantenerme firme e insultar al Dios del Tiempo
