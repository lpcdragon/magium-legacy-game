  - name: b2_ch11a_materialized
    texts:
      - source: scene_text
        paragraph: 45
        text: |-
          "No", dice Arraka. "No puede quedarse materializado sin más en nuestro mundo todo el tiempo que quiera. Eso desperdiciaría demasiada energía. Por eso normalmente solo aparece al principio y al final, a menos que sea absolutamente necesario que intervenga personalmente en mitad de un ritual. De lo contrario, se limitará a permanecer en el plano mágico y esperar pacientemente a que los rituales reúnan energía para él."

          "Pero ¿cómo lo ayudan estos rituales?", digo. "¿Qué tienen estas pruebas que le da tanto poder?"

          "Está reuniendo energía de sus emociones negativas", dice Arraka. "Odio, ira, miedo, desesperación... ese tipo de cosas. Son las clases de emociones que pueden explotarse con más eficacia mediante estos métodos. Pero no puede hacer nada de eso sin vincularse directamente al Magium durante las profecías de las tejedoras del tiempo, así que necesita exprimirles todo lo que pueda mientras aún tiene la oportunidad. Por eso estas pruebas están diseñadas como están. Para asegurarse de que desencadenan en ustedes tantas emociones negativas intensas como sea posible."

          "No estoy seguro de que me guste hacia dónde va esto", digo. "¿Qué clase de prueba retorcida pretende hacer pasar a Kate, si necesitó enviarla de vuelta a sus años en el Faro?"

          "Lo veremos los dos en unos segundos", dice Arraka. "En realidad nunca había mirado este ritual antes de venir aquí contigo, así que los dos vamos a vivirlo por primera vez, juntos. Seguro que será divertido. ¡Empecemos!"
      - source: scene_text_2
        paragraph: 41
        text: |-
          Los dos desaparecemos del corredor lleno de gritos y reaparecemos en una habitación oscura y vacía donde una versión de once años de Kate parece estar hablando con lo que supongo que es una versión de doce años de su amiga Diane. Kate es fácil de reconocer, porque simplemente parece una versión más pequeña de sí misma, pero Diane tiene el pelo largo y rubio y un físico mucho más frágil del que tenía de adulta, así que me cuesta un poco más saber si de verdad es ella o no. Las dos visten harapos. La habitación en la que estamos se parece a mi vieja celda de la arena, con una cama y una pequeña ventana en la parte superior, así que supongo que lo más probable es que estén en la habitación de Diane y que Kate haya decidido ir a verla para contarle algo que conoce del futuro.

          "No conseguí hacer audibles sus pensamientos, así que tendremos que apañarnos con lo que tenemos", me dice Arraka. "Veamos a dónde lleva esto."

          "Te digo que no es la prueba de lealtad", le dice Kate a Diane, en un susurro, para asegurarse de que los guardias de fuera no las oigan. "Sé que cuesta creerlo, pero he venido del futuro y sé que el cuidador lessathi que intenta ayudarnos a escapar se convertirá más tarde en el padre adoptivo de Leila. ¡Sé que se puede confiar en él!"
    choices:
