              "Entonces, ¿quién es?", pregunta Daren. "¿Quién congeló el tiempo?"

              "¿Por qué no miran y lo comprueban ustedes mismos?", dice Arraka. "Está saliendo del bosque y viene hacia ustedes en este mismo instante."

              "¿A ella?...", dice Daren.

              Cuando todos nos fijamos en la persona que se acerca lentamente hacia nosotros, la reconocemos de inmediato. Rose avanza ahora muy despacio hacia nosotros, mientras sus ojos brillan con una intensa luz amarilla. Tiene una expresión completamente vacía y mira fijamente al frente, sin reconocer nuestra presencia.
          - source: scene_text_2
            paragraph: 3
            text: |-
              "¿Rose?...", dice Daren. "¿Pero no estaba en Thilias todavía ayer?... ¡Vamos, acerquémonos a ella!"

              Todos hacemos lo que dice Daren y nos acercamos a Rose, hasta quedar justo frente a ella. En cuanto llegamos, Rose se detiene en seco y sigue mirando recto al frente, con la misma expresión vacía en la cara.

              "Rose, ¿puedes oírnos?", dice Kate.

              Rose no reacciona de ningún modo a las palabras de Kate. Ni siquiera parece consciente de nuestra presencia. Es como si estuviera en una especie de... trance.
        choices:
          - position: 1
            text: Seguir intentando hablar con ella.
            effects:
              - set:
                  current_scene: b2_ch11a_keep
                  checkpoint_rich: 0
          - position: 2
            text: Agarrarla por los brazos e intentar sacarla del trance a sacudidas.
            effects:
              - set:
                  current_scene: b2_ch11a_grab
                  checkpoint_rich: 0
  - name: b2_ch11a_keep
    routes:
      - condition: ch11_saved_rose = 0
        texts:
          - source: scene_text
            paragraph: 4
            text: |-
              "¿Nos estás escuchando?...", digo.

              Al ver que el revenant sigue sin hacer nada, me coloco justo delante de ella y empiezo a chasquear los dedos repetidamente, muy cerca de su cara.

              "¡Vamos!", digo. "¡Reacciona!"

              "Oh, no...", dice Melindra. "Ya he visto pasar algo así antes. Si es lo que creo que es, más vale que se preparen. Esa pelea con el sabio de antes va a parecer un paseo por el parque comparada con lo que viene ahora."

              "Menudo espectáculo les espera, desde luego", dice Arraka, y luego se ríe.

              "¿De qué están hablando las dos?", dice Hadrik. "¿Prepararnos para qué?"

              "Está empezando...", dice Melindra.
          - source: scene_text_2
            paragraph: 4
            text: |-
              De pronto, el revenant desaparece ante nuestros ojos y oímos su voz a nuestra espalda. Cuando todos nos damos la vuelta, nos damos cuenta de que no era solo su voz la que había cambiado de sitio en una fracción de segundo, sino el revenant en persona. La voz que sale de su boca apenas suena como la de Rose, por la enorme reverberación que la acompaña.

              "He venido a contarles una profecía...", dice el revenant.

              "Ya empezamos", dice Arraka.

              "Una profecía de cosas que podrían llegar a suceder, pero que aún no han quedado fijadas en piedra", continúa el revenant. "Escuchen con atención los acontecimientos que van a ser anunciados, y quizá logren impedir que ocurran antes de que sea demasiado tarde."

              El revenant vuelve a desaparecer y reaparece a nuestra izquierda, preparándose para hablar de nuevo, mientras el eco de su voz se intensifica para señalar el comienzo de la profecía. Después de cada línea que pronuncia, el revenant desaparece y aparece en un sitio distinto, obligándonos a todos a girar la cabeza confundidos.
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch11a_prophecy
      - condition: ch11_saved_rose = 1
        texts:
          - source: scene_text
            paragraph: 5
            text: |-
              "¡Rose!", grito. "¡¡¡Eh, Rose!!!"

              Al ver que sigue sin hacer nada, me coloco justo a su lado y empiezo a mover la mano delante de sus ojos.

              "Sin reacción...", digo, al darme cuenta de que las pupilas de Rose ni siquiera se mueven para seguir la dirección de mi mano.

              "Oh, no...", dice Melindra. "Ya he visto pasar algo así antes. Si es lo que creo que es, más vale que se preparen. Esa pelea con el sabio de antes va a parecer un paseo por el parque comparada con lo que viene ahora."

              "Menudo espectáculo les espera, desde luego", dice Arraka, y luego se ríe.

              "¿De qué están hablando las dos?", dice Hadrik. "¿Prepararnos para qué?"

              "Está empezando...", dice Melindra.
