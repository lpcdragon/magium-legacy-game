  - name: b2_ch11a_transparent
    routes:
      - condition: b2_ch11_both = 1 AND ch11_saved_slave <> 3
        texts:
          - source: scene_text
            paragraph: 31
            text: |-
              "Las dos, supongo?..."

              "Bueno", dice Arraka, "no llegué a ver el ritual de Melindra, pero a Illuna la obligaron a recrear toda la 'masacre de los bosques sagrados' hasta el último detalle. Su ritual no fue ni de lejos tan gracioso como el tuyo, porque desde el principio se dio cuenta de lo que tenía que hacer, pero aun así pude notar que estaba bastante furiosa por dentro, aunque no lo demostrara demasiado. Flower, en cambio, no dejaba de intentar salvar una y otra vez a sus amigos de la destrucción de Olmnar, incluso después de fracasar decenas de veces seguidas. Al final fue Illuna quien logró convencerla de que por fin los dejara ir, después de salir de su propio ritual y ver lo que estaba haciendo esa chica insensata."

              "¿Y qué hay de los que aún siguen dentro de sus rituales?", digo.

              "Hmm...", dice Arraka. "Creo que será más rápido enseñártelo directamente. Empecemos con el sanador."

              En un solo instante, el paisaje que me rodea cambia por completo, y todos desaparecen de delante de mis ojos salvo Flower y yo, ya que ahora me encuentro de pie frente a la casa de Rose, en la ciudad de Thilias. Cuando nos miro mejor, me doy cuenta de que Flower y yo nos hemos vuelto semitransparentes, y lo mismo le ocurre al amuleto de Arraka. Por otro lado, también veo a otra Flower y a otra versión de mí mismo que no son transparentes en absoluto y que están ocupados hablando con Rose y sus hermanos en ese mismo patio en el que nos encontramos. Hadrik, Kate y Daren también están aquí, por lo visto, y Ella también.
          - source: scene_text_2
            paragraph: 32
            text: |-
              "¡Primero, déjame darte un poco de contexto!", dice Arraka.

              "¿Qué está pasando?", digo. "¿Cómo nos trajiste hasta aquí?"

              "Shh...", me dice Arraka.

              "Rose", oigo decir a Daren. "¿Podrías enseñarme mi habitación? Lo único que quiero ahora mismo es tumbarme un rato en una cama."

              "¡Claro!", dice Rose. "¡Sígueme, te enseñaré el camino!"

              "Vale, ahora el sanador se dirige a su habitación y se va a quedar allí un rato", dice Arraka. "¿Recuerdas esta parte?"

              "Sí", digo. "Esto pasó justo después de que llegáramos por primera vez a la casa de Rose. ¿Pero por qué me enseñas esto? ¿Tiene algo que ver con el ritual de Daren?"

              "Ya te lo dije", dice Arraka. "¡Intento darte un poco de contexto! Si no, no tendría ninguna gracia. Muy bien, lo siguiente: adelantemos hasta la habitación de Daren."

              Una vez más, todo el paisaje que nos rodea cambia en un instante y ambos nos encontramos dentro de la habitación de Daren en la mansión de Rose, donde Daren está sentado en la cama, con el torso inclinado hacia delante y los codos apoyados sobre las rodillas, mientras se sostiene la cabeza con ambas manos. Igual que antes, parece totalmente ajeno a nuestra presencia.
          - source: scene_3
            paragraph: 14
            text: |-
              "Por cierto, él no puede vernos ni oírnos", me dice Arraka, mientras seguimos en nuestra forma semitransparente. "Por si no te habías dado cuenta ya."

              "Podría haber muerto...", oigo la voz de Daren reverberando por las paredes, aunque Daren sigue con la boca cerrada. "Podría haber muerto justo delante de mis ojos, y yo no habría tenido poder para salvarla..."

              "¿Qué fue eso?", le pregunto a Arraka, mientras miro a nuestro alrededor intentando encontrar el origen del sonido. "¿Eran... los pensamientos de Daren?"

              "Claro que eran sus pensamientos", dice Arraka. "¿Qué otra cosa iban a ser?"

              "¿Tienes la capacidad de leer la mente de la gente?", digo, empezando a ponerme un poco nervioso.

              "¡No, idiota!", dice Arraka. "¿Cuántas veces tengo que decirte que tus amigos están conectados al Magium ahora mismo? Leer sus pensamientos mientras están en este estado es fácil si tienes un conocimiento decente de cómo funcionan las auras. Ahora cállate y presta atención. No te traje aquí para nada."
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch11a_luggage
