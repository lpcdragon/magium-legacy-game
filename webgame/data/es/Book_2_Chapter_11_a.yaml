  - name: b2_ch11a_cabin
    texts:
      - source: scene_text
        paragraph: 20
        text: |-
          Entonces me invade un fuerte mareo, mientras siento que me arrancan la mente del cuerpo. En cuanto la luz desaparece y puedo volver a ver a mi alrededor, me doy cuenta de que sigo tirado en el suelo, pero todos los demás han desaparecido.

          Espera, no, eso no está bien... No es que los demás hayan desaparecido. Es que me han transportado a un lugar completamente distinto. Sigo en medio de un bosque, sí, pero este bosque me resulta terriblemente familiar. Como si ya hubiera estado aquí antes, en mi pasado lejano.

          Cuando decido ponerme de pie y explorar un poco, me quedo paralizado unos instantes por la impresión al darme cuenta de que mi altura ahora es mucho menor que antes. Y no solo ha cambiado mi altura. Los brazos también los tengo mucho más cortos, las manos más pequeñas y ya no llevo la misma ropa.

          "--pero casi seguro que en al menos una de las etapas habrá algún tipo de viaje en el tiempo", oigo la voz de Arraka al fondo de mi cabeza, mientras de repente recuerdo lo que me estaba diciendo hace un momento.

          Viaje en el tiempo, un cuerpo más pequeño y un bosque que me resulta familiar. Esto me da muy mala espina.

          Reviso de inmediato mis bolsillos para ver si aún llevo alguno de mis viejos objetos, pero han desaparecido todos, incluido mi dispositivo de estadísticas. Si de verdad es el bosque que creo que es, y si esa fuerte aura mágica que siento a lo lejos también pertenece a quien creo, entonces el Dios del Tiempo debe de haberme enviado de vuelta a cuando yo tenía unos trece años. ¿Pero con qué propósito?...
      - source: scene_text_2
        paragraph: 20
        text: |-
          Dejo todos esos pensamientos a un lado y echo a correr tan rápido como puedo hacia la casa que en otro tiempo llamé mi hogar. Digo que corro hacia mi casa, pero la verdad es que mi hogar era más bien una cabaña. Estaba hecha casi por completo de madera y se encontraba algo apartada del resto del pueblo, porque a mi padre le gustaba la tranquilidad. Teníamos un río cerca y podíamos sacar toda la leña que necesitábamos de este bosque, así que dependíamos bastante poco de los demás habitantes del pueblo. Incluso teníamos una pequeña parcela de tierra que cultivábamos y un establo donde guardábamos el heno. Es curioso que todavía recuerde todos estos detalles con tanta claridad, cuando llevo tantos años sin pensar en este lugar.

          En cuanto llego al borde del bosque y miro hacia la vieja cabaña, siento que el corazón me da un vuelco al ver a mi hermanita en mitad de nuestro patio delantero, justo cuando la banshee que lleva dentro está despertando y preparándose para apoderarse de su cuerpo. Esa poderosa aura mágica que irradia ella es tan siniestra como la recordaba y me recorre la espalda con escalofríos. No solo está cambiando el aura de mi hermana, también su cuerpo se está transformando en algo que ya no podría llamarse humano. Su cara parece estarse derritiendo y la piel se le está volviendo morada, mientras el resto del cuerpo empieza a deformarse lentamente.
      - source: scene_3
        paragraph: 7
        text: |-
          Mientras el burro frente a nuestro establo rebuzna con fuerza, asustado, mis padres y mi hermano pequeño están justo regresando a la casa y corren hacia el patio para ver qué le está ocurriendo a mi hermana. Siguen vivos... Mis padres siguen vivos. Esta vez no llegué demasiado tarde. Todavía puedo salvarlos. Puedo arreglar las cosas. Puedo-- espera... ¿Y qué pasa con esa prueba de la que hablaba el Dios del Tiempo? ¿Salvar a mis padres forma parte de la prueba o se supone que debería hacer otra cosa?

          No... ¡A la mierda esa prueba! Me están ofreciendo una oportunidad única en la vida para arreglar los errores de mi pasado. No voy a desaprovecharla. Esta vez no llegaré demasiado tarde. Esta vez voy a salvarlos a todos.
    choices:
      - position: 1
        text: Atacar ahora mismo a la banshee, mientras todavía sigue despertando.
        effects:
          - set:
              current_scene: b2_ch11a_attack
      - position: 2
        text: Esperar a que la banshee ataque a mis padres antes de entrar a matarla.
        effects:
          - set:
              current_scene: b2_ch11a_wait
  - name: b2_ch11a_attack
    texts:
      - source: scene_text
        paragraph: 21
        text: |-
          No podría pedir un momento mejor para atacar a la banshee. Con su despertar todavía en marcha, debería estar demasiado ocupada como para prestar atención a nada más a su alrededor. Ahora es cuando tengo que actuar.

          Corro rápidamente hacia nuestro establo, mientras el burro sigue rebuznando, y recojo la horca que estaba tirada en el suelo. ¿De verdad quiero matar a la banshee, sin embargo? En realidad no es culpa suya que se vea obligada a matar a otras personas para seguir viviendo. Quizá si intento razonar con ella... No, no, no, recuerda esa risa. Recuerda esa risa siniestra que todavía me persigue en sueños de vez en cuando, incluso después de tantos años. Esta banshee mató a mis padres a sangre fría y lo disfrutó. No es como Illuna. No se puede razonar con ella. O matas, o te matan.

          Mientras me acerco a la banshee, veo que mis padres y mi hermano ya han llegado hasta ella y están intentando hablar con ella como si siguiera siendo mi hermana.

          "¡Claire!", dice mi madre. "¡Santos dioses, qué te ha pasado!"

          "¡Tenemos que llamar a un doctor!", dice mi padre, presa del pánico. "O... a un hechicero. De esos de los que Barry siempre habla. ¡Un mago! Así se llaman. Esto parece algún tipo de enfermedad mágica. Si encontramos a un médico mago, quizá podamos--"

          "Hazte a un lado, padre...", le digo, acercándome a ellos con la horca todavía en las manos.
      - source: scene_text_2
        paragraph: 21
        text: |-
          "Barry...", dice mi padre. "¿Qué haces con esa horca? ¡Tu hermana está muy enferma! Tenemos que llevarla a un doctor."

          "Lo que tiene no tiene cura", le digo. "Tengo que matarla antes de que nos mate a todos."

          "¡Barry, qué estás diciendo?!", dice mi madre, horrorizada. "Tiene que haber una manera de salvarla. No puedes matarla así sin más. ¡Es tu hermana!"

          "Lo que ven ahí ya no es mi hermana", digo. "Es una banshee. Déjenme pasar."

          "No me importa lo que sea", dice mi padre, con una mirada resuelta mientras se coloca entre la banshee y yo. "No voy a dejar que le hagas daño a mi niña."

          "No hay tiempo para estar teniendo esta discusión", digo. "Tenemos que matarla rápido, antes de que--"

          No llego a terminar la frase, porque la banshee acaba de completar su despertar y ha aprovechado al máximo nuestra distracción para atravesarle el pecho a mi padre con la mano por la espalda, como si hubiera usado una lanza.

          "¡¡¡No!!!", grito, mientras mi padre cae al suelo, gorgoteando sangre.

          Intento lanzarme entonces hacia la banshee con la horca, pero ella ya me estaba esperando. Lo único que necesitó fue conjurar de la nada una lanza afilada de piedra y lanzármela directamente a través del cráneo, matándome antes siquiera de tener la oportunidad de alcanzarla.
    choices:
