  - name: b2_ch11a_bored
    texts:
      - source: scene_text
        paragraph: 43
        text: |-
          "Creí que simplemente estabas aburrida y decidiste traerme contigo por capricho."

          "Nah", dice Arraka. "Ese es el rollo de Eiden, no el mío. Sé que la mayor parte del tiempo no lo parece, pero rara vez hago algo sin motivo. Por ejemplo, elegí este momento concreto como nuestro destino inicial porque sabía que a esta hora estarían haciendo experimentos y habría muchos gritos. Habría sido una pena tenerte esperando en un pasillo silencioso y vacío, ¿sabes?"

          "Ugh...", digo. "Cállate de una vez y sácanos de aquí."

          "Más fácil decirlo que hacerlo", dice Arraka. "Puedo ser un genio en lo que respecta a la magia, pero tampoco puedes esperar que recorra todos estos acontecimientos en cuestión de segundos. No es como si pudiera conectarme al Magium así todos los días."

          "Hablas del Magium con toda naturalidad, pero todavía ni siquiera me has dicho qué es", digo.

          "De eso va el chiste, Barry, muchacho", dice Arraka. "Lo sigo haciendo porque sé que te frustra. Es una buena forma de no morirme de aburrimiento mientras paso por el tedioso proceso de examinar estos recuerdos."

          "¿Por lo menos puedes decirme cómo eres capaz de cambiar entre pasado y futuro con tanta facilidad?", le pregunto. "¿Y cómo es que también puedes acceder a los recuerdos de la gente y transportarnos dentro de ellos como si formaran parte de nuestra realidad?"
      - source: scene_text_2
        paragraph: 40
        text: |-
          "Cuando estás vinculada directamente al Magium del modo en que lo estamos ahora", dice Arraka, "términos como 'pasado', 'futuro', 'recuerdos' y 'realidad' pierden todo significado. Aquí dentro, todo es real e imaginario a la vez. ¡Deja que te lo demuestre!"

          Una serpiente roja gigante, con dos alas y cuatro pequeñas garras, aparece de repente delante de mí y se lanza de inmediato hacia mí con una mirada amenazadora, mientras todo su cuerpo está envuelto en llamas. Me entra un poco el pánico y doy un salto hacia atrás mientras intento sacar la daga, pero el monstruo me araña la pierna derecha con una de sus garras y luego desaparece tan rápido como apareció.

          "Arraka, ¿qué has hecho?", pregunta Flower, horrorizada, mientras Illuna se acerca a mí para curarme.

          "¡Relájate!", dice Arraka. "Ninguno de los dos puede morir aquí dentro. Ese arañazo no dolió, ¿verdad?"

          "Ahora que lo dices, supongo que no", digo, justo cuando Illuna deja de curarme de golpe al darse cuenta de que nunca estuve en peligro de verdad.

          "Eso es porque estos no son nuestros cuerpos reales", dice Arraka. "Solo son nuestras proyecciones. Nuestros cuerpos reales siguen justo donde los dejamos, atascados en uno de esos trances raros de ojos brillantes. Lo que intentaba mostrarte es que puedo hacer lo que me dé la gana mientras estamos aquí. Es como mi propio patio de recreo. Obviamente, no puedo interferir en lo que hacen tus amigos, porque en realidad no existimos en sus mundos, pero en lo que respecta a observar, mis opciones son ilimitadas."
      - source: scene_3
        paragraph: 20
        text: |-
          "Entonces, ¿estás diciendo que mis amigos tampoco pueden morir?", digo. "Ahora mismo solo están en un mundo imaginario, ¿no?"

          "No, eso solo se aplica a nosotros, porque somos proyecciones, como ya dije", me dice Arraka. "Los mundos a los que han sido transportados tus amigos son muy reales. Lo que pasa es que no son NUESTRO mundo. Son mundos paralelos, parecidos al nuestro, en los que el futuro nunca llegó a ocurrir. Evidentemente, ninguno de los cambios que hagan allí afectará en lo más mínimo a nuestro mundo, pero ellos no tienen forma de saberlo. ¿No te pareció extraño que lograras superar tu propio ritual aunque normalmente habría sido imposible reproducir exactamente todas las acciones que tomaste hace quince años hasta el último detalle? Eso es porque no eran las leyes del tiempo las que te impedían hacer lo que querías. Era simplemente Selkram, jugando con tu cabeza."

          "El Dios del Tiempo...", digo, mientras me lleno de un odio incontrolable solo por pronunciar su nombre. "¿Nos está observando ahora mismo?"
