  - name: b2_ch11a_prophecy
    routes:
      - condition: ch11_saved_rose = 0
        texts:
          - source: scene_text
            paragraph: 8
            text: |-
              "Cuando dos viejos enemigos choquen por última vez,

              Un gran desastre que una vez fue evitado

              Ya no podrá impedirse de la misma manera.

              Un continente entero yace en ruinas,

              Mientras una sola risa compuesta por distintas voces

              Resuena con fuerza por todo el reino."

              En cuanto el revenant termina de recitar la profecía, deja de moverse y vuelve a quedarse mirando al vacío, con una expresión vacía en el rostro.

              Una profecía sobre un gran desastre... Dos viejos enemigos... ¿Significa eso que teníamos razón? ¿La calamidad sobre la que Eiden nos advirtió ocurrirá cuando se enfrente a Tyrath? Pero, por otro lado, la profecía también mencionó una risa compuesta por distintas voces. Y solo conozco a una persona que encajaría con esa descripción...

              "Arraka...", digo. "Esta profecía fue sospechosamente específica con lo de esa única risa compuesta por distintas voces. No sabrás algo sobre este 'gran desastre', ¿verdad?"
          - source: scene_text_2
            paragraph: 6
            text: |-
              "Oye, si quieres, yo podría hacer que esa profecía se cumpliera en menos de un día", dice Arraka. "Así no tendrían que seguir perdiendo tiempo intentando descifrarla. Lo único que tienen que hacer es sacarme de este amuleto. ¿Qué dicen?"

              "Creo que prefiero resolverlo por mi cuenta, si no te importa", digo.

              "Allá tú", dice Arraka.

              "Entonces, ¿eso era todo?...", dice Daren. "¿La profecía ha terminado?"

              "Si preguntas solo por la profecía, sí, ha terminado", dice Melindra.

              "Entonces estás diciendo que deberíamos esperar algo más justo después de la profecía, ¿no?", dice Daren.

              "Solo si todo ocurre igual que hace seiscientos años", dice Melindra. "La última vez que tuve el honor de presenciar la profecía de una tejedora del tiempo, no tuve que esperar mucho hasta que--"
          - source: scene_3
            paragraph: 2
            text: |-
              Melindra se interrumpe, porque de pronto todos sentimos una inmensa presión en el aire, que nos dificulta respirar, mientras el cielo parece temblar bajo la pura fuerza del poder mágico que ha inundado toda nuestra zona. A medida que nos adaptamos poco a poco a la presión y empezamos a respirar con más normalidad, el revenant va elevándose cada vez más en el aire, mientras sus ojos siguen brillando de color amarillo, fijos en la nada.

              "¡¿Qué demonios?!", grita Hadrik. "¿Qué es esta locura de poder mágico? Arraka sigue dentro del amuleto, ¿verdad?"

              "¡Ja, ja, ja, ja, ja!", se ríe Arraka desde dentro de su amuleto.

              "Esto no es obra de Arraka", dice Melindra, mientras lucha por mantener la calma. "Ya se los dije. Esa pelea con el sabio de antes va a parecer poca cosa comparada con lo que está a punto de suceder."
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch11a_prophecy2
