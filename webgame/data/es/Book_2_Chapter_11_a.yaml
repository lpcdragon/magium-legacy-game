            paragraph: 12
            text: |-
              "Arraka tiene razón", digo. "No deberíamos tener que arrodillarnos ante nadie. Ni siquiera ante los dioses. Pase lo que pase, pienso mantenerme firme."

              En cuanto termino de hablar, de repente siento un dolor intensísimo en el lado izquierdo del pecho y, al mirar hacia abajo, veo con horror que me han arrancado el corazón del cuerpo y que ahora tengo un enorme agujero ensangrentado en el pecho, justo donde antes estaba mi corazón.

              "¡¡¡Barry!!!", grita Kate, desesperada.

              Todo empieza a volverse mucho más frío y noto escalofríos por todo el cuerpo. La luz ante mis ojos comienza a apagarse lentamente, mientras voy perdiendo la consciencia poco a poco. Justo antes de que todo se vuelva negro, sin embargo, recupero de repente los sentidos al oír a Kate gritar mi nombre al revés. Inmediatamente después, mi corazón vuelve a meterse en mi pecho, mi herida se cierra por completo y toda la sangre desaparece de mi camisa casi al instante. En cuanto termina el hechizo de inversión temporal, empiezo a respirar muy fuerte y muy deprisa, empapado en sudor, como si acabara de despertarme de una pesadilla terrible.

              Arraka se ríe al verme la cara.

              "Supongo que olvidé que él también puede invertir el tiempo, siempre que tenga control sobre la tejedora del tiempo", dice Arraka. "¡Error mío!"
