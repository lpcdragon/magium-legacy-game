  - name: b2_ch11a_kneel
    routes:
      - condition: b2_ch11_kneel = 1
        texts:
          - source: scene_text
            paragraph: 11
            text: |-
              A pesar de lo que dijo Arraka, decido no arriesgar la seguridad de todos por culpa de mi orgullo y me arrodillo frente al Dios del Tiempo, igual que Melindra.

              "Si quieres verme arrodillado, espero que hayas traído una silla", le dice Daren al Dios del Tiempo, "porque vas a tener que esperar un buen rato."

              Justo cuando Daren termina de hablar, vemos cómo una fuerza invisible le arranca el corazón directamente del pecho, atravesando también la armadura de placas, mientras la sangre empieza a salpicar por todas partes.

              "Oh, no...", dice Hadrik, mientras el resto de nosotros miramos a Daren, demasiado impactados para hablar.

              Cuando Daren está a punto de desplomarse al suelo, oigo a Hadrik empezar a hablar al revés y luego veo cómo el corazón de Daren vuelve por sí solo a meterse en su pecho, mientras toda la sangre del suelo y de su armadura desaparece al instante. En cuanto termina el hechizo de inversión temporal, Daren empieza a respirar muy fuerte y muy deprisa, empapado en sudor, como si acabara de despertarse de una pesadilla terrible.

              Arraka se ríe al verle la cara.

              "Supongo que olvidé que él también puede invertir el tiempo, siempre que tenga control sobre la tejedora del tiempo", dice Arraka. "¡Error mío!"
          - source: scene_text_2
            paragraph: 9
            text: |-
              "No voy a repetirme otra vez", dice el Dios del Tiempo. "Arrodíllense."

              Kate y los demás intercambian unas miradas vacilantes, pero no parece que ninguno tenga intención de obedecer las órdenes del dios, ni siquiera después de la demostración de poder que acaba de dar.

              "Lo siento", dice Hadrik, con media sonrisa, mientras intenta imitar su habitual tono seguro. "Mi médico me dijo que arrodillarme es malo para mi--"

              "¡He dicho que SE ARRODILLEN!", grita el dios, y entonces una inmensa presión nos empuja a todos contra el suelo, incluidos Melindra y yo, que ya estábamos arrodillados.

              Ahora todos estamos siendo aplastados contra el suelo rocoso por una fuerza increíble, y ya siento el dolor de mis órganos internos sangrando, mientras la enorme presión que tenemos encima se vuelve cada vez más insoportable. Para asegurarse de que no nos mata, el Dios del Tiempo sigue lanzando hechizos de inversión temporal cada diez segundos más o menos, curando así nuestras heridas internas solo para que vuelvan a formarse una y otra vez durante los siguientes minutos.

              Durante ese tiempo, soy incapaz de prestar atención a nada de lo que me rodea. Cada gramo de mi energía se concentra en soportar el dolor. Ya no puedo distinguir si los gritos que oigo vienen de mí o de mis amigos. Es como si hubiera entrado voluntariamente en una especie de trance, intentando fundirme con el dolor. Intentando dejar que fluya a través de mí. Por mucho que lo intente, sin embargo, el dolor vuelve a dominarme una y otra vez, y entonces tengo que recuperar la concentración desde cero.
          - source: scene_3
            paragraph: 4
            text: |-
              "¿Puedes PARAR ya con las inversiones temporales?", dice Arraka, exasperada, al cabo de un rato. "¡Me estás mareando!"

              Al oír las palabras de Arraka, el Dios del Tiempo lanza un último hechizo de inversión temporal y luego reduce la presión que había sobre nosotros en el aire, asegurándose de que ya no nos esté haciendo daño, aunque todavía nos mantiene pegados al suelo.

              "¡Graaacias!", dice Arraka, en el mismo tono exasperado.

              "Veo que vivir entre estos mortales te ha enseñado algunos modales básicos que ya venían haciendo falta, Arraka", dice el Dios del Tiempo. "Es lamentable que no pudieras aprenderlos antes de que nos viéramos obligados a desterrarte de nuestro reino."

              "¿Obligados?...", dice Arraka. "¡Ja! Solo lo hicieron porque me tenían miedo. Es gracioso, porque cuando ambos vivíamos en el plano mágico, no te tenía por alguien cobarde. Y aun así, huiste de mí dos veces. Una con el destierro y otra hace seiscientos años. ¿Qué pasó con aquel duelo nuestro que quedó sin terminar, eh? ¿No dijiste que tarde o temprano ajustaríamos cuentas?"

              "Y lo haremos", dice el Dios del Tiempo. "En cuanto ambos volvamos a estar en nuestras condiciones óptimas. No querrás enfrentarte a mí desde dentro de un amuleto, ¿verdad?"
        choices:
