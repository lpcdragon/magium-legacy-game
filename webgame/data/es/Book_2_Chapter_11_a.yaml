          "Oye, dame un respiro, ¿quieres?", dice Arraka. "Yo también podría haber sido normal si no hubiera presenciado cómo asesinaban brutalmente a mis padres delante de mis ojos cuando apenas era una niña..."

          "¿En serio?...", digo.

          "¡No, claro que no, imbécil!", dice Arraka. "Las banshees no tienen padres. ¿Qué pasa, te crees Flower o qué?"

