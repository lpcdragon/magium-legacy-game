            paragraph: 19
            text: |-
              "En cuanto todos los preparativos estén en su sitio", dice el Dios del Tiempo. "Pero eso no significa que debas pasar el tiempo que queda conversando con estas criaturas inferiores. ¿Por qué te molestas en responder a todas y cada una de sus preguntas? Dudo mucho que esta gente supere siquiera la primera fase del ritual."

              Arraka se ríe.

              "Creo que te vas a sorprender mucho con su próxima actuación", dice. "No son de los que se rinden fácilmente."

              "Ya veremos eso muy pronto...", dice el Dios del Tiempo.

              Entonces vuela hasta la posición del revenant, la agarra por la barbilla y le gira la cabeza a un lado y a otro varias veces mientras acerca su cara a la suya.

              "Hmm...", dice el Dios del Tiempo. "Percibo rastros del aura del Dios de la Muerte en esta tejedora del tiempo. ¿Un revenant, quizá? O tal vez alguna otra forma de no-muerta. Bueno, sea lo que sea, acaba de ganarse una invitación a mi ritual. Déjame sacarla de su trance."

              Después de terminar de hablar, el Dios del Tiempo suelta al revenant y luego mueve la mano delante de su cara, haciendo que la luz brillante se desvanezca de sus ojos. Después de recuperar los sentidos, el revenant mira a su alrededor con su calma mirada inexpresiva y luego se dirige directamente al Dios del Tiempo.
          - source: scene_text_2
            paragraph: 18
            text: |-
              "Veo que me has sacado de mi trance", dice el revenant. "¿Debo entender que vas a obligarme a participar en tu ritual?"

              "Qué perspicaz por tu parte", dice el Dios del Tiempo. "Parece que Ulruk te ha instruido bien."

              "No hizo falta que me instruyera", dice el revenant. "El hechizo que me trajo a este mundo implantó en mi mente gran parte del conocimiento del Dios de la Muerte, incluidos detalles sobre tus rituales y sobre tu personalidad. Teniendo en cuenta esos factores, no me resultó difícil predecir que tu primera reacción al descubrirme sería intentar 'castigar' al Dios de la Muerte por inmiscuirse en tus asuntos. ¿Y qué mejor forma de castigarlo que a través de mí, su fiel seguidora?"

              "Por fin, Ulruk ha encontrado una seguidora capaz de compensar su falta de seso", dice el Dios del Tiempo. "Pero veamos hasta dónde puede llevarte el tuyo en las pruebas que vienen. El ritual está a punto de comenzar. Prepárate."

              Hace una pausa.

              "Oh, y para que quede perfectamente claro...", dice el Dios del Tiempo, con voz más alta. "El ritual afectará a todas las personas que se encuentren en esta zona general y que no estén congeladas en el tiempo en este momento. Eso incluye también a quienes puedan estar escondidos detrás de un hechizo de invisibilidad, observándonos desde la distancia."

              "¡Ja!", dice Arraka. "¡Lo sabía!"

              "Que comience el ritual", dice el dios, y entonces una luz blanca cegadora inunda toda nuestra zona, haciendo imposible ver más allá de mis propias manos.
