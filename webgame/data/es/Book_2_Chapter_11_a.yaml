scenes:
  - name: b2_ch11a_intro
    effects:
      - set:
          successful_checks:
            - 'Punto de control alcanzado: Partida guardada.'
        condition: checkpoint_rich = 1
    routes:
      - condition: ch11_saved_rose = 0
        texts:
          - source: scene_text
            paragraph: 2
            text: |-
              "Tienes razón...", le dice Daren a Hadrik, después de mirar a su alrededor durante unos segundos. "El tiempo de verdad está congelado. ¿Podría ser obra de Eiden?"

              "No es Eiden", dice Arraka. "Si Eiden estuviera aquí, ya se los habría dicho, ¿recuerdan?"

              "Entonces, ¿quién es?", pregunta Daren. "¿Quién congeló el tiempo?"

              "¿Por qué no miran y lo comprueban ustedes mismos?", dice Arraka. "Está saliendo del bosque y viene hacia ustedes en este mismo instante."

              "¿A ella?...", dice Daren.

              Cuando todos nos fijamos en la persona que se acerca lentamente hacia nosotros, la reconocemos de inmediato. Rose avanza ahora muy despacio hacia nosotros, mientras sus ojos brillan con una intensa luz amarilla. Tiene una expresión completamente vacía y mira fijamente al frente, sin reconocer nuestra presencia.
          - source: scene_text_2
            paragraph: 2
            text: |-
              "El revenant, otra vez...", dice Daren, con una mirada fría. "Vamos a ver qué quiere."

              Todos hacemos lo que dice Daren y nos acercamos al revenant, hasta quedar justo frente a ella. En cuanto llegamos, el revenant se detiene en seco y sigue mirando recto al frente, con la misma expresión vacía en la cara.

              "¿Por qué viniste aquí, revenant?", le pregunta Daren. "¿Y por qué congelaste el tiempo?"

              El revenant no reacciona de ningún modo a las palabras de Daren. Ni siquiera parece consciente de nuestra presencia. Es como si estuviera en una especie de... trance.
        effects:
          - set:
              hearing_aux: hearing_aux + 3
              hearing: hearing + 3
              b2_ch11_added_hearing: 1
            condition: b2_ch11_added_hearing = 0 AND b2_ch6_stat = 1 AND b2_ch9_channel = 1 AND b2_ch10_activate = 1
        choices:
          - position: 1
            text: Seguir intentando hablar con ella.
            effects:
              - set:
                  current_scene: b2_ch11a_keep
                  checkpoint_rich: 0
          - position: 2
            text: Agarrarla por los brazos e intentar sacarla del trance a sacudidas.
            effects:
              - set:
                  current_scene: b2_ch11a_grab
                  checkpoint_rich: 0
      - condition: ch11_saved_rose = 1
        texts:
          - source: scene_text
            paragraph: 3
            text: |-
