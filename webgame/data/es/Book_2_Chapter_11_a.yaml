  - name: b2_ch11a_grab
    routes:
      - condition: ch11_saved_rose = 0
        texts:
          - source: scene_text
            paragraph: 6
            text: |-
              Me acerco al revenant e intento agarrarla por los brazos. En cuanto la toco, una fuerte fuerza mágica me empuja hacia atrás y me hace caer de espaldas.

              "¿Qué demonios?...", digo, mientras me levanto del suelo lentamente.

              "Oh, no...", dice Melindra. "Ya he visto pasar algo así antes. Si es lo que creo que es, más vale que se preparen. Esa pelea con el sabio de antes va a parecer un paseo por el parque comparada con lo que viene ahora."

