  - name: b2_ch11a_wait
    texts:
      - source: scene_text
        paragraph: 22
        text: |-
          Corro rápidamente hacia nuestro establo, mientras el burro sigue rebuznando, y recojo la horca que estaba tirada en el suelo. ¿De verdad quiero matar a la banshee, sin embargo? En realidad no es culpa suya que se vea obligada a matar a otras personas para seguir viviendo. Quizá si intento razonar con ella... No, no, no, recuerda esa risa. Recuerda esa risa siniestra que todavía me persigue en sueños de vez en cuando, incluso después de tantos años. Esta banshee mató a mis padres a sangre fría y lo disfrutó. No es como Illuna. No se puede razonar con ella. O matas, o te matan.

          Mientras me acerco a la banshee, veo que mis padres y mi hermano ya han llegado hasta ella y están intentando hablar con ella como si siguiera siendo mi hermana.

          "¡Claire!", dice mi madre. "¡Santos dioses, qué te ha pasado!"

          "¡Tenemos que llamar a un doctor!", dice mi padre, presa del pánico. "O... a un hechicero. De esos de los que Barry siempre habla. ¡Un mago! Así se llaman. Esto parece algún tipo de enfermedad mágica. Si encontramos a un médico mago, quizá todavía podamos curarla. Tiene que haber un mago en alguno de los pueblos vecinos. Barry, ahí estás. ¡Ven rápido! Tu hermana está muy enferma. ¿Conoces a algún médico mago por nuestra zona?"

          "No hay magos blancos en ninguno de los pueblos de los alrededores", le digo, mientras me acerco lentamente a él con la horca en la mano. "Y aunque los hubiera, ya sería demasiado tarde para ella."

          "¿Qué estás diciendo?...", dice mi padre. "¿Y qué haces con esa horca?"
      - source: scene_text_2
        paragraph: 22
        text: |-
          "Olvida la horca", digo. "No le quites los ojos de encima a Claire. En cuestión de segundos va a convertirse en un monstruo y no dudará en atacarte."

          "¿Claire? ¿Un monstruo?...", dice mi padre, volviéndose hacia ella con aprensión. "No, eso no puede ser lo que está pasando de verdad... Estás bromeando, ¿verdad, Barry?"

          "No le quites los ojos de encima", le repito, con tono serio. "Si intenta matarte, no voy a contenerme contra ella."

          Justo cuando termino de hablar, la banshee ya había acabado con su despertar y se preparaba para lanzar su primer ataque. Rápidamente empujo a mi padre fuera de su camino con una mano y, con la otra, mantengo el agarre sobre mi horca. La banshee intentaba ensartar a mi padre con la mano desnuda, pero debido a mi intervención solo logra herirme levemente en el lado izquierdo del abdomen.

          Mi madre jadea al ver la sangre gotear de mí.

          "¡Barry!", grita, con miedo en la voz.

          No le doy a la banshee tiempo para atacarme de nuevo y le hundo la horca directamente en el pecho, sosteniendo el arma con ambas manos. La banshee lanza un grito muy fuerte y estridente, pero no logra reunir la fuerza para otro ataque y, al cabo de unos segundos más, tanto sus gritos como sus espasmos llegan a su fin, junto con su vida.
      - source: scene_3
        paragraph: 8
        text: |-
          Al soltar la horca de mis manos, junto con el cuerpo de la banshee, mi madre viene a abrazarme con fuerza y luego me sostiene entre sus brazos durante unos segundos, sin decir nada.

          "Gracias...", dice mi madre. "Muchas gracias por salvarlo. No puedo ni imaginar lo que habría sido perder a mi hija y a mi marido en el mismo día."

          Se aparta de repente al fijarse en mi herida.

          "Lo siento", dice. "No debería haber estado presionando tu herida así. Voy a buscar unas vendas y algo de alcohol para fricciones a la casa. Parece que solo es una herida superficial, así que debería bastar con limpiarla un poco. ¡Ahora vuelvo!"

          Entonces corre hacia la casa, mientras mi padre sigue aparentemente en estado de shock por lo ocurrido y mi hermano llora de fondo.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch11a_changed
  - name: b2_ch11a_changed
    texts:
      - source: scene_text
        paragraph: 23
        text: |-
          Lo hice. De verdad lo hice. Cambié el pasado. Aunque tenga que vivir toda mi vida otra vez hasta llegar a los veintiocho años, igualmente habrá merecido la pena. Ni siquiera con magia me habría atrevido a soñar que algo así fuera posible. Ahora, mientras logre averiguar en qué consiste el ritual del Dios del Tiempo y cómo sobrevivirlo, debería poder--

          El hilo de mis pensamientos se interrumpe por un mareo extremo, mientras toda la zona vuelve a inundarse de una luz blanca intensa. Igual que antes, tengo la sensación de que me arrancan la consciencia del cuerpo y luego la luz se desvanece, mientras vuelvo a encontrarme en medio de un bosque demasiado familiar.

          No... No puede ser...
      - source: scene_text_2
        paragraph: 23
        text: |-
          Miro rápidamente hacia abajo para confirmar que estoy en el mismo cuerpo de trece años y luego echo a correr hacia mi casa tan rápido como puedo. No sé por qué corro. Mi sentido mágico basta para darme toda la información que necesito. El aura de la banshee que posee a mi hermana es tan fuerte como la primera vez que me enviaron atrás en el tiempo. También percibo que mis padres y mi hermano pequeño aún no han llegado a la casa. Lo percibo todo. Entonces, ¿por qué estoy corriendo?...

          En cuanto llego al borde del bosque y miro hacia nuestra casa, veo a mi hermana transformarse en una banshee, igual que antes. Todo lo que hice no sirvió de nada. Va a volver a pasar. Y soy el único que puede impedirlo.
    choices:
      - position: 1
        text: Intentar salvar otra vez a mis padres.
        effects:
          - set:
              current_scene: b2_ch11a_daylight
              b2_ch11_save_parents: 1
      - position: 2
        text: Dejar que mis padres mueran.
        effects:
          - set:
              current_scene: b2_ch11a_restrain
              b2_ch11_save_parents: 0
  - name: b2_ch11a_daylight
    texts:
      - source: scene_text
        paragraph: 24
        text: |-
          Corro hacia el establo tan rápido como puedo y recojo del suelo la horca, igual que la vez anterior. Sin pensarlo siquiera, corro a toda velocidad hacia la banshee y, antes de que mis padres y mi hermano puedan llegar hasta ella, le atravieso el pecho.

          Esta tiene que ser la buena. Esta vez hice todo perfecto. No me hirieron, no interactué con ninguno de mis padres y maté a la banshee antes de que siquiera tuviera la oportunidad de completar su despertar. Esto tiene que ser lo que el ritual quiere de mí, ¿no? Si no, ¿por qué me habría enviado aquí?

          "Barry...", dice mi madre, con lágrimas en los ojos. "¿Qué has hecho?"

          Cuando miro al suelo para ver el cadáver de la banshee que acabo de matar, descubro con espanto que su cuerpo ha vuelto a la forma original que tenía mi hermana antes de que empezara el despertar. Mientras mi madre aprieta contra sí el cadáver sin vida de mi hermana, mi padre me mira con puro desprecio en los ojos, mientras una furia silenciosa se apodera poco a poco de él.

          "La mataste...", dice mi padre. "La mataste a sangre fría. Pequeño bastardo. ¿Así es como nos pagas por haberte acogido? ¿Por tratarte como si fueras nuestro propio hijo?"

          "¡Jonathan, basta!", dice mi madre, con una súbita mirada de pánico en los ojos.
      - source: scene_text_2
        paragraph: 24
        text: |-
          "No, Helen", dice mi padre, con la misma mirada oscura de antes, sin perderme de vista. "El chico necesita saberlo. QUIERO que lo sepa. Barry... quiero que recuerdes lo que estoy a punto de decirte cada uno de los días que pases pudriéndote en prisión. Tú NO eres nuestro hijo. Nunca lo fuiste. Tus verdaderos padres eran una pareja de forasteros que se mudaron a nuestro remoto pueblo menos de un año antes de que nacieras. Los asesinaron a plena luz del día unos años después unos matones encapuchados que de algún modo luego desaparecieron sin dejar rastro y, como ya no quedaba nadie para cuidarte, Helen y yo decidimos acogerte. Pero lo hicimos solo por lástima y porque nadie más te quería. ¿Lo entiendes? ¡Nadie te quería! ¡Nadie te que--"

          Las últimas palabras de mi padre quedaron completamente ahogadas por el sonido de mi madre abofeteándolo con muchísima fuerza en la cara.

          "¡He dicho que basta!", dice mi madre, mirándolo con determinación mientras se seca una lágrima del ojo.
    effects:
      - set:
          ac_b2_ch11_hidden: 1
        achievement:
          id: ac_b2_ch11_hidden
          title: Una verdad oculta
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch11a_daylight2
  - name: b2_ch11a_restrain
    texts:
      - source: scene_text
        paragraph: 25
        text: |-
          Mientras me quedo allí de pie e intento decidir mi siguiente movimiento, un pensamiento oscuro me cruza de repente la mente respecto a un escenario que he evitado por completo considerar hasta este momento. ¿Y si este ritual no va de salvar a mis padres? ¿Y si la única razón por la que el Dios del Tiempo me envió aquí fue obligarme a revivir mis errores del pasado y mostrarme lo impotente que soy para cambiarlos? Arraka sí mencionó que estos rituales están pensados para explotarnos en beneficio del propio dios. Y, después de todo lo que el Dios del Tiempo nos ha hecho, no tendría ningún sentido que quisiera ayudarnos a cambiar el pasado por bondad de corazón.

          Cuanto más lo pienso, más sentido tiene. No es como si el 'Dios del Tiempo' fuera un dios de verdad. No creó el tiempo. No tiene ningún control sobre él. La única manera de deshacer algo que ya ha ocurrido es mediante un hechizo de inversión temporal. Si la muerte de mis padres no ha sido deshecha con magia, entonces mi presencia aquí es irrelevante. Simplemente me veré obligado a repetir estos mismos acontecimientos una y otra vez, hasta tomar exactamente las mismas decisiones que tomé cuando tenía trece años. Nunca hubo otra opción. Fui un idiota por pensar lo contrario.

          Empiezo a retroceder lentamente hacia el interior del bosque, mientras hago todo lo posible por mantener la calma. No hay otra salida. Solo tengo que pasar por esto una vez más y entonces habrá terminado.
      - source: scene_text_2
        paragraph: 25
        text: |-
          Me detengo a varias decenas de metros del borde del bosque y espero allí a que mis padres intenten hablar con la banshee. No puedo dejar que ninguno de los dos me vea. Tengo que hacerlo todo exactamente igual que hace quince años. Tengo que llegar tarde.

          Cuando empiezo a oír los gritos de mis padres, mientras los matan, me entra un impulso repentino de salir corriendo y salvarlos, pero consigo contenerme. No hay nada que pueda hacer por ellos. Tengo que mantenerme fuerte.

          En cuanto dejo de oír sus voces, salgo corriendo del bosque tan rápido como puedo y entro en el establo para agarrar la horca. Mi hermano ahora está huyendo de la banshee, justo como recuerdo que hizo hace tantos años. Mientras ella está ocupada persiguiéndolo, la banshee es un blanco fácil. Rápidamente le rodeo y le hundo la horca por la espalda, atravesándole el estómago. La banshee intenta darse la vuelta y atacarme, pero está demasiado debilitada por su despertar. Al final deja de moverse y cae al suelo, mientras yo suelto la horca para que caiga con ella.
      - source: scene_3
        paragraph: 9
        text: |-
          Al mirar hacia los cadáveres de mis padres, tirados cerca de la banshee, no puedo evitar sentir un dolor agudo en la zona del pecho, alrededor del corazón, aunque se me pasa poco después. Es la segunda vez que no consigo salvarlos. No... No puedo pensar así. Mis padres ya estaban muertos. Esto no fue diferente de un sueño. Un sueño terrible que por fin ha terminado--

          Una luz blanca intensa me envuelve de repente, mientras mi consciencia vuelve a ser transferida a otro cuerpo. Cuando la luz y el mareo se disipan, me encuentro una vez más en el mismo bosque, mientras el aura de mi hermana se deja sentir con total claridad a lo lejos.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch11a_pitchfork
  - name: b2_ch11a_daylight2
    texts:
      - source: scene_text
        paragraph: 26
        text: |-
          Entonces se acerca a mí y me pone las manos sobre los hombros, mirándome directamente a los ojos.

          "Barry, siento muchísimo lo que te ha dicho tu padre...", me dice mi madre, mientras aún intenta contener las lágrimas de antes. "Estoy segura de que no quiso decir todas esas cosas horribles. Debió de perder los nervios por la conmoción de lo ocurrido. No es verdad que no te quisiéramos. Siempre te hemos querido, aunque no fueras nuestro hijo de sangre."

          Hace una pausa de un segundo para secarse con la manga las lágrimas que se le están formando en los ojos.
      - source: scene_text_2
        paragraph: 26
        text: |-
          "Y respecto a tu hermana...", continúa mi madre. "No puedo creer que la mataras sin tener una razón. Todos pudimos sentir el aura mágica poderosa y antinatural que salía de tu hermana hace apenas unos minutos, y también pudimos ver desde lejos en qué forma monstruosa se había convertido antes de que la mataras. Yo... no sé nada de magia, y tu padre tampoco. Pero a ti siempre te fascinó, y siempre aprovechaste cada oportunidad que tuviste para aprender más sobre ella. Si esa cosa en la que se estaba convirtiendo tu hermana era lo bastante peligrosa como para que tuvieras que matarla, estoy dispuesta a confiar en tu palabra, por doloroso que sea para mí aceptarlo. Pero tienes que darme tu palabra. Tienes que jurarme que no había otra salida. Barry, ¿puedes jurármelo?"

          "¡Sí, lo juro!", digo. "No hay forma de que yo hubiera--"

          No sirve de nada. Ya no puedo hablar. El mareo vuelve a apoderarse de mí y siento que me arrancan del cuerpo, mientras la luz brillante me ciega igual que las dos veces anteriores. Cuando desaparecen tanto el mareo como la luz, me encuentro en el mismo sitio que ya conozco demasiado bien, mientras el aura de mi hermana se siente con claridad más allá del borde del bosque, tan fuerte como siempre.
    choices:
      - position: 1
        text: Seguir intentando salvar a mis padres
        effects:
          - set:
              current_scene: b2_ch11a_trying
              b2_ch11_save_parents: 2
      - position: 2
        text: Dejar que mis padres mueran
        effects:
          - set:
              current_scene: b2_ch11a_spotted
  - name: b2_ch11a_trying
    texts:
      - source: scene_text
        paragraph: 27
        text: |-
          No... No puedo dejar que termine así. No cuando estoy tan cerca de salvarlos. Incluso después de todo lo que mi padre acaba de decirme, sigo sin poder odiarlo. Después de todo, me vio asesinar brutalmente a su niñita ante sus propios ojos. Y mi madre estaba dispuesta a confiar en mí incluso en estas circunstancias. No puedo rendirme con ellos así sin más. Voy a encontrar una forma de salvarlos, pase lo que pase.

          Pasé la siguiente hora más o menos tratando de averiguar qué podía estar fallando en lo que hacía. Probé todo lo que se me ocurrió. Maté a la banshee con armas distintas, la maté antes y después de que mis padres intervinieran, intenté razonar con la banshee antes de matarla e incluso conseguí que mi padre la matara él mismo una vez.

          Todo para nada. Cada vez que parecía que por fin iba a funcionar, simplemente me enviaban otra vez atrás en el tiempo y tenía que empezar de cero. También estuve a punto de morir varias veces. No estoy seguro de cómo funcionaría este ritual si muriera, pero teniendo en cuenta el poco interés que el Dios del Tiempo parecía mostrar por nuestras vidas, no me sorprendería nada que simplemente me quedara muerto, sin ningún tipo de inversión temporal que viniera a salvarme.
      - source: scene_text_2
        paragraph: 27
        text: |-
          Mientras me quedo allí de pie e intento decidir mi siguiente movimiento, un pensamiento oscuro me cruza de repente la mente respecto a un escenario que he evitado por completo considerar hasta este momento. ¿Y si este ritual no va de salvar a mis padres? ¿Y si la única razón por la que el Dios del Tiempo me envió aquí fue obligarme a revivir mis errores del pasado y mostrarme lo impotente que soy para cambiarlos? Arraka sí mencionó que estos rituales están pensados para explotarnos en beneficio del propio dios. Y, después de todo lo que el Dios del Tiempo nos ha hecho, no tendría ningún sentido que quisiera ayudarnos a cambiar el pasado por bondad de corazón.

          Cuanto más lo pienso, más sentido tiene. No es como si el 'Dios del Tiempo' fuera un dios de verdad. No creó el tiempo. No tiene ningún control sobre él. La única manera de deshacer algo que ya ha ocurrido es mediante un hechizo de inversión temporal. Si la muerte de mis padres no ha sido deshecha con magia, entonces mi presencia aquí es irrelevante. Simplemente me veré obligado a repetir estos mismos acontecimientos una y otra vez, hasta tomar exactamente las mismas decisiones que tomé cuando tenía trece años. Nunca hubo otra opción. Fui un idiota por pensar lo contrario.

          Empiezo a avanzar lentamente hacia mi vieja casa, mientras hago todo lo posible por mantener la calma. No hay otra salida. Solo tengo que pasar por esto una vez más y entonces habrá terminado.

          Mientras camino por el bosque, me aseguro de no llegar a la cabaña demasiado pronto, para que ni mis padres ni la banshee me vean. Tengo que hacerlo todo exactamente igual que hace quince años. Tengo que llegar tarde.
      - source: scene_3
        paragraph: 10
        text: |-
          Cuando llego al borde del bosque, puedo oír los gritos de mis padres, mientras mi hermana los mata uno por uno. No hay nada que pueda hacer por ellos. Tengo que mantenerme fuerte.

          En cuanto dejo de oír sus voces, salgo corriendo del bosque tan rápido como puedo y entro en el establo para agarrar la horca. Mi hermano ahora está huyendo de la banshee, justo como recuerdo que hizo hace tantos años. Mientras ella está ocupada persiguiéndolo, la banshee es un blanco fácil. Rápidamente le rodeo y le hundo la horca por la espalda, atravesándole el estómago. La banshee intenta darse la vuelta y atacarme, pero está demasiado debilitada por su despertar. Al final deja de moverse y cae al suelo, mientras yo suelto la horca para que caiga con ella.

          Al mirar hacia los cadáveres de mis padres, tirados cerca de la banshee, no puedo evitar sentir un dolor agudo en la zona del pecho, alrededor del corazón, aunque se me pasa poco después. Es la segunda vez que no consigo salvarlos. No... No puedo pensar así. Mis padres ya estaban muertos. Esto no fue diferente de un sueño. Un sueño terrible que por fin ha terminado--

          Una luz blanca intensa me envuelve de repente, mientras mi consciencia vuelve a ser transferida a otro cuerpo. Cuando la luz y el mareo se disipan, me encuentro una vez más en el mismo bosque, mientras el aura de mi hermana se deja sentir con total claridad a lo lejos.
