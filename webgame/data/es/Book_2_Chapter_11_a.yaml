  - name: b2_ch11a_underground
    texts:
      - source: scene_text
        paragraph: 42
        text: |-
          Al mirar a mi alrededor, veo que nuestro entorno ha cambiado por completo en cuestión de segundos y ahora estamos situados en medio de un corredor subterráneo muy oscuro, con apenas unas pocas antorchas tenues como única fuente de luz. Casi inmediatamente después de llegar aquí, oímos el grito de un niño pequeño que resuena en la distancia y luego oímos también a una niña gritar de dolor, aunque parece estar más cerca que el niño. No mucho después empezamos a oír asimismo los gritos aterrorizados de otros cuantos niños. Algunos suplican piedad, otros intentan ahogar sus propios gritos y otros llaman en vano a sus padres para que los salven.

          He oído historias sobre este lugar tanto por Kate como por Leila, pero jamás habría imaginado que fuera tan terrible. Solo estar aquí, escuchando todos estos gritos, me pone la piel de gallina por todo el cuerpo. Ni siquiera puedo empezar a imaginar cómo debe de ser pasar por lo que esos niños están sufriendo ahora mismo.
      - source: scene_text_2
        paragraph: 39
        text: |-
          "Vaya, estos lessathi sí que no se andaban con tonterías, ¿eh?", dice Arraka. "Es como toda una sinfonía de gritos horrorizados aquí abajo. En fin, este no era exactamente el sitio al que quería traerte. Solo necesito echar un vistazo rápido a lo que tu amiga Kate ha estado haciendo desde el comienzo de este ritual para ahorrarte los detalles aburridos e ir directo a lo bueno. Te dejaré disfrutar de estos melódicos sonidos de pura agonía mientras hago lo mío, ¿de acuerdo?"

          "¿Melódicos sonidos de--? ¡Aquí están gritando niños!", le grito. "¡¿Qué demonios te pasa?!"

          "Para serte sincera, me importan un bledo los niños que gritan", dice Arraka. "El tipo de tortura que normalmente me resulta divertido es el psicológico, no el físico. Por eso la parte realmente entretenida para mí es ver TUS reacciones a todo esto. ¿Para qué creías, si no, que me tomé la molestia de traerte conmigo a estos rituales? ¿Si no era para mi propio entretenimiento?"
    choices:
      - position: 1
