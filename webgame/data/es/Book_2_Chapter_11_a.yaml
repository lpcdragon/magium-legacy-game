    texts:
      - source: scene_text
        paragraph: 38
        text: |-
          "¿Qué es exactamente lo que te resulta tan gracioso?"

          "¿Quieres decir aparte de todo el sufrimiento?", dice Arraka. "Bueno, me hace gracia que el grandullón vaya a creer ahora que de verdad le han dado otra oportunidad, tal como pidió. Pero en realidad, ni al ritual ni al Dios del Tiempo podría importarles menos si salva o no a la esclava."

          "Entonces dices que esa no es la clave de su prueba, ¿no?", digo.

          "¡Claro que no lo es!", dice Arraka. "¿Qué clase de pregunta estúpida es esa? ¿No pasaste tú mismo por una prueba hace muy poco? Ya deberías saber lo que necesita hacer el sanador para superar esta."

          Mientras Arraka y yo hablábamos, Eiden acababa de descubrir por segunda vez que el Dios del Tiempo había enviado a Daren al pasado y se estaba preparando para burlarse de él una vez más.
      - source: scene_text_2
        paragraph: 36
        text: |-
          "Debo asegurarme de no intervenir", oigo decir a Eiden. "¡No me gustaría que fracasaras en tu prueba por mi culpa!"

          "¡No, no lo entiendes!", dice Daren, con una desesperación evidente en la voz. "¡Necesito que intervengas! ¡No puedo fallarle otra vez! Necesito el poder que solo tú puedes dar. ¡El poder para atacar al noble!"

          "¿Oh?", pregunta Eiden, sorprendido. "Sinceramente, no habría esperado que me pidieras ayuda de un modo tan directo. Pero aun así, no tiene sentido someterse a una prueba si no vas a resolver tus problemas por ti mismo. Me temo que tendré que rechazar tu petición, independientemente de lo que pudiera haber hecho en tu línea temporal original."

          "¡Maldito seas!", dice Daren. "¿Quieres que te lo suplique? ¿Eso es lo que quieres?"

          "No, en realidad yo estaba--", empieza a decir Eiden, pero se interrumpe al ver que Daren cae de rodillas y manos ante él, con la cabeza agachada.
      - source: scene_3
        paragraph: 18
        text: |-
          "¡Entonces te lo suplicaré!", dice Daren. "Te lo suplicaré de rodillas y manos. Aunque te odio con todo mi corazón. Aunque te considere una de las personas más malvadas e irredimibles que he conocido en mi vida. Pero ahora mismo eres mi única esperanza para salvar a esta chica de su terrible destino, y lo único que puedo hacer es suplicarte que me ayudes. Así que por favor... te lo suplico... Dame el poder para salvar a esta chica y haré cualquier cosa que me pidas, por humillante que sea..."

          Mientras Daren hablaba, podía ver a Eiden abrir lentamente los ojos durante unos segundos, con una expresión de conmoción y asombro en la cara. Luego, cuando Daren terminó su discurso, Eiden sonrió levemente con los ojos cerrados.

          "¿Harás cualquier cosa que te pida, dices?", dice Eiden. "Entonces solo tengo una petición."

          Hace una pausa de un segundo y adopta una expresión mucho más seria.

          "Demuéstrame que estoy equivocado...", continúa Eiden.

          El stillwater levanta entonces las manos y un viento poderoso empieza a girar a su alrededor durante unos segundos.
