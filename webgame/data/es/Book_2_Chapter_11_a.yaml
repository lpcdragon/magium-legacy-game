              current_scene: b2_ch11a_destination
  - name: b2_ch11a_destination
    routes:
      - condition: ch11_saved_slave <> 3
        texts:
          - source: scene_text
            paragraph: 41
            text: |-
              "¿Demostrarte que estoy equivocado?", pregunta Daren, confuso, mientras Eiden baja los brazos y el viento a su alrededor se detiene. "¿Qué quieres decir con--"

              "Tienes el poder, sanador", dice Eiden. "Ahora ve, ve. ¡Antes de que sea demasiado tarde!"

              "De acuerdo...", dice Daren, levantándose del suelo y corriendo hacia el noble.

              "¿Cuántas segundas oportunidades vas a pedirme, chica necia?", oigo decir al conde de Ollendor, con el cuchillo en la mano, mientras Daren y Eiden siguen conversando. "¿No te das cuenta de que mi misericordia no es ilimitada? Ya he tenido bastante de tus excusas. Esta vez te mataré de verdad. ¡No te muevas de ese sitio!"

              "¡No dejaré que la mates, bastardo!", grita Daren, corriendo hacia el noble con la espada preparada.

              "¿Qué demonios?", dice el conde justo cuando estaba a punto de cortarle la garganta a Ella, y se vuelve hacia Daren.

              El noble apenas tiene tiempo de darse la vuelta, porque la hoja de Daren lo decapita al instante y el cuerpo sin cabeza del conde de Ollendor cae al suelo poco después, junto a su cabeza cercenada.
          - source: scene_text_2
            paragraph: 37
            text: |-
              "Lo hice...", oigo pensar a Daren. "La salvé... Esta vez no dudé. Por fin logré arreglarlo."

              De repente, la ya demasiado familiar luz blanca llena la zona a nuestro alrededor para enviar una vez más a Daren de vuelta al comienzo del ritual.

              "¡No, no, no!", grita Daren mientras la luz lo envuelve, pero nadie lo escucha y, tras unos segundos, vuelve a encontrarse exactamente donde empezó, con el noble todavía vivo y coleando.

              "¡Ja- ja, ja, ja, ja!", se ríe Arraka. "¡El idiota de verdad creyó que había completado la prueba! ¿Te lo puedes creer? Y la ironía es que lo único que necesitaba hacer para completarla era calmarse de una vez por todas y cerrar la boca. Así Eiden no habría visto ningún cambio extraño en su aura y no habría podido adivinar que el Dios del Tiempo lo había enviado al pasado. Pero a este paso va a tardar un millón de años en darse cuenta. Madre mía, este tipo es una fuente de comedia estupenda."

              "Entonces su ritual es igual que el mío, ¿no?", le pregunto. "Solo tiene que recrear los mismos acontecimientos que sucedieron la primera vez."

              "Sí, la mayoría de sus rituales fueron hechos de la misma manera", dice Arraka. "Mientras sea la versión pasada de ti la que salve a la esclava usando el poder de Eiden, debería ir bien. Bueno, seguro que tarde o temprano lo averiguará. Vamos, vayamos a visitar algunos de los otros rituales."
          - source: scene_3
            paragraph: 19
            text: |-
              "¿Qué ha pasado?", oigo los pensamientos de Daren de fondo. "¿Qué hice mal? ¡¿Qué quiere este ritual de mí?!"

              "Y nuestro próximo destino es el Faro de Esperanza", dice Arraka. "¡Agárrate fuerte! Va a ser un viaje accidentado. Nah, es broma. Ya estamos aquí."
