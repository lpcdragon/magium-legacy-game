  - name: b2_ch11a_pitchfork
    texts:
      - source: scene_text
        paragraph: 29
        text: |-
          No... ¡No!!! ¿Cómo puede ser? No hice nada diferente de lo que hice hace quince años. Dejé que murieran mis dos padres. Salvé a mi hermano. Usé la misma horca. Hasta me aseguré de llegar demasiado tarde para que no hubiera ninguna duda de que yo... exactamente...

          No... Eso no está bien. No fue eso lo que pasó en absoluto... Esa es solo la historia que llevo quince años contándole a todo el mundo. La he contado tantas veces que hasta conseguí engañarme a mí mismo y creer que era real. Pero la realidad de estos acontecimientos fue muy distinta a como la recordaba. Ahora entiendo lo que este ritual quiere de mí. Ahora por fin entiendo lo que tengo que hacer.

          A medida que por fin caigo en la cuenta de lo que ocurrió de verdad hace tantos años, primero siento conmoción, luego resignación y finalmente odio. Un sentimiento de puro odio hacia el Dios del Tiempo que no deja de intensificarse mientras camino por el bosque.

          Cuando por fin llego al borde del bosque, entro en el establo para recoger la horca y luego camino hacia mis padres, que ahora intentan en vano hablar con el ser que una vez fue mi hermana. Me coloco a una distancia segura de ellos y espero.
      - source: scene_text_2
        paragraph: 29
        text: |-
          Al cabo de unos segundos más, la banshee finalmente despierta e intenta ensartar a mi padre con la mano desnuda. Sorprendentemente, mi padre logra esquivar ese primer ataque, así que la banshee vuelve a atacarlo clavándole en la pierna un cono afilado de roca, lo que lo hace caer al suelo gritando de dolor. La banshee ahora también grita, al parecer porque ella misma también siente dolor por haberse esforzado tanto nada más despertar. Mientras la banshee está distraída, mi padre por fin me ve y también ve la horca que sostengo entre las manos.

          "Barry...", dice mi padre. "Rápido... ¡Lánzame la horca!"

          No le digo nada a mi padre y sigo mirándolo fijamente, mientras continúo maldiciendo al Dios del Tiempo en mi mente, cada vez más con cada segundo que pasa.

          "¡Barry!", dice mi padre, esta vez con un tono más desesperado. "¡No hay tiempo! ¡Tienes que darme la horca!"

          Por desgracia para él, la banshee ya se había recuperado y se preparaba para un tercer y último ataque. Mi padre no podía hacer nada para escapar debido a la gran herida de la pierna y volvió a ser ensartado, esta vez por el pecho, lo que lo mató casi al instante.
      - source: scene_3
        paragraph: 11
        text: |-
          Mi madre grita aterrorizada al ver morir a mi padre ante sus ojos. Ahora está demasiado asustada como para moverse, pero antes de sus últimos momentos consigue pronunciar unas pocas palabras finales.

          "Barry, por favor... sálvame...", dice.

          Igual que antes, no me muevo de mi sitio, no le respondo, y la banshee la mata cortándole la garganta con una daga de roca afilada. Cuando la banshee me ve allí de pie, mirando los cadáveres de mis padres, se echa a reír. Exactamente la misma risa siniestra que aún recuerdo con claridad hasta hoy. Y ahora por fin sé de qué se estaba riendo. No se reía porque disfrutara matando a mis padres. Se reía de mí.

          No es que yo llegara demasiado tarde. Nunca fue eso lo que pasó. Yo estaba allí cuando atacaron a mis padres. Lo vi todo con mis propios ojos. Tenía la horca en las manos, listo para golpear, pero cuando me acerqué a la banshee y vi su figura monstruosa mirándome con aquella expresión cruel en los ojos, simplemente me quedé congelado. Me quedé completamente paralizado de miedo y ni siquiera pude oír a mi padre y a mi madre suplicarme que los ayudara. Solo cuando mi hermano pequeño estaba a punto de morir también a manos de la banshee reuní por fin el valor para atacarla. Eso es lo que ocurrió realmente hace quince años y lo que he bloqueado por completo de mi mente durante más de la mitad de mi vida.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch11a_eliminated
  - name: b2_ch11a_eliminated
    routes:
      - condition: ch11_saved_rose = 0
        texts:
          - source: scene_text
            paragraph: 30
            text: |-
              Esta fue la única vez en mi vida en que me paralicé de miedo. De hecho, ahora que lo pienso, lo que ocurrió después de este incidente fue que desarrollé una tendencia casi suicida a ignorar por completo el peligro, por desesperada que fuera la situación. Casi parece que mi deseo de que algo así no volviera a ocurrir jamás fue tan fuerte que me frió el cerebro y me eliminó el instinto de conservación. Ahora tantas cosas empiezan a tener sentido... No puedo creer que haya mantenido reprimido este recuerdo durante tanto tiempo. Supongo que debería darle las gracias al Dios del Tiempo por esta deslumbrante revelación. Le estrecharía la mano, pero con la cantidad de rabia que siento hacia él ahora mismo, me temo que podría aplastársela por accidente.

              La banshee ya ha empezado a perseguir a mi hermano. No pierdo ni un segundo y corro hacia ella, atravesándole la espalda con la horca sin darle ninguna oportunidad de contraatacar. Mientras la banshee muere lentamente ante mis ojos, una luz blanca vuelve a llenar la zona y me transportan una vez más a través del tiempo. Esta vez, sin embargo, no estoy preocupado. Ya sé que he superado esta fase del ritual.

              Tal como esperaba, en cuanto la luz se desvanece, vuelvo a encontrarme en mi cuerpo de veintiocho años, rodeado por todos mis amigos, mientras Arraka suelta una de sus risas habituales.
          - source: scene_text_2
            paragraph: 30
            text: |-
              "Parece que eres de los primeros en superar esta parte del ritual, Barry, muchacho", dice Arraka. "Ven, siéntate y disfrutemos mientras vemos sufrir al resto de tus amigos en sus propias pruebas."

              Echo un vistazo rápido a mi alrededor para ver cuál es nuestra situación actual. El Dios del Tiempo ya no se ve por ninguna parte, pero no parece que su marcha haya afectado al ritual de ningún modo. Daren, Kate, Leila, Hadrik y el revenant parecen estar en alguna clase de trance, similar al que tenía el revenant cuando llegó por primera vez a este lugar. Sus ojos brillan de color amarillo y se quedan mirando al frente sin ser conscientes de nuestra presencia. Todos permanecen justo donde yo los dejé, salvo el revenant, que ahora tiene los pies en el suelo en lugar de flotar en el aire como antes. Mientras tanto, Melindra, Illuna y, presumiblemente, Flower ya han salido de sus trances y me están mirando con atención.
          - source: scene_3
            paragraph: 12
            text: |-
              "¿Qué quieres decir con eso de que veamos a mis amigos durante sus pruebas?...", le pregunto a Arraka, una vez que entiendo bien nuestra situación. "¿Tienes una forma de ver lo que está pasando en el pasado?"

              "Claro", dice Arraka. "No es tan difícil. Ahora mismo todos están conectados al Magium, así que si sabes vincularte correctamente a sus auras, deberías poder ver lo que ellos están viendo."

              "El Magium...", digo, recordando de repente la discusión que Arraka tuvo con el Dios del Tiempo antes de enviarnos al pasado. "Antes dijiste que el Magium fue quien envió aquí al revenant para darnos la profecía. ¿Qué querías decir con eso? ¿Estás diciendo que el Magium es una persona?"

              "¡Ja, ja, ja, ja, ja!", se ríe Arraka. "Illuna, ¿lo oíste? ¡Me ha preguntado si el Magium es una persona!"

              "Lo he oído...", dice Illuna, con tono seco, mientras Arraka sigue riéndose de fondo.

              "Claro, cómo no ibas a responder mi pregunta...", digo, mirando hacia el amuleto de Arraka. "Entonces olvida el Magium. ¿Qué puedes decirme de los rituales de los demás?"

              "¿De cuáles hablas?", dice Arraka. "¿De los que ya pasaron o de los que siguen dentro del trance?"
        choices:
          - position: 1
            text: Las dos, supongo?...
            effects:
              - set:
                  current_scene: b2_ch11a_transparent
                  b2_ch11_both: 1
          - position: 2
            text: Las de los que todavía siguen dentro de sus rituales, obviamente.
