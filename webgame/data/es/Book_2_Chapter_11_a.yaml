              "Una profecía de cosas que podrían llegar a suceder, pero que aún no han quedado fijadas en piedra", continúa Rose. "Escuchen con atención los acontecimientos que van a ser anunciados, y quizá logren impedir que ocurran antes de que sea demasiado tarde."

