  - name: b2_ch11a_sanity
    routes:
      - condition: ch4_spared_dave = 1
        texts:
          - source: scene_text
            paragraph: 18
            text: |-
              "En cuanto todos los preparativos estén en su sitio", dice el Dios del Tiempo. "Pero eso no significa que debas pasar el tiempo que queda conversando con estas criaturas inferiores. ¿Por qué te molestas en responder a todas y cada una de sus preguntas? Dudo mucho que esta gente supere siquiera la primera fase del ritual."

              Arraka se ríe.

              "Creo que te vas a sorprender mucho con su próxima actuación", dice. "No son de los que se rinden fácilmente."

              "Ya veremos eso muy pronto...", dice el Dios del Tiempo.

              Entonces vuela hasta la posición de Rose, la agarra por la barbilla y le gira la cabeza a un lado y a otro varias veces mientras acerca su cara a la suya.

              "¡Quita tus manos de encima de ella, bastardo!", grita Flower desde el suelo, mientras intenta en vano obligar a su cuerpo a incorporarse.

              "¿Quieres que le quite las manos de encima?...", pregunta el dios, sorprendido. "Oh, esta tejedora del tiempo es amiga tuya... Qué interesante. Entonces quizá sea más apropiado que se una a ustedes en las pruebas que les esperan. Así podrán estar todos juntos en sus momentos de sufrimiento. Déjame sacarla de su trance."
          - source: scene_text_2
            paragraph: 16
            text: |-
              Después de terminar de hablar, el Dios del Tiempo suelta a Rose y luego mueve la mano delante de su cara, haciendo que la luz brillante se desvanezca de sus ojos. Rose mira ahora a su alrededor, confusa, intentando entender dónde está y por qué está flotando sobre el suelo, al lado de un hombre azul sin rostro.

              "¿Qué está pasando?...", pregunta Rose. "¿Cómo he llegado aquí?"

              "Tus preguntas se responderán a su debido tiempo", dice el Dios del Tiempo. "Por ahora, lo único que necesitas saber es que pronto vas a participar en un ritual divino, y que la única manera de salir de él con la cordura intacta será superar las pruebas a las que vas a enfrentarte. El ritual comenzará en breve."

              Hace una pausa.

              "Oh, y para que quede perfectamente claro...", dice el Dios del Tiempo, con voz más alta. "El ritual afectará a todas las personas que se encuentren en esta zona general y que no estén congeladas en el tiempo en este momento. Eso incluye también a quienes puedan estar escondidos detrás de un hechizo de invisibilidad, observándonos desde la distancia."

              "¡Ja!", dice Arraka. "¡Lo sabía!"

              "Que comience el ritual", dice el dios, y entonces una luz blanca cegadora inunda toda nuestra zona, haciendo imposible ver más allá de mis propias manos.
