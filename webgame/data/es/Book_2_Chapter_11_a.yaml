  - name: b2_ch11a_absorb
    texts:
      - source: scene_text
        paragraph: 14
        text: |-
          "Bueno, si simplemente destruyeras este amuleto por mí, podríamos--", empieza a decir Arraka, pero la interrumpe el Dios del Tiempo.

          "No vas a recibir ninguna ayuda de mi parte", dice el Dios del Tiempo. "No creas que he olvidado la gran cantidad de espíritus que mataste y absorbiste hace miles de años. Algunos de ellos eran amigos míos, por si no lo sabías."

          "No seas así, Selkram", dice Arraka, con tono burlón. "Nosotros también somos amigos, ¿no? Al fin y al cabo, gracias a mí descubriste que podías absorber otros espíritus. No creas que no me di cuenta de lo que has estado haciendo. Puede que hayas logrado ocultárselo a todos los demás espíritus del plano mágico, pero ¡yo fui quien inventó la técnica! Sé perfectamente cuáles son sus efectos secundarios. Tu voz empezó a cambiar justo después de nuestra primera batalla en el plano mágico, y a Ulruk le pasó lo mismo. Esas voces distintas que usas al hablar son las de todos esos otros espíritus que no lograste absorber correctamente, ¿verdad? A mí me pasó lo mismo al principio, pero luego aprendí y me adapté, a diferencia de ustedes, idiotas. En serio, ¿qué pensaban tú y Ulruk? ¿Que podían copiar mi técnica sin ningún tipo de entrenamiento? ¿Hasta dónde podía llegar su arrogancia? ¿Tienen idea de cuánto tiempo me pasé perfeccionando ese hechizo? Pero bueno, supongo que les resultó más fácil asumir que solo las espíritus femeninas de las razas civilizadas podían absorber correctamente a otros espíritus, y convencer a todo el mundo de desterrarnos al plano terrenal, que admitir que la única razón de su fracaso era su extraordinaria ineptitud."
      - source: scene_text_2
        paragraph: 11
        text: |-
          "No voy a quedarme aquí escuchándote burlarte de--", empieza a decir el Dios del Tiempo, pero Arraka lo corta.

          "Los dos deberían haber escuchado a Memphir", dice Arraka. "Es el único que tiene cerebro entre todos ustedes, los 'dioses'. Apuesto a que intentó impedirles absorber a los espíritus, ¿verdad? A él nunca le oí usar voces distintas cuando hablaba. Por cierto, ¿cómo está Memphir? ¿No se cumple el plazo de su propia profecía en algún momento de este siglo?"

          "El Dios del Destino y su profecía no son asunto tu--", empieza a decir el Dios del Tiempo, pero vuelven a interrumpirlo.
      - source: scene_3
        paragraph: 5
        text: '"Sí, era este siglo, ¿no?...", dice Arraka, que ahora ignora por completo al Dios del Tiempo mientras se pierde en sus propios pensamientos. "Y la profecía también era bastante específica sobre su muerte. Decía que lo mataría un miembro de las razas civilizadas del plano terrenal, originario de una región llamada Varathia. Recuerdo cómo Memphir revisaba esa profecía una y otra vez, con la esperanza de que algo cambiara, aunque siempre obtenía exactamente el mismo resultado. Estaba obsesionándose por completo con ella... Apuesto a que debió de asustarse de verdad cuando Eiden le puso a este continente el nombre de Varathia, ¿eh? Y ahora que el plazo se acerca, el supuesto ''Dios del Destino'' llegó incluso a formar una alianza temporal con el ''Dios de la Muerte'', diciéndole que lo ayudaría con sus matanzas indiscriminadas, siempre que se concentraran en Varathia. La verdad, no entiendo qué le pasa por la cabeza a Memphir. Si yo estuviera en su lugar, simplemente reduciría este continente entero a un montón de cenizas en un solo día y se acabó."'
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch11a_misery
  - name: b2_ch11a_misery
    texts:
      - source: scene_text
        paragraph: 15
        text: |-
          ¿El Dios del Destino también pretende destruir este continente? ¿Cómo podría empeorar aún más esta situación?...

          "Arraka, si no te callas, voy a--", dice Selkram, el Dios del Tiempo.

          "¿Vas a qué?...", dice Arraka, en tono provocador. "¿A destruir mi amuleto?"

          "También podría lanzarte muy lejos de aquí, en medio de un océano, donde nadie volverá a encontrarte jamás", dice el dios.

          "Me encantaría verte intentarlo", dice Arraka.

          "¡No le hagas caso a sus provocaciones!", dice Illuna, mientras lucha por articular las palabras y sigue aplastada contra el suelo, con la cara pegada a la tierra. "¡Si la arrojas a un océano, escapará del amuleto ella sola, y entonces será el fin para todos nosotros!"

          "¿Oh?", dice el Dios del Tiempo. "Entonces tú debes de ser su captora... O quizá solo su carcelera. Supongo que resulta apropiado que sea una 'banshee' quien supervise una tarea así, teniendo en cuenta cuánto ha sufrido tu especie por su arrogancia."
      - source: scene_text_2
        paragraph: 12
        text: |-
          "¡Y por la tuya también!", grita Flower de repente. "¡Es culpa tuya que Petal tenga que vivir así! Nunca quiso esa vida. Nunca quiso matar a nadie. Y ninguna de las otras banshees tampoco. ¡Nunca te perdonaré por lo que has hecho!"

          "¿Nunca me perdonarás?...", dice el Dios del Tiempo, sonando sinceramente desconcertado. "Debes de tener muy poca memoria si puedes permitirte hablarme así después de todo lo que ha pasado. Déjame refrescarte un poco esa memoria tan corta."

          Entonces empieza a aumentar la presión que aplastaba a Flower contra el suelo hasta que ella empieza a gritar de dolor. Tras unos segundos más, el Dios del Tiempo vuelve a invertir el tiempo para asegurarse de no matarla por accidente y continúa aplastándola una y otra vez, como antes.

          "Oh, no...", dice Arraka. "Otra vez no con las inversiones temporales... ¡Mátenme ya y sáquenme de mi miseria!"
    choices:
      - position: 1
        text: Intentar llamar la atención del Dios del Tiempo para que se fije en mí en vez de en Flower.
        effects:
          - set:
              current_scene: b2_ch11a_attention
      - position: 2
        text: Dejar en paz al Dios del Tiempo. Seguro que acaba parando por sí solo.
        effects:
          - set:
              current_scene: b2_ch11a_eventually
  - name: b2_ch11a_attention
    texts:
      - source: scene_text
        paragraph: 16
        text: |-
          "¿Es así como debería comportarse un dios?", digo, mientras intento con esfuerzo girar la cara hacia el Dios del Tiempo, aunque sigo aplastado contra el suelo. "¿Metiéndose con niñas pequeñas? ¿En el plano mágico no tienen concepto del honor? ¿O al menos de la dignidad?"

          El dios vuelve a invertir el tiempo para curar a Flower y luego flota hasta mi posición para observarme mejor. O al menos eso creo que intenta, ya que en realidad no tiene cara.

          "Qué curioso...", dice el Dios del Tiempo. "Pareces débil, incluso para los estándares mortales. Apenas percibo magia en tu aura. Y, aun así, sigues intentando desafiarme. ¿Por qué?"

          "No intentes buscar razones en él", dice Arraka. "Hasta intentó atacarme una vez con una daga cuando yo estaba en todo mi poder. Creo que tiene el instinto de supervivencia defectuoso o algo así. De todos modos, solo es un debilucho, así que ¿a quién le importa?"
      - source: scene_text_2
        paragraph: 13
        text: |-
          "Sin embargo, no solo él es sorprendentemente débil...", dice Selkram, mientras asciende un poco más para poder vernos mejor a todos. "Ni una sola persona de este grupo, salvo la chica stillwater, se acerca siquiera a las de hace seiscientos años en términos de poder mágico. La última vez estaban el zorro dorado, estaba aquella stillwater con la que estabas fusionada, y también aquel stillwater realmente poderoso que viajaba con el zorro. Eiden, creo que se llamaba, ¿no? Si comparas eso con lo que tenemos aquí, todo parece una broma cruel. ¿Para qué molestarse siquiera en enviar a la tejedora del tiempo a cualquiera de estas personas? Probablemente las maten en los próximos días, si tienen la suerte de sobrevivir tanto tiempo..."

          "¿De qué... Ngh... estás hablando?", digo, como me cuesta hablar bien con la cara constantemente hundida en la tierra. "¿No fuiste tú quien envió aquí a la tejedora del tiempo?"

          "¡Ja!", dice Arraka. "¡Selkram YA QUISIERA poder controlar a las tejedoras del tiempo cuando se le antoja! El Magium es quien envió aquí a la tejedora del tiempo, no esta triste excusa de dios."

          "¿El Magium?...", digo, demasiado atónito para hacer otra cosa que repetir sus palabras.
      - source: scene_3
        paragraph: 6
        text: |-
          "Mhm...", dice Arraka. "Es una especie de tradición del Magium enviar a una tejedora del tiempo al plano terrenal cada vez que existe la posibilidad de que se pierdan muchísimas vidas en poco tiempo. Sobre todo cuando se trata de este continente. Cuando los poderes de la tejedora del tiempo por fin despiertan, la persona que recibió esos poderes entra en una especie de trance, congela el tiempo y luego camina pacientemente hacia varios grupos de personas, entregándoles la profecía uno por uno. Siempre ha sido así."

          "Pero entonces... ¿qué tiene que ver el Dios del Tiempo con todo esto?", pregunto.

          "Oh, Selkram simplemente está pirateando la señal, por decirlo así", dice Arraka. "Hace mucho encontró una manera de aprovechar el trance de una tejedora del tiempo para vincularse temporalmente de forma directa al Magium, y está usando esa conexión para meter en la mezcla un ritual propio. ¿Saben cómo los demás dioses obtienen su poder gracias a grandes cantidades de seguidores? Bueno, Selkram no tiene seguidores. Él apuesta por la calidad en lugar de la cantidad. Básicamente, como los grupos visitados por tejedoras del tiempo pueden afectar la vida de cientos de miles de personas, decidió concentrar todos sus esfuerzos en explotar a gente como ustedes, en lugar de mendigar la adoración de un rebaño de ovejas, como hacen todos los demás dioses."

          "¿De qué... clase de ritual estás hablando?", le pregunto a Arraka, un poco aprensivo.

          "Bueno, no conozco todos los detalles", dice Arraka, "porque esos rituales suyos siempre cambian, pero casi seguro que en al menos una de las etapas habrá algún tipo de viaje en el tiempo. Por cierto, ¿cuándo empieza el ritual?"
