        texts:
          - source: scene_text
            paragraph: 37
            text: |-
              Sin pensarlo, Daren corre a ayudar a Ella e intenta apartarla del conde.

              "Ven, Ella", dice Daren, mientras intenta tirar de su brazo. "Voy a sacarte de las garras de este monstruo."

              "¡No!", grita Ella, presa del pánico, dando un salto hacia atrás para alejarse de Daren. "¡No puedo! No puedo huir de él. Soy de su propiedad."

              Luego Ella se vuelve de nuevo hacia el conde de Ollendor.

              "Señor, por favor, le prometo que--"

              Ella no llega a terminar la frase, porque el noble le abre la garganta de un tajo con su daga de inmediato.

              "¡No!", grita Daren, desesperado, y al instante la agarra entre sus brazos e intenta lanzarle un hechizo curativo.

              Por desgracia, para cuando el hechizo empieza a surtir efecto, Ella ya ha perdido demasiada sangre y muere lentamente en sus brazos mientras él sigue intentando curarla.

              "Pff...", dice el noble, mirando a Daren con asco. "Qué patético."
          - source: scene_text_2
            paragraph: 34
            text: |-
              "¡No, se supone que esto no tenía que pasar así!", grita Daren, ignorando por completo al conde mientras sigue intentando curar el cadáver de Ella que sostiene en sus brazos. "No tenía que ser así. Ella tenía que seguir viviendo, feliz, en la casa de Rose. ¡Se merecía ser feliz! Por favor... Si hay alguien escuchando. Denme otra oportunidad. Les prometo que la próxima vez no volveré a fallarle. Por favor..."

              Entonces Daren empieza a sollozar en silencio, mientras sigue abrazando con fuerza el cadáver. Tras unos segundos de silencio, rotos solo por sus lentos sollozos, una luz blanca intensa envuelve de repente la zona y, unos instantes después, volvemos a encontrarnos en el mismo lugar, pero con Ella aún viva y con Daren de nuevo donde estaba cuando lo enviaron atrás en el tiempo por primera vez.

              "¡Ja, ja, ja, ja, ja!", se ríe Arraka. "¿Viste eso? ¿Viste qué oportuno fue? ¡Aunque todo estuviera guionado, no podría haber salido mejor!"
