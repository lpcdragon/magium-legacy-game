  - name: b2_ch11a_luggage
    routes:
      - condition: ch11_saved_slave <> 3
        texts:
          - source: scene_text
            paragraph: 35
            text: |-
              "No...", oigo otra vez la voz de Daren resonando por toda la habitación. "No es que yo estuviera indefenso. Podría haber conseguido el poder, si hubiera querido. Pero ¿lo habría hecho?... ¿Habría sido capaz de hacer algo tan humillante como pedirle ayuda a Eiden para salvar la vida de esa pobre chica? ¿Qué habría pasado si Barry no hubiera intervenido? ¿Esa chica habría muerto por mi culpa? ¿Porque yo no fui capaz de dejar a un lado mi ego? ¡No! Eiden es malvado. No pudo haberme ofrecido ayuda sin esconder algún motivo ulterior. Pero entonces, ¿por qué no pidió nada a cambio? Vi cómo le daba el poder a Barry y no había ningún truco. Incluso nos dio poder al resto como efecto secundario de su hechizo... Entonces, ¿por qué lo hizo? ¿Cuál podía ser su razón? ¿De verdad me dio esa opción solo para humillarme? ¿Qué está pensando Eiden?..."

              "Perfecto", dice Arraka. "Creo que esto debería bastar como contexto para nuestros propósitos. Pasemos al ritual."

              Otra vez, todo el entorno que nos rodea cambia por completo, pero esta vez nos encontramos en las calles de Thilias, justo cuando el noble estaba amenazando a Ella. Flower y yo seguimos siendo semitransparentes, pero la versión no transparente de mí mismo está a apenas unos cuatro metros de nuestra posición actual, y también lo están Daren, Kate, Rose y Eiden.
          - source: scene_text_2
            paragraph: 33
            text: |-
              "Vale", me dice Arraka. "Aquí fue donde de verdad empezó el ritual de Daren. Lo que te he estado enseñando hasta ahora no eran más que fragmentos de sus recuerdos, para que entendieras mejor sus motivaciones. ¿Está todo claro hasta ahora?"

              "Supongo que sí...", digo.

              "Bien", dice Arraka. "Ahora vamos a ver el espectáculo."

              "¿Qué ha pasado?", oigo los pensamientos de Daren resonando por la zona mientras mira a su alrededor, confundido. "¿Este es el ritual del que hablaba Arraka? ¿Me han enviado al pasado?"

              "Qué interesante...", dice Eiden de repente. "El flujo del aura del sanador ha cambiado por completo en cuestión de segundos. Es como si ahora fuera una persona distinta de la que era hace unos momentos. ¿Qué podría desencadenar un cambio así, me pregunto?... ¿Pérdida de memoria? No, no, no... Es otra cosa. ¿Viaje en el tiempo, quizá? ¿Una prueba del Dios del Tiempo?"

              "No sé de qué estás hablando", dice Daren, intentando fingir ignorancia. "¿Quién es ese Dios del Tiempo del que hablas? Nunca he oído hablar de él."

              "¡Entonces sí que recibiste una prueba!", dice Eiden, con una sonrisa, al ver a través del farol de Daren. "Pero ¿cuál podría ser el propósito del ritual?... ¿Salvar a la chica esclava? En cualquier caso, debo asegurarme de no intervenir. ¡No me gustaría que fracasaras en tu prueba por mi culpa!"
          - source: scene_3
            paragraph: 16
            text: |-
              "¿Qué quieres decir con que no vas a intervenir?", dice Daren, con un tono de ansiedad en la voz. "Todavía vas a darle a Barry el poder para atacar al noble, ¿verdad?"

              "¿Eso fue lo que hice la última vez que viviste estos acontecimientos?", pregunta Eiden con una sonrisa maliciosa. "¿Por qué fue Barry quien salvó a la esclava y no tú? ¿Es porque rechazaste mi oferta? Sí, eso tendría sentido, ¿verdad? Pero esta vez ya no podrás confiar en que tu amigo venga a arreglar tu desastre. Así que, ¿qué vas a hacer?"

              "Este bastardo...", oigo pensar a Daren. "Debí haber sabido que no se podía confiar en él. Pero si Barry ya no va a salvar a Ella, eso significa que..."

              De repente oímos a Ella gritar de miedo, pues el conde de Ollendor ya tiene el cuchillo en la mano mientras se acerca lentamente a ella.

              "¡Por favor, se lo suplico!", dice Ella, mientras intenta desesperadamente levantar en sus manos todo el equipaje que debía cargar. "Déme una oportunidad más. Todavía puedo cargar estas bolsas por usted. ¡No quiero morir!"

              "Entonces deberías haber pensado en eso antes de hacerme perder el tiempo, moza", dice el noble. "Ahora quédate quieta. Haré que tu muerte sea lo más rápida posible."
