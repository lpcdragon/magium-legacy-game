  - name: b3_ch03a_assistance
    texts:
      - source: scene_text
        paragraph: 6
        text: |-
          Tras unos segundos más, el sonido que sale del dispositivo metálico se vuelve más claro y por fin podemos entender lo que dicen las dos voces.

          "¡Eso no es lo que te pregunté, maldita máquina!", oímos gritar a Billy Bob. "¡Lo que quiero saber es si los rebeldes son los responsables de hacer volar por los aires mi obra maestra arquitectónica de ayer!"

          "Pregunta poco clara", dice el Supervisor. "Defina 'obra maestra arquitectónica'. El protocolo Supervisor ha registrado hasta ahora treinta y una ocasiones en las que usted llamó 'obra maestra arquitectónica' a uno de los edificios que diseñó."

          "¡Sabes perfectamente de cuál hablo, inútil pedazo de chatarra!", dice Billy Bob. "¡Ayer solo explotó uno de mis edificios!"

          "Eso es incorrecto", dice el Supervisor. "Solo ayer habló de tres de sus diseños más recientes explotando durante la noche. También ha usado la misma expresión para describir varios otros edificios suyos en el pasado, cada vez que se hicieron populares muy rápido."

          "¡No, me refiero a explotar de verdad!", dice Billy Bob. "¡O sea, estallar! ¿Entiendes? ¡Estoy hablando de una explosión! ¿Qué te pasa? ¿Ni siquiera entiendes lo básico de la lengua común? ¡Arregla tus malditos problemas de una vez!"
      - source: scene_text_2
        paragraph: 4
        text: |-
          "Queja reconocida", dice el Supervisor. "El protocolo Supervisor está actualizando ahora su vocabulario para poder asistirlo mejor. Por favor, espere."

          Hay una breve pausa durante la cual el cubo metálico queda en silencio.

          "Actualización completada", volvemos a oír la voz del Supervisor al cabo de un rato. "Gracias por su paciencia. A partir de ahora, todas las apariciones de la expresión 'hacer volar por los aires' se interpretarán como 'explotar'. El protocolo Supervisor iniciará ahora una investigación para averiguar la causa de que sus tres edificios explotaran durante la noche."

          "¿Se está burlando de mí?!", dice Billy Bob.

          "El protocolo Supervisor no posee la capacidad de burlarse", dice el Supervisor. "El único propósito del protocolo es brindar asistencia. Si no está satisfecho con los servicios prestados, puede formular su queja y su solicitud será tramitada lo antes posible."

          "¡Olvídalo!", dice Billy Bob. "Iré a pedirles la información a los guardias. Siento que me estoy volviendo más estúpido solo por estar cerca de ti. No quiero oír nada más de ti hoy, salvo que sea una emergencia extrema. ¿Entiendes?"

          "Solicitud reconocida", dice el Supervisor. "¡Que tenga un buen día!"
      - source: scene_3
        paragraph: 3
        text: |-
          "Hmph...", dice Billy Bob, y luego lo oímos alejarse del Supervisor.

          "Bueno, eso ha sido... algo", dice Hadrik.

          "Aún no ha terminado", dice el rey. "Escuchen."

          Tras unos diez segundos de silencio, oímos desde el dispositivo de grabación el leve sonido de una puerta al cerrarse, y luego oímos la voz del Supervisor una última vez.

          "El único propósito del protocolo Supervisor es brindar asistencia", vuelve a decir el Supervisor. "Si necesitan más ayuda, no duden en activar el protocolo pidiéndole a cualquiera de las unidades de ojos verdes que los ponga en contacto con el Supervisor. ¡Que tengan un buen día!"

          El cubo metálico vuelve a quedar en silencio, pero esta vez parece que la grabación de verdad ha terminado.

          "No lo entiendo", dice Hadrik. "¿Por qué nos hizo escuchar esta grabación? ¿Qué información nos da que no supiéramos ya?"
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch03a_scouts
  - name: b3_ch03a_scouts
    texts:
      - source: scene_text
        paragraph: 7
        text: |-
          "¿No se fijaron?...", dice el rey del subsuelo. "Esa última frase del Supervisor no iba dirigida al lessathi. Para entonces Billy Bob ya había salido de la habitación, como pudieron oír perfectamente. También estamos bastante seguros de que no había nadie más allí, porque de lo contrario nuestro dispositivo de escucha al menos habría registrado que abrían o cerraban la puerta. Eso solo deja la posibilidad de que el Supervisor estuviera hablando consigo mismo. Ahora bien, ¿por qué creen que una máquina altamente inteligente haría algo así?"

          "Quién sabe", dice Hadrik. "Tal vez se averió o algo así."

          "Esa es una posibilidad...", dice el rey. "Sin embargo, otra posibilidad más probable es que el Supervisor sea un poco más inteligente de lo que creemos y que en realidad nos estuviera transmitiendo ese mensaje directamente a nosotros."

          "¿Cree que el Supervisor sabía que tenían dispositivos de escucha en esa sala?", dice Daren.

          "No hay manera de estar seguros", dice el rey. "Sin embargo, ese es el escenario que más sentido me tiene. Creo que el Supervisor nos estaba haciendo saber que toda la conversación que escuchamos antes fue solo una farsa, pensada para impedir que Billy Bob obtuviera la información que necesitaba. Información que podría haber puesto en peligro a algunos de nuestros hombres, según el nivel de detalle. También creo que el Supervisor nos estaba haciendo una invitación directa cuando dijo que podíamos pedir hablar con él si necesitábamos más ayuda. No sería descabellado suponer que quiere formar una alianza con nosotros, aunque, obviamente, también podría ser una trampa. En situaciones así nunca se sabe."
      - source: scene_text_2
        paragraph: 5
        text: |-
          "Con todos los respetos, mi rey", dice Albert. "¿No cree que quizá esté sobrestimando un poco a ese Supervisor? A fin de cuentas, no deja de ser una máquina."

          "Máquina o no, no podemos permitirnos desperdiciar una oportunidad así", dice el rey del subsuelo. "No olvides que Breynan lleva mucho tiempo advirtiéndonos de que el Supervisor podría ser bastante más inteligente de lo que aparenta. Como mínimo deberíamos tomarnos este asunto con toda la seriedad posible. Si al final resulta ser solo un gran malentendido, pues que así sea, pero el potencial de ganar un aliado tan poderoso es demasiado grande como para ignorarlo."

          "Sí, majestad", dice Albert. "Por supuesto. Lo investigaremos en cuanto podamos."

          "En realidad", dice el rey, "ya he enviado exploradores a la superficie para que vigilen las bolas metálicas de ojos verdes y comprueben si intentan atraernos a una emboscada o no. Si todo va bien, mañana enviaremos un pequeño equipo a negociar con el Supervisor y me gustaría que nuestros nuevos aliados los acompañaran también, si aceptan, por supuesto. En última instancia, todo depende de lo que decida el sanador con armadura, ya que supongo que él es el líder de su grupo."
      - source: scene_3
        paragraph: 4
        text: |-
          "Eh... en realidad ninguno de los dos es el líder", dice Daren. "Normalmente nos gusta hablar este tipo de cosas entre nosotros antes de tomar decisiones importantes."

          "Lo entiendo", dice el rey. "En ese caso, les daré algo de tiempo para que lleguen a una conclusión y mañana podrán darnos su respuesta. ¿Les parece bien?"

          "Por supuesto", dice Daren. "Mañana les diremos lo que hemos decidido."

          "Muy bien", dice el rey. "Entonces hablaremos del resto de detalles una vez que hayan decidido si quieren unirse a nosotros o no. Hasta entonces, siéntanse como en casa. Peter les mostrará sus habitaciones en cuanto estén preparadas. Pero qué modales los míos. No debería ser yo quien hable todo el tiempo. Estoy seguro de que ustedes también tendrán preguntas para mí. Si hay algo que quieran saber, no duden en preguntar y les responderé lo mejor que pueda."
    choices:
      - position: 1
        text: ¿Qué tipo de comida tienen por aquí?
        effects:
          - set:
              current_scene: b3_ch03a_food
      - position: 2
        text: ¿Podemos movernos libremente mientras estemos aquí?
        effects:
          - set:
              current_scene: b3_ch03a_roam
      - position: 3
        text: ¿Podrían darnos una visita guiada por su base subterránea?
        effects:
          - set:
              current_scene: b3_ch03a_guided
  - name: b3_ch03a_food
    texts:
      - source: scene_text
        paragraph: 8
        text: |-
          "¿Qué tipo de comida tienen por aquí?"

          "Tenemos muchos tipos de comida, en realidad", dice el rey del subsuelo. "El sumo sacerdote de nuestra ciudad es bastante bueno conjurando hasta la cocina más extravagante, y además consiguió enseñar esa técnica a varios de sus discípulos, así que por suerte nuestro reino nunca ha tenido que enfrentarse a problemas de escasez de comida, a diferencia de algunas de las otras ciudades de Varathia. Si quieren saber lo que tenemos ahora mismo en la despensa, pueden visitarla cuando quieran para comprobarlo ustedes mismos."

          "Solo tengo una pregunta", dice Daren. "¿Hay por aquí algún mago blanco que no sea principiante y pueda lanzarnos un hechizo de curación rápido a Hadrik y a mí? Sigo demasiado cansado como para lanzar hechizos de curación decentes y estas heridas empiezan a resultar un poco incómodas..."

          "Ah, sí, por supuesto", dice el rey. "Haré que uno de nuestros sanadores venga a verlos en cuanto termine con sus pacientes actuales. Mientras tanto, pueden volver a la sala de la que venimos y esperarlo allí, a menos que tengan alguna otra pregunta que hacerme."

          "Nah, creo que ya estamos bien", dice Hadrik.

          "Muy bien, entonces", dice el rey. "Pues en ese caso, espero que todos disfruten de su estancia y retomaremos esta conversación mañana, después de que hayan tomado una decisión."
      - source: scene_text_2
        paragraph: 6
        text: |-
          Hace una pausa de un segundo para echarle un vistazo rápido a Kate, pero luego se dirige a uno de los rebeldes.

          "Ah, y una cosa más", dice el rey. "Breynan, sé que esto no te parecerá justo, pero quiero que mañana te quedes aquí cuando nuestros hombres visiten al Supervisor."

          "¿Mi rey?...", dice Breynan, aparentemente en estado de shock.

          "Me doy cuenta de que estoy yendo contra tus deseos, pero espero que respetes mi decisión", dice el rey del subsuelo con un tono más firme.

          "Pero, majestad...", dice Breynan. "¡De toda la gente de este lugar, yo soy con diferencia quien mejor conoce al Supervisor! ¡Además, he tratado con él directamente en numerosas ocasiones!"

          "Y precisamente por eso no quiero que formes parte de ese equipo mañana", dice el rey. "Estás demasiado implicado emocionalmente en este asunto como para mantener la cabeza fría. Quiero asegurarme de que las negociaciones se lleven a cabo de forma profesional, por gente que no corra el riesgo de dejar que sus sentimientos nublen su juicio. Ten por seguro que he leído todos tus informes sobre el Supervisor y me aseguraré de que el equipo de negociación de mañana tenga en cuenta todas tus notas. Sin embargo, tú no vas a unirte a ese equipo, y esa es mi decisión final. ¿Ha quedado claro?"

          "Sí... alteza", dice Breynan, con aspecto bastante abatido.
      - source: scene_3
        paragraph: 6
        text: |-
          "Bien", dice el rey del subsuelo. "Entonces los veré más tarde. Confío en que pueden volver por su cuenta a la sala de espera, ¿verdad?"

          "Nos apañaremos", dice Daren. "Vamos, vámonos."

          Luego echa a andar cojeando delante de nosotros y todos lo seguimos, salvo Albert, que parece seguir teniendo algo que quiere hablar en privado con el rey. Cuando volvemos a entrar en la sala de espera, nos colocamos cerca de las sillas junto a la salida que lleva al teletransportador y esperamos pacientemente a que lleguen los sanadores. Mientras tanto, Peter fue a preparar nuestras habitaciones, mientras que Breynan también siguió su propio camino sin siquiera despedirse de nosotros, todavía bastante afectado por lo que le había dicho el rey del subsuelo.

          "Supongo que Kelrim habrá vuelto al área de cuarentena", dice Daren, después de echar un vistazo rápido alrededor y ver que el goblin no está por ninguna parte.

          "O eso, o fue a buscar a sus amigos", dice Hadrik.

          "Sí, supongo que de hecho eso es más probable, ahora que lo pienso", dice Daren.

          "¡Olvídense del maldito goblin!", dice Arraka. "¡Tenemos cosas mucho más urgentes de las que preocuparnos!"
        condition: b3_ch2_goblins != 1
      - source: scene_3
