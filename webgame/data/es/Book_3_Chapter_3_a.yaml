  - name: b3_ch03a_exploring
    texts:
      - source: scene_text
        paragraph: 47
        text: |-
          "Yo iré en la dirección opuesta, entonces", dice Kate.

          "Y yo iré contigo", le dice Melindra.

          "¿Tú vas a venir?", le pregunta Kate, confundida.

          "Kate, te dije ayer que te ayudaría a afilar el aura de tu magia de hielo, ¿no?", dice Melindra.

          "Tienes razón, se me había olvidado", dice Kate. "En ese caso, probemos por ese túnel de allí."

          "Justo detrás de ti, hielitos", dice Melindra, mientras las dos se alejan.

          "Y yo voy a... seguir sentado aquí... entrenando...", dice Hadrik.

          "Creo que volveré al taller de mi padre", me escribe Leila. "Siempre me ha encantado quedarme a su lado viéndolo trabajar, y hace demasiado tiempo que no tengo la oportunidad de hacerlo. ¿Y tú, Barry? ¿Qué piensas hacer durante las próximas horas?"
      - source: scene_text_2
        paragraph: 23
        text: |-
          "Bueno, no puedo hacer gran cosa sin mi dispositivo de estadísticas, así que probablemente me iré a explorar un poco", digo.

          "Vale", escribe Leila. "¡Hasta luego, Barry!"

          "Nos vemos", digo, mientras Leila regresa al taller de su padre.

          "Hasta luego, Hadrik", digo, y luego me dirijo a probar uno de los corredores por los que todavía no he pasado.

          Durante las siguientes horas más o menos, lo único que hice fue caminar por la base rebelde intentando averiguar para qué servía cada zona. Descubrí rápidamente que la mayor parte del subsuelo se dividía en varios sectores principales. Primero estaban los aposentos, donde la gente tenía sus habitaciones privadas para dormir por la noche. Luego estaba el comedor, adonde rebeldes y hombres del rey iban a comer. También tenían una enfermería y, al parecer, una zona recreativa. Intenté aventurarme fuera de estos sectores principales, pero por desgracia muchas de esas áreas parecían estar restringidas para forasteros como yo.
      - source: scene_3
        paragraph: 21
        text: |-
          Mientras recorría la base rebelde, me crucé con varias personas a las que ya había conocido antes, como la niña que había perdido a sus padres y los dos hombres que llevaron al anciano enfermo a la zona de cuarentena. En cierto momento también me encontré con Flower e Illuna, que estaban ocupadas con su entrenamiento. Antes de que me vieran, me di cuenta de que estaban discutiendo otra vez. Al parecer, Flower sigue intentando imitar la voz y los modales de Kate, pensando que eso hará que parezca más madura, e Illuna está cada vez más irritada por su comportamiento. Cuando me vieron, dejaron de pelear para saludarme, pero apostaría a que reanudaron la discusión en cuanto salí de su alcance de oído.

          Mientras exploraba la base, tuve que volver a la sala de espera varias veces, porque estaba situada justo en el centro de todos los sectores principales. En uno de esos momentos me encontré con Daren y Arraka, que al parecer iban camino de la enfermería a por algunos dispositivos de curación. Cuando nos vimos, nos detuvimos un momento para charlar brevemente sobre lo que habíamos hecho en las últimas horas.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch03a_dagger
  - name: b3_ch03a_dagger
    texts:
      - source: scene_text
        paragraph: 48
        text: |-
          "Estamos progresando despacio, pero a paso firme", me dice Daren. "Sigo teniendo problemas para averiguar cómo conseguir que uno de mis hechizos de curación cure directamente el aura de una persona, pero creo que quizá encuentre algunas pistas si echo un vistazo a cómo funcionan esos viejos dispositivos de curación fabricados por los lessathi. ¿Y tú? ¿Encontraste algo interesante mientras explorabas?"

          "En realidad no", digo. "Tengo prohibido entrar en la mayoría de las zonas que parecen importantes, así que solo pude ver el tipo de cosas que normalmente esperarías encontrar en un sitio así."

          "¿Hadrik ha estado así desde que entré en la zona de cuarentena?", me susurra Daren, inclinando la cabeza hacia Hadrik, el enano que sigue sentado exactamente en la misma silla de antes, con expresión sombría y la mirada perdida.

          "Sí, que yo sepa no se ha movido de ahí", digo. "Creo que su actitud reciente debe de tener algo que ver con lo que Gontrok le dijo antes sobre aquella aldea de enanos de 'hace tantos años'. Me dio la impresión de que el gigante realmente tocó una fibra sensible cuando le dijo esas palabras."

          "¿Crees que podría estar relacionado de alguna manera con su prueba del ritual del Dios del Tiempo?", dice Daren.

          "Es posible", digo. "En cualquier caso, probablemente no nos dirá nada si se lo preguntamos directamente. Lo mejor que podemos hacer es esperar a que le apetezca hablar de ello por su cuenta."
      - source: scene_text_2
        paragraph: 24
        text: |-
          "Sí, probablemente tengas razón", dice Daren. "Bueno, entonces me voy. ¡Disfruta explorando!"

          "Lo intentaré", digo. "Suerte con la cura de la enfermedad."

          Una vez terminamos la conversación, ambos seguimos nuestros propios caminos y yo decido ir por uno de los corredores que aún no había logrado explorar del todo. Después de caminar y probar puertas distintas durante unos quince minutos, me detengo un momento para decidir adónde voy a ir después. Mientras miro alrededor con calma, de pronto me recorre un escalofrío por la espalda al oír la voz de un hombre justo detrás de mí, aunque habría jurado que el corredor estaba completamente vacío solo unos instantes antes.

          "Veo que te lo has pasado bastante bien explorando nuestra base rebelde, Barry", dice Albert. "¿Has visto algo que te guste?"

          La facilidad con la que había conseguido acercarse sigilosamente a mí me recordó casi de inmediato a Wilhelm, de la arena de Thilias. Al volverme para mirar a Albert, mis ojos fueron instintivamente a la daga que colgaba de su cinto, y mis sospechas se confirmaron enseguida cuando vi el color naranja de su empuñadura.
      - source: scene_3
        paragraph: 22
        text: |-
          "Es una daga preciosa, ¿verdad?", dice Albert cuando me ve mirando su hoja. "No podrías pedir un arma más perfecta para un asesino, la verdad. Si la usara una persona normal, apenas pasaría de ser un cuchillo de cocina, pero nosotros, los asesinos, estamos entrenados desde jóvenes para sacar todo el partido a sus capacidades. La forma en que nos ayuda a concentrarnos mientras ocultamos nuestra aura es sencillamente extraordinaria. Aun así, no he podido evitar la sensación de que esta no es la primera vez que te encuentras en una situación como esta. ¿Has conocido de cerca a algún asesino antes, Barry?"

          "Sí...", digo, mientras intento calmarme un poco. "Había un asesino en mi división, cuando luchaba en la arena de Thilias. Se llamaba Wilhelm."

          "Wilhelm...", dice Albert con expresión pensativa. "El nombre me suena. Estoy bastante seguro de haber oído hablar antes de un asesino que usaba ese nombre, aunque no recuerdo si tuve alguna vez el honor de conocerlo. ¿Eran amigos?"

          "No exactamente", digo. "Intentó matarme."

          "¿Fuiste el objetivo de un asesino y aun así sobreviviste?", dice Albert intrigado. "¿Cómo lograste semejante hazaña?"
    choices:
      - position: 1
        text: Porque Wilhelm era un blandengue. Igual que todos los demás asesinos.
        effects:
          - set:
              current_scene: b3_ch03a_affiliation
              b3_ch3_assassin: 0
      - position: 2
        text: Porque soy sencillamente imbatible.
        effects:
          - set:
              current_scene: b3_ch03a_affiliation
              b3_ch3_assassin: 1
      - position: 3
        text: Había amenazas mucho mayores que un asesino en ese campo de batalla, se lo aseguro.
        effects:
          - set:
              current_scene: b3_ch03a_affiliation
              b3_ch3_assassin: 2
  - name: b3_ch03a_affiliation
    routes:
      - condition: b3_ch3_assassin = 0
        texts:
          - source: scene_text
            paragraph: 49
            text: |-
              "Porque Wilhelm era un blandengue. Igual que todos los demás asesinos."

              "Ahora lo dices, pero seguro que aun así te dio algún problema para lidiar con él...", dice Albert.

              "Nah, era débil, igual que cualquier asesino", digo. "No tenía lo que hacía falta para enfrentarse a mí cara a cara, así que recurrió a trucos baratos y pagó el precio. No hay más que eso."

              "Ya veo", dice Albert, con una sonrisa cortés. "Bueno, esperemos que los dos no tengamos nunca necesidad de cruzar nuestras hojas en el futuro, entonces. Me disgustaría tener que demostrarte que estás equivocado."

              "Eso espero yo también", digo. "Por su bien."

              Albert me asiente con la misma sonrisa de antes y luego pasa de largo a mi lado. Cuando me giro para buscarlo, me doy cuenta de que ya ha desaparecido. Tendré que andar con ojo con este. Mi instinto me dice que es bastante más peligroso que Wilhelm, así que no debería subestimarlo.
          - source: scene_text_2
            paragraph: 25
            text: |-
              Después de pasar veinte minutos más caminando por los pasillos, de pronto me encuentro con Peter, que me dice que ha estado buscándome porque el rey del subsuelo ha solicitado otra reunión conmigo y con mi grupo. Cuando le pregunto de qué se trata, dice que no le está permitido hablar del asunto, pero aun así me resulta fácil ver que está actuando mucho más estresado que la última vez que hablé con él. Decido llamar a todos por sus transceptores y al final conseguimos reunirnos en la sala de espera para volver una vez más a ver al rey.

              No tardamos mucho en llegar a la sala del trono y, una vez dentro, nos sentamos en las mismas sillas que nos habían preparado la primera vez. Igual que la vez anterior, Albert también está presente en la sala, apoyado contra una pared con los brazos cruzados, pero Peter parece mucho más inquieto y bastante menos seguro de sí mismo. A juzgar por las apariencias, las únicas personas de la reunión anterior que faltan esta vez son Breynan y el padre de Leila.

              "Gracias por venir con tan poca antelación", nos dice el rey del subsuelo, sentado en el trono frente a nosotros. "Sé que todos son personas ocupadas, así que intentaré ser breve. Díganme... ¿de qué manera está asociado su grupo con este 'Creador' que se hace llamar Eiden?"

              "Eh... ¿por qué lo pregunta?", dice Daren.
          - source: scene_3
            paragraph: 23
            text: '"Ah, claro, tú has estado todo este tiempo en la zona de cuarentena, así que no sabes lo ocurrido...", dice el rey. "En resumen, no pude evitar notar que últimamente este ''Eiden'' se ha esforzado por proporcionarles a ustedes información relacionada con el rey de Ollendor y su círculo. Me di cuenta por primera vez hoy, cuando mis hombres informaron de que Eiden retrasó la ceremonia de bendición sin motivo aparente, solo para dar la orden de empezar poco después de que su grupo llegara a la plaza Perrelion. Como ese era uno de los pocos lugares donde estaba previsto que se proyectara la ceremonia, me pareció un poco sospechoso. Sin embargo, la confirmación llegó hace unas horas, cuando me avisaron de que sus amigos se encontraban en nuestra sala de grabación justo en el momento en que Eiden mantenía una conversación con el Supervisor, y Eiden prácticamente admitió que atrajo la bola metálica allí a propósito porque sabía que había uno de nuestros dispositivos de escucha cerca. Así que se lo pregunto otra vez... ¿Cuál es exactamente su relación con Eiden?"'
