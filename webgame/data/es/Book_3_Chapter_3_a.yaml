              checkpoint_rich: 0
  - name: b3_ch03a_intro2
    texts:
      - source: scene_text
        paragraph: 3
        text: |-
          "Entonces...", dice el rey, intentando volver a un tema más relevante, "¿debo entender que la verdadera razón por la que regresó a Varathia es rescatar a su hermano?..."

          "Eso no es asunto suyo", dice Melindra frunciendo el ceño, mientras el resto giramos la cabeza hacia ella.

          "Claro, claro...", dice el rey. "Siempre he tenido la mala costumbre de meterme en los asuntos personales de los demás. Lo que dice es cierto. Mientras sepa que su grupo pretende asesinar al rey, no debería preocuparme por lo que planean hacer después de salir de la ciudad. Muy bien... En ese caso, creo que nos convendría cooperar por ahora. Sin embargo, hay una pregunta que me gustaría hacerles antes de entrar en más detalles. ¿Su propósito aquí es solo eliminar al rey o también les interesa lo que ocurra con esta ciudad después de que se marchen?"
    choices:
      - position: 1
        text: Solo nos importa matar al rey. Nada más.
        effects:
          - set:
              current_scene: b3_ch03a_interest
              b3_ch3_interest: 0
      - position: 2
        text: Sí nos importa lo que ocurra con la ciudad después de la muerte del rey.
        effects:
          - set:
              current_scene: b3_ch03a_interest
              b3_ch3_interest: 1
  - name: b3_ch03a_interest
    routes:
      - condition: b3_ch3_interest = 0
        texts:
          - source: scene_text
            paragraph: 4
            text: |-
              "Solo nos importa matar al rey. Nada más."

              "Ya veo", dice el rey del subsuelo. "En ese caso, supongo que no les molestará que alguien de nuestro grupo se convierta en el próximo gobernante tras la muerte del rey Undriel, ¿verdad?"

              "¿Alguien de su grupo?...", dice Illuna. "¿No quiere decir usted mismo?"

              "Bueno, no... no necesariamente", dice el rey del subsuelo. "Aquí hay mucha gente válida, tanto entre mis seguidores como entre los rebeldes, que podría ser una candidata adecuada. Incluso podríamos intentar elegir un consejo, para evitar que una sola persona vuelva a concentrar demasiado poder. Sin embargo, esos asuntos se debatirán con más detalle una vez que cumplamos nuestro objetivo principal de destronar al rey loco. Todo lo demás es secundario."

              "Entonces, ¿por eso nos llamó aquí?", dice Kate. "¿Quiere que nuestros dos grupos unan fuerzas?"
          - source: scene_text_2
            paragraph: 3
            text: |-
              "Ese sería el resumen general, sí", dice el rey del subsuelo. "Sin embargo, primero me gustaría hacerles una pregunta importante. ¿Cómo pensaban exactamente superar todas las defensas que tiene el rey antes de poder acercarse lo suficiente como para asesinarlo?"

              "Eh... la verdad es que no sabíamos mucho sobre las defensas de esta ciudad antes de venir, así que no pudimos preparar nada con antelación", dice Hadrik. "Nuestro plan era más o menos ir directos al palacio y luego improvisar sobre la marcha."

              "Sospechaba que podría ser ese el caso", dice el rey del subsuelo. "Por desgracia, como quizá ya hayan comprobado, intentar abrirse paso a la fuerza hasta el palacio no es precisamente la solución más sensata. Hasta ahora solo han tenido que luchar contra tres guardias reales y aun así no fueron capaces de derrotarlos. Imaginen lo que ocurriría si tuvieran que enfrentarse a todos a la vez."

              "En realidad, majestad", dice Albert, "los forasteros solo lucharon contra dos de los guardias reales. El mercenario no se unió a la batalla."

              "Eso empeora todavía más las cosas", dice el rey del subsuelo. "Recuerden que el rey tiene la capacidad de invocar de inmediato a todos los guardias reales a su posición en caso de emergencia. Es poco probable que alguna vez puedan siquiera tocarlo sin derrotar antes a todos sus guardias. Y además están los peones del Supervisor, que sobrevuelan constantemente los cielos y vigilan todos sus movimientos. No pueden esperar vencer con unas probabilidades así sin al menos algo de información interna."
          - source: scene_3
            paragraph: 2
            text: |-
              "Entonces, ¿qué propone?", dice Melindra.

              "Les proponemos que sigan uno de nuestros planes en su lugar", dice el rey. "Hace poco, nuestros dispositivos de escucha del palacio captaron una conversación interesante que creo que querrán oír. Albert, ¿sigues teniendo la grabación de ayer?"

              "Sí, majestad", dice Albert, mientras se acerca al rey y luego le entrega un pequeño dispositivo metálico con forma de cubo y varios botones.

              El rey toma el dispositivo y pulsa uno de los botones. Inmediatamente después empezamos a oír dos voces saliendo del cubo, aunque todavía no logramos distinguir lo que están diciendo.

              "Esta es una conversación entre Billy Bob y el Supervisor", dice el rey. "El Supervisor es quien tiene la voz más metálica, por si no lo habían notado. Díganme qué les parece esta charla cuando terminen de escucharla."
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch03a_assistance
      - condition: b3_ch3_interest = 1
        texts:
          - source: scene_text
            paragraph: 5
            text: |-
              "Sí nos importa lo que ocurra con la ciudad después de la muerte del rey."

              "¿Ah, sí?", dice el rey del subsuelo. "¿Significa eso que querrían convertirse ustedes mismos en los gobernantes de este reino una vez que se hayan librado del rey actual?"

              "No, no, ¡nada de eso!", dice Daren. "Simplemente queremos asegurarnos de que quien asuma el liderazgo después tenga en mente el bienestar del pueblo de Ollendor."

              "Mmm...", dice el rey del subsuelo. "Bueno, aún no se ha decidido quién será el próximo gobernante cuando nos ocupemos del rey, pero les aseguro que solo queremos lo mejor para Ollendor. Todos hemos sufrido de una forma u otra las consecuencias de la tiranía del rey Undriel y no pensamos cometer los mismos errores que él."

              "Ha dicho que aún no se ha decidido quién será el próximo gobernante", dice Illuna. "¿Eso significa que no planea convertirse usted mismo en rey?"

              "Bueno, no... no necesariamente", dice el rey del subsuelo. "Aquí hay mucha gente válida, tanto entre mis seguidores como entre los rebeldes, que podría ser una candidata adecuada. Incluso podríamos intentar elegir un consejo, para evitar que una sola persona vuelva a concentrar demasiado poder. Sin embargo, esos asuntos se debatirán con más detalle una vez que cumplamos nuestro objetivo principal de destronar al rey loco. Todo lo demás es secundario."

              "Entonces, ¿por eso nos llamó aquí?", dice Kate. "¿Quiere que nuestros dos grupos unan fuerzas?"
