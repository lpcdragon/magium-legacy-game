scenes:
  - name: b3_ch03a_intro
    texts:
      - source: scene_text
        paragraph: 2
        text: |-
          "Pónganse cómodos", dice el rey del subsuelo en cuanto entramos todos en la sala del trono. "He preparado unas cuantas sillas para ustedes, pero también pueden quedarse de pie, si quieren."

          Mientras cada uno va a sentarse en una silla, el rey toma asiento en su 'trono', que sinceramente no es muy diferente de las sillas de madera en las que nosotros nos estamos sentando ahora, salvo porque es un poco más grande y tiene unos cuantos adornos. En ese momento hay dos guardias de pie a cada lado del trono, mientras Albert y Peter están apoyados contra la pared a nuestra izquierda. El resto estamos todos sentados en las sillas que quedan frente al rey, incluido el padre de Leila y Breynan, a quienes también invitaron a la reunión junto con nosotros.

          "Bien, entonces...", dice el rey del subsuelo mientras adopta una expresión seria. "Creo que deberíamos ir directo al grano. Cuando me hablaron de su grupo, no sabía que la chica stillwater estaba en su equipo, pero ahora que sé que viene con ustedes, todo tiene mucho más sentido. ¿Debo suponer entonces que han venido aquí para matar al rey de Ollendor?"

          "Vinimos para eso...", dice Melindra. "Pero no recuerdo haberlo conocido nunca. ¿Cómo sabe quién soy?"
      - source: scene_text_2
        paragraph: 2
        text: |-
          "Bueno, no sé su nombre", dice el rey, "pero he tenido informantes en el palacio desde hace bastante tiempo, y hace ocho años me contaron que el rey loco desterró de nuestro continente a una chica stillwater que llevaba pijama. Por suerte para mí, sigue llevando el mismo tipo de ropa, así que fue fácil reconocerla incluso a partir de una descripción tan vaga."

          "¡Oye!", dice Melindra. "¡Que le quede claro que esta ropa no se parece en nada a lo que ustedes usan como pijama! Dígame... ¿qué pijama ha visto usted con un diseño tan elegante y una tela de tanta calidad? ¿Tiene idea de cuánto tardé en encontrar a alguien capaz de hacerme esta ropa a medida? Hace seiscientos años, los únicos que no vestían este tipo de prendas eran los sirvientes y los prisioneros, pero hoy en día la gente ni siquiera sabe distinguir que no son para dormir. ¡Es escandaloso!"

          "¡Mis disculpas!", dice el rey del subsuelo. "No pretendía insultar su ropa. Solo estaba repitiendo lo que me contaron mis hombres. Imagino que la mayoría de las prendas empiezan a parecer incómodas una vez que uno se acostumbra a llevar solo ropa hecha con una seda tan fina."

          "¡Sí!", dice Melindra. "¡Esa es exactamente la razón por la que no puedo obligarme a usar ningún otro tipo de ropa! ¡Por fin alguien lo entiende!"
    effects:
