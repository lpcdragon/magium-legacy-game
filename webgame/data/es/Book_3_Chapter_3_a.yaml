  - name: b3_ch03a_workbench
    routes:
      - condition: b3_ch3_magical = 0
        texts:
          - source: scene_text
            paragraph: 30
            text: |-
              "¿No hay forma de descifrar el código sin usar fuerza bruta?"

              "Si te limitas únicamente a descifrar el código, sin intentar desbloquear las estadísticas por la fuerza, no deberías correr ningún riesgo de dañar tu dispositivo", dice el padre de Leila. "Sin embargo, ten en cuenta que un método así podría tardar muchísimo en darte resultados. Todo depende de tu suerte."

              "Entonces esperemos que tengamos muchísima suerte...", digo.
          - source: scene_text_2
            paragraph: 14
            text: |-
              "¿Puedo hacer una pregunta?", dice el padre de Leila. "¿Por qué necesitas desbloquear las estadísticas mágicas? Hasta donde yo sé, solo los medios lessathi pueden usarlas."

              "Ah, es porque en realidad sí soy medio lessathi", digo. "Incluso ya tuve la ocasión de usar esas estadísticas antes, cuando activé el modo de emergencia del dispositivo, así que ya sé que funcionan conmigo."

              "¿Eres medio lessathi?...", dice el padre de Leila. "Leila, ¿tú lo sabías?"

              "Sí, me enteré al mismo tiempo que él", escribe Leila. "Él tampoco sabía que era medio lessathi hasta hace poco. De hecho, ni siquiera sabía que tuviera sangre lessathi en las venas hasta que se unió a este torneo."

              "Cuanto más descubro sobre ti, más me intrigas, Barry", dice el padre de Leila. "La verdad es que tendría muchas más preguntas que me gustaría hacerte, pero no quisiera quitarte demasiado tiempo solo por satisfacer mi curiosidad. Por ahora ya he terminado con el dispositivo de Leila, pero para trabajar en el tuyo voy a necesitar algo de tiempo a solas y concentrarme. ¿Podrías volver dentro de unas horas? En condiciones normales ya debería haber terminado para entonces."
          - source: scene_3
            paragraph: 13
            text: |-
              "Por supuesto", escribe Leila, mientras recoge su dispositivo de estadísticas del banco de trabajo. "En ese caso, lo dejaremos trabajar. Vamos, Barry, de momento volvamos a la sala de espera."

              Leila y yo nos despedimos del doctor Reidzek y luego regresamos con nuestros amigos por el mismo corredor por el que habíamos venido.

              De camino nos cruzamos con Peter y con algunas otras personas que no reconocemos, que estaban usando ese mismo pasillo para llegar a distintas zonas de la base rebelde subterránea y, mientras caminamos, Leila aprovecha para hacerme unas cuantas preguntas más sobre mi pasado. Después de caminar unos minutos, por fin volvemos a la sala de espera, donde vemos que Daren y Hadrik ya habían sido curados y ahora nos estaban esperando.
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch03a_technique
      - condition: b3_ch3_magical = 1
        texts:
