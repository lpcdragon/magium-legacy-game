  - name: b3_ch03a_technique
    texts:
      - source: scene_text
        paragraph: 33
        text: |-
          "¡Ah, bien, ya volvieron!", dice Daren cuando nos ve acercarnos. "Justo estábamos hablando de qué deberíamos hacer después. ¿Qué creen ustedes que..."

          "Oigan todos", escribe Leila con grandes letras azules, haciendo que Daren se calle a mitad de frase, "¿sabían que Barry es quien inventó la técnica de disipación de Brinhorn?"

          "¿Qué?...", dice Daren, mientras los demás me miran con expresión desconcertada. "No, no seas ridícula. Esa técnica la inventó Brinhorn. Hasta está en el nombre. Seguro que Barry estaba bromeando y tú lo malinterpretaste o algo así."

          "No estaba bromeando", digo. "De verdad se me ocurrió a mí esa técnica cuando trabajaba como aprendiz de Brinhorn. Le dije que podía ponerle su nombre porque tampoco me importaba mucho llevarme el mérito. De todos modos, sigo sin ver qué tiene tanto de especial. Es solo una técnica como cualquier otra. Aunque no se me hubiera ocurrido a mí, estoy seguro de que alguien más habría acabado inventándola tarde o temprano."

          "Barry, ¿qué estás dic--", empieza a decir Daren, pero Arraka lo interrumpe.

          "No está mintiendo...", dice Arraka con un tono de voz muy sombrío, casi como si estuviera en su lecho de muerte. "He estado observando de cerca su aura todo este tiempo y no está mintiendo. No, no, no, esto no puede ser posible. ¡Él no! ¡Cualquiera menos él! ¡Vamos ya!"
      - source: scene_text_2
        paragraph: 15
        text: |-
          "¿Por qué te afecta tanto esto?", le pregunta Illuna. "Como él dijo, es solo una técnica sencilla. Aunque una persona normal que no pueda lanzar magia haya leído bastantes libros, debería ser capaz al menos de idear una técnica por sí sola, ¿no?"

          "No es SOLO una técnica", dice Arraka. "¿Es que no lo entiendes? Llevo viva más de diez mil años y jamás se me ocurrió esta idea. Era tan simple y, aun así, de algún modo nunca se me pasó por la cabeza. Y no fue por falta de intentarlo, precisamente. ¿Tienes idea de lo increíblemente difícil que era disipar un hechizo complejo antes de que existiera esta técnica? Demonios, hasta yo empecé a usarla, porque era demasiado buena como para dejarla pasar. Pero enterarme de que la inventó Barry... ¿Todo este tiempo he estado usando una técnica inventada por BARRY? Oh, dioses, creo que voy a ponerme mala. Soy un espíritu dentro de un amuleto y aun así siento que necesito vomitar. No puedo... no... Ugh..."
      - source: scene_3
        paragraph: 14
        text: |-
          De pronto Arraka empieza a hacer ruidos de arcada, aunque es obvio que no puede vomitar de verdad en su forma incorpórea. Los demás siguen pareciendo algo confundidos, sin saber muy bien cómo reaccionar, salvo Daren, que parece bastante impresionado.

          "¡Bueno, maldita sea!", dice Daren con una sonrisa. "La técnica de Brinhorn es justo lo que usé como referencia cuando creé la mayoría de los encantamientos de disipación más recientes que lleva mi espada. Pero pensar que Barry fuera la persona de la que saqué la idea... ¡Ven aquí, cabrón escurridizo!"

          Entonces se acerca a mí y me rodea el cuello con el brazo derecho, mientras cierra la mano izquierda en un puño para frotarme los nudillos unas cuantas veces contra la coronilla, básicamente haciéndome una novatada.

          "¿Qué más nos has estado ocultando, eh?", dice Daren, todavía sonriendo mientras me restriega los nudillos por la cabeza. "¿Vamos a acabar descubriendo que antes fuiste mentor de Azarius? Vamos... ¡suéltalo ya!"

          "¡Oye, ya basta!", digo, apartándome de él. "Escucha, sinceramente no pensé que fuera algo digno de mención. Pasó hace años y nunca me dediqué a la investigación mágica después de aquello ni nada parecido. Fue solo una idea que se me ocurrió en un momento, porque Brinhorn y yo necesitábamos salir de un laberinto lleno de trampas mágicas. No hay razón para darle tanta importancia."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch03a_fluke
  - name: b3_ch03a_fluke
    texts:
      - source: scene_text
        paragraph: 34
        text: '"No le hagan caso a este idiota", dice Arraka, que aparentemente ya ha superado la sensación de náusea mientras tanto. "No sé si fue una chiripa o no, pero revolucionar por accidente una rama entera de la magia no es algo que pueda tomarse a la ligera. Y, para ser sincera, no creo que fuera una chiripa. Siempre me pareció raro que Barry-boy pudiera averiguar cómo funcionaban los trucos de Eiden con tan poca interacción con él, pero ahora que sé de lo que es capaz, todo tiene mucho más sentido. No me importa si este es algún talento latente suyo por ser medio lessathi, o si es resultado directo de su obsesión monomaníaca por convertirse en mago, o incluso si es un poco de ambas cosas, pero maldita sea si no voy a sacar todo el partido posible de esto. ¡Cambio de planes, todos! Barry es oficialmente nuestra baza secreta. A partir de ahora, desbloquear sus estadísticas mágicas pasa a ser la máxima prioridad. No aceptaré un ''no'' por respuesta. Quiero que tengamos una sesión de lluvia de ideas todos y cada uno de los días para intentar encontrar nuevas formas de desbloquearle esas dos estadísticas. ¿Ha quedado claro?"'
      - source: scene_text_2
        paragraph: 16
        text: |-
          Durante la siguiente media hora más o menos, a petición de Arraka, dedicamos el tiempo a intentar idear alguna forma distinta de hacer funcionar mis estadísticas mágicas. Les conté a todos que el padre de Leila no podía ayudarnos con este asunto, así que nos tomamos el asunto por nuestra cuenta para intentar idear maneras nuevas y extravagantes de conseguir el código necesario para desbloquear esas estadísticas. Sin embargo, nuestro entusiasmo inicial no tardó en apagarse, porque pronto llegamos a la conclusión de que nuestro ir y venir sin sentido no nos estaba ayudando a avanzar de forma significativa.

          "Escucha, Arraka", dice Daren. "Ya hemos tenido exactamente este mismo intercambio tres veces desde que empezó la conversación. Sabes que no tenemos mejores opciones. ¿Por qué no nos limitamos a seguir con nuestro plan original de intentar descifrar el código usando mis herramientas de encantamiento?"
      - source: scene_3
        paragraph: 15
        text: |-
          "¡Porque va a llevar demasiado tiempo!", dice Arraka. "La próxima prueba podría llegar cualquier día, por lo que sabemos. No podemos permitirnos gastar todo nuestro tiempo solo en desbloquear unas estadísticas. Tenemos que encontrar una forma mejor y más eficaz de descifrar ese código. ¡Por eso me llevo media hora partiéndome la espalda para idear un plan alternativo!"

          "Pero ya le hemos dado mil vueltas", dice Daren. "No hay otra manera. ¿No podemos centrarnos simplemente en algo que sí podamos hacer, en lugar de intentar una y otra vez lograr lo imposible?"

          "Si así es como vas a pensar, no te sorprendas luego cuando ese perdedor sin magia de ahí te pase por delante y te deje comiendo polvo", dice Arraka. "Si algo podemos aprender de ese idiota, es que hasta lo imposible puede lograrse si el nivel de determinación que tienes roza lo enfermizo."

          "Nunca pensé que vería el día en que Arraka le haría un cumplido sincero a Barry", dice Hadrik. "Barry, ¡parece que estás ascendiendo en el mundo!"
    choices:
      - position: 1
        text: Bueno, es lo mínimo que podía hacer después de usar una de mis técnicas sin mi permiso.
        effects:
          - set:
              current_scene: b3_ch03a_permission
      - position: 2
        text: ¿Lo hizo? Qué gracioso. Habría jurado que acaba de llamarme perdedor e idiota.
        effects:
          - set:
              current_scene: b3_ch03a_moron
      - position: 3
        text: No hay propósito más elevado en la vida que ser elogiado por un espíritu dentro de un amuleto.
        effects:
          - set:
              current_scene: b3_ch03a_purpose
  - name: b3_ch03a_permission
    texts:
      - source: scene_text
        paragraph: 35
        text: |-
          "Bueno, es lo mínimo que podía hacer después de usar una de mis técnicas sin mi permiso."

          "Muy gracioso, Barry-boy", dice Arraka. "Pero ya veremos cuánto te ríes cuando por fin desbloqueemos tus estadísticas mágicas. Te aseguro que voy a hacerte trabajar día y noche para que aprendas a dominarlas."

          "¿De verdad crees que tendrías que obligarme a aprender magia?...", digo. "Si consigo hacer funcionar esas dos estadísticas, me verás practicando magia hasta dormido."

          "Escuchen", dice Daren. "Si ya hemos terminado con la lluvia de ideas, preferiría retomar la conversación anterior sobre qué vamos a hacer con el rey del subsuelo y los rebeldes. Por ejemplo, ¿qué les parece el plan del rey con el Supervisor? ¿Deberíamos seguirle el juego o no?"
      - source: scene_text_2
        paragraph: 17
        text: |-
          "Recomiendo esperar un poco más antes de decidir", dice Kate. "No creo que tengamos suficiente información todavía como para llegar a una conclusión adecuada."

          "Bueno, supongo que esperar un poco más no puede hacer daño...", dice Daren. "Al fin y al cabo, el rey dijo que nos deja tiempo para decidir hasta mañana."

          Hace una pausa.

          "De acuerdo, entonces", dice Daren. "Todos lo pensaremos un poco más y tomaremos una decisión esta noche o mañana por la mañana como muy tarde. Pero, sea cual sea la decisión que tomemos, tiene que ser unánime. ¿De acuerdo?"

          "Sí", decimos todos al unísono.

          "Bien", dice Daren. "Ahora que eso está resuelto, me gustaría ir a echar otro vistazo al área de cuarentena. Arraka, antes dijiste que me ayudarías con la cura de la plaga. ¿Sigue en pie esa oferta?"

          "Sí, sí", dice Arraka. "Solo llévame allí y veremos qué pasa."
      - source: scene_3
        paragraph: 16
        text: |-
          "Aquí la tienes", dice Illuna mientras le entrega el amuleto a Daren. "Recuerda vigilarla siempre. Si no prestas atención, intentará liberarse del amuleto en un abrir y cerrar de ojos."

          "Tendré cuidado", dice Daren. "Pero aun así todavía debería tardar unas cuantas horas en crear una explosión desde ahí dentro, ¿no?"

          "Normalmente sí, pero puede que tenga otros trucos bajo la manga que no conocemos", dice Illuna. "Solo asegúrate de mantener la mente abierta."

          "Entendido", dice Daren.

          "Tsk, tsk, tsk", dice Arraka, mientras Daren la sostiene por la cadena y se dirige hacia la zona de cuarentena. "¿Tan poco confías en mí, Illuna? ¡Pensaba que te había criado mejor que eso!"

          "Los veré luego a todos", nos dice Daren desde la distancia, mientras Illuna ignora por completo a Arraka. "¡Asegúrense de llamarme por el transceptor si surge algo importante!"

          "¡Sí, lo haremos!", dice Hadrik. "¡Buena suerte!"
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch03a_recording
  - name: b3_ch03a_moron
    texts:
      - source: scene_text
        paragraph: 36
        text: |-
          "¿Lo hizo? Qué gracioso. Habría jurado que acaba de llamarme perdedor e idiota."

          "Nah, seguro que solo bromeaba", dice Hadrik. "¡Es toda una bromista, esa Arraka!"

          "Ah, sí, error mío", digo. "Supongo que su sentido del humor era demasiado sutil para mí."

          "Escuchen", dice Daren. "Si ya hemos terminado con la lluvia de ideas, preferiría retomar la conversación anterior sobre qué vamos a hacer con el rey del subsuelo y los rebeldes. Por ejemplo, ¿qué les parece el plan del rey con el Supervisor? ¿Deberíamos seguirle el juego o no?"
