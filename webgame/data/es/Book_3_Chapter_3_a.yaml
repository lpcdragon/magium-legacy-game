  - name: b3_ch03a_roam
    texts:
      - source: scene_text
        paragraph: 9
        text: |-
          "¿Podemos movernos libremente mientras estemos aquí?"

          "Sí, pueden ir adonde quieran, salvo a unas pocas zonas restringidas", dice el rey del subsuelo. "Sabrán enseguida cuáles son, porque normalmente hay al menos un guardia apostado fuera de cada puerta. También son libres de ir a la superficie si quieren, aunque no lo recomendaría hasta que al menos se hayan recuperado por completo de la batalla de antes."

          "Solo tengo una pregunta", dice Daren. "¿Hay por aquí algún mago blanco que no sea principiante y pueda lanzarnos un hechizo de curación rápido a Hadrik y a mí? Sigo demasiado cansado como para lanzar hechizos de curación decentes y estas heridas empiezan a resultar un poco incómodas..."

          "Ah, sí, por supuesto", dice el rey. "Haré que uno de nuestros sanadores venga a verlos en cuanto termine con sus pacientes actuales. Mientras tanto, pueden volver a la sala de la que venimos y esperarlo allí, a menos que tengan alguna otra pregunta que hacerme."

          "Nah, creo que ya estamos bien", dice Hadrik.

          "Muy bien, entonces", dice el rey. "Pues en ese caso, espero que todos disfruten de su estancia y retomaremos esta conversación mañana, después de que hayan tomado una decisión."
      - source: scene_text_2
        paragraph: 6
        text: |-
          Hace una pausa de un segundo para echarle un vistazo rápido a Kate, pero luego se dirige a uno de los rebeldes.

          "Ah, y una cosa más", dice el rey. "Breynan, sé que esto no te parecerá justo, pero quiero que mañana te quedes aquí cuando nuestros hombres visiten al Supervisor."

          "¿Mi rey?...", dice Breynan, aparentemente en estado de shock.

          "Me doy cuenta de que estoy yendo contra tus deseos, pero espero que respetes mi decisión", dice el rey del subsuelo con un tono más firme.

          "Pero, majestad...", dice Breynan. "¡De toda la gente de este lugar, yo soy con diferencia quien mejor conoce al Supervisor! ¡Además, he tratado con él directamente en numerosas ocasiones!"

          "Y precisamente por eso no quiero que formes parte de ese equipo mañana", dice el rey. "Estás demasiado implicado emocionalmente en este asunto como para mantener la cabeza fría. Quiero asegurarme de que las negociaciones se lleven a cabo de forma profesional, por gente que no corra el riesgo de dejar que sus sentimientos nublen su juicio. Ten por seguro que he leído todos tus informes sobre el Supervisor y me aseguraré de que el equipo de negociación de mañana tenga en cuenta todas tus notas. Sin embargo, tú no vas a unirte a ese equipo, y esa es mi decisión final. ¿Ha quedado claro?"

          "Sí... alteza", dice Breynan, con aspecto bastante abatido.
