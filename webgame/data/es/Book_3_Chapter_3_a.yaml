  - name: b3_ch03a_suspecting
    texts:
      - source: scene_text
        paragraph: 44
        text: |-
          "Veo que Eiden también sospecha que el Supervisor es más inteligente de lo que aparenta."

          "A estas alturas, probablemente lo más seguro sea asumir que el Supervisor está ocultando algo", dice Illuna. "Con un poco de suerte, tal vez lo único que quiere sea librarse de Billy Bob y de los lessathi, sin ninguna otra intención oculta, pero no podemos saberlo con certeza."

          "Todavía no tengo muy claro de qué iba todo esto, pero tenemos que llevarle esta grabación al rey del subsuelo cuanto antes", dice Peter. "Bill, ¿lo tienes todo listo?"

          "Aún no", dice Bill mientras pulsa unos botones. "Primero tengo que pasarlo todo al cubo. Anda, échame una mano. Irá más rápido si trabajamos los dos al mismo tiempo."

          "De acuerdo", dice Peter, y luego se vuelve hacia nosotros. "Lo siento, pero ¿podrían volver ustedes solos a la sala de espera? Parece que aún tengo cosas que atender aquí."

          "Claro", digo. "Vamos."

          Abrimos la trampilla para bajar por las escaleras y, una vez en el pasillo exterior, empezamos a volver hacia la sala de espera. No tardamos en llegar y ver que Hadrik seguía sentado en la misma silla en la que lo dejamos, con una expresión inusualmente seria en el rostro mientras mira a la distancia. Cuando nos nota, intenta recuperar su aspecto alegre de siempre y nos pregunta qué tal ha ido el viaje.
      - source: scene_text_2
        paragraph: 22
        text: |-
          "Escuchamos por casualidad a Eiden y al Supervisor hablando mientras estábamos en la sala de grabación", le dice Kate a Hadrik. "Hablaban de algunos secretos oscuros que la realeza de esta ciudad oculta al pueblo llano, pero fueron demasiado vagos con todo como para que pudiéramos saber a qué se referían exactamente. Aparte de eso, parece que Eiden también sospecha que el Supervisor está actuando, aunque no logró hacer que confesara nada."

          "Entonces, ¿justo les dio por escuchar una conversación entre esos dos mientras pasaban por allí?...", nos pregunta Hadrik.

          "No fue coincidencia", le digo. "Eiden nos detectó con su sentido mágico y enseguida atrajo a una de las bolas metálicas de ojos verdes a un sitio donde sabía que había un dispositivo de escucha. Quería que oyéramos esa conversación."

          "Mmm...", dice Hadrik. "Entonces, ¿de qué lado creen que está Eiden ahora mismo?"
      - source: scene_3
        paragraph: 20
        text: |-
          "No creo que esté del lado de nadie", digo. "Conociéndolo, o nos está poniendo a prueba o está intentando jugar con nuestras cabezas de algún modo. O quizá ambas cosas a la vez. En cualquier caso, lo último que deberíamos suponer es que intenta ayudarnos."

          "Sí, probablemente esa sea la forma más segura de interpretar todo esto", dice Hadrik. "Entonces, ¿qué planean hacer ahora?"

          "Supongo que de momento no vamos a salir a la superficie, así que lo mejor que podemos hacer es seguir con nuestro entrenamiento", dice Illuna. "Flower y yo aún tenemos que practicar el afilado de nuestros elementos mágicos, y lo mismo Kate. Creo que tú también tienes entrenamiento pendiente, si no me equivoco. Todavía no te has puesto en contacto con el espíritu del plano mágico con el que estás vinculado, ¿verdad?"

          "Ah, claro, casi se me había olvidado", dice Hadrik. "Sí, supongo que yo también debería entrenar un poco."

          "Cada uno debería intentar buscar túneles lo bastante vacíos como para no molestar a nadie al lanzar hechizos", dice Illuna. "Flower y yo iremos por ese lado."
    choices:
