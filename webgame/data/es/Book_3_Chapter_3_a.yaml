        text: |-
          "Bien", dice el rey del subsuelo. "Entonces los veré más tarde. Confío en que pueden volver por su cuenta a la sala de espera, ¿verdad?"

          "Nos apañaremos", dice Daren. "Vamos, vámonos."

          Luego echa a andar cojeando delante de nosotros y todos lo seguimos, salvo Albert, que parece seguir teniendo algo que quiere hablar en privado con el rey. Cuando volvemos a entrar en la sala de espera, nos colocamos cerca de las sillas junto a la salida que lleva al teletransportador y esperamos pacientemente a que lleguen los sanadores. Mientras tanto, Peter fue a preparar nuestras habitaciones, mientras que Breynan también siguió su propio camino sin siquiera despedirse de nosotros, todavía bastante afectado por lo que le había dicho el rey del subsuelo.

          "Supongo que Kelrim habrá vuelto al área de cuarentena", dice Daren, después de echar un vistazo rápido alrededor y ver que el goblin no está por ninguna parte.

          "Ah, sí...", dice Hadrik. "Casi me había olvidado del goblin. Va a ser un poco difícil mirarlo a la cara de ahora en adelante, teniendo en cuenta lo que les hicimos a sus amigos..."

          "Al menos tú no llegaste a matar a ninguno personalmente", dice Daren. "Cuando me di cuenta de que el goblin al que maté era uno de los amigos de Kelrim, me sentí como la peor escoria del mundo. Nunca pensé que fuera a sentirme así por matar a un monstruo..."

          Kate no dice nada, pero aparta la mirada de nosotros. Parece controlar mejor sus emociones esta vez, aunque está claro que sigue muy afectada por toda esta situación.
