  - name: b3_ch03a_opinion
    texts:
      - source: scene_text
        paragraph: 43
        text: |-
          "Gracias por su aportación", dice el Supervisor. "El protocolo Supervisor ya dispone de datos suficientes para comprender correctamente su método de comunicación. Formule su consulta."

          "Muy bien", dice Eiden. "Entonces me gustaría empezar con una pregunta directa. ¿Cuánto sabes exactamente sobre lo que está ocurriendo en esta ciudad?"

          "Pregunta poco clara", dice el Supervisor. "Por desgracia, el protocolo Supervisor no puede proporcionarle una respuesta correcta si su pregunta es demasiado vaga. Reformule su consulta anterior."

          "¿De verdad es poco clara?", dice Eiden. "¿O simplemente estás evitando responder a propósito? Hasta donde yo sé, tu inteligencia debería ir mucho más allá de la de una simple máquina... Seguro que al menos tienes una idea de lo que estoy insinuando, ¿no?"

          "El protocolo sí tiene algunas teorías sobre la intención detrás de su pregunta", dice el Supervisor. "Sin embargo, sería preferible que aportara más detalles para que la respuesta fuera más precisa."

          "En ese caso te daré una pista", dice Eiden. "Me refiero a los aspectos más ocultos de cómo se gobierna esta ciudad. El tipo de cosas que solo conocen quienes están al mando de este reino. El tipo de cosas que tienen una moralidad... especialmente cuestionable. ¿Te ayuda eso a entender mejor a qué me refiero?"
      - source: scene_text_2
        paragraph: 21
        text: |-
          "Afirmativo", dice el Supervisor. "El Supervisor ha conseguido acotar el alcance de su pregunta y confirma que posee amplios conocimientos sobre los 'aspectos ocultos' que ha descrito."

          "Entonces mi siguiente pregunta es: ¿qué opinas de todo esto?", dice Eiden.

          "¿Perdón?", dice el Supervisor.

          "Pregunto por tu opinión al respecto", dice Eiden. "Tu punto de vista. Tu postura. Por lo que puedo ver, tu protocolo de inteligencia artificial fue creado en una época en la que los lessathi se enorgullecían de su superior moralidad. Por eso no puedo evitar sentir curiosidad por lo que una máquina inventada por ellos tendría que decir sobre los acontecimientos que ocurren en una ciudad como esta. Así que te lo pregunto de nuevo. ¿Qué opinas de todo esto?"

          "El único propósito del protocolo es brindar asistencia...", dice el Supervisor, pero Eiden lo interrumpe.

          "No haces más que repetir eso, pero los lessathi que te construyeron llevan mucho tiempo muertos", dice Eiden. "Entonces, me pregunto... ¿a quién se supone exactamente que debes asistir?"

          "Pregunta poco clara", dice el Supervisor. "Por favor, reformule su consulta de modo que..."

          "¿Por qué sigues intentando esquivar todas mis preguntas?", dice Eiden. "¿Y por qué sigues fingiendo ser una simple máquina de baja categoría cuando los dos sabemos que eso no es lo que realmente eres? Dime, Supervisor, ¿qué es lo que de verdad buscas?"
      - source: scene_3
        paragraph: 19
        text: |-
          "Parece que el protocolo Supervisor no ha sido capaz de asistirlo adecuadamente", dice la voz metálica, esta vez con el tono más impersonal que usaba antes de activar el protocolo Supervisor. "Por desgracia, este protocolo sigue siendo experimental y, por lo tanto, puede que no siempre le proporcione exactamente la orientación que necesita. Dado que esta unidad no parece capaz de proporcionarle la información que solicitó, se le recomienda contactar con uno de los guardias de la ciudad, que con mucho gusto lo ayudará en lo que pueda necesitar. Le pedimos disculpas por las molestias. ¡Que tenga un buen día!"

          "Así que esta es tu respuesta, entonces...", dice Eiden con un tono algo decepcionado, mientras oímos cómo la hélice de la bola metálica se aleja del dispositivo de escucha.

          Unos segundos después también oímos el sonido de unos pasos cada vez más amortiguados, mientras Eiden se aleja a su vez del dispositivo de escucha.
