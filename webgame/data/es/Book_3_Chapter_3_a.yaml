              "No pasa nada, puede trabajar antes en el dispositivo de Leila", digo. "No tengo tanta prisa."
            condition: premonition < 4 AND b3_ch1_unlock != 2
          - source: scene_text_2
            paragraph: 9
            text: |-
              Justo antes de dárselo, de pronto tengo una visión, pero esta vez todo está borroso y lo único que alcanzo a distinguir son algunos ruidos vagos. Primero oigo el sonido de unas cadenas sacudiéndose. Luego oigo a un niño pequeño gritar en la distancia. Y por último, justo antes de que la visión termine, oigo a Melindra gritar con fuerza, presa del pánico: "¡Barry, espera! ¡No lo hagas!"

              Cuando la visión termina, me quedo confundido y bastante perturbado. Nunca había tenido una premonición tan vaga. ¿De qué podía estar intentando advertirme? ¿Y cuándo van a suceder estas cosas?

              "¿Te encuentras bien, Barry?", pregunta el padre de Leila al verme allí de pie, con el dispositivo en la mano.

              "¿Qué?...", digo. "Ah, sí, estoy bien. Aquí tiene el dispositivo."

              Le entrego mi potenciador de estadísticas y lo coloca sobre el banco de trabajo. Luego saca de la mesa dos herramientas metálicas de encantamiento afiladas, con las que empieza a manipular con cuidado el aura alrededor del dispositivo.

              "Mmm...", dice el padre de Leila. "Hace tiempo que no trabajo con un dispositivo de estadísticas no modificado. Voy a tardar un poco en volver a acostumbrarme. Barry, ¿te importaría si trabajara antes en el potenciador de estadísticas de Leila que en el tuyo? Solo necesito hacerle unos pequeños ajustes al suyo, pero me llevará al menos unas horas terminar con el tuyo."

              "No pasa nada, puede trabajar antes en el dispositivo de Leila", digo. "No tengo tanta prisa."
            condition: premonition = 4 AND b3_ch1_unlock != 2
          - source: scene_3
            paragraph: 10
            text: |-
              "¡Estupendo!", dice el padre de Leila mientras aparta mi dispositivo. "Leila, ¿puedes darme tu dispositivo, por favor?"

              En cuanto Leila le entrega su potenciador de estadísticas a su padre, este lo pone sobre la mesa y empieza a trabajar en él con las mismas herramientas de encantamiento que estaba usando antes. Durante unos veinte segundos más o menos, tanto Leila como yo observamos al doctor Reidzek en completo silencio, mientras sigue moviendo sus herramientas con muchísimo cuidado por encima de la superficie del dispositivo.

              "No hace falta que estén tan callados, ya saben", dice el padre de Leila, alzando ligeramente la cabeza para mirarnos. "Puedo concentrarme incluso si ustedes dos se ponen a charlar un poco mientras tanto."

              "Ah", escribe Leila. "Bueno, en ese caso, supongo que no me importaría oír un poco más sobre la vida de Barry antes del torneo. ¡Cuéntanos más sobre tus aventuras, Barry!"

              "Ya te dije que en realidad no hay nada tan interesante de lo que hablar...", digo.

              "Creo que solo dices eso porque has leído demasiadas historias de magos", escribe Leila. "Según los estándares de la mayoría de la gente, incluso el simple hecho de salir de tu pueblo y explorar el mundo ya es una aventura en sí mismo. Mira, deja que te ayude. ¿Por qué no nos cuentas más sobre esos magos de los que fuiste aprendiz? Tiene que haber al menos una historia interesante de aquella época que puedas contarnos, ¿no?"
        choices:
