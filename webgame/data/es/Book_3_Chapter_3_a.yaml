            paragraph: 31
            text: |-
              "¿Hay alguien aparte de los lessathi de alto rango que pudiera conocer el código?"

              "Es posible", dice el padre de Leila. "Sobre todo si están muy familiarizados con parte del personal de alto rango o si trabajan directamente a sus órdenes y lo oyeron por accidente en algún momento. Por desgracia, esto no deja de ser pura especulación por mi parte y no tengo a ninguna persona concreta en mente."

              "Sí, imaginaba que ese sería el caso", digo. "¡Gracias de todas formas!"
