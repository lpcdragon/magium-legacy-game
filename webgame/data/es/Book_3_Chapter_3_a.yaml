              "Mmm... supongo que unos cinco días, ya", digo. "Pero también pasamos bastante tiempo juntos en los días previos a la arena, ideando estrategias e intentando sabotear el evento."

              "Claro, claro...", dice el padre de Leila, mientras busca otra llave que parece haber extraviado. "Entonces, ¿ya han hecho planes para la boda?"

              "¡Padre!", escribe Leila con el ceño fruncido. "¡No es eso! Barry es solo un amigo. Y además, ya tiene una relación con Melindra."
