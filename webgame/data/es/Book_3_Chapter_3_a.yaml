  - name: b3_ch03a_happening
    texts:
      - source: scene_text
        paragraph: 40
        text: |-
          "No lo entiendo. ¿Esto está ocurriendo ahora mismo o es una grabación?"

          "No es una grabación, pero... no lo entiendo...", dice Peter. "Se supone que el dispositivo de escucha desde el que estamos oyendo estas voces está colocado en una bodega abandonada justo debajo del castillo. No creo que hayamos captado jamás conversaciones de esa sala antes. ¿Por qué se tomarían la molestia de mantener su conversación en un sitio así?"

          "Adivínelo", dice Illuna.

          "¿Pueden dejar de distraerme y guardar silencio un minuto?", dice Bill, mientras pulsa frenéticamente los botones de uno de los dispositivos metálicos de la sala. "Estoy intentando asegurarme de que los dispositivos de grabación funcionen correctamente. ¡El rey me cortará la cabeza si se pierde esta conversación por mi culpa!"

          "Protocolo Supervisor iniciado", dice la voz metálica. "Por favor, esperen..."

          "Oh, no hay problema", dice Eiden con voz calmada. "Tómate todo el tiempo que necesites."

          Tras unos instantes de silencio, volvemos a oír la voz metálica, pero esta vez usa más inflexiones en el tono, de modo que suena algo más parecida a lo que normalmente sería una voz humana.

          "Interesante", dice el Supervisor. "Analizando los registros de esta unidad, parece que no llegó aquí por casualidad, sino que se tomó la molestia de traer esta unidad al rincón vacío de esta bodega desierta. ¿Es correcto?"
      - source: scene_text_2
        paragraph: 20
        text: |-
          "Sí", dice Eiden. "Sentí que el aire aquí es mucho más fresco que en el resto del castillo. ¿No te parece?"

          "Procesando...", dice el Supervisor. "Tras analizar su declaración anterior, así como varios comentarios que hizo en el pasado, el protocolo Supervisor ha llegado a la conclusión de que prefiere usar el sarcasmo como método principal de comunicación. ¿Es correcto?"

          Eiden se ríe.

          "Me gusta tu enfoque directo", dice. "Sí, supongo que en su mayor parte eso es correcto."

          "Gracias por la confirmación", dice el Supervisor. "El protocolo Supervisor está intentando ahora adaptarse a su estilo concreto de conversación. Esto puede llevar un tiempo, ya que los habitantes de este castillo parecen incapaces de comprender el concepto de sarcasmo, así que no hay muchos ejemplos recientes disponibles para el análisis."

          "Por supuesto", dice Eiden. "Tómate tu tiempo."
      - source: scene_3
        paragraph: 18
        text: |-
          "Solicitando aclaración", dice el Supervisor tras unos cinco segundos de silencio. "Cuando se refiere directamente al rey de Ollendor, parece haber usado con frecuencia el sintagma 'oh, gran y esclarecido rey'. A juzgar por las sutiles inflexiones de su tono al usar esta expresión, parece que siempre la ha usado de forma sarcástica, aunque el rey nunca lo haya percibido. ¿Es correcto?"

          "¿Y qué harías con esa información si te la revelara?", dice Eiden.

          "El protocolo Supervisor le asegura que esta información se utilizará únicamente con fines analíticos y que permanecerá completamente confidencial", dice el Supervisor. "No hay necesidad de preocuparse por posibles filtraciones."

          "¿Ah, sí?", dice Eiden. "¿Debo entender entonces que la conversación que estamos manteniendo ahora también permanecerá en secreto?"

          "El protocolo Supervisor nunca revelará una conversación privada a terceros", dice el Supervisor. "El único propósito del protocolo es brindar asistencia. Sin embargo, debe señalarse que el protocolo Supervisor no puede controlar el flujo de información que pueda derivarse de cualquier persona que esté escuchando esta conversación en este mismo momento."

          "No es un problema", dice Eiden. "Y la respuesta a tu pregunta inicial sería 'sí'."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch03a_opinion
