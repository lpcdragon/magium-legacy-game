  - name: b3_ch03a_mundane
    texts:
      - source: scene_text
        paragraph: 16
        text: |-
          Después de despedirme con la mano de mis amigos, Leila, su padre y yo nos dirigimos juntos hacia uno de los pasillos que salen de la sala de espera. Mientras entramos en el túnel, podemos oír la voz atronadora de Hadrik resonando por todo el corredor, cuando empieza a contarle a todo el mundo una historia de sus viajes que acaba de recordar.

          "Barry, siempre he querido preguntarte algo", escribe Leila, después de echar un vistazo rápido hacia Hadrik justo antes de que entremos en el corredor. "¿Cómo es que nunca nos cuentas ninguna de tus historias, como hacen Hadrik y Daren todo el tiempo?"

          "¿Mis historias?...", le pregunto confundido.

          "Sí", escribe Leila. "De tus viajes. Antes acabas de mencionar que llevas viajando por todo el Continente Occidental desde que tenías diecisiete años, ¿no?"

          "Ah", digo. "Bueno, sí, he estado en muchos sitios, pero en realidad no hay mucho que contar. Casi todo el tiempo me lo he pasado en bibliotecas, leyendo pergaminos antiguos y cosas así. Ninguna de las cosas que hice se acerca ni de lejos a las aventuras de Daren y Hadrik. Solo acabaría aburriendo de muerte a todo el mundo con mis historias mundanas."
      - source: scene_text_2
        paragraph: 8
        text: |-
          "¿Historias mundanas?", escribe Leila mientras gira la cabeza hacia mí y levanta una ceja, sin dejar de caminar por el corredor detrás del padre de Leila. "¿No me dijiste una vez que sabías pilotar aviones porque pasaste unos meses probando prototipos de máquinas voladoras para un inventor gnomo loco, a cambio de información sobre cómo convertirte en mago? ¿Y no dijiste también que uno de esos prototipos era tan malo que la hélice se detuvo en pleno vuelo y te viste obligado a planear hasta ponerte a salvo? ¿Eso también te parece una historia mundana?"

          "Supongo que sí...", digo. "Quiero decir, no es como si hubiera pasado mi vida luchando contra guivernos y gólems de roca ni nada por el estilo."

          "Solo por curiosidad...", escribe Leila. "¿Cuántos más de esos 'sucesos mundanos' te ocurrieron en el pasado?"
      - source: scene_3
        paragraph: 9
        text: |-
          "A ver...", digo. "A lo largo de los años he hecho muchos trabajos raros para pagarme la comida y los viajes, así que supongo que podría empezar por ahí. Por ejemplo, una vez fui a unas ruinas con un profesor de arqueología y casi acabamos enterrados vivos cuando activamos por accidente una de las trampas. También trabajé como aprendiz de bastantes magos, que se sorprendían muchísimo de mis conocimientos absurdamente avanzados de magia teórica, adquiridos tras años de estudio incansable, y querían que los ayudara a desarrollar hechizos nuevos. Creo que ya he perdido la cuenta de cuántos de esos hechizos experimentales acabaron explotándome en la cara. Luego estuvo aquella vez en que acompañé a un cazador de reliquias a una cueva antigua y, de algún modo, terminamos perseguidos por un grupo de goblins. Vaya, esa sí que estuvo cerca. A día de hoy sigo sin saber cómo conseguimos salir de allí de una pieza."

          Leila suelta una risita silenciosa.

          "No me puedo creer que de verdad dijeras que eras un 'tipo normal y corriente' antes de venir a Varathia", escribe. "¿Cómo se supone que todo lo que me acabas de describir puede tener algo de 'normal'?"

          "¿No lo es?", le pregunto sorprendido. "Pero ¿por qué no? Quiero decir, claro, todo esto puede sonar peligroso cuando lo cuento, pero estoy seguro de que hasta la persona más normal del mundo estaría dispuesta a asumir algunos riesgos como esos si eso significara acercarse un paso más a cumplir el sueño de toda su vida."

          "No, Barry, creo que eso solo te pasa a ti", escribe Leila con una sonrisa. "Pero gracias por contarme todo esto. Creo que ahora empiezo a entenderte un poco mejor."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch03a_travelling
