  - name: b3_ch03a_recording
    texts:
      - source: scene_text
        paragraph: 38
        text: |-
          "Así que supongo que ya va siendo hora de decidir qué vamos a hacer nosotros también", digo. "¿Deberíamos echar un vistazo por aquí o...?"

          "¡Ah, aquí están!", dice Peter acercándose a nosotros a toda prisa. "Quería decirles que ya hemos terminado de preparar su habitación de invitados. Por desgracia no pudimos encontrar suficientes habitaciones separadas para todos, así que tuvimos que darles una más grande. Espero que eso no les suponga demasiado problema."

          "Mmm... no lo creo?...", digo, mirando a los demás para ver si alguien parece estar en desacuerdo. "Quiero decir, hemos estado durmiendo en tiendas de campaña durante la mayor parte de nuestro tiempo en Varathia, así que no creo que ninguno de nosotros esperara demasiadas comodidades."

          "¡Bueno, eso es un alivio!", dice Peter. "¿Quieren llevar ahora sus mochilas a la habitación?"

          "Ehh...", digo, mientras mis compañeros y yo volvemos a intercambiar unas cuantas miradas. "Creo que de momento nos las quedaremos con nosotros, ¡gracias!"

          "¡Ah, de acuerdo!", dice Peter. "En ese caso, ¿podrían decirme si hay algo más en lo que pueda ayudarlos?"
      - source: scene_text_2
        paragraph: 18
        text: |-
          "Sí", dice Kate. "Tengo curiosidad por algo. Su 'rey del subsuelo' nos dijo antes que tienen dispositivos de escucha dentro del palacio, pero ¿cómo consiguen las grabaciones? ¿No es un poco peligroso ir a recuperarlas manualmente cada vez?"

          "En realidad no hace falta que vayamos a recuperar las grabaciones nosotros mismos", dice Peter. "Aquí abajo tenemos una sala conectada directamente a nuestros dispositivos de escucha, y desde allí podemos oír en tiempo real lo que dicen en el castillo. Ahí es también donde hacemos todas las grabaciones."

          "Pero antes nos dijeron que las paredes y el techo de seredium impiden que todas las ondas y partículas mágicas lleguen a la superficie", dice Kate.

          "Así es, pero la sala de grabación es diferente", dice Peter. "Vengan, los llevaré allí y lo verán por ustedes mismos."

          "¿Seguro que se nos permite entrar ahí?...", escribe Leila. "No querríamos meternos en problemas con el rey del subsuelo y sus hombres."
      - source: scene_3
        paragraph: 17
        text: |-
          "Bueno, sé que quizá no aparente gran cosa, pero aún tengo un poco de autoridad por aquí", dice Peter. "De hecho, soy uno de los tres miembros fundadores del movimiento original de resistencia, junto con Albert y Breynan. Aunque hoy en día nos limitemos sobre todo a seguir las órdenes del rey, me gusta creer que todavía nos queda algo de independencia. Así que no tienen que preocuparse por meterse en problemas con los hombres del rey. Si ocurre algo, asumiré toda la responsabilidad. Y además, muy rara vez llegamos a oír realmente conversaciones dentro del palacio debido a la colocación relativamente deficiente de nuestros dispositivos de escucha, así que tampoco es que haya muchas posibilidades de que oigan por accidente algo importante mientras estén allí."

          "Bueno, en ese caso, guíenos, supongo...", digo.

          "La sala de grabación no está muy lejos de la sala en la que estamos ahora", dice Peter. "Síganme."

          Mientras todos vamos detrás de Peter, me doy cuenta de que Hadrik se ha quedado atrás, en una de las sillas de la sala de espera.

          "Hadrik, ¿vienes?", le pregunto.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch03a_corner
  - name: b3_ch03a_corner
    texts:
      - source: scene_text
        paragraph: 39
        text: |-
          "Vayan ustedes delante sin mí", dice Hadrik. "Sigo un poco cansado por la pelea de antes y preferiría descansar un rato."

          "Entendido", digo, y luego todos salimos de la sala por uno de los corredores de la izquierda.

          Menos de medio minuto después, Peter se detiene frente a una puerta y saca un juego de llaves del bolsillo.

          "¿Ya?", le pregunto.

          "Sí, ya les dije que estaba cerca", dice Peter, mientras encuentra la llave que buscaba y abre la puerta. "Vamos."

          Entonces abre la puerta y vemos que lleva a un conjunto de escaleras. Tras subir las escaleras durante bastante rato, por fin llegamos a una trampilla y, cuando Peter nos la abre, entramos en una sala llena de grandes dispositivos metálicos, con montones de botones y luces parpadeantes. Cuando entramos, un hombre estaba sentado en una silla en medio de la habitación, jugando con lo que parecía ser un dispositivo de mascota virtual, pero en cuanto nos vio llegar se lo guardó enseguida en el bolsillo trasero.

          "¡Peter!", dice el hombre con un tono algo nervioso. "No esperaba que vinieras tan pronto. ¿Puedo ayudarte en algo o...?"
      - source: scene_text_2
        paragraph: 19
        text: |-
          "Tranquilo, Bill", dice Peter, mientras cierra la trampilla una vez que todos estamos dentro. "No he venido a hacer una inspección ni nada parecido. Solo quería enseñarles a nuestros invitados la sala donde hacemos las grabaciones. En fin, como pueden ver, la razón por la que aquí podemos conectarnos con nuestros dispositivos de escucha es que esta sala se encuentra a una altitud más elevada que la mayor parte de nuestra base subterránea, así que hay una capa mucho más fina de seredium sobre nosotros. Por desgracia, solo tenemos dispositivos de escucha en las zonas más desoladas del castillo, porque no queríamos arriesgarnos a que atraparan a ninguno de nuestros hombres mientras los colocaban. Como resultado, muy rara vez llegamos a oír conversaciones de verdad, pero cuando lo conseguimos, nos aseguramos de grabarlas con ayuda de toda la maquinaria presente en esta sala..."

          "¿Puede confirmar que esta es el área donde desea mantener la conversación?", oigo de pronto la voz metálica de un 'droon', saliendo de uno de los grandes dispositivos metálicos de la sala.

          "Sí", oigo luego la voz de Eiden proveniente del mismo dispositivo. "Aquí, en este rincón vacío, sería perfecto."

          "Solicitud reconocida", dice la bola metálica. "Por favor, esperen. El protocolo Supervisor se iniciará en breve."
    choices:
