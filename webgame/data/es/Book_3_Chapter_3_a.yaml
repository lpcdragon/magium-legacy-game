              "¿Te refieres a las estadísticas de Endurecimiento de aura, Farol y Sentido mágico?", dice el padre de Leila. "¡Por supuesto! No debería ser tan difícil. Francamente, probablemente también habría hecho que esas estadísticas estuvieran disponibles en el dispositivo de Leila, si no hubiera necesitado desactivarlas para que su función de escritura mágica pudiera funcionar correctamente."

              "Entonces, ¿podemos hacerlo ahora?...", digo.

              "¿Ahora mismo?", dice el padre de Leila. "Supongo que no habría problema. Probablemente también debería hacerle un poco de mantenimiento al dispositivo de Leila, ahora que lo pienso. Hace demasiado tiempo que no le echo un buen vistazo. Vamos a mi taller y veremos qué podemos hacer."

              "De acuerdo", digo, y luego me vuelvo hacia los demás. "¡Nos vemos en un rato!"
            condition: b3_ch1_unlock != 2
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch03a_mundane
      - condition: b3_ch3_monsters = 2
        texts:
          - source: scene_text
            paragraph: 14
            text: |-
              "¿De verdad importa tanto? Al fin y al cabo, eran monstruos."

              "Sí importa...", dice Daren. "Si un goblin como Kelrim es capaz de arriesgar su propia vida para ayudar a completos desconocidos que ni siquiera pertenecen a su raza, ¿qué pasa con sus amigos? ¿Y si todos eran como él? Ahora nunca lo sabremos, porque los asesinamos a todos a sangre fría sin pensarlo dos veces. Solo porque eran monstruos. Me siento tan avergonzado..."

              "¡Olvídense de los malditos goblins!", dice Arraka de repente. "¡Tenemos cosas mucho más urgentes de las que preocuparnos!"

              "¿Como qué?", dice Illuna.

              "¡Como el hecho de que ninguno de ustedes, idiotas, fue capaz de contrarrestar una simple técnica de manipulación de aura!", dice Arraka. "¿Cómo vamos a derribar a un dios si ustedes no pueden ni siquiera con técnicas básicas?"

              "¿Derribar a un... dios?...", pregunta el padre de Leila.

              "Se lo explicaremos luego", le digo al padre de Leila.

              "Escuche aquí, vieja bruja", le dice Hadrik a Arraka, "no sé cómo hacen las cosas en su mundo de los espíritus, pero aquí, en el plano terrenal, la gente no suele usar su aura para atacar a otros. Demonios, me llevó años desarrollar mi técnica de endurecimiento de aura, y ni siquiera estoy seguro de haber visto alguna vez a alguien usar algo parecido en mis viajes."
          - source: scene_text_2
            paragraph: 7
            text: |-
              "Hadrik tiene razón", digo. "Llevo viajando por todo el Continente Occidental en busca de una forma de convertirme en mago desde que tenía diecisiete años, y ni siquiera los tomos más oscuros que he leído contenían información sobre técnicas de manipulación de aura."

              "¿Ah, sí?", dice Arraka. "¡Pues qué pena! Aunque ustedes no puedan hacerlo, los dioses sí que pueden, y lo mismo Eiden, el zorro dorado y Tyrath, aunque el lagarto probablemente no pueda cuando no está en su forma de lava fundida. Apostaría a que Azarius también puede, y probablemente cualquier otro sabio salvo ese idiota de Talmak. Esto no es algo que puedan limitarse a ignorar. No ser capaces de contrarrestar este tipo de técnicas les da a sus oponentes una ventaja enorme. Demonios, ya vieron lo que ese viejo enclenque les estaba haciendo antes. ¡No pueden seguir dependiendo de mí para señalarles las debilidades de estas técnicas cada vez que las usan contra ustedes! Tienen que aprender a lidiar con ellas por su cuenta."

              "¿Y cómo se supone que hagamos eso?", digo.

              "Con entrenamiento, obviamente", dice Arraka. "Voy a meterles ese conocimiento a martillazos en sus inútiles cabezas, aunque me cueste la vida. ¡Recuérdenlo!"

              "Vale", digo. "Hablando de entrenamiento, acabo de acordarme de que tenía algo importante que hablar con el padre de Leila sobre mi dispositivo de estadísticas."

              "Sí, Barry, ¿qué pasa?", dice el padre de Leila.
          - source: scene_3
            paragraph: 7
            text: |-
              "Bueno, antes que nada, me preguntaba si podría ayudarme a desbloquear mi dispositivo", digo. "Ayer conseguimos bloquearlo por accidente mientras intentábamos desbloquear las estadísticas ocultas de aura."

              "¡Ah!", dice el padre de Leila. "¡El bloqueo de las estadísticas de aura! Eso me trae recuerdos. A mí también me pasó una vez, cuando empecé a trastear con el dispositivo de estadísticas de Leila para que tradujera sus pensamientos a palabras. Para responder a tu pregunta, sí, puedo desbloquearlo fácilmente."

              "¡Vaya, qué bien!", digo. "¿Y también se desbloquearán las estadísticas secretas cuando lo haga?"

              "No exactamente", dice el padre de Leila. "Pero no debería ser tan difícil desbloquearlas manualmente una vez que termine de arreglar tu dispositivo. También habría hecho que esas estadísticas estuvieran disponibles en el dispositivo de Leila, pero tuve que desactivarlas más o menos de forma permanente en su potenciador de estadísticas para que su función de escritura mágica pudiera funcionar correctamente."

              "Entonces, ¿podemos hacerlo ahora?...", digo.

              "¿Ahora mismo?", dice el padre de Leila. "Supongo que no habría problema. Probablemente también debería hacerle un poco de mantenimiento al dispositivo de Leila, ahora que lo pienso. Hace demasiado tiempo que no le echo un buen vistazo. Vamos a mi taller y veremos qué podemos hacer."

              "De acuerdo", digo, y luego me vuelvo hacia los demás. "¡Nos vemos en un rato!"
            condition: b3_ch1_unlock = 2
