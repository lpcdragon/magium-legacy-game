          Luego echa a andar cojeando delante de nosotros y todos lo seguimos, salvo Albert, que parece seguir teniendo algo que quiere hablar en privado con el rey. Cuando volvemos a entrar en la sala de espera, nos colocamos cerca de las sillas junto a la salida que lleva al teletransportador y esperamos pacientemente a que lleguen los sanadores. Mientras tanto, Peter fue a preparar nuestras habitaciones, mientras que Breynan también siguió su propio camino sin siquiera despedirse de nosotros, todavía bastante afectado por lo que le había dicho el rey del subsuelo.

          "Supongo que Kelrim habrá vuelto al área de cuarentena", dice Daren, después de echar un vistazo rápido alrededor y ver que el goblin no está por ninguna parte.

          "O eso, o fue a buscar a sus amigos", dice Hadrik.

          "Sí, supongo que de hecho eso es más probable, ahora que lo pienso", dice Daren.

          "¡Olvídense del maldito goblin!", dice Arraka. "¡Tenemos cosas mucho más urgentes de las que preocuparnos!"
