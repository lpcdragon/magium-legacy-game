  - name: b3_ch03a_purpose
    texts:
      - source: scene_text
        paragraph: 37
        text: |-
          "No hay propósito más elevado en la vida que ser elogiado por un espíritu dentro de un amuleto."

          "¡No te desanimes, Barry!", dice Hadrik. "Estoy seguro de que algún día conseguirás encontrar un propósito aún más grande que ese. ¡Aunque, admitámoslo, no será fácil!"

          "Soy escéptico, pero haré todo lo posible por mantener la esperanza", digo.

          "Escuchen", dice Daren. "Si ya hemos terminado con la lluvia de ideas, preferiría retomar la conversación anterior sobre qué vamos a hacer con el rey del subsuelo y los rebeldes. Por ejemplo, ¿qué les parece el plan del rey con el Supervisor? ¿Deberíamos seguirle el juego o no?"
      - source: scene_text_2
        paragraph: 17
        text: |-
          "Recomiendo esperar un poco más antes de decidir", dice Kate. "No creo que tengamos suficiente información todavía como para llegar a una conclusión adecuada."

          "Bueno, supongo que esperar un poco más no puede hacer daño...", dice Daren. "Al fin y al cabo, el rey dijo que nos deja tiempo para decidir hasta mañana."

          Hace una pausa.

          "De acuerdo, entonces", dice Daren. "Todos lo pensaremos un poco más y tomaremos una decisión esta noche o mañana por la mañana como muy tarde. Pero, sea cual sea la decisión que tomemos, tiene que ser unánime. ¿De acuerdo?"

