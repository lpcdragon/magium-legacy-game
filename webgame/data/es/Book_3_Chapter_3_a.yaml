                  b3_ch3_stats_unavailable: 1
      - condition: b3_ch3_plans = 5
        texts:
          - source: scene_text
            paragraph: 25
            text: |-
              "En realidad, Kate y yo solo somos amigos."

              "¿Lo son?...", escribe Leila, confundida. "Pero Daren dijo..."

              "Olvida lo que dijo Daren", digo. "Se está haciendo una idea equivocada de Kate y de mí desde el primer día que nos conocimos. Créeme, no hay nada entre nosotros."

              "Ah...", escribe Leila, ahora algo avergonzada. "Bueno... supongo que fue un malentendido. Olvida lo que dije."

              "¿Entramos?", dice el padre de Leila, mientras abre la puerta de su taller.

              "Después de usted", escribe Leila, y los dos seguimos a su padre al interior.

              Cuando el doctor Reidzek cierra la puerta detrás de nosotros, echo un vistazo rápido alrededor y veo que este taller no es muy diferente del que tenía el rey Golmyck bajo su sala del trono. Hay herramientas y artilugios desperdigados por el suelo, y en el centro hay un banco de trabajo con un dispositivo metálico rectangular encima y varias herramientas de encantamiento apoyadas a ambos lados de la mesa.

              El padre de Leila retira el dispositivo rectangular de la mesa para despejar espacio y luego me pide que le dé mi potenciador de estadísticas.
