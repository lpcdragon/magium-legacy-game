      - condition: b3_ch3_assassin = 1
        texts:
          - source: scene_text
            paragraph: 50
            text: |-
              "Porque soy sencillamente imbatible."

              "Y además muy modesto, por lo que parece", dice Albert.

              "Por supuesto", digo. "¡Hasta en modestia nadie puede superarme!"

              "No lo dudo", dice Albert. "Bueno, si de verdad eres tan imbatible como dices, esperemos que nunca lleguemos a ser enemigos. No me gustaría tener que demostrarte que estás equivocado."

              Entonces sonríe cortésmente y pasa de largo a mi lado sin decir una palabra más. Cuando me giro para buscarlo, me doy cuenta de que ya ha desaparecido. Tendré que andar con ojo con este. Mi instinto me dice que es bastante más peligroso que Wilhelm, así que no debería subestimarlo.
          - source: scene_text_2
            paragraph: 25
            text: |-
              Después de pasar veinte minutos más caminando por los pasillos, de pronto me encuentro con Peter, que me dice que ha estado buscándome porque el rey del subsuelo ha solicitado otra reunión conmigo y con mi grupo. Cuando le pregunto de qué se trata, dice que no le está permitido hablar del asunto, pero aun así me resulta fácil ver que está actuando mucho más estresado que la última vez que hablé con él. Decido llamar a todos por sus transceptores y al final conseguimos reunirnos en la sala de espera para volver una vez más a ver al rey.

              No tardamos mucho en llegar a la sala del trono y, una vez dentro, nos sentamos en las mismas sillas que nos habían preparado la primera vez. Igual que la vez anterior, Albert también está presente en la sala, apoyado contra una pared con los brazos cruzados, pero Peter parece mucho más inquieto y bastante menos seguro de sí mismo. A juzgar por las apariencias, las únicas personas de la reunión anterior que faltan esta vez son Breynan y el padre de Leila.

              "Gracias por venir con tan poca antelación", nos dice el rey del subsuelo, sentado en el trono frente a nosotros. "Sé que todos son personas ocupadas, así que intentaré ser breve. Díganme... ¿de qué manera está asociado su grupo con este 'Creador' que se hace llamar Eiden?"

              "Eh... ¿por qué lo pregunta?", dice Daren.
          - source: scene_3
            paragraph: 23
            text: '"Ah, claro, tú has estado todo este tiempo en la zona de cuarentena, así que no sabes lo ocurrido...", dice el rey. "En resumen, no pude evitar notar que últimamente este ''Eiden'' se ha esforzado por proporcionarles a ustedes información relacionada con el rey de Ollendor y su círculo. Me di cuenta por primera vez hoy, cuando mis hombres informaron de que Eiden retrasó la ceremonia de bendición sin motivo aparente, solo para dar la orden de empezar poco después de que su grupo llegara a la plaza Perrelion. Como ese era uno de los pocos lugares donde estaba previsto que se proyectara la ceremonia, me pareció un poco sospechoso. Sin embargo, la confirmación llegó hace unas horas, cuando me avisaron de que sus amigos se encontraban en nuestra sala de grabación justo en el momento en que Eiden mantenía una conversación con el Supervisor, y Eiden prácticamente admitió que atrajo la bola metálica allí a propósito porque sabía que había uno de nuestros dispositivos de escucha cerca. Así que se lo pregunto otra vez... ¿Cuál es exactamente su relación con Eiden?"'
