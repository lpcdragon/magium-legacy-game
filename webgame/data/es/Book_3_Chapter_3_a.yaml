  - name: b3_ch03a_brinhorn
    texts:
      - source: scene_text
        paragraph: 27
        text: |-
          "Ahora que lo mencionas, sí hubo un suceso que destacaba un poco por encima de los más mundanos", digo. "Ocurrió mientras trabajaba para Brinhorn, un viejo mago que lleva muchos años obsesionado con arrebatarle a Azarius el puesto de sabio. También es un generalista y tiene bastante habilidad, pero por muchas veces que haya llegado a la ronda final de los torneos anuales de sabios, nunca ha estado ni remotamente cerca de derrotar a Azarius. Irónicamente, por lo que he oído los dos son bastante buenos amigos, aunque nunca llegué a verlos interactuar durante el breve periodo en que fui aprendiz de Brinhorn. En fin, el suceso del que hablaba ocurrió un día en que el viejo mago se me acercó diciendo que había encontrado una forma de resolver nuestros dos problemas a la vez. Afirmaba que había descubierto un artefacto lo bastante poderoso como para convertirme en mago y darle a él el poder de derrotar a Azarius. Qué equivocado estaba..."

          "Entonces el artefacto no sirvió de ayuda, ¿verdad?", escribe Leila.
      - source: scene_text_2
        paragraph: 11
        text: |-
          "No es que no sirviera de ayuda", digo. "Es que ni siquiera existía. Todo era una trampa montada por algunos de los rivales de Brinhorn del torneo de sabios, que estaban hartos de no poder llegar nunca a la ronda final por culpa de él y habían decidido quitárselo de en medio antes de que el concurso siquiera empezara, para así poder desafiar ellos mismos a Azarius. Vaya día aquel... Pasamos horas atrapados en un laberinto lleno de trampas mágicas, casi sin esperanza de salir de allí con vida. Prácticamente tuve que usar todos mis conocimientos sobre la forma en que los distintos tipos de magia funcionan juntos para conseguir sacarnos de allí de una pieza. Por suerte para mí, Brinhorn era un generalista que podía lanzar prácticamente casi cualquier tipo de hechizo existente, así que todo lo que tuve que hacer fue orientarlo en la dirección correcta."

          "¿Orientarlo en la dirección correcta?", escribe Leila con los ojos muy abiertos, mientras su padre también ha dejado temporalmente de trabajar para mirarme con atención. "¿Tú?... Pero... ¡si no puedes lanzar magia!"
      - source: scene_3
        paragraph: 11
        text: |-
          "Claro que no puedo lanzar magia", digo. "Pero eso no me impidió leer miles de libros oscuros sobre todas las formas en que los distintos tipos de magia funcionan por separado y sobre cómo interactúan entre sí. Demonios, algunos de esos libros ni siquiera llegaron a publicarse. Los escribieron magos ermitaños de los que nadie se tomaba en serio nada, y estaban tan contentos de que por fin alguien quisiera escuchar sus teorías que me dejaban leer manuscritos enteros gratis solo para poder tener luego una larga conversación conmigo sobre lo que habían escrito. Mi cuaderno está lleno de ese tipo de conocimientos que fui acumulando durante mis viajes. Ninguno de ellos consiguió ayudarme a convertirme en mago, eso sí."

          "Vaya...", escribe Leila. "Entonces, ¿ibas a contarnos cómo escapaste del laberinto?..."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch03a_brinhorn2
  - name: b3_ch03a_brinhorn2
    texts:
      - source: scene_text
        paragraph: 28
        text: |-
          "Claro, claro, por supuesto...", digo. "¿Por dónde iba? Ah, sí, Brinhorn. Verás, lo que pasaba con Brinhorn es que tenía a su disposición un repertorio increíble de hechizos, pero solo conocía las aplicaciones más básicas de cada uno. Probablemente esa también fuera la razón por la que nunca podía competir con Azarius. Saber lanzar los hechizos no basta. La principal ventaja de ser generalista es la flexibilidad. No puedes limitarte a lanzar hechizos al azar como si fueras un especialista y dar el asunto por zanjado. Alguien especializado en un tipo concreto de magia siempre será mejor que tú en ese tipo de magia a nivel individual, pero si combinas varios tipos de magia entre sí, el potencial es ilimitado. Cuantos más hechizos conozcas, más combinaciones tendrás disponibles y, mientras sepas exactamente cómo interactúa cada hechizo con todos los demás y cómo tienes que lanzarlos, puedes volverte prácticamente invencible. Teniendo en cuenta la cantidad de hechizos que Brinhorn tenía en su repertorio, había incontables formas en que podría haberse ocupado de las trampas, pero como yo no estaba del todo seguro de cuánto control tenía sobre sus propios hechizos, decidí optar por la idea más sencilla que se me ocurrió y le dije que probara a usar la disipación en varios pasos."

          "¿La disipa... qué?...", escribe Leila.
      - source: scene_text_2
        paragraph: 12
        text: |-
          "La disipación en varios pasos", le repito. "Es una técnica que más o menos inventé yo mismo, basándome en información que había sacado de algunos libros antiguos y de conversaciones con algunos de esos magos ermitaños que mencioné antes. Por algún motivo, a nadie más se le ocurrió antes, pero siempre que seas capaz de identificar exactamente qué hechizos se usaron para crear un hechizo más complejo, puedes lanzar esos mismos hechizos a la inversa contra él para anular sus efectos. Evidentemente, esta técnica no funcionaría demasiado bien contra un mago hábil como Azarius, porque podría ir cambiando los hechizos sobre la marcha para confundirte, pero si estás lidiando con una trampa mágica, tienes todo el tiempo del mundo para averiguar qué hechizos debes lanzar y en qué orden. Es más, esta técnica es muy poco arriesgada cuando la usas contra trampas, porque aunque falles no activarás la trampa por accidente, así que puedes seguir probándolo una y otra vez hasta acertar con el ritmo. Tuvimos que pasar todo el día en aquel laberinto hasta que Brinhorn aprendió a usar la técnica con fiabilidad, pero por suerte sus rivales no estaban esperando fuera para tendernos una emboscada, así que después conseguimos volver a casa sanos y salvos."

          "Espera un momento...", escribe Leila, aparentemente en un ligero estado de shock. "¿Me estás diciendo que en realidad tú inventaste la 'técnica de disipación de Brinhorn'? ¿La técnica que revolucionó por completo la magia de disipación en todo el mundo hace unos años y que hasta hoy se incluyó en la mayoría de los manuales modernos para magos?"
      - source: scene_3
        paragraph: 12
        text: |-
          "Sí, bueno, la verdad es que no me importó tanto que Brinhorn se llevara el mérito", digo. "Para empezar, el concepto tampoco era tan complicado. Solo hay que hacerlo todo al revés. El encantamiento, los movimientos, la manipulación del flujo de aura... Quiero decir, no es que la idea en sí fuera tan revolucionaria. La parte realmente difícil estaba en la ejecución. No tienen ni idea de cuántos intentos necesitó Brinhorn hasta que por fin consiguió acertar con el tiempo y los movimientos. Y aunque en teoría Brinhorn y yo sabíamos cómo funcionaba la técnica, aun así pasamos horas devanándonos los sesos entre los dos para averiguar la multitud de hechizos que se habían usado en algunas de aquellas trampas mágicas."

          "Sí, pero aun así...", escribe Leila. "¿De verdad a Brinhorn ni se le pasó por la cabeza que al menos debía darte crédito por tu propia técnica?..."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch03a_brinhorn3
  - name: b3_ch03a_brinhorn3
    texts:
      - source: scene_text
        paragraph: 29
        text: '"Sí me preguntó si me parecía bien que la técnica llevara su nombre, y yo le dije que la verdad es que me daba bastante igual", digo. "Incluso si me hubiera dado crédito, ¿cómo iba a llamar al hechizo? ¿''Técnica de disipación de Barry''? Hay miles de Barrys por ahí. ¿Cómo iba a saber nadie que era yo? Para ser sincero, lo que me molestó no fue la falta de crédito, sino que, después de todo aquel episodio del laberinto, Brinhorn siguió insistiendo en que quería presentarme a algunos eruditos que conocía para que pudiéramos investigar la magia juntos a nivel teórico. Para entonces yo ya sabía que ninguno de los conocimientos disponibles en el mundo iba a darme lo que yo quería y que la única esperanza de lograr mis sueños pasaba por la ayuda de algún tipo de artefacto mágico, así que rechacé su oferta una y otra vez. No tenía ningún interés en convertirme en un erudito. Lo único que quería era convertirme en mago. En cuanto oí un rumor sobre un artefacto nuevo, me marché de la ciudad en la que vivía Brinhorn y no he vuelto a saber nada de él desde entonces. Aunque, pensándolo bien, no me sorprendería demasiado cruzarme con él aquí mismo, en Varathia, uno de estos días. Parecía justo el tipo de persona que se apuntaría a un torneo como este, al fin y al cabo."'
      - source: scene_text_2
        paragraph: 13
        text: |-
          "¡Barry, lo que acabas de contarnos es increíble!", dice el padre de Leila. "¡No sabía que fuera siquiera posible alcanzar un nivel tan alto de comprensión de la magia solo leyendo libros!"

          "Sí, pero por desgracia sigue sin ser suficiente", digo. "Llevo días intentando encontrar el tipo de resquicios que Eiden usa al lanzar sus hechizos, pero sigo sin acercarme ni un poco a descubrirlos. Lo máximo que puedo hacer es entender las cosas que ya usó delante de nosotros, pero para encontrar resquicios nuevos necesitaría una comprensión mucho más intuitiva de cómo funciona la magia. Esto me lleva a otra cosa importante que quería preguntarle, doctor Reidzek. ¿Sabe si sería posible que también desbloqueara las estadísticas mágicas del dispositivo de estadísticas, además de las estadísticas ocultas de aura?"

          "Si por estadísticas mágicas te refieres a las estadísticas de Conocimiento mágico y Poder mágico, me temo que la respuesta es no", dice el padre de Leila. "Las estadísticas de aura solo estaban ocultas, pero las estadísticas mágicas fueron bloqueadas por una razón y, a menos que conozcas el código correcto, jamás podrás desbloquearlas. Si intentas desbloquear esas estadísticas a la fuerza sin el código, podrías correr el riesgo de dañar tu dispositivo permanentemente. No te lo recomendaría."
    choices:
      - position: 1
        text: ¿No hay forma de descifrar el código sin usar fuerza bruta?
        effects:
          - set:
              current_scene: b3_ch03a_workbench
              b3_ch3_magical: 0
      - position: 2
        text: ¿Hay alguien aparte de los lessathi de alto rango que pudiera conocer el código?
