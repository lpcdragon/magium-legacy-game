      - condition: b3_ch3_assassin = 2
        texts:
          - source: scene_text
            paragraph: 51
            text: |-
              "Había amenazas mucho mayores que un asesino en ese campo de batalla, se lo aseguro."

              "Aun así...", dice Albert, "lidiar con un asesino requiere un conjunto de habilidades completamente distinto al que normalmente necesitarías para derrotar a unos gladiadores o a unas bestias. Aunque quizá no fuera tan fuerte como tus otros adversarios, sobrevivir a un intento de asesinato sigue siendo en sí mismo un logro impresionante. Tienes mis más sinceras felicitaciones."

              "No intentará matarme usted también, ¿verdad?", digo.

              Albert se ríe.

              "Solo si me obligas a hacerlo, Barry", dice. "Sin embargo, ahora mismo somos aliados, no enemigos, así que no tienes de qué preocuparte. En fin, creo que ya te he retenido bastante. Disfruta de tu exploración. Estoy seguro de que volveremos a vernos pronto."

              Albert vuelve a sonreír cortésmente y pasa de largo a mi lado sin decir una palabra más. Cuando me giro para buscarlo, me doy cuenta de que ya ha desaparecido. Tendré que andar con ojo con este. Mi instinto me dice que es bastante más peligroso que Wilhelm, así que no debería subestimarlo.
