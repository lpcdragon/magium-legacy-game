        paragraph: 42
        text: |-
          "Eiden desde luego no está ocultando que nos vigila constantemente, ¿verdad?"

          "Sinceramente, es culpa nuestra por habernos colocado tan convenientemente en un lugar donde puede sentir nuestra presencia", dice Illuna. "Si permaneciéramos en los túneles subterráneos, lo más probable es que Eiden no fuera capaz de percibirnos debido a todo el seredium que nos rodea."

          "No lo entiendo", dice Peter. "¿De qué están hablando?"

          "¿Pueden dejar de distraerme y guardar silencio un minuto?", dice Bill, mientras pulsa frenéticamente los botones de uno de los dispositivos metálicos de la sala. "Estoy intentando asegurarme de que los dispositivos de grabación funcionen correctamente. ¡El rey me cortará la cabeza si se pierde esta conversación por mi culpa!"

