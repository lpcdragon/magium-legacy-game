  - name: b3_ch03a_familiar
    texts:
      - source: scene_text
        paragraph: 52
        text: |-
          "¿A alguien más le resulta familiar toda esta situación o solo me pasa a mí?"

          "¿Cómo dice?...", dice el rey del subsuelo.

          "Perdone a mi amigo", dice Daren. "Lo dice porque usted no es el primer rey que nos ha hecho exactamente esta misma pregunta desde que llegamos a Varathia. Por desgracia, no hay una forma sencilla de responderla. Eiden lleva haciéndose pasar por participante del torneo desde el principio y ya ha interactuado con varios grupos, incluido el nuestro. A veces nos ha ayudado y otras ha intentado matarnos, así que es difícil saber con certeza cuándo está actuando como aliado nuestro y cuándo no. Lo único que podemos decir es que hasta ahora ha demostrado ser extremadamente impredecible."

          "Lo siento, pero me cuesta bastante creer todo esto", dice el rey. "En mi opinión, sería mucho más probable que ustedes y este 'Creador' estén conspirando juntos y que simplemente intenten ocultárnoslo..."

          "¡No, no estamos conspirando ni nada parecido!", dice Daren. "¡La única razón por la que vinimos a esta ciudad es matar al rey de Ollendor! Créame, aquí todos estamos del mismo lado."

          "¿De verdad estamos del mismo lado?", dice Kate de repente, mirando al rey directamente con expresión acusadora.

          "¿Qué quiere decir con eso?", le pregunta el rey.
      - source: scene_text_2
        paragraph: 26
        text: |-
          "Uno supondría que un aliado no necesitaría enviar a su perro faldero a vigilarnos", dice Kate, "pero su amigo asesino Albert nos ha estado siguiendo todo el día. También oí de labios de Melindra que usted ha llevado a cabo durante años ciertos negocios bastante turbios, entre ellos asesinatos y trata de esclavos, entre otras cosas. ¿Qué nos asegura que esos 'aspectos moralmente cuestionables' de esta sociedad de los que Eiden hablaba con el Supervisor en su grabación no hayan sido causados directamente por usted también?"

          "Es una observación justa", dice el rey. "Sin embargo, aun así me gustaría señalar que el comercio de esclavos no se considera moralmente reprobable en este continente, independientemente de cómo puedan juzgarse estas cosas fuera de Varathia. En cuanto a los asesinatos, desde luego hubo muchos ejecutados por orden mía, aunque sostendría que todas esas muertes beneficiaron a nuestra sociedad de una manera u otra. Dicho eso, no puedo demostrarle nada de esto, igual que usted no puede demostrarme a mí que no está trabajando con Eiden, así que está claro que en este frente ya no puede lograrse ningún avance más."

          "Entonces, ¿qué propone?", dice Kate.
      - source: scene_3
        paragraph: 24
        text: |-
          "Mi propuesta es sencilla", dice el rey con una sonrisa. "En lugar de una alianza basada en la confianza, deberíamos intentar formar una basada exclusivamente en la necesidad. Lo que esto significa en la práctica es que ambas partes se usarán mutuamente todo lo que puedan para cumplir sus objetivos, pero no se abstendrán de apuñalarse por la espalda si eso sirve a sus intereses. En otras palabras, todo vale. Francamente, me parece que su grupo ya estaba preparado para un escenario así. ¿No es esa la razón por la que siguen llevando sus mochilas con ustedes, a pesar de que hace ya unas cuantas horas que les preparamos una habitación?"

          "Supongo que no le falta razón del todo...", dice Daren. "Pero entonces, ¿cómo vamos a gestionar la reunión con el Supervisor? ¿Sigue en pie su oferta inicial?"

          "Mis hombres seguirán reuniéndose mañana para poder hablar con el Supervisor", dice el rey. "Eso no ha cambiado. Sin embargo, lo que ustedes decidan hacer con esa información depende enteramente de ustedes."

          "Entendido", dice Daren. "Entonces, ¿la reunión ha terminado? ¿Podemos volver a lo que estábamos haciendo?"

          "Por supuesto", dice el rey. "Pueden seguir moviéndose libremente por estos túneles subterráneos como antes. Incluso ordenaré a Albert que deje de seguirlos, como gesto de buena fe. Ah, y Peter... la próxima vez que se te ocurra escoltar a nuestros invitados a una de nuestras áreas restringidas, haz el favor de informarme antes, ¿de acuerdo?"

          "Sí... alteza...", dice Peter con tono resignado.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch03b_complicate
              storyboard_controls: Jump to frame "Book 3 Chapter 3 b"
