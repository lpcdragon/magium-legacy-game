  - name: b3_ch03a_evasive
    texts:
      - source: scene_text
        paragraph: 46
        text: |-
          "¿Por qué creen que el Supervisor fue tan evasivo con sus respuestas?"

          "A mí me pareció que no confiaba lo suficiente en Eiden como para revelar demasiado sobre sus planes", dice Kate. "Teniendo en cuenta que Eiden solo apareció hace poco en esta ciudad, el Supervisor sencillamente no ha tenido tiempo para averiguar cuáles son sus verdaderos motivos para estar aquí."

          "Todavía no tengo muy claro de qué iba todo esto, pero tenemos que llevarle esta grabación al rey del subsuelo cuanto antes", dice Peter. "Bill, ¿lo tienes todo listo?"

          "Aún no", dice Bill mientras pulsa unos botones. "Primero tengo que pasarlo todo al cubo. Anda, échame una mano. Irá más rápido si trabajamos los dos al mismo tiempo."

