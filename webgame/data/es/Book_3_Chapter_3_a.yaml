        texts:
          - source: scene_text
            paragraph: 23
            text: |-
              "Bueno, técnicamente es solo una promesa vaga. ¡Aún podría pasar cualquier cosa!"

              "Barry, no seas absurdo", escribe Leila. "Solo llegué a conocer a Rose por poco tiempo, pero por lo que me contó Kate, no parece el tipo de persona que haga una promesa así si no piensa cumplirla. Si dijo que te esperaría hasta que terminara el torneo, lo hará."

              "Claro...", digo. "Tienes razón. No sé en qué estaba pensando."

              "¿Entramos?", dice el padre de Leila, mientras abre la puerta de su taller.

              "Después de usted", escribe Leila, y los dos seguimos a su padre al interior.

