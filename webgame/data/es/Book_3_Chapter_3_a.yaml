      - condition: b3_ch3_magical = 2
        texts:
          - source: scene_text
            paragraph: 32
            text: |-
              "¿Por qué cree que las estadísticas de aura están menos protegidas que las mágicas?"

              "Estos dispositivos se hicieron hace muchísimo tiempo, así que no podría decírtelo con certeza", dice el padre de Leila, "pero si tuviera que aventurar una explicación, diría que probablemente se debe a que se ocultaron por razones distintas. Las estadísticas mágicas probablemente se crearon originalmente con la esperanza de que funcionaran para los lessathi normales. Los medios lessathi nunca fueron vistos realmente como iguales a los lessathi de sangre pura, así que el bloqueo de las estadísticas mágicas casi con seguridad se implantó para asegurarse de que un medio lessathi nunca tuviera acceso a ellas por accidente. En cambio, las estadísticas de aura se ocultaron por precaución, porque seguían en fase experimental cuando los lessathi dejaron de trabajar en estos dispositivos y no llegaron a completar todas las pruebas. Dicho eso, por lo que he podido averiguar, las tres estadísticas parecían funcionales en su mayor parte, así que no deberías preocuparte demasiado por que fallen en un momento crucial."

              "Ya...", digo con un tono no del todo convencido.
