              "¡Entonces puedes unirte a nosotros! ¡Estábamos a punto de salir de aquí! Estamos demasiado al descubierto en este momento".

              "¿Nosotros? ¿Planeas viajar junto a este Stillwater? ¡No puedes confiar en él!"

              "En realidad, no es un Stillwater, es solo un humano normal", la corrige Daren.

              Genial. Me pregunto si planea revelar mi identidad a cada persona que conozcamos de ahora en adelante.

              "¿Eso es lo que te dijo?", pregunta la mujer. "¿Y le crees? ¡Solo está tratando de que bajes la guardia!"
        choices:
          - position: 1
            text: Preguntarle qué tiene contra mí
            effects:
              - set:
                  current_scene: ch2_against
          - position: 2
