  - name: ch2_battle_stillwater
    routes:
      - condition: premonition > 0
        texts:
          - source: scene_text
            paragraph: 38
            text: |-
              Poco después de que el joven mago aparezca detrás de mí, veo una visión de él lanzando su daga hacia mi cuello. ¿Fue eso... una premonición?

              Efectivamente, el joven mago ahora lanza su daga exactamente de la misma manera que lo hizo en mi visión. Sabiendo de dónde viene el golpe, logro esquivarlo en el último segundo. Justo después de que esquivo, el mago me da una fuerte patada en el pecho, derribándome de espaldas.

              "¡Barry!", grita Daren mientras se interpone entre mi atacante y yo, bloqueando el siguiente golpe con su escudo.

              "¡Ja! ¡Dejaste a la mujer sin defensa! Error clásico", dice el mago con el hacha de batalla, mientras su segundo hijo hace aparecer una docena de espadas de la nada, flotando frente a él, y las envía todas volando hacia Kate.

              Justo cuando las espadas la alcanzan, el brazo izquierdo de Kate se cubre con un gran y grueso bloque de hielo, esculpido en forma de escudo. Lo pone frente a ella y todas las espadas quedan clavadas en él.

              "¿Dejé a la mujer sin defensa?", pregunta Kate. "Entonces, ¿qué es? ¿Mujer?... ¿O banshee?"

              Baja su brazo izquierdo para revelar su rostro, mientras mira directamente al mago de la barba negra. Sus ojos rebosan de furia.

              "¡Decídete!", grita, mientras todo el bosque se queda en silencio por el sonido de su voz.
