  - name: ch2_protection
    texts:
      - source: scene_text
        paragraph: 71
        text: |-
          "Sí, puedo", le digo. "Los oí hablar de una cueva. Nosotros también buscamos refugio. Podríamos ofrecerles protección en su camino de regreso si prometen dejarnos compartir su cueva por una noche".

          La cierva me mide con la mirada. No está segura de qué pensar de mi oferta.

          "No les haremos daño, lo prometo", le digo.

          "No", dice la cierva. "No lo harán. De lo contrario, no seguiría viva, teniendo esta conversación con usted. Le agradezco, forastero. Aceptamos su generosa oferta. Mi nombre es Elaria, y este es mi hijo, Molan. ¿Creo que así es como los humanos se presentan?"

          Se acerca a mí y extiende una de sus pezuñas delanteras hacia mí. Me doy cuenta de que quiere que le dé la mano. Agarro su pezuña y la estrecho ligeramente antes de soltarla.

          "Soy Barry", le digo. "¡Encantado de conocerte!"
      - source: scene_text_2
        paragraph: 20
        text: |-
          Daren y Kate me miran estupefactos. Se me ocurre que probablemente ninguno de los dos entendió ni una palabra de lo que he estado diciendo. Todo esto debe sonar como ruidos de animales extraños para ellos.

          "Barry, ¿qué demonios?...", pregunta Daren.

          "Se lo explicaré más tarde", le digo. "Dijeron que pueden llevarnos a su cueva, a cambio de nuestra protección. Seguimos buscando refugio, ¿no?"

          "Bueno, supongo, pero..."

          "Entonces vamos, dice que es por aquí", digo, mientras sigo a los ciervos hacia el bosque.

          Daren se muestra claramente muy reacio a todo esto, pero me sigue de todos modos. Kate parece más desconcertada que escéptica, mientras decide seguirme también hacia las profundidades del bosque y hacia las montañas.
