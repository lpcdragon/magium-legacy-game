            paragraph: 62
            text: |-
              Daren hace una pausa.

              "Muy bien. Sigamos adelante", dice, mientras se dirige hacia los árboles.

              Empiezo a seguirlo, pero Kate me detiene en seco. Tiene esa mirada muy seria de nuevo.

              "Stillwater", dice en voz baja, para evitar ser escuchada por Daren. "Te vi 'luchando' allí atrás. Puede que hayas logrado convencer a Daren y a ese tonto barbudo de que eres un humano común, pero yo no me dejo engañar tan fácilmente. No sé cuál es tu juego, pero voy a vigilarte".

              "No soy--" empiezo a decir, pero Kate me corta y me agarra de la camisa.

              "Escúchame, Stillwater. No me interesan tus mentiras. Solo quería asegurarme de que tuvieras claro lo que pienso de tu pequeña farsa. Ahora, ¿está claro?"
