            effects:
              - set:
                  current_scene: ch2_quick
  - name: ch2_against
    texts:
      - source: scene_text
        paragraph: 31
        text: |-
          "¡Oye, estoy justo aquí!", le digo. "¿Qué tienes contra mí, de todos modos?"

          "No me vengas con ese cuento, Stillwater. He oído hablar de lo que tu clase puede hacer. La vida humana no tiene valor para ti. Dime, ¿qué hicieron los habitantes de Olmnar para merecer un destino tan terrible?"

          "¡Vaya, vaya! ¡Calmémonos todos!", dice Daren.

          Se vuelve hacia la mujer.

          "Escucha, entiendo tu preocupación, pero este hombre salvó mi vida y tengo la intención de pagar mi deuda con él. Si buscas una escolta, entonces viajaremos los tres juntos. No aceptaré ninguna alternativa".

          La mujer hace una pausa para considerar las palabras de Daren.
      - source: scene_text_2
        paragraph: 4
        text: |-
          "Muy bien", dice. "Si así tiene que ser, me veo obligada a cumplir. Pero sabe que estaré vigilando constantemente mi espalda. No me convencen tan fácilmente como a ti, sanador con armadura".

          "¡Genial!", dice Daren. "Ahora que hemos resuelto eso, ¡vámonos! ¡La aventura aguarda!"

          "Espera", exclamo. "Todavía no nos has dicho tu nombre".

          La mujer se vuelve hacia mí y me lanza una mirada pensativa. Tras considerarlo cuidadosamente, decide responder.

          "Es Kate. Mi nombre es Kate".

          Con esas últimas palabras, los tres abandonamos el claro y nos adentramos en el bosque, con la esperanza de encontrar algún lugar alejado de las batallas en curso que se libran por toda la tierra.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch2_stats
              available_points: available_points + 3
              available_points_aux: available_points_aux + 3
  - name: ch2_trust
    texts:
      - source: scene_text
        paragraph: 32
        text: |-
          "Dices que no puedes confiar en mí, ¡pero no veo por qué alguno de nosotros debería confiar en ti!", le digo. "¿Y si en realidad no estás buscando a una amiga y solo estás aquí para ganar el torneo, como cualquier otro participante? ¿Qué pruebas tienes para respaldar tu afirmación?"

          "No estoy... Yo solo..."

          Vacila.

          "¡Vaya, vaya! ¡Calmémonos todos!", dice Daren.

          Se vuelve hacia la mujer.

