          "Sí, puedo", le digo. "¡Solo quería desearles un viaje seguro!"

          "Oh...", dice ella. "Gracias. Yo también le deseo un viaje seguro, forastero. Vamos hijo mío, vámonos".

          Mientras los dos ciervos regresan al bosque, noto que Daren y Kate me miran fijamente.

          "Barry, ¿qué demonios estabas haciendo?", pregunta Daren. "¿Sabes lo ridículo que sonabas cuando estabas imitando a esa cierva?"

          "Sí, supongo que sonaba ridículo. No me hagan caso, solo estaba tonteando. Sigamos adelante".

          Decidimos seguir el camino que lleva a las montañas, con la esperanza de encontrar una cueva que nos proporcione refugio para la noche.
