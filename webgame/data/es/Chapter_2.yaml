scenes:
  - name: ch2_intro
    texts:
      - source: scene_text
        paragraph: 24
        text: |-
          Tanto Daren como yo nos damos la vuelta al mismo tiempo. Vemos a una figura alta y delgada de pie detrás de nosotros, con cabello largo y negro, piel clara y una mirada muy seria en su rostro. Viste pantalones de cuero, una blusa blanca de manga larga y una capa verde con capucha. Parece tener veintipocos años.

          Pero eso no es todo lo que hay en esta mujer. También puedo sentir una fuerte aura mágica a su alrededor. Un aura que no podría provenir de un humano normal. ¿Podría ser... una banshee?

          Mi corazón comienza a latir rápidamente de nuevo. Aquella noche de hace quince años vuelve a mí. Puedo verla vívidamente, y todavía puedo escuchar la risa. Esa risa siniestra y aguda. ¿Nunca dejará de atormentarme?

          Respiro profundamente y trato de calmarme. Esta mujer no puede ser una banshee. La sensación que tengo ahora es demasiado diferente a la que tuve en aquel entonces. ¿Significa eso que es una maga? No, eso sería imposible. Y sin embargo...

          "Barry", susurra Daren. "No tengas miedo. Conozco la magia blanca. Puedo purificarla".
      - source: scene_text_2
        paragraph: 3
        text: |-
          Me doy cuenta de que Daren también debe haber sentido la magia proveniente de la mujer y ha concluido que ha sido poseída por una banshee. Las banshees son espíritus parásitos que necesitan habitar cuerpos para sobrevivir. Suelen pasar unas semanas dentro de un cuerpo en estado latente antes de tomar el control. Durante esta fase, el huésped puede desarrollar poderes mágicos. Una vez que una banshee tiene el control total del cuerpo, dicen que ha despertado. La única forma de salvar al huésped original una vez que ha sido poseído por una banshee es usar magia blanca para purificarla antes de que la banshee haya despertado por completo, lo que básicamente significa matar a la banshee sin dañar al huésped.

          Sin embargo, la técnica de purificación opera bajo el supuesto de que una mujer no puede tener poderes mágicos propios. Lo llaman purificación, pero lo único que hace la técnica, de hecho, es erradicar por completo el aura que emite la fuerte vibra mágica, con el propósito de eliminar también a la banshee junto con ella. Por otro lado, si el aura no pertenece de hecho a una banshee, sino a la mujer misma, la purificación no sería menos que una sentencia de muerte.

          "No, espera. ¡Escúchame!", suelto de repente. "Esta mujer no es una banshee".

          "¿Y qué, estás sugiriendo que es una maga, entonces? Barry, las mujeres no pueden ser magos. No ha habido ni un solo caso registrado de una mujer maga en toda la historia de nuestro mundo. Cada vez que una mujer ha desarrollado poderes mágicos, ha sido debido a una banshee. Todas y cada una de las veces".

          "¿No crees que lo sé? Pero esta es diferente. ¡Si intentas purificarla, bien podrías terminar matándola!"
      - source: scene_3
        paragraph: 3
        text: |-
          "¿Cómo puedes estar tan seguro?"

          "Porque he conocido a una banshee antes. De cerca. ¿Has conocido a una banshee antes, Daren?"

          "...No", admite.

          "Acabas de decir que confiabas en mí lo suficiente como para contarme tu mayor debilidad. Te pido que confíes en mí en esto también. ¿Puedes confiar en mí en esto, Daren?"

          Daren me lanza una larga mirada y luego suspira profundamente.

          "Está bien. Lo haremos a tu manera. Pero no le quitaré el ojo de encima. Lo juro, Barry, si resulta que solo dices todo esto por su apariencia, voy a--"

          "¿Les importaría decirme de qué han estado susurrando durante el último minuto?", nos pregunta la mujer.
    effects:
      - set:
          successful_checks:
            - 'Punto de control alcanzado: Partida guardada.'
        condition: checkpoint_rich = 1
    choices:
      - position: 1
        text: Su apariencia
        effects:
          - set:
              current_scene: ch2_looks
              ch2_kate_whisper: 1
              checkpoint_rich: 0
      - position: 2
        text: Decidir cuál de los dos debería intentar conquistarla
        effects:
          - set:
              current_scene: ch2_pass
              ch2_kate_whisper: 2
              checkpoint_rich: 0
              ac_ch2_talker: 1
            achievement:
              id: ac_ch2_talker
              title: Charlatán habilidoso
      - position: 3
        text: Simplemente terminando nuestra discusión de antes
        effects:
          - set:
              current_scene: ch2_earlier
              ch2_kate_whisper: 3
              checkpoint_rich: 0
      - position: 4
        text: Discutiendo si es una banshee o no
        effects:
          - set:
              current_scene: ch2_banshee
              ch2_kate_whisper: 4
              checkpoint_rich: 0
  - name: ch2_looks
    texts:
      - source: scene_text
        paragraph: 25
        text: |-
          "Estábamos hablando de tu apariencia, en realidad", le digo.

          La mujer me mira fijamente. Es difícil saber si está molesta o simplemente no le afecta mi comentario, pero al menos parece creerme. Decide ignorarme por completo y se dirige a Daren en su lugar.

          "No respondiste a mi pregunta. Estaba preguntando si eras Daren, el sanador con armadura".

          "Lo soy, en efecto", responde Daren. "¿Qué asunto tendrías conmigo?"
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch2_escort
  - name: ch2_pass
    texts:
      - source: scene_text
        paragraph: 26
        text: |-
          "Estábamos tratando de decidir cuál de los dos debería intentar conquistarte", le digo. "¡Estábamos a punto de jugar piedra, papel o tijera por ello! ¿Nos harías el honor de arbitrar nuestro encuentro?"

          La mujer está claramente molesta por mi comentario. Intenta controlar su ceño y parecer impasible, pero su enojo es bastante visible. Me pregunto si fui demasiado lejos con mi broma. Bueno, al menos no parece dudar de mis palabras.

          Decide ignorarme por completo y se dirige a Daren en su lugar.

          "No respondiste a mi pregunta. Estaba preguntando si eras Daren, el sanador con armadura".

          "Lo soy, en efecto", responde Daren. "¿Qué asunto tendrías conmigo?"
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch2_escort
  - name: ch2_earlier
    texts:
      - source: scene_text
        paragraph: 27
        text: |-
          "Estábamos terminando nuestra discusión de antes", le digo.

          Me mira con sospecha. No parece creerme. Decide dejar el tema por ahora y se dirige a Daren en su lugar.

          "No respondiste a mi pregunta. Estaba preguntando si eras Daren, el sanador con armadura".

          "Lo soy, en efecto", responde Daren. "¿Qué asunto tendrías conmigo?"
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch2_escort
  - name: ch2_banshee
    texts:
      - source: scene_text
        paragraph: 28
        text: |-
          "Estábamos discutiendo si eres una banshee o no", le digo.

          "Oh", dice ella.

          Parece conmocionada por mi comentario.

          "Bueno, lamento haberles molestado, entonces", continúa. "Me pondré en camino".

          Mientras se gira para irse, Daren la llama.

          "¡Espera! ¡No lo dejaste terminar! Ya hemos concluido que no eres una banshee. ¡Puedes quedarte!"

          Luego se vuelve hacia nosotros, lentamente.

          "¿Puedo?"

          Trata de mantener su expresión lo más neutral posible, pero hubo un ligero temblor en su tono cuando hizo la pregunta, y sus ojos están un poco llorosos. Parece que ha estado conteniendo las lágrimas.

          "Por supuesto que puedes", responde Daren. "Ahora, ¿qué fue lo que me preguntaste al principio?"

          La expresión de la mujer vuelve lentamente a la normalidad, mientras repite su pregunta inicial.

          "Estaba preguntando si eras Daren, el sanador con armadura".

          "Lo soy, en efecto", responde Daren. "¿Qué asunto tendrías conmigo?"
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch2_escort
  - name: ch2_escort
    routes:
      - condition: ch1_stillwater = 1
        texts:
          - source: scene_text
            paragraph: 29
            text: |-
              "Yo... requiero una escolta. No estoy segura de poder sobrevivir a este torneo por mi cuenta. Y he oído hablar de todas tus hazañas de valor y todas tus leyendas, así que pensé que tal vez..."

              "¡No digas más! Te otorgaré mi protección durante la duración de tu búsqueda. Por lo que dices, ¿deduzco que no estás tratando realmente de ganar el torneo?"

              "No... no lo estoy. Estoy buscando... a una amiga. Y tengo razones para creer que está en algún lugar de este continente. Pero todavía no tengo ninguna pista específica. Por ahora, solo necesito seguir con vida".

              "¡Entonces puedes unirte a nosotros! ¡Estábamos a punto de salir de aquí! Estamos demasiado al descubierto en este momento".

              "¿Nosotros? ¿Planeas viajar junto a este Stillwater? ¡No puedes confiar en él!"
        choices:
          - position: 1
            text: Preguntarle qué tiene contra mí
            effects:
              - set:
                  current_scene: ch2_against
          - position: 2
            text: Preguntar por qué deberíamos confiar en ella
            effects:
              - set:
                  current_scene: ch2_trust
          - position: 3
            text: Preguntar por qué se apresura tanto a confiar en Daren y no en mí
            effects:
              - set:
                  current_scene: ch2_quick
      - condition: ch1_stillwater = 2
        texts:
          - source: scene_text
            paragraph: 30
            text: |-
