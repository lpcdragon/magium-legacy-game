  - name: ch2_fallen_trees
    routes:
      - condition: ch1_stillwater = 2
        texts:
          - source: scene_text
            paragraph: 35
            text: |-
              "Barry, ¿no crees que hay cosas más importantes que hacer ahora que andar jugando con ese juguete?", me pregunta Daren.

              "Esto no es un juguete", le respondo mientras vuelvo a guardar el dispositivo en mi bolsillo. "Y creo que deberías prestar más atención a por dónde vas en lugar de sermonearme, porque veo que se nos acaba de terminar el bosque".

              "¡Silencio, los dos! Tenemos compañía", dice Kate.

              Tiene razón. Mirando a nuestro alrededor, veo que hay árboles caídos por todas partes en esta zona, y hay bastantes cadáveres tirados por ahí. Parece que ha habido una batalla aquí, o tal vez varias. Los vencedores estaban en medio de saquear los cuerpos cuando nos notaron.

              Son tres en total. Uno de ellos está considerablemente bien formado para ser un mago. Tiene una barba negra muy larga que le cubre la cara, parece tener unos cuarenta y tantos años, lleva una armadura pesada y sostiene una gran hacha de batalla. Los otros dos son un poco más delgados y jóvenes y visten chalecos de cota de malla en su lugar, pero no sostienen armas. El mago barbudo con el hacha de batalla le grita a Daren.

              "Vaya equipo el que has reunido allí, sanador con armadura. Un sanador, una banshee y un humano común. ¡Es como si estuvieras muriéndote por perder este torneo!"

              Kate se vio visiblemente afectada por el comentario de la banshee. Sus ojos se contrajeron y su mirada se dirigió inconscientemente hacia el suelo.

              "Cuida tu lengua, necio", le respondo. "¿A quién llamas humano común? ¿No has oído hablar de los Stillwaters?"
          - source: scene_text_2
            paragraph: 8
            text: |-
              "¡Ja! ¡Los Stillwaters son leyendas y nada más! No sé qué intentabas lograr uniéndote a este torneo, muchacho, pero pronto ya no importará".

              "¿Por qué?", le pregunta Daren al mago barbudo. "¿Por qué has hecho esto?"

              Señala los cuerpos sin vida que yacen a nuestro alrededor.

              "¡Nadie nos dijo que deberíamos empezar a matarnos unos a otros!", continúa Daren. "Nos dijeron que no hay reglas hasta que nos den nuestros primeros objetivos. ¡Ni siquiera sabíamos si iba a haber combate involucrado! ¿Por qué tuviste que matar a todas estas personas?"

              "Porque no hay reglas", responde el mago con el hacha de batalla. "No hay reglas significa que podemos hacer lo que queramos. ¡Y lo que queremos es eliminar a la mayor parte de la competencia posible antes de que comience el evento principal!"

              Él sonríe.
          - source: scene_3
            paragraph: 4
            text: |-
              "¡Mis hijos y yo estábamos un poco preocupados al principio! Temíamos no estar listos para las ligas mayores. ¡Pero aquí estamos!", exclama el mago barbudo mientras levanta las manos y adopta una postura victoriosa. "¡Pero basta de charla! ¡Todos sabemos lo que viene!"

              "¡Barry, ponte detrás de mí!", grita Daren mientras se lanza frente a mí.

              "Primera regla del combate", dice el mago barbudo.

              De repente, uno de los dos magos más jóvenes que estaban al lado del mago con el hacha de batalla desaparece y aparece justo detrás de mí, con una daga en la mano.

              "Siempre mata primero a los enemigos más débiles", continúa el mago barbudo.
