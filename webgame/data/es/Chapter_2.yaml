  - name: ch2_ask_kate
    texts:
      - source: scene_text
        paragraph: 44
        text: |-
          "¡Kate, ayuda!", grito, mientras Daren todavía intenta mantener a raya a los dos atacantes. Kate no muestra señales de haberme oído y continúa defendiéndose de las espadas que vuelan hacia ella.

          "¡Kate!", grito de nuevo. "¡Lo están matando!"

          Al terminar de gritar, Kate mira brevemente en mi dirección y extiende su brazo derecho hacia el mago que empuña la daga, con la palma hacia él. Un cono de hielo sale lentamente de su palma, con su extremo afilado apuntando hacia la cabeza del mago.

          Todo lo que siguió ocurrió casi en un instante. Sin perder un segundo, envió el cono de hielo directamente a la cabeza del joven mago, matándolo al instante. La conmoción del mago mayor al ver morir a su hijo frente a él proporcionó una apertura suficiente para que Daren le cortara la cabeza justo por encima de los hombros. Mientras el mago lanzador de espadas todavía se recuperaba de lo que acababa de presenciar, Kate tomó una de las muchas espadas que yacían a sus pies y rápidamente la envió volando de regreso hacia su dueño, empalándolo a través del corazón y matándolo en el acto.

          Fue un espectáculo espantoso, pero en este punto, lo único que me importa es que de alguna manera logré salir vivo de eso.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch2_battle_end
  - name: ch2_battle_end
    routes:
      - condition: ch1_stillwater = 1
        texts:
          - source: scene_text
            paragraph: 56
            text: |-
              Daren se ve muy enojado. Me lanza una mirada acusadora mientras cura sus heridas.

              "Barry, tenemos que hablar. No has sido completamente honesto conmigo, y casi morimos allí atrás por eso. No eres realmente un Stillwater, ¿verdad?"

              "No... no lo soy", admito.

              "Pero tampoco eres uno de los lugareños. De lo contrario, ese hechizo suyo nos habría alertado en el momento en que sentimos tu presencia".

              Está hablando del hechizo que los organizadores del torneo lanzaron sobre cada uno de los participantes antes de teletransportarnos aquí. No se nos permite lastimar a los humanos que viven en este continente, por lo que su hechizo nos advierte cuando uno de ellos está cerca. Si se puede creer lo que dijeron, se supone que su hechizo nos detendrá incluso antes de que intentemos lastimar a cualquiera de los lugareños. Si es accidental, simplemente nos detiene antes de hacerlo. Si es intencional, nos elimina del torneo y nos envía de regreso.

              También se supone que su hechizo actúa como un medio de comunicación con los organizadores. Dijeron que transmitirían los objetivos a cada uno de nosotros individualmente. Es gracioso. Todos esos cuidadosos preparativos por su parte, y nunca se molestaron en comprobar si yo era un mago o no. Diablos, ¿qué estoy diciendo? Probablemente ni siquiera les importó.
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: ch2_confession
      - condition: ch1_stillwater = 2
        texts:
          - source: scene_text
            paragraph: 57
            text: |-
              Mientras cura sus heridas, Daren me mira directamente.

              "¡Maldita sea, Barry! Eso estuvo demasiado cerca. Vamos a tener que pensar alguna estrategia hasta nuestra próxima pelea, o no vamos a durar mucho más".

              "Sí", le digo. "Creo que puedes tener razón".

              Después de terminar su hechizo de curación, camina hacia Kate.

              "Kate, por favor explícame algo, porque simplemente no lo entiendo. Con la forma en que estabas luchando allí atrás, ¿por qué pedirías una escolta?"

              "Todos tienen sus debilidades, sanador... A juzgar por lo mucho que has estado luchando en esta pelea, asumiría que, irónicamente, eres más débil contra otros encantadores de armas como tú. Pero el hecho de que me encargara de estos matones con facilidad no significa que no vaya a tener problemas contra otros enemigos. Nadie puede sobrevivir a este torneo solo".

              "Sí... supongo que tienes razón".
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: ch2_battle_end2
  - name: ch2_confession
    texts:
      - source: scene_text
        paragraph: 58
        text: |-
          "Así que debes ser un participante, entonces", continúa Daren. "¿Qué razón tendrías para participar en un torneo contra los magos más poderosos del mundo?"

          Busco lo mismo que cualquier otro participante en este torneo, Daren, pero no estoy seguro de qué tan prudente sería contártelo.

          Busco el premio que se ofrece al ganador. El Magium.

          Nadie sabe exactamente cómo se ve, o de qué está hecho, pero todo el mundo sabe que es la fuente de toda la magia del mundo, y que solo se puede encontrar en el continente de Varathia. Todos los magos lo buscan. Lo anhelan. Están seguros de que si tienen acceso a él, pueden aumentar sus poderes cien veces y convertirse en leyendas vivientes. Y aunque es un error común pensar que el Magium solo es útil para los magos instruidos, mis estudios me han llevado a creer que el Magium es tan extraordinario que incluso puede convertir a un humano normal en un mago.
      - source: scene_text_2
        paragraph: 18
        text: |-
          He buscado durante mucho tiempo una forma de entrar en Varathia, pero la única forma en que uno puede viajar a su continente es recibiendo una invitación directa. Se envían muy pocas de esas anualmente, y las personas que son teletransportadas allí se mantienen bajo supervisión directa durante la duración de su estadía, y regresan sin información sobre las coordenadas del lugar.

          Pero cuando toda esperanza parecía perdida, llegó el anuncio. Un anuncio mundial por parte de los reyes de Varathia de que estaban organizando un torneo donde cada mago en el mundo estaba invitado. Y al ganador se le concedería acceso al Magium.

          Supe entonces que nunca habría otra oportunidad como esta.

          "¿Por qué te uniste a este torneo, Barry?", me pregunta Daren de nuevo.
    choices:
      - position: 1
        text: Contarle la verdad
        effects:
          - set:
              current_scene: ch2_truth2
              ch2_human_reason: 1
      - position: 2
        text: Decirle que me obligaron
        effects:
          - set:
              current_scene: ch2_forced2
              ch2_human_reason: 2
      - position: 3
        text: Decirle que busco una cura para mi hermana enferma
