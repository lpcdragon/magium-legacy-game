              Una vez que estoy lo suficientemente lejos de Daren y su oponente, me vuelvo hacia el mago de la daga y adopto mi postura de combate. Me doy cuenta de que, de repente, me siento bastante confiado en mis habilidades de lucha. ¿Es por ese dispositivo de estadísticas? El mago intenta sorprenderme de nuevo teletransportándose detrás de mí, pero logro detener su brazo mientras lo lanza hacia mí. Sujetando firmemente su brazo, tiro de su muñeca hacia atrás, obligándolo a soltar la daga. Mientras tomo su arma, él saca rápidamente otra daga de su manga y hace una estocada hacia mí. Nuestras dos dagas chocan y comenzamos a luchar.

              "Muchacho, ¿qué crees que estás haciendo? ¡Deja de tontear y termínalo! ¡Es solo un humano común!", grita el mago con el hacha de batalla.

