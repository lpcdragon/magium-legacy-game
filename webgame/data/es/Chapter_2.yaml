  - name: ch2_truth2
    texts:
      - source: scene_text
        paragraph: 59
        text: |-
          "Busco lo mismo que tú, Daren", le digo. "Busco el Magium. Ha sido mi sueño desde pequeño convertirme en mago, y el Magium puede concederme ese deseo".

          "Vamos, Barry. ¡Vas a tener que inventar una mentira mejor que esa si quieres que te crea!"

          Se detiene y me mira directamente a los ojos.

          "Por los dioses... ¡Hablas en serio! Barry, alabo tu valentía y determinación pero... Te das cuenta de que no puedes ganar todo este torneo solo fanfarroneando, ¿verdad?"

          "Si me permites interrumpir", dice Kate. "Creo que deberíamos salir de aquí lo antes posible, antes de que alguien nos vea entre todos estos cadáveres y piense que nosotros matamos a todas estas personas".

          Daren la mira.

          "No te entiendo, mujer. Con la forma en que estabas luchando allí atrás, ¿por qué pedirías una escolta?"

          "Todos tienen sus debilidades, sanador... A juzgar por lo mucho que has estado luchando en esta pelea, asumiría que, irónicamente, eres más débil contra otros encantadores de armas como tú. Pero el hecho de que me encargara de estos matones con facilidad no significa que no vaya a tener problemas contra otros enemigos. Nadie puede sobrevivir a este torneo solo".

          "Sí... supongo que tienes razón".
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch2_battle_end2
  - name: ch2_forced2
    texts:
      - source: scene_text
        paragraph: 60
        text: |-
          "No vine aquí por elección", le digo. "Créeme, no me gustaría nada más que irme de este lugar y nunca mirar atrás. Pero esa no es realmente una opción para mí en este momento. Todo lo que puedo hacer ahora es tratar de sobrevivir hasta el final del torneo".

          Daren hace una pequeña pausa para reflexionar sobre mis palabras.

          "Espera, Barry... creo que también hay otra forma".

          "¿La hay?"

          "¡Sí! ¿Recuerdas las reglas? Dijeron que nos eliminarían del torneo y nos teletransportarían de regreso si detectaban cualquier intención de dañar a los lugareños. ¡Podrías usar eso, Barry! ¡Solo necesitas encontrar a cualquiera de los humanos que viven en este continente, intentar darles un puñetazo en la cara, y serás liberado!"

          "Yo... eh... nunca lo había pensado de esa manera".

          "¡No te preocupes, me aseguraré de mantenerte a salvo hasta que lleguemos a una de las ciudades!"
