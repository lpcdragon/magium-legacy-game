  - name: ch2_fight
    texts:
      - source: scene_text
        paragraph: 51
        text: |-
          No hay forma de que Daren pueda luchar contra los dos mientras me defiende. Dado que el joven mago parece estar concentrado en mí, lo atraeré lejos de Daren e intentaré luchar contra él por mi cuenta hasta que Daren acabe con el mago mayor.

          Kate parece haber captado la atención indivisa del mago lanzador de espadas. Él constantemente envía espadas hacia ella desde todas las direcciones, mientras ella crea paredes de hielo para bloquear sus ataques. Tenemos suerte. Con la debilidad de Daren contra las armas y mi falta de talentos mágicos, ese mago probablemente habría sido el más difícil de combatir para nosotros.

          Cuando el mago barbudo nos alcanza, su hacha de batalla choca ruidosamente con la espada de Daren.

          "Veo que has encantado bien tu arma, sanador", dice el mago mayor. "¿Pero cuánto tiempo puedes durar contra un guerrero endurecido en batalla como yo?"

          Él ruge y presiona su hacha de batalla con más fuerza contra la espada de Daren.
      - source: scene_text_2
        paragraph: 15
        text: |-
          Mientras los dos luchan, salgo corriendo hacia el bosque. Como era de esperar, el mago de la daga viene justo tras de mí.

          "¡Barry, espera!", me grita Daren.

          Intenta seguirme, pero decide no hacerlo. No puede permitirse apartar los ojos del mago barbudo ni un segundo. Es demasiado peligroso.

          Mientras tanto, el mago que lucha contra Kate ha logrado rodearla con espadas flotantes, apuntadas hacia ella desde todas las direcciones. Las envía todas hacia ella simultáneamente en un intento de abrumar sus defensas. Rápidamente se rodea con una esfera de hielo muy grueso, y todas las espadas, una vez más, se detienen en ella. Al deshacer la esfera, los cientos de espadas caen al suelo con un estruendo ensordecedor.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch2_fight2
