        paragraph: 61
        text: |-
          "Es... Es mi hermana. Está terminalmente enferma, y la cura para su enfermedad solo se puede encontrar en este continente. He intentado durante meses conseguir una invitación a este lugar, pero no quisieron oír hablar de ello. Esta era la única forma. Solo puedo esperar que de alguna manera logre sobrevivir lo suficiente para encontrar lo que busco".

          Daren pone una mano en mi hombro.

          "Lo encontraremos. ¡Juntos! ¡Prometo que no dejaré que te pase nada hasta que logres tu objetivo!"

          "Si me permites interrumpir", dice Kate. "Creo que deberíamos salir de aquí lo antes posible, antes de que alguien nos vea entre todos estos cadáveres y piense que nosotros matamos a todas estas personas".

