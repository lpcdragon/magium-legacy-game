  - name: ch2_stats
    texts:
      - source: scene_text
        paragraph: 34
        text: |-
          Mientras marchamos por el bosque, escucho unos fuertes pitidos provenientes de mi bolsillo derecho.

          "Barry, ¿qué es ese sonido?", pregunta Daren. "Conozco ese sonido. No me digas que trajiste una baratija del adivino contigo hasta aquí. ¿Planeas adivinarnos el futuro, Barry?"

          Una baratija del adivino. Así es como la mayoría de la gente llama a estos dispositivos hoy en día. Pero muy pocas personas saben lo que realmente hacen y cómo funcionan en realidad. Mis investigaciones me han llevado a creer que estos dispositivos aprovechan su energía de la magia que los rodea. Cuanta más energía aprovechan, más efectivos se vuelven. Dado que los magos suelen estar muy dispersos unos de otros y no tienen realmente ninguna razón para lanzar hechizos poderosos uno tras otro, los efectos de tal dispositivo son mayormente insignificantes.

          Pero imagina la cantidad de energía que podría reunir en un lugar lleno de los magos más poderosos del mundo, que luchan constantemente entre sí.

          Saco el dispositivo de mi bolsillo. Se parece mucho a un juguete, con unos pocos botones y una pantalla. Al presionar los botones, diferentes letras aparecen mágicamente en la pantalla, formando palabras y mostrando números. El dispositivo llama a estos mis 'estadísticas'. Mis estadísticas consisten principalmente en varios atributos físicos como fuerza, velocidad, reflejos, resistencia, observación y audición, pero también hay otros como técnica de combate, lenguas antiguas y premonición.
      - source: scene_text_2
        paragraph: 7
        text: |-
          Cuando el dispositivo reúne suficiente energía, me avisa mediante pitidos y luego me permite invertir un número limitado de puntos en mis estadísticas. Por el momento, todas mis estadísticas están en cero, lo que significa que la energía del dispositivo estaba completamente agotada cuando lo compré. Supongo que tendré que empezar a subirlas de nivel desde cero.

          Se supone que invertir mis puntos en estadísticas mejora realmente mis atributos reales, siempre que mantenga el dispositivo lo suficientemente cerca de mí para que entre en contacto con mi aura mágica. A medida que pase mi tiempo aquí, espero escuchar estos pitidos cada vez con más frecuencia. Sin embargo, tendré que pensar dos veces la forma en que gasto mis puntos, ya que no tengo forma de saber cuándo recibiré mi próximo lote de puntos, ni forma de cambiar de opinión después de haberlos invertido. Es probable que los valores máximos que aparecen ahora para cada estadística aumenten a medida que pase el tiempo.

          Este dispositivo es utilizado principalmente por adivinos debido a su estadística de premonición. Les proporciona vislumbres muy vagos del futuro que luego son libres de interpretar a su gusto. Me pregunto si la estadística de lenguas antiguas significa realmente que empezaré a ser capaz de entender y hablar lenguas antiguas. Escuché que hay muchos de esos escritos en este continente. Y escuché que algunas personas aquí no hablan la lengua común.
    choices:
      - position: 1
        text: Invertir puntos ahora
        effects:
          - set:
              current_scene: ch2_stats_spent
              storyboard_controls: Jump to frame "Stats"
      - position: 2
        text: Invertir puntos más tarde (presionando el botón de estadísticas en la parte superior de la pantalla)
        effects:
          - set:
              current_scene: ch2_fallen_trees
