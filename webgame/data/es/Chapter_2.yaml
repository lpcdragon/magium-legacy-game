            paragraph: 70
            text: |-
              Al acercarnos al bosque, veo a una cierva y su cervatillo aparecer de detrás de los árboles. Cuando el cervatillo abre la boca, me doy cuenta de que habla en una de las lenguas antiguas que mi dispositivo de estadísticas me ha enseñado.

              "¡Mami, hay más forasteros por aquí!"

              "No te preocupes, hijo", le dice la madre del cervatillo. "Encontraremos un camino seguro de regreso a nuestra cueva. Lo prometo".

              Vuelven hacia el bosque.

              "Esperen", les grito en su propio idioma.

              Los dos ciervos se detienen y me miran.

              "¿Puedes... entendernos?", pregunta la cierva.
