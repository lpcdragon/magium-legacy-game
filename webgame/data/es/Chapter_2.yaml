  - name: ch2_battle_begins
    texts:
      - source: scene_text
        paragraph: 42
        text: |-
          El mago con el hacha de batalla parece haber perdido temporalmente la calma y se ve un poco aterrorizado. Y debería estarlo. La intención de matar de Kate es tan fuerte que casi parece palpable.

          "Veo traidores y lanzadores de espadas", grita ella. "¿Y se hacen llamar magos? ¡Vengan. Les mostraré magia de verdad!"

          Mientras habla, el aire a nuestro alrededor parece volverse más frío. Así que esto es lo que se siente al estar en un torneo junto a los magos más poderosos del mundo.

          El mago barbudo parece haber reaccionado.

          "Tus trucos de salón no te salvarán por segunda vez, moza. No me importa si eres una banshee o no. ¡Ninguno de ustedes va a salir de este lugar con vida!", grita mientras corre hacia Daren, con su hacha de batalla lista para atacar.

          A medida que se acerca, me doy cuenta de que si no hago algo rápido, Daren se verá obligado a luchar contra el mago mayor y el joven al mismo tiempo mientras también me defiende a mí, y no tendrá el lujo de usar hechizos de curación ya que requieren que esté calmado y relajado para lanzarlos.

          ¿Tal vez hay algo que pueda hacer para ayudar?
    choices:
      - position: 1
        text: Esconderme detrás de Daren y dejar que él se encargue de ambos
        effects:
          - set:
              current_scene: ch2_hide
      - position: 2
        text: Atraer al joven mago lejos de Daren y concentrarme en evitar sus ataques
        effects:
          - set:
              current_scene: ch2_avoid
      - position: 3
        text: Luchar contra el joven mago yo mismo
        effects:
          - set:
              current_scene: ch2_fight
  - name: ch2_hide
    texts:
      - source: scene_text
        paragraph: 43
        text: |-
          Si trato de encargarme del joven mago yo mismo, podría estorbar a Daren. Le dejaré esto a él e intentaré seguir su iniciativa tanto como sea posible.

          Kate parece haber captado la atención indivisa del mago lanzador de espadas. Él constantemente envía espadas hacia ella desde todas las direcciones, mientras ella crea paredes de hielo para bloquear sus ataques. Tenemos suerte. Con la debilidad de Daren contra las armas y mi falta de talentos mágicos, ese mago probablemente habría sido el más difícil de combatir para nosotros.

          Cuando el mago barbudo nos alcanza, su hacha de batalla choca ruidosamente con la espada de Daren.

          "Veo que has encantado bien tu arma, sanador", dice el mago mayor. "¿Pero cuánto tiempo puedes durar contra un guerrero endurecido en batalla como yo?"

          Él ruge y presiona su hacha de batalla con más fuerza contra la espada de Daren. El joven mago intenta atacarme de nuevo con su daga, pero Daren intercepta su golpe con su escudo.
      - source: scene_text_2
        paragraph: 10
        text: |-
          "¿Cuánto tiempo planeas defender a este pequeño mocoso? ¡No puedes protegerlo y luchar contra nosotros dos al mismo tiempo! ¡Abandona al chico y tal vez tengas una oportunidad!"

          "¡Nunca!", grita Daren mientras lanza un tajo hacia el mago barbudo y su hoja se encuentra con el acero del hacha de batalla una vez más.

          Mientras tanto, el mago que lucha contra Kate ha logrado rodearla con espadas flotantes, apuntadas hacia ella desde todas las direcciones. Las envía todas hacia ella simultáneamente en un intento de abrumar sus defensas. Rápidamente se rodea con una esfera de hielo muy grueso, y todas las espadas, una vez más, se detienen en ella. Al deshacer la esfera, los cientos de espadas caen al suelo con un estruendo ensordecedor.

          El mago de la daga tiene mucho interés en asestarme un golpe. Daren ha logrado bloquear con éxito cada uno de sus golpes dirigidos a mí, pero se ha lastimado en el proceso más de una vez. Incluso con su armadura de cuerpo completo equipada, puedo decir que no durará mucho más de esta manera. Hay que hacer algo.
    choices:
      - position: 1
        text: Pedirle ayuda a Kate
        effects:
          - set:
              current_scene: ch2_ask_kate
              ch2_kate_debt: 1
      - position: 2
        text: Atraer al joven mago lejos de Daren y concentrarme en evitar sus ataques
        effects:
          - set:
              current_scene: ch2_avoid
      - position: 3
        text: Luchar contra el joven mago yo mismo
        effects:
          - set:
              current_scene: ch2_fight
  - name: ch2_avoid
    texts:
      - source: scene_text
        paragraph: 45
        text: |-
          No hay forma de que Daren pueda luchar contra los dos mientras me defiende. Dado que el joven mago parece estar concentrado en mí, lo atraeré lejos de Daren e intentaré evadir sus ataques tanto como pueda, hasta que Daren acabe con el mago mayor.

          Kate parece haber captado la atención indivisa del mago lanzador de espadas. Él constantemente envía espadas hacia ella desde todas las direcciones, mientras ella crea paredes de hielo para bloquear sus ataques. Tenemos suerte. Con la debilidad de Daren contra las armas y mi falta de talentos mágicos, ese mago probablemente habría sido el más difícil de combatir para nosotros.

          Cuando el mago barbudo nos alcanza, su hacha de batalla choca ruidosamente con la espada de Daren.

          "Veo que has encantado bien tu arma, sanador", dice el mago mayor. "¿Pero cuánto tiempo puedes durar contra un guerrero endurecido en batalla como yo?"

          Él ruge y presiona su hacha de batalla con más fuerza contra la espada de Daren.
      - source: scene_text_2
        paragraph: 11
        text: |-
          Mientras los dos luchan, salgo corriendo hacia el bosque. Como era de esperar, el mago de la daga viene justo tras de mí.

          "¡Barry, espera!", me grita Daren.

          Intenta seguirme, pero decide no hacerlo. No puede permitirse apartar los ojos del mago barbudo ni un segundo. Es demasiado peligroso.

          Mientras tanto, el mago que lucha contra Kate ha logrado rodearla con espadas flotantes, apuntadas hacia ella desde todas las direcciones. Las envía todas hacia ella simultáneamente en un intento de abrumar sus defensas. Rápidamente se rodea con una esfera de hielo muy grueso, y todas las espadas, una vez más, se detienen en ella. Al deshacer la esfera, los cientos de espadas caen al suelo con un estruendo ensordecedor.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch2_avoid2
  - name: ch2_avoid2
    routes:
      - condition: agility > 0
        texts:
          - source: scene_text
            paragraph: 46
            text: |-
              Mi plan de atraer al joven mago lejos está funcionando mucho mejor de lo que esperaba. El mago sigue teletransportándose tras de mí e intentando pillarme desprevenido, pero cada vez que cree que me tiene en un aprieto, simplemente me alejo con facilidad. Sabía que ese dispositivo de estadísticas resultaría útil, pero nunca me atreví a soñar que lo sería tanto. Siento que podría seguir corriendo así durante horas sin cansarme.

              "Muchacho, ¿qué crees que estás haciendo? ¡Deja de tontear y termínalo! ¡Es solo un humano común!", grita el mago con el hacha de batalla.

              Kate parece haber pasado a la ofensiva. Está lanzando conos de hielo hacia el otro mago joven, y él ahora se ve obligado a usar sus espadas para cortarlos, en lugar de atacarla. A medida que él se concentra más en la defensa, los ataques de Kate se vuelven cada vez más implacables. No tarda mucho hasta que empieza a enviar cientos de dagas de hielo hacia su enemigo. El mago no parece saber cómo usar su técnica para defenderse de tal cantidad de ataques simultáneos. Solo hace falta un pequeño error de cálculo por su parte para terminar la batalla abruptamente, cuando una de las dagas de hielo lo apuñala justo en el corazón, matándolo en el acto.
          - source: scene_text_2
            paragraph: 12
            text: |-
              "¡No!", grita el mago mayor cuando ve lo que le pasó a su hijo mayor. Apartar los ojos de su oponente fue un error fatal. Daren no desperdició su oportunidad y clavó su hoja justo en el pecho del hombre, su arma encantada atravesando la pesada armadura del mago como un cuchillo en mantequilla. El mago barbudo dio un último gorgoteo antes de ahogarse en su propia sangre.

              Aterrorizado, el joven mago de la daga intenta teletransportarse al bosque para escapar, pero el alcance de su hechizo parece limitado y solo lo transporta a mitad de camino. Intenta correr, pero Kate lo elimina desde lejos con un cono de hielo en la cabeza, lo que lo mató instantáneamente.

              Fue un espectáculo espantoso, pero en este punto, lo único que me importa es que de alguna manera logré salir vivo de eso.
