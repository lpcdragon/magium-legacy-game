  - name: ch2_quick
    texts:
      - source: scene_text
        paragraph: 33
        text: |-
          "¿Por qué yo?", le pregunto. "¿Por qué puedes confiar en Daren tan fácilmente, pero no en mí?"

          "¡Porque su reputación lo precede! ¡Pocos son los que no han oído hablar de su valentía y su moralidad excepcional! Tú, por otro lado, provienes de una raza llena de homicidas en masa".

          "¡Vaya, vaya! ¡Calmémonos todos!", dice Daren.

          Se vuelve hacia la mujer.

          "Escucha, entiendo tu preocupación, pero este hombre salvó mi vida y tengo la intención de pagar mi deuda con él. Si buscas una escolta, entonces viajaremos los tres juntos. No aceptaré ninguna alternativa".

          La mujer hace una pausa para considerar las palabras de Daren.

          "Muy bien", dice. "Si así tiene que ser, me veo obligada a cumplir. Pero sabe que estaré vigilando constantemente mi espalda. No me convencen tan fácilmente como a ti, sanador con armadura".
