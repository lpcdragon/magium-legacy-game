            paragraph: 32
            text: |-
              "Bueno, si estás segura de que estás bien, supongo que deberíamos ponernos en marcha."

              Poco después de terminar de hablar, todos empezamos a dirigirnos hacia la salida que lleva a la sala del teletransportador. Justo cuando estamos a punto de dar los primeros pasos, oímos la voz de Flower mientras sus ojos se vuelven de un azul brillante.

              "¡Esperen!", dice Illuna, y todos nos detenemos en seco.

              "¿Illuna?", dice Flower. "¿Por fin terminaste de practicar ese hechizo?"

              "Bueno, me habrían venido bien unos minutos más para al menos poner bien todas las letras de este hechizo, pero digamos que está prácticamente terminado", dice Illuna. "Apártense. Voy a conjurar un montón de platos."

              Illuna hace entonces unos gestos con las manos, y un plato grande con una tarta de chocolate aparece en el suelo delante de nosotros, junto con varios platos pequeños que rodean al plato grande y que tienen cada uno un cuchillo y un tenedor encima. Hay un montón de velas apagadas sobre la tarta y, ahora que la miro mejor, veo que también hay unas letras escritas en la superficie con glaseado. Las letras forman la frase '¡Feliz cumpeaños, Flower!'.

              "¿'Feliz cumpeaños, Flower'?", pregunta Hadrik.

              "Obviamente se supone que pone 'cumpleaños', pero ya dije que no tuve tiempo para--", dice Illuna.

              "¡¿Hoy es el cumpleaños de Flower?!", pregunta Kate, conmocionada.

              "Sí, para eso es la tarta", dice Illuna, ligeramente irritada.
