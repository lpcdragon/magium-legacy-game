        texts:
          - source: scene_text
            paragraph: 29
            text: |-
              "¿Tú y el capitán de la guardia real tienen especializaciones mágicas aparte de la manipulación de aura?"

              "No necesariamente especializaciones, pero podemos usar hechizos normales de mago como otros magos", dice el rey del subsuelo. "Al capitán de la guardia le gusta utilizar la manipulación de aura casi todo el tiempo, porque es muy eficaz y difícil de contrarrestar, pero se sabe que también usa otros tipos de hechizos cuando siente que lo están acorralando. No sabemos exactamente cuántos hechizos es capaz de lanzar, así que les recomiendo tener cuidado cuando peleen con él, incluso si sienten que llevan la ventaja durante una batalla. En fin, espero que esto haya respondido su pregunta. Creo que a estas alturas ya conocen el camino a la sala del teletransportador, así que espero que nos perdonen por no acompañarlos a la salida. ¡Les deseo suerte!"
          - source: scene_text_2
            paragraph: 17
            text: |-
              "Sí, sí", digo. "Adiós, supongo."

              Justo cuando estamos a punto de salir del salón del trono, oímos unos susurros detrás de nosotros y, poco después, el rey vuelve a llamarnos.
            condition: b3_ch5_fight >= 4
          - source: scene_text_2
            paragraph: 18
            text: |-
              "Sí, sí", digo. "Adiós, supongo."

              "Ah, y para que quede claro...", dice el rey del subsuelo. "Leila no estaba siendo puesta a prueba junto con el resto de ustedes hace un momento. Que yo sepa, no estuvo implicada en el asesinato del conde de Ollendor, así que no hay motivo para echarla de nuestra base, sobre todo teniendo en cuenta que además es la hija del doctor Reidzek. Dicho eso, por supuesto puede unirse a ustedes en la lucha contra el rey de Ollendor, si así lo desea."

              "Entiendo", escribe Leila. "Gracias por decírmelo."

              Justo cuando estamos a punto de salir del salón del trono, oímos unos susurros detrás de nosotros y, poco después, el rey vuelve a llamarnos.
