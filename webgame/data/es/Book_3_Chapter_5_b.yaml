            paragraph: 28
            text: |-
              "¿Por qué te convertiste en guardia real?"

              "¿Qué quieren que les diga?", me responde el rey. "Hubo un tiempo en el que era joven e ingenuo. Nuestras escuelas están hechas de tal forma que te lavan el cerebro desde muy pequeño para que pienses que nuestro reino es el mejor de todos, que la realeza siempre trabaja por el bien del pueblo y que no existe mayor honor que ser guardia real. Mis padres evitaron decirme lo que pensaban de verdad de nuestro reino por miedo a que yo los delatara sin querer ante mis maestros, así que solo descubrí cómo funcionaba realmente el mundo después de empezar a servir como guardia real. Ese descubrimiento fue, por supuesto, lo que me llevó a abandonar la guardia real a los veintinueve años y a formar mi propio pequeño reino aquí, en estos túneles subterráneos. En fin, espero que esta respuesta haya satisfecho su curiosidad. Creo que a estas alturas ya conocen el camino a la sala del teletransportador, así que espero que nos perdonen por no acompañarlos a la salida. ¡Les deseo suerte!"
