            paragraph: 24
            text: |-
              Mientras permanezco ahí pensando qué hacer a continuación, de repente tengo una premonición en la que me veo siendo apuñalado en el lado derecho del abdomen por una hoja invisible. Además, estoy bastante seguro de que Hadrik iba a decir algo justo antes de que me atacaran en la visión.

              Mi atacante debería venir desde el lado derecho, así que mientras sea capaz de averiguar exactamente cuándo va a golpear, debería poder--

              "¿Qué pasa, Albert?", pregunta Hadrik de repente. "¿Ya tienes miedo?"

              En cuanto oigo las palabras de Hadrik, sé exactamente lo que va a ocurrir a continuación, y de inmediato me giro hacia la derecha, extendiendo los brazos delante de mí para agarrar a Albert justo antes de que me ataque. Mi intento tiene éxito, porque el asesino empieza ahora a hacerse visible lentamente mientras intenta soltarse de mi agarre.

              "Más vale que me sueltes si no quieres perder un brazo", dice Albert en un tono amenazante. "Te lo advierto."

              "¿Perder un brazo?", digo. "¿En un simulacro? ¿No crees que te lo estás tomando un poco demasiado a pecho?"
          - source: scene_text_2
            paragraph: 13
            text: |-
              De repente un dolor intensísimo se apodera de mí cuando siento una poderosa corriente eléctrica atravesándome el cuerpo. Albert, en cambio, parece completamente inmune al ataque de rayo aunque yo siga sujetándolo por los brazos, y aprovecha mi pérdida de concentración para liberarse y volverse invisible otra vez.

              Maldición, lo he perdido de vista otra vez. ¿Cómo sigue estando perfectamente bien después de recibir una descarga así? ¿Tiene algún objeto que lo haga inmune a los ataques eléctricos?

              "¿Pero qué demonios?", dice Daren. "¿Desde cuándo Peter forma parte de la prueba? ¡Nunca nos dijiste que nos lanzaría rayos y-- NGH!"

              Mientras Daren hablaba, Albert aprovechó al parecer su confusión para apuñalarlo detrás de la rodilla, porque puedo ver algo de sangre deslizándose por su tobillo.
        effects:
          - set:
              failed_checks:
                - '[ Comprobación de endurecimiento de aura fallida - nivel 4 ]'
              successful_checks:
                - '[ Comprobación de premonición exitosa - nivel 2 ]'
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch05b_obscure
      - condition: premonition >= 2 AND aura_hardening >= 4
        texts:
          - source: scene_text
            paragraph: 24
            text: |-
              Mientras permanezco ahí pensando qué hacer a continuación, de repente tengo una premonición en la que me veo siendo apuñalado en el lado derecho del abdomen por una hoja invisible. Además, estoy bastante seguro de que Hadrik iba a decir algo justo antes de que me atacaran en la visión.

              Mi atacante debería venir desde el lado derecho, así que mientras sea capaz de averiguar exactamente cuándo va a golpear, debería poder--

              "¿Qué pasa, Albert?", pregunta Hadrik de repente. "¿Ya tienes miedo?"

              En cuanto oigo las palabras de Hadrik, sé exactamente lo que va a ocurrir a continuación, y de inmediato me giro hacia la derecha, extendiendo los brazos delante de mí para agarrar a Albert justo antes de que me ataque. Mi intento tiene éxito, porque el asesino empieza ahora a hacerse visible lentamente mientras intenta soltarse de mi agarre.

              "Más vale que me sueltes si no quieres perder un brazo", dice Albert en un tono amenazante. "Te lo advierto."

              "¿Perder un brazo?", digo. "¿En un simulacro? ¿No crees que te lo estás tomando un poco demasiado a pecho?"
          - source: scene_text_2
            paragraph: 14
            text: |-
              De repente siento una poderosa corriente eléctrica atravesarme el cuerpo. Aunque sin duda es una sensación bastante dolorosa, desde luego no resulta inmanejable. Probablemente tenga que agradecérselo a mi estadística de Endurecimiento de aura por mi mayor resistencia a los ataques de rayo.

              Mientras sigo recibiendo la descarga, Albert intenta soltarse otra vez, pero lo sujeto con fuerza y no lo dejo escapar. El asesino no parece verse afectado en absoluto por el ataque eléctrico, aunque lo esté agarrando por los brazos. ¿Significa eso que tiene algún tipo de objeto que le concede inmunidad a la electricidad?

              "¿Pero qué demonios?", dice Daren mientras se gira hacia el rey del subsuelo. "¿Desde cuándo Peter forma parte de la prueba? ¡Nunca nos dijiste que nos lanzaría rayos y-- NGH!"

              Mientras Daren hablaba, Peter cambió de idea y decidió apuntarle a él en vez de a mí, lanzándole un hechizo de rayo a Daren en cuanto le expuso la espalda.
