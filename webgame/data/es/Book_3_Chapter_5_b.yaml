scenes:
  - name: b3_ch05b_refreshed
    routes:
      - condition: b3_ch5_moustache = 2
        texts:
          - source: scene_text
            paragraph: 2
            text: |-
              Cuando se cumplieron nuestras cuatro horas, volvimos a la habitación para despertar a Kate y a Leila. Mientras ellas dos se preparaban para hacer el siguiente turno, Hadrik también se levantó de la cama y dijo que quería practicar sus técnicas nuevas durante unas horas en uno de los pasillos más vacíos. Cuando Hadrik, Kate y Leila se fueron, Flower, Melindra y yo nos dormimos y no volvimos a despertarnos hasta unas cuatro horas después, cuando todos ya estaban recogiendo sus mochilas y preparándose para salir.

              Después de guardar rápido nuestras cosas también, llamamos a Hadrik por el transceptor y luego nos reunimos todos con Hadrik fuera de nuestra habitación para poder dirigirnos juntos a la sala de espera.

              "¿Estás bien, Hadrik?", dice Daren mientras le da una palmada en el hombro mientras caminamos por uno de los pasillos. "No olvides que siempre puedes hablar con nosotros si sientes que necesitas sacarte algo del pecho."

              "Agradezco la preocupación, Daren, pero no hace falta que te preocupes por mí", dice Hadrik. "Ayer tuve un día un poco malo, pero después de una buena noche de sueño me siento completamente renovado y estoy más que listo para la revancha. ¿Cuándo salimos a la superficie?"

              "Saldremos en cuanto nos reunamos con Kelrim", dice Daren. "Probablemente ya esté en la zona de cuarentena, así que iré a buscarlo en cuanto lleguemos a la sala de espera."

              "¿Illuna y Arraka vienen con nosotros también, o tenemos que despertarlas?", digo. "No he oído ni una palabra de ninguna de las dos esta mañana."
          - source: scene_text_2
            paragraph: 2
            text: |-
              "Sí, sí, estoy despierta", dice Arraka. "Ah, y ya he usado un hechizo de agua para limpiar ese bigote falso, por si lo estabas buscando. Muy gracioso, por cierto. Me alegra saber que estás aprovechando bien todo ese tiempo libre. Tengo muchas ganas de verte usar esas nuevas habilidades tuyas contra Selkram en nuestro enfrentamiento final."

              "¿Eso es un desafío?", le pregunto a Arraka.

              "Claro, ¿por qué no?", dice Arraka.

              "Entonces me aseguraré de aprender algunos buenos hechizos de bigote falso especialmente para Selkram en cuanto consiga mis estadísticas mágicas", digo. "En fin, ¿Illuna también se despertó, o solo Arraka?"

              "Illuna está despierta, pero no creo que vaya a responderte", dice Flower. "Llevo intentando hablar con ella desde que me desperté, pero no hace más que decirme que está intentando aprender un hechizo nuevo y que solo me hablará cuando termine."

              "¿Un hechizo nuevo, eh?", digo. "Quizá sea algo que pueda ayudarnos contra la guardia real. Vale, entonces dejémosla con eso."

              Seguimos caminando un poco más por los pasillos hasta llegar a la sala de espera. El tumulto de hace nueve horas parece haberse calmado un poco, pero no estoy seguro de si es porque ya terminaron con la evacuación o porque los rebeldes ya no tienen espacio suficiente en su base para ofrecer refugio a todos los refugiados. A juzgar por todos los civiles que todavía siguen en la sala de espera, yo apostaría a que realmente se quedaron sin lugares donde mandar a dormir a la gente.
          - source: scene_3
            paragraph: 2
            text: |-
              Albert parece haber estado esperándonos, porque en cuanto nos vio salir del pasillo, se apresuró de inmediato en nuestra dirección. Ahora está plantado delante de nosotros, con aspecto cansado e irritable. Debe de haber pasado toda la noche guiando refugiados sin tener tiempo alguno para dormir.

              "El rey del subsuelo ha solicitado una reunión con ustedes", dice Albert, intentando actuar con cortesía, aunque se nota claramente por su tono de voz que se está forzando a hablar así. "Los espera en el salón del trono. Síganme."
        effects:
          - set:
              ac_b3_ch5_passed: 1
            achievement:
              id: ac_b3_ch5_passed
              title: Reto aceptado
