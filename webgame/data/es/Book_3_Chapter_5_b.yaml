      - condition: b3_ch5_follow = 2
        texts:
          - source: scene_text
            paragraph: 5
            text: |-
              "Tu rey puede esperar. Primero tenemos que encontrar a Kelrim."

              "No creo haberme explicado con suficiente claridad", dice Albert con tono amenazante. "No les estaba dando una opción. Van a seguirme al salón del trono."

              "¿O qué?", digo.

              Al oírme, Albert adopta una mirada furiosa y empieza a caminar hacia mí.

              "Eh, eh, no hace falta que te alteres tanto", dice Daren, colocándose delante de Albert para impedirle avanzar. "Aquí todos somos amigos, ¿verdad? O como mínimo estamos más o menos del mismo lado. Si la reunión de tu rey es tan importante que no puede retrasarse, entonces ya hablaré con Kelrim un poco más tarde. Supongo que está en el área de cuarentena, ¿no?"

              "El goblin está, efectivamente, en la zona de cuarentena", dice Albert. "Podrán hablar con él cuando regresen. Ahora síganme."

              "De acuerdo", dice Daren. "Guíanos."

              Albert asiente y luego empieza a caminar hacia el salón del trono, mientras el resto nos disponemos a seguirlo.

              Después de caminar un rato, por fin llegamos a la sala donde el rey nos esperaba y nos sentamos en las sillas vacías que hay frente al trono. Mientras ocupamos nuestros asientos, Albert pasa junto a nosotros y va a reunirse con Peter, que está de pie detrás del trono del rey. Parece que los dos guardias que suelen estar al lado del rey no han sido invitados esta vez. Aquí no hay nadie más aparte de nuestro grupo, el rey del subsuelo, Albert y Peter.
