              Pero ¿y si usara el código secreto que conozco por Melindra para potenciar temporalmente mi estadística de audición? ¿Bastaría con eso para oírlo moverse?

              Saco a toda prisa mi dispositivo de estadísticas del bolsillo y la ballesta de la mochila. Luego introduzco el código del que Melindra me habló y agarro de inmediato la ballesta con ambas manos, sabiendo que solo tengo unos segundos para reaccionar antes de que el aumento temporal desaparezca.

              Ahora sí puedo oír los pasos. Incluso con este nivel de estadística apenas son audibles, pero puedo oírlos. Necesito dispararle rápido, antes de que el efecto desaparezca. Pero no debo acertarle en un punto vital. Al fin y al cabo, él hizo todo lo posible por no matar a Hadrik.
          - source: scene_text_2
            paragraph: 10
            text: |-
              Calculo rápidamente su trayectoria a partir de los pocos pasos que consigo oír e intento anticipar lo mejor que puedo su recorrido cuando disparo mi virote de ballesta al aire vacío que tengo delante. Para mi sorpresa, en vez de acertarle o atravesar simplemente el aire, el virote de ballesta resuena contra una superficie metálica y cae al suelo. Al darse cuenta de que Albert había desviado el proyectil con su daga mientras seguía invisible, Hadrik no pierde tiempo y se lanza de inmediato hacia el asesino, agarrándose a algo que a primera vista no parece más que aire vacío.

              "¡Suéltame de una vez!", dice Albert, mientras va saliendo lentamente de la invisibilidad y nos revela que Hadrik, al parecer, lo había agarrado por la pierna. "¡Suéltame o te juro que esta vez sí te apuñalo de verdad!"

              "¡Oye, lo único que tienes que hacer es 'admitir la derrota' y te soltaré, amigo!", dice Hadrik con una sonrisa torcida. "No hace falta que te pongas tan nervioso. Al fin y al cabo, no es más que un combate amistoso."
          - source: scene_3
            paragraph: 8
            text: |-
              De repente, Peter extiende las manos hacia Hadrik y dispara desde las palmas un poderoso ataque de rayo. Mientras Hadrik recibe la descarga de la corriente eléctrica que le atraviesa el cuerpo, Albert intenta liberarse, pero el enano sigue aferrado a él con fuerza y no lo deja escapar. Parece que el asesino no se ve afectado en absoluto por el ataque eléctrico, aunque Hadrik lo siga sujetando por la pierna. ¿Significa eso que tiene algún tipo de objeto que le concede inmunidad a la electricidad?

              "¡Vas a... tener que... hacerlo mejor que eso!", le dice Hadrik a Peter mientras contiene el dolor de la corriente eléctrica. "¡Comparado con los ataques de la amiga elementalista de Kate, esto es un juego de niños!"

              "¿Pero qué demonios?", dice Daren mientras se gira hacia el rey del subsuelo. "¿Desde cuándo Peter forma parte de la prueba? ¡Nunca nos dijiste que nos lanzaría rayos y-- NGH!"

              Mientras Daren hablaba, Peter cambió de idea y decidió apuntarle a él en vez de a Hadrik, lanzándole un hechizo de rayo a Daren en cuanto le expuso la espalda.
