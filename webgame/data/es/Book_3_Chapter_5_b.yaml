            text: |-
              "¡Eh, basta ya!", dice Melindra apartando la mano, mientras veo que se ruboriza por primera vez desde que la conozco. "¡No hace falta que me des las gracias! Somos amigas, ¿recuerdas? Y además, ¡si apenas hice nada!"

              "¡Eso no es verdad!", dice Flower. "¡Nos ayudaste mucho! ¡Las dos! ¡Pétalo y yo quizá seguiríamos peleadas hoy si no fuera por ustedes! ¡Muchísimas gracias!"

              "¡Ejém!", oímos la voz de Hadrik, que está junto a los platos.

              Parece que, mientras el resto estábamos ocupados hablando, Hadrik ha usado un yesquero que llevaba en la mochila para encender todas las velas de la tarta.

              "Entonces, ¿vas a soplar estas velas o qué?", le pregunta Hadrik a Flower, mientras sostiene en las manos el plato con la tarta.

              "¡Sí!", dice Flower emocionada, corriendo hacia la tarta. "¡Sí, claro!"

              Entonces se inclina hacia delante y sopla las velas con todas sus fuerzas hasta que ninguna sigue encendida. Después de que todos le deseemos feliz cumpleaños, empieza a cortar trozos de tarta y a repartirlos entre todos los que la rodean.
          - source: scene_text_2
            paragraph: 23
            text: |-
              "¡Aquí tienes tu trozo, Kelrim!", dice Flower, ofreciéndole al goblin el penúltimo trozo de tarta.

              "Oh", dice Kelrim al coger el plato con el trozo de tarta. "¡Gracias!"

              "¡De nada!", dice Flower, mirando ahora al resto de nosotros y viendo que cada uno sostiene un plato en las manos. "Hmm... creo que sé qué hacer con este último trozo."

              Flower conjura un plato pequeño con cuchillo y tenedor y coloca sobre él el último trozo de tarta. Luego se acerca a la entrada del área de cuarentena y extiende las manos con el plato hacia Desmond, que sigue vigilando la puerta.

              "¡Es mi cumpleaños!", dice Flower sonriendo, mientras Desmond la mira con cara de confusión.

              "Oh...", dice Desmond, cogiendo el plato de sus manos. "Bueno, gracias, supongo..."

              Cuando Flower está regresando con nosotros, Desmond le grita en voz alta.

              "¡Eh!", dice Desmond. "¡Feliz cumpleaños!"

              "¡Gracias!", dice Flower, saludándolo feliz con la mano, antes de volver con nosotros.
          - source: scene_3
            paragraph: 14
            text: |-
              "Vale, ya he repartido todos los trozos de tarta", nos dice Flower. "¡Vámonos!"

              "¿Eh?", dice Hadrik, confundido. "Pero todavía no hemos terminado de comer."

              "¡Pueden terminar de comer mientras caminamos!", dice Flower. "¡Vamos! ¡No quiero que nadie de la zona de cuarentena muera esperando la cura por mi culpa!"

              "Vale, vale", dice Hadrik. "Entonces vayamos hacia el teletransportador."

              Hacemos lo que dice Flower y nos llevamos los platitos con nosotros mientras caminamos hacia la sala del teletransportador. Mientras avanzamos por el pasillo, Hadrik saca con la mano libre unas cuantas tazas diminutas de la mochila y las coloca sobre su plato, junto a la tarta. Luego saca una botella de cerveza enana y empieza a llenar las tazas.

              "No se puede tener un cumpleaños sin cerveza enana, ¿verdad?", dice Hadrik y, cuando termina de llenarlas, empieza a darnos una taza a cada uno. "Solo les he servido un par de sorbos a cada uno. ¡No querría que todos se emborracharan antes de una batalla! Daren, supongo que tú sigues sin beber durante el día, ¿no?"

              "¡Claro que no!", dice Daren.

              "¡Como siempre!", dice Hadrik, mientras me pasa una de las tazas.
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch05b_ending
  - name: b3_ch05b_ending
    texts:
      - source: scene_text
        paragraph: 34
        text: |-
          "Oye, entonces si ahora oficialmente tengo treinta años, ¿eso significa que puedo beber alcohol?", nos pregunta Flower emocionada.

          "¡No!", decimos todos al unísono.

          "Aww...", dice Flower.

          "No te pongas tan triste, Flower", dice Hadrik, mientras da un sorbo a su taza. "Puede que no siempre puedas tener todo lo que quieres en la vida, pero eso no significa que no puedas aprovechar al máximo lo que sí consigues. Por ejemplo, quizá no puedas beber con nosotros ahora, ¡pero mira cuántas rocas tienes por el suelo a tu alrededor! Mientras el resto estamos ocupados bebiendo, podrías estar recogiendo una roca rara que deje la colección de Melindra en ridículo."

          "Nah", le digo a Hadrik. "Las rocas de aquí no les servirán. La mitad son demasiado pequeñas, y la otra mitad o no tienen las tonalidades adecuadas o su superficie es demasiado lisa. No me extrañaría nada que Melindra ya hubiera cogido todas las rocas que considerarían valiosas la primera vez que atravesamos este túnel."
      - source: scene_text_2
        paragraph: 24
        text: |-
          Mientras todos los demás salvo Melindra me miran demasiado sorprendidos para hablar, Flower deja escapar un fuerte jadeo, cubriéndose la boca con las dos manos.

          "¡Mira tú por dónde!", dice Melindra, con una sonrisa de suficiencia, dándome una fuerte palmada en la espalda. "¡Parece que pasarnos todo el turno de guardia enseñándote sobre rocas no fue un esfuerzo desperdiciado, después de todo! ¡Todavía haremos de ti un coleccionista de rocas!"

          "Yo no contaría con eso", le digo.

          "¡Oh, por todos los dioses!", dice Flower. "Barry de verdad aprendió a distinguir qué tipos de rocas nos gusta coleccionar. No me lo puedo creer. ¡Este es el mejor cumpleaños de todos!"

          Acabamos pasando el resto del viaje hacia la sala del teletransportador comiendo tarta, bebiendo cerveza enana y ayudando a Flower a recoger unas cuantas rocas de la cueva que usaría para iniciar su propia colección. El tiempo que tuvimos para celebrar el cumpleaños de Flower fue breve, pero aun así parecía que lo había disfrutado de verdad, y nosotros también. Para cuando terminamos la tarta, todos nos sentíamos completamente renovados y estábamos listos para empezar el siguiente capítulo de nuestra aventura.
