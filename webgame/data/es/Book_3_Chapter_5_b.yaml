            text: |-
              "Un momento, por favor...", dice el rey. "Peter acaba de recordarme algo que creo que quizá quieran saber antes de volver a la superficie. En resumen, hemos notado que las bolas metálicas voladoras dejaron de patrullar los cielos en algún momento de la noche. La mayoría de ellas ahora se limitan a flotar sobre la ciudad, sin moverse en absoluto de sus posiciones. He oído por Breynan que Billy Bob puede haber tenido motivos para desactivar al Supervisor después de enterarse de su traición, pero no tenemos claro si la desactivación llegó a producirse de verdad o si simplemente está intentando reprogramarlo para que sea más obediente. Sea como sea, yo tendría cuidado si fuera ustedes. No hay manera de saber qué está pensando ese lessathi."

              "De acuerdo", dice Daren. "Intentaremos tener cuidado. ¡Adiós!"

              Entonces salimos por la puerta al túnel exterior y empezamos a dirigirnos a la sala de espera.
