        paragraph: 35
        text: |-
          El capítulo 6 del Libro 3 ya está disponible. Pulsa el botón de la parte inferior de esta página para continuar.

          ----------------------------------------

          Perdón por la larga espera. El retraso se debió a algunos problemas de salud que tuve allá por noviembre y diciembre, y también a la variación de rutas extremadamente complicada de este capítulo. (el capítulo tiene 10 logros en total)

          Pista: Algunos de los logros de este capítulo están en rutas que pueden variar dependiendo de cómo interactuaste con el Supervisor al final del capítulo 4 del libro 3. También habrá otros factores que influirán en la variación de las rutas, como si Rose sigue viva o no y si superaste o no la prueba del rey del subsuelo en el capítulo anterior.

          Además, recuerda que todos los capítulos de Magium pueden completarse sin invertir ningún punto en tus estadísticas, así que si te encuentras incapaz de superar una comprobación de estadísticas, intenta cargar tu último punto de control y rehacer algunas de tus elecciones anteriores hasta encontrar las rutas que no requieren estadísticas.

          ¡Buena suerte!
