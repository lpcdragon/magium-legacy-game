  - name: b3_ch05b_improved
    texts:
      - source: scene_text
        paragraph: 11
        text: |-
          "Eso es probablemente a lo que se reducirá, sí", dice el rey del subsuelo.

          "Entonces, ¿en qué va a consistir esta prueba?", dice Hadrik. "¿Tienen algunos luchadores realmente fuertes a los que quieren que derrotemos?"

          El rey, Albert y Peter intercambian unas miradas antes de que el rey vuelva a dirigirse a nosotros.

          "Sí, supongo que esa sería una forma de decirlo", dice el rey. "Pero antes, déjenme hacerles una pregunta. ¿No les ha parecido extraño que alguien tan precavido como yo suela celebrar estas reuniones con tan pocos hombres propios protegiéndome?"

          "Sí me pareció un poco raro, ahora que lo mencionas", dice Daren. "Y lo que me parece todavía más raro es que ahora tengas aún menos seguridad que en nuestras dos reuniones anteriores. Antes tenías dos guardias a tu lado, pero ahora solo están Peter y Albert. ¿Por qué evitaste traer a tus dos guardias habituales si sabías que la conversación de hoy podía desembocar en un enfrentamiento?"

          "Oh, la respuesta a esa pregunta es bastante simple", dice el rey. "Es porque estorbarían."

          De repente, una fuerza invisible desde arriba nos aplasta contra el suelo con tanta fuerza que las sillas de madera en las que estábamos sentados se rompen en pedazos. Intento levantarme, pero debido a la ridícula cantidad de presión que me empuja contra el suelo, apenas puedo mover un músculo. Al final consigo girar un poco la cabeza y me doy cuenta de que todos los demás, salvo Melindra y Leila, también están tumbados boca arriba como yo, incapaces de moverse. Mientras sigo allí tirado intentando entender qué ha pasado, oigo a Arraka estallar en carcajadas.
      - source: scene_text_2
        paragraph: 8
        text: |-
          "¡Ja, ja, ja, ja, ja, ja, ja!", se ríe Arraka. "Me preguntaba cuándo ibas a revelarles por fin tu poder oculto, pero esto ya es demasiado. Me estoy muriendo de risa. ¡Ja, ja, ja, ja, ja!"

          "¿Qué ocurre?", nos pregunta el rey del subsuelo, ignorando a Arraka. "La prueba ya ha comenzado. Esta es la misma técnica de manipulación de aura contra la que decían con tanto orgullo que podrían luchar en cuanto volvieran a encontrarse con el capitán de la guardia real. ¿Por qué no me muestran cuánto han mejorado de verdad?"

          ¿Es el rey quien nos está haciendo esto? ¡Ni siquiera sabía que fuera mago! Maldición, si al menos pudiera mover el brazo para lanzarle la daga o algo así...

          "Pueden rendirse en cualquier momento, ya lo saben", dice el rey del subsuelo cuando pasa un poco más de tiempo. "Solo admitan la derrota y los dejaré levantarse."
      - source: scene_3
        paragraph: 7
        text: |-
          "Desenredar...", dice Daren con una voz apenas audible mientras sigue aplastado contra el suelo.

          "¿Cómo dice?", pregunta el rey del subsuelo.

          "Desenredar... el flujo del aura... con la mente", dice Daren otra vez, ahora con más voz.

          Entonces consigue sacar la espada de la vaina, la usa para apuñalar el aire que tiene encima y luego hace un rápido tajo hacia la derecha. En cuanto lo hace, la fuerza invisible que nos mantenía inmovilizados desaparece por completo, y todos nos levantamos al instante adoptando posturas de combate.

          "Ahí lo tienes", dice Arraka. "¿Ves? Puedes hacerlo si lo intentas."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch05b_invisibility
  - name: b3_ch05b_invisibility
    texts:
      - source: scene_text
        paragraph: 12
        text: |-
          "¡Oh, ahora lo entiendo!", dice el rey mirando a Daren. "Hace un momento estabas imaginando que desatabas un nudo invisible con la espada, ¿verdad? ¡Nada mal! Muy bien, has superado la primera fase de la prueba. Albert, puedes comenzar la segunda fase cuando quieras."

          "Sí, mi rey", dice Albert, y unos segundos después desaparece por completo en el aire.

          "¿Qué ha hecho?...", dice Hadrik mirando por toda la sala, intentando averiguar adónde ha desaparecido Albert. "¿Era un hechizo de invisibilidad?"

          "Es más que un simple hechizo de invisibilidad", dice el rey. "Lo que Albert está usando ahora mismo es una habilidad que solo pueden aprender los asesinos más hábiles. Está ocultando por completo su presencia. No solo no podrán verlo, sino que tampoco podrán oírlo, olerlo ni siquiera sentir su aura. Desde su punto de vista, bien podría no estar en esta sala en absoluto."

          "Ah, entonces es parecido al hechizo de invisibilidad de Eiden", digo. "Arraka, supongo que tú sabes dónde está, ¿no?"
      - source: scene_text_2
        paragraph: 9
        text: |-
          "Claro que sé dónde está", dice Arraka. "Pero no voy a perder mi tiempo mostrándoles su posición solo por un simulacro de batalla de pacotilla. Si quieren superar esta prueba cutre, averígüenlo ustedes mismos."

          "Bueno, da igual dónde esté", dice Hadrik, "en algún momento tendrá que salir de la invisibilidad para atacarnos, así que me limitaré a esperar la ocasión adecuada y lo agarraré entonces. Todavía puedo agarrar a la gente, ¿no? No es como si fuera a atacarlo ni nada por el estilo, así que el hecho de que sea un lugareño no debería imp-- ¿¡pero qué demonios!?"

          De repente Hadrik intenta agarrar algo del aire vacío a su espalda, pero no ocurre nada. Cuando intento entender qué ha pasado, noto que la armadura de cuero de Hadrik ha sido atravesada por detrás y que una pequeña cantidad de sangre le cae por la parte alta de la espalda.

          "¡¿En serio acaba de atacarme mientras seguía invisible?!", dice Hadrik, mientras Peter se aparta ahora hacia una de las paredes para observar mejor la pelea. "¿Desde cuándo funcionan así los hechizos de invisibilidad?"

          "Ya te dije que es más que un simple hechizo", dice el rey. "Su respiración, su control del aura y su daga especial de empuñadura naranja desempeñan un papel a la hora de ayudarlo a enmascarar su presencia. Este es el resultado de años y años de arduo entrenamiento. Se están tomando a los asesinos demasiado a la ligera si creen que basta con esperar a que ataquen para luego contraatacar. Si esto no fuera un simulacro, una puñalada por la espalda como esa bien podría haberte matado, enano. Quizá deberías empezar a tomarte esta prueba un poco más en serio."
