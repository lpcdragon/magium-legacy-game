            paragraph: 22
            text: |-
              Mientras permanezco ahí pensando qué hacer a continuación, Hadrik decide que ya ha esperado bastante y opta por provocar a su oponente.

              "¿Qué pasa, Albert?", dice Hadrik. "¿Ya tienes miedo?"

              Poco después de que Hadrik termine de hablar, siento un dolor agudo en el lado derecho del abdomen y, al mirar hacia abajo, me doy cuenta de que ya estoy sangrando. Me aprieto rápido la herida con la mano para impedir que siga saliendo sangre, pero duele como el infierno y me resulta muy difícil concentrarme.

              "¡Ah, mierda!", dice Daren. "Barry, aguanta, ¡ya voy!"

              Antes siquiera de dar el primer paso hacia mí, oímos un gemido ahogado de Daren mientras se lleva la mano a la parte de atrás de la rodilla izquierda, que ahora empieza a sangrar.

              "¡¿Pero qué demonios, tío?!", le grita Daren a Albert. "Iba a curar-- NGH!"

              Mientras terminaba la frase, Daren recibió el impacto de un poderoso rayo que lo hizo caer de rodillas. Parece que el hechizo vino de Peter, que por fin decidió unirse a la batalla también.

              "¡Eh, eso no vale!", dice Hadrik. "¿Desde cuándo Peter forma parte de la prueba?"
