    routes:
      - condition: b3_ch5_brief = 0
        texts:
          - source: scene_text
            paragraph: 27
            text: |-
              "¿Por qué ninguno de ustedes atacó a Melindra ni a Leila durante la prueba?"

              "Bueno, Melindra los trajo aquí precisamente porque ella misma no podía dañar a los lugareños", dice el rey, "así que ponerla a prueba habría sido un poco inútil, ¿no creen? Y en cuanto a Leila, que yo sepa no es una de las personas implicadas en el asesinato del conde de Ollendor, así que nunca íbamos a echarla, sobre todo teniendo en cuenta que además es la hija del doctor Reidzek. Otra cuestión muy distinta es si quiere quedarse aquí o unirse a ustedes en la batalla contra el rey de Ollendor. En fin, creo que a estas alturas ya conocen el camino a la sala del teletransportador, así que espero que nos perdonen por no acompañarlos a la salida. ¡Les deseo suerte!"
          - source: scene_text_2
            paragraph: 17
            text: |-
              "Sí, sí", digo. "Adiós, supongo."

              Justo cuando estamos a punto de salir del salón del trono, oímos unos susurros detrás de nosotros y, poco después, el rey vuelve a llamarnos.
          - source: scene_text_2
            paragraph: 17
            text: |-
              "Sí, sí", digo. "Adiós, supongo."

              Justo cuando estamos a punto de salir del salón del trono, oímos unos susurros detrás de nosotros y, poco después, el rey vuelve a llamarnos.
            condition: b3_ch5_fight >= 4
          - source: scene_3
            paragraph: 11
            text: |-
              "Un momento, por favor...", dice el rey. "Peter acaba de recordarme algo que creo que quizá quieran saber antes de volver a la superficie. En resumen, hemos notado que las bolas metálicas voladoras dejaron de patrullar los cielos en algún momento de la noche. La mayoría de ellas ahora se limitan a flotar sobre la ciudad, sin moverse en absoluto de sus posiciones. He oído por Breynan que Billy Bob puede haber tenido motivos para desactivar al Supervisor después de enterarse de su traición, pero no tenemos claro si la desactivación llegó a producirse de verdad o si simplemente está intentando reprogramarlo para que sea más obediente. Sea como sea, yo tendría cuidado si fuera ustedes. No hay manera de saber qué está pensando ese lessathi."

              "De acuerdo", dice Daren. "Intentaremos tener cuidado. ¡Adiós!"

              Entonces salimos por la puerta al túnel exterior y empezamos a dirigirnos a la sala de espera.
            condition: b3_ch4_billy = 9
          - source: scene_3
            paragraph: 10
            text: |-
              "Un momento, por favor...", dice el rey. "Peter acaba de recordarme algo que creo que quizá quieran saber antes de volver a la superficie. En resumen, hemos notado que las bolas metálicas voladoras han dejado de seguir sus rutas de patrulla habituales desde ayer por la noche, y además se han estado comportando de forma bastante errática. Oí por Breynan que ustedes mataron a Billy Bob ayer, así que eso puede ser parte del motivo, pero yo tendría cuidado si fuera ustedes. Algo me dice que el Supervisor está planeando algo grande, y quizá no les convenga quedar atrapados en medio."

              "De acuerdo", dice Daren. "Intentaremos tener cuidado. ¡Adiós!"

              Entonces salimos por la puerta al túnel exterior y empezamos a dirigirnos a la sala de espera.
