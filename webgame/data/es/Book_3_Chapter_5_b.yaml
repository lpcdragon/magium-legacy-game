  - name: b3_ch05b_bypass
    texts:
      - source: scene_text
        paragraph: 6
        text: |-
          "S-sí, su alteza", dice el embajador con voz temblorosa. "Estoy seguro. Hemos traído de vuelta su cadáver como prueba. Nuestros magos hicieron todo lo posible por preservar el cuerpo con sus hechizos, pero ha pasado más de una semana desde su muerte, así que debo advertirle de que verlo resultará un poco impactante..."

          "¿Cómo ocurrió esto?", pregunta el rey con la misma voz calmada.

          "Fue... atacado en mitad de la calle por algunos participantes del torneo", dice el embajador. "El conde... luchó valientemente por su vida, pero los magos emplearon tácticas cobardes para--"

          "¿Algunos participantes del torneo hicieron esto?", pregunta el rey. "¿Cómo es posible? ¿Por qué no fueron enviados de vuelta a sus propios continentes por el hechizo que les impide dañar a la gente de Varathia?"

          "Sí, ¡a mí también me interesa saber eso!", dice Eiden. "Díganos, embajador, ¿cómo pudieron esos magos malvados sortear un hechizo de protección tan fiable e imposible de explotar?"

          Aunque no puedo verlos hablar, puedo imaginarme con facilidad la sonrisa burlona que Eiden debe de tener en la cara en este momento de la conversación, mientras mira al embajador con los ojos cerrados esperando una respuesta.

          "¿No piensa responderles, embajador?", dice el capitán de la guardia real tras una larga pausa.
      - source: scene_text_2
        paragraph: 5
        text: |-
          "Nosotros... no sabemos cómo esos magos pudieron saltarse el hechizo de protección", dice el embajador. "Sin embargo, tenemos motivos para creer que son capaces de dañar a cualquiera de los lugareños, sin ninguna restricción."

          "Y esos participantes del torneo... ¿fueron ejecutados por su crimen?", pregunta el rey, todavía con un tono calmado, aunque se nota que apenas se está conteniendo en este punto.

          "...No, su alteza", dice el embajador. "El rey gnomo se opuso firmemente a la idea de ejecutarlos. Al final... llegamos a un compromiso y los condenamos a luchar en uno de los mayores eventos de arena de toda la historia de nuestro continente, pero de algún modo sobrevivieron hasta el final incluso sin su magia, y así, según las leyes escritas en el tratado entre todos los reinos de Varathia, quedaron en libertad el mismo día en que--"

          "¡¿Los dejaste ir?!", grita el rey de Ollendor con tanta fuerza que casi tuve que taparme los oídos. "Gusano miserable, ¿me estás diciendo que los responsables de la muerte de mi hermano están deambulando libremente por Varathia en este mismo momento? Debería encadenarte y echártele a los perros por tu incompetencia, patética excusa de diplomático. ¿Para esto te envié a Thilias? ¿Para negociar con ese idiota de gnomo como si él y yo fuéramos iguales? ¿Por qué no le dijiste que habría guerra si no ejecutaba a esos magos en el acto? ¿Simplemente dejaste que te pasara por encima como si fueras uno de sus sirvientes insignificantes?"
      - source: scene_3
        paragraph: 4
        text: |-
          "Mi rey, sí intenté decirle que habría guerra, pero no quiso escuchar", dice el embajador con voz presa del pánico. "Y además, ¡Golmyck no fue el único que se puso del lado de los magos! De hecho, la principal razón por la que fueron enviados a la arena fue porque..."

          El embajador deja de hablar de repente, probablemente porque se dio cuenta de lo que muy probablemente le pasaría si delataba a Eiden delante del rey.

          "Porque...", vuelve a decir el embajador, ahora con una voz aún más temblorosa.

          Probablemente puedo imaginar lo que el embajador estaría pensando en esos momentos. ¿Sería mejor que lo matara el rey o Eiden? ¿Cuál de los dos tendría más probabilidades de perdonarle la vida? ¿Era siquiera la misericordia algo de lo que cualquiera de ellos fuera capaz?

          "Si me permite intervenir, su alteza", dice el capitán de la guardia real al darse cuenta de que el embajador no piensa terminar la frase. "Los intrusos de los que le hablé antes también eran participantes del torneo, y eran perfectamente capaces de atacarme, pese a ser yo ciudadano de Ollendor. El grupo con el que luchamos incluía a un mago de piel oscura con armadura completa y una cicatriz en forma de 'X' en la frente, una banshee que podía usar hielo como elemento mágico, una niña pequeña que podía lanzar magia de fuego y un gigante transformado para parecer un enano. ¿Le suena familiar alguna de estas descripciones, embajador?"

          "¡Son ellos!", grita el embajador. "¡Ellos fueron quienes mataron al conde! ¡Estoy seguro!"
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch05b_manhunt
  - name: b3_ch05b_manhunt
    texts:
      - source: scene_text
        paragraph: 7
        text: |-
          "Así que los responsables de la muerte de mi hermano estuvieron todo este tiempo a las puertas de mi casa...", dice el rey de Ollendor, controlando esta vez la ira en su voz. "Capitán, me dijo que sus hombres estuvieron a punto de apresar a algunos de esos intrusos antes de que se teletransportaran a último momento. ¿Cree que siguen dentro de la ciudad?"

          "Sin ninguna duda, su alteza", dice el capitán. "Biliborrathrathsarran nos aseguró que la barrera invisible que creó alrededor de la ciudad impide que nadie se teletransporte más allá de nuestras murallas usando hechizos convencionales. La única forma de entrar o salir de esta ciudad es a través de las puertas de la ciudad. Dondequiera que se escondan esos criminales, tiene que ser dentro de la ciudad."

          "Entonces está claro lo que debemos hacer...", dice el rey de Ollendor, y luego hace una breve pausa antes de volver a hablar. "Capitán, quiero que la guardia registre cada palmo de esta ciudad hasta que encuentren a esos magos, empezando ahora mismo. No me importa que ya casi haya anochecido. Despierte a todos y cada uno de los guardias que tenemos y dígales que miren en cada rincón y cada grieta hasta que no quede ni un solo lugar donde esconderse. Si nuestros ciudadanos se niegan a abrir las puertas de sus casas, den por hecho que están intentando dar cobijo a criminales y tendrán permiso para matarlos en el acto. Nadie podrá entrar ni salir de la ciudad hasta que todos los culpables de la muerte de mi hermano sean encontrados y ejecutados. Esta ciudad entra en cierre total y usted, embajador, va a supervisar toda esta operación junto con el capitán."

          "¿Yo?...", pregunta el embajador con un tono ligeramente temeroso.
      - source: scene_text_2
        paragraph: 6
        text: |-
          "Sí, embajador", dice el rey. "Lo pongo a cargo de ocuparse de estos criminales. Usted será personalmente responsable de los resultados de esta cacería. No creo que tenga que decirle qué le ocurrirá si vuelve a fracasar en capturar a estos magos por segunda vez. Estoy seguro de que su deseo de corregir sus errores bastará de sobra para motivarlo a hacer bien su trabajo esta vez."

          "Sí, su majestad", dice el embajador. "Por supuesto..."

          "Bien", dice el rey. "Entonces queda decidido. Espero que ninguno de los dos pensara dormir esta noche, porque sospecho que van a estar bastante ocupados durante un buen tiempo. Empiecen a hacer los preparativos necesarios. Quiero que ambos elaboren un plan de acción en menos de una hora. Ah, y capitán... ¿sería tan amable de enviar a uno de los sirvientes del palacio a traer aquí a Bilibo... Bilibo... al lessathi? Dígale que es un asunto muy urgente y que solicito su presencia inmediata en el castillo. Seguro que al menos uno de sus dispositivos nos será útil en una situación así."

          "Sí, mi rey", dice el capitán. "Enviaré a alguien a contactar con él de inmediato."
      - source: scene_3
        paragraph: 5
        text: |-
          "Me reuniré con ambos en mi salón del trono cuando terminen de planearlo todo", dice el rey. "No me hagan esperar."

          Entonces oímos unos pasos que se alejan de los dispositivos de grabación, a medida que el rey y, presumiblemente, el capitán de la guardia real salen de la sala. Una vez que ya no podemos oír los pasos, Eiden se dirige al embajador en voz baja.

          "¿No se alegra de que el capitán de la guardia lo interrumpiera antes, embajador?", dice Eiden. "Gracias a él no tuvo que contarles nuestro pequeño secreto, ¡y todos ustedes pudieron vivir para ver un día más! Asegúrese de aprovechar al máximo sus próximas horas, embajador. La vida es corta. ¡Nunca se sabe qué puede pasar!"

          "Sí... Creador", dice el embajador, con un tono cortés muy forzado. "Le agradezco su sabiduría."

          Entonces lo oímos salir de la sala, y un poco después hace lo mismo Eiden. Cuando la conversación termina, el rey del subsuelo vuelve a guardarse el cubo metálico en el bolsillo y luego nos mira para ver nuestra reacción.

          "¿Bien?", dice el rey del subsuelo unos segundos después. "¿Qué les pareció?"
