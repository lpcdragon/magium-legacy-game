  - name: b3_ch05b_birthday
    routes:
      - condition: b3_ch5_breath = 1
        texts:
          - source: scene_text
            paragraph: 31
            text: |-
              "Oye, seguro que podemos esperar dos minutos más a que recuperes el aliento", digo. "¿Verdad, Daren?"

              "¡Oh, sí, claro!", dice Daren. "No hay problema."

              Decidimos esperar unos minutos más hasta que Leila esté en condiciones de seguir, y luego empezamos a dirigirnos hacia la salida que lleva a la sala del teletransportador. Justo cuando estamos a punto de dar los primeros pasos, oímos la voz de Flower mientras sus ojos se vuelven de un azul brillante.

              "¡Esperen!", dice Illuna, y todos nos detenemos en seco.

              "¿Illuna?", dice Flower. "¿Por fin terminaste de practicar ese hechizo?"

              "No diría que esté completamente terminado, pero al menos conseguí poner bien todas las letras", dice Illuna. "Apártense. Voy a conjurar un montón de platos."

              Illuna hace entonces unos gestos con las manos, y un plato grande con una tarta de chocolate aparece en el suelo delante de nosotros, junto con varios platos pequeños que rodean al plato grande y que tienen cada uno un cuchillo y un tenedor encima. Hay un montón de velas apagadas sobre la tarta y, ahora que la miro mejor, veo que también hay unas letras escritas en la superficie con glaseado. Las letras forman la frase '¡Feliz cumpleaños, Flower!'.

              "No soy tan buena como Flower usando el hechizo de creación de comida, así que necesité un poco de tiempo para hacer todos los preparativos de este hechizo", dice Illuna, "pero creo que--"
          - source: scene_text_2
            paragraph: 20
            text: |-
              "¡¿Hoy es el cumpleaños de Flower?!", pregunta Kate, conmocionada, cuando se acerca y lee las letras de la tarta.

              "Sí, eso es lo que dicen las letras de la tarta", le responde Illuna con brusquedad.

              "Flower, ¿por qué no nos dijiste que hoy era tu cumpleaños?", dice Kate.

              "Bueno, todos tenían cosas más importantes de las que preocuparse, así que en realidad no quería... espera un momento...", dice Flower, acercándose a la tarta y empezando a contar una por una las velas con el dedo índice.

              Una vez termina de contarlas la primera vez, vuelve a hacerlo pero mucho más despacio, como si le costara creer lo que está viendo.

              "I-I-Illuna...", dice Flower con voz temblorosa. "¿H-hay exactamente treinta velas encima de esta tarta?"

              "Claro que sí", dice Illuna. "Todavía sabes contar, ¿no?"

              "¿E-eso significa lo que creo que significa?", dice Flower.

              "No, eso no significa que ahora te considere una adulta", dice Illuna. "Y por muchas veces que me llames Illuna o actúes como si fueras una persona mayor, eso no va a cambiar. Sin embargo... he pensado más en ello y he... llegado a la conclusión de que SÍ puedo hacer una concesión y aceptar llamarte una persona de treinta años, si de verdad significa tanto para ti... Todavía me llevará un poco de tiempo acostumbrarme a la idea, pero--"
          - source: scene_3
            paragraph: 13
            text: |-
              "¡Oh, Pétalo, muchas gracias!", dice Flower en voz muy alta, mientras ahora parece estar abrazándose a sí misma.

              "¿Podrías al menos controlar tu cuerpo cuando me abrazas dentro de tu mente?", dice Illuna. "¿O no te das cuenta de lo ridículas que nos vemos ahora mismo las dos?"

              "¡No me importa!", dice Flower, mientras sigue abrazándose a sí misma. "No quiero soltarte. No quiero volver a pelearme contigo. Por favor, por favor, prométeme que no volveremos a tener una pelea así en toda nuestra vida. Te juro que no volveré a intentar actuar como alguien que no soy. No volveré a llamarte Illuna. Solo di que nunca más tendremos que pasar por algo así."

              "Nosotras no estábamos pele--", empieza a decir Illuna, pero entonces se interrumpe. "Ugh... vale, me rindo... Tú ganas. Prometo que no volveremos a pelear. ¿Ya estás contenta?"

              "¡Sí!", dice Flower radiante, al tiempo que por fin deja de abrazarse a sí misma. "¡No tienes ni idea de cuánto! ¡Gracias!"

              Entonces se acerca a Melindra y a mí y nos agarra de las manos mientras nos sonríe.

              "¡Y gracias a ustedes dos también!", dice Flower. "¡Gracias por todo lo que hicieron por nosotras!"
        choices:
