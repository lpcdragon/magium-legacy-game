  - name: b3_ch05b_obscure
    routes:
      - condition: b3_ch5_fight < 4
        texts:
          - source: scene_text
            paragraph: 25
            text: |-
              "No pensarían de verdad que en la segunda fase de la prueba solo iban a pelear contra Albert, ¿verdad?", dice el rey del subsuelo. "Peter obviamente solo les estaba dando ventaja. Esa es la única razón por la que no los había atacado hasta ahora."

              Cuando Kate oye lo que ha dicho el rey, conjura de inmediato tres conos de hielo de la nada y los lanza contra él. Por desgracia, los carámbanos ni siquiera llegan a acercarse a su objetivo, porque todos son desviados con facilidad por una fuerza invisible.

              "¡Buen intento!", le dice el rey a Kate. "Pero me temo que no ha sido suficiente."

              Una vez más, el rey nos aplasta a todos contra el suelo con su fuerza invisible, salvo a Melindra y Leila, pero esta vez también usa su técnica de manipulación de aura para retorcer la muñeca derecha de Daren hasta que suelta la espada. Entonces hace que la espada flote hasta su propia posición y la agarra con la mano.

              "Como ya adivinó Kate, la segunda fase era en realidad una pelea contra Albert, Peter y contra mí", dice el rey del subsuelo. "No esperábamos realmente que ganaran, pero al menos queríamos ver cuánta pelea eran capaces de presentar. Por desgracia, aunque fueron capaces de deshacer mi técnica de manipulación de aura durante la primera fase, no lograron incapacitar a ninguno de nosotros en la segunda parte de la prueba, pese a que Peter y yo les dejamos tiempo de sobra para hacer algo con Albert. Como resultado, me apena decir que han fallado nuestra prueba."
          - source: scene_text_2
            paragraph: 15
            text: |-
              Entonces reduce la presión que hay sobre nosotros para que podamos volver a levantarnos.

              "Quiero verlos fuera de nuestra base en cuanto terminen de despedirse", dice el rey. "A menos, claro, que dijeran la verdad sobre seguir queriendo curar a los enfermos del área de cuarentena, en cuyo caso, por supuesto, se les permitirá volver una vez más."

              "No estaba mintiendo", dice Daren, mientras se lanza a sí mismo un hechizo de curación rápido y luego viene hacia mí para curarme también. "Curaré a toda esa gente."

              "Como quieras", dice el rey del subsuelo, y luego hace que la espada de Daren vuele de vuelta a su mano. "Aquí tienes tu espada. Más vale que la cuides mejor a partir de ahora. Lo que yo te recomendaría personalmente es que aprendas algo de manipulación de aura básica. Es fácil usarla sobre objetos que conoces muy bien, y te ayudaría a recuperar la espada cuando vuelvan a robártela. Sigue practicando hasta que consigas hacer que tu espada regrese a tu mano desde al menos cincuenta pies de distancia. Estoy seguro de que acabarás cogiéndole el truco."

              "Gracias por la sugerencia", dice Daren. "Veré si consigo entenderlo."
          - source: scene_3
            paragraph: 9
            text: |-
              "Si no le importa que se lo pregunte", dice Hadrik mirando al rey, "¿cómo demonios llegó a aprender una técnica tan poco común como la manipulación de aura? ¿Y cómo llegó a ser tan bueno en ella?"

              "Lo más probable es que la aprendiera del capitán de la guardia real", dice Kate. "Sus técnicas son demasiado parecidas para que sea una coincidencia."

              "Su amiga tiene razón", le dice el rey del subsuelo a Hadrik. "El actual capitán de la guardia y yo servimos ambos como guardias reales hace mucho tiempo, y fue él quien me enseñó todo lo que sé sobre manipulación de aura. Por desgracia, no pude convencerlo de que viniera conmigo y me ayudara a formar este reino subterráneo cuando dejé la guardia real hace unos veinticinco años, así que hoy en día no estamos precisamente en términos amistosos. Por lo que he oído, sigue buscando pupilos, pero hasta la fecha no ha conseguido encontrar a nadie con talento suficiente como para aprender algo más que las técnicas de manipulación de aura más básicas."

              "Bueno, desde luego eso son buenas noticias para nosotros", dice Daren. "No habríamos tenido ninguna oportunidad contra ellos si tuvieran todo un ejército de manipuladores de aura expertos de su lado."

              "En efecto", dice el rey del subsuelo. "Ahora bien, no quiero ser grosero, pero Albert, Peter y yo aún tenemos algunas cosas que discutir en privado sobre nuestra situación actual con los refugiados, así que si tienen alguna pregunta más, les agradecería que fueran breves."
