  - name: b3_ch05b_quality
    texts:
      - source: scene_text
        paragraph: 8
        text: |-
          "Creo que la calidad de la grabación era muy buena."

          "Yo también lo creo", dice el rey del subsuelo. "Hemos invertido mucho dinero en estos dispositivos y puedo decir que estoy muy satisfecho con ellos. Ahora bien, ¿hay quizá algo más que quieran decirnos aparte de eso?"

          "Escucha", dice Daren. "Sé que esta situación parece muy mala, pero te prometo que podemos arreglarla."

          "Hay gente muriendo ahí arriba, sanador", dice el rey del subsuelo con un tono grave. "Los guardias siguen sembrando el caos por la ciudad, derribando puertas y matando a cualquiera que se atreva a oponerse. Ya hemos evacuado de la superficie a las familias de todos los rebeldes, pero aquí abajo no hay ni espacio ni aire suficientes para dar cobijo a toda la población de la ciudad. Incluso ahora hay gente siendo asesinada en sus propias casas porque los hombres del rey siguen buscándolos a ustedes. Esa gente no habría muerto si ustedes no hubieran entrado en esta ciudad. Su sangre está en sus manos."

          "Lo entiendo y lo siento de verdad", dice Daren. "No sabía que esto fuera a llegar tan lejos. Pensábamos que tendríamos más tiempo antes de la llegada del embajador y no sopesamos del todo las consecuencias de nuestras acciones. Pero todavía podemos ayudar. Nuestros objetivos siguen siendo los mismos, y siguen alineándose con los tuyos. Si pudiéramos organizarnos para atacar juntos al rey de Ollendor, entonces quizá--"
      - source: scene_text_2
        paragraph: 7
        text: |-
          "No creo que comprendas del todo la posición en la que te encuentras, sanador con armadura", dice el rey del subsuelo. "La única razón por la que todavía no han sido capturados por la guardia real es que nosotros les estamos proporcionando refugio. Ahora bien, no me malinterpretes, sigo estando muy agradecido por tus esfuerzos por encontrar una cura para los enfermos de nuestra área de cuarentena. Por eso les he permitido dormir aquí, a pesar de lo que ha estado ocurriendo en la superficie. Sin embargo, no puedo sacrificar en conciencia la vida de la gente de arriba solo porque exista una pequeña posibilidad de que cures a algunos de nuestros habitantes terminales."

          "¡La posibilidad no es pequeña en absoluto!", dice Daren. "Kelrim y yo ya tenemos una pista muy buena sobre lo que puede estar causando la enfermedad, y si conseguimos las hierbas que necesitamos, ¡incluso podríamos curar a esa gente hoy mismo!"

          "Y cuando termines de curar a la gente de la zona de cuarentena, ¿qué harás?", dice el rey. "¿Te entregarás a la guardia real? ¿O quizá tienes algún otro plan para acabar con la violencia absurda que sigue produciéndose en la superficie?"

          "Haremos lo que vinimos a hacer", dice Daren. "Mataremos al rey de Ollendor y, cuando esté muerto, con suerte toda esta locura llegará a su fin."

          "¡¿Hablas de matar al rey cuando todos ustedes juntos ni siquiera pudieron derrotar a dos de sus guardias?!", grita Albert. "¿O acaso ya olvidaron que fuimos nosotros quienes arriesgamos la vida para salvarlos de Gontrok y del capitán de la guardia real ayer?"
      - source: scene_3
        paragraph: 6
        text: |-
          Arraka se echa a reír.

          "Ahí sí que te la ha dejado caer", nos dice.

          "¡Hemos mejorado desde entonces!", dice Hadrik. "¡Solo esta mañana practiqué estas técnicas nuevas de lucha que seguro que--"

          "¡Unos cuantos movimientos nuevos no van a ayudarlos cuando el capitán los inmovilice a todos contra el suelo con su aura!", dice Albert.

          "¿Quieres apostar?", dice Hadrik con una sonrisa.

          "Tú, pequeño arrogante--", empieza a decir Albert, pero el rey lo interrumpe.

          "Vamos, vamos, Albert", dice el rey del subsuelo, "no deberíamos apresurarnos a desestimar sus esfuerzos por mejorar solo porque sus afirmaciones parezcan poco realistas. Creo que lo justo sería darles una última oportunidad para demostrar lo que valen. Si fallan nuestra prueba, pondremos fin a nuestra alianza y les pediremos amablemente que abandonen nuestro territorio."

          "Si fallamos la prueba, ¿nos echas para siempre?", dice Daren. "¿Me estás diciendo que ni siquiera nos dejarás volver para curar a los enfermos del área de cuarentena?"

          "Si aun en esas circunstancias siguen queriendo salvar a esa gente, no les impediremos volver una última vez para curarlos", dice el rey. "Sin embargo, debes entender que incluso en tal caso les pediremos que se marchen en cuanto hayan terminado."

          "Bien", dice Daren. "Puedo aceptar eso. Así que supongo que si superamos esta prueba, lucharás junto a nosotros contra el rey de Ollendor."
