  - name: b3_ch05b_tension
    routes:
      - condition: b3_ch5_follow = 0
        texts:
          - source: scene_text
            paragraph: 3
            text: |-
              "Claro. Vamos."

              Albert asiente y luego empieza a caminar hacia el salón del trono, mientras el resto nos disponemos a seguirlo.

              Después de caminar un rato, por fin llegamos a la sala donde el rey nos esperaba y nos sentamos en las sillas vacías que hay frente al trono. Mientras ocupamos nuestros asientos, Albert pasa junto a nosotros y va a reunirse con Peter, que está de pie detrás del trono del rey. Parece que los dos guardias que suelen estar al lado del rey no han sido invitados esta vez. Aquí no hay nadie más aparte de nuestro grupo, el rey del subsuelo, Albert y Peter.
          - source: scene_text_2
            paragraph: 4
            text: |-
              Los tres parecen muy cansados, y el rey incluso tiene bolsas visibles bajo los ojos. Sin embargo, aparte del cansancio, también percibo cierta... tensión en el aire que no había sentido en nuestras dos reuniones anteriores. Espero que solo sea cosa mía.

              "Buenos días, amigos", dice el rey. "Espero que hayan dormido bien. Mis disculpas por llamarlos a otra reunión improvisada, pero hay bastantes cosas que necesito discutir con ustedes y que ya no pueden aplazarse más. Primero, permítanme darles un poco de contexto."

              Entonces saca de su bolsillo un pequeño cubo metálico, igual que el que utilizó en nuestra primera reunión con él, y lo sostiene delante de nosotros.

              "Su amigo Eiden volvió a esforzarse por atraer a cierta gente a una de las pocas salas del palacio en las que teníamos dispositivos de grabación", dice el rey. "Supongo que hizo esto porque quería que ustedes escucharan esta conversación, así que respetaré sus deseos. La discusión que están a punto de oír ocurrió ayer, poco después de que la mayoría de ustedes fueran teletransportados por error a las cavernas llenas de trampas bajo la ciudad. Creo que deberían poder reconocer con facilidad a la mayoría, si no a todos, los participantes de esta conversación. Empecemos."

              Luego pulsa uno de los botones del cubo metálico y empezamos a oír voces salir de él, igual que la última vez. En cuanto reconozco la primera voz, entiendo enseguida de qué va a tratar esta conversación.

              "¿Es esta la sala a la que querías traernos?...", dice el embajador de Ollendor.
          - source: scene_3
            paragraph: 3
            text: |-
              "Sí", dice Eiden. "Aquí deberíamos estar a salvo de cualquier espía que pueda estar intentando escuchar nuestra conversación."

              "¡Le aseguro, Creador, que no hay espías en este palacio!", dice el rey de Ollendor. "¡No habría manera de que atravesaran a nuestros guardias!"

              "No dudo de la competencia de sus guardias, gran rey", dice Eiden. "Pero aun así, es mejor prevenir que lamentar."

              "¿Qué era lo que quería hablarnos, embajador?", dice el capitán de la guardia real.

              "Yo... no sé por dónde empezar...", dice el embajador. "Es tan difícil poner esto en palabras. Mi rey, con el corazón encogido vengo a traerle la noticia de que su hermano... nuestro amado conde ha sido asesinado en Thilias."

              El rey no responde de ninguna manera al embajador, y ninguno de los demás tampoco. Tras más de cinco segundos de silencio, el embajador vuelve a hablar.

              "¿Mi rey?...", dice el embajador con una voz ligeramente intranquila.

              "Embajador, quiero que piense con muchísimo cuidado sus próximas palabras", dice el rey de Ollendor en un tono aterradoramente calmado. "Lo que va a decir a partir de ahora bien puede decidir si hoy vive o muere. Ante todo, quiero que me confirme una vez más lo que acaba de decirme. ¿Está absolutamente seguro de que mi hermano ha muerto?"
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch05b_bypass
      - condition: b3_ch5_follow = 1
        texts:
          - source: scene_text
            paragraph: 4
            text: |-
              "Psst, Albert. Se te olvidó ponerte la sonrisa falsa cuando nos pediste que fuéramos contigo."

              "No se me olvidó", dice Albert con un tono ácido. "No veo ninguna razón para sonreír en este momento, y menos a ti. Ahora bien, ¿piensan seguirme o no?"

              "Supongo que el rey del subsuelo no habría pedido una reunión tan temprano por la mañana si no fuera importante...", dice Daren. "De acuerdo, vamos a ver qué quiere. Guíanos."

              Albert asiente y luego empieza a caminar hacia el salón del trono, mientras el resto nos disponemos a seguirlo.

              Después de caminar un rato, por fin llegamos a la sala donde el rey nos esperaba y nos sentamos en las sillas vacías que hay frente al trono. Mientras ocupamos nuestros asientos, Albert pasa junto a nosotros y va a reunirse con Peter, que está de pie detrás del trono del rey. Parece que los dos guardias que suelen estar al lado del rey no han sido invitados esta vez. Aquí no hay nadie más aparte de nuestro grupo, el rey del subsuelo, Albert y Peter.
