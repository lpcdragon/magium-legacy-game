  - name: b3_ch05b_workshop
    texts:
      - source: scene_text
        paragraph: 30
        text: |-
          "Entonces, ¿alguno de ustedes sabía que el rey del subsuelo y Peter eran magos antes de que nos revelaran sus poderes hace un rato?", nos escribe Leila mientras seguimos avanzando por el pasillo. "La verdad es que me tomaron completamente por sorpresa..."

          "Se podía notar que eran magos si mirabas con atención sus auras, pero admito que el nivel de poder del rey me sorprendió un poco a mí también", dice Melindra. "No me di cuenta de que estaba suprimiendo la magia de su aura hasta ese punto."

          "Esperemos no tener que luchar contra ellos en el futuro", dice Daren. "Ya tenemos bastante con la guardia real y el resto del ejército del rey tal y como están las cosas."

          Unos minutos después, cuando llegamos a la sala de espera, Daren nos dice que lo esperemos mientras va a buscar a Kelrim al área de cuarentena. Mientras tanto, Leila aprovecha la ocasión para hacer una visita rápida al taller de su padre, para decirle adónde vamos. Mientras esperamos a que ambos regresen, Flower vuelve a intentar entablar conversación con Illuna, aunque parece que la siguen ignorando.
      - source: scene_text_2
        paragraph: 19
        text: |-
          "Illuna, ¿ya terminaste de aprender ese hechizo?", dice Flower. "Illuna, venga... necesito hablar contigo de algo. Es... es sobre la forma en que he estado actuando últimamente... Oye, ¿me estás escuchando?"

          "¿Todavía no has hablado con ella?", le pregunto a Flower.

          "¡No!", dice Flower. "¡No tengo ni idea de qué está haciendo! Incluso durante esa pelea con el rey del subsuelo y sus hombres apenas conseguí que me prestara atención."

          "¡Vale, ya encontré a Kelrim!", dice Daren en voz alta, mientras él y el goblin salen ahora de la zona de cuarentena. "¿Están todos listos para irnos?"

          "Seguimos esperando a Leila", le digo. "Fue a decirle a su padre que vamos al--"

          "¡Ya volví!", vemos la escritura de Leila delante de nosotros, mientras corre ahora hacia nosotros. "Ya podemos irnos."

          "¿Has venido corriendo todo este tiempo?", le pregunto a Leila cuando se acerca. "¡Estás empapada en sudor!"

          "Teniendo en cuenta que tengo la estadística de velocidad al máximo, lo lógico es usarla, ¿no?", escribe Leila, todavía respirando algo agitada. "No se preocupen por mí. Descansaré mientras caminamos."
