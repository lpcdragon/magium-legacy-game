              "Un momento, por favor...", dice el rey. "Peter acaba de recordarme algo que creo que quizá quieran saber antes de volver a la superficie. En resumen, hemos notado que las bolas metálicas voladoras han dejado de seguir sus rutas de patrulla habituales desde ayer por la noche, y además se han estado comportando de forma bastante errática. Oí por Breynan que ustedes mataron a Billy Bob ayer, así que eso puede ser parte del motivo, pero yo tendría cuidado si fuera ustedes. Algo me dice que el Supervisor está planeando algo grande, y quizá no les convenga quedar atrapados en medio."

              "De acuerdo", dice Daren. "Intentaremos tener cuidado. ¡Adiós!"

              Entonces salimos por la puerta al túnel exterior y empezamos a dirigirnos a la sala de espera.
