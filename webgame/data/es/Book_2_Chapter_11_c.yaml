            paragraph: 39
            text: |-
              "No vas a poder acabar con nosotros tan fácilmente", digo, mientras saco mi daga y empiezo a acercarme a ella.

              "No estoy aquí para jugar contigo, chico", dice la Arraka del pasado. "Si te quiero muerto... estás muerto."

              Entonces mueve la mano hacia mí, y puedo sentir cómo cada parte de mi cuerpo se seca rápidamente, mientras mi visión empieza a nublarse.

              "Ah, y olvídate de intentar usar tus poderes para salvarlo, tejedora del tiempo", oigo decir a Arraka, mientras voy perdiendo la consciencia lentamente. "Lo primero que hice cuando llegué fue lanzar un hechizo que impedía a todos en la zona usar poderes temporales. Tu amigo está muerto, y todos ustedes le seguirán pronto."

              Lo último que alcanzo a ver es a Arraka moviendo la mano hacia los demás también, y luego pierdo la consciencia por completo, mientras me convierto en polvo.
