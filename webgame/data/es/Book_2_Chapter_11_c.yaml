  - name: b2_ch11c_enough2
    texts:
      - source: scene_text
        paragraph: 18
        text: |-
          "Ahora quiero que te concentres mucho y que me digas si puedes oír unos ecos muy tenues procedentes de esa zona", dice el revenant. "Dado que este es el lugar donde el Dios del Tiempo estableció por primera vez su enlace con el Magium, debería haber una pequeña ruptura invisible en el espacio y el tiempo a través de la cual es posible oír nuestras propias voces provenientes del futuro. No podrás oírlas a menos que bloquees todos los demás sonidos con tu mente y te concentres exclusivamente en esas voces. ¿Puedes hacerlo?"

          "Lo intentaré", digo.

          "Tómate tu tiempo", dice el revenant. "La segunda fase del ritual aún tardará bastante en comenzar."

          Mientras bloqueo todos los sonidos a mi alrededor y me concentro solo en esta pequeña zona, como dijo el revenant, de repente me hago consciente de unas voces apenas audibles, que están hablando todas al mismo tiempo. Ya es bastante difícil oír las voces de por sí, pero para también poder distinguir lo que están diciendo voy a necesitar mucha más concentración que esta. Empiezo a concentrarme aún más, hasta que soy capaz de separar lo que está diciendo cada persona. Logro identificar algunos diálogos de este modo, pero al cabo de un rato me da un dolor de cabeza muy intenso y me veo obligado a parar.

          "¿Está todo bien?...", me pregunta el revenant al ver que me estoy masajeando la frente con los ojos cerrados.

          "Sí", digo, mientras sigo intentando recuperarme del dolor. "Solo me ha dado un dolor de cabeza repentino, eso es todo."
      - source: scene_text_2
        paragraph: 21
        text: |-
          "Si necesitaste concentrarte tanto que te dio un dolor de cabeza, no deberías forzarte más", dice el revenant. "No queremos que te desmayes de agotamiento en mitad del ritual. ¿Lograste averiguar algo útil?"

          "Sí", digo, mientras dejo de masajearme la frente lentamente y abro los ojos para mirarla. "Había una mujer cuya voz no logré reconocer, regodeándose de haber lanzado una especie de hechizo sobre ti para evitar que te concentraras en congelar el tiempo. Eso fue más o menos toda la información útil que me dio tiempo a recopilar antes de que me diera el dolor de cabeza."

          "¿Un hechizo que me impediría congelar el tiempo?", dice el revenant. "Debe ser un hechizo de mareo de algún tipo. ¿Alguien aquí sabe lanzar alguna protección mágica contra el mareo?"

          "Sí, yo", dice Illuna. "Sin embargo, debo advertirte de que este hechizo también te hará vulnerable a hechizos de sugestión. ¿Aun así quieres que te lo lance?"

          "Si es el único hechizo contra el mareo que tienes, entonces sí", dice el revenant. "Prefiero protegerme contra una amenaza conocida que preocuparme por una amenaza que quizá nunca llegue."

          "Muy bien", dice Illuna.
      - source: scene_3
        paragraph: 13
        text: |-
          Entonces apunta las palmas hacia ella y pronuncia un encantamiento, mientras una luz blanca rodea al revenant durante unos segundos, que luego desaparece casi tan rápido como apareció. Mientras tanto, yo me dirijo de vuelta al suelo, y en cuanto aterrizo, las corrientes de aire a mi alrededor dejan de moverse por completo.

          "Listo", dice Illuna. "He terminado de lanzar el hechizo."

          "Bueno, eso es... algo, supongo...", dice Daren. "Pero yo esperaba que pudiéramos encontrar alguna forma de evitar que la siguiente prueba ocurriera del todo, en vez de solo obtener una pequeña ventaja. Revenant, ¿no podrías intentar descongelar el tiempo del mundo que nos rodea y ver si eso cancela el ritual?"
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch11c_apologized
              b2_ch11_echoes: 1
  - name: b2_ch11c_maximum2
    texts:
      - source: scene_text
        paragraph: 17
        text: |-
          "Ahora Arraka va a necesitar usar su sentido mágico para ver si puede detectar unos ecos muy tenues procedentes de esa zona", dice el revenant. "Dado que este es el lugar donde el Dios del Tiempo estableció por primera vez su enlace con el Magium, debería haber una pequeña ruptura invisible en el espacio y el tiempo a través de la cual es posible oír nuestras propias voces provenientes del futuro. Si Arraka inspecciona la zona muy de cerca con su sentido mágico, quizá pueda distinguir algunas de las palabras que se están diciendo, aunque en realidad no las oiga."

          "¡Ah, ya lo capto!", dice Arraka. "Sí, puedo sentir la ruptura. Y definitivamente hay unos ecos tenues saliendo de ella. Pero están todos revueltos y son difíciles de distinguir unos de otros. Déjame ver si puedo descifrar algo."

          Todos esperamos en completo silencio para asegurarnos de no distraer a Arraka de lo que está haciendo. Al cabo de medio minuto aproximadamente, Arraka finalmente nos da su veredicto.
      - source: scene_text_2
        paragraph: 20
        text: |-
          "Sí, no hay forma de que pueda sacar ninguna información útil de ahí", dice Arraka. "Si hubiera solo unas pocas voces, quizá podría manejarlo, pero son demasiadas, hablando todas unas encima de otras constantemente, y son demasiado tenues para poder hacer distinciones claras usando solo mi sentido mágico."

          "¿Estás segura?", dice el revenant. "Todavía queda mucho tiempo antes de que comience la segunda fase del ritual, así que nada te impide intentarlo de nuevo."

          "No, no hay nada que pueda hacer por mucho que me esfuerce", dice Arraka. "Si quieren sabotear el ritual, busquen otra forma, porque esta no va a funcionar."

          "¿No hay alguna manera en la que podamos impedir que la siguiente prueba ocurra?", le pregunta Daren al revenant, mientras Flower desciende hacia el suelo. "¿No podrías intentar descongelar el tiempo del mundo que nos rodea y ver si eso cancela el ritual?"
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch11c_apologized
              b2_ch11_echoes: 0
  - name: b2_ch11c_apologized
    texts:
      - source: scene_text
        paragraph: 19
        text: |-
          "El hechizo que congeló el tiempo a nuestro alrededor fue lanzado sin mi control, así que no puedo deshacerlo", dice el revenant. "No estoy segura de si se dieron cuenta, pero el tiempo se congeló mucho antes de que yo apareciera frente a ustedes por primera vez. Hasta hace poco, su grupo también estuvo congelado en el tiempo junto con el resto del mundo, mientras yo estuve en ese trance, caminando durante días hasta lograr alcanzarlos. El tiempo solo se descongeló para ustedes cuando estuve lo bastante cerca para entregar la profecía."

          "Espera un momento", dice Arraka. "¿Estás diciendo que este es el primer grupo que has visitado desde que entraste en trance?"

          "Sí, estoy bastante segura de ello", dice el revenant. "¿Por qué lo preguntas?"

          "¡Ja, ja, ja, ja, ja!", se ríe Arraka de repente. "¡Así que me estás diciendo que estos inútiles son los que tienen más probabilidades de influir en la profecía! ¡Ja, ja, ja, ja, ja! Ya está. Recojan las maletas, todos. ¡Este continente está condenado!"

          "¿De qué está hablando?", le pregunta Daren a Melindra, mientras Arraka sigue riéndose de fondo. "¿Por qué seríamos nosotros los que tienen 'más probabilidades' de influir en la profecía? ¿Hay otros que vayan a recibir esta misma profecía después que nosotros?"
      - source: scene_text_2
        paragraph: 22
        text: |-
          "Sí", dice Melindra. "Ustedes no son más que el primer grupo en ser visitado por la tejedora del tiempo. Cuando el Dios del Tiempo termine con su ritual, volverán a quedar congelados en el tiempo y entonces la profecía y el ritual se repetirán también para otros grupos de personas. Y no solo eso, sino que esta misma profecía se les entregará a ustedes y a los demás al menos dos veces más antes de que los acontecimientos profetizados lleguen a ocurrir, para informarles de si se ha hecho algún progreso en su objetivo de evitar el desastre. La razón por la que Arraka dijo que ustedes eran los que más probabilidades tenían de influir en la profecía es que las tejedoras del tiempo siempre visitan a sus objetivos por orden de prioridad, lo que significa que su grupo puede tener el papel más decisivo en los acontecimientos que están por venir, dependiendo de las decisiones que tomen."

          "Mmm...", dice Daren. "No sé si debería sentirme tranquilizado por el hecho de que vamos a tener muchas posibilidades de detener la calamidad o preocupado porque probablemente estaremos justo en medio de ella cuando ocurra. En cualquier caso, ahora no deberíamos estar pensando en eso. En lo que deberíamos centrarnos es en intentar interrumpir el ritual. Si al revenant no se le ocurren más ideas, quizá haya llegado el momento de tomar cartas en el asunto. Hadrik, ven conmigo un segundo. Quiero que me ayudes a echar un vistazo alrededor y a ver si encontramos algo fuera de lo normal."

          "De acuerdo", dice Hadrik. "Guía el camino."

          "¿De verdad caminaste todo el camino hasta aquí sin descansar nada?", le pregunta Flower al revenant, preocupada, mientras Daren y Hadrik se alejan de nosotros. "¿No estás cansada? ¿No necesitas comer?"
      - source: scene_3
        paragraph: 14
        text: |-
          "Soy una no muerta, así que no necesito ni comida ni descanso", dice el revenant con su habitual tono inexpresivo. "Sin embargo, incluso si ese no fuera el caso, el trance en el que estuve antes me habría protegido de cualquier problema semejante. Cuando estás dentro del trance, tu cuerpo se coloca prácticamente en una especie de estasis mágica, y todas tus funciones corporales se suspenden hasta que sales de esa estasis. Si no fuera porque el Dios del Tiempo intervino en medio de estas profecías, probablemente ni siquiera recordaría que nada de esto ha sucedido."

          "Ah, ya veo...", dice Flower, sin saber bien cómo interpretar la completa falta de emoción del revenant al hablar con ella. "Eh, perdona por haberte molestado..."

          El revenant mira a Flower, sorprendida, aparentemente incapaz de comprender por qué se ha disculpado de repente. Por un segundo pareció como si estuviera a punto de preguntarle qué pasaba, pero al final decidió no hacerlo.
    choices:
      - position: 1
        text: Intentar explicarle a Flower que el revenant no estaba molesta con ella
        effects:
          - set:
              current_scene: b2_ch11c_explain
              b2_ch11_explain: 1
      - position: 2
        text: Dejar que arreglen sus problemas por su cuenta
        effects:
