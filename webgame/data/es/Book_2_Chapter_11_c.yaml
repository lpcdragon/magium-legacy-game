  - name: b2_ch11c_enough
    texts:
      - source: scene_text
        paragraph: 16
        text: |-
          "Sí, esa fue la razón", dice el revenant. "Como dije antes, el hechizo que me trajo a este mundo fue diseñado para implantar una gran cantidad de conocimiento del Dios de la Muerte en mi mente, y entre ese conocimiento también había algo de información sobre los dispositivos de estadísticas y cómo funcionan. En resumen, la potenciación temporal de estadística que se activa con tu código secreto depende enteramente de un breve temporizador que no se activará mientras el mundo esté congelado en el tiempo. Sin embargo, como lograste activarlo justo antes de que el tiempo se congelara, el temporizador también se congeló, otorgándote así una mayor capacidad para oír durante toda la duración de este hechizo que congela el tiempo."

          "Entonces, ¿cuando me llamaste, el tiempo aún no estaba congelado?", digo.

          "No", dice el revenant. "Pero sabía que se congelaría en cuestión de segundos, porque se me dispararon varios hechizos de congelación del tiempo sin mi control justo antes de que me metieran en trance. Algo similar también ocurrió antes de la vez anterior que te llamé, excepto que entonces el tiempo solo se congeló una vez, sin mi control, y no me metieron en trance durante ese tiempo, así que supe que era solo una pequeña prueba, antes del evento principal. Por eso te pedí que mantuvieras abierto tu canal de comunicación, para poder decirte después que activaras el código justo antes de que empezara la profecía. Pero tener el código activado no es suficiente. Para que mi plan funcione, necesitarías tener cuatro puntos o más ya invertidos en audición, para que junto con los puntos extra ofrecidos por el código secreto alcanzaras un nivel de siete en esa estadística. ¿Tienes suficientes puntos?"
      - source: scene_text_2
        paragraph: 17
        text: |-
          "Sí, ya tengo mi estadística de audición al máximo", digo. "¿Para qué la necesito?"

          "Primero, vas a necesitar acercarte todo lo posible al lugar donde el Dios del Tiempo se materializó por primera vez en este mundo", dice el revenant.

          "Ah, vale", digo. "Melindra, ¿puedes--"

          Antes siquiera de que pudiera empezar mi frase, Melindra ya había lanzado sus corrientes de aire mágicas sobre mí, que ahora me están elevando lentamente por el aire.

          "Sí, eso era lo que iba a pedir", digo. "¡Gracias!"

          Entonces levanto los brazos en el aire y vuelo hasta donde el Dios del Tiempo estaba flotando cuando hizo su primera aparición.

          "Muy bien, ya estoy aquí", digo, mientras me detengo en el aire y me giro hacia el revenant. "¿Y ahora qué?"
