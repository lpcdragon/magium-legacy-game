  - name: b2_ch11c_unleashes
    routes:
      - condition: ch11_saved_rose = 1
        texts:
          - source: scene_text
            paragraph: 27
            text: |-
              Antes de que Dave el Degollador tenga tiempo de decir nada más, Kate desata todos sus conos de hielo, y dos de ellos le atraviesan la cabeza, matándolo al instante.

              "Hasta ahí llegó el degollador, supongo", dice Melindra, mientras deja caer su cadáver al suelo.

              "Y buen viaje, digo yo", dice Hadrik. "Ya hemos perdido bastante tiempo con él. Volvamos al trabajo. No sabemos cuánto tiempo nos queda."

              Después de terminar con Dave el Degollador, todos volvimos a lo que estábamos haciendo inicialmente, pero poco después, la zona a nuestro alrededor se cubrió de una luz blanca brillante de nuevo, y esta vez, pude sentir que todo mi cuerpo estaba siendo transportado a otro lugar, no solo mi consciencia.
          - source: scene_text_2
            paragraph: 29
            text: |-
              Cuando la luz se desvanece, todos nos encontramos en medio de una ciudad que es... inusual, por decir lo menos. Lo primero que me llama la atención es que hay una torre negra muy grande en cada esquina de la ciudad, y en lo alto de cada una de estas cuatro torres, hay una cantidad increíble de energía mágica, que puede verse incluso a simple vista. La energía tiene un color púrpura, y se mueve salvajemente en todas direcciones, como si estuviera intentando escapar de su prisión. A cada lado de estas torres de trescientos metros de altura, hay grandes plataformas flotantes, que suben y bajan a una velocidad lenta, y parecen estar transportando a cientos de personas hacia los niveles de las torres a los que necesitan llegar.

              Dejando a un lado estos extraños y altos edificios, lo que es aún más peculiar es lo que está ocurriendo directamente sobre nosotros. En este momento, hay cientos de carruajes metálicos sin caballos, volando por el aire, con gente dentro. Mientras estos carruajes vuelan de un lado a otro, hay grandes pantallas holográficas flotando sobre nosotros, mostrando a un hombre que está retransmitiendo el mismo mensaje, una y otra vez, en la lengua común. Las pantallas holográficas se parecen exactamente a las que fueron creadas por el dispositivo de ilusión de Golmyck, cuando anunció nuestros primeros objetivos. El mensaje que se repite constantemente es: 'Todos los ciudadanos no lessathi deben presentarse en la zona de reserva militar inmediatamente. Estamos bajo ataque. Repito, ¡estamos bajo ataque!'.
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch11c_frenzy
      - condition: ch11_saved_rose = 0
        texts:
          - source: scene_text
            paragraph: 28
            text: |-
              "Espera", dice el revenant. "No lo mates."

              "¿Por qué no?", dice Kate.

              "Podría ser útil en el próximo ritual", dice el revenant. "Déjame hacerle unas preguntas."

              "Haz tus preguntas", dice Kate, "pero no garantizo que lo deje vivo después. Al fin y al cabo, podría hacer más daño que bien en el ritual."

              El revenant asiente, y se acerca al degollador, para poder mirarle directamente a los ojos.

              "Dime, degollador", dice el revenant, "¿por qué estabas siguiendo a este grupo, invisible? ¿Alguien te envió aquí para espiarlos?"

              "Dave el Degollador no trabaja para nadie", dice el degollador, con asco. "Los estaba siguiendo invisible, ¡porque no logré acercarme lo suficiente a su campamento esta mañana para degollarlos mientras dormían!"
          - source: scene_text_2
            paragraph: 30
            text: |-
              "¿Por qué no?", pregunta el revenant.

              "¡Porque el elixir que me tomé no enmascaró mi aura completamente, así que no podía arriesgarme!", dice Dave el Degollador. "No pensé que estos bastardos tendrían guardias alrededor de sus tiendas a todas horas. Como ya había desperdiciado mi elixir para nada, pensé que al menos podría seguirlos hasta que se les pasara el efecto, con la esperanza de que bajaran la guardia en algún momento."

              "Pero ¿cómo los encontraste en primer lugar?", dice el revenant. "¿Quién te guio hasta su campamento?"

              "Mujer, ¿estás tonta?", dice Dave el Degollador. "Ya te dije que no trabajo para nadie. Los encontré por accidente. Nadie me guio allí. Ahora, dile a tu amiga la ramera que me baje, para que podamos tener una pelea de verd--"

              Justo cuando el degollador estaba terminando su frase, una luz blanca brillante cubre nuestra zona, y esta vez, puedo sentir que todo mi cuerpo está siendo transportado a otro lugar, en vez de solo mi consciencia.
