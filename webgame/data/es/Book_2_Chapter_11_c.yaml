  - name: b2_ch11c_encourage
    routes:
      - condition: b2_ch11_encourage = 1
        texts:
          - source: scene_text
            paragraph: 3
            text: |-
              "No le hagas caso a Arraka", le digo a Rose. "Estoy seguro de que dominarás tus poderes enseguida con suficiente práctica."

              "Gracias, Barry", dice Rose, sonriendo. "¡Me esforzaré al máximo para que todos se sientan orgullosos de mí!"

              "No es por interrumpir ni nada", dice Melindra, "pero ¿no habían dicho que iban a intentar sabotear el ritual? Porque, si eso es lo que piensan hacer, más vale que se den un poco de prisa. No sabemos cuánto tardará en comenzar la siguiente fase."

              "Tienes razón", dice Daren. "Y creo que se me puede haber ocurrido una idea. Rose, ¿podrías intentar descongelar el tiempo a nuestro alrededor usando tus poderes? Quizá baste para cancelar el ritual."

              "No sé si puedo, pero lo intentaré", dice Rose.

              Entonces cierra los ojos y trata de concentrarse, mientras el resto guardamos un silencio absoluto para no distraerla. Al cabo de un rato, Rose desaparece de donde está y reaparece varios metros a la izquierda de su posición original. Luego vuelve a desaparecer y a reaparecer unas cuantas veces más, en distintos lugares, hasta que al final Daren decide romper el silencio.
          - source: scene_text_2
            paragraph: 4
            text: |-
              "Rose, ¿qué estás haciendo?...", pregunta Daren.

              "Estoy intentando averiguar cómo funciona esto", dice Rose. "Parece que puedo congelarlos en el tiempo cuando quiera, y el hechizo no se deshace por mucho que me aleje de mi posición original. También puedo descongelarlos a voluntad, pero por muchas veces que lo haga, el resto del mundo sigue congelado. No lo entiendo. Es como si el mundo que nos rodea hubiera sido congelado de una manera completamente distinta a usar mis poderes."

              "Fue congelado con tus poderes", dice Melindra. "Pero, como no lo hiciste de forma consciente, no tienes control sobre ello. La razón por la que el tiempo se congeló fue para que pudieras entregar tu profecía. ¿No recuerdas lo que pasó después de que te metieran en trance?"

              "Sí... tengo algunos recuerdos vagos", dice Rose. "Creo que lo que pasó es que el tiempo se congeló para todo el mundo, incluidos ustedes, justo después de que me metieran en trance, y entonces caminé hasta aquí sin detenerme durante varios días. No fue hasta llegar a este lugar cuando por fin descongelé el tiempo para todos ustedes, para poder contarles la profecía."

              "Exactamente", dice Melindra. "Todo forma parte de cómo funcionan estas profecías. Puede que el Dios del Tiempo haya encontrado una forma de colar sus propios rituales en medio del proceso, pero eso no significa que puedas usar tus poderes para descongelar el tiempo por completo."

              "Espera un momento", dice Arraka. "Rose, ¿has dicho antes que este fue el primer grupo que visitaste después de que te metieran en trance?..."

              "Sí, estoy segura", dice Rose. "¿Por qué? ¿Eso es raro?"
          - source: scene_3
            paragraph: 3
            text: |-
              "¡Ja, ja, ja, ja, ja!", se ríe Arraka de repente. "¡Así que me estás diciendo que estos inútiles son los que tienen más probabilidades de influir en la profecía! ¡Ja, ja, ja, ja, ja! Ya está. Recojan las maletas, todos. ¡Este continente está condenado!"

              "¿De qué está hablando?", le pregunta Daren a Melindra, mientras Arraka sigue riéndose de fondo. "¿Por qué seríamos nosotros los que tienen 'más probabilidades' de influir en la profecía? ¿Hay otros que vayan a recibir esta misma profecía después que nosotros?"

              "Sí", dice Melindra. "Ustedes no son más que el primer grupo en ser visitado por la tejedora del tiempo. Cuando el Dios del Tiempo termine con su ritual, volverán a quedar congelados en el tiempo y entonces la profecía y el ritual se repetirán también para otros grupos de personas. Y no solo eso, sino que esta misma profecía se les entregará a ustedes y a los demás al menos dos veces más antes de que los acontecimientos profetizados lleguen a ocurrir, para informarles de si se ha hecho algún progreso en su objetivo de evitar el desastre. La razón por la que Arraka dijo que ustedes eran los que más probabilidades tenían de influir en la profecía es que las tejedoras del tiempo siempre visitan a sus objetivos por orden de prioridad, lo que significa que su grupo puede tener el papel más decisivo en los acontecimientos que están por venir, dependiendo de las decisiones que tomen."
        effects:
          - set:
              ac_b2_ch11_supportive: 1
            achievement:
              id: ac_b2_ch11_supportive
              title: Amigo comprensivo
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch11c_practice
      - condition: b2_ch11_encourage = 0
        texts:
          - source: scene_text
            paragraph: 4
            text: |-
              "De verdad creo que deberías pensártelo un poco más antes de elegir este camino", le digo a Rose. "Aunque llegues a dominar por completo tus poderes del tiempo, seguirás poniéndote en muchísimo peligro si sigues adelante con este plan."

              "Esperaba que en esto fueras a ponerte de mi lado, Barry", dice Rose, con expresión algo decepcionada. "Pero agradezco que estés intentando cuidar de mí. No te preocupes, procuraré no hacer nada demasiado imprudente."

              "No es por interrumpir ni nada", dice Melindra, "pero ¿no habían dicho que iban a intentar sabotear el ritual? Porque, si eso es lo que piensan hacer, más vale que se den un poco de prisa. No sabemos cuánto tardará en comenzar la siguiente fase."

              "Tienes razón", dice Daren. "Y creo que se me puede haber ocurrido una idea. Rose, ¿podrías intentar descongelar el tiempo a nuestro alrededor usando tus poderes? Quizá baste para cancelar el ritual."

              "No sé si puedo, pero lo intentaré", dice Rose.

              Entonces cierra los ojos y trata de concentrarse, mientras el resto guardamos un silencio absoluto para no distraerla. Al cabo de un rato, Rose desaparece de donde está y reaparece varios metros a la izquierda de su posición original. Luego vuelve a desaparecer y a reaparecer unas cuantas veces más, en distintos lugares, hasta que al final Daren decide romper el silencio.
