  - name: b2_ch11c_practice
    texts:
      - source: scene_text
        paragraph: 6
        text: |-
          "Mmm...", dice Daren. "No sé si debería sentirme tranquilizado por el hecho de que vamos a tener muchas posibilidades de detener la calamidad o preocupado porque probablemente estaremos justo en medio de ella cuando ocurra. En cualquier caso, ahora no deberíamos estar pensando en eso. En lo que deberíamos centrarnos es en intentar interrumpir el ritual. Si Rose no puede hacerlo con sus poderes, quizá haya llegado el momento de tomar cartas en el asunto. Hadrik, ven conmigo un segundo. Quiero que me ayudes a echar un vistazo alrededor y a ver si encontramos algo fuera de lo normal."

          "De acuerdo", dice Hadrik. "Guía el camino."

          "¿De verdad caminaste todo el camino hasta aquí sin descansar nada?", le pregunta Flower a Rose, preocupada, mientras Daren y Hadrik se alejan de nosotros. "¿No estás cansada? ¿No necesitas comer?"

          "No, estoy bien... por algún motivo", dice Rose. "No tengo nada de hambre y tampoco estoy cansada. De hecho, me siento tan descansada como antes de salir de casa. Me pregunto si será por el trance..."

          "Sí, es por el trance", dice Arraka. "Básicamente te metieron en una estasis mágica durante todo el trayecto para que no necesitaras descansar, ni comida, ni agua. Si el Dios del Tiempo no hubiera intervenido para sacarte prematuramente del trance, probablemente ni siquiera recordarías que nada de esto ha sucedido."

          "Ah, ya veo", dice Rose. "Eso lo explica, entonces."

          Hace una pausa.
      - source: scene_text_2
        paragraph: 5
        text: |-
          "Ehm, Arraka", continúa Rose, "no sabrás por casualidad si las tejedoras del tiempo tenían algún otro poder aparte de congelar y revertir el tiempo, ¿verdad?"

          "Así que quieres practicar, ¿eh?", dice Arraka. "Bueno, estoy bastante segura de que también deberías tener la capacidad de ralentizar el tiempo. Desde nuestra perspectiva, parecería que te estuvieras moviendo realmente deprisa. La ventaja de ralentizar el tiempo es que también puedes interactuar con otras personas mientras lo haces. Creo que quizá también puedas hacer que el tiempo vuelva a fluir con normalidad para otras personas, del mismo modo que puedes descongelarlas, siempre que estén lo bastante cerca de ti, pero no tengo del todo claro si eso forma parte de los poderes de una tejedora del tiempo o si es simplemente un hechizo muy complejo. Aparte de esos poderes, no diría que conozco ningún otro."

          "¡Gracias!", dice Rose. "No consigo revertir el tiempo en absoluto, pero quizá encuentre la forma de usar ese hechizo para ralentizar el tiempo que has mencionado. Voy a probarlo."

          No mucho después de su conversación con Arraka, Rose empieza a poner a prueba sus poderes, mientras Kate y Flower la ayudan dándole algunas indicaciones. Mientras tanto, Daren y Hadrik siguen aparentemente recorriendo la zona, intentando ver si pueden encontrar algo raro que les sirva para detectar un punto débil en el ritual. Mientras miro a mi alrededor para ver qué está haciendo todo el mundo, de pronto me doy cuenta de que Leila no ha participado en ninguna de nuestras conversaciones hasta ahora y apenas se ha movido de su sitio desde que empezó el ritual. En este momento, lo único que hace es mirar al suelo, evitando cruzar la mirada con cualquiera de nosotros.
      - source: scene_3
        paragraph: 4
        text: |-
          ¿Será que todavía no ha logrado superar lo que pasó en su primera prueba? Ahora que lo pienso, ella también estaba en el Faro, así que no sería tan raro que le hubiera tocado un ritual parecido al de Kate. Eso no es nada bueno... Puede que Kate sea lo bastante fuerte para soportar el trauma emocional provocado por una prueba así, pero ¿y Leila? Tal vez debería ir a hablar con ella y ver cómo lo está llevando.

          "Leila, ¿está todo bien?", digo, acercándome un poco a ella.

          Leila se sorprende al oír mi voz. Creo que se ha acostumbrado a que la ignoren en situaciones como esta debido a su carácter callado y a lo poco que suele llamar la atención.

          Levanta la cabeza para mirarme a los ojos y luego asiente ligeramente para responder a mi pregunta.

          "Estoy bien", escribe Leila. "Solo un poco afectada, eso es todo."

          "¿Quieres hablar de ello?...", le pregunto.

          De nuevo, Leila me mira sorprendida durante un segundo, pero luego sonríe levemente mientras escribe un nuevo texto en el aire frente a mí.

          "Ahora no", escribe Leila. "Pero quizá más tarde..."
