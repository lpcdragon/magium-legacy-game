  - name: b2_ch11c_against
    texts:
      - source: scene_text
        paragraph: 42
        text: |-
          "En realidad, nos enviaron aquí en contra de nuestra voluntad."

          "Explícate", dice Tyrath.

          "Bueno, ¿sabes algo sobre el Dios del Tiempo y sus rituales?", digo.

          "Tengo muy poco interés tanto en los dioses como en sus ocupaciones", dice Tyrath. "¿Debo suponer que este 'Dios del Tiempo' es quien os envió aquí en contra de vuestra voluntad?"

          "Sí, exacto", digo.

          "¿Y ahora buscáis una forma de volver?", dice Tyrath.

          "Eh... diría que en este momento, nuestra mayor prioridad es probablemente nuestra supervivencia", digo.

          "Entonces vuestra mejor opción sería cooperar con nosotros", dice Tyrath. "Si compartierais con nosotros la información que conocéis del futuro, estaríamos mucho mejor preparados para luchar contra Arraka."

          "¿Qué tipo de información buscáis, exactamente?", le pregunto.

          "Tengo un plan, que bien podría ser nuestra única posibilidad real de derrotar a Arraka para siempre", dice Tyrath. "Lo he estado discutiendo con las tropas de élite de hechiceros desde ayer, después de que advertí al alto consejo por primera vez de que este lugar podría ser el objetivo de Arraka pronto. Dado que venís del futuro, me gustaría saber si alguna vez habéis oído hablar de que un plan así fue usado en el pasado, y si tuvo éxito. En resumen, hay una gran montaña, no lejos de esta zona, que podríamos usar para--"
      - source: scene_text_2
        paragraph: 41
        text: |-
          "Voy a pararte ahí mismo, Tyrath", dice Arraka. "Primero, la buena noticia es que en nuestro pasado, sí usasteis este plan conmigo, y lograsteis atraparme con éxito en esa montaña durante unos cuantos miles de años. Ahora, la mala noticia es que puede que yo haya... accidentalmente contado a la Arraka de vuestro mundo todo sobre vuestro plan, lo que significa que podéis descartar la idea por completo, porque ahora es completamente inútil."

          "¡¿HAS HECHO QUÉ?!", grita Tyrath en voz alta, mientras la magma de sus escamas erupciona como un volcán.

          Antes de que Arraka tenga oportunidad de responderle, una luz blanca llena de repente toda nuestra zona, y una vez más, somos transportados de vuelta a nuestro propio mundo, que aparentemente sigue congelado en el tiempo. Mientras todos miramos el bosque a nuestro alrededor, el Dios del Tiempo se materializa de la nada una vez más, flotando a unos metros sobre el suelo, frente a nosotros.

          "Me temo que tendremos que continuar este ritual en otra ocasión", dice el Dios del Tiempo, "ya que he alcanzado mi límite de cuánta energía puedo reunir de un solo grupo. No se preocupen, tendrán la oportunidad de continuar esta prueba donde la dejaron, en cuanto la tejedora del tiempo sea enviada a darles la profecía de nuevo. Me gustaría decir que todos se han desempeñado mucho mejor de lo que esperaba. Tienen mis más sinceras felicitaciones."
      - source: scene_3
        paragraph: 26
        text: |-
          "¡Ja!", dice Arraka. "Les dije, perdedores, que le estaban dando exactamente lo que él--"

          "Y tu desempeño fue el más destacado de todos, Arraka", la interrumpe el Dios del Tiempo.

          "¿Qué... acabas de decir?", pregunta Arraka.

          "Ni siquiera me habría atrevido a imaginar que contribuirías a mi ritual por tu propia voluntad", dice el Dios del Tiempo. "Sin embargo, tu sentimiento de puro terror ante la idea de ser completamente borrada de la existencia por el Magium era exactamente lo que necesitaba para que mi ritual fuera un éxito total. Estoy deseando ver lo que tendrás preparado para mí en las próximas pruebas."

          "Hijo de--", empieza a decir Arraka, pero el Dios del Tiempo la interrumpe.

          "Ahora, antes de irme, les pediré a todos que se arrodillen ante mí una última vez", dice el Dios del Tiempo.
