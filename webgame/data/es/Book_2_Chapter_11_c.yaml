              current_scene: b2_ch11c_slowing
  - name: b2_ch11c_slowing
    routes:
      - condition: ch4_spared_dave = 1
        texts:
          - source: scene_text
            paragraph: 7
            text: |-
              Como a Leila no le apetecía mucho hablar en ese momento, decidí darle algo de espacio para que pudiera estar a solas con sus propios pensamientos.

              Cuando volví a mi sitio original, vi que Flower estaba ahora ocupada hablando con Melindra, mientras Kate seguía ayudando a Rose con sus pruebas. Por lo visto, Rose ya había encontrado la forma de usar sus poderes para ralentizar el tiempo y ahora estaba intentando ver si también podía hacer que el tiempo volviera a fluir con normalidad para Kate, para que pudiera beneficiarse de los efectos de su hechizo. Yo también intenté ayudar a Rose, pero después de pasar más de quince minutos haciendo pruebas, no parecía que estuviéramos avanzando gran cosa.

              "Vaya, ya hace bastante rato que terminamos nuestras primeras pruebas", dice Daren, al cabo de un tiempo. "Me pregunto por qué está tardando tanto en empezar la segunda fase..."

              "Yo te lo diré", dice Arraka. "Es porque ustedes, inútiles, le dieron a Selkram tanta materia prima con la que trabajar en la primera fase, que todavía sigue ocupado convirtiéndola toda en energía."

              "¿Qué?...", dice Daren.

              "¡Sus emociones negativas!", dice Arraka. "Esa es la materia prima que Selkram está usando para convertirla en energía mágica. Y mientras ustedes, perdedores, se dedicaban a repetir una y otra vez esos rituales, hundiéndose en la desesperación o maldiciendo al Dios del Tiempo, le estaban dando exactamente lo que quería. Sinceramente, creo que sacó tanta energía de todos ustedes que puede que ni siquiera NECESITE una segunda fase para su grupo. Supongo que eso lo veremos dentro de poco."
          - source: scene_text_2
            paragraph: 6
            text: |-
              "Bueno, me alegra haber sido de ayuda", dice Daren con tono seco. "Supongo que eso nos da más tiempo para investigar la zona, entonces. Vamos, Hadrik, probemos a interactuar con más de estos insectos y árboles congelados. Quizá logremos encontrar alguno que no esté protegido por un escudo invisible e impenetrable para que por fin podamos cancelar este maldito hechizo que congela el tiempo."

              Poco después de que Daren y Hadrik empiecen su nueva patrulla por la zona, oímos una voz conocida gritando horrorizada a unos treinta metros de nosotros. Cuando todos nos damos la vuelta para averiguar de quién era la voz, vemos a Dave el Degollador, sudando por toda la cara, mirando a su alrededor confundido mientras intenta entender qué está pasando. De pronto me doy cuenta de que Dave el Degollador debía de ser la persona que nos estaba espiando desde lejos mientras permanecía invisible, de la que Arraka y el Dios del Tiempo hablaban antes. Con toda la locura que ha estado pasando desde que empezó la profecía, me había olvidado por completo de él.

              "¡Ah, así que tú eras nuestro acosador invisible!", dice Melindra con una sonrisa ladeada, mientras lanza un hechizo sobre el degollador para elevarlo por el aire. "¿Por qué no vienes para acá, para que podamos verte un poco mejor?"

              Entonces hace que las corrientes de aire lleven lentamente a Dave el Degollador hasta nuestra posición, mientras él forcejea en vano para liberarse.

              "¡Suéltame, moza!", dice Dave el Degollador, enviando algunos de sus cuchillos a atacar a Melindra.

              Melindra utiliza un hechizo de viento para desviar los cuchillos sin esfuerzo y luego continúa acercando al degollador hacia nosotros.
