            text: |-
              En cuanto el revenant termina su frase, todos nos volvemos hacia el amuleto de Arraka.

              "Arraka, ¿podrías--", empieza a decir Illuna, pero es interrumpida.

              "Sí, sí, ya lo pillo", dice Arraka. "¿Qué tengo que hacer?"

              "Primero, vas a necesitar acercarte todo lo posible al lugar donde el Dios del Tiempo se materializó por primera vez en este mundo", dice el revenant.

              "¡En ello!", dice Flower, mientras salta al aire y enciende sus propulsores de fuego.

              Entonces vuela hasta donde el Dios del Tiempo estaba flotando cuando hizo su primera aparición, y se detiene, girando la cabeza hacia el revenant.

              "Ya estoy aquí", dice Flower. "¿Y ahora qué?"
