  - name: b2_ch11c_forehead
    routes:
      - condition: ch11_saved_rose = 0
        texts:
          - source: scene_text
            paragraph: 46
            text: |-
              Mis amigos y yo intercambiamos unas cuantas miradas, pero al final, todos elegimos mantenernos firmes. Al ver que ninguno de nosotros planea arrodillarse, Melindra empieza a masajearse lentamente la frente, con los ojos cerrados, por la frustración. Como sabe que haga lo que haga, el resultado será el mismo, decide mantenerse firme ella también, esta vez.

              "Que así sea, entonces", dice el Dios del Tiempo, mientras una fuerza poderosa nos empuja a todos excepto al revenant al suelo, en posición horizontal, y luego empieza a aplastarnos lentamente, con la misma fuerza mágica.

              Mientras me presionan contra la tierra, empiezo a tener flashbacks de mi primer ritual, y de mis padres suplicándome que los salvara, mientras yo me quedaba ahí parado y miraba, con la horca en las manos. Un repentino sentimiento de rabia se apodera de mí, y durante toda la duración del hechizo del dios, un solo pensamiento pasa por mi cabeza, una y otra vez.

              'Le haré pagar.'

              'Le haré pagar.'

              'Le haré pagar.'

              Mientras todavía estábamos siendo presionados contra el suelo, los ojos del revenant de repente se volvieron amarillo brillante de nuevo, y ella empezó a alejarse lentamente de nosotros, mientras miraba a la distancia, con una mirada vacía en los ojos.

              "Parece que se nos ha acabado el tiempo", dice el Dios del Tiempo. "Los volveré a ver a todos pronto. Asegúrense de no morir mientras tanto. Sus futuras contribuciones a mi ritual son muy esperadas."
          - source: scene_text_2
            paragraph: 43
            text: |-
              Casi tan pronto como el dios termina de hablar, él y el revenant simplemente desaparecen, y el mundo se descongela, haciendo que parezca como si nada hubiera pasado. Ahora que ya no hay una fuerza presionándonos contra el suelo, todos nos levantamos y nos sacudimos el polvo con calma, sin decir nada. Apenas unos segundos después, oigo la voz del revenant, proveniente del transceptor en mi bolsillo.

              "¿Qué pasó después de que me fuera?", dice el revenant, en voz baja. "¿El Dios del Tiempo les hizo más visitas mientras el tiempo estaba congelado?"

              "No", digo. "Desde nuestro punto de vista, solo han pasado unos segundos desde que te fuiste. ¿Y tú? ¿Recuerdas algo después de haberte alejado de aquí?"

              "Es sobre todo un gran borrón", dice el revenant. "Recuerdo que las personas que visité justo después de ustedes fueron Azarius y su pupilo, pero no sé qué pasó después de eso."

              "De acuerdo", digo. "¿Vas a mantener tu canal de transceptor cerrado de ahora en adelante, también?"

              "Sí", dice el revenant. "Todavía estoy siendo vigilada de cerca, y no quiero parecer más sospechosa de lo que ya soy. Si alguna vez hay algo urgente, te llamaré desde mi lado. Cuídense."

              "Tú también", digo, y entonces el revenant cierra su canal de nuevo.
          - source: scene_3
            paragraph: 27
            text: |-
              "Yo... creo que todos deberíamos tomarnos un pequeño descanso, para poder aclarar un poco nuestras mentes", dice Daren, con una mirada muy cansada en el rostro. "¿Nos vemos todos aquí de nuevo en veinte minutos?"

              "Sí", dice Hadrik. "No me vendría mal un descanso justo ahora."

              Mientras todos se van a buscar un lugar donde puedan estar solos por un rato, Daren se va a sentar en un tocón de árbol, y empieza a afilar su espada, para aparentar estar ocupado.
