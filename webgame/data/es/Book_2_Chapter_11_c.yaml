  - name: b2_ch11c_shelter
    routes:
      - condition: b2_ch11_dagger = 1 AND b2_ch11_echoes = 1
        texts:
          - source: scene_text
            paragraph: 37
            text: |-
              "No vas a poder acabar con nosotros tan fácilmente", digo, mientras saco mi daga y empiezo a acercarme a ella.

              "No estoy aquí para jugar contigo, chico", dice la Arraka del pasado. "Si te quiero muerto... estás muerto."

              Entonces empieza a mover la mano hacia mí, pero de repente se detiene, al quedar congelada en el tiempo junto con todos los que no son parte de nuestro grupo.

              "Logré congelarla...", dice el revenant, mientras parece tener un dolor de cabeza. "Pero no estoy segura de cuánto puedo mantener mi concentración. Tenemos que alejarnos de aquí y encontrar un refugio."

              "Veamos si podemos encontrar algunos edificios recubiertos de polvo de seredium cerca", dice Melindra. "El Sentido mágico no funciona a través del seredium, así que deberíamos poder escondernos allí por un rato."

              Todos salimos corriendo de la zona donde fuimos transportados inicialmente, y miramos a nuestro alrededor, intentando encontrar una casa con polvo negro en sus paredes.
          - source: scene_text_2
            paragraph: 36
            text: |-
              "¡Estoy tan cabreada ahora mismo!", dice la Arraka del presente, mientras corremos por los callejones. "¡Si tuviera una forma de salir de este amuleto, partiría a esa versión falsa de mí misma por la mitad, y la tiraría a los perros!"

              "Arraka, ¿hay algunas casas en las inmediaciones que tengan paredes a través de las cuales no puedas ver con tu sentido mágico?", dice Illuna.

              "¿Eh?...", dice Arraka, como si solo ahora se hubiera dado cuenta de lo que estábamos intentando hacer. "Ah, cierto, déjame comprobar... Sí, hay una. Pero está bastante lejos de aquí. Giren a la izquierda en el próximo cruce, y sigan recto. Les diré cuándo parar."

              "¿No sería más rápido que Melindra nos llevara volando hasta allí?", digo, mientras seguimos corriendo.

              "Sin ánimo de ofender", dice Kate, "pero creo que podemos correr más rápido de lo que Melindra puede llevarnos con sus corrientes de aire."

              "De todas formas no hay tantos obstáculos", dice Arraka. "Solo es un camino largo hasta llegar."

              "¿Adónde se ha ido corriendo ese degollador?", dice Daren.

              "Nunca vino con nosotros", dice Arraka. "Salió corriendo en la dirección opuesta en cuanto se congeló el tiempo. Probablemente sea una decisión inteligente. Mi yo del pasado sin duda vendrá a por nosotros, después de todo."
