            paragraph: 36
            text: |-
              "¿Estás segura de que quieres matarnos?", digo. "Piénsalo un segundo. La Arraka de nuestro tiempo presente probablemente no te dará más información de la que ya te dio. Pero el resto de nosotros hemos viajado con ella durante bastante tiempo. Conocemos algunos de sus secretos. Podríamos intercambiarte esa información... a cambio de nuestra libertad."

              "Tienes nervios de acero, intentando negociar conmigo, eso te lo concedo", dice la Arraka del pasado, con su sonrisa maliciosa de vuelta. "Pero ¿qué tipo de información podrías darme que--"

              Mientras hablaba, la Arraka del pasado se detuvo de repente a mitad de frase, porque aparentemente quedó congelada en el tiempo, junto con todos los que no eran parte de nuestro grupo.

              "Logré congelarla...", dice el revenant, mientras parece tener un dolor de cabeza. "Pero no estoy segura de cuánto puedo mantener mi concentración. Tenemos que alejarnos de aquí y encontrar un refugio."

