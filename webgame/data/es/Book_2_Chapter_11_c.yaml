              current_scene: b2_ch11c_explain
              b2_ch11_explain: 0
  - name: b2_ch11c_explain
    routes:
      - condition: b2_ch11_explain = 1
        texts:
          - source: scene_text
            paragraph: 20
            text: |-
              "Oye, Flower", digo.

              "¿Sí?", dice Flower.

              "Solo para que lo sepas, el revenant no estaba molesta contigo ni nada", digo. "Es simplemente su forma de hablar, por ser no muerta. Probablemente deberías ignorar por completo su tono de voz si quieres evitar más malentendidos."

              "¡Oh!", dice Flower, mientras se da la vuelta de repente hacia el revenant. "¡Perdona! Pensé que estabas enfadada conmigo por hacer preguntas tontas. ¡No pretendía molestarte!"

              "No me molestaste", dice el revenant. "Y no estabas haciendo preguntas tontas."

              "¡Me alegra oír eso!", dice Flower con una sonrisa.

              Entonces se acerca al revenant y le tiende la mano.

              "¿Amigas?", pregunta Flower.

              "Yo... ya dije antes que si el Dios de la Muerte me ordenara matarlos, yo--"

              "Eso no importa", dice Flower. "¡Aun así podemos ser amigas a pesar de eso! Pero solo si tú quieres, claro..."

              El revenant duda un segundo, pero luego agarra lentamente la mano de Flower y la aprieta con firmeza, como señal de su recién formada amistad.

              "¡Genial!", dice Flower. "Recuerda, ¡las amigas siempre se cuidan mutuamente! Si alguna vez necesitas mi ayuda, solo llámame. Eh, a menos que te hayan ordenado matarme o algo..."
          - source: scene_text_2
            paragraph: 23
            text: |-
              "Gracias", dice el revenant. "Lo recordaré."

              Al cabo de un rato, Flower se va a hablar con Melindra, mientras el resto nos quedamos atrás, esperando en silencio a que comience la siguiente fase del ritual. Mientras tanto, Daren y Hadrik aparentemente siguen recorriendo la zona, intentando ver si pueden encontrar algo inusual que les sirva para detectar un punto débil en el ritual. Mientras miro a mi alrededor para ver qué está haciendo todo el mundo, de pronto me doy cuenta de que Leila no ha participado en ninguna de nuestras conversaciones hasta ahora y apenas se ha movido de su sitio desde que empezó el ritual. En este momento, lo único que hace es mirar al suelo, evitando cruzar la mirada con cualquiera de nosotros.

              ¿Será que todavía no ha logrado superar lo que pasó en su primera prueba? Ahora que lo pienso, ella también estaba en el Faro, así que no sería tan raro que le hubiera tocado un ritual parecido al de Kate. Eso no es nada bueno... Puede que Kate sea lo bastante fuerte para soportar el trauma emocional provocado por una prueba así, pero ¿y Leila? Tal vez debería ir a hablar con ella y ver cómo lo está llevando.
          - source: scene_3
            paragraph: 15
            text: |-
              "Leila, ¿está todo bien?", digo, acercándome un poco a ella.

              Leila se sorprende al oír mi voz. Creo que se ha acostumbrado a que la ignoren en situaciones como esta debido a su carácter callado y a lo poco que suele llamar la atención.

              Levanta la cabeza para mirarme a los ojos y luego asiente ligeramente para responder a mi pregunta.

              "Estoy bien", escribe Leila. "Solo un poco afectada, eso es todo."

              "¿Quieres hablar de ello?...", le pregunto.

              De nuevo, Leila me mira sorprendida durante un segundo, pero luego sonríe levemente mientras escribe un nuevo texto en el aire frente a mí.

              "Ahora no", escribe Leila. "Pero quizá más tarde..."

              Como a Leila no le apetecía mucho hablar en ese momento, decidí darle algo de espacio para que pudiera estar a solas con sus propios pensamientos. Cuando estaba volviendo a mi sitio original, vi al revenant mostrar un atisbo de emoción en los ojos de nuevo, mientras se preparaba para hacerle una pregunta a Kate.

              "Yo... tengo una pregunta que hacer", le dice el revenant a Kate, con vacilación en su voz. "¿Qué pasó con Kevin y Suzie? ¿Tuvieron que dejarlos en un orfanato, o--"

              "No, no hizo falta", dice Kate. "Los dejamos con Enrique. Él se ofreció a mudarse con los niños después de enterarse de la muerte de Rose, así que él se encargará de cuidarlos de ahora en adelante."
        choices:
