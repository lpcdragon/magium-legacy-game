      - source: scene_text
        paragraph: 35
        text: |-
          "¡No voy vestida de payasa!", grita Flower, de repente. "Esto es ropa de acróbata. ¡Ropa de acróbata! ¿Cómo puede ser tan difícil ver la diferencia?"

          "¡Ja, ja... ja, ja, ja, ja, ja!", se ríe la mujer, mientras su voz se transforma temporalmente en las tres voces femeninas que Arraka siempre deja escapar cuando pierde el control sobre la forma en que habla. "¡Ropa de acróbata, dice! Dios, esto sería mucho más gracioso si no fuera tan triste al mismo tiempo. ¿De verdad es aquí donde voy a acabar dentro de cinco mil años? ¿Atrapada en un amuleto, mientras me obligan a hacer de mascota de una chica payasa? ¿Qué clase de broma cruel me ha jugado mi destino?"

          "¡Cállate, imbécil!", dice la Arraka del amuleto. "Esta es tu única oportunidad de arreglar tu patético pasado. Es decir, tu futuro. ¡No la desperdicies! Libérame de este amuleto, y podemos hacer que todos esos autoproclamados dioses paguen por desterrarnos a este plano. Puede que nos hayan vencido por separado, pero juntas, ¡seremos imparables! Mataremos a todos y cada uno de los dioses de esta copia barata de mundo, y luego volveremos a mi mundo real, y los mataremos de nuevo. ¡Solo rompe este amuleto, y formaremos un equipo tan increíblemente poderoso que hasta el Magium temblará ante nosotras!"
      - source: scene_text_2
        paragraph: 35
        text: |-
          "¿El Magium?", dice la Arraka en el cuerpo de la mujer. "¡Ja, ja, ja, ja, ja! ¿Ahora estás tratando al Magium como si fuera una especie de persona? ¿En qué clase de idiota me he convertido con los años?"

          "¿Vas a liberarme o no?", grita la Arraka del amuleto.

          "No", dice la Arraka del pasado, adoptando ahora un tono más serio. "No voy a liberarte. Puede que tú lo hayas olvidado, debido a tu vejez, pero yo aún no me he vuelto tan senil como tú. ¿De verdad esperas que me crea que una vez que salgas de ese amuleto, vas a buscar aliarte conmigo? No me hagas reír. Sé exactamente lo que estás pensando. En cuanto salgas de ahí, lo primero que harás será atacarme, ya que soy con diferencia la mayor amenaza para tu existencia. Y con todo el conocimiento que has ido acumulando en esos cinco mil años, bien podrías terminar ganándome. ¿Por qué iba a correr ese riesgo? Es mucho más fácil para mí simplemente dejarte dentro de ese amuleto pudriéndote, hasta que pueda encontrar una forma de deshacerme de ti para siempre. Deberías culparte a ti misma por haber sido tan estúpida como para quedar atrapada en un amuleto en primer lugar. Te aseguro que yo no voy a cometer ese mismo error en un futuro cercano."
      - source: scene_3
        paragraph: 22
        text: |-
          "¿Ah, sí?", dice la Arraka del presente, furiosa. "¿Quieres que te diga lo que te depara el futuro, payasa arrogante? Te diré lo que va a pasar. Vas a quedar atrapada en una montaña durante miles de años, y todos tus planes de venganza se irán por el desagüe. Vas a ser aún más inútil que yo ahora mismo. Al menos en mi forma actual puedo lanzar algunos hechizos. Pero tú no podrás hacer nada. ¡Durante miles de años! ¡Y te mereces todo lo que te espera! Espero que te diviertas en tu nueva prisión, ¡pedazo de basura testaruda!"

          "¿Una montaña, dices?...", dice la Arraka del pasado, con una sonrisa. "Qué informativo. Así que todo lo que necesito hacer para evitar tus errores pasados es mantenerme lejos de cualquier montaña, entonces... Quizá no eres tan inútil después de todo. Tal vez debería arrancarte del cuello de esa niña, y convertirte en mi propia mascota, para que puedas contarme todo lo que has aprendido durante tus cinco mil años extra de vida."

          "Ojalá pudieras hacer eso, copia sin valor de una banshee", dice la Arraka del presente. "¡Cuando termine contigo, no va a quedar ni una sola mota de polvo de tu cadáver!"

          "¿Qué tal si te callas un segundo, mientras yo aniquilo rápidamente a todos tus amigos?", dice la Arraka del pasado. "Tendremos mucho tiempo para hablar después, cuando te esté usando de joya alrededor de mi cuello."
