  - name: b2_ch11c_avalanche
    texts:
      - source: scene_text
        paragraph: 40
        text: |-
          Una avalancha de llamas procedente de la derecha envuelve a Arraka, justo cuando estaba terminando su discurso, y nos vemos obligados a retroceder, porque incluso el aire que rodea esas llamas parece capaz de derretirnos la piel. Arraka fue claramente pillada desprevenida, y está intentando empujar las llamas con las manos, mientras lucha por mantener su escudo mágico. Todo el suelo debajo de ella se está convirtiendo rápidamente en lava, mientras la banshee parece estar siendo empujada lentamente hacia atrás, por la increíble fuerza de las llamas mágicas que no paran de salir. Finalmente, se ve obligada a teletransportarse, quince metros por encima de su ubicación actual, lo que hace que las llamas se detengan de inmediato.

          Entonces, completamente de la nada, un dragón de aspecto familiar hecho de magma aparece justo al lado nuestro, y al segundo siguiente, nos encontramos siendo teletransportados lejos de las calles de la ciudad, junto con él. Al echar un vistazo rápido a nuestro alrededor para ver adónde nos ha transportado el dragón Tyrath, nos damos cuenta de que ahora estamos situados en un gran edificio con un techo muy alto, y por lo que parece, toda la construcción que nos rodea ha sido recubierta con polvo de seredium. El interior del edificio parece un gran anfiteatro cerrado, con filas ascendentes de asientos, y la iluminación parece provenir de dispositivos mágicos, en lugar de antorchas.
      - source: scene_text_2
        paragraph: 39
        text: |-
          A juzgar por el tamaño del anfiteatro, diría que probablemente podría albergar a unas mil personas o más en esos asientos, aunque actualmente solo hay unos pocos cientos sentados en las sillas, mientras murmuran y miran hacia nosotros. Si tuviera que adivinar, basándome en la ropa de aspecto importante de estos individuos, apostaría a que estas deben ser las personas que gobiernan esta ciudad, que estaban en una reunión de emergencia discutiendo sobre el ataque a la ciudad, antes de que nosotros los interrumpiéramos.

          Mientras tanto, en el centro del anfiteatro, donde el dragón y nuestro grupo nos encontramos actualmente, también hay bastantes magos humanos reunidos, todos vestidos con ropajes tradicionales de hechicero, junto con unas cuantas mujeres que también llevan túnicas de hechicera. Un hombre particularmente anciano con una larga barba blanca, que parece ser la persona que preside la reunión, ahora se dirige a Tyrath desde una plataforma elevada, hablándole en un tono que es de alguna manera educado y condescendiente al mismo tiempo.

          "¿Quiénes son estos... hechiceros tan extrañamente vestidos que has traído ante el alto consejo lessathi, rey de todos los dragones?", dice el anciano. "Creía que habíamos dejado claro que esta reunión debía celebrarse a puerta cerrada. Cuando te invitamos a nuestro gran salón, no te dimos permiso para traer invitados también."
      - source: scene_3
        paragraph: 24
        text: |-
          "Nadie pidió tu permiso, viejo necio", dice Tyrath, con asco. "Sabes perfectamente que no estaría aquí si la situación no fuera tan grave como es. Esta... poderosa hechicera llamada Arraka, que afirma provenir de otro plano de existencia es una amenaza para todos nosotros. Luché contra ella poco después de que hiciera su primera aparición, ayer, y puedo aseguraros que no es una enemiga con la que jugar. Todo mi ejército de dragones fue completamente impotente ante ella. Solo yo fui lo bastante poderoso para contenerla, pero no lo suficiente para derrotarla realmente. Ya deberíais tener una idea del alcance de sus poderes, ahora que ella también ha atacado vuestra ciudad."

          "Si sabes lo grave que es la situación, ¿por qué traes invitados no convocados en medio de esta reunión tan importante?", dice el anciano lessathi. "¿Qué beneficio podrían aportarnos, en tales circunstancias?"

          "Estas personas no son lo que parecen", dice Tyrath. "Oí a Arraka decir que uno de ellos era una tejedora del tiempo, mientras me dirigía hacia este salón. Y si miras con atención, verás que el aura que emana de ese amuleto alrededor del cuello de la niña es inquietantemente similar a la de Arraka. Tan similar, de hecho, que me atrevería a decir que las dos son de alguna manera la misma persona. La Arraka que conocemos estaba a punto de matarlos a todos, antes de que yo interviniera. Seguramente, incluso alguien tan limitado como tú puede ver la ventaja de tener a estas personas como aliados."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch11c_ezzeloff
  - name: b2_ch11c_ezzeloff
    texts:
      - source: scene_text
        paragraph: 41
        text: |-
          "¡Pero ¿a qué precio?!", dice otro lessathi del alto consejo, mientras se levanta de su asiento. "¡Acabo de recibir noticias de mis hombres a través del transceptor, y me han dicho que tu lluvia de llamas de antes ha causado la muerte de más de un centenar de civiles! ¿Valió la pena matar a tantos inocentes solo para salvar a este pequeño grupo?"

          "Incluso si mis llamas no los hubieran matado, casi con toda seguridad habrían sido asesinados por Arraka unos momentos después", dice Tyrath. "Vuestros civiles prácticamente ya estaban muertos desde el momento en que ella pisó esa zona. Había cientos de vuestros vehículos metálicos voladores estrellados contra las casas cercanas cuando llegué, y Arraka ni siquiera había empezado su matanza todavía. Cada momento perdido discutiendo aquí significará la muerte de un centenar más de sus civiles, hasta que logremos elaborar un plan de ataque que tenga alguna posibilidad realista de éxito."

          "Tendré que estar de acuerdo con Tyrath en que seguir discutiendo no nos llevará a ningún lado", dice el anciano lessathi. "Por favor, siéntese, concejal Hrelezar. Interrogaremos a este extraño grupo de hechiceros en breve, y pronto descubriremos si las muertes de nuestros compatriotas valieron la pena o no."

          El lessathi que se levantó antes ahora se sienta a regañadientes, mientras el lessathi más anciano se dirige a una de las mujeres vestidas con túnicas de hechicera.

          "Olyrra, ¿puedes continuar donde lo dejaste, antes de que nos interrumpieran?", dice el anciano lessathi.
      - source: scene_text_2
        paragraph: 40
        text: |-
          "Sí, presidente Ezzeloff", dice la mujer. "Como dije, ninguna de nosotras ha experimentado nunca algo así. Nuestros poderes mágicos simplemente desaparecieron ayer, y no encontramos forma de recuperarlos. Por alguna razón, solo las mujeres parecen estar afectadas, pero incluso algunas de nuestras hechiceras más poderosas han quedado reducidas a simples plebeyas, en el transcurso de un día. Hemos probado muchos métodos para estimular nuestras auras mágicas, pero ninguno parece funcionar. Si esto no se soluciona, la mitad de nuestras tropas de élite de hechiceros serán completamente inútiles en la próxima batalla."

          "Estas son noticias muy graves", dice Ezzeloff. "Las hechiceras de nuestras tropas de élite eran una fuerza a tener en cuenta. Nuestra máxima prioridad debe ser encontrar una forma de devolverles sus poderes, cueste lo que cueste."

          "¡Ja!", dice Arraka, desde su amuleto. "Podéis intentarlo todo lo que queráis. Vuestras mujeres nunca van a recuperar su magia."

          "¿De qué estás hablando?", dice Ezzeloff.
      - source: scene_3
        paragraph: 25
        text: |-
          "¿No os pareció extraño que todas vuestras mujeres perdieran sus poderes exactamente el mismo día que la versión pasada de mí misma hizo su aparición?", dice Arraka. "Claro que no. Sois imbéciles. Bueno, dejad que os lo explique con detalle. La razón por la que vuestras mujeres podían hacer magia hasta ayer era porque se estaban vinculando inconscientemente a espíritus femeninos del plano mágico. Dado que ayer fue obviamente el día en que yo y todos los demás espíritus femeninos fuimos desterrados de ese plano de existencia, su magia nunca volverá a funcionar. Podéis darles espadas y escudos para luchar, porque eso es lo máximo que vais a sacar de esas tropas de ahora en adelante."

          "Llamaste a la otra Arraka una versión pasada de ti misma...", dice Tyrath. "¿Eso significa que vienes del futuro?"

          "¡Impresionante, Tyrath!", dice Arraka. "Nunca supe que habías dominado la lógica básica a una edad tan temprana. Supongo que por eso los otros dragones te hicieron su rey."

          "Ahórrate tu humor insípido y respóndeme esto", dice Tyrath. "¿Por qué habéis venido aquí? ¿Por qué estabais luchando contra la Arraka de nuestro tiempo? ¿Vinisteis aquí para evitar alguna gran crisis, o simplemente llegasteis a este lugar por pura casualidad?"
