            paragraph: 15
            text: |-
              "¿Cómo consiguió el revenant llegar aquí si estaba encerrada en un templo?"

              "Ese trance con los ojos brillantes en el que estaba antes le permite atravesar cualquier objeto, e incluso seres vivos", dice Arraka. "Habría sido bastante ridículo que hubiera un mecanismo para revivirla de la muerte, pero no uno para ayudarla a escapar de una prisión, ¿no crees? No se pueden detener estas profecías. El Magium se ha asegurado de eso."

              "Estamos perdiendo el tiempo", dice Melindra. "Revenant, dijiste que sabías una forma de sabotear la siguiente fase del ritual. ¿Qué ibas a decirnos?"
