  - name: b2_ch11c_ending
    texts:
      - source: scene_text
        paragraph: 48
        text: |-
          "Entonces...", digo, mientras me acerco a Daren. "¿Qué piensas hacer exactamente después de este 'descanso'?"

          "¿Qué quieres decir?", dice Daren, mientras sigue afilando su espada, sin mirarme. "Después del descanso, continuaremos marchando hacia Ollendor, como antes. ¿No era eso lo que nos propusimos hacer cuando salimos de Thilias?"

          "Por supuesto", digo. "Pero sabes muy bien que no es eso lo que quería decir. Cuando pregunté qué pensabas hacer, estaba pensando más a largo plazo. Me refería al Dios del Tiempo, y a los próximos rituales con los que nos ha amenazado. ¿Qué piensas hacer al respecto?"

          "No lo sé, Barry", me dice Daren, mientras deja de afilar su espada y me mira a los ojos. "Dime tú. Porque yo realmente no veo una salida obvia a esto. Tal como lo veo, lo único que podemos hacer es prepararnos lo mejor posible para los próximos rituales, y esperar que podamos pasarlos, como pasamos nuestras últimas pruebas."

          "Bueno, yo estaba pensando que podríamos encontrar una solución más... permanente a nuestro problema", digo.

          "¿Como qué?", dice Daren. "¿Matar al Dios del Tiempo? Barry, sé razonable. Estamos hablando de un dios literal. Teníamos problemas incluso contra un sabio, no hace mucho. ¿Qué esperarías que hiciéramos contra un dios? No somos ni remotamente lo bastante poderosos para desafiarlo."

          "Es gracioso", digo, "porque tú tampoco eres ni remotamente tan poderoso como Eiden, y sin embargo seguiste desafiándolo una y otra vez, cada vez que nos encontrábamos."
      - source: scene_text_2
        paragraph: 45
        text: |-
          "¡Eso es diferente!", dice Daren. "A pesar de su poder, Eiden sigue siendo un mago. Todos hemos luchado contra magos antes. Algunos de ellos son más poderosos que otros, pero aun así tienes una idea general de qué esperar cuando luchas contra uno. Pero ¿desafiar a un dios?... Barry, ni tú ni yo tenemos la más mínima experiencia en lidiar con algo así."

          "Entonces quizá deberíamos preguntarle a alguien que sí la tenga", digo.

          Antes de que Daren llegue a decir nada más, empiezo a caminar hacia Illuna, que aparentemente estaba teniendo una conversación con Arraka. Cuando me acerco a ellas, las dos interrumpen su conversación, esperando a ver qué quiero.

          "Arraka, tengo una pregunta que hacerte", digo, con un tono muy serio en la voz.

          "Eh, claro...", dice Arraka. "Dispara."

          "¿Cómo se mata a un dios?", le pregunto, con calma.
      - source: scene_3
        paragraph: 28
        text: |-
          Hay una breve pausa, después de que hago mi pregunta, durante la cual ninguno de nosotros dice nada.

          "¿Quieres que te diga cómo puedes matar a un dios?...", dice Arraka, mientras parece estar todavía recuperándose de la impresión de lo que acabo de preguntarle.

          Espera unos segundos más, para intentar averiguar si estoy bromeando o no, y cuando finalmente entiende que hablo en serio, empieza a reírse.

          Se ríe, y se ríe, tan alto como puede, con sus tres voces, y no parece que vaya a parar pronto. Sin embargo, no estoy molesto. Esta no es una de sus risas burlonas habituales. Esta risa es de emoción. Está disfrutando esto.

          La risa de Arraka logra llamar la atención de todos en la zona, y ahora todos nos miran, con curiosidad. No les presto atención, y sigo esperando pacientemente a que Arraka deje de reírse. Cuando finalmente se queda en silencio, espera unos segundos más, y luego me da su respuesta.

          "Barry, muchacho...", dice Arraka. "¡Creí que nunca lo preguntarías!"

          -----Fin del libro 2-----
