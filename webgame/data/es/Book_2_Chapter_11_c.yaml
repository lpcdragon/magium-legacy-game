  - name: b2_ch11c_history
    routes:
      - condition: b2_ch11_towers = 0
        texts:
          - source: scene_text
            paragraph: 32
            text: |-
              "No importa la lección de historia. ¿Alguna idea de quién podría estar atacando la ciudad?"

              "¿Una ciudad rebelde, quizá?...", dice Melindra. "La historia del imperio lessathi no se ha conservado muy bien, así que no estoy segura de si tuvieron algún conflicto entre sus propias ciudades en el pasado. También es posible que estén siendo atacados por algunos magos muy poderosos de su época. Quizá obtengamos más detalles si seguimos escuchando sus anuncios."
          - source: scene_text_2
            paragraph: 33
            text: |-
              "¿De qué demonios estáis hablando vosotros dos?...", dice Dave el Degollador, que ahora parece ya no estar atrapado por las corrientes de aire de Melindra, y está mirando todos los carruajes voladores con aprensión en los ojos. "¿Qué es este sitio?"

              "¡Es una ciudad del antiguo imperio lessathi!", dice Melindra. "¿Es que no has estado prestando atención?"

              "Entonces, si hemos sido enviados al pasado otra vez, ¿significa eso que hay algunos eventos que tenemos que repetir?...", pregunta Hadrik.

              "¡No, este es un tipo diferente de ritual!", dice Arraka. "¿No veis que habéis sido transportados aquí con vuestros cuerpos, en vez de solo vuestra consciencia?"

              "¿Estás diciendo que esta vez se nos permite cambiar algo que ocurrió en el pasado?", dice Daren.

              "No, eso no es lo que digo", dice Arraka. "La única forma de cambiar el pasado es a través de un hechizo de reversión temporal. Obviamente este no es nuestro mundo. Ninguno de vosotros estaba aquí hace cinco mil años. Estamos en un mundo paralelo, similar al nuestro, donde el futuro todavía no ha ocurrido. No importa lo que cambiemos aquí, no afectará a nuestra realidad."

              "Pero entonces, ¿cuál es el propósito de esta prueba?", dice Daren.

              "Ni idea", dice Arraka. "Pero creo que he logrado averiguar por qué nos han enviado aquí, de entre todos los sitios."

              "¿Qué quieres decir?", dice Illuna.
            condition: ch4_spared_dave = 1 AND ch11_saved_rose = 0
          - source: scene_text_2
