            text: |-
              "¿Estás segura de que quieres matarnos?", digo. "Piénsalo un segundo. La Arraka de nuestro tiempo presente probablemente no te dará más información de la que ya te dio. Pero el resto de nosotros hemos viajado con ella durante bastante tiempo. Conocemos algunos de sus secretos. Podríamos intercambiarte esa información... a cambio de nuestra libertad."

              "Tienes nervios de acero, intentando negociar conmigo, eso te lo concedo", dice la Arraka del pasado, con su sonrisa maliciosa de vuelta. "Pero ¿qué tipo de información podrías darme que no pudiera averiguar por mí misma?"
          - source: scene_text_2
            paragraph: 38
            text: |-
              "Bueno, hay ciertos eventos de tu futuro que no salieron exactamente de la mejor forma para ti", digo. "¿No preferirías tener ventaja, sabiendo estas cosas de antemano? A nosotros no nos cuesta nada darte esta información. Este no es nuestro mundo, después de todo. No importa lo que elijas hacer aquí, no nos afectará."

              "Tu oferta sería mucho más tentadora, si tus verdaderas intenciones no fueran tan transparentes, chico", dice la Arraka del pasado. "Sé lo que estás intentando hacer. Estás intentando ganar tiempo hasta que tu amiga la tejedora del tiempo pueda usar sus poderes para congelarme. No va a funcionar. Lo primero que hice después de llegar a este lugar fue lanzar un hechizo que impedía a todos en la zona usar poderes temporales. Supuse que uno de ustedes tenía que ser una tejedora del tiempo, dado que Selkram estaba involucrado. Tu amiga de ahí ha estado intentando lanzar un hechizo que congela el tiempo durante el último minuto, pero le da un dolor de cabeza enorme cada vez que empieza a concentrarse. Tus desesperados intentos de retrasar lo inevitable no han tenido ningún efecto en su situación actual. Absolutamente ninguno--"
