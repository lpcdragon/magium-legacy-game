              "Vaya, ya hace bastante rato que terminamos nuestras primeras pruebas", dice Daren, al cabo de un tiempo. "Me pregunto por qué está tardando tanto en empezar la segunda fase..."

              "Yo te lo diré", dice Arraka. "Es porque ustedes, inútiles, le dieron a Selkram tanta materia prima con la que trabajar en la primera fase, que todavía sigue ocupado convirtiéndola toda en energía."

              "¿Qué?...", dice Daren.

              "¡Sus emociones negativas!", dice Arraka. "Esa es la materia prima que Selkram está usando para convertirla en energía mágica. Y mientras ustedes, perdedores, se dedicaban a repetir una y otra vez esos rituales, hundiéndose en la desesperación o maldiciendo al Dios del Tiempo, le estaban dando exactamente lo que quería. Sinceramente, creo que sacó tanta energía de todos ustedes que puede que ni siquiera NECESITE una segunda fase para su grupo. Supongo que eso lo veremos dentro de poco."
          - source: scene_text_2
            paragraph: 7
            text: |-
              "Bueno, me alegra haber sido de ayuda", dice Daren con tono seco. "Supongo que eso nos da más tiempo para investigar la zona, entonces. Vamos, Hadrik, probemos a interactuar con más de estos insectos y árboles congelados. Quizá logremos encontrar alguno que no esté protegido por un escudo invisible e impenetrable para que por fin podamos cancelar este maldito hechizo que congela el tiempo."

              Aunque Daren y Hadrik llegaron a patrullar la zona durante bastante más tiempo, no consiguieron encontrar nada útil. Al final, una luz blanca brillante volvió a cubrir nuestra zona una vez más y esta vez pude sentir que todo mi cuerpo estaba siendo transportado a otro lugar, en vez de solo mi conciencia.

              Cuando la luz se desvanece, todos nos encontramos en mitad de una ciudad que es... extraña, como poco. Lo primero que me llama la atención es que hay una torre negra gigantesca en cada esquina de la ciudad y que, en la parte superior de cada una de esas cuatro torres, hay una cantidad increíble de energía mágica que puede verse incluso a simple vista. La energía tiene un color púrpura y se mueve salvajemente en todas direcciones, como si estuviera intentando escapar de su prisión. A cada lado de estas torres de unos trescientos metros de altura, hay grandes plataformas flotantes que no dejan de subir y bajar lentamente, y parece que transportan a cientos de personas hasta los niveles de las torres a los que necesitan llegar.
          - source: scene_3
            paragraph: 5
            text: 'Dejando a un lado estos edificios altos y extraños, lo que resulta todavía más peculiar es lo que está ocurriendo justo por encima de nosotros. En este momento hay cientos de carruajes metálicos sin caballos volando por el aire, con gente dentro. Mientras estos carruajes vuelan de un lado a otro, hay grandes pantallas holográficas flotando sobre nosotros que muestran a un hombre repitiendo una y otra vez el mismo mensaje en Lengua Común. Las pantallas holográficas se parecen exactamente a las que creó el dispositivo de Ilusión de Golmyck cuando anunció nuestros primeros objetivos. El mensaje que no deja de repetirse es: ''Todos los ciudadanos que no sean lessathi deben presentarse de inmediato en el área de reserva militar. Estamos bajo ataque. ¡Repito: estamos bajo ataque!''.'
