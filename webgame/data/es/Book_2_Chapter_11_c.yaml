              "Ah, esos dos nunca se han llevado realmente bien", dice Arraka. "Y como Selkram es el único dios que no tiene seguidores, Ulruk siempre ha estado obsesionado con la idea de que el plan del Dios del Tiempo es matarlo para luego ocupar su lugar y robarle todos sus seguidores. Obviamente, Selkram es demasiado orgulloso como para rebajarse a algo así, pero el Dios de la Muerte siempre ha estado un poco loco, igual que sus propios seguidores, así que nadie consiguió convencerlo de que sus temores no tienen ninguna base en la realidad."

              "Estamos perdiendo el tiempo", dice Melindra. "Revenant, dijiste que sabías una forma de sabotear la siguiente fase del ritual. ¿Qué ibas a decirnos?"
