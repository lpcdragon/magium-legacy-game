  - name: b2_ch11c_anxiousness
    routes:
      - condition: ch4_spared_dave = 1
        texts:
          - source: scene_text
            paragraph: 22
            text: |-
              "Enrique...", dice el revenant, mientras parece estar recordando algunos recuerdos lejanos. "Sí, Enrique es un buen hombre... Estoy segura de que cuidará bien de los niños. Gracias."

              La sensación de nerviosismo que podía verse en los ojos del revenant ahora se está convirtiendo en una de alivio. Sin embargo, esas emociones humanas no duran mucho, porque poco después, la mirada en sus ojos vuelve a la mirada vacía e inexpresiva que tenía antes.

              "Vaya, sí que ha pasado un buen rato desde que terminamos nuestras primeras pruebas", dice Daren, después de un tiempo. "Me pregunto por qué está tardando tanto en empezar la segunda fase..."

              "Os diré por qué", dice Arraka. "Es porque vosotros, inútiles, le disteis a Selkram tanto material con el que trabajar en la primera fase, que todavía está ocupado convirtiéndolo todo en energía."

              "¿Qué?...", dice Daren.

              "¡Vuestras emociones negativas!", dice Arraka. "Ese es el material que Selkram está usando para convertir en energía mágica. Y mientras vosotros, perdedores, estabais ocupados repitiendo esos rituales una y otra vez, hundiéndoos en las profundidades de la desesperación o maldiciendo al Dios del Tiempo, le estabais dando exactamente lo que quería. Sinceramente, creo que sacó tanta energía de vosotros que quizá ni siquiera NECESITE una segunda fase con vuestro grupo. Supongo que lo veremos pronto."
          - source: scene_text_2
            paragraph: 25
            text: |-
              "Bueno, me alegra haber sido de ayuda", dice Daren, en un tono seco. "Supongo que eso nos da más tiempo para investigar la zona, entonces. Vamos, Hadrik, intentemos interactuar con más de estos insectos y árboles congelados. Quizá podamos encontrar uno que no esté protegido por un escudo invisible e impenetrable, para poder cancelar de una vez este maldito hechizo que congela el tiempo."

              Poco después de que Daren y Hadrik comiencen su nueva patrulla de la zona, oímos una voz familiar, gritando horrorizada, a unos treinta metros de nosotros. Cuando todos nos giramos para averiguar a quién pertenecía la voz, vemos a Dave el Degollador, con sudor por toda la cara, mirando a su alrededor, confundido, mientras intenta averiguar qué está pasando. De repente me doy cuenta de que Dave el Degollador debe haber sido la persona que nos estaba observando invisiblemente desde lejos de la que hablaron Arraka y el Dios del Tiempo antes. Con todas las locuras que han estado pasando desde que empezó la profecía, me había olvidado completamente de él.

              "¡Oh, así que tú eras nuestro acosador invisible!", dice Melindra, con una sonrisa burlona, mientras lanza un hechizo sobre el degollador para levantarlo por el aire. "¿Por qué no te acercas para que podamos verte un poco mejor?"

              Entonces hace que las corrientes de aire lleven lentamente a Dave el Degollador hacia nuestra posición, mientras él lucha en vano por liberarse.

              "¡Suéltame, moza!", dice Dave el Degollador, mientras envía algunos de sus cuchillos a atacar a Melindra.

              Melindra usa un hechizo de viento para desviar los cuchillos sin esfuerzo, y luego continúa atrayendo al degollador hacia nosotros.
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch11c_jewelry
      - condition: ch4_spared_dave = 0
        texts:
          - source: scene_text
            paragraph: 23
            text: "\"Enrique...\" the revenant says, as she seems to be recalling some distant memories. \"Yes, Enrique is a good man... I'm sure he will take good care of the children. Thank you.\"\r\n\r\nThe feeling of anxiousness that could be seen in the revenant's eyes is now turning into one of relief. Those human emotions do not last long, however, because soon afterwards, the look in her eyes turns back to the empty, expressionless gaze that she had before.\r\n\r\n\"Wow, it sure has been a while since we finished our first trials,\" Daren says, after some time. \"I wonder why it's taking so long for the second stage to start...\"\r\n\r\n\"I'll tell you why,\" Arraka says. \"It's because you shmucks gave Selkram so much raw material to work with in the first stage, that he's still busy converting it all into energy.\"\r\n\r\n\"What?...\" Daren says.\r\n\r\n\"Your negative emotions!\" Arraka says. \"That's the raw material that Selkram is using to convert into magical energy. And while you losers were busy repeating those rituals over and over, sinking into the depths of despair or cursing the God of Time, you were giving him exactly what he wanted. Honestly, I think he got so much energy from you people, that he might not even NEED a second stage from your group. I guess we'll see about that soon enough.\""
          - source: scene_text_2
            paragraph: 26
            text: |-
              "Bueno, me alegra haber sido de ayuda", dice Daren, en un tono seco. "Supongo que eso nos da más tiempo para investigar la zona, entonces. Vamos, Hadrik, intentemos interactuar con más de estos insectos y árboles congelados. Quizá podamos encontrar uno que no esté protegido por un escudo invisible e impenetrable, para poder cancelar de una vez este maldito hechizo que congela el tiempo."

              Aunque Daren y Hadrik tuvieron bastante más tiempo para patrullar la zona, no lograron encontrar nada útil. Finalmente, una luz blanca brillante cubrió nuestra zona una vez más, y esta vez, pude sentir que todo mi cuerpo estaba siendo transportado a otro lugar, en vez de solo mi consciencia.

              Cuando la luz se desvanece, todos nos encontramos en medio de una ciudad que es... inusual, por decir lo menos. Lo primero que me llama la atención es que hay una torre negra muy grande en cada esquina de la ciudad, y en lo alto de cada una de estas cuatro torres, hay una cantidad increíble de energía mágica, que puede verse incluso a simple vista. La energía tiene un color púrpura, y se mueve salvajemente en todas direcciones, como si estuviera intentando escapar de su prisión. A cada lado de estas torres de trescientos metros de altura, hay grandes plataformas flotantes, que suben y bajan a una velocidad lenta, y parecen estar transportando a cientos de personas hacia los niveles de las torres a los que necesitan llegar.
          - source: scene_3
            paragraph: 16
            text: 'Dejando a un lado estos extraños y altos edificios, lo que es aún más peculiar es lo que está ocurriendo directamente sobre nosotros. En este momento, hay cientos de carruajes metálicos sin caballos, volando por el aire, con gente dentro. Mientras estos carruajes vuelan de un lado a otro, hay grandes pantallas holográficas flotando sobre nosotros, mostrando a un hombre que está retransmitiendo el mismo mensaje, una y otra vez, en la lengua común. Las pantallas holográficas se parecen exactamente a las que fueron creadas por el dispositivo de ilusión de Golmyck, cuando anunció nuestros primeros objetivos. El mensaje que se repite constantemente es: ''Todos los ciudadanos no lessathi deben presentarse en la zona de reserva militar inmediatamente. Estamos bajo ataque. Repito, ¡estamos bajo ataque!''.'
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch11c_frenzy
  - name: b2_ch11c_jewelry
    texts:
      - source: scene_text
        paragraph: 24
        text: |-
          "¡Cuidado!", dice Daren. "¡Los cuchillos de Dave el Degollador tienen vida propia. Van a seguir atacándote, aunque los desvíes!"

          "¡Oh, no!", dice Melindra, en un tono sarcástico. "¿Qué voy a hacer?"

          Entonces lanza un hechizo que rodea cada uno de los cuchillos que la estaban atacando con sus propias corrientes de aire mágicas, haciéndolos detenerse y girar en el aire, indefinidamente. Dave el Degollador sigue agitando los brazos y las piernas en el aire, con la esperanza de poder liberarse del hechizo de Melindra, pero finalmente llega a nuestra posición, y Melindra le echa un buen vistazo largo antes de dirigirse a él de nuevo.

          "¿Por qué estás tan alterado, degollador?", dice Melindra. "¿Es porque cancelaste accidentalmente tu hechizo de invisibilidad cuando entraste en pánico antes? ¿O tu ritual fue tan terrorífico que todavía no lo has superado? ¿Cómo consigue un maleante como tú acceso a un hechizo de invisibilidad tan sofisticado?"

          "Como si fuera tan estúpido de decirte de dónde saqué el elixir", dice Dave el Degollador. "Soy demasiado listo para que me vengas con jueguecitos mentales, ¿entiendes?"
      - source: scene_text_2
        paragraph: 27
        text: |-
          "¡Oh, así que fue un elixir lo que te hizo invisible!", dice Melindra. "Interesante."

          "También tenía un pergamino de teletransporte caro, la última vez que luchamos contra él, que usó para escapar de nosotros", dice Daren. "No me sorprendería que también tuviera otros objetos mágicos, escondidos en sus bolsillos."

          "¿Ah, sí?", dice Melindra. "¡Veamos qué más tiene, entonces!"

          En cuanto deja de hablar, Melindra lanza un hechizo que hace que unos cuantos objetos salgan flotando de los bolsillos del degollador, y caigan en sus manos. En su mano derecha, ahora sostiene un pequeño frasco, que está cerrado con un corcho y tiene un líquido verde dentro, mientras que en su mano izquierda tiene dos pergaminos enrollados que probablemente sean pergaminos de teletransporte de un solo uso, como el que el degollador había usado antes.

          "¡Maldita ladrona!", grita Dave el Degollador, furioso, mientras Melindra hace flotar el frasco en el aire, frente a ella, mientras desenrolla los pergaminos, para echarles un vistazo rápido. "¡Devuélveme mis cosas, o te prometo que vas a acabar llena de agujeros!"
      - source: scene_3
        paragraph: 17
        text: |-
          "¿Me lo prometes?", dice Melindra, mientras mira fijamente al degollador con una mirada de curiosidad en los ojos. "Estoy intrigada. ¿No te das cuenta de a quién estás amenazando ahora mismo? ¿O este torneo te ha robado completamente el sentido común?"

          "¿Crees que puedes asustarme?", dice Dave el Degollador. "¿Solo porque eres una stillwater? Tu amigo con armadura de ahí también fue aclamado como un mago legendario, y eso no impidió que lo pusiera de rodillas. ¿Qué te hace pensar que tú eres tan especial?"

          "Espera", dice Arraka. "¿El sanador perdió una pelea contra este debilucho? ¡Ja, ja, ja, ja, ja! Esa es una de las cosas más graciosas que he oído en mi vida."

          "¿A quién llamas debilucho, joya de pacotilla?", dice Dave el Degollador.

          "¡Me ha llamado joya!", dice Arraka. "¡Ja, ja, ja, ja, ja! ¡Es demasiado! ¡No puedo más! ¡Hagan que se calle, o voy a terminar muriéndome de risa!"
    choices:
      - position: 1
        text: Pedirle a Melindra si puedo quedarme los objetos de Dave el Degollador.
        effects:
          - set:
              current_scene: b2_ch11c_items
              b2_ch11_items: 1
      - position: 2
        text: Dejar que Melindra haga lo que quiera con los objetos.
        effects:
          - set:
              current_scene: b2_ch11c_items
              b2_ch11_items: 0
  - name: b2_ch11c_items
    effects:
      - set:
          ac_b2_ch11_elephant: 1
        achievement:
          id: ac_b2_ch11_elephant
          title: El elefante en la habitación
        condition: ch3_kate_badly_hurt = 1
    routes:
      - condition: b2_ch11_items = 1
        texts:
          - source: scene_text
            paragraph: 25
            text: |-
              "Oye, Melindra", digo. "¿Puedo quedarme con esos objetos?"

              "Claro", dice Melindra, mientras me entrega los pergaminos y el elixir. "Son todos tuyos."

              El hecho de que no lo pensara dos veces antes de dármelos me hizo sospechar un poco, así que lo primero que hice al tenerlos fue leer lo que estaba escrito en los pergaminos. Como sospechaba, los pergaminos parecen estar hechos específicamente para el degollador, y no pueden ser usados por nadie más que él. No puedo decir mucho sobre el elixir, pero considerando que Dave el Degollador se tomó la molestia de conseguir pergaminos que solo funcionaran para él, no me sorprendería que este líquido verde actuara de forma similar.

              Melindra me dedica una sonrisa burlona cuando ve que he terminado de leer los pergaminos.

              "Como probablemente ya habrás descubierto, esos pergaminos son completamente inútiles para nosotros", me dice Melindra. "El elixir podría funcionar, pero personalmente yo no me arriesgaría. ¿Quién sabe qué efectos secundarios desagradables podría tener, si lo usara la persona equivocada?"

              "Bueno, aun así es mejor que nada", digo. "Me lo quedaré por ahora."

              Entonces meto el frasco en mi mochila, y rompo los pergaminos de teletransporte en pedazos, para asegurarme de que el degollador no pueda volver a usarlos.
          - source: scene_text_2
            paragraph: 28
            text: |-
              "Todos vais a pagar por esto", dice Dave el Degollador, mientras nos mira con furia. "¿Creéis que podéis meteros con Dave el Degollador y salir impunes? ¡Estáis mirando al futuro ganador de este torneo! No tenéis ni idea de lo grande que es el error que habéis cometido."

              "¿El futuro ganador del torneo?", dice Arraka. "¡Caramba! Barry, ¡parece que por fin has encontrado una competencia digna!"

              "Cállate", le digo.

              "Creo que ya he oído suficiente", dice Kate, mientras lanza tres conos de hielo directamente a la cara del degollador.

              Dave el Degollador reacciona casi al instante, y envía tres de los cuchillos que tenía en el cinturón para desviar los conos de hielo en el último segundo.
          - source: scene_3
            paragraph: 18
            text: |-
              "Ey, tranquila...", dice Dave el Degollador, mientras ahora suda un poco. "¿Atacar a un hombre mientras está indefenso es lo único que puedes... ¡¿qué demonios?! Joder, mujer, ¿qué le pasa a tu cara? Esa quemadura es una cicatriz HORRIBLE. ¿Qué hiciste, meterte en una pelea con un dragón?"

              Las palabras del degollador solo sirven para cabrear aún más a Kate, y ahora está preparando unos conos de hielo adicionales, para asegurarse de que no pueda volver a desviarlos.
            condition: ch3_kate_badly_hurt = 1
          - source: scene_3
            paragraph: 19
            text: |-
              "Ey, tranquila...", dice Dave el Degollador, mientras ahora suda un poco. "¿Atacar a un hombre mientras está indefenso es lo único que puedes hacer? ¿Qué tal si hacemos de esto una pelea justa, en vez de que os juntéis todos contra mí, como unos matones callejeros?"

              Kate ignora la petición del degollador, y ahora está preparando unos conos de hielo adicionales, para asegurarse de que no pueda volver a desviarlos.
            condition: ch3_kate_badly_hurt = 0
