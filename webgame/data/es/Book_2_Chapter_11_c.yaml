            paragraph: 13
            text: |-
              "Bueno, hay una forma de obtener pistas sobre lo que ocurrirá en la siguiente prueba", dice el revenant. "El método más fácil para obtener esas pistas habría sido hacer uso de la estadística de audición de Barry, pero desgraciadamente eso ya no es una opción."

              "¿Por qué no?", pregunto.

              "Porque te negaste a mantener abierto el canal de comunicación entre nuestros dos transceptores, como te pedí", dice el revenant. "Había una acción importante que tenías que llevar a cabo justo antes de la congelación del tiempo, pero no podía ser demasiado específica al respecto, porque de lo contrario el Dios de la Muerte podría haber interceptado nuestra conversación y haber llegado a la conclusión de que yo estaba conspirando con el enemigo. En cualquier caso, ya es demasiado tarde para eso. Hay otra forma de averiguar la información que necesitamos, pero es menos efectiva. ¿Alguien en este grupo tiene un sentido mágico particularmente agudo?"
