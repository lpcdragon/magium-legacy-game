  - name: b2_ch11c_paranoid
    texts:
      - source: scene_text
        paragraph: 12
        text: |-
          "Daren...", dice Kate, mientras se acerca a él y al revenant. "No fue culpa suya. El seguidor del Dios de la Muerte llamado Zack fue quien lanzó el hechizo. No fue ella quien pidió que la metieran en este cuerpo, ni fue ella quien pidió servir al Dios de la Muerte. Realmente no podemos culparla de nada de esto."

          Entonces se acerca al revenant y toma ambas manos con delicadeza mientras la mira a los ojos.

          "Escucha", dice Kate. "No estoy segura de cómo llamarte. 'Revenant' suena demasiado frío, pero también soy consciente de que no eres la Rose que yo conozco. Sin embargo, si queda algo de Rose dentro de ti, como dijiste, entonces, por favor, ven a viajar con nosotros. Olvídate del Dios de la Muerte. No tienes que dejar que te controle más. Podemos intentar escondernos juntos de él, o podríamos luchar contra él, o... algo. No tienes que pasar por todo esto sola."

          El revenant retira sus manos de las de Kate y da un paso atrás, mientras su mirada inexpresiva se transforma momentáneamente en una de tristeza y arrepentimiento.

          "Lo siento", dice el revenant. "No soy quien crees que soy. Deberías evitar intentar acercarte más a mí, por tu propia seguridad. No estaba mintiendo cuando dije que los mataría sin vacilar si mi amo me lo ordenara. Mi lealtad hacia el Dios de la Muerte siempre será lo primero, y necesitas entender eso. Si depositas demasiada confianza en mí, solo acabarás saliendo herida. Es la parte de Rose en mí la que te está advirtiendo que te mantengas alejada. ¿Puedes entender eso?..."
      - source: scene_text_2
        paragraph: 12
        text: |-
          "Sí", dice Kate, con una mirada algo decepcionada en los ojos, mientras retrocede unos pasos. "Lo entiendo. No volveré a intentar meterme en tus asuntos. Y gracias por la advertencia..."

          "Y bien, ¿qué vamos a hacer ahora?", dice Hadrik. "¿Trabajar juntos como si nada hubiera pasado?"

          "No parece que tengamos muchas opciones", dice Daren a regañadientes, mientras envaina su espada.

          "¿Y qué hay del Dios de la Muerte?", dice Melindra en un tono serio, con los brazos cruzados. "¿Qué le vas a decir cuando vuelvas, revenant?"

          "Si alguna vez pregunta, le diré la verdad", dice el revenant. "Le diré que fui yo quien inició la pelea porque quería demostrar mi superioridad. De esa forma, no debería haber motivo para que guarde ningún resentimiento contra su grupo."

          "Ya veo...", dice Melindra.

          "Sin embargo", dice el revenant, "no creo que el Dios de la Muerte me pregunte nada cuando regrese. Desde su punto de vista, no habrá pasado nada, ya que el tiempo seguirá congelado hasta que yo vuelva. Lo más probable es que siga ignorándome, como ha estado haciendo desde que lo contacté por primera vez, y me veré obligada a seguir esperando en uno de sus templos hasta que considere oportuno darme una orden."

          "¿Te está ignorando?", pregunta Kate. "Pero... ¿por qué?"
      - source: scene_3
        paragraph: 9
        text: |-
          "El Dios de la Muerte no confía en mí", dice el revenant. "Cree que soy una agente encubierta enviada por el Dios del Tiempo para infiltrarse entre sus seguidores, y nada de lo que he dicho ha logrado hacerle cambiar de opinión al respecto. Incluso intentó matarme unas cuantas veces, pero desistió cuando vio que era imposible. Actualmente, no se me permite abandonar el templo al que entré cuando lo contacté por primera vez, y me mantiene en la ignorancia sobre la mayoría de sus planes, por miedo a que pueda filtrar la información al Dios del Tiempo."

          Arraka se ríe.

          "¡Eso suena muy propio de él!", dice. "Ulruk siempre ha sido muy paranoico en lo que respecta al Dios del Tiempo. Solo puedo imaginar lo impactado que se quedó cuando encontró a una tejedora del tiempo justo en la puerta de su casa, sea revenant o no. Más vale que te busques un pasatiempo, porque probablemente vas a estar sentada en ese templo durante mucho tiempo."
