            text: |-
              "Bueno, hay una forma de obtener pistas sobre lo que ocurrirá en la siguiente prueba", dice el revenant. "El método más fácil para obtener esas pistas es hacer uso de la estadística de audición de Barry, pero desgraciadamente no pude comunicar demasiada información a su grupo sobre este tema, por miedo a que el Dios de la Muerte interceptara nuestra conversación y llegara a la conclusión de que yo estaba conspirando con el enemigo. No estoy segura de cuánto de mi mensaje les llegó. Barry, ¿lograste activar el código secreto de tu dispositivo de estadísticas antes de que el tiempo se congelara?"

              "Lo siento", digo. "No conozco ningún código secreto del dispositivo de estadísticas. Ni siquiera sabía que tuviera alguno."

