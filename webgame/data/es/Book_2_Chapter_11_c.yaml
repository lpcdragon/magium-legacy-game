                  current_scene: b2_ch11c_asleep
  - name: b2_ch11c_asleep
    texts:
      - source: scene_text
        paragraph: 11
        text: |-
          "Buen farol el que tienes ahí, revenant", dice Daren, mientras envaina su espada y luego agarra el brazo del revenant con ambas manos, presionando el cuchillo aún más contra su propia garganta. "Por desgracia, como puedes comprobar, tu cuchillo no es ni de lejos lo bastante afilado como para atravesar siquiera mi escasa protección mágica contra ataques físicos."

          El revenant empieza a intentar soltar su mano de la de Daren, pero él mantiene un agarre firme con ambas manos mientras continúa su monólogo.

          "Por otro lado", dice Daren, "como no has desaparecido ya de este sitio, significa que mis instintos eran correctos, y que no puedes escapar del agarre de alguien usando un hechizo que congela el tiempo. Tampoco pareces tener la capacidad de revertir el tiempo a voluntad, porque si la tuvieras, ya lo habrías hecho. En otras palabras--"

          Entonces Daren tira del brazo del revenant, la levanta sobre su espalda y la lanza al suelo frente a él, asegurándose de no soltar su agarre en ningún momento.

          "-- ahora eres más vulnerable que nunca", continúa Daren con su frase anterior, mientras desenvaina su espada con la otra mano, sin dejar de sujetar al revenant.

          Entonces le asesta un tajo rápido en la garganta con su hoja y le cercena la cabeza de los hombros de un solo movimiento.

          "Daren...", dice Kate, casi a punto de llorar. "¿Qué has hecho?..."
      - source: scene_text_2
        paragraph: 11
        text: |-
          "Solo hice lo que tenía que--", oigo decir a Daren, pero de repente todo en mi mente se convierte en un borrón completo, y entonces tengo la sensación muy extraña de que acabo de despertar de un sueño.

          En vez de ver al revenant muerto frente a mis ojos, vuelvo a presenciar la escena en la que le pone un cuchillo en la garganta a Daren por segunda vez, solo que ahora no espera a que él la agarre, y salta hacia atrás inmediatamente, asegurándose de estar fuera de su alcance de ataque.

          ¿Qué está pasando aquí? ¿De verdad me quedé dormido en medio de la batalla y tuve un sueño donde Daren mataba al revenant? ¿Es posible que me haya alcanzado un hechizo que afecta a la mente sin darme cuenta? Puedo distinguir claramente que esto es la realidad, y que lo que vi antes solo estaba en mi imaginación, pero ¿por qué habría tenido semejante visión en un momento tan tenso como este?

          "No...", dice Daren, aparentemente en estado de shock, mientras señala al revenant. "Eso no es posible. Estabas muerta. Me aseguré de ello. Incluso un revenant morirá si le cortan la cabeza limpiamente de los hombros. Y sin embargo, vi con mis propios ojos cómo todo se revirtió, ¡igual que aquella vez cuando Arraka salió del amuleto! ¿Quién fue el que revirtió el tiempo, si no fuiste tú?"
      - source: scene_3
        paragraph: 8
        text: |-
          ¿Un hechizo de reversión temporal?... ¡Claro! Ahora entiendo por qué sentí como si me despertara de un sueño. El tiempo solo se revirtió para Daren y el revenant, así que ellos fueron los únicos que llegaron a ver todos los efectos del hechizo. Para el resto de nosotros, que no quedamos atrapados en el área de efecto del hechizo, fue como si estos eventos nunca hubieran ocurrido...

          "El tiempo no se revirtió como resultado de un hechizo que yo lancé", dice el revenant. "Se revirtió gracias a un rasgo que poseen todas las tejedoras del tiempo, que las protege de ser asesinadas antes de que terminen de entregar su profecía. No importa cuántas veces me maten, el tiempo siempre se revertirá a sí mismo hasta un punto en el que esté lo bastante a salvo para escapar del peligro. Por eso dije que sus actos eran inútiles. Incluso si yo muriera, aun así no podrían matarme definitivamente."

          "¡Mientes!", dice Daren. "Si lo que dices fuera cierto, entonces ¿cómo murió Rose? ¿Por qué el tiempo no se revirtió para salvarla, como te salvó a ti?"

          "La única razón por la que el tiempo no se revirtió para Rose fue por el hechizo de revenant que le lanzaron antes de que muriera", dice el revenant. "Al Magium no le importa quién habite el cuerpo de una tejedora del tiempo, siempre y cuando pueda seguir cumpliendo su propósito de entregar la profecía. Dado que yo ya estaba programada para tomar el cuerpo de Rose tras su muerte, no había necesidad de que el hechizo de reversión temporal se activara, así que yo me convertí en la tejedora del tiempo en su lugar."

          "Entonces... ¿Rose seguiría viva si no fuera por ti?...", pregunta Daren.
    choices:
