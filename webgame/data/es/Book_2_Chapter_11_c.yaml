  - name: b2_ch11c_frenzy
    effects:
      - set:
          b2_ch11_added_hearing: 2
        condition: b2_ch11_added_hearing = 1
    routes:
      - condition: ancient_languages = 4
        texts:
          - source: scene_text
            paragraph: 31
            text: |-
              Los carruajes voladores se mueven frenéticamente, mientras la gente a nuestro alrededor corre toda en la misma dirección, que supongo es el camino hacia la zona de reserva militar. Como si esto no fuera ya bastante inquietante, no puedo evitar notar que toda la ciudad está repleta de estandartes azul oscuro, con un halcón sosteniendo el sol en sus garras dibujado en cada uno de ellos.

              Poco después de ser transportados aquí, también oí a alguien hablando en voz alta en el idioma lessathi, a través de un amplificador mágico de voz, y el mensaje que transmitía era: 'Por favor, manténganse alejados del distrito este. El alto consejo lessathi está manteniendo una reunión importante en el gran salón, y no desea ser molestado.'

              No estoy muy seguro de qué tipo de atacante podría hacer que toda una ciudad entre en pánico así, pero algo me dice que estamos a punto de averiguarlo, muy pronto.
          - source: scene_text_2
            paragraph: 31
            text: |-
              Mientras miro a mi alrededor, de repente me doy cuenta de que ya no oigo tan bien como antes de que nos trajeran a este lugar. Rápidamente compruebo mi dispositivo de estadísticas, para confirmar mis sospechas, y veo que efectivamente los tres niveles extra en audición que me otorgó el código secreto se han perdido.

              "No puedo creerlo...", dice Melindra, mientras mira las torres negras a lo lejos. "Esas torres recubiertas de polvo de seredium se parecen exactamente al tipo de edificios que el imperio lessathi solía tener hace miles de años. Solo he leído sobre ellas en libros. Incluso hace seiscientos años, antes de que cayera el imperio lessathi, no se veía algo así en sus ciudades. Lo más cerca que he estado de ver algo parecido a estas torres fue en Ollendor, donde todavía conservan reliquias antiguas de los días de gloria del imperio lessathi, pero aun así, esas eran solo ruinas. Para que estas torres estén en tan buenas condiciones, tendríamos que haber sido enviados a cuando el imperio lessathi estaba en su máximo apogeo. ¡Hace cuatro mil, o incluso cinco mil años! ¿En qué está pensando el Dios del Tiempo?"
            condition: b2_ch11_added_hearing = 1
