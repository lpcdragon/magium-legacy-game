  - name: b2_ch11c_hesitation
    texts:
      - source: scene_text
        paragraph: 8
        text: |-
          "Ni se te ocurra hablar de Rose como si la conocieras, monstruo no muerto", dice Daren, con furia en los ojos. "¿Quién eres tú para decir lo que ella habría querido después de robarle el cuerpo e ir a servir a algún dios siniestro, dejando a sus hermanos llorando desconsolados en casa por la muerte de su hermana? No me importa que tengas su aspecto ni que tengas sus recuerdos. Nunca serás nada más que un cascarón vacío. Nunca serás nada parecido a Rose. ¿Lo entiendes? ¡Nunca!"

          Parece que las palabras de Daren han herido de verdad al revenant. La expresión inexpresiva de sus ojos ha cambiado por completo y ahora parece como si quisiera hacerle una pregunta, pero dudara en hablar.

          "¿De verdad... Suzie y Kevin lloraron cuando se enteraron de que--", empieza a decir el revenant con una voz algo temblorosa, pero Daren no le permite terminar la frase.

          "¡¡¡No los llames por sus nombres!!!", grita, furioso. "¡Tú no eres Rose! ¡No finjas ser ella! Si de verdad te importaran Rose y sus hermanos, abandonarías su cuerpo para que pudiéramos darle un entierro digno y así Suzie y Kevin al menos podrían despedirse de ella."

          "Eso no es algo que yo pueda hacer", dice el revenant, recuperando aquella mirada inexpresiva de antes. "Vivo para servir al Dios de la Muerte. Solo él puede decidir poner fin a mi vida. Nadie más."
      - source: scene_text_2
        paragraph: 8
        text: |-
          "Entonces eres nuestra enemiga", dice Daren, con una mirada oscura en los ojos. "Ya hemos visto de lo que son capaces los seguidores del Dios de la Muerte. No hay ninguna razón para que pensemos que tu dios nos trataría de forma distinta al Dios del Tiempo. ¡No hay manera de que podamos confiar en ti!"

          "El Dios de la Muerte no tiene ningún conflicto con su grupo", dice el revenant.

          "¿Pero y si lo tuviera?", pregunta Daren. "¿Y si te ordenara matarnos a todos, uno por uno? ¿Lo harías?"

          "Si el Dios de la Muerte me pidiera que los matara, lo haría sin vacilar", dice el revenant, sin cambiar en absoluto su expresión mientras habla. "No me corresponde cuestionar las órdenes de mi amo, sean cuales sean..."

          "Entonces eres demasiado peligrosa para dejarte con vida", dice Daren, empezando a acercarse al revenant. "Acabaré contigo aquí mismo, antes de que tengas ocasión de traicionarnos."
      - source: scene_3
        paragraph: 6
        text: |-
          "¡Daren, espera!", dice Kate. "No puedes matarla. Todavía hay una parte de Rose que vive dentro de ella. Has visto cómo reaccionó antes cuando le hablaste de los hermanos de Rose. Quizá todavía haya una forma de ponerla de nuestro lado. Quizá podamos--"

          "Rose se ha ido, Kate", dice Daren, con tono serio. "No puedes seguir viviendo en el pasado para siempre. Tienes que dejarla ir. Es lo que Rose habría querido si siguiera viva."

          "¡Rose nunca habría querido que mataras a esta... persona!", dice Kate. "Habría querido que trabajáramos juntos. ¡Lo sabes!"

          "Lo siento, Kate", dice Hadrik, "pero voy a tener que darle la razón a Daren en esto. No sabemos qué está planeando el Dios de la Muerte. Por lo que sabemos, puede que esté colaborando con el Dios del Tiempo y que todavía nos estén trastornando la cabeza como parte del ritual. No podemos confiar en nada de lo que dice. Tenemos que deshacernos de ella antes de que sea ella la que nos mate primero."
    choices:
      - position: 1
        text: Interponerme entre el revenant y Daren para defenderla
        effects:
          - set:
              current_scene: b2_ch11c_defend
              b2_ch11_defend: 1
      - position: 2
        text: Dejar que Daren y Hadrik manejen la situación
        effects:
          - set:
              current_scene: b2_ch11c_defend
              b2_ch11_defend: 0
  - name: b2_ch11c_defend
    routes:
      - condition: b2_ch11_defend = 1
        texts:
          - source: scene_text
            paragraph: 9
            text: |-
              En cuanto Hadrik deja de hablar, Daren reanuda su marcha hacia el revenant con la espada en la mano, pero antes de que llegue a alcanzarlo me interpongo entre los dos, de cara a Daren.

              "Barry, ¿qué te crees que estás haciendo?", pregunta Daren, deteniéndose frente a mí.

              "¿A ti qué te parece que estoy haciendo?", le digo a Daren mientras saco mi daga.

              "No iremos a hacer esto otra vez, ¿verdad?", dice Daren. "Esto no es como aquella vez con Illuna. El revenant literalmente acaba de decir que nos matará en cuanto tenga la primera oportunidad, si su dios se lo ordena. Es un peligro para todos nosotros. ¿Por qué la estás defendiendo?"

              "Solo será un peligro para nosotros si resulta que su dios es nuestro enemigo", digo. "Tal y como están las cosas, sus poderes del tiempo podrían venirnos realmente bien justo ahora. Sobre todo si la siguiente fase del ritual exige que trabajemos como grupo."

              "¡Si vamos a tener que trabajar como grupo, con más razón hay que ocuparse de ella ahora!", dice Daren. "¿Quién te dice que no nos apuñalará por la espalda a mitad de la prueba? No conocemos sus verdaderas intenciones. Y aunque supiéramos con certeza que esta vez no va a traicionarnos, puede que esta sea la única oportunidad que tengamos de enfrentarnos a ella a solas. ¿Y si la próxima vez que venga trae consigo a todo un equipo de magos que le haya dado el Dios de la Muerte para darnos caza?"

              "¿Y si no logras matarla?", digo. "¿Y entonces qué? ¿Te das cuenta de que atacarla sin provocación equivaldría a declararle la guerra al propio Dios de la Muerte? ¿Quieres que tengamos a dos dioses como enemigos al mismo tiempo?"
          - source: scene_text_2
            paragraph: 9
            text: |-
              "No fracasaremos si trabajamos todos juntos", dice Daren.

              "Daren tiene razón", dice Hadrik, acercándose a nosotros. "Incluso esos hechizos del tiempo suyos tienen que tener sus limitaciones. Si trabajamos todos juntos, deberíamos ser capaces de averiguar cuáles son."

              De repente se forma un enorme muro de hielo frente a mí, separándonos al revenant y a mí de Daren y Hadrik.

              "¿Qué tal si todos nos calmamos y hacemos una pausa antes de hacer una estupidez de verdad?", dice Kate con un tono gélido.

              "Agradezco lo que intentan hacer los dos", dice el revenant, mientras se aparta de mí y empieza a rodear el muro de hielo, "pero les aseguro que no hace falta. De hecho, creo que tanto Daren como Hadrik necesitan experimentar la inutilidad de sus actos antes de estar listos para trabajar conmigo como equipo. Por favor, no me presten ayuda. Lucharé yo sola contra los dos."

              "Eso suena muy valiente", dice Hadrik con una sonrisa. "Veamos si eres capaz de respaldarlo."
          - source: scene_3
            paragraph: 7
            text: |-
              Entonces se lanza de inmediato hacia su oponente a gran velocidad e intenta golpearlo con un puñetazo, pero el revenant simplemente desaparece justo antes de que el golpe llegue a alcanzarlo y reaparece mucho más lejos, mirándolo con su habitual falta de emoción humana en los ojos. Hadrik no se deja intimidar e intenta abalanzarse sobre él otra vez, aunque el resultado es el mismo. A la tercera es Daren quien intenta cortarlo con su espada, pero este también esquiva ese ataque sin esfuerzo, desapareciendo y reapareciendo igual que las dos veces anteriores.

              "¿Qué demonios?...", dice Hadrik. "¿Cómo demonios sigues haciendo eso? ¡Creía que el tiempo ya estaba congelado!"

              "Está congelado para el resto del mundo, pero no para ustedes", dice el revenant. "Lo único que necesito es congelarlos en el tiempo junto con el resto del mundo y entonces tendré tiempo de sobra para apartarme de su camino antes de que lleguen a asestar el golpe. Pero estos poderes no sirven solo para defenderse. También son muy útiles para atacar. Como por ejemplo así."

              Entonces vuelve a desaparecer, pero esta vez reaparece justo detrás de Daren, sujetándole un cuchillo en la garganta.

              "¿Te rindes, sanador, o tenemos que continuar?", dice el revenant.
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch11c_asleep
      - condition: b2_ch11_defend = 0
        texts:
          - source: scene_text
            paragraph: 10
            text: |-
              En vez de intervenir, elijo guardar silencio y dejar que Daren y Hadrik manejen la situación.

              "No te acerques más a ella", le dice Kate a Daren, mientras él sigue acercándose al revenant. "¡Te lo advierto!"

              "¿Qué quieres que haga?", dice Daren, deteniéndose temporalmente para volverse hacia Kate. "¿Tratarla como si fuera nuestra aliada? Sabes que no puedo hacer eso. No después de lo que ha dicho."

              "Solo digo que no deberíamos atacarla sin provocación", dice Kate. "No veo motivo para poner en nuestra contra a ella y a su dios a menos que sea absolutamente necesario."

              "¡Pero esta puede ser nuestra única oportunidad de luchar contra ella mientras está sola!", dice Daren. "¿Y si la próxima vez que nos encontremos con ella trae consigo a todo un ejército de no muertos que le haya dado el Dios de la Muerte para darnos caza? ¡No podemos arriesgarnos a eso!"

              "Daren tiene razón", dice Hadrik, acercándose a Daren. "Si vamos a pelear contra ella, esta es nuestra mejor oportunidad. Incluso esos hechizos del tiempo suyos tienen que tener sus limitaciones. Si trabajamos todos juntos, deberíamos ser capaces de averiguar cuáles son."

              De repente se forma un gran muro de hielo frente a Daren, separándolo a él y a Hadrik del revenant.
          - source: scene_text_2
            paragraph: 10
            text: |-
              "¿Qué tal si todos nos calmamos y hacemos una pausa antes de hacer una estupidez de verdad?", dice Kate con un tono gélido.

              "Kate, agradezco lo que intentas hacer", dice el revenant, mientras se aparta de su posición actual y empieza a rodear el muro de hielo, "pero te aseguro que no hace falta. De hecho, creo que tanto Daren como Hadrik necesitan experimentar la inutilidad de sus actos antes de estar listos para trabajar conmigo como equipo. Por favor, no me presten ayuda. Lucharé yo sola contra los dos."

              "Eso suena muy valiente", dice Hadrik con una sonrisa. "Veamos si eres capaz de respaldarlo."
          - source: scene_3
            paragraph: 7
            text: |-
              Entonces se lanza de inmediato hacia su oponente a gran velocidad e intenta golpearlo con un puñetazo, pero el revenant simplemente desaparece justo antes de que el golpe llegue a alcanzarlo y reaparece mucho más lejos, mirándolo con su habitual falta de emoción humana en los ojos. Hadrik no se deja intimidar e intenta abalanzarse sobre él otra vez, aunque el resultado es el mismo. A la tercera es Daren quien intenta cortarlo con su espada, pero este también esquiva ese ataque sin esfuerzo, desapareciendo y reapareciendo igual que las dos veces anteriores.

              "¿Qué demonios?...", dice Hadrik. "¿Cómo demonios sigues haciendo eso? ¡Creía que el tiempo ya estaba congelado!"

              "Está congelado para el resto del mundo, pero no para ustedes", dice el revenant. "Lo único que necesito es congelarlos en el tiempo junto con el resto del mundo y entonces tendré tiempo de sobra para apartarme de su camino antes de que lleguen a asestar el golpe. Pero estos poderes no sirven solo para defenderse. También son muy útiles para atacar. Como por ejemplo así."

              Entonces vuelve a desaparecer, pero esta vez reaparece justo detrás de Daren, sujetándole un cuchillo en la garganta.

              "¿Te rindes, sanador, o tenemos que continuar?", dice el revenant.
        choices:
