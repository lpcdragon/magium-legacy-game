              "Sin ánimo de ofender", dice Kate, "pero creo que podemos correr más rápido de lo que Melindra puede llevarnos con sus corrientes de aire."

              "De todas formas no hay tantos obstáculos", dice Arraka. "Solo es un camino largo hasta llegar."
            condition: ch4_spared_dave = 0
          - source: scene_3
            paragraph: 23
            text: |-
              Mientras seguimos corriendo, al revenant de repente le da un fuerte dolor de cabeza, que le hace perder el control sobre su hechizo que congela el tiempo. Una vez que el tiempo se descongela, desafortunadamente la Arraka del pasado no tarda más de tres segundos en teletransportarse justo delante de nosotros, y bloquear nuestro camino.

              "Qué lástima", dice la Arraka del pasado. "Estuvieron tan cerca de escapar. Es una pena que la tejedora del tiempo no pudiera aguantar el hechizo un poco más. Francamente, me sorprende que aguantara tanto como lo hizo. Después de todo, lo primero que hice cuando llegué, antes, fue lanzar un hechizo que impedía a todos en la zona usar poderes temporales. Supongo que debía tener algún tipo de protección contra el mareo, ¿no? Bueno, da igual. Al final, no les sirvió de nada. La tejedora del tiempo está demasiado cansada para concentrarse ahora, así que lo único que pueden hacer es--"
