  - name: b2_ch11c_herbalist
    routes:
      - condition: ch11_saved_slave <> 3
        texts:
          - source: scene_text
            paragraph: 2
            text: |-
              "Rose, escúchame", digo, colocándome delante de ella. "Arraka me enseñó tu ritual. Sé que va a ser duro, pero vas a tener que--"

              "No es suficiente...", dice Rose de repente, mientras sigue mirando al frente.

              "¿Qué?...", le pregunto, confundido.

              "Barry, ¡no es suficiente!", dice Rose, mirándome por fin a los ojos. "Nada de lo que he hecho hasta ahora en mi vida se acerca siquiera a lo que debería haber hecho. No puedo seguir escondiéndome detrás de mi impotencia. No puedo seguir viviendo así. ¡Tengo que hacer más!"

              "¿Qué quieres decir?", digo. "¿Más por quién? ¿Por los esclavos?"

              "No solo por los esclavos...", dice Rose. "Sino por todos a quienes he ignorado a lo largo de mi vida, pensando que yo no podía marcar ninguna diferencia. Ya no puedo seguir cerrando los ojos ante su sufrimiento. ¡Quiero ayudarlos a todos!"
          - source: scene_text_2
            paragraph: 2
            text: |-
              "Rose", dice Daren. "Eso es... muy noble por tu parte, pero tienes que entender que no puedes ayudar a la gente solo a base de buena voluntad. Ya has hecho más que de sobra recolectando hierbas y curando a los enfermos de Thilias. Incluso acogiste a Ella en tu casa, sabiendo perfectamente a qué riesgos te exponías. No puedes culparte por cosas que te habría sido imposible hacer. Nadie espera que te embarques en una misión para arreglar los males del mundo. Ni siquiera eres una maga. No tienes poder para cambiar el mundo de una forma más significativa de la que ya lo has hecho."

              "¿Ah, no?", dice Rose. "Entonces ¿y este mundo congelado que nos rodea? ¿No ha sido cosa mía?"

              "Eso solo ha pasado por la profecía", dice Daren. "Sabes perfectamente que nunca has tenido ningún control sobre--"

              Antes de que Daren llegue a terminar lo que estaba diciendo, Rose desaparece del lugar donde estaba y reaparece a unos cuatro metros de su posición original, con una sonrisa triunfal en la cara.
          - source: scene_3
            paragraph: 2
            text: |-
              "Oye, eso no ha estado nada mal, chica herborista", dice Melindra, con una sonrisa impresionada. "Nada mal."

              "¡Rose, eso ha sido increíble!", dice Kate, mientras la expresión de agotamiento desaparece de su cara. "¿Cómo lo has hecho?"

              "No lo sé", dice Rose. "Me siento... distinta. Como si mi cabeza estuviera inundándose constantemente de información que apenas puedo procesar. Sigo sin poder usar todos mis poderes del tiempo, pero ahora mismo todo me resulta muchísimo más natural."

              "¡Ja!", dice Arraka. "No te hagas demasiadas ilusiones, herborista. Esto solo está pasando porque sigues vinculada al Magium. En cuanto termines con la profecía, olvidarás por completo cómo usar estos poderes y volverás a ser la misma chica aburrida y sin poderes de antes."

              "Si voy a olvidar cómo usar mis poderes, entonces simplemente tendré que aprenderlos de nuevo", dice Rose, con una expresión muy decidida en los ojos. "Practicaré día y noche hasta ser capaz de usarlos a la perfección. No quiero volver a ser como antes. ¡Esta vez quiero marcar una diferencia de verdad!"
        choices:
          - position: 1
            text: Animar a Rose con su decisión
            effects:
              - set:
                  current_scene: b2_ch11c_encourage
                  b2_ch11_encourage: 1
          - position: 2
            text: Intentar convencer a Rose de que su plan es demasiado peligroso
            effects:
              - set:
                  current_scene: b2_ch11c_encourage
                  b2_ch11_encourage: 0
          - position: 3
            text: Decirle a Rose que su plan suena estúpido
            effects:
              - set:
                  current_scene: b2_ch11c_encourage
                  b2_ch11_encourage: 2
      - condition: ch11_saved_slave = 3
        texts:
          - source: scene_text
