            effects:
              - set:
                  current_scene: b2_ch11c_practice
      - condition: b2_ch11_encourage = 2
        texts:
          - source: scene_text
            paragraph: 5
            text: |-
              "Lo siento, pero tu plan me parece un poco tonto", digo. "¿Seguro que no quieres pensártelo un poco mejor antes de embarcarte en un viaje tan temerario?"

              "De entre todos los presentes, tú eras la última persona de la que esperaba una crítica por ser imprudente, Barry", dice Rose. "Pero, para responder a tu pregunta, no, ya he tomado una decisión y no pienso echarme atrás respecto a lo que he dicho. Aunque me lleve años hacerlo, aprenderé a controlar estos poderes y luego los usaré para cambiar este mundo a mejor."

