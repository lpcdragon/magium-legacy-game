            paragraph: 34
            text: |-
              "¿Cómo funcionan estas torres, exactamente?"

              "Por lo que sé", dice Melindra, "la energía de estas torres supuestamente era cargada por magos de la ciudad, que trabajaban voluntariamente cada día para mantener la energía viva, y que recibían pagos mensuales del imperio como recompensa por sus contribuciones a su sociedad. Esta energía se usaba entonces para alimentar estos vehículos voladores que ven sobre nosotros, y también otros dispositivos tecnológicamente avanzados que hacían la vida más fácil para todos los ciudadanos."
