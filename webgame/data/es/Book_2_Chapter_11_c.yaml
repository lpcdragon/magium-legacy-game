scenes:
  - name: b2_ch11c_credits
    effects:
      - set:
          iap_check_resume: 1
        condition: iap_checked <> 0 AND iap_checked <> 2
      - set:
          second_book_purchased: 1
          iap_check_resume: 0
    routes:
      - condition: second_book_purchased = 1
        texts:
          - source: scene_text
            paragraph: 49
            text: |-
              Esto marca el final del segundo libro de Magium.

              El tercer libro ha sido completado y está listo para desbloquearse, pero los libros restantes se publicarán capítulo a capítulo, a medida que los escriba. (la serie principal probablemente tendrá 5 libros en total)

              Si ya pagaste para desbloquear el tercer libro, puedes tocar el botón de abajo para continuar. De lo contrario, necesitarás completar 25 logros del segundo libro para desbloquear el tercero.

              Puedes ver cuántos logros más necesitas completar en el menú de logros.

              También me gustaría añadir que te sugiero encarecidamente que guardes la partida ahora en una ranura que no vayas a sobrescribir, si planeas empezar a completar logros, ya que de lo contrario perderás el progreso de tu partida actual y tendrás que terminar el juego otra vez para poder avanzar al siguiente libro.

              También deberías tener cuidado de no desinstalar el juego, ya que todos los libros siguientes se subirán dentro de la misma aplicación, y si desinstalas el juego, todo tu progreso local, incluidos tus logros, se perderá.

              ¡Gracias por jugar!

              P.D. Si disfrutaste el juego, no olvides recomendarlo a tus amigos.
        choices:
          - position: 1
            text: Continuar al libro 3
            effects:
              - set:
                  b2_saved_stats: 1
                  b2_strength: ${strength_aux}
                  b2_agility: ${agility_aux}
                  b2_toughness: ${toughness_aux}
                  b2_reflexes: ${reflexes_aux}
                  b2_hearing: ${hearing_aux}
                  b2_perception: ${perception_aux}
                  b2_ancient_languages: ${ancient_languages_aux}
                  b2_combat_technique: ${combat_technique_aux}
                  b2_premonition: ${premonition_aux}
                  b2_available_points: ${available_points_aux}
                  storyboard_controls: Jump to frame "Save load game"
                  current_scene: b3_ch01a_intro
                  chapter_save: 1
                  checkpoint_rich: 1
      - condition: nb_of_unlocked_achievements >= 25 AND second_book_purchased = 0
