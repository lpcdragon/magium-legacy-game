  - name: b2_ch11c_dave
    texts:
      - source: scene_text
        paragraph: 45
        text: |-
          "¿Arrodillarme?", dice Dave el Degollador, haciéndonos darnos cuenta de que él también ha sido transportado fuera del ritual, junto con nosotros. "¡¿Arrodillarme?!"

          Se pone delante de nosotros, para poder ver al dios más de cerca.

          "Dave el Degollador no se arrodilla ante nadie", dice el degollador.

          "Te arrodillarás ante tu dios, o te enfrentarás al mismo trato que los demás recibieron la última vez que me desafiaron", dice el Dios del Tiempo.

          Al oír lo que el Dios del Tiempo tiene que decir, Dave el Degollador escupe al suelo frente a él, con asco.

          "Tú no eres ningún dios", dice Dave el Degollador. "Lo único que eres es un bastardo de aspecto feo y sin cara con un ego demasiado grande. Eres como todos los magos que se unieron a este torneo. ¿Crees que puedes ir por ahí alardeando de tus poderes mágicos delante de los demás, y esperar que se dobleguen a tu voluntad? ¿Qué tal si te ganas el respeto en vez de actuar como si fuera tu derecho de nacimiento? Puedes fingir que eres especial todo lo que quieras, pero en el fondo, siempre sabrás lo que realmente eres: una mierda sin val--"
      - source: scene_text_2
        paragraph: 42
        text: |-
          Justo cuando estaba terminando su frase, Dave el Degollador desapareció ante nuestros ojos, y fue reemplazado por un humo tenue y gris que ahora se elevaba lentamente por el aire.

          "¿Qué le has hecho?...", pregunta Kate.

          "Pasará un tiempo extra en el mundo de su prueba anterior, como castigo por sus transgresiones", dice el Dios del Tiempo. "Si no está muerto para entonces, seguramente volverán a encontrárselo, cuando reanuden su ritual. Ahora, me repetiré una última vez. Arrodíllense."
