            condition: ch11_saved_rose = 1
          - source: scene_3
            paragraph: 21
            text: |-
              "¿Recuerdan cómo en cada uno de los rituales hasta ahora, Selkram los ha enviado a revivir eventos de su propio pasado?", dice Arraka. "Bueno, como dije antes, ninguno de ustedes ha vivido ni cercanamente lo suficiente para haber experimentado estos eventos actuales. Así que por proceso de eliminación, el pasado que estamos explorando ahora es muy probablemente... el mío."

              Poco después de que Arraka termine de hablar, todo el cielo se oscurece gradualmente, mientras un aura poderosa y siniestra envuelve la zona sobre nosotros. Los vehículos metálicos voladores caen uno a uno, estrellándose contra los edificios de abajo, mientras una mujer de unos treinta y tantos años emerge de las nubes oscuras y desciende hacia nosotros. Las túnicas que lleva son similares a las túnicas tradicionales de hechicero que se usaban hace cientos de años, cuando los magos todavía eran llamados hechiceros, y que solo magos tradicionalistas como Azarius siguen usando hoy en día. A medida que la mujer se acerca a nosotros, veo que sus ojos son completamente negros, y que tiene una sonrisa maliciosa muy familiar en el rostro.

              "Vaya, vaya, vaya...", dice la mujer, mientras mira hacia el amuleto de Arraka. "Parece que Selkram me ha enviado un pequeño regalo. Supongo que todos vienen del futuro, ¿verdad? Déjame comprobar el aura de mi yo futura, un segundo. Vaya... ¿Así que eres cinco mil años mayor que yo, eh? Supongo que debo haberme vuelto realmente senil con la vejez, si logré que me capturaran en un amuleto un grupo glorificado de circo. En serio, ¿qué son ustedes siquiera? ¿Una niñita vestida de payasa? ¿Un gigante haciéndose pasar por enano? ¿Una mujer vestida en pijama? Es como si estuvieran compitiendo por el grupo de hechiceros vestidos más ridículamente del siglo."
            condition: ch4_spared_dave = 1 AND ch11_saved_rose = 0
          - source: scene_3
            paragraph: 21
            text: |-
              "¿Recuerdan cómo en cada uno de los rituales hasta ahora, Selkram los ha enviado a revivir eventos de su propio pasado?", dice Arraka. "Bueno, como dije antes, ninguno de ustedes ha vivido ni cercanamente lo suficiente para haber experimentado estos eventos actuales. Así que por proceso de eliminación, el pasado que estamos explorando ahora es muy probablemente... el mío."

              Poco después de que Arraka termine de hablar, todo el cielo se oscurece gradualmente, mientras un aura poderosa y siniestra envuelve la zona sobre nosotros. Los vehículos metálicos voladores caen uno a uno, estrellándose contra los edificios de abajo, mientras una mujer de unos treinta y tantos años emerge de las nubes oscuras y desciende hacia nosotros. Las túnicas que lleva son similares a las túnicas tradicionales de hechicero que se usaban hace cientos de años, cuando los magos todavía eran llamados hechiceros, y que solo magos tradicionalistas como Azarius siguen usando hoy en día. A medida que la mujer se acerca a nosotros, veo que sus ojos son completamente negros, y que tiene una sonrisa maliciosa muy familiar en el rostro.

              "Vaya, vaya, vaya...", dice la mujer, mientras mira hacia el amuleto de Arraka. "Parece que Selkram me ha enviado un pequeño regalo. Supongo que todos vienen del futuro, ¿verdad? Déjame comprobar el aura de mi yo futura, un segundo. Vaya... ¿Así que eres cinco mil años mayor que yo, eh? Supongo que debo haberme vuelto realmente senil con la vejez, si logré que me capturaran en un amuleto un grupo glorificado de circo. En serio, ¿qué son ustedes siquiera? ¿Una niñita vestida de payasa? ¿Un gigante haciéndose pasar por enano? ¿Una mujer vestida en pijama? Es como si estuvieran compitiendo por el grupo de hechiceros vestidos más ridículamente del siglo."
            condition: ch4_spared_dave = 0
