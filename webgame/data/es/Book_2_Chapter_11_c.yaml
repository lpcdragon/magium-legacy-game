          "No", digo. "Cuatro es el nivel máximo que puedo tener en una estadística ahora mismo, y todavía no la he llevado al máximo."

          "Si el nivel máximo de tu estadística de audición es cuatro", dice el revenant, "entonces la única forma de superar ese límite habría sido activar el código secreto cuando ya tuvieras cuatro puntos en esa estadística. De lo contrario, aunque tengas puntos disponibles para gastar, el dispositivo de estadísticas no te dejará añadir manualmente ningún punto extra por encima del nivel máximo de cuatro. Lamentablemente, parece que tendremos que recurrir a mi plan secundario. También hay otra forma de averiguar la información que necesitamos, pero es menos efectiva. ¿Alguien en este grupo tiene un sentido mágico particularmente agudo?"
