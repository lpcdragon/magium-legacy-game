          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch11c_unleashes
      - condition: b2_ch11_items = 0
        texts:
          - source: scene_text
            paragraph: 26
            text: |-
              "¿Qué piensas hacer con esos objetos?", le pregunto a Melindra.

              "¿Por qué?", dice Melindra. "¿Los quieres?"

              "La verdad es que no", digo.

              "Bueno, en ese caso, ¡lo que pienso hacer es esto!", dice Melindra.

              Entonces rompe los dos pergaminos de teletransporte en pedazos, y abre el frasco, derramando todo su contenido en el suelo, mientras sonríe al degollador, que actualmente tiembla de rabia.

              "¿Para qué has hecho eso?", le pregunta Daren. "¡Podríamos haber usado esos pergaminos de teletransporte para llegar a Ollendor!"

              "No, no podríais", dice Melindra. "Ambos estaban hechos específicamente para el degollador, para que solo él pudiera usarlos. Y ese elixir de invisibilidad probablemente fue hecho de forma similar. Esos objetos habrían sido completamente inútiles para nosotros."

              "Ah", dice Daren. "Bueno, en ese caso, es mejor que te hayas deshecho de ellos, supongo..."
