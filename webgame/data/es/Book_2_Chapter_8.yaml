  - name: b2_ch08a_trade
    texts:
      - source: scene_text
        paragraph: 16
        text: |-
          "¡Gracias!" dice Melindra. "Bueno, en fin, después de varias conversaciones con Eiden, descubrí que la comida que le servían era de una calidad pésima. Como también me encargaba de servir la comida y tenía acceso a la cocina, me ofrecí a meterle a escondidas algo mejor de comer en su celda de vez en cuando, a cambio de ciertas rocas del montón que tenía en su esquina. Al principio, creyó que no hablaba en serio y aceptó el trato un poco en broma. Pero cuando de verdad me vio llevarle la comida, con la mano extendida, esperando mi premio bien ganado, se quedó bastante sorprendido. Tuve que señalar varias veces la roca que quería antes de que por fin me la diera. Además, parecía divertirse cada vez que yo describía nuestros acuerdos como intercambios justos, aunque no tengo muy claro por qué. Nunca me dijo la razón."

          Mientras Melindra habla, de pronto recuerdo mi primera conversación con Eiden, cuando yo también le ofrecí mi propia versión de un 'intercambio justo'. Después de oír esta historia, creo que empiezo a entender un poco mejor por qué soltó aquella carcajada cuando le hice mi propuesta.

          "¿Coleccionas rocas?" dice Flower de repente. "¿Todavía las llevas contigo?"

          "¡Pues claro!" dice Melindra. "Siempre las llevo conmigo. Mi colección ha crecido muchísimo en los últimos seiscientos años, pero todavía tengo aquí en mi mochila aquellas rocas originales con las que empecé. ¿Quieres verlas?"
      - source: scene_text_2
        paragraph: 15
        text: |-
          "¡Sí!" dice Flower, entusiasmada. "¡Me encantaría!"

          "Bueno, está bien, pero te aviso que no voy a bajar el ritmo", dice Melindra. "Si quieres verlas, tendrás que caminar a mi lado y te las iré enseñando mientras avanzamos."

          "¡Claro!" dice Flower, apresurándose a colocarse junto a Melindra.

          La chica stillwater se quita la mochila y empieza a sacar sus rocas una por una, pasándoselas a Flower para que pueda mirarlas bien y guardándolas de nuevo cuando termina. Como sospechaba, ninguna de las rocas parece tener un valor comercial real, y a cualquier otra persona le parecerían completamente inútiles, pero eso no impide que Flower se maraville con cada una de ellas mientras Melindra le explica con orgullo las características que la llevaron a considerar que cada piedra merecía formar parte de su colección, procurando además darle un breve resumen de dónde encontró cada una.

          Mientras Melindra y Flower mantienen su conversación, Daren nos hace una señal al resto y todos reducimos un poco el paso para hablar entre nosotros, lo bastante lejos de Melindra como para que no pueda oírnos, aunque seguimos caminando detrás de ella.

          "Entonces, ¿qué opinan hasta ahora de Melindra?" susurra Daren, asegurándose de que Melindra no nos esté prestando atención. "¿Creen que podría estar trabajando con Eiden?"
