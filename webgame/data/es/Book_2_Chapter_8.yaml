          - source: scene_text
            paragraph: 67
            text: |-
              "No olvides que también había lessathi en la ciudad."

              "No creo que los lessathi llevaran potenciadores de estadísticas encima", escribe Leila. "Hubo un lessathi que vino a amenazarme mientras estábamos en nuestras celdas y, aunque no le vi la cara porque se escondía detrás de la pared, pude notar que no llevaba dispositivo de estadísticas, porque el mío me habría avisado si lo hubiera llevado."

              "¿Un lessathi te amenazó?", pregunta Kate.

              "Sí", escribe Leila. "Intentó convencerme de que le entregara mi potenciador de estadísticas, pero me negué. Más tarde le ordenó al dueño de la arena que me lo confiscara, pero el dueño decidió no obedecerlo, porque quería que conservara el dispositivo de estadísticas para que la pelea fuera más interesante."

              "Acabo de acordarme de que había otra cosa que quería preguntarte sobre el dispositivo de estadísticas", digo. "Leila, me dijiste que tenías nivel tres tanto en fuerza como en velocidad, pero cuando estabas luchando en la arena no parecías mucho más fuerte ni más rápida que aquel trol con la regeneración elevada. ¿Tu dispositivo está defectuoso por casualidad?"

