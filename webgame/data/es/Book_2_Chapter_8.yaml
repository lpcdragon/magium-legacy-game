  - name: b2_ch08a_point
    texts:
      - source: scene_text
        paragraph: 65
        text: |-
          "Supongo que has dado en el clavo."

          "No sé qué decir", escribe Leila. "Mi dispositivo de estadísticas suele avisarme cuando hay otras personas con dispositivos en la zona, pero no reaccionó ante ninguna de las personas con las que nos cruzamos al caminar por la ciudad. Es una ciudad grande, eso sí, y mi dispositivo de estadísticas solo detecta otros si están muy cerca, así que es posible que simplemente no nos cruzáramos con ellos."

          "Acabo de acordarme de que había otra cosa que quería preguntarte sobre el dispositivo de estadísticas", digo. "Leila, me dijiste que tenías nivel tres tanto en fuerza como en velocidad, pero cuando estabas luchando en la arena no parecías mucho más fuerte ni más rápida que aquel trol con la regeneración elevada. ¿Tu dispositivo está defectuoso por casualidad?"

          "No", dice Leila. "Mi padre me dijo una vez que las estadísticas físicas del dispositivo potencian las capacidades físicas que ya tienes, y que cuanto mejor forma física tengas, más efecto tendrán esas estadísticas sobre ti. Dado que siempre he tenido una constitución muy frágil, esto es lo máximo que puedo sacar de mi dispositivo de estadísticas con mis niveles actuales."
      - source: scene_text_2
        paragraph: 44
        text: |-
          "Vaya...", digo. "Bueno, entonces supongo que todos esos meses que pasé entrenando físicamente para prepararme para este torneo no fueron una pérdida de tiempo, después de todo."

          "¿Estuviste entrenando físicamente?", dice Kate, sorprendida. "¿Y este es el resultado? Apostaría a que podría ganarte un pulso si me esforzara lo suficiente."

          "He dicho que solo lo hice durante unos cuantos meses", le digo a Kate. "Y no es que fuera lo único que hacía en ese tiempo. También tenía que investigar. La investigación que ahora estoy usando para averiguar las debilidades de Eiden y así por fin... Espera un segundo... ¿Dónde está Melindra? Juraría que la vi hace un minuto junto a la orilla del río."

          "¿A quién le importa Melindra?", dice Kate.

          "Bueno, no la vi montar su tienda", digo. "¿Crees que no piensa pasar la noche en nuestro campamento?"

          "Melindra puede irse a dormir al río, por mí", dice Kate. "No es como si fuera a ayudar en nada a vigilar el campamento. Lo que me recuerda que debería ir preparándome para tomar el primer turno. Ustedes dos deberían ir a dormir. A ninguno de los dos le toca hacer guardia esta noche, así que más vale que aprovechen el descanso."

          Decidimos seguir el consejo de Kate y cada uno se dirige a su tienda. Cuando entro en la mía, guardo el cuaderno en la mochila y me preparo para acostarme. Aún tengo cosas que me gustaría leer, pero puedo hacerlo por la mañana.
