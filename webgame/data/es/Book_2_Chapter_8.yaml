            paragraph: 55
            text: |-
              "No sé de qué estás hablando", dice Melindra, fingiendo ignorancia. "No mentí sobre nada."

              "¿Ah, no?", digo. "Entonces estás diciendo que, después de pasar más de una semana buscando a alguien que pudiera ayudarte a matar al rey de Ollendor, ibas a desperdiciar tu única oportunidad así como así porque no fuimos capaces de mantenernos firmes contra uno de los equipos de combate más fuertes de Tyrath."

              "Ya te lo dije", dice Melindra. "¡Las defensas de Ollendor no son ninguna broma! ¡Si crees que un equipo de monstruos 'de élite' puede compararse con lo que está por venir, te equivocas de medio a medio!"

              "Vale...", digo. "Entonces déjame preguntarte otra cosa. ¿Por qué exactamente necesitaste doblar las rodillas y mantener los codos pegados al cuerpo cuando lanzaste el hechizo que apartó al orco que te atacaba? Porque, hasta donde yo sé, esa postura es la que les enseñan a los elementalistas novatos al principio de su entrenamiento, para ayudarles a controlar mejor sus poderes mientras aún se están acostumbrando a ellos. ¿Sigues todavía acostumbrándote a tus poderes después de seiscientos años, Melindra?"
          - source: scene_text_2
            paragraph: 36
            text: |-
              "Yo...", empieza a decir Melindra, pero vacila y la interrumpo.

              "¿O quizá Arraka estaba hablando literalmente cuando dijo que no sabes contenerte?...", digo. "Esos locos poderes stillwater seguro que tienen algún tipo de inconveniente, ¿no? Esperaría que alguien como Eiden, que conoce todos los entresijos de la magia, encontrara una manera de sortear un problema así, pero tú no pareces de ese tipo. Todavía no has aprendido a controlar bien tus poderes stillwater, ¿verdad? Te vienen grandes y tienes miedo de meter accidentalmente demasiada potencia detrás de uno de tus hechizos y mandarnos a todos volando, mientras además te matas tú misma en el proceso por el juramento que hiciste."
