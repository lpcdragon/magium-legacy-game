        paragraph: 17
        text: |-
          "Creo que es un poco creída, pero dudo que sea una traidora."

          "Sí, Daren, creo que estás exagerando", dice Hadrik. "Ya sabíamos que era amiga de Eiden cuando aceptamos su trato. No hace falta desconfiar de ella a cada paso."

          "Lo están enfocando mal", dice Kate. "Da igual si es de fiar o no. Mientras no hablemos de información crucial delante de ella, estaremos bien."

          "¡Claro que importa, demonios!" dice Daren. "Si vamos a quedarnos rezagados así cada vez que tengamos que hablar de algo importante, va a parecer sospechoso a más no poder."

          "¿Y qué?" dice Kate. "¿Por qué nos importaría que le parezcamos sospechosos?"

          "¡Porque es parte del equipo!" dice Daren.

          "¿Lo es?" dice Kate, arqueando una ceja.

          "Escuchen", dice Daren. "Mi pregunta era si deberíamos confiar en ella o no. Si lo único que van a decir es que deberíamos ocultárselo todo, entonces es lo mismo que decir que..."
      - source: scene_text_2
        paragraph: 16
        text: |-
          "Saben", dice Melindra, al vernos a todos apiñados y muy por detrás de ella y de Flower, "si van a hablar de mí a mis espaldas, al menos podrían INTENTAR hacerlo de una forma menos evidente..."

          "¿Qué?" dice Daren con un tono falso dolorosamente obvio. "¡No, lo entendiste mal! ¡No estábamos hablando de ti! ¡Estábamos hablando de... eh... Flower!"

          "¿De mí?" dice Flower, preocupada.

          "¡Buena salida, Daren!" digo mientras le doy una palmada fuerte en la espalda. "¡No veo cómo alguien podría seguir pensando que estamos actuando de forma sospechosa después de una explicación tan bien pensada como esa!"

          "Cállate", murmura Daren, sin decir nada más.

          "Escuchen", dice Melindra, "si todos quieren tener sus conversaciones privadas sobre estrategias y esas cosas, está bien, pero ¿podrían al menos esperar a que acampemos o hagamos una pausa en algún sitio? Es molesto tener que estar pendiente de ustedes para que no se pierdan mientras también vigilo a los monstruos que intentan tendernos una emboscada."
