  - name: b2_ch08a_energizer
    texts:
      - source: scene_text
        paragraph: 74
        text: |-
          "¡No he dicho eso!"

          "Bueno, entonces ¿qué has dicho?", pregunta Melindra.

          "Yo solo... uf... ¿hablas en serio ahora mismo? Porque contigo es muy difícil saberlo."

          "¡Claro que hablo en serio!", dice Melindra. "¿Por qué no iba a hacerlo? No es que sea alguna doncella ingenua nacida ayer. Puede que aparente diecinueve años, pero llevo seiscientos años viva. Ya he estado con otros hombres. Y no es que tenga ningún motivo para no querer acostarme contigo en concreto. No me caes especialmente mal, ambos somos medio lessathi y tienes un aspecto medio decente. Bueno, quizá tirando un poco hacia la mitad baja, pero sigues estando más o menos a medio camino. Ya me entiendes."

          "No sé si estás intentando halagarme o si me estás insultando ahora mismo...", digo.

          "Mira", dice Melindra, "la cuestión es que no hay nada que nos impida divertirnos unas horas y dar el asunto por zanjado. Ni siquiera hace falta que yo beba el té de infertilidad, porque los stillwaters son estériles y no pueden tener hijos. Y el hechizo de silencio seguirá durando unas cuantas horas más, así que tampoco es que nadie vaya a poder oírnos. ¡Es la situación perfecta! Bueno, salvo por la tienda pequeña... Pero nada es perfecto."
      - source: scene_text_2
        paragraph: 48
        text: |-
          "¿Sabes qué?", digo. "Tienes razón. No sé por qué me estaba poniendo tan tenso. ¡Probemos!"

          "¡Así se habla!", dice Melindra. "Ah, pero espero que no te importe si te lanzo un hechizo energizante antes de empezar. Lo que pasa es que ya he tenido hombres que se han quedado sin fuelle a los pocos minutos y no me gustaría repetir la experiencia."

          "Bueno, mientras el hechizo no tenga efectos secundarios no deseados...", digo.

          "¡Oh, no hace falta preocuparse por eso!", dice Melindra. "No hay efectos secundarios. Que yo sepa. Y, además, también me lo voy a lanzar a mí misma, así que no serás el único afectado. En fin, prepárate, ¡que voy a lanzar el hechizo!"

          En cuanto Melindra termina de lanzar el hechizo, siento inmediatamente la energía recorriéndome todo el cuerpo. Me siento como si pudiera subir y bajar corriendo una montaña y aun así todavía me quedaran fuerzas para hacer mil flexiones. ¡Este hechizo es increíble! Aunque seguramente esté sometiendo mi cuerpo a una buena tensión, así que probablemente no sería buena idea usarlo demasiado tiempo. Bueno, unas pocas horas no van a matarme. Veamos qué tal funciona esto.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch08a_energizer2
  - name: b2_ch08a_energizer2
    texts:
      - source: scene_text
        paragraph: 75
        text: |-
          Durante las siguientes horas, Melindra y yo aprovechamos al máximo el hechizo energizante, y cuanto más pasa el tiempo, más parece que podríamos seguir así para siempre. No noto señal alguna de cansancio y, aunque hemos tenido que cambiar de postura media docena de veces por culpa del incómodo espacio en el que estamos, ninguno de los dos parecía querer dar por terminada la noche antes de tiempo.

          Cuando por fin terminamos por esa noche, ambos nos vestimos y yo me preparo para dormir las horas que queden hasta la mañana.

          "Y pensar que decías que no habías venido a este torneo a divertirte", dice Melindra con una sonrisa de suficiencia mientras se recoge el pelo en una coleta alta.

          "Vale, de acuerdo, lo admito", digo. "Puede que un poco de diversión no venga tan mal de vez en cuando."

          "¡Ese es el espíritu!", dice Melindra con una sonrisa.

          "En fin, creo que ya es hora de dormir", digo. "Todavía nos quedan unas cuantas horas hasta la mañana, así que más vale que intentemos aprovecharlas."
      - source: scene_text_2
        paragraph: 49
        text: |-
          "¿De qué estás hablando?", dice Melindra, mirándome confundida. "¿Estás bromeando?... Ya es de mañana. De hecho, lleva siendo de mañana desde hace bastante rato."

          "¿Qué?", pregunto, incrédulo. "No, no digas tonterías. Ni siquiera ha salido el sol. Ya sé que esta tienda no es muy transparente, pero aun así deberíamos poder ver al menos los rayos de luz cuando amanece."

          "Bueno, entonces supongo que fuera debe de estar muy nublado", dice Melindra. "No hace falta que me creas a mí. Tu dispositivo de estadísticas te muestra la hora del día, ¿no? Puedes comprobarlo tú mismo. Te digo que ya lleva siendo de mañana al menos dos horas, si no más."

          De repente me entra el pánico y saco mi dispositivo de estadísticas para ver qué hora es. Tal como dijo Melindra, parece que ya ha pasado con creces el amanecer. Mientras contemplo la pantalla, puedo ver la hora claramente delante de mis ojos, pero siento como si mi mente siguiera negándose a procesar la información.

          "¿Cómo ha pasado esto?", le pregunto a Melindra. "¿Cómo es posible que ya sea de mañana? No lo entiendo. ¡Solo han pasado unas pocas horas!"

          "El tiempo vuela cuando uno se divierte", dice Melindra. "¿Es de verdad la primera vez que experimentas un hechizo energizante? No te preocupes, ya te acostumbrarás con el tiempo. A mí me pasó algo parecido la primera vez que me lancé el hechizo a mí misma, pero ahora ya no tengo esos problemas."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch08a_energizer3
  - name: b2_ch08a_energizer3
    texts:
      - source: scene_text
        paragraph: 76
        text: |-
          "¿Por qué estás tan tranquila con esto?", le pregunto. "Yo al menos dormí una hora antes de que me despertaras, ¡pero tú no has dormido nada! ¿Cómo se supone que vamos a arreglárnoslas cuando se pase el efecto de tu hechizo energizante?"

          "¡Estaremos bien!", dice Melindra. "Cuando empecemos a cansarnos, volveré a lanzar el hechizo energizante y nos aguantará el resto del día."

          "¿Pero no se supone que estos hechizos tienen inconvenientes si los lanzas uno detrás de otro sin descanso?", digo.

          "Eh...", dice Melindra. "Puede que haya un pequeño riesgo de fallo cardíaco, pero estoy segura de que nos apañaremos. Los dos somos jóvenes. Bueno, tú eres más o menos joven y yo siempre soy joven, pero la idea sigue siendo la misma. No deberíamos tener de qué preocuparnos."

          "Vale, lo que tú digas", digo. "Ya veremos eso más tarde. Pero, por ahora, ¿puedes volverte invisible para que los demás no te vean salir de la tienda?"
      - source: scene_text_2
        paragraph: 50
        text: |-
          "Oh...", dice Melindra. "Bueno, verás... aunque aprendí ese hechizo de Eiden, lo cierto es que no aprendí una versión completa. El hechizo en sí funciona perfectamente, pero solo puedo lanzarlo una vez al día, y ya lo lancé una vez en las últimas veinticuatro horas."

          "Vale", digo. "Vale... No pasa nada. Podemos arreglar esto. No oigo a nadie fuera, así que no creo que se hayan despertado todavía. Si no recuerdo mal, a Flower le tocó el último turno, así que con un poco de suerte puede que no te vea cuando salgas. Espera, voy a abrir la tienda y veremos si el camino está despejado."

          "¡Espera!", grita Melindra al verme tirar de la cremallera de la tienda. "¡El hechizo de silencio todavía no se ha cancelado!"

          En cuanto termino de abrir la tienda, me arrepiento al instante, porque todos y cada uno de mis compañeros están ahora mismo de pie a varias decenas de pies de distancia, mirándonos directamente a Melindra y a mí.

          "Ah... cierto...", digo.
    choices:
      - position: 1
        text: Siguiente capítulo
        effects:
          - set:
              next_chapter_crash: 1
              current_scene: b2_ch09a_intro
              chapter_save: 1
              checkpoint_rich: 1
              storyboard_controls: Jump to frame "Save load game"
  - name: b2_ch08a_sleepy
    texts:
      - source: scene_text
        paragraph: 77
        text: |-
          "Vale, de acuerdo, ¡tú ganas!", digo. "Pero más te vale haberte ido de aquí antes de que despierten los demás."

          "¡No te preocupes!", dice Melindra. "Siempre me despierto temprano. ¡Antes de que te des cuenta ya me habré ido!"

          "Bien", digo. "Entonces vamos a dormir. Mañana va a ser un día largo."

          Los dos nos quedamos dormidos en cuestión de minutos y, aunque no fue precisamente la noche más cómoda que he pasado en mi vida, tampoco estuvo tan mal. Cuando me despierto por la mañana, sin embargo, me doy cuenta de repente del imbécil que fui por creerme cualquier cosa que saliera de la boca de Melindra.

          "¡Eh, Melindra!", digo, sacudiendo a la chica stillwater para intentar despertarla. "¡Melindra! ¡Despierta, maldita sea! Dijiste que te habrías ido de aquí antes del amanecer. ¿Ves esto?"

          Entonces le pongo el dispositivo de estadísticas delante de la cara para que vea claramente qué hora del día es.

          "¡Ya es de mañana!", le digo. "¡Despierta! Despierta y lanza ese hechizo de invisibilidad tuyo para poder salir de la tienda sin que nadie te vea, tal como prometiste."

          "No puedo lanzarlo...", dice Melindra con voz soñolienta y los ojos medio cerrados. "Solo una vez al día... Ya lo lancé una vez..."
      - source: scene_text_2
        paragraph: 51
        text: |-
          "¡Estupendo!", digo. "Simplemente estupendo. Bueno, aún no es muy tarde y no oigo a nadie fuera, así que con un poco de suerte todavía podríamos lograrlo. Creo que a Flower le tocó el último turno, así que si consigues evitarla, lo tendrás hecho. Voy a abrir esta tienda para ver si no hay nadie y, si te doy la señal, saldrás corriendo de inmediato, ¿entendido?"

          "Mmm...", dice Melindra mientras levanta la cabeza del suelo, todavía con los ojos medio cerrados. "Mmhmm..."

          "Vale, bien", digo. "Voy a abrir la tienda ahora. Prepárate."

          "¡Espera, un momento!", grita Melindra de repente al verme tirar de la cremallera de la tienda. "¡El hechizo de silencio todavía no se ha cancelado!"

          En cuanto termino de abrir la tienda, me arrepiento al instante, porque todos y cada uno de mis compañeros están ahora mismo de pie a varias decenas de pies de distancia, mirándonos directamente a Melindra y a mí.

          "Ah... cierto...", digo.
