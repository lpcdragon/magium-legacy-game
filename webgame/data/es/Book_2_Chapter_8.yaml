              Decidimos seguir el consejo de Kate y cada uno se dirige a su tienda. Cuando entro en la mía, guardo el cuaderno en la mochila y me preparo para acostarme. Aún tengo cosas que me gustaría leer, pero puedo hacerlo por la mañana.
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch08a_unnoticed
      - condition: b2_ch1_interfere = 1
        texts:
          - source: scene_text
            paragraph: 68
            text: |-
              "No olvides que también había lessathi en la ciudad."

              "Los lessathi con los que luchamos no llevaban ningún dispositivo de estadísticas encima", escribe Leila. "Incluso aunque los hubieran escondido en algún sitio, debería haber podido detectarlos con ayuda de mi propio dispositivo. Además, uno de esos lessathi vino a amenazarme mientras aún estaba en mi celda y tampoco llevaba ningún dispositivo en ese momento."

              "¿Un lessathi te amenazó?", pregunta Kate.

              "Sí", escribe Leila. "Intentó convencerme de que le entregara mi potenciador de estadísticas, pero me negué. Más tarde le ordenó al dueño de la arena que me lo confiscara, pero el dueño decidió no obedecerlo, porque quería que conservara el dispositivo de estadísticas para que la pelea fuera más interesante."

              "Acabo de acordarme de que había otra cosa que quería preguntarte sobre el dispositivo de estadísticas", digo. "Leila, me dijiste que tenías nivel tres tanto en fuerza como en velocidad, pero cuando estabas luchando en la arena no parecías mucho más fuerte ni más rápida que aquel trol con la regeneración elevada. ¿Tu dispositivo está defectuoso por casualidad?"

              "No", dice Leila. "Mi padre me dijo una vez que las estadísticas físicas del dispositivo potencian las capacidades físicas que ya tienes, y que cuanto mejor forma física tengas, más efecto tendrán esas estadísticas sobre ti. Dado que siempre he tenido una constitución muy frágil, esto es lo máximo que puedo sacar de mi dispositivo de estadísticas con mis niveles actuales."
          - source: scene_text_2
            paragraph: 44
            text: |-
              "Vaya...", digo. "Bueno, entonces supongo que todos esos meses que pasé entrenando físicamente para prepararme para este torneo no fueron una pérdida de tiempo, después de todo."

              "¿Estuviste entrenando físicamente?", dice Kate, sorprendida. "¿Y este es el resultado? Apostaría a que podría ganarte un pulso si me esforzara lo suficiente."

              "He dicho que solo lo hice durante unos cuantos meses", le digo a Kate. "Y no es que fuera lo único que hacía en ese tiempo. También tenía que investigar. La investigación que ahora estoy usando para averiguar las debilidades de Eiden y así por fin... Espera un segundo... ¿Dónde está Melindra? Juraría que la vi hace un minuto junto a la orilla del río."

              "¿A quién le importa Melindra?", dice Kate.

              "Bueno, no la vi montar su tienda", digo. "¿Crees que no piensa pasar la noche en nuestro campamento?"

              "Melindra puede irse a dormir al río, por mí", dice Kate. "No es como si fuera a ayudar en nada a vigilar el campamento. Lo que me recuerda que debería ir preparándome para tomar el primer turno. Ustedes dos deberían ir a dormir. A ninguno de los dos le toca hacer guardia esta noche, así que más vale que aprovechen el descanso."

              Decidimos seguir el consejo de Kate y cada uno se dirige a su tienda. Cuando entro en la mía, guardo el cuaderno en la mochila y me preparo para acostarme. Aún tengo cosas que me gustaría leer, pero puedo hacerlo por la mañana.
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch08a_unnoticed
  - name: b2_ch08a_unnoticed
    texts:
      - source: scene_text
        paragraph: 69
        text: |-
          Solo me hace falta alrededor de un minuto para quedarme dormido en cuanto apoyo la cabeza en la almohada. Sin embargo, apenas una hora más tarde me despierta la sensación de un par de pechos presionándose lentamente contra mi pecho.

          Al abrir los ojos rápidamente para averiguar qué está pasando, veo que Melindra está intentando meterse en mi tienda, justo a mi lado, pero debido al poco espacio disponible dentro le está costando bastante encajar.

          "Pero qué...", empiezo a decir, pero Melindra me interrumpe enseguida mandándome callar y poniendo el dedo índice sobre mi boca.

          "¡Shhhh!", susurra Melindra. "¡Vas a despertar a los demás! Espera, deja que lance un hechizo de silencio alrededor de nosotros."

          Entonces susurra rápidamente una encantación y el sonido de los grillos que había estado oyendo hasta ahora se detiene de golpe, junto con cualquier otro sonido que venga del exterior de la tienda.

          "¡Ya está!", dice Melindra en voz más alta, con una expresión triunfal. "Ahora podemos hablar con normalidad. Nadie fuera de la tienda debería poder oírnos."

          "¿Qué estás haciendo aquí?", le pregunto, deslizándome hacia el extremo opuesto de la tienda en el pequeño espacio que me queda. "¿Cómo has llegado hasta aquí? ¿No se supone que Kate está haciendo guardia ahora mismo?"

          "Oh, entrar sin que me vieran fue fácil", dice Melindra. "Solo tuve que lanzar un hechizo de invisibilidad y luego abrir y cerrar la tienda en un momento en que la maga de hielo no estaba mirando."
      - source: scene_text_2
        paragraph: 45
        text: |-
          "¿Un hechizo de invisibilidad?", digo. "¿Te refieres al que también oculta tu aura?"

          "¡Sí, ese mismo!", dice Melindra. "Me lo enseñó Eiden."

          "Vale", digo. "Ya sé cómo has llegado aquí, pero todavía no me has dicho por qué estás aquí. ¿Qué quieres? ¿Y por qué esto no podía esperar hasta mañana por la mañana?"

          "Verás", dice Melindra, "cuando revisé el interior de mi mochila esta noche, descubrí, para mi desgracia, que se me había olvidado llevarme una tienda antes de salir de Thilias."

          "Tienes que estar bromeando", digo. "¿Y no podías simplemente pedirles a Daren o a Hadrik que te prestaran una tienda?"

          "No sé si te has dado cuenta", dice Melindra, "pero desde que salimos de la ciudad no me he estado llevando especialmente bien con la mayoría de los miembros de tu grupo."

          "¿Y tu solución fue venir a despertarme en mitad de la noche?", digo.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch08a_insects
  - name: b2_ch08a_insects
    texts:
      - source: scene_text
        paragraph: 70
        text: |-
          "¡No estaba intentando despertarte!", dice Melindra, frustrada. "¡Es que tu tienda es condenadamente pequeña! Solo quería dormir unas pocas horas dentro de tu tienda y marcharme antes de que despertaras. Demonios, incluso intenté dormir fuera durante un rato, pero había un montón de bichos intentando treparme por encima, y los únicos hechizos de protección que tengo que funcionan mientras duermo no están hechos para protegerme de insectos."

          "¿Pero por qué mi tienda?", digo. "¿Por qué no la de Flower? ¿O la de Kate?"

          "Porque no soportaría dormir al lado de Arraka ni dos segundos", dice Melindra. "Y tu novia me detesta."

          "Kate no es mi novia", digo simplemente.

          "Podría serlo perfectamente, a juzgar por esa mirada tan glacial que me lanzó cuando te agarré del brazo", dice Melindra.

          "¿Eso es en lo que basas tu teoría?", digo. "Kate le lanza miradas glaciales a todo el mundo. Excepto quizá a Leila."
      - source: scene_text_2
        paragraph: 46
        text: |-
          "Si de verdad crees que la maga de hielo no siente absolutamente nada por ti, entonces estás viviendo en la negación."

          "Escucha", digo. "Kate ha vivido la mayor parte de su vida adulta en la naturaleza, luchando por sobrevivir. El único contacto que ha tenido con seres humanos en los últimos diez años han sido o cazadores de banshees intentando matarla o gente normal huyendo de ella, aterrorizada. Probablemente ya ni siquiera sepa lo que son los sentimientos. Kate no vino aquí a divertirse, y yo tampoco. Vino para buscar a su amiga y yo vine para luchar en un torneo mortal con la esperanza de lograr un sueño imposible. Sea lo que sea que creas ver, no existe."

          "Bueno, ¡lo que te ayude a dormir por las noches!", dice Melindra. "Y hablando de dormir, creo que ya estoy lista para acostarme. Si necesitas algo más de mí, solo silba. ¡Buenas noches!"

          "¿Hablas en serio?", le digo a Melindra al verla apoyar la cabeza en el suelo de la tienda y cerrar los ojos. "¡No puedes dormir aquí!"
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch08a_fair
  - name: b2_ch08a_fair
    texts:
      - source: scene_text
        paragraph: 71
        text: |-
          "¿Por qué no?", pregunta Melindra.

          "¡Porque es mi tienda!", digo.

          "¿Y?...", dice Melindra, arqueando una ceja. "Está claro que la tienda es lo bastante grande para los dos. Será un poco incómodo, pero nos apañaremos. Seguro que no me odias tanto como para no soportar ni siquiera tenerme cerca, ¿no?"

          "¡No es eso!", digo. "Es solo que no quiero que durmamos juntos en la misma tienda. Eso solo haría que todo fuera raro."

          "¡Oooh!", dice Melindra. "¡Ahora lo entiendo! Bueno, supongo que es justo. Al fin y al cabo, estamos compartiendo tienda."

          "Sí, exactamente", digo. "Así que date prisa y... espera, ¿qué estás haciendo?"

          Mientras yo hablaba, Melindra estaba a punto de quitarse la blusa.
      - source: scene_text_2
        paragraph: 47
        text: |-
          "¿Qué quieres decir con qué estoy haciendo?", pregunta Melindra, confundida, deteniéndose a mitad de quitarse la blusa. "Me estaba quitando la ropa. ¿No era eso lo que estabas insinuando? ¿Que sería raro que durmiéramos juntos sin 'dormir' juntos de verdad?"

          "¡No!", digo. "Quiero decir, sí, pero lo decía en el sentido de que deberías salir de la tienda."

          "¿Ah?", dice Melindra, arqueando otra vez la ceja. "Entonces, ¿me estás diciendo que NO quieres acostarte conmigo?"
    choices:
      - position: 1
        text: ¡No he dicho eso!
        effects:
          - set:
              current_scene: b2_ch08a_energizer
              b2_ch8_energizer: 1
      - position: 2
        text: Sí, eso es exactamente lo que estoy diciendo.
        effects:
