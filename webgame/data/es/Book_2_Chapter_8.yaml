  - name: b2_ch08a_assess
    texts:
      - source: scene_text
        paragraph: 27
        text: |-
          Mientras guardo la ballesta en la mochila, echo un vistazo rápido al campo de batalla para evaluar la situación actual. Daren parece bastante ocupado luchando contra el capitán orco de las hachas en llamas. El orco parece haber renunciado por completo a defenderse y se está centrando en lanzar ataques implacables, uno tras otro, para no darle a Daren la oportunidad de contraatacar. Hadrik sigue luchando contra los ogros a nuestra espalda y, por lo que alcanzo a ver, le están dando tantos problemas como el capitán ogro del fuerte, así que probablemente seguirá ocupado con ellos durante un buen rato.

          Mientras tanto, Leila está peleando contra tres orcos a la vez en un intento por mantenerlos alejados de nuestros lanzadores de hechizos, mientras Kate, Flower e Illuna se esfuerzan por encontrar formas de atravesar la armadura anti-magia de los orcos.

          "¡No puedo creerlos!" grita Arraka desde su amuleto mientras Flower intenta apuntar una bola de fuego de forma que no alcance también a Leila junto con los orcos. "¡Ayer estaban peleando de frente contra el dragón y ahora no pueden con unos pocos secuaces miserables suyos! ¿De verdad basta con un puñado de armaduras anti-magia para sumirlos en el caos?"

          "Sí, tengo que admitir que aquí estoy un poco decepcionada", dice Melindra mientras mira tranquilamente a su alrededor a toda la gente que está luchando por su vida. "Si así es como se las arreglan estas personas contra un equipo bien organizado de combatientes razonablemente hábiles, me estremece pensar cómo se las arreglarán con los numerosos equipos de mercenarios de Ollendor."
      - source: scene_text_2
        paragraph: 20
        text: |-
          El monólogo de Melindra parece haber llamado la atención de uno de los orcos que estaba peleando contra Leila, porque ahora se dirige directamente hacia la chica stillwater con la maza preparada. En cuanto llega hasta ella, el orco lanza un mazazo con fuerza hacia su cabeza en un intento de aplastársela, pero la chica esquiva el golpe flotando unos pocos centímetros por encima del suelo mientras se impulsa lejos de él con una pequeña ráfaga de aire desde las palmas de las manos.

          "¡Ya basta!" le grita Melindra al orco. "¡Pelea con ellos, no conmigo! ¿Qué te pasa, eres idiota?"

          El orco la ignora por completo e intenta golpearla otra vez, esta vez con el escudo.

          "¡He dicho que pares!" le grita Melindra mientras da otro salto hacia atrás.

          Entonces se afianza en el suelo con los pies, adoptando una postura bastante peculiar, con las rodillas flexionadas y los codos pegados al cuerpo, mientras apunta las palmas hacia su atacante.

          Sale de sus manos una ráfaga de aire potentísima y el orco sale despedido directamente hacia Kate, que justo estaba a punto de lanzar un cono de hielo contra uno de los rivales de Leila. Al ver al orco volando en su dirección, Kate se ve obligada a cancelar el hechizo y apartarse de un salto para evitar que la derribe.
      - source: scene_3
        paragraph: 2
        text: |-
          "¿Estás intentando que nos maten a todos?" le grita Kate furiosa a Melindra mientras vuelve a levantarse del suelo.

          "¡Eh, no fue culpa mía!" dice Melindra. "¡Ese orco me atacó de la nada cuando yo solo estaba a lo mío!"

          "¡Estamos en medio de un campo de batalla, idiota!" dice Kate. "Si quieres ir a lo tuyo, entonces aléjate volando de aquí y deja de sabotearnos a cada paso."

          "Bueno, tampoco hace falta ser tan grosera", dice Melindra, mientras lanza un hechizo y se eleva alto en el aire, fuera del alcance de los orcos, mientras el orco al que había lanzado por los aires hace un momento vuelve a pelear con Leila.
    choices:
