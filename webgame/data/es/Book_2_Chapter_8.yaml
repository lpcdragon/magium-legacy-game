          - source: scene_text
            paragraph: 58
            text: |-
              "¡No, te equivocas!", dice Melindra. "¡Solo estaba usando esa postura porque hacía muchísimo tiempo que no usaba mis poderes cerca de un grupo de aliados y me sentía un poco oxidada!"

              "¿Tan oxidada estabas que ni siquiera recordabas lo básico?", digo. "Sí, perdona, pero no me lo trago. Solo estás inventándote excusas. Admítelo, no habría habido ninguna razón para que usaras esa postura si no tuvieras problemas para controlar tus poderes."

              Melindra me mira con el ceño fruncido, pero no dice nada.

              "Lo que no entiendo es por qué querías ocultárnoslo a propósito", digo. "¿De verdad te importa tanto tu imagen? ¿De verdad es tan importante para ti que te conozcan como esa stillwater perfecta y todopoderosa que nunca se equivoca, como para poner en riesgo toda esta misión?"

              "Te juro...", dice Melindra con una mirada amenazante en los ojos. "Si piensas contárselo a alguien..."
          - source: scene_text_2
            paragraph: 37
            text: |-
              "¿O te haré qué?", le pregunto. "¿Darme unas palmaditas en la espalda? ¿Acariciarme suavemente? Porque es prácticamente lo máximo que puedes hacerme después del juramento que hiciste. Apuesto a que ahora debes de estar arrepintiéndote de haber hecho ese juramento vinculante, ¿eh?"

              "Un poco...", dice Melindra.

              "Relájate", le digo. "No tengo ningún motivo para contarle esto a nadie. No es como si pudieras ayudarnos aunque quisieras. Si quieres parecer incluso más desagradable de lo que ya eres, ¿quién soy yo para impedírtelo?"
