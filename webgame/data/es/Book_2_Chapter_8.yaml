  - name: b2_ch08a_dispatches
    texts:
      - source: scene_text
        paragraph: 43
        text: |-
          "Vaya, ¡aquellos ogros contra los que luché antes eran cosa seria!", dice Hadrik. "Casi me dieron tantos problemas como aquel capitán ogro del fuerte. Es una pena que lograran escapar, eso sí. Ese capitán orco también parecía saber lo que hacía, por el tiempo que fue capaz de mantener el combate igualado con Daren."

          "Sí", digo. "Es la primera vez que nos encontramos con monstruos tan fuertes y tan bien organizados. Leila, antes dijiste que estos eran uno de los escuadrones de élite de Tyrath, ¿no?"

          "Sí", escribe Leila. "Normalmente solo envía esos equipos en misiones especiales. Supongo que este grupo en concreto fue enviado aquí específicamente para ir a por ustedes, ya que él ya no podía matarlos personalmente por su pacto con Eiden. Debe de haber enviado al menos un grupo de élite a vigilar cada una de las salidas de la ciudad, pero no podían quedarse demasiado cerca de las puertas sin ser detectados, así que prepararon la emboscada aquí, en el bosque."
    choices:
      - position: 1
        text: ¿Todos los grupos de élite tienen la misma composición?
        effects:
          - set:
              current_scene: b2_ch08a_composition
      - position: 2
        text: ¿Tyrath tiene equipos más fuertes que estos escuadrones de élite?
        effects:
          - set:
              current_scene: b2_ch08a_stronger
  - name: b2_ch08a_composition
    texts:
      - source: scene_text
        paragraph: 44
        text: |-
          "¿Todos los grupos de élite tienen la misma composición?"

          "No", escribe Leila. "No sé exactamente qué tipo de miembros tienen en cada grupo, pero estoy bastante segura de que también tienen grupos con jinetes de guiverno, y algunos de ellos también cuentan con troles con capacidades regenerativas muy altas."

          "Sea cual sea el equipo que Tyrath decida enviarnos la próxima vez", dice Illuna, "lo más importante es que lo detectemos antes de que logre rodearnos de verdad. Arraka, a partir de ahora también nos avisarás cuando haya grupos de monstruos intentando tendernos una emboscada, no solo enemigos invisibles. ¿Entiendes?"

          "Oye, si quieren mi ayuda, ¿qué tal si la próxima vez pelean en serio, eh?", dice Arraka. "¿Qué fue esa actuación ridícula tuya en la pelea de antes? ¿Por qué no usaste con ellos esa técnica para ahogar que te enseñé, como hiciste ayer con el dragón? No es como si sus cascos anti-magia fueran a impedirles tragarse agua en los pulmones."
      - source: scene_text_2
        paragraph: 27
        text: |-
          "Ya te lo he dicho incontables veces", dice Illuna. "Nunca conseguí controlar por completo esa técnica. Lo de ayer fue una apuesta y solo lo hice porque nos estábamos quedando sin opciones. E incluso así, tuve que calcular el hechizo a la perfección para lanzarlo exactamente cuando el dragón inhaló al prepararse para escupir fuego. De ese modo, los pulmones de Tyrath ya estaban llenos de agua antes de que pudiera reaccionar. Si le hubiera quedado algo de aire en los pulmones, simplemente habría podido expulsarlo por la boca y mi burbuja de agua se habría dispersado en el acto. Ese es el poco control que tengo sobre este hechizo. Y aparte de eso, solo puedo lanzarlo sobre una persona a la vez, y si alguien rompe mi concentración mientras lo lanzo, el hechizo se deshace al instante."

          "Entonces, ¿por qué no lo dominas?", dice Arraka. "¿Para qué perdí el tiempo enseñándote una técnica tan útil si ni siquiera vas a practicarla? ¿Me odias tanto que estás dispuesta a limitar tu arsenal de hechizos solo por fastidiarme?"

          "¡Está bien!", dice Illuna. "Si eso va a hacer que te calles, entonces empezaré a practicar el hechizo. Ahora, ¿aceptarás avisarnos de los ataques de monstruos o no?"

          "Claro, claro...", dice Arraka. "Al fin y al cabo, también me conviene que ustedes dos sigan con vida... al menos hasta que consiga apoderarme de tu cuerpo."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch08a_inspiring
  - name: b2_ch08a_stronger
    texts:
      - source: scene_text
        paragraph: 45
        text: |-
          "¿Tyrath tiene equipos más fuertes que estos escuadrones de élite?"

          "Antes sí", escribe Leila. "Pero ya no creo que los tenga. Oí que hubo un tiempo en que realmente tenía equipos de dragones bajo su mando. Pero seguramente eso fue antes de que dejara de ser capaz de mantener su forma de lava fundida en todo momento. Por lo que tengo entendido, los dragones de Varathia viven ahora aislados en algún lugar de las montañas y no quieren saber nada de Tyrath, pese a sus afirmaciones de ser el 'rey de todos los dragones'."

          "Sea cual sea el equipo que Tyrath decida enviarnos la próxima vez", dice Illuna, "lo más importante es que lo detectemos antes de que logre rodearnos de verdad. Arraka, a partir de ahora también nos avisarás cuando haya grupos de monstruos intentando tendernos una emboscada, no solo enemigos invisibles. ¿Entiendes?"

