          - set:
              current_scene: b2_ch08a_capabilities
  - name: b2_ch08a_capabilities
    texts:
      - source: scene_text
        paragraph: 50
        text: |-
          "Déjalo, Kate", dice Daren. "Esta discusión no nos va a llevar a ninguna parte. Además, Melindra no va a formar parte de nuestro grupo para siempre. Hadrik tiene razón. Necesitamos nuevos planes. Yo estaba demasiado centrado en mi lucha con el capitán orco como para poder prestar atención a mi entorno, así que no puedo asegurarlo al cien por cien, pero creo que uno de los principales problemas en la forma en que nos organizamos fue que Leila se lanzó a atacar ella sola a todos esos orcos, y eso obligó a todos los que luchaban con magia a concentrarse únicamente en los orcos que peleaban con ella, en vez de, por ejemplo... ocuparse de los ogros, que no parecían llevar armadura anti-magia y habrían sido objetivos más fáciles para ellos."

          "Lo siento...", escribe Leila.

          "¡Oh, no hace falta que te disculpes!", dice Daren. "Sé que estabas intentando actuar como señuelo para desviar la atención de nuestras elementalistas, y esa es una táctica excelente, pero sencillamente no funcionó bien en esta situación. Por eso estamos teniendo esta conversación, para aprender de nuestros errores y mejorar nuestras tácticas para combates futuros. Por ejemplo, puede que la próxima vez que quieras actuar como señuelo podrías intentar mantener la distancia con tus enemigos, en lugar de entablar combate directamente con ellos, para no ponerte en peligro inmediato, lo que permitiría a nuestras lanzadoras de hechizos prestar atención también al resto del campo de batalla sin sentirse obligadas a correr en tu ayuda."

          "De acuerdo, lo intentaré...", escribe Leila.
      - source: scene_text_2
        paragraph: 31
        text: |-
          "Además", dice Daren, "la próxima vez que Hadrik diga que se encargará de los ogros, eso no significa que tengan que dejar que se encargue de todos él solo. Puede que sea lo bastante fuerte para que no lo maten, pero si cualquiera de ustedes le hubiera ayudado a matar a esos ogros, luego habría podido hacer picadillo a los orcos sin despeinarse. Y cuando digo cualquiera de ustedes, hablo especialmente de ti, Kate. Unos cuantos conos de hielo bien colocados deberían haber bastado para acabar con esos ogros, teniendo en cuenta lo ocupados que estaban peleando con Hadrik. Sé que Leila es tu amiga, pero no puedes ignorar por completo lo que te rodea cada vez que ella está en peligro. Si vamos a luchar como un equipo a partir de ahora, vas a tener que confiar un poco más en sus capacidades de combate."

          "Lo entiendo...", dice Kate.

          "¿Hmm?...", dice Melindra, girándose de pronto y pareciendo interesarse por nuestra conversación. "Eso es un consejo muy bueno viniendo de alguien que no ha estado prestando atención a lo que lo rodea. Quizá te haya estado subestimando un poco..."

          "Claro que es un buen consejo", dice Daren. "No llevo veinte años combatiendo monstruos para nada. Además, ¿no dijiste antes que no volveríamos a oír ni una palabra más de ti? ¿Por qué de repente nos estás hablando?"

          "¡Hmph!", dice Melindra, dándose la vuelta. "Yo no les estaba hablando. Solo estaba pensando en voz alta. No tengo ninguna razón para hablar con ninguno de ustedes."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch08a_bothered
  - name: b2_ch08a_bothered
    texts:
      - source: scene_text
        paragraph: 51
        text: |-
          "¿Eso significa que ya no me enseñarás tu colección de rocas?", dice Flower con voz decepcionada.

          "Bueno...", dice Melindra. "Supongo que podría hacer una excepción. Solo esta vez. Ven aquí y retomaremos donde lo dejamos."

          Cuando Flower vuelve corriendo al lado de Melindra, seguimos todos nuestro viaje por el bosque y, durante las siguientes horas, no volvemos a sufrir ninguna interrupción. A lo largo del trayecto, Melindra no volvió a hablar con nadie aparte de Flower, y el resto de nosotros también la ignoró en su mayor parte. Mientras caminábamos, nos fuimos dividiendo un poco en pequeños grupos, con Kate y Leila atrás, Hadrik, Daren y yo en medio, y Flower y Melindra delante. Parecía que Kate y Leila tenían mucho sobre lo que ponerse al día, así que decidimos no molestarlas y dejarles un poco de intimidad.

          En el otro extremo del grupo, una vez que Melindra terminó de enseñarle las rocas a Flower, empezó a hacerle un montón de preguntas técnicas sobre cómo funciona exactamente su fusión con Illuna. Algunas preguntas eran más personales que otras, pero Flower no parecía sentirse incómoda en ningún momento y las respondió todas sin vacilar, mientras Melindra la miraba con una curiosidad sincera y ávida.
      - source: scene_text_2
        paragraph: 32
        text: |-
          Cuando ya había pasado el mediodía, decidimos hacer una pausa cerca de un río para comer, llenar nuestras cantimploras con agua fresca y recoger algunas frutas, de modo que Flower pudiera conservar parte de su energía mágica y no tuviera que crear comida cada vez que necesitáramos comer algo. Habría sido estupendo que el agua que conjura Illuna fuera realmente potable, porque así no tendríamos que preocuparnos de encontrar fuentes de agua dulce, pero, por lo que me contó, el agua que crea con sus hechizos desaparece sola al cabo de un rato, así que sería casi como beber aire.

          Cuando terminé de comer, me senté en una roca y saqué mi cuaderno para ver si podía encontrar más de los vacíos legales de Eiden mientras descansábamos. Mientras pasaba tranquilamente las páginas, pude ver de reojo cómo Melindra se me iba acercando poco a poco, aunque parecía debatirse entre si quería hablar conmigo o no, yendo y viniendo varias veces antes de decidirse por fin a pararse frente a mí.

          "Entonces, ehm... Barry... ¿era así?", dice Melindra con una sonrisa obviamente forzada, intentando parecer mona y accesible. "¿Cómo estás en este maravilloso día?"

          "Veo que por fin te has molestado en aprenderte mi nombre", digo, pasando una página del cuaderno con toda tranquilidad sin siquiera alzar la vista hacia ella.

          "Sí, tu nombre es más fácil de recordar que los otros", dice Melindra.
