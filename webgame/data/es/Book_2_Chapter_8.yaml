  - name: b2_ch08a_civilized
    routes:
      - condition: b2_ch8_parents = 0
        texts:
          - source: scene_text
            paragraph: 61
            text: |-
              "No bromeabas cuando dijiste que ibas a seguir fastidiándome, ¿verdad?"

              "Oye, ¿quieres saber más sobre tus padres o no?", dice Melindra.

              "La verdad es que me importan bastante poco mis padres biológicos", digo.

              "¡Vale, bien!", dice Melindra con un puchero, cruzándose de brazos. "Si no quieres oír hablar de ellos, entonces no te voy a contar nada."

              "Bien", digo.

              Entonces seguimos andando en silencio unos segundos más mientras alcanzamos al resto.

              "Entonces, sobre esa banshee...", dice Melindra.

              "¿Hablas en serio?", le pregunto.

              "¿Qué?", dice Melindra. "Solo sentía curiosidad."

              "Pues no la sientas", le digo. "¿No tienes nada mejor que hacer que venir a molestarme?"

              "Pues obviamente no, porque si lo tuviera no te estaría molestando, ¿verdad?", dice Melindra.
          - source: scene_text_2
            paragraph: 40
            text: |-
              "¿Podrían dejar de hablar y concentrarse un segundo?", dice Daren. "Puedo sentir a un grupo de magos acercándose. Y no estoy seguro de que sean amistosos. Mantengan la guardia alta."

              Pasa un rato antes de que los magos se dejen ver, pero parece que son otro grupo de encantadores de armas. No tienen pinta de matones, así que quién sabe, quizá esta vez podamos limitarnos a saludar y seguir nuestro camino, como personas civilizadas. Ya sé que estoy siendo optimista, pero aun así...

              "¡Eh, mirad eso!", dice uno de los encantadores de armas. "Estos payasos se han traído putas al torneo."

              "Guau, tienes razón", dice un segundo mago. "Incluso se han asegurado de traer al menos una para cada uno."

              "¿Creéis que la niña la ha traído el enano?", dice un tercer mago. "Qué cabrón enfermo."

              De repente, Melindra me agarra del brazo con ambas manos y se aprieta contra mí.

              "Cariño, ¿de verdad vas a dejar que hablen así de mí?", dice Melindra con ojos suplicantes, pero con una sonrisa burlona. "No irás a dejar que se marchen después de llamarme puta, ¿verdad?"
        choices:
