scenes:
  - name: b2_ch08a_intro
    texts:
      - source: scene_text
        paragraph: 2
        text: |-
          "¡Ahí están!" dice Melindra en cuanto nos ponemos a una distancia a la que puede oírnos. "Justo a tiempo. Díganme, ¿están listos para comenzar nuestra aventura?"

          "Si por aventura te refieres a hacer cola durante una hora, entonces sí", dice Daren, señalando hacia la puerta norte de la ciudad.

          Parece haber al menos varias decenas de grupos de personas haciendo cola en la carretera principal que lleva a la puerta norte. Algunos son simples viajeros, como nosotros, pero la mayoría parecen mercaderes, con carretas llenas de mercancías que los guardias de la salida de la ciudad tienen que inspeccionar una por una antes de dejarlos pasar por la puerta. A juzgar por lo que tardan los guardias en inspeccionar cada carreta, diría que la estimación de Daren quizá hasta sea un poco optimista. Probablemente vayamos a quedarnos atrapados aquí bastante más de una hora.

          "Ah, sí", dice Melindra, echando un vistazo a la larguísima fila de carretas que tiene delante. "Olvidé que la puerta norte la usan principalmente los mercaderes en esta ciudad. Sería mucho mejor si de verdad hubieran hecho más de una puerta en su muralla norte para resolver sus problemas de tráfico."
      - source: scene_text_2
        paragraph: 2
        text: |-
          "Más puertas significa más zonas vulnerables que hay que proteger", dice Daren. "No sería buena idea en tiempos como estos, cuando los ataques de monstruos están a la orden del día. Pongámonos en la cola como todos los demás. Apenas ha salido el sol, así que seguiremos teniendo tiempo de sobra para viajar aunque desperdiciemos otra hora en esta ciudad."

          "En realidad, tengo una idea mejor", dice Melindra. "¡Tomaremos un atajo!"

          "¿Un atajo?" pregunta Hadrik, confundido. "Quieres decir, ¿como un túnel subterráneo o...?"

          "Oh, no, no..." dice Melindra con una sonrisa. "No hablaba de un túnel."

          Entonces chasquea los dedos y todos empezamos a elevarnos lentamente en el aire, cada vez más arriba, mientras siento varias corrientes de aire moviéndose a mi alrededor, de forma parecida a como lo hacían cuando yo usaba magia de aire para volar durante mi batalla contra los stillwaters convertidos en esqueletos.
    effects:
      - set:
          successful_checks:
            - 'Punto de control alcanzado: Partida guardada.'
        condition: checkpoint_rich = 1
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch08a_intro2
              checkpoint_rich: 0
  - name: b2_ch08a_intro2
    texts:
      - source: scene_text
        paragraph: 3
        text: |-
          "Ni hablar..." dice Daren mientras seguimos elevándonos cada vez más en el aire. "No estarás pensando seriamente en hacer esto, ¿verdad?"

          "¿Hacer qué?" dice Melindra con una sonrisa pícara.

          "¡No te hagas la tonta conmigo!" dice Daren. "¡Vas a hacernos volar por encima de esa maldita muralla entera! ¿Estás loca? ¡Esto va contra la ley! ¡Esos guardias apostados en la muralla van a empezar a dispararnos en el momento en que pasemos por encima de ellos!"

          "¿Y qué?" dice Melindra. "Tú eres un mago blanco y un encantador, ¿no? Puedes usar ese escudo tuyo para crear una barrera a nuestro alrededor y estaremos bien."

          "¡No tengo hechizos de barrera que desvíen flechas normales!" grita Daren.

          "Espera, ¿en serio?" dice Melindra, arqueando una ceja.

          "¡Y además ese no es el problema!" dice Daren. "¡No queremos convertir a esta ciudad entera en nuestra enemiga solo porque éramos demasiado vagos para esperar en la cola!"
      - source: scene_text_2
        paragraph: 3
        text: |-
          "¿No?" pregunta Melindra. "¿Por qué no? ¿Piensas volver a esta ciudad después?"

          "¡Sí!" dice Daren. "Quiero decir, creo... ¡No lo sé!"

          "Bueno, de todos modos ya es demasiado tarde para echarse atrás", dice Melindra. "Miren abajo. Ya estamos pasando por encima de su muralla. Y esos arqueros se están preparando para atacarnos. Espero que al menos alguien de este grupo pueda defenderse de las flechas, porque levantar a tanta gente a la vez usando solo magia de aire requiere muchísima concentración y no quiero arriesgarme a dejar caer a ninguno de ustedes por intentar desviar proyectiles entrantes."

          "Atención, a todos los magos que ahora están volando por encima de nuestra muralla", oímos gritar a un guardia a través de un amplificador mágico de voz desde lo alto de la muralla de la ciudad. "Deben descender de inmediato. Repito. Deben descender de inmediato. Si ignoran esta advertencia, los trataremos como enemigos del reino y abriremos fuego. ¡No volveré a repetirlo!"
    choices:
      - position: 1
        text: Intentar convencer a Melindra de que nos baje.
        effects:
          - set:
              current_scene: b2_ch08a_tickle
              b2_ch8_tickle: 1
      - position: 2
        text: Dejar que Melindra maneje la situación como quiera.
        effects:
          - set:
              current_scene: b2_ch08a_situation
              b2_ch8_tickle: 0
  - name: b2_ch08a_tickle
    texts:
      - source: scene_text
        paragraph: 4
        text: |-
          "Melindra, has oído al tipo", digo. "Bájanos para que podamos hablar con ellos. A lo mejor todavía podemos arreglar las cosas con los guardias de alguna manera."

          "¿Y esperar tres horas en alguna celda antes de que decidan soltarnos?" dice Melindra. "No, gracias. Prefiero lidiar con las flechas."

          "¡No son solo las flechas, demonios!" digo. "¡No quiero convertirme otra vez en un delincuente en esta ciudad después de todo el esfuerzo que hicimos para que nos absolvieran de nuestros crímenes!"

          "Pues mala suerte, entonces", dice Melindra. "Porque no pienso parar, digas lo que digas. Pero oye, si crees que puedes detenerme tú solo, te invito a intentarlo. No puedo esperar a ver qué planeas hacer contra una stillwater de mi calibre... ¡AJAJAJA! ¡Para! ¡Para o voy a...! ¡Ajajá!"

          Mientras Melindra estaba ocupada presumiendo, decidí que ya había tenido bastante, así que le puse las dos manos a los lados de la cintura y empecé a hacerle cosquillas por detrás. Cuando la chica se echa a reír, noto que las corrientes de aire que me rodean se vuelven más inestables y empiezo a tambalearme sin control en el aire, junto con todos los demás.

          "¡Maldición!" dice Melindra, luchando por controlar la risa. "No puedo... ajajá... ¡No puedo apartarme de ti mientras me concentro en levitarlos a todos! ¡Ajajá! ¡Deja de hacerme COSQUILLAS!"
      - source: scene_text_2
        paragraph: 4
        text: |-
          Mientras Melindra está hablando, el capitán de los guardias da la orden de atacar y ahora hay decenas de flechas volando en nuestra dirección mientras nuestro grupo sigue flotando en el aire sin haberse movido ni un centímetro desde que empecé a hacerle cosquillas a Melindra. En cuanto ve las flechas, Kate conjura de inmediato varios escudos de hielo, que empiezan a moverse por el aire a nuestro alrededor, defendiéndonos de los proyectiles enemigos.

          "Barry, ¿qué demonios te pasa?" pregunta Daren al verse sacudido arriba y abajo mientras sigue flotando. "¿Es que quieres morir?"

          "¡Relájate!" le digo a Daren. "No es como si fuera a dejarnos caer."

          "¡Sí que lo haré!" dice Melindra. "¡Te dejaré caer! ¡Ya verás...! ¡Ajajá! ¡Déjalo ya!"

          "Sí, claro", digo. "¿Vas a decirme que te tomaste todas estas molestias para encontrar a alguien que pudiera matar a ese rey tuyo y ahora simplemente vas a dejar que nos estrellemos? Venga, bájanos, ¿quieres? Espero que aún no sea demasiado tarde y que podamos hablar con los guardias."

          "¡Me voy a acordar de esto!" dice Melindra mientras dejo de hacerle cosquillas para que por fin pueda empezar a bajarnos hacia el suelo.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch08a_tickle2
  - name: b2_ch08a_tickle2
    texts:
      - source: scene_text
        paragraph: 5
        text: |-
          Cuando el capitán de los guardias ve que estamos perdiendo altura, hace una señal a sus hombres para que cesen el fuego y luego corre hacia una escalera para bajar por la muralla, por el lado exterior de la ciudad. Para cuando todos llegamos al suelo, justo fuera de las murallas, el capitán de los guardias ya nos está esperando con impaciencia, acompañado por varios de los otros guardias, que hacen las veces de escolta. El capitán es un enano de más o menos el mismo tamaño que Hadrik, lleva armadura pesada, una larga barba castaña que le cubre la mitad inferior del rostro y un casco de acero que le tapa gran parte del resto, salvo los ojos y la nariz.

          En cuanto alcanzamos su posición, Daren y yo nos apresuramos a explicarle lo ocurrido, repitiéndole una y otra vez que no buscábamos empezar una pelea al volar por encima de su muralla.

          "Uf..." dice el capitán de los guardias con los ojos cerrados, mientras se frota la frente y niega con la cabeza en señal de desaprobación. "¿Saben? Si de verdad necesitaban salir de la ciudad con urgencia, podrían haberle pedido ayuda a uno de los guardias de la puerta. Todos estábamos allí cuando ustedes lucharon contra el dragón ayer, junto con el rey Golmyck, así que no habría habido problema en hacerles un pequeño favor en agradecimiento por lo que hicieron. Escuchen, voy a hacer todo lo posible por mantener este incidente fuera del registro, pero, por el amor de todos los dioses, no vuelvan a hacer esta clase de tonterías. Los guardias ya estamos bastante ocupados. No tenemos tiempo para lidiar con sus numeritos."
      - source: scene_text_2
        paragraph: 5
        text: |-
          "Por supuesto..." dice Daren. "¡Gracias por su comprensión! Y me disculpo una vez más en nombre de nuestro grupo. Espero que la próxima vez que nos encontremos sea en mejores circunstancias."

          Entonces Daren y yo nos volvemos hacia los demás y les hacemos una señal para indicarles que ya podemos irnos. Melindra sigue con su expresión de puchero después de lo ocurrido, pero por el momento no vuelve a sacar el tema y toma la delantera mientras todos nos disponemos a seguirla.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch08a_precautions
  - name: b2_ch08a_situation
    texts:
      - source: scene_text
        paragraph: 6
        text: |-
          "Entonces, ¿vas a ignorar a ese tipo, sin más?" le pregunta Daren a Melindra.

          "Claro, ¿por qué no?" dice Melindra. "No es como si fuera a volver a verlo. Solo asegúrate de encargarte de sus flechas hasta que salgamos de su alcance. Quiero decir... ¡tú no! Alguien más. ¡Que alguien más se encargue de las flechas!"

          Mientras Melindra está hablando, el capitán de los guardias da la orden de atacar y ahora hay decenas de flechas volando en nuestra dirección. En cuanto ve las flechas, Kate conjura de inmediato varios escudos de hielo, que empiezan a moverse por el aire a nuestro alrededor, defendiéndonos de los proyectiles enemigos.

          "Sabes, sería mucho más fácil si simplemente mataras a los arqueros..." le dice Melindra a Kate.

          "No voy a matar a los guardias de la ciudad por hacer su trabajo", dice Kate con voz fría. "Los que estamos actuando mal aquí somos nosotros, no ellos."

          "Vale, vale..." dice Melindra. "Intentaré aumentar nuestra velocidad para que salgamos antes de su alcance."

          Al cabo de unos veinte segundos más, las flechas que nos disparan desde la muralla ya no logran alcanzarnos y, finalmente, los arqueros dejan de disparar. Por suerte, no parecen muy dispuestos a perseguirnos más allá de los límites de la ciudad, así que, con un poco de suerte, esta será la última vez que los veamos.
      - source: scene_text_2
        paragraph: 6
        text: |-
          "Genial", dice Daren mientras seguimos alejándonos volando de la ciudad. "Ni siquiera quiero pensar por todo lo que tendremos que pasar la próxima vez que queramos entrar en esta ciudad."

          "¡Estarán bien!" dice Melindra. "Solo díganles que quieren hablar directamente con Golmyck y podrán arreglarlo con él. A lo mejor les pide que paguen una multa o algo así, pero estoy segura de que no los mandaría a prisión por algo tan menor. Muy bien, este lugar sirve tan bien como cualquier otro. ¡Voy a devolvernos al suelo!"

          Melindra hace un movimiento ondulante con las manos y todos empezamos a descender hacia la llanura cubierta de hierba que hay debajo. Cuando llegamos al suelo, la chica stillwater toma la delantera y todos nos disponemos a seguirla.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch08a_precautions
  - name: b2_ch08a_precautions
    texts:
      - source: scene_text
        paragraph: 7
        text: |-
          "¿Por qué no estamos tomando el camino principal?" le pregunta Kate a Melindra mientras ella nos guía hacia el bosque. "Vi una señal que decía que llevaba directamente a Ollendor."

          "Oh, ese camino tarda más que ir por el bosque", dice Melindra. "Es porque da un rodeo por territorios más seguros, para que los mercaderes puedan evitar mejor los ataques de monstruos. No hace falta que nosotros tomemos tantas precauciones. La mayoría de ustedes son magos poderosos, ¿no? Bueno, ni de lejos tan poderosos como yo, pero aun así..."

          "¿Puedes parar ya con los comentarios condescendientes?" le digo. "Está claro que tu nivel de poder ni siquiera se acerca al de Eiden. Y si hablamos de stillwaters normales, ya derrotamos a cinco de ellos a la vez sin demasiados problemas. No tenían nada de especial. ¡Diablos, prácticamente acabé con todos yo solo!"

          "¡Deja de presumir, idiota!" dice Arraka. "Si no fuera por mis consejos y por tu reliquia lessathi absurdamente poderosa, ¡esos stillwaters 'normales' los habrían estampado a todos contra el suelo!"
      - source: scene_text_2
        paragraph: 7
        text: |-
          "Vale, de acuerdo, ¡lo admito!" digo. "Puede que tuviéramos un poco de suerte allí, pero aun así eran cinco, ¡y eran un escuadrón! Es solo una stillwater, y encima no especialmente impresionante. Por los hechizos que le he visto lanzar hasta ahora, diría que es una elementalista de aire. ¿No es así, Melindra?"

          "¿Y qué si lo soy?" dice Melindra.

          "Eso es como... el tipo de elementalista más débil que existe", digo. "Incluso si tienes en cuenta a todos los magos artificiales con sus elementos no tradicionales inventados por los lessathi. ¿Puedes siquiera lanzar algo que no sean hechizos de viento?"

          "¡Claro que puedo!" dice Melindra, visiblemente molesta.

          "¿Ah, sí?" digo. "Entonces, ¿por qué no nos teletransportas a todos a la ciudad de Ollendor ahora mismo? Eiden podría haberlo hecho."

          "Yo no soy Eiden", dice Melindra.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch08a_obliterated
  - name: b2_ch08a_obliterated
    texts:
      - source: scene_text
        paragraph: 8
        text: |-
          "Vale, vale, error mío", digo. "Pero seguro que una poderosa elementalista de aire como tú podría volarnos a todos hasta allí sin problema, ¿no? Ah, espera... acabo de acordarme de que apenas podías mantenernos en el aire mientras pasábamos por encima de esa muralla. Entonces supongo que volar también queda descartado, ¿no? Vaya... Bueno, no sé el resto, pero a mí los stillwaters empiezan a sonarme menos a magos legendarios y más a magos normales con un poco más de poder y energía. Qué curioso cómo funciona esto, ¿eh?"

          Melindra frunce las cejas y aprieta los labios, poniendo otra vez esa expresión de puchero mientras me mira.

          "¡Ya basta, Barry!" dice Daren. "Apenas acabamos de empezar el viaje. ¿No querrás que estemos peleando todo el camino hasta Ollendor, verdad?"

          "Eh, yo solo digo..." digo. "Si admitiera que no es tan poderosa como cree y que podríamos vencerla fácilmente si fuéramos todos contra ella, todo sería mucho más sencillo para todos."
      - source: scene_text_2
        paragraph: 8
        text: |-
          "Bueno, ¿y si te demostrara que te equivocas?" dice Melindra, sonriendo con suficiencia mientras se cruje los nudillos. "Solo necesitamos que su mago blanco cancele temporalmente los efectos de su juramento de encantador y podremos ponernos manos a la obra."

          "¡Eh, ahora sí hablamos!" dice Hadrik con una sonrisa.

          "A mí me parece bien", digo.

          "¡AJAJAJA!" dice Arraka, mientras veo a Kate darse una palmada fuerte en la cara. "¡Los va a aniquilar a todos! Esa chica no sabe contenerse. ¡Ajajajá!"

          "¡Cállate!" grita Daren. "¡Aquí no va a pelear nadie! ¡No voy a deshacer el juramento solo porque ustedes quieran un combate de entrenamiento! ¡Estamos fuera de los límites de la ciudad! ¡Podrían atacarnos magos enemigos en cualquier momento! ¡No tenemos tiempo para jugar, aquí!"

          "¡Bien!" dice Melindra, frunciendo el ceño.
    choices:
      - position: 1
        text: Como sea.
        effects:
          - set:
              current_scene: b2_ch08a_whatever
              b2_ch8_tornado: 0
      - position: 2
        text: ¿Y si solo le pidiéramos que nos demostrara sus poderes, sin pelear contra nosotros?
        effects:
          - set:
              current_scene: b2_ch08a_tornado
              b2_ch8_tornado: 1
  - name: b2_ch08a_tornado
    texts:
      - source: scene_text
        paragraph: 9
        text: |-
          "¿Y si solo le pidiéramos que nos demostrara sus poderes, sin pelear contra nosotros?"

          "Mmm..." dice Daren. "Bueno, supongo que no estaría mal saber de qué es capaz. Ya que vamos a trabajar juntos un tiempo..."

          "¡Perfecto!" dice Melindra, iluminándosele la cara. "Esperen. Voy a alejarme muchísimo de ustedes porque no me gustaría acabar enterrándolos accidentalmente bajo una tonelada de rocas."

          "Eh..." dice Daren. "¿Qué es exactamente lo que estás pensando...?"

          No llega a terminar la frase porque Melindra sale volando de inmediato y termina alejándose tanto que apenas podemos distinguir ya su figura. Luego se detiene muy arriba en el cielo y parece alzar los brazos mientras canaliza su hechizo. No mucho después, sentimos un viento poderosísimo que viene hacia nosotros, mientras vemos las corrientes de aire bajo Melindra girando cada vez más rápido, hasta convertirse en un tornado en toda regla.

          Decenas de árboles están siendo arrancados de raíz y alzados en el aire por el torbellino gigante a lo lejos, e incluso grandes rocas bajo la tierra empiezan a desprenderse del suelo. Cuando una enorme nube de polvo cubre toda la zona entre nosotros y el tornado, los mercaderes de Thilias empiezan a detenerse al borde del camino para contemplar el espectáculo aterrador que se despliega ante sus ojos.
      - source: scene_text_2
        paragraph: 9
        text: |-
          "¡Vale, Melindra, creo que ya has dejado claro tu punto!" grita Daren con todas sus fuerzas. "Ya puedes bajar. Estás asustando a los lugareños."

          En cuanto oye a Daren llamarla, Melindra empieza a cancelar su hechizo, y todas las corrientes de aire que forman el tornado van frenándose poco a poco durante los treinta segundos siguientes, mientras los árboles y las rocas atrapados en él caen al suelo uno a uno. Una vez que el torbellino se disipa en el aire, Melindra vuelve volando y aterriza frente a nosotros con una sonrisa triunfal en el rostro.

          "¿Qué tal ha estado eso como demostración de mis poderes?" dice.

          "Vale, vale..." digo. "Ganas esta ronda. Puede que el elemento aire no sea tan débil como lo pinté antes."

          "¡Claro que no lo es!" dice Melindra. "¡Incluso el viento por sí solo puede hacer tanto daño, pero es que estamos hablando de viento mágico! Puedes afilarlo como cualquier otro elemento. Puedes reforzarlo. ¿Tienes idea de cuántas posibilidades...?"

          Melindra se detiene de repente a mitad de frase al perder por un momento el equilibrio, con los ojos cerrándosele, como si estuviera a segundos de desmayarse.

          "¿Estás... bien?" dice Daren mientras la ayuda a recuperar el equilibrio.

          "Estoy bien", dice simplemente Melindra, frotándose la frente con los ojos todavía cerrados.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch08a_tornado2
  - name: b2_ch08a_tornado2
    texts:
      - source: scene_text
        paragraph: 10
        text: |-
          "¡Ja!" dice Arraka. "¡Ya les dije que no sabe contenerse! Gastó toda su energía para hacer ese tornado, ¡y ahora está tan cansada que apenas puede mantenerse en pie!"

          "Espera, ¿hablas en serio?" dice Daren, que todavía sujeta a Melindra para asegurarse de que no vuelva a desmayarse. "¿Deberíamos hacer una pausa o algo?"

          "¡He dicho que estoy bien!" dice Melindra, apartándose de Daren. "Sigamos."

          Todos intercambiamos unas cuantas miradas, pero no decimos nada más y la seguimos en silencio durante los minutos siguientes. Al principio era bastante obvio para todos que a Melindra le costaba incluso caminar recta, pero su situación fue mejorando poco a poco a medida que avanzábamos por el bosque, probablemente porque su energía mágica iba restaurándose lentamente mientras caminaba.
      - source: scene_text_2
        paragraph: 10
        text: |-
          "Entonces..." le digo a Melindra mientras atravesamos la zona llena de cráteres y árboles caídos provocados por el tornado de antes. "¿Todavía recuerdas nuestra conversación de ayer? Estabas a punto de decirnos cómo se crean los stillwaters, pero luego nos desviamos y en realidad nunca retomamos aquella conversación inicial. ¿Seguimos donde lo dejamos?"

          "Eso es mentira, y lo sabes", dice Melindra. "Yo nunca dije que fuera a contarles nada sobre cómo alguien puede convertirse en un stillwater."

          "Vale, nunca dijiste que lo harías... pero nos lo vas a contar, ¿no?" digo.

          "No", dice Melindra.

          "¿Por qué no?" digo.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch08a_trailing
  - name: b2_ch08a_whatever
    texts:
      - source: scene_text
        paragraph: 11
        text: |-
          "Como sea", digo.

          "¡Estupendo!" dice Daren. "Entonces sigamos adelante. Melindra, ¿puedes ir en cabeza?"

          "Sí..." dice Melindra. "Como iba diciendo antes de que me interrumpieran, atravesar el bosque es más rápido que ir por el camino principal. Solo prepárense para defenderse de algunos monstruos, porque no hay guardias patrullando estas zonas. Síganme."

          Caminamos por el bosque durante unos minutos, en los que ninguno dice nada. Cuando empiezo a sentir que la tensión se ha rebajado un poco, decido retomar nuestra conversación de ayer con la esperanza de sacarle más información a Melindra.
      - source: scene_text_2
        paragraph: 11
        text: |-
          "Entonces..." le digo a Melindra. "¿Todavía recuerdas nuestra conversación de ayer? Estabas a punto de decirnos cómo se crean los stillwaters, pero luego nos desviamos y en realidad nunca retomamos aquella conversación inicial. ¿Seguimos donde lo dejamos?"

          "Eso es mentira, y lo sabes", dice Melindra. "Yo nunca dije que fuera a contarles nada sobre cómo alguien puede convertirse en un stillwater."

          "Vale, nunca dijiste que lo harías... pero nos lo vas a contar, ¿no?" digo.

          "No", dice Melindra.

          "¿Por qué no?" digo.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch08a_trailing
  - name: b2_ch08a_trailing
    routes:
      - condition: b2_ch8_tickle = 0
        texts:
          - source: scene_text
            paragraph: 13
            text: |-
              "Porque Eiden decidió, después del invierno inmóvil, que debíamos mantener en secreto lo que nos había pasado", dice Melindra. "Le preocupaba que, si la gente descubría cómo nos convertimos en stillwaters, ciertas personas intentaran aprovechar ese conocimiento en beneficio propio."

              "Espera", dice Hadrik. "¿Estás diciendo que todos los stillwaters fueron creados durante el invierno inmóvil?"

              "Más o menos", dice Melindra. "En cualquier caso, creo que sería muy poco probable que se toparan con algún stillwater de menos de seiscientos años."

              "¿Eso significa que todos los stillwaters son inmortales?" pregunta Kate.

              "No, inmortales no", dice Melindra. "Nos pueden matar perfectamente. Lo que pasa es que dejamos de envejecer en cuanto nos convertimos en stillwaters. También nos volvimos estériles y, en su mayor parte, inmunes a las enfermedades, pero eso no viene al caso."

              "Entonces, ¿ningún stillwater puede tener hijos?" dice Hadrik.

              "Sí, eso es justo lo que acabo de decir", dice Melindra.

              "¿Pero dónde están todos los demás stillwaters?" dice Daren.
          - source: scene_text_2
            paragraph: 13
            text: |-
              "Muertos, lo más probable", dice Melindra. "A la mayoría los mató Eiden, pero también hubo algunos que se descontrolaron y fueron cazados por varios mercenarios. Creo que pudo haber otros casos que no recuerdo, pero, en cualquier caso, hace siglos que no me encuentro con otros stillwaters aparte de Eiden. Oí que lleva tiempo viajando por el mundo, así que supongo que la mayoría de las leyendas que conocen sobre stillwaters en realidad eran sobre él."

              "¿Acabas de decir que Eiden mató a la mayoría de los otros stillwaters?" dice Daren. "¿Por qué lo hizo? ¿Y cuándo?"

              "Bueno..." dice Melindra. "Si soy completamente sincera, creo que quizá ya he dicho demasiado sobre este tema. Si quieren saber más, tendrán que preguntárselo directamente a Eiden."

              "¿Al menos podrías decirnos cómo conociste a Eiden y qué relación tienes con él?" pregunta Kate. "¿Son familia de casualidad?"

              "Oh, no, no somos familia", dice Melindra.

              "¿Entonces fueron amantes?" pregunta Hadrik.

              "No exactamente", dice Melindra.

              "Entonces, ¿por qué Arraka dijo que ibas detrás de él y del zorro durante el invierno inmóvil?" dice Kate.

              "Bueno", dice Melindra, "nos hicimos amigos mientras él estaba encarcelado. En realidad, éramos más bien socios de trueque que amigos, pero supongo que también acabamos haciéndonos amigos después."
