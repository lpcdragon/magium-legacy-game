        text: Continuar
        effects:
          - set:
              current_scene: b2_ch08a_inspiring
  - name: b2_ch08a_inspiring
    texts:
      - source: scene_text
        paragraph: 46
        text: |-
          "Oye, Daren...", digo, mirando a uno de los orcos muertos frente a mí. "La armadura que llevas ahora mismo es armadura anti-magia, ¿verdad?"

          "Entre otras cosas, sí", dice Daren.

          "Entonces, ¿por qué no llevas también un casco que complete el conjunto?", digo. "Acabas de ver lo útiles que resultaban esos cascos anti-magia para los orcos. Y si ya estás dispuesto a llevar armadura pesada completa, un casco tampoco va a pesarte mucho más, ¿no?"

          "No es una cuestión de peso", dice Daren. "Es una cuestión de ser consciente de lo que me rodea. A estos brutos descerebrados quizá no les importe perder visión periférica a cambio de un poco más de defensa, pero cuando estás en un campo de batalla con enemigos viniendo de todos lados, limitar tu visión es lo último que querría cualquier persona en su sano juicio. Además, esta cicatriz que tengo en la frente hace que hoy en día la mayoría me reconozca fácilmente y, cuando la gente me reconoce, por lo general tiende a intimidarse y a no enfrentarse a mí en combate, lo cual ayuda a evitar cierto derramamiento de sangre innecesario."

          "Por cierto, ¿cómo te hiciste esa cicatriz?", dice Hadrik. "Nunca te lo he preguntado. ¿Y por qué tiene forma de 'x'? ¿Hay algún monstruo con cola en forma de 'x' que yo no conozca o algo así?"

          "No", dice Daren. "La 'x' en realidad está formada por dos cicatrices distintas que recibí en la misma batalla."
      - source: scene_text_2
        paragraph: 28
        text: |-
          "¿Ah, sí?", pregunta Hadrik, mostrándose de pronto mucho más interesado. "¿Alguien fue lo bastante fuerte como para dejarle dos cicatrices al gran héroe Daren en la misma batalla? ¿Puedo preguntar quién fue?"

          "Fue mi maestro en artes marciales y encantamiento", dice Daren. "Un exsabio del Continente Sur. Bueno, no era un sabio cuando me estaba entrenando, pero se convirtió en uno después y perdió el título al año siguiente. Era un maestro extremadamente duro, sobre todo en lo referente a las artes marciales, y de los que siempre intentaban hacerte aprender las lecciones por tu propia experiencia, en lugar de darte la respuesta sin más. Como última lección, me dijo que lo enfrentara con todas mis fuerzas, usando todo lo que me había enseñado. Ahí fue cuando me hice las dos cicatrices. La primera vez que me hirió, no entendí la lección, así que decidió cortarme por segunda vez exactamente en el mismo punto, desde el lado opuesto, para dejar bien claro lo que quería enseñarme. Solo entonces me di cuenta de que el propósito de aquella batalla era mostrarme una gran debilidad de mi estilo de lucha que llevaba años ignorando sin darle demasiada importancia. La tercera vez que atacó ese mismo punto, ya estaba preparado para él y lo desarmé rápidamente, con lo que concluyó mi última lección. Ahora, cada vez que veo mi reflejo en el agua, me recuerda que debo permanecer siempre alerta y fijarme incluso en las debilidades más pequeñas, porque en una batalla real pueden marcar la diferencia entre la vida y la muerte."
      - source: scene_3
        paragraph: 6
        text: '"Vaya...", dice Hadrik. "Eso es curiosamente inspirador. Creo que yo también puedo tener alguna de esas pequeñas debilidades que nunca me molesté en corregir porque no las consideraba un problema tan grave, gracias a mi resistente piel de gigante, pero después de oír tu historia, estoy pensando que quizá debería mover el culo y hacer algo al respecto antes de que sea demasiado tarde. ¡Después de todo, nunca sabes lo que puede pasar!"'
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch08a_uphold
  - name: b2_ch08a_uphold
    texts:
      - source: scene_text
        paragraph: 47
        text: |-
          "¡Oigan!", grita de pronto Melindra desde muy por encima de nosotros. "Entonces... ¿ya terminaron su reunión secreta de estrategia? ¿Creen que quizá ya puedo bajar para que continuemos el viaje? Sin presión, claro. Tómense todo el tiempo que quieran."

          "¿Pero qué...?", empieza a decir Daren mientras alza la vista hacia Melindra, pero se interrumpe. "Uf... Sí, Melindra, ya puedes bajar."

          "Espléndido", dice Melindra, lanzándose en picado hacia nosotros y alcanzando el suelo en pocos segundos. "Que sepan que la batalla que tuvieron con esos monstruos estuvo muy por debajo de mis expectativas. Van a tener que ponerse las pilas si de verdad piensan servirme de algo cuando lleguemos a Ollendor."

          "Escucha, Melindra...", dice Daren. "Tú puede que hayas hecho un juramento para cumplir tu parte del trato, pero ninguno de nosotros hizo un juramento para cumplir la nuestra. Puede que lo hayas olvidado, pero todavía podemos cancelar este trato en cualquier momento si no queremos seguir trabajando contigo. Y, con la forma en que te has comportado hasta ahora, nos has dado muy buenas razones para replantearnos nuestro acuerdo. Así que haremos esto. Si todavía quieres que te ayudemos con lo de Ollendor, entonces deja de quejarte y guíanos adonde tenemos que ir. Y si no, me temo que tendrás que buscar a otro grupo que haga tu trabajo sucio."
      - source: scene_text_2
        paragraph: 29
        text: |-
          "¡Bien!", dice Melindra, frunciendo el ceño. "Si así van a ser las cosas, entonces no volverán a oír ni una palabra más de mí."

          Entonces se adelanta furiosa y todos empezamos a seguirla, uno por uno, hacia las profundidades del bosque.

          "Entonces, eh...", digo mientras caminamos detrás de Melindra. "Illuna, ¿crees que esos dos goblins podían formar parte del ejército de Fyron? ¿Es posible que el general goblin esté trabajando ahora con el dragón?"

          "Lo dudo mucho", dice Illuna. "El dragón ya tiene bastantes goblins bajo su mando. No debería necesitar a Fyron ni a sus goblins 'libres'. De hecho, la única razón por la que Fyron y su grupo han sobrevivido tanto tiempo es, con toda probabilidad, que al dragón en realidad no le importan. No hay ningún pacto que proteja a los goblins, así que Tyrath podría destruir perfectamente todo su campamento él solo si considerara que merece la pena, y nadie sería capaz de detenerlo."
    choices:
      - position: 1
        text: ¿Fyron sirvió alguna vez al dragón antes de unirse a los goblins libres?
        effects:
          - set:
              current_scene: b2_ch08a_serve
      - position: 2
        text: ¿Cuántos tipos de monstruos tiene exactamente Tyrath bajo su mando?
        effects:
          - set:
              current_scene: b2_ch08a_types
  - name: b2_ch08a_serve
    texts:
      - source: scene_text
        paragraph: 48
        text: |-
          "¿Fyron sirvió alguna vez al dragón antes de unirse a los goblins libres?"

          "Sí", dice Illuna. "Hace mucho tiempo. Por lo que entendí, se marchó por lo mal que el dragón y las otras razas de monstruos trataban a los goblins. Puede que sean la raza de monstruos más ingeniosa, pero físicamente son, con diferencia, la más débil, y además tampoco nacen muchos magos entre ellos. Por eso, a los goblins siempre los obligaban a realizar tareas serviles, las otras razas se burlaban de ellos y casi siempre estaban al borde de la inanición. Cuando Fyron abandonó el ejército de Tyrath y se llevó consigo a sus goblins, el dragón ni siquiera se molestó en detenerlos, porque para él no eran más que algo irrelevante y, así, los goblins formaron una nueva facción llamándose a sí mismos los 'goblins libres'. Sin embargo, solo una fracción de los goblins siguió realmente a Fyron. La mayoría prefirió quedarse, porque al menos el dragón garantizaba su protección frente a animales y humanos, y les daba la comida suficiente para subsistir. Incluso algunos de los goblins que se marcharon con Fyron decidieron más tarde regresar junto al dragón debido a las condiciones todavía peores del campamento de Fyron. Sin embargo, quienes decidieron quedarse terminaron logrando una vida mejor para sí mismos que la que solían tener, después de muchos años de duro trabajo y esfuerzo, y con el tiempo consiguieron que otros goblins e incluso otros tipos de monstruos se unieran voluntariamente a su campamento."
      - source: scene_text_2
        paragraph: 30
        text: |-
          "Un momento", dice Daren. "¿Quién demonios es ese Fyron y por qué ustedes dos actúan como si ya lo conocieran?"

          "Fyron es el general de los goblins libres de Varathia", dice Illuna.

          "Vale, ¿y cómo lo conocen?", dice Daren.

          "Illuna lo conoce desde antes de unirse a nosotros, creo", digo. "Yo me lo encontré mientras caminaba por los túneles subterráneos de la arena con Leila, intentando sabotear el evento."

          "¿Estabas intentando sabotear el...?", dice Daren, atónito, pero se interrumpe a media frase y niega con la cabeza. "Madre mía... Nunca hay nada sencillo contigo, ¿verdad, Barry?"

          "Entonces...", dice Hadrik. "No quiero interrumpir su conversación ni nada, pero ¿no deberíamos empezar a preocuparnos un poco por esos grupos de monstruos tan bien entrenados que van detrás de nuestras cabezas? Quiero decir, hasta yo tuve problemas con aquellos ogros y, por lo que vi, nuestros lanzadores de hechizos casi no hicieron nada contra los orcos con armadura anti-magia. ¿Quizá deberíamos replantearnos un poco nuestras estrategias?"

          "Bueno", dice Kate, "quizá la batalla habría ido mejor si cierto miembro del grupo no hubiera ignorado por completo la pelea..."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch08a_capabilities
  - name: b2_ch08a_types
    texts:
      - source: scene_text
        paragraph: 49
        text: |-
          "¿Cuántos tipos de monstruos tiene exactamente Tyrath bajo su mando?"

          "No conozco todos los detalles", dice Illuna, "pero, hasta donde yo sé, los monstruos con diferencia más leales al dragón son los orcos. No son tan fuertes como los ogros, pero tampoco son tan tontos como ellos, y por lo general son más poderosos que la mayoría de los humanos. Los orcos constituyen la fuerza principal del ejército del dragón, pero también tiene otros monstruos de tipo humanoide como ogros, troles y goblins, además de varias criaturas como guivernos e hidras. Sería bastante raro encontrarse un orco en Varathia que no sirva a Tyrath, pero hay muchos ogros que no tienen nada que ver con el dragón, como los que combatimos en el fuerte, y los troles son, en su mayoría, una raza de mercenarios, así que su lealtad al dragón es inconstante. En cuanto a los goblins, apostaría a que la mayoría de los goblins de Varathia siguen todavía a Tyrath, aunque últimamente Fyron también ha ido consiguiendo nuevos reclutas para su campamento."
      - source: scene_text_2
