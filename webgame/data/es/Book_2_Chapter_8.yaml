              "¡Maldición, se escapan!", dice Daren mientras corre hacia el capitán, pero ya es demasiado tarde.

              Apenas unos segundos después de que aparezca la luz blanca, el orco y los ogros son teletransportados fuera de la zona, casi con toda seguridad junto con los dos goblins que hasta ahora permanecían escondidos en el bosque.

              "Así que para eso estaban los goblins", dice Kate. "No se unieron a la batalla porque necesitaban estar tranquilos y concentrados para poder lanzar el hechizo de teletransportación si surgía la necesidad de retirarse."

              "¿Dónde están los orcos?", dice Flower de repente, al aparecer por detrás de los árboles. "¿Consiguieron escapar? Oh, ya mataron a los tres de los escudos y las mazas..."

              "Su capitán sí consiguió escapar", dice Illuna. "Y también los ogros, por lo que parece."

              "¿Qué pasó con los goblins?", digo. "¿No llegaron hasta ellos a tiempo?"

              "Guau...", dice Flower al verme de pronto con el tronco del árbol todavía en las manos, y da un paso atrás por instinto.
          - source: scene_text_2
            paragraph: 26
            text: |-
              "No", me responde Illuna. "Uno de los goblins había lanzado un hechizo de sugestión parecido al que Kate usa para mantener alejados a los enemigos de nuestro campamento. El hechizo no nos dejaba acercarnos a ellos a menos que supiéramos su ubicación exacta, porque necesitábamos concentrarnos en ella mientras avanzábamos. Intentamos que Arraka nos describiera el paisaje que los rodeaba, pero tardamos demasiado y al final se teletransportaron fuera de la zona."

              "Entonces, ¿adónde fueron?", digo. "¿Piensan volver a tendernos una emboscada?"

              "Lo dudo", dice Illuna. "Por lo que nos dijo Arraka, ya no puede sentir monstruos a nuestro alrededor y, dado el área relativamente amplia que puede abarcar con su sentido mágico, sospecho que por ahora los monstruos han vuelto a su cuartel general."

              "Chicos, chicos, ya sé que todos se lo están pasando muy bien usando árboles como porras y todo eso", dice Daren, "pero ¿podrían soltar esos árboles de una vez? Me están poniendo nervioso."

              "Ah, claro, sí", decimos Hadrik y yo al unísono, mientras arrojamos los árboles a un lado.
          - source: scene_3
            paragraph: 5
            text: |-
              "Además, agradecería muchísimo que evitaran volver a usar árboles como armas a partir de ahora", dice Daren. "Ya es bastante difícil concentrarse en todos los enemigos a la vez sin tener que estar pendiente también de dónde están balanceando ustedes esas enormes porras sobredimensionadas con cientos de ramas encima."

              "Oh, sí, ¡no te preocupes por eso!", dice Hadrik. "Esto era solo por diversión. Peleo mucho mejor sin usar armas."

              "No voy a mentir, Barry", dice Daren. "Eso ha sido bastante impresionante."

              "¡Eh, gracias!", digo. "¡Tú tampoco lo hiciste nada mal!"
