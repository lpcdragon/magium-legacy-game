  - name: b2_ch08a_imprisoned
    texts:
      - source: scene_text
        paragraph: 14
        text: |-
          "¿Eso fue antes del invierno inmóvil? ¿Por qué lo tenían encarcelado?"

          "Sí, fue antes del invierno inmóvil", dice Melindra. "No sé por qué lo tenían encarcelado. Nunca me lo dijo."

          "¿Quién lo tenía prisionero?" dice Kate.

          "No creo que deba hablar de esto..." dice Melindra.

          "¿Por qué no?" dice Kate. "¿Eiden te pidió que no hablaras de ello?"

          "Algo así, sí", dice Melindra.

          "¿Y lo de 'socios de trueque' que mencionaste antes?" dice Hadrik. "¿De eso sí puedes hablar?"
      - source: scene_text_2
        paragraph: 14
        text: |-
          "Supongo..." dice Melindra. "Verán, cuando me encargaron limpiar los pasillos de la prisión, solía fijarme en ese enorme montón de rocas que había en una esquina de la celda de Eiden, y cada una de esas rocas era tan maravillosamente única en su forma, tamaño y composición que casi no podía apartar la vista de ellas. No estaba segura de cómo podría convencer a Eiden de que me las diera, pero en cuanto vi esas rocas, supe que tenía que tenerlas. Así que seguí volviendo a la celda de Eiden y empecé a hablar con él todos los días, con la esperanza de descubrir algo que necesitara de fuera de su celda para poder dárselo a cambio de algunas de sus rocas."

          "¿Querías hacer un trato con él por unas rocas?..." pregunta Daren. "¿No podías simplemente pedírselas?"

          "Bueno, obviamente podría habérselas pedido", dice Melindra. "¡Pero quién sería tan estúpido como para regalarlas?"

          "Pero si son..." empieza a decir Daren, aunque se interrumpe a mitad de la frase. "Uf... ¿sabes qué? Tienes razón. Error mío. Por favor, continúa."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch08a_trade
  - name: b2_ch08a_powers
    texts:
      - source: scene_text
        paragraph: 15
        text: |-
          "¿Cómo lograron encarcelarlo si tiene todos esos poderes?"

          "En aquella época aún no era un stillwater", dice Melindra.

          "Pero seguía siendo un mago, ¿no?" pregunta Hadrik. "¿Cómo mantenían sus poderes a raya? ¿Usaban una celda anti-magia o de parálisis?"

          "No, era una celda normal", dice Melindra.

          "¿Eiden llevaba algún tipo de collar mientras estaba en su celda?" dice Kate.

          "Mmm..." dice Melindra. "Estoy bastante segura de que no llevaba ningún tipo de collar en aquel entonces."

          "Entonces, ¿cómo consiguieron atraparlo?" pregunta Kate. "¿Y quién fue quien lo capturó?"

          "Eh..." dice Melindra. "De verdad no creo que deba hablar de esto."

          "¿Por qué no?" dice Kate. "¿Eiden te pidió que no hablaras de ello?"

          "Algo así, sí", dice Melindra.

          "¿Y lo de 'socios de trueque' que mencionaste antes?" dice Hadrik. "¿De eso sí puedes hablar?"
