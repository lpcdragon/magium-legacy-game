  - name: b2_ch08a_unlikeable
    texts:
      - source: scene_text
        paragraph: 59
        text: |-
          "¿Oh?", dice Melindra con la sonrisa de una niña que acaba de encontrar un juguete nuevo con el que jugar. "Así que te resulto desagradable, ¿eh?"

          "Bastante desagradable, sí", digo.

          "¿Y no te gusta hablar conmigo?", dice Melindra.

          "No demasiado", digo.

          "Bueno, en ese caso no veo otra alternativa que seguir fastidiándote hasta que empieces a encontrarme agradable", dice Melindra con una sonrisa pícara.

          "Así no funcionan estas cosas", digo.

          "¿De qué estás hablando?", dice Melindra, sin dejar de sonreír. "Claro que así funcionan. Tú eres medio lessathi, yo soy medio lessathi, ambos somos medio lessathi. ¿Qué motivo posible podrías tener para no soportarme?"

          "Oh, no sé...", digo. "¿Quizá tu personalidad?"

          "Oye, Melindra", dice Daren mientras se nos acerca. "Ya estamos todos listos para seguir. ¿Puedes indicarnos el camino?"
      - source: scene_text_2
        paragraph: 38
        text: |-
          "Oh, claro", dice Melindra. "Solo sigan el río en esa dirección durante un rato y estarán bien. Ahora los alcanzamos."

          "Eh... vale, ¿supongo?...", dice Daren, y luego se vuelve hacia los demás. "Bueno, ya la han oído. Sigamos el río."

          Daren y el resto del grupo recogen sus mochilas, preparándose para irse, y cuando pasan junto a nosotros puedo ver a Kate mirándonos con cierta sospecha.

          "Entonces, sobre tus padres...", empieza a decir Melindra, pero no espero a que termine la frase y voy a reunirme con los demás mientras guardo el cuaderno en la mochila.

          "¡Eh, aún no había terminado de hablar!", dice Melindra, apresurándose a ponerse a mi lado.

          "¿Ah, no?", digo con tono seco. "Perdona, no estaba escuchando."

          "Bueno, en ese caso acepto tu disculpa", dice Melindra, aparentemente ajena al matiz sarcástico de mi comentario anterior. "En fin, creo que uno de tus padres pudo haber formado parte de la cúpula lessathi o al menos haber estado relacionado con ella de algún modo."
