  - name: b2_ch08a_goblins
    routes:
      - condition: b2_ch7_dizziness = 0
        texts:
          - source: scene_text
            paragraph: 28
            text: |-
              "¡Flower! ¡Illuna!", digo. "Quiero ir a comprobar por qué los dos goblins magos aún no nos han atacado. ¿Podrían venir conmigo? Deberíamos poder encontrar dónde se esconden con un poco de ayuda de Arraka."

              "Ah, claro, ¡los goblins!", dice Flower. "Se me habían olvidado por completo. Creo que hasta llegué a sentir que uno de ellos lanzaba un hechizo cuando los orcos nos atacaron. ¡Síganme, es por aquí!"

              Entonces se adentra en el bosque y yo me apresuro a seguirla, dejando atrás al resto, por ahora. Después de unos veinte segundos corriendo, por alguna razón empiezo a sentir que no estamos avanzando mucho y algunos de los árboles por los que pasamos me resultan extrañamente familiares.

              "¿Qué demonios están haciendo?", nos pregunta Arraka al cabo de un rato. "¿Son completamente incapaces de correr en línea recta durante más de cinco segundos? ¿Cuántas veces van a seguir dando vueltas por esta zona antes de decidirse a ir por fin hacia esos goblins?"

              "¿De qué estás hablando?", digo. "Hemos estado avanzando en la misma dirección todo este tiempo."

              "¡Han estado corriendo en círculos, idiota!", dice Arraka. "¿Necesitas que te dibuje un mapa? Espera, deja que te lo enseñe."

              Entonces conjura uno de sus mapas holográficos en el aire y empieza a trazar una línea, mostrándonos la dirección que hemos seguido desde que empezamos a ir a por los goblins. La línea avanza durante un rato en una dirección, pero después la trayectoria cambia por completo y vuelve a pasar por la misma zona una y otra vez.
          - source: scene_text_2
            paragraph: 21
            text: |-
              "¿Ven?", dice Arraka. "Esos son ustedes. Así de idiotas se veían. ¿Y ven esos dos puntos allí? Ahí están los goblins. Ahora dejen de perder el tiempo y muévanse. Me está dando vergüenza ajena solo de verlos."

              Intento avanzar exactamente en la dirección en la que aparecen dibujados los goblins en el mapa de Arraka, pero por alguna razón no consigo avanzar más de unos pocos pasos. Cada vez que me acerco demasiado a los goblins, instintivamente me aparto de ellos sin darme cuenta, y entonces me veo yendo en dirección contraria en el mapa. Peor aún es que mi mente se me nubla casi por completo cada vez que esto pasa, y siento como si lo único en lo que pudiera pensar fuera en alejarme de esa zona, aunque en realidad no tenga ningún motivo para hacerlo.

              "Hay un hechizo de sugestión lanzado sobre esta zona", dice Illuna mientras estudia atentamente el terreno que tenemos delante. "A Arraka probablemente no le afecte tanto como a nosotros porque está dentro del amuleto, pero el hechizo parece tener un efecto parecido al que Kate está usando para proteger nuestro campamento."
          - source: scene_3
            paragraph: 3
            text: |-
              "Vaya...", digo. "Supongo que no bromeabas cuando dijiste que tu protección contra el mareo me volvería vulnerable a los hechizos de sugestión. El efecto del hechizo sobre mí era tan fuerte que apenas podía pensar en otra cosa que no fuera alejarme de esa zona, hasta que estuve lo bastante lejos de ella."

              "Sí", dice Illuna. "Pero los hechizos de sueño y los hechizos de mareo se usan muchísimo más que los hechizos de sugestión, así que no es un mal intercambio. En cualquier caso, no vamos a atravesar esta zona a menos que obtengamos una descripción muy detallada del entorno en el que están esos dos goblins, para poder imaginar ese lugar mientras avanzamos. Arraka, ¿qué puedes decirnos del entorno que rodea a esos goblins?"
        effects:
          - set:
              ac_b2_ch8_effects: 1
            achievement:
              id: ac_b2_ch8_effects
              title: Efectos secundarios
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch08a_goblins2
      - condition: b2_ch7_dizziness = 1
        texts:
          - source: scene_text
            paragraph: 29
            text: "\"Flower! Illuna!\" I say. \"I want to go check why the two goblin mages haven't attacked us yet. Could you come with me? We should be able to find where they're hiding, with a little help from Arraka.\"\r\n\r\n\"Oh, right, the goblins!\" Flower says. \"I completely forgot about them. I think I may have actually sensed one of them cast a spell when the orcs attacked us. Follow me, it's this way!\"\r\n\r\nShe then heads into the woods, and I rush to follow her, leaving the others behind, for now. After about twenty seconds of running, for some reason, I'm feeling that we aren't making a lot of progress, and some of the trees we are passing look oddly familiar.\r\n\r\n\"What the hell are you doing?\" Arraka asks us, after a while. \"Are you completely incapable of running in a straight line for more than five seconds? How many times are you going to keep circling around this area before you decide to finally head towards those goblins?\"\r\n\r\n\"What are you talking about?\" I say. \"We've been heading in the same direction this whole time.\"\r\n\r\n\"You've been running in circles, you moron!\" Arraka says. \"Do I need to draw you a map? Hold on, let me show you.\"\r\n\r\nShe then conjures one of her map holograms into the air, and she starts drawing a line on it, showing us the direction in which we've been going since we began heading for the goblins. The line goes into one direction for a while, but after that, the trajectory changes completely, going through the same area over and over again."
          - source: scene_text_2
            paragraph: 22
            text: |-
              "¿Ven?", dice Arraka. "Esos son ustedes. Así de idiotas se veían. ¿Y ven esos dos puntos allí? Ahí están los goblins. Ahora dejen de perder el tiempo y muévanse. Me está dando vergüenza ajena solo de verlos."

              Intento avanzar exactamente en la dirección en la que aparecen dibujados los goblins en el mapa de Arraka, pero por alguna razón no consigo avanzar más de unos pocos pasos. Cada vez que me acerco demasiado a los goblins, instintivamente me aparto de ellos sin darme cuenta, y entonces me veo yendo en dirección contraria en el mapa.

              "Hay un hechizo de sugestión lanzado sobre esta zona", dice Illuna mientras estudia atentamente el terreno que tenemos delante. "A Arraka probablemente no le afecte tanto como a nosotros porque está dentro del amuleto, pero el hechizo parece tener un efecto parecido al que Kate está usando para proteger nuestro campamento. No vamos a atravesar esta zona a menos que obtengamos una descripción muy detallada del entorno en el que están esos dos goblins, para poder imaginar ese lugar mientras avanzamos. Arraka, ¿qué puedes decirnos del entorno que rodea a esos goblins?"
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch08a_goblins2
  - name: b2_ch08a_goblins2
    texts:
      - source: scene_text
        paragraph: 30
        text: |-
          Antes de que Arraka llegue a responder, oímos el sonido de un cuerno muy fuerte procedente de la zona donde todos nuestros amigos estaban peleando y, apenas unos segundos después, los dos puntos que representan a los goblins desaparecen del mapa de Arraka, junto con las auras de todos los orcos y los ogros del campo de batalla.

          "Bueno", dice Illuna, "al menos ahora ya sabemos para qué estaban allí los goblins. Uno de ellos estaba manteniendo el hechizo de sugestión, mientras el otro esperaba agazapado en un lugar apartado donde nadie pudiera molestarlo, por si necesitaba concentrarse en lanzar el hechizo de teletransportación después de recibir la señal de retirada."

          "Volvamos con los demás", digo. "Esperemos que todos estén bien."

          Cuando regresamos a la zona donde se había producido la pelea, pronto descubrimos que no todos han salido del conflicto completamente ilesos. Leila está ahora tumbada en el suelo, con el tobillo izquierdo rojo e hinchado, mientras Daren está arrodillado a su lado, con las manos ligeramente por encima de la herida y una luz blanca brillante saliendo de ellas.

          "Solo tienes que aguantar un poco más", dice Daren al ver a Leila hacer una mueca de dolor sin emitir ningún sonido. "El hechizo de curación casi ha terminado."

          "Dioses, ¿qué ha pasado aquí?", dice Flower.
      - source: scene_text_2
        paragraph: 23
        text: |-
          "Leila consiguió matar ella sola a dos de los orcos con los que estaba peleando", dice Daren, "pero el tercero le aplastó la pierna con la maza antes de que tuviera tiempo de retirarse. Al menos eso le dio a Kate la oportunidad que necesitaba para meterle uno de sus conos de hielo por la abertura del yelmo y rematarlo, pero la herida que recibió Leila no era ninguna broma. Ahora tiene mucho mejor aspecto que antes. En fin, después de que murieran esos tres orcos, su capitán se apartó de mí de un salto y sopló su cuerno para ordenar la retirada. ¿Qué pasó con los goblins? ¿Escaparon junto con los otros monstruos?"

          "Sí", dice Illuna. "No conseguimos llegar hasta ellos a tiempo porque tenían un hechizo de sugestión que nos mantenía alejados. Recibieron la señal de retirada antes de que pudiéramos encontrar la manera de sortear los efectos del hechizo."

          "¿Pero adónde fueron?", dice Hadrik. "¿Piensan volver a tendernos una emboscada?"

          "Nah", dice Arraka. "Se han ido. Si no puedo sentirlos, entonces seguramente se hayan retirado a su cuartel general. Esté donde esté."

          "Ya está curada", dice Daren, mientras el tobillo de Leila recupera su color y tamaño normales. "Pero no del todo. No deberías intentar más acrobacias al menos durante un día, hasta que te recuperes por completo. Aun así, deberías poder caminar sin demasiados problemas."

          "Gracias...", escribe Leila mientras se levanta del suelo.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch08a_dispatches
  - name: b2_ch08a_trees
    routes:
      - condition: b2_ch5_scimitar <> 0
        texts:
          - source: scene_text
            paragraph: 31
            text: |-
              "¡Flower! ¡Illuna!", digo. "¿Podrían ir a ver por qué los dos goblins magos no nos han atacado todavía? Deberían poder encontrar dónde se esconden con un poco de ayuda de Arraka."

              "Ah, claro, ¡los goblins!", dice Flower. "Se me habían olvidado por completo. Creo que hasta sentí que uno de ellos lanzaba un hechizo cuando los orcos nos atacaron. ¡Vamos, Petal! ¡Era por aquí!"

              No mucho después de que Flower e Illuna desaparecen entre los árboles, decido que ha llegado el momento de hacer por fin mi movimiento.

              Saco mi cimitarra de la vaina y corro hacia uno de los árboles que rodean la zona. Luego uso mi arma para cortarlo de un solo movimiento y, justo cuando el árbol empieza a caer al suelo, envaino la hoja y lo agarro con ambas manos para usarlo como mi nueva arma.

              Al echar un vistazo hacia los tres orcos que estaban peleando con Leila, todos los combatientes del campo de batalla parecen haberse detenido por un instante para mirarme con expresiones de sorpresa. Aprovecho su breve desconcierto para lanzarme contra los tres orcos de las mazas y aplasto de inmediato a uno de ellos bajo el peso del tronco.

              "Leila, apártate de los orcos", digo.
          - source: scene_text_2
            paragraph: 24
            text: |-
              Leila obedece de inmediato y pone toda la distancia que puede entre ella y los dos orcos restantes armados con mazas, aunque uno de ellos empieza a seguirla enseguida. Balanceo mi árbol como si fuera una maza y golpeo de lado al orco que se quedó atrás, aplastándole por completo los órganos internos y matándolo antes de que toque el suelo. Al ver que ya solo queda un orco aparte del capitán, Leila deja de alejarse del campo de batalla y se lanza directamente sobre el que la perseguía, abriéndole el cuello de par en par sin darle tiempo a reaccionar.

              "¡JAJAJAJA!", se ríe Hadrik de repente. "¡Qué idea tan buena! ¿Cómo no se me ocurrió a mí?"

              Entonces corre hacia un árbol que tiene detrás y lo arranca de cuajo, raíces y todo. En cuanto consigue su nueva arma, Hadrik intenta aplastar a uno de los ogros con el peso del árbol, pero el monstruo simplemente bloquea el golpe con su garrote, y la fuerza del impacto lo hunde un pie en la tierra.

              "Daren, quizá quieras apartarte de ahí...", digo, mientras Daren se aleja de un salto del capitán orco y yo lanzo mi árbol contra él, intentando aplastarlo igual que hice con sus compañeros.
          - source: scene_3
            paragraph: 4
            text: |-
              El orco no se deja intimidar y blande sus hachas en llamas con tanta rapidez que corta mi árbol en seis pedazos antes siquiera de que lo alcance. Mientras los trozos de madera, ya ardiendo, caen al suelo a su lado, el orco se me queda mirando directamente con una expresión de furia absoluta.

              "Maldición...", digo, mirando el gran pedazo de madera que todavía me queda en las manos.

              Sin embargo, en lugar de enfrentarse a mí, el capitán orco lleva la mano al cuerno que llevaba colgado del cuello y lo hace sonar con todas sus fuerzas. En cuanto lo hace, los ogros se apartan de Hadrik y una luz blanca intensísima empieza a envolver a todos los monstruos, mientras sus cuerpos comienzan a vibrar con fuerza.
        effects:
          - set:
              successful_checks:
                - '[ Comprobación de fuerza exitosa - nivel 3 ]'
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch08a_retreat
