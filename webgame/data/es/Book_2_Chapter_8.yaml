        paragraph: 78
        text: |-
          "Ya te lo he dicho", digo. "No quiero que duermas en mi tienda. Vete a molestar a otro."

          "Bueno, está bien", dice Melindra con una expresión extrañamente seria en los ojos. "Si de verdad quieres que me vaya tanto, me iré. Pero que sepas que vas a arrepentirte de esto..."

          Entonces tira de la cremallera de la tienda y se prepara para salir.

          "¡Espera!", digo. "¡No te has lanzado el hechizo de invisibilidad!"

          Melindra me ignora por completo, sale de la tienda y cierra la cremallera detrás de ella.
