  - name: b2_ch08a_indeed
    texts:
      - source: scene_text
        paragraph: 52
        text: |-
          "En efecto, lo es", digo, sin apartar la vista de mi cuaderno.

          Cuando termino de hablar, se produce un breve silencio durante el cual paso otra página del cuaderno.

          "Bueno, en fin", dice Melindra, "tenía curiosidad por una cosa. Sé que eres un medio lessathi, y también sé que viniste aquí como participante en el torneo, pero, hasta donde yo sé, normalmente los lessathi solo se encuentran en el continente de Varathia. Así que me preguntaba quiénes son exactamente tus padres y por qué dejaron este continente."

          "Si hablas de mis padres biológicos, lo más probable es que nunca llegara a conocerlos", digo. "Estoy bastante seguro de que los padres que realmente me criaron eran dos humanos corrientes."

          "¿'Eran' humanos corrientes?", dice Melindra, intrigada. "¿No 'son'?"

          "No", digo simplemente. "Ahora están muertos. Los mató una banshee."

          Al pronunciar esas palabras, Daren, que estaba sentado no muy lejos de mí en una roca afilando su espada, parece empezar a prestar un poco más de atención a nuestra conversación. De repente caigo en la cuenta de que en realidad nunca le conté cómo me encontré con mi primera banshee.

          "¿Los mató una banshee?", dice Melindra. "¿Y tú no estabas allí cuando ocurrió?"

          "Sí que estaba", digo. "Yo fui quien la mató."
      - source: scene_text_2
        paragraph: 33
        text: |-
          "¿Mataste tú solo a una banshee?", dice Melindra. "Pero la única manera en que alguien tan poco poderoso como tú podría aspirar a derrotar a una banshee sería atacándola en su estado más vulnerable, justo después del despertar. Lo que significa que..."

          Hace una pausa un segundo, mientras la comprensión se dibuja en su rostro.

          "Eso significa que la persona que se convirtió en banshee también formaba parte de tu familia, ¿verdad?", dice Melindra. "¿Tu hermana, quizá? ¿Una prima?"

          "Mi hermana", digo.

          "¿Y la mataste con tus propias manos?", pregunta Melindra con una mirada de morbosa curiosidad en los ojos. "¿Cómo se veía la banshee al despertar? ¿De verdad parecía un monstruo auténtico, como dicen las leyendas? ¿Y tu hermana? ¿Parecía conservar todavía una parte de su conciencia antes de que terminara el proceso de despertar, o ya no quedaba nada de ella?"
      - source: scene_3
        paragraph: 7
        text: |-
          "Escucha, Melindra", digo, cerrando el cuaderno y mirándola por fin a los ojos. "Si vamos a meternos en temas incómodos de los que no nos gusta hablar, yo también tengo unas cuantas preguntas para ti..."

          Entonces bajo la voz para asegurarme de que Daren ya no pueda oírme.

          "Para empezar", digo, "¿por qué nos mentiste cuando dijiste que la razón por la que no nos ayudaste a luchar contra los orcos antes era porque querías ponernos a prueba?"
