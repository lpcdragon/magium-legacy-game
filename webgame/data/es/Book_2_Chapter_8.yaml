  - name: b2_ch08a_defenses
    texts:
      - source: scene_text
        paragraph: 20
        text: |-
          "Espera, ¿hay monstruos intentando tendernos una emboscada?" digo mientras me quito rápido la mochila y saco la ballesta. "¡Maldición, Arraka, tenías UNA sola tarea!"

          "Mi 'tarea' era avisarte de enemigos invisibles, idiota", dice Arraka. "Ninguno de estos enemigos es invisible. Además, ¿qué clase de idiotas son ustedes para no darse ni cuenta de que unos monstruos les están tendiendo una emboscada?"

          "¿De qué tipo de monstruos estamos hablando?" dice Kate. "¿Y cuántos? Están demasiado lejos para que pueda percibirlos bien con mi sentido mágico."

          "Oh, en realidad no están tan lejos", dice Melindra. "Pero todos están suprimiendo sus auras mágicas, así que es comprensible que no puedan sentirlos acercarse. Creo que son unos cinco orcos, dos ogros y dos goblins. Los dos goblins son magos, pero los demás parecen ser solo guerreros. Deberían poder ocuparse de ellos sin demasiados problemas."

          "¿Deberían?" pregunta Daren. "¿No querrás decir 'deberíamos'? Como en 'nosotros', el grupo de personas que viaja junto y que también va a pelear junto contra estos monstruos, como un equipo."

          "¿Qué?" dice Melindra. "Claro que no. No seas ridículo. ¿De qué serviría llevarlos conmigo hasta Ollendor si ni siquiera pueden vencer a unos pocos monstruos por su cuenta? ¿Tienen idea de las buenas defensas que hay en esa ciudad? Si no, ¿cómo creen que su rey puede permitirse enfadar a todos los demás reinos de Varathia sin que lo hayan matado ya?"
      - source: scene_text_2
        paragraph: 17
        text: |-
          "¿Y si los monstruos nos matan antes de que lleguemos allí?" dice Daren.

          "Entonces tendría que buscar a otra persona que me ayudara", dice Melindra. "A alguien capaz de matar a unos cuantos orcos sin quejarse tanto. Escuchen, son solo unos pocos monstruos. No es el fin del mundo. La maga de hielo seguramente podría derrotarlos ella sola. La niñita también. Hasta el medio lessathi probablemente podría con ellos si invirtiera en las estadísticas adecuadas."

          "Sabes que tenemos nombres..." dice Daren.

          "Yo no sé sus nombres", dice Melindra. "Y además, ¿para qué iba a necesitarlos? Se distinguen lo bastante por sus razas y especializaciones como para que no me moleste en aprenderlos."

          "Te estás esforzando mucho por sacarnos de quicio, ¿verdad?" dice Daren.

          "¿Por qué dices eso?" pregunta Melindra, con una expresión sinceramente desconcertada.

          "¡Callaos!" dice Kate. "Puedo oír a los ogros acercándose por detrás. Creo que los orcos también han empezado a avanzar. Deberíamos verlos delante de nosotros en cualquier momento."

          "¡Vaya, eso es impresionante!" dice Melindra. "¿Puedes saber todo eso solo por el sonido de sus pasos? ¿Cómo notas la diferencia? ¿Porque los ogros son más grandes y pesados que los orcos?"

          "¡He dicho que os calléis!" dice Kate. "Si no vas a ser útil, al menos no nos estorbes ni nos distraigas hablando."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch08a_flaming
  - name: b2_ch08a_flaming
    texts:
      - source: scene_text
        paragraph: 21
        text: |-
          "¡Qué fría eres!" dice Melindra. "Empiezo a preguntarme si esos mitos que dicen que existe una correlación directa entre la personalidad de un mago y su afinidad elemental no tendrán algo de verdad."

          "¿Alguna vez te callas?" dice Kate.

          Entonces conjura de repente un escudo de hielo en la mano y lo coloca frente a sí justo a tiempo para bloquear una flecha que había salido disparada directamente hacia ella.

          "¡Por Tyrath!" grita un orco desde detrás de los árboles, en la Lengua Común, mientras él y cuatro de sus compañeros cargan contra nosotros rugiendo al unísono.

          Todos tienen la piel verde, son tan altos como Daren, con físicos musculosos, caras porcinas y colmillos que les salen de la boca, tal como cabría esperar de la mayoría de los orcos, pero estos van armados hasta los dientes. Uno empuña dos hachas de batalla de doble filo en llamas, otro lleva una espada enorme a dos manos casi tan grande como él, y los otros tres usan mazas y escudos que parecen estar hechos de metal de alta calidad.

          El orco de las hachas en llamas parece ser el líder del grupo. Fue él quien lanzó el primer grito de guerra y los demás orcos siguieron sus indicaciones mientras dirigía la carga contra nosotros y chocaba directamente con Daren.

          "¡Cuidado!" vemos aparecer la escritura de Leila en grandes letras azules frente a nosotros. "¡Son uno de los escuadrones de élite del dragón! ¡No los subestimen!"
      - source: scene_text_2
        paragraph: 18
        text: |-
          Entonces se lanza detrás de uno de los orcos menos acorazados y le clava las dos dagas por la espalda. El orco ruge, se gira y lanza un mazazo contra ella. Sin embargo, sus movimientos son demasiado lentos para Leila, así que ella retrocede rápidamente y sale de su alcance, intentando atacarlo de nuevo.

          "¡Leila, detrás de ti!" grita Kate, cuando otro de los orcos intenta colocarse a la espalda de Leila para asestarle un golpe.

          Kate intenta entonces atravesar al monstruo con una pica de hielo que surge del suelo frente a él. El orco consigue destrozar la pica helada con su maza encantada, pero pierde el impulso y ya no logra atacar a Leila, que se desliza rápidamente fuera de su alcance.

          "Yo me encargo de los ogros", dice Hadrik, corriendo hacia los dos ogros que intentaban caernos encima por la espalda.

          Mientras tanto, Flower envuelve a uno de los orcos en una columna de fuego, pero él sale completamente ileso gracias a su armadura anti-magia y empieza a correr hacia ella con la espada lista.

          "¡Maldición!" dice Flower, saltando fuera del camino del orco y rodando por el suelo.

          En cuanto tengo un tiro limpio del orco que atacó a Flower, apunto con mi ballesta a la estrecha ranura de su yelmo y aprieto el gatillo.
    choices:
