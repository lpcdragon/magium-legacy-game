  - name: b2_ch08a_uninterrupted
    texts:
      - source: scene_text
        paragraph: 73
        text: |-
          "Sí, eso es exactamente lo que estoy diciendo."

          "Bueno, es tu pérdida", dice Melindra. "En ese caso, me iré a dormir ya. Hasta mañana."

          "No, lo que vas a hacer es salir de mi tienda", digo. "Vete a dormir con Flower, vete a dormir con los bichos, me da igual."

          "No estarás pensando seriamente en echarme de tu tienda, ¿verdad?", dice Melindra, adoptando esta vez un tono más serio. "Solo te estoy pidiendo unas pocas horas de sueño ininterrumpido. No voy a molestarte. Me despertaré mucho antes de que nadie salga de su tienda e intentaré marcharme sin que nadie me vea. Será como si nunca hubiera estado aquí."
    choices:
      - position: 1
        text: Dejarla dormir en la tienda.
        effects:
          - set:
              current_scene: b2_ch08a_sleepy
              b2_ch8_energizer: 2
      - position: 2
        text: Decirle que salga de la tienda.
        effects:
          - set:
              current_scene: b2_ch08a_regret
              b2_ch8_energizer: 0
      - position: 3
        text: Dejarla dormir unas horas en la tienda e ir a hacerle compañía a Kate en su turno de guardia.
        effects:
          - set:
              current_scene: b2_ch08a_gentleman
              b2_ch8_energizer: 3
  - name: b2_ch08a_gentleman
    texts:
      - source: scene_text
        paragraph: 81
        text: |-
          "En realidad, creo que tengo otra idea", digo.

          Entonces me esfuerzo por gatear por encima de ella, a cuatro patas, para llegar a la entrada de la tienda.

          "Eh, ¿qué estás haciendo?", dice Melindra, cuando le golpeo accidentalmente la barbilla con uno de los codos. "¡Para ya!"

          "Voy a dejarte dormir aquí unas horas, mientras yo acompaño a Kate en su turno de guardia", digo.

          "Espera... ¿qué?", dice Melindra. "No, espera un momento. No hace falta que dejes tu propia..."

          "Cuando termine el primer turno", la interrumpo, "veré si consigo convencer a Hadrik o a Daren para que te presten una tienda, porque estoy bastante seguro de que a ellos les toca el siguiente turno. Vendré a despertarte cuando tu nueva tienda esté lista."

          Entonces abro la cremallera de la tienda y empiezo a salir.

          "¡Espera, escúchame!", dice Melindra. "No tienes por qué..."

          "Buenas noches, Melindra", le digo una vez estoy fuera de la tienda, y luego cierro la cremallera.
    effects:
