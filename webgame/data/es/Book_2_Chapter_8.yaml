            paragraph: 38
            text: |-
              Por suerte para mí, su postura delata sus verdaderas intenciones y logro verle el farol, así que ignoro por completo su maza y me centro únicamente en su escudo. Tal como sospechaba, el orco intenta aplastarme la cabeza con el escudo en cuanto está lo bastante cerca, pero yo me aparto en el último segundo, haciéndole perder el equilibrio y permitiéndome asestarle un golpe rápido y letal con la hoja en la nuca.

              Al quedarse con un solo enemigo por delante, Leila pasa inmediatamente al ataque y consigue deshacerse de él con facilidad, colocándose en su ángulo muerto y asesinándolo de un solo golpe en el costado de la cabeza.

              Cuando ve lo que les ha ocurrido a sus subordinados, el capitán orco aparta a Daren de un empujón, retrocede unos cuantos pasos, se lleva a la boca el cuerno que llevaba colgado del cuello y sopla con todas sus fuerzas. En cuanto lo hace, los ogros también se apartan de Hadrik y una luz blanca intensísima empieza a envolver a todos los monstruos, mientras sus cuerpos comienzan a vibrar con fuerza.
