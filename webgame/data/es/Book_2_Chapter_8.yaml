  - name: b2_ch08a_terrified
    texts:
      - source: scene_text
        paragraph: 62
        text: |-
          Cuando giro la cabeza, me doy cuenta de que Kate está mirando a Melindra con una expresión de shock en el rostro.

          "¿Hmm?...", dice Melindra con una mirada intrigada en los ojos, en cuanto ve a Kate observándola.

          Entonces me aprieta el brazo todavía con más fuerza, sin dejar de mirar a Kate para ver su reacción. En cuanto Kate comprende lo que Melindra está haciendo, aparta la cara, asqueada.

          "Mmm...", dice Melindra, esta vez con una sonrisa.

          "No te preocupes, cariño", le dice a Melindra el primer mago. "No vamos a irnos a ninguna parte. Al menos no hasta que vacíen sus bolsillos y sus mochilas para enseñarnos si llevan piñas encima..."

          "¿Hablas en serio?", dice Daren, casi soltando una carcajada al pronunciar esas últimas palabras.

          "Je", dice Hadrik. "Supongo que no todos los magos del mundo pueden reconocerte por la cicatriz, ¿eh, Daren?"

          "O eso, o les da igual", dice Illuna. "Después de todo, estaban lo bastante locos como para unirse a este torneo."

          "No tenemos tiempo para esto", dice Kate, mientras deja de ocultar su aura y lanza tres dagas de hielo delante de los pies del primer mago.
      - source: scene_text_2
        paragraph: 41
        text: |-
          "¡Aaah!", grita el mago como una niñita, con una expresión de terror en los ojos, al comprender por fin en qué situación se encuentra. "¡Una banshee! ¡Es una banshee! ¿Qué hacen todavía ahí parados? ¡Corran por sus vidas, idiotas! ¡Corran tan rápido como les den las piernas!"

          Entonces salta el pequeño río y se interna en el bosque, mientras todos sus compañeros se apresuran a seguir a su líder.

          "¿Ya vas a soltarme el brazo?", le pregunto a Melindra.

          "¡Claro, claro!", dice Melindra, soltándomelo con total naturalidad. "No hace falta ponerse así. ¡Solo era una broma!"

          "Estupendo", digo. "Ahora, ¿qué tal si vuelves a ponerte en cabeza, como antes, y me dejas en paz?"

          "¿Vendrás a caminar a mi lado si vuelvo a ponerme en cabeza?", dice Melindra.

          "Ni hablar", digo.

          "Entonces me quedaré aquí, muchas gracias", dice Melindra.

          "Vaya...", dice Hadrik con una sonrisa, mirándonos. "¿Pasó algo durante el descanso que hicimos antes, Barry? ¿Hay algo que quieras contarnos?"

          "Cállate", le digo.

          "Déjalos en paz", le dice Daren a Hadrik. "Estoy seguro de que Melindra acabará aburriéndose y entonces todo volverá a la normalidad. Ya sabemos en qué dirección tenemos que ir, así que por ahora no necesitamos guía. Vamos, seguidme."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch08a_hobby
  - name: b2_ch08a_hobby
    texts:
      - source: scene_text
        paragraph: 63
        text: |-
          Tal como dijo Daren, después de una hora o dos caminando, Melindra acabó por aburrirse de fastidiarme y se fue a hablar con Flower, que de momento parece ser la única integrante del grupo con la que realmente se lleva bien. Pasamos el resto del día viajando sin meternos en más peleas, aunque sí nos cruzamos con varios grupos de magos que parecían muy ocupados recogiendo piñas de los árboles y metiéndolas en sus mochilas.

          Cuando por fin decidimos que ya era hora de montar el campamento, empezamos a colocar nuestras tiendas no demasiado lejos del río que habíamos estado siguiendo desde el mediodía. Melindra no parecía querer pasar con nuestro grupo ni un segundo más de lo necesario, así que, en cuanto terminó de guiarnos, se fue hacia la orilla del río a ver si encontraba más rocas que añadir a su colección.

          Tan pronto como terminamos de montar las tiendas, saqué enseguida mi cuaderno, porque había unas cuantas cosas que quería comprobar antes de irme a dormir. Mientras pasaba las páginas, de repente me fijé en una hoja antigua en la que había escrito algunas notas sobre el dispositivo de estadísticas, y una frase en particular me llamó la atención. Según mis viejos datos, el potenciador de estadísticas se suponía que debía absorber más energía del aire si se lanzaban hechizos poderosos a su alrededor, pero en realidad nunca he visto que eso ocurra desde que llegué a Varathia. Al darme cuenta de que quizá necesitaba más información sobre el tema, decidí ir a hacerle unas preguntas a la única otra persona del campamento que sabe más de dispositivos de estadísticas que yo.
      - source: scene_text_2
        paragraph: 42
        text: |-
          Cuando me acerco a Leila, me doy cuenta de que sigue en mitad de una conversación con Kate.

          "Oye, Leila", digo. "¿Tienes un minuto? Quería preguntarte algo sobre tu dispositivo de estadísticas."

          "Claro...", escribe Leila.

          "¿Desde cuándo eres del tipo estudioso?", me pregunta Kate arqueando una ceja al ver el cuaderno que sigo sujetando con la mano. "Nunca te había visto usar ese cuaderno, pero ahora parece que estás leyéndolo todo el tiempo."

          "Oh, solía escribir en este cuaderno todos los días antes de venir a Varathia", digo. "Lo que pasa es que tuve que dejar ese pasatiempo de lado durante un tiempo, porque estaba demasiado ocupado intentando no morir en este lugar de mierda."

          "Ibas a preguntarme algo sobre las estadísticas, ¿no?", escribe Leila.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch08a_extract
  - name: b2_ch08a_extract
    texts:
      - source: scene_text
        paragraph: 64
        text: |-
          "Sí", digo. "Quería saber si alguna vez has tenido la sensación de que tu dispositivo de estadísticas recibía más energía del aire después de que ocurriera una gran batalla de magos en tus inmediaciones."

          "No especialmente", escribe Leila. "Quiero decir, ayer mismo tuvimos esa gran pelea con el dragón y ninguno de los dos consiguió puntos de estadísticas."

          "¡Sí, exacto!", digo. "Pero, según los datos que había reunido antes de venir aquí, el dispositivo de estadísticas no debería estar absorbiendo la energía de forma selectiva. Y, aun así, no recuerdo haber conseguido nunca puntos de estadísticas después de participar en una batalla de magos. ¿Sabes por qué podría estar pasando esto?"

          "No lo sé", escribe Leila. "Nunca me lo había planteado demasiado..."

          "Bueno, yo tengo una teoría", digo, "pero no estoy del todo seguro de lo acertada que es. Verás, hubo una vez en la que conseguí activar temporalmente mis estadísticas mágicas ocultas, pero solo tuve la opción de hacerlo porque en ese momento había una enorme cantidad de energía mágica en el aire a mi alrededor. El hecho de que los creadores del dispositivo incluyeran una opción para quemar rápidamente la energía disponible me hace pensar que, de lo contrario, esa energía se habría desperdiciado, porque el dispositivo de estadísticas no habría podido convertirla en puntos de estadísticas con la suficiente rapidez. ¿Entiendes adónde quiero llegar?"
      - source: scene_text_2
        paragraph: 43
        text: |-
          "Sí", escribe Leila. "El residuo de energía que dejan los hechizos no permanece mucho tiempo en el aire después de haber sido lanzados. Así que, si el dispositivo de estadísticas no puede convertir esa energía con suficiente rapidez y además no tiene capacidad para almacenarla para más tarde, eso significaría que, en realidad, la mayor parte de la energía que recibe el dispositivo no procede de los hechizos, sino de las auras de los magos."

          "Eso es justo lo que estaba pensando", digo. "Pero, como el dispositivo solo puede extraer una cantidad muy pequeña de energía del aura de cada persona a la vez, eso significa que lo que realmente importa no es lo poderosas que sean las personas, sino cuántos magos haya dentro del radio del potenciador de estadísticas, que, si no me equivoco, debería ser de unas treinta millas, más o menos. Harían falta probablemente cientos de magos dentro del alcance del dispositivo para que la conversión en puntos de estadísticas tuviera algún efecto apreciable. Eso explicaría en parte por qué el número de puntos que he ido recibiendo se ha ralentizado últimamente, porque muchos magos han muerto desde que empezó este torneo, pero aun así no explicaría por qué hemos recibido menos puntos mientras estábamos en la ciudad."

          "Quizá sea porque había otras personas con dispositivos de estadísticas reunidas en Thilias", dice Kate. "Seguro que no podías ser la única persona a la que se le ocurrió la idea de traer uno consigo a este lugar. Y si tú no sabías que los dispositivos de estadísticas iban a ser casi inútiles para la gente que no tuviera sangre lessathi corriendo por las venas, entonces probablemente hubiera otros como tú que tampoco lo supieran."
