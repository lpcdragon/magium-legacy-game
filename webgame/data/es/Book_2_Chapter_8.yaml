            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch08a_terrified
      - condition: b2_ch8_parents = 1
        texts:
          - source: scene_text
            paragraph: 60
            text: |-
              "¿Qué te hace pensar eso?"

              "Bueno, en la sociedad lessathi actual está terminantemente prohibido casarse con alguien que no sea lessathi", dice Melindra. "Así que lo lógico es que cualquier relación de ese tipo permanezca oculta a los ojos de los demás lessathi. Esa es la razón por la que hoy en día prácticamente ya no se ven medios lessathi. Sin embargo, si una mujer lessathi se quedara embarazada del hijo de alguien que no fuera lessathi, una relación así sería mucho más difícil de ocultar. Creo que la razón por la que tus padres dejaron este continente fue precisamente que consideraron demasiado difícil seguir escondiéndose después de que tu madre se quedara embarazada de ti."

              "Vale, pero ¿por qué iban a estar relacionados con la cúpula?", digo.

              "Porque las únicas personas que tienen acceso a dispositivos de teletransportación en este continente son los reyes y los lessathi", dice Melindra. "Y esos teletransportadores son la única manera de abandonar el continente. Como solo los lessathi de rango más alto tienen acceso a los teletransportadores lessathi, eso significa que tu madre tuvo que pedir ayuda a uno de ellos si quería irse, y además tenían que hacerlo en secreto. ¡Puede que incluso seas pariente del líder de los lessathi! Debiste de nacer hace unos treinta años o así, así que el líder de entonces habría sido... Heksol. Sí, ese era el nombre. Creo que quizá muriera desde entonces. ¿O lo mataron? No estoy segura. Ya no sigo demasiado la política lessathi."

              "¿Podrían dejar de hablar y concentrarse un segundo?", dice Daren. "Puedo sentir a un grupo de magos acercándose. Y no estoy seguro de que sean amistosos. Mantengan la guardia alta."
