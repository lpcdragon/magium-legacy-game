  - name: ch8_golden_rule
    texts:
      - source: scene_text
        paragraph: 60
        text: |-
          "¡Por favor, deténganse!", dice el leopardo en la lengua común, y los ojos de Flower empiezan a volver lentamente a su color verde normal.

          "¿Qué significa esto, Leo?", le pregunta la zorra. "¡Solo te di permiso para usar la lengua común en caso de una emergencia extrema!"

          "Siento si hablo cuando no me toca, oh gran zorro dorado, pero considero que esta es una emergencia de la mayor importancia".

          "Explícate".

          "Me gustaría invocar la sexta regla de oro y tomar la custodia personal de estos prisioneros".

          "¿Con qué fin?"

          "Creo que nos serían de mucha más utilidad vivos que muertos. No podemos permitirnos enviar más tropas a la fortaleza de los ogros. A este paso, el cáliz sagrado se perderá para siempre. Pero estos guerreros han demostrado su destreza en el combate al derrotar a nuestra mascota hidra del nivel subterráneo. Podríamos enviarlos a recuperar el cáliz, a cambio de su libertad".
      - source: scene_text_2
        paragraph: 41
        text: |-
          "Ya veo...", dice la zorra. "Así que por esto insististe en acompañarme a la sala de control cuando supimos que los prisioneros se habían escapado. Me sorprendes, Leo. De todos los animales de nuestro reino, tú eres con diferencia el que más odia a los humanos. Nunca pensé que llegaría el día en que sugerirías usar a ninguno de ellos para favorecer nuestra causa".

          Se detiene un poco para reflexionar sobre sus palabras.

          "Muy bien entonces", dice la zorra. "De total acuerdo con la sexta regla de oro, por la presente te concedo la custodia completa de estos cinco prisioneros".

          Eleya se vuelve entonces hacia nosotros.

          "Han tenido suerte de haber sido perdonados de tal manera, humanos", dice ella. "Sugiero que aprovechen al máximo esta oportunidad".
