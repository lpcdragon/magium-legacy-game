          - set:
              current_scene: ch8_arraka
  - name: ch8_arraka
    texts:
      - source: scene_text
        paragraph: 45
        text: |-
          "¡Lo juraste!", dice Flower, furiosa. "¡Lo juraste por tu madre!"

          "¡No tengo madre, boba!", le dice Arraka, y empieza a reír histéricamente.

          A medida que bajamos hacia los niveles inferiores de las ruinas, se oyen varios gruñidos bajos continuos en algún lugar debajo de nosotros.

          "Ya he tenido bastante de esto", dice la niña mientras sus ojos se vuelven azules de nuevo y empieza a juguetear con las palancas hasta que el ascensor se detiene y vuelve a subir.

          "Tenías que arruinar toda la diversión como siempre haces, ¿verdad, Illuna?", dice la voz del amuleto mientras los ojos de la niña vuelven a ser verdes.

          "Espera, ¿quién es Illuna?", le pregunto a la niña. "¿Es ese el verdadero nombre de la banshee?"

          "No importa eso", dice Hadrik. "Lo que quiero saber es quién es el espíritu de ese amuleto".

          "¿Quién, yo?", dice Arraka. "¡Pues si soy el espíritu de la alegría y la risa! ¡Esta niña malvada me tiene atrapada aquí dentro y no me deja hacer mi trabajo de repartir felicidad por todo el mundo! ¿No me salvarán de esta villana?"
      - source: scene_text_2
        paragraph: 37
        text: |-
          "Espíritu de la alegría y la risa, ¿eh?", dice Hadrik con su sonrisa habitual. "¿Así que supongo que el aura siniestra que te rodea es por el amuleto en el que te tiene la niña, entonces?"

          "¿Eh?", pregunta Arraka. "¡Ah, no, es que olvidé cambiarla!"

          El aura siniestra a su alrededor desaparece ahora por completo y es sustituida por una de alegría y bondad.

          "¿Ven? ¡Ahora soy el espíritu de la alegría y la risa!", dice Arraka, habiendo cambiado su voz para que parezca la de una dulce niña. "Si no me creen, ¡pueden preguntar a todas las personas que han tenido el honor de conocerme! ¡Siempre las dejo con una sonrisa en la cara! Claro que sería un poco difícil conseguir que hablaran con ustedes, ya que están todas muertas. Y ahora que lo pienso, la expresión con la que suelo dejarlas es algo menos que una sonrisa y más bien una mirada de puro terror. Pero estoy segura de que he tallado unas cuantas sonrisas en el cuello de al menos algunas de ellas, así que debería seguir contando, ¿verdad? Ajá- AJAJAJA--"

          Flower interrumpe el discurso de Arraka cerrando el amuleto y luego se queda sujeta a él durante unos segundos, apretando el puño a su alrededor con rabia.

          "Entonces, eh...", empiezo a preguntarle mientras el ascensor llega finalmente al pasillo de las trampas. "¿Es otra banshee, entonces?"

          "Sí...", dice Flower. "Una muy malvada y poderosa. Fue atrapada en este amuleto hace veinte años por los lessathi, y hemos estado actuando como sus carceleras desde entonces".
    choices:
      - position: 1
        text: ¿Por qué? ¿Se lo pidieron los lessathi?
        effects:
          - set:
              current_scene: ch8_lessathi
              ch8_old: 0
      - position: 2
        text: Espera, ¿acabas de decir hace veinte años? ¿Cuántos años tienes exactamente?
        effects:
          - set:
              current_scene: ch8_old
              ch8_old: 1
  - name: ch8_lessathi
    texts:
      - source: scene_text
        paragraph: 46
        text: |-
          "¿Por qué? ¿Se lo pidieron los lessathi?"

          "¿Qué?", pregunta la niña, sorprendida. "¡No! ¿Quién iba a trabajar para esos imbéciles? ¡La tenemos con nosotras porque queremos! Ahora vamos, ¡la sala de los botones no debería estar mucho más lejos!"

          "Pero, eh... ¿No es Arraka un poco más problemática de lo que vale?", le pregunto a Flower mientras empezamos a caminar por el pasillo. "¿No sería mejor dejarla en algún sitio y acabar con ella?"

          "¡Oh, no es tan mala como todo eso! De hecho, nos ha ayudado muchas veces a lo largo de los años e incluso nos ha salvado la vida en varias ocasiones. Además, se toma a Pétalo mucho más en serio de lo que me toma a mí y eso es... ¡OH, DIOSES MÍOS!"

          "¿Qué?", pregunta Kate. "¿Qué ha pasado?"

          "¡Recuerdo esos tres pasillos!", dice mientras señala delante de ella. "Uno de ellos lleva a la sala de control, mientras que los otros dos llevan a trampas mortales. ¡Sé con certeza que el pasillo correcto tenía algún tipo de insecto marcado en una de sus paredes! Prácticamente ya estamos allí. ¡Vengan!"

          "¿Un insecto?...", pregunta Kate, mientras Flower se adelanta para mirar mejor las paredes de los tres pasillos.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch8_corridors
  - name: ch8_old
    texts:
      - source: scene_text
        paragraph: 47
        text: |-
          "Espera, ¿acabas de decir hace veinte años? ¿Cuántos años tienes exactamente?"

          "¡Cumpliré treinta el mes que viene!", dice la niña, sonriendo. "¡Eh, miren, hemos llegado al pasillo principal! ¡Síganme, la sala de los botones no debería estar mucho más lejos!"   

          "Sabes, eh... No estoy muy seguro de cómo decirte esto, pero... no pareces tener treinta años", le digo a Flower mientras empezamos a caminar por el pasillo.  

          "¡Oh, mi cuerpo dejó de envejecer hace veinte años, después de que mi alma se fusionara con la de Pétalo! Pétalo no para de decirme que técnicamente nunca llegué a los diez años, ¡pero yo digo que al diablo con eso! Si quiero tener mis cumpleaños, nada va a... ¡OH, DIOSES MÍOS!"

          "¿Qué?", pregunta Kate. "¿Qué ha pasado?"

          "¡Recuerdo esos tres pasillos!", dice mientras señala delante de ella. "Uno de ellos lleva a la sala de control, mientras que los otros dos llevan a trampas mortales. ¡Sé con certeza que el pasillo correcto tenía algún tipo de insecto marcado en una de sus paredes! Prácticamente ya estamos allí. ¡Vengan!"

          "¿Un insecto?...", pregunta Kate, mientras Flower se adelanta para mirar mejor las paredes de los tres pasillos.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch8_corridors
  - name: ch8_corridors
    routes:
      - condition: ch8_talk = 0
        texts:
          - source: scene_text
            paragraph: 48
            text: |-
              "¡Noooooooooooooooo!", grita la niña al llegar al lugar donde el camino se divide en tres direcciones.

              Al mirar las marcas de las tres paredes, empiezo a comprender el origen de la frustración de la niña. No se equivocaba cuando recordaba que el pasillo correcto tenía un insecto marcado. Lo que no recordó, sin embargo, fue que los otros dos pasillos también tenían insectos marcados.

              "Una libélula, un escarabajo y una avispa...", dice Kate mientras estudia las marcas de las paredes. "Flower, ¿estás diciendo que uno de estos tres caminos nos llevará directamente a la sala de control?"

              "Sí, mientras elijamos el camino correcto, no habrá más obstáculos entre nosotros y la sala de los botones", dice la niña. "¡Ooooooh! ¡Si tan solo pudiera recordar qué camino es el correcto!"
        choices:
