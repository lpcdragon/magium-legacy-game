            paragraph: 35
            text: |-
              No pierdo el tiempo y arremeto contra el monstruo ahora, mientras aún está desorientado. 

              Incluso mientras se tambalea, la hidra todavía no ha bajado la guardia. Al acercarme a ella, dos de las cabezas se lanzan hacia mí y me veo obligado a saltar a un lado para esquivarlas. Entonces arremeto directamente hacia el corazón e intento apuñalarlo, pero el monstruo aparta su cola de mi alcance y la eleva en el aire.

              Así que la hidra es consciente de su propio punto débil. Fui descuidado. El monstruo ha recuperado ahora el equilibrio y está usando todas sus cabezas para acorralarme. Consigo esquivar con éxito sus dos primeros ataques, pero el tercero me pilla desprevenido. Cuando los colmillos de la hidra se hundieron en mi carne, pude ver mi vida pasar ante mis ojos durante unos segundos, antes de caer al suelo y perder el conocimiento para siempre.
