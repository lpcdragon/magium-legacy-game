        texts:
          - source: scene_text
            paragraph: 59
            text: |-
              Flower sale corriendo del túnel, pero su impulso se desvanece inmediatamente después de entrar en la sala de control y se detiene justo delante de la salida del pasillo. Al llegar yo mismo al final del pasillo, mis ojos tardan unos instantes en acostumbrarse a la luz tan brillante que hay en esta sala.

              "¡Felicidades!", oigo decir a una voz familiar, mientras mi visión es todavía un poco borrosa. "Han llegado a la sala de control. Ahora ya pueden morir en paz, sabiendo que han logrado su objetivo".

              De repente me doy cuenta de dónde venía toda esa luz. La zorra espíritu está de pie frente a nosotros y su aura mágica, increíblemente fuerte, brilla tanto que cuesta incluso mirarla. Leo, el leopardo, también está a su lado, pero el toro parece estar ausente esta vez. La habitación está llena de palancas y botones de todas las formas y tamaños, tal como dijo Flower, y hay escrituras extrañas en todas las paredes.

              "En cuanto me enteré de que se habían escapado de la mazmorra", dice la zorra, "supe que solo podía haber un lugar al que se dirigieran, así que en lugar de perseguirlos, decidí simplemente esperarlos aquí".

              De repente, una jaula dorada aparece de la nada y nos rodea a todos menos a Flower.

              "Parece que mi benevolencia fue desperdiciada con gente como ustedes", dice la zorra. "Voy a ejecutarlos aquí y ahora y acabar con esto de una vez por todas".
