            paragraph: 36
            text: |-
              No pierdo el tiempo y arremeto contra el monstruo ahora, mientras aún está desorientado. 

              Incluso mientras se tambalea, la hidra todavía no ha bajado la guardia. Al acercarme a ella, dos de las cabezas se lanzan hacia mí, pero fui tan rápido que fallaron por mucho. Justo cuando el corazón del monstruo está al alcance de mi daga, la hidra aleja su cola de mí y la eleva en el aire.

              Así que la hidra es consciente de su propio punto débil. Fui descuidado. El monstruo ha recuperado ahora el equilibrio y está usando todas sus cabezas en un intento de acorralarme. Sin embargo, a mi velocidad actual, esquivar todas estas lentas culebras enormes parece un juego de niños.

              "Muchacho, ¿qué demonios crees que estás haciendo?", me pregunta el enano.

              "¡Hadrik!", le digo. "El corazón de la criatura está en la punta de su cola. Si puedes tirar de su cola de vuelta hacia aquí, le daré el golpe de gracia con mi daga".

              "¡Oooh, ahora lo entiendo!", dice Hadrik, sonriendo. "Dalo por hecho".

              Entonces el enano salta detrás de la hidra y la agarra por la cola, tirando de ella hacia abajo con todas sus fuerzas.

              "¡Vale, Barry!", dice el enano mientras lucha por mantener sujeta la cola. "¡Cuando estés listo!"
          - source: scene_text_2
            paragraph: 29
            text: |-
              Pongo toda mi velocidad en este único sprint y llego cerca de la punta de la cola de la hidra en un instante, apuñalándola con toda la fuerza que pude reunir. Los gritos de todas las cabezas de culebra al atravesar el corazón eran dolorosos de oír, pero una vez que giré el cuchillo, sus aullidos empezaron a desvanecerse y entonces toda la criatura se vino abajo contra el suelo con un fuerte estruendo. La hidra yace ahora muerta a mi lado, pero casi siento que todavía me observa con sus ojos sin vida, esperando a que baje la guardia para dar un último golpe.

              "¡Barry, bastardo astuto!", me dice Daren mientras se acerca a mí. "Podrías haberme hablado del punto débil de la hidra, pero querías quedarte con toda la gloria. Bueno, ¿cómo se siente haber matado a tu primera hidra? No vas a dejar que se te suba a la cabeza, ¿verdad?"

              "¡Claro que no!", le digo. "Siempre tuve la intención de ir a una búsqueda épica de matanza de monstruos justo después de ganar este torneo. ¡Una victoria menor como esta no cambia nada!"

              Daren sonríe.

              "Pequeño caradura--" empieza a decir, pero es interrumpido por Flower, que ahora desciende hacia nosotros usando dos pequeños chorros de fuego que salen de sus pies para frenar su caída.

              "¡Oh, dioses, no sabía que había una hidra aquí abajo!", dice ella. "¡Habría venido antes, pero esas trampas de arriba no paraban!"

              Entonces aterriza y mira al monstruo sorprendida, intentando ver si está realmente muerto o solo durmiendo.
