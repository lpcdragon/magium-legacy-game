  - name: ch8_training
    texts:
      - source: scene_text
        paragraph: 17
        text: |-
          "¿A qué te refieres con entrenamiento?", le pregunta Kate.

          "¡Oh, a muchas cosas!", dice la niña. "Pero sobre todo, vengo aquí para practicar mis habilidades acrobáticas. Hay todo tipo de trampas por aquí, e intento esquivarlas mientras hago backflips elegantes o mientras corro por las paredes. ¡Es muy divertido!"

          "¿Hay trampas en estas ruinas?", pregunta Kate.

          "¡Sí, el lugar está lleno de ellas! Tienes que vigilar tus pasos si no eres de por aquí. ¿Vinieron todos aquí para hacer turismo?"

          "Eh, no...", dice Kate. "Fuimos capturados por los animales y encerrados en una celda. Actualmente estamos buscando la sala de control para poder desactivar los collares de nuestros cuellos. No sabrás por casualidad dónde está eso, ¿verdad?"

          "¿Sala de control?", pregunta Flower, y se para un poco a pensar. "¡Ah, te refieres a la sala llena de palancas y botones! Claro, sé dónde está. ¡Síganme, les enseñaré el camino!"

          Mientras ella empieza a caminar por el pasillo, Daren me dice en voz baja:

          "Algo no va bien aquí. El hechizo que los organizadores lanzaron sobre nosotros no reacciona ante ella de ninguna manera. ¿Qué crees que está causando esto?"
    choices:
      - position: 1
        text: Tal vez sea un animal disfrazado.
        effects:
          - set:
              current_scene: ch8_disguise
      - position: 2
        text: Tal vez ella también esté participando en el torneo.
        effects:
          - set:
              current_scene: ch8_participating
      - position: 3
        text: Tal vez sea una prisionera aquí también y los organizadores no lo sepan.
        effects:
          - set:
              current_scene: ch8_prisoner
  - name: ch8_disguise
    texts:
      - source: scene_text
        paragraph: 18
        text: |-
          "Tal vez sea un animal disfrazado".

          "¡No, eso no puede ser!", dice Daren. "¿Realmente crees que alguno de estos animales puede lanzar hechizos de ilusión? A menos que sugieras que lleva un disfraz, claro".

          "No importa quién sea ella", nos interrumpe Kate. "Claramente conoce este lugar mejor que nosotros, y si estuviera trabajando con los animales, ya los habría alertado de nuestra presencia. De cualquier manera, solo hay un camino para nosotros en este momento, así que no tenemos más remedio que ir tras ella. Decidiremos más tarde si debemos confiar en ella o no".

          Cuando alcanzamos a Flower, la oímos empezar a hablar con un tono mucho más frío que antes. Mientras habla, sigue caminando por el pasillo y está de espaldas a nosotros.

          "¿Qué te pasa, Flower?", dice ella con su voz fría. "¡Vinimos a estas ruinas desoladas a entrenar, no a jugar a ser guía turística! ¡Ni siquiera sabemos quién es esta gente!"

          "¡Relájate, Pétalo!", dice la niña, esta vez en su tono alegre anterior. "Parecen buena gente. ¡Podemos volver al entrenamiento una vez que hayamos terminado de enseñarles el lugar! Esto no debería llevar mucho tiempo".

          "Perdona, ¿con quién estás hablando?", le pregunta Kate.

          Flower se asusta por la pregunta de Kate y se da la vuelta rápidamente para enfrentarse a ella.

          "¿H-hemos dicho eso en voz alta?", pregunta. "¡Quiero decir 'yo'! ¡'Yo', no 'nosotros'! ¡Porque solo hay una yo!"
      - source: scene_text_2
        paragraph: 18
        text: |-
          "Espera, ¿estás sugiriendo que hay más de una de ti ahí dentro?", pregunta Daren.

          "¿Qué? ¡No, eso es una locura! ¡Tú estás loco!"

          Entonces empieza a reírse de forma muy nerviosa y antinatural.

          "¿Acaba de llamarme loco?", nos pregunta Daren.

          De repente, se oye una risa amortiguada que sale del amuleto dorado que Flower lleva al cuello. La niña abre el amuleto y empieza a hablarle.

          "¡Cállate, Arraka!", dice ella.

          Ahora que puedo oír la risa con más claridad, me doy cuenta de que la voz dentro del amuleto está formada por tres voces diferentes, todas de mujeres, riendo simultáneamente. Una vez que el ser dentro del amuleto se da cuenta de que ahora podemos oírla claramente, empieza a hablarnos.

          "¡Eh, ustedes de ahí!", dice la voz. "¡Esta chica es una banshee! ¡Rápido, comprueben su aura mágica! Comprueben su au--"
      - source: scene_3
        paragraph: 8
        text: Flower se asusta y cierra el amuleto, haciendo callar a la voz, pero el daño ya estaba hecho. Al analizar su aura mágica en detalle, me doy cuenta de que de hecho es mucho más poderosa de lo que parece, y que la está suprimiendo deliberadamente para que parezca la de un humano normal. ¿Pero es una banshee real, u otra maga artificial como Kate? Hay algo raro en su aura... No puedo decir exactamente qué. Se siente casi como si tuviera dos auras mágicas distintas a su alrededor, una que emite una vibración de otro mundo y otra que no. Es como si tanto la niña como la banshee que la poseyó coexistieran de algún modo en el mismo cuerpo, como dos entidades separadas. Pero eso es imposible... ¿no?
