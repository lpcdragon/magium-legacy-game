        texts:
          - source: scene_text
            paragraph: 24
            text: |-
              "Hadrik, ¡no hay tiempo! Solo derriba esa pared, y ya nos preocuparemos de las consecuencias más tarde".

              "¡Ja!", dice Hadrik. "¡Eso es exactamente lo que quería oír! ¡Allá va!"

              El enano usa toda su fuerza para abrir un agujero en una de las paredes que se cierran sobre nosotros. En el momento en que la pared se derrumba, varias lanzas afiladas empiezan a salir disparadas de ella, y directas hacia nosotros. 

              Me doy cuenta de que una de ellas está a punto de darme en la cara, así que me hago a un lado justo a tiempo y siento una ligera brisa en las mejillas mientras la lanza pasa zumbando junto a mi cabeza y atraviesa la pared que tengo detrás. Los demás también consiguieron salir ilesos de esto de alguna manera. Hadrik y Kate esquivaron las lanzas, mientras que Daren se protegió a Rose y a sí mismo con su escudo.

              Las paredes empiezan ahora a frenar, y pronto se detienen por completo. Flower no tarda en volver a aparecer, con una sonrisa victoriosa en la cara.

              "¡Ja, ja, lo conseguí!", dice ella, poco después de caer por el agujero del techo. "Pero creo que también debería decirles-- ¡OH DIOSES MÍOS!, ¿qué ha pasado aquí? ¿Han roto una de las paredes? ¡Les DIJE que no rompieran las paredes!"
          - source: scene_text_2
            paragraph: 23
            text: |-
              "Sí, todos te oímos", dice Kate, "pero parece que algunos de los miembros de nuestro grupo tienen cerebros más lentos, y les lleva un tiempo más largo de lo normal procesar la información en situaciones críticas".

              "¡Oh, lo siento, no lo sabía!", dice Flower, con aspecto de estar genuinamente preocupada. "Debería haberles avisado antes. ¿Alguien está herido? Pétalo sabe un poco de magia curativa, así que deberíamos poder ayudar si no es nada demasiado serio".

              "Eh, no, creo que todos estamos bien por ahora", dice Hadrik. "Lo siento por eso, me impacienté un poco ahí atrás".

              "Vale", dice Flower. "Entonces, supongo que debería contarles ahora las malas noticias. Verán, cuando estaba trasteando con esos complejos mecanismos de arriba, yo... pueeede que haya activado accidentalmente todas las trampas de este pasillo".

              "¡¿Que qué?!", le pregunta Kate.

              "¡No se preocupen, todavía puedo arreglarlo!", dice Flower. "Creo que sé dónde están la mayoría de las trampas, así que mientras sigan mis instrucciones deberían estar bien. Solo necesito hacer una prueba rápida y asegurarme de que no estoy recordando nada mal".
