  - name: ch8_weakspot
    texts:
      - source: scene_text
        paragraph: 37
        text: |-
          "Oye, Daren", le digo, "acabo de averiguar dónde esconde la hidra su corazón. No está dentro del cuerpo, está en la punta de su cola".

          "¿Cómo puedes estar tan seguro?", me pregunta Daren.

          "He maximizado mi estadística de Audición. Créeme, está ahí. Todavía puedo oírlo latir desde aquí".

          "¿Ah, sí? Bueno, supongo que solo hay una forma de estar seguro", dice Daren, y arremete contra la hidra mientras ésta aún intenta recuperar el equilibrio. 

          Incluso mientras se tambalea, la criatura todavía no ha bajado la guardia. Al acercarse Daren a ella, dos de las cabezas se lanzan hacia él, pero esquiva una de ellas y rebana la otra, aprovechando la oportunidad que creó para dirigirse inmediatamente hacia la punta de la cola del monstruo. Justo cuando está a punto de apuñalar el corazón, la hidra aparta su cola y la eleva en el aire, de modo que Daren ya no puede alcanzarla.

          La criatura no es tonta. Entendió la intención de Daren y también es muy consciente de su propio punto débil.

          "Huyes de mí, ¿eh?", dice Daren. "Bueno, si no vas a dejar que te apuñale el corazón, entonces tendré que conformarme con lo siguiente mejor".
      - source: scene_text_2
        paragraph: 30
        text: |-
          Entonces salta en el aire y apunta su espada a la base misma de la cola del monstruo. Consigue cortarla limpiamente de un solo golpe, y todas las cabezas de la hidra empiezan a gritar de agonía al mismo tiempo. En cuestión de segundos, todas las cabezas callan y la hidra cae estrepitosamente al suelo, mientras la vida abandona sus ojos para siempre.

          "Qué lugar más tonto para guardar el corazón", dice Daren. "¿Cómo es que las hidras no se han extinguido ya?"

          "No se han extinguido porque gente como tú sigue asumiendo que sus corazones están dentro de sus cuerpos e ignora la cola por completo", le responde Kate. "¿No dijiste que habías luchado contra hidras antes? Y sin embargo, no tenías ni idea de este punto débil. Yo diría que esta táctica de distracción natural suya les ha estado funcionando bastante bien hasta ahora".

          Daren frunce el ceño, pero no le responde a Kate. De repente oímos la voz de Flower desde arriba, que ahora desciende hacia nosotros usando dos pequeños chorros de fuego que salen de sus pies para frenar su caída.

          "¡Oh, dioses, no sabía que había una hidra aquí abajo!", dice ella. "¡Habría venido antes, pero esas trampas de arriba no paraban!"

          Entonces aterriza y mira al monstruo sorprendida, intentando ver si está realmente muerto o solo durmiendo.
