  - name: ch8_dare
    texts:
      - source: scene_text
        paragraph: 26
        text: |-
          La niña empieza a correr por el pasillo y da un salto sorprendentemente largo, que la hace aterrizar sobre una gran piedra con dos grietas a cada lado. Entonces hace una pirueta elegante y se vuelve hacia nosotros.

          "¿Ven?", nos dice. "¡Todo bajo control!"

          En cuanto termina de hablar, una de las paredes se abre y una gran hoja de péndulo sale balanceándose, apuntando directamente a Flower. Rueda para esquivarla y activa otras dos trampas por accidente. Ahora hay docenas de flechas disparándose desde ambas paredes, mientras unas afiladas cuchillas giratorias salen del suelo y se mueven en círculos a su alrededor. A primera vista, la niña parece estar tropezando torpemente mientras evade las trampas por pura suerte. Al observarla más de cerca, me doy cuenta de que, aunque sus movimientos parecen erráticos, tienen una forma de fluir los unos en los otros que le permite no desperdiciar ni un solo segundo entre dos acciones. Supongo que no bromeaba cuando dijo que venía a este lugar a entrenar sus habilidades acrobáticas.

          Hadrik sacude la cabeza mientras observa a la niña saltar de un lado a otro, y luego se tumba en el suelo, con la oreja pegada al piso, intentando escuchar algo.

          "Eh, chicos, sé que esto se ve mal", nos dice Flower mientras salta de una pared, aterriza sobre su mano izquierda y luego rebota en el suelo como un resorte, "¡pero si sigo así, o recordaré el camino correcto, o acabaré activando todas las trampas, así que salimos ganando de cualquier manera!"
      - source: scene_text_2
        paragraph: 24
        text: |-
          "Sí, no, esto claramente no nos lleva a ninguna parte", dice Hadrik mientras se levanta, "Esa zorra va a estar aquí en cualquier momento. No podemos permitirnos perder el tiempo aquí mientras la niña prueba todas las trampas. Este pasillo está comprometido, pero he podido oír algo de ruido debajo de nosotros. ¡Estas ruinas tienen un nivel subterráneo esperando a ser encontrado, y estoy a punto de crear un atajo hacia él!"

          "¡No te ATREVAS!", grita Kate.

          "¿Qué dices?", pregunta Hadrik con una sonrisa. "¡Tengo problemas para oírte por todo el ruido que están haciendo esas trampas!"

          Entonces golpea el suelo bajo nosotros, lo que agrieta todas las piedras y nos hace caer junto con todos los escombros que antes formaban el suelo bajo nuestros pies. El camino hacia abajo fue más largo de lo que hubiera deseado, pero afortunadamente, la superficie sobre la que aterrizamos era lo suficientemente blanda como para que no nos rompiéramos nada con la caída.

          "¡Hadrik, cómo has podido hacer algo tan temerario!", grita Kate. "¿Crees que todos somos gigantes disfrazados como tú? ¿Te das cuenta de que si esta superficie inusualmente blanda no estuviera aquí para frenar nuestra caída, nos habríamos roto todos los huesos? ¡Te lo juro, si todavía tuviera mis poderes de hielo, te daría un golpe tan fuerte en la cabeza que te dejaría en coma!"

          Mientras Kate habla, puedo sentir que la superficie en la que estamos se mueve lentamente hacia arriba y hacia abajo. También puedo oír un gruñido bajo continuo en algún lugar por encima de nosotros. Algo no va bien aquí.
    choices:
      - position: 1
        text: Examinar la superficie más de cerca
        effects:
          - set:
              current_scene: ch8_surface
      - position: 2
        text: Intentar identificar el origen del sonido
        effects:
          - set:
              current_scene: ch8_sound
  - name: ch8_surface
    texts:
      - source: scene_text
        paragraph: 27
        text: |-
          Empiezo a mirar de cerca la superficie en la que estamos todos sentados, para ver si puedo distinguir de qué está hecha. Tiene una especie de tacto escurridizo y, si no me equivoco, hay pequeñas escamas de color verde oscuro que cubren toda la superficie. En ese momento, ya podía hacerme una idea aproximada de sobre qué habíamos aterrizado exactamente, pero aun así, una parte de mí no quería creerlo, así que miré hacia arriba, con la esperanza de que mi intuición estuviera equivocada.

          Nueve criaturas con forma de culebra, cada una de ellas al menos seis veces mi tamaño, me miraban fijamente, con los colmillos al descubierto y la baba cayéndoles por la boca. Las nueve culebras estaban conectadas al gran cuerpo sobre el que aterrizamos cuando caímos del nivel superior. Solo he leído sobre criaturas como estas en libros antes, pero aun así, no hay duda posible. Sobre lo que todos hemos aterrizado es una hidra.
           
          Kate y Hadrik siguen discutiendo y no se han dado cuenta de la situación en la que estamos. Daren está inspeccionando justo ahora la superficie escurridiza y cubierta de escamas verde oscuro sobre la que hemos aterrizado, y Rose está mirando hacia las culebras, con una mirada aterrorizada en los ojos, incapaz de decidirse a hablar.

          "Chicos...", les digo a Hadrik y Kate. "Odio interrumpirlos, pero creo que deberían echar un vistazo a esto".
      - source: scene_text_2
        paragraph: 25
        text: |-
          Entonces señalo hacia arriba, y ambos se quedan congelados por un momento.

          "Que los dioses tengan piedad...", dice Hadrik, que parece incapaz de apartar la vista de las cabezas de la espantosa criatura.

          "¡Bajen todos del cuerpo de la hidra!", grita Daren, mientras toma a Rose en sus brazos y salta fuera del cuerpo del monstruo. "¡AHORA!"

          Me deslizo por el cuerpo resbaladizo de la criatura y aterrizo en el suelo de piedra de abajo. Entonces todos nos distanciamos de la hidra y nos armamos, esperando a ver cuál será su primer movimiento. Todas aquellas cabezas rugen al mismo tiempo y el monstruo empieza a acercarse a nosotros, lentamente, con su larga cola balanceándose continuamente de izquierda a derecha mientras camina. Una de las culebras toma la iniciativa y se lanza hacia nosotros. Su ataque fue bastante lento, así que todos tuvimos tiempo de quitarnos de su camino, pero su impacto con la pared que teníamos detrás dejó un gran agujero en ella. Daren no pierde el tiempo y usa su espada para cortar la cabeza de la hidra con un golpe rápido.

          "¡No, no hagas eso!", le digo. "¡¿Por qué harías eso?!"

          La hidra retrae rápidamente el cuello decapitado, y las otras ocho cabezas empiezan a gritar de dolor. Entonces, en cuestión de segundos, la cabeza cortada vuelve a crecer y todas las demás cabezas vuelven a guardar silencio.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch8_hydra
  - name: ch8_sound
    texts:
      - source: scene_text
        paragraph: 28
        text: |-
          Miro por encima de mí, para intentar ver si puedo identificar el origen del gruñido. Acabé arrepintiéndome de mi decisión inmediatamente después de tomarla.  

          Nueve criaturas con forma de culebra, cada una de ellas al menos seis veces mi tamaño, me miraban fijamente, con los colmillos al descubierto y la baba cayéndoles por la boca. Las nueve culebras estaban conectadas al gran cuerpo sobre el que aterrizamos cuando caímos del nivel superior. Solo he leído sobre criaturas como estas en libros antes, pero aun así, no hay duda posible. Sobre lo que todos hemos aterrizado es una hidra.
           
          Kate y Hadrik siguen discutiendo y no se han dado cuenta de la situación en la que estamos. Daren está inspeccionando justo ahora la superficie escurridiza y cubierta de escamas verde oscuro sobre la que hemos aterrizado, y Rose está mirando hacia las culebras, con una mirada aterrorizada en los ojos, incapaz de decidirse a hablar.

          "Chicos...", les digo a Hadrik y Kate. "Odio interrumpirlos, pero creo que deberían echar un vistazo a esto".

          Entonces señalo hacia arriba, y ambos se quedan congelados por un momento.
      - source: scene_text_2
        paragraph: 26
        text: |-
          "Que los dioses tengan piedad...", dice Hadrik, que parece incapaz de apartar la vista de las cabezas de la espantosa criatura.

          "¡Bajen todos del cuerpo de la hidra!", grita Daren, mientras toma a Rose en sus brazos y salta fuera del cuerpo del monstruo. "¡AHORA!"

          Me deslizo por el cuerpo resbaladizo de la criatura y aterrizo en el suelo de piedra de abajo. Entonces todos nos distanciamos de la hidra y nos armamos, esperando a ver cuál será su primer movimiento. Todas aquellas cabezas rugen al mismo tiempo y el monstruo empieza a acercarse a nosotros, lentamente, con su larga cola balanceándose continuamente de izquierda a derecha mientras camina. Una de las culebras toma la iniciativa y se lanza hacia nosotros. Su ataque fue bastante lento, así que todos tuvimos tiempo de quitarnos de su camino, pero su impacto con la pared que teníamos detrás dejó un gran agujero en ella. Daren no pierde el tiempo y usa su espada para cortar la cabeza de la hidra con un golpe rápido.

          "¡No, no hagas eso!", le digo. "¡¿Por qué harías eso?!"

          La hidra retrae rápidamente el cuello decapitado, y las otras ocho cabezas empiezan a gritar de dolor. Entonces, en cuestión de segundos, la cabeza cortada vuelve a crecer y todas las demás cabezas vuelven a guardar silencio.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch8_hydra
  - name: ch8_hydra
    texts:
      - source: scene_text
        paragraph: 29
        text: |-
          "¿Qué?..." me pregunta Daren. "¿No te creerías de verdad esas viejas leyendas de que a las hidras les crecen dos cabezas por cada una que cortas, verdad? He luchado contra hidras antes, y ninguna poseía ese tipo de habilidad. Aun así, la capacidad de regeneración de esta está por las nubes. La última vez que luché contra una de estas, tuve tiempo más que suficiente para cortar todas las cabezas antes de que empezaran a regenerarse, pero no hay forma de que eso funcione con este monstruo en concreto. La única forma de matarla es si podemos averiguar dónde está su corazón y apuñalarlo, o si usamos fuego para evitar que se regenere".

          "Maldiciones...", dice Kate. "Si tan solo tuviera mi magia de hielo, habría cortado fácilmente todas esas cabezas simultáneamente..."

          "¿No tenía esa niña pequeña magia de fuego?", pregunta Daren.

          Entonces empieza a gritar el nombre de la niña, mientras mira hacia el agujero del techo.

          "¡Flower! ¡Eh, Flower!"

          No hay respuesta.

          "Estás perdiendo el tiempo", dice Hadrik. "No hay forma de que pueda oírte desde tan arriba, con el sonido que están haciendo todas esas trampas".

          "Sí, probablemente tengas razón", dice Daren, mientras prepara su espada una vez más y echa una mirada hacia el monstruo.

          La hidra ha dado unos pasos atrás mientras Daren hablaba y se ha quedado parada un rato, dudando si atacar. Debe tener miedo de que le corten otra vez una de sus cabezas.
    choices:
