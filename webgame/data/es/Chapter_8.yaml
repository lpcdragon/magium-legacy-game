            text: Sugerir tomar el camino marcado con una libélula
            effects:
              - set:
                  current_scene: ch8_dragonfly
          - position: 2
            text: Sugerir tomar el camino marcado con un escarabajo
            effects:
              - set:
                  current_scene: ch8_beetle
          - position: 3
            text: Sugerir tomar el camino marcado con una avispa
            effects:
              - set:
                  current_scene: ch8_wasp
      - condition: ch8_talk = 1
        texts:
          - source: scene_text
            paragraph: 49
            text: |-
              "¡Noooooooooooooooo!", grita la niña al llegar al lugar donde el camino se divide en tres direcciones.

              Al mirar las marcas de las tres paredes, empiezo a comprender el origen de la frustración de la niña. No se equivocaba cuando recordaba que el pasillo correcto tenía un insecto marcado. Lo que no recordó, sin embargo, fue que los otros dos pasillos también tenían insectos marcados.

              "Espera un momento...", dice Kate. "¿No decía algo aquella nota del leopardo sobre tres pasillos con insectos marcados? Veo una libélula, un escarabajo y una avispa. El leopardo nos dijo que el camino del escarabajo es el correcto".

              "¿Leopardo?...", nos pregunta Flower. "¿Te refieres a Leo, el leopardo?"

              "¡Sí!", le responde Kate. "¿Lo conoces?"

              "Sí, lo conozco, pero... no entiendo por qué los ayudaría. Realmente odia a los humanos..."

              "¿Crees que podría ser una trampa, entonces?", pregunta Kate.

              "No lo sé...", dice la niña. "¡Ooooooh! ¡Si tan solo pudiera recordar qué camino es el correcto!"
        choices:
