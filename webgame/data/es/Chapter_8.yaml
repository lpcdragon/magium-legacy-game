              current_scene: ch8_awakened_win
  - name: ch8_awakened
    routes:
      - condition: ch8_smash = 0
        texts:
          - source: scene_text
            paragraph: 38
            text: |-
              "Oh, dioses", dice ella mientras aterriza cerca de nosotros. "No sabía que había una hidra aquí abajo. ¡Habría venido antes, pero esas trampas de arriba no paraban! ¿Alguien está herido? Pétalo sabe un poco de magia curativa, así que deberíamos poder ayudar si no es nada demasiado serio".

              La forma en que se encargó de esa hidra como si nada y la manera tranquila en que habla ahora me hacen pensar que esta chica ha lidiado con enemigos mucho más fuertes en el pasado. No estoy seguro de cuál sería la situación si todos estuviéramos al máximo de nuestras fuerzas, pero tal y como estamos ahora, hacernos enemigos de esta niña sería poco menos que un suicidio. Tenemos que elegir nuestras palabras con cuidado si queremos salir de aquí de una pieza.

              "En realidad, me vendría bien un poco de curación ahora mismo", dice Hadrik. "¡Esa herida en mi pierna en concreto me está matando!"

              "¡Estamos en ello!", dice la niña mientras se acerca al enano y pone sus manos sobre su herida.

              "¿Pétalo?", pregunta ella, y luego hace una pausa de unos instantes.

              Los ojos de la niña empiezan entonces a brillar con una luz azul intensa, mientras su expresión se vuelve mucho más fría y una luz cálida empieza a salir de sus manos, curando lentamente la herida de Hadrik.

              "Así que...", dice Hadrik, mientras sonríe. "Tú debes de ser la banshee que habita el cuerpo de la niña. Pétalo, ¿verdad?"
          - source: scene_text_2
            paragraph: 31
            text: |-
              La niña mira al enano a los ojos sin cambiar su expresión fría, pero no dice nada. Luego vuelve a desviar su mirada hacia la herida de éste y sigue curándola diligentemente.

              "No eres muy habladora, ¿verdad?", pregunta Hadrik, todavía sonriendo.

              Cuando la herida se cura por completo, los ojos de la niña vuelven a su color verde normal y su expresión cálida regresa también.

              "Oh, normalmente no es tan silenciosa", dice Flower. "Creo que simplemente es tímida con los extraños..."

              "Bueno, creo que esta farsa ya ha durado bastante", dice Daren mientras empieza a acercarse a Flower. "Siento mucho tener que arruinar esta hermosa amistad, pero me temo que la banshee tiene que irse".

              "En realidad, no creo que eso sea posible", le digo.

              "¿Ah, sí?", dice Daren. "¿Y eso por qué? ¡Por favor, ilumínanos, oh gran experto en banshees!"

              "Porque la banshee ya ha despertado. De hecho, creo que lleva en este estado mucho tiempo".

              "¡Imposible! Todo el mundo sabe que se supone que una banshee despertada tiene el aspecto de un auténtico monstruo. Casi nada debería quedar del aspecto de su huésped humano".
