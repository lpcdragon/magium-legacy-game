  - name: ch8_available
    texts:
      - source: scene_text
        paragraph: 11
        text: |-
          "No tengo suficientes puntos disponibles para llevar mi estadística de lenguas antiguas a un nivel lo suficientemente alto".

          "¿Qué, en serio?", pregunta Daren. "¿Simplemente gastas todos tus puntos inmediatamente después de recibirlos? ¿Nunca consideraste guardar algunos puntos extra en caso de una emergencia?"

          Él suspira.

          "Bueno, supongo que no llegaremos a ninguna parte quedándonos aquí parados y mirándolo como un grupo de búhos", dice, mientras se aleja de la pared y empieza a caminar de nuevo por el pasillo. "Deberíamos ponernos en marcha e--"

          Daren se detiene a mitad de la frase cuando se da cuenta de que hay alguien bloqueando su camino. Hay una niña de pie frente a él, con las manos a la espalda y una sonrisa alegre en la cara. Lleva un amuleto dorado alrededor del cuello, una camiseta de tirantes gris, unos pantalones anchos que suelen llevar los payasos y no lleva zapatos. Mide poco más de un metro y su largo pelo rojo casi le llega a la cintura. Dada su altura y apariencia general, diría que no tiene más de diez años. Y sin embargo, no recibo ningún tipo de advertencia para no herirla. ¿No es una de las lugareñas?

          "¡Hola!", le dice ella a Daren, todavía sonriendo.
      - source: scene_text_2
        paragraph: 13
        text: |-
          "Qué demonios...", dice Daren. "¿De dónde has salido?"

          "¡De ahí!", dice la niña, mientras señala un agujero en el techo.

          "Oh, eh, vale...", dice Daren. "¿Y qué estás haciendo aquí?"

          "Estábamos haciendo un poco de entrenamiento en la habitación de arriba cuando los oímos hablar debajo de nosotros. Mi nombre es Flower. ¡Encantada de conocerlos!"

          "Vaya, vaya, vaya... ¡Espera un momento! ¿Quiénes son 'nosotros'?"

          Flower parece haber sido pillada desprevenida por la pregunta de Daren.

          "¿He dicho 'nosotros'?", pregunta. "Lo siento, quería decir 'yo'. Estaba haciendo un poco de entrenamiento en la habitación de arriba. No hay 'nosotros'. Solo 'yo'".
