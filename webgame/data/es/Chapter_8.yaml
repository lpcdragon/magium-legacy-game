  - name: ch8_banshee
    texts:
      - source: scene_text
        paragraph: 21
        text: |-
          "¡Así que eso es lo que nos ha estado ocultando todo este tiempo!", dice Daren.

          Entonces se vuelve hacia la niña.

          "¡Pequeña, estás de suerte!", dice. "Ya no necesitas vivir con miedo. ¡A pesar de mi apariencia, resulta que soy un mago blanco consumado! Te libraré de tu problema de banshee en un abrir y cerrar de ojos".

          "¿Qué?", dice la niña, sorprendida. "¡No, no puedes!"

          "¡Claro que puedo!", dice Daren. "No te preocupes por el collar. Esta espada tiene encantamientos más que suficientes para poder llevar a cabo un ritual de purificación incluso sin que yo lance ningún hechizo. ¡Esa banshee estará muerta antes de que te des cuenta, y podrás vivir tu vida como una niña normal otra vez!"

          "¡No!", grita Flower. "¡Es mi amiga! ¡No dejaré que le hagas daño!"

          "¿Amiga?..." pregunta Daren a la niña, mientras se acerca a ella. "¡Esto es aún más serio de lo que pensaba! Tengo que purificarte rápido. ¡Ya no estás pensando con claridad!"
      - source: scene_text_2
        paragraph: 21
        text: |-
          Cuando se acerca a Flower, una de las piedras que pisó empieza a hundirse en el suelo, y podemos oír cómo se mueven otras piedras sobre nuestras cabezas.

          "¡Cuidado!", dice Flower, señalando hacia arriba, mientras una gran roca se desprende del techo y desciende sobre nuestras cabezas. 

          La niña levanta la mano, con la palma mirando hacia la gran roca, y le dispara una bola de fuego, que pulveriza la roca en un instante. Mientras nos llueven escombros del peñasco destruido, las paredes empiezan ahora a cerrarse lentamente sobre nosotros, con un sonido fuerte y amenazador que resuena por todo el pasillo.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch8_trap
  - name: ch8_trap
    texts:
      - source: scene_text
        paragraph: 22
        text: |-
          "¡Oh, no!", dice Flower. "Recuerdo esta trampa. ¡Esto no es bueno! Las paredes no van a parar hasta que nos conviertan a todos en una pasta roja pegajosa".

          Empieza a mirar a su alrededor buscando una salida, y entonces sus ojos encuentran el agujero en el techo que usó para entrar en nuestro pasillo. 

          "¡Vale, tengo una idea!", dice ella. "Creo que puedo crear un espacio cerrado aquí volando el techo a ambos lados del pasillo. ¡Luego puedo inundar la habitación con agua para que todos podamos nadar hasta ese agujero en el techo! ¿Saben nadar?"

          "Bueno, voy vestido de pies a cabeza con una armadura pesada, ¡¿así que tú qué crees?!", le pregunta Daren.

          "¡Vale, vale! ¡Nuevo plan! ¡Creo que había un mecanismo secreto en la habitación de arriba para detener el movimiento de las paredes! Pétalo, ¿puedes darme un impulso?"

          La niña pone ambos brazos a los lados, con las palmas mirando hacia abajo. Dos potentes chorros de agua empiezan a brotar de sus manos, que la elevan por el aire y la introducen directamente por el agujero del techo.

          "¿Qué demonios?", dice Daren. "¿No ha usado magia de fuego hace un momento? ¡¿No me digas que ya ha dominado dos elementos a los nueve años?!"

          "En realidad, creo que el agua es el elemento de la banshee", le digo a Daren.
      - source: scene_text_2
        paragraph: 22
        text: |-
          "¿Qué acabas de decir?", me pregunta.

          "Chicos, ¿pueden oírme?", nos pregunta Flower desde la habitación de arriba, pero luego continúa hablando sin esperar respuesta. "Solo quería hacerles saber que he encontrado el mecanismo secreto. Pero, eh... Verán, el caso es que hay más de un mecanismo. Y no sé muy bien cuál de ellos es el correcto. Pero... Estoy segura de que lo resolveré a tiempo. Probablemente".

          "¡Vale, ya basta!", dice Hadrik. "Voy a atravesar esta pared a puñetazos hasta que lleguemos al otro lado".

          "¿Qué?", grita Kate. "¡No, no hagas eso! ¿Estás loco? ¿Y si esa pared es lo único que sostiene el techo sobre nosotros y todo se nos viene encima una vez que la destruyas?"

          "¿Entonces prefieres quedarte aquí sentada y ser aplastada entre dos paredes?", dice Hadrik. "¿No pensarás en serio que la pequeña atolondrada de ahí arriba va a descifrar los complejos mecanismos que manejan este lugar antes de que las paredes nos alcancen, verdad?"

          "¿Eh, chicos?", dice Flower. "No sé si pueden oírme, pero me acabo de dar cuenta de que olvidé decirles una cosa importante. Hagan lo que hagan, NO rompan las paredes. ¿Vale? ¡Bien! Ahora, veamos... ¡Creo que lo tengo! ¡Ajá!... Vale, no, eso era el interruptor de la luz. Vuelta a empezar".
    choices:
      - position: 1
        text: Decirle a Hadrik que ignore a Kate y Flower y que rompa la pared
        effects:
