        texts:
          - source: scene_text
            paragraph: 58
            text: |-
              Flower sale corriendo del túnel, pero su impulso se desvanece inmediatamente después de entrar en la sala de control y se detiene justo delante de la salida del pasillo. Al llegar yo mismo al final del pasillo, mis ojos tardan unos instantes en acostumbrarse a la luz tan brillante que hay en esta sala.

              "¡Felicidades!", oigo decir a una voz femenina, mientras mi visión es todavía un poco borrosa. "Han llegado a la sala de control. Ahora ya pueden morir en paz, sabiendo que han logrado su objetivo".

              De repente me doy cuenta de dónde venía toda esa luz. El gran zorro dorado está de pie frente a nosotros y su aura mágica, increíblemente fuerte, brilla tanto que cuesta incluso mirarla. Su forma puede ser la de un zorro normal, pero su aura emite una vibración de otro mundo. Una vibración similar, de hecho, a la de una banshee. ¿Podría proceder ella también del plano mágico?

              Al mirar a mi alrededor, veo que la habitación en la que estamos está llena de palancas y botones de todas las formas y tamaños, tal como dijo Flower, y hay escrituras extrañas en todas las paredes. Además de la zorra, en la habitación también hay un leopardo, que parece ser uno de los seguidores de la zorra.
          - source: scene_text_2
            paragraph: 4
            text: |-
              "En cuanto me enteré de que se habían escapado de la mazmorra", dice la zorra, "supe que solo podía haber un lugar al que se dirigieran, así que en lugar de perseguirlos, decidí simplemente esperarlos aquí. Fueron tontos al escaparse de su celda. Si hubieran esperado pacientemente mi juicio, solo habrían sido condenados a una vida de trabajos forzados en el reino animal. Sin embargo, escapar de la prisión antes de oír su sentencia es un crimen mucho más atroz. Uno que se castiga con la muerte".

              "¡¿Estás de broma?!", dice Daren. "¿Quién condena a alguien a una vida de trabajos así solo porque resulta que entró en una zona prohibida por accidente? ¿También ejecutas a tus cervatillos y cachorros si no se mantienen fuera del césped en un parque?"

              "Harías bien en no dirigirte a mí de una manera tan informal, mago con armadura", dice el zorro dorado. "Pero para responder a tu pregunta, el reino animal no tiene parques, ni una regla para mantenerse fuera del césped en ninguna región del continente. Sin embargo, si existiera tal regla, y un cachorro o un cervatillo la rompiera, te aseguro que no dudaría en ordenar su ejecución. Las reglas están para cumplirse, tanto por los humanos como por los animales. El hecho de que ustedes los humanos sean tan indulgentes con sus reglas es una de las razones principales por las que su sociedad está decayendo hasta tal punto. No oiré más de esto".

              De repente, una jaula dorada aparece de la nada y nos rodea a todos menos a Flower.

              "Ustedes cinco no valen ni un segundo más de mi tiempo", dice la zorra. "Voy a ejecutarlos aquí y ahora y acabar con esto de una vez por todas".
          - source: scene_3
            paragraph: 4
            text: |-
              El poder mágico que emana de ella no se parece a nada de lo que haya sido testigo antes. Ni siquiera sentí tanta presión cuando estuve en presencia de Azarius. La desesperanza que siento ahora mismo solo puede compararse con la sensación que tuve cuando conocimos a Eiden por primera vez. ¿Vamos a morir todos así, sin ni siquiera tener la oportunidad de ofrecer la más mínima resistencia?

              "¡Eleya, espera!", dice la niña mientras se interpone entre nosotros y la zorra espíritu. "¡No puedes hacerles daño! ¡No son mala gente!"

              "No te metas en mi camino, Flower", dice la zorra. "Esta gente ha roto nuestras reglas sagradas y debe ser castigada".

              "Ya, pero ¿no puedes, no sé, darles un tirón de orejas o algo?"

              "No voy a dejar que cuestiones nuestros métodos ni nuestros castigos, niña. Puede que nos hayas ayudado en el pasado, pero si insistes en defender a estos criminales, no dudaré en ejecutarte junto con ellos".

              "¡Ooooooh! ¡Siempre eres tan testaruda!", dice la niña mientras sus ojos se vuelven de un rojo brillante y su aura mágica empieza a irradiar con fuerza desde su cuerpo. "¡Está bien! ¡Si quieres pelea, te daré tu pelea! ¡Prepárate, Pétalo!"
