        paragraph: 30
        text: |-
          "Bueno", dice Hadrik. "Si no va a venir a nosotros..."

          No termina su frase y arremete directamente contra la criatura de nueve cabezas. El monstruo ataca al enano con cuatro de sus cabezas, pero él salta para esquivarlas y consigue colocarse debajo del cuerpo de la hidra. Entonces Hadrik flexiona todos sus músculos y empieza a levantar a la hidra del suelo, mientras ruge con fuerza y su cara se vuelve casi roja por el esfuerzo. 

          Antes de que la hidra tenga tiempo de reaccionar, el enano la envía estrellándose contra la pared más cercana. La criatura se tambalea ahora torpemente, intentando volver a levantarse.

          "Supongo que no puedo dejar pasar una oportunidad tan buena como esta", dice Daren. "Barry, tú cuida de Rose. Iré a luchar contra la hidra con Hadrik".

          "Eh, vale...", le digo, mientras él arremete hacia el monstruo y empieza a acuchillar su enorme cuerpo.

          Me doy la vuelta y veo que Rose está sentada en el suelo, con la espalda apoyada en la pared y los brazos sujetándose las piernas, intentando en vano controlar sus temblores.
