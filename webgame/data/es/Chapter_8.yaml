  - name: ch8_wait
    texts:
      - source: scene_text
        paragraph: 25
        text: |-
          "Hadrik, es demasiado arriesgado. ¿No puedes darle a Flower solo un poco más de tiempo?"

          Hadrik parece disgustado por no recibir ningún tipo de apoyo del grupo.

          "Bueno, está bien entonces", dice Hadrik. "Si a nadie le gusta mi idea, entonces esperaré un poco más. Pero recuerden mis palabras, si esas paredes llegan a alcanzarnos, no voy a contenerme".

          Después de quince segundos más de espera, las paredes empiezan finalmente a frenar, y pronto se detienen por completo. Flower no tarda en volver a aparecer, con una sonrisa victoriosa en la cara.

          "¡Ja, ja, lo conseguí!", dice ella, poco después de caer por el agujero del techo. "Pero creo que también debería contarles las malas noticias. Verán, cuando estaba trasteando con esos complejos mecanismos de arriba, yo... pueeede que haya activado accidentalmente todas las trampas de este pasillo".

          "¡¿Que qué?!", le pregunta Kate.

          "¡No se preocupen, todavía puedo arreglarlo!", dice Flower. "Creo que sé dónde están la mayoría de las trampas, así que mientras sigan mis instrucciones deberían estar bien. Solo necesito hacer una prueba rápida y asegurarme de que no estoy recordando nada mal".
