          "Dice: 'Si te gusta descubrir secretos, toca cada uno de estos glifos en rápida sucesión' ".

          "Vale...", dice Daren. "Entonces, ¿por qué no tocas los glifos?"

          "No lo sé, podría ser una trampa de algún tipo".

          "¡Claro! ¿Por qué no se me ocurrió eso? Quiero decir, ¿qué mejor manera de atraer a la gente para que haga algo que tú quieres que escribir un mensaje en algún idioma oscuro que nadie puede leer, verdad?"

          "En realidad, dado que esto probablemente fue escrito hace unos miles de años, este idioma bien podría haber sido la lengua común en aquel entonces--"

