        paragraph: 34
        text: |-
          "¿De verdad vas a hacer esto cada vez que luchemos contra un monstruo grande?"

          Casi en cuanto termino mi frase, siento un dolor muy agudo en el abdomen, cuando Kate me golpea con todas sus fuerzas y me hace caer de rodillas mientras intento recuperar el aliento.

          "Realmente, ahora, Kate...", le digo mientras me recupero de su golpe y me pongo en pie. "Te juro que tengo la mitad de ganas de devolvértelo ahora que no tienes acceso a ninguno de tus hechizos de hielo superpoderosos".

          "Pruébame", me dice Kate mientras asume su postura de combate. "Dispositivo de estadísticas y todo. Te aseguro que me he entrenado en varias artes marciales a lo largo de mi vida para una ocasión así".

          Incluso sin sus poderes de hielo, sigue consiguiendo emitir ese aura amenazadora suya, mientras me mira directamente a los ojos, sin ningún tipo de vacilación.

          "Era una broma, Kate", le digo mientras suspiro. "Solo una broma".
