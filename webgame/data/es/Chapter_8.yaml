          "¿Podrías decirnos algo más sobre ese cáliz sagrado que debemos recuperar?"

           "El cáliz sagrado es un artefacto que puede dar al agua propiedades curativas únicas", dice Eleya. "Usábamos esta agua para curar ciertas enfermedades que son específicas de los animales y que son incurables mediante el uso de hechizos. Estas enfermedades se han cobrado muchas vidas de mis súbditos desde que los ogros robaron nuestro cáliz y lo escondieron en su fortaleza".

          "¿Se nos desactivarán temporalmente los collares una vez que lleguemos a la fortaleza de los ogros?", pregunta Kate. "He visto collares como estos antes y sé positivamente que podían activarse y desactivarse a voluntad, sin tener que quitarlos".

          "Me temo que los collares que usamos son una versión más primitiva de los que tú conoces", dice la zorra. "Sus efectos no desaparecerán a menos que los quitemos por completo, y no voy a hacer que se los quiten hasta que hayan recuperado el cáliz de oro. Les daré un plazo de cinco días para completar su búsqueda. Esto debería darles tiempo más que suficiente para realizar la tarea. Si no han vuelto en cinco días, asumiré que han abandonado su búsqueda y usaré estos collares para que mueran electrocutados".

          "¡¿Cinco días?!", pregunta Hadrik. "¿Y si nos perdemos por el camino?"

          "No se perderán", dice la zorra. "Porque voy a enviar a un guía con ustedes para que les enseñe el camino".
