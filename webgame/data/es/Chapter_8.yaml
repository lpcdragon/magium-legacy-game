  - name: ch8_dragonfly
    routes:
      - condition: ch8_talk = 0
        texts:
          - source: scene_text
            paragraph: 50
            text: |-
              "Si sabemos que al menos uno de estos caminos es el correcto, entonces lo mismo da elegir uno al azar y si activamos alguna trampa, salimos de allí lo antes posible. Yo digo que probemos primero por el pasillo marcado con una libélula".

              "Para mí, cualquier camino es tan bueno como cualquier otro", dice Daren. "De hecho, pensándolo bien, prefiero seguir específicamente la sugerencia de Barry, ¡porque así, si nos topamos con una trampa, podré echarle toda la culpa a él después!"

              Una vez que todos estuvieron de acuerdo en dejarme cargar con la culpa de nuestro posible fracaso, todos empezamos a caminar por el pasillo marcado con una libélula. 

              Antes incluso de dar cinco pasos dentro del pasillo, oímos un fuerte ruido detrás de nosotros, mientras nuestro camino de vuelta queda sellado por un muro de piedra recién erigido. Inmediatamente después, el techo empieza a descender hacia nosotros, poco a poco.

              "Oh no...", dice Flower. "¡Ahora me acuerdo! ¡Era el escarabajo! ¡El escarabajo marcaba el camino correcto! ¿Por qué no me acordé de esto antes?"

              "Bueno, no es como si fuera el fin del mundo, o algo así", dice Hadrik. "El techo apenas se mueve. Romperé esta pared que bloquea la salida y todos podremos volver al camino correcto".

              "¡No!", grita Flower. "¡Si rompes esa pared, van a salir de ella docenas de flechas envenenadas!"
          - source: scene_text_2
            paragraph: 38
            text: |-
              "Hmm...", dice Hadrik. "Estoy bastante seguro de que el pasillo del escarabajo era el del medio. Eso significa que si rompo esta pared a nuestra izquierda, podemos entrar directamente al pasillo del escarabajo, sin tener que volver atrás".

              Hace una pausa.

              "Es decir... Si, eh... Si todos los demás también están de acuerdo con esto".

              "Que yo sepa, no hay trampas dentro del muro entre los dos pasillos", dice Flower.

              "Está bien, Hadrik", dice Kate. "Siéntete libre de destrozar la pared a tu gusto".

              "¡Recibido!", dice Hadrik, con una sonrisa, mientras golpea la pared con todas sus fuerzas.

              Entonces nos abrimos paso por el agujero de la pared y entramos en el pasillo del escarabajo, tal y como estaba previsto. 

              Tras unos minutos de caminar por el pasillo, empezamos finalmente a ver algo de luz al final del túnel. 

              "¡Es aquí!", dice Flower, emocionada, mientras señala hacia la salida. "¡Recuerdo esta parte! ¡Una vez que pasemos esa puerta, nada se interpondrá entre nosotros y la sala de control! ¡Les dije que llegaríamos sanos y salvos! ¡Vengan, síganme!"
