  - name: ch8_follow
    texts:
      - source: scene_text
        paragraph: 14
        text: |-
          Toco todos los glifos en orden, uno por uno, tal como decían las instrucciones.

          De repente, la piedra con las marcas se desliza hacia un lado y dos objetos pequeños salen despedidos del hueco que dejó en la pared. La piedra vuelve a su posición original. Al mirar más de cerca, veo que los dos objetos que salieron de la pared son un pequeño pergamino y lo que parece ser una pieza de un rompecabezas. Los recojo ambos del suelo y leo el trozo de pergamino. Esta vez el texto está escrito en la lengua común y dice: "Encuentra todas las piezas del rompecabezas y compartiré contigo mi mayor secreto. He dejado una de estas en cada uno de los edificios que he diseñado".

          El pergamino está firmado simplemente como: "El arquitecto de este edificio".

          "Vale", dice Daren, mientras me guardo el pequeño pergamino y la pieza del rompecabezas en el bolsillo izquierdo. "Primero de todo, ¿qué decían los glifos? Y segundo, ¿qué son esas cosas?"

          "Los glifos decían que si los presionaba todos en rápida sucesión descubriría un secreto. El pergamino decía que si encuentro todas las piezas del rompecabezas, descubriré el mayor secreto del arquitecto de este edificio".

          "Inútil", dice Daren, decepcionado, mientras se aleja de la pared y empieza a caminar de nuevo por el pasillo. "No sé qué esperaba, la verdad. Quiero decir, no es como si estuviéramos--"
