  - name: ch8_purification
    texts:
      - source: scene_text
        paragraph: 42
        text: |-
          "¿Q-q-qué estás haciendo?", pregunta Flower a Daren mientras éste se acerca a ella y empieza a mover su espada en el aire a su alrededor.

          "Flower, no pasa nada", le digo. "Su técnica no funcionará contigo ni con Pétalo. Te lo garantizo".

          "Eh... ¿vale?", dice Flower con un ligero temblor en la voz.

          Daren agita su espada en el aire durante unos quince segundos, intentando que se ilumine para poder iniciar el ritual de purificación.

          "No... No está funcionando...", dice Daren tras haberse rendido finalmente.

          "Claro que no", le digo. "La técnica de purificación solo puede usarse antes de que una banshee haya despertado del todo, o si la banshee nunca existió en primer lugar. El aura de una banshee despertada es demasiado errática para poder fijarla bien, así que la técnica simplemente no se activará. La única forma de matar a la banshee ahora es si también matas a la niña junto con ella. ¿Eso es lo que quieres?"

          "No, eso no es... yo no..."

          "¡Escúchenme!", nos grita la niña. "¡Pétalo está aquí para quedarse, les guste o no! No tienen por qué hablar con ella si no quieren. ¡Y yo también estoy aquí! ¡Y... aunque no sea la mejor guía que hay... soy la única guía que tienen! ¡Prometí que los llevaría a todos a la sala llena de botones y no pienso faltar a esa promesa! ¿Todavía están dispuestos a seguirme?"
    choices:
      - position: 1
        text: Claro. No es que tengamos una alternativa mejor en este momento.
        effects:
          - set:
              current_scene: ch8_alternative
      - position: 2
        text: Por favor, dime que al menos tienes una idea vaga de hacia dónde nos dirigimos.
        effects:
          - set:
              current_scene: ch8_vague
  - name: ch8_alternative
    texts:
      - source: scene_text
        paragraph: 43
        text: |-
          "Claro. No es que tengamos una alternativa mejor en este momento".

          "Estoy de acuerdo", dice Kate. "No importa lo mal que la niña recuerde el trazado de estas ruinas. Sigue siendo mejor que no tener ninguna información".

          Hadrik suspira.

          "Cuenten conmigo también, supongo", dice él. "La última vez que intenté tomar la iniciativa acabamos en la guarida de una hidra, así que no tengo derecho a quejarme".

          "Yo...", dice Rose, que aún no ha recuperado del todo la voz tras el incidente de la hidra. "Creo que también deberíamos seguir a Flower..."

          "¡Muy bien, entonces!", dice la niña mientras se le ilumina la cara. "¡No se van a arrepentir de esto! ¡Vengan, síganme, sé exactamente a dónde vamos!"

          Entonces toma la delantera y empieza a desfilar como un soldado delante de nosotros, mientras dice repetidamente: "Hut, dos, tres, cuatro".

          "Oh, ya empiezo a arrepentirme de esto...", dice Daren, mientras todos empezamos a seguir los pasos de la niña y dejamos atrás la sala de la hidra.

          Tras unos minutos de caminata, llegamos a lo que parece ser un ascensor hecho enteramente de piedra. En su interior hay varias palancas, que supongo que sirven para manejarlo.
      - source: scene_text_2
        paragraph: 35
        text: |-
          "Vale, este ascensor nos va a llevar de vuelta al nivel superior del que vinimos", dice la niña mientras todos entramos en él. "¡Nos va a dejar justo al final del pasillo, así que no tendremos que preocuparnos por más trampas! Ahora, si tan solo pudiera recordar cuál de estas palancas tengo que accionar..."

          Empieza a mirar cada palanca por turno, con el ceño fruncido.

          "¡Ooooooh! ¡No puedo recordar cuál es la correcta!", exclama la niña tras diez segundos de mirada continua.

          Se oye un murmullo que sale del amuleto que Flower lleva al cuello.

          "¿Qué pasa, Arraka?", pregunta la niña mientras abre el amuleto.

          "¡Eh, Flower!", dice la voz del amuleto. "Recuerdo qué palanca tienes que accionar para llegar al nivel superior. ¡Es la segunda por la derecha!"

          "No me estarás mintiendo otra vez, ¿verdad?", pregunta Flower, mirando el amuleto con desconfianza.

          "¡Oh, no, no, es la verdad! ¡Lo juro por mi madre!"

          "Bueno, vale, entonces...", dice la niña mientras tira de la palanca.

          De repente, el ascensor empieza a moverse pero, como era de esperar, la dirección en la que nos dirigimos es hacia abajo en lugar de hacia arriba.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch8_arraka
  - name: ch8_vague
    texts:
      - source: scene_text
        paragraph: 44
        text: |-
          "Por favor, dime que al menos tienes una idea vaga de hacia dónde nos dirigimos".

          "¡Claro!", dice Flower. "Lo primero que tenemos que hacer es volver al pasillo del que vinimos. Hay un ascensor no muy lejos de aquí que puede llevarnos de vuelta al nivel superior. ¡Nos dejará justo al final del pasillo, así que no tendremos que preocuparnos por más trampas!"

          "Eso... en realidad suena como un plan bastante bueno", dice Hadrik.

          "Estoy de acuerdo", dice Kate. "No podemos permitirnos perder el tiempo dando vueltas, con la zorra espíritu pisándonos los talones. Yo digo que sigamos el liderazgo de la niña por ahora".

          "Yo...", dice Rose, que aún no ha recuperado del todo la voz tras el incidente de la hidra. "Creo que también deberíamos seguir a Flower..."

          "¡Muy bien, entonces!", dice la niña mientras se le ilumina la cara. "¡No se van a arrepentir de esto! ¡Vengan, síganme, sé exactamente a dónde vamos!"

          Entonces toma la delantera y empieza a marchar como un soldado delante de nosotros, repitiendo una y otra vez "Un, dos, tres, cuatro".

          "Oh, ya me estoy arrepintiendo de esto...", dice Daren mientras todos empezamos a seguir los pasos de la niña y dejamos atrás la sala de la hidra.

          Tras unos minutos de caminar, finalmente llegamos al ascensor del que Flower habló. Está hecho completamente de piedra, pero hay varias palancas dentro, que supongo que se usan para accionarlo.
