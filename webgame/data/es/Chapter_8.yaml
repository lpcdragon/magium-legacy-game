  - name: ch8_intro2
    texts:
      - source: scene_text
        paragraph: 3
        text: |-
          Una vez que termino con el potenciador de estadísticas, lo vuelvo a guardar en mi bolsillo y el dispositivo deja de pitar.

          "¡Finalmente!", dice Daren. "Al menos ahora podemos tener algo de paz y tranquilidad mientras intentamos pensar en una forma de salir de aquí".

          "Espera", le digo. "Dijiste que unos animales nos trajeron aquí, pero no veo a nadie vigilando nuestra celda. ¿Vinieron por aquí mientras yo todavía estaba inconsciente?"

          "Sí", dice Daren. "Un tigre y un oso pasaron antes y empezaron a gruñirnos. Al principio, pensé que los carceleros habían enviado a sus mascotas aquí para asustarnos, pero luego Kate y Rose empezaron a hablar con ellos, haciendo ruidos de animales extraños. Resulta que todos los animales y monstruos de este continente pueden hablar, pero solo usan lenguas antiguas. Los monstruos no pueden hablar en la lengua común porque no saben nada mejor, y los animales no tienen permitido hablarla porque su líder, la zorra espíritu, ha prohibido su uso después de que los humanos empezaran a cazarlos para alimentarse. También resulta que tener una comprensión básica de las lenguas antiguas no es tan poco común si naciste en este continente".

          "No importa todo eso", le digo a Daren. "¿Dijeron lo que quieren de nosotros?"

          "Sí, dijeron que deberíamos esperar aquí hasta que llegara su gran zorro dorado, y aparentemente no paraban de hacer bromas sobre cómo ella nos daría a todos una lección".

          "Entonces, ¿por qué no nos están vigilando? ¿Qué nos impide simplemente romper las paredes y escapar?"

          "Estos", dice Daren, mientras señala su cuello.
      - source: scene_text_2
        paragraph: 6
        text: |-
          Por primera vez, noto que todos llevamos collares verdes alrededor del cuello, con marcas extrañas escritas en ellos. Me vuelvo hacia Kate.

          "Espera, ¿son estos...?" empiezo a preguntarle pero ella me interrumpe.

          "Sí", me responde. "Son el mismo tipo de collares que los antiguos usaban con los magos artificiales en el Faro de Esperanza para mantener sus poderes bajo control. La buena noticia es que sé cómo apagarlos. La mala noticia es que necesitamos encontrar el dispositivo que alimenta todos estos collares, antes de que pueda usarlo para desactivarlos. Estas ruinas también fueron construidas por los lessathi de antaño, así que si se parecen en algo al Faro, entonces debería haber una sala de control no muy lejos de aquí".

          "Pero si ninguno de ustedes puede lanzar hechizos, ¿entonces por qué Hadrik todavía está en su forma de enano?"

          "Sí, yo también me preguntaba eso", dice Hadrik. "Supongo que los collares en realidad no disipan ningún hechizo que te hayas lanzado a ti mismo antes de ponértelos. Solo te impiden lanzar más magia. Lo primero que intenté cuando me desperté fue convertirme en un gigante, pero este maldito collar no me deja lanzar ningún tipo de magia de cambio de forma".

          "Dices que no puedes lanzar ninguna magia..." le digo. "Pero todavía tienes tu fuerza sobrehumana, ¿verdad?"
      - source: scene_3
        paragraph: 5
        text: '"¡Sí!", dice Hadrik, sonriendo. "Pero incluso con mi poder, sigo sin poder romper el collar alrededor de mi cuello. Estos malditos artilugios parecen ser casi indestructibles. Estaba comprobando si las paredes son tan duraderas como los collares, pero parece que están hechas de piedras normales. ¡Debería poder romperlas sin ningún problema!"'
    choices:
      - position: 1
        text: ¡Perfecto! Entonces no perdamos más tiempo aquí.
        effects:
          - set:
              current_scene: ch8_escape
              ch8_talk: 0
      - position: 2
        text: Espera, creo que deberíamos intentar hablar las cosas con su líder primero.
        effects:
          - set:
              current_scene: ch8_talk
              ch8_talk: 1
  - name: ch8_talk
    texts:
      - source: scene_text
        paragraph: 4
        text: |-
          "Espera, creo que deberíamos intentar hablar las cosas con su líder primero."

          "Parece un buen plan", dice Daren, con un tono sarcástico. "Quiero decir, por lo que sabemos, esto bien podría ser solo algún malentendido cultural, y solo quieren ofrecernos una taza de té".

          "Maldita sea, Daren, sabes muy bien que esto no es lo que yo estab--"

          "¡Muy bien, todos!", grita Daren con fuerza, para tapar el sonido de mi voz. "¡Es hora de votar! Barry dice que todos deberíamos quedarnos aquí y comer pastelitos con la reina del país de las hadas mágicas. Yo digo que deberíamos salir corriendo ahora, mientras no hay nadie vigilando nuestra celda. ¡Quien también piense que escapar ahora sería nuestra mejor opción, por favor levante la mano!"

          Los cuatro levantan sus manos simultáneamente. Daren y Hadrik me sonríen, mientras que Kate mira hacia otro lado y Rose sonríe disculpándose.

          "¡Lo siento, Barry!", dice ella.

          "Bueno", continúa Daren, "como estamos en una democracia, me temo que te faltaron dos votos para la victoria, Barry. ¡Es una lástima, los resultados estuvieron muy reñidos! Hadrik, cuando estés listo".

          "¡Sí!", dice el enano, preparándose para abrir un agujero en la pared.

          "¡Paren!", digo, y Hadrik interrumpe su golpe para mirarme.
      - source: scene_text_2
        paragraph: 7
        text: |-
          "Oh, por el amor de Dios, ¿qué pasa esta vez?", pregunta Daren.

          "¿Y si todo esto es una trampa?", digo. "¿No les parece extraño que no haya ni un solo guardia vigilando nuestra celda? ¿Y si nos están incitando a escapar para poder capturarnos de nuevo con cargos más graves? Ahora mismo, de lo único que somos culpables es de invadir temporalmente su territorio. Dado que somos forasteros y no conocemos bien estas tierras, deberíamos tener circunstancias atenuantes. Pero si intentamos escapar ahora, seguramente tendremos que luchar contra algunos de los animales, e incluso podríamos vernos obligados a matar a algunos de ellos. ¿Realmente queremos hacernos enemigos de toda una raza solo por un pequeño malentendido?"

          "Hmm..." Hadrik dice pensativo, mientras se acaricia la barba. "El muchacho tiene razón".

          "¡No puedes hablar en serio!", le dice Daren.

          "Rose", continúo, "¿no nos dijiste que esta zorra espíritu suya es como una especie de diosa? ¿No es ella, como, increíblemente fuerte?"

          "Oh, sí", dice Rose. "Tiene miles de años y probablemente eclipsa el poder de la mayoría de los magos de este torneo".

          "Entonces, ¿elegirías hacerla nuestra enemiga de buenas a primeras, sabiendo que podría haber una pequeña oportunidad de hablar las cosas con ella si solo tenemos un poco de paciencia?"

          "Bueno, cuando lo pones así, ¡supongo que no lo haría!", dice Rose, sonriendo.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch8_talk2
  - name: ch8_talk2
    texts:
      - source: scene_text
        paragraph: 5
        text: |-
          "¡Oh, vamos!", dice Daren, exasperado. "¡Todos estaban de mi lado hace unos momentos!"

          "¿Qué pasa, Daren?", le pregunto con una sonrisa burlona. "¿Ya no te gusta la democracia?"

          Daren me frunce el ceño, pero finalmente se rinde y decide abandonar su postura sobre el tema.

          "¡Bien!", dice. "Veo que todos han tomado ya una decisión, así que no sirve de nada alargar más este asunto. Hablaremos con este gran zorro dorado y veremos qué pasa a partir de ahí".

          No tarda mucho en aparecer la líder de los animales. Su forma es la de un zorro normal, pero su pelaje es tan brillante que parece hecho de oro auténtico. El aura mágica que emana es bastante intimidante y también emite una vibración de otro mundo. Una vibración similar, de hecho, a la de una banshee. ¿Podría proceder ella también del plano mágico?

          La zorra viene acompañada por un leopardo y un toro, uno a su izquierda y otro a su derecha, como dos guardaespaldas caminando junto a algún niño noble rico. Cuando todos se detienen frente a nuestra celda, la zorra empieza a hablarnos en la lengua común.
      - source: scene_text_2
        paragraph: 8
        text: |-
          "Saludos, forasteros", dice ella. "Soy Eleya, el zorro dorado, y estos son mis dos lugartenientes de confianza, Leo el leopardo y Taurus el toro".

          "¡Leo y Taurus!", dice Daren en voz baja. "¡Creatividad de nombres en su máxima expresión!"

          "Sin embargo, ¿no debería ser Leo el nombre de un león?", le pregunta Hadrik.

          "¡Shhh!", les dice Rose, mirando frenéticamente a los tres animales para ver si alguno de ellos ha oído su charla.

          El toro parece haber oído y entendido la broma de Daren, ya que ahora lo mira fijamente con una mirada furiosa. El leopardo o bien no oyó su comentario o no lo consideró digno de una reacción por su parte. La zorra simplemente los ignora por completo y continúa su discurso, como si nada hubiera pasado.

          "Mis leales súbditos me informaron de que fueron sorprendidos invadiendo nuestros terrenos sagrados. ¿Qué tienen que decir en su defensa?"
    effects:
      - set:
          ac_ch8_democratie: 1
        achievement:
          id: ac_ch8_democratie
          title: ¡Viva la democracia!
    choices:
      - position: 1
        text: No sabíamos que estábamos en terrenos sagrados.
        effects:
          - set:
              current_scene: ch8_ignorance
      - position: 2
        text: Nuestra intención era irnos, pero fuimos atacados y nos dejaron inconscientes.
        effects:
          - set:
              current_scene: ch8_attacked
  - name: ch8_ignorance
    texts:
      - source: scene_text
        paragraph: 6
        text: |-
          "No sabíamos que estábamos en terrenos sagrados."

          "¿Esa es tu defensa?", me pregunta la zorra, desconcertada. "¿De qué manera la ignorancia te absuelve de tu transgresión? ¿Niegas haber invadido nuestros terrenos sagrados?"

          "No, pero--"

          "Entonces por la presente te declaro culpable y te condeno a una vida de trabajos forzados en nuestro reino animal. Que tus años pasados aquí te hagan reflexionar sobre lo que has hecho y arrepentirte de tus crímenes".

          "¡Ahora, espera un segundo!", dice Daren. "¿Qué clase de sentencia sin sentido es esta? ¿Quién condena a alguien a una vida de trabajos forzados así solo porque resulta que entró en una zona prohibida por accidente? ¿También ejecutas a tus cervatillos y cachorros si no se mantienen fuera del césped en un parque?"
      - source: scene_text_2
        paragraph: 9
        text: |-
          "Harías bien en no dirigirte a mí de una manera tan informal, mago con armadura", dice Eleya. "Pero para responder a tu pregunta, el reino animal no tiene parques, ni una regla para mantenerse fuera del césped en ninguna región del continente. Sin embargo, si existiera tal regla, y un cachorro o un cervatillo la rompiera, te aseguro que no dudaría en ordenar su ejecución. Las reglas están para cumplirse, tanto por los humanos como por los animales. El hecho de que ustedes los humanos sean tan indulgentes con sus reglas es una de las razones principales por las que su sociedad está decayendo hasta tal punto. No oiré más de esto. Comenzarán su trabajo mañana, al amanecer. Tienen hasta entonces para prepararse para lo que está por venir".

          Con estas últimas palabras, el zorro dorado se marcha, y su compañero toro se apresura a seguirla. El leopardo se queda atrás un momento y hace aparecer mágicamente un sobre amarillo en el suelo frente a él, de la nada. Luego usa una de sus patas delanteras para empujar el sobre bajo la puerta de rejas metálicas y dentro de nuestra celda. Una vez que se asegura de que tiene nuestra atención, él también va a seguir a la zorra y al toro, sin decirnos ni una sola palabra.

          Rose recoge el sobre del suelo y lo abre. Dentro hay una pequeña nota que parece estar escrita en la lengua común.

          "¿Qué dice?", pregunta Kate.

          "Dice: 'Si llegan a un pasillo que se divide en tres caminos, cada uno marcado con el símbolo de un insecto, elijan el marcado con un escarabajo' ".
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch8_escape
  - name: ch8_attacked
    texts:
      - source: scene_text
        paragraph: 7
        text: |-
          "Nuestra intención era irnos, pero fuimos atacados y nos dejaron inconscientes."

          "¡¿Así que admites haber librado una batalla en nuestros terrenos sagrados?!", me pregunta la zorra, conmocionada. "Ese es un crimen mucho más atroz que haber simplemente invadido nuestro territorio. Un crimen que se castiga con la muerte".

          "Espera, ¿qué?..."

          "Se les darán veinticuatro horas para hacer las paces con sus dioses y para escribir sus últimas cartas a sus familias. Su ejecución se llevará a cabo mañana, al amanecer. Asegúrense de tenerlo todo hecho para entonces".

          "¡Ahora, espera un segundo!", dice Daren. "¿Qué clase de sentencia sin sentido es esta? ¿Quién condena a muerte a alguien así solo porque resulta que estaba luchando en tu territorio? ¿También ejecutas a tus cervatillos y cachorros si no se mantienen fuera del césped en un parque?"
      - source: scene_text_2
        paragraph: 10
        text: |-
          "Harías bien en no dirigirte a mí de una manera tan informal, mago con armadura", dice Eleya. "Pero para responder a tu pregunta, el reino animal no tiene parques, ni una regla para mantenerse fuera del césped en ninguna región del continente. Sin embargo, si existiera tal regla, y un cachorro o un cervatillo la rompiera, te aseguro que no dudaría en ordenar su ejecución. Las reglas están para cumplirse, tanto por los humanos como por los animales. El hecho de que ustedes los humanos sean tan indulgentes con sus reglas es una de las razones principales por las que su sociedad está decayendo hasta tal punto. No oiré más de esto. Tienen hasta mañana para meditar y reflexionar sobre lo que han hecho. Usen este tiempo sabiamente".

          Con estas últimas palabras, el zorro dorado se marcha, y su compañero toro se apresura a seguirla. El leopardo se queda atrás un momento y hace aparecer mágicamente un sobre amarillo en el suelo frente a él, de la nada. Luego usa una de sus patas delanteras para empujar el sobre bajo la puerta de rejas metálicas y dentro de nuestra celda. Una vez que se asegura de que tiene nuestra atención, él también va a seguir a la zorra y al toro, sin decirnos ni una sola palabra.
               
          Rose recoge el sobre del suelo y lo abre. Dentro hay una pequeña nota que parece estar escrita en la lengua común.

          "¿Qué dice?", pregunta Kate.

          "Dice: 'Si llegan a un pasillo que se divide en tres caminos, cada uno marcado con el símbolo de un insecto, elijan el marcado con un escarabajo' ".
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch8_escape
  - name: ch8_escape
    routes:
      - condition: ch8_talk = 1
        texts:
          - source: scene_text
            paragraph: 8
            text: |-
              "Espera", dice Kate. "¿Significa esto que el leopardo espera que escapemos y nos está dando indicaciones?"

              "Entonces, Barry", dice Daren con una voz particularmente fuerte, a pesar de que estamos todos muy cerca los unos de otros, "¿qué te parece que deberíamos hacer ahora? ¿Crees que deberíamos esperar hasta mañana y ver si el zorro dorado cambia de opinión? ¡Tal vez deberíamos hacer otra votación para decidir nuestra mejor opción! ¿Qué dices, Barry? ¿Hacemos otra votación?"

              La sonrisa de suficiencia que tiene en la cara está empezando a ser un poco irritante.

              "Ya es suficiente, Daren", dice Kate. "Ninguno de nosotros podía haber sabido cuáles eran las intenciones de la zorra de antemano. Siguen sin dejar guardias que nos vigilen, así que no se ha hecho ningún daño. De hecho, puede que incluso estemos en una mejor posición que antes, a juzgar por el contenido de la nota que Rose tiene en sus manos".

              "¡Sí!", dice Hadrik, "¡Todos estuvimos de acuerdo en escuchar a la zorra antes de intentar escapar. ¡Fue una buena idea mientras duró!"

              Al no quedarnos otra alternativa que escapar de nuestra celda, esperamos unos minutos para asegurarnos de que la zorra y sus lugartenientes estuvieran fuera del alcance del oído, y luego Hadrik destrozó la pared de nuestra prisión con su puño.
          - source: scene_text_2
            paragraph: 11
            text: |-
              Al pasar por encima de los escombros y echar un buen vistazo al exterior de nuestra celda, vemos que el pasillo en el que acabamos de entrar está completamente desierto. Si no fuera por unas cuantas antorchas encendidas aquí y allá, no sería muy descabellado suponer que este edificio había sido abandonado hace mucho tiempo. Nuestra celda parece haber sido colocada en el extremo más alejado del pasillo, lo que significa que el único camino para nosotros es hacia la izquierda. 

              "No me gusta esto", dice Kate, mientras caminamos por el pasillo. "Esta es la misma dirección en la que se fueron la zorra y sus seguidores. Lo último que queremos es encontrarnos con ellos mientras escapamos".

              "Bueno, no es que nos dieran muchas opciones", dice Hadrik. "Solo había un camino por el que ir después de salir de nuestra celda, y no ha habido ninguna bifurcación en el camino desde entonces. Lo que más me intriga es que no hemos pasado por ninguna otra celda desde que salimos. ¿No se supone que esto es una mazmorra de algún tipo? ¿Dónde están todos los demás prisioneros?"

              "¿Tal vez solo tienen una celda por pasillo?", sugiere Rose.

              "Olviden a los prisioneros", digo. "A mí me preocupa más la completa falta de guardias en este lugar. ¿Realmente pensaron que no podíamos derribar estas frágiles y viejas paredes sin magia?"

              "Oye, Rose", llama Daren, mientras estudia la escritura en una pared. "¿Puedes venir aquí un segundo?"

              "¡Claro!", dice Rose, y se dirige a su lado.
          - source: scene_3
            paragraph: 6
            text: |-
              "Puedes leer lenguas antiguas, ¿verdad? ¿Puedes decirme qué dice esto?"

              "Hmm..." Rose dice, mientras mira el texto y frunce el ceño. "Me temo que esto es un poco demasiado avanzado para mí. Puedo decir que está escrito en el idioma usado por los lessathi de antaño, pero no puedo entender ninguna de las palabras".

              "Barry", dice Daren, "¿no tenía ese artefacto tuyo una estadística llamada 'lenguas antiguas'? ¡Ven aquí y mira si puedes traducir esto!"
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: ch8_languages_failed
                condition: ancient_languages < 3
              - set:
                  current_scene: ch8_languages_success
                condition: ancient_languages >= 3
      - condition: ch8_talk = 0
        texts:
          - source: scene_text
            paragraph: 9
            text: |-
              "¡Perfecto! Entonces no perdamos más tiempo aquí."

              "¡Muy bien, entonces!", dice Hadrik. "¡Aquí voy!"

              El enano golpea la pared con todas sus fuerzas, lo que la hace añicos. 

              Al pasar por encima de los escombros y echar un buen vistazo al exterior de nuestra celda, vemos que el pasillo en el que acabamos de entrar está completamente desierto. Si no fuera por unas cuantas antorchas encendidas aquí y allá, no sería muy descabellado suponer que este edificio había sido abandonado hace mucho tiempo. Nuestra celda parece haber sido colocada en el extremo más alejado del pasillo, lo que significa que el único camino para nosotros es hacia la izquierda. 

              "No me gusta esto", dice Kate, mientras caminamos por el pasillo. "Esta es la misma dirección en la que se fueron el oso y el tigre para buscar a su líder la zorra. Lo último que queremos es encontrarnos con ella o sus seguidores mientras escapamos".

              "Bueno, no es que nos dieran muchas opciones", dice Hadrik. "Solo había un camino por el que ir después de salir de nuestra celda, y no ha habido ninguna bifurcación en el camino desde entonces. Lo que más me intriga es que no hemos pasado por ninguna otra celda desde que salimos. ¿No se supone que esto es una mazmorra de algún tipo? ¿Dónde están todos los demás prisioneros?"
          - source: scene_text_2
            paragraph: 12
            text: |-
              "¿Tal vez solo tienen una celda por pasillo?", sugiere Rose.

              "Olviden a los prisioneros", digo. "A mí me preocupa más la completa falta de guardias en este lugar. ¿Realmente pensaron que no podíamos derribar estas frágiles y viejas paredes sin magia?"

              "Oye, Rose", llama Daren, mientras estudia la escritura en una pared. "¿Puedes venir aquí un segundo?"

              "¡Claro!", dice Rose, y se dirige a su lado.

              "Puedes leer lenguas antiguas, ¿verdad? ¿Puedes decirme qué dice esto?"

              "Hmm..." Rose dice, mientras mira el texto y frunce el ceño. "Me temo que esto es un poco demasiado avanzado para mí. Puedo decir que está escrito en el idioma usado por los lessathi de antaño, pero no puedo entender ninguna de las palabras".

              "Barry", dice Daren, "¿no tenía ese artefacto tuyo una estadística llamada 'lenguas antiguas'? ¡Ven aquí y mira si puedes traducir esto!"
