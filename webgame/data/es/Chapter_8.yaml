chapter_effects:
  - condition: current_scene = "ch8_languages_failed" AND warning.text is empty
    effects:
      - warning:
          text: La estadística de lenguas antiguas no es lo suficientemente alta
scenes:
  - name: ch8_intro
    texts:
      - source: scene_text
        paragraph: 2
        text: |-
          "¡Barry!" Oigo la voz de Daren llamándome. "Oye, Barry, ¿puedes oírme?"

          Me despierto con un ligero dolor de cabeza y la visión borrosa. A medida que empiezo a ver más claro, noto que estoy sentado en medio de una habitación con paredes de piedra y sin ventanas, con la única salida visible siendo una puerta de rejas metálicas que parece estar cerrada con llave. Las piedras utilizadas para construir las paredes parecen muy antiguas, están llenas de grietas y hay musgo creciendo por todas ellas. Si tuviera que adivinar, diría que estamos retenidos en la celda de una prisión de algunas ruinas antiguas. De repente recuerdo a la amiga de Kate, y cómo nos dejó a todos inconscientes en medio del bosque. ¿Es ella la que nos trajo aquí?

          Miro a mi alrededor para ver si todos están aquí. Daren está de pie justo a mi lado, mientras que Kate y Rose están sentadas en el suelo en el lado opuesto de la habitación, con las espaldas apoyadas contra la pared. Hadrik está de pie cerca de la puerta de rejas metálicas y golpea ligeramente las paredes a su alrededor, probablemente en un intento de probar su durabilidad.

          "¿Qué ha pasado?", le pregunto a Daren. "¿Nos trajeron aquí los lessathi?"
      - source: scene_text_2
        paragraph: 5
        text: |-
          "No, no fueron los lessathi", dice Daren. "Fueron los animales del bosque. Parecían realmente molestos de que invadiéramos sus sagradas tierras de hadas mágicas. Con gusto te pondré al día con todo lo que pasó mientras estabas inconsciente, pero primero, ¿puedes POR FAVOR apagar ese artefacto infernal tuyo? Ha estado pitando desde que me desperté, y realmente está empezando a ponerme de los nervios".

          Saco mi dispositivo de estadísticas y veo que he recibido cuatro puntos más mientras estaba inconsciente. Debe haber recogido algo de energía del aire después de las peleas de ayer.
    effects:
      - set:
          successful_checks:
            - 'Punto de control alcanzado: Partida guardada.'
        condition: checkpoint_rich = 1
    choices:
      - position: 1
        text: Invertir puntos ahora
        effects:
          - set:
              current_scene: ch8_stats_spent
              storyboard_controls: Jump to frame "Stats"
      - position: 2
        text: Invertir puntos más tarde (presionando el botón de estadísticas en la parte superior de la pantalla)
        effects:
          - set:
              current_scene: ch8_intro2
              checkpoint_rich: 0
  - name: ch8_stats_spent
    texts:
      - source: scene_text
        paragraph: 2
