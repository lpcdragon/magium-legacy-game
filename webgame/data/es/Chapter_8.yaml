          "¡Rose!"

          No da señales de haberme oído y sigue temblando incontroladamente mientras mira al suelo.

          "Eh, Rose, ¿estás conmigo?"

          "Déjala...", me dice Kate. "Se le pasará una vez que hayamos acabado con la hidra y el peligro haya pasado. Fue lo mismo cuando luchamos contra Tyrath. Ya está haciendo todo lo que puede para mantener el control sobre sí misma".

          "Supongo que tienes razón", le digo, y luego me doy la vuelta para ver cómo va la pelea con la hidra.
      - source: scene_text_2
        paragraph: 27
        text: |-
          No parece que Hadrik y Daren estén perdiendo la pelea, pero tampoco es que estén ganando. La hidra está usando sus cabezas de culebra para mantenerlos a raya a ambos, mientras Daren intenta aprovechar cada oportunidad que tiene para apuñalar el cuerpo de la criatura, con la esperanza de que consiga encontrar su corazón por pura suerte. El gran cuerpo de la hidra se regenera casi tan rápido como sus cabezas, por lo que no han avanzado mucho más allá de ir tachando todas las partes del cuerpo donde no se encuentra el corazón. Esto parece que podría llevar un tiempo.

          Después de unos cuantos intentos fallidos de asesinato más, Hadrik y Daren dan unos pasos atrás para recuperar el aliento. De repente, una enorme columna de llamas envuelve a la hidra, que empieza a gritar de agonía con todas sus cabezas. Los gritos se apagan rápidamente, mientras la hidra se vuelve completamente negra y sus restos carbonizados caen al suelo, sin vida. Poco después de que las llamas desaparezcan, Flower cae por el agujero del techo y frena su caída con pequeños chorros de fuego que salen de sus pies.
