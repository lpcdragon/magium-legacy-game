          "¿Qué te pasa, Flower?", dice ella con su voz fría. "¡Vinimos a estas ruinas desoladas a entrenar, no a jugar a ser guía turística! ¡Ni siquiera sabemos quién es esta gente!"

          "¡Relájate, Pétalo!", dice la niña, esta vez en su tono alegre anterior. "Parecen buena gente. ¡Podemos volver al entrenamiento una vez que hayamos terminado de enseñarles el lugar! Esto no debería llevar mucho tiempo".

          "Perdona, ¿con quién estás hablando?", le pregunta Kate.

          Flower se asusta por la pregunta de Kate y se da la vuelta rápidamente para enfrentarse a ella.

          "¿H-hemos dicho eso en voz alta?", pregunta. "¡Quiero decir 'yo'! ¡'Yo', no 'nosotros'! ¡Porque solo hay una yo!"
      - source: scene_text_2
        paragraph: 19
        text: |-
          "Espera, ¿estás sugiriendo que hay más de una de ti ahí dentro?", pregunta Daren.

          "¿Qué? ¡No, eso es una locura! ¡Tú estás loco!"

          Entonces empieza a reírse de forma muy nerviosa y antinatural.

          "¿Acaba de llamarme loco?", nos pregunta Daren.

          De repente, se oye una risa amortiguada que sale del amuleto dorado que Flower lleva al cuello. La niña abre el amuleto y empieza a hablarle.

          "¡Cállate, Arraka!", dice ella.

          Ahora que puedo oír la risa con más claridad, me doy cuenta de que la voz dentro del amuleto está formada por tres voces diferentes, todas de mujeres, riendo simultáneamente. Una vez que el ser dentro del amuleto se da cuenta de que ahora podemos oírla claramente, empieza a hablarnos.

          "¡Eh, ustedes de ahí!", dice la voz. "¡Esta chica es una banshee! ¡Rápido, comprueben su aura mágica! Comprueben su au--"
      - source: scene_3
        paragraph: 9
        text: Flower se asusta y cierra el amuleto, haciendo callar a la voz, pero el daño ya estaba hecho. Al analizar su aura mágica en detalle, me doy cuenta de que de hecho es mucho más poderosa de lo que parece, y que la está suprimiendo deliberadamente para que parezca la de un humano normal. ¿Pero es una banshee real, u otra maga artificial como Kate? Hay algo raro en su aura... No puedo decir exactamente qué. Se siente casi como si tuviera dos auras mágicas distintas a su alrededor, una que emite una vibración de otro mundo y otra que no. Es como si tanto la niña como la banshee que la poseyó coexistieran de algún modo en el mismo cuerpo, como dos entidades separadas. Pero eso es imposible... ¿no?
