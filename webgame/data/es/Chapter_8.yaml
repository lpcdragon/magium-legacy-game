  - name: ch8_ending
    texts:
      - source: scene_text
        paragraph: 63
        text: |-
          Entonces se vuelve hacia Flower.

          "Flower, ya que estabas tan ansiosa por proteger a estos humanos con tu vida, te asigno esta tarea a ti".

          "Eh... no creo realmente que todavía me quieran como su guía después de todo lo que ha pasado en estas ruinas... ¿No podrías enviar a Leo, o...?"

          "No, te envío a ti. Considera esto como tu castigo por enfrentarte a mí antes. Por supuesto, no te obligo a ir. Si no quieres aceptar esta tarea, simplemente los ejecutaré ahora mismo y te ahorraré la molestia".

          "¡No!", grita Flower. "¡No, no hagas eso! Vale, ya lo entiendo... Iré... iré con ellos a la fortaleza de los ogros".

          "Muy bien entonces", dice la zorra mientras se da la vuelta para irse. "Leo, te dejo a cargo de darles las instrucciones de su misión. Yo tengo otros asuntos de los que ocuparme".

          "Así que, eh...", nos dice Flower mientras la zorra sale de la habitación. "Supongo que viajaremos juntos un tiempo más..."

          Entonces empieza a reírse nerviosa y antinaturalmente de nuevo. 

          Oh, cielos...

          Incluso sin usar mi estadística de premonición, hay una cosa de la que estoy definitivamente seguro. Este va a ser un viaje de mil demonios.
