  - name: b2_ch03a_leave
    texts:
      - source: scene_text
        paragraph: 32
        text: |-
          "Me parece una trampa," digo. "Definitivamente no me voy a acercar a ese trol. Vamos, probemos algunos de los otros caminos."

          "Estoy de acuerdo," dice Illuna. "A estas alturas, encontraría altamente improbable que esto fuera otra cosa que una trampa. Salgamos de aquí."

          "¡No, esperen!" grita el trol, mientras intenta levantarse y tose algo de sangre. "¡Puedo ayudarlos! ¡No me dejen así! ¡Vuelvan!"

          Todos ignoramos los gritos desesperados del trol pidiendo ayuda, y comenzamos a caminar por un corredor diferente, mientras Fyron y Arraka retoman sus esfuerzos por mapear el laberinto.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch03a_formation
  - name: b2_ch03a_earlier
    texts:
      - source: scene_text
        paragraph: 33
        text: |-
          ¿Dónde están todos los otros troles con los que estabas hablando antes?"

          El trol entra en pánico al escuchar lo que dije, pero intenta, en vano, parecer tranquilo y sereno.

          "¿Q-qué otros troles?" dice el trol. "¡No sé de qué... estás hablando! Soy el único trol aquí. Los otros me dejaron aquí para... ¡morir!"

          "Estás escondiendo algo detrás de tu espalda, ¿verdad?" le digo. "¿Algún tipo de control remoto? Escuché a los otros troles diciéndote que presionaras el botón después de convencernos de acercarnos."

          "¡N-no!" dice el trol. "¡Debes haber... escuchado mal!"

          "¿Te das cuenta de que el control remoto que te dieron probablemente está diseñado para detonar una explosión, verdad?" le digo. "Si realmente quisieran emboscarnos, no habrían necesitado una señal para saber cuándo venir. Lo único que tenían que hacer era esconderse en algún lugar cercano."

          "¡No, eso no es cierto!" grita el trol. "¡Ellos nunca harían algo así!"
      - source: scene_text_2
        paragraph: 19
        text: |-
          "¿No lo harían?" le pregunto. "¿Qué hay de esa flecha en tu pecho, entonces? Hasta donde sé, deberíamos ser los únicos intrusos en estas cavernas. ¿Quién te disparó esa flecha si no fueron los otros troles?"

          "Dijeron que tratarían mi herida si... completaba mi tarea..." dice el trol.

          "Oye, si confías tanto en tus amigos, ¡entonces quién soy yo para convencerte de lo contrario!" digo. "Adelante y presiona ese botón. Ya te descubrieron de todas formas, así que bien podrías usar esa señal para llamar a tus amigos a que te ayuden, ¿no?"

          El trol me mira, impotente, mientras tiene el pulgar sobre el botón, pero al final no tiene el coraje de presionarlo, y baja la cabeza, derrotado.

          "Veo que finalmente decidiste dejar de engañarte a ti mismo," le digo. "Eso es bueno. Significa que ahora podríamos ser capaces de llegar a un trato. ¿Qué te parece? Tú me das ese control remoto tuyo, y yo te quitaré la flecha. Luego puedes cumplir tu promesa de guiarnos hasta el minotauro. ¿Suena bien?"

          El trol no hace ningún sonido durante los siguientes segundos.

          "Me hablas como si tuviera opción..." dice el trol.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch03a_remote
              ac_b2_ch3_enemy: 1
            achievement:
              id: ac_b2_ch3_enemy
              title: Antes un enemigo, ahora un aliado
  - name: b2_ch03a_remote
    texts:
      - source: scene_text
        paragraph: 34
        text: |-
          "Bueno, si ya te decidiste," digo, "entonces adelante y tira ese control remoto hacia acá. Me aseguraré de atraparlo sin presionar el botón accidentalmente."

          "Tómalo," dice el trol, mientras lanza su control remoto, y yo lo atrapo con ambas manos. "Me pongo a tu merced..."

          "Toma, sostén esto," le digo a Illuna, mientras le entrego el control remoto. "Mientras tanto, iré a quitarle esa flecha."

          "Quédate con el control remoto," dice Illuna. "Quitar la flecha no arreglará nada. Obviamente ha sido envenenado. De lo contrario, ya se habría sanado a sí mismo. A menos que lance un hechizo para remover el veneno, no se va a levantar de ahí."

          Entonces se acerca al trol y extrae cuidadosamente la flecha envenenada de su pecho. Después, toca su herida con las manos, y una luz blanca los envuelve a ambos, mientras el veneno es lentamente purgado del cuerpo del trol.

          "Tu herida está sanada," le dice Illuna al trol. "Aunque todo esto podría haberse evitado si te hubieras molestado en beber un maldito elixir anti-veneno antes de venir aquí. ¿De verdad diez monedas de cobre es una suma tan alta para un mercenario?"

          "No... pensé que lo necesitaría..." dice el trol.
      - source: scene_text_2
        paragraph: 20
        text: |-
          "Hmph, por supuesto que no," dice Illuna. "Levántate. Hemos cumplido nuestro lado del trato. Es hora de que cumplas el tuyo."

          "Lo haré," dice el trol, mientras se levanta y luego toma la delantera. "Síganme."

          "Espera," digo.

          "Oh, ¿y ahora qué pasa?" dice Illuna.

          "Oye, trol," digo, mientras levanto su control remoto en el aire. "¡Mira esto!"

          Presiono el botón del control remoto, y el área donde el trol estaba sentado antes se cubre inmediatamente de fuego, mientras una fuerte explosión derriba las paredes y el techo a su alrededor, eventualmente transformando todo el corredor en un gran montón de escombros.

          "Solo quería asegurarme de que no lamentes tu decisión de unirte a nosotros," le digo al trol, mientras miro la expresión de shock en su rostro.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch03a_illusion
  - name: b2_ch03a_illusion
    texts:
      - source: scene_text
        paragraph: 35
        text: |-
          "Entiendo..." dice el trol.

          "¿De verdad tenías que alertar a cada trol en este laberinto de nuestra posición?" me pregunta Illuna.

          "¡Piensa en positivo!" digo. "Los troles que sabían de la trampa ahora pensarán que estamos muertos, lo que significa que vendrán aquí con la guardia baja. ¡Todo según el plan!"

          "Claro..." dice Illuna.

          Comenzamos a seguir al trol, y tan pronto como llegamos al final del corredor, todos instintivamente giramos a la derecha, eligiendo el único camino disponible.

          "¡Esperen, por ahí no!" dice el trol.

          "¿Cómo que por aquí no?" dice el tigre. "¡Este camino es el único por donde podemos ir! No me digas que quieres que volvamos atrás."

          "No es el único camino," dice el trol, y luego camina directamente a través de la pared del lado izquierdo, desapareciendo de nuestra vista.
      - source: scene_text_2
        paragraph: 21
        text: |-
          "Este es el camino correcto," escuchamos la voz del trol proveniente de más allá de la pared. "Solo caminen a través de esa pared. Es una ilusión."

          "Debo admitir que nunca lo habría adivinado si no me lo hubieras dicho," dice Fyron, mientras toca la pared con su mano. "Incluso imita la sensación al tacto, hasta cierto grado. Al menos lo suficiente como para que no cuestione su autenticidad. Me pregunto cuántas de estas paredes falsas habré marcado en mi camino hasta aquí, sin siquiera darme cuenta."

          Todos caminamos a través de la pared ilusoria y continuamos siguiendo al trol a través de los muchos giros y vueltas del laberinto. Al tomar otro giro a la derecha, el mapa de Arraka parece indicar que nos dirigimos hacia uno de los caminos ya visitados.

          "¡Oigan, esperen!" dice Arraka. "Ese no es el camino correcto. Ya hemos pasado por ese corredor una vez. ¡Miren el mapa!"

          "La ilusión de las paredes falsas no es la única que se usa en este laberinto," dice el trol. "También hay un hechizo que afecta tu sentido de la orientación. Veo que también han estado marcando las paredes, además de dibujar el mapa. Estoy seguro de que me creerán cuando vean que el corredor al que los llevo estará completamente libre de tales marcas."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch03a_blamed
  - name: b2_ch03a_blamed
    texts:
      - source: scene_text
        paragraph: 36
        text: |-
          Para nuestra sorpresa, cuando llegamos al corredor, descubrimos que el trol no mentía. Las paredes efectivamente estaban vacías de marcas, aunque según el mapa de Arraka, este debería haber sido un corredor que ya habíamos visitado antes.

          "¡Maldición!" dice Arraka. "Vaya pérdida de tiempo resultó ser este mapa."

          "Las paredes falsas y la desorientación," dice el trol, "están diseñadas para mantener a los intrusos dentro del laberinto el tiempo suficiente para que nuestro capitán venga y los elimine. No esperan que encuentren el camino al minotauro, así que su celda probablemente solo tendrá unos pocos guardias apostados frente a ella. No deberían tener muchos problemas para liberar al minotauro, pero no estoy seguro de cómo planean salir con vida después."

          "Oh, no necesitas preocuparte por eso," dice Fyron. "Tenemos cubierta nuestra ruta de escape. También tenemos espacio para un pasajero más, si te apetece renunciar."

          "... Puede que acepte tu oferta," dice el trol.

          "¿Puedo preguntar por qué razón los otros troles decidieron volverse contra ti?" le pregunta Fyron.
      - source: scene_text_2
        paragraph: 22
        text: |-
          "Yo era el que custodiaba la entrada a las cavernas," dice el trol. "Me culparon por haberlos dejado entrar, aunque ninguno de ustedes se acercó a la entrada en ningún momento."

          "Tiene sentido," dice Fyron, mientras se frota la barbilla. "Nunca habríamos llegado tan lejos sin ser detectados si alguno de los guardias supiera de la existencia de los túneles secretos. ¿Cuánto más falta hasta el minotauro?"

          "Ya no falta mucho," dice el trol. "Necesitamos dar unas tres vueltas más."

          Cuando nos acercamos más a nuestro destino, finalmente encontramos a unos cuantos troles más, que probablemente eran los elegidos para custodiar la celda del minotauro. Apenas tuvieron tiempo de reaccionar a nuestra presencia, antes de que Illuna les cortara las cabezas con su característico látigo de agua.

          "¿No vas a quemar los cuerpos?" le pregunto al goblin.

          "No voy a desperdiciar más energía de mi bastón para algo tan trivial," dice Fyron. "Si quieres, puedes esconder los cuerpos tú mismo. No es que fuera a hacer mucha diferencia a estas alturas."
    choices:
      - position: 1
        text: Esconder los cuerpos
        effects:
          - set:
              current_scene: b2_ch03a_hide
      - position: 2
        text: Dejar los cuerpos donde están
        effects:
          - set:
              current_scene: b2_ch03a_minotaur
  - name: b2_ch03a_formation
    texts:
      - source: scene_text
        paragraph: 37
        text: |-
          Caminamos por el laberinto durante unos quince minutos sin encontrar resistencia. En el camino, llegamos a algunos callejones sin salida, pero Arraka los marcó todos en el mapa, para que no hubiera riesgo de toparnos con ellos otra vez. Sin embargo, mientras continuábamos nuestro viaje por el laberinto, nos encontramos con una situación que no habíamos previsto.

          Aunque habíamos estado siguiendo cuidadosamente el mapa de Arraka todo el tiempo, de alguna manera terminamos en medio de un corredor que ya había sido marcado con el símbolo verde de Fyron. Estupefactos, todos miramos el mapa de Arraka, intentando entender qué nos perdimos, mientras Fyron inspecciona cuidadosamente su símbolo en la pared.

          "¿Cómo es esto posible?" dice Illuna. "He estado monitoreando de cerca el mapa de Arraka mientras lo dibujaba, y estoy segura de que es preciso. Según el mapa, esta debería ser un área inexplorada. ¿Lograron los troles falsificar el símbolo verde?"

          "No es una copia," dice Fyron. "Mi marca no puede ser reproducida tan fácilmente. Y aparte de eso, también reconozco este corredor. Puedo decirte con certeza que hemos estado aquí antes. Aunque no estoy exactamente seguro de cómo nosotros--"

          Mientras habla, cierta formación rocosa en una de las paredes le llama la atención y lo hace detenerse a mitad de frase.

          "Hmm..." dice, mientras se acerca a la pared y la golpea ligeramente con su bastón.

          "El goblin no se equivoca," escuchamos una voz proveniente de una parte más oscura del corredor.
      - source: scene_text_2
        paragraph: 23
        text: |-
          A medida que el que acaba de hablar se acerca a nosotros, vemos que es un trol particularmente corpulento, vistiendo armadura anti-magia de pies a cabeza, y sosteniendo dos cimitarras en las manos. Tiene una sonrisa triunfal.

          "Han estado dando vueltas en círculos desde que entraron a este laberinto," dice el trol. "Sabía que volverían a este corredor pronto."

          "Psst," le susurro a Illuna, mientras el trol da su discurso de victoria. "¿Por qué no lo matas?"

          "Lleva armadura anti-magia y tiene un casco," me susurra Illuna de vuelta. "Eso significa que no puedo hacer mi agua afilada contra él, así que no podré cortarle la cabeza con mis látigos de agua."

          "Sí, pero ¿no es la armadura anti-magia básicamente solo armadura regular con algunas protecciones?" susurro. "¿No puedes hacer que Flower lo queme vivo?"

          "No existe armadura anti-magia sin protección contra el fuego," susurra Illuna. "Lanzarle magia de fuego sería inútil."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch03a_cage
  - name: b2_ch03a_cage
    texts:
      - source: scene_text
        paragraph: 38
        text: |-
          Mientras nosotros dos susurrábamos, escondidos detrás de Leila y el tigre, el trol parecía haber terminado de alardear, y ahora se preparaba para atacar.

          "No hay forma de que escapen," dice el trol. "Resígnense a su destino. Hoy es el último día de--"

          Leila parece haber tenido suficiente, así que se lanza hacia el trol, impactándolo con su velocidad, y cortándole la cabeza de un tajo con su daga en un instante. Sin embargo, en lugar de caer al suelo, el cuerpo del trol la ataca con las dos cimitarras, que Leila apenas logra esquivar, haciendo un rápido salto hacia atrás.

          "Esa no es la forma de comenzar una batalla, humana," dice la cabeza del trol, desde el suelo. "Atacar a un enemigo de la nada sin darle una advertencia adecuada es una marca de cobardía. ¿No te enseñaron la etiqueta apropiada de los gladiadores cuando te trajeron a la arena?"

          Su cuerpo entonces recoge su cabeza del suelo y la coloca de vuelta sobre su cuello. En cuestión de segundos, la cabeza se vuelve a unir a su cuerpo, haciendo que parezca como si nunca hubiera habido una herida.
      - source: scene_text_2
        paragraph: 24
        text: |-
          "¿Un trol que no muere ni siquiera cuando le cortas la cabeza?" dice Fyron. "Esto no es para lo que me apunté. Illuna, usa el hechizo de la jaula."

          "Solo puedo usar ese hechizo una vez al día," dice Illuna. "Si lo uso ahora--"

          "No importa," dice Fyron. "No necesitarás usarlo después. Tengo un plan. ¡Enjáulalo, ahora!"

          Illuna le frunce el ceño, pero hace lo que le pidió. Estira el brazo hacia el trol, y de la nada, una jaula dorada aparece a su alrededor, atrapándolo dentro. Es el mismo hechizo que usó para atraparnos cuando estábamos en el fuerte de ogros. El hechizo del zorro dorado.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch03a_smoke
  - name: b2_ch03a_smoke
    texts:
      - source: scene_text
        paragraph: 39
        text: |-
          "¿De verdad creen que una simple jaula puede detenerme?" dice el trol, mientras empieza a golpear furiosamente los barrotes dorados de la jaula.

          "Sí, lo creemos," dice Fyron, y golpea su bastón contra el suelo, generando una nube de humo gris que llena todo el corredor.

          Entonces escucho el sonido de rocas moviéndose a mi derecha, y después puedo ver las siluetas de mis compañeros a través del humo, pasando junto a mí.

          "¡Por aquí!" escucho la voz de Illuna, mientras me agarra del brazo y me jala hacia ella.

          La sigo a través del humo, y ambos entramos en un pasaje estrecho que lleva al otro lado de una de las paredes. Una vez que todos pasamos, Fyron golpea su bastón contra la pared de la cueva desde adentro, y el agujero en la pared se cierra de nuevo. Luego pasa junto a nosotros, para retomar la delantera, y golpea su bastón en el otro extremo del pasaje, abriendo otra puerta secreta que nos lleva a un corredor inexplorado, sin ninguna marca en las paredes.
      - source: scene_text_2
        paragraph: 25
        text: |-
          "Esa jaula no lo va a retener por mucho tiempo," dice Illuna, mientras todos salimos del pasaje y la puerta secreta se cierra detrás de nosotros. "¿Te importaría decirme cuál es ese plan tuyo?"

          "No necesita retenerlo por mucho tiempo," dice Fyron. "Dudo mucho que sepa de la existencia de ese pasaje secreto, así que no va a encontrarnos pronto. Más importante aún, reconocí ese corredor de antes, y reconozco este también. Parece que mantuvieron algunos de los corredores antiguos y los incluyeron en el laberinto cuando construyeron este lugar. Si ese es el caso, creo que tengo una muy buena idea de dónde estamos, y la celda del minotauro no debería estar lejos de aquí. Síganme."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch03a_originate
              ac_b2_ch3_cage: 1
            achievement:
              id: ac_b2_ch3_cage
              title: La jaula dorada
  - name: b2_ch03a_originate
    texts:
      - source: scene_text
        paragraph: 40
        text: |-
          "He querido preguntar," le digo a Illuna. "¿No era la jaula dorada de antes uno de los hechizos del zorro dorado? ¿Cómo lograste aprenderlo?"

          "No es el hechizo de la zorra," dice Illuna. "Es un hechizo complejo que solo puede ser usado por seres que se originan del plano mágico. Lo aprendí de Arraka."

          "Ya veo..." digo.

          "¡Ja, me preguntaba por qué no recordaba que hubiera una pared en este lado!" dice Fyron.

          Cuando nos giramos hacia él, lo vemos caminar directamente a través de una de las paredes, desapareciendo de nuestra vista.

          "¡Vengan aquí!" grita Fyron, desde el otro lado. "La pared es una ilusión. Así es como deben habernos estado engañando durante todo este tiempo. Si tienen ilusiones como esta montadas, no me extrañaría que también tuvieran un hechizo en este lugar que altere nuestro sentido de la orientación. Eso explicaría por qué el mapa de Arraka no ayudó. No importa, sin embargo. Si mi intuición es correcta, deberíamos estar casi ahí."
      - source: scene_text_2
        paragraph: 26
        text: |-
          Todos caminamos a través de la pared ilusoria y continuamos nuestro viaje hacia el minotauro. Unos minutos después, cuando estábamos casi en nuestro destino, nos encontramos con unos cuantos troles más, que probablemente eran los elegidos para custodiar la celda del minotauro. Apenas tuvieron tiempo de reaccionar a nuestra presencia, antes de que Illuna les cortara las cabezas con su característico látigo de agua.

          "¿No vas a quemar los cuerpos?" le pregunto al goblin.

          "No voy a desperdiciar más energía de mi bastón para algo tan trivial," dice Fyron. "Si quieres, puedes esconder los cuerpos tú mismo. No es que fuera a hacer mucha diferencia a estas alturas."
    choices:
      - position: 1
        text: Esconder los cuerpos
        effects:
          - set:
              current_scene: b2_ch03a_hide
      - position: 2
        text: Dejar los cuerpos donde están
        effects:
          - set:
              current_scene: b2_ch03a_minotaur
  - name: b2_ch03a_hide
    texts:
      - source: scene_text
        paragraph: 41
        text: |-
          "Está bien, los esconderé yo solo, entonces," digo.

          "Como quieras," dice Fyron. "La celda del minotauro debería estar un poco más adelante por el corredor. Puedes encontrarnos ahí cuando termines."

          Mientras los demás se dirigen hacia el minotauro, me preparo para levantar uno de los cuerpos de los troles, cuando noto a Leila caminando hacia el otro extremo del cadáver y luego agarrándolo por las piernas.

          "Oh," le digo, cuando entiendo lo que está haciendo. "¡Gracias!"

          Me sonríe, y luego ambos agarramos el cuerpo del trol y lo cargamos hasta un pasaje secreto cercano. No hay mucho que podamos hacer respecto a toda la sangre en el suelo, pero dada la oscuridad del corredor, al menos será más difícil de notar desde la distancia que un montón de cadáveres tirados a plena vista. Una vez que terminamos de mover todos los cuerpos y las cabezas al pasaje, cerramos la puerta secreta y nos apuramos para alcanzar a los demás. Justo cuando nos acercamos a ellos, Fyron usa su bastón para lanzar un hechizo en un panel mágico de una pared. El panel chisporrotea y desbloquea la reja de una celda cercana.

          "Perfecto," dice el goblin, al vernos a mí y a Leila acercarnos. "¡Llegaron justo a tiempo!"

          Con la reja ahora abierta, el prisionero dentro de la celda sale. Tiene la cabeza de un toro y el cuerpo de un hombre, pero es más alto que Daren y tiene el doble de músculos. El minotauro nos echa un vistazo rápido al salir, y luego se gira hacia el goblin.

          "¿Cómo planeas sacarme de estas cavernas?" dice el minotauro.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch03a_passage
  - name: b2_ch03a_minotaur
    texts:
      - source: scene_text
        paragraph: 42
        text: |-
          "Sí," digo. "Supongo que no tendría mucho sentido esconder cuerpos si ya estamos casi al final del laberinto. Sigamos adelante."

          Nos dirigimos hacia el final del corredor, donde encontramos una sola celda, con un panel mágico en la pared junto a ella. Dentro de la celda solo hay un prisionero, con la cabeza de un toro y el cuerpo de un hombre, tumbado en el suelo, con la espalda contra la pared. El minotauro es más alto que Daren y tiene el doble de músculos. Cuando nos escucha llegar, no se mueve ni un centímetro, y ni siquiera gira la cabeza para mirarnos.

          "¿Quiénes son ustedes?" pregunta el minotauro.

          "Supongo que tenía razón cuando imaginé que te pondrían en la vieja celda de parálisis," dice Fyron. "El único propósito del laberinto era mantener fuera a los intrusos, no mantenerte a ti dentro."

          "¿Quiénes son ustedes?" pregunta el minotauro otra vez.

          "Soy Fyron, el general de todos los goblins libres de Varathia," dice Fyron. "He venido aquí a reclutarte para que te unas a mi ejército. ¿Qué dices?"

          "¿Un ejército goblin?" dice el minotauro.
      - source: scene_text_2
        paragraph: 27
        text: |-
          Se ríe amargamente.

          "Nunca pensé que viviría para ver el día," dice el minotauro, "en que realmente consideraría seriamente una oferta como esta."

          "No es tan malo como podrías pensar," dice Fyron. "Como mínimo, en nuestro campamento goblin deberías tener acceso a más comida que aquí, y no tendrías que pasar tus días encerrado en una celda de parálisis. ¿O preferirías pasar el resto de tu vida entreteniendo a estos humanos?"

          "Este ejército goblin tuyo..." dice el minotauro. "¿Está hecho solo de goblins? ¿O también has reclutado a otros guerreros como yo para unirse antes?"
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch03a_minotaur2
  - name: b2_ch03a_minotaur2
    texts:
      - source: scene_text
        paragraph: 43
        text: |-
          "Está compuesto mayormente por goblins," dice Fyron, "pero nuestro campamento goblin acepta todas las razas, siempre que sigan nuestras reglas y paguen el tributo anual."

          "¿Y cuánto es el tributo anual?" pregunta el minotauro.

          "Depende," dice Fyron. "En promedio, es aproximadamente una moneda de cobre por cada goblin."

          "¿Por año?" pregunta el minotauro, algo sorprendido.

          "Por año," dice Fyron.

          "¿Y por qué estás reclutando?" pregunta el minotauro. "¿Se están preparando para la guerra?"

          "Eso está por verse," dice Fyron. "Por el momento, digamos que me gusta ser precavido."

          El minotauro se detiene un momento para considerar las palabras del goblin.

          "Podemos negociar los términos de tu empleo después, si lo deseas," dice Fyron. "Lo último que querría es forzarte a esto aprovechándome de tu situación actual. Lo único que quiero es tu palabra de que tomarás mi oferta en serio, y de que te unirás a mí en mi viaje de vuelta al campamento goblin. Sé cuánto valoran el honor los minotauros, así que mientras me des tu palabra, eso es suficiente para mí. Podemos discutir los detalles después."
      - source: scene_text_2
        paragraph: 28
        text: |-
          "Claramente eres un diplomático hábil, goblin," dice el minotauro. "Tienes un don para encontrar las palabras exactas que alguien quiere escuchar, y las dices justo en el momento adecuado. Normalmente, mi odio natural hacia los diplomáticos haría que no lo pensara dos veces antes de rechazar tu oferta, pero en este caso, como bien sabes, no tengo muchas opciones."

          Hace otra pausa.

          "Muy bien, general Fyron," dice el minotauro. "Te doy mi palabra. Mientras me liberes de aquí, te acompañaré a tu campamento goblin, y tomaré tu oferta de empleo tan seriamente como me sea posible."

          "Eso es todo lo que quería escuchar," dice Fyron, con una sonrisa.

          Luego usa su bastón para lanzar un hechizo en el panel fuera de la celda, que desactiva el hechizo de parálisis y abre la reja.

          "¿Cómo planeas sacarme de estas cavernas?" dice el minotauro, mientras se levanta del suelo y sale de su celda.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch03a_passage
  - name: b2_ch03a_passage
    texts:
      - source: scene_text
        paragraph: 44
        text: |-
          "Usando magia," dice Fyron. "Resulta que tanto Illuna como yo somos bastante hábiles con los hechizos, y ambos tenemos la capacidad de teletransportarnos, dentro de ciertas limitaciones."

          Luego se vuelve hacia Illuna.

          "Illuna," dice Fyron. "¿Puedes teletransportar al minotauro a la superficie? Hasta donde sé, tu hechizo de teletransportación diario no tiene un límite de peso. El mío, por otro lado, cuesta energía adicional por cada libra extra. Preferiría que tú te llevaras al minotauro, ya que es con diferencia el más pesado del grupo. Estaré contigo en breve, después de que guíe a tus amigos al pasaje secreto que mencioné antes."

          Illuna asiente, y el goblin ahora se dirige hacia el minotauro.

          "Una vez que estés en la superficie, Illuna no podrá ayudarte," dice Fyron. "Todos en esta ciudad conocen tu rostro por la arena, así que ella no puede ser vista peleando a tu lado, a menos que quiera tener antecedentes penales. No nos esperes. Tan pronto como estés fuera de las cavernas, corre hacia las puertas de la ciudad, embístelas y no te detengas hasta llegar a los bosques de Mertram. Nos encontraremos ahí."

          "Estaré esperando," dice el minotauro.
      - source: scene_text_2
        paragraph: 29
        text: |-
          "Deberíamos ponernos en marcha," dice Illuna, y agarra la mano del minotauro para prepararse para la teletransportación.

          Nos da a todos una última mirada, deteniendo su mirada unos segundos cuando sus ojos se encuentran con los míos.

          "No te mueras," me dice, simplemente.

          "No lo haré," digo.

          Entonces lanza su hechizo de teletransportación, y tanto ella como el minotauro desaparecen de nuestra vista.

          "¡Por aquí!" dice Fyron, mientras regresa por donde vinimos.

          Luego se detiene junto a una pared, y la golpea suavemente tres veces con su bastón, haciendo que una puerta secreta se abra y revele un pasaje oculto.

          "Este túnel los llevará de vuelta a los niveles superiores," dice Fyron. "Confío en que podrán encontrar el camino de regreso a sus celdas desde ahí."

          "Nos las arreglaremos," digo.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch03a_unique
  - name: b2_ch03a_unique
    routes:
      - condition: ch5_goblins <> 1 AND b2_ch3_troll = 0
        texts:
          - source: scene_text
            paragraph: 45
            text: |-
              "Creo que también debería mencionar que el túnel solo puede abrirse desde este lado," dice Fyron. "Una vez que entren, no podrán volver atrás."

              El goblin entonces se vuelve hacia Leila.

              "Hasta donde sé," dice, "Barry debe regresar a su celda, a menos que quiera ser descalificado del torneo. Tú, sin embargo, no estás sujeta a tales reglas. Si quieres, podría darte un aventón. Queda suficiente energía en mi bastón para teletransportar a una persona más."

              "Gracias," escribe Leila, "pero estoy bien. Tomaré el túnel."

              "¿Estás segura?" pregunta el goblin. "Prometo que no te cobraré... mucho."

              "Estoy segura," escribe Leila.

              "Muy bien, entonces," dice Fyron, mientras prepara su bastón y le señala al tigre que se acerque a él.

              "Les deseo suerte a los dos," dice el goblin. "La próxima vez que nos encontremos, espero que sea bajo mejores circunstancias."

              Entonces lanza su hechizo, y desaparece en el aire, junto con el tigre. Leila y yo no perdemos el tiempo y entramos al túnel secreto, mientras la puerta se cierra detrás de nosotros.

              "Tienes amigos muy... únicos," escribe Leila, sonriendo, mientras caminamos por el corredor oscuro.
        choices:
