          "Ni que lo digas..."

          "Nunca pensé que alguna vez viajaría en compañía de tantos monstruos," escribe Leila. "Al menos, no a menos que hubiera sido capturada por ellos."

          "Para ser justos," digo. "Tampoco yo esperaba al goblin. Pero supongo que ver a un goblin es mucho menos impactante que ver a dos banshees en el mismo día."

          Hago una pausa por unos segundos, y luego cambio de tema.

          "Entonces, eh... ¿por qué no aceptaste la oferta del goblin antes?" le pregunto. "¿Es porque no confiabas en él?"

          "Oh, no, no es eso," escribe Leila. "Es solo que nunca tuve la intención de escapar de aquí."

          "¿Por qué no?" digo. "¿No podrías simplemente correr más rápido que todos los guardias de la ciudad, ahora que tus heridas están sanadas?"

          Leila niega con la cabeza.

          "Los lessathi que incriminaron a mi padre me están vigilando cuidadosamente," escribe. "Mientras sobreviva la arena, los cargos contra mí serán retirados y no podrán tocarme, pero si escapo ilegalmente, usarán todos los medios a su disposición para cazarme. Nunca llegaría a las puertas de la ciudad con vida."
      - source: scene_text_2
        paragraph: 32
        text: |-
          "¿Estás diciendo que preferirías luchar contra las criaturas de la arena," digo, "que tener una confrontación directa con los lessathi de esta ciudad?"

          "Sí," escribe Leila. "Los lessathi tienen artefactos poderosos que les permiten usar magia, similares al bastón que usaba el general goblin. Al menos en la arena nadie tiene permitido usar magia, así que mientras tenga mi dispositivo de estadísticas, puedo tener una oportunidad."

          "Sí, supongo que veo tu punto," digo. "Hablando de dispositivos de estadísticas, creo que deberíamos sacarlos para iluminar un poco este lugar. El goblin dijo que podría haber trampas por aquí, así que deberíamos ir con cuidado."

          Caminamos por el túnel oscuro durante unos minutos, revisando cuidadosamente cada paso del camino en busca de trampas o emboscadas enemigas. Al entrar en un área más grande, iluminada por los cristales azules brillantes que hemos visto antes, nos damos cuenta de que todos nuestros esfuerzos por detectar emboscadas ocultas fueron en vano, porque el enemigo nos estaba esperando aquí, en esta misma sala, sin hacer ningún esfuerzo por ocultarse.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch03a_velgos
  - name: b2_ch03a_velgos
    routes:
      - condition: b2_ch3_troll = 0
        texts:
          - source: scene_text
            paragraph: 52
            text: |-
              Un solo trol se interpone entre nosotros y la libertad. Desafortunadamente para nosotros, es el trol que menos habríamos querido encontrar. Es el que logramos evitar antes, gracias al hechizo de la jaula dorada de Illuna. Sin embargo, Illuna no está aquí ahora, y nuestras posibilidades de supervivencia no pintan bien.

              El corpulento trol nos sonríe triunfalmente, como antes, y anuncia su presencia hablando lo más fuerte posible.

              "¿De verdad pensaron que podrían escapar tan fácilmente, después de todo lo que han hecho?" dice el trol. "Desafortunadamente para ustedes, la existencia de este pasaje nunca fue un secreto para nosotros. ¡Tan pronto como activaron la alarma al liberar al minotauro de su celda, supe de inmediato que intentarían usar este túnel para escapar! Ahora díganme, ¿dónde está el minotauro?"
          - source: scene_text_2
            paragraph: 33
            text: |-
              "Se fue," le digo. "Se teletransportó con nuestros amigos. Dudo que lo vuelvas a ver."

              "¡Mientes!" grita el trol, furioso. "¡Nunca se habrían tomado la molestia de navegar por el laberinto si pudieran simplemente teletransportarse de entrada y salida a placer! Y si tus amigos realmente se teletransportaron fuera de aquí, entonces seguramente te habrían llevado con ellos. Si no me vas a decir dónde está el minotauro, entonces simplemente tendré que pasar sobre sus cadáveres y buscarlo yo mismo. Ya deberías saber que no tienes oportunidad contra mí. Si quieres que esto termine rápido, entonces no te muevas. Me aseguraré de concederte una muerte misericordiosa."
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch03a_postpone
      - condition: b2_ch3_troll = 1
        texts:
          - source: scene_text
            paragraph: 53
            text: |-
              Un solo trol se interpone entre nosotros y la libertad. Sin embargo, es un trol particularmente corpulento, vistiendo armadura anti-magia de pies a cabeza, mientras sostiene dos cimitarras en las manos. Nos sonríe triunfalmente y decide anunciar su presencia hablando lo más fuerte posible.

              "¿De verdad pensaron que podrían escapar tan fácilmente, después de todo lo que han hecho?" dice el trol. "Desafortunadamente para ustedes, la existencia de este pasaje nunca fue un secreto para nosotros. ¡Tan pronto como activaron la alarma al liberar al minotauro de su celda, supe de inmediato que intentarían usar este túnel para escapar! Ahora díganme, ¿dónde está el minotauro?"

              "Se fue," le digo. "Se teletransportó con nuestros amigos. Dudo que lo vuelvas a ver."

              "¡¡¡Mientes!!!" grita el trol, furioso. "¡Nunca se habrían tomado la molestia de navegar por el laberinto si pudieran simplemente teletransportarse de entrada y salida a placer! Y si tus amigos realmente se teletransportaron fuera de aquí, entonces seguramente te habrían llevado con ellos. Si no me vas a decir dónde está el minotauro, entonces simplemente tendré que pasar sobre sus cadáveres y buscarlo yo mis--"

              No llega a terminar su frase, ya que Leila se lanza hacia el trol, impactándolo con su velocidad, y cortándole la cabeza de un tajo con su daga en un instante. Sin embargo, en lugar de caer al suelo, el cuerpo del trol la ataca con las dos cimitarras, que Leila apenas logra esquivar, haciendo un rápido salto hacia atrás.
          - source: scene_text_2
            paragraph: 34
            text: |-
              "Esa no es la forma de comenzar una batalla, humana," dice la cabeza del trol, desde el suelo. "Atacar a un enemigo de la nada sin darle una advertencia adecuada es una marca de cobardía. ¿No te enseñaron la etiqueta apropiada de los gladiadores cuando te trajeron a la arena?"

              Su cuerpo entonces recoge su cabeza del suelo y la coloca de vuelta sobre su cuello. En cuestión de segundos, la cabeza se vuelve a unir a su cuerpo, haciendo que parezca como si nunca hubiera habido una herida.

              "Espero que se hayan convencido de la futilidad de sus acciones," dice el trol. "Si quieren que esto termine rápido, solo quédense ahí y no se muevan. Me aseguraré de concederles una muerte misericordiosa."
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch03a_postpone
  - name: b2_ch03a_postpone
    texts:
      - source: scene_text
        paragraph: 54
        text: |-
          "Eso no será necesario, Velgos," escuchamos una voz proveniente de detrás del trol.

          El hombre que habló se muestra ante nosotros, y vemos que es bastante regordete, con cabello negro corto y una perilla, vistiendo ropa que parece estar hecha enteramente de seda. Su apariencia y forma de vestir normalmente me harían catalogarlo como un noble, si no fuera por la mirada en sus ojos, que es similar a la del general goblin. Esa mirada lo hace parecer más como un veterano de guerra que ha visto muchas batallas en su vida, que una persona rica mimada que ha vivido su vida en el lujo.

          "Pero, dueño," dice Velgos, el trol, "¡estos son los intrusos que vinieron a liberar al minotauro! ¡Necesitamos eliminarlos rápido, antes de que lo dejen escapar a la superficie!"

          "El minotauro ya se fue," dice el hombre. "Lo vi teletransportarse fuera de aquí con mis propios ojos. No hay nada más que hacer aquí. Vuelve a tu puesto."

          "¡Me niego!" dice Velgos, mostrando los dientes a su amo. "Son responsables de las muertes de muchos de mis camaradas. No voy a dejarlos ir."
      - source: scene_text_2
        paragraph: 35
        text: |-
          "No te estoy diciendo que los dejes ir," dice el dueño. "Solo te estoy pidiendo que pospongas tu pelea con ellos hasta la segunda ronda del evento de la arena. El minotauro se fue, y tú eres el único guerrero que tenemos que está a su nivel en combate. Te pagaré generosamente si te unes a las peleas en la arena, y también tendrás tu oportunidad de vengar a tus camaradas caídos, ya que estos dos participarán en las peleas. ¿No sería eso una mejor alternativa para ti que perder tu empleo innecesariamente porque te faltó paciencia?"

          El trol gruñe, pero no parece querer continuar la discusión.

          "Más les vale no morir a manos de las criaturas en la primera ronda," dice Velgos, mientras nos señala. "¡Quiero matarlos yo mismo!"

          "No me preocuparía mucho por eso," dice el dueño. "Diría que tienen muy buenas posibilidades de llegar a la segunda ronda con vida, basándome en lo que he visto hasta ahora. Ahora, ve. Necesito llevar a nuestros invitados de vuelta a sus celdas."

          "Bien," dice Velgos. "Discutiremos mi pago después."

          Con estas palabras finales, el trol se aleja de nosotros y desaparece en la oscuridad de las cavernas.

          "¿Vas a llevarnos de vuelta a nuestras celdas?" le pregunto al dueño. "No es que me queje, pero ¿no eres el dueño de la arena? ¿Por qué nos dejarías ir tan fácilmente?"
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch03a_stars
  - name: b2_ch03a_stars
    texts:
      - source: scene_text
        paragraph: 55
        text: |-
          "No los estoy dejando ir," dice el dueño, mientras golpea una de las paredes, y una puerta secreta se abre frente a él. "Simplemente creo que sería un gran desperdicio si las estrellas del espectáculo fueran asesinadas antes de que el espectáculo siquiera empezara. Además, está completamente dentro de sus derechos venir a sabotear la arena antes del evento principal. De hecho, escuché que esto solía ser algo así como una tradición antes del invierno inmóvil, cuando los lessathi todavía estaban a cargo de esta arena. Incluso era fomentado por los organizadores. La trampilla secreta que los llevó de sus celdas hasta aquí es una prueba de ese hecho. Ahora, no se queden ahí parados, síganme. Este túnel nos llevará adonde necesitamos ir."

          Leila y yo intercambiamos una mirada, y luego decidimos seguir al dueño de la arena hacia el túnel secreto recién revelado.

          "Saben," dice el dueño, mientras la puerta se cierra detrás de nosotros, "siento que debería agradecerles por el entretenimiento que me han proporcionado hoy."

          "¿En serio?" digo.

          "Sí," dice el dueño. "No es todos los días que consigues ver a Illuna de la masacre de los bosques sagrados, Arraka del invierno inmóvil y el general Fyron de los goblins libres causar estragos a través de un calabozo lleno de monstruos. Me doy cuenta de que ustedes no fueron quienes los trajeron aquí, pero nunca habría sabido de ellos si no los hubiera seguido a ustedes dos desde que cayeron en ese lago."

          "¿Nos has estado siguiendo desde el principio?" le pregunto, impactado.
      - source: scene_text_2
        paragraph: 36
        text: |-
          "Sí," dice el dueño. "Hay un antiguo sistema de alarma que fue instalado desde la era de los lessathi, diseñado para advertirme si alguien activa la trampa de las celdas de la arena. Los encontré mientras se estaban secando junto al fuego, y los he estado siguiendo de lejos desde entonces."

          "¿Pero cómo lograste permanecer sin ser detectado?" le pregunto. "Hasta teníamos a Arraka con nosotros, que podía detectar enemigos invisibles."

          "Tu amigo goblin no es el único que sabe de túneles secretos," dice el dueño. "A lo largo de los años, he construido muchos corredores ocultos por estas cavernas, y los he cubierto con polvo de seredium, para asegurarme de no poder ser detectado mientras camino por ellos. También hice que un ilusionista lanzara un hechizo en todas las paredes, que hace que puedas ver a través de ellas desde dentro de los túneles ocultos, pero no desde afuera. Esto me permitió observar cómo se desarrollaban los eventos, sin delatarme."

          "Entonces," digo, "¿has estado solo observando todo este tiempo, en lugar de detenernos? ¿Por qué?"
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch03a_ending
  - name: b2_ch03a_ending
    routes:
      - condition: b2_ch2_deal <> 4
        texts:
          - source: scene_text
            paragraph: 56
            text: |-
              "Porque el espectáculo ya ha comenzado," dice el dueño. "Ya te lo dije, es una vieja tradición de estas arenas que haya intrusos intentando sabotear el evento, y no iba a impedir que esto sucediera, cuando era la primera vez que veía a algún participante llegar tan lejos desde que heredé esta arena de mi difunto padre. Solo detuve al trol de matarlos porque espero grandes cosas de ustedes durante el evento principal."

              "¿Por qué de nosotros?" digo. "¿Por qué no de cualquiera de los otros gladiadores?"

              "Porque ustedes dos son los únicos que usan dispositivos de estadísticas," dice el dueño.

              "Oh..." digo, sin saber exactamente cómo responder a esto.

              "Como dije, son las estrellas del espectáculo," dice el dueño. "Incluso uno de los lessathi de alto rango me dijo que perdería mi empleo si no confiscaba el dispositivo de la chica lessathi. Pero ¿por qué lo haría? Ya decidí que este será el momento cumbre de mi carrera. No me importa lo que pase después. Lo único que quiero es que este espectáculo sea perfecto. Y ustedes dos van a ayudarme a lograr mi sueño."

              Salimos del túnel, y nos encontramos en un escenario familiar, con una cabaña de madera frente a nosotros, y un lago más allá.
          - source: scene_text_2
            paragraph: 37
            text: |-
              "No sé si lo han notado o no," dice el dueño, "pero debajo del lago en el que cayeron los dos, hay un antiguo ascensor, construido por los lessathi hace cientos de años. El ascensor solo puede activarse con una llave con forma de araña que ha sido transmitida en mi familia durante generaciones, pero nunca fue usada hasta ahora."

              Saca una estatuilla con forma de araña hecha de piedra de su bolsillo, y me la entrega.

              "El mecanismo que requiere esta llave está ubicado en el fondo del lago," dice el dueño. "Simplemente inserta la estatuilla en la ranura con forma de araña, y gírala dos veces, en sentido horario. Eso debería poner el ascensor en marcha. Espera que se mueva un poco lento, sin embargo. No ha sido usado durante siglos."

              Asiento, y salto al agua con la estatuilla en mi mano derecha. Le digo a Leila que me espere en la orilla, para poder volver por ella una vez que haya activado el ascensor. Después de sumergirme en el agua, inmediatamente encuentro la ranura con forma de araña de la que hablaba el dueño, y hago lo que dijo, insertando la estatuilla en el agujero y girándola dos veces.
          - source: scene_3
            paragraph: 5
            text: |-
              Al ver que el ascensor comienza a moverse, rápidamente nado de vuelta a la superficie, y luego de vuelta hasta Leila. Se lanza al agua y se agarra de mí, mientras la llevo justo encima de la plataforma que sube lentamente. Luego esperamos en silencio unos minutos, mientras la plataforma sale del agua y nos eleva en el aire, hacia el techo. Cuando nos acercamos a la trampilla por la que caímos inicialmente, el dueño nos grita sus últimas palabras desde la orilla del lago.

              "¡Recuerden que tengo expectativas muy altas de ustedes!" dice el dueño. "Asegúrense de no decepcionarme."
