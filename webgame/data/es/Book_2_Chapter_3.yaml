                  b2_ch3_troll: 1
  - name: b2_ch03a_dead
    texts:
      - source: scene_text
        paragraph: 31
        text: |-
          "Más te vale no estar mintiéndonos," digo, mientras empiezo a acercarme a él.

          Illuna me agarra del brazo, intentando detenerme.

          "¿Qué crees que estás haciendo?" dice.

          "Tranquila," le digo. "Sé lo que hago. ¿No crees que puedo manejar un solo trol herido?"

          Illuna me frunce el ceño, pero me deja ir.

          "No digas que no te advertí," dice.

          Me acerco al trol y me arrodillo junto a él, para poder sacarle la flecha del pecho correctamente.

          "Gracias... señor," dice el trol. "Es usted... demasiado amable..."

          Mientras me concentro en sacar cuidadosamente la flecha, noto, con el rabillo del ojo, que el trol está sosteniendo algo en su mano, detrás de su espalda.

          "¡Barry, retrocede!" grita Illuna, pero es demasiado tarde.

          Antes de que pueda reaccionar, toda el área a mi alrededor explota, y apenas alcanzo a entender lo que pasó antes de perder la consciencia definitivamente.
    choices:
      - position: 1
