      - condition: b2_ch3_spin = 3
        texts:
          - source: scene_text
            paragraph: 11
            text: |-
              "¿Oíste que se marea si la haces girar por la cadena? ¡Déjame mostrarte!"

              Entonces tomo el amuleto de Arraka de Illuna, y empiezo a hacerlo girar, mientras Illuna suelta un suspiro.

              "Eh, no..." escribe Leila, mientras me mira confundida. "Eso no es realmente por lo que es más conocida..."

              "¡¿Qué diablos estás haciendo?!" grita Arraka, mientras la hago girar. "¡¿Mostrarle a quién?! ¿Con quién estabas hablando? ¡¿Todo el estrés de esta última semana finalmente te hizo perder la cabeza?!"

              "¿Cómo que con quién estaba hablando?" digo, mientras dejo de girar el amuleto. "Estaba hablando con Leila."

              "¿Quién diablos es Leila?" dice Arraka.

              "La chica lessathi," dice Illuna, mientras recupera el amuleto y se lo pone alrededor del cuello. "Se ha estado comunicando con nosotros a través de mensajes escritos, flotando en el aire frente a ella."

              "¡Ah, así que eso era lo que estaba haciendo!" dice Arraka.

              "¿No puedes ver lo que escribe?" le pregunto.

              "No, no puedo 'ver' nada desde aquí dentro, ¿eres estúpido?" dice Arraka. "No tengo ojos. Puedo distinguir la mayoría de las cosas con mi sentido mágico, así que realmente no necesito mi vista para nada importante, pero para mí, los dibujos de la chica en el aire eran solo partículas mágicas flotando al azar. Ahora que sé lo que se supone que son, quizás pueda darles un poco más de sentido."
          - source: scene_text_2
            paragraph: 6
            text: |-
              "¿Estás segura de que es seguro llevarla así?" escribe Leila, con expresión preocupada.

              "¡No te preocupes, no es tan fuerte!" digo. "¡Diablos, luché contra ella con una daga cuando estaba en su mejor condición, y aun así no pudo matarme!"

              "Realmente te gusta jugar con fuego, ¿verdad, Barry?" dice Arraka.

              "Mientras permanezca en ese amuleto, no es una amenaza para nosotros," le dice Illuna a Leila. "Vamos, pongámonos en marcha. Hemos estado parados en un lugar demasiado tiempo."

              Hace una pausa.

              "Pero antes de eso," dice, "voy a lanzar algunos hechizos de sanación. La mayoría de tus heridas parecen tener más de un día, y no son graves, así que no debería tener problemas para sanarlas completamente. Barry, no tengo idea de si la sangre en tu ropa viene de tus heridas o de los troles que maté antes, pero si necesitas sanación, te atenderé después."

              "Gracias," escribe Leila, mientras Illuna comienza a lanzar sus hechizos de sanación.
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch03a_accounting
  - name: b2_ch03a_accounting
    texts:
      - source: scene_text
        paragraph: 12
        text: |-
          Después de que Illuna termina con la sanación, el general goblin toma la delantera y nos guía a través de un túnel vacío, en el lado opuesto del túnel por el que llegamos.

          "Es un método de comunicación bastante interesante el que usas, jovencita," dice Fyron. "A juzgar por la forma en que las partículas mágicas se forman en el aire, me atrevería a suponer que estás usando algún tipo de versión modificada de un potenciador de estadísticas para transmitir tus mensajes, ¿estoy en lo correcto?"

          Leila no le responde al goblin inmediatamente, y se toma unos momentos para mirarlo a los ojos antes de escribir su respuesta.

          "Veo que eres muy conocedor cuando se trata de dispositivos mágicos," escribe Leila.

          "He trasteado con algunos artefactos y dispositivos, incluyendo mi bastón, sí," dice Fyron. "Pero nada tan complejo como tu traductor. Debe haber requerido un entendimiento muy profundo de los detalles de la magia de lectura mental y años de trabajo duro para hacer algo tan sofisticado. Quien haya trabajado en tu dispositivo debe haber sido muy talentoso."

          "Lo es," escribe Leila, con una mirada solemne en su rostro.

          "Entonces, eh," digo, "¿por qué buscas invitar al minotauro a tu ejército? ¿Estás planeando ir a la guerra contra el dragón?"
      - source: scene_text_2
        paragraph: 7
        text: |-
          "Qué intrigante," dice el general goblin. "No tienes absolutamente nada que ganar con esta información, y aun así me pides casualmente que te divulgue algunos de mis secretos militares más importantes sin ofrecerme nada a cambio. Sé que no eres un espía, porque ningún espía sería tan estúpido como para preguntarme algo así directamente. Entonces, ¿cuál es la razón detrás de esta pregunta, me pregunto?"

          "Creo que esto es lo que a los humanos les gusta llamar 'charla casual'," dice Illuna, en su habitual tono indiferente. "Palabras vacías, con el único propósito de entablar una conversación, sin ninguna razón en particular. Barry simplemente es particularmente malo siendo discreto, así que nunca se detuvo a pensar si su pregunta era apropiada o no para esta situación."

          "¡Ya déjenlo!" digo. "Si estuvieran tan preocupados de que yo supiera sus planes, nunca me habrían permitido enterarme del minotauro en primer lugar. Si tienen alguna razón para pensar que de alguna forma podría filtrar la información, entonces pueden simplemente decirme que están buscando contratar al minotauro como el contador del ejército, y dejarlo así. No es como si pudiera verificar la información que me dan, de todas formas."
      - source: scene_3
        paragraph: 3
        text: |-
          "Ah, así que no eres completamente estúpido después de todo," dice Fyron, con una sonrisa burlona. "Eso es un alivio. Bueno, en ese caso, como dijiste, el minotauro se unirá a nuestro equipo de contabilidad tan pronto como complete su programa de entrenamiento. Espero grandes cosas de él en los próximos meses."

          Arraka se ríe.

          "Si yo fuera tú," dice, "pondría al minotauro a hacer la contabilidad de todos modos, solo para fastidiarlo. He oído que los trabajos que no involucran labor física son considerados los más deshonrosos según los estándares del minotauro."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch03a_tiger
  - name: b2_ch03a_tiger
    texts:
      - source: scene_text
        paragraph: 13
        text: |-
          "Lo tendré en cuenta," dice Fyron, mientras golpea una pared con su bastón, y un camino secreto se abre frente a nosotros.

          "Realmente conoces bien estos túneles, ¿eh?" le digo al goblin, mientras todos entramos al corredor oculto.

          "Fyron pasa mucho de su tiempo explorando pasajes ocultos y ruinas subterráneas," dice Illuna. "Sus pasatiempos no son muy diferentes de los de Flower en ese sentido."

          "Vamos, vamos, Illuna," dice Fyron, "no hay necesidad de insultarme así. Después de todo, ¿no es gracias a mi supuesto pasatiempo que hemos logrado permanecer sin ser detectados hasta ahora? Agradecería que te abstuvieras de compararme con tu torpe compañera por una pequeña similitud como esta."

          "¿Oh?" dice Illuna. "¿Acaso olvidaste que es gracias a mi torpe compañera que pudiste construir ese bastón tuyo? Nunca nos habríamos encontrado en esa cueva hace veinte años si no fuera por la inigualable estupidez de Flower."

          "¡Ja- Jajajajaja!" ríe Arraka. "¡Todavía recuerdo tu cara cuando despertaste en medio de esa cueva, rodeada de elementales de fuego! ¡No puedo creer que realmente cayera en mi farol! ¡Solo pensarlo me hace estallar de risa!"

          "¿Hola?" escuchamos una voz proveniente de un corredor oscuro a nuestra derecha. "¿Hay alguien ahí? ¿Pueden oírme?"
      - source: scene_text_2
        paragraph: 8
        text: |-
          Todos nos detenemos de repente y miramos hacia el corredor, intentando encontrar la fuente del sonido. La voz parece haber venido del final del túnel, pero está demasiado oscuro para ver algo con claridad.

          "¡Si pueden oírme, por favor, ayuda!" dice la voz de nuevo. "He estado atrapado aquí durante meses. ¡Haré lo que quieran! ¡Por favor!"

          "Hmm..." dice el goblin, mientras crea un orbe de luz con su bastón, y luego lo hace flotar hasta el final del túnel.

          Ahora que tenemos una vista clara, vemos que al final del corredor hay una celda cerrada, que alberga a un solo prisionero: un tigre.

          "¿Eras tú el que nos llamaba antes?" le pregunta Fyron al tigre.

          "Sí," responde el tigre. "¡Por favor, déjenme salir de aquí! ¡Haré lo que pidan!"

          "¿Oh?" dice el goblin, con una sonrisa burlona. "¿Estás seguro de que es buena idea dirigirte a nosotros en lengua común así? Escuché que la vieja zorra está ejecutando a cualquiera que se atreva a hablar en este idioma hoy en día."

          "¡El zorro dorado puede irse al infierno junto con sus reglas!" grita el tigre. "¡Nunca voy a volver a ese horrible lugar!"

          "¿No deseas regresar al dominio de la zorra?" dice Fyron. "Pero, ¿qué otro lugar hay para animales como tú? ¿Quién más va a protegerte, si no el espíritu con forma de zorro?"
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch03a_protection
  - name: b2_ch03a_protection
    texts:
      - source: scene_text
        paragraph: 14
        text: |-
          "¡No necesito la protección de nadie!" dice el tigre.

          El goblin sonríe.

          "¿Es por eso que estás en esta celda, solo, suplicando nuestra ayuda?" dice. "¿Porque no necesitas la protección de nadie?"

          El tigre baja la cabeza y no dice nada.

          "Déjame ver si entiendo esto completamente," dice Fyron. "Por lo que has insinuado hasta ahora, supongo que habías abandonado el dominio de la zorra mucho antes de que te capturaran, ¿estoy en lo correcto?"

          "Sí," dice el tigre, con la cabeza aún baja.

          "¿Hubo otros animales capturados junto contigo?" pregunta Fyron.

          "No," dice el tigre. "He estado viviendo solo desde que me fui de los bosques sagrados."
      - source: scene_text_2
        paragraph: 9
        text: |-
          "Ya veo," dice Fyron.

          Luego hace que su orbe de luz flote más cerca de los barrotes de hierro de la celda, y la luz del orbe comienza a desvanecerse.

          "Hmm," dice Fyron. "Como sospeché, la celda en la que te han puesto restringe el uso de magia. ¿Debo entender que eres un mago, entonces?"

          "Lo soy," dice el tigre.

          El goblin sonríe de nuevo y dirige su mirada hacia mí.

          "Parece que estoy de suerte, Barry," dice Fyron. "¡Puede que acabe de encontrar al candidato perfecto para liderar el equipo de contabilidad de mi ejército! ¿Qué opinas? ¿Te parece apto para la tarea?"
    choices:
      - position: 1
        text: Voy a ser directo. No lo veo sosteniendo un bolígrafo en un futuro cercano.
        effects:
          - set:
              current_scene: b2_ch03a_straight
