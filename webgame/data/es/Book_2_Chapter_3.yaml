  - name: b2_ch03a_maze
    texts:
      - source: scene_text
        paragraph: 23
        text: |-
          "Fyron, ¿es este el último túnel antes del laberinto?" dice Illuna.

          "Sí," dice Fyron. "La salida del túnel debería dejarnos muy cerca de la entrada del laberinto."

          "Espera, ¿qué laberinto?" digo.

          "¿Conoces esa vieja leyenda," dice Fyron, "en la que los dioses trabajaron juntos para construir un elaborado laberinto con el único propósito de atrapar al rey de los minotauros? Bueno, parece que al dueño de la arena le gustó tanto la historia que decidió construir su propio laberinto subterráneo tan pronto como consiguió un minotauro. Desafortunadamente, no tuve la oportunidad de visitar estos túneles desde que se creó el laberinto, así que una vez que lleguemos, no conoceré el camino tan bien como hasta ahora."

          "No creo que sea un problema," dice Illuna, "ya que probablemente no habrá necesidad de escondernos más una vez que lleguemos al laberinto. Seguramente ya se habrán enterado de nuestra presencia para entonces. Creo que deberíamos poder manejar a sus guardias sin problema, pero si las cosas se ponen realmente mal, despertaré a Flower también."

          "Disculpa, ¿quién es Flower?" escribe Leila, confundida.

          "Flower es la niña que habita este cuerpo," dice Illuna.
      - source: scene_text_2
        paragraph: 14
        text: |-
          "¿Quieres decir... que sigue viva?" escribe Leila, impactada. "Pero, ¿no eres una banshee? ¿No consumiste su alma cuando te apoderaste de su cuerpo?"

          Illuna se ríe.

          "Si tan solo hubiera sido tan fácil," dice. "Desafortunadamente, las dos hemos estado atrapadas juntas en este cuerpo durante los últimos veinte años, y probablemente seguiremos viviendo así por años más. Nuestras almas están fusionadas."

          "Ya veo..." escribe Leila, simplemente.

          Parece como si todavía tuviera algunas preguntas que hacer, pero al final decide no hacerlas. A medida que la salida del túnel se acerca, Illuna reabre el amuleto de Arraka y le pregunta si puede detectar algún enemigo cerca.

          "Ah, ¿así que ahora quieres que hable?" dice Arraka. "¿Ya no vas a cerrarme el amuleto en la cara? Bueno, ¿y qué si yo no quiero hablar? ¿Qué me dices a eso?"

          "Si no planeas hablar, entonces no te necesito más," dice Illuna, mientras empieza a cerrar el amuleto. "Que duermas bien."

          "¡Espera, espera, espera!" dice Arraka, justo cuando Illuna estaba a punto de cerrar el amuleto completamente. "¡Está bien, bien! ¡Tú ganas! Hay algunos troles mucho más adelante en el siguiente túnel, pero no están dentro del rango de visión de la entrada del laberinto. El camino está despejado."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch03a_stubborn
  - name: b2_ch03a_stubborn
    texts:
      - source: scene_text
        paragraph: 24
        text: |-
          "Eso no suena bien," dice Illuna. "Deberían tener al menos algunos guardias en la entrada del laberinto. Me inclino mucho más a creer que se han enterado de nuestra presencia y que deliberadamente vaciaron el siguiente túnel para atraernos al laberinto."

          "Eso cambia poco," dice Fyron. "La única forma de llegar al minotauro es a través del laberinto. Si los troles deciden interponerse en nuestro camino, entonces simplemente tendremos que abrirnos paso a través de ellos."

          Una vez que llegamos al siguiente corredor, nos aseguramos de que el camino esté efectivamente despejado, y luego procedemos a entrar al laberinto. Las paredes dentro del laberinto se ven un poco diferentes de todas las paredes rocosas que hemos visto en las cavernas hasta ahora. Son negras como el carbón y parecen estar hechas de un material diferente.

          Fyron, quien parece haber notado la diferencia también, se acerca a una de las paredes y la mira con curiosidad. Pasa brevemente la pared con su dedo índice, y luego acerca el dedo a su rostro, estudiando atentamente el polvo negro que se ha acumulado en la punta.

          "Dime, Arraka," dice el goblin, "¿estás detectando algún trol cerca?"

          "¿Qué?" dice Arraka. "No, ya te dije que el camino está despejado."

          "¿Estás segura?" pregunta Fyron.

          "¿Qué clase de pregunta es esa?" dice Arraka. "¡Por supuesto que estoy segura!"
      - source: scene_text_2
        paragraph: 15
        text: |-
          "¿Oh?" dice Fyron. "¿Entonces podrías quizás describirme qué hay más allá de esta pared negra?"

          "Sí, espera un segundo," dice Arraka.

          Durante unos diez segundos, todos esperamos en silencio la respuesta de Arraka.

          "¿Y bien?" dice Fyron. "¿No ibas a describirnos lo que hay del otro lado?"

          "Hay... un poco de interferencia," dice Arraka. "Todavía estoy trabajando en ello."

          "Ah, entonces por favor," dice Fyron, "no permitas que las divagaciones de este viejo goblin te interrumpan en tu trabajo. Por favor, tómate todo el tiempo que necesites."

          Pasan treinta segundos más de silencio hasta que finalmente Illuna estalla.

          "¡Por todos los dioses!" grita. "¿Cuánto tiempo te va a tomar admitir lo obvio? Esta pared claramente está hecha de un material que bloquea el sentido mágico. Podemos esperar aquí todo el día y aun así no vas a poder atravesarla. ¿De verdad eres tan terca?"

          "¡Está bien!" dice Arraka. "¡Lo admito! No puedo atravesarla. No tengo idea de lo que hay del otro lado. ¿Estás contenta ahora?"
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch03a_seredium
  - name: b2_ch03a_seredium
    texts:
      - source: scene_text
        paragraph: 25
        text: |-
          Fyron sonríe.

          "Gracias, Arraka, creo que eso será suficiente," dice. "Como señaló Illuna, esta pared está hecha de un material que no permite que el sentido mágico la atraviese. Este tipo de roca negra no es rara en cuevas subterráneas como esta, y se llama 'seredium'. El dueño de la arena debe haber elegido construir su laberinto aquí específicamente por la existencia de estas rocas. No tendría mucho sentido hacer un laberinto si la gente pudiera simplemente usar su sentido mágico para ver a través de las paredes, ¿verdad?"

          Mientras el goblin hablaba, Leila estaba ocupada inspeccionando el suelo de la cueva, con una mirada muy concentrada en su rostro. Fyron la nota y se acerca, intentando descubrir qué está estudiando tan atentamente.

          "¿Hay algo especial en el suelo de este corredor?" le pregunta Fyron.

          Leila asiente. Luego señala una mancha negra en el suelo, casi indistinguible del color del resto del piso.
      - source: scene_text_2
        paragraph: 16
        text: |-
          "Esta no es una mancha negra ordinaria," escribe Leila. "Es sangre de trol. Mira, hay más por allá. Y por ahí también. El rastro es reciente. Si seguimos las gotas de sangre, podrían llevarnos hasta el minotauro."

          "¡O los troles podrían estar perfectamente incitándonos para que caminemos directamente hacia su emboscada!" dice el tigre. "Ya que hablamos, ¿desde cuándo los troles dejan rastros de sangre? ¿No tienen poderes de regeneración que sanan todas sus heridas en cuestión de segundos?"

          "No todos," dice Illuna. "La efectividad de su regeneración varía de individuo a individuo. También hay ciertos tipos de heridas que sanan más lentamente que otras. No tenemos forma de saber si este rastro fue dejado deliberadamente o por accidente. No es que importe realmente. Mientras busquemos llegar al minotauro, vamos a toparnos con los troles tarde o temprano, ya sea que sigamos este rastro o no."
    choices:
      - position: 1
        text: Proponer seguir el rastro de sangre
        effects:
          - set:
              current_scene: b2_ch03a_follow
      - position: 2
        text: Proponer evitar el rastro de sangre
        effects:
          - set:
              current_scene: b2_ch03a_avoid
              b2_ch3_troll: 0
  - name: b2_ch03a_follow
    texts:
      - source: scene_text
        paragraph: 26
        text: |-
          "En ese caso, propongo que sigamos el rastro," digo. "Si los troles lo dejaron deliberadamente, entonces tendremos que pelear contra ellos, como ya estábamos planeando. Pero si lo hicieron por accidente, al menos no tendremos que desperdiciar horas de nuestro tiempo navegando por el laberinto."

          "Una propuesta válida," dice Fyron. "¿Alguien tiene alguna objeción?"

          "Como dije, me da igual," dice Illuna.

          "Hagan lo que quieran," dice el tigre.

          Leila permanece en silencio, pero no parece querer hacer ninguna objeción.

          "Muy bien, entonces," dice Fyron. "Seguiremos el rastro de sangre. Sin embargo, nuestra primera prioridad debería ser el mapeo de este laberinto. Arraka, tengo entendido que tienes la capacidad de generar hologramas, ¿no?"

          "Sí," dice Arraka. "Pero no puedo hacer un mapa de este lugar si mi sentido mágico no puede atravesar las paredes."

          "No importa," dice Fyron. "Puedes simplemente dibujar el mapa mientras caminamos. Lo importante es que no perdamos la pista de dónde estamos. Yo estaré marcando las paredes periódicamente, mientras avanzamos por el laberinto, con el mismo propósito."

          "Muy bien entonces," dice Arraka. "Aquí vamos."
      - source: scene_text_2
        paragraph: 17
        text: |-
          Entonces conjura un holograma similar al que hizo en la fortaleza de ogros, donde estamos representados por puntos de colores, y el mapa está cubierto por una niebla negra, excepto por el corredor en el que estamos actualmente. Mientras tanto, Fyron usa su bastón para imprimir un símbolo complejo en la pared a nuestra derecha, con tinta mágica verde.

          "Estamos listos," dice Fyron. "Síganme."

          Mientras caminamos, la niebla del mapa de Arraka comienza a despejarse, poco a poco, siendo reemplazada por las partes del laberinto que ya conocemos, mientras Fyron se asegura de no dejar ninguna pared sin marcar.

          "¿No vas a preguntarme qué significa el símbolo complejo que estoy marcando en las paredes, Barry?" dice Fyron, con una sonrisa.

          "No, gracias," digo. "No vale la pena deberle otro favor solo para obtener una respuesta a esa pregunta."

          "¡Aprendes rápido!" dice Fyron, y luego marca otra pared más con su símbolo de tinta verde.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch03a_arrow
  - name: b2_ch03a_avoid
    texts:
      - source: scene_text
        paragraph: 27
        text: |-
          "En ese caso, propongo que evitemos el rastro," digo. "Incluso si vamos a pelear contra los troles de todas formas, preferiría pelear en nuestros propios términos, en lugar de arriesgarme a darles la ventaja."

          "Una propuesta válida," dice Fyron. "¿Alguien tiene alguna objeción?"

          "Como dije, me da igual," dice Illuna.

          "No tengo objeciones," dice el tigre.

          Leila permanece en silencio y no hace ninguna objeción, aunque no parece estar completamente de acuerdo con nuestra decisión.

          "Muy bien, entonces," dice Fyron. "No seguiremos el rastro de sangre. Si vamos a empezar a explorar los otros caminos, entonces nuestra primera prioridad debería ser el mapeo de este laberinto. Arraka, tengo entendido que tienes la capacidad de generar hologramas, ¿no?"

