  - name: b2_ch03a_straight
    texts:
      - source: scene_text
        paragraph: 15
        text: |-
          "Voy a ser directo. No lo veo sosteniendo un bolígrafo en un futuro cercano."

          "Afortunadamente, no necesitará un bolígrafo para liderar su equipo," dice Fyron. "Solo necesita ser bueno con los cálculos."

          "Disculpa," dice el tigre. "¿Quieres que haga qué?..."

          El goblin se ríe.

          "No nos hagas caso," dice. "Solo estábamos bromeando. Aunque sí dijiste que harías lo que te pidiera, así que no deberías actuar tan sorprendido, incluso si te pusiera a ordenar papeles de escritorio para ganarte la vida."

          "Supongo..." dice el tigre.

          "Illuna, ¿podrías encargarte de esos barrotes de hierro por mí?" dice el general goblin. "Las propiedades anti-magia de la celda no parecen extenderse más allá de esos barrotes, así que deberías poder cortarlos con tus látigos de agua desde afuera."

          "Muy bien," dice Illuna.

          Entonces conjura dos látigos hechos de agua que parece estar sosteniendo con las manos, y los usa para cortar los barrotes de hierro en pedazos.
      - source: scene_text_2
        paragraph: 10
        text: |-
          "¡Ahora eres libre!" dice Fyron, mirando al tigre que ahora sale de su celda. "Y con esto quiero decir que eres libre de hacer lo que yo diga. Espero sinceramente que no estés planeando traicionarme y reunirte con la zorra inmediatamente después de que salgamos de este lugar."

          "Te aseguro que eso no va a pasar," dice el tigre.

          "¿Hmm?" dice el goblin. "¿Puedo preguntar qué es lo que la zorra ha hecho para perder tu lealtad hasta tal grado? ¿Por qué seguirías negándote a volver a tu tierra natal, incluso después de que ha pasado todo este tiempo?"

          "Tengo mis razones," dice el tigre.

          "Verás, eso no es muy tranquilizador," dice Fyron, mientras señala al tigre con su bastón. "Si vas a darme respuestas vagas así desde el principio, ¿qué me dice que no te inventaste toda esa historia sobre haber dejado el dominio de la zorra, solo para ganar mi simpatía?"
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch03a_leopard
  - name: b2_ch03a_adapt
    texts:
      - source: scene_text
        paragraph: 16
        text: |-
          "Veo que no te tomó mucho adaptarte a nuestra 'charla casual' humana."

          "Eso es porque su 'charla casual' no es muy diferente de lo que solíamos llamar 'política goblin', no hace mucho tiempo," dice Fyron.

          "¿Pero han cambiado desde entonces?" le pregunto.

          "No," dice Fyron. "Simplemente tomé el control."

          "Disculpa," dice el tigre. "¿Qué dijiste que querías que hiciera, otra vez?..."

          El goblin se ríe.

          "No nos hagas caso," dice. "Solo estábamos bromeando. Aunque sí dijiste que harías lo que te pidiera, así que no deberías actuar tan sorprendido, incluso si te pusiera a ordenar papeles de escritorio para ganarte la vida."

          "Supongo..." dice el tigre.

          "Illuna, ¿podrías encargarte de esos barrotes de hierro por mí?" dice el general goblin. "Las propiedades anti-magia de la celda no parecen extenderse más allá de esos barrotes, así que deberías poder cortarlos con tus látigos de agua desde afuera."

          "Muy bien," dice Illuna.

          Entonces conjura dos látigos hechos de agua que parece estar sosteniendo con las manos, y los usa para cortar los barrotes de hierro en pedazos.
