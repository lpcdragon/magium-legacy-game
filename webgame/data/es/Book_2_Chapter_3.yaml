          "¿Podemos dejar de llamarlos contables? Está empezando a sonar confuso."

          "¡Por supuesto!" dice Fyron. "Quizás contable no es la palabra correcta para usar en esta situación. ¿Tal vez debería haber dicho que estoy buscando que trabaje como consultor?"

          "Disculpa," dice el tigre. "¿Quieres que haga qué?..."

          El goblin se ríe.

          "No nos hagas caso," dice. "Solo estábamos bromeando. Aunque sí dijiste que harías lo que te pidiera, así que no deberías actuar tan sorprendido, incluso si te pusiera a ordenar papeles de escritorio para ganarte la vida."

          "Supongo..." dice el tigre.

          "Illuna, ¿podrías encargarte de esos barrotes de hierro por mí?" dice el general goblin. "Las propiedades anti-magia de la celda no parecen extenderse más allá de esos barrotes, así que deberías poder cortarlos con tus látigos de agua desde afuera."

