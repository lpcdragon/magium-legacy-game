  - name: b2_ch03a_leopard
    texts:
      - source: scene_text
        paragraph: 18
        text: |-
          "El hecho de que te estoy hablando en la lengua común," dice el tigre.

          "Explica," dice Fyron.

          "Eleya, el gran zorro dorado," dice el tigre, "tiene la costumbre de interrogar a todos los animales que regresan a su dominio, después de un largo período de cautiverio. Una pregunta que siempre se hace es si has hablado con algún humano en lengua común mientras estuviste fuera. No hay forma de ocultarle la verdad a la gran zorra. Mientras esté estudiando tu aura, puede fácilmente saber si estás mintiendo o no. Incluso si no fuera un exiliado, como dije, regresar a mi tierra natal ahora sería nada menos que un suicidio. Me ejecutaría en el acto."

          "Admito que he oído hablar de los interrogatorios de la zorra," dice Fyron. "Pero asumí que haría una excepción con los magos y otros miembros valiosos de su comunidad."

          "La zorra no hace excepciones," dice el tigre, con una mirada en sus ojos que parece mostrar tanto ira como terror al mismo tiempo. "Yo solía pensar lo mismo que tú, antes de que asesinara al hijo del leopardo a sangre fría."

          "¿El leopardo?" digo. "¿Te refieres a Leo, el leopardo?"

          "Sí, a él me refería," dice el tigre. "Era su vasallo más leal. Todavía lo es. Pero eso no la detuvo de ejecutar a su cachorro, por el horrendo crimen de suplicar por su vida en lengua común, a un par de cazadores humanos. El leopardo puede haber aceptado su juicio, pero yo nunca lo haré."
      - source: scene_text_2
        paragraph: 11
        text: |-
          El tigre hace una pausa por unos segundos, y luego se repite, en una voz más baja.

          "Nunca lo haré," dice.

          "Ah," dice Fyron, "ahora las cosas empiezan a tener más sentido. Si la zorra después también ejecutó a tu familia, de manera similar a como ejecutó al cachorro del leopardo, puedo ver por qué elegirías dejar su dominio para siempre. Eso también explicaría por qué dejaste tu tierra natal solo."

          El tigre se ve bastante enojado después de escuchar las palabras del goblin, pero elige permanecer en silencio.

          "Has dicho suficiente," le dice Fyron al tigre. "Como mínimo, encontraría muy improbable que regresaras con el zorro dorado después de todo lo que acabas de decir. Respecto a tu deuda conmigo, solo pido que me acompañes a mi campamento goblin en mi viaje de regreso. Si la vida allí no es de tu agrado, entonces puedes irte en cualquier momento y considerar tu deuda conmigo saldada. Sin embargo, estoy bastante seguro de que elegirás quedarte."

          "¿Y por qué es eso?" pregunta el tigre.

          "Lo entenderás cuando llegues allí," dice Fyron. "Ahora, síguenos. Todavía hay otro prisionero que necesitamos rescatar antes de poder irnos de este lugar."

          "¿Otro prisionero?" pregunta el tigre, mientras se une a nosotros y todos retomamos nuestra caminata por las cuevas. "No te referirás al minotauro, ¿verdad?"
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch03a_animals
  - name: b2_ch03a_animals
    texts:
      - source: scene_text
        paragraph: 19
        text: |-
          "¿A quién más podría referirme?" dice Fyron. "¿Hay alguien más aquí que valga el esfuerzo de liberar?"

          "Supongo que no," dice el tigre. "El minotauro probablemente es el único prisionero de este lugar aparte de mí que no es alguna bestia irracional."

          "Tengo curiosidad," digo. "Dices que todas las criaturas atrapadas en estas cavernas son bestias irracionales, pero también vi algunos tigres dientes de sable en mi camino hasta aquí. ¿Sientes lo mismo sobre ellos también?"

          "Por supuesto que sí," dice el tigre. "¿Qué clase de pregunta es esa?"

          "Bueno, son tigres..." digo.

          "¡No, no lo son!" dice el tigre, furioso. "¡Son tigres dientes de sable, no tigres! ¿Cómo puedes siquiera comparar a los dos?"

          "Barry no es de Varathia," dice Illuna. "Aunque no lo creas, en los continentes fuera de Varathia no hay mucha diferencia entre animales y criaturas. Un tigre del oeste es una bestia irracional tanto como un tigre dientes de sable."
      - source: scene_text_2
        paragraph: 12
        text: |-
          "¡No puedes estar hablando en serio!" dice el tigre.

          "Al contrario," dice Illuna. "Hablo muy en serio. No sé si el alto nivel de inteligencia mostrado por los animales en Varathia se debe a la influencia del zorro dorado, o a otros factores, pero el hecho es que Varathia es el único lugar en el mundo donde los animales pueden hablar, y es el único lugar donde viven en sociedades civilizadas."

          "¡Ja!" dice Arraka. "¿Cómo se siente saber que hay animales por ahí que son más tontos que los ogros? ¿Pensabas que eras algo especial? Apuesto a que la gente de fuera de Varathia ni siquiera podría distinguirte de una bestia salvaje. Para ellos, no eres más que una criatura irracional, igual que una arpía o una babosa gigante. ¿No es así, Barry?"
    choices:
      - position: 1
        text: Bueno, es difícil tratarlo como una bestia tonta cuando puede hablar en Común.
        effects:
          - set:
              current_scene: b2_ch03a_dumb
      - position: 2
        text: Sí, para mí no es diferente de una arpía, una babosa gigante o una banshee en un amuleto.
        effects:
          - set:
              current_scene: b2_ch03a_amulet
      - position: 3
        text: Sí, criaturas y animales son todos iguales para mí, siendo honesto.
        effects:
          - set:
              current_scene: b2_ch03a_same
  - name: b2_ch03a_dumb
    texts:
      - source: scene_text
        paragraph: 20
        text: |-
          "Bueno, es difícil tratarlo como una bestia tonta cuando puede hablar en Común."

          "¡No te preocupes, tengo una solución fácil para eso!" dice Arraka. "Solo ignora lo que dice. Si no le prestas atención, te resultará mucho más fácil tratarlo como un animal. Ah, perdón, ¿dije animal? Lo que quise decir fue criatura. ¡Siempre confundo las dos! ¡Ja- JAJAJAJAJA!"

          "¿Quién diablos es esa payasa del amuleto?" dice el tigre. "¿Algún tipo de espíritu bromista?"

          "¡Eso es grosero, ¿sabes?!" dice Arraka. "¡No deberías asumir que soy una payasa solo porque la chica que lleva puesto mi amuleto está vestida de payaso! ¿No te enseñan modales en la escuela de animales?"

          "Por increíble que parezca," dice Illuna, ignorando a Arraka, "la banshee atrapada en este amuleto es la responsable del exilio de todas las banshees al plano terrenal. Los dioses no querían lidiar con ella, así que la desterraron aquí, junto con toda su especie. O eso afirma."

          "Puedo ver por qué querrían sacarla del plano mágico," dice el tigre. "Incluso los dioses se quedarían sin paciencia al tratar con semejante idiotez."

          "¿Ah, sí?" dice Arraka. "Bueno, te informo que--"
      - source: scene_text_2
        paragraph: 13
        text: |-
          No llega a terminar lo que iba a decir, porque Illuna cierra el amuleto de golpe en medio de su frase.

          "Ya escuché suficiente de esto," dice Illuna. "Tenemos asuntos más importantes que discutir ahora mismo."

          Luego se vuelve hacia mí.

          "Barry, ¿tú y Leila tienen una forma de regresar a sus celdas?" dice Illuna. "Creo que debo advertirte que Fyron y yo nos teletransportaremos fuera de aquí tan pronto como liberemos al minotauro, así que no estaremos ahí para escoltarlos de vuelta."

          "No, no tenemos una forma de regresar a nuestras celdas," digo. "El camino por el que vinimos está sellado y a cien pies sobre el suelo. Necesitamos encontrar otra ruta de regreso."

          "Si buscas llegar a los pasillos principales debajo de la arena," dice Fyron, "hay un túnel secreto que puedo abrir para ti, no muy lejos de donde está el minotauro. Sin embargo, puede que tengas que superar varias trampas para llegar a tu destino."

          "Eso es... bastante amable de tu parte," digo.

          "No te preocupes," dice Illuna, al ver la desconfianza en mi rostro. "Fyron no es tan tonto como para arriesgar su alianza conmigo sin otra razón que divertirse. No es Arraka. Si dice que hay un túnel que lleva a los pasillos debajo de la arena, entonces probablemente dice la verdad."
