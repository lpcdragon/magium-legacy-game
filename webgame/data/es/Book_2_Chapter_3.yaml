          "Sí, criaturas y animales son todos iguales para mí, siendo honesto."

          "Entonces puedes seguir viviendo felizmente en tu dichosa ignorancia, humano," dice el tigre. "Honestamente no podría importarme menos tu opinión sobre mí."

          Luego mira hacia el amuleto de Arraka.

