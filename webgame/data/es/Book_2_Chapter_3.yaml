  - name: b2_ch03a_half
    texts:
      - source: scene_text
        paragraph: 7
        text: |-
          "Están diciendo que eres un medio lessathi," dice Illuna. "Un mitad humano, mitad lessathi para ser más exactos."

          Al escuchar las palabras de Illuna, Leila de repente gira la cabeza hacia ella y la observa atentamente. Es la primera vez que la veo reaccionar de alguna manera desde el comienzo de nuestra conversación.

          "Un medio lessathi, dices..." le digo a Illuna.

          "Es la única explicación posible," dice Fyron. "No conozco ninguna otra raza que luzca como tú, y mientras también seas mitad humano, tu uso de las estadísticas mágicas tiene sentido."

          "Para ser honesto, realmente no me importa de ninguna manera," digo. "Ser un medio lessathi realmente no hace mucha diferencia para mí. Además, no tengo absolutamente ninguna idea de cómo se supone que debo usar esas estadísticas mágicas de las que hablan. Hasta ahora, solo he podido usarlas por un período de tiempo muy corto, y solo después de obtener acceso a una enorme fuente de energía. Eso no es exactamente ideal."

          "Hay una forma de desbloquear esas estadísticas permanentemente," dice Fyron. "Sin embargo, hacerlo requeriría un código que probablemente solo conocen un puñado de lessathi, en los altos mandos de su organización. No esperaría de forma realista que pudieras usar esas estadísticas pronto."
      - source: scene_text_2
        paragraph: 5
        text: |-
          "Entonces, eh," digo, "no es que no esté disfrutando nuestra conversación y todo eso, pero ¿no deberíamos quizás ponernos en movimiento, antes de que los troles envíen más refuerzos hacia acá?"

          "¿Por qué enviarían refuerzos?" pregunta Fyron. "Ya me encargué de todos sus exploradores."

          Luego señala a todos los troles muertos tirados en el suelo a su alrededor.

          "Nadie más debería saber que estamos aquí," continúa Fyron.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch03a_bodies
  - name: b2_ch03a_bodies
    texts:
      - source: scene_text
        paragraph: 8
        text: |-
          "Hablando de los troles," dice Arraka, "¿van a esconder estos cuerpos pronto, o están planeando colgarlos como decoración? No es que esté en contra de ninguna de esas ideas, por supuesto."

          "¿No puedes simplemente despertar a Flower y hacer que incinere los cadáveres de los troles?" le pregunto a Illuna.

          "Preferiría no despertar a Flower a menos que sea absolutamente necesario," dice Illuna. "Las misiones sigilosas nunca fueron exactamente su especialidad, y tampoco se lleva muy bien con Fyron."

          "No hay de qué preocuparse," dice Fyron. "Tengo todo cubierto."

          El goblin entonces golpea su bastón contra el suelo, y todos los cadáveres de los troles se envuelven en llamas al mismo tiempo. Después de unos segundos, las llamas desaparecen, y los cuerpos muertos son reemplazados por cenizas.

          "¿Procedemos?" dice el goblin.

          "Arraka, ¿hay algún enemigo en nuestro camino?" dice Illuna.

          "No," dice Arraka. "Ya mataste a la mayoría de los guardias de esta zona."

          "¿Y nadie se está ocultando de forma invisible?" dice Illuna.

          "Nadie," dice Arraka.

          "Disculpa," escribe Leila, mientras mira a Illuna. "¿Acabas de decir que la banshee del amuleto se llama Arraka?"

          "Sí," dice Illuna. "¿Has oído hablar de ella?"

          "He... oído algunas cosas, sí..." escribe Leila.
    choices:
      - position: 1
        text: ¿Qué has oído exactamente sobre ella?
        effects:
          - set:
              current_scene: b2_ch03a_eyesight
              b2_ch3_spin: 1
      - position: 2
        text: ¿Oíste que te concede tres deseos si la haces girar por la cadena?
        effects:
          - set:
              current_scene: b2_ch03a_eyesight
              b2_ch3_spin: 2
      - position: 3
        text: ¿Oíste que se marea si la haces girar por la cadena? ¡Déjame mostrarte!
        effects:
          - set:
              current_scene: b2_ch03a_eyesight
              b2_ch3_spin: 3
  - name: b2_ch03a_eyesight
    routes:
      - condition: b2_ch3_spin = 1
        texts:
          - source: scene_text
            paragraph: 9
            text: |-
              "¿Qué has oído exactamente sobre ella?"

              "He oído que es un espíritu muy malvado y poderoso que jugó un papel importante en la guerra del invierno inmóvil," escribe Leila. "¿Es realmente la misma Arraka de hace seiscientos años?"

              "Es ella," dice Illuna. "Te lo garantizo."

              "¿Con quién diablos están hablando ustedes dos?" dice Arraka. "¿Se han vuelto locos?"

              "Estábamos hablando con Leila," digo.

              "¿Quién diablos es Leila?" dice Arraka.

              "La chica lessathi," dice Illuna. "Se ha estado comunicando con nosotros a través de mensajes escritos, flotando en el aire frente a ella."

              "¡Ah, así que eso era lo que estaba haciendo!" dice Arraka.

              "¿No puedes ver lo que escribe?" le pregunto.

              "No, no puedo 'ver' nada desde aquí dentro, ¿eres estúpido?" dice Arraka. "No tengo ojos. Puedo distinguir la mayoría de las cosas con mi sentido mágico, así que realmente no necesito mi vista para nada importante, pero para mí, los dibujos de la chica en el aire eran solo partículas mágicas flotando al azar. Ahora que sé lo que se supone que son, quizás pueda darles un poco más de sentido."
          - source: scene_text_2
            paragraph: 6
            text: |-
              "¿Estás segura de que es seguro llevarla así?" escribe Leila, con expresión preocupada.

              "¡No te preocupes, no es tan fuerte!" digo. "¡Diablos, luché contra ella con una daga cuando estaba en su mejor condición, y aun así no pudo matarme!"

              "Realmente te gusta jugar con fuego, ¿verdad, Barry?" dice Arraka.

              "Mientras permanezca en ese amuleto, no es una amenaza para nosotros," le dice Illuna a Leila. "Vamos, pongámonos en marcha. Hemos estado parados en un lugar demasiado tiempo."

              Hace una pausa.

              "Pero antes de eso," dice, "voy a lanzar algunos hechizos de sanación. La mayoría de tus heridas parecen tener más de un día, y no son graves, así que no debería tener problemas para sanarlas completamente. Barry, no tengo idea de si la sangre en tu ropa viene de tus heridas o de los troles que maté antes, pero si necesitas sanación, te atenderé después."

              "Gracias," escribe Leila, mientras Illuna comienza a lanzar sus hechizos de sanación.
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch03a_accounting
