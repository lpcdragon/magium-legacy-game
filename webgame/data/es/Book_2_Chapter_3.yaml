                  current_scene: b2_ch03a_leave
                  b2_ch3_troll: 0
      - condition: hearing = 4 AND ancient_languages >= 3
        texts:
          - source: scene_text
            paragraph: 30
            text: |-
              Mientras avanzamos por los corredores, de repente escucho las voces de varios troles, hablando en voz baja, lejos de nuestra posición.

              El idioma en el que se comunican es uno que no he escuchado antes, pero por suerte, el conocimiento que recibí de mi dispositivo de estadísticas es suficiente para que los entienda.

              "Por favor," dice uno de los troles. "¡Al menos quítenme la flecha!"

              "Te quitaremos la flecha de tu herida tan pronto como termines con tu tarea," dice otro trol. "Ahora dime, ¿recuerdas lo que necesitas hacer?"

              "Sí," dice el trol herido, respirando con dificultad. "Necesito... atraer a los intrusos... y cuando estén cerca de mí... presiono el botón."

              "Exacto," dice el otro trol. "Y tan pronto como presiones el botón, recibiremos nuestra señal y sabremos que podemos emboscar a los invasores. Después de que los matemos a todos, recibirás tu tratamiento."

              "Sí..." dice el trol herido. "El tratamiento..."
          - source: scene_text_2
            paragraph: 18
            text: |-
              "No nos falles como antes," dice el otro trol, y después de esta última frase, los corredores quedan en silencio de nuevo.

              Unos minutos después, finalmente llegamos al final del rastro de sangre, que nos llevó a un callejón sin salida, pero también a un trol herido con una flecha clavada en el pecho, sentado en el suelo, con la espalda apoyada contra una pared. Estudiamos al trol y sus alrededores desde una distancia segura, intentando descifrar si esto se supone que es la preparación para una emboscada o no, pero no hay forma de saberlo con certeza.

              "¿Son ustedes los... intrusos?" dice el trol en lengua común, respirando con dificultad.

              "En efecto lo somos," dice Fyron.

              "Por favor," dice el trol, "¿podrían ayudarme a... sacarme esta flecha... del pecho?"

              "¿Y por qué haríamos algo así?" dice Fyron.

              "Están... buscando al minotauro... ¿sí?" dice el trol. "Si me ayudan... puedo llevarlos hasta él. Conozco el camino..."
        effects:
          - set:
              successful_checks:
                - '[ Comprobación de audición exitosa - nivel 4 ]'
                - '[ Comprobación de lenguas antiguas exitosa - nivel 3 ]'
