  - name: b2_ch03a_supposed
    texts:
      - source: scene_text
        paragraph: 49
        text: |-
          "¿Qué se supone que significa eso?"

          "Oh, no lo dije en mal sentido," escribe Leila. "Es solo que no esperaba conocer a dos banshees y a un mago goblin en el mismo día."

          "Bueno, para ser justos, tampoco puedo decir que yo esperaba al goblin," digo. "Pero después del tiempo que he pasado aquí, en Varathia, nada me sorprende realmente ya."

          Hago una pausa por unos segundos, y luego cambio de tema.

          "Entonces, eh... ¿por qué no aceptaste la oferta del goblin antes?" le pregunto. "¿Es porque no confiabas en él?"

          "Oh, no, no es eso," escribe Leila. "Es solo que nunca tuve la intención de escapar de aquí."

          "¿Por qué no?" digo. "¿No podrías simplemente correr más rápido que todos los guardias de la ciudad, ahora que tus heridas están sanadas?"

          Leila niega con la cabeza.

          "Los lessathi que incriminaron a mi padre me están vigilando cuidadosamente," escribe. "Mientras sobreviva la arena, los cargos contra mí serán retirados y no podrán tocarme, pero si escapo ilegalmente, usarán todos los medios a su disposición para cazarme. Nunca llegaría a las puertas de la ciudad con vida."
      - source: scene_text_2
        paragraph: 32
        text: |-
          "¿Estás diciendo que preferirías luchar contra las criaturas de la arena," digo, "que tener una confrontación directa con los lessathi de esta ciudad?"

          "Sí," escribe Leila. "Los lessathi tienen artefactos poderosos que les permiten usar magia, similares al bastón que usaba el general goblin. Al menos en la arena nadie tiene permitido usar magia, así que mientras tenga mi dispositivo de estadísticas, puedo tener una oportunidad."

          "Sí, supongo que veo tu punto," digo. "Hablando de dispositivos de estadísticas, creo que deberíamos sacarlos para iluminar un poco este lugar. El goblin dijo que podría haber trampas por aquí, así que deberíamos ir con cuidado."

          Caminamos por el túnel oscuro durante unos minutos, revisando cuidadosamente cada paso del camino en busca de trampas o emboscadas enemigas. Al entrar en un área más grande, iluminada por los cristales azules brillantes que hemos visto antes, nos damos cuenta de que todos nuestros esfuerzos por detectar emboscadas ocultas fueron en vano, porque el enemigo nos estaba esperando aquí, en esta misma sala, sin hacer ningún esfuerzo por ocultarse.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch03a_velgos
