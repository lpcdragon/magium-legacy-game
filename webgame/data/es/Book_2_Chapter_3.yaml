              current_scene: b2_ch03a_weaklings
      - position: 3
        text: ¿En serio parezco como si necesitara huir de alguien como Tyrath?
        effects:
          - set:
              current_scene: b2_ch03a_seriously
  - name: b2_ch03a_escaped
    texts:
      - source: scene_text
        paragraph: 4
        text: |-
          "¿Quién dijo que escapé?"

          "¿Entonces lograste persuadirlo de que te dejara ir?" dice el general goblin. "¿O me vas a decir que lo derrotaste tú solo?"

          "No solo," dice Illuna. "Tuvo ayuda de cierto stillwater con el que creo que estás bien familiarizado."

          "¿Estás hablando de Eiden?" pregunta Fyron.

          "Sí," dice Illuna. "Eiden parece haber tomado un extraño interés en Barry y su grupo por alguna razón. Escuché que el stillwater apareció de la nada en medio de su batalla con el dragón, y potenció el dispositivo de estadísticas de Barry de una forma que le permitió lanzar hechizos. Esta es la razón por la que Barry pudo luchar contra Tyrath en igualdad de condiciones."

          "Lo que me dices debería ser imposible," dice el general goblin. "A menos que el propio objeto sea el que lanza los hechizos, un lessathi no debería poder usar magia de ninguna manera, debido a la completa falta de magia en su aura. Escuché que los lessathi de antaño experimentaron con agregar estadísticas mágicas al dispositivo hace mucho tiempo, pero estoy bastante seguro de que nunca lograron hacerlo funcionar. Para que alguien pudiera lanzar hechizos usando esas estadísticas, necesitaría tener tanto la baja frecuencia mágica en su aura que es específica de los lessathi, como el potencial para lanzar hechizos. Prácticamente necesitaría ser tanto un lessathi como un--"
      - source: scene_text_2
        paragraph: 4
        text: |-
          El goblin deja de hablar de repente, como si acabara de tener una revelación impactante. Al ver la expresión en su rostro, Arraka empieza a reírse desde dentro de su amuleto.

          "¿Así que por fin lo descubriste, eh?" dice Arraka.

          "¿Lo sabías?" le pregunta Fyron.

          "Lo descubrí hace un tiempo, después de que empezara a lanzar hechizos a diestra y siniestra contra un montón de esqueletos," dice Arraka. "Pero yo también pensé que era un lessathi normal al principio. Eiden probablemente es el único que lo supo desde el principio."

          "Así que por eso se ha interesado en él..." dice Fyron.

          "¿De qué están hablando ustedes dos?" digo.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch03a_half
  - name: b2_ch03a_weaklings
    texts:
      - source: scene_text
        paragraph: 5
        text: |-
          "Los que pelearon contra Tyrath antes suenan como un montón de debilechos."

          "Elegiría mis palabras con más cuidado si fuera tú, lessathi," dice el general goblin, en un tono serio. "Algunos de mis mejores guerreros murieron luchando contra ese dragón, y estaban bastante lejos de ser debilechos. Seguramente no me vas a decir que lo derrotaste tú solo, ¿verdad?"

          "No solo," dice Illuna. "Tuvo ayuda de cierto stillwater con el que creo que estás bien familiarizado."

          "¿Estás hablando de Eiden?" pregunta Fyron.

          "Sí," dice Illuna. "Eiden parece haber tomado un extraño interés en Barry y su grupo por alguna razón. Escuché que el stillwater apareció de la nada en medio de su batalla con el dragón, y potenció el dispositivo de estadísticas de Barry de una forma que le permitió lanzar hechizos. Esta es la razón por la que Barry pudo luchar contra Tyrath en igualdad de condiciones."

