scenes:
  - name: b2_ch03a_intro
    texts:
      - source: scene_text
        paragraph: 2
        text: |-
          El amigo de Illuna nos estaba esperando en un área no muy lejos de donde los troles nos emboscaron. Estaba apoyado en un bastón de madera, con varios troles muertos tirados en el suelo a su alrededor, y nos estudiaba atentamente mientras nos acercábamos a él.

          Su apariencia me impactó al principio, pero cuando vi a Illuna asentirle, inmediatamente me di cuenta de que él era a quien ella nos había traído a conocer. El amigo de Illuna no medía más de un metro veinte, con colmillos en lugar de dientes, una nariz torcida, orejas puntiagudas y piel verde.

          Debo admitir que no esperaba que este amigo suyo fuera un goblin, pero dado que Illuna es una banshee, supongo que no debería parecerme tan extraño que tuviera algunos aliados monstruo en Varathia. He escuchado antes que se supone que los goblins son realmente inteligentes, comparados con otros monstruos, pero este goblin en particular tiene una mirada muy astuta, y su sonrisa socarrona me recuerda a esos comerciantes escurridizos que constantemente buscan nuevas formas de estafarte. Y tampoco intenta ocultarlo.
      - source: scene_text_2
        paragraph: 2
        text: |-
          Su alta inteligencia es probablemente resultado de su avanzada edad, lo cual he oído que no es una hazaña fácil de lograr si vives tu vida como goblin. La mayoría de los goblins mueren jóvenes, ya sea por inanición, o porque los matan mientras intentan robar comida para sobrevivir. Como son considerados monstruos por otras razas civilizadas, se ven obligados a vivir de sobras, y frecuentemente necesitan recurrir a actividades ilegales como el contrabando y el robo para conseguir los bienes que necesitan. Pero la piel de este goblin está toda arrugada, lo que significa que debe haber vivido bien más de doscientos años, dado lo lentamente que se sabe que envejecen los goblins comparados con los humanos. Vivir tanto tiempo como goblin, especialmente en un lugar como Varathia, definitivamente no es algo que se pueda lograr por pura suerte.

          "¿Es este el lessathi del que hablabas, Illuna?" dice el goblin, en la Lengua Común, mientras me mira.

          "Sí," dice Illuna.

          "¿Y la chica lessathi?" pregunta el goblin. "¿También es de tu grupo?"

          "La chica lessathi aparentemente es una compañera de equipo de su división en la arena," dice Illuna. "Yo misma acabo de conocerla."

          "Hmm..." dice el goblin. "Si es una gladiadora, entonces supongo que puedo asumir con seguridad que no tiene nada que ver con el grupo de Meridith. Admito que estaba un poco preocupado al principio."

          "¡Un momento!" digo. "¿Me estás diciendo que ambos pueden saber que es lessathi con solo un vistazo?"
    effects:
      - set:
          successful_checks:
            - 'Punto de control alcanzado: Partida guardada.'
        condition: checkpoint_rich = 1
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch03a_intro2
              checkpoint_rich: 0
  - name: b2_ch03a_intro2
    texts:
      - source: scene_text
        paragraph: 3
        text: |-
          "Si tu sentido mágico es lo suficientemente agudo, puedes distinguir entre un humano y un lessathi con el mínimo esfuerzo, siempre que estudies sus auras de cerca," dice Illuna. "Sin embargo, cuando has tratado con tantos lessathi como nosotros, se vuelve algo natural."

          "¿Estás seguro de que se puede confiar en estos dos?" le pregunta el goblin a Illuna.

          Illuna me da una larga mirada antes de responderle al goblin.

          "Barry es lo suficientemente confiable," dice. "No sé mucho sobre la chica, pero no veo ninguna razón por la que no estaría de acuerdo con lo que estamos planeando hacer. Es una gladiadora, después de todo."

          "¡Oye, espera un momento!" le digo a Illuna. "Si estamos hablando de confianza, entonces la misma pregunta va para él también. ¿Cuánto estás dispuesta a confiar en este tipo? A mí me parece tan confiable como un estafador que intentaría engañarte para jugar un juego de cartas amañado, en las calles principales de Bagelberry."

          El goblin se ríe a carcajadas después de escuchar lo que tenía que decir sobre él.

          "Me agrada este," dice el goblin. "Dice exactamente lo que piensa sin hacer ningún esfuerzo por suavizar sus palabras."
      - source: scene_text_2
        paragraph: 3
        text: |-
          "Para responder a tu pregunta, Barry," dice Illuna, "no confío en él para nada. Y él tampoco confía en mí. Sin embargo, ambos somos lo suficientemente inteligentes como para saber que ninguno de los dos se beneficiaría de traicionar al otro. La información que me proporciona sobre las actividades de otras razas de monstruos es invaluable, y a cambio, lo he estado ayudando de vez en cuando, librándolo de algunos de sus enemigos, o uniéndome a él en misiones encubiertas como esta."

          "¿Y cuál es exactamente esta misión encubierta de la que hablas?" digo.

          "Hay un minotauro retenido aquí, en estos túneles," dice el goblin. "Lo llaman el campeón invicto de la arena. Se supone que deberías pelear contra él en la segunda ronda, siempre que sobrevivas a la primera. Quiero hacerle una oferta."

          "¿Qué oferta?" pregunto.

          "Le ofreceré su libertad, si acepta unirse a mi campamento goblin y ser parte de mi ejército," dice el goblin.

          "¿Tienes un ejército?" le pregunto, confundido. "Pensé que eras solo un goblin cualquiera que actuaba como informante de Illuna."

          El goblin se ríe de nuevo.

          "¿De verdad no hay límite para tu franqueza y tu falta de respeto?" dice el goblin.

          "El goblin con el que estás hablando es Fyron, el general de todos los goblins libres," dice Illuna, en su habitual tono indiferente. "Está en la cima de la jerarquía de todos los goblins de Varathia que no están bajo el dominio de Tyrath."
      - source: scene_3
        paragraph: 2
        text: |-
          "¿Tyrath?" pregunto. "¿Te refieres al dragón contra el que luché en mi segundo día aquí?"

          "El mismo y único," dice Illuna.

          "Estoy intrigado," dice Fyron, mientras se acaricia la barbilla y me mira. "No puedo decir que haya oído de muchos seres que pelearon contra Tyrath y vivieron para contarlo. ¿Cómo exactamente lograste escapar de su ira?"
    choices:
      - position: 1
        text: ¿Quién dijo que escapé?
        effects:
          - set:
              current_scene: b2_ch03a_escaped
      - position: 2
