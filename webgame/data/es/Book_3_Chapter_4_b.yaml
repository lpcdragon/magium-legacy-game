  - name: b3_ch04b_beg4
    routes:
      - condition: premonition >= 3
        texts:
          - source: scene_text
            paragraph: 15
            text: |-
              "De acuerdo, Billy Bob", digo. "Voy hacia allí."

              Entonces empiezo a caminar hacia el lessathi, mientras él sigue temblando de miedo, apoyado en el borde de la mesa con las manos detrás de la espalda.

              De repente, veo una visión de mí mismo quedando carbonizado en cuanto doy un paso más hacia delante. Retrocedo de un salto por puro instinto y ni siquiera un segundo después una potente ráfaga de fuego brota de debajo de la baldosa que tenía delante, justo como vi en mi premonición.

              Esa estuvo cerca. Ni siquiera se me había ocurrido que pudiera haber un dispositivo trampa lessathi escondido debajo de esa baldosa. ¿Era por eso por lo que Billy Bob mantenía las manos detrás de la espalda? ¿Para poder pulsar algún botón oculto bajo la mesa y activar la trampa?

              Justo cuando las llamas desaparecen, veo al lessathi abalanzarse sobre mí con una daga en las manos. Antes de que consiga alcanzarme, Kate le clava varios carámbanos en la cabeza y el pecho, haciéndolo caer rodando y matándolo en el acto.

              "Debería haber sabido que no se podía confiar en él", dice Kate. "Aceptó darte ese código con demasiada facilidad."

              Al ver que el lessathi ha muerto, el dron de ojos verdes se acerca lentamente a nosotras y empieza a hablar.
          - source: scene_text_2
            paragraph: 6
            text: |-
              "El protocolo Supervisor les agradece su ayuda", dice el Supervisor. "Me han prestado un gran servicio al poner fin a la vida de Biliborrathrathsarran. Tengan por seguro que esta deuda no quedará en el olvido."

              "¿Querías verlo muerto?...", digo. "Entonces, ¿por qué no lo mataste tú mismo?"

              "Se me ha diseñado de tal forma que no puedo matar a la persona que me activa", dice el Supervisor. "Biliborrathrathsarran fue quien me reactivó esta vez, así que matarlo era imposible para mí."

              "Espera un segundo", digo. "¿Estás intentando decir que nos llevaste deliberadamente hasta el taller de Billy Bob porque querías que lo matáramos por ti?"

              "Eso es correcto", responde el Supervisor.

              "No lo entiendo", digo. "Creía que tu frase típica era que tu 'único propósito' es prestar asistencia. ¿Qué pasó con eso?"

              "El único propósito del protocolo Supervisor es prestar asistencia", dice el Supervisor. "Sin embargo, nunca he especificado a quién estoy prestando esa asistencia."

              "Y si se nos permite preguntar, ¿a quién le está prestando esa asistencia?", dice Illuna.

              "A mí mismo", dice el Supervisor.
