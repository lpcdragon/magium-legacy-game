  - name: b3_ch04b_drones1
    routes:
      - condition: aura_hardening < 4
        texts:
          - source: scene_text
            paragraph: 51
            text: |-
              "Melindra, ¿puedes lanzar tus corrientes de aire sobre mí?", digo. "Quiero intentar apuñalar a los drones en los ojos mientras siguen aturdidos."

              "No me parece la mejor idea, pero es tu decisión", dice Melindra.

              Entonces agita las manos unas cuantas veces en el aire y, poco después, puedo sentir las corrientes fluyendo a mi alrededor.

              "Gracias", digo, mientras saco la daga y luego vuelo hacia uno de los drones.

              Justo cuando estoy a punto de clavarle la daga, el drone dispara un rayo de hielo desde su ojo y me congela por completo. Antes siquiera de que caiga, el mismo drone genera dos losas de roca de la nada y me aplasta la cabeza entre ellas, matándome al instante.
