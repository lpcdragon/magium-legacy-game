              "Su historia cuadra", dice el hombre. "Vamos, vayamos a tomar una cerveza antes de irnos a casa. Con un poco de suerte todavía encontraremos alguna taberna abierta a estas horas."
          - source: scene_text_2
            paragraph: 20
            text: |-
              Los tres hombres se dan la vuelta y se alejan poco a poco de nosotras, hasta que dejamos de verlos.

              "Eso fue increíble...", dice Kate, en cuanto los tres guardias quedan fuera de alcance auditivo. "¿Vieron lo rápido que se creyeron esa mentira tan obvia? ¡Es como si esos hombres hubieran perdido el sentido común en el mismo instante en que oyeron hablar a Barry!"

              "No entiendo lo que pasó", escribe Leila. "El aura de Barry estaba calmada, pero cualquiera habría podido ver que no decía la verdad solo por la forma en que hablaba. Si además tenemos en cuenta que las razones que dio eran completamente ridículas, estoy empezando a pensar que esta estadística de Farol hace algo más que solo calmar el aura."

              "¿Ninguna de ustedes notó cómo el aura de Barry envolvía a los tres guardias mientras hablaba?", dice Melindra. "No soy ninguna experta, pero apostaría a que eso tuvo algo que ver con su lapsus temporal de juicio. Aun así, dudo muchísimo que una técnica así pudiera funcionar con magos, o con cualquiera que sea razonablemente competente controlando su aura, así que Barry, quizá la próxima vez deberías plantearte decir una mentira que al menos sea algo creíble. ¿No te parece?"
          - source: scene_3
            paragraph: 9
            text: |-
              "Sí, sí", digo. "Me dejé llevar un poco. Culpa mía."

              "Entonces, ¿por dónde vamos?", pregunta Flower.

              "Bueno, los guardias se fueron por la derecha, así que seguramente ese es el camino que lleva a la salida", dice Breynan. "Queremos evitar ir por allí a menos que estemos preparadas para luchar contra todos los guardias de este lugar, así que probablemente deberíamos ir hacia la izquierda."

              "Me parece bien", dice Melindra. "Pues a la izquierda."

              Todas giramos a la izquierda y seguimos caminando hasta llegar a una puerta al final del corredor. En cuanto la abrimos y entramos en el siguiente pasillo, Melindra nos dice que ha detectado una escalera que sube un poco más adelante. Giramos a la derecha, luego otra vez a la derecha, y cuando llegamos a las escaleras empezamos a subirlas despacio, mientras dependemos de Melindra para que nos diga si hay guardias siguiéndonos o no.

              Conseguimos subir las escaleras sin problemas, y luego atravesamos otro corredor largo antes de empezar a dirigirnos hacia la siguiente escalera que conduce a uno de los niveles superiores.
