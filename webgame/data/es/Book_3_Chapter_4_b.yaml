                  chapter_load: 1
                  storyboard_controls: Jump to frame "Save load game"
                condition: is_dead = 1
          - position: 3
            text: Cargar partida
            effects:
              - set:
                  storyboard_controls: Jump to frame "Save load game"
                condition: is_dead = 1
      - condition: magical_sense >= 4
        texts:
          - source: scene_text
            paragraph: 50
            text: |-
              Hay algo en la forma en que la magia fluye por la sala que de repente me recuerda a una vieja memoria que creía olvidada desde hacía mucho tiempo. Hace unos años hablaba con un ermitaño al que todo el mundo consideraba loco, y siempre me repetía que la gente está aprendiendo magia de la manera equivocada, y que nadie lo escuchaba cuando sugería que las academias de magia deberían reestructurarse por completo para seguir sus enseñanzas. El principal punto de conflicto entre él y el resto de los eruditos era su afirmación de que las imperfecciones en las técnicas mágicas son absolutamente necesarias si quieres crear un hechizo perfecto. La contradicción obvia de esa idea hacía que todo el mundo lo descartara como a un viejo senil, pero su teoría era que cuanto más se acerca una técnica a la perfección, más predecible se vuelve, y más fácil resulta contrarrestarla.

              Al ver la manera perfecta en que estas máquinas están ejecutando sus hechizos, creo que por fin empiezo a entender lo que aquel ermitaño quería decir. Puedo decir exactamente qué están intentando hacer, y aunque estén combinando diez hechizos diferentes al mismo tiempo, la forma en que mueven los flujos de las auras es tan de manual que me resultaría imposible no reconocer todos y cada uno de ellos.
          - source: scene_text_2
            paragraph: 29
            text: |-
              El corazón me late a toda velocidad. La rapidez con la que estoy descifrando cada uno de los hechizos resulta abrumadora, y siento como si el tiempo se hubiera frenado casi hasta detenerse para permitirme tener todos estos pensamientos cruzándose por mi cabeza al mismo tiempo. Parece que hubieran pasado minutos enteros, pero en realidad no creo que hayan sido más que unos pocos segundos. El camino que tengo delante está claro. Sé lo que tengo que hacer.

              "¡Tenemos que interrumpir el flujo del hechizo!", les digo a todos los que me rodean, hablando tan rápido como puedo, mientras la energía mágica dentro de la jaula se vuelve tan densa que casi se puede palpar. "Necesito que todo el que sea mago lance el hechizo más simple que tenga cada vez que levante la mano derecha. No importa qué hechizo sea, siempre que puedan lanzarlo en un abrir y cerrar de ojos. No tengo tiempo para explicar por qué. ¡Solo confíen en mí!"

              Los demás se miran entre sí durante un segundo, pero luego vuelven a mirarme y me hacen un leve gesto de asentimiento. Espero dos segundos y levanto la mano derecha. Al mismo tiempo, Kate crea un pequeño cubo de hielo, Flower lanza una bolita de fuego al aire, Illuna esparce un poco de agua por el suelo, Breynan conjura un orbe de luz y Melindra hace girar unas corrientes de aire sobre la palma de su mano.
          - source: scene_3
            paragraph: 12
            text: |-
              Entonces bajo la mano y todas detienen sus hechizos, esperando mi siguiente señal. Cinco segundos después, vuelvo a levantar la mano, y todas lanzan los mismos hechizos que antes, mirando con ansiedad a su alrededor para ver si algo ha cambiado. El aire sigue pesado, pero no parece que el hechizo de los drones haya avanzado en modo alguno desde que nuestras magas empezaron a lanzar sus propios hechizos. Sigo prediciendo el ritmo del flujo mágico de los drones usando cada dato que conozco sobre cómo se supone que deben lanzarse sus hechizos. Con ayuda de mi estadística de Sentido mágico, por fin consigo detectar los flujos lo bastante bien como para poner en práctica toda la teoría mágica que he aprendido.

              Sigo levantando la mano en el momento exacto, y mis amigos siguen obedeciendo mis instrucciones. Cuando levanto la mano por octava vez, la presión a nuestro alrededor desaparece por completo de repente, y parece que el hechizo que estaban lanzando los drones ha quedado cancelado de manera permanente. Los drones ahora mismo no se están moviendo en absoluto, como si estuvieran aturdidos.
