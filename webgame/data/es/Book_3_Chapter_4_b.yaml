      - condition: strength < 3 AND aura_hardening >= 4
        texts:
          - source: scene_text
            paragraph: 53
            text: |-
              Recojo una piedra del suelo y se la lanzo a uno de los drones.

              En lugar de golpearlo, la piedra simplemente rebota contra la barrera mágica que rodea a la bola metálica, sin hacerle absolutamente ningún daño. Intento arrojarle unas cuantas piedras más, pero el resultado es el mismo.

              "Barry, ¿qué estás haciendo?...", me pregunta Kate.

              "No funciona", digo. "Creo que necesito acercarme más. Melindra, ¿puedes lanzar tu hechizo de corrientes de aire a mi alrededor para que pueda volar hasta ellos?"

              "A mí eso me parece una idea bastante mala, pero es tu decisión", dice Melindra.

              Entonces agita las manos unas cuantas veces en el aire y, poco después, puedo sentir las corrientes fluyendo a mi alrededor.

              "Gracias", digo, mientras recojo unas cuantas piedras más del suelo y vuelo hacia el drone al que había estado atacando antes.

              Primero intento lanzarle una piedra desde unos cuatro metros de distancia. No pasa nada. Luego pruebo con otra desde unos dos metros. Sigue sin dar resultado. Estoy seguro de que esto funcionará si me acerco un poco más.
          - source: scene_text_2
            paragraph: 32
            text: |-
              Justo cuando estoy a punto de lanzar la tercera piedra, el drone dispara un rayo de hielo desde su ojo, que me envuelve por completo. En lugar de congelarme, sin embargo, lo único que consigue es congelar el aura endurecida que me rodea, lo que significa que el único efecto real es que siento un poco de frío. Decido abandonar el plan de las piedras y saco la daga en su lugar. Mi arma atraviesa su barrera sin problemas y consigo apuñalarlo repetidas veces en el ojo, hasta que su hélice deja de funcionar y la bola metálica cae al suelo.

              Así que el drone sí que era débil contra ataques físicos... Eso significa que quizá pueda acabar con el resto de los drones del mismo modo. Solo tengo que ser un poco más cuidadoso con la manera en que me acerco a ellos.

              Vuelo hacia otro de los drones, amago un ataque con mi daga y luego retrocedo volando justo cuando la bola metálica me dispara un rayo de fuego. En cuanto termina su ataque, vuelvo a lanzarme hacia ella e intento apuñalarla con todas mis fuerzas. Esta vez, sin embargo, la punta de mi daga se detiene contra la barrera que rodea al drone, y esa misma bola metálica parece estar creando ahora dos losas de roca con las que quiere aplastarme la cabeza.
          - source: scene_3
            paragraph: 13
            text: |-
              "¡Barry, atrás!", dice Kate, mientras lanza un carámbano directo al ojo del drone, haciéndolo caer al suelo y haciendo desaparecer también las losas de roca.

              "¡Ah, ya lo entiendo!", digo. "¡Les cuesta cambiar entre sus barreras defensivas! Parece que una de sus barreras es más fuerte contra ataques físicos, mientras que la otra es más fuerte contra ataques mágicos, pero no pueden usar las dos al mismo tiempo. Ya saben lo que eso significa, ¿verdad?"

              Entonces saco la ballesta, mientras Kate e Illuna preparan sus hechizos. Antes de que los otros dos drones tengan tiempo de defenderse, los tres les disparamos simultáneamente con virotes de ballesta, lanzas de agua y carámbanos, destruyendo las bolas metálicas en cuestión de segundos.
