        paragraph: 10
        text: |-
          "No", le digo al lessathi sin más, y luego le disparo en la cabeza con la ballesta, matándolo al instante.

          Al ver lo ocurrido, Kate sacude la cabeza con desaprobación.

          "¿Para eso lo obligaste a suplicar por su vida?", me pregunta Kate, frunciéndome el ceño. "¿Solo para matarlo después?"

          "Sí", digo, mientras guardo la ballesta en la mochila con toda calma. "Más o menos."

          Al ver que el lessathi ha muerto, el dron de ojos verdes se acerca lentamente a nosotras y empieza a hablar.
