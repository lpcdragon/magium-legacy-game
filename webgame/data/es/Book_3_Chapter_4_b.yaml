              Al girarnos, vemos a tres hombres con uniformes y espadas en las manos, mirándonos con sospecha. Tendré que tener muchísimo cuidado con lo que diga aquí. Una sola palabra equivocada y podrían dar la alarma antes de que tengamos tiempo de dejarlos fuera de combate.
