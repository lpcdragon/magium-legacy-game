            text: |-
              "Ese no fue un mal farol, Barry", escribe Leila con una sonrisa, mientras nos alejamos de los guardias. "Los puntos que gastaste en esa estadística no fueron en vano."

              Mientras seguimos avanzando por el corredor, acabamos llegando a otra puerta. Antes de abrirla, Melindra nos detiene para darnos unas indicaciones.

              "Hay unos cuantos guardias ahí fuera, pero están bastante lejos de la puerta", dice. "Kate y Flower, veo que las dos están suprimiendo la magia de sus auras, pero eso no basta si quieren evitar que alguien con buen Sentido mágico las detecte. Necesitan suprimir sus auras por completo, como Illuna. ¿Pueden hacerlo?"

              "Creo que sí...", dice Kate.

              "¡Lo intentaremos!", dice Flower.

              "Y lo mismo va por el resto también", dice Melindra. "Intenten mantener sus auras lo más suprimidas posible, y con un poco de suerte, quizá podamos pasar junto a esos guardias sin que nos noten."

              "Suprimir mi aura", digo. "Claro."

              Intento ocultar mi aura lo mejor que puedo, usando los ejercicios de respiración que Illuna me enseñó hace dos semanas, pero solo logro esconderla parcialmente.
        effects:
          - set:
              successful_checks:
                - '[ Verificación de Farol exitosa - nivel 2 ]'
              b3_ch4_tasked: 2
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch04b_cleaners2
  - name: b3_ch04b_business
    texts:
      - source: scene_text
        paragraph: 39
        text: |-
          "No es asunto suyo", digo.

          "¿No es asunto nuestro, eh?", dice el hombre que nos habló antes. "¿Por qué no me disculpas un momento mientras tengo una pequeña charla con uno de mis compañeros?"

          Entonces toca lo que supongo que es el transceptor que lleva en el bolsillo y grita:

          "¡Alerta de intrusos! ¡Den la alarma ahora mismo!"

          Apenas unos segundos después, un ruido de alarma ensordecedor llena todo el corredor, mientras los guardias que tenemos delante se preparan para rodearnos.

          "Todas vienen con nosotros", dice uno de los guardias. "Será mejor que no intenten resistirse."

          Antes de que ninguno tenga tiempo de reaccionar, aparecen seis látigos de agua en el aire frente a los tres hombres, enrollándose rápidamente alrededor de sus tobillos y tirándolos al suelo, de modo que se golpean la parte trasera de la cabeza contra el pavimento y pierden el conocimiento.
      - source: scene_text_2
        paragraph: 21
        text: |-
          "Debería haber hecho esto en cuanto abrimos esa puerta...", dice Illuna.

          "No te preocupes por eso", dice Breynan. "Seguro que aún tenemos tiempo de encontrar la salida antes de que el resto de los guardias se organicen para venir a recibirnos."

          "La mayoría de los guardias parecen venir por el lado derecho", dice Melindra. "Sugiero que vayamos por la izquierda."

          "Buena idea", dice Breynan. "Movámonos."

          Todas giramos a la izquierda y echamos a correr hacia la puerta al final del corredor. Una vez que la abrimos y entramos en el siguiente pasillo, Melindra nos dice que ha detectado una escalera que sube un poco más adelante. Giramos a la derecha, luego otra vez a la derecha, y cuando llegamos a las escaleras empezamos a subirlas tan deprisa como podemos, mientras oímos a lo lejos los pasos apresurados de varios guardias detrás de nosotras, acercándose poco a poco.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch04b_hearing
  - name: b3_ch04b_cleaners2
    routes:
      - condition: bluff < 3
        texts:
          - source: scene_text
            paragraph: 41
            text: |-
              Por mucho que lo intento, no consigo ocultarla por completo.

              "Mmm...", dice Melindra. "La mayoría de ustedes lo están haciendo bastante bien, pero no estoy nada segura con Barry. No puedo decir que su aura esté especialmente escondida ahora mismo. En fin... supongo que tendremos que confiar en que los guardias del siguiente corredor no sean demasiado buenos detectando auras. Probemos suerte."

              Abrimos la puerta y empezamos a avanzar hacia la izquierda, en dirección contraria a donde están apostados los guardias. Justo cuando damos los primeros pasos, oímos el grito de un hombre desde muy lejos detrás de nosotras.

              "No estoy seguro de quiénes se supone que son, pero tienen tres segundos para identificarse antes de que dé la alarma", oímos a lo lejos. "Puedo sentir su aura desde aquí mismo, y no se parece al aura de nadie que conozca."
          - source: scene_text_2
            paragraph: 23
            text: |-
              "Mierda", digo en voz baja. "¿Qué hago? ¿Le digo que soy uno de los limpiadores?"

              "Demasiado tarde", oímos gritar al hombre, y poco después un ruido atronador resuena por todo el pasillo, mientras sentimos a más de unos cuantos guardias moviéndose en nuestra dirección.

              "Y hasta aquí nuestro sigilo", dice Melindra. "Supongo que tendremos que salir corriendo. Hay unas escaleras más adelante en este corredor. Deberían ayudarnos a llegar a uno de los niveles superiores. Dénse prisa."

              Aceleramos el paso y seguimos a Melindra hasta llegar al final del corredor. Luego giramos a la izquierda y pronto alcanzamos la escalera que ella había mencionado antes. Mientras la subimos, oímos a lo lejos los pasos apresurados de algunos guardias detrás de nosotras, acercándose poco a poco.
        effects:
          - set:
              failed_checks:
                - '[ Comprobación de ocultación de aura fallida - nivel 3 ]'
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch04b_hearing
                condition: b3_ch4_tasked != 4
              - set:
                  current_scene: b3_ch04b_blades
                condition: b3_ch4_tasked = 4
      - condition: bluff >= 3
        texts:
          - source: scene_text
            paragraph: 40
            text: |-
              Cuando vuelvo a intentarlo, me doy cuenta de que de repente estoy sintiendo lo mismo que sentí cuando les estaba mintiendo a esos guardias antes. ¿Será esto también obra de la estadística de Farol?

              "Oye, eso no está nada mal, Barry", dice Melindra. "No sabía que pudieras ocultar tu aura tan bien. Muy bien, ahora que todo el mundo está lista, sigamos."

              Abrimos la puerta y empezamos a avanzar hacia la izquierda, en dirección contraria a donde están apostados los guardias. Ninguno de los guardias reacciona a nuestra presencia, lo que significa que estamos haciendo un buen trabajo ocultando las auras. Melindra nos dice que ha detectado una escalera que sube un poco más adelante en el pasillo, así que seguimos avanzando y luego giramos otra vez a la izquierda, continuando nuestro camino hasta que por fin llegamos a las escaleras de las que hablaba. Entonces empezamos a subirlas despacio, mientras dependemos de Melindra para que nos diga si hay guardias siguiéndonos o no.

              Conseguimos subir las escaleras sin problemas, y luego atravesamos otro corredor largo antes de empezar a dirigirnos hacia la siguiente escalera que conduce a uno de los niveles superiores.
        effects:
          - set:
              successful_checks:
                - '[ Comprobación de ocultación de aura exitosa - nivel 3 ]'
              b3_ch4_tasked: 4
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch04b_blades
  - name: b3_ch04b_hearing
    routes:
      - condition: hearing < 3
        texts:
          - source: scene_text
            paragraph: 42
            text: Cuando llegamos a la parte alta de las escaleras, entramos en un pasillo nuevo y empezamos a avanzar por él a toda prisa. De repente, el corredor en el que estamos se llena de corrientes eléctricas mágicas visibles incluso a simple vista. La descarga que recorre mi cuerpo es tan potente que apenas me queda un segundo de consciencia antes de que todo se vuelva completamente negro.
        effects:
          - set:
              is_dead: 1
              failed_checks:
                - '[ Comprobación de audición fallida - nivel 3 ]'
        choices:
          - position: 1
            text: Reiniciar juego
            effects:
              - set:
                  current_scene: ch1_intro1
                  storyboard_controls: Jump to frame "Chapter 1"
                condition: is_dead = 1
          - position: 2
            text: Cargar desde el último punto de control
            effects:
              - set:
                  chapter_load: 1
                  storyboard_controls: Jump to frame "Save load game"
                condition: is_dead = 1
          - position: 3
            text: Cargar partida
            effects:
              - set:
                  storyboard_controls: Jump to frame "Save load game"
                condition: is_dead = 1
      - condition: hearing >= 3
        texts:
          - source: scene_text
            paragraph: 43
            text: |-
              Justo cuando estamos a punto de llegar al final de las escaleras, oigo la voz de un guardia desde muy lejos detrás de nosotras, hablándole a uno de sus compañeros.

              "¡Están arriba de las escaleras!", dice el hombre. "¡Activa la trampa! ¡Ahora!"

              "¡Paren!", les grito a mis amigos que corren a mi lado. "¡No sigan avanzando!"

              Todas nos detenemos justo antes del final de la escalera, desde donde tenemos una vista perfecta del siguiente corredor a través de un arco de piedra. Apenas unos segundos después, todo el pasillo que tenemos delante se llena de corrientes eléctricas mágicas visibles incluso a simple vista. Por la pinta que tienen, apuesto a que habríamos muerto al instante si no hubiéramos dejado de correr cuando lo hicimos. Después de esperar unos diez segundos más, las corrientes por fin se disipan y el corredor vuelve a ser seguro para cruzarlo.

              "¿Han muerto?", oigo la voz de un hombre desde muy lejos detrás de nosotras.

              "No, no entraron en el corredor por alguna razón", dice el hombre que ordenó activar la trampa. "¡Intenta encenderla otra vez!"
          - source: scene_text_2
            paragraph: 24
            text: |-
              "No puedo activarla otra vez de inmediato", dice el otro hombre. "¡Necesita cargarse un poco antes!"

              "Acabo de oír a los guardias decir que la trampa necesita recargarse antes de que puedan usarla otra vez", les digo a mis amigos. "Podemos pasar ahora. Es seguro."

              "Entonces, rápido", dice Kate.

              "¿Puedes oírlos desde tan lejos?...", me pregunta Breynan, mientras cruzamos deprisa el corredor con la trampa eléctrica desactivada.

              "Sí, es gracias a mi dispositivo de estadísticas", digo. "Pero si más adelante nos topamos con otra de estas trampas lessathi indetectables, puede que la próxima vez no tengamos tanta suerte. Melindra, ¿no hay alguna forma de que pudieras detectar esto con tu Sentido mágico?"

              "Estos son dispositivos lessathi creados específicamente para no ser detectados", dice Melindra. "Incluso Arraka tendría problemas para encontrar algo así. Lo único que podemos hacer es ir con muchísimo cuidado y esperar lo mejor.

              "Me temía que fueras a decir algo así", digo.
        effects:
          - set:
              successful_checks:
                - '[ Comprobación de audición exitosa - nivel 3 ]'
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch04b_blades
                condition: is_dead = 0
  - name: b3_ch04b_blades
    routes:
      - condition: b3_ch4_tasked <> 2 AND b3_ch4_tasked <> 3 AND b3_ch4_tasked <> 5
        texts:
          - source: scene_text
            paragraph: 44
            text: |-
              "Breynan, ¿intentaste otra vez contactar con tu amigo de la sala del teletransportador?", dice Melindra, mientras seguimos caminando por el pasillo. "Quizá puedas alcanzarlo desde aquí."

              "Ya lo intenté, pero sigue sin responder", dice Breynan. "Quizá tengamos más suerte si seguimos subi--"

              "¡Atención a todos los guardias de la torre!", oímos de repente la voz de Billy Bob a través de un amplificador de voz mágico sujeto a una pared. "Mis sensores están detectando intrusos en la torre. Parece que intentan llegar a los niveles superiores. Activaré la trampa cercana a la escalera que sale de la sección B98-6C. Si se dan prisa, deberían poder acorralarlos con bastante facilidad. Será mejor que no los dejen escapar..."

              Justo cuando el lessathi deja de hablar, un ruido de alarma atronador llena el pasillo y luego toda la sección delante de la escalera a la que nos dirigíamos se vuelve completamente infranqueable, porque un centenar de cuchillas metálicas giratorias emerge del suelo, de las paredes y del techo, sin dejar ningún hueco por el que podamos pasar sin quedar cortadas en pedazos.
          - source: scene_text_2
            paragraph: 25
            text: |-
              "No... no estoy seguro de cómo se supone que vamos a superar esta...", dice Breynan.

              "¿Flower no podría hacerlas explotar o algo así?", digo.

              "Esas cuchillas están hechas de acero elfo y están fuertemente encantadas", dice Illuna. "Ninguno de nuestros hechizos es ni remotamente lo bastante potente como para dañarlas."

              "Podría intentar congelar las cuchillas giratorias en su sitio con uno de mis hechizos", dice Kate. "Probablemente no durará mucho, pero tal vez nos dé el tiempo justo para llegar a las escaleras."

              "¿Y qué hay de Rose?", nos pregunta Flower. "¡Podríamos pedirle que congele el tiempo para todo el mundo excepto para nosotros hasta que consigamos pasar las cuchillas!"

              "La última vez que hablé con ella, Rose dijo que no había hecho ningún progreso importante con su entrenamiento para congelar el tiempo", digo. "No creo que pueda ayudarnos."

              "La última vez que hablaste con ella, Rose dijo que había tenido una premonición en la que me veía a punto de morir", dice Illuna. "Es posible que en realidad haya progresado un poco más de lo que te ha contado hasta ahora. Ya sabemos que no hay suficientes paredes de seredium entre ella y nosotras como para bloquear nuestra comunicación por completo, dado que está en la superficie, así que contactar con ella podría valer la pena."
        choices:
          - position: 1
            text: Intentar contactar con Rose.
            effects:
              - set:
                  current_scene: b3_ch04b_contact
          - position: 2
            text: Sugerir que sería mejor que Kate congelara las cuchillas giratorias.
            effects:
              - set:
                  current_scene: b3_ch04b_froze
