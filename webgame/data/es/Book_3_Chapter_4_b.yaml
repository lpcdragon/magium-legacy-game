          - set:
              current_scene: b3_ch04b_guarantee2
  - name: b3_ch04b_guarantee2
    routes:
      - condition: ch11_saved_rose = 0
        texts:
          - source: scene_text
            paragraph: 33
            text: |-
              "¿Estás segura de eso?...", digo. "Creía que antes habías dicho que en tu estado actual apenas podías mantenerte en pie."

              "Oh, eh... ¡Seguro que no pasa nada!", dice Flower, con un ligero titubeo en la voz. "Solo son unos cuantos saltos, aquí y allá. ¡Nada demasiado complicado!"

              Luego da unos pasos hacia delante y se prepara para saltar.

              "¡Muy bien, allá voy!", dice, y da un pequeño salto hacia una de las baldosas del suelo.

              La baldosa se hunde bajo su peso, pero no parece pasar nada malo.

              "¡Lo sabía!", dice Flower. "¡Ya he visto este mismo tipo de suelo al menos tres veces antes! Debe de haberlo diseñado la misma persona. Vale, así que la siguiente baldosa debería estar por aquí..."

              Da dos pasos hacia su derecha, y la baldosa bajo sus pies vuelve a hundirse en el suelo.

              "¡Perfecto!", dice Flower. "Creo que ya le pillé el truco. ¡Desactivaré esta trampa en un abrir y cerrar de ojos!"

              Entonces empieza a saltar sobre varias baldosas una tras otra, acercándose cada vez más al final del pasillo.
          - source: scene_text_2
            paragraph: 18
            text: |-
              Justo cuando parece que está a punto de conseguirlo, de repente le da un fuerte dolor de cabeza y pierde el equilibrio. Intenta recuperar apoyo con rapidez, pero es demasiado tarde, y uno de sus pies acaba cayendo sobre una baldosa equivocada. En cuanto la baldosa se hunde, la entrada que queda detrás de nosotras se cierra de inmediato, y el techo empieza a temblar con violencia mientras emite un ruido atronador. Cuando deja de temblar, empieza a bajar lentamente sobre nosotras.

              "¡Lo siento! ¡Lo siento! ¡Lo siento!", dice Flower con voz presa del pánico, mientras el techo acelera.

              "¡Tenemos que abrirnos paso a través de este muro de piedra que bloquea la entrada, y rápido!", dice Breynan. "¡Antes de que el techo--"

              Breynan no llega a terminar lo que estaba diciendo, porque el enorme bloque de piedra que forma el techo cae de repente sobre nosotras, aplastándonos a todas bajo su peso.
