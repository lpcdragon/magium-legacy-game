            effects:
              - set:
                  current_scene: b3_ch04b_ending
  - name: b3_ch04b_guarantee
    texts:
      - source: scene_text
        paragraph: 32
        text: |-
          "Sigo pensando que escuchar al Supervisor en este caso podría ser una mala idea."

          "¿Por qué piensas eso?", pregunta Illuna.

          "Bueno, en realidad no tenemos ninguna garantía de que el Supervisor esté actuando ahora mismo por voluntad propia", digo. "No olvidemos que sigue siendo una máquina. Se le puede manipular con facilidad. Breynan dijo que el Supervisor no es la marioneta de nadie, pero ¿y si Billy Bob por fin encontró una manera de obtener control total sobre él? En ese caso, no tendría más remedio que obedecer. Y dado que Breynan sí dijo que el Supervisor no está actuando como él mismo, no consigo quitarme de encima la sensación de que alguien más está moviendo los hilos y de que intenta atraernos a una trampa."

          "Eso es algo que no había tenido en cuenta...", dice Breynan. "Sí, supongo que no sería imposible que el lessathi hubiera logrado por fin tomar el control total del Supervisor. Al fin y al cabo, eso es lo que lleva intentando hacer desde que lo reactivó."

          "El protocolo Supervisor les asegura que--", empieza a decir el Supervisor, pero Breynan lo corta.

          "¡Cállate!", dice Breynan, y luego se vuelve hacia nosotras. "Sí, cuanto más habla, menos ganas me dan de confiar en él. Quizá sería mejor idea encontrar nuestra propia salida de aquí. Al menos sabemos que la puerta por la que llegó el Supervisor conduce a los niveles superiores, así que lo único que tenemos que hacer es llegar a nuestro destino sin alertar a demasiados guardias. Vale la pena intentarlo."
      - source: scene_text_2
        paragraph: 17
        text: |-
          "Entonces vamos", dice Melindra, mientras se dirige hacia la única puerta no oculta que sale de la sala. "Si los guardias nos descubren, nos ocuparemos de ello cuando llegue el momento."

          "Les aconsejo encarecidamente que reconsideren lo que están a punto de hacer", dice el Supervisor. "Una vez que crucen esa puerta, no habrá marcha atrás."

          "¿Qué se supone que significa eso?", le pregunto. "¿Algún tipo de amenaza?"

          El Supervisor no dice nada y se limita a seguir mirándome con su gran ojo verde.

          "Lo que sea", digo. "Vamos de una vez. Seguro que solo está faroleando."

          Todas cruzamos la puerta y luego subimos un tramo de escaleras, que nos lleva a un pasillo vacío cuyas paredes están hechas de seredium, aunque el techo no. La única iluminación de este corredor proviene de unas antorchas en las paredes, pero el silencio resulta un poco inquietante. ¿De verdad es normal que el corredor que conduce a una sala tan importante esté tan vacío?

          "¿Creen que ahora seguimos debajo de la torre o ya estamos por encima de la superficie?", pregunto.

          "No lo sé, pero intentaré ver si puedo contactar con Barry, en la sala del teletransportador, desde aquí", dice Breynan.

          Entonces saca su transceptor y empieza a hablarle en voz baja a su transceptor.
      - source: scene_3
        paragraph: 8
        text: |-
          "¡Barry, me oyes?", dice.

          Esperamos unos segundos, pero no recibimos respuesta.

          "Nada", dice Breynan, mientras vuelve a guardarse el transceptor en el bolsillo. "Supongo que eso significa que seguimos bajo tierra. O eso, o que las paredes de seredium son demasiado gruesas. En cualquier caso, sigamos avanzando."

          "¡Paren!", grita Flower de repente. "¡Creo que aquí puede haber trampas!"

          "Yo no estoy sintiendo ninguna trampa mágica", digo. "¿Dices que hay algún dispositivo lessathi que se activará si pasamos por aquí, o solo trampas normales?"

          "Trampas normales", dice Flower. "Hay algo en la forma en que está hecho el suelo que me recuerda al tipo de ruinas que Illuna y yo solemos visitar. Creo que tenemos que pisar las baldosas del suelo en cierto orden, o si no se activará la trampa."

          "¿No podríamos simplemente sobrevolar este pasillo con la ayuda de Melindra?", digo.

          "Si hacemos eso, la puerta al final del túnel no se abrirá", dice Flower. "Y si intentamos abrirla por la fuerza, eso también activará la trampa. No se preocupen, creo que sé qué baldosas tenemos que pisar. ¡Solo denme un segundo!"
