  - name: b3_ch04b_billy3
    texts:
      - source: scene_text
        paragraph: 8
        text: |-
          "Kate, espera, ¡no lo mates todavía!", digo.

          "¿Por qué no?", dice Kate, mientras deja de crear sus carámbanos.

          "¡Eh, Billy Bob!", digo, sacando la ballesta de mi mochila y apuntando al lessathi. "Podríamos considerar perdonarte si nos suplicas por tu vida. ¿Qué dices?"

          "¿En serio?...", me pregunta Kate.

          "Debes de haberte vuelto loco si crees que tu farol va a--", empieza a decir Billy Bob, pero lo interrumpo disparando un virote de ballesta a unos pocos centímetros de su cara.

          Cuando Billy Bob se da cuenta de lo que acaba de pasar, suelta un chillido agudo y luego grita con voz aterrorizada.

          "¡Por favor, no me maten, se los suplico!", grita el lessathi. "¡Haré lo que sea, por favor! ¡Solo perdónenme la vida!"
    choices:
      - position: 1
        text: Decirle a Kate que ya puede matarlo.
        effects:
          - set:
              current_scene: b3_ch04b_beg1
              b3_ch4_beg: 0
      - position: 2
        text: Matarlo.
        effects:
          - set:
