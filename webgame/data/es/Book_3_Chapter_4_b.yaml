  - name: b3_ch04b_contact3
    routes:
      - condition: magical_sense < 4
        texts:
          - source: scene_text
            paragraph: 49
            text: |-
              Kate, Flower e Illuna están usando ahora todos los ataques mágicos que se les ocurren, pero los drones no parecen molestarse lo más mínimo y siguen reuniendo energía para su hechizo. Tras un rato, queda claro que no hay forma de detener el ataque que se avecina, así que Melindra intenta lanzar barreras de aire individuales alrededor de cada una de nosotras, con la esperanza de que eso baste de algún modo para absorber todo el daño.

              Por desgracia, en cuanto se lanza el hechizo de los drones, enseguida nos damos cuenta de que ninguna cantidad de protección podría habernos resguardado del aluvión de ataques mágicos que se desata sobre nosotras al mismo tiempo. Era difícil decir si lo que nos mató fue el hielo, el fuego, la electricidad o cualquier otro de los distintos hechizos simultáneos, pero hizo falta menos de un segundo para que nuestros cuerpos quedaran completamente destruidos y luego se convirtieran en cenizas.
        effects:
          - set:
              is_dead: 1
              failed_checks:
                - '[ Comprobación de sentido mágico fallida - nivel 4 ]'
        choices:
          - position: 1
            text: Reiniciar juego
            effects:
              - set:
                  current_scene: ch1_intro1
                  storyboard_controls: Jump to frame "Chapter 1"
                condition: is_dead = 1
          - position: 2
