        texts:
          - source: scene_text
            paragraph: 24
            text: |-
              "No. Si lo quieres muerto, mátalo tú mismo."

              "Se me ha diseñado de tal forma que no puedo matar a la persona que me activó", dice el Supervisor. "Biliborrathrathsarran fue quien me reactivó esta vez, así que matarlo es imposible para mí."

              "Mala suerte", digo.

              "¿Es realmente una línea de acción prudente para ustedes?", dice el Supervisor. "Si su propósito es matar al rey de Ollendor, eliminar a la persona que por sí sola logró reactivar todas las reliquias lessathi tecnológicamente avanzadas de la ciudad debería convenirles."

              "Si lo mato, no quedará nadie para controlarte", digo. "En este momento creo que podrías ser más peligroso que el lessathi. No puedo arriesgarme a dejarte libre."

              "Le aseguro que no soy su enemigo", dice el Supervisor.

              "Tus palabras no significan nada", digo. "Solo estás diciendo todo esto porque sabes que, en cuanto Billy Bob despierte y recuerde cómo lo traicionaste, lo primero que hará será desactivarte. Y aparte de eso, también intentaste manipularnos para que matáramos al lessathi sin contarnos tus verdaderas intenciones, lo que te hace muy poco digno de confianza. Lo siento, pero no voy a matar al lessathi por ti, y esa es mi decisión final."
          - source: scene_text_2
            paragraph: 11
            text: |-
              "En ese caso, me temo que no puedo permitirles abandonar esta sala", dice el Supervisor. "Debo pedirles que permanezcan aquí y esperen a que los guardias las arresten, o de lo contrario los seis drones que las rodean en este momento se verán obligados a abrir fuego sobre--"

              Antes de que el Supervisor pueda decir una sola palabra más, Kate lanza docenas de carámbanos contra los seis drones de ojos rojos que flotaban a nuestro alrededor, destruyéndolos a todos en cuestión de segundos. Debió de empezar a preparar esos carámbanos en cuanto rechacé la oferta del Supervisor.

              "Rectificación", dice el Supervisor. "Los treinta drones que estoy enviando ahora mismo a esta sala serán los que se verán obligados a abrir fuego sobre ustedes."

              "Sí, mucha suerte con eso", digo. "Para entonces ya nos habremos largado. Breynan, ¿puedes llamar al del teletransportador para que nos saque de aquí?"

              "Sí, lo estoy llamando ahora mismo", dice Breynan, mientras saca su transceptor del bolsillo.
          - source: scene_3
            paragraph: 4
            text: |-
              Justo cuando Breynan empieza a contactar con el tipo de la sala del teletransportador, un ruido muy fuerte inunda la sala de repente, y supongo que es una alarma destinada a advertir a todos los guardias de la torre de nuestra presencia.

              "¡Barry, me oyes?", grita Breynan a su transceptor.

              "¡Santos dioses, qué ruido infernal es ese?", dice el operador del teletransportador. "¿Y dónde han estado todo este tiempo? ¿Saben qué? ¡No importa! Hay mucha gente esperando en la cola para teletransportarse. Parecen bastante calmadas, así que iniciaré la Teletransportación de regreso ahora mismo. ¿Están listas?"

              "Sí, estamos listas", dice Breynan. "¡Teletranspórtanos ahora!"

              "Entendido", dice el operador del teletransportador, y entonces una luz blanca empieza a envolvernos mientras nuestros cuerpos vibran con fuerza.

              "Adiós, Supervisor", digo, saludando con la mano al dron de ojos verdes mientras nos teletransportan. "No creo que volvamos a vernos dentro de mucho tiempo."
