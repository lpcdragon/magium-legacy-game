  - name: b3_ch04b_froze
    texts:
      - source: scene_text
        paragraph: 46
        text: |-
          "Los poderes de Rose son demasiado arriesgados", digo. "Aunque de verdad pueda congelar el tiempo por sí sola, bastaría un solo segundo de pérdida de control sobre su hechizo para que acabáramos convertidas en carne picada. Yo digo que vayamos con el plan de Kate y dejemos que congele las cuchillas con su magia. Al menos así tendríamos una posibilidad decente de salir vivas de aquí."

          "Si Kate cree que puede hacerlo, no voy a oponerme", dice Illuna. "Solo quería asegurarme de que todo el mundo supiera que había otras opciones."

          "Intentaré congelar solo las cuchillas y no el suelo, para que no resbalemos por accidente", dice Kate.

          Entonces pone las manos delante de ella y un poderoso rayo de hielo sale disparado de sus palmas, congelando todos y cada uno de los mecanismos que mantenían las cuchillas en movimiento.

          "¡Rápido!", dice Melindra. "¡A las escaleras!"

          Intentamos movernos tan deprisa como podemos, pero no hay ningún camino fácil para evitar todos los obstáculos. Mientras luchamos por encajar en el estrecho espacio entre la multitud de cuchillas afiladas congeladas, de repente oímos varios crujidos en el hielo de Kate y, antes siquiera de que tengamos tiempo de entender qué está pasando, todas las cuchillas vuelven a girar al mismo tiempo, cortándonos a todas en cientos de pedazos.
    choices:
      - position: 1
        text: Reiniciar juego
        effects:
