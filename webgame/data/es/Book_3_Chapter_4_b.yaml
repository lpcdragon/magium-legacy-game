    texts:
      - source: scene_text
        paragraph: 11
        text: |-
          "¿Harás cualquier cosa?", le pregunto a Billy Bob. "Entonces, ¿qué tal si me das el control total de todos los dispositivos de Ollendor? Deberías poder hacerlo, ¿no?"

          "¡Claro!", dice Billy Bob en tono de pánico. "Hay un panel justo aquí debajo de esta mesa, y si introduces el código correcto, te dará el control total de todo. Ven aquí y yo... te diré el código que necesitas."

          "¿Está diciendo la verdad?", le pregunto a Leila.

          "No puedo saberlo", escribe Leila. "Está muy asustado, así que el flujo de su aura está completamente descontrolado."
    choices:
