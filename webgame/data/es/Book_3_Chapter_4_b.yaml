  - name: b3_ch04b_stuck
    texts:
      - source: scene_text
        paragraph: 58
        text: |-
          "¡Eh, Supervisor, era eso todo?!", grito hacia la dirección por la que el dron de ojos verdes abandonó la sala. "¿No tienes más drones que enviarnos?"

          No hay respuesta.

          "Intentaré llamar otra vez a Barry", dice Breynan. "Parece que los guardias se han quedado atascados detrás de ese corredor con las cuchillas giratorias. No creo que sepan cómo desactivar la trampa. Eso debería darnos tiempo suficiente para calmarnos y así poder teletransportarnos fuera de aquí con seguridad."

          Entonces vuelve a sacar su transceptor, se lo acerca a la boca y lo toca una vez.

          "¿Barry, sigues ahí?", dice Breynan.

          "¡Sí, sí, aquí estoy!", dice el operador del teletransportador. "¿Cómo demonios consiguieron perder la señal tan rápido? En realidad, no importa. Hay mucha gente esperando en la cola para teletransportarse, así que voy un poco con prisa. Parecen bastante calmadas, así que iniciaré la Teletransportación de regreso ahora mismo. ¿Están listas?"

          "Sí, estamos listas", dice Breynan. "¡Teletranspórtanos ahora!"

          "Entendido", dice el operador del teletransportador, y entonces una luz blanca empieza a envolvernos mientras nuestros cuerpos vibran con fuerza.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch04b_ending
  - name: b3_ch04b_ending
    texts:
      - source: scene_text
        paragraph: 59
        text: |-
          Lo siguiente que sabemos es que todas estamos de pie junto al dispositivo de teletransportación de la base rebelde, con el operador del teletransportador sentado tras su panel de control, como siempre. Lo que sí resulta un poco inusual es el número relativamente grande de personas que hay en la sala aparte de nosotras.

          "¡Muy bien, todo el mundo a los túneles!", dice el operador del teletransportador. "Pueden mantener sus conversaciones en otra parte. ¡Aquí no hay sitio suficiente para que siga teletransportando gente! ¡Muévanse, vamos!"

          "¿A qué viene todo este alboroto?...", pregunta Breynan, mientras el resto de la gente se dispone a salir de la sala.

          "¿Cómo que no lo saben?", pregunta el operador del teletransportador, horrorizado. "¿Es que literalmente han estado viviendo debajo de una roca durante las últimas horas?"

          "Todos vivimos debajo de rocas, Barry", dice Breynan. "Nuestra base está en una caverna subterránea. Dime, ¿qué pasó mientras estábamos fuera?"

          "¡¿Qué no pasó?!", dice el operador del teletransportador. "¡La ciudad entera está en cierre total! Nadie puede salir, nadie puede entrar. ¡La gente ni siquiera puede salir de sus casas sin que los guardias la arresten! ¡Es terrible! Estamos teletransportando de vuelta a todos nuestros agentes y a algunas de sus familias. No tenemos ni idea de lo que va a hacer a continuación el rey. ¡Todo es un caos absoluto!"
      - source: scene_text_2
        paragraph: 34
        text: |-
          "¿Pero por qué?", pregunta Breynan. "¿Qué podría haber llevado al rey a tomar unas medidas tan drásticas?"

          "¡Oh, pues yo te lo diré!", dice el operador del teletransportador, mientras aporrea unos cuantos botones y ahora un nuevo grupo está siendo teletransportado dentro de la sala. "¡El rey anunció sus razones en cuanto inició el cierre total! Dijo que su hermano había muerto en Thilias y que los culpables se esconden en esta misma ciudad ahora mismo. ¡Esa es la razón de todo este cierre! ¡Para que la guardia de la ciudad pueda registrar todas las casas y ver si alguien está ocultando a los culpables!"

          "¿El hermano del rey fue asesinado en Thilias?", pregunto, fingiendo ignorancia. "Pero... ¿cómo se enteró de eso?"

          "¿De verdad hace falta que lo preguntes?", dice el operador del teletransportador. "Solo hay una persona que representa al rey en Thilias y que habría estado allí para presenciar los acontecimientos."

          "Quieres decir..."

          "Sí", dice el operador del teletransportador. "Ha vuelto el embajador de Thilias."
    choices:
      - position: 1
        text: Siguiente capítulo
        effects:
          - set:
              next_chapter_crash: 1
              current_scene: b3_ch05a_intro
