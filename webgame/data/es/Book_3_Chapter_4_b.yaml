  - name: b3_ch04b_drones3
    routes:
      - condition: perception < 2
        texts:
          - source: scene_text
            paragraph: 55
            text: |-
              Saco la ballesta e intento dispararle a uno de los drones en el ojo. Igual que pasó antes con los carámbanos de Kate, mi virote de ballesta rebota simplemente contra la barrera mágica de la bola metálica, dejándola completamente ilesa.

              Esperaba que los drones pudieran ser débiles contra ataques físicos, pero supongo que no. Supongo que no hay otra forma de derrotarlos que seguir lanzándoles ataques mágicos hasta que sus barreras fallen.

              "Intenten dispararles más proyectiles", les digo a las demás. "Sus barreras acabarán cediendo en algún momento."

              "Esperemos que tengas razón", dice Kate.

              Entonces empieza a atacar a los drones junto con Flower, Illuna y Breynan. Las bolas metálicas no reaccionan, pero tampoco parecen estar sufriendo daño alguno. Después de que sus barreras absorban ataque tras ataque, las luces anaranjadas de los ojos de todos los drones empiezan a parpadear repetidamente al mismo tiempo, mientras emiten unos ruidos muy extraños y agudos al unísono.

              "¡Advertencia!", oímos decir a los cuatro drones con voces metálicas. "Imposible mantener la barrera. Iniciando secuencia de autodestrucción."

              "Esto no suena nada bien", dice Breynan. "¡Necesitamos una barrera, rápido, antes de que--"

              Breynan no llega a terminar la frase, porque todos los drones explotan al mismo tiempo, haciendo volar el corredor entero por los aires y matándonos en el acto.
        effects:
          - set:
              is_dead: 1
              failed_checks:
                - '[ Comprobación de observación fallida - nivel 2 ]'
