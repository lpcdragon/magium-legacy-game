  - name: b3_ch04b_billy4
    texts:
      - source: scene_text
        paragraph: 13
        text: |-
          "Kate, espera, ¡no lo mates todavía!", digo.

          "¿Por qué no?", dice Kate, mientras deja de crear sus carámbanos.

          "Oye, Billy Bob", digo. "¿Dónde está la sala de control de esta torre? ¿Cómo desactivamos las cadenas de la sala con todos los prisioneros? ¡Habla y quizá vivas un día más!"

          "¡¿Me tomas por un idiota?!", grita Billy Bob. "¿Crees que estaría dispuesto a deshacer todo el trabajo que he hecho durante estos últimos años solo por una amenaza tan patética? ¡Prefiero morir antes que contarles nada sobre la sala de control!"

          "Entonces muere", dice Kate con frialdad, mientras le clava varios carámbanos al lessathi en la cabeza y el pecho, matándolo en el acto.

          Al ver que el lessathi ha muerto, el dron de ojos verdes se acerca lentamente a nosotras y empieza a hablar.
