              b3_ch4_beg: 1
      - position: 3
        text: Intentar que el lessathi me dé el control total de todos los dispositivos de Ollendor.
        effects:
          - set:
              current_scene: b3_ch04b_beg3
              b3_ch4_beg: 2
  - name: b3_ch04b_beg1
    texts:
      - source: scene_text
        paragraph: 9
        text: |-
          "Muy bien, ¡ahora puedes matarlo!", le digo a Kate.

          "Tú fuiste quien lo obligó a suplicar por su vida", dice Kate, frunciéndome el ceño. "Mátalo tú."

          "Justo", digo, y luego le disparo al lessathi en la cabeza con la ballesta, matándolo en el acto.

          Al ver que el lessathi ha muerto, el dron de ojos verdes se acerca lentamente a nosotras y empieza a hablar.
