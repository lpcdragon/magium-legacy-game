      - condition: aura_hardening >= 4
        texts:
          - source: scene_text
            paragraph: 52
            text: |-
              "Melindra, ¿puedes lanzar tus corrientes de aire sobre mí?", digo. "Quiero intentar apuñalar a los drones en los ojos mientras siguen aturdidos."

              "No me parece la mejor idea, pero es tu decisión", dice Melindra.

              Entonces agita las manos unas cuantas veces en el aire y, poco después, puedo sentir las corrientes fluyendo a mi alrededor.

              "Gracias", digo, mientras saco la daga y luego vuelo hacia uno de los drones.

              Justo cuando estoy a punto de clavarle la daga, el drone dispara un rayo de hielo desde su ojo que me envuelve por completo. En lugar de congelarme, sin embargo, lo único que consigue es congelar el aura endurecida que me rodea, lo que significa que el único efecto real es que siento un poco de frío. No le doy tiempo al drone a preparar otro ataque y le clavo la daga repetidas veces en el ojo, hasta que su hélice deja de funcionar y la bola metálica cae al suelo.
          - source: scene_text_2
            paragraph: 30
            text: |-
              Parece que la barrera mágica que tenía a su alrededor no era gran cosa contra ataques a corta distancia. Eso significa que quizá pueda acabar con el resto de los drones del mismo modo. Solo tengo que ser un poco más cuidadoso con la manera en que me acerco a ellos.

              Vuelo hacia otro de los drones, amago un ataque con mi daga y luego retrocedo volando justo cuando la bola metálica me dispara un rayo de fuego. En cuanto termina su ataque, vuelvo a lanzarme hacia ella e intento apuñalarla con todas mis fuerzas. Esta vez, sin embargo, la punta de mi daga se detiene contra la barrera que rodea al drone, y esa misma bola metálica parece estar creando ahora dos losas de roca con las que quiere aplastarme la cabeza.

              "¡Barry, atrás!", dice Kate, mientras lanza un carámbano directo al ojo del drone, haciéndolo caer al suelo y haciendo desaparecer también las losas de roca.

              "¡Ah, ya lo entiendo!", digo. "¡Les cuesta cambiar entre sus barreras defensivas! Parece que una de sus barreras es más fuerte contra ataques físicos, mientras que la otra es más fuerte contra ataques mágicos, pero no pueden usar las dos al mismo tiempo. Ya saben lo que eso significa, ¿verdad?"

              Entonces saco la ballesta, mientras Kate e Illuna preparan sus hechizos. Antes de que los otros dos drones tengan ocasión de defenderse, los tres les disparamos simultáneamente con virotes de ballesta, lanzas de agua y carámbanos, destruyendo las bolas metálicas en cuestión de segundos.
        effects:
          - set:
              successful_checks:
                - '[ Comprobación de endurecimiento de aura exitosa - nivel 4 ]'
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch04b_stuck
                condition: is_dead = 0
  - name: b3_ch04b_drones2
    routes:
      - condition: strength >= 3
        texts:
          - source: scene_text
            paragraph: 54
            text: |-
              Recojo una piedra del suelo y se la lanzo a uno de los drones.

              A diferencia de los carámbanos de Kate, la piedra atraviesa la barrera del drone y se estrella contra su ojo, haciéndolo caer al suelo.

              Al ver que mi plan ha funcionado, recojo otra piedra del suelo y se la lanzo al siguiente drone. Esta vez, sin embargo, la piedra rebota contra la barrera mágica de la bola metálica, igual que los proyectiles de Kate, Flower e Illuna.

              Intento lanzarle otra piedra, pero obtengo el mismo resultado. De repente, Kate le lanza uno de sus carámbanos al drone al que yo estaba atacando, y el proyectil atraviesa su barrera mágica y le da en el ojo. Cuando la bola metálica cae al suelo, por fin empiezo a entender lo que está pasando.

              "¡Ah, ya lo entiendo!", digo. "¡Les cuesta cambiar entre sus barreras defensivas! Parece que una de sus barreras es más fuerte contra ataques físicos, mientras que la otra es más fuerte contra ataques mágicos, pero no pueden usar las dos al mismo tiempo. Ya saben lo que eso significa, ¿verdad?"

              Entonces saco la ballesta, mientras Kate e Illuna preparan sus hechizos. Antes de que los otros dos drones tengan tiempo de defenderse, los tres les disparamos simultáneamente con virotes de ballesta, lanzas de agua y carámbanos, destruyendo las bolas metálicas en cuestión de segundos.
        effects:
          - set:
              successful_checks:
                - '[ Comprobación de fuerza exitosa - nivel 3 ]'
              ac_b3_ch4_thrower: 1
            achievement:
              id: ac_b3_ch4_thrower
              title: Campeón de lanzamiento de rocas
        choices:
          - position: 1
            text: Continuar
