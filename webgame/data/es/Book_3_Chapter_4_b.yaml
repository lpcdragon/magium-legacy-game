                condition: is_dead = 1
      - condition: perception >= 2
        texts:
          - source: scene_text
            paragraph: 56
            text: |-
              Saco la ballesta e intento dispararle a uno de los drones en el ojo. Igual que pasó antes con los carámbanos de Kate, mi virote de ballesta rebota simplemente contra la barrera mágica de la bola metálica, dejándola completamente ilesa.

              Sin embargo, estoy casi seguro de haber visto la luz del ojo anaranjado del drone parpadear muy brevemente justo cuando el virote de ballesta lo golpeó. Eso nunca pasó mientras lo atacaban proyectiles mágicos. ¿Significa eso que mi virote de ballesta sí tuvo algún efecto? Voy a probar otra vez.

              Le disparo de nuevo al drone, esta vez con dos tiros consecutivos, uno detrás de otro. Los virotes de ballesta vuelven a ser desviados por la barrera, pero esta vez el parpadeo de la luz es mucho más evidente. Voy a probar una vez más con tres virotes de ballesta.

              Tal como sospechaba, en cuanto le disparo tres virotes de ballesta consecutivos al drone, la barrera ya no consigue detenerlos a todos, y uno de ellos golpea a la bola metálica en el ojo, haciéndola caer al suelo. Entonces recargo la ballesta y apunto a otro de los drones, esta vez disparándole todos los virotes de ballesta uno tras otro.
          - source: scene_text_2
            paragraph: 33
            text: |-
              Sorprendentemente, la barrera alrededor de la bola metálica no se ve afectada en absoluto, y la luz de su ojo ni siquiera parpadea una sola vez. Antes de que me dé tiempo a entender qué está pasando, Kate le dispara a ese mismo drone con un carámbano, que atraviesa su barrera y le da en el ojo. Cuando la bola metálica cae al suelo, por fin empiezo a entender lo que está pasando.

              "¡Ah, ya lo entiendo!", digo. "¡Les cuesta cambiar entre sus barreras defensivas! Parece que una de sus barreras es más fuerte contra ataques físicos, mientras que la otra es más fuerte contra ataques mágicos, pero no pueden usar las dos al mismo tiempo. Ya saben lo que eso significa, ¿verdad?"

              Entonces apunto con la ballesta al siguiente drone, mientras Kate e Illuna preparan sus hechizos. Antes de que los otros dos drones tengan tiempo de defenderse, los tres les disparamos simultáneamente con virotes de ballesta, lanzas de agua y carámbanos, destruyendo las bolas metálicas en cuestión de segundos.
