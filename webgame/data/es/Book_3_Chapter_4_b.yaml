  - name: b3_ch04b_undetected
    texts:
      - source: scene_text
        paragraph: 23
        text: |-
          "En realidad sí tengo una razón. Verás por qué lo hice si esperas unos segundos más."

          "Muy bien, entonces", dice Kate. "Estoy esperando."

          Tras unos diez segundos de silencio absoluto, por fin rompo el hielo y me dirijo directamente al dron de ojos verdes.

          "Bueno, ¿Supervisor?", digo. "¿No vas a decir nada? ¿O te conformas con dejar las cosas tal como están? Es gracioso, porque habría jurado que la verdadera razón por la que nos trajiste aquí era manipularnos para que matáramos por ti a tu carcelero lessathi, para que así pudieras quedar libre. ¿Estoy entendiendo algo mal o...?"

          "Procesando... Procesando...", dice el Supervisor. "Parece que está intentando chantajearme. ¿Es correcto?"
      - source: scene_text_2
        paragraph: 10
        text: |-
          "Oye, quizá yo no estaría haciendo esto si de verdad hubieras cumplido tu promesa y nos hubieras ayudado a llegar a los niveles superiores sin que nos detectaran", digo. "Tal como están las cosas, no solo intentaste utilizarnos para tus propios planes, sino que además no nos ayudaste en lo más mínimo."

          "Yo nunca dije que los llevaría a los niveles superiores sin que los detectaran", dice el Supervisor. "Lo que dije fue que los llevaría a donde 'necesitan ir'. Esta es una sala de la torre cuyas paredes de seredium son lo bastante finas como para que puedan teletransportarse fuera de aquí. Aunque el lessathi al que llaman Billy Bob sí los haya detectado, eso no cambia el hecho de que todavía tienen tiempo de escapar antes de que los guardias los encuentren. ¿No era eso lo que querían?"

          "Supongo que sí...", digo.

          "Entonces, ¿piensan matar a Biliborrathrathsarran?", dice el Supervisor.
