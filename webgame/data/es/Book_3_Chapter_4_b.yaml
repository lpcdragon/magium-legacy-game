    routes:
      - condition: b3_ch4_control = 1
        texts:
          - source: scene_text
            paragraph: 21
            text: |-
              "Maldito bastardo de ojos verdes...", digo. "Ni siquiera pensabas llevarnos a la sala de control, ¿verdad?"

              "Yo nunca dije que los llevaría a la sala de control", dice el Supervisor. "Lo que dije fue que los llevaría a donde 'necesitan ir'. Esta es una sala de la torre cuyas paredes de seredium son lo bastante finas como para que puedan teletransportarse fuera de aquí. ¿Acaso ese no es su objetivo principal en este momento?"

              "¡No, maldita sea!", digo. "Hasta te pregunté específicamente si podías llevarnos a la sala de control, y me diste una respuesta ambigua a propósito. Entonces, ¿dónde ESTÁ la sala de control?"

              De repente, un ruido muy fuerte inunda la sala, probablemente destinado a alertar a los guardias de la torre de nuestra presencia.

              "Por desgracia, parece que Biliborrathrathsarran consiguió activar una alarma antes de que lo mataran", dice el Supervisor. "Los guardias vienen hacia aquí. Les sugiero que se teletransporten fuera de esta sala cuanto antes."
          - source: scene_text_2
            paragraph: 8
            text: |-
              "Maldición...", digo. "Supongo que no tenemos elección. No podemos enfrentarnos solas a todos los guardias de este lugar. Breynan, ¿puedes llamar al del teletransportador para que nos saque de aquí?"

              "Ya me encargo", dice Breynan.

              Entonces saca su transceptor y se lo acerca a la boca.

              "¡Barry, me oyes?", grita Breynan a su transceptor.

              "¡Santos dioses, qué ruido infernal es ese?", dice el operador del teletransportador. "¿Y dónde han estado todo este tiempo? ¿Saben qué? ¡No importa! Hay mucha gente esperando en la cola para teletransportarse. Parecen bastante calmadas, así que iniciaré la Teletransportación de regreso ahora mismo. ¿Están listas?"

              "Sí, estamos listas", dice Breynan. "¡Teletranspórtanos ahora!"

              "Entendido", dice el operador del teletransportador, y entonces una luz blanca empieza a envolvernos mientras nuestros cuerpos vibran con fuerza.

              "Adiós", dice el Supervisor, mientras nos teletransportan fuera de la sala. "Estoy seguro de que volveremos a vernos muy pronto."
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch04b_ending
      - condition: b3_ch4_control = 0
        texts:
          - source: scene_text
            paragraph: 22
            text: |-
              "Maldito bastardo de ojos verdes...", digo. "Ni siquiera tenías la menor intención de ayudarnos a llegar a los niveles superiores sin que nos detectaran, ¿verdad?"

              "Yo nunca dije que los llevaría a los niveles superiores sin que los detectaran", dice el Supervisor. "Lo que dije fue que los llevaría a donde 'necesitan ir'. Esta es una sala de la torre cuyas paredes de seredium son lo bastante finas como para que puedan teletransportarse fuera de aquí. Aunque el lessathi al que llaman Billy Bob sí los haya detectado, eso no cambia el hecho de que todavía tienen tiempo de escapar antes de que los guardias los encuentren. ¿No era eso lo que querían?"

              "Supongo que sí...", digo.

              "Si esta sala realmente permite la teletransportación, entonces no deberíamos perder más tiempo aquí", dice Melindra. "Breynan, ¿puedes llamar a tu amigo de la sala del teletransportador?"

              "Sí, lo llamaré ahora mismo", dice Breynan.
          - source: scene_text_2
            paragraph: 9
            text: |-
              Entonces saca su transceptor y se lo acerca a la boca.

              "¡Barry, me oyes?", grita Breynan al transceptor.

              "¿Breynan?", dice el operador del teletransportador. "¿Dónde han estado todo este tiempo? ¡Llevo siglos intentando comunicarme con ustedes! En realidad, ¿sabes qué? ¡Da igual! Hay mucha gente esperando en la cola para teletransportarse. Parecen bastante calmadas, así que iniciaré la Teletransportación de regreso ahora mismo. ¿Están listas?"

              "Sí, estamos listas", dice Breynan. "¡Teletranspórtanos ahora!"

              "Entendido", dice el operador del teletransportador, y entonces una luz blanca empieza a envolvernos mientras nuestros cuerpos vibran con fuerza.

              "Adiós", dice el Supervisor, mientras nos teletransportan fuera de la sala. "Estoy seguro de que volveremos a vernos muy pronto."
