  - name: b3_ch04b_voluntarily
    texts:
      - source: scene_text
        paragraph: 26
        text: |-
          "En realidad sí tengo una razón. Verás por qué lo hice si esperas unos segundos más."

          "Muy bien, entonces", dice Kate. "Estoy esperando."

          Tras unos diez segundos de silencio absoluto, por fin rompo el hielo y me dirijo directamente al dron de ojos verdes.

          "Bueno, ¿Supervisor?", digo. "¿No vas a decir nada? ¿O te conformas con dejar las cosas tal como están? Es gracioso, porque habría jurado que la verdadera razón por la que nos trajiste aquí era manipularnos para que matáramos por ti a tu carcelero lessathi, para que así pudieras quedar libre. ¿Estoy entendiendo algo mal o...?"

          "Procesando... Procesando...", dice el Supervisor. "Parece que está intentando chantajearme. ¿Es correcto?"

          "Oye, quizá yo no estaría haciendo esto si de verdad hubieras cumplido tu promesa y nos hubieras llevado a la sala de control, como dijiste que harías", digo. "Tal como están las cosas, no solo intentaste utilizarnos para tus propios planes, sino que además no nos ayudaste en lo más mínimo."

          "Yo nunca dije que los llevaría a la sala de control", dice el Supervisor. "Lo que dije fue que los llevaría a donde 'necesitan ir'. Esta es una sala de la torre cuyas paredes de seredium son lo bastante finas como para que puedan teletransportarse fuera de aquí. ¿Acaso ese no es su objetivo principal en este momento?"

          "¡No, maldita sea!", digo. "Hasta te pregunté específicamente si podías llevarnos a la sala de control, y me diste una respuesta ambigua a propósito. Entonces, ¿dónde ESTÁ la sala de control?"
      - source: scene_text_2
        paragraph: 13
        text: |-
          "Me temo que no puedo darles respuesta a esa pregunta", dice el Supervisor.

          "¿Y por qué demonios no?", digo.

          "Porque si les dijera cómo liberar a los prisioneros, la principal fuente de energía que alimenta al protocolo Supervisor y a todas las unidades drone desaparecería", dice el Supervisor. "Aceptar terminar voluntariamente con mi propia existencia sería sumamente ilógico."

          "Creía que tu 'único propósito' era prestar asistencia", digo.

          "El único propósito del protocolo Supervisor es prestar asistencia", dice el Supervisor. "Sin embargo, nunca he especificado a quién estoy prestando esa asistencia."

          "Y si se nos permite preguntar, ¿a quién le está prestando esa asistencia?", dice Illuna.

          "A mí mismo", dice el Supervisor.

          "Ahora escúchame bien, bastardo de ojos verdes", digo. "Si ese lessathi despierta y recuerda cómo lo traicionaste, lo primero que hará será desactivarte. ¿Eso es lo que quieres?"

          "Preferiría quedar desactivado temporalmente a perder por completo mi fuente de energía", dice el Supervisor.
