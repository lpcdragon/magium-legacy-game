          - source: scene_text_2
            paragraph: 19
            text: |-
              Cuando por fin llega a la puerta del otro lado, todas las baldosas del suelo que había pisado vuelven a elevarse a su posición original al mismo tiempo, y la puerta frente a ella se abre sola.

              "¡Todo bien!", nos grita Flower desde el otro extremo del túnel. "La trampa está desactivada. Ya no tienen que preocuparse por las baldosas. ¡Vengan para acá!"

