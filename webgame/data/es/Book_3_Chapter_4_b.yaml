              "Le doy las gracias", dice el Supervisor.

              "Bien", digo. "En fin, supongo que la siguiente pregunta es... ¿cuántos guardias han sido alertados ya de nuestra presencia en la torre? ¿Vamos a tener que abrirnos paso luchando o podremos teletransportarnos de vuelta a nuestra base en paz?"

              "El lessathi al que llaman Billy Bob había activado un protocolo de alarma cuando los vio entrar por primera vez en la sala, pero yo lo puse en pausa para poder mantener nuestra conversación", dice el Supervisor. "Actualmente, ninguno de los guardias se dirige en su dirección. Reactivaré la alarma después de que se hayan ido, para que los guardias vengan aquí y se deshagan del cadáver."

              "Bueno, en ese caso diría que ya es hora de que volvamos por fin a la base rebelde", dice Melindra. "Breynan, ¿puedes llamar a tu amigo de la sala del teletransportador?"

