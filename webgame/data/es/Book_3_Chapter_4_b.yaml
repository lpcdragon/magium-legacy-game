scenes:
  - name: b3_ch04b_assistance
    routes:
      - condition: b3_ch4_control = 0
        texts:
          - source: scene_text
            paragraph: 2
            text: |-
              "¡Quizá pueda serles de ayuda!", oímos la voz metálica del Supervisor, mientras un dron de ojos verdes vuela ahora hacia nuestra posición, moviéndose con muchísimo cuidado entre los prisioneros para asegurarse de que las cadenas no se enreden en su hélice.

              "¿Puedes mostrarnos cómo llegar a los niveles superiores sin que nos detecten?", le pregunto al Supervisor cuando llega hasta nosotros.

              "Puedo guiarlos a donde necesitan ir", dice el Supervisor. "Pero antes tendrán que abrir un pasadizo secreto. Creo que ya deberían saber cómo hacerlo, teniendo en cuenta que lograron llegar a esta sala sin alertar a ninguno de los guardias."

              "Sí, sabemos abrir pasadizos secretos", le digo. "Entonces, ¿dónde está esa puerta oculta?"

              "Es por aquí", dice el Supervisor mientras el dron de ojos verdes pasa flotando a nuestro lado. "Síganme."

              "Ni tan rápido, Supervisor", dice Breynan, y la bola metálica se detiene en mitad del aire. "¿Qué hay de la puerta por la que acabas de venir? ¿Qué hay por ahí?"

              "Ese camino lleva directamente a los niveles superiores", dice el Supervisor. "Sin embargo, hay muchos guardias patrullando los pasillos y no existe forma de evitarlos a todos sin dar la alarma. El pasadizo secreto que estaba a punto de mostrarles fue construido por los lessathi de antaño, igual que los de los túneles bajo Varathia, lo que significa que nadie en esta torre sabe de su existencia. Podrán recorrer el pasaje sin encontrarse con ninguna resistencia."
          - source: scene_text_2
            paragraph: 2
            text: |-
              "Sí, no sé muy bien qué decir aquí", responde Breynan.

              "¿No crees que esté diciendo la verdad?", escribe Leila.

              "No es eso", dice Breynan. "Es solo que está siendo muchísimo más servicial de lo habitual. No es nada común ver al Supervisor iniciar una conversación con alguien a menos que esa persona active realmente el protocolo. E incluso en ese caso, normalmente tienes que hacerle docenas de preguntas antes de poder sacarle una respuesta útil. Pero ahora nos está dando toda la información él solo, sin que ni siquiera tengamos que preguntarle nada. No puedo evitar sentirme un poco suspicaz con todo esto..."

              "Entonces crees que el Supervisor podría estar siguiendo las órdenes de alguien, ¿no?", dice Illuna. "¿Crees que podría estarnos conduciendo a una trampa?"

              "No, el Supervisor no es la marioneta de nadie", dice Breynan. "Y si de verdad quisiera vernos muertos, podría haberse limitado a hacernos perder tiempo hasta que la guardia real nos alcanzara mientras estábamos en la superficie. No digo que necesariamente pretenda hacernos daño, solo digo que está actuando un poco raro, eso es todo. Incluso la forma en que habla se siente un poco distinta. Se nota que ya no está fingiendo ser una máquina tonta."
          - source: scene_3
            paragraph: 2
            text: |-
              "Tienes razón en eso", dice Melindra.

              "El protocolo Supervisor les asegura que no hay nada de lo que sospechar", dice el Supervisor. "El único propósito del protocolo es prestar asistencia."

              "Sí, ya... el problema es que decir cosas así solo te hace parecer más sospechoso", dice Breynan.

              "Si no crees que nos esté conduciendo a una trampa, entonces no veo cuál es el problema", dice Illuna. "Ya habíamos decidido cooperar con el Supervisor antes de abandonar la base rebelde. De lo contrario, ni siquiera nos habríamos molestado en responder a su invitación inicial. Que tenga objetivos personales o no no debería preocuparnos a menos que tengamos motivos para creer que entran en conflicto con los nuestros."
        choices:
          - position: 1
            text: Estoy de acuerdo. El pasadizo secreto probablemente sea nuestra mejor opción ahora mismo.
            effects:
              - set:
                  current_scene: b3_ch04b_passage
          - position: 2
            text: Sigo pensando que escuchar al Supervisor en este caso podría ser una mala idea.
            effects:
              - set:
                  current_scene: b3_ch04b_guarantee
                  b3_ch4_billy: 0
      - condition: b3_ch4_control = 1
        texts:
          - source: scene_text
            paragraph: 3
            text: |-
              "¡Yo puedo luchar!", dice con voz desesperada uno de los magos que está tumbado sobre las mesas. "¡Lucharé contra quien sea! ¡Haré lo que sea! ¡Por favor, cualquier sitio es mejor que este!"

              "¡Sí, lucharemos!", dice otro mago tendido en una mesa. "¡Lucharemos todos! ¡Solo dennos una oportunidad!"

              "Uf...", dice Melindra. "Aunque estos magos estén dispuestos a luchar, seguimos sin saber a qué altura de la torre tenemos que ir para llegar a la sala de control. ¡Ni siquiera podemos estar seguras de que la reconoceremos cuando la veamos!"

              "¡Quizá pueda serles de ayuda!", oímos la voz metálica del Supervisor, mientras un dron de ojos verdes vuela ahora hacia nuestra posición, moviéndose con muchísimo cuidado entre los prisioneros para asegurarse de que las cadenas no se enreden en su hélice.

              "¿Puedes mostrarnos cómo llegar a la sala de control?", le pregunto al Supervisor cuando llega hasta nosotros.

              "Puedo guiarlos a donde necesitan ir", dice el Supervisor. "Pero antes tendrán que abrir un pasadizo secreto. Creo que ya deberían saber cómo hacerlo, teniendo en cuenta que lograron llegar a esta sala sin alertar a ninguno de los guardias."

              "Sí, sabemos abrir pasadizos secretos", le digo. "Entonces, ¿dónde está esa puerta oculta?"

              "Es por aquí", dice el Supervisor mientras el dron de ojos verdes pasa flotando a nuestro lado. "Síganme."
