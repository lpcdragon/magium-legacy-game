  - name: b3_ch04b_passage
    texts:
      - source: scene_text
        paragraph: 4
        text: |-
          "Estoy de acuerdo. El pasadizo secreto probablemente sea nuestra mejor opción ahora mismo."

          "Si ninguno de ustedes tiene problema en ayudar al Supervisor, por mí está bien", dice Breynan. "Solo quería asegurarme de que todos tengan claro en qué se están metiendo exactamente."

          "Mmm...", dice Melindra. "Bueno, supongo que me importan bastante poco las agendas ocultas de todo el mundo mientras al final maten al rey. Por lo que he visto hasta ahora, el Supervisor no parece estar precisamente del lado del rey, así que bien podríamos seguirlo por ahora. Oye, dron de ojos verdes, ¿dónde dijiste que estaba la puerta oculta?"

          "¡Por aquí!", dice el Supervisor, mientras la bola metálica vuelve a ponerse en movimiento y todos vamos tras ella.

          "Esta es la entrada al pasadizo secreto", dice el Supervisor, una vez que llega hasta una de las paredes al otro lado de la sala. "Si lograron abrir por su cuenta la puerta hacia los túneles subterráneos, también deberían poder averiguar con bastante facilidad cómo abrir esta."
      - source: scene_text_2
        paragraph: 4
        text: |-
          "Déjame ver...", dice Illuna, mientras se acerca a la pared y la toca con la mano, enviando un poco de energía mágica hacia ella.

          Igual que antes, la pared se retrae lentamente y luego se desliza hacia un lado, dejándonos paso. Una vez más nos encontramos ante un tramo de escaleras que lleva hacia arriba, salvo que esta vez no hay cristales azules iluminando el camino. Mientras Leila y yo sacamos nuestros dispositivos de estadísticas para alumbrar delante de nosotras, el resto del grupo también se adentra en el pasaje, excepto el Supervisor.

          "Buena suerte", dice el Supervisor desde fuera del corredor secreto, mientras Illuna cierra la puerta oculta.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch04b_passage2
  - name: b3_ch04b_passage2
    texts:
      - source: scene_text
        paragraph: 5
        text: |-
          Subimos las escaleras en silencio, con Illuna delante de nosotras. Seguimos ascendiendo un rato, hasta que por fin llegamos al final del túnel, e Illuna gira la cabeza hacia nosotras para asegurarse de que estamos listas. Una vez que comprueba que todas estamos prestando atención, abre la puerta secreta del mismo modo que abrió la anterior, y luego salimos del túnel una por una, entrando en lo que parece ser algún tipo de taller.

          "¿Qu-qu-qué hacen aquí?...", oímos la voz presa del pánico de Billy Bob, el lessathi, que está de pie junto a una mesa en medio de la sala, con un dron desmontado encima. "¿Quiénes son ustedes? ¡Drones! ¡Ataquenlos ahora mismo! ¡Mátenlos! ¡Mátenlos!"

          Hay seis drones de ojos rojos flotando justo encima del lessathi, pero no parecen tener ninguna prisa por cumplir sus órdenes. Al ver que los drones lo están ignorando, Billy Bob se dirige ahora a un dron de ojos verdes que tiene a su derecha.

          "Supervisor, ¿qué significa esto?", dice Billy Bob.
      - source: scene_text_2
        paragraph: 5
        text: |-
          "Pregunta poco clara", dice el Supervisor, mientras Illuna cierra la puerta secreta detrás de nosotras. "Por favor, reformule su consulta anterior."

          "¡¿Por qué tus drones no los están matando?!", grita Billy Bob, señalándonos. "¡Te dije que los mataras!"

          "Por desgracia, su petición no puede atenderse en este momento", dice el Supervisor. "¡Le pedimos disculpas por las molestias!"

          "No puede atenderse...", dice Billy Bob, perplejo. "¿Me... me estás traicionando?..."

          El dron de ojos verdes no dice nada, pero la respuesta resulta obvia para todo el mundo en la sala. Parece que ya no queda nadie en este taller que pudiera ponerse del lado de Billy Bob. Está completamente indefenso. Ahora bien... ¿cuál debería ser nuestro siguiente curso de acción?

          De repente, veo que Kate está preparando varios carámbanos y apuntando con ellos a Billy Bob, mientras le dedica una mirada llena de asco. Piensa matarlo.
    choices:
      - position: 1
        text: Dejar que Kate mate a Billy Bob.
        effects:
          - set:
              current_scene: b3_ch04b_billy1
              b3_ch4_billy: 1
      - position: 2
        text: Matar yo mismo a Billy Bob.
        effects:
          - set:
              current_scene: b3_ch04b_billy2
              b3_ch4_billy: 2
      - position: 3
        text: Impedir que Kate mate a Billy Bob y pedirle que suplique por su vida.
        effects:
          - set:
              current_scene: b3_ch04b_billy3
              b3_ch4_billy: 3
      - position: 4
        text: Impedir que Kate mate a Billy Bob y pedirle que nos diga dónde está la sala de control.
        effects:
          - set:
              current_scene: b3_ch04b_billy4
              b3_ch4_billy: 4
      - position: 5
        text: Impedir que Kate mate a Billy Bob e ir a dejarlo inconsciente.
        effects:
          - set:
              current_scene: b3_ch04b_billy5
              b3_ch4_billy: 5
  - name: b3_ch04b_billy1
    texts:
      - source: scene_text
        paragraph: 6
        text: Decido no intervenir y dejar que Kate haga lo que quiera. Unos segundos después, Kate lanza sus carámbanos hacia el lessathi, que le atraviesan la cabeza y el pecho antes de que tenga tiempo de reaccionar, matándolo en el acto. Cuando el cadáver de Billy Bob cae al suelo, el dron de ojos verdes se acerca lentamente a nosotras y empieza a hablar.
      - source: scene_text_2
        paragraph: 6
        text: |-
          "El protocolo Supervisor les agradece su ayuda", dice el Supervisor. "Me han prestado un gran servicio al poner fin a la vida de Biliborrathrathsarran. Tengan por seguro que esta deuda no quedará en el olvido."

          "¿Querías verlo muerto?...", digo. "Entonces, ¿por qué no lo mataste tú mismo?"

          "Se me ha diseñado de tal forma que no puedo matar a la persona que me activa", dice el Supervisor. "Biliborrathrathsarran fue quien me reactivó esta vez, así que matarlo era imposible para mí."

          "Espera un segundo", digo. "¿Estás intentando decir que nos llevaste deliberadamente hasta el taller de Billy Bob porque querías que lo matáramos por ti?"

          "Eso es correcto", responde el Supervisor.

          "No lo entiendo", digo. "Creía que tu frase típica era que tu 'único propósito' es prestar asistencia. ¿Qué pasó con eso?"

          "El único propósito del protocolo Supervisor es prestar asistencia", dice el Supervisor. "Sin embargo, nunca he especificado a quién estoy prestando esa asistencia."

          "Y si se nos permite preguntar, ¿a quién le está prestando esa asistencia?", dice Illuna.

          "A mí mismo", dice el Supervisor.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch04b_sneaky
  - name: b3_ch04b_billy2
    texts:
      - source: scene_text
        paragraph: 7
        text: |-
          "Espera", le digo a Kate. "Lo haré yo."

          "¿Qué?...", dice Kate, pero entonces entiende a qué me refería y deja de crear sus carámbanos. "Ah... Vale."

          Entonces saco la ballesta de mi mochila y apunto directamente al lessathi.

          "¿Qué se supone que es esto?", dice Billy Bob, mirándome fijamente. "¿Me estás amenazando? No creas que puedes salirte con la tuya con algo así solo porque--"

          Disparo la ballesta antes de que termine de hablar, y el virote de ballesta le atraviesa la frente, matándolo al instante. Cuando el cadáver de Billy Bob cae al suelo, el dron de ojos verdes se acerca lentamente a nosotras y empieza a hablar.
