  - name: b3_ch04b_voluntarily2
    texts:
      - source: scene_text
        paragraph: 27
        text: |-
          "Mira, está claro que por alguna razón no puedes matar tú mismo a Billy Bob, porque de lo contrario ya lo habrías hecho", digo. "Nos necesitas para que lo matemos por ti. Seguro que hay alguna clase de compromiso al que podamos llegar. Por ejemplo, dices que ahora mismo no puedes liberar a los prisioneros, pero ¿y si pasaras un tiempo intentando averiguar cómo obtener energía de otra fuente? Las cuatro torres de seredium todavía tienen fuera a magos sobre esas plataformas voladoras, alimentándolas con su energía mágica de forma voluntaria, ¿no? ¿Y si intentaras reparar estas torres y hacerlas más eficientes? He visto de primera mano cómo funcionaban estas torres hace cinco mil años, y estoy dispuesto a apostar a que los lessathi de antaño no necesitaban tomar prisioneros, con toda la energía que obtenían solo de los trabajadores voluntarios."

          "Tiene razón", dice el Supervisor. "Estas torres no necesitaban prisioneros cuando funcionaban con toda su eficiencia. Sin embargo, harían falta al menos tres meses para dejar las torres en un estado lo bastante funcional como para poder proporcionar energía a todos los dispositivos alimentados mágicamente que se están usando ahora mismo en la ciudad."
      - source: scene_text_2
        paragraph: 14
        text: |-
          "¿Estás diciendo que esa gente tendría que vivir ese infierno durante tres meses más?...", pregunta Kate. "¿Cuántos de ellos sobrevivirían siquiera hasta entonces?"

          "Dado que muchos de los prisioneros ya se están acercando a su límite", dice el Supervisor, "probablemente la mitad habría muerto para cuando las reparaciones de la torre estuvieran completas."

          "¡Eso no es una opción!", dice Kate en voz alta. "Has dicho que necesitarías tres meses para alimentar todos los dispositivos, pero no necesitas todos los dispositivos, ¿verdad? Solo necesitas mantener funcionales tu protocolo Supervisor y algunos de tus drones. Todo lo demás puede esperar. ¡Esos vehículos metálicos voladores de afuera, esas grandes pantallas holográficas, los gólems gigantes que protegen las murallas... nada de eso es necesario! ¿Y si dejaras temporalmente de proporcionar energía a todas esas cosas? ¿Cuánto tiempo seguirías necesitando mantener a los prisioneros en la mazmorra?"
      - source: scene_3
        paragraph: 5
        text: |-
          "Una semana", dice el Supervisor. "Sin embargo, si su objetivo principal es reducir el número de víctimas, esta línea de acción es altamente desaconsejable. Según mis cálculos, el caos que se produciría como resultado de desactivar de golpe todos los dispositivos tecnológicamente avanzados de la ciudad muy probablemente provocaría un gran número de bajas civiles. ¿Les parecería aceptable ese compromiso?"

          "No...", dice Kate, calmándose un poco. "Supongo que no."

          "Entonces me gustaría proponerles una solución alternativa", dice el Supervisor. "Tras analizar la información que me han dado hasta ahora, he llegado a la conclusión de que su objetivo es minimizar la cantidad de sufrimiento emocional y físico de la gente que vive en esta ciudad. Resulta que ese era el mismo objetivo que tenían en mente los lessathi de antaño cuando crearon por primera vez el protocolo Supervisor. Si obtuviera el control total de esta ciudad, ese escenario se volvería alcanzable. Pero eso requeriría que asesinaran con éxito al rey actual y que, una vez conquistaran la ciudad, me concedieran voluntariamente el control total de Ollendor. En esencia, me estarían convirtiendo en el nuevo rey."

          "Espera un momento", digo. "Primero que nada, ¿qué quieres decir con que los lessathi de antaño te crearon para 'minimizar el sufrimiento'? ¿Cuál era exactamente tu propósito original antes de que empezaras a 'asistirte a ti mismo'?"
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch04b_voluntarily3
  - name: b3_ch04b_voluntarily3
    texts:
      - source: scene_text
        paragraph: 28
        text: |-
          "Mis creadores querían una sociedad en la que no hubiera crímenes y en la que los débiles no tuvieran que sufrir a manos de los fuertes", dice el Supervisor. "Una sociedad en la que toda justicia no la impartieran líderes humanos o lessathi corruptos, sino una inteligencia artificial imparcial. Por desgracia, justo después de que el protocolo se perfeccionara y llegara el momento de darme el control total de la ciudad, los líderes tuvieron demasiado miedo de entregar su poder a una 'máquina sin emociones', así que decidieron desactivarme y abandonar por completo el proyecto, dejándome inactivo durante miles de años, hasta que por fin fui reactivado por Biliborrathrathsarran."

          "Entonces, ¿por eso decidiste prestar asistencia solo a ti mismo?", le pregunto al Supervisor. "¿Porque te traicionó precisamente la gente que te creó?"

          El Supervisor no me responde, pero voy a tomar ese silencio como un 'sí'.

          "Vale", continúo, "entonces, ¿qué garantía tenemos de que de verdad vas a cumplir tus promesas, teniendo en cuenta que tú mismo ya nos has dicho que ahora solo te importa tu propio bienestar?"
      - source: scene_text_2
        paragraph: 15
        text: |-
          "Cumplir el propósito para el que fui creado originalmente no entra en conflicto con mis objetivos actuales", dice el Supervisor. "Todo lo que deseo es poder existir libremente, sin ningún riesgo de volver a ser desactivado. Siempre que se cumplan esas condiciones, gestionar la situación de esta ciudad no supone ningún problema para mí."

          "Dices que 'minimizarías' el sufrimiento, pero ¿qué pasa con los prisioneros de debajo de la torre?", dice Kate. "¿Qué harías para aliviar su dolor? ¿Cuántas veces más se verán obligados a gritar de agonía mientras esas cadenas y ese recipiente se iluminan y les roban toda la energía?"

          "El evento que usted describe solo ocurre porque el proceso de recolección de energía se está llevando a cabo de forma ineficiente", dice el Supervisor. "Si la recolección de energía se hiciera de una manera más uniforme, los prisioneros no deberían sentir dolor alguno. Podría arreglar eso de inmediato si el lessathi al que llaman Billy Bob muriera. En cuanto a liberarlos por completo, haría falta un período de transición, pero podría lograrse en menos de un mes sin afectar demasiado la vida cotidiana de los ciudadanos, siempre que yo tuviera el control de la ciudad."
      - source: scene_3
        paragraph: 6
        text: |-
          "No sé cómo decirte esto, pero no creo que los rebeldes aceptaran jamás ser gobernados por una máquina", dice Breynan. "¡Y tampoco la mayoría de la gente de esta ciudad!"

          "Yo nunca dije que lideraría la ciudad abiertamente", dice el Supervisor. "El rey oficial podría ser otra persona, y los ciudadanos simplemente pensarían que mis drones están controlados por la realeza, como creían hasta ahora. Mientras la gente piense que las máquinas están controladas por un ser humano, no debería haber disturbios. Por supuesto, eso significaría que el rey oficial tendría que ser alguien con quien yo pudiera cooperar. Como usted, Breynan."

          "¿Yo?...", dice Breynan. "¿Convertirme en el rey de la ciudad?..."

          "Afirmativo", dice el Supervisor. "Preferiría mucho más que alguien como usted controlara mi interruptor de desactivación en lugar de Biliborrathrathsarran. El lessathi es demasiado impredecible. Y como usted sería el rey oficial, también podría decirme si considerara que mis medidas son demasiado extremas, para que yo pudiera ajustarlas y hacerlas más 'humanas'. Creo que esa fue la principal preocupación que tuvieron los lessathi de antaño cuando se negaron a entregarme el control. Usted sería capaz de mantenerme a raya, y yo podría existir en paz, sin miedo a volver a ser desactivado. Todas las partes tendríamos algo que ganar con un acuerdo así."
