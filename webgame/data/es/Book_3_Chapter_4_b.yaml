              storyboard_controls: Jump to frame "Save load game"
  - name: b3_ch04b_contact
    texts:
      - source: scene_text
        paragraph: 47
        text: |-
          "Tienes razón", digo. "Vale la pena intentarlo. La llamaré ahora. Kate, ¿podrías levantar un muro de hielo detrás de nosotros para retrasar a los guardias si consiguen alcanzarnos?

          "Ya voy", dice Kate.

          Entonces empieza a crear su muro de hielo mientras yo saco mi transceptor, muevo el dial hasta el número de Rose y toco el transceptor para activarlo.

          "¿Rose, me oyes?", digo.

          "¡Sí!", dice Rose. "Ahora te oigo con claridad. ¿Salieron de las cavernas?"

          "Más o menos", digo. "Pero seguimos en problemas y necesitamos tu ayuda."

          "¿Mi ayuda?...", pregunta Rose.

          "Sí", digo. "Intentaré ser breve. ¿Alguna vez has conseguido congelar el tiempo por tu propia voluntad?"

          "Yo...", dice Rose. "Hoy sí he conseguido hacerlo unas cuantas veces, pero fue solo por un ratito, y no estoy segura de cuánto control tengo sobre ello. Siempre que intento mantener un control total sobre estos poderes, me canso con mucha facilidad y siento que estoy a punto de desmayarme. No estoy segura de si--"

          "¿Cuál fue el tiempo máximo que lograste mantener el tiempo congelado?", digo.
      - source: scene_text_2
        paragraph: 26
        text: |-
          "No lo sé...", dice Rose. "¿Unos... treinta segundos?"

          "Eso debería darnos tiempo suficiente para pasar las cuchillas giratorias", les digo a las demás. "Creo que deberíamos intentarlo."

          "¡¿Cuchillas giratorias?!", pregunta Rose, sobresaltada. "Barry, yo no creo que--"

          "Escucha, no tenemos mucho tiempo", digo. "Tenemos a docenas de guardias pisándonos los talones y podrían estar aquí de un momento a otro. Tu hechizo congela el tiempo en todo el mundo, así que en teoría debería ser posible descongelarnos desde donde estás. Los rebeldes de esta ciudad tienen un dispositivo de teletransportación que fija su hechizo en las señales de nuestros transceptores cuando intenta lanzarlo sobre nosotras. Quizá podrías intentar hacer lo mismo con tu hechizo. Intenta concentrarte en la conexión entre nuestros dos transceptores y tal vez puedas descongelar el tiempo solo para nosotras, para que podamos pasar las cuchillas con seguridad mientras sigues congelando el tiempo para todo el resto del mundo. ¿Crees que puedes hacerlo?"

          "Puedo intentarlo, pero... Barry, si pierdo el control del hechizo mientras ustedes están ahí dentro, acabarán..."
      - source: scene_3
        paragraph: 10
        text: |-
          "Nos aseguraremos de salir antes de que eso ocurra", digo. "No nos llevará más de quince segundos llegar a las escaleras. Podemos lograrlo. Tú solo intenta mantener el hechizo todo lo que puedas. Bien, ¿estás lista?"

          "Supongo...", dice Rose. "Dame un momento."

          Tras unos diez segundos de espera, Rose empieza de repente a respirar muy fuerte al otro lado del transceptor.

          "¿Pasa algo?...", digo.

          "No es nada", dice Rose con voz agotada. "Ya congelé el tiempo dos veces, pero no conseguí dejarlos descongelados. Estoy segura de que podré hacerlo bien si lo intento una tercera vez."

          "No, en realidad creo que quizá deberíamos parar antes de--"

          "¡Barry, me oyes?!", oigo gritar a Rose con mucha fuerza de repente.

          "Sí, te oigo", digo. "Estaba diciendo que--"

          "¡Barry, el tiempo está congelado!", dice Rose. "¡Corran hacia las escaleras! ¡Háganlo ya! ¡No sé cuánto tiempo podré mantener esto!"

          Cuando miro hacia las cuchillas, me doy cuenta de que se han detenido por completo, y las llamas de las antorchas en las paredes también parecen congeladas en el tiempo. No vamos a tener una oportunidad mejor que esta. Tenemos que aprovecharla mientras siga así.

          "Ya oyeron a Rose", les digo a las demás. "¡Vamos, vamos, vamos!"
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch04b_contact2
  - name: b3_ch04b_contact2
    routes:
      - condition: b3_ch4_control = 1
        texts:
          - source: scene_text
            paragraph: 48
            text: |-
              Todas empezamos a movernos entre las cuchillas congeladas tan deprisa como podemos, esforzándonos por pasar por el estrecho espacio que queda entre la multitud de objetos metálicos afilados. Cuando por fin alcanzamos la base de las escaleras, enseguida intento hacérselo saber a Rose por el transceptor.

              "Rose, estamos a salvo", digo. "Ya puedes descongelar el tiempo."

              En lugar de recibir una respuesta, oímos un golpe seco procedente del otro extremo del transceptor y, justo después, las cuchillas del corredor anterior vuelven a girar.

              "¿Rose, sigues ahí?", digo. "¡Rose!"

              "Estoy... bien", dice Rose con voz muy débil. "Solo... me desmayé un poco. Seguro que me recuperaré después de... quedarme un rato más tumbada en el suelo. Me alegra que estén todas a salvo."

              "Lo siento", digo. "No debería haberte presionado tanto. Intenta descansar un poco. Volveremos a llamarte cuando estemos de vuelta en la base rebelde."

              Entonces cierro el canal y le hago una seña a todo el mundo para que suba las escaleras. Cuando terminamos de subir, entramos en un pasillo con el techo muy alto y Breynan vuelve a sacar su transceptor.

              "Quizá esta vez tengamos suerte", dice Breynan. "Si logro ponerme en contacto con Barry, le diré que nos teletransporte fuera de aquí inmediatamente. Asegúrense de estar listas."
          - source: scene_text_2
            paragraph: 27
            text: |-
              "No nos teletransportaremos fuera de aquí antes de llegar a la sala de control", dice Kate.

              "Tu plan de la sala de control podría haber funcionado si hubiéramos logrado permanecer sin ser detectadas, pero una vez sonaron las alarmas, teletransportarnos fuera de este lugar se convirtió en nuestra única opción", dice Breynan. "El tiempo apremia. Ya nos ocuparemos de los prisioneros en otro momento."

              Entonces toca su transceptor y se lo acerca a la boca.

              "¡Barry, me oyes?", dice Breynan.

              "¡Santos dioses, qué ruido infernal es ese?", dice el operador del teletransportador al oír las fuertes alarmas que siguen sonando a nuestro alrededor. "¿Y dónde han estado todo este tiempo? En realidad, eso ahora no importa. Voy a-- eh, ¿todavía me oyes? La señal está fallando. ¿Qué está pasando por ahí? ¡¿Hola?!"

              "¡Sí, Barry, seguimos aquí!", dice Breynan. "¿Nos oyes? ¡Respóndeme!"

              Parece que el operador del teletransportador sigue diciendo algo, pero la señal mágica es demasiado pobre para que podamos entender ni una sola palabra. Cuando miro alrededor de la sala para averiguar qué está pasando, veo que cuatro drones voladores de ojos anaranjados se están moviendo lentamente para rodearnos, mientras un dron de ojos verdes pasa entre ellos volando y se detiene a unos pocos pies de nuestra posición.
          - source: scene_3
            paragraph: 11
            text: |-
              "Ya les advertí que no habría marcha atrás", oímos la voz del Supervisor, procedente del dron de ojos verdes.

              "¿De qué estás hablando?", le pregunto. "¿Quién está bloqueando nuestra señal? ¿Esos drones de ojos anaranjados?"

              "Adiós", dice el dron de ojos verdes, y luego se aleja de nosotras volando, mientras los drones de ojos anaranjados crean mágicamente una jaula semitransparente a su alrededor y a nuestro alrededor para impedir que escapemos.

              Cuando Kate, Flower e Illuna intentan derribar a los drones con su magia, a las bolas metálicas ni siquiera les hace falta apartarse, porque una fuerte barrera mágica se activa alrededor de cada una y desvía con facilidad todos los proyectiles entrantes.

              El aire a nuestro alrededor se está volviendo cada vez más pesado, y cada vez cuesta más respirar. La presión que surge de toda la energía mágica que se está reuniendo en un mismo punto hace que incluso mantenernos en pie resulte difícil. No sé qué hechizo están preparando estos drones, pero sea lo que sea, va a ser enorme.
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch04b_contact3
