        texts:
          - source: scene_text
            paragraph: 18
            text: |-
              "Kate, espera, ¡no lo mates todavía!", digo.

              "¿Por qué no?", dice Kate, mientras deja de crear sus carámbanos.

              En lugar de responderle, saco la daga de la vaina y empiezo a caminar hacia el lessathi. Billy Bob da un salto hacia atrás para alejarse de mí, pero enseguida se da cuenta de que no puede seguir retrocediendo por culpa de la mesa que le bloquea el paso. Mientras Billy Bob tiembla de miedo apoyado en el borde de la mesa con las manos detrás de la espalda, sigo avanzando hacia él con la daga lista, dispuesto a dejarlo inconsciente con la empuñadura.

              De repente, veo una visión de una potente ráfaga de fuego brotando de debajo de la baldosa bajo mis pies y reduciéndome a cenizas en cuanto doy un paso más. Mi primer instinto me dice que salte hacia atrás, pero en lugar de eso decido hacer una rápida embestida hacia delante, consiguiendo evitar el fuego por los pelos y alcanzando al lessathi en cuestión de segundos.
          - source: scene_text_2
            paragraph: 7
            text: |-
              Cuando Billy Bob me ve tan cerca, intenta sacar una pequeña daga de detrás de la espalda, pero logro golpearlo en la cabeza con la empuñadura de mi daga y dejarlo inconsciente antes de que siquiera llegue a desenvainar su propia arma.

              Esa estuvo cerca. Ni siquiera se me había ocurrido que pudiera haber un dispositivo trampa lessathi escondido debajo de esa baldosa. ¿Era por eso por lo que Billy Bob mantenía las manos detrás de la espalda? ¿Para poder pulsar algún botón oculto bajo la mesa y activar la trampa? Supongo que sí tiene sentido, ahora que lo pienso...

              "¿Te importaría decirme por qué elegiste exactamente dejar inconsciente al lessathi en lugar de matarlo?", dice Kate, mirando a Billy Bob, tendido inconsciente en el suelo a mi lado. "Te das cuenta de que, en cuanto despierte, seguirá haciendo todas las cosas horribles que estuvo haciendo hasta que lo encontramos, ¿verdad?..."
