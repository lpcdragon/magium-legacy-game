  - name: ch10_wrong
    texts:
      - source: scene_text
        paragraph: 69
        text: |-
          "Te pasan muchas cosas, Daren," digo. "Tienes suerte de tener un amigo como yo que te acepta tal como eres."

          "Sabes," dice Daren, "que esté en medio de una crisis existencial no significa que no pueda darte un coscorrón con esta rama por listillo."

          "¡Vale, vale, lo pillo!" digo. "Pero incluso sin que te lo diga, creo que ya sabes lo que te pasa, ¿no?"

          "Sí..." dice Daren. "Supongo que sí..."

          Hace una pausa antes de continuar.

          "Mañana, intentaré arreglar las cosas," dice. "No creo que pueda obligarme a disculparme con la banshee, pero haré todo lo posible para llevarme bien con ella mañana, y para demostrarle que ya no guardo ninguna hostilidad hacia ella. En cuanto a Kate, necesitaré algo de tiempo para pensar en cómo voy a abordar esto, pero pase lo que pase, no pienso dejar que las cosas sigan así. Gracias por escucharme, Barry... Creo que me siento un poco mejor ahora."

          Fueron unas horas después cuando Kate y Hadrik vinieron a relevarnos. Le pregunté a Kate en privado cómo habían ido las cosas con Illuna, y me dijo que la banshee se mostró un poco reticente al principio, pero consiguieron que se durmiera finalmente. Sin embargo, no pudieron convencerla de que apagara su alarma, así que se seguía despertando cada hora más o menos, para comprobar a Arraka, pero al menos descansó lo suficiente como para aguantar el día siguiente.
      - source: scene_text_2
        paragraph: 42
        text: |-
          Después de una buena noche de sueño, todos nos levantamos temprano por la mañana, recogimos nuestras tiendas y reanudamos nuestro viaje, con el objetivo de llegar a las ruinas antes del anochecer. Como esta vez sabíamos exactamente hacia dónde nos dirigíamos, podíamos permitirnos seguir avanzando sin detenernos a buscar cada una de las marcas de Flower, lo que nos ahorró bastantes horas en el camino de vuelta.

          Debido a todo lo que ha pasado en los últimos días, nuestro grupo estaba visiblemente empezando a unirse mucho más. Aunque no podía decir que todos nos lleváramos perfectamente, el hecho de haber sobrevivido juntos a tales dificultades confiando y apoyándonos los unos en los otros parecía haber desarrollado un cierto vínculo entre nosotros. Incluso Arraka estaba empezando a actuar más como un miembro del grupo. Como recompensa por su cooperación de ayer, su dije se dejó abierto, así que de vez en cuando se unía a nuestras conversaciones añadiendo su comentario único, aunque la mayoría estaba de alguna manera ligado a las atrocidades que cometió durante el invierno inmóvil, o era algún tipo de chiste oscuro.

          A lo largo de nuestro viaje de vuelta a las ruinas, Daren había intentado en múltiples ocasiones iniciar una conversación casual con Illuna, pero sus intentos torpes de reconciliarse con ella solo consiguieron hacerla aún más suspicaz de sus motivos. Sin embargo, a pesar de toda su valentía, todavía no le había dirigido ni una sola palabra a Kate para cuando llegamos a nuestro destino.
      - source: scene_3
        paragraph: 5
        text: El zorro se quedó bastante sorprendido cuando se enteró de que habíamos regresado con el cáliz. No creo que realmente esperara que lo consiguiéramos. Sin embargo, cumplió su palabra y nos quitó todos los collares tras confirmar que el artefacto que le habíamos traído era efectivamente el que buscaba. Como no teníamos ganas de pasar más tiempo del necesario en este lugar, nos despedimos del zorro y del leopardo, empezamos a alejarnos del bosque prohibido, y rezamos para no volver a ver a ninguno de los dos en lo que nos quedara de vida.
