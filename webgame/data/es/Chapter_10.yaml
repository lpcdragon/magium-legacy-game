  - name: ch10_ambush
    routes:
      - condition: ch10_gems = 1
        texts:
          - source: scene_text
            paragraph: 14
            text: |-
              Abro uno de los cofres y empiezo a llenarme los bolsillos con diamantes y rubíes.

              "¿En serio, Barry?" dice Daren. "¡Vinimos aquí a buscar el cáliz, no a robar a los ogros!"

              "Esta habitación entera está llena de tesoros," le digo. "Unas cuantas gemas de menos aquí y allá no van a hacer mucha diferencia."

              Después de terminar con las gemas, me uno a los demás, que ahora están de pie frente a un pedestal de mármol, sobre el cual reposa el cáliz que hemos venido a recuperar.

              "¡No hagan ruido!" nos dice Illuna, en voz baja. "El capitán ogro y sus tropas están justo detrás de esa pared detrás del cáliz."

              "¿Cuál es el capitán ogro?" pregunta Hadrik, mientras observa el holograma del fuerte.

              "El punto morado," dice Illuna. "Los puntos rojos dispersos a su alrededor son sus tropas."

              "¿Cómo es que la habitación en la que están no aparece en el mapa?" pregunta Kate.

              "Porque no aparecía en ninguno de los planos del edificio que estudiamos en la biblioteca," dice Illuna. "Probablemente sea una habitación secreta que usan para sus reuniones más confidenciales."
          - source: scene_text_2
            paragraph: 13
            text: |-
              "La forma en que colocaron el cáliz encima de un pedestal así me grita 'trampa' por todos lados," dice Daren. "¿Había alguna documentación sobre las trampas que usan para defender esta habitación?"

              "Desafortunadamente, no," dice Illuna. "Y tampoco detecto ninguna magia a su alrededor. Si hay alguna trampa, va a ser de naturaleza similar a las de las ruinas."

              "¿Podemos siquiera estar seguros de que tenemos el cáliz correcto?" dice Hadrik. "Quiero decir, se parece, pero fácilmente podrían haber hecho uno falso y colocarlo a plena vista para despistarnos."

              "Hay una manera fácil de comprobar su autenticidad," dice Illuna, y usa su magia de agua para llenar el cáliz con agua.

              Después de unos segundos, el agua en su interior empieza a irradiar magia, y luego comienza a brillar intensamente como si hubiera un pequeño sol flotando justo sobre él.

              "Eso lo resuelve," dice Illuna. "Este es el cáliz que estamos buscando."

              Luego lo agarra del pedestal y lo vacía de agua, mientras todos miramos a nuestro alrededor, para ver si se activa alguna trampa.
        choices:
          - position: 1
            text: Continuar
