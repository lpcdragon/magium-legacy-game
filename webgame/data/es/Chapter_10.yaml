              Antes de que tenga tiempo de recuperar completamente mis sentidos, una brillante luz verde envuelve a Illuna, y luego desaparece casi tan rápido como apareció. El chamán entonces empieza a reírse con voz ronca, antes de escupir algo de sangre en el suelo de la cueva.

                "Este es el final, banshee," dice el chamán, mientras tose un poco más. "Para los dos. El hechizo que acabo de lanzarte es una maldición de muerte. Un hechizo chamánico que mata tanto al lanzador como a su objetivo. Es probable que te quede menos de una hora de vida. Mi vida se perdió en el momento en que logré acorralarme dentro de mi propio ritual de chamán, ¡pero al menos ahora tendré la satisfacción de arrastrar a la traidora que causó todo este desastre al inframundo conmigo!"
          - source: scene_text_2
            paragraph: 35
            text: |-
              Luego se ríe roncamente de nuevo, y empieza a convertirse en cenizas.

              "¡Maldición!" dice Hadrik, mientras salta hacia el chamán, pero lo único que logra golpear son sus cenizas, que ahora se van acumulando lentamente en el suelo de las cavernas.

              Illuna estuvo en un breve estado de shock tras la revelación del chamán, pero luego su expresión se oscureció, y fue a sentarse en el suelo, con la espalda apoyada contra una de las paredes de la cueva.

              "¿A qué esperan?" pregunta, cuando nos ve mirándola. "Váyanse. Yo retendré a los ogros aquí. No es como si pudiera hacer mucho más en el poco tiempo que me queda."

              "¿Es verdad, entonces?" pregunta Rose. "¿Lo que dijo el ogro?"

              "Sí," dice Illuna. "La maldición es demasiado poderosa para que pueda romperla con cualquiera de los hechizos que conozco. El chamán estaba siendo generoso cuando dijo que me quedaría una hora de vida. Por lo que puedo percibir, la maldición probablemente me matará en los próximos quince minutos."

              "¡No!" grita Rose. "¡No puedes rendirte! ¡No puedes rendirte así! ¡Tiene que haber una forma de--"

              Rose se detiene a mitad de frase porque ve a Daren empezando a moverse hacia Illuna. Cuando la alcanza, levanta su espada y mira a la banshee, sin decir una palabra. Illuna lo mira a él y se ríe.
