  - name: ch10_rocks
    routes:
      - condition: strength >= 3
        texts:
          - source: scene_text
            paragraph: 42
            text: |-
              "Toma, llévate esto," le digo a Kate mientras le entrego mi daga. "Probablemente le sacarás más provecho que yo. Intentaré dar apoyo lanzándoles piedras a los lobos."

              "Entendido," dice ella, secamente, mientras toma mi arma.

              Kate entonces empieza a caminar lentamente hacia los tres lobos. Cuando se acerca lo suficiente, sale corriendo a la derecha, para confundir a los animales, y luego le atraviesa la cabeza a uno de los lobos con su cuchillo. Después de sacar su daga del cráneo de la bestia, se lanza hacia el otro y lo mata también, con un golpe rápido de su hoja. Veo que el tercer lobo está a punto de pillar a Kate desprevenida, así que rápidamente le lanzo una piedra, apuntando a su cabeza.

              La piedra fue demasiado rápida para que el lobo pudiera esquivarla a tiempo, y la fuerza detrás del peñasco fue tan grande que le aplastó completamente la cabeza al impactar.

              De repente, todo el mundo empieza a girar a mi alrededor, y pronto me encuentro de pie en medio de una cueva otra vez, con todos mis amigos a mi lado. Ellos también parecen haberse despertado recién, porque ahora están mirando a su alrededor para confirmar que efectivamente estamos de vuelta en las minas abandonadas debajo del fuerte de los ogros.

              ¡Por fin, la ilusión se ha roto! ¡Hadrik debe de haber encontrado al chamán y haberlo obligado a cancelar su hechizo!
