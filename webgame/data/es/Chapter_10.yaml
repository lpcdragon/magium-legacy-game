  - name: ch10_ending
    texts:
      - source: scene_text
        paragraph: 89
        text: |-
          "Tus amigos no pueden ayudarte esta vez, Barry," me dice Eiden. "¿Qué vas a hacer?"

          Un sentimiento de pánico me abruma de repente. Esto no puede estar pasando. Esto no puede estar pasando... Por fin nos habíamos librado de los collares. ¡Nos habíamos librado de ellos! Todo iba a estar bien. ¿Por qué has tenido que volver? ¿Por qué?

          "El tiempo se agota, Barry," dice Eiden. "Tu amiga está al límite. ¿Cómo vas a detenerme?"

          ¿Cómo VOY a detenerle? Sigo sin tener idea de cómo activó mi dispositivo de estadísticas cuando luché contra el dragón, y no conozco ninguna de sus debilidades. ¿Acaso tiene debilidades? ¿Hay alguna palabra que pueda sacarme de esto como la última vez? ¿Qué haría que la dejara ir? ¿Qué le convencería de dejarlo pasar? ¿Qué se supone que haga?

          De repente, se oye un fuerte ruido de platos rompiéndose a nuestra derecha, y Rose por fin consigue tomar una larga y profunda bocanada de aire, mientras tanto Eiden como yo nos giramos para identificar la fuente del sonido.

          Flower simplemente está ahí parada, con una expresión de puro shock en la cara, y con una docena de platos rotos a sus pies.

          "¡Vaya, pero si es Illuna, la de la masacre de los bosques sagrados!" dice Eiden, sonriendo. "Han pasado veinte años, creo. ¿Cómo has estado?"

          La expresión de Flower cambia rápidamente a una de pura rabia, mientras sus ojos se vuelven de un rojo brillante, y su aura empieza a fluctuar violentamente.
      - source: scene_text_2
        paragraph: 52
        text: |-
          "¡Tú!" grita, mientras señala a Eiden. "¡Te mataré! ¡Te mataré!"

          Luego salta hacia Eiden y empieza a lanzar una ráfaga de bolas de fuego contra él, mientras el stillwater esquiva casualmente cada una de ellas sin siquiera usar magia. Flower entonces dispara un rayo de fuego que envuelve a Eiden por completo, pero simplemente le pasa de largo y le deja ileso.

          "¡Los mataste!" dice Flower. "¡Los mataste a todos! ¡Devuélvelos! ¿Me oyes? ¡Devuélvelos!"

          Luego conjura un dragón hecho enteramente de fuego que vuela hacia Eiden y empieza a atacarlo con sus garras. Flower también se une a la batalla cuerpo a cuerpo, e intenta golpear al stillwater con sus puños de fuego.

          "Illuna," dice Eiden, mientras bloquea los golpes de la chica con una mano, y los del dragón con la otra. "¿Crees que podrías poner fin a esto? Estoy empezando a perder la paciencia..."

          Por un segundo, los ojos de la chica se volvieron de un azul brillante, y pude ver claramente el miedo en ellos. Al momento siguiente, Flower dejó de moverse, y parecía como si la estuvieran sujetando contra su voluntad por una fuerza invisible.

          "¡Suéltame, Petal!" dice la chica, mientras las lágrimas empiezan a formarse en sus ojos mientras lucha por liberarse. "¡Suéltame! ¡Tengo que matarlo! ¡Tengo que hacerlo!"

          Después de intentar en vano liberarse durante unos segundos más, Flower se gira hacia nosotros.
