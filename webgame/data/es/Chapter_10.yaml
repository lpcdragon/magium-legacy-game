            paragraph: 19
            text: |-
              Mientras Kate, Rose y yo nos apresuramos a llegar a la posición de Illuna, el capitán ogro golpea su garrote contra el suelo y el piso empieza a resquebrajarse.

              Logramos llegar a la zona segura antes de que el suelo se desmorone debajo de nosotros, pero las grietas en el suelo no se detienen, y se extienden a gran velocidad a nuestro alrededor.

              Algo está mal. ¿Por qué habrían huido los ogros a esta zona si no era segura? A menos que...

              "¡Den la vuelta!" grito. "¡Den la vuelta, ahora! ¡Nos engañaron! ¡Tenemos que--"

              Antes de que pueda terminar la frase, todo el suelo se derrumba debajo de nosotros, y todos caemos al foso. Morimos casi en cuanto llegamos al fondo.
