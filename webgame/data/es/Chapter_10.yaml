  - name: ch10_ambush2
    texts:
      - source: scene_text
        paragraph: 16
        text: |-
          "Ja," dice Hadrik. "Supongo que sobreestimamos un poco a los ogros al asumir que eran lo bastante listos como para inventar una--"

          El enano no logra terminar su frase, porque el suelo debajo de nosotros empieza a girar rápidamente, junto con nosotros y la pared detrás del pedestal. Dos segundos después, nos encontramos de pie en una habitación llena de ogros, con el capitán de la fortaleza sonriéndonos maliciosamente.

          "Yo sospechar de banshee desde principio," dice el capitán, en su lengua común chapurreada. "¡Yo decir a gran chamán que él cometer error por confiar en banshee, pero chamán no escuchar! ¡Yo saber que tú venir aquí tarde o temprano con tus amigos para robar tesoro, así que yo esperar por ti en habitación de emboscada secreta! ¡Estos ser mis mejores guerreros y todos ellos tener sed de sangre! ¡Ninguna banshee o humano salir de aquí con vida esta noche!"

          Arraka empieza a reírse.

          "¿Eso es un hecho, gordito?" dice.

          Daren no pierde tiempo y se lanza hacia el capitán, pero el ogro estaba preparado para él, y lo golpeó con su garrote en cuanto estuvo a su alcance. Daren instintivamente interpuso su escudo entre él y el arma del ogro, pero la fuerza detrás del golpe era tan grande que lo mandó volando contra una pared cercana.

          Hadrik es el siguiente en lanzarse hacia el capitán, y el ogro lo golpea con su garrote también. El enano detiene el arma poniendo las manos sobre su cabeza, y el suelo debajo de ellos empieza a resquebrajarse por el impacto del golpe del garrote.
      - source: scene_text_2
        paragraph: 15
        text: |-
          Mientras los dos se baten en duelo, Illuna empieza a presionar a los otros ogros usando sus látigos de agua, mientras hace volteretas por todos lados para evitar que la golpeen con sus garrotes.

          "¡No estar mal para enano enclenque!" dice el capitán. "Pero déjame preguntar algo. ¿Enano saber qué hay debajo de suelo de fortaleza?"

          "Sí, se llama colina," dice Hadrik. "Son como montañas, solo que más pequeñas. Puedo hacerte un dibujo para que sea más fácil de entender, si quieres."

          "Eso ser solo parcialmente correcto, enano," dice el capitán, con una sonrisa perversa. "Ser cierto que haber colina debajo de nosotros. Pero dentro de esta colina, haber minas abandonadas, que ser usadas por goblins antes que nosotros. La madera de los andamios que bajan deber estar pudriéndose ya. Los dos estar parados justo sobre pared de cueva, pero yo no poder decir lo mismo de tus amigos. Haber caída de cien metros hasta el fondo de las minas. ¿Tus amigos poder volar, enano?"

          El capitán entonces ruge con fuerza, y todas sus tropas retroceden hacia el centro de la habitación. Illuna aprovecha esto, y usa su látigo de agua para decapitarlos a todos en un solo movimiento.

          "¡Por aquí!" dice, mientras nos hace señas desde el centro de los cadáveres de ogros. "¡Esta debe ser una de las zonas seguras! ¡Rápido!"

          El capitán ogro sonríe ampliamente al oír las palabras de Illuna. Aparta a Hadrik de una patada y prepara su garrote para destrozar el suelo debajo de nosotros.
    choices:
      - position: 1
        text: Correr hacia la posición de Illuna. No hay tiempo que perder.
        effects:
          - set:
              current_scene: ch10_rush
      - position: 2
        text: Decir a Rose y Kate que debemos mantener nuestra posición.
        effects:
          - set:
              current_scene: ch10_maintain
  - name: ch10_rush
    routes:
      - condition: premonition >= 2
        texts:
          - source: scene_text
            paragraph: 17
            text: |-
              Mientras Kate, Rose y yo nos apresuramos a llegar a la posición de Illuna, el capitán ogro golpea su garrote contra el suelo y el piso empieza a resquebrajarse.

              De repente tengo una visión de los tres llegando hasta Illuna, y el suelo desmoronándose debajo de nosotros, mientras el terreno cerca de la entrada de la habitación permanece intacto.

              "¡Den la vuelta!" les digo a Kate y Rose. "¡Acabo de tener una premonición! ¡Esta zona no es segura! ¡Den la vuelta ahora!"

              Los tres salimos corriendo de vuelta, y logramos regresar a nuestra posición original justo a tiempo. Illuna, que no estaba del todo convencida, esperó hasta el último momento, y luego saltó a una pared, usándola para impulsarse hacia nuestra posición antes de que el suelo se desmoronara bajo sus pies.

              "Vaya, quién lo diría," dice. "De hecho tenías razón."

              "¡Daren!" grita Rose, mientras mira hacia abajo dentro del abismo que se había formado en el centro de la habitación.
          - source: scene_text_2
            paragraph: 16
            text: |-
              Mirando dentro del foso, veo que Daren está colgado de una viga de madera que empieza a crujir bajo su peso. Me había olvidado por completo de que lo habían lanzado contra una pared al principio de la pelea. Debía de estar todavía aturdido cuando el suelo empezó a desmoronarse. Mientras miro hacia abajo para ver si hay algún punto de apoyo que pudiera usar para llegar hasta él, me doy cuenta de que incluso si lograra de alguna manera alcanzar su posición, no habría forma de que pudiera volver a subir. Los andamios de madera son prácticamente inutilizables a estas alturas. Todo lo que queda de ellos son algunos pilares de soporte y unas pocas vigas aquí y allá que parecen poder romperse en cualquier momento.

              "¡Quédense donde están!" nos grita Daren. "¡Hagan lo que hagan, no bajen aquí! ¡No se preocupen, lo tengo todo bajo control!"

              Está mintiendo. Como mucho, le queda medio minuto antes de que esa viga se rompa bajo su peso, y no tiene forma de volver a subir. Debe estar tratando de protegernos.

              "¡Maldito seas!" le grita Hadrik al capitán ogro, mientras choca con él una vez más. "¡Fuiste tú quien les dijo a los ogros que el centro de la habitación era una zona segura, ¿verdad?! ¿Las vidas de esos soldados no valían nada para ti?"

              "¡Ja!" dice el capitán. "Esos no ser mis mejores guerreros. Ser solo carne de cañón. Todos reemplazables. Yo solo ser lo bastante fuerte para acabar con todos ustedes. ¡Mira abajo! Uno de tus amigos ya estar al final de su cuerda. El resto de ustedes ir a seguirlo pronto."
        effects:
          - set:
              successful_checks:
                - '[ Comprobación de premonición exitosa - nivel 2 ]'
        choices:
