  - name: ch10_toast
    texts:
      - source: scene_text
        paragraph: 53
        text: |-
          "¡Me alegro tanto de que no nos hayamos topado con ningún mago desde que dejamos las ruinas!" dice Rose, intentando cambiar de tema. "Nos habría llevado mucho más tiempo completar nuestra misión si hubiéramos seguido encontrándonos con gente que atacaba a Kate sin previo aviso."

          "¿Por qué te atacan a ti específicamente?" le pregunta Illuna a Kate. "¿No forman la mayoría de las personas de este grupo parte del mismo torneo?"

          "Sí, pero yo soy la única aquí a la que confunden con una banshee," dice Kate. "Flower intentó enseñarme a suprimir mi aura lo suficiente como para pasar por una humana normal, pero simplemente no pude seguirle el ritmo."

          "Esa chica tiene un talento extraordinario cuando se trata de aprender estas cosas por sí misma, pero es una profesora muy mediocre," dice Illuna. "La técnica en sí no es tan difícil de dominar. Solo necesitas un poco de orientación para aprender lo básico. Por ejemplo, un buen punto de partida sería practicar calmando el flujo de tu aura primero. Aquí, déjame mostrarte cómo se hace."

          Illuna pasó las siguientes dos horas enseñando a Kate cómo suprimir su aura, paso a paso, mientras seguíamos marchando hacia las ruinas. Para cuando terminó, pude ver que habían hecho un progreso enorme. El aura mágica de Kate apenas era perceptible cuando la suprimía ahora, y fácilmente podrías confundirla con una humana normal si no la examinabas de cerca. Las lecciones de Illuna fueron lo suficientemente interesantes como para que incluso Hadrik y yo nos uniéramos a mitad de camino, y ambos pasamos más de media hora haciendo varios ejercicios sugeridos por ella para ayudarnos a ocultar nuestras auras de los enemigos.
      - source: scene_text_2
        paragraph: 38
        text: |-
          Una vez encontramos un buen lugar para acampar, empezamos a montar nuestras tiendas. Hadrik dijo que dos de sus tiendas de repuesto necesitaban ser reparadas antes de poder usarlas de nuevo, así que Rose ofreció compartir su tienda con Kate e Illuna por la noche. Cuando empezamos a discutir cómo dividir los turnos de guardia entre nosotros, Kate, Rose y Hadrik votaron unánimemente para que Daren y yo tomáramos el primer turno. Su impecable sincronización al votar por nosotros fue sospechosa, como poco, pero decidí no señalarlo por el momento.

          Antes de irnos a dormir, Hadrik insistió en que hiciéramos un brindis para celebrar nuestra victoria, pero nadie parecía estar de humor para beber, dado lo cansados que estaban tras los eventos de hoy.
    choices:
      - position: 1
        text: Ofrecerme a compartir una copa con Hadrik antes de tomar el primer turno
        effects:
