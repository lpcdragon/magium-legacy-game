  - name: ch10_ritual
    texts:
      - source: scene_text
        paragraph: 29
        text: |-
          "Oh, no seas tan modesto, chamán," dice Arraka, mientras cambia el punto azul correspondiente al chamán a un color verde. "Debes haber tenido al menos alguna idea de lo que estaba pasando, de lo contrario no habrías tomado deliberadamente la firma mágica de uno de tus soldados cuando bajaste aquí, para engañar mi sentido mágico. ¿Qué es ese señuelo que dejaste arriba con tu propia firma mágica, de todos modos? ¿Un clon?"

          "No," dice el chamán. "Es uno de mis seguidores, sosteniendo un artefacto que copia mi aura."

          "Fascinante," dice Arraka, mientras cambia el color del punto verde original a azul.

          "¿Cómo descubrieron dónde estábamos?" dice Illuna.

          "El capitán y yo teníamos un enlace telepático, que estaba destinado a avisarme una vez que abandonara el reino de los vivos," dice el chamán. "Van a pagar por esto, pequeña traidora. Mis seguidores van a convertirlos a todos en cenizas."

          Luego levanta su bastón en el aire, y los cinco otros ogros se colocan frente a él, lanzando bolas de fuego al unísono hacia nosotros. Hadrik y Daren también se adelantan, para formar nuestra primera línea de defensa. El enano concentra su aura en sus puños, y devuelve dos de las bolas de fuego directamente a los ogros. Daren coloca su espada frente a él, absorbiendo las otras tres bolas de fuego dentro de ella. Luego lanza un tajo con su espada llameante hacia los ogros, y les envía un poderoso rayo de fuego que los calcina por completo.
      - source: scene_text_2
        paragraph: 24
        text: |-
          "Ahora sí que la han hecho..." dice el chamán, con una mirada sombría en los ojos, mientras observa las cenizas de sus cinco seguidores. "No planeaba usar esto contra ustedes, pero no me dejan otra opción."

          Luego golpea su bastón contra el suelo, y toda la habitación se llena de una espesa niebla gris. Cuando la niebla se despeja un poco, me doy cuenta de que ya no estamos de pie en medio de una caverna, sino en un campo abierto, y parece estar... ¿nevando?

          Mis ojos no me engañan. Realmente está nevando. Hay una gruesa capa de nieve en el suelo, y los árboles que veo a la distancia están todos cubiertos de nieve también. ¿Podría ser esto una ilusión?

          "¡Maldición!" dice Arraka. "Lo perdí por completo. Se volvió invisible de nuevo, y no puedo sentir su aura en absoluto. De hecho, tampoco puedo sentir ninguna de las auras de ustedes. ¿Qué demonios?"

          "No eres la única," dice Kate. "También he perdido completamente mi sentido mágico. ¿Podría tener algo que ver con la niebla?"

          "No," dice Illuna. "Esto es un ritual de chamán. Básicamente, es un hechizo de afección mental muy avanzado. Ya no estamos en el mundo real, y por lo tanto, hay reglas diferentes. No solo hemos perdido nuestros sentidos mágicos, sino también nuestros poderes mágicos. Ustedes ya llevaban collares, así que no notan la diferencia, pero Arraka y yo no podemos lanzar ningún hechizo en este momento. Además, parece que las armas a distancia tampoco están permitidas, ya que la ballesta de Barry ha desaparecido. Creo que los objetos mágicos sí siguen funcionando, ya que el chamán debe haber usado su bastón para volverse invisible."
    choices:
      - position: 1
        text: Entonces, ¿qué está pasando en el mundo real, ahora mismo?
        effects:
          - set:
              current_scene: ch10_real
      - position: 2
        text: ¿Cómo salimos de aquí?
        effects:
          - set:
              current_scene: ch10_out
  - name: ch10_real
    texts:
      - source: scene_text
        paragraph: 30
        text: |-
          "Entonces, ¿qué está pasando en el mundo real, ahora mismo? ¿El chamán planea matarnos mientras estamos atrapados aquí?"

          "No," dice Illuna. "Los rituales de chamán son diferentes de otros hechizos de afección mental. Primero que todo, el tiempo fluye de manera diferente en este lugar. Un año pasado en este mundo equivale a solo un segundo en el mundo real. Segundo, el chamán también está atrapado aquí con nosotros."

          "Entonces, ¿cuál es el propósito?" dice Hadrik. "¿No es como una especie de sueño? ¿No nos despertaremos simplemente cuando muramos?"

          "Puede que no estés familiarizado con estos tipos de hechizos, ya que no son tan comunes en los otros continentes," dice Illuna, "pero esto no se parece en nada a un sueño. Puedes sentir dolor, puedes concentrarte sin despertar, y si mueres aquí, mueres en el mundo real también. Lo que está sucediendo realmente es que nuestras almas del plano etéreo ya no están conectadas directamente al plano terrenal, sino a otro universo de bolsillo del plano etéreo. Para reconectar nuestras almas a nuestros cuerpos, necesitaríamos cerrar los ojos, pensar en los últimos momentos antes de ser transportados aquí, obtener una imagen clara de esas cavernas en nuestras mentes y luego concentrarnos en ella, con la convicción de que la imagen en nuestras cabezas representa el mundo real, mientras que el mundo en el que estamos de pie es solo una ilusión. La imagen en nuestras cabezas entonces empezaría lentamente a volverse más vívida, hasta que eventualmente reemplazaría el mundo frente a nuestros ojos."

          "¿Y para salir de aquí, todos tendríamos que hacer eso?" pregunta Daren. "¿Incluyendo al chamán?"
      - source: scene_text_2
        paragraph: 25
        text: |-
          "Exacto," dice Illuna. "Nuestro problema es el chamán. Hasta que nos deshagamos de él, no podremos regresar al mundo real. Por eso se atrapó a sí mismo aquí con nosotros."

          "¿Cómo se supone que luchemos contra él si tiene control total de este mundo?" dice Hadrik. "¿No sería como pelear contra algún tipo de dios?"

          "No," dice Illuna. "El chamán no tiene ningún control sobre este mundo. Solo lo creó. Una vez que se atrapó aquí, se vio obligado a seguir las mismas reglas que el resto de nosotros. Esa es la naturaleza de estos rituales de chamán. Tampoco tiene magia, excepto por los hechizos de su bastón. Y dado que ha sido tan amable de dejarnos terminar nuestra conversación, sospecho que no tiene intención de enfrentarnos de frente. Debe estar esperando algo."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch10_wolves
  - name: ch10_out
    texts:
      - source: scene_text
        paragraph: 31
        text: |-
          "¿Cómo salimos de aquí?"

          "¿No es como una especie de sueño?" dice Hadrik. "¿No podemos simplemente pellizcarnos para despertar?"

          "Puede que no estés familiarizado con estos tipos de hechizos, ya que no son tan comunes en los otros continentes," dice Illuna, "pero esto no se parece en nada a un sueño. Puedes sentir dolor, puedes concentrarte sin despertar, y si mueres aquí, mueres en el mundo real también. Lo que está sucediendo realmente es que nuestras almas del plano etéreo ya no están conectadas directamente al plano terrenal, sino a otro universo de bolsillo del plano etéreo. Para reconectar nuestras almas a nuestros cuerpos, necesitaríamos cerrar los ojos, pensar en los últimos momentos antes de ser transportados aquí, obtener una imagen clara de esas cavernas en nuestras mentes y luego concentrarnos en ella, con la convicción de que la imagen en nuestras cabezas representa el mundo real, mientras que el mundo en el que estamos de pie es solo una ilusión. La imagen en nuestras cabezas entonces empezaría lentamente a volverse más vívida, hasta que eventualmente reemplazaría el mundo frente a nuestros ojos."
      - source: scene_text_2
        paragraph: 26
        text: |-
          "Si realmente es tan fácil salir de aquí, ¿para qué se molestó el chamán en lanzar el ritual en primer lugar?" pregunta Daren.

          "Porque todos los atrapados aquí necesitan estar dispuestos a salir para que ese método funcione," dice Illuna. "El problema es que el chamán se atrapó aquí con nosotros, para impedirnos escapar. Hasta que nos deshagamos de él, no podremos regresar al mundo real. Afortunadamente, los rituales de chamán no son como otros hechizos de afección mental. El tiempo fluye de manera diferente aquí, lo que significa que un año en este lugar equivale a solo un segundo en el mundo real. No necesitamos preocuparnos de que los otros ogros nos alcancen y maten nuestros cuerpos reales mientras estamos aquí. Solo necesitamos centrarnos en encontrar al chamán y matarlo."

          "¿Cómo se supone que luchemos contra él si tiene control total de este mundo?" dice Hadrik. "¿No sería como pelear contra algún tipo de dios?"

          "No," dice Illuna. "El chamán no tiene ningún control sobre este mundo. Solo lo creó. Una vez que se atrapó aquí, se vio obligado a seguir las mismas reglas que el resto de nosotros. Esa es la naturaleza de estos rituales de chamán. Tampoco tiene magia, excepto por los hechizos de su bastón. Y dado que ha sido tan amable de dejarnos terminar nuestra conversación, sospecho que no tiene intención de enfrentarnos de frente. Debe estar esperando algo."
