  - name: ch10_dagger
    texts:
      - source: scene_text
        paragraph: 47
        text: |-
          "Toma," le digo a Kate mientras le entrego mi daga. "Estoy seguro de que le puedes sacar más provecho que yo."

          "Lo haré," dice ella, secamente, mientras toma mi arma.

          Kate entonces empieza a caminar lentamente hacia los tres lobos. Cuando se acerca lo suficiente, sale corriendo a la derecha, para confundir a los animales, y luego le atraviesa la cabeza a uno de los lobos con su cuchillo. Después de sacar su daga del cráneo de la bestia, se lanza hacia el otro y lo mata también, con un golpe rápido de su hoja. El tercer lobo logra herir la pierna derecha de Kate con una de sus garras, pero es asesinado también, poco después. Kate entonces se arranca rápidamente una de las mangas de su blusa y la usa para atarla alrededor de su muslo y detener el sangrado.

          De repente, todo el mundo empieza a girar a mi alrededor, y pronto me encuentro de pie en medio de una cueva otra vez, con todos mis amigos a mi lado. Ellos también parecen haberse despertado recién, porque ahora están mirando a su alrededor para confirmar que efectivamente estamos de vuelta en las minas abandonadas debajo del fuerte de los ogros.

          ¡Por fin, la ilusión se ha roto! ¡Hadrik debe de haber encontrado al chamán y haberlo obligado a cancelar su hechizo!
