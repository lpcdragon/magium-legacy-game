                  current_scene: ch10_rocks
                  ch10_kate_scratched: 0
      - condition: agility < 3
        texts:
          - source: scene_text
            paragraph: 40
            text: |-
              El lobo esquiva mi ataque sin esfuerzo, y luego casi inmediatamente se lanza de vuelta hacia mí con los colmillos al descubierto. Antes de que tenga oportunidad de hundir sus dientes en mi piel, veo una daga atravesándole la cabeza, y la bestia cae sin vida al suelo poco después. Kate saca su daga de la cabeza del lobo, y me lanza una mirada acusatoria.

              "Si no estás acostumbrado a tratar con animales salvajes, deberías mantenerte al margen y dejar la pelea al resto de nosotros," dice Kate. "Estas bestias no te mostrarán piedad."

              Luego se pone detrás de otro lobo, y le clava su cuchillo en la parte trasera de la cabeza, matándolo al instante.

