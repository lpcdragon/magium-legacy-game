  - name: ch10_ease
    texts:
      - source: scene_text
        paragraph: 78
        text: |-
          "Sabes..." digo. "Después de que caisteis inconscientes por el ataque de Diane, yo conseguí mantenerme despierto un poco más, gracias a mi mayor resistencia a la electricidad."

          Al oír mis palabras, Kate levanta la cabeza y empieza a observarme atentamente.

          "Vi a los lessathi con los que trabajaba," continúo. "Ambos querían que nos mataran, pero tu amiga les plantó cara. Dijo que los mataría si le ponían un dedo encima a cualquiera de nosotros. Es la razón por la que seguimos vivos ahora mismo."

          Kate se ríe.

          "Y también la razón por la que casi nos matan un zorro diosa y un fuerte lleno de ogros en los últimos días," dice. "Entiendo por qué me cuentas esto, y te agradezco tu preocupación, pero ya sospechaba que lo que dijo e hizo era su manera de intentar protegerme. Sin embargo, eso no excusa su comportamiento y la forma en que nos puso a todos en un peligro aún mayor con sus acciones. Siempre ha sido así. No lo pensaba dos veces antes de hacer lo que creía correcto, pero eso a menudo solo conseguía empeorar las cosas todavía más. Juro que le voy a dar una buena paliza cuando la vuelva a ver."

          "¿Eso significa que aún vas a participar en el torneo?"

          "Sí, yo..."

          Hace una pausa.
      - source: scene_text_2
        paragraph: 45
        text: |-
          "Ya no tengo ninguna pista sobre el paradero de Diane," dice Kate. "Y si los organizadores eventualmente anuncian algunos objetivos, tendré que al menos intentar completar sus tareas, para evitar que me descalifiquen por falta de participación. Hasta entonces, estaba pensando en quedarme con vosotros. Es decir, si..."

          Hace otra pausa.

          "...Si me queréis con vosotros..." continúa.

          "¡Claro que te queremos con nosotros, Kate!" digo. "Sé que Daren ha estado actuando un poco raro últimamente, pero créeme cuando te digo que--"

          Me detengo a mitad de frase porque veo que Daren ahora se dirige hacia nosotros, con una expresión muy incómoda en la cara.

          "Hablando del rey de Roma..." le digo a Kate, en voz baja.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch10_sulking
  - name: ch10_happened
    texts:
      - source: scene_text
        paragraph: 79
        text: |-
          "Entonces, ¿qué piensas hacer ahora?" le pregunto. "¿Vas a seguir buscando a Diane?"

          Kate no me responde inmediatamente, decidiendo en su lugar pasar unos segundos estudiando una colonia de hormigas avanzando lentamente hacia su hormiguero.

          "Sí..." dice después de un rato. "No voy a rendirme solo porque me echó. Ya la he visto actuar así antes. Está intentando protegerme de algo. Intentando cargar con todas las responsabilidades ella sola como hacía cuando éramos niñas. Odio cuando hace eso. Y para empeorar las cosas, su comportamiento impulsivo es lo que casi nos manda a todos a la tumba. Juro que le voy a dar una buena paliza cuando la vuelva a ver."

          "¿Eso significa que aún vas a participar en el torneo?"

          "Sí, yo..."

          Hace una pausa.
