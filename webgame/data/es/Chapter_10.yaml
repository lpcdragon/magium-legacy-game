  - name: ch10_chain
    texts:
      - source: scene_text
        paragraph: 85
        text: |-
          "¿E Illuna?" pregunta Kate. "¿Cómo se siente ella con todo esto?"

          Todas nuestras miradas se fijan en la chica, mientras sus propios ojos se vuelven de un azul brillante, e Illuna empieza a mirar nerviosamente a su alrededor.

          "Supongo que... no nos vendría tan mal acompañaros un poco más..." dice.

          "¡Decidido, entonces!" dice Daren. "Haced las maletas, nos vamos en media hora."

          "¡Un momento!" dice Arraka. "¿Nadie va a preguntarme cómo me siento yo con todo esto? ¿Y si os dijera que estoy profundamente insatisfecha con la ratio abismalmente baja de muertes por hora de este grupo y que solo consideraría continuar nuestra colaboración si prometéis trabajar en mejorarla, eh? ¿Qué entonces?"

          Todos nos quedamos mirando el amuleto de Arraka durante unos segundos, hasta que Hadrik decide romper el silencio.

          "¡Muy bien, entonces!" dice. "Es hora de empezar a desmontar nuestras tiendas. ¡Nos vemos aquí en treinta minutos!"

          "¡Eh!" dice Arraka, mientras todos nos dirigimos a nuestras tiendas. "¡EH! ¡No os atreváis a ignorarme! ¿Me oís? ¡Volved aquí! ¡Todavía no he terminado de quejarme!"

          Me llevó un rato, pero después de terminar con mi tienda y mi mochila, volví a nuestro punto de encuentro, donde todos excepto Kate parecían haber llegado ya. Al acercarme, vi que Flower estaba haciendo girar el amuleto de Arraka por la cadena con una expresión de descontento.
      - source: scene_text_2
        paragraph: 49
        text: |-
          "Esta cadena se está quedando vieja," dice. "Tendremos que conseguir una nueva la próxima vez que estemos en una ciudad."

          "¡Genial!" grita Arraka. "Ahora, si has terminado de poner a prueba la durabilidad de la cadena, ¿PODRÍAS PARAR CON EL GIRO?!"

          "Ah, claro, perdona," dice Flower, mientras agarra el amuleto y se lo vuelve a colgar del cuello. "Se me olvidó que tienes mareos."

          "Espera, ¿en serio?" pregunta Hadrik, con una carcajada. "¿La todopoderosa e invencible banshee no soporta un poco de giro?"

          "Es porque está atrapada en el amuleto," dice Illuna. "Altera sus sentidos. No tenía ningún problema de este tipo cuando poseía cuerpos de animales."

          "Oh, bien, Kate ha llegado," dice Daren, al ver a Kate acercarse. "Supongo que ya podemos irnos."

          "¿Hacia dónde vamos, exactamente?" pregunta Hadrik.

          "La ciudad de Thilias," dice Rose. "Es un pequeño pueblo portuario cerca de la costa sur. ¡Es precioso en esta época del año!"
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch10_tracing
  - name: ch10_tracing
    texts:
      - source: scene_text
        paragraph: 86
        text: |-
          "Vale, estoy aquí," dice Kate, uniéndose al resto de nosotros. "Vámonos."

          "¡Esperad!" dice Flower. "Acabo de recordar algo. ¡Los platos! Se me olvidó lavar los platos."

          "¿A quién le importan los platos?" pregunta Daren. "¿No puedes simplemente conjurar unos nuevos de la nada como haces con la comida?"

          "Sí, pero sería un desperdicio simplemente dejarlos aquí," dice Flower. "Se venden a muy buen precio en el mercado. No tardaré nada, lo prometo. Los recojo rápido y los lavo en el río. ¡Ahora vuelvo!"

          "Sabes, siempre me he preguntado una cosa," le dice Hadrik a Daren, mientras Flower pasa a toda prisa. "Si os llaman magos blancos, ¿no deberían llamar a los nigromantes magos negros? Ya sabes, para mantener la temática."

          "En realidad, eso es un error muy común," dice Daren. "Esto no tiene nada que ver con guerreros de la luz luchando contra las fuerzas de la oscuridad. La única razón por la que los magos blancos se llaman así es por la luz brillante que aparece cuando lanzan la mayoría de sus hechizos. No es realmente un nombre oficial, pero supongo que se quedó. Algunos magos blancos con un palo metido ya sabes dónde incluso se ofenden cuando les llaman así, y ellos--"

          Daren dejó de hablar, porque una figura familiar acababa de aparecer de la nada frente a él. Un chico con los ojos cerrados, las manos en los bolsillos y una sonrisa educada en la cara.

          "¡Saludos, amigos!" dice Eiden. "¡Traigo noticias!"
      - source: scene_text_2
        paragraph: 50
        text: |-
          "Eiden..." dice Daren, con el ceño fruncido.

          "Vamos, vamos," dice Eiden. "¡No hay necesidad de ser tan hostiles! ¡Solo vine a ayudar!"

          "Espera, ¿cómo nos has encontrado?" le pregunto.

          "¡Rastreando vuestras auras, por supuesto!" dice Eiden. "Acabo de terminar mis asuntos en el otro lado de la isla, y pensé pasar a visitar."

          "¿Cómo podrías habernos identificado solo por nuestras auras desde tan lejos?" digo.

          "Nuestras auras son mucho más complejas de lo que podrías pensar, Barry," dice Eiden. "La mayoría de la gente solo las usa para conocer la destreza mágica de una persona, y quizás para entender su estado emocional básico, pero el aura de una persona es capaz de mostrarnos mucho más que eso. Con suficiente práctica, verás que el aura de cada persona es única, y puede usarse para rastrearla a gran distancia, si tu sentido mágico es lo suficientemente agudo. El mío cubre toda la isla de Varathia."

          "¿Quieres decir que puedes averiguar el paradero de cualquier persona en cualquier momento?" digo.
      - source: scene_3
        paragraph: 8
        text: |-
          "Sí, pero como he dicho, las auras pueden usarse para muchas otras cosas," dice Eiden. "Por ejemplo, si estudias las fluctuaciones del aura de una persona con suficiente cuidado, puedes saber si está mintiendo o no. Además de eso, también puedes averiguar su edad, su raza y su estado mental. ¡Si manipulas suficiente el aura de una persona, incluso puedes evitar que envejezca! Hablando de auras, Barry, resulta que vi tu aura muy cerca de dos lessathi hace unos días. ¿Recordaste darles mi mensaje?"

          Mierda, está hablando de los dos lessathi que estaban con Diane. Su estúpido mensaje era lo último que tenía en mente en aquel momento. ¿Qué se supone que le digo ahora?
