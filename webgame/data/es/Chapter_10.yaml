      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch10_adorable
  - name: ch10_adorable
    texts:
      - source: scene_text
        paragraph: 12
        text: |-
          "¡Arraka, ya basta!" dice Illuna.

          "¡Pero por supuesto, para moldearla a mi imagen, primero necesitaba destruirla por completo!" continúa Arraka, ignorando a Illuna. "Así que empecé a enseñarle incluso más de lo que les enseñé a las demás. Me aseguré de que conociera todo tipo de técnicas oscuras y de que pudiera controlar su elemento de agua a la perfección. Luego, cuando llegó el momento, las llevé a todas a uno de los bosques sagrados. Fue fácil hacer que me siguieran. Todas confiaban en mí con sus vidas, y no sabían que las estaba llevando a territorio prohibido. Las pobres Unuri y Sidara no fueron rivales para los valientes guardianes del bosque, e Illuna no era lo suficientemente fuerte como para luchar contra todos los animales ella sola mientras también protegía a sus amigas."

          "¡Arraka, te lo advierto!" dice Illuna.

          "¡Oh, e Illuna era simplemente adorable!" dice Arraka. "¿Les conté? En aquel entonces se negaba rotundamente a matar a otras criaturas vivientes a menos que no tuviera otra opción. ¡Pasaba días deprimida después de cambiar de huésped, porque se había visto obligada a acabar con la vida de alguien sin su consentimiento! Ni que decir tiene que, incluso en una situación tan desesperada como esta, Illuna aún se negó a matar a los animales, y simplemente los incapacitó. Lo sé, porque estaba observando todo desde arriba, mientras me reía sin parar. Al principio no entendían lo que estaba haciendo. Seguían llamándome, suplicándome que las salvara como siempre hacía. Vieron todos los eventos desarrollarse ante sus ojos, pero sus mentes simplemente no podían comprenderlos. Fue solo cuando Unuri y Sidara fueron empaladas que la cruda realidad finalmente golpeó a Illuna en la cara."
      - source: scene_text_2
        paragraph: 11
        text: |-
          Mientras Arraka habla, puedo sentir el aura de Illuna empezando a fluctuar violentamente. Esta es la primera vez que la veo exhibir emociones tan fuertes por algo. Normalmente, el flujo de su aura es casi indistinguible del aire a su alrededor.

          "Seguía gritándoles a los animales que la dejaran pasar," dice Arraka. "Seguía diciéndoles que se apartaran de su camino, pero no escuchaban. Así que, en un ataque de rabia, Illuna exterminó hasta el último de esos guardianes, sin dejar supervivientes, y luego corrió hacia el lado de sus amigas, agarrando sus cuerpos sin vida y sacudiéndolos desesperadamente, como si esperara que de repente volvieran a la vida. '¡Por favor!' decía. 'No me dejen,' decía. 'Yo no-- No quiero estar sola--' ¡AJA- JAJAJAJAJAJA--"

          Illuna cerró el amuleto y lo apretó firmemente en su puño. Podía ver su mano temblando mientras sostenía el amuleto, y creo que casi pude oír un pequeño crujido proveniente de él. Tal como Arraka le había advertido, el holograma del fuerte desapareció casi en el momento en que cerró el medallón.

          "Devuélvelo," dice Illuna, secamente, mientras vuelve a abrir el amuleto.

          "¿Mmm?" dice Arraka. "¿Devolver qué? Oh, ¿te refieres al holograma? El holograma se fue. ¿No lo viste desaparecer? Necesitaré horas para recrearlo de nuevo. Deberías haberme escuchado cuando tenías la oportunidad, pero nooo, tenías que ser tu vieja terca de siempre y--"

          "¡Dije que lo devuelvas!" le grita Illuna.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch10_treasury
  - name: ch10_treasury
    texts:
      - source: scene_text
        paragraph: 13
        text: |-
          Un breve silencio siguió a las palabras de Illuna, durante el cual nadie dijo una palabra.

          "¡Está bien, de acuerdo!" dice Arraka después de un rato, y conjura de vuelta el fuerte de ogros en miniatura, con todos sus detalles aún intactos. "¡Te juro que no tienes absolutamente ningún sentido del humor. No sé cómo esa chica te aguanta!"

          Illuna ignora a Arraka, y se vuelve hacia Hadrik.

          "¿Confío en que la explicación de Arraka sobre la masacre de los bosques sagrados será suficiente?" le pregunta, con una mirada sombría en el rostro. "¿O quizás te gustaría oír más detalles?"

          "Eh, no..." dice Hadrik. "Creo que ya tengo suficiente, gracias..."

          Illuna entonces se da la vuelta y empieza a guiarnos hacia los niveles inferiores, mientras todos la seguimos, en silencio. Gracias al mapa de Arraka, pudimos evitar con éxito a la mayoría de los guardias mientras avanzábamos hacia la sala del tesoro. Los que no pudimos evitar fueron despachados rápida y silenciosamente por Illuna. Su forma de hacer las cosas era completamente opuesta a la de Flower. Era fría y calculadora, y usaba las habilidades atléticas de la chica a su favor al ir a por el golpe final. Cada vez que tenía que eliminar a un guardia ogro, trepaba por una de las paredes, se posicionaba sobre él y luego se colgaba del techo para asestar el golpe definitivo.
      - source: scene_text_2
        paragraph: 12
        text: |-
          Nos tomó menos de media hora llegar a la sala del tesoro, situada en el nivel más bajo del edificio principal de la fortaleza. Solo había dos guardias en la entrada, que fueron fácilmente eliminados. Sin embargo, aunque nos aseguramos de esconder todos los cuerpos en el camino hasta aquí, probablemente sea solo cuestión de tiempo antes de que una patrulla de ogros se dé cuenta de que algo está mal y dé la alarma. Vamos a necesitar movernos rápido y salir de aquí antes de que eso pase.

          Al entrar en la sala del tesoro de los ogros, pude ver que estaba llena de montañas y montañas de oro, así como docenas de cofres que contenían toda clase de joyas y objetos preciosos. Si tan solo tuviera mi mochila encantada conmigo ahora, la habría llenado hasta el tope de tesoros. Aun así, hay bastante espacio en mis bolsillos para guardar algunas de estas pequeñas gemas caras. Los diamantes en particular deberían conseguirme una suma considerable en cualquier mercado respetable. Después de todo, ¿cuándo tendré otra oportunidad como esta?
    choices:
      - position: 1
        text: Tomar las gemas
        effects:
          - set:
              current_scene: ch10_ambush
              ch10_gems: 1
      - position: 2
        text: No tocar nada
        effects:
          - set:
              current_scene: ch10_ambush
