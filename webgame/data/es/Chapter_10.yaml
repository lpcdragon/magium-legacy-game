  - name: ch10_lemon_cakes
    texts:
      - source: scene_text
        paragraph: 77
        text: |-
          Tras terminar la conversación con Flower y montar todas nuestras tiendas, todos nos tomamos un pequeño descanso para comer algo. Como la chica tenía energía mágica de sobra después de su larga siesta, ofreció conjurar para cada uno de nosotros un plato a nuestra elección. Yo no tenía especial hambre, así que simplemente pedí unos pasteles de limón. Sin embargo, todos los demás se lo tomaron en serio y pidieron los platos más extravagantes que se les ocurrieron, como costillas de manticora sazonadas con una variedad de especias, o alas de grifo bañadas en miel. Todos excepto Kate, eso sí. Dado que nunca había tenido el lujo de probar otra comida que la que ella misma había cazado, simplemente pidió muslos de pato asados y se fue a comer sola en un tronco a unas docenas de pies de nuestro campamento.

          Después de saciarme con los pasteles de limón, fui al lado de Kate, para ver cómo estaba. La pillé mirando fijamente a uno de los árboles frente a ella, y ni siquiera me notó hasta que me coloqué justo delante.

          "¿Todavía pensando en Diane?" le pregunto.

          Kate pareció un poco sorprendida por mi franqueza, pero al final decidió responderme con honestidad.

          "Sí..." dice. "Ha estado en mi mente desde que me desperté en esas ruinas, pero he estado haciendo todo lo posible por no dejarlo notar, dada la situación en la que estábamos."

          "Toma," le digo. "Come unos pasteles de limón. ¡Yo ya me he llenado!"

          "Gracias..." dice, mientras acepta mi oferta.
    choices:
      - position: 1
        text: Contarle cómo Diane nos defendió de los dos lessathi, para tranquilizar a Kate
        effects:
          - set:
              current_scene: ch10_ease
      - position: 2
        text: Preguntarle si todavía va a buscar a Diane después de lo que pasó
        effects:
