  - name: ch10_unconscious
    texts:
      - source: scene_text
        paragraph: 67
        text: |-
          "La cuestión es que Illuna no ha dormido en absoluto desde antes de su turno de anoche, y estoy empezando a preocuparme un poco. Creo que tiene miedo de que Daren la mate mientras duerme si la ve vulnerable, y ya no tiene a Flower para protegerla mientras no está despierta. Probablemente solo continuó viajando con nosotros porque estaría en mucho más peligro sola que en grupo, considerando todos los magos poderosos que merodean por el continente ahora mismo y el hecho de que está demasiado cansada para seguir suprimiendo su aura hasta mañana."

          "¿Así que quieres que mantenga a Daren ocupado mientras tú y Kate intentáis convencerla de que eche una siesta?"

          "Sí, por eso convencí a Hadrik de que dijera que dos de sus tiendas están inutilizables, para que Kate y yo pudiéramos dormir en la misma tienda que Illuna. Creo que podemos conseguir que se duerma si le prometemos que Kate vigilará el amuleto de Arraka para ver si intenta escapar otra vez."

          Suspiro.

          "Sé que Daren no siempre es la herramienta más afilada del cobertizo," digo, "pero creo que le estás subestimando un poco. Me sorprendería si no hubiera descubierto ya tu plan..."
      - source: scene_text_2
        paragraph: 40
        text: |-
          "Me da igual si descubrió o no mi plan," dice Rose. "Lo que quiero es que se mantenga lejos de Illuna para que pueda por fin dormir bien una noche. No creo que Daren intente hacerle daño mientras está inconsciente, pero mantenerle lo más lejos posible de ella es la única forma en que Illuna puede sentirse segura ahora mismo. Siento mucho haberte metido en esto a la fuerza, pero prefiero mucho más tenerte a ti con Daren que a Hadrik, y yo no puedo acompañaros porque necesito quedarme al lado de Illuna, ya que probablemente soy la única en la que confía algo dentro de nuestro grupo. Pero si no te apetece seguir adelante con esto, lo entiendo... Intentaré ver si Hadrik--"

          "¡No, no, no es lo que quería decir!" digo. "Mira, esto es lo que vamos a hacer. Me aseguraré de que Daren no se acerque a vuestra tienda durante nuestro turno, pero si da alguna pista de haber descubierto lo que tramáis, no voy a empezar a inventar mentiras al respecto. Si pregunta, le diré la verdad. ¿Trato?"

          Rose sonríe, y me estrecha la mano.

          "¡Trato!" dice.

          "Muy bien, entonces," digo. "Bueno, en ese caso, me voy a empezar mi turno de noche. ¡Deséame suerte!"

          "¡Buena suerte, Barry!" dice Rose. "Y gracias..."

          Luego se dirige a su tienda, mientras yo cojo mi ballesta y empiezo a caminar hacia el lugar donde Daren estaba sentado puliendo su arma.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch10_stubbornly
  - name: ch10_stubbornly
    texts:
      - source: scene_text
        paragraph: 68
        text: |-
          "Ya te habías tardado," me dice mientras me siento en la hierba a su lado. "¿Rose te dijo que me mantuvieras ocupado mientras ellas intentan dormir a la banshee?"

          Así que realmente lo tenía todo calado.

          "Sí," digo. "Acaba de terminar de darme las instrucciones."

          Daren suspira, mientras deja de pulir su espada lentamente.

          "Escucha, Barry," dice. "Me doy cuenta de que he sido un poco imbécil últimamente. Más de lo habitual incluso. Y por lo que vale, lo siento..."

          Oír a Daren darme una disculpa sincera se siente tan natural como ver a un elemental de fuego bañarse en un manantial de montaña. Sin embargo, parece ser sincero al respecto.

          "Está bien," le digo. "¡No te preocupes por ello!"

          "No, no está bien," dice Daren. "He estado aferrándome tercamente a la idea de que las banshees no pueden ser de fiar, y casi estaba dispuesto a empezar una pelea contigo por ello. Incluso después de que se me presentaran pruebas claras de lo contrario, aún me negué a creerlo, y eso casi acaba costándome la vida."
      - source: scene_text_2
        paragraph: 41
        text: |-
          "¿Hablas de aquella vez que estabas colgado de una viga de madera en las cavernas e Illuna te ofreció la mano?"

          "Sí..." dice Daren.

          "Ahora que lo pienso," digo, "no empezaste a actuar así solo después de conocer a Illuna. Has estado actuando de forma extraña desde que Azarius nos habló de los magos artificiales y el Faro de Esperanza."

          Hago una pequeña pausa.

          "Pensándolo bien," continúo, "no recuerdo que le hayas dirigido una sola palabra a Kate después de enterarte de que era una maga artificial y no una banshee."

          Daren me mira durante unos momentos, mientras la comprensión le ilumina el rostro.

          "¡Barry, tienes razón!" dice Daren. "Realmente no he hablado con Kate en absoluto desde ese día. No sé qué me pasa."
