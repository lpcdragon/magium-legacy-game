              "¡Eso es muy cruel!" oigo la voz de Rose detrás de mí. "¿Qué diría Daren si te oyera hablar así de él?"

              "Bueno, no es como si hubiera mantenido mi opinión sobre él en secreto," dice Hadrik. "Además, eso no significa que no le respete ni nada de eso, es solo que él y yo no somos muy compatibles en cuanto a personalidad. De hecho, probablemente descubrirías que su opinión sobre mí tampoco es estelar, si se lo preguntaras directamente. ¡Pero basta de eso! ¿Has venido a unirte a nosotros, espero? ¡Tengo muchas más botellas de cerveza guardadas en mi mochila, así que no hace falta que os cortéis!"

