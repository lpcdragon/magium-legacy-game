              "¡Ja!" dice el capitán. "Esos no ser mis mejores guerreros. Ser solo carne de cañón. Todos reemplazables. Yo solo ser lo bastante fuerte para acabar con todos ustedes. ¡Mira abajo! Uno de tus amigos ya estar al final de su cuerda. El resto de ustedes ir a seguirlo pronto."
