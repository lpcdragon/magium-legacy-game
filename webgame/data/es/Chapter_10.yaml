          - source: scene_text
            paragraph: 72
            text: |-
              Unos minutos después de dejar las ruinas, oímos al leopardo llamándonos.

              "¡Esperad!" dice, en la lengua común. "Olvidé preguntar. ¿Alguno de vosotros se llama Rose, por casualidad?"

              "Yo soy Rose..." dice Rose. "¿Por qué lo preguntas?"

              "Una cierva llamada Elaria ha estado esperando impacientemente vuestro regreso," dice el leopardo. "Parecía muy preocupada por vos. ¿Os gustaría que le transmitiera un mensaje?"

              "Yo..." empieza a decir Rose y hace una pausa. "Sí... Dile que estoy a salvo, que estoy profundamente agradecida por su preocupación, y que le deseo lo mejor..."

              "Muy bien," dice Leo. "Le diré lo que habéis dicho."

              Luego nos desea buen viaje a todos y vuelve hacia las ruinas, mientras el resto de nosotros reanudamos nuestro camino.
