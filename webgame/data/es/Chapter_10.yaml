  - name: ch10_tempting
    texts:
      - source: scene_text
        paragraph: 84
        text: |-
          "Por tentador que suene, creo que prefiero ir a ver si Flower todavía acepta pedidos."

          Resulta que la chica en realidad estaba esperando a que me despertara para preparar mi desayuno. Después de conjurar mi comida, me entrega el plato con una expresión emocionada.

          "¡Ta-chán!" dice. "¡Un plato tradicional de tu tierra! Huevos de codorniz con jamón y queso Bagelberry."

          "En realidad... esto no es realmente un plato tradicional del Continente Occidental," digo.

          "¿No?" dice Flower, decepcionada. "Ohhhh, pero estaba segura de haber leído sobre esto en algún libro sobre la cultura occidental..."

          "No, no es nada tradicional," digo. "Es una comida selecta consumida por solo un puñado de nobles en algunas de las ciudades ricas de nuestro continente. ¡Lo cual lo hace aún mejor! ¡Muchas gracias!"

          "¡Bueno, me alegro de que te guste!" dice Flower, sonriendo. "¡Todavía me queda mucha energía mágica, así que no dudes en pedir repetir si quieres!"
