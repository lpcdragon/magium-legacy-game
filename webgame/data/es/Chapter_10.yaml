            paragraph: 29
            text: |-
              Empiezo a aumentar mi ritmo, tratando al mismo tiempo de permanecer lo más vigilante posible. Cuando parece que finalmente estoy empezando a alcanzar al chamán, me escondo detrás de un árbol, y luego me tomo un buen rato mirando hacia adelante. El rastro de pisadas termina abruptamente, en medio de la nieve, y no hay nadie a la vista. Debe seguir invisible. Pero, ¿por qué no se mueve? ¿Me vio antes de que me escondiera detrás del árbol?

              No importa. Si me vio, entonces simplemente tendré que asegurarme de esquivar cualquier hechizo que decida lanzarme. Si no lo hizo, entonces significa que todavía tengo el factor sorpresa. Me muevo rápida y silenciosamente de árbol en árbol, hasta que me acerco lo suficiente al chamán, y luego me lanzo hacia él, con mi cuchillo por delante. Para mi sorpresa, no había nadie esperándome al final del rastro de pisadas, y lo único que logré apuñalar fue el aire vacío. ¿Significa esto que se teletransportó? ¡No, eso no puede ser! No habría caminado una distancia tan larga si pudiera haberse teletransportado directamente. Eso solo deja una posibilidad. Debe haber cubierto su último conjunto de huellas y haberse escondido en algún lugar cercano, esperando el momento adecuado para atacar.

              Me doy la vuelta y veo al chamán parado a varios metros detrás de mí, con su bastón completamente cargado y una sonrisa perversa en el rostro. Un brillante proyectil mágico azul sale disparado de su bastón directo a mi cara.

              Apenas tuve tiempo de reaccionar, pero por suerte mis reflejos rápidos me ayudaron a esquivarlo justo a tiempo. El chamán frunce el ceño, y empieza a cargar su bastón de nuevo, para lanzar otro hechizo. Agarro mi daga firmemente con ambas manos, y empiezo a correr hacia el ogro.
