                  current_scene: ch10_curse
                condition: is_dead = 0
      - condition: agility < 2 AND strength >= 3
        texts:
          - source: scene_text
            paragraph: 37
            text: |-
              Justo cuando lo alcanzo, oigo un sonido estridente muy fuerte y una barrera semitransparente se levanta a su alrededor, que detiene mi daga a centímetros de alcanzarlo. El chamán me sonríe maliciosamente, y luego empieza a cargar su bastón de nuevo.

              Claramente cree que no puedo atravesar su barrera sin usar magia. ¿Por qué será? He estudiado muchos libros sobre barreras en mi vida y esta definitivamente no parece ser impermeable a ataques físicos. En todo caso, no tengo tiempo de pensar en esto. Usaré toda mi fuerza e intentaré pasar su barrera antes de que termine de cargar su bastón.

              Levanto mi brazo y pongo tanta fuerza como puedo detrás de mi golpe. Cuando mi daga golpea la barrera, empiezo a sentir una fuerte vibración durante un segundo, pero luego toda la cosa se rompe como un domo de cristal, y logro apuñalar al chamán en el pecho antes de que pudiera lanzar su hechizo ofensivo. El chamán escupe sangre, y mientras me preparo para asestar el golpe final, el mundo de repente empieza a girar a mi alrededor, y pronto me encuentro de pie en medio de una cueva otra vez, con todos mis amigos a mi lado. Ellos también parecen haberse despertado recién, porque ahora están mirando a su alrededor para confirmar que efectivamente estamos de vuelta en las minas abandonadas debajo del fuerte de los ogros.
