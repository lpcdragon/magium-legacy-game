  - name: ch10_someone_else
    texts:
      - source: scene_text
        paragraph: 39
        text: |-
          "Yo iré," dice Hadrik. "Soy el más rápido de nosotros, y debería poder encargarme del chamán sin mucho problema, una vez que lo encuentre."

          "Bien," dice Daren. "Nosotros retendremos a los lobos aquí. ¡Vamos, vamos, vamos!"

          El enano sale disparado hacia el bosque, y en cuestión de momentos desaparece detrás de los árboles. Mientras tanto, los lobos parecen haberse envalentonado, porque ahora están empezando a salir del bosque en mayor número que antes. Después de avanzar lenta y cautelosamente durante un rato, todos los lobos de repente empiezan a correr hacia nosotros al mismo tiempo, como si hubieran recibido una señal para atacar.

          La batalla comienza rápidamente, y Daren mata a tres de los lobos con un solo tajo de su espada. Cuatro de los otros lobos ya han empezado a perseguir a Illuna, que los esquiva lo mejor que puede. Mientras la pelea continúa, noto que Rose está sorprendentemente tranquila, dada la situación. Se asegura de estar siempre al alcance de Daren, para que pueda defenderla, pero al mismo tiempo intenta no estorbarle tanto como sea posible.

          No puedo quedarme ahí parado sin hacer nada. Saco mi daga y me lanzo sobre uno de los lobos, intentando clavarle el cuchillo en la garganta.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch10_catch
  - name: ch10_catch
    routes:
      - condition: agility >= 3
        texts:
          - source: scene_text
            paragraph: 41
            text: |-
              Logro tomarlo por sorpresa, le corto la garganta y luego retiro rápidamente mi cuchillo, mientras la bestia da unos pasos más y luego cae al suelo en un charco de su propia sangre. Al mismo tiempo, Kate se pone detrás de otro lobo, y le clava su cuchillo en la parte trasera de la cabeza, matándolo al instante.

              Mientras estábamos ocupados luchando, Illuna se había visto acorralada por tres de los lobos. Tiene la espalda contra una gran roca, y los lobos se están cerrando sobre ella, preparándose para atacar.

              "¡Illuna, atrapa!" grita Kate, y le lanza su daga a la banshee.

              Illuna la atrapa en el aire, y rápidamente se desliza por debajo de uno de los lobos, sosteniendo su daga con ambas manos, y partiendo el vientre de la bestia en dos mientras pasaba debajo de él. Luego salta sobre el lomo de otro lobo, y le clava el cuchillo en la parte trasera del cuello. Cuando el animal cae, ella salta de él, aterrizando con una voltereta rápida, y luego apuñala al último de los lobos en el ojo derecho. La banshee no tiene oportunidad de descansar, porque otros cuatro lobos ya vienen hacia ella.

              Mientras tanto, tres de los lobos han logrado pasar a Daren, y ahora se están acercando firmemente a Kate y a mí.
        effects:
          - set:
              successful_checks:
                - '[ Comprobación de velocidad exitosa - nivel 3 ]'
        choices:
          - position: 1
            text: Darle mi daga a Kate
            effects:
              - set:
                  current_scene: ch10_dagger
                  ch10_kate_scratched: 1
          - position: 2
            text: Quedarme con mi daga y luchar contra los lobos yo mismo
            effects:
