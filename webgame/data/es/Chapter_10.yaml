  - name: ch10_politics
    texts:
      - source: scene_text
        paragraph: 55
        text: |-
          "Así es," dice Hadrik. "Por eso paso tanto tiempo en las tierras enanas. Además, la gente local es muy agradable. La mayoría de los dueños de tabernas saben que soy un gigante disfrazado, pero me reciben con los brazos abiertos, de todas formas. Parte de eso probablemente sea porque perderían una cuarta parte de su beneficio mensual si dejarán de servirme, ¡pero aun así!"

          "¿Los gigantes normalmente no son bienvenidos en tierras enanas?"

          "Bueno, no es nada oficial, pero muchos de los enanos no aprecian mucho a los gigantes. Hay una historia bastante sangrienta entre nuestros dos pueblos, y aunque estamos en paz ahora, los viejos rencores persisten. Tampoco ayuda cuando algún gigante bravucón decide armar un alboroto en medio de sus tierras, solo para satisfacer su complejo de inferioridad. La mayoría de estos alborotadores han sido tratados por nuestros propios guerreros, pero normalmente consiguen causar mucho daño antes de que los atrapen, y no es como si las vidas que se llevaron pudieran simplemente devolverse."

          Hace una pausa para beber de su botella.

          "Pero ya basta de política," dice. "Deberíamos estar discutiendo asuntos más importantes. Como por ejemplo, ¿qué está pasando entre tú y Rose? ¿Es cosa mía, o vosotros dos os habéis acercado un poco en estos últimos dos días?"
    choices:
      - position: 1
        text: Para nada. ¿Qué te hace pensar eso?
        effects:
          - set:
              current_scene: ch10_makes
      - position: 2
        text: Supongo que se podría decir que sí.
        effects:
          - set:
              current_scene: ch10_guess
      - position: 3
        text: Nos hemos acercado, pero no de la manera que podrías pensar.
        effects:
          - set:
              current_scene: ch10_closer
  - name: ch10_makes
    texts:
      - source: scene_text
        paragraph: 56
        text: |-
          "Para nada. ¿Qué te hace pensar eso?"

          "Bueno, más o menos tuve esa impresión después de ver a los dos juntos anoche," dice Hadrik. "Pero quizás me equivoqué. Supongo que Rose no es tu tipo, entonces. ¿Quizás prefieres los tipos más salvajes, como Kate?"

          "Olvida a Rose y Kate," digo. "¡Lo que creo que todos queremos saber es qué está pasando entre tú y Arraka! ¿Ya le has propuesto matrimonio?"

          El enano se ríe.

          "¡Ahora sí que haces las preguntas correctas!" dice, y toma otro trago de su botella. "He querido hacerlo, pero simplemente no encontraba el momento adecuado. Todavía estoy pensando en una excusa que darle a Flower o Illuna para que me presten el amuleto un rato para que las dos podamos tener algo de tiempo a solas de calidad."

          Hace una pausa, y ambos tomamos otro trago.
