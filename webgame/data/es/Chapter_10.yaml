  - name: ch10_messenger
    texts:
      - source: scene_text
        paragraph: 25
        text: |-
          Nos tomó unos minutos bajar por todas las escaleras, pero no hubo incidentes, y todos llegamos sanos y salvos al fondo de las minas. La única fuente de luz que tenemos de momento es el holograma de Arraka, pero brilla más que una antorcha, y el mapa de los túneles es muy preciso, así que no hay peligro de que nos perdamos.

          "Creo que uno de los magos ogros que acompañaban al chamán acaba de teletransportarse cerca de los que custodian la salida del túnel," dice Kate. "Vi uno de los puntos azules desaparecer de arriba y otro aparecer abajo."

          "Probablemente lo enviaron como mensajero para decirles a los otros ogros que estén en guardia," dice Illuna.

          "Sí, se están volviendo invisibles mientras hablamos," dice Arraka. "¡De mucho les va a servir!"

          "Pero, ¿no será difícil luchar contra ellos incluso con el mapa, mientras son invisibles?" pregunta Rose.

          "El hechizo de invisibilidad que usan no puede mantenerse durante el combate," dice Illuna. "Solo lo usan para el factor sorpresa. Se verán obligados a revelarse una vez que comience la pelea. Arraka tiene razón. Este hechizo no les servirá de absolutamente nada."

          A medida que nos acercamos a la salida, vemos que los ogros del fuerte están empezando a congregarse hacia la habitación secreta, y algunos de ellos ya han llegado a los andamios. El grupo del chamán también parece estar dirigiéndose hacia allí.
      - source: scene_text_2
        paragraph: 21
        text: |-
          "¡Maldición!" dice Hadrik. "El chamán debe haberles dicho lo de la habitación secreta. Si no aceleramos el paso, acabaremos rodeados."

          "¡Esperen, no se muevan!" dice Arraka. "Algo está mal. Lo presiento. Denme un minuto."

          "¡No tenemos un minuto!" dice Daren. "El chamán y sus ogros nos están pisando los talones. ¿Por qué habría algo mal?"

          "¡No lo SÉ todavía!" dice Arraka. "¡Por eso dije que necesito un minuto!"

          "¿Tal vez hay trampas delante de nosotros?" pregunta Rose.

          "Lo dudo," dice Hadrik. "Dado que hay guardias apostados en la salida, supongo que estos túneles todavía se usan como posible ruta de escape en caso de que el fuerte esté bajo asedio. No veo por qué querrían arriesgarse a caer en sus propias trampas mientras tienen prisa por abandonar la fortaleza. Esos guardias deberían ser suficientes para mantener alejados del túnel a cualquier intruso no deseado."

          "Sí," dice Daren. "Y no había manera de que tuvieran tiempo suficiente para colocar una trampa en los pocos minutos que han tenido a su disposición desde que se enteraron de nuestra fuga. El único tipo de trampa que podrían haber colocado es una mágica, pero esas pueden ser fácilmente detectadas por cualquiera con un sentido mágico decente."

          "Algunos de los ogros ya están a mitad de camino bajando los andamios," dice Kate. "No tenemos mucho tiempo."
    choices:
      - position: 1
        text: Al menos podríamos esperar hasta que los ogros lleguen al suelo de la cueva.
        effects:
          - set:
              current_scene: ch10_wait
      - position: 2
        text: ¡Al diablo con Arraka! No podemos permitirnos perder más tiempo aquí.
        effects:
          - set:
              current_scene: ch10_waste
