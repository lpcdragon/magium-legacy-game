  - name: ch10_sulking
    texts:
      - source: scene_text
        paragraph: 80
        text: |-
          "Escucha..." dice Daren, mirando a Kate, cuando se acerca lo suficiente. "Hay algo que he querido decirte desde hace un tiempo, pero no encontraba el momento adecuado."

          "Oh, dioses, no me vas a proponer matrimonio, ¿verdad?" dice Kate.

          "¡Joder, no!" dice Daren, e inmediatamente intenta recuperar la compostura. "No es a eso a lo que me refería. Es solo que... últimamente no te he hablado. De hecho, no te he dirigido la palabra en días."

          "¿En serio?" dice Kate, luciendo genuinamente sorprendida. "Nunca lo noté."

          Daren parece estar a punto de perder la compostura de nuevo, pero esta vez se las arregla para contener sus emociones.

          "Dejé de hablarte justo después de que Azarius nos dijera que eras una maga artificial," dice. "Estaba tan convencido de que eras una banshee desde el principio, y después de oír lo que dijo yo..."

          Hace una pausa.
      - source: scene_text_2
        paragraph: 46
        text: |-
          "Me equivoqué," dice, después de un rato, decidiendo no continuar su frase anterior. "Aunque en la superficie actuaba como tu amigo, en realidad nunca bajé la guardia a tu alrededor, y esperaba que nos traicionaras y te convirtieras en un monstruo en cualquier momento. Y para empeorar las cosas, después de enterarme de la verdad, en lugar de intentar enmendar las cosas, me pasé el tiempo comiéndome la cabeza como un crío de cuatro años que hubiera tirado su chuchería a una alcantarilla. Me doy cuenta de que es ya más que tarde, pero no podía dejar que las cosas siguieran así para siempre. La razón por la que vine a verte esta noche es que quería... disculparme."

          Parecía que le había costado hasta la última gota de energía pronunciar esa última palabra. No creo que le haya visto tan tenso ni siquiera cuando luchamos contra la hidra en las ruinas lessathi.

          "¿Perdona, qué has dicho?" dice Kate. "Vas a tener que repetir esa última palabra que has dicho, porque apenas la he oído."

          "¡Maldita sea, mujer!" dice Daren. "Sabes perfectamente lo que he dicho. ¡No me hagas repetirlo! ¡Ahora, ¿aceptas mis disculpas o no?!"

          Inmediatamente después de que Daren termina su frase, Kate empieza a reírse. Pero su risa suena mucho más natural que nunca antes. Cuando la oyó por primera vez, Daren parecía estar a punto de explotar de nuevo, pero luego se dio cuenta de que no había ni un ápice de malicia en la risa de Kate, así que finalmente se calmó.
      - source: scene_3
        paragraph: 7
        text: |-
          "Lo siento," dice Kate, mientras lucha por contener su risa. "Lo siento... no pretendía burlarme de ti. Es solo que no pensé que este fuera el tipo de cosa que pudiera preocuparte tanto. ¡Claro que acepto tus disculpas! Era sincera cuando dije que nunca noté que me ignorabas todo este tiempo. Los dos nunca hemos hablado tanto, así que nada de esto me pareció extraño. ¡Pero realmente aprecio que te hayas abierto así conmigo. Gracias! ¡Esto me ha hecho sentir mucho mejor!"

          Sonríe.

          "No estoy seguro de qué va todo esto," oímos la voz de Hadrik detrás de Daren, "pero estoy dispuesto a apostar que este sería el mejor momento para hacer por fin esa celebración de la victoria."

          Luego coloca cinco botellas de cerveza enana en el suelo y nos sonríe.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch10_tolerance
  - name: ch10_tolerance
    texts:
      - source: scene_text
        paragraph: 81
        text: |-
          "Supongo que sí," dice Kate, sonriendo.

          "Espera," dice Daren. "Puede que nos hayan quitado los collares, pero todavía estamos en territorio peligroso. ¿Qué pasa si nos atacan algunos magos o monstruos después de nuestra fiestecita? ¿Quién nos va a defender de nuestros enemigos si estamos todos como cubas?"

          "¡No hay de qué preocuparse!" dice Rose, mientras se acerca a nosotros, sosteniendo una pequeña bolsa en su mano izquierda. "Estas hojas que tengo en mi bolsa son un remedio natural contra las borracheras. ¡Solo necesitas masticarlas durante medio minuto, y todo el mareo desaparecerá en un instante, sin tener que preocuparte siquiera por la resaca después!"

          "¡Perfecto!" dice el enano. "¡Entonces no hace falta que nos contengamos! ¡Voy a traer más botellas!"

          "Oooh, ¿eso es cerveza enana?" dice Flower, al ver las cinco botellas en el suelo. "¡Siempre he querido probar la cerveza enana!"

          "Nada de cerveza para ti, jovencita," dice Hadrik. "Las niñas pequeñas no deberían beber bebidas alcohólicas de ningún tipo. No es bueno para ti."

          "¡Pero no soy una niña pequeña!" dice Flower. "¡Tengo treinta años!"

          "Puede que tengas treinta años, pero tu tolerancia al alcohol es la de una niña de nueve," dice Illuna. "Apenas puedes mantenerte en pie después de beberte un vaso de vino."
      - source: scene_text_2
        paragraph: 47
        text: |-
          "¡Petal, no estás ayudando!" dice Flower, mientras el resto de nosotros empezamos a reír. "¡No estás ayudando nada!"

          Después de que la celebración largamente aplazada por fin terminara, cada uno se fue a dormir a su respectiva tienda, excepto Hadrik y Daren, que tomaron el primer turno. Durante esas pocas horas que bebimos juntos, era difícil creer que habíamos estado arriesgando nuestras vidas luchando contra ogros apenas un día antes. Casi parecía que estaba de vuelta en casa, pasando una noche en una taberna con amigos, lejos de toda la locura de este torneo. Fue agradable tener una noche así para variar. Y quién sabe, quizás lo peor ya ha quedado atrás, y todas las noches a partir de ahora serán así también. Uno tiene derecho a soñar, ¿no?

          Con estos últimos pensamientos, apoyo la cabeza en la almohada, y me desperté a la mañana siguiente, sintiéndome completamente renovado. Esta vez me tocó la suerte, y no tuve que hacer ningún turno, lo cual fue un agradable cambio de ritmo respecto a todas las noches sin dormir que he tenido últimamente. Como ya no teníamos un límite de tiempo fijo, todos decidimos dormir hasta tarde hoy, así que ya eran las diez de la mañana cuando salí de mi tienda. Echando un vistazo al campamento, parecía que todos los demás ya se habían levantado hacía rato, y estaban a punto de terminar su desayuno.

          "¡Por fin despierta!" dice Daren, al verme salir de mi tienda. "¿Disfrutaste de tus diez horas de sueño ininterrumpido, Barry? Es una pena que te hayas perdido el desayuno. ¡Flower se ha superado esta vez! ¡Sus habilidades para hacer comida son simplemente divinas! Pero no te preocupes, ¡seguro que podemos rebuscar algunas sobras frías para que comas si realmente tienes hambre!"
    choices:
      - position: 1
        text: Eso es muy generoso de tu parte.
        effects:
          - set:
              current_scene: ch10_generous
      - position: 2
        text: Veo que no tardaste mucho en volver a ser un imbécil.
        effects:
          - set:
              current_scene: ch10_ass
      - position: 3
        text: Por tentador que suene, creo que prefiero ir a ver si Flower todavía acepta pedidos.
        effects:
          - set:
              current_scene: ch10_tempting
  - name: ch10_generous
    texts:
      - source: scene_text
        paragraph: 82
        text: |-
          "Eso es muy generoso de tu parte."

          "¡Bueno, ya me conoces!" dice Daren. "Siempre cuidando de mi prójimo."

          "El hecho de que este sea el credo universal de todos los magos blancos es lo que lo hace tan irónico," le digo mientras saco algo de carne seca y una manzana de mi mochila y empiezo a comer.

          "Barry, ¿por qué no me dijiste que te habías despertado?" me llama Flower, decepcionada, al verme terminar mi comida. "¡Estaba esperándote antes de preparar tu desayuno para que no se enfriara!"

          "Sí, bueno, Daren 'se olvidó' de mencionar que todavía aceptabas pedidos," digo. "No te preocupes, tampoco tenía tanta hambre."

          "Ohhhh, pero iba a sorprenderte con un plato tradicional de tu tierra," dice Flower.

          "¿Tradicional?" pregunto.

          "Sí, iba a hacer huevos de codorniz con jamón y queso Bagelberry."

          "Eso... es menos un plato tradicional del Continente Occidental y más una comida selecta consumida por solo un puñado de nobles de nuestro continente. El resto normalmente desayunamos cualquier cosa que tengamos en la despensa."

          "Vaya," dice Flower. "Bueno, nunca se deja de aprender..."
      - source: scene_text_2
        paragraph: 48
        text: |-
          Después de que todos terminaron de comer, decidimos celebrar una reunión y establecer cuáles eran nuestros planes, ahora que por fin estábamos libres de nuestros collares.

          "Los tres ya le habíamos prometido a Rose que la escoltaríamos sana y salva hasta su pueblo," dice Daren, mientras nos señala a mí y a Kate, "así que ahí es a donde nos dirigimos ahora. Hadrik, Flower, no tenéis ninguna obligación de seguir viajando con nosotros, así que podemos separarnos aquí si queréis."

          "En realidad, viajar con este grupo me ha proporcionado la mayor diversión que he tenido en años," dice Hadrik. "Los objetivos del torneo todavía no se han anunciado, así que no tengo realmente nada específico que hacer hasta entonces. Si os da igual, ¡prefiero seguir con vosotros!"

          "¿Y tú, Flower?" dice Kate.

          "Bueno..." dice Flower, luciendo un poco indecisa. "No querría ser una molestia para nadie..."

          "¿Qué, estás de broma?" dice Hadrik. "¡Puedes escupir fuego, saltar por las paredes y hacer comida de la nada! ¿Quién estaría lo bastante loco como para no quererte en su grupo?"

          "Nadie aquí te rechazaría jamás después de lo mucho que nos has ayudado, Flower," dice Rose. "Y que no se te ocurra ni por un segundo pensar que podrías ser una molestia para nosotros. La pregunta aquí es qué quieres TÚ hacer. ¿Te gustaría seguir viajando con nosotros?"

          "¡Sí!" dice Flower, radiante. "¡Me encantaría!"
