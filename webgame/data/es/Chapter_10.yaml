    texts:
      - source: scene_text
        paragraph: 59
        text: |-
          "Pero hablando en serio," dice Hadrik, "si no hubiera sido por su intervención hoy, no estoy seguro de cómo me habría apañado contra ese capitán ogro. No tengo ninguna duda de que me mataría sin dudarlo si alguna vez saliera de ese amuleto, pero supongo que le debo una por ahora. Nunca he tenido que trabajar con otros para ocuparme de mis enemigos. Normalmente viajo y lucho solo, así que no estoy realmente acostumbrado a este tipo de cosas, pero admito que formar parte de un grupo ha sido un agradable cambio de ritmo para mí. Para ser perfectamente honesto, no vine a este torneo para ganar el Magium. Vine sobre todo por la experiencia, ¡y diría que ha ido bastante bien hasta ahora! ¿Y tú, Barry? ¿Cuáles son tus planes en caso de que realmente ganes este torneo?"

          "Bueno, voy a usar el Magium para convertirme en mago."

          "Sí, eso ya me lo imaginaba, pero me refiero a después. ¿Qué piensas hacer después de haberte convertido en mago?"
