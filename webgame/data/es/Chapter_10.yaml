  - name: ch10_drink
    texts:
      - source: scene_text
        paragraph: 54
        text: |-
          Como nadie más se ofreció, le dije a Hadrik que compartiría una copa con él antes de empezar mi turno. Sacó dos botellas de cerveza enana de su mochila, y luego fuimos a sentarnos en dos rocas que estaban una frente a la otra, lejos de las tiendas.

          "Cuando los gigantes hacen un brindis, primero derraman un poco de cerveza en el suelo, para darles también algo de beber a los guerreros caídos en batalla," dice Hadrik, mientras abre nuestras dos botellas. "Siempre me meto en problemas cuando hago esto en tabernas enanas, así que es un alivio hacerlo al aire libre para variar."

          Levanta su botella.

          "¡Un brindis!" dice. "¡Por haber recuperado el cáliz y estar un paso más cerca de quitarnos estos malditos artefactos del cuello!"

          Chocamos las dos botellas y luego ambos derramamos un poco de cerveza en el suelo, antes de empezar a beber. Esta es la primera vez que pruebo algo así. Sentí una fuerte sensación de ardor mientras la cerveza bajaba por mi garganta, y ya estoy empezando a sentirme un poco mareado. Esto no se compara ni de lejos con las bebidas más fuertes disponibles en las tabernas del Continente Occidental.

          "¿Primera vez bebiendo cerveza enana?" pregunta Hadrik con una sonrisa, al ver la expresión en mi cara.

          "Sí," digo. "Sabía que se suponía que era fuerte, pero supongo que no esperaba que fuera tanto más fuerte que cualquier otra cosa que haya bebido antes."
    effects:
      - set:
          ac_ch10_toast: 1
        achievement:
          id: ac_ch10_toast
          title: ¡Un brindis!
