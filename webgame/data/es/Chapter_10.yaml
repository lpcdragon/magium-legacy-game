  - name: ch10_other_time
    texts:
      - source: scene_text
        paragraph: 66
        text: |-
          Como nadie tenía realmente ganas de beber esta noche, decidimos posponer la celebración para otro día.

          Mientras me preparaba para empezar mi turno, Rose se acercó a mí y empezó a hablar en voz baja, asegurándose de que Daren no pudiera oírnos.

          "Barry, escucha atentamente," dice. "Creo que puede que ya te hayas dado cuenta de que Kate, Hadrik y yo tuvimos una pequeña charla antes de votar para que tú y Daren tomarais el primer turno de noche. Siento que no te invitáramos también, pero alguien tenía que quedarse con Daren para que no sospechara."

          "Sí, más o menos me figuré que algo pasaba cuando vi lo bien sincronizados que estabais los tres," digo. "Entonces, ¿de qué va todo esto?"

          "Bueno, ¿sabes cómo Illuna dijo que Flower todavía necesita permanecer en estasis al menos hasta mañana por la noche?"

          "Sí, lo recuerdo."
    choices:
