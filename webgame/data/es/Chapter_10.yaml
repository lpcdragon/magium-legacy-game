      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch10_wolves
  - name: ch10_wolves
    texts:
      - source: scene_text
        paragraph: 32
        text: |-
          Cuando la niebla desaparece por completo, vemos que hay varios pares de ojos rojos brillando en las oscuras profundidades del bosque, y empezamos a oír varios gruñidos graves y continuos a medida que las criaturas se acercan. Cuando salen del bosque, descubrimos que son de hecho lobos, aunque son al menos tres veces más grandes que los normales, y su pelaje es negro como el carbón.

          Cinco de ellos empiezan a correr hacia nuestro grupo, mientras Daren y Hadrik se adelantan y asumen sus posiciones de combate. Tres de los lobos van directo a por ellos, pero los otros dos los rodean y van a por Kate e Illuna en su lugar. Daren se defendió con su escudo de un lobo, mientras le cortaba la cabeza limpiamente al otro. Hadrik le dio un puñetazo al tercer lobo en la boca y le hizo salir volando tres de sus colmillos, mientras el animal chillaba de dolor.

          Kate estaba esperando a la bestia con su daga en mano. El animal se lanzó hacia ella, pero ella logró ponerse detrás de él en un abrir y cerrar de ojos, y le cortó el cuello con un solo movimiento, mientras sus manos quedaban empapadas en la sangre del lobo. La mirada en sus ojos cambió por completo cuando empezó a pelear contra el lobo. Siempre ha tenido una especie de mirada feral, pero esto era más que eso. No era solo ella siendo despiadada o eficiente. Esos eran los ojos de una bestia cazando a su presa. Por esto debió ser capaz de sobrevivir sola en una jungla a los doce años, antes de que siquiera tuviera magia. Para evitar ser cazada, se vio obligada a convertirse en la cazadora.
      - source: scene_text_2
        paragraph: 27
        text: |-
          Illuna, que no tenía armas, empezó a saltar de un lado a otro usando las técnicas acrobáticas de Flower, para confundir al lobo y evitar que la mordiera. Una vez que Daren y Hadrik terminaron de lidiar con sus propios lobos, vinieron y mataron al que atacaba a Illuna también.

          "Por eso el chamán no tomó ninguna acción," dice Hadrik. "Estaba demasiado ocupado alejándose de aquí, para que sus propios lobos no lo atacaran. Por suerte para nosotros, dejó un rastro de pisadas en la nieve que podemos seguir fácilmente."

          Luego señala hacia el rastro de pisadas dejado por el chamán, que lleva a la única parte del bosque que no parece estar plagada de lobos.

          "Si todos vamos tras el chamán ahora, tendremos que luchar contra lobos a cada paso," dice Daren. "Eso solo le facilitaría acabar con nosotros. Alguien debería ir tras el chamán solo, mientras el resto de nosotros servimos de distracción. Preferiblemente alguien que confíe en poder derrotar al chamán en un duelo y que pueda defenderse contra algunos lobos, en caso de que no todos muerdan el anzuelo."
    choices:
      - position: 1
        text: Ofrecerme voluntario para ir tras el chamán
        effects:
          - set:
              current_scene: ch10_volunteer
              ch10_kate_scratched: 0
      - position: 2
        text: Dejar que otro se presente voluntario para la tarea
        effects:
