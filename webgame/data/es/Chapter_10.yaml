  - name: ch10_ass
    texts:
      - source: scene_text
        paragraph: 83
        text: |-
          "Veo que no tardaste mucho en volver a ser un imbécil," digo. "¿Qué pasó con aquella disculpa que me diste la otra noche?"

          "¡Eh, no confundamos las cosas!" dice Daren. "Por lo que me disculpé fue por ser MÁS imbécil de lo habitual. ¡Diría que mi actitud ahora mismo está bien dentro de los límites de mi imbecilidad diaria normal!"

          "Punto tomado," le digo mientras saco algo de carne seca y una manzana de mi mochila y empiezo a comer.

          "Barry, ¿por qué no me dijiste que te habías despertado?" me llama Flower, decepcionada, al verme terminar mi comida. "¡Estaba esperándote antes de preparar tu desayuno para que no se enfriara!"

          "Sí, bueno, Daren 'se olvidó' de mencionar que todavía aceptabas pedidos," digo. "No te preocupes, tampoco tenía tanta hambre."

          "Ohhhh, pero iba a sorprenderte con un plato tradicional de tu tierra," dice Flower.

          "¿Tradicional?" pregunto.

          "Sí, iba a hacer huevos de codorniz con jamón y queso Bagelberry."

          "Eso... es menos un plato tradicional del Continente Occidental y más una comida selecta consumida por solo un puñado de nobles de nuestro continente. El resto normalmente desayunamos cualquier cosa que tengamos en la despensa."

          "Vaya," dice Flower. "Bueno, nunca se deja de aprender..."
