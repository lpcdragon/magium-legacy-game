  - name: ch10_curse
    texts:
      - source: scene_text
        paragraph: 48
        text: |-
          "Mis disculpas," dice ella. "Casi olvidé que querías que me purificaran. Bueno, aquí estoy. Haz lo que puedas. Con un poco de suerte, después de matarme, quizás puedas despertar a Flower de su estasis para que pueda despedirse."

          "Cállate," dice Daren, mientras prepara su espada.

          "¡Daren, no!" grita Rose, mientras Daren clava su espada en la pierna derecha de Illuna.

          Una brillante luz blanca rodea a la banshee durante unos segundos, y luego un humo verde empieza a salir de ella, que se evapora en el aire poco después.

          "Tú..." dice Illuna, en un estado de total conmoción. "¿Qué has...?"

          "He roto la maldición," dice Daren. "Soy tanto un mago blanco como un encantador, ¿recuerdas? Es natural que mi espada pueda hacer algo tan trivial como disipar una maldición de muerte ordinaria, sin necesidad de usar magia. Esto nos pone en paz. Tú salvaste mi vida y yo salvé la tuya. Ahora podemos seguir con nuestras vidas y no hablar jamás de estos eventos."

          "...De acuerdo," dice Illuna, después de un rato, y usa su magia curativa para cerrar su herida.

          "¡Illuna, gracias a los dioses!" dice Rose, mientras se acerca a darle un gran abrazo. "Vas a estar bien ahora, ¿verdad? ¿No hay más maldiciones?"

          "No..." dice Illuna, luciendo un poco desconcertada. "No más maldiciones por lo que puedo ver. Sin embargo, todavía queda el asunto de las hordas de ogros que se acercan..."
      - source: scene_text_2
        paragraph: 36
        text: |-
          "¡No hay de qué preocuparse!" dice Hadrik, con una sonrisa. "Tengo un plan. Pero primero, todos necesitamos salir de las cuevas. ¡Vamos! ¡Moved, moved, moved!"

          Cuando todos salimos de las minas abandonadas, Hadrik salta alto en el aire y golpea las rocas sobre la entrada de la cueva. Toda la pared rocosa se desmorona y bloquea completamente el camino que lleva a las cavernas.

          "¿Eso es todo?" pregunta Daren. "¿Ese es tu plan?"

          "Simple, pero efectivo, ¿no crees?" dice Hadrik, con una amplia sonrisa.

          "¿Se te ha pasado por la cabeza que podrían tener guerreros en sus filas capaces de mover unas cuantas rocas?" dice Daren. "Por no hablar de todos los magos que pueden simplemente volar las rocas por los aires."

          "Si intentan usar explosiones, solo se enterrarán a sí mismos," dice Illuna. "Y por lo que he visto mientras caminaba por el fuerte, el capitán era su único guerrero que tenía una fuerza comparable a la del enano. Aún pueden usar magia de aire para mover las rocas, pero les llevará un buen rato. Eso nos da tiempo más que suficiente para desaparecer."

          "¡Ahí lo tienes!" dice Hadrik. "¡Vamos, vayamos a buscar nuestras mochilas!"

          "Esperad," dice Arraka. "Siento dos ogros escondidos invisiblemente cerca de la base de la colina."

          "¿Están en nuestro camino?" pregunta Daren.

          "No, pero podrían intentar tendernos una emboscada después," dice Arraka.
    choices:
      - position: 1
        text: Dejarlos en paz
        effects:
          - set:
              current_scene: ch10_spare
      - position: 2
        text: Ir a matarlos
        effects:
          - set:
              current_scene: ch10_kill
  - name: ch10_spare
    routes:
      - condition: ch10_kate_scratched = 0
        texts:
          - source: scene_text
            paragraph: 49
            text: |-
              "Dejarlos en paz," digo. "No deberíamos perder más tiempo aquí. Ya tenemos lo que vinimos a buscar. Incluso si deciden tendernos una emboscada, Arraka aún puede detectarlos, así que no es como si nos fueran a pillar por sorpresa."

              "Así es," dice Hadrik. "Cuanto antes nos vayamos, mejor. ¡Vámonos!"

              En cuanto todos estamos de acuerdo en ignorar a los dos ogros, nos dirigimos al bosque para recuperar nuestras mochilas.

              Una vez desenterramos todas nuestras pertenencias, no perdemos el tiempo y comenzamos nuestro largo viaje de vuelta a las ruinas de los bosques sagrados. Hemos mantenido un ritmo relativamente rápido durante la primera hora, para asegurarnos de poner suficiente distancia entre nosotros y los ogros, pero después de confirmar varias veces que no nos seguían, empezamos a aflojar un poco el paso. El sol ya se había puesto cuando dejamos la fortaleza, pero había muchas estrellas en el cielo, y la luna estaba casi llena, así que decidimos seguir avanzando hasta que nos sintiéramos cómodos con la distancia entre nosotros y el territorio de los ogros.

              Sanador," dice Illuna, mientras caminamos por el bosque. "Después de que te liberé de tu celda, prometiste que no me atacarías hasta que escapáramos del fuerte. Ahora que estamos a una distancia suficientemente segura de los ogros, ya no estás vinculado por esa promesa. ¿Debería empezar a preparar mis defensas?"

              "No, yo..." empieza a decir Daren, pero hace una pausa. "Realmente no tengo ganas de pelear más hoy..."

              "Ya veo," dice Illuna, mirándole con suspicacia.
        choices:
