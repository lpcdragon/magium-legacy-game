  - name: ch10_never
    texts:
      - source: scene_text
        paragraph: 87
        text: |-
          "Estaba inconsciente en ese momento. Ni siquiera llegué a ver a los lessathi."

          "No es muy inteligente de tu parte mentirme así, Barry," dice Eiden. "Especialmente después de que insinué que puedo saber si estás mintiendo o no estudiando tu aura."

          "¿Crees que somos todos idiotas?" dice Daren. "Ya descubrimos lo del invierno inmóvil. Ese mensaje tuyo no era más que una amenaza muy mal disimulada. ¡Los lessathi nos habrían atacado en el momento en que se lo hubiéramos entregado!"

          "¡Por supuesto!" dice Eiden. "Creí que eso ya sería obvio a estas alturas. Pero independientemente de su contenido, un mensaje sigue siendo un mensaje. Y ese mensaje era lo que Barry intercambió por vuestras vidas."

          "Espera, escucha," digo. "Podemos encontrar a otros lessathi. ¡Aún podemos entregar el mensaje!"

          "Barry..." dice Eiden. "Empiezo a tener la impresión de que no me tomas en serio."

          "¿De qué estás hablando?" digo. "¡Claro que te tomo en serio!"

          "Esto no puede ser," dice Eiden. "¿Cómo se supone que haga entender mi punto si no me tomas en serio?"

          "Escucha," digo. "Entiendo por qué puedes pensar esto, pero créeme cuando digo que--"
      - source: scene_text_2
        paragraph: 51
        text: |-
          "¡Ya sé!" dice Eiden con una sonrisa, de repente. "¡Debería matar a uno de tus amigos! ¡Eso debería hacer que me tomaras más en serio!"

          "¿Qué has... dicho?" le pregunto.

          De repente, oigo a Rose empezar a jadear en busca de aire ruidosamente.

          "¡Rose!" dice Daren. "¿Qué está pasando?"

          Rose intenta decir algo, pero no consigue llevar suficiente aire a sus pulmones como para articular sus palabras correctamente.

          "No deberías forzarte a hablar, Rose," dice Eiden. "Después de todo, las vías respiratorias a tus pulmones se están cerrando lentamente en este mismo momento. ¡Deberías concentrar todos tus esfuerzos en respirar tanto aire como sea posible!"

          "¡Maldito bastardo!" grita Daren mientras desenvaina su espada. "¡Voy a matar--!"

          Antes de que pueda terminar su frase, Daren cae al suelo, completamente paralizado, y lo mismo le pasa a todos los demás excepto a mí y a Rose, inmediatamente después.
