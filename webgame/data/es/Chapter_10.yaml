              current_scene: ch10_someone_else
  - name: ch10_volunteer
    routes:
      - condition: perception >= 3
        texts:
          - source: scene_text
            paragraph: 33
            text: |-
              "Me ofrezco voluntario para la tarea," digo. "Debería poder encargarme del chamán yo solo si solo puede lanzar hechizos desde su bastón."

              "¿Estás seguro?" dice Daren.

              "No sabemos cuántos lobos van a salir de ese bosque," digo. "Tú y Hadrik deberían quedarse los dos aquí en caso de que las cosas se pongan realmente feas. Intentaré acabar con esto lo más rápido posible. Deséenme suerte."

              Luego empiezo a correr hacia el bosque, en dirección a las pisadas del chamán. Al entrar al bosque, empiezo a reducir mi ritmo, asegurándome de que no haya trampas o emboscadas preparadas delante de mí.

              Las pisadas me han estado llevando en la misma dirección desde que empecé a seguirlas, y no ha habido obstáculos de ningún tipo en mi camino desde que entré al bosque. ¿Podría ser que el chamán estuviera demasiado ocupado alejándose lo más posible de los lobos como para colocar algún tipo de trampa?

              Empiezo a aumentar mi ritmo, tratando al mismo tiempo de permanecer lo más vigilante posible. Cuando parece que finalmente estoy empezando a alcanzar al chamán, me escondo detrás de un árbol, y luego me tomo un buen rato mirando hacia adelante. El rastro de pisadas termina abruptamente, en medio de la nieve, y no hay nadie a la vista. Debe seguir invisible. Pero, ¿por qué no se mueve? ¿Me vio antes de que me escondiera detrás del árbol?
          - source: scene_text_2
            paragraph: 28
            text: |-
              De repente me doy cuenta de que la nieve no es completamente uniforme en el lado derecho cerca del final del rastro de pisadas. Es apenas perceptible, pero definitivamente es diferente del resto de la nieve.

              ¡Eso es! Por eso no se mueve. Debe haber hecho su rastro tan fácil de seguir a propósito para aumentar mi confianza y hacerme atacar sin dudarlo. Está tratando de engañarme para que me lance hacia el final del rastro, cuando en realidad, ha cubierto su último conjunto de huellas, y está esperando para atacarme por detrás. A juzgar por el aspecto de la nieve, creo que puedo adivinar con bastante precisión dónde está parado realmente el chamán.

              Agarro mi daga firmemente con ambas manos, y empiezo a correr hacia el chamán. El ogro entra en pánico y desactiva su hechizo de invisibilidad automáticamente mientras se prepara para atacarme.
        effects:
          - set:
              successful_checks:
                - '[ Comprobación de observación exitosa - nivel 3 ]'
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: ch10_volunteer2
                condition: is_dead = 0
