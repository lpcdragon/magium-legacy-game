  - name: ch10_maintain
    texts:
      - source: scene_text
        paragraph: 20
        text: |-
          "¡No!" les digo a Rose y Kate. "¡No se muevan! ¡Eso es exactamente lo que quiere que hagamos! ¡Solo quédense donde están!"

          Las dos dudan por un segundo, pero tras mirarme a los ojos, ambas deciden confiar en mi criterio y quedarse atrás conmigo.

          "¿En serio?" dice Illuna, mientras el capitán ogro golpea su garrote contra el suelo.

          El piso empieza a resquebrajarse, pero tal como predije, las grietas en el suelo dejan de formarse justo frente a nosotros. Resulta que estábamos parados sobre una de las paredes de la cueva subterránea, igual que Hadrik y el capitán ogro. Illuna reacciona rápidamente saltando a una pared y usándola para impulsarse hacia nuestra posición antes de que el suelo se desmorone bajo sus pies.

          "Vaya, quién lo diría," dice. "De hecho tenías razón."

          "¡Daren!" grita Rose, mientras mira hacia abajo dentro del abismo que se había formado en el centro de la habitación.
      - source: scene_text_2
        paragraph: 16
        text: |-
          Mirando dentro del foso, veo que Daren está colgado de una viga de madera que empieza a crujir bajo su peso. Me había olvidado por completo de que lo habían lanzado contra una pared al principio de la pelea. Debía de estar todavía aturdido cuando el suelo empezó a desmoronarse. Mientras miro hacia abajo para ver si hay algún punto de apoyo que pudiera usar para llegar hasta él, me doy cuenta de que incluso si lograra de alguna manera alcanzar su posición, no habría forma de que pudiera volver a subir. Los andamios de madera son prácticamente inutilizables a estas alturas. Todo lo que queda de ellos son algunos pilares de soporte y unas pocas vigas aquí y allá que parecen poder romperse en cualquier momento.

          "¡Quédense donde están!" nos grita Daren. "¡Hagan lo que hagan, no bajen aquí! ¡No se preocupen, lo tengo todo bajo control!"

          Está mintiendo. Como mucho, le queda medio minuto antes de que esa viga se rompa bajo su peso, y no tiene forma de volver a subir. Debe estar tratando de protegernos.

          "¡Maldito seas!" le grita Hadrik al capitán ogro, mientras choca con él una vez más. "¡Fuiste tú quien les dijo a los ogros que el centro de la habitación era una zona segura, ¿verdad?! ¿Las vidas de esos soldados no valían nada para ti?"

          "¡Ja!" dice el capitán. "Esos no ser mis mejores guerreros. Ser solo carne de cañón. Todos reemplazables. Yo solo ser lo bastante fuerte para acabar con todos ustedes. ¡Mira abajo! Uno de tus amigos ya estar al final de su cuerda. El resto de ustedes ir a seguirlo pronto."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch10_teleport
  - name: ch10_teleport
    texts:
      - source: scene_text
        paragraph: 21
        text: |-
          La viga a la que Daren está agarrado cruje con fuerza. No le queda mucho tiempo. De la nada, Illuna salta más allá de nosotros y se lanza al foso. Usa uno de los pilares de madera para impulsarse de vuelta hacia la pared de la cueva, que luego usa para empujarse más abajo en el foso, y de vuelta hacia el pilar de madera. Salta de un lado a otro entre el pilar y la pared unas cuantas veces, hasta que finalmente alcanza el nivel de Daren. Luego agarra la pared de la cueva con la mano izquierda y extiende la mano derecha hacia Daren.

          "¡Sanador, toma mi mano!" dice Illuna.

          "¡Ni muerto!" dice Daren.

          La viga de madera cruje de nuevo. Esta vez parece que está a punto de romperse.

          "¡Sanador, no hay tiempo!" grita Illuna. "¡Toma mi maldita mano!"

          Daren la mira con indecisión durante unos segundos, pero no tiene tiempo de pensarlo más, porque la viga de madera finalmente se rompe bajo su peso y empieza a caer al abismo. Illuna se empuja contra la pared con toda su fuerza y salta hacia Daren, agarrándolo con la mano derecha. Mientras los dos caen al foso, empiezan a brillar intensamente, y justo antes de llegar al suelo, desaparecen y luego reaparecen en el piso frente a nosotros, sanos y salvos.

          "¡No!" grita el capitán ogro, mientras intenta golpear a Hadrik con su garrote de nuevo.
      - source: scene_text_2
        paragraph: 17
        text: |-
          "¿Qué pasa?" le pregunta Hadrik, mientras bloquea su golpe una vez más. "¿No dijiste que acabarías fácilmente con todos nosotros tú solo? ¡Deberías alegrarte de que te hayan dado la oportunidad de acabar con todos nosotros con tus propias manos!"

          "Illuna, ¿no puedes ayudarlo?" pregunta Rose. "No sé cuánto más pueda aguantar Hadrik..."

          "El ogro lleva una armadura anti-magia de la cabeza a los pies," dice Illuna. "Eso significa que no puedo afilar mi agua contra él, así que mis látigos y mis flechas quedan descartados. Normalmente, usaría uno de mis látigos para arrastrarlo al abismo, pero es demasiado grande y pesado como para moverlo con la cantidad de energía mágica que tengo a mi disposición. Mis hechizos más fuertes probablemente penetrarían sus defensas, pero no están diseñados para impactar un solo objetivo, así que arriesgaría golpear al enano junto con el capitán ogro si los usara."

          "Debe haber algo que podamos hacer..." dice Rose.

          "¡Eh, enano!" grita Arraka con fuerza. "¿Recuerdas cuando te dije que el punto débil de los ogros está en la base de su cuello? ¡Es hora de que pongas en práctica esa técnica secreta que te enseñé!"

          Hadrik se ríe.

          "¡Así es!" dice, sonriendo ampliamente. "¡Supongo que ya es hora de dejarme de tonterías!"
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch10_quota
  - name: ch10_quota
    texts:
      - source: scene_text
        paragraph: 22
        text: |-
          El capitán ogro de repente deja de atacar a Hadrik y usa su garrote para protegerse el cuello. Hadrik concentra toda su aura en su puño derecho y perfora la armadura del pecho del ogro con un puñetazo, haciendo que el capitán caiga de rodillas, suelte su garrote y empiece a escupir sangre. Hadrik aprovecha la oportunidad, agarra el garrote del ogro y lo lanza dentro del abismo.

          "¡¿Por qué?!" pregunta el ogro, mientras escupe más sangre. "¡¿Por qué ir a por pecho en vez de cuello?! ¡¿Técnica secreta no se supone que apuntar a punto débil?!"

          Hadrik y Arraka empiezan a reírse simultáneamente.

          "¡No había ninguna técnica secreta, pedazo de idiota!" dice Arraka. "¡Solo dije eso para hacer que entraras en pánico y concentraras toda tu defensa en un solo punto!"

          "Supongo que solo hicieron falta dos de nosotros para derrotarte después de todo," dice Hadrik, sonriendo. "Tal vez deberías haber traído soldados de verdad contigo, en vez de pelagatos."

          "Esto no haber terminado aún, enano," dice el ogro, y tose un poco más. "Yo ir a aplastar tu cabeza diminuta, y--"

          Hadrik no deja que el ogro termine su amenaza, y le aplasta la cabeza entre sus manos. Cuando el cuerpo sin vida del ogro cae al suelo, el enano salta hacia nuestro lado de la habitación y le sonríe a Arraka.

          "No estuvo nada mal para un espíritu de alegría y risas," le dice. "Ciertamente te has ganado tu cuota del día por hacerme reír a gusto."
      - source: scene_text_2
        paragraph: 18
        text: |-
          "Bueno, hablando en serio," dice Arraka, "no podía dejar que mataran a la única persona de todo este grupo que se ríe con mis chistes. Puedes invitarme a una cerveza cuando salga de este amuleto. Aunque no estoy segura de cómo va a funcionar eso, porque probablemente los mate a todos a los pocos segundos de escapar. ¡Aja- JAJAJAJAJAJA!"

          "¡¿Has perdido la cabeza, banshee?!" grita Daren, furiosamente, de repente.

          "¿Quién, yo?" pregunta Arraka.

          "¡Tú no!" dice Daren. "¡La otra banshee!"

          "¿Qué, porque te teletransporté fuera del foso?" dice Illuna. "No irás en serio a empezar a decir que podrías haber salido de ahí tú solo, ¿verdad?"

          "¡Claro que no!" dice Daren. "¡Estaba a punto de morir, y luego me salvaste! ¿Por qué me salvarías? ¡Mi muerte te habría beneficiado de todas las maneras posibles, y nadie podría haberte culpado si me dejabas morir! ¿Qué podrías haber esperado conseguir con esto?"

          "No veo razón para justificar mis acciones ante ti," dice Illuna. "Descúbrelo tú mismo."

          La cara de Daren está tan roja de ira que parece que podría explotar en cualquier momento.
      - source: scene_3
        paragraph: 2
        text: |-
          "No tenemos tiempo para esto," dice Kate. "Mira el mapa. Todos los ogros que estaban durmiendo se están despertando y tomando sus posiciones. Los demás están patrullando frenéticamente los pasillos, como si estuvieran buscando algo. Deben de haber descubierto uno de los cadáveres y dado la alarma. El chamán acaba de salir de sus aposentos y ahora está reuniendo un equipo para que lo siga."

          "Eso significa que ya no podremos escabullirnos del fuerte por la puerta principal," dice Illuna. "No creo que sea buena idea enfrentarnos a todos estos ogros de frente. Por suerte para nosotros, la habitación en la que estamos ahora no aparece en ninguno de los planos del edificio, así que la mayoría de las patrullas no es muy probable que vengan a buscarnos aquí. Lo mejor que podemos hacer es descender a las cavernas debajo de nosotros, y luego seguir los túneles subterráneos hasta llegar a la salida en la base de la colina."
    choices:
      - position: 1
        text: ¿Cómo sabes que las cavernas de abajo no llevarán a un callejón sin salida?
        effects:
          - set:
              current_scene: ch10_caverns
      - position: 2
        text: ¿Cómo vamos a bajar hasta allí con los andamios rotos?
        effects:
          - set:
              current_scene: ch10_scaffolding
  - name: ch10_caverns
    texts:
      - source: scene_text
        paragraph: 23
        text: |-
          "¿Cómo sabes que las cavernas de abajo no llevarán a un callejón sin salida?"

          "Encontramos un mapa bastante detallado de los túneles en la biblioteca de los ogros," dice Illuna. "Arraka, ¿crees que puedes añadirlo al mapa del fuerte?"

          "Sí, dame un segundo," dice Arraka.

          Unos momentos después, se añade un nuevo nivel al holograma del fuerte, mostrándonos la distribución de los túneles subterráneos en detalle. Las cavernas parecen tener efectivamente una salida, pero hay varios magos ogros apostados justo frente a ella.

          "Hay guardias en la salida," dice Illuna. "Bien. Eso significa que los túneles todavía se usan hasta cierto punto, así que no debería haber derrumbes bloqueando nuestro camino."

          "¿Cómo bajaremos con los andamios rotos?" pregunta Kate.

          "Mientras caía antes, vi que había otros andamios justo debajo de la habitación más allá de la pared a nuestra derecha," dice Illuna. "Parecían estar en buen estado, así que no debería haber problema en bajar hasta el fondo de las minas."
      - source: scene_text_2
        paragraph: 19
        text: |-
          "¿No puedes simplemente lanzar tu hechizo de teletransportación de antes?” pregunta Hadrik. “Ya sabes, el que usaste para rescatar a Daren del foso?”

          "No, solo puedo lanzar ese hechizo una vez al día," dice Illuna. "Lo mismo para el hechizo de jaula dorada que usé para atraparlos cuando entramos al fuerte. Por eso no lo usé contra esos ogros mientras luchaba contra ellos."

          "Entonces aún podrías haber lanzado el hechizo de teletransportación ahora, de no ser por mí..." dice Daren.

          "Sí, pero el hechizo solo me permite teletransportar a una persona más conmigo, así que no nos habría sido de mucha utilidad aquí," dice Illuna. "Además, tiene un alcance muy limitado, así que tampoco puedo usarlo para viajar. Rara vez tengo la oportunidad de usar ese hechizo, siendo sincera."

          "Muy bien, entonces," dice Hadrik. "Voy a ir a destrozar esa pared para que podamos pasar a la otra habitación."

          Después de que Hadrik destruye la pared, vemos que el suelo en el centro de la habitación adyacente también se había desmoronado después del golpe del ogro. La pared de la cueva de nuestro lado del foso y la del lado opuesto parecen extenderse hasta el final de la otra habitación, y probablemente más allá también. Tal como dijo Illuna, los andamios debajo de la otra habitación parecen estar mayormente intactos, y no debería ser demasiado arriesgado bajar por las escaleras de madera hasta llegar al fondo.

          "Pongámonos en marcha," dice Daren. "Antes de que los ogros encuentren esta habitación o el chamán les diga dónde está."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch10_messenger
