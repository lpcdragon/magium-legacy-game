          "Eso es cierto," dice Eiden. "Pude notar incluso desde lejos que apenas eras capaz de mantener los sentidos en aquel momento."

          "¡Sí, exacto!" digo. "Por eso no pude--"

          "Sin embargo..." me interrumpe Eiden. "Si entregar mi mensaje hubiera sido tu primera prioridad, seguramente habrías sido capaz de encontrar los recursos necesarios para cumplir tu tarea."

