            paragraph: 27
            text: |-
              "¡Al diablo con Arraka! No podemos permitirnos perder más tiempo aquí."

              "Estoy de acuerdo," dice Daren. "Puede averiguarlo mientras avanzamos. Vámonos."

              A medida que nos acercamos a nuestro objetivo, de repente tengo una visión de nosotros caminando directamente hacia una explosión, y luego siendo enterrados bajo una masa de escombros.

              "¡Alto!" grito inmediatamente, y todos se quedan inmóviles. "¡Si avanzamos más, nos van a volar en pedazos!"

              "¿Estás seguro?" me pregunta Hadrik.

              "Sí, no hay error posible," digo. "La visión que vi fue muy clara."

              "¡Ya lo tengo!" dice Arraka, de repente. "Hay una trampa de explosión mágica muy poderosa justo delante de nosotros. Esperen, voy a resaltar la zona para que sepan dónde está."

              Poco después de que termina de hablar, una pequeña zona delante de nosotros se cubre de luz azul.

              "¿De qué están hablando?" dice Daren. "Yo no detecto ninguna trampa."
          - source: scene_text_2
            paragraph: 22
            text: |-
              "Eso es porque está muy bien escondida," dice Arraka. "Apenas puedo sentir algo de magia proveniente de ella, pero está ahí. Siéntete libre de caminar hacia ella si no me crees. De hecho, creo que deberías caminar hacia ella de todos modos. ¡Sería absolutamente gracioso de ver!"

              Daren se acerca a la zona iluminada, y empieza a agitar su espada en el aire, como si estuviera intentando atrapar la luz con ella.

              "Vaya, será posible..." dice Daren. "Retrocedan. Voy a desactivar la trampa."

              Luego empieza a cortar el aire en un movimiento triangular, varias veces seguidas. De repente, oímos un fuerte estallido, y luego hay humo saliendo de la nada. El humo pronto desaparece, y la luz azul de Arraka se desvanece con él.

              "Creo que con eso debería bastar," dice Daren.

              "Sí, la trampa ya no está," dice Arraka. "Solo quedan los ogros. Denme un segundo. Los voy a resaltar a ellos también."

              "¡Suficiente!" oímos la voz del chamán, y pronto se materializa de la nada, junto con los cinco magos ogros que lo acompañan. "No sé cómo pudieron ver a través de mi trampa y a través de mi hechizo de invisibilidad, pero ahora sé por qué fueron capaces de evitar todas las patrullas en su camino a la sala del tesoro."
        effects:
          - set:
              successful_checks:
                - '[ Comprobación de premonición exitosa - nivel 3 ]'
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: ch10_ritual
                condition: is_dead = 0
  - name: ch10_wait
    texts:
      - source: scene_text
        paragraph: 28
        text: |-
          "Al menos podríamos esperar hasta que los ogros lleguen al suelo de la cueva. Todavía necesitarán otros cinco minutos para alcanzarnos después de eso, así que nos quedará tiempo de sobra para acabar con los guardias y salir de los túneles."

          "Está bien," dice Daren. "Pero si no tiene una respuesta para entonces, salimos corriendo."

          "¡Ya lo tengo!" dice Arraka, después de un rato. "Hay una trampa de explosión mágica muy poderosa a unos sesenta metros delante de nuestra posición. Sigan adelante, les diré cuándo parar."

          "¿De qué están hablando?" dice Daren, mientras todos empezamos a avanzar. "Yo no detecto ninguna trampa."

          "Eso es porque está muy bien escondida," dice Arraka. "Apenas puedo sentir algo de magia proveniente de ella, pero está ahí. Esperen, voy a resaltar la zona para que sepan dónde está."

          Poco después de que termina de hablar, una pequeña zona delante de nosotros se cubre de luz azul. Cuando nos acercamos, Daren empieza a agitar su espada en el aire, como si estuviera intentando atrapar la luz con ella.
