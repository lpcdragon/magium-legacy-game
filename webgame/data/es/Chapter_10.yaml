            paragraph: 45
            text: |-
              Me lanzo hacia uno de los lobos, pero esta vez, en lugar de ir directamente a por su garganta, empiezo con una finta. El lobo instintivamente salta hacia atrás, y luego se lanza directo hacia mí de nuevo, excepto que esta vez lo estaba esperando, así que lo apuñalé en el ojo con mi cuchillo.

              Uno de los otros lobos intenta morderme la pierna derecha por detrás, pero reacciono a tiempo y me giro para enfrentarlo, al mismo tiempo que retiro mi pierna fuera de su alcance. La bestia se abalanza sobre mí, pero mis reflejos me permiten esquivarla y al mismo tiempo lanzar un contraataque. Mientras la criatura todavía intenta recuperar el equilibrio, le atravieso la cabeza con mi cuchillo, y luego me doy la vuelta para enfrentar a mi último enemigo. Sé perfectamente que no soy lo bastante rápido como para poder hacerle daño si soy yo el que ataca, así que dejo que el lobo venga a mí en su lugar. Mientras se lanza hacia mí, espero hasta el último momento y me hago a un lado, al mismo tiempo que le clavo el cuchillo en la parte trasera de la cabeza.

              De repente, todo el mundo empieza a girar a mi alrededor, y pronto me encuentro de pie en medio de una cueva otra vez, con todos mis amigos a mi lado. Ellos también parecen haberse despertado recién, porque ahora están mirando a su alrededor para confirmar que efectivamente estamos de vuelta en las minas abandonadas debajo del fuerte de los ogros.

