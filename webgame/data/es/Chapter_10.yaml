scenes:
  - name: ch10_intro
    texts:
      - source: scene_text
        paragraph: 2
        text: |-
          "No puedo creer que hayamos conseguido que nos apresen dos veces en dos días," dice Hadrik. "Y por animales y ogros, para colmo. Si esto se sabe, nos van a convertir en el hazmerreír del torneo."

          Han pasado ya cerca de seis horas desde que nos teletransportaron a nuestra celda. Lo sé porque mi dispositivo de estadísticas también me muestra la hora del día, además de mis estadísticas. De otro modo, habría sido casi imposible saber cuánto tiempo había pasado, porque no solo no hay ventanas en nuestra celda, sino que tampoco hay fuentes de luz de ningún tipo, excepto por la pequeña luz que emite la pantalla de mi potenciador de estadísticas.

          Durante las últimas horas, hemos estado intentando deshacernos del efecto de parálisis permanente de nuestra celda y de idear un plan para engañar a los guardias ogros y que nos liberen. Hasta ahora, no hemos hecho ningún progreso significativo en ninguno de los dos frentes. Daren y Hadrik lograron eliminar sus hechizos de parálisis temporalmente, concentrando toda su energía mágica en dar a sus músculos una potente sacudida, pero apenas pudieron moverse un metro antes de que el hechizo se lanzara automáticamente sobre ellos de nuevo.

          De los cinco que estamos atrapados aquí, parece que soy el único que puede mover las manos, aunque solo ligeramente. Resulta que la resistencia parcial a la parálisis es una de las ventajas de ser un lessathi, junto con una resistencia a la electricidad por encima de la media. Dicho esto, esta nueva habilidad mía no me ha servido de mucho realmente, excepto para poder sacar el dispositivo de estadísticas de mi bolsillo y usarlo como una vela improvisada.
      - source: scene_text_2
        paragraph: 2
        text: |-
          Viendo que no podíamos liberarnos del hechizo de parálisis, decidimos centrar nuestra atención en idear un plan para que los ogros abrieran la puerta y cancelaran el hechizo por nosotros. Desafortunadamente, a pesar de su reconocida estupidez, los ogros tenían órdenes estrictas de no dejarnos ir bajo ninguna circunstancia, y tenían demasiado miedo de su capitán como para arriesgarse a ir en contra de sus deseos.

          Rose no ha dicho ni una sola palabra desde que nos encarcelaron. La traición de Illuna debe haberla afectado mucho. El resto de nosotros tampoco estamos exactamente en el mejor estado de ánimo, pero estamos lejos de habernos rendido. Como los ogros tienen miedo de dejarnos morir de hambre por nuestros collares, esperamos que vengan a traernos comida, tarde o temprano.

          En el momento en que abran la puerta, Daren y Hadrik usarán sus técnicas de sacudida muscular y saldrán corriendo, en el poco tiempo que tienen a su disposición antes de ser paralizados de nuevo. Luego encontrarán el panel de control que cancela el hechizo de parálisis, y todos seremos libres de recorrer su fortaleza a nuestro antojo. No es un plan perfecto, pero es mejor que simplemente rendirse y aceptar nuestro destino.

          "¡Esa maldita banshee!" dice Daren. "Sabía desde el principio que estaba tramando algo. Estábamos tan mal equipados para esta misión que no tuve más remedio que aceptar la ayuda de Flower cuando la ofreció, pero ahora empiezo a arrepentirme de no haber seguido mis instintos."
    effects:
      - set:
          successful_checks:
            - 'Punto de control alcanzado: Partida guardada.'
        condition: checkpoint_rich = 1
    choices:
      - position: 1
        text: Sí, nos arrasó por completo.
        effects:
          - set:
              current_scene: ch10_number
              checkpoint_rich: 0
      - position: 2
        text: En realidad, no estoy tan seguro de que nos haya traicionado de verdad.
        effects:
          - set:
              current_scene: ch10_betrayed
              checkpoint_rich: 0
  - name: ch10_number
    texts:
      - source: scene_text
        paragraph: 3
        text: |-
          "Sí, nos arrasó por completo."

          "Para ser sincera, no creo que la banshee nos haya traicionado realmente," dice Kate.

          "¿Por qué dices eso?" le pregunto.

          "Por lo que dijo sobre los collares que llevamos en el cuello," dice Kate. "Incluso si tenemos en cuenta el hecho de que los lessathi eran significativamente más avanzados tecnológicamente que cualquiera de las razas predominantes actualmente, no hay forma de que unos dispositivos tan pequeños puedan volar todo este fuerte. Si realmente hay un mecanismo de autodestrucción implantado en estos collares, dudo que pudiera acabar con más de una habitación llena de ogros. Creo que la banshee sabía esto, y estaba apostando por la falta de experiencia de los ogros en este tema particular cuando les mintió al respecto."

          "Lamento reventarte la burbuja, Kate, pero todo eso me suena a ilusiones," dice Hadrik. "¿No pensarás de verdad que la banshee va a aparecer aquí para abrir nuestra celda, cancelar el hechizo de parálisis y decirnos que todo fue parte de su plan, verdad?"

          Casi inmediatamente después de que el enano termina su pregunta, oímos a uno de los guardias ogros de fuera de nuestra celda gritando a todo pulmón.
      - source: scene_text_2
        paragraph: 3
        text: |-
          "¡Alto!" dice. "No tienes permiso para seguir adelante. Da la vuelta ahora o--"

          El ogro se detiene a mitad de frase, y lo siguiente que oímos es un fuerte golpe fuera de nuestra puerta.

          "¡Ja!" oigo la voz de Arraka a través de las paredes de piedra de nuestra celda. "Ese ogro debía de estar tan concentrado en formar una oración coherente que ni siquiera se dio cuenta de que le cortaban la cabeza."

          "¿Alguna vez te callas?" le pregunta Illuna.

          "¡Eh, déjame salir de este amuleto, y te prometo que no oirás ni una palabra más de mí nunca más!" dice Arraka, mientras empieza a reírse.

          Unos momentos después, puedo sentir que la parálisis empieza a desvanecerse lentamente, mientras empiezo a recuperar el control de mis extremidades. Poco después, la puerta de nuestra celda se abre con un chirrido, y vemos a Illuna frente a nosotros, con su habitual expresión de desagrado en el rostro.

          "¿Y bien, a qué están esperando?" dice. "¡Levántense! Ese cáliz no va a robarse solo."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch10_sword
  - name: ch10_betrayed
    texts:
      - source: scene_text
        paragraph: 4
        text: |-
          "En realidad, no estoy tan seguro de que nos haya traicionado de verdad."

          "¿Te has vuelto loco?" me pregunta Daren.

          "No, piénsalo un segundo," le digo. "Cuando le preguntaron cómo lidiar con nosotros, omitió a propósito el hecho de que nuestros collares están programados para electrocutarnos si nos alejamos demasiado unos de otros. Solo le contó al chamán sobre nuestro límite de cinco días. ¿Y si solo estaba ganando tiempo, para poder recorrer las instalaciones de la fortaleza sin obstáculos, y así mapear su distribución?"

          "Le estás dando demasiadas vueltas, Barry," dice Daren. "Probablemente sea solo porque los collares habrían explotado de todos modos, después de electrocutarnos. Dejar que se agotara el tiempo era seguramente la única forma en que podrían habernos matado de manera segura, de lo contrario habría mencionado otra cosa."

          "No creo que eso sea cierto," dice Kate. "Incluso si tenemos en cuenta el hecho de que los lessathi eran significativamente más avanzados tecnológicamente que cualquiera de las razas predominantes actualmente, no hay forma de que unos dispositivos tan pequeños puedan volar todo este fuerte. Si realmente hay un mecanismo de autodestrucción implantado en estos collares, dudo que pudiera acabar con más de una habitación llena de ogros. Creo que la banshee sabía esto, y estaba apostando por la falta de experiencia de los ogros en este tema particular cuando les mintió al respecto."
      - source: scene_text_2
        paragraph: 4
        text: |-
          "Lamento reventarte la burbuja, Kate, pero todo eso me suena a ilusiones," dice Hadrik. "¿No pensarás de verdad que la banshee va a aparecer aquí para abrir nuestra celda, cancelar el hechizo de parálisis y decirnos que todo fue parte de su plan, verdad?"

          Casi inmediatamente después de que el enano termina su pregunta, oímos a uno de los guardias ogros de fuera de nuestra celda gritando a todo pulmón.

          "¡Alto!" dice. "No tienes permiso para seguir adelante. Da la vuelta ahora o--"

          El ogro se detiene a mitad de frase, y lo siguiente que oímos es un fuerte golpe fuera de nuestra puerta.

          "¡Ja!" oigo la voz de Arraka a través de las paredes de piedra de nuestra celda. "Ese ogro debía de estar tan concentrado en formar una oración coherente que ni siquiera se dio cuenta de que le cortaban la cabeza."

          "¿Alguna vez te callas?" le pregunta Illuna.

          "¡Eh, déjame salir de este amuleto, y te prometo que no oirás ni una palabra más de mí nunca más!" dice Arraka, mientras empieza a reírse.

          Unos momentos después, puedo sentir que la parálisis empieza a desvanecerse lentamente, mientras empiezo a recuperar el control de mis extremidades. Poco después, la puerta de nuestra celda se abre con un chirrido, y vemos a Illuna frente a nosotros, con su habitual expresión de desagrado en el rostro.

          "¿Y bien, a qué están esperando?" dice. "¡Levántense! Ese cáliz no va a robarse solo."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch10_sword
  - name: ch10_sword
    texts:
      - source: scene_text
        paragraph: 5
        text: |-
          Viendo que ninguno de nosotros dice nada, Illuna empieza a hablar de nuevo.

          "La chica les dijo antes de venir aquí que teníamos un plan secreto, ¿no?" dice. "Pues bien, este es ese plan. Los estoy sacando de aquí. Ahora vamos, no deberíamos quedarnos mucho tiempo en un solo lugar."

          "Sí, no me lo trago," dice Daren. "Me inclino mucho más a creer que tu trato con los ogros no salió tan bien como esperabas, y ahora estás tratando de usarnos para vengarte de ellos. La prueba es que no nos dijiste tu plan de antemano."

          "No podía decirles de antemano, pedazo de bruto," dice Illuna. "Sus reacciones tenían que ser genuinas cuando los traicioné. El chamán puede saber por sus auras si están realmente conmocionados o solo fingiendo. Esa es la razón por la que tuve que poner a dormir a Flower. Como banshee, soy la única a la que el chamán no puede leer, porque tengo control total sobre mis emociones, así como sobre mis fluctuaciones de aura."

          "¿Ah, sí?" dice Daren. "Entonces, ¿por qué no despiertas a la chica, para que pueda confirmar todo esto ella misma?"

          "La estasis en la que puse a Flower no puede deshacerse a la fuerza sin arriesgar complicaciones graves," dice Illuna. "El hechizo suele durar dos días, así que no tuve tiempo de esperar a que despertara antes de venir a rescatarlos."

          "Qué conveniente," dice Daren.

          La banshee le frunce el ceño.

          "Si no te apetece salir de esta celda, entonces me llevaré a los demás conmigo y te dejaré aquí a que te pudras," dice.
      - source: scene_text_2
        paragraph: 5
        text: |-
          "Oh, iré contigo, no te preocupes," dice Daren. "Pero en cuanto recupere mi espada, te vas a enterar."

          "Ya veo," dice Illuna, mientras hace un gesto con la mano, y todas nuestras armas vienen flotando al interior de la celda. "No voy a mentir. Eso sería un poco problemático para mí."

          Luego hace un gesto con la mano derecha hacia nosotros, y mi daga y ballesta caen en mi regazo, mientras al mismo tiempo, la daga de Kate cae en su mano derecha. La banshee entonces agarra la espada de Daren, y lo mira fijamente. Daren intenta levantarse, pero el efecto de la parálisis todavía no ha desaparecido del todo, así que se tambalea sobre sus pies. Tras mirarlo durante unos segundos, Illuna decide lanzarme la espada a mí en su lugar.

          "Toma, quédatela tú," me dice la banshee. "Pareces tener una cabeza decente sobre los hombros y lo conoces mejor que yo. Te dejaré decidir si darle la espada o no, dadas las circunstancias."

          "Barry..." dice Daren, mientras se levanta y empieza a caminar hacia mí. "Dame la espada."

          Tiene esa mirada en los ojos otra vez. Conozco esa mirada. No está pensando con claridad. Va a atacar a Illuna en cuanto le devuelva su arma, ¿verdad? ¿Qué se supone que debo hacer aquí, exactamente?
    choices:
      - position: 1
        text: Darle la espada
        effects:
          - set:
              current_scene: ch10_give
      - position: 2
        text: Solo darle la espada si jura no atacar a Illuna con ella
        effects:
          - set:
              current_scene: ch10_swear
  - name: ch10_give
    texts:
      - source: scene_text
        paragraph: 6
        text: |-
          "Haz lo que quieras," digo, mientras le lanzo la espada.

          "Hmph," dice Illuna. "Típico."

          "Ya es hora de que tú y yo tengamos un pequeño duelo, banshee," dice Daren, mientras se dirige hacia la puerta. "Nadie va a salvarte esta vez."

          Los dos salen al pasillo donde el guardia ogro fue asesinado. El resto de nosotros los seguimos fuera de la celda, para tener una mejor vista de la pelea. Hasta ahora, nadie parece tener intención de detener a ninguno de los dos.

          "Vamos a resolver esto de una vez por todas," dice Daren, con un tono serio en su voz. "Luchamos hasta el final. ¿Estás lista, banshee?"

          "Tan lista como puedo estarlo," dice Illuna, en un tono desinteresado.

          "Entonces allá voy," dice Daren, y se lanza hacia ella, levantando su espada en el aire, listo para golpear.
      - source: scene_text_2
        paragraph: 6
        text: |-
          Illuna conjura un látigo de agua de la nada, que agarra con la mano izquierda, y luego lo lanza hacia la muñeca de Daren. El agua se solidifica al alcanzarlo, y el impacto del golpe le hace abrir el puño y la espada sale volando de su mano. La banshee inmediatamente crea otro látigo con la mano derecha, que rápidamente se enrosca alrededor de la cintura de Daren, solidificándose también. Antes de que Daren tenga tiempo de entender qué pasó, Illuna tira del látigo y lo lanza con toda su fuerza contra una pared. Cuando intenta levantarse, la banshee crea una lanza de agua de la nada y la apunta a su cuello. A pesar de estar hecha de agua, la punta de la lanza parece más afilada que el acero común. Debe ser el resultado de una técnica similar al refuerzo de hielo de Kate.

          "No entiendo..." dice Daren. "¿Cómo lograste lanzarme así? ¡No tiene sentido!"
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch10_give2
  - name: ch10_give2
    texts:
      - source: scene_text
        paragraph: 7
        text: |-
          "Por supuesto que no," dice Illuna. "Porque nunca sucedió. El hecho de que yo fuera la que sostenía los látigos era solo una artimaña. Solo lo hice parecer así para infundir una falsa sensación de seguridad en ti. No fui yo quien te lanzó contra esa pared. El látigo lo hizo por sí solo, y yo simplemente imité el movimiento con mi brazo para hacer parecer que era yo la que hacía todo el trabajo. Como no esperabas que una simple niña tuviera tanta fuerza, bajaste la guardia contra tales ataques, volviéndote así vulnerable."

          Hace una pausa.

          "Ahora bien," continúa. "No suelo hacer este tipo de cosas, pero si prometes dejar de ser un idiota, estoy dispuesta a perdonarte la vida por el bien de Flower. En realidad, creo que lo he expresado mal. Puede que sea físicamente imposible para ti dejar de ser un idiota. Solo prométeme que no me atacarás de nuevo, y te devolveré tu espada."

          "¿Estás dispuesta a dejarme vivir después de todo esto?" pregunta Daren.

          "Sí," dice Illuna. "Si las leyendas tienen algo de cierto, entonces eres el tipo de hombre que preferiría morir antes que romper su palabra. Si consigo que lo jures, al menos podré estar tranquila de que no intentarás nada hasta que salgamos del fuerte."

          "Entonces lo juraré," dice Daren. "No te pondré la mano encima hasta que salgamos del fuerte."

          La banshee frunce el ceño de nuevo.

          "Suficiente," dice, mientras su lanza de agua desaparece en el aire.
      - source: scene_text_2
        paragraph: 7
        text: |-
          "¿El gran sanador con armadura perdiendo contra una banshee?" pregunta Hadrik, con una sonrisa, mientras Daren se levanta del suelo y va a recoger su espada. "¿No se supone que las banshees son tu especialidad?"

          "No estaba luchando a plena fuerza," dice Daren. "Habría ganado si hubiera tenido mi escudo."

          "Sí," dice Illuna, mientras hace un gesto con la mano derecha, y una piedra se desprende de una pared cercana. "Si hubieras tenido tu escudo."

          El escudo de Daren sale flotando del agujero en la pared y llega a la mano de Daren.

          "¿Sabías dónde estaba mi escudo todo este tiempo?" pregunta Daren.

          "Por supuesto," dice la banshee. "Estaba guardado en el mismo lugar que todas las demás armas. Lo escondí antes de abrir su celda para asegurarme de tener ventaja, en caso de que decidieras retarme de nuevo, como hiciste anoche."

          "¡Hiciste trampa!" dice Daren.

          "Hice lo que tenía que hacer para terminar este conflicto lo antes posible," dice Illuna, frunciendo el ceño. "Aquí el tiempo es esencial. Cada minuto que desperdiciamos peleando entre nosotros es un minuto que sería mejor emplear avanzando hacia el cáliz. Ahora, si ya terminamos aquí, sugiero que nos pongamos en marcha."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch10_apologizing
  - name: ch10_swear
    texts:
      - source: scene_text
        paragraph: 8
        text: |-
          "Te daré la espada con una condición," le digo. "Tienes que jurar que no atacarás a Illuna con ella."

          "¿Otra vez con eso?" dice Daren. "No me digas que de verdad te crees sus mentiras."

          "No importa lo que piense," digo. "Se mire como se mire, este no es el momento de pelear entre nosotros. Ahora, ¿vas a jurarlo o no?"

          Daren me frunce el ceño.

          "¡Está bien, lo juro!" dice. "Pero solo hasta que estemos todos a una distancia segura del fuerte de los ogros."

          "Me parece suficiente," digo, y le lanzo la espada.

          Mientras los cinco salimos de nuestra celda, Illuna hace un gesto con la mano derecha, y una piedra se desprende de una pared cercana. El escudo de Daren sale flotando del agujero en la pared y llega a la mano de Daren.

          "No entiendo," dice Daren. "¿Por qué los ogros colocaron mi escudo dentro de una pared?"

          "No lo hicieron," dice Illuna. "Estaba guardado en el mismo lugar que todas las demás armas. Lo escondí aquí antes de abrir su celda para asegurarme de tener ventaja, en caso de que decidieras retarme de nuevo, como hiciste anoche. Ahora bien, si ya terminamos aquí, sugiero que nos pongamos en marcha. Ya descubrí dónde tienen el cáliz."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch10_apologizing
  - name: ch10_apologizing
    texts:
      - source: scene_text
        paragraph: 9
        text: |-
          "¿Eso es todo?" pregunta Rose, con una expresión inusualmente furiosa en su rostro, mientras una lágrima se forma en uno de sus ojos. "¿Eso es todo lo que vas a decir después de lo que nos hiciste?"

          "Ya se los dije," dice Illuna, "tuve que ocultarles la verdad para asegurarme de que sus reacciones fueran genuinas. Todo era necesario para llevar a cabo nuestro plan."

          "¿Ah, sí?" pregunta Rose. "¿Y qué hay de todas esas cosas horribles que dijiste antes de que nos teletransportaran a nuestra celda? ¿Qué hay de cuando dijiste que era demasiado confiada para mi propio bien y que fui una tonta por no haber escuchado a Daren? ¿Todo eso también era necesario?"

          Cuando Rose terminó de hacer su pregunta, pude ver la expresión fría de Illuna cambiar por un breve instante. En ese instante, casi parecía humana.

          "No..." dice Illuna, tras una breve pausa. "No lo era. Solo dije todo eso porque quería desquitarme contigo por no dejarme descansar la otra noche. Reaccioné de forma exagerada. Me disculpo."

          La furia en los ojos de Rose desapareció al oír las palabras de Illuna. Se ve un poco confundida. No creo que esperara una disculpa tan sincera.

          "Bueno... Siempre y cuando no lo vuelvas a hacer..." dice Rose.

          Arraka empieza a reírse histéricamente.

          "¿Illuna disculpándose?" dice. "¡Rápido, busquen un lugar donde esconderse! ¡Atrínchérense! ¡El mundo tal como lo conocemos bien podría estar llegando a su fin!"
      - source: scene_text_2
        paragraph: 8
        text: |-
          "Te dije que te callaras," dice Illuna.

          "Eh, si quieres callarme, puedes simplemente cerrar el amuleto como haces siempre," dice Arraka. "¡Oh, espera! Si lo haces, perderás tu precioso mapa que pasamos todas esas horas en la biblioteca elaborando. Supongo que tendrás que aguantarme un rato más, entonces. ¡Aja- JAJAJAJAJAJA!"

          No había prestado mucha atención al holograma mágico semitransparente que flotaba frente a Illuna hasta que Arraka lo mencionó, pero ahora me doy cuenta de que de hecho es una versión en miniatura de la fortaleza de los ogros. No solo eso, sino que también hay puntos de colores en su interior que se mueven continuamente. Solo puedo asumir que los puntos en movimiento representan las patrullas de ogros de la fortaleza, y que los seis puntos que permanecen quietos en el nivel superior del muro izquierdo deben representar a nuestro propio grupo.

          "¡Eso es increíble!" dice Kate. "¿Todo este holograma detallado lo mantiene Arraka?"

          "Sí," dice Illuna. "Pasamos unas horas en la biblioteca, documentando la distribución de la fortaleza, para poder recrearla con la mayor precisión posible. El sentido mágico de Arraka es lo suficientemente poderoso como para detectar fácilmente a todas las criaturas vivientes en nuestra área, incluso si sus auras están siendo ocultadas por ese molesto hechizo de chamán que también otorga invisibilidad, así que puede simplemente mostrarlos como puntos en el mapa, para que todos los veamos. Con toda esta información en nuestras manos, los ogros no podrían sorprendernos, así que no encontramos resistencia mientras limpiamos todo este piso y escondimos los cuerpos."
    choices:
      - position: 1
        text: ¿Por qué los puntos tienen diferentes colores?
        effects:
          - set:
              current_scene: ch10_colors
      - position: 2
        text: ¿No puede Arraka mantener el holograma si cierras el amuleto?
        effects:
          - set:
              current_scene: ch10_hologram
  - name: ch10_colors
    texts:
      - source: scene_text
        paragraph: 10
        text: |-
          "¿Por qué los puntos tienen diferentes colores?"

          "Los puntos azules son los magos, los puntos rojos son los guerreros, el punto verde es el chamán y el punto morado es el capitán," dice Illuna.

          "¿Puede distinguir la diferencia?" pregunta Kate.

          "Sí," dice Illuna. "Si tu sentido mágico es lo suficientemente bueno, puedes hacer la distinción con bastante facilidad, basándote en su nivel de poder mágico o incluso en sus firmas de aura únicas. Ahora mismo, necesitamos llegar hasta el nivel más bajo del edificio principal, donde se encuentra su sala del tesoro."

          "Espera," dice Hadrik. "Antes de ponernos en marcha, creo que todavía hay un asunto más que necesita aclararse. El chamán te llamó Illuna de la masacre de los bosques sagrados antes, y dijo que mataste a cientos de animales sin piedad. ¿De qué iba todo eso?"

          "¡Oh, yo puedo responder esta pregunta por ella!" dice Arraka.

          "Arraka, te juro que si no te callas..." dice Illuna.

          "¿Mmm?" dice Arraka. "¿Qué harás?"

          Illuna no dice nada.

          "¡Eso pensé!" dice Arraka. "Bueno, como iba diciendo, para entender mejor los eventos de la masacre de los bosques sagrados, necesito contarles primero una pequeña historia. Es una historia sobre tres jóvenes banshees a las que decidí tomar bajo mi protección por la bondad de mi corazón hace unos cientos de años. Sus nombres eran Sidara, Unuri e Illuna."
      - source: scene_text_2
        paragraph: 9
        text: |-
          "Espera, ¿solías ser la guardiana de Illuna?" pregunta Hadrik.

          "No, solía ser su mentora," dice Arraka. "Era el ser al que ella más admiraba. Recuerdo que las tres dijeron una vez que querían ser como yo cuando crecieran. Eso fue antes de que supieran quién era yo realmente, por supuesto. Pasé años de mi vida enseñándoles todo lo que sabía. Les enseñé cómo defenderse de cazadores de banshees y magos blancos. Les enseñé cómo saber cuándo sus cuerpos empezaban a rechazarlas, para que pudieran comenzar a buscar nuevos huéspedes a tiempo. En otras palabras, les enseñé cómo sobrevivir."

          "Qué increíblemente amable de tu parte..." dice Kate, con un tono gélido en su voz.

          "Lo sé, ¿verdad?" dice Arraka. "¡Todo era una farsa, por supuesto! A decir verdad, empezaba a aburrirme un poco con la escasa cantidad de sufrimiento que podía traer al mundo mientras estaba atrapada en cuerpos de animales débiles. ¡Así que esta vez decidí probar algo un poco diferente! Pasé años de mi vida, convirtiéndome en esta especie de figura materna para las tres jóvenes banshees, todo para que fuera más doloroso para ellas cuando inevitablemente las traicionara. Pero a medida que pasó el tiempo, mi perspectiva original empezó a cambiar. A medida que fui conociendo mejor a las tres banshees, empecé a tomarle cariño a Illuna. Era mi mejor alumna, después de todo, y me recordaba un poco a mí misma cuando tenía su edad. Así que, en lugar de simplemente hacer que la mataran junto con las demás, decidí moldearla a mi imagen."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch10_adorable
  - name: ch10_hologram
    texts:
      - source: scene_text
        paragraph: 11
        text: |-
          "¿No puede Arraka mantener el holograma si cierras el amuleto?"

          "Dice que cerrar el amuleto la haría perder la concentración," dice Illuna. "Probablemente miente, pero el resultado es el mismo. Claramente no tiene intención de mantener el holograma si cierro el amuleto, así que estoy atrapada con ella así. Al menos el mapa ha sido genuino hasta ahora. Si seguimos este camino de aquí, deberíamos poder llegar hasta el nivel más bajo del edificio principal, donde se encuentra su sala del tesoro."

          "Espera," dice Hadrik. "Antes de ponernos en marcha, creo que todavía hay un asunto más que necesita aclararse. El chamán te llamó Illuna de la masacre de los bosques sagrados antes, y dijo que mataste a cientos de animales sin piedad. ¿De qué iba todo eso?"

          "¡Oh, yo puedo responder esta pregunta por ella!" dice Arraka.

          "Arraka, te juro que si no te callas..." dice Illuna.

          "¿Mmm?" dice Arraka. "¿Qué harás?"

          Illuna no dice nada.

          "¡Eso pensé!" dice Arraka. "Bueno, como iba diciendo, para entender mejor los eventos de la masacre de los bosques sagrados, necesito contarles primero una pequeña historia. Es una historia sobre tres jóvenes banshees a las que decidí tomar bajo mi protección por la bondad de mi corazón hace unos cientos de años. Sus nombres eran Sidara, Unuri e Illuna."
      - source: scene_text_2
        paragraph: 10
        text: |-
          "Espera, ¿solías ser la guardiana de Illuna?" pregunta Hadrik.

          "No, solía ser su mentora," dice Arraka. "Era el ser al que ella más admiraba. Recuerdo que las tres dijeron una vez que querían ser como yo cuando crecieran. Eso fue antes de que supieran quién era yo realmente, por supuesto. Pasé años de mi vida enseñándoles todo lo que sabía. Les enseñé cómo defenderse de cazadores de banshees y magos blancos. Les enseñé cómo saber cuándo sus cuerpos empezaban a rechazarlas, para que pudieran comenzar a buscar nuevos huéspedes a tiempo. En otras palabras, les enseñé cómo sobrevivir."

