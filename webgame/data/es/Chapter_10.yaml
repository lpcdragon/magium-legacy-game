            paragraph: 60
            text: |-
              "¡Quiero empezar a vivir aventuras!"

              Hadrik se ríe.

              "¡Ese es el espíritu!" dice. "¡Estoy seguro de que te va a encantar la vida aventurera! Si alguna vez te quedas sin ideas, o simplemente necesitas información sobre lugares a los que ir, ¡búscame! ¡Asumiendo que ambos salgamos vivos de aquí, claro!"

              "Si buscas más aventuras después de terminar el torneo, ¡siempre podrías volver a Varathia!" oigo la voz de Rose detrás de mí. "¡Podría escribirte una invitación formal, lo que haría mucho más fácil que pudieras regresar!"

              Hadrik sonríe, mientras mira a Rose.

              "¿Debo interpretar que por fin has cambiado de opinión y has decidido unirte a nosotros?" dice. "¡Tengo muchas más botellas de cerveza guardadas en mi mochila, así que no hace falta que os cortéis!"

              "En realidad, no," dice Rose. "¡Solo vine porque tenía un par de cosas que decirle a Barry antes de irme a dormir!"

              "¡No digas más!" dice Hadrik, y se levanta de su roca. "¡Toma mi asiento, por favor! Estaba a punto de volver a mi tienda."

              Luego levanta su botella de nuevo.

              "¡Salud, Barry!" dice, mientras chocamos nuestras botellas una vez más, y luego nos bebemos lo que queda de nuestra cerveza de un trago.
          - source: scene_text_2
            paragraph: 39
            text: |-
              "¡Vale, Barry, escucha atentamente!" dice Rose en voz baja, mientras Hadrik se dirige a su tienda. "Creo que puede que ya te hayas dado cuenta a estas alturas de que--"

              Se detiene a mitad de frase y me mira la cara.

              "Barry, ¿estás borracho?" pregunta.

              "Quizás un poco," le respondo.

              Rose se ríe.

              "Espera," dice. "Tengo unas hierbas en mi mochila que te pondrán en forma en un momento, y ni siquiera tendrás que preocuparte por la resaca. ¡Ahora vuelvo!"

              Después de buscar en su mochila, vuelve con un puñado de hojas rojas, y me dice que necesito masticarlas durante treinta segundos. Cuando termino, me doy cuenta de que mi mareo ha desaparecido por completo, y puedo pensar con claridad otra vez.

              "Entonces, como estaba diciendo," dice Rose, "puede que ya te hayas dado cuenta de que Kate, Hadrik y yo tuvimos una pequeña charla antes de votar para que tú y Daren tomarais el primer turno de noche. Siento que no te invitáramos también, pero alguien tenía que quedarse con Daren para que no sospechara."

              "Sí, más o menos me figuré que algo pasaba cuando vi lo bien sincronizados que estabais los tres," digo. "Entonces, ¿de qué va todo esto?"

              "Bueno, ¿sabes cómo Illuna dijo que Flower todavía necesita permanecer en estasis al menos hasta mañana por la noche?"

              "Sí, lo recuerdo."
