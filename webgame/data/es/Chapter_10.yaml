  - name: ch10_minimize
    texts:
      - source: scene_text
        paragraph: 74
        text: |-
          Una vez pusimos una buena distancia entre nosotros y el borde del bosque prohibido, decidimos montar el campamento cerca de un pequeño río, en una zona sin muchos árboles. Flower, que se había despertado recientemente de su estasis, ahora estaba siendo puesta al día sobre los detalles de lo que había pasado desde que la habían dormido.

          "¡Me alegro tanto de que el plan de Petal haya funcionado al final!" dice Flower, después de oír toda la historia. "Me preocupé un poco cuando me dijo que necesitaba ponerme en estasis durante dos días, pero decidí confiar en su juicio."

          "Espera, ¿has dicho el plan de Petal?" pregunta Kate. "¿No dijiste antes que las dos trabajasteis en ese plan?"

          "Bueno..." dice Flower, sintiéndose un poco avergonzada. "La verdad es que Petal es quien normalmente hace todas nuestras estrategias. Yo solo sigo su liderazgo la mayor parte del tiempo... Al principio, no creía que fuera a ayudar esta vez, ya que siempre se aseguraba de mantener distancias y no involucrarse con vosotros. Pero entonces algo pasó que le hizo cambiar de opinión aquella noche antes de llegar al fuerte. No me dijo qué exactamente, pero de repente se volvió mucho más activa planeando toda la operación, ¡e incluso se preocupó de minimizar los riesgos para vuestra seguridad! No sé qué le pasó, ¡pero me alegro mucho de que las cosas hayan salido como salieron!"

          Rose me sonríe. Creo que las dos sabemos lo que hizo que Illuna cambiara de opinión antes de llegar a los ogros. Parece que nuestra conversación privada con ella durante su turno de noche tuvo mucho más impacto del que habíamos pensado originalmente.
    choices:
      - position: 1
        text: Contarle a Flower la razón por la que Illuna cambió de opinión
        effects:
          - set:
              current_scene: ch10_reason
      - position: 2
        text: Quedarse callado para ahorrarle la vergüenza a Illuna
        effects:
          - set:
              current_scene: ch10_embarrassment
  - name: ch10_reason
    texts:
      - source: scene_text
        paragraph: 75
        text: |-
          "¡Creo que sé qué pasó aquella noche que le hizo cambiar de opinión!" digo con una sonrisa.

          Por un momento, pude ver los ojos de la chica volverse de un azul brillante, mientras Illuna me lanzaba una mirada amenazante.

          "¿Lo sabes?" pregunta Flower.

          "Sí," digo. "Rose y yo nos unimos a ella mientras hacía su turno, y estuvimos charlando toda la noche. Se quejó todo el rato, y no dejó de decir que quería que la dejaran sola para terminar su sándwich, ¡pero creo que la verdad es que disfrutó de nuestra compañía!"

          "¡Eso suena exactamente como ella!" dice Flower. "¡Nunca ha sido sincera con sus sentimientos!"

          "Espera, ¿estás diciendo que no fuiste tú quien convenció a Illuna para llevar a cabo el plan?" le pregunta Daren a Flower.

          "No, como he dicho, ella fue la que--" empieza a decir Flower pero se queda boquiabierta.

          "¿Has... has llamado a Petal por su nombre real?" pregunta la chica, aparentemente en estado de shock.

          "Sí, supongo..." dice Daren.

          "¿Eso significa que ahora sois amigos?" pregunta Flower.

          "¡No!" gritan Daren e Illuna simultáneamente.

          "¡Oh, dios mío, es verdad!" dice Flower. "¡Realmente sois amigos ahora!"
      - source: scene_text_2
        paragraph: 44
        text: |-
          "¡Deberíais haberlos visto discutiendo como dos tórtolos durante todo el camino de vuelta!" dice Arraka. "¡Es como si estuvieran hechos el uno para el otro!"

          "Espera, ¿tu dije está abierto?" le pregunta Flower a Arraka. "¿Cómo es que tu dije está abierto? ¡Petal nunca lo deja abierto!"

          "¡Ja!" dice Arraka. "Eso es cosa del pasado. ¡Debido a mi extraordinario desempeño durante nuestra última misión, he sido ascendida a miembro del grupo a tiempo completo! Eso significa que todos tenéis que escuchar mis opiniones a partir de ahora. Por ejemplo, ¡creo que antes de dormir, deberíamos cazar algunos animales y poner sus cabezas en estacas alrededor del campamento para ahuyentar a los invasores!"

          "No tientes a la suerte," dice Illuna.

          "Oh, dioses," dice Flower. "¡Han pasado tantas cosas mientras estuve dormida! ¡Ya casi no puedo seguirles la pista! ¡Esperad, necesito apuntarlo todo!"
    choices:
