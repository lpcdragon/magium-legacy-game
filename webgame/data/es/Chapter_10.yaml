              "Estoy de acuerdo," dice Daren. "Puede averiguarlo mientras avanzamos. Vámonos."

              A medida que nos acercamos a nuestro objetivo, empiezo a tener dudas sobre la advertencia de Arraka. Quizás habría sido más sensato esperar un momento y escuchar lo que tenía que decir. Estábamos lo bastante adelantados respecto a los ogros como para poder perder un minuto de nuestro tiempo.

              Mi proceso de pensamiento se ve interrumpido por una explosión repentina. Nunca tuve la oportunidad de descubrir de dónde vino, porque morí al segundo siguiente del estallido.
