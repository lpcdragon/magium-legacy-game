              "¡Esperad!" dice, en la lengua común. "Olvidé preguntar. ¿Alguno de vosotros se llama Rose, por casualidad?"

              "Yo soy Rose..." dice Rose. "¿Por qué lo preguntas?"

              "Una cierva llamada Elaria ha estado esperando impacientemente vuestro regreso," dice el leopardo. "Parecía muy preocupada por vos. ¿Os gustaría que le transmitiera un mensaje?"

              "Yo..." empieza a decir Rose y hace una pausa. "No, preferiría hablar con ella yo misma. ¿Podrías decirle que venga aquí, por favor? La esperaré."

              "Como deseéis," dice Leo. "Estará con vos en un momento."

              "¿Así que por fin has decidido coger al toro por los cuernos?" le pregunto a Rose, después de que el leopardo se va.

              "No hay mejor momento que el presente, ¿no crees?" dice Rose, sonriendo.

              "Espera, ¿de qué va todo esto?" nos pregunta Daren.

              "¡Es un secreto!" le dice Rose, sonriendo juguetonamente.

              "Claro..." dice Daren.

              Unos diez minutos después, Elaria por fin aparece, y se detiene unos momentos para recobrar el aliento antes de empezar a hablar.
          - source: scene_text_2
            paragraph: 43
            text: |-
              "¡Rose!" dice en su lengua antigua. "¡Rose, estaba tan preocupada! Los animales del bosque no dejaban de hablar del grupo de humanos capturados por el zorro dorado, y cuando reconocí vuestras descripciones corrí hacia el bosque prohibido tan rápido como pude. Esperaba poder persuadir al zorro de que os dejara ir, pero cuando supe que os envió a la fortaleza de los ogros casi perdí toda esperanza..."

              Cuando la cierva termina de hablar, Rose se acerca y le da un gran abrazo.

              "¡Gracias, Elaria!" dice. "¡Gracias por cuidar siempre de mí! Siento mucho cómo me he comportado últimamente. He estado evitándote activamente desde que murió el padre de Molan. Me sentía culpable y simplemente no podía soportar mirarte a los ojos. Pero alguien me hizo darme cuenta de que solo estaba empeorando las cosas al no hablar contigo. No debería haberte abandonado así. Debería haber estado contigo en tu momento de necesidad. ¿Podrás perdonarme alguna vez por mi egoísmo?"

              "¡Claro!" dice Elaria, mientras una lágrima cae de su ojo. "¡Claro que te perdono, Rose! Siempre serás bienvenida en nuestro hogar, pase lo que pase. ¡No lo olvides nunca!"

              "Prometo que volveré a visitarte tan pronto como termine de ayudar a toda la gente enferma de mi pueblo," dice Rose. "¡Y traeré conmigo esas hojas azules que tanto le gustan a Molan!"

              "Estoy segura de que Molan estará eufórico cuando se lo cuente," dice la cierva, sonriendo. "¡Por favor, cuídate, Rose!"
          - source: scene_3
            paragraph: 6
            text: |-
              "¡Lo haré!" dice Rose. "¡Nos vemos pronto! ¡Adiós, Elaria, y gracias de nuevo, por todo!"

              Se despide de la cierva, y luego todos reanudamos nuestro camino, mientras Rose parece como si un gran peso se hubiera quitado de sus hombros.
