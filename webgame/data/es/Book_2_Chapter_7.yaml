  - name: b2_ch07a_visiting
    texts:
      - source: scene_text
        paragraph: 22
        text: |-
          "En realidad, por lo que sabemos, puede que también esté visitando a otros grupos de magos", digo. "Tiene la capacidad de identificar a la gente por sus auras desde distancias muy largas y puede teletransportarse adonde quiera, así que no le supondría mucho esfuerzo hacerlo."

          "Ya veo..." dice Golmyck. "Sí, supongo que podrías tener razón. Mientras no conozcamos su propósito exacto, no podemos asumir que su grupo sea el único con el que ha interactuado hasta ahora."

          Hace una pausa.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch07a_no_help
            condition: b2_ch1_interfere = 0
          - set:
              current_scene: b2_ch07a_help
            condition: b2_ch1_interfere = 1
  - name: b2_ch07a_messing
    texts:
      - source: scene_text
        paragraph: 23
        text: |-
          "Parece disfrutar mucho jugando con la cabeza de Daren", digo. "Ya ha dejado bastante claro antes que considera a Daren un idealista y a menudo intenta poner a prueba sus creencias."

          "Pero ¿de verdad bastaría eso para que se molestara en salvarles la vida?" dice Golmyck.

          "No lo sé", digo. "¿Quizá?... Gran parte del comportamiento de Eiden no ha tenido mucho sentido para nosotros hasta ahora."

          "Ya veo..." dice Golmyck. "Bueno, supongo que puede ser un poco difícil averiguar las verdaderas intenciones de una persona a la que conocieron hace apenas una semana, tras solo unas cuantas interacciones con ella. Quizá con el tiempo averigüen más."

          Hace una pausa.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch07a_no_help
            condition: b2_ch1_interfere = 0
          - set:
              current_scene: b2_ch07a_help
            condition: b2_ch1_interfere = 1
  - name: b2_ch07a_half
    texts:
      - source: scene_text
        paragraph: 24
        text: |-
          "Por lo que entiendo, puede que sea porque soy medio lessathi."

          "Los medios lessathi son ciertamente algo raro hoy en día", dice Golmyck, "pero ¿por qué crees que eso bastaría para que te eligiera a ti por encima de todos los demás magos muy poderosos que se unieron a este torneo?"

          "Bueno", digo, "una vez dijo que le gustaba la diversidad de nuestro grupo... Quizá no se trate solo de mí, sino también de que todos los demás somos casos bastante únicos que no se encuentran en ninguna otra parte."

          "Cuando lo pones así, supongo que podrías tener razón", dice Golmyck. "Después de todo, no todos los días se encuentra uno con un grupo que incluye a un mago artificial, a una chica fusionada con una banshee y a un gigante disfrazado de enano. En cualquier caso, a menos que Eiden decida de verdad contarles sus motivos, probablemente no van a tener mucha información en la que basar sus suposiciones, teniendo en cuenta lo poco que han interactuado con él hasta ahora."

          Hace una pausa.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch07a_no_help
            condition: b2_ch1_interfere = 0
          - set:
              current_scene: b2_ch07a_help
            condition: b2_ch1_interfere = 1
  - name: b2_ch07a_no_help
    routes:
      - condition: ch11_saved_rose = 0 AND b2_ch2_deal = 3
        texts:
          - source: scene_text
            paragraph: 25
            text: |-
              "Muy bien, entonces", dice Golmyck. "Déjenme terminar de sellar estos documentos y podrán marcharse."

              Luego sella dos documentos más y nos los entrega para que cada uno pueda echarles un vistazo.

              "Aquí tienen", dice el rey. "Estos papeles deberían bastar para absolverlos de sus crímenes, sin importar adónde vayan en Varathia. Ahora, si no necesitan nada más de mí, reanudaré mi trabajo en el dispositivo lessathi que debía enviarles telepáticamente las instrucciones relacionadas con los objetivos del torneo. Llevo más de una semana intentando repararlo, pero todavía no consigo averiguar qué tiene de malo, así que pueden imaginarse lo frustrante que ha sido esto para mí."

              El rey nos desea entonces un buen viaje a todos y regresamos a la sala del trono, donde el sirviente del rey nos estaba esperando.

              Después de acompañarnos afuera, tardamos alrededor de una hora y media en llegar a la mansión, donde Enrique seguía ocupado preparando nuestro banquete. De camino hasta aquí, me aseguré de deshacerme del dispositivo que me dio el lessathi de la arena, ya que nunca llegó a decirme qué debía hacer con él después de salir de la sala del trono y no quería arriesgarme a llevarlo conmigo más tiempo del necesario por si tenían alguna forma de rastrearlo a distancia. Seguro que podrán encontrarlo y recuperarlo sin mi ayuda.
          - source: scene_text_2
            paragraph: 14
            text: |-
              Dado que aún faltaba bastante para que terminara de cocinarse la comida, Hadrik sacó una baraja de cartas de la mochila y todos nos sentamos en una de las mesas de picnic del patio de la mansión para jugar a un juego que Hadrik aprendió durante el tiempo que pasó en tabernas enanas. Al parecer, una de las reglas originales del juego era que un jugador debía dar un sorbo de ale enana cada vez que perdía una mano, pero decidimos descartar esa regla porque no queríamos emborracharnos antes de que el festín siquiera empezara.

              El juego requería mucho faroleo, así que no sorprendió que Leila acabara imponiéndose, dado que podía leer auras para saber si alguien estaba mintiendo. Como yo era la persona a la que más fácil le resultaba leer debido a mi aura 'espinosa', terminé cansándome de perder todas y cada una de las partidas y decidí hacer una pausa para leer más mi cuaderno, con la esperanza de encontrar más vacíos legales que Eiden pudiera estar utilizando.

              "Oye, Daren", digo después de revisar el cuaderno durante un rato. "¿Recuerdas aquella vez en la que Eiden los paralizó a todos? Justo antes de teletransportarnos delante de Thilias."

              "¿Qué?..." dice Daren, mientras intenta concentrarse en sus cartas al tiempo que me escucha. "Ah, sí, lo recuerdo. ¿Qué pasa con eso?"

              "¿Cuántos hechizos tienes que te protejan contra la parálisis?" digo.

              "Solo uno", dice Daren. "Y el escudo no protege contra la parálisis, ¡así que no es sobrecarga de protecciones!"
          - source: scene_3
            paragraph: 2
            text: |-
              "Vale, vale", digo. "¿Alguien más está usando protección contra la parálisis?"

              "Sí", dice Kate. "Yo uso el hechizo descrito en el último libro de 'Teoría avanzada de la magia' de Azarius."

              "De acuerdo", digo. "¿Y tú, Daren? ¿Qué protección estás usando?"

              "La dorada", dice Daren. "La que hace un efecto giratorio con chispas cuando la lanzas."
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch07a_no_help2
      - condition: ch11_saved_rose = 1 AND b2_ch2_deal = 3
