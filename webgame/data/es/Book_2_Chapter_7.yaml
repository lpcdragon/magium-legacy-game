  - name: b2_ch07a_winter
    texts:
      - source: scene_text
        paragraph: 65
        text: |-
          "¡Eh, acabo de acordarme de algo!" digo. "Eiden me pidió que les diera un mensaje. Dijo que debían recordar el invierno inmóvil."

          "¿Qué has... dicho?" dice el lessathi de las guadañas, soltando la cabeza de Leila y mirándome con una mezcla de shock y miedo en los ojos.

          "No lo escuches", dice el lessathi de voz suave. "Está intentando provocarte para que hagas alguna estupidez."

          "¿Entonces me estás diciendo que me calle y deje que el lacayo de Eiden me provoque?" dice furioso el lessathi de las guadañas. "¿Eso es?"

          "Lo que digo es que deberías mantener la calma y actuar con racionalidad ante..."

          "¡Ahora!" veo el mensaje de Leila flotando delante de mis ojos y me pongo en pie de inmediato, asegurándome de quedar justo fuera del alcance del hechizo que me tenía paralizado, con la daga apuntando a la garganta del lessathi que tengo delante.
      - source: scene_text_2
        paragraph: 35
        text: |-
          El lessathi de voz suave no me estaba mirando y mi ataque lo toma completamente por sorpresa. Intenta echarse hacia atrás de un salto, pero es demasiado tarde y consigo cortarle el cuello de un solo movimiento. Exactamente al mismo tiempo, Leila también salta sobre el lessathi de las guadañas y le hunde un cuchillo en el corazón antes de que tenga tiempo de reaccionar.

          Apenas un segundo después, antes incluso de que los otros dos lessathi lleguen a entender qué está ocurriendo, Kate salta hacia atrás, saliendo del alcance de la trampa, y extiende el brazo, apuntando con la palma hacia uno de los lessathi, el que empuña un arma parecida a un tridente. Entonces sale disparado un cono de hielo desde su palma y atraviesa al lessathi directamente en la cabeza. Daren, Hadrik y Flower, sin embargo, siguen tendidos en el suelo, paralizados, lo que significa que debieron de fallar el momento.
    effects:
      - set:
          ac_b2_ch7_delivered: 1
        achievement:
          id: ac_b2_ch7_delivered
          title: Mensaje entregado
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch07a_blinded
  - name: b2_ch07a_blinded
    texts:
      - source: scene_text
        paragraph: 66
        text: |-
          De repente, el último lessathi que queda en pie alza en el aire el escudo con incrustaciones de esmeralda que tenía en la mano y un potente destello de luz llena la sala, cegándonos a todos durante unos segundos. Cuando mis ojos vuelven a adaptarse, veo que mientras estábamos cegados ha habido un forcejeo entre Leila y el lessathi, lo que ha hecho que ambos suelten sus armas. Leila está en el suelo, con la espalda apoyada contra la pared, y el lessathi se agacha ahora para recoger uno de sus cuchillos, con la intención de rematarla.

          "¡Ayúdame, Barry!" aparece un gran texto azul frente a mí, mientras Leila mira al lessathi con terror en los ojos.
    choices:
      - position: 1
        text: Matar al lessathi.
        effects:
          - set:
              current_scene: b2_ch07a_kill
      - position: 2
        text: Dejar que se las arregle sola.
        effects:
          - set:
              current_scene: b2_ch07a_handle
  - name: b2_ch07a_kill
    texts:
      - source: scene_text
        paragraph: 67
        text: |-
          Corro hacia el lessathi todo lo rápido que puedo, sujetando la daga con las dos manos, y en cuanto lo alcanzo le clavo la hoja en el corazón por la espalda. Sin embargo, en cuanto retiro la daga, ocurre algo completamente inesperado. La figura del lessathi se desvanece lentamente en el aire y es reemplazada por la de Leila. Al mismo tiempo, la Leila que estaba en el suelo hace apenas un segundo se transforma en el lessathi, que ahora me mira con una sonrisa maliciosa.

          ¿Una ilusión?... No... ¡No, no, no! ¡No puede ser!

          Giro a Leila y veo que tiene los ojos cerrados y que ya no respira, mientras la mancha de sangre de su blusa sigue extendiéndose. Kate me mira ahora con incredulidad en los ojos y parece completamente paralizada, a pesar de estar muy lejos del alcance de la trampa. Aprovechando mi distracción, el lessathi recoge rápidamente del suelo uno de los cuchillos de Leila y me corta el cuello de par en par, haciendo que muera en los siguientes segundos.
    choices:
      - position: 1
        text: Reiniciar juego
        effects:
          - set:
              current_scene: ch1_intro1
              storyboard_controls: Jump to frame "Chapter 1"
      - position: 2
