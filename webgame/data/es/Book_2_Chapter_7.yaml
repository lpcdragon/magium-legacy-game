              b2_ch7_rock: 0
  - name: b2_ch07a_suspect
    texts:
      - source: scene_text
        paragraph: 39
        text: |-
          "Creo que te estás preocupando por nada."

          "Sí, Daren", dice Hadrik. "No es como si tuvieran algún motivo para sospechar que vamos hacia allí. Además, si pasa algo, siempre pueden usar sus elegantes armas mágicas para defenderse, así que no es que unos cuantos guardias extra fueran a ayudarlos demasiado."

          "Supongo que tienes razón..." dice Daren.

          "Vamos", dice Hadrik. "Llegaremos en un minuto o dos. Puede que tengan algunos guardias apostados delante de la sala de reuniones y eso calme tus preocupaciones."
