              - set:
                  current_scene: b2_ch07a_no_help2
  - name: b2_ch07a_no_help2
    routes:
      - condition: ch11_saved_rose = 0
        texts:
          - source: scene_text
            paragraph: 29
            text: |-
              "Eh...", digo. "Vale... O sea, te refieres a la versión avanzada del grimorio estándar de mago blanco. Y Hadrik, supongo que tú cuentas con la resistencia parcial que te da el hecho de ser un gigante para defenderte de ese tipo de hechizos, ¿no?"

              "Sí", dice Hadrik. "Pero me quedé completamente paralizado, igual que Kate y Daren, a pesar de mi resistencia."

              "Ajá", digo. "Bueno, ¿saben qué tienen en común esas tres defensas suyas?"

              "¿Qué?" dice Daren.

              "Absolutamente nada", digo mientras cierro mi cuaderno. "Lo que significa que esta vez Eiden no estaba utilizando un vacío legal. De hecho, ni siquiera creo que estuviera usando parálisis. Debió de estar usando un tipo de hechizo completamente distinto que produce el mismo efecto. ¿Recuerdan aquella vez en la que la amiga de Kate nos dejó a todos inconscientes en el suelo? No usó un hechizo de sueño para hacerlo. Usó electricidad. Sospecho que Eiden utilizó un método parecido para paralizarlos temporalmente. ¿No sintieron todos una descarga justo antes de caer al suelo? Estoy bastante seguro de que también debieron sentir unas cuantas descargas más después, pensadas para mantenerlos paralizados durante más tiempo."

              "Ahora que lo dices, ¡sí!" dice Daren. "Sí que sentí algunas descargas eléctricas. Pero no se sentían muy distintas de lo que se siente con una parálisis normal, así que en ese momento no noté realmente la diferencia. Pero ¿esto significa que Eiden puede usar la electricidad como elemento, igual que la amiga de Kate?"
          - source: scene_text_2
            paragraph: 15
            text: |-
              "Lo dudo", digo. "El hechizo que utilizó parecía tener ciertas reglas y limitaciones, lo cual no sería el caso si pudiera usar la electricidad libremente como elemento. El hechizo eléctrico que usó para paralizarlos me pareció extremadamente parecido a un hechizo al que tuve acceso cuando tenía mi dispositivo de estadísticas potenciado, así que probablemente sea el mismo. No recuerdo hasta el último detalle, pero era uno de esos hechizos que solo puedes lanzar una vez al día, y sé con seguridad que una de las mayores desventajas del hechizo era que el área de efecto era extremadamente pequeña. Quiero decir, prácticamente bastaba con rodar hacia un lado y las corrientes eléctricas siguientes dejarían de apuntarte. La única razón por la que funcionó contra ustedes fue que los tres estaban muy juntos y que no sabían contra qué tipo de hechizo se enfrentaban. Si hubieran sabido cómo funcionaba, podrían haberse apartado justo en el instante preciso antes de que los golpeara una nueva corriente eléctrica, ya que el efecto de la parálisis se atenúa un poco justo antes de cada nueva descarga."

              "Sí, la verdad dudo mucho que yo hubiera podido hacer eso", dice Daren, "porque estuve intentando liberarme del efecto del hechizo todo el tiempo, y no funcionó."
          - source: scene_3
            paragraph: 3
            text: |-
              "¡Eso es porque el hechizo te da descargas a intervalos más cortos si ve que estás intentando liberarte!" digo. "Así no funciona. Tienes que estar relajado y tratar de escapar solo en el último segundo. Claro, no puedes saber cada cuánto va a darte una descarga hasta que te dejes electrocutar unas cuantas veces mientras cuentas los segundos de cada intervalo. Los intervalos no siempre tendrán la misma duración, pero normalmente habrá un patrón que podrás averiguar. Una vez estés seguro de que llevas bien la cuenta, esperas al último momento y solo entonces intentas escapar. Evidentemente, la forma más fácil de esquivar esto sería usar protección contra la electricidad, pero con la cantidad de energía que hace falta para mantener esa protección activa, tendrías que estar loco para usarla todo el tiempo por la remota posibilidad de que te atacaran con un hechizo eléctrico distinto de los normales."

              "Eh", dice Hadrik, "no es que quiera interrumpirte ni nada, pero deberíamos darnos prisa si queremos terminar la partida antes de que Enrique termine de preparar el banquete. Probablemente solo nos queden unos veinte minutos antes de que la comida esté lista y, salvo Leila, todos seguimos teniendo al menos cinco cartas en la mano."
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch07a_mansion2
