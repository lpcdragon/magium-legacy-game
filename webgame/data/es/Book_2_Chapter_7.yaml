        effects:
          - set:
              current_scene: b2_ch07a_overload
  - name: b2_ch07a_related
    texts:
      - source: scene_text
        paragraph: 6
        text: |-
          "No creo que esté relacionado. Probablemente nació así."

          "Sí", dice Daren. "Estoy totalmente a favor de echarle la culpa a alguna entidad incorpórea y difusa que ni siquiera he conocido, pero, siendo realistas, Barry probablemente tenga razón. Hace mucho que me acostumbré a la idea de que nunca podré lanzar una protección decente contra el daño físico, así que ya no me molesta tanto como antes."

          "Tu armadura seguramente sea mejor que un hechizo de escudo en la mayoría de los casos, de todos modos", digo. "No te va drenando la energía y no tienes que preocuparte de que entre en conflicto con todas tus otras... Espera un momento... ¿Has dado a entender antes que ahora mismo estás usando de verdad un hechizo de escudo?"

