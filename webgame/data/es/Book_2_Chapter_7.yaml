        texts:
          - source: scene_text
            paragraph: 50
            text: |-
              Recorremos el túnel secreto sin encontrar ninguna forma de resistencia. Cuando llegamos al final, Hadrik nos echa un rápido vistazo al resto y luego atraviesa la pared de un puñetazo, despejándonos el paso al corredor de seredium. Al mirar a nuestro alrededor, vemos que este túnel está tan vacío como los demás.

              "Arraka", dice Illuna, "¿percibes guardias?"

              "No", dice Arraka. "Está vacío. Tampoco hay trampas mágicas. De trampas normales no sé nada, eso sí."

              "Bueno, las trampas normales suelen activarse al pisar el suelo", dice Hadrik, "así que me aseguraré de ir tirando piedras delante de nosotros con regularidad, a ver si algo explota. Yo soy el que tiene aquí la dura piel de gigante, así que iré delante. Si se activa algo, debería poder aguantarlo."

              "Recuerden ocultar sus auras todo lo que puedan", nos dice Daren mientras avanzamos por el corredor. "No querríamos que los lessathi nos detectaran antes de llegar hasta ellos."
          - source: scene_text_2
            paragraph: 30
            text: |-
              Nos lleva aproximadamente otro minuto llegar por fin a nuestro destino. El pasadizo en el que estamos ahora y el pasadizo del que salimos parecen reunirse ambos en este punto, y conducen a un pasillo mucho más estrecho al final del cual hay una puerta. Al otro lado de la puerta, los lessathi siguen celebrando su reunión y no parecen haberse dado cuenta de nuestra presencia.

              "¡Barry!" susurra Daren. "¡Por aquí!"

              Me reúno con Daren y los demás en el pasillo estrecho y nos preparamos para irrumpir en la sala de reuniones a su señal.
