  - name: b2_ch07a_welcome
    routes:
      - condition: ancient_languages < 3
        texts:
          - source: scene_text
            paragraph: 52
            text: |-
              Justo cuando nos preparamos para lanzarnos hacia su cuartel general, de repente siento una descarga eléctrica recorriéndome todo el cuerpo y caigo al suelo, incapaz de moverme. Al parecer lo mismo les ha ocurrido a todos mis amigos, porque ahora ellos también yacen en el suelo a mi lado.

              Este hechizo... ¿Puede ser?...

              Mientras todos yacemos en el suelo, incapaces de liberarnos de los efectos del hechizo, la puerta frente a nosotros se abre y los cuatro lessathi que estaban participando en la reunión avanzan ahora lentamente hacia nosotros. Todos llevan sus características túnicas azul oscuro, con las capuchas puestas, y cada uno parece portar un tipo distinto de arma.

              "Bienvenidos, amigos", dice en la Lengua Común el lessathi de voz suave que vino a visitarme a mi celda bajo la arena. "Creo que ya he tenido el placer de conocer a algunos de ustedes, pero puede que los demás no sepan quién soy. No importa, porque nosotros seremos quienes hagan las preguntas y ustedes quienes den las respuestas. ¿Me he explicado con claridad?"
          - source: scene_text_2
            paragraph: 32
            text: |-
              Uno de los otros lessathi le dice algo al lessathi de antes. Sin embargo, está hablando en lengua lessathi, así que no entiendo ni una palabra de lo que está diciendo.

              "¿Dónde quedaron tus modales?" dice el lessathi de voz suave en la Lengua Común. "¡Estos son nuestros invitados! Todos deberíamos hablar en la Lengua Común para que puedan entendernos."

              El lessathi de antes vuelve a hablar, pero ignora la petición del otro y sigue usando la lengua lessathi.

              "Bueno, da igual si quieres hablar en la Lengua Común o no", dice el lessathi de voz suave. "De todos modos no necesitamos a más de una persona para interrogarlos."
        effects:
          - set:
              failed_checks:
                - '[ Comprobación de lenguas antiguas fallida - nivel 3 ]'
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch07a_narrow
      - condition: ancient_languages >= 3
        texts:
          - source: scene_text
            paragraph: 51
            text: "Just as we prepare to charge into their headquarters, I suddenly feel an electric shock all throughout my body, and I fall to the ground, unable to move. The same thing apparently happened to all of my friends, because they're now also lying on the ground beside me.\r\n\r\nThis spell... Could it be?...\r\n\r\nAs we all lie on the ground, unable to break free from the spell's effects, the door in front of us opens, and the four lessathi that were participating in the meeting are now slowly advancing towards us. They are all wearing their signature dark blue robes, with their hoods up, and each of them seems to be carrying a different type of weapon.\r\n\r\n\"Welcome, friends,\" says the soft-spoken lessathi who came to visit me in my cell below the arena, in the Common language. \"I believe I've already had the pleasure of meeting some of you, but the others may not know who I am. It doesn't matter, because we will be the ones asking the questions, and you will be the ones answering. Do I make myself clear?\""
          - source: scene_text_2
            paragraph: 31
            text: |-
              "No pueden responderte, idiota", dice otro lessathi en lengua lessathi. "Este hechizo los paraliza por completo. No pueden hablar."

              "¿Dónde quedaron tus modales?" dice el lessathi de voz suave en la Lengua Común. "¡Estos son nuestros invitados! Todos deberíamos hablar en la Lengua Común para que puedan entendernos."

              "¿Se supone que esto tiene que hacer gracia?" dice el lessathi de antes, todavía en lengua lessathi. "Siempre has tenido un pésimo sentido del humor."

              "Bueno, da igual si quieres hablar en la Lengua Común o no", dice el lessathi de voz suave. "De todos modos no necesitamos a más de una persona para interrogarlos."
        effects:
