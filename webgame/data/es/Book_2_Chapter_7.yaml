  - name: b2_ch07a_intro2
    texts:
      - source: scene_text
        paragraph: 3
        text: |-
          "¿No fuiste tú quien me contó su mayor debilidad a los pocos minutos de conocernos?" le pregunto, enarcando una ceja.

          "Sí, ¡pero eso es distinto!" dice Daren. "¡Cualquiera podía darse cuenta de que mi hechizo de escudo era débil contra las armas encantadas después de verme pelear un rato!"

          "Espera, ¿eras débil contra las armas encantadas?" dice Hadrik.

          "Uf..." dice Daren.

          "No, lo digo en serio", dice Hadrik. "Nunca me había dado cuenta. Pero, ¿por qué las armas encantadas, exactamente? ¿No debería el hechizo de escudo defenderte automáticamente de la mayoría de los tipos de daño? ¿Qué pasa, estás maldito o algo? Y además, ¿por qué iba siquiera a importar? El hechizo de escudo es solo un hechizo que enseñan a los magos principiantes. Nadie lo usa de verdad en combate. Consume demasiada energía y, la mayor parte del tiempo, apenas absorbe daño suficiente como para evitar que te mueras. Las protecciones contra tipos específicos de daño deberían ser mucho más eficaces. No es que yo me molestara mucho en aprender ninguna de esas, con mi durísima piel de gigante y todo eso."
      - source: scene_text_2
        paragraph: 3
        text: |-
          "Los magos blancos tienen versiones avanzadas del hechizo de escudo", dice Daren. "Son bastante más rentables en cuanto a energía. Y no es que sea débil específicamente contra las armas encantadas. Soy vulnerable a todo tipo de daño físico. ¿Recuerdas aquella vez en la que el capitán del fuerte ogro me golpeó con una maza y me estampó contra una pared? He probado muchas clases de hechizos de protección contra el daño físico, pero ninguno parece funcionar conmigo. El único que más o menos funciona es el hechizo de escudo, pero apenas sirve contra armas normales, como para servir contra armas encantadas. Encantar mi armadura para que fuera lo más resistente posible fue la única forma que encontré de darme cierta protección contra este tipo de ataques."

          "Ajá", dice Hadrik. "Eso es raro. ¿Crees que podría tener algo que ver con el espíritu del plano mágico con el que Arraka dijo que estás vinculado? Como que, no sé, ¿el espíritu es alérgico a la materia terrestre o algo así? Barry, ¿tú qué piensas?"
    choices:
      - position: 1
        text: Yo diría que desde luego es una posibilidad.
        effects:
          - set:
              current_scene: b2_ch07a_possibility
      - position: 2
        text: Me inclino más a pensar que se vinculó mal con el espíritu.
        effects:
          - set:
              current_scene: b2_ch07a_incorrectly
      - position: 3
        text: No creo que esté relacionado. Probablemente nació así.
        effects:
          - set:
              current_scene: b2_ch07a_related
  - name: b2_ch07a_possibility
    texts:
      - source: scene_text
        paragraph: 4
        text: |-
          "Yo diría que desde luego es una posibilidad."

          "Bueno", dice Daren, "si alguna vez resulta que pasé por todas estas molestias solo por las alergias de un espíritu, sé que me voy a enfadar muchísimo. Probablemente sea mejor no saberlo."

          "Tu armadura seguramente sea mejor que un hechizo de escudo en la mayoría de los casos, de todos modos", digo. "No te va drenando la energía y no tienes que preocuparte de que entre en conflicto con todas tus otras... Espera un momento... ¿Has dado a entender antes que ahora mismo estás usando de verdad un hechizo de escudo?"

          "Pues sí", dice Daren. "Es el único hechizo de protección que tengo que me ofrece cierta defensa contra ataques físicos. Sería idiota si no lo usara."

          "¡Entonces por qué no lo escribiste en este papel?!" digo. "¿No te dije que escribieras todos los hechizos de protección que te habías lanzado encima en nuestro segundo día del torneo, sin excepciones?"

          "Ya te dije en nuestro primer día que estaba usando un hechizo de escudo", dice Daren. "Y además, ¿por qué iba a importar? ¿Qué tiene que ver el hechizo de escudo con los conflictos entre hechizos de protección?"
      - source: scene_text_2
        paragraph: 4
        text: |-
          "¡Tiene todo que ver con ellos!" digo. "¿Qué demonios, hombre? ¿No has leído ninguno de los libros de la serie 'Teoría avanzada de la magia', escritos por Azarius?"

          "Oye", dice Daren, "algunos no nos pasamos la vida entera empollando en bibliotecas. Todo lo que he aprendido sobre magia lo he aprendido de mis maestros."

          "Bueno, pues en ese caso, ¡tus maestros son una pandilla de idiotas!" digo.

          "¡Retira eso!" dice Daren. "Mi profesor de magia blanca era un exsabio. ¿Tienes idea de lo difícil que es convertirse en un sabio cuando solo te especializas en magia blanca, sin ningún tipo de entrenamiento de combate?"

          "Por lo visto, no lo bastante", le digo.

          "¡Maldita sea!" dice Daren. "¿No respetas en absoluto el trabajo que hace falta para..."

          "¿Qué pasa aquí?" nos pregunta Kate, mientras ella y Leila se acercan despacio con unas bolsas de compras en las manos. "¿Por qué están discutiendo otra vez?"

          "Barry se niega a reconocer el esfuerzo que hace falta para..." empieza a decir Daren, pero yo lo interrumpo.

          "¡Eso da igual!" digo. "Daren, ¿puedes decirme qué tipo de hechizo de escudo estás usando exactamente? ¿Es el nuevo, el que da ventaja contra ataques físicos?"
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch07a_overload
  - name: b2_ch07a_incorrectly
    texts:
      - source: scene_text
        paragraph: 5
        text: |-
          "Me inclino más a pensar que se vinculó mal con el espíritu."

          "Sí", dice Daren. "Muy fácil decirlo para ti. No eres mago. Y la única manera en que has lanzado magia hasta ahora ha sido a través de esa baratija tuya. Incluso después de oír la explicación de Arraka, sigo sin tener ni idea de cómo ver esta conexión entre mi espíritu y yo. He probado todas las formas que se me han ocurrido para analizar mi aura mágica en busca de rastros de un vínculo con el plano mágico, pero ni siquiera sé qué se supone que tengo que buscar."

          "Tu armadura seguramente sea mejor que un hechizo de escudo en la mayoría de los casos, de todos modos", digo. "No te va drenando la energía y no tienes que preocuparte de que entre en conflicto con todas tus otras... Espera un momento... ¿Has dado a entender antes que ahora mismo estás usando de verdad un hechizo de escudo?"

