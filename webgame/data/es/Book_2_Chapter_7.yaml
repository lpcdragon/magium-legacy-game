            effects:
              - set:
                  current_scene: b2_ch07a_narrow
  - name: b2_ch07a_narrow
    routes:
      - condition: b2_ch7_rock = 0
        texts:
          - source: scene_text
            paragraph: 53
            text: |-
              "¡Les dije que esto iba a pasar!" dice otro lessathi, también en la Lengua Común. "Ese sirviente idiota del rey nunca fue del tipo que se da cuenta de cuándo lo están siguiendo."

              "En efecto", dice el lessathi de voz suave. "Tu idea de filtrar al sirviente del rey la hora y el lugar de nuestra reunión definitivamente valió la pena. Sin embargo, lo que no entiendo es cómo lograron evitar la trampa explosiva. Habría esperado que tomaran la misma ruta hacia nuestro cuartel general que suele tomar el sirviente del rey cuando viene aquí. ¿Suponen que el rey tiene realmente un mapa de los túneles subterráneos?"

              "En realidad no importa", dice el lessathi de antes. "Lo que importa ahora es que obtengamos de ellos toda la información posible. No sirve de nada intentar interrogar a los que no pueden hablar debido a la parálisis. Solo los dos lessathi deberían poder hablar ahora mismo. Averiguaremos rápido lo que necesitamos saber y luego nos desharemos de ellos."
          - source: scene_text_2
            paragraph: 33
            text: |-
              Estos bastardos engreídos. Están usando el hechizo de parálisis de Eiden. Estoy seguro. Este pasillo estrecho es el lugar perfecto para montar una trampa así. Y las descargas periódicas que estoy recibiendo son sin duda de naturaleza eléctrica. Debido a la resistencia parcial a la electricidad que tengo por ser lessathi, no debería resultarme demasiado difícil encontrar la ventana de tiempo adecuada para salir de un salto del área de efecto del hechizo, y estoy bastante seguro de que Leila está en la misma situación que yo. Los demás podrían tardar un poco más en acertar con el momento, ya que las ventanas que tendrán serán extremadamente cortas.

              Mientras sigo tendido en el suelo, aparece justo delante de mis ojos un mensaje muy pequeño, apenas perceptible y semitransparente, escrito en texto azul.

              "Todavía no te liberes", dice el texto de Leila. "Espera a que los demás se acostumbren a las descargas. También estoy enviando este mensaje a todos los demás. Yo daré la señal, para que nos liberemos todos juntos, exactamente en el mismo momento."
