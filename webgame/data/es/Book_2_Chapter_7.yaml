                  current_scene: b2_ch07a_secret
                  b2_ch7_rock: 1
                condition: is_dead = 0
          - position: 2
            text: Desde luego es lo bastante fiable como para no querer arriesgar mi vida ignorándolo.
            effects:
              - set:
                  current_scene: b2_ch07a_secret
                  b2_ch7_rock: 0
                condition: is_dead = 0
  - name: b2_ch07a_secret
    routes:
      - condition: b2_ch7_tunnel = 0 AND b2_ch7_rock = 1
        texts:
          - source: scene_text
            paragraph: 43
            text: |-
              "Entonces, ¿por qué no tiras una piedra y compruebas tú mismo si explota?"

              "¡No me importaría hacerlo!" dice Hadrik, recogiendo una piedra del suelo que luego lanza más adelante por el pasadizo.

              En cuanto la piedra golpea el suelo, una gran explosión cubre la zona a su alrededor, haciendo que todo el techo sobre ella se venga abajo y bloquee nuestro camino.

              "Vale", dice Hadrik. "Me has convencido, Barry. Volvamos atrás."

              "Te das cuenta de que no hay manera de que los lessathi no hayan oído esa explosión de antes, ¿verdad?" dice Daren.

              "Aunque la hayan oído, no están reaccionando a ella", digo. "Mira el mapa. Los cuatro lessathi siguen sin moverse de sus posiciones originales. O no pueden oír ningún ruido desde dentro o creen que estamos muertos. Lo que necesitamos ahora es averiguar una forma de rodear este derrumbe. Arraka, ¿no detectarás por casualidad algún otro túnel por aquí que no aparezca en el mapa del rey?"
          - source: scene_text_2
            paragraph: 25
            text: |-
              "¿Eh?" pregunta Arraka. "Ah, pues sí... Un segundo, deja que los añada al holograma."

              Unos segundos después de que termina de hablar, aparecen tres pasadizos azules más en el holograma que flota frente a su amuleto.

              "Oye, mira", digo, "uno de esos pasadizos parece conectar el túnel en el que estamos ahora mismo con uno de los túneles de seredium. Y ese túnel también lleva hacia el cuartel general lessathi."

              "Sí, pero no puedo garantizar que el túnel de seredium siga siendo transitable ahora mismo", dice Arraka. "Como ya dije, solo lo puse ahí porque estaba en el mapa del gnomo. No puedo percibir nada dentro. Podría estar lleno de guardias, por lo que sé."

              "Bueno, es mejor que nada", digo. "¿Qué pared lleva al túnel secreto? ¿Esa?"

              Entonces señalo una zona concreta de la pared a nuestra derecha, mientras espero la respuesta de Arraka.

              "Ajá", dice Arraka.

              "Muy bien", dice Hadrik. "Entonces iré a abrirnos el paso."
          - source: scene_3
            paragraph: 8
            text: |-
              "Sí", dice Daren, mientras Hadrik se dirige hacia la pared que lleva al túnel secreto. "Mientras sepamos qué pared lleva al túnel, encontrar la palanca secreta que lo abre no debería ser tan..."

              Antes de que Daren llegue a terminar la frase, Hadrik alcanza la pared y la atraviesa de un puñetazo, haciendo que se desmorone en pedazos.

              "En serio..." dice Daren, dándose una palmada en la frente. "¿Tienes que hacer esto todas y cada una de las veces?"

              "¡Relájate!" dice Hadrik. "Los lessathi están demasiado lejos como para oír la simple caída de unas cuantas rocas y, si de verdad hay guardias al otro lado, tampoco es que tengamos forma de escabullirnos a su lado. Desde aquí es un camino directo al cuartel general lessathi. No hay otra opción."

              "Bien, sigamos", dice Daren. "Ya veremos qué pasa cuando pase."
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch07a_hearing
