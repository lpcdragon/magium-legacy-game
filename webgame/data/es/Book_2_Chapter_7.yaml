        paragraph: 55
        text: |-
          "¿Dónde demonios escondieron su trampa?" grita Arraka de repente. "¡La estoy buscando desde que salieron por esa puerta y no detecto ningún dispositivo capaz de lanzar este tipo de hechizo!"

          No me queda claro si Arraka vio el mensaje de Leila y ahora intenta ganarnos tiempo o si simplemente está genuinamente frustrada porque su sentido mágico no es lo bastante bueno como para encontrar la trampa por sí sola. Si tuviera que adivinar, diría que probablemente se trata de lo segundo.

          "Bueno, no sería gran cosa como trampa si pudieras detectarla antes de entrar en ella, ¿no?" dice el lessathi de voz suave.

          "Espera, ¿con quién estás hablando?" dice el lessathi que aceptó hablar en la Lengua Común. "¿De dónde ha salido esa voz?"

          "Por supuesto que estoy hablando con la banshee del amuleto", dice el lessathi de voz suave. "Arraka, creo que se llama. Oí que un grupo renegado de lessathi la atrapó ahí hace unos veinte años. En cualquier caso, la banshee no es con quien me interesa hablar."
      - source: scene_text_2
        paragraph: 34
        text: |-
          Entonces se acerca a mí, entrando en el radio del hechizo de descargas eléctricas, pero no parece afectarle. ¿Podría estar usando algún artilugio que le dé protección contra la electricidad?

          "Con este es con quien me interesa hablar", dice el lessathi acercándose más a mí. "Sinceramente no esperaba volver a verte, compañero lessathi. Eres tenaz, eso te lo concedo. Bueno, no importa. Eso no es importante. Lo importante es cómo lograron llegar hasta nuestra ubicación de una pieza. Dime, ¿fue Golmyck quien les dio el mapa de los túneles subterráneos? ¿Cómo pudieron evitar la trampa explosiva?"
    choices:
