    texts:
      - source: scene_text
        paragraph: 47
        text: |-
          "Estoy de acuerdo. ¿Y si ya saben que estaban siguiendo al sirviente del rey?"

          "¿De verdad creen que esto podría ser una trampa?" dice Hadrik.

          "Es posible..." dice Daren. "Quiero decir, el rey ya nos dijo que los lessathi tienen sus propios espías en esta ciudad. También tienen dispositivos de escucha en la sala del trono del rey, así que saben que ya hemos entrado dos veces en la habitación secreta de Golmyck. Aunque no sepan nada de la trampilla secreta, tendrían que ser bastante descuidados para dejarse completamente indefensos durante esta reunión."

          "Mientras el otro pasadizo lleve adonde queremos ir, no tengo problema con cambiar de ruta", dice Kate.

          "Bueno, si nadie más está en contra de la idea, supongo que iré a abrirnos el paso", dice Hadrik.

          "Sí", dice Daren, mientras Hadrik se dirige hacia la pared que lleva al túnel secreto. "Mientras sepamos qué pared lleva al túnel, encontrar la palanca secreta que lo abre no debería ser tan..."
      - source: scene_text_2
        paragraph: 26
        text: |-
          Antes de que Daren llegue a terminar la frase, Hadrik alcanza la pared y la atraviesa de un puñetazo, haciendo que se desmorone en pedazos.

          "En serio..." dice Daren, dándose una palmada en la frente. "¿Tienes que hacer esto todas y cada una de las veces?"

          "¡Relájate!" dice Hadrik. "Los lessathi están demasiado lejos para oírnos y, si de verdad hay guardias al otro lado, tampoco es que tengamos forma de escabullirnos a su lado. Desde aquí es un camino directo al cuartel general lessathi. No hay otra opción."

          "Bien, sigamos", dice Daren. "Ya veremos bastante pronto si elegir este camino fue un error o no."
