  - name: b2_ch07a_intervene
    texts:
      - source: scene_text
        paragraph: 18
        text: |-
          "Un momento", dice Golmyck, mientras aprieta un último tornillo en la base de su trono.

          Luego se levanta del suelo y nos dedica una rápida mirada a cada uno.

          "Veo que la joven lessathi ha decidido unirse a su grupo", dice Golmyck, y luego se vuelve hacia Leila. "Lamento muchísimo lo de tu padre. Era un inventor respetable y no merecía el destino que le tocó. Por desgracia, no había forma de que yo interviniera en su juicio, aunque sospechara que las pruebas habían sido falsificadas. Para lo que sirva, me aseguré de cancelar su búsqueda en cuanto escapó de la ciudad, así que al menos no tendrá que cuidarse las espaldas de camino a Ollendor."

          "...Gracias", escribe Leila, sin saber muy bien qué más decir.

          "Han venido por los documentos, ¿verdad?" dice Golmyck, volviéndose ahora hacia nosotros. "Síganme a mi habitación privada. Allí les pondré el sello a los papeles."
      - source: scene_text_2
        paragraph: 12
        text: |-
          Va hacia la palanca que hay detrás del trono y tira de ella, y el camino hacia su habitación secreta subterránea se abre una vez más, igual que la última vez que visitamos el castillo.

          "Barry, como de costumbre, dejo la sala del trono a tu cargo hasta mi regreso", dice Golmyck.

          "Sí, su majestad", dice el sirviente del rey.

          "¿Barry?" escribe Leila, muy confundida.

          "Sí, así se llama el sirviente del rey", dice Hadrik mientras bajamos por las escaleras hacia la habitación secreta. "¿No es graciosísimo? Nos pasamos horas bromeando con eso la última vez que vinimos aquí."

          "Ya veo..." escribe Leila.

          Cuando llegamos a la cámara subterránea, el rey extiende varios papeles sobre su escritorio y empieza a sellarlos uno por uno.
