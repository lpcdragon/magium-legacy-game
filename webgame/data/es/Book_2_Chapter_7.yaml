  - name: b2_ch07a_bow
    texts:
      - source: scene_text
        paragraph: 14
        text: |-
          Inclino la cabeza y le pido ayuda a Daren otra vez, con un tono más serio.

          "Por favor, Daren", digo. "¿Me ayudarás?"

          "Eh, eh, eh..." dice Daren. "¡Estaba bromeando, Barry! Era una broma. Pensé que a estas alturas ya estarías familiarizado con mi sentido del humor. Escucha, si de verdad es tan importante para ti salvar las ciudades de Varathia, ya veremos qué podemos hacer."

          "En cualquier caso", dice Kate, "no deberíamos confiar demasiado en la promesa de Eiden de darle poderes a Barry si cumple con su tarea. Los términos de su acuerdo son demasiado vagos, y Eiden podría cambiar de opinión en cualquier momento."

          "Estoy de acuerdo", dice Daren. "Sin embargo, dada la información tan difusa que tenemos sobre esta supuesta calamidad, la única forma de estar seguros de que no ocurra es encargándonos tanto de Eiden como del dragón, y eso... desde luego no va a ser una tarea fácil."

          "No te preocupes", digo. "Ahora ya sé qué tipo de trucos está usando Eiden. Estoy seguro de que los tendré todos resueltos en muy poco tiempo. ¡No he estado estudiando magia toda mi vida para nada!"
      - source: scene_text_2
        paragraph: 11
        text: |-
          "¡Ja!" dice Arraka. "Eso sí que me encantaría verlo: que a Eiden lo derroten con sus propios trucos."

          "No nos apresuremos", dice Daren. "Barry solo ha descubierto dos de sus trucos hasta ahora. Supongo que Eiden conocerá cientos después de su larga vida como stillwater. En fin, yo diría que ya hemos hablado bastante de Eiden. Será mejor que aceleremos el paso. Hemos pasado bastante tiempo en ese mercado, así que más nos vale darnos prisa si no queremos hacer esperar al rey."

          Nos lleva aproximadamente otra hora llegar por fin a la puerta principal del palacio del rey. El sirviente del rey nos estaba esperando en la entrada y, en cuanto estamos lo bastante cerca para oírlo, nos anuncia que Golmyck nos está esperando dentro. Cuando entramos en la sala del trono, vemos que el gnomo está sentado en el suelo, a cuatro patas, con una llave inglesa en la mano, intentando ajustar la altura de su trono.
