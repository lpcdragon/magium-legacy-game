  - name: b2_ch07a_clashing
    texts:
      - source: scene_text
        paragraph: 12
        text: |-
          "¿Eiden dijo que te daría el poder para detener la calamidad que amenaza con destruir las ciudades?..." dice Daren. "Eso no tiene sentido. ¿No nos dijo que él mismo destruiría las ciudades?"

          "Eso no fue lo que dijo", respondo. "Sus palabras exactas fueron que la calamidad ocurriría como resultado directo de sus propias acciones."

          "Pero eso viene a ser lo mismo, ¿no?" dice Hadrik.

          "No exactamente", digo. "Por cómo lo dijo, no parecía que destruir las ciudades fuera su propósito principal. Más bien un efecto secundario de lo que sea que esté planeando hacer. Pongamos, por ejemplo, que Eiden sabe con certeza que se verá obligado a pelear personalmente contra Tyrath antes del final de este torneo. Si hay que creerle al dragón, una pelea así arrasaría por completo el continente, lo que muy probablemente borraría del mapa todas las ciudades de Varathia."

          "Maldición", dice Daren. "Puede que tengas razón. Con el dragón declarándoles la guerra a todas las ciudades y Eiden anunciando su regreso como el 'Creador', no me sorprendería nada que los dos líderes de los ejércitos acabaran chocando antes del final del torneo."
      - source: scene_text_2
        paragraph: 9
        text: |-
          "Y eso no es todo", digo. "Eiden nos dijo expresamente que esta calamidad solo ocurriría 'poco' antes del final del torneo. Eso significa que espera que el torneo desempeñe algún papel a la hora de desencadenar esta calamidad."

          "¿Quizá el dragón estará esperando a que muera la mayoría de los participantes del torneo antes de iniciar su ataque?" dice Hadrik.

          "Desde luego es posible", digo. "Supongo que las ciudades de Varathia ya tendrán sus propias defensas contra los ejércitos de Tyrath, y además él tiene que preocuparse por los animales. Sería muy mala idea desatar sus ejércitos ahora, cuando hay magos recorriendo el continente capaces de masacrar a cientos de monstruos sin demasiado esfuerzo."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch07a_defeatist
  - name: b2_ch07a_defeatist
    texts:
      - source: scene_text
        paragraph: 13
        text: |-
          "Deberíamos avisar al rey de esto", dice Daren. "Puede que quiera hacer algunos preparativos por si estos acontecimientos realmente llegan a suceder."

          "Sí", digo. "Aunque no estoy seguro de que pudiera hacer nada para proteger esta ciudad aunque supiera todo esto de antemano. Unas cuantas máquinas voladoras y unos pocos magos no van a servir de mucho para detener una pelea entre un stillwater y un dragón."

          Suspiro antes de continuar.

          "No sé por qué me da la sensación de que vamos a tener que lidiar con ese dragón de una forma u otra si queremos que quede algún organizador vivo para entregarnos el premio al final del torneo."

          "Uy", dice Daren. "¿Y también vas a derrotar tú solo al dragón, igual que dijiste que salvarías todas las ciudades? Desde luego vas a tener la agenda ocupada, ya te lo digo."
      - source: scene_text_2
        paragraph: 10
        text: |-
          "Cállate", digo. "Sé que no puedo hacerlo yo solo. Solo dije eso en caliente, porque Eiden me estaba poniendo de los nervios con su actitud derrotista. Por suerte, tengo un amigo que es un mago legendario bastante conocido y que quizá pueda echarme una mano si las cosas se ponen muy feas. No puede lanzar un hechizo de escudo en condiciones ni para salvar su propia vida y es malísimo en teoría mágica, pero al menos se le da bastante bien la espada y el escudo."

          "Oye, oye, ¿esa es forma de pedirle un favor a alguien?" dice Daren, sonriendo. "¿Dónde está la reverencia? ¿Dónde está el tono suplicante en tu voz? Recuerda que estás hablando con uno de los héroes más célebres del mundo."
