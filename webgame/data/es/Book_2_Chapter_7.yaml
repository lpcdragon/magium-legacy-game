  - name: b2_ch07a_interested
    texts:
      - source: scene_text
        paragraph: 38
        text: |-
          "Mmm..." dice Daren, mientras todos nos detenemos a mirarlo. "Arraka, aquí es donde dijiste que hay un túnel que no aparecía en el mapa del rey, ¿verdad?"

          "Sí", dice Arraka. "Probablemente haya una palanca o algo oculto dentro de esa pared que abriría la puerta secreta."

          "¿Y estás segura de que este túnel lleva directamente a ese otro de allí que va al cuartel general?" dice Daren.

          "Ya te lo dije", dice Arraka, "no sé adónde lleva este túnel. Puede que lleve a otro túnel o puede que sea un callejón sin salida, por lo que sé. Por no mencionar que, incluso si lleva a un túnel, no hay ninguna garantía de que no esté lleno de guardias, ya que no puedo percibir nada dentro de él."
      - source: scene_text_2
        paragraph: 23
        text: |-
          "Daren, ¿por qué te interesa tanto ese túnel de repente?" dice Hadrik. "¿Por qué no seguimos simplemente por el camino que ya estábamos siguiendo?"

          "No lo sé..." dice Daren. "Es que estos túneles completamente vacíos me están dando mala espina. Entiendo que los lessathi ya pusieran guardias en todas las entradas que conocen, pero no encontrar ninguna clase de resistencia de camino a su cuartel general me parece demasiado... conveniente."
    choices:
      - position: 1
        text: Creo que te estás preocupando por nada.
        effects:
          - set:
              current_scene: b2_ch07a_suspect
      - position: 2
        text: Estoy de acuerdo. ¿Y si ya saben que estaban siguiendo al sirviente del rey?
        effects:
          - set:
