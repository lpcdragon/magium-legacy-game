  - name: b2_ch07a_mansion
    routes:
      - condition: ch11_saved_rose = 0 AND ch11_saved_slave = 3
        texts:
          - source: scene_text
            paragraph: 76
            text: |-
              Cogemos nuestras mochilas, nos despedimos con la mano del rey y subimos las escaleras hasta la sala del trono. El sirviente del rey seguía allí y tenía una mirada bastante inquieta cuando nos vio salir por fin del sótano del rey después de más de dos horas, pero no dijo nada y nos condujo al exterior, igual que la última vez que vinimos al castillo.

              Aproximadamente una hora y media después, por fin llegamos a la mansión, donde Enrique nos esperaba impaciente.

              "¡Por fin!" dice Enrique. "¡Ya empezaba a pensar que quizá no se presentarían!"

              "Sí, perdona por eso", dice Daren. "Nuestra reunión con el rey se alargó un poco más de lo que anticipábamos."

              "Bueno, lo importante es que están aquí", dice Enrique. "La comida ya está hecha. Les diré a los cocineros que la recalienten y empezaremos a comer en breve."

              Unos quince minutos después, Enrique sale de la cocina seguido de cinco cocineros, cada uno cargando platos de comida y trayendo a la mesa una especialidad completamente distinta. No me sorprendería que estos platos supieran incluso mejor que lo que Flower puede conjurar mágicamente, dada su limitada comprensión de las artes culinarias. Cuando los cocineros terminan de colocar todos los platos en una de las mesas de picnic más grandes del patio, los hermanos de Rose se unen a nosotros, y todos nos sentamos a la mesa, preparándonos para el merecido festín.
          - source: scene_text_2
            paragraph: 44
            text: |-
              Pasamos las siguientes horas comiendo, bebiendo y celebrando nuestra tan esperada liberación de la arena.

              La comida que nos prepararon los cocineros resultó estar realmente a la altura de las delicias mágicamente concebidas por Flower, si no incluso por encima. Había tantos platos en aquella mesa de los que nunca había oído hablar que casi parecía que estuviera participando en una especie de banquete real. Al principio, los cocineros permanecieron de pie en fila delante de la mesa, esperando a que les pidiéramos más, pero tras toda una hora de Hadrik insistiendo en que se unieran a nosotros para tomar algo, terminaron cediendo y poco a poco se fueron soltando, a medida que empezaba a hacer efecto la ale enana. Hacia el final de la celebración, Enrique se aseguró de darnos a todos las hierbas especiales de Rose para que al día siguiente pudiéramos empezar con energías renovadas, sin miedo a ninguna resaca.
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch07a_ending
