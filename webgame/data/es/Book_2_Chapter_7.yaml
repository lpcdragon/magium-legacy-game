  - name: b2_ch07a_help
    texts:
      - source: scene_text
        paragraph: 30
        text: |-
          "Bien..." dice Golmyck, adoptando una expresión seria. "Dejando a un lado a Eiden y la calamidad, creo que había un asunto más urgente que acordamos discutir una vez quedaran libres de su encarcelamiento. ¿Estoy en lo cierto al asumir que todos siguen de acuerdo con nuestros planes respecto a los lessathi?"

          "Claro..." digo, lanzando una rápida mirada a los demás para asegurarme de que ninguno haya cambiado de opinión mientras tanto.

          "¿Y su nueva amiga?" dice Golmyck. "¿También se unirá a ustedes?"

          "No le hemos contado nada", dice Kate, "porque dijiste que no debíamos hablar de nada de esto fuera de tu habitación, pero creo que quizá quiera venir con nosotros también, dadas las circunstancias."

          "Ah, sí", dice Golmyck. "Sobre todo teniendo en cuenta que algunos de los lessathi contra los que están a punto de luchar son los mismos que la encarcelaron a ella y los que conspiraron con su casero para vender a su padre como esclavo..."

          "Espera, ¿de qué estás hablando?" escribe Leila. "¿Por qué están luchando contra los lessathi?"

          "Nos han dicho", dice Kate, "que hay un selecto grupo de lessathi que reside en esta ciudad y a quienes los demás reyes de Varathia han encargado mantener a raya al rey gnomo y asegurarse de que no se extralimite. Nuestra intención es librar al rey de este problema."
      - source: scene_text_2
        paragraph: 16
        text: |-
          "¿Quieren matar a todos los lessathi de esta ciudad?" escribe Leila, horrorizada. "¡No pueden! Si matan a uno solo, los otros se enterarán y enviarán aviso a su cuartel general principal. ¡Se convertirán en uno de sus objetivos principales!"

          "Me sorprendería no ser ya uno de los principales objetivos de los lessathi", dice Kate. "Deberían saber perfectamente quién soy."

          "En realidad, los lessathi no tendrán tiempo de ponerse en contacto con su cuartel general principal", dice Golmyck, y todos nos volvemos hacia él. "Cuando acepté su ayuda, fue porque ya tenía una idea de cómo podrían ocuparse de este problema a tiempo, sin que afectara a su calendario del torneo. No habría tenido sentido pedirles ayuda si no hubiera una forma rápida de ocuparse de todos los lessathi al mismo tiempo antes de que tengan ocasión de alertar a sus aliados."

          "¿Qué quieres decir?" dice Hadrik.
      - source: scene_3
        paragraph: 5
        text: '"Los lessathi van a celebrar una reunión dentro de unas dos horas", dice Golmyck, "en una cámara subterránea situada no muy lejos de este castillo. El propósito principal de esta reunión es discutir las implicaciones políticas del asesinato del conde de Ollendor y cómo les afectará a ellos y a la ciudad de Thilias en las próximas semanas. En un principio, esta reunión iba a celebrarse después de su juicio y ejecución. Sin embargo, como sospechaba, la intervención de Eiden los obligó a posponerla hasta después del final de los combates de la arena. Dado que todos lograron sobrevivir, estoy bastante seguro de que tendrán mucho de qué hablar, sobre todo en lo relativo a cómo reaccionará Ollendor ante este giro inesperado de los acontecimientos. La reunión es obligatoria para los cuatro lessathi que residen en esta ciudad, así que tendrán la oportunidad de atacarlos a todos de una vez, sin temer que alguno descubra lo que les ocurrió a sus compañeros y se esconda."'
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch07a_traitor
  - name: b2_ch07a_traitor
    texts:
      - source: scene_text
        paragraph: 31
        text: |-
          "Pero ¿cómo llegaremos hasta allí sin que nos vean?" pregunta Daren.

          "La habitación en la que nos encontramos ahora está conectada a una gran red de túneles subterráneos", dice Golmyck. "Uno de esos túneles los llevará exactamente adonde necesitan ir. Lo sé porque hace unas semanas hice que uno de mis espías siguiera a Barry por uno de los pasadizos subterráneos, directamente hasta el cuartel general lessathi. Por suerte, ninguno de ellos sabe que esta habitación mía también tiene una entrada secreta a los túneles, así que no se han molestado en poner guardias en esta entrada en particular."

          "Espera, espera", dice Hadrik. "Cuando dices Barry, te refieres a tu sirviente, ¿verdad?"

          "¡Ah, es verdad, me refería a mi sirviente!" dice Golmyck. "Siempre se me olvida que tengo que especificarlo."

          "Bueno, si es tu sirviente, entonces ¿no podrías haberle pedido la información directamente?" dice Hadrik. "¿Por qué te molestarías en hacer que lo siguieran?"
      - source: scene_text_2
        paragraph: 17
        text: |-
          "Oh", dice Golmyck, sonriendo. "Es porque mi sirviente es un traidor. Lleva años trabajando con los lessathi. Por eso nunca le permito entrar en mi habitación privada."

          "¿Un traidor?" pregunta Hadrik, horrorizado. "¿Qué demonios, hombre? Si sabes desde hace tanto que es un traidor, ¿por qué lo sigues manteniendo a tu lado?"

          "Porque Barry nunca ha sido muy listo", dice Golmyck. "Es extremadamente fácil de leer y además nunca consigue darse cuenta cuando lo están siguiendo. Prefiero tenerlo como infiltrado a tener a alguien lo bastante inteligente como para engañarme de verdad. Y así consigo descubrir información útil sobre los lessathi, como la hora exacta y el lugar de su reunión de hoy. Es muy conveniente. Lo único que tengo que hacer es dejar escapar de vez en cuando alguna información aparentemente delicada, pero en última instancia inútil, para evitar sospechas, y así tengo mi propio espía dentro de la organización lessathi con un esfuerzo mínimo por mi parte."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch07a_map
  - name: b2_ch07a_map
    routes:
      - condition: b2_ch2_tell_servant = 1
        texts:
          - source: scene_text
            paragraph: 32
            text: |-
              Así que el sirviente del rey era un traidor... Ahora entiendo por qué ese lessathi con el que me encontré en la prisión sabía lo de mi dispositivo de estadísticas. Es porque se lo enseñé al sirviente de camino a la arena. Maldición, debería haber tenido más cuidado.

              "¿Eso significa que también harás que maten a tu sirviente cuando terminemos nuestro trabajo?" pregunta Daren.

              "Oh, cielos, ¡no!" dice Golmyck. "Barry es inofensivo. No habría ninguna razón para matarlo. No conoce a ningún lessathi aparte de los de esta ciudad, así que en cuanto nos ocupemos de esos cuatro, volverá a ser simplemente mi sirviente, sin ninguno de esos tejemanejes de espionaje."

              "¿Tienes alguna clase de mapa de los túneles subterráneos que pueda ayudarnos a llegar hasta nuestro destino?" pregunta Kate.

              "Sí, de hecho, ¡sí que lo tengo!" dice Golmyck, sacando un pergamino doblado del bolsillo y empezando a desplegarlo.

              Extiende el mapa sobre el banco de trabajo para que todos podamos verlo con claridad y luego nos explica con detalle qué túneles tendremos que tomar y dónde se encuentra el cuartel general lessathi en el mapa.
          - source: scene_text_2
            paragraph: 18
            text: |-
              "Arraka, ¿puedes..." empieza a decir Illuna, pero la interrumpen.

              "Sí, sí, ya voy", dice Arraka. "Un segundo."

              Entonces conjura un holograma detallado de los túneles subterráneos, aunque el mapa parece un poco distinto de como suele dibujarlo. Las líneas que representan los bordes de los pasadizos ya no están todas del mismo color. Algunas son azules y otras verdes.

              "¿Hay alguna razón por la que decidiste usar un color distinto para algunos de los pasadizos?" digo.

              "Sí, los túneles verdes son los que en realidad no puedo detectar con mi sentido mágico", dice Arraka. "Solo los puse ahí porque están en el mapa. Probablemente tengan paredes y techos hechos de seredium, lo que bloquea mi sentido mágico. No tengo ni idea de si hay gente pasando por ellos o siquiera de si se puede acceder a ellos. El camino hacia su destino no tiene seredium, eso sí, así que como mínimo pueden estar seguros de que no se toparán con guardias de camino allí."
