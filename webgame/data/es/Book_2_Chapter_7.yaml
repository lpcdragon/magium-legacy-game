  - name: b2_ch07a_wait
    texts:
      - source: scene_text
        paragraph: 60
        text: |-
          "¿Saben?, estaba pensando..." dice el lessathi que empuña las guadañas, que hasta ahora se había mantenido notablemente callado. "En realidad no necesitamos mantener vivos a los dos lessathi para interrogarlos, ¿verdad?"

          Mientras habla, se acerca lentamente a Leila, que está tumbada en el suelo boca abajo, con la cabeza orientada hacia él.

          "¿De qué estás hablando?" dice el lessathi de voz suave, apartando la vista de mí para volverse hacia su compañero. "¡Claro que los necesitamos vivos a los dos!"

          "Sí, pero verás..." dice el lessathi de las guadañas, agarrando a Leila del pelo y levantándole la cabeza para que pueda verle la cara directamente. "Llevo muchísimo tiempo con ganas de matar a esta pequeña mestiza. Y no creo que pueda contenerme mucho más."
    choices:
      - position: 1
        text: Intentar distraer al lessathi contándole el mensaje de Eiden.
        effects:
          - set:
              current_scene: b2_ch07a_winter
      - position: 2
        text: Esperar la señal de Leila.
        effects:
          - set:
              current_scene: b2_ch07a_wait2
  - name: b2_ch07a_wait2
    texts:
      - source: scene_text
        paragraph: 61
        text: |-
          "¡Contrólate!" dice el lessathi de voz suave. "¿Qué te pasa?"

          "¿Que me controle?" dice el lessathi de las guadañas. "Eso es fácil decirlo para ti. Tú no estuviste allí, en el Faro. El simple pensamiento de haber tenido que compartir la misma habitación con esta abominación durante largos periodos de tiempo me da ganas de vomitar. Y para colmo estaba también ese cuidador idiota que la trataba como si fuera una lessathi de verdad. Asqueroso."

          Entonces se vuelve hacia Leila al ver que la expresión de sus ojos cambia.

          "Oh, lo siento, ¿te molesta que hable mal de tu 'padre'?" dice el lessathi. "Bueno, ¿sabes qué? Tu estúpido padre merecía algo mucho peor que el destino que le tocó. Parásitos como él deberían sentirse afortunados de que siquiera se les permita vivir como esclavos. No tienen lugar en nuestra sociedad. Puede que por ahora lo hayas liberado, pero lo recuperaremos, no te preocupes. Y cuando lo hagamos, le daremos el destino que realmente merece. El destino de un pedazo de basura inútil."

          Cuando los ojos de Leila se llenan de rabia, se olvida por completo de la señal y salta sobre el lessathi que tiene delante, clavándole uno de sus cuchillos directamente en el corazón. Aprovecho rápidamente esta oportunidad y también me pongo en pie de un salto, asegurándome de quedar justo fuera del alcance del hechizo que me tenía paralizado y apuntando con mi daga a la garganta del lessathi que estaba más cerca de mí. El lessathi de voz suave no me estaba mirando y mi ataque lo toma completamente por sorpresa. Intenta echarse hacia atrás de un salto, pero es demasiado tarde y consigo cortarle el cuello de un solo movimiento.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch07a_trident
