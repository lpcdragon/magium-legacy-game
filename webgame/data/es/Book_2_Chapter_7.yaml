            paragraph: 79
            text: |-
              Cogemos nuestras mochilas, nos despedimos con la mano del rey y subimos las escaleras hasta la sala del trono. El sirviente del rey seguía allí y tenía una mirada bastante inquieta cuando nos vio salir por fin del sótano del rey después de más de dos horas, pero no dijo nada y nos condujo al exterior, igual que la última vez que vinimos al castillo.

              Aproximadamente una hora y media después, por fin llegamos a la mansión, donde Rose nos esperaba impaciente.

              "¡Por fin!" dice Rose. "¡Ya estaba empezando a preocuparme! Estaba a punto de llamarlos por el transceptor para asegurarme de que no hubiera pasado nada."

              "Sí, perdona por eso", dice Daren. "Nuestra reunión con el rey se alargó un poco más de lo que anticipábamos."

              "¡Oh, no hace falta disculparse!" dice Rose. "Parte de la comida se ha quedado un poco fría, pero voy a recalentarla y podremos empezar a comer dentro de unos veinte minutos."

