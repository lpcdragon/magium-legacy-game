              De repente oigo una voz en el extremo más lejano del corredor. No tardo en reconocerla como la del lessathi que vino a visitarme mientras estaba en mi celda bajo la arena. También parece que puedo oír a los otros lessathi de la reunión, aunque me cuesta un poco concentrarme en sus palabras.
          - source: scene_text_2
            paragraph: 28
            text: |-
              "Esa parece ser, en efecto, nuestra única alternativa", dice en lengua lessathi el lessathi de voz suave que visitó mi celda. "Ollendor ya ha quedado aislada de la mayor parte de Varathia, así que a los demás reinos probablemente no les importará si Thilias decide cortar también todos los lazos diplomáticos con Ollendor. El gnomo seguramente va a hacerlo de cualquier manera, así que no debería haber motivo para que intervengamos."

              "Ollendor es la menor de nuestras preocupaciones en este momento", dice otro lessathi. "¿Tienes idea de cuántos magos han muerto desde el inicio de este torneo? ¡Por eso insistí desde el principio en que el torneo debería haber tenido una regla que prohibiera a los magos matarse entre ellos a menos que las reglas del torneo lo exigieran explícitamente!"

              "Ya hemos hablado de esto antes", dice el lessathi de voz suave en tono calmado. "Los reyes no aceptarían eso, ¿recuerdas? Dijeron que iba contra la tradición varathiana imponer una regla así en un torneo, aunque todos los participantes sean forasteros."

              "¡Al diablo con los reyes y sus tradiciones anticuadas!" dice el otro lessathi. "¿Es que no lo entiendes? ¡Lo han arruinado todo! ¿Para qué me molesté siquiera en sabotear el dispositivo telepático destinado a transmitir los objetivos si de todos modos los magos iban a matarse entre ellos antes incluso de la primera ronda?"

              "Llevas quejándote de esto en todas y cada una de las reuniones que hemos tenido desde que empezó el torneo", dice otro lessathi. "Déjalo ya. Lo hecho, hecho está. Centrémonos en el presente, ¿sí?"
          - source: scene_3
            paragraph: 9
            text: |-
              "¡Barry!" susurra Daren. "¡Por aquí!"

              Cuando miro hacia Daren, me doy cuenta de que, mientras escuchaba la conversación de los lessathi, ya habíamos llegado a nuestro destino. El pasadizo en el que estamos ahora y el pasadizo del que salimos parecen reunirse ambos en este punto, y conducen a un pasillo mucho más estrecho al final del cual hay una puerta. Al otro lado de la puerta, los lessathi siguen celebrando su reunión y no parecen haberse dado cuenta de nuestra presencia.

              Me reúno con Daren y los demás en el pasillo estrecho y nos preparamos para irrumpir en la sala de reuniones a su señal.
