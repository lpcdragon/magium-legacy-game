          - source: scene_3
            paragraph: 8
            text: |-
              "Sí", dice Daren, mientras Hadrik se dirige hacia la pared que lleva al túnel secreto. "Mientras sepamos qué pared lleva al túnel, encontrar la palanca secreta que lo abre no debería ser tan..."

              Antes de que Daren llegue a terminar la frase, Hadrik alcanza la pared y la atraviesa de un puñetazo, haciendo que se desmorone en pedazos.

              "En serio..." dice Daren, dándose una palmada en la frente. "¿Tienes que hacer esto todas y cada una de las veces?"

              "¡Relájate!" dice Hadrik. "Los lessathi están demasiado lejos como para oír la simple caída de unas cuantas rocas y, si de verdad hay guardias al otro lado, tampoco es que tengamos forma de escabullirnos a su lado. Desde aquí es un camino directo al cuartel general lessathi. No hay otra opción."

              "Bien, sigamos", dice Daren. "Ya veremos qué pasa cuando pase."
