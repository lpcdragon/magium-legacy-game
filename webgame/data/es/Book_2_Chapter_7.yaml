  - name: b2_ch07a_ending
    routes:
      - condition: ch11_saved_rose = 0
        texts:
          - source: scene_text
            paragraph: 84
            text: |-
              Como al día siguiente teníamos que levantarnos antes del amanecer, tuvimos que terminar la celebración pronto para poder dormir al menos unas pocas horas, pero esas horas que pasamos alrededor de aquella mesa eran exactamente lo que necesitábamos después de todo lo que habíamos pasado en los últimos días.

              A la mañana siguiente, cuando todavía estaba oscuro afuera, nos alineamos todos en el patio para despedirnos de Enrique.

              "Bueno, solo he tenido el placer de hablar con vosotros unas pocas horas en total", dice Enrique, "pero han sido horas muy bien aprovechadas. Nunca os olvidaré, amigos míos. ¡Espero que todos logréis cumplir vuestros objetivos, ya sea ganar el torneo o cualquier otra cosa que deseen vuestros corazones!"

              "Adiós, Enrique", dice Daren. "Recuerda llevar contigo en todo momento ese transceptor que te di antes. Nunca se sabe cuándo podríamos necesitar volver a contactar, sobre todo mientras el torneo siga en curso."
          - source: scene_text_2
            paragraph: 46
            text: |-
              Nos despedimos de Enrique con la mano y nos ponemos en marcha para encontrar la puerta norte. Tras perdernos unas cuantas veces y tener que pedir indicaciones a los lugareños en numerosas ocasiones, por fin conseguimos llegar a nuestro destino justo cuando sale el sol, y al ver bien las puertas de la ciudad nos encontramos con que Melindra ya nos estaba esperando allí, con la espalda apoyada en una pared.

              Cuando nos hace un gesto con la mano para asegurarse de que la hemos visto, aceleramos el paso y nos preparamos para dar por fin el primer paso hacia nuestro objetivo original. Después de tantos desvíos y tantos retrasos, al fin podemos volver a aquello para lo que vinimos aquí. Participar en el Torneo del Magium.
