        texts:
          - source: scene_text
            paragraph: 72
            text: |-
              "Nos lo quedamos", digo. "No sé cuánto uso le sacaremos, pero nunca se sabe."

              "Entonces, sobre esas armas lessathi que Hadrik lanzó a tu habitación..." dice Daren.

              "Ah, sí", dice Golmyck. "Déjenme echarles un vistazo."

              "Intenté activar ese escudo, pero no encontré ningún interruptor", digo, mientras el gnomo estudia de cerca las armas lessathi.

              "Bueno, no me extraña", dice Golmyck. "Estas armas están claramente diseñadas para funcionar solo en manos de los individuos para los que fueron adaptadas. Si no tienen las firmas exactas de aura de los lessathi que usaban estos dispositivos, dudo que puedan sacarles ningún provecho. Probablemente esta medida se tomó para evitar que sus enemigos pudieran usar sus propias armas contra ellos."

              "Entonces, ¿son completamente inútiles?" digo.

              "No del todo", dice Golmyck. "Como armas no sirven de nada, pero si las desmonto quizá encuentre algunas piezas que pueda utilizar en otros de mis dispositivos."
          - source: scene_text_2
            paragraph: 40
            text: |-
              "Ah", digo. "Hablando de tus dispositivos, acabo de recordar que oí a los lessathi decir algo importante sobre ese dispositivo telepático tuyo mientras seguían en la reunión. Resulta que fueron ellos quienes sabotearon el dispositivo para retrasar la primera ronda del torneo. Por lo que pude entender, parecía que tenían algún tipo de plan que necesitaban llevar a cabo hasta el comienzo de la primera ronda y necesitaban todo el tiempo posible para hacerlo bien, pero al final parece que las cosas no les salieron como esperaban, porque murieron muchos más magos de los que preveían, y eso arruinó su plan de alguna manera."

              "Mmm", dice Golmyck. "Recuerdo perfectamente que intentaron convencer a los otros reyes de que introdujeran una regla en el torneo según la cual los participantes no pudieran matarse entre ellos salvo que las reglas lo exigieran explícitamente. Así que fue un sabotaje lo que provocó el fallo... Eso explicaría por qué el dispositivo se comportaba de forma tan errática, por muchas veces que intentara trastear con él. Qué interesante. Desde luego esta información me ayudará a arreglar el dispositivo más rápido. ¡Gracias por hacérmelo saber!"

              "¿Oíste lo que los lessathi discutían durante su reunión?" me pregunta Daren.

              "Sí, podía oírlos desde muy lejos gracias a mi estadística de audición", le digo a Daren con total despreocupación. "En fin, supongo que deberíamos recoger nuestras mochilas. Se está haciendo tarde y todavía tenemos un banquete al que asistir."
          - source: scene_3
            paragraph: 10
            text: |-
              "De acuerdo", dice el rey. "Recuerden no decir nada sobre su misión secreta mientras estén fuera de esta habitación. Puede que los lessathi estén muertos, pero sus espías siguen vivitos y coleando. Muchos probablemente abandonarán la ciudad en cuanto descubran que ya no tienen empleadores que les paguen, pero algunos de los más leales podrían buscar venganza, y no querrían que ustedes ni sus amigos se convirtieran en objetivo de ninguno de esos asesinos. Ya me encargaré a su debido tiempo de que mis propios espías y asesinos se ocupen de esos seguidores más leales de los lessathi, pero por ahora todos deberíamos actuar con cautela."

              "Sí, tendremos cuidado", dice Daren.

              "Buen viaje", dice Golmyck. "Y recuerden que siempre serán bienvenidos en Thilias, si deciden volver a visitar esta ciudad."
        choices:
