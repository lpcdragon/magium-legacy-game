            paragraph: 80
            text: Cuando Hadrik y los demás están ya terminando su partida de cartas, Enrique sale de la cocina seguido de cinco cocineros, cada uno cargando platos de comida y trayendo a la mesa una especialidad completamente distinta. No me sorprendería que estos platos supieran incluso mejor que lo que Flower puede conjurar mágicamente, dada su limitada comprensión de las artes culinarias. Cuando los cocineros terminan de colocar todos los platos en una de las mesas de picnic más grandes del patio, los hermanos de Rose se unen a nosotros, y todos nos sentamos a la mesa, preparándonos para el merecido festín.
          - source: scene_text_2
            paragraph: 44
            text: |-
              Pasamos las siguientes horas comiendo, bebiendo y celebrando nuestra tan esperada liberación de la arena.

              La comida que nos prepararon los cocineros resultó estar realmente a la altura de las delicias mágicamente concebidas por Flower, si no incluso por encima. Había tantos platos en aquella mesa de los que nunca había oído hablar que casi parecía que estuviera participando en una especie de banquete real. Al principio, los cocineros permanecieron de pie en fila delante de la mesa, esperando a que les pidiéramos más, pero tras toda una hora de Hadrik insistiendo en que se unieran a nosotros para tomar algo, terminaron cediendo y poco a poco se fueron soltando, a medida que empezaba a hacer efecto la ale enana. Hacia el final de la celebración, Enrique se aseguró de darnos a todos las hierbas especiales de Rose para que al día siguiente pudiéramos empezar con energías renovadas, sin miedo a ninguna resaca.
