            paragraph: 42
            text: |-
              Mientras avanzamos un poco más por el túnel, de repente tengo una visión de nuestro grupo caminando directo hacia una explosión, no mucho más adelante de nuestra posición actual.

              "¡Alto!" grito, mientras todos se vuelven hacia mí.

              "¿Qué pasa?" dice Kate.

              "Esa parte del pasadizo está preparada para explotar si seguimos avanzando", digo.

              "¿Has visto una premonición de que eso ocurre?" pregunta Kate.

              "Sí", digo. "No podemos ir por ahí. Tenemos que volver."

              "Pero ¿por qué iba a haber una trampa en este pasadizo?" pregunta Hadrik. "¿No es este el camino que suele tomar el sirviente del gnomo para llegar a su cuartel general? ¿Por qué iban a arriesgarse?"
          - source: scene_text_2
            paragraph: 24
            text: |-
              "Probablemente ya nos hayan detectado", dice Daren. "El rey ya nos dijo que los lessathi tienen dispositivos de escucha dentro de la sala del trono, lo que significa que deberían ser conscientes de que ya hemos visitado dos veces la habitación secreta de Golmyck. Aunque no sepan nada de la trampilla oculta, tienen buenos motivos para ser cautelosos."

              "Sí, pero arriesgarse a volar todo este pasadizo por una simple sospecha..." dice Hadrik. "No sé, me cuesta un poco creerlo. Barry, ¿estás seguro de que tu cacharro no estará fallando de alguna manera? Quiero decir, no tienes ninguna garantía de que esas premoniciones vayan a cumplirse siempre, ¿no?"
        effects:
