  - name: b2_ch07a_handle
    texts:
      - source: scene_text
        paragraph: 68
        text: |-
          Aquí hay algo que definitivamente no encaja, pero no consigo señalar qué es exactamente. Esperaré un poco más para ver qué pasa.

          "¡Barry, por favor!" escribe Leila una vez más, mientras el lessathi se le acerca con la daga, luchando por orientarse hacia ella debido a los efectos persistentes del destello cegador de antes.

          Mierda... Supongo que por ahora iré a inmovilizar al lessathi y ya averiguaré más tarde qué es lo que está mal.

          Justo cuando estoy a punto de alcanzar al lessathi, Kate de repente le dispara a Leila tres conos de hielo a la cintura, haciéndola gritar de dolor. Espera... ¿Gritar? ¿Desde cuándo puede gritar Leila?

          Mi pregunta recibe respuesta enseguida, cuando la Leila que estaba en el suelo se desvanece lentamente en el aire y es reemplazada por el lessathi de antes, que se aferra al abdomen intentando desesperadamente contener la hemorragia. Al mismo tiempo, el lessathi que estaba frente a mí se convierte en Leila, que ahora mira al lessathi que grita delante de ella, con la daga todavía en la mano.

          ¿Una ilusión? ¿Era una ilusión desde el principio? ¿Cómo no me di cuenta antes?

          Mientras estoy ocupado cuestionándome a mí mismo, Kate no pierde el tiempo y remata al último lessathi que queda enviándole una daga de hielo a la cabeza. Luego se vuelve hacia mí y niega con la cabeza en señal de desaprobación.
      - source: scene_text_2
        paragraph: 36
        text: |-
          " '¿Ayúdame, Barry?' " dice. "¿En serio? ¿Cuándo fue la última vez que viste a Leila hacerse la damisela en apuros? Sobre todo contra un debilucho como este."

          "Un momento", digo. "No me vas a decir que lo único que te llevó a creer que Leila era en realidad el lessathi fue su petición de ayuda, ¿verdad?"

          "En realidad, eso es exactamente lo que te voy a decir", dice Kate.

          "¿Pero y si te hubieras equivocado?" le pregunto, horrorizado.

          "Entonces Daren habría tenido que lanzar un hechizo curativo extra", dice Kate. "Me aseguré de no golpear ninguna zona vital con mis primeros conos, por si acaso, así que no habría habido daños permanentes."

          "Vaya..." digo. "Eh... No estoy seguro de cómo reaccionar a esto."

          "Reacciona como siempre", dice Kate. "Con una ocurrencia."

          Hace una pausa al ver que Daren y los demás empiezan a liberarse de los efectos de la trampa de parálisis.

          "Vamos", dice Kate. "Deberíamos registrar su cuartel general y ver si podemos encontrar algo útil. Con un poco de suerte, quizá encuentre información sobre Diane."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch07a_precautionary
  - name: b2_ch07a_precautionary
    texts:
      - source: scene_text
        paragraph: 69
        text: |-
          "¡Eso estuvo demasiado cerca!" dice Daren, mientras todos empezamos a entrar en el cuartel general. "De verdad tenemos que hacer algo con nuestra vulnerabilidad a la electricidad."

          "Sí", dice Hadrik. "No creo haber sentido tan poco control de una situación desde aquella vez en que nos electrocutó la amiga elementalista de Kate. Si Barry no hubiera averiguado cómo funcionaba este hechizo antes de que llegáramos, estaríamos muertos."

          "Bueno, supongo que es algo bueno que tengan a un amigo que se pasó la vida empollando en bibliotecas", digo. "¿Verdad, Daren?"

          "Sí, sí..." dice Daren, y todos empezamos a registrar los escritorios de la habitación lessathi.

          Tras unos minutos buscando, acabamos dándonos cuenta de que todos y cada uno de los cajones están completamente vacíos.

          "Maldición..." dice Daren. "Ni un solo documento. ¿Crees que vaciaron su cuartel general antes de esta reunión, como medida de precaución, por la remota posibilidad de que los derrotaran de verdad?"

          "Puede que lo hicieran mucho antes que eso", digo. "Si ya sospechaban que seguían hasta aquí al sirviente del rey, probablemente consideraron que esta ubicación estaba comprometida, así que se aseguraron de no dejar nada de valor en este lugar."

          "Supongo que tienes razón..." dice Daren. "Entonces supongo que deberíamos volver al castillo, ¿no?"

          "Sí", dice Kate. "Desde luego no voy a encontrar aquí ninguna información sobre Diane. Volvamos."
      - source: scene_text_2
        paragraph: 37
        text: |-
          "Sabes..." le digo a Kate, mientras nos preparamos para salir del cuartel general. "Podrías haber dejado con vida a ese último lessathi para interrogarlo. Ya lo tenías más o menos inmovilizado con esa primera tanda de conos de hielo que le lanzaste al abdomen, así que no debería haber supuesto una gran amenaza."

          "No quería arriesgarme", dice Kate. "Ese lessathi era prácticamente el ilusionista de su grupo y perfectamente podía tener otros trucos bajo la manga. Nunca es buena idea dejar con vida a los ilusionistas después de una pelea."

          "¿Qué opinan...? ¿Deberíamos llevarnos estas armas?" dice Hadrik, al pasar junto a los cadáveres de los lessathi.

          "Oh, sin duda deberíamos llevárnoslas", digo. "¡Yo podría usar perfectamente una de estas!"

          Entonces recojo del suelo el escudo con incrustaciones de esmeralda y empiezo a agitarlo arriba y abajo, intentando lanzar un hechizo con él.

          "Mmm..." digo. "No recuerdo que ese lessathi pronunciara ningún cántico antes de lanzar su hechizo de ilusión ni antes de lanzar el destello de luz con el que nos ocultó la ilusión. ¿Quizá hay un botón oculto o algo que se me está escapando?"

          "Llevemos esto al rey Golmyck", dice Daren. "Es un manitas. Debería ser capaz de entender cómo funcionan estas armas."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch07a_climb
  - name: b2_ch07a_climb
    texts:
      - source: scene_text
        paragraph: 70
        text: |-
          "¡Uy!" dice Hadrik, dando un salto hacia atrás de casi un metro después de haber dado apenas un paso hacia delante. "Casi me olvido de esa trampa eléctrica de antes."

          "¡Relájate!" digo. "Ese hechizo se desactiva automáticamente en cuanto todos los que están dentro de su alcance salen del área."

          Entonces cruzo la zona en la que antes se había activado la trampa y me doy la vuelta para mirar a Hadrik.

          "¿Ven?" digo. "Nada de qué preocuparse. Vámonos de aquí."

          Cogemos las armas lessathi y emprendemos el camino de vuelta, siguiendo exactamente la misma ruta que tomamos para llegar hasta aquí. En cuanto alcanzamos el corredor situado bajo el sótano del rey, Hadrik empieza a lanzar piedras a la trampilla que hay sobre nosotros para llamar la atención del rey. Unos segundos después, la trampilla se abre y la escalera extensible baja hasta abajo del todo, igual que antes.

          "Va a ser un poco difícil subir por esta escalera cargando estas armas lessathi", dice Daren.

          "¿No puedes sujetártelas a la espalda de algún modo como hiciste con tu escudo?" digo.
      - source: scene_text_2
        paragraph: 38
        text: |-
          "Bueno, el escudo está hecho para sujetárselo a la espalda cuando viajas durante largos periodos de tiempo", dice Daren. "Estas armas no tienen correas y la correa del escudo no está pensada para sostener ninguna otra arma."

          "Los dos hacen que esto suene muchísimo más complicado de lo que es en realidad", dice Hadrik, recogiendo el tridente lessathi. "No hace falta subirlas todas con nosotros. Puedo simplemente arrojarlas por la trampilla."

          Luego grita bien fuerte para asegurarse de que Golmyck lo oye.

          "¡Eh, Golmyck!" grita Hadrik. "¡Voy a tirarte unas cuantas cosas! Algunas tienen puntas afiladas. ¡Asegúrate de mantenerte lejos de la trampilla!"

          El gnomo nos hace una señal con la mano indicando que está bien y entonces Hadrik empieza a lanzar todas las armas por la trampilla. En cuanto termina, subimos todos por la escalera extensible, uno por uno, y una vez llegamos al sótano del rey, la trampilla se vuelve a cerrar sola a nuestra espalda.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch07a_volunteered
  - name: b2_ch07a_volunteered
    texts:
      - source: scene_text
        paragraph: 71
        text: |-
          "¿Debo entender entonces que los lessathi han muerto todos?" nos pregunta el rey.

          "Sí, acabamos con todos", digo.

          "Extraordinario", dice Golmyck. "Y sin un solo rasguño en ninguno de ustedes, además. Lo admito, estoy impresionado."

          "Solo asegúrate de cumplir tu parte del trato", dice Daren. "No queremos volver a ver esclavos en las calles cuando regresemos a esta ciudad."

          "¡Por supuesto!" dice Golmyck. "Empezaré a preparar la abolición de la esclavitud mañana a primera hora. Solo desearía que hubiera algo más con lo que pudiera recompensarlos por su ayuda. Dado que la misión a la que los envié es secreta, no puedo darle al tesorero ninguna razón oficial que justifique ofrecerles una recompensa."

          "Eh, no hace falta", digo. "Fuimos nosotros quienes nos ofrecimos voluntarios para la misión desde el principio. Si hubiéramos querido pago, lo habríamos pedido desde el primer momento."
      - source: scene_text_2
        paragraph: 39
        text: |-
          "Aun así... no me gustaría que se fueran con las manos vacías", dice el rey. "Esperen, creo que tengo algo que podría resultarles útil."

          Entonces desaparece bajo su banco de trabajo y reaparece diez segundos después con un pequeño dispositivo en la mano que solo tiene una pantalla y un botón.

          "Este dispositivo los ayudará a averiguar si alguien es lessathi o humano", dice Golmyck. "Solo tienen que pulsar este botón mientras apuntan el dispositivo hacia alguien, y el texto que aparezca en la pantalla les dirá si es lessathi o no. Lo fabriqué hace mucho tiempo, cuando no podía diferenciar entre las auras de humanos y lessathi con mi sentido mágico. La verdad es que hace años que no lo uso, así que pueden quedárselo si quieren."
