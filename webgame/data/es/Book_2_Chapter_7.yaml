  - name: b2_ch07a_papers
    routes:
      - condition: b2_ch7_tunnel = 0
        texts:
          - source: scene_text
            paragraph: 34
            text: |-
              "¿Y la sala de reuniones? ¿Hay alguien dentro ahora mismo?"

              "No", dice Arraka. "Su cuartel general está vacío. Habría puesto algunos puntos ahí si hubiera gente dentro."

              "Entonces, ¿dónde vamos a esperar las próximas dos horas?" dice Daren. "¿Salimos afuera o...?"

              "Oh, no, no, definitivamente no deberían salir", dice Golmyck. "Si se van ahora y regresan solo unos minutos antes de la reunión lessathi, mi sirviente podría sospechar y contactar con ellos de alguna manera. Pueden esperar aquí mismo. La verdad es que no tengo sillas en esta habitación, pero acabo de limpiar el suelo, así que pueden sentarse en él si quieren."

              Luego sella dos documentos más y nos los entrega para que cada uno pueda echarles un vistazo.
          - source: scene_text_2
            paragraph: 19
            text: |-
              "Aquí tienen", dice el rey. "Estos papeles deberían bastar para absolverlos de sus crímenes, sin importar adónde vayan en Varathia. Ahora, si no necesitan nada más de mí, reanudaré mi trabajo en el dispositivo lessathi que debía enviarles telepáticamente las instrucciones relacionadas con los objetivos del torneo. Llevo más de una semana intentando repararlo, pero todavía no consigo averiguar qué tiene de malo, así que pueden imaginarse lo frustrante que ha sido esto para mí."

              Mientras Golmyck se pone a trabajar en su dispositivo, Hadrik deja la mochila en el suelo y mete la mano dentro para sacar una baraja de cartas.

              "Bueno..." dice Hadrik. "¿Alguien se anima a una partida de cartas?"

              Pasamos la siguiente hora más o menos jugando a un juego de cartas que Hadrik aprendió en tabernas enanas. Al parecer, una de las reglas originales del juego era que un jugador debía dar un sorbo de ale enana cada vez que perdía una mano, pero tuvimos que descartar esa regla por razones obvias. El juego implicaba mucho faroleo, así que no sorprendió que Leila acabara imponiéndose, dado que podía leer auras para saber si alguien estaba mintiendo. Como yo era la persona a la que más fácil le resultaba leer debido a mi aura 'espinosa', terminé cansándome de perder todas y cada una de las partidas y decidí hacer una pausa para leer un poco más mi cuaderno, con la esperanza de encontrar más vacíos legales que Eiden pudiera estar utilizando.

              "Oye, Daren", digo después de revisar el cuaderno durante un rato. "¿Recuerdas aquella vez en la que Eiden los paralizó a todos? Justo antes de teletransportarnos delante de Thilias?"
          - source: scene_3
            paragraph: 6
            text: |-
              "¿Qué?..." dice Daren, mientras intenta concentrarse en sus cartas al tiempo que me escucha. "Ah, sí, lo recuerdo. ¿Qué pasa con eso?"

              "¿Cuántos hechizos tienes que te protejan contra la parálisis?" digo.

              "Solo uno", dice Daren. "Y el escudo no protege contra la parálisis, ¡así que no es sobrecarga de protecciones!"

              "Vale, vale", digo. "¿Alguien más está usando protección contra la parálisis?"

              "Sí", dice Kate. "Yo uso el hechizo descrito en el último libro de 'Teoría avanzada de la magia' de Azarius."
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch07a_unconscious
      - condition: b2_ch7_tunnel = 1
        texts:
          - source: scene_text
            paragraph: 35
            text: |-
              "¿Puedes percibir algún túnel que no aparezca en el mapa del rey?"

              "Pues sí, de hecho", dice Arraka. "Hay unos cuantos. Deja que los añada al mapa."

              Unos segundos después de que termina de hablar, aparecen tres pasadizos azules más en el holograma que flota frente a su amuleto.

              "Oye, mira", digo, "uno de esos pasadizos parece conectar uno de los túneles que vamos a tomar con uno de los túneles de seredium. Y ese túnel también lleva hacia el cuartel general lessathi."

              "Sí, pero no puedo garantizar que el túnel de seredium siga siendo transitable ahora mismo", dice Arraka. "Como dije, solo lo puse ahí porque estaba en el mapa."

              "Entonces, ¿dónde vamos a esperar las próximas dos horas?" dice Daren. "¿Salimos afuera o...?"

              "Oh, no, no, definitivamente no deberían salir", dice Golmyck. "Si se van ahora y regresan solo unos minutos antes de la reunión lessathi, mi sirviente podría sospechar y contactar con ellos de alguna manera. Pueden esperar aquí mismo. La verdad es que no tengo sillas en esta habitación, pero acabo de limpiar el suelo, así que pueden sentarse en él si quieren."

              Luego sella dos documentos más y nos los entrega para que cada uno pueda echarles un vistazo.
          - source: scene_text_2
            paragraph: 19
            text: |-
              "Aquí tienen", dice el rey. "Estos papeles deberían bastar para absolverlos de sus crímenes, sin importar adónde vayan en Varathia. Ahora, si no necesitan nada más de mí, reanudaré mi trabajo en el dispositivo lessathi que debía enviarles telepáticamente las instrucciones relacionadas con los objetivos del torneo. Llevo más de una semana intentando repararlo, pero todavía no consigo averiguar qué tiene de malo, así que pueden imaginarse lo frustrante que ha sido esto para mí."

              Mientras Golmyck se pone a trabajar en su dispositivo, Hadrik deja la mochila en el suelo y mete la mano dentro para sacar una baraja de cartas.

              "Bueno..." dice Hadrik. "¿Alguien se anima a una partida de cartas?"

              Pasamos la siguiente hora más o menos jugando a un juego de cartas que Hadrik aprendió en tabernas enanas. Al parecer, una de las reglas originales del juego era que un jugador debía dar un sorbo de ale enana cada vez que perdía una mano, pero tuvimos que descartar esa regla por razones obvias. El juego implicaba mucho faroleo, así que no sorprendió que Leila acabara imponiéndose, dado que podía leer auras para saber si alguien estaba mintiendo. Como yo era la persona a la que más fácil le resultaba leer debido a mi aura 'espinosa', terminé cansándome de perder todas y cada una de las partidas y decidí hacer una pausa para leer un poco más mi cuaderno, con la esperanza de encontrar más vacíos legales que Eiden pudiera estar utilizando.

              "Oye, Daren", digo después de revisar el cuaderno durante un rato. "¿Recuerdas aquella vez en la que Eiden los paralizó a todos? Justo antes de teletransportarnos delante de Thilias?"
          - source: scene_3
            paragraph: 6
            text: |-
              "¿Qué?..." dice Daren, mientras intenta concentrarse en sus cartas al tiempo que me escucha. "Ah, sí, lo recuerdo. ¿Qué pasa con eso?"

              "¿Cuántos hechizos tienes que te protejan contra la parálisis?" digo.

              "Solo uno", dice Daren. "Y el escudo no protege contra la parálisis, ¡así que no es sobrecarga de protecciones!"

              "Vale, vale", digo. "¿Alguien más está usando protección contra la parálisis?"

              "Sí", dice Kate. "Yo uso el hechizo descrito en el último libro de 'Teoría avanzada de la magia' de Azarius."
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch07a_unconscious
  - name: b2_ch07a_unconscious
    texts:
      - source: scene_text
        paragraph: 36
        text: |-
          "De acuerdo", digo. "¿Y tú, Daren? ¿Qué protección estás usando?"

          "La dorada", dice Daren. "La que hace un efecto giratorio con chispas cuando la lanzas."

          "Eh...", digo. "Vale... O sea, te refieres a la versión avanzada del grimorio estándar de mago blanco. Y Hadrik, supongo que tú cuentas con la resistencia parcial que te da el hecho de ser un gigante para defenderte de ese tipo de hechizos, ¿no?"

          "Sí", dice Hadrik. "Pero me quedé completamente paralizado, igual que Kate y Daren, a pesar de mi resistencia."

          "Ajá", digo. "Bueno, ¿saben qué tienen en común esas tres defensas suyas?"

          "¿Qué?" dice Daren.

          "Absolutamente nada", digo mientras cierro mi cuaderno. "Lo que significa que esta vez Eiden no estaba utilizando un vacío legal. De hecho, ni siquiera creo que estuviera usando parálisis. Debió de estar usando un tipo de hechizo completamente distinto que produce el mismo efecto. ¿Recuerdan aquella vez en la que la amiga de Kate nos dejó a todos inconscientes en el suelo? No usó un hechizo de sueño para hacerlo. Usó electricidad. Sospecho que Eiden utilizó un método parecido para paralizarlos temporalmente. ¿No sintieron todos una descarga justo antes de caer al suelo? Estoy bastante seguro de que también debieron sentir unas cuantas descargas más después, pensadas para mantenerlos paralizados durante más tiempo."
      - source: scene_text_2
        paragraph: 20
        text: |-
          "Ahora que lo dices, ¡sí!" dice Daren. "Sí que sentí algunas descargas eléctricas. Pero no se sentían muy distintas de lo que se siente con una parálisis normal, así que en ese momento no noté realmente la diferencia. Pero ¿esto significa que Eiden puede usar la electricidad como elemento, igual que la amiga de Kate?"

          "Lo dudo", digo. "El hechizo que utilizó parecía tener ciertas reglas y limitaciones, lo cual no sería el caso si pudiera usar la electricidad libremente como elemento. El hechizo eléctrico que usó para paralizarlos me pareció extremadamente parecido a un hechizo al que tuve acceso cuando tenía mi dispositivo de estadísticas potenciado, así que probablemente sea el mismo. No recuerdo hasta el último detalle, pero era uno de esos hechizos que solo puedes lanzar una vez al día, y sé con seguridad que una de las mayores desventajas del hechizo era que el área de efecto era extremadamente pequeña. Quiero decir, prácticamente bastaba con rodar hacia un lado y las corrientes eléctricas siguientes dejarían de apuntarte. La única razón por la que funcionó contra ustedes fue que los tres estaban muy juntos y que no sabían contra qué tipo de hechizo se enfrentaban. Si hubieran sabido cómo funcionaba, podrían haberse apartado justo en el instante preciso antes de que los golpeara una nueva corriente eléctrica, ya que el efecto de la parálisis se atenúa un poco justo antes de cada nueva descarga."
      - source: scene_3
        paragraph: 7
        text: |-
          "Sí, la verdad dudo mucho que yo hubiera podido hacer eso", dice Daren, "porque estuve intentando liberarme del efecto del hechizo todo el tiempo, y no funcionó."

          "¡Eso es porque el hechizo te da descargas a intervalos más cortos si ve que estás intentando liberarte!" digo. "Así no funciona. Tienes que estar relajado y tratar de escapar solo en el último segundo. Claro, no puedes saber cada cuánto va a darte una descarga hasta que te dejes electrocutar unas cuantas veces mientras cuentas los segundos de cada intervalo. Los intervalos no siempre tendrán la misma duración, pero normalmente habrá un patrón que podrás averiguar. Una vez estés seguro de que llevas bien la cuenta, esperas al último momento y solo entonces intentas escapar. Evidentemente, la forma más fácil de esquivar esto sería usar protección contra la electricidad, pero con la cantidad de energía que hace falta para mantener esa protección activa, tendrías que estar loco para usarla todo el tiempo por la remota posibilidad de que te atacaran con un hechizo eléctrico distinto de los normales."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch07a_careful
  - name: b2_ch07a_careful
    routes:
      - condition: b2_ch7_tunnel = 0
        texts:
          - source: scene_text
            paragraph: 37
            text: |-
              "Eh", dice Hadrik, "no es que quiera interrumpirte ni nada, pero de verdad deberíamos darnos prisa si queremos terminar la partida antes de irnos. Solo nos queda aproximadamente media hora antes de la reunión lessathi y, salvo Leila, todos seguimos teniendo al menos seis cartas en la mano."

              Una vez Hadrik y los demás terminan su partida, dejamos nuestras mochilas al cuidado del rey Golmyck y nos preparamos para descender a los túneles de abajo.

              "Tengan cuidado", dice Golmyck antes de que partamos. "Puede que los lessathi no sean magos, pero sus dispositivos mágicos altamente avanzados los convierten en una amenaza tan grande como algunos de los participantes más hábiles que se han unido a este torneo. Les habría dado más información sobre ellos, pero por desgracia lo único que sé es que el que empuña dos guadañas usa ataques eléctricos. Las funciones de los dispositivos de los otros me siguen siendo desconocidas."

              "Bueno", digo, "al menos sabemos a quién apuntaremos primero."

              El rey abre una trampilla que conduce a los pasadizos subterráneos y una escalera extensible cae hacia abajo, permitiéndonos alcanzar el suelo del túnel sin peligro. Bajamos uno por uno y, una vez que todos llegamos al nivel inferior, Golmyck nos desea suerte y vuelve a subir la escalera, cerrando la trampilla con un fuerte golpe seco. Mirando hacia arriba, apenas puedo distinguir que hace solo unos segundos había una trampilla abierta en el techo sobre nosotros. La textura de la puerta secreta se mezcla a la perfección con la superficie rocosa del techo y las paredes, dejándola completamente oculta a menos que sepas exactamente dónde buscar.
          - source: scene_text_2
            paragraph: 21
            text: |-
              Avanzamos por los pasadizos durante unos minutos, procurando seguir con cuidado las indicaciones que nos dio el rey, mientras le preguntamos periódicamente a Arraka si no percibe guardias en nuestro camino hacia el cuartel general lessathi.

              "¡Miren, los lessathi están empezando la reunión!" dice Flower, señalando varios puntos verdes que ahora se mueven dentro del cuartel general lessathi en el holograma de Arraka.

              "Un poco antes de lo que tocaba, pero no por mucho", dice Daren mientras también mira el holograma frente a Flower. "Aún deberíamos llegar antes de que terminen. No falta mucho para que alcancemos el último pasadizo y entonces deberíamos poder ver la entrada a su guarida. Aun así, sigo sintiéndome un poco intranquilo con todos estos túneles vacíos. No puedo evitar sentir que estamos caminando hacia algún tipo de trampa."

              "No seas tan pesimista, Daren", dice Hadrik. "El rey dijo que los lessathi no saben nada de su trampilla oculta, así que es normal que no tengan a nadie vigilando estas zonas. Puede que tengan algunos guardias apostados delante de la sala de reuniones y eso calme tus preocupaciones."
