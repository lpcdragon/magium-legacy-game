scenes:
  - name: b2_ch07a_intro
    effects:
      - set:
          successful_checks:
            - 'Punto de control alcanzado: Partida guardada.'
        condition: checkpoint_rich = 1
    routes:
      - condition: b2_ch1_interfere = 1
        texts:
          - source: scene_text
            paragraph: 2
            text: |-
              "Barry, ¿cuánto tiempo piensas quedarte mirando ese pedazo de papel?" dice Daren. "Ya te dije que no hay conflictos entre mis hechizos de protección. Por muchas veces que lo compruebes, no vas a encontrar algo que no existe."

              Ignoro a Daren y sigo mirando el pedazo de papel tirado en el suelo frente a mí, mientras comparo la información que hay en él con lo que he escrito en mi cuaderno. El papel tiene anotadas todas las protecciones de Daren, y he logrado encontrar información detallada sobre la mayoría de estos hechizos en mi cuaderno, pero aún no he conseguido dar con el vacío legal que Eiden utilizó para dormir a Daren. Hadrik también está sentado en el suelo, a mi lado, mirando la lista de hechizos y soltando suposiciones descabelladas, pero está claro que en realidad no sabe lo bastante de magia blanca como para poder hacer valoraciones razonables.

              Flower también ha intentado mirar el papel y mi cuaderno unas cuantas veces, pero al final se rindió, diciendo que le estaba dando dolor de cabeza. Illuna, en cambio, anunció desde el principio que no participaría en nuestra sesión de lluvia de ideas, porque sus conocimientos sobre hechizos de protección para magos blancos eran demasiado limitados como para poder aportar algo de verdad.

              "Eh", me dice Hadrik. "¿No tiene esta protección contra ilusiones un cántico parecido a esa protección contra el sueño de ahí? ¿No podría ser eso lo que está causando el conflicto?"
          - source: scene_text_2
            paragraph: 2
            text: |-
              "No", digo. "Hay muchos hechizos con cánticos que suenan parecido, y que yo sepa eso nunca ha causado un conflicto. Tiene que ser otra cosa. Algo obvio que se me está escapando. Voy a empezar otra vez desde el principio, a ver si no me salté algún detalle importante o algo."

              "¡Oh, vamos!" dice Daren, exasperado. "¿No se te ha pasado por la cabeza que quizá Eiden solo te estaba tomando el pelo? ¿Por qué iba siquiera a decirte su debilidad? ¿Qué motivo podría tener para hacer algo así?"
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch07a_intro2
                  checkpoint_rich: 0
      - condition: b2_ch1_interfere = 0
        texts:
          - source: scene_text
            paragraph: 2
