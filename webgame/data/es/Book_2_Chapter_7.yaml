  - name: b2_ch07a_overload
    texts:
      - source: scene_text
        paragraph: 7
        text: |-
          "¿Qué?..." dice Daren. "Ah... Sí, sí, es esa..."

          "¿Qué está haciendo Barry?" les pregunta Kate a los demás al verme pasar páginas de mi cuaderno como un loco.

          "Dice que ha descubierto cómo logró Eiden dormir a Daren a pesar de sus protecciones", dice Hadrik. "Por lo visto es por una sobrecarga de protecciones, y ahora está intentando encontrar los dos hechizos de protección que están entrando en conflicto entre sí."

          "¿Sobrecarga de protecciones?" dice Kate. "La verdad es que eso sí suena a algo que Daren haría..."

          "¡Lo encontré!" digo. "La protección contra el sueño del hechizo de escudo de Daren tiene un flujo de aura casi idéntico al de uno de sus hechizos individuales de protección contra el sueño. ¡Miren estos dos diagramas!"

          Entonces les enseño el cuaderno, pasando las páginas de un diagrama al otro para que puedan ver el parecido.

          "¿Seguro que no es solo porque dibujas fatal?" dice Daren. "Si tu letra horrible sirve de referencia, no estoy muy seguro de cuánto confiaría en tu capacidad para copiar con precisión un diagrama de un libro."

          Frunzo el ceño al mirar a Daren.

          "Bueno, entonces ¿por qué no hacemos una prueba?" digo. "¿Alguien aquí conoce algún hechizo de sueño?"
      - source: scene_text_2
        paragraph: 5
        text: |-
          "Yo conozco un hechizo de sueño", dice Illuna. "Tarda un poco en lanzarse y necesito tocarlo mientras lo hago, pero debería ser más que suficiente para lo que necesitamos."

          "¡Perfecto!" digo. "Aquí tienes los diagramas. Tienes que asegurarte de sincronizar bien el hechizo de sueño y apuntarlo justo al punto exacto donde se cruzan los dos flujos de aura."

          "Sí, ya sé cómo funciona", dice Illuna, echando un vistazo rápido a los diagramas antes de dirigirse hacia Daren.

          "Oh, esto va a estar bien", dice Daren.

          Una vez que Illuna llega hasta Daren, le coloca la palma de la mano derecha sobre el brazo y cierra los ojos, intentando visualizar los flujos de las auras.

          "¿Ven?" dice Daren, después de unos cinco segundos esperando a que Illuna lance su hechizo. "Ya les dije que estaban perdiendo el tiempo al..."

          Daren no llega a terminar lo que estaba diciendo, porque sus ojos se le van hacia atrás de repente y cae al suelo como un tronco.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch07a_oaf
  - name: b2_ch07a_oaf
    texts:
      - source: scene_text
        paragraph: 8
        text: |-
          "Eso lo deja claro", dice Illuna. "Ese bruto estaba usando hechizos de protección en conflicto."

          "¡Vaya, mira tú!" dice Hadrik. "Barry tenía razón. Aunque creo que alguien debería despertar a Daren. No parece una postura muy cómoda para dormir."

          "Déjamelo a mí", dice Illuna.

          Entonces conjura sobre la cabeza de Daren el equivalente a un cubo de agua, que deja caer de inmediato sobre su cara.

          "¿Qué demonios...?" dice Daren, incorporándose rápido del suelo antes de toser un poco de agua de los pulmones. "¿Cómo he acabado en el suelo?"

          "Adivínalo", dice Kate.

          "No..." dice Daren. "No puede ser..."

          "Bueno, Daren", digo. "Supongo que eso significa que ahora oficialmente vas a perder tu última pizca de protección contra el daño físico. ¡Bienvenido al club!"
      - source: scene_text_2
        paragraph: 6
        text: |-
          "¡No!" dice Daren. "¡No voy a renunciar al escudo! ¡He trabajado demasiado para aprenderlo! Prefiero renunciar a ese otro hechizo de protección antes que dejar de usar el escudo."

          "Como quieras", digo. "La protección contra el sueño de tu escudo es un poco más débil que la individual, eso sí."

          "¡No me importa!" dice Daren.

          "Bueno, mientras te asegures de que no haya más conflictos..." digo.

          Hago una pausa durante unos segundos.

          "Así que supongo que ahora soy el único que se ha quedado sin una protección decente contra hechizos de sueño, entonces..." digo.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch07a_dizziness
  - name: b2_ch07a_dizziness
    texts:
      - source: scene_text
        paragraph: 9
        text: |-
          "Bueno, técnicamente yo tampoco tengo ninguna protección mágica contra ellos", dice Hadrik. "Los gigantes son inmunes por naturaleza a los hechizos de sueño."

          "Los lessathi también son inmunes a los hechizos de sueño", dice Kate.

          "¿Lo son?" digo. "¿Y qué pasa con los medios lessathi?"

          "Ni idea", dice Kate. "Quizá seas solo medio inmune."

          "¿Medio inmune?" digo. "¿Cómo se supone que funcionaría eso? Oye, Illuna, ¿podrías probar a dormirme a mí también, para ver qué pasa?"

          Illuna suspira y se acerca a mí, tocándome el brazo con la mano derecha, igual que hizo con Daren. Unos segundos después, siento un mareo fuerte y todo a mi alrededor empieza a volverse borroso.
      - source: scene_text_2
        paragraph: 7
        text: |-
          "¡Maldita sea!" digo, mientras siento que el mundo gira a mi alrededor. "Para la diferencia que esto supondría en una pelea, casi es como si me hubieran dormido. Ya ni siquiera distingo arriba de abajo. ¿Qué está pasando ahora mismo? ¿Sigo de pie?"

          "Nah", dice Hadrik. "Estás sentado con el trasero en el suelo, agarrándote la cabeza con las dos manos."

          De repente, siento que mi mente se despeja otra vez y, al levantar la cabeza, veo a Illuna delante de mí con la mano sobre mi frente.

          "¿Qué has hecho?" le pregunto.

          "He lanzado un hechizo para curarte el mareo", dice Illuna, apartando la mano de mi frente. "También tengo un hechizo de 'protección contra mareos' que puedo lanzarte, si quieres. Dada tu inmunidad parcial a los hechizos de sueño, la protección contra mareos debería ayudarte tanto contra los hechizos de sueño como contra hechizos que intenten desorientarte. Sin embargo, también tiene una desventaja. Mientras lleves este hechizo encima, serás mucho más vulnerable a la magia de sugestión, ya que la claridad de tus pensamientos hará más fácil que alguien inserte ideas mágicamente en tu cerebro. Si te lanzo ahora el hechizo de protección, debería durarte unas cuantas semanas, pero no habría problema en volver a lanzártelo cada día o así, por si acaso."
    choices:
      - position: 1
        text: De acuerdo, entonces. ¡Adelante, lanza el hechizo!
        effects:
          - set:
              current_scene: b2_ch07a_adjustments
              b2_ch7_dizziness: 0
      - position: 2
        text: Paso. La verdad es que no me gusta nada la idea de ser vulnerable a la magia de sugestión.
        effects:
          - set:
              current_scene: b2_ch07a_adjustments
              b2_ch7_dizziness: 1
  - name: b2_ch07a_adjustments
    routes:
      - condition: b2_ch7_dizziness = 0
        texts:
          - source: scene_text
            paragraph: 10
            text: |-
              "De acuerdo, entonces. ¡Adelante, lanza el hechizo!"

              Illuna asiente y empieza a recitar una encantación mientras apunta las dos palmas hacia mí. Una vez termina de cantar, una luz blanca me rodea durante unos segundos y luego desaparece casi tan rápido como apareció.

              "Ya está", dice Illuna.

              "Genial", digo, levantándome del suelo. "Aunque claro, habría sido todavía más genial si el mago blanco de nuestro equipo pudiera lanzar algún tipo de hechizo de protección sobre alguien que no fuera él mismo. Ya sabes, algo así como lo que cualquier otro mago blanco existente es capaz de hacer."

              "¡No me fastidies!" dice Daren. "Ya te lo dije. Aprender las versiones de los hechizos que solo podía lanzarme a mí mismo era más fácil. Nunca tuve pensado trabajar en equipo durante mis viajes, así que me parecía una pérdida de tiempo aprender las versiones más avanzadas de los hechizos si nunca iba a tener ocasión de usarlas. La barrera que puedo lanzar con mi escudo siempre ha sido más que suficiente para proteger a civiles de cualquier daño durante ataques de monstruos. Y no es que pueda hacer un par de ajustes y cambiar los hechizos que ya conozco para que puedan lanzarse sobre otras personas. Tendría que aprender hechizos completamente distintos para que eso funcionara, y no tenemos tiempo para eso. Déjalo ya."

              "Oye, yo solo digo", digo, "que si de verdad hubieras decidido especializarte en un solo tipo de magia como todo el mundo en vez de ir a por encantamiento y magia blanca a la vez, esto no habría sido un problema."
          - source: scene_text_2
            paragraph: 8
            text: |-
              "Déjalo ya", dice Daren.

              "Vale, vale", digo. "Entonces ya terminamos aquí, ¿no? ¿Nos ponemos en marcha?"

              "Espera", dice Kate. "A Leila todavía tienen que encantarle la mochila nueva. No podemos ir cargando estas bolsas en las manos hasta el palacio."

              "Está bien", dice Daren. "Dame la mochila. La encantaré ahora mismo."

              Tan pronto como Daren termina con la mochila y Leila mete toda su ropa dentro, dejamos la zona del mercado y emprendemos otra vez el camino hacia el castillo de Thilias. Mientras andamos, empezamos a contarles a Kate y Leila todo lo que pasó con Eiden mientras ellas estaban de compras. También aprovecho para darles a todos más detalles sobre mi conversación privada con Eiden durante su hechizo de congelación del tiempo.
