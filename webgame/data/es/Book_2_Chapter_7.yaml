            paragraph: 20
            text: |-
              De repente recuerdo al lessathi que vino a visitarme a mi celda de retención, debajo de la arena, y el dispositivo que me dio. Entro en pánico y empiezo a palparme los bolsillos con ambas manos para ver si el aparato sigue ahí, pero me calmo al darme cuenta de que ya lo tiré de camino al castillo, porque no veía ninguna razón para seguir quedándomelo.

              "Bueno, eh..." dice Daren, mirando a Golmyck. "Creemos que hay algo que deberíamos contarles. Nos cruzamos con Eiden de camino al castillo, y nos dijo que poco antes del final de este torneo habrá una calamidad que destruirá todas las ciudades de Varathia. Una calamidad que se desencadenará por sus acciones. Sospechamos que podría acabar peleando con el dragón Tyrath, y que eso será lo que cause todos los daños."

              "Ya veo..." dice Golmyck, haciendo una breve pausa en su tarea de sellar los documentos para pensar en lo que dijo Daren. "Bueno, si esta calamidad es realmente de la magnitud que describen, no serviría de nada intentar reforzar nuestras defensas. La única forma de sobrevivir a algo así sería asegurarnos de que no llegue a ocurrir en absoluto. ¿Eiden les dijo que esta calamidad implicaría al dragón?"

              "No", dice Daren. "Pero dio a entender que destruir las ciudades no es su verdadero propósito, aunque su erradicación ocurriría debido a sus acciones. Una pelea entre él y el dragón es lo único que se nos ocurrió que encajaría dadas estas circunstancias."
          - source: scene_text_2
            paragraph: 13
            text: |-
              "Mmm..." dice Golmyck, mientras se acaricia la barbilla. "Hay algo que no termino de entender aquí. Quizá podrían aclarármelo. ¿Cuál es exactamente su relación con Eiden? Ha intervenido personalmente para salvarles la vida antes y veo que lo conocen lo bastante como para tener conversaciones privadas con él, pero no alcanzo a entender de qué manera están conectados con él. ¿Alguno de ustedes lo conocía de antes de venir a Varathia?"

              "No", dice Daren. "Todos lo conocimos aquí por primera vez."

              "Entonces, ¿por qué está tan obsesionado con ustedes y no con ninguno de los demás participantes?" dice Golmyck. "¿Seguro que no pueden ser el único grupo peculiar que se ha unido a este torneo?"
