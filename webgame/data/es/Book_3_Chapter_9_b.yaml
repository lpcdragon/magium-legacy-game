  - name: b3_ch09b_invent
    routes:
      - condition: b3_ch9_teleport <> 1
        texts:
          - source: scene_text
            paragraph: 14
            text: |-
              Como Flower todavía está presionando a rey del subsuelo con sus hechizos de fuego, me pongo en la postura requerida para lanzar mi hechizo de relámpago anterior y hago casi exactamente los mismos movimientos que hice antes, excepto por una pequeña diferencia en la forma en que giro mi mano izquierda que cambia el flujo de la magia por completo, permitiéndome lanzar un hechizo diferente.

              Peter está demasiado ocupado concentrándose en sus propios movimientos para notar la sutil diferencia, así que cuando lo señalo con el dedo y disparo el rayo, se compromete completamente a disipar y no mueve un músculo de su posición. La descarga eléctrica lo golpea de frente, e incluso quema parte de su escudo mágico, porque puedo verlo temblar durante unos segundos antes de que recupere la compostura.

              "¡Tú... me engañaste!" Peter dice, mientras pone su mano en su pecho y comienza a lanzarse un hechizo curativo. "¿Cómo lograste--"

              "¡Por el amor de Dios, Peter!" dice el rey del subsuelo, mientras todavía está bajo ataque de Flower. "¿El hombre literalmente te dijo que inventó esa técnica de disipación y lo siguiente que haces es usarla contra él otra vez? ¿En qué estabas pensando?"

              "¡Él no inventó nada!" Peter dice. "¡Es la técnica de Brinhorn, no la suya! ¡Está incluso en el nombre!"
          - source: scene_text_2
            paragraph: 13
            text: |-
              "Bueno, no me importa de quién recibió el nombre, simplemente no lo uses de nuevo, ¿de acuerdo?" dice el rey. "Eres un etéreo y un generalista. ¡Seguramente se te ocurren mejores maneras de enfrentarlo que simplemente cancelar sus hechizos de nivel principiante!"

              "Quizás tengas razón", dice Peter, mientras termina su hechizo de curación. "Déjame ver si puedo probar algo un poco más... abrumador".

              Luego comienza a mover sus manos muy rápidamente, mientras acumula una increíble cantidad de energía para su próximo hechizo. Inmediatamente lo reconozco como uno de los hechizos de fuego más complejos que puedes aprender de los manuales estándar, cuyo objetivo es invocar docenas de bolas de fuego que me seguirán sin importar a dónde vaya.

              Sin pensar, empiezo a lanzar el mismo hechizo al revés, para poder disiparlo. Siendo la primera vez que utilicé la técnica de disipación de múltiples pasos en combate, casi no lo logré, pero logré acelerar el ritmo hacia el final y apenas pude terminar mis movimientos, justo cuando las bolas de fuego comenzaban a formarse.

              Una vez que las bolas de fuego se desvanecen en el aire, decido aprovechar al máximo el entrenamiento que obtuve de Flower y lanzo tres hechizos de fuego uno tras otro en un intento de tomar a mi enemigo con la guardia baja.
