            paragraph: 12
            text: |-
              "¿Puedes intentar atacar al rey con una columna de fuego?" Le pregunto a Flower. "Tal vez eso sea suficiente para romper su concentración".

              "Está bien", dice Flower. "¡Lo estoy intentando ahora!"

              Mientras dice sus palabras, una columna de fuego comienza a formarse desde debajo del rey y tal como lo predije, se ve obligado a liberarnos de la caja para concentrar sus esfuerzos en reforzar su escudo de aura para poder defenderse de las llamas. Mientras tanto, aprovecho la distracción temporal del rey para golpear a Peter con el mismo hechizo de relámpago que usé al comienzo de la batalla.
