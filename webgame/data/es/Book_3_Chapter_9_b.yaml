            condition: b3_ch9_enemies != 0
          - source: scene_3
            paragraph: 22
            text: |-
              "Asegúrese de dejar Albert, Peter y rey del subsuelo para el final", dice Daren. "Queremos estar absolutamente seguros de que el Supervisor ha tenido tiempo suficiente para trasladarlos a sus celdas apropiadas antes de que despierten. Lo último que querríamos es tener que luchar contra ellos nuevamente el plano terrestre. Especialmente contra el rey".

              "Bueno, no creo que el rey y Peter necesiten ayuda para volver a sus mentes después de que se despierten en el Plano Etéreo, ¡pero intentaré dejar Albert para el final, como dijiste!" Flower le dice a Daren.

              "Bien", dice Daren. "Entonces, ¿están todos listos?"

              "Sí", la voz de Hadrik hace eco con más fuerza, como el resto de nosotros también confirmamos al mismo tiempo.

              "Entonces vámonos", dice Daren mientras avanza y los demás van a seguirlo. "Destino: palacio de Ollendor."
            condition: b3_ch9_enemies = 0
