  - name: b3_ch09b_balance
    texts:
      - source: scene_text
        paragraph: 27
        text: |-
          Mi sentido del equilibrio ha desaparecido por completo. Siento que estoy a punto de vomitar. Ni siquiera sabía que se podían tener estas sensaciones en un plano de existencia inmaterial como este.

          Dicho esto, Peter ha tenido la amabilidad de notificarme con anticipación qué hechizo iba a usar contra mí, así que no planeo traicionar sus expectativas. Recordando los hechizos exactos que lanzó Brinhorn para salir de esta situación en uno de sus duelos contra Azarius, comienzo haciendo que salgan llamas de mis manos, y luego uso mis palmas como hierros candentes para quemarme ambas mejillas durante unos segundos. Mientras lucho por soportar el dolor insoportable de mi cara quemada, rápidamente conjuro dos rocas en el aire a ambos lados de mí, y las uso para golpearme en la cara desde ambos lados, justo en las marcas de las quemaduras.

          Cuando termino con eso, creo un balde lleno de agua helada sobre mi cabeza y lo dejo caer encima de mí, empapando todo mi cuerpo en el líquido helado. Mientras todavía estoy temblando de frío, apunto hacia Peter con mi mano derecha y luego hago girar mi dedo índice en el sentido contrario a las agujas del reloj, mientras imagino unos tapones invisibles cayendo de sus oídos.
      - source: scene_text_2
        paragraph: 27
        text: |-
          "Asombroso..." dice Peter, con lo que parece ser un asombro genuino en su voz, mientras aplaude lentamente, mientras yo todavía intento evitar que mi cuerpo tiemble violentamente. "Estaba medio bromeando cuando te dije que estuvieras a la altura de las enseñanzas de tu antiguo mentor, pero nunca esperé que llegaras tan lejos. De hecho, reproduciste cada uno de los hechizos de Brinhorn desde el comienzo de esa batalla, incluida la rara variante de su técnica de disipación que usó para deshacerse de la protección de Azarius contra sus propios ataques sónicos".

          "Sí, b-bu-bueno, ¡yo fui quien le enseñó esa técnica de disipación después de todo!" Digo, haciendo lo mejor que puedo para parecer duro, aunque todavía estoy temblando como un loco por el frío.

          "Debo admitir que no pensé que lo harías, incluso si supieras los hechizos que necesitabas lanzar", dice Peter. "Verte infligirte tanto daño sin dudarlo de la misma manera que lo hizo Brinhorn en ese partido me hace preguntarme si parte de su locura te contagió o si de hecho fue al revés..."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch09b_versatile
  - name: b3_ch09b_versatile
    routes:
      - condition: b3_ch9_backup = 0
        texts:
          - source: scene_text
            paragraph: 28
            text: |-
              "Bueno, no es que tuviera muchas opciones al respecto", le respondo, habiendo finalmente dejado de temblar. "Ese ataque sónico que acabas de hacer es demasiado agudo para ser percibido por nuestros oídos, pero sus efectos son casi imposibles de disipar a menos que seas un mago blanco especializado y altamente capacitado. Esa es probablemente una de las razones por las que Azarius disfruta tanto de los hechizos sónicos. Son increíblemente versátiles y ridículamente difíciles de contrarrestar por medios normales. Es posible que Brinhorn no me haya dado muchas razones para admirarlo genuinamente durante el tiempo que pasamos juntos, pero diré que esta es una forma particular que eligió. contrarrestar el hechizo de Azarius fue nada menos que genialidad".

              "Fue, de hecho..." dice Peter, luciendo como si estuviera recordando un tiempo pasado. "Me sentí tan estúpido cuando lo vi en ese momento, y aun así fue tan efectivo, en su simplicidad. ¿Por qué molestarse en contrarrestar los efectos de un complicado hechizo de presión sonora que apunta directamente a tu oído interno y arruina tu sentido del equilibrio, cuando simplemente puedes usar métodos antiguos y probados que los enanos han estado usando para salir de sus estupores de borrachera durante cientos de años! Tengo que decir... ¡esa pelea fue realmente un espectáculo digno de contemplar!"
          - source: scene_text_2
            paragraph: 29
            text: |-
              "Me alegra mucho ver lo bien que se llevan", dice el rey del subsuelo en voz alta, desde la distancia, mientras todavía está ocupado construyendo barreras a su alrededor para defenderse de Flower, quien lo ataca desde todos los ángulos posibles, tratando de encontrar un punto débil en sus defensas, "pero tal vez podrías acelerarlo un poco, Peter?... Apenas puedo contener a esta chica etérea por mi cuenta con lo débil que es mi aura en este reino. Seguramente no querrás tener que luchar contra ella y Barry al mismo tiempo, ¿verdad?"

              "No, mi rey..." dice Peter. "Haré todo lo posible para acelerar las cosas por mi parte".

              "¿Y cómo planeas hacer eso exactamente?" Le pregunto a Peter. "Para que quede claro, tu truco con los tapones invisibles para los oídos no funcionará una segunda vez. Si quieres volver a lanzar ese hechizo sónico, será mejor que estés preparado para sumergirte en agua fría después".

              "¿Ya has olvidado que se supone que estamos recreando una de las batallas entre Brinhorn y Azarius?" Peter dice. "Apenas hemos recreado los primeros segundos de esa pelea hasta ahora. Hay mucho más que tenemos que hacer".
          - source: scene_3
            paragraph: 8
            text: |-
              "¿Has visto hasta dónde estoy dispuesto a llegar para reproducir los hechizos exactos de Brinhorn de esa pelea y todavía quieres continuar?" digo. "Me está resultando difícil saber si estás siendo estúpidamente valiente o simplemente estúpida".

              "Y me cuesta entender cómo puedes tener tanta confianza en tu victoria, cuando ya deberías saber muy bien quién ganó la pelea que ahora estamos copiando", dice Peter. "Te daré una pista. Es la misma persona que ha ganado cada vez desde que esos dos comenzaron a tener sus duelos".

              "El hecho de que estemos haciendo una recreación no significa que no pueda salirme del guión ni un poquito", digo. "No te preocupes, pronto podrás ver la fuente de mi confianza".

              "Veamos entonces", dice Peter, y luego comienza a atacarme de la misma manera que Azarius atacó a Brinhorn hace tantos años.
