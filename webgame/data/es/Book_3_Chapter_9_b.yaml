  - name: b3_ch09b_floating
    routes:
      - condition: b3_ch9_backup = 1
        texts:
          - source: scene_text
            paragraph: 39
            text: |-
              Justo antes de que pueda inmovilizarme contra el suelo con su manipulación del aura, el rey siente un intenso dolor de cabeza y la fuerza invisible sobre mí desaparece por completo. Cuando cambio mi atención al Plano Etéreo para ver qué sucedió, me doy cuenta de que el Supervisor ahora también se ha unido a la pelea, probablemente porque el rey ya no pudo mantenerlo contenido después de que todo el ir y venir entre los dos planos de existencia afectó su concentración.

              En lugar de involucrarlo en el mundo material, prefiero alejarme de él y concentrarme en derrotarlo en el plano de existencia no material donde tengo la ventaja. Cuando Flower, el Supervisor y yo lanzamos nuestros hechizos al rey al mismo tiempo, podemos ver claramente que sus barreras ya no pueden mantener el ritmo y, seguramente, unos momentos después logramos atravesar todas sus defensas. Un último rayo mío es todo lo que se necesita para que el rey se desmaye, lo que hace que también pierda el conocimiento el plano terrestre.

              Al mirar Peter y los cuerpos inconscientes del rey que están flotando en el éter, se me ocurre un pensamiento repentino. Si los matara ahora mismo, en este lugar, no habría evidencia en el plano terrestre que indique que yo soy el asesino. La mayoría de los rebeldes probablemente asumirían que murieron como resultado de la técnica de desplazamiento del alma del Supervisor. Si realmente los quisiera muertos, no habría mejor oportunidad que esta para deshacerme de ellos.
        effects:
          - set:
              is_dead: 0
        choices:
          - position: 1
            text: Mata a Peter y al rey del subsuelo.
            effects:
              - set:
                  current_scene: b3_ch09b_kill
                  b3_ch9_enemies: 1
                condition: is_dead = 0
          - position: 2
            text: Perdónales la vida.
