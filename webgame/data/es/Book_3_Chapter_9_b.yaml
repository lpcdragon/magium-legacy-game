  - name: b3_ch09b_adversary
    routes:
      - condition: b3_ch9_assassinate = 0
        texts:
          - source: scene_text
            paragraph: 29
            text: |-
              Ahora me encuentro rodeado por aproximadamente un centenar de Manticoras, que vuelan a mi alrededor desde todas direcciones, incluso directamente debajo de mí. Ya sé por la batalla entre Brinhorn y Azarius que se supone que la mayoría de estos son ilusiones, pero en la pelea original, cinco de los leones alados eran reales y Azarius también se escondía entre ellos, transformado en Manticora mientras esperaba el momento ideal para atacar.

              Al igual que en la batalla que estamos copiando, Peter ha logrado lanzar con éxito un hechizo de ilusión, un hechizo de invocación y un hechizo de cambio de forma casi simultáneamente, sin darme mucho tiempo para reaccionar. El hecho de que lograra lanzar los tres hechizos sin hacer ningún movimiento me tomó completamente por sorpresa. Debió haber estado preparando los hechizos en secreto mientras yo me distraía con nuestra conversación anterior.

              Desafortunadamente, si bien inicialmente pude rastrear cuáles eran los Manticoras reales y cuáles eran las ilusiones, se ha vuelto cada vez más difícil para mí diferenciarlos ya que han estado barajando sus posiciones constantemente durante los últimos veinte segundos. De manera similar a lo que hizo Azarius contra Brinhorn, Peter no tiene prisa por atacarme, porque sabe que cuanto más tiempo pase, más dudaré de cuál de los monstruos voladores debo defenderme y cuáles tendré que ignorar.
          - source: scene_text_2
            paragraph: 30
            text: |-
              Si intento las mismas tácticas que Brinhorn ahora, Peter seguramente estará preparado para ello y habré caído en una de sus trampas una vez más. Necesitaré tomarlo por sorpresa si quiero tomar ventaja en esta batalla.

              En lugar de esperar a que mi adversario dé el primer paso, vuelo a través del enjambre de Manticoras falsos y me dirijo directamente hacia Peter, a quien he estado monitoreando de cerca desde que cambió de forma. En mi camino hacia él, uno de los verdaderos Manticoras intenta interceptarme, pero rápidamente lo esquivo hacia un lado y luego sigo adelante, acercándome cada vez más a mi objetivo por segundos.

              Si puedo acercarme lo suficiente como para lanzarle un hechizo de parálisis antes de que vuelva a su forma humana, gano. Debería ser vulnerable en ese estado, porque el cambio de forma no ocurre instantáneamente. ¿O me atacará como Manticora? De cualquier manera, estoy listo para él. Vamos, Peter, ¿qué elegirás hacer?

              Justo cuando estoy dentro del alcance de lanzamiento de mi hechizo, la imagen del Manticora frente a mí desaparece y es reemplazada por Peter, quien ya me estaba apuntando con su propio hechizo de parálisis, que logra golpearme antes de que tenga tiempo de reaccionar. Aparentemente, Peter nunca había cambiado de forma en primer lugar, y solo estaba usando magia de ilusión para engañarme haciéndome pensar que lo hizo. Mientras intento en vano disipar el hechizo de parálisis sin moverme, Peter me lanza otro hechizo que me pone a dormir.
