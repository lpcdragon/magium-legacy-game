            condition: b3_ch9_element = 3
          - source: scene_3
            paragraph: 5
            text: |-
              Justo cuando pensaba que estaba tomando ventaja, sucede lo impensable y las bolas de fuego del hechizo anterior de Peter rápidamente comienzan a formarse a mi alrededor nuevamente, a pesar de mi exitosa disipación. Sabiendo que solo tengo unos segundos para alejarme de ellos, activo las corrientes de aire que permanecían dormidas a mi alrededor hasta ahora y salgo volando, tratando de poner la mayor distancia posible entre las bolas de fuego y yo.

              "No podrás dejarlos atrás", me dice Peter, mientras ahora estoy esquivando bolas de fuego a izquierda y derecha. "Ya que supiste cómo lanzar el hechizo al revés, asumo que también debes ser consciente de lo que hace. Esas bolas de fuego te seguirán hasta el final del Plano Etéreo si es necesario. No hay forma de detenerlas".

              Tiene razón. La única forma de contrarrestar este hechizo es disiparlo a tiempo o conjurar un escudo a mi alrededor que sea lo suficientemente poderoso como para resistir el impacto de cincuenta explosiones. No hay manera de que pueda construir una capa protectora de tierra o hielo que sea lo suficientemente duradera con los hechizos limitados que tengo a mi disposición. Esa es la razón por la que instintivamente traté de disiparlo. ¿Cómo no funcionó la disipación? Hice todo correctamente e incluso vi cómo se cancelaba el hechizo. Entonces, ¿por qué?... ¡¿Por qué estas bolas de fuego siguen siguiéndome?!
