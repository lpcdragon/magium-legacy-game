              Tenga en cuenta que este capítulo se dividirá en dos secciones separadas, pero solo habrá un punto de control, al comienzo del capítulo, para que aún pueda reiniciar el capítulo desde el principio en caso de que no haya guardado su juego allí manualmente.

              ----Resumen del capítulo anterior----

              Después de una feroz batalla en Plano Etéreo, Barry y sus amigos finalmente lograron derrotar a rey del subsuelo y Peter. Una vez que terminó la batalla, los drones del Supervisor se llevaron a todos los rebeldes inconscientes fuera del campo de batalla para encerrarlos en una prisión.

              Sin embargo, en lugar de enviar un dron de ojos verdes para hablar con Barry y su equipo, el Supervisor los convocó a todos al palacio real, sin darles otras opciones para contactarlo.

              De mala gana, Barry y los demás comenzaron a dirigirse hacia el castillo Ollendor, para poder tener una última discusión con el Supervisor sobre sus planes de gobernar la ciudad, ahora que los rebeldes ya no representaban un problema para él.
