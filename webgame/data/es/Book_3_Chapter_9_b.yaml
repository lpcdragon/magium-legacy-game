  - name: b3_ch09b_together
    routes:
      - condition: b3_ch9_element = 0
        texts:
          - source: scene_text
            paragraph: 19
            text: |-
              El primer ataque de Peter contra el Supervisor es crear una jaula de piedra a su alrededor para limitar su movimiento. El dron de ojos verdes, sin embargo, no se deja atrapar tan fácilmente y utiliza un spray de ácido para derretir los barrotes de la jaula en cuestión de segundos. Decido unirme al Supervisor, presionando un poco a Peter con algunos de los hechizos de fuego que practiqué con Flower, lo que rápidamente obliga a nuestro enemigo a centrar todos sus esfuerzos en tácticas defensivas.

              Justo cuando parece que finalmente estamos ganando ventaja en esta batalla, el dron del Supervisor queda atrapado en una caja semitransparente, similar a las que se usaron contra mí y Flower al comienzo de la pelea.

              "¡Mi señor, no debería esforzarse tanto!" Peter le dice al rey del subsuelo. "¡Prometo que lo tengo todo bajo control!"

              “Estoy bien”, dice el rey del subsuelo, en un tono algo cansado, mientras aún se defiende de los ataques de Flower con sus barreras. "No te preocupes por mí. Solo concéntrate en lidiar con Barry lo más rápido posible. Mientras sea solo una pequeña caja que contenga un dron, puedo manejarlo sin ejercer demasiada presión sobre mis barreras defensivas".

              "...Como desee, señor", dice Peter, y luego se gira hacia el Supervisor, comenzando a lanzar el hechizo de congelación que usó contra Flower y contra mí cuando también estábamos atrapados por el rey.
          - source: scene_text_2
            paragraph: 23
            text: |-
              Como podía adivinar qué hechizo iba a usar incluso antes de que comenzara a mover las manos, logré fácilmente lanzar el hechizo al revés y disiparlo antes de que pudiera terminar sus movimientos. Dicho esto, no hay forma de disipar la caja en sí, por lo que el dron todavía está atrapado, incluso si ya no está en peligro de muerte.

              "Desafortunadamente, el protocolo Supervisor no puede liberarse de su cautiverio ni lanzar hechizos fuera de la caja sin el uso de sus funciones experimentales", dice el dron de ojos verdes. "El Supervisor se disculpa por las molestias y espera que las circunstancias actuales no afecten negativamente la calificación que le darán en la encuesta de fin de mes".

              "¡No se preocupe, supervisor, lo tengo cubierto!" digo. "No importa qué hechizo lance mientras estás dentro de esa caja, estoy bastante seguro de que puedo disiparlo".

              Mientras digo estas palabras, Peter me mira largamente y se queda allí durante unos diez segundos, contemplando lo que he dicho.

              "¿Qué pasa, Peter?" digo. "¿Ya te rendiste?"

              "No..." dice Peter. "Pero creo que es seguro decir que quizás te haya estado subestimando un poco, hasta ahora. Después de pensar las cosas por un momento, me di cuenta de que eres, para todos los efectos, un mago y un generalista en este reino, y tal vez debería comenzar a tratarte como tal. Dime, Barry, ¿alguna vez has visto una pelea entre Brinhorn y Azarius?"
          - source: scene_3
            paragraph: 7
            text: |-
              "Sí, vi algunos de esos", digo. "Brinhorn siempre insistía en que fuera a ver sus partidos oficiales mientras todavía era su aprendiz".

              "Aprendiz bajo Brinh--" Peter comienza a decir, pero luego se interrumpe, cierra los ojos y comienza a masajearse la frente con los dedos. "No importa. No me importa si en realidad eras el aprendiz de ese hombre o no. El punto que estaba tratando de señalar es que cada vez que dos generalistas pelean, tienen una cierta forma de luchar que no es comparable a ningún otro tipo de peleas de magos. ¿Sabes de lo que estoy hablando?"

              "Quiero decir, sí, habría sido bastante difícil no ver la diferencia", digo.

              "Bien", dice Peter. "Solo tuve la oportunidad de ver uno de sus duelos, debido a lo increíblemente difícil que es obtener permiso para salir de Varathia como ciudadano Ollendor, pero ese duelo quedará grabado en mi mente para siempre".

              Mientras Peter habla, puedo sentir lentamente que el mundo entero comienza a girar a mi alrededor, como si acabara de tragarme una botella entera de cerveza enana.

              "Como antiguo aprendiz de Brinhorn, estoy seguro de que reconocerás inmediatamente la famosa batalla que estoy a punto de recrear ante tus ojos. Veamos si puedes estar a la altura de las enseñanzas de tu antiguo mentor".
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch09b_balance
