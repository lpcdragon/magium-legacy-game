  - name: b3_ch09b_struggle
    routes:
      - condition: b3_ch9_assassinate = 0
        texts:
          - source: scene_text
            paragraph: 33
            text: |-
              Si esta va a ser mi última resistencia, entonces será mejor que lo dé todo.

              Mientras lucho por soportar el dolor de cabeza, comienzo a lanzar una combinación de tres hechizos con patrones superpuestos que, si se hacen correctamente, deberían desatar una explosión de una sustancia parecida a un pegamento de secado rápido que restringirá en gran medida los movimientos de mi enemigo.
          - source: scene_text_2
            paragraph: 39
            text: |-
              Justo cuando estoy a punto de terminar de lanzar los hechizos, siento una fuerte náusea y pierdo la concentración por completo, lo que esencialmente hace que mi técnica sea cancelada.

              "No estoy seguro de lo que intentabas hacer, pero voy a asumir que se suponía que esta era tu técnica secreta", dice Peter. "Fui un tonto por ser tan cauteloso contigo hasta ahora. Que tengas una buena noche".

              "¿Qué quieres decir...?" Empiezo a decir, pero luego Peter me lanza un último hechizo e inmediatamente me pone a dormir.
