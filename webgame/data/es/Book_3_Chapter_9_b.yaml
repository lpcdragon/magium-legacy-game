      - condition: b3_ch9_enemies = 0 AND b3_ch9_backup = 0
        texts:
          - source: scene_text
            paragraph: 45
            text: |-
              Puede que ahora sean nuestros enemigos, pero hemos luchado codo a codo con ellos hasta hace poco. Realmente no quiero considerar matarlos a menos que no tenga otra opción en el asunto.

              "¡Uf!" Flower dice, mientras ahora está usando sus chorros de fuego para volar más cerca de mí. "Casi pensé que no lo lograríamos, por un segundo... ¡Buen trabajo, Barry!"

              "¿Eh?..." le pregunto, mientras estaba sumido en mis propios pensamientos y apenas escuchaba lo que decía. "Oh sí, gracias... ¡Tú también!"

              Luego espero unos segundos más antes de preguntarle qué es lo que realmente tengo en mente.

              "Dime... no tendrás idea de lo que deberíamos hacer con estos dos, ¿verdad?" Le pregunto a Flower mientras apunto hacia rey del subsuelo y Peter. "Quiero decir... no me importaría atarlos, pero no creo que eso sea de mucha ayuda. Ambos pueden lanzar técnicas poderosas sin moverse, por lo que probablemente podrían liberarse inmediatamente".

              "¿No podríamos simplemente pedirle al Supervisor que haga que sus drones los lleven a una celda de prisión antimagia en el plano terrestre?" Flower dice. "Estoy seguro de que no le importaría."

              "¡Oye, eso no es mala idea!" digo. "Probablemente debería preguntarle eso tan pronto como regrese al plano terrestre para siempre. Entonces... ¿supongo que ya terminamos aquí, entonces?"
