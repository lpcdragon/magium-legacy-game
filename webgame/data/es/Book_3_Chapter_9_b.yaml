  - name: b3_ch09b_impenetrable
    routes:
      - condition: b3_ch9_assassinate = 0
        texts:
          - source: scene_text
            paragraph: 7
            text: |-
              "Nadie está intentando matar a nadie. Lo único que queremos es derrotaros y poner fin a esta guerra".

              "¿Es eso así?" el rey del subsuelo dice. "En ese caso, consideraré esto como un combate amistoso entre dos antiguos aliados con opiniones diferentes. Ahora, entonces... pongamos a prueba esos poderes mágicos recién adquiridos, ¿de acuerdo?"
          - source: scene_text_2
            paragraph: 7
            text: |-
              Mientras termina su frase, el rey extiende sus brazos hacia nosotros y justo después Flower y yo somos rodeados por una caja hecha de paredes impenetrables semitransparentes, que se ven muy similares a las que estaba usando el subordinado elfo de Talmak. Antes de preguntarme qué está tratando de hacer el rey, el aire dentro de la caja comienza a volverse cada vez más frío, hasta el punto de que probablemente nos convertiríamos en estatuas congeladas si pasáramos más de medio minuto aquí.

              "Agárrate fuerte", me dice Flower, mientras me agarra del brazo. "Nos estamos teletransportando".

              Como de costumbre, una luz brillante nos rodea y nuestros cuerpos empiezan a vibrar fuertemente. Unos segundos más tarde, nos encontramos fuera de la caja, pero parece que tenemos un pequeño problema entre manos. Una nueva caja semitransparente se creó con la misma rapidez a nuestro alrededor, y el aire en su interior también está comenzando a congelarse a un ritmo rápido, probablemente como resultado de uno de los hechizos de Peter.
        choices:
          - position: 1
            text: Dile a Flower que nos teletransportar nos acerquen más al rey y Peter esta vez.
            effects:
              - set:
                  current_scene: b3_ch09b_blabbering
                  b3_ch9_teleport: 0
          - position: 2
            text: Dígale a Flower que debemos movernos en direcciones separadas tan pronto como teletransportar nuevamente.
            effects:
              - set:
                  current_scene: b3_ch09b_separate
                  b3_ch9_teleport: 1
          - position: 3
            text: Pregúntale a Flower si puede atacar al rey con una columna de fuego para romper su concentración.
            effects:
              - set:
                  current_scene: b3_ch09b_blabbering
                  b3_ch9_teleport: 2
      - condition: b3_ch9_assassinate = 1
        texts:
          - source: scene_text
            paragraph: 8
            text: |-
              "Por supuesto que estamos tratando de matarte. Eso es lo que te pasa por planear asesinarnos".

              "Veo que todavía estás haciendo todo lo posible para convertirme en el villano de esta historia", dice rey del subsuelo. "Una lástima, de verdad... Realmente esperaba que pudiéramos poner fin a nuestros desacuerdos de una manera más civilizada que esta".

              "¿Todavía quieres que me contenga cuando luche contra ellos, mi rey?" Peter pregunta.

              "Sólo si no pone su vida en peligro", dice el rey del subsuelo. "Si no crees que eso sea posible, entonces tienes mi permiso para hacer todo lo posible".

              "Ahora, entonces..." dice el rey del subsuelo, mientras se gira hacia mí. "Pongamos a prueba esos poderes mágicos tuyos recién adquiridos, ¿de acuerdo?"
          - source: scene_text_2
            paragraph: 7
            text: |-
