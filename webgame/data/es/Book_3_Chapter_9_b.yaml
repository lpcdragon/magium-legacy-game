          - source: scene_3
            paragraph: 6
            text: |-
              "¿Manipulación de la materia etérea?..." digo. "¿Te refieres a cuando puedes crear cosas a partir de la nada simplemente enfocando tu mente?"

              "Afirmativo", dice el supervisor. "Según mi análisis, el líder rebelde llamado Peter estaba tratando de engañarte convirtiendo materia etérea en bolas de fuego y haciendo que pareciera que su hechizo anterior no había sido cancelado. En realidad, todas las bolas de fuego estaban siendo controladas por él manualmente, y ninguna de ellas te seguía automáticamente".

              "Entonces es por eso que no estaba lanzando ningún otro hechizo mientras yo estaba siendo perseguido por las bolas de fuego..." digo. "¡Es porque ya estaba usando toda su concentración para controlar cada bola de fuego individual con su mente!"

              "Tú..." dice Peter, mientras señala hacia el Supervisor. "¡Eres sólo una máquina! ¡¿Cómo te atreves?!"

              "Para cualquier queja, consulte la sección 5C-E789 del manual de funcionamiento del Supervisor", le dice el Supervisor a Peter.

              "¿Te estás burlando de mí?" Peter dice. "¡Es posible que de alguna manera hayas impedido que manipulara la materia etérea, pero aún puedo lanzar todos mis hechizos! ¡Te arrepentirás de esto!"

              "El protocolo del Supervisor no posee la capacidad de arrepentirse o arrepentirse de ninguna de sus acciones pasadas", dice el Supervisor. "Lo único que soy capaz de hacer es analizar mis errores y aprender de ellos".

              "¡Ya he oído suficiente!" Peter le dice al Supervisor. "Puedes aprender y analizar todo lo que quieras después de disolverte en éter. ¡Prepárate para morir!"
