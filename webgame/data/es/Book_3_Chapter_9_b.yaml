              current_scene: b3_ch09b_freezing
  - name: b3_ch09b_counter
    texts:
      - source: scene_text
        paragraph: 26
        text: |-
          En lugar de intentar contrarrestar su hechizo, decido esperar y prestar mucha atención a lo que está haciendo mi enemigo. Sé que esto es arriesgado, pero mi instinto me dice que está intentando engañarme de nuevo, de alguna manera.

          Mientras observo de cerca a Peter, hay una cosa en él en particular que me parece extraña. Está tratando de hacer que parezca que me está mirando directamente, pero sigue lanzando breves miradas a algo debajo de mí de vez en cuando mientras lanza su hechizo. Cuando también miro debajo de mí, para ver en qué estaba tan preocupado, noto cuatro cuerdas que se hacen cada vez más largas y se mueven hacia mí.

          "¡Bastardo!" Le digo a Peter, mientras hago algunos movimientos rápidos con mis manos y luego envío una ráfaga de llamas para quemar todas las cuerdas. "Estabas tratando de engañarme otra vez, ¿no? ¡Estabas fingiendo el hechizo de lluvia helada para poder distraerme y atarme con las cuerdas! ¿Crees que soy estúpido o algo así?"

          "No", dice Peter, mientras deja de pretender lanzar el hechizo de lluvia de hielo. "Pero esperaba que al menos te tomaras unos segundos más para descubrirlo. Creo que es seguro decir que te he estado subestimando un poco. Para todos los efectos, eres un mago y un generalista en este reino, y debería tratarte como tal. Dime, Barry, ¿alguna vez has visto una pelea entre Brinhorn y Azarius?"
