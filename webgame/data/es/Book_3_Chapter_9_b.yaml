  - name: b3_ch09b_mistake
    routes:
      - condition: b3_ch9_assassinate = 0
        texts:
          - source: scene_text
            paragraph: 30
            text: |-
              Ahora que ya no tengo que preocuparme por perder de vista al Manticoras convocado, finalmente puedo concentrarme en ganar esta batalla.

              Por lo que recuerdo, a Brinhorn le fue bien durante la mayor parte de esta pelea, y el único error real que cometió fue hacia el final, así que debería estar bien que copie sus hechizos hasta entonces, ¿verdad? Veamos... El siguiente fue un hechizo que aumenta ligeramente mis reflejos. Si no recuerdo mal, los movimientos necesarios para este son... oye, espera un minuto, ¿por qué Peter de repente se lanza hacia mí? Eso no es lo que hizo Azarius. ¿No sabe que se está convirtiendo en un blanco fácil al atacarme así? No puede volver instantáneamente a su forma humana, por lo que será muy vulnerable durante ese tiempo. ¿O planea atacarme en su forma Manticora? No importa de ninguna manera. Si así es como quiere jugar, entonces lo golpearé con un hechizo de parálisis tan pronto como esté dentro del alcance, y ese será el final.
          - source: scene_text_2
            paragraph: 32
            text: Al ver que Peter todavía se dirige directamente hacia mí, me pongo en posición y preparo mi ataque, apuntando al área de su pecho. Justo cuando disparo mi hechizo, la imagen del Manticora frente a mí desaparece y es reemplazada por Peter, quien aparentemente nunca había cambiado de forma en primer lugar, y solo usó magia de ilusión para hacerme pensar que lo hizo. La discrepancia entre la posición de su cuerpo real y la de su cuerpo falso Manticora me hace fallar mi tiro, y antes de que tenga la oportunidad de recuperarme, Peter me golpea con su propio hechizo de parálisis, seguido de un hechizo de sueño, haciéndome perder el conocimiento poco después.
