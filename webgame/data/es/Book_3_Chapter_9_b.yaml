      - condition: b3_ch9_backup = 0 AND toughness >= 4
        texts:
          - source: scene_text
            paragraph: 41
            text: |-
              La fuerza invisible sobre mí me inmoviliza contra el suelo, haciéndome imposible mover nada más que la cabeza y el cuello. Mientras lucho por liberarme de la técnica de manipulación del aura, siento el equivalente a una roca invisible que se estrella contra la parte posterior de mi cabeza, probablemente también como resultado de la técnica del aura del rey.

              El golpe fue poderoso, pero no lo suficientemente fuerte como para noquearme, gracias a todos los niveles que puse en mi estadística de dureza. Cuando el rey ve que todavía estoy despierto, intenta golpearme una vez más con un golpe más poderoso, pero lo detienen dos largos látigos de agua que se enrollan alrededor de sus brazos y lo empujan hacia atrás.

              Tan pronto como la fuerza invisible sobre mí se debilita, logro liberarme y vuelo a un lugar que está fuera del alcance de ataque del rey.

              "Mis disculpas por la intervención tardía", me dice Illuna en voz alta, mientras todavía sostiene al rey en su lugar con sus látigos. "No esperaba que ustedes dos regresaran al plano terrestre tan pronto".
          - source: scene_text_2
            paragraph: 46
            text: |-
              "Todavía no hemos terminado de pelear en el Plano Etéreo", le digo. "Es solo que somos conscientes en ambos planos de existencia por el momento. ¿Puedes seguir abrazándolo así mientras continuamos nuestra lucha en el otro reino?"

              "...No", dice Illuna, mientras observa al rey destruir fácilmente sus látigos con una explosión de su aura. "Pero puedo mantenerlo algo distraído, si eso es lo que necesitas".

              Luego salta más atrás del rey y arroja dos grandes Serpientes hechas de agua al suelo, que rápidamente se deslizan hacia él e intentan enrollarse alrededor de él. Cuando rey del subsuelo también destruye a estas Serpientes, se rompen en un millón de gotas de agua que luego se reagrupan nuevamente en sus formas originales Serpiente y una vez más comienzan a atacarlo.

              Como era de esperar, el rey está teniendo dificultades para defenderse en ambos planos de existencia al mismo tiempo y, finalmente, sus barreras del Plano Etéreo ceden bajo la presión de nuestros implacables ataques. Un último rayo mío es todo lo que se necesita para que el rey se desmaye, lo que hace que también pierda el conocimiento el plano terrestre.
