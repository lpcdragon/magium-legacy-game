  - name: b3_ch09b_engagement
    routes:
      - condition: b3_ch9_teleport <> 1
        texts:
          - source: scene_text
            paragraph: 16
            text: |-
              "Mi análisis indica que estás teniendo problemas con tu compromiso actual", escucho de repente la voz del Supervisor a mi lado. "¿Necesita ayuda?"

              Cuando giro la cabeza hacia la derecha, veo que el dron de ojos verdes del Supervisor ahora me sigue, mientras simultáneamente evita cada una de las bolas de fuego sin ningún tipo de esfuerzo.

              "¡Sí!" Grito, mientras hago un giro brusco hacia la izquierda y casi evado tres bolas de fuego que corrían hacia mí al mismo tiempo. "¡Necesito ayuda! ¡Dame ayuda!"
          - source: scene_text_2
            paragraph: 17
            text: |-
              "Solicitud confirmada", dice el dron Supervisor, mientras continúa deslizándose graciosamente entre las bolas de fuego sin ninguna preocupación en el mundo. "Ahora iniciando el procedimiento de rescate. Tenga en cuenta que el protocolo del Supervisor actualmente no puede usar sus procedimientos experimentales diseñados para el Plano Etéreo, debido al alto riesgo de poner en peligro a uno o más miembros del grupo llamado 'Felran, el elementalista de fuego más fuerte en el Continente Oriental'. Si desea presentar una queja sobre la ineficiencia del Supervisor, le pedimos cortésmente que consulte la sección 5C-E789 del manual operativo del Supervisor. Gracias por su comprensión."

              "¡Está bien, lo entiendo!" digo. "¡No necesito los procedimientos experimentales! ¡Sólo haz algo! ¡Cualquier cosa!"

              "Reconocido", dice el Supervisor. "Los procedimientos experimentales están ahora en suspenso hasta nuevo aviso. El procedimiento de rescate comenzará en T-menos cinco segundos. ¡Que tengas un día agradable!"

              Poco después de que el Supervisor deja de hablar, una luz verde envuelve toda el área del campo de batalla, y luego todas las bolas de fuego que me seguían desaparecen en un instante, dejándonos a Peter y a mí sin palabras.

              "¿Cómo... cómo diablos lograste disipar un hechizo tan complejo después de que ya había sido lanzado?..." le pregunto al Supervisor, sorprendido.

              "Su interpretación de los acontecimientos que ocurrieron es en parte incorrecta", dice el Supervisor. "De hecho, el protocolo del Supervisor no disipó nada. Simplemente aproveché mis conocimientos adquiridos en el Magium para desactivar todo tipo de manipulación de materia etérea en esta área general".
            condition: b3_ch2_name = 0
          - source: scene_text_2
            paragraph: 18
            text: |-
              "Solicitud confirmada", dice el dron Supervisor, mientras continúa deslizándose graciosamente entre las bolas de fuego sin ninguna preocupación en el mundo. "Ahora iniciando el procedimiento de rescate. Tenga en cuenta que el protocolo Supervisor actualmente no puede utilizar sus procedimientos experimentales diseñados para el Plano Etéreo, debido al alto riesgo de poner en peligro a uno o más miembros del grupo llamado 'Dave el Degollador'. Si desea presentar una queja sobre la ineficiencia del Supervisor, le pedimos cortésmente que consulte la sección 5C-E789 del manual operativo del Supervisor. Gracias por su comprensión".

              "¡Está bien, lo entiendo!" digo. "¡No necesito los procedimientos experimentales! ¡Sólo haz algo! ¡Cualquier cosa!"

              "Reconocido", dice el Supervisor. "Los procedimientos experimentales están ahora en suspenso hasta nuevo aviso. El procedimiento de rescate comenzará en T-menos cinco segundos. ¡Que tengas un día agradable!"

              Poco después de que el Supervisor deja de hablar, una luz verde envuelve toda el área del campo de batalla, y luego todas las bolas de fuego que me seguían desaparecen en un instante, dejándonos a Peter y a mí sin palabras.

              "¿Cómo... cómo diablos lograste disipar un hechizo tan complejo después de que ya había sido lanzado?..." le pregunto al Supervisor, sorprendido.

              "Su interpretación de los acontecimientos que ocurrieron es en parte incorrecta", dice el Supervisor. "De hecho, el protocolo del Supervisor no disipó nada. Simplemente aproveché mis conocimientos adquiridos en el Magium para desactivar todo tipo de manipulación de materia etérea en esta área general".
