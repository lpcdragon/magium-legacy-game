  - name: b3_ch09b_elephant
    texts:
      - source: scene_text
        paragraph: 47
        text: |-
          Una luz blanca que es diferente a la que forma el éter nos envuelve a mí y a Flower, y luego ambos somos teletransportados a una ubicación diferente que se ve exactamente igual que la anterior. Mientras miro alrededor del interminable mar de luz para ver si puedo detectar algún cubo grande, de repente siento que la fuerza que me empujaba de regreso a mi santuario se magnifica cien veces.

          "Está bien, definitivamente estamos más cerca, pero todavía no veo el cubo", le digo a Flower. "Puedo sentir que me empujan en la misma dirección que antes, pero ahora es como si fuera un elefante el que intentara arrastrarme, no un perro pequeño".

          "Un elefante..." dice Flower. "Eso significa que tu santuario debería estar relativamente cerca. Sigamos volando en esa dirección hasta que..."

          Mientras Flower habla, su voz se va ahogando gradualmente por los millones de voces que ahora inundan mi mente, junto con imágenes que cambian rápidamente y que parpadean frente a mis ojos a una velocidad demasiado alta para que pueda decir de qué se tratan.

          Todas las voces se superponen, pero en su mayoría solo usan palabras diferentes para decir lo mismo:
      - source: scene_text_2
        paragraph: 50
        text: |-
          '¡Deja este lugar!'

          '¡Salir!'

          "Tú no perteneces aquí".

          Intento taparme los oídos, pero no tiene ningún efecto. Todas las voces provienen del interior de mi cabeza y cada vez son más fuertes. Después de quince segundos más de esto, las imágenes dejan de parpadear y mi conciencia comienza a entrar y salir entre lo etéreo y plano terrestre nuevamente. Mientras todavía estoy luchando por recuperar la compostura, todas las voces se detienen al mismo tiempo. Todos excepto uno: la voz que había escuchado mientras todavía peleábamos Peter y el rey del subsuelo.

          "Te habían advertido", me dice simplemente la voz, y luego mi conciencia oscila entre ambos planos de existencia mil veces en un solo segundo, mientras siento como si mi alma estuviera siendo arrancada por la fuerza de mi cuerpo.

          Hace frío. Muy frio. Mis pensamientos son todos un revoltijo. Un cansancio extremo ahora se apodera de mí al sentir como la esencia misma de mi ser se desvanece lentamente, junto con mi cuerpo imaginado desde el Plano Etéreo, que se vuelve más transparente a cada momento que pasa.

          "-¡arry!" Escucho la voz de Flower como si fuera un recuerdo lejano. "¡Barry, mírame a los ojos! ¡Mírame! ¡¡¡Barry!!!"
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch09b_visualize
  - name: b3_ch09b_visualize
    texts:
      - source: scene_text
        paragraph: 48
        text: |-
          Con lo que parece ser el último gramo restante de mi fuerza de voluntad, logro enfocar mi mirada en Flower, quien actualmente me sostiene por los hombros mientras sus llameantes ojos rojos brillan más que nunca. Al mirarla mejor, veo que no solo sus ojos están en llamas, sino que todo su cuerpo ahora está hecho enteramente de fuego... O más bien, el tipo de fuego que se siente caliente pero que por alguna razón no me quema, a pesar de que ella me está tocando directamente con él.

          "Barry, necesito que pienses en cómo era el interior del cubo", dice Flower en voz alta. "Necesito que lo visualices claramente dentro de tu cabeza. ¿Entiendes?"

          "Sí..." digo, con mi voz apenas más fuerte que un susurro.

          Tal como ella me pidió, trato de recordar cada pequeño detalle que puedo del lugar llamado mi 'santuario', y luego lo recreo dentro de mi cabeza. Luego cierro los ojos para poder ver la imagen en mi mente con mayor claridad.

          "Me lo estoy imaginando ahora..." le digo a Flower, con la misma voz débil de antes.
      - source: scene_text_2
        paragraph: 51
        text: |-
          "¿Tienes una imagen clara de ello?" Flower dice, con voz de pánico. "¿Estás seguro?"

          "Sí, sí", le digo con los ojos todavía cerrados. "Lo miro mientras te hablo. ¿Qué hago ahora?"

          Ya no puedo ver mi cuerpo desde Plano Etéreo porque tengo los ojos cerrados, pero puedo decir que solo se ha vuelto más transparente desde que comencé a hablar con Flower. ¿Me pregunto cuantos segundos más me quedan por vivir?...

          "-¡arry!" Flower dice, mientras empiezo a entrar y salir de la conciencia, captando solo fragmentos de lo que ella me está diciendo. "Escúchame con atención, no hay tiempo, pase lo que pase, ¡abre los ojos! ¡¿Me escuchas?! Barry-- ¡¡¡te estoy perdiendo! ¡¡¡Barry!!!"
      - source: scene_3
        paragraph: 18
        text: |-
          Es difícil saberlo con los ojos aún cerrados, pero creo que estoy envuelto nuevamente por la luz blanca del hechizo de teletransportación de Flower. ¿Está intentando enviarme de regreso a mi santuario? ¿Será por eso que me pidió que lo imaginara dentro de mi cabeza?

          Mientras continúo visualizando el cubo vacío en mi mente, la luz brillante tanto del hechizo teletransportación como del éter desaparece, y lo único que puedo ver a través de mis párpados es oscuridad total. ¿Significa esto que teletransportación fue exitoso? No puedo decir si mi cuerpo ha vuelto a la normalidad o no. Aparte de que la luz desaparece, todavía me siento débil y no parece que haya cambiado mucho.

          El silencio a mi alrededor es ensordecedor. La anticipación me está matando. ¿Me teletransporté correctamente o no? ¡Tengo que saberlo!
    choices:
      - position: 1
        text: Abre mis ojos.
        effects:
          - set:
              current_scene: b3_ch09b_open
              ac_b3_ch9_consolation: ac_b3_ch9_consolation + 1
      - position: 2
        text: Mantén mis ojos cerrados.
        effects:
          - set:
              current_scene: b3_ch09b_positive
  - name: b3_ch09b_open
    texts:
      - source: scene_text
        paragraph: 49
        text: |-
          Abro los ojos, pero para mi sorpresa no es sólo la luz lo que se ha ido a mi alrededor, sino también todo lo demás. Lo único que veo ante mis ojos es pura oscuridad.

          "Flower, ¿estás ahí?" Intento decirlo, pero mis palabras no salen de mi boca.

          Después de intentar hablar unas cuantas veces más, la debilidad y el cansancio poco a poco se apoderan de mí y pronto ya no tengo fuerzas ni para abrir la boca. Varios segundos después, me encuentro cerrando los ojos nuevamente, pero esta vez pierdo el conocimiento para siempre.
    choices:
      - position: 1
        text: Reiniciar juego
        effects:
          - set:
              current_scene: ch1_intro1
              storyboard_controls: Jump to frame "Chapter 1"
      - position: 2
        text: Cargar desde el último punto de control
        effects:
          - set:
              chapter_load: 1
              storyboard_controls: Jump to frame "Save load game"
      - position: 3
        text: Cargar partida
        effects:
          - set:
              storyboard_controls: Jump to frame "Save load game"
  - name: b3_ch09b_positive
    texts:
      - source: scene_text
        paragraph: 50
        text: |-
          Justo cuando estoy a punto de abrir los ojos, recuerdo la advertencia de Flower antes de que me teletransportara.

          "--no importa qué-- ¡abre los ojos!" fueron las palabras que la escuché decir.

          La frase no está completa, pero según la estructura de la oración, se siente como si estuviera diciendo algo como "pase lo que pase, no abras los ojos".

          No puedo estar seguro de esto, pero ella me dijo que debía seguir visualizando el cubo y nunca me dijo cuándo detenerme. Todavía tengo la imagen del cubo frente a mí en este momento, así que supongo que probablemente debería seguir pensando en ello. Esto es lo único de lo que debería preocuparme. Nada más importa. Sigue imaginando el cubo.

          Pasa un minuto entero sin que yo haga nada más que concentrarme en la imagen del santuario que tengo en mi cabeza. O al menos creo que ha pasado un minuto. Es un poco difícil mantener la cuenta del tiempo en esta completa oscuridad.

          Está bien. No hay necesidad de abrir los ojos. Todavía estoy consciente por ahora y esto es todo lo que importa. Hace un minuto, podría haber jurado que solo me quedaban unos segundos de vida, pero de alguna manera sigo aquí. Todavía estoy despierto. Lo que sea que hizo Flower, debe haber tenido al menos algún efecto positivo, o de lo contrario no estaría vivo.
      - source: scene_text_2
        paragraph: 52
        text: |-
          Mientras todavía estoy esperando que algo suceda, de repente me siento empapado de pies a cabeza en agua helada, y cuando instintivamente salto, rápidamente me doy cuenta de que ahora hay tierra bajo mis pies, y ya no siento como si estuviera flotando en una oscuridad sin fin como antes. La lluvia cae a cántaros por mis mejillas, el sonido de un relámpago resuena a lo lejos y el viento sigue soplando, aunque no con tanta fuerza como al principio de la tormenta.

          ¿Es esto?... ¿Finalmente he vuelto al plano terrestre para siempre?

          "¿Estás planeando abrir los ojos pronto o esperas que te hable así?..." Escucho la voz de Flower, hablando en el tono de Illuna.

          Cuando finalmente abro los párpados, veo que Flower está parado frente a mí con ojos llameantes en este plano de existencia también, excepto que las llamas son azules, porque Illuna es quien está hablando. Sin embargo, su cuerpo no está formado por llamas como en Plano Etéreo.

          Todas las conexiones que tenía con Plano Etéreo ya no existen. Aunque estoy intentando cambiar mi conciencia al otro reino, ya no funciona. ¿Podría ser este el resultado de que mi alma finalmente regrese a mi santuario el Plano Etéreo?
      - source: scene_3
        paragraph: 19
        text: |-
          "Había esta... oscuridad", le digo a Illuna. "Me sentí similar al vacío en el que el Magium me hizo flotar cuando casi me borró del mundo, excepto que esta vez todavía tenía mis recuerdos y mi identidad intactos. Espera, no, eso no está bien... También había algo más diferente en esto... la nada en la que estaba. Realmente no pude verlo porque tuve los ojos cerrados todo el tiempo, pero la oscuridad a mi alrededor parecía casi... opresiva. Como si estuviera tratando de tragarme por completo. ¿Tienes alguna idea? ¿Qué pudo haber pasado?"

          "Ah, eso es lo que hizo Flower", dice Illuna. "Tenía algunas sospechas bastante fuertes, pero apenas pude obtener algún tipo de información coherente de ella a través de nuestro enlace telepático cuando hablé con ella antes. Probablemente debería hacerle saber que no terminó matándote por accidente antes de que se dé un ataque al corazón por pura ansiedad".

          "¿Ella pensó que podría haberme matado?..." Pregunto, en un tono incómodo. "Espera, ¿qué hizo ella?"

          En lugar de responderme, Illuna levanta dos dedos en el aire frente a mí, indicándome que guarde silencio mientras ella habla telepáticamente con Flower en el Plano Etéreo. Una vez que termina, baja la mano para que podamos reanudar nuestra conversación.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch09b_eyelids
  - name: b3_ch09b_eyelids
    routes:
      - condition: b3_ch9_backup = 0
        texts:
          - source: scene_text
            paragraph: 51
            text: |-
              "Está bien, Flower se ha calmado por ahora", dice Illuna. "¿De qué estábamos hablando otra vez? Ah, claro, la oscuridad. Bueno, no hay mucho que decir al respecto, en realidad. La oscuridad es la ausencia de luz. La luz del Plano Etéreo es el éter mismo. El éter fue quien te atacó, así que Flower decidió teletransportar en el único lugar donde estarías realmente a salvo de él. Sin embargo, la única manera de salir del abismo etéreo es imaginar un lugar muy claramente en tu cabeza y estar firmemente convencido de que puedes transportarte allí a través de tus propios poderes. Al ver que ya no respirabas en el plano terrestre, supuse que habías fallado en tu tarea, así que tuve que ser un poco creativo".

              Luego extiende su palma y conjura una esfera flotante de agua sobre ella, insinuando que ella fue la razón por la cual el agua en la que estaba empapado era tres veces más fría que las gotas de lluvia de la tormenta.

              "Wow..." le digo. "No sé qué decir. Gracias. Y Flower. No tengo idea de qué habría pasado si ustedes dos no hubieran intervenido de la forma en que lo hicieron. ¿Cómo se les ocurrieron estas ideas?"

              "...Experiencia", dice Illuna. "Y un poco de ingenio. Digamos que esta no es la primera vez que hemos tenido que hacer uso del abismo etéreo, y probablemente tampoco será la última. Ahora, si me disculpan, tengo que verificar el Flower. Todavía quedan algunos asuntos sin resolver en el Plano Etéreo de los que debemos encargarnos".

              "Espera, ¿Flower está bien?" pregunto. "No puedo volver a cambiar mi conciencia al Plano Etéreo para comprobarlo. ¿Logró escapar del éter?"
          - source: scene_text_2
            paragraph: 53
            text: |-
              "Flower está... bien", dice Illuna. "Por ahora, al menos. No estoy del todo seguro, pero es posible que su reciente transformación la esté protegiendo del éter de alguna manera. Es un poco difícil especular sin conocer más detalles sobre esta nueva forma suya. De todos modos, ya vuelvo".

              Mientras Illuna vuelve a concentrarse en Plano Etéreo, dejando que el cuerpo de Flower mire al frente con una mirada vacía, decido dar un pequeño paseo por el campo de batalla para ver cuál es la situación.

              Se siente extraño no poder ver más la perspectiva de mi alma desde el Plano Etéreo, después de todo lo que pasó. Aunque sé con certeza que todas las cosas que he experimentado en ese plano de existencia fueron reales, todavía no puedo deshacerme de la sensación de que acabo de despertar de un sueño muy largo.

              Ojalá hubiera podido explorar más ese mundo. Ojalá hubiera podido probar mis hechizos más. Me pregunto si alguna vez tendré la oportunidad de ver ese lugar nuevamente...
          - source: scene_3
            paragraph: 20
            text: |-
              Mientras estoy ocupado buscando cualquier tipo de ataduras para sujetar a los rebeldes inconscientes, varias docenas de drones de ojos rojos repentinamente pululan por el área de la nada, con largas puntas de metal saliendo de sus lados inferiores que están usando para sostener algunas camillas. Una vez que bajan su altitud, los drones siguen sujetando las camillas desde ambos lados, mientras que otros drones ayudan a subir a los rebeldes sobre ellas. Tan pronto como un rebelde ha sido colocado con éxito en una camilla, los dos drones que sostienen la camilla la levantan en el aire y abandonan la plaza, mientras se unen nuevos drones con camillas adicionales para llevarse al resto de las tropas del rey del subsuelo.

              "El protocolo Supervisor se encargará de las cosas desde aquí", dice un dron de ojos rojos, mientras desciende en algún lugar cercano a mí. "Gracias por su cooperación. El protocolo del Supervisor también quisiera emitir una disculpa formal a su grupo por teletransportar accidentalmente sus almas fuera de sus mentes desde el Plano Etéreo. Desafortunadamente, la técnica que se usó aún era experimental y terminó afectando toda el área del campo de batalla en lugar de solo a los rebeldes. Si necesita ayuda o desea discutir más detalles sobre su alianza con el Supervisor, incluidos sus planes futuros para Ollendor, un dron de ojos verdes lo estará esperando dentro del palacio. ¡Que tenga un buen día!"

              "Oye, espera, ¿a dónde llevas a los rebeldes?" Digo, pero el dron de ojos rojos no parece ser lo suficientemente inteligente como para responder ninguna pregunta, por lo que simplemente se va volando y abandona la plaza después de haber entregado su mensaje.
