      - condition: b3_ch9_backup = 1
        texts:
          - source: scene_text
            paragraph: 10
            text: |-
              "Intentemos movernos en direcciones separadas después de teletransportar nuevamente", le digo a Flower en voz baja. "No creo que pueda mantener dos cajas al mismo tiempo con su técnica de aura".

              "Está bien", dice Flower. "¡Prepararse!"

              Al igual que antes, Flower me agarra del brazo y luego salimos teletransportar afuera, pero esta vez ambos nos alejamos para que ya no quedemos atrapados dentro de la misma caja. Lamentablemente, mi predicción fue completamente errónea, porque el rey logra fácilmente atraparnos en dos cajas separadas, y ahora Peter también está congelando el aire dentro de ellas nuevamente, sin muchos problemas.

              Al ver lo sucedido, Flower entra en pánico y rápidamente se teletransporta dentro de mi caja, agarrando mi brazo nuevamente para luego teletransportarnos afuera, pero apenas me suelta, le da un poderoso dolor de cabeza que casi la hace desmayarse.

              "Flower, ¿qué pasó?" Le pregunto.

              "Yo... creo que me excedí un poco con el teletransporte...", dice. "Dame un minuto... estoy tratando de recuperarme".

              "Me temo que no tienes ni un minuto", dice el rey del subsuelo, mientras nos atrapa nuevamente dentro de una caja semitransparente y Peter comienza a congelar el aire dentro de ella. "Es decir... a menos que tu amigo Barry pueda sacar otro conejo de su sombrero y crear su propio hechizo teletransportación en los próximos quince segundos, por supuesto. Tengo que admitir que nada viniendo de él me sorprendería ya en esto--"
          - source: scene_text_2
            paragraph: 9
            text: |-
              Antes de terminar su frase, el rey del subsuelo es atacado por un poderoso rayo de fuego y se ve obligado a liberarnos de la caja para concentrar todos sus esfuerzos en reforzar el escudo de aura que lo rodea.

              Mientras Flower y yo nos alejamos del aire helado, vemos que quien atacó al rey fue el Supervisor, quien finalmente decidió dejar de mirar y unirse a la batalla también.

              "Mis disculpas por no haberte ayudado antes", dice el Supervisor. "No estaba seguro de si su situación actual era parte de su plan o si realmente necesitaba ayuda".

              "Está bien", le digo al supervisor, mientras todavía estoy recuperando el aliento. "Sigue haciendo lo que estás haciendo. No le des tiempo a rey del subsuelo para defenderse".

              "Entendido", dice el supervisor.

              Mientras el Supervisor mantiene su rayo de fuego apuntando a rey del subsuelo y Flower todavía se está recuperando, decido volver a unirme a la pelea golpeando a Peter con el mismo hechizo de relámpago que usé antes contra el rey.
          - source: scene_3
            paragraph: 2
            text: |-
              Para mi sorpresa, en lugar de intentar evadirlo, Peter hace exactamente los mismos movimientos que yo, solo que al revés, y mi rayo desaparece tan pronto como lo alcanza.

              ¿Era esa... la técnica de disipación de Brinhorn? ¿Este tipo en serio está usando mi propia técnica contra mí? Oh, se va a arrepentir de esto.

              "¿De qué estás parloteando?" Peter me pregunta, aparentemente habiendo escuchado mis pensamientos. "¿Qué quieres decir con 'tu propia técnica'? Si intentabas distraerme, deberías haber optado por una mentira que fuera un poco más creíble".

              Ah, mierda. Me olvidé de volver a pensar sin palabras. Será mejor que me asegure de pensar más rápido de ahora en adelante, o le revelaré todos mis planes.

              Bien, a mi modo de ver, esta técnica tiene una debilidad importante, que es el hecho de que necesitas descubrir qué está lanzando tu enemigo muy rápidamente, para poder hacer todos los movimientos al revés y de alguna manera terminarlos lo suficientemente rápido como para contrarrestar el hechizo de tu oponente. Debido a este hecho, la disipación de varios pasos es particularmente vulnerable a las fintas.

              Oh, muchacho... Realmente espero no haber pensado todo eso en voz alta, o quedaré como un completo tonto.
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch09b_invent
                condition: is_dead = 0
  - name: b3_ch09b_dispel
    routes:
      - condition: b3_ch9_assassinate = 0
        texts:
          - source: scene_text
            paragraph: 18
            text: |-
              El primer ataque de Peter contra el Supervisor es intentar crear una jaula de piedra a su alrededor para limitar su movimiento. Dado que el hechizo que está usando es fácil de predecir a partir de los primeros movimientos de la mano, lo disipo con facilidad, obligando a Peter a retirarse mientras el dron de ojos verdes es ahora el que pasa a la ofensiva.

              Después de cancelar su segundo y tercer hechizo, Peter finalmente se da cuenta de lo que estoy haciendo y deja de usar cualquiera de sus complicados hechizos, limitándose solo al tipo de magia más simple y básica de su repertorio, de modo que no me dará suficiente tiempo para usar mi técnica de disipación antes de que termine su lanzamiento. Intento en vano predecir sus próximos hechizos, pero pronto me doy cuenta de que ya no tiene sentido usar esta táctica. También podría luchar contra él con hechizos regulares, porque en este momento no estoy haciendo ninguna contribución significativa a esta batalla.

              Justo cuando estoy a punto de volar más cerca de Peter, siento dos cuerdas atadas fuertemente alrededor de mis tobillos, y luego, ni siquiera un segundo después, otras dos cuerdas también se atan alrededor de mis muñecas, tirando mis brazos detrás de mi espalda. Cuando giro la cabeza, me doy cuenta de que las cuatro cuerdas habían sido conjuradas debajo de mí mientras no miraba.
          - source: scene_text_2
            paragraph: 22
            text: |-
              Estaba tan concentrado en su batalla que ni siquiera se me pasó por la cabeza comprobar mi entorno. ¿Fue este su plan desde el principio? ¿Para distraerme con su lucha contra el Supervisor mientras secretamente usa magia de conjuración para hacer que estas restricciones aparezcan de la nada? Maldita sea, si pudiera mover un poco mis brazos, tal vez podría quemar las cuerdas con un hechizo de fuego o algo así. Todavía no estoy en un nivel en el que pueda lanzar hechizos sin mover los brazos. ¿No existe algún hechizo que requiera que solo mueva los dedos y que pueda ser útil en esta situación? ¿Qué pasa con el supervisor? ¡Quizás él pueda sacarme de esto! Necesito llamarlo.

              "Oye, supervisor, ¿puedes ayudarme?"

              "Se acabó el tiempo", dice Peter, antes de que tenga tiempo de terminar mi oración, y luego usa mi hechizo de rayo inicial contra mí, haciéndome perder el conocimiento en cuestión de segundos.
          - source: scene_3
            paragraph: 4
            text: |-
              Después de estar inconsciente por un tiempo, empiezo a escuchar vagamente las voces de rey del subsuelo y Peter, quienes suenan bastante tensos. Cuando intento despertarme, me doy cuenta de que no puedo mover mi cuerpo en absoluto y ni siquiera mis ojos se abren. Siento como si estuviera medio despierto en este momento, con mi mente todavía tratando de decidir si lo que estoy escuchando realmente está sucediendo o si todo es solo un sueño.

              "¡No podemos dejarlos aquí, maldita sea!" el rey del subsuelo dice. "A este ritmo, los van a matar".

              “Con todo respeto señor… ¿por qué le importa tanto lo que les pase?” Peter dice. "Nos traicionaron a nosotros y a nuestra causa. Se aliaron con el Supervisor. ¿Qué obligación tenemos de salvar sus vidas?"

              "Pueden haber sido nuestros enemigos en esta lucha, pero eso no niega toda la ayuda que su grupo nos ha brindado en nuestro momento de necesidad", dice el rey del subsuelo. "Al menos despiértalos antes de que nos vayamos. Dales la oportunidad de defenderse de... ¡sea lo que sea que sea esto!"

              "Como desee, mi señor", dice Peter. "Pero sólo despertaré a la niña. La otra puede conocer una manera de cancelar mi teletransportación, y no quiero arriesgarme".

              Poco después de su charla, escucho el sonido de sus cuerpos vibrando fuertemente mientras se teletransportan, y luego solo hay silencio por un momento. Sin embargo, el silencio no dura mucho porque pronto es reemplazado por el sonido de Flower gritándome al oído, mientras ella me sacude violentamente.
