  - name: b3_ch09b_copy
    texts:
      - source: scene_text
        paragraph: 29
        text: |-
          Ahora me encuentro rodeado por aproximadamente un centenar de Manticoras, que vuelan a mi alrededor desde todas direcciones, incluso directamente debajo de mí. Ya sé por la batalla entre Brinhorn y Azarius que se supone que la mayoría de estos son ilusiones, pero en la pelea original, cinco de los leones alados eran reales y Azarius también se escondía entre ellos, transformado en Manticora mientras esperaba el momento ideal para atacar.

          Al igual que en la batalla que estamos copiando, Peter ha logrado lanzar con éxito un hechizo de ilusión, un hechizo de invocación y un hechizo de cambio de forma casi simultáneamente, sin darme mucho tiempo para reaccionar. El hecho de que lograra lanzar los tres hechizos sin hacer ningún movimiento me tomó completamente por sorpresa. Debió haber estado preparando los hechizos en secreto mientras yo me distraía con nuestra conversación anterior.

          Desafortunadamente, si bien inicialmente pude rastrear cuáles eran los Manticoras reales y cuáles eran las ilusiones, se ha vuelto cada vez más difícil para mí diferenciarlos ya que han estado barajando sus posiciones constantemente durante los últimos veinte segundos. De manera similar a lo que hizo Azarius contra Brinhorn, Peter no tiene prisa por atacarme, porque sabe que cuanto más tiempo pase, más dudaré de cuál de los monstruos voladores debo defenderme y cuáles tendré que ignorar.
      - source: scene_text_2
        paragraph: 31
        text: |-
          Los hechizos que utilizó Brinhorn para salir de este apuro son complicados y nunca antes había tenido la oportunidad de practicarlos, pero son la mejor opción que tengo. Al menos conozco la teoría detrás de ellos, así que tendré que hacer lo mejor que pueda para descubrir los patrones de flujo mágico basándose en el conocimiento que ya tengo. Intentémoslo.

          Mientras los Manticoras siguen dando vueltas a mi alrededor, tratando de confundirme, aprovecho el breve respiro que mi enemigo me ha concedido para probar rápidamente varios patrones de flujo que he notado en el pasado, a lo largo de mis muchos años de estudiar teoría mágica. Una vez que encuentro los movimientos que parecen funcionar, visualizo todas las partículas mágicas en mi cabeza y las guío en su camino, mientras juego con diferentes niveles de intensidad mágica hasta que el flujo reacciona positivamente a mi aura.

          El primer hechizo que lanzo es uno que mejora temporalmente mi vista y mi concentración, de manera similar a la estadística de Observación de mi dispositivo de estadísticas, que no llevo conmigo en este reino inmaterial. En cuanto aumenta mi poder de observación, inmediatamente confirmo cuáles de los Manticoras son reales, porque son los únicos que se desvían de la trayectoria general que siguen la mayoría de los otros Manticoras. Mi mayor concentración también hace que sea más fácil vigilar a Peter, a quien he estado monitoreando de cerca desde que cambió de forma.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch09b_mistake
