  - name: b3_ch09b_separate
    routes:
      - condition: b3_ch9_backup = 0 AND b3_ch9_assassinate = 0
        texts:
          - source: scene_text
            paragraph: 9
            text: |-
              "Intentemos movernos en direcciones separadas después de teletransportar nuevamente", le digo a Flower en voz baja. "No creo que pueda mantener dos cajas al mismo tiempo con su técnica de aura".

              "Está bien", dice Flower. "¡Prepararse!"

              Al igual que antes, Flower me agarra del brazo y luego salimos teletransportar afuera, pero esta vez ambos nos alejamos para que ya no quedemos atrapados dentro de la misma caja. Lamentablemente, mi predicción fue completamente errónea, porque el rey logra fácilmente atraparnos en dos cajas separadas, y ahora Peter también está congelando el aire dentro de ellas nuevamente, sin muchos problemas.

              Al ver lo sucedido, Flower entra en pánico y rápidamente se teletransporta dentro de mi caja, agarrando mi brazo nuevamente para luego teletransportarnos afuera, pero apenas me suelta, le da un poderoso dolor de cabeza que casi la hace desmayarse.

              "Flower, ¿qué pasó?" Le pregunto.

              "Yo... creo que me excedí un poco con el teletransporte...", dice. "Dame un minuto... estoy tratando de recuperarme".

              "Me temo que no tienes ni un minuto", dice el rey del subsuelo, mientras nos atrapa nuevamente dentro de una caja semitransparente y Peter comienza a congelar el aire dentro de ella. "Es decir... a menos que tu amigo Barry pueda sacar otro conejo de su sombrero y crear su propio hechizo teletransportación en los próximos quince segundos, por supuesto. Tengo que admitir que nada proveniente de él me sorprendería más en este momento."
          - source: scene_text_2
            paragraph: 8
            text: |-
              Mientras el rey habla, no estoy procesando ninguna de sus palabras, porque mi mente está demasiado ocupada repasando cada hechizo que he aprendido en cuestión de segundos, en un intento desesperado por descubrir si hay algo que pueda ayudarme a salir con vida de esta situación. Mientras mi cabeza está llena con cientos de posibles combinaciones de hechizos, puedo sentir lentamente el frío arrastrándose, hasta que todo mi cuerpo tiembla incontrolablemente.

              Durante este tiempo, Flower intenta sacarnos de la caja varias veces, pero simplemente no puede concentrarse lo suficiente para lanzar su hechizo teletransportación, y la frialdad cada vez mayor en el aire solo le dificulta mantenerse despierta. Al final, ambos sucumbimos al frío glacial y perdemos el conocimiento.
          - source: scene_3
            paragraph: 4
            text: |-
              Después de estar inconsciente por un tiempo, empiezo a escuchar vagamente las voces de rey del subsuelo y Peter, quienes suenan bastante tensos. Cuando intento despertarme, me doy cuenta de que no puedo mover mi cuerpo en absoluto y ni siquiera mis ojos se abren. Siento como si estuviera medio despierto en este momento, con mi mente todavía tratando de decidir si lo que estoy escuchando realmente está sucediendo o si todo es solo un sueño.

              "¡No podemos dejarlos aquí, maldita sea!" el rey del subsuelo dice. "A este ritmo, los van a matar".

              “Con todo respeto señor… ¿por qué le importa tanto lo que les pase?” Peter dice. "Nos traicionaron a nosotros y a nuestra causa. Se aliaron con el Supervisor. ¿Qué obligación tenemos de salvar sus vidas?"

              "Pueden haber sido nuestros enemigos en esta lucha, pero eso no niega toda la ayuda que su grupo nos ha brindado en nuestro momento de necesidad", dice el rey del subsuelo. "Al menos despiértalos antes de que nos vayamos. Dales la oportunidad de defenderse de... ¡sea lo que sea que sea esto!"

              "Como desee, mi señor", dice Peter. "Pero sólo despertaré a la niña. La otra puede conocer una manera de cancelar mi teletransportación, y no quiero arriesgarme".

              Poco después de su charla, escucho el sonido de sus cuerpos vibrando fuertemente mientras se teletransportan, y luego solo hay silencio por un momento. Sin embargo, el silencio no dura mucho porque pronto es reemplazado por el sonido de Flower gritándome al oído, mientras ella me sacude violentamente.
        effects:
          - set:
              is_dead: 1
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch09b_melding
                  ac_b3_ch9_consolation: ac_b3_ch9_consolation + 1
                condition: is_dead = 1
      - condition: b3_ch9_backup = 0 AND b3_ch9_assassinate = 1
        texts:
          - source: scene_text
            paragraph: 9
            text: |-
