scenes:
  - name: b3_ch09b_backup
    texts:
      - source: scene_text
        paragraph: 2
        text: |-
          "Está bien", digo. "Entonces vayamos primero con el Supervisor. ¿Puedes teletransportar llevarnos allí ahora?"

          "¡Estoy en ello!" Flower dice, mientras ambos somos envueltos por una luz blanca brillante.

          "¡Aquí estamos!" Flower dice.

          Cuando miro a mi alrededor, veo que ahora estamos en algún lugar del mar de luz llamado éter, con el dron de ojos verdes del Supervisor flotando justo a nuestro lado.

          "Procesando. Procesando..." dice el Supervisor. "El protocolo Supervisor ahora comprende por qué no pudo encontrar a su grupo en ningún lugar del éter. Habiendo sido testigo de su capacidad para teletransportar, mi suposición es que todos ustedes deben haberse teletransportado a un refugio seguro donde son indetectables. ¿Es correcto?"
      - source: scene_text_2
        paragraph: 2
        text: |-
          "Um, sí", dice Flower. "Así es... Espera, ¿nos has estado buscando?"

          "Afirmativo", dice el supervisor. "El protocolo Supervisor desea disculparse por las molestias que ha causado. Sus almas no estaban destinadas a ser teletransportadas fuera de sus mentes junto con las almas de los rebeldes. Desafortunadamente, la técnica que utilicé aún era experimental y terminó afectando toda el área del campo de batalla en lugar de apuntar solo a nuestros enemigos comunes".

          "¡Oh, no hay problema!" Flower dice. "Todos están bien ahora. De todos modos, queríamos preguntarte si te gustaría luchar contra Peter y el rey del subsuelo junto con nosotros aquí, en el Plano Etéreo. ¡Podría teletransportar con ellos ahora mismo si quieres!"

          "El protocolo Supervisor acepta su oferta", dice el dron de ojos verdes. "Ese era el destino al que me dirigía también".

          "¡Excelente!" Flower dice. "Prepárate, entonces. Nos teletransportaremos en tres... dos... uno..."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch09b_challenge
  - name: b3_ch09b_challenge
    routes:
      - condition: b3_ch9_backup = 0
        texts:
          - source: scene_text
            paragraph: 3
            text: |-
              "El Supervisor no tiene sus drones con él, así que dudo que pueda ser de mucha ayuda", le digo a Flower. "Yo digo que vayamos directamente a Peter y luchemos contra él nosotros solos".

              "Bueno, si tú lo dices, Barry..." dice Flower. "Muy bien, nos teletransportaré allí. ¿Estás listo?"

              "Sí", digo, y luego ambos quedamos envueltos por la luz brillante habitual que aparece cuando te teletransportan.

              "¿Qué estás haciendo aquí?" De repente escucho la voz de Peter, una vez que terminamos de teletransportarnos a nuestra nueva ubicación, en medio del éter.

              Cuando me giro para mirar hacia Peter, que estaba a unos seis metros de nosotros, veo que el rey del subsuelo también estaba allí, como dijo Flower, y ya había creado un cuerpo para sí mismo en el Plano Etéreo. Al verlos mejor a los dos, noto el hecho de que los ojos de Peter no brillan intensamente como los de Flower, lo que significa que no debe haber experimentado la misma evolución que le permitiría teletransportar a largas distancias y detectar almas en el Plano Etéreo sin importar dónde se encuentren.

              "Adivina", respondo Peter.
          - source: scene_text_2
            paragraph: 5
            text: |-
              "Esto es un error", dice Peter. "No deberías desafiarme en este lugar. Regresa mientras aún tengas la oportunidad".

              "Lo siento", digo. "No sucede".

              "No entiendes en qué te estás metiendo", dice Peter. "El Supervisor es el único con quien quiero pelear aquí. Vete ahora y aún podremos..."

              "Peter, lamento interrumpir", dice rey del subsuelo. "Pero tengo una pregunta rápida para ti antes de comenzar nuestra pelea".
            condition: b3_ch9_conclusions != 1
          - source: scene_text_2
            paragraph: 3
            text: |-
              "Normalmente, asumiría que la única razón por la que podrías visitarnos en este reino sería pedir nuestra ayuda para luchar contra el Supervisor", dice el rey del subsuelo, "pero a juzgar por el tono de tu voz, estoy empezando a dudar de que este sea el caso. ¿Debo entender que todo lo que nos dijiste antes de la batalla era una mentira y que, después de todo, nos traicionaste?"

              "Más o menos", le respondo.

              "Esto es un error", dice Peter. "No deberías desafiarme en este lugar. Regresa mientras aún tengas la oportunidad".

              "Lo siento", digo. "No sucede".

              "No entiendes en qué te estás metiendo", dice Peter. "El Supervisor es el único con quien quiero pelear aquí. Vete ahora y aún podremos..."

              "Peter, lamento interrumpir", dice rey del subsuelo. "Pero tengo una pregunta rápida para ti antes de comenzar nuestra pelea".
            condition: b3_ch9_conclusions = 1
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch09b_logical
