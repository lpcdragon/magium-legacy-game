  - name: b3_ch09b_roof
    routes:
      - condition: b3_ch9_assassinate = 0
        texts:
          - source: scene_text
            paragraph: 24
            text: |-
              Rápidamente lanzo un hechizo que crea una plataforma flotante hecha de roca y luego la coloco sobre mi cabeza para que pueda defenderme de la lluvia helada.

              Justo cuando termino de colocar mi techo, siento dos cuerdas atadas fuertemente alrededor de mis tobillos, y luego, ni siquiera un segundo después, otras dos cuerdas también se atan alrededor de mis muñecas, tirando de mis brazos detrás de mi espalda. Cuando giro la cabeza, me doy cuenta de que las cuatro cuerdas habían sido conjuradas debajo de mí mientras no miraba. La lluvia de hielo tampoco está ni cerca de comenzar, a pesar de que Peter aparentemente ha terminado su hechizo.
          - source: scene_text_2
            paragraph: 25
            text: |-
              ¿Significa esto que todo fue una artimaña? ¿Fingió el hechizo para distraerme y simplemente usó magia de conjuración para crear estas cuerdas? Maldita sea, si pudiera mover un poco mis brazos, podría quemar estas cuerdas con un hechizo de fuego o algo así. Todavía no estoy en un nivel en el que pueda lanzar hechizos sin mover los brazos. ¿No existe algún hechizo que requiera que solo mueva los dedos y que pueda ser útil en esta situación? ¡Piensa, Barry! ¡Tiene que haber algo!

              "Se acabó el tiempo", dice Peter, y luego usa mi hechizo de rayo inicial contra mí, haciéndome perder el conocimiento en cuestión de segundos.
