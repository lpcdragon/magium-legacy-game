      - source: scene_3
        paragraph: 9
        text: |-
          La pregunta es… ¿debería seguir copiando lo que hizo Brinhorn o debería hacer otra cosa? Hasta ahora Peter ha estado reproduciendo la batalla a la perfección, pero no hay garantía de que lo haga hasta el final. En cierto punto, seguramente se desviará de la pelea original de alguna manera y tal vez sería mejor si yo diera el primer paso en lugar de... bueno, no importa, es demasiado tarde para eso. Peter ahora se lanza directamente hacia mí en su forma Manticora. Azarius nunca hizo algo así contra Brinhorn.

          ¿Se transformará nuevamente en su forma humana y me lanzará un hechizo una vez que se acerque?... No, no, no, el proceso de cambio de forma no se puede realizar instantáneamente y lo dejaría demasiado vulnerable. Entonces, ¿está planeando atacarme mientras está en su forma Manticora? Algo no cuadra aquí. ¡Esta tiene que ser una de sus trampas otra vez! Puedo sentirlo... Creo que está tratando de incitarme a atacarlo. A ver si me revela sus cartas si le sigo el juego un poco.

          Me pongo en posición y finjo que estoy a punto de lanzarle un hechizo de parálisis de corto alcance tan pronto como se acerca. Bien, esto debería ser lo suficientemente convincente. Vamos, Peter, muéstrame lo que estás...

          Antes incluso de terminar mi proceso de pensamiento, la imagen de Manticora frente a mí desaparece y es reemplazada por Peter, quien aparentemente nunca había cambiado de forma en primer lugar, y solo usó magia de ilusión para hacerme pensar que lo hizo. Justo cuando él lanza su propio hechizo de parálisis, uso mis corrientes de aire para alejarme de él y evitar por poco su ataque.
    choices:
