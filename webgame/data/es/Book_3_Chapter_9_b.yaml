  - name: b3_ch09b_poison
    texts:
      - source: scene_text
        paragraph: 32
        text: |-
          Por un momento, tuve la esperanza de que el elixir anti-veneno que bebí en el plano terrestre realmente pudiera funcionar aquí, pero supongo que estaba siendo demasiado optimista. Los efectos del veneno me golpearon casi instantáneamente, ya que ahora tengo un fuerte dolor de cabeza y empiezo a toser sangre. El dolor de cabeza no es tan fuerte como el que tuve por el fallido teletransportación cuando me transportaron a las cavernas subterráneas con Leila, pero eso no dice mucho. Esto sigue siendo mucho peor que cualquier resaca que haya tenido y está afectando enormemente mi concentración.

          De todas las cosas que podrían haberme vencido, simplemente tenía que ser veneno... Es bueno que Illuna no esté aquí, o nunca escucharía el final.

          No pierdo el tiempo y disipo la nube venenosa con una ráfaga de viento. El daño ya está hecho, pero al menos ahora no será peor de lo que ya está. Ahora ¿dónde se esconde Peter?... Supuse que intentaría usar la niebla como cobertura para tomarme por sorpresa, pero no está a la vista. ¿No me digas que usó la nube de veneno solo para huir?...
      - source: scene_text_2
        paragraph: 38
        text: |-
          "Solo probé este hechizo por capricho, pero nunca imaginé que realmente funcionaría", escucho la voz de Peter, quien aparentemente se ha vuelto invisible mientras yo no estaba mirando. "¿Qué clase de idiota entra en una batalla de magos sin haber lanzado ningún tipo de protección contra los ataques de veneno? Tal vez te he sobreestimado después de todo..."

          "¿Qué pasa con el hechizo de invisibilidad?" Le digo a Peter, mientras toso un poco más de sangre. "¿Crees que eres Albert o algo así? Te das cuenta de que no eres tan bueno como él para ocultar tu aura, ¿no? Puedo saber fácilmente dónde estás y ni siquiera tengo mi dispositivo de estadísticas aquí para aumentar mi sentido mágico".
      - source: scene_3
        paragraph: 10
        text: '"Puede que seas bueno memorizando hechizos, pero no pareces estar muy versado en venenos", dice Peter. "Déjame darte una pista. El tiempo no está de tu lado en este momento. Cuanto más esperes, más se hundirán los efectos del veneno y perderás todos tus sentidos uno por uno. Tu capacidad para detectar auras probablemente será la primera que perderás, seguida por tu sentido del olfato y luego tu vista. Sólo te doy esta advertencia por el poco respeto que todavía te tengo como compañero generalista. Si todavía tienes alguna técnica secreta que estuviste guardando hasta el último momento, entonces Te recomiendo que los uses todos ahora. No me decepciones más."'
    choices:
      - position: 1
        text: No dejes que las burlas de Peter me afecten y espera a que haga su movimiento.
        effects:
          - set:
              current_scene: b3_ch09b_appreciate
      - position: 2
        text: Lucha contra Peter ahora con todo lo que tengo.
        effects:
          - set:
              current_scene: b3_ch09b_struggle
  - name: b3_ch09b_appreciate
    texts:
      - source: scene_text
        paragraph: 34
        text: |-
          "Sabes, realmente aprecio toda la ayuda que me estás brindando, Peter", digo, mientras lucho por no parecer afectada por el dolor de cabeza. "Incluso tuviste la amabilidad de recordarme que todavía tengo una técnica secreta que no he usado hasta ahora. Podría haberla olvidado por completo si no la hubieras mencionado, ¡así que gracias por eso!"

          "Si todavía crees que puedes derrotarme, será mejor que lo hagas ahora", dice Peter. "Pronto ni siquiera podrás saber dónde estoy".

          "En realidad, ¡creo que podría tener una idea mejor!" digo. "¿Por qué no conservo esta técnica secreta por un tiempo más para mantenerte al límite? ¡Esta estrategia parece haber estado funcionando de maravilla hasta ahora!"

          Peter no me responde y no puedo ver la reacción en su rostro ya que todavía es invisible, pero si tuviera que adivinar, diría que probablemente esté bastante enojado en este momento. El hecho de que mencionara específicamente la idea de que yo revelara mis técnicas secretas hizo que su "consejo" anterior me pareciera muy sospechoso. Claramente está tratando de provocarme. Si este veneno realmente estuviera destinado a empeorar con el tiempo, habría intentado detenerme en lugar de decirme que lo atacara. Realmente no había ninguna razón para que él me contara todo esto a menos que...

          ¡A menos que su veneno sea solo temporal y nunca se molestó en aprender ningún hechizo de veneno con efectos duraderos! ¡Sí, tiene que ser eso! Ahora que estoy prestando más atención a mi dolor de cabeza y náuseas, siento como si estuviera mejorando, aunque la mejora es sutil. A ver si puedo ganar un poco más de tiempo aprovechando su cautela infundada a mi alrededor.
      - source: scene_text_2
        paragraph: 40
        text: |-
          "¡Por los dioses, estabas diciendo la verdad!" Digo, ya que ahora estoy fingiendo algo de miedo en mi voz. "¡El veneno realmente está empeorando! ¡¿Qué me has hecho, bastardo?!"

          "...Te advertí que esto sucedería", dice Peter, con voz ligeramente vacilante. "¿Pensaste que estaba mintiendo? Ahora date prisa y usa tus hechizos antes de..."

          "¡¿Qué le hiciste a tu aura?!" Grito de repente. "¡Revélate, cobarde! ¡Pensé que querías tener una pelea justa!"

          "¿De qué estás hablando, lunático?" Peter dice. "El veneno no podría haberte afectado tanto en tan poco tiempo. De hecho, a estas alturas, ya deberías estar..."

          Hace una pausa por unos segundos, mientras poco a poco se da cuenta de lo que he estado haciendo.

          "Lo descubriste, ¿no?" me pregunta. "Solo estabas ganando tiempo para que los efectos del veneno desaparecieran..."

          "De hecho", digo, mientras mi dolor de cabeza y mis náuseas han desaparecido casi por completo. "¡Y ahora que me siento bien otra vez, podemos continuar batiéndonos en duelo de manera justa, como los dos compañeros generalistas que somos! ¿No estás de acuerdo?"
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch09b_puddle
              b3_ch3_stats_unavailable: 0
  - name: b3_ch09b_puddle
    texts:
      - source: scene_text
        paragraph: 35
        text: |-
          Poco después de terminar mi frase, empiezo a sentir una de las sensaciones más inquietantes y difíciles de describir que he experimentado en mi vida. La sensación que tengo es como si mi conciencia fuera empujada repetidamente a través de un túnel, de un lado a otro, y parece que no puede decidir en qué extremo del túnel está su destino.

          Mientras esto sucede, me encuentro por un segundo acostado boca abajo en un charco en una calle, durante una tormenta, y durante el segundo siguiente estoy de regreso aquí en el Plano Etéreo, flotando en medio del mar de luz.

          Después de ser arrojado entre la tierra y Plano Etéreo unas cuantas veces más, puedo sentir toda la luz a mi alrededor conectándose directamente a mi mente, y luego empiezo a escuchar algunos pensamientos muy claros en mi cabeza, como si fueran míos, aunque estoy seguro de que no soy yo quien los piensa.
      - source: scene_text_2
        paragraph: 41
        text: |-
          "Éste no es el lugar para resolver tu conflicto", dice la voz en mi cabeza. "Regresad a vuestros santuarios ahora y no perturbéis más estos lugares de descanso".

          "Peter, ¿escuchaste eso también?" dice el rey del subsuelo, ya que todos estamos temporalmente congelados en el lugar, sin saber qué hacer. "¿Quién nos contactó hace un momento? ¿Fue el éter?"

          "No estoy... seguro..." dice Peter, mientras mira hacia el rey, con una mirada algo temerosa en sus ojos.
    choices:
      - position: 1
        text: Ataca a Peter mientras todavía está distraído.
        effects:
          - set:
              current_scene: b3_ch09b_illusory
              b3_ch9_listen: 0
      - position: 2
        text: Escucha la voz en mi cabeza y no lances más hechizos por el momento.
