  - name: b3_ch09b_kill
    routes:
      - condition: b3_ch9_backup = 0
        texts:
          - source: scene_text
            paragraph: 42
            text: |-
              Ambos son nuestros enemigos. Hay que matarlos. Estoy seguro de que nos habrían hecho lo mismo si hubieran tenido la oportunidad.

              "¡Uf!" Flower dice, mientras ahora está usando sus chorros de fuego para volar más cerca de mí. "Casi pensé que no lo lograríamos, por un segundo... ¡Buen trabajo, Barry!"

              Mientras Flower hablaba, yo estaba ocupado conjurando dos grandes placas de piedra en lados opuestos de la cabeza de rey del subsuelo, colocándolas aproximadamente a seis pies de distancia de él en ambas direcciones. Una vez que terminé con eso, hice lo mismo para Peter, con dos placas de piedra adicionales.

              "Umm, ¿Barry?..." pregunta Flower, luciendo un poco nervioso. "¿Qué piensas hacer con esas rocas?..."

              Ignoro Flower y levanto las manos, tomando el control de ambos pares de placas de piedra al mismo tiempo. Luego, antes de que Flower tenga tiempo de decir algo más, aplaudo tan fuerte como puedo y los dos pares de placas de piedra se acercan entre sí a velocidades impresionantes, convirtiendo las cabezas de ambos rebeldes en una espesa pasta roja al chocar.

              "¡¡¡NO!!!" Grita Flower, mientras instintivamente vuela hacia los cadáveres, incluso si probablemente ya se dio cuenta de que ya no hay nada que pueda hacer para ayudarlos.

              Cancela sus chorros de fuego unos segundos más tarde cuando vuelve en sí, y luego simplemente mira los cuerpos sin vida frente a ella por un momento antes de volver a hablar.
          - source: scene_text_2
            paragraph: 47
            text: |-
              "Tú los mataste..." dice Flower, luciendo como si todavía estuviera tratando de aceptar la realidad frente a ella. "¿Por qué?..."

              "Eran demasiado peligrosos para dejarlos con vida", digo. "No tuve elección."

              "¿No hay opción?..." dice Flower, incrédulo. "¡Ambos estaban inconscientes! ¡Fácilmente podríamos haberlos capturado!"

              "¿Cómo los capturaron?" pregunto. "Ambos podrían usar técnicas poderosas sin moverse, así que no es como si simplemente los hubiéramos atado".

              "¡No sé!" Flower dice. "¡Podríamos haberle pedido al Supervisor que los pusiera en una celda antimagia o algo así! ¿No fue esa una de las razones principales por las que nos aliamos con él?"

              "Hubiera sido demasiado arriesgado", digo. "Apenas logramos vencerlos esta vez. Si escaparon de sus celdas, no había garantía de que pudiéramos haberlos golpeado nuevamente. Matarlos era la única manera de asegurarnos de que no tendríamos que luchar más contra ellos".
          - source: scene_3
            paragraph: 14
            text: '"Entonces, ¿qué le vas a decir a Daren, entonces?..." dice Flower. "Pensé que ambos le habíamos prometido que haríamos todo lo posible para mantener todas las bajas al mínimo".'
