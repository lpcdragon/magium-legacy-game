          - source: scene_3
            paragraph: 15
            text: |-
              "El protocolo Supervisor quiere señalar que no valora el hecho de que usted no haya considerado consultarlo antes de tomar una decisión tan importante", dice el dron de ojos verdes. "Los rey del subsuelo y Peter podrían haber sido utilizados como rehenes valiosos si se los mantuviera con vida. Por favor, absténgase de tomar acciones tan precipitadas en el futuro si no quiere ejercer más presión innecesaria sobre nuestra ya frágil alianza".

              "Debidamente anotado", le digo al supervisor.

