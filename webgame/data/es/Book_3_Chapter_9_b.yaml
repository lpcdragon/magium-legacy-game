  - name: b3_ch09b_fluke
    texts:
      - source: scene_text
        paragraph: 54
        text: |-
          Justo cuando estoy a punto de dirigirme hacia el castillo, siento un repentino mareo y por una fracción de segundo siento como si mi conciencia se alejara nuevamente hacia el Plano Etéreo, donde tengo una vista directa del interior de mi cubo vacío que se supone que es mi santuario. ¿Qué acaba de pasar? ¿Realmente volví a mi perspectiva desde Plano Etéreo por un segundo o simplemente estoy imaginando cosas?

          "¿Estás bien, Barry?" Hadrik dice, cuando me ve congelado en el lugar al final del grupo y sudando intensamente.

          "¿No sentiste nada en este momento?" Le pregunto a Hadrik, mientras intento calmarme.

          "¿Qué quieres decir?" Hadrik pregunta. "¿Qué se suponía que debía sentir?"

          "...Nada", le digo. "Estoy seguro de que no fue nada. Vámonos. Necesitamos alcanzar a los demás".

          Mientras Hadrik asiente y luego avanza delante de mí, me quedo ahí quieto unos segundos más, contemplando lo que acaba de suceder.
      - source: scene_text_2
        paragraph: 55
        text: |-
          Una casualidad. Tiene que haber sido una casualidad. Hadrik no experimentó nada inusual, por lo que el Supervisor no volverá a atacarnos. Incluso si lo que vi fuera real, claramente estaba sentado dentro de mi santuario, así que no debería haber nada de qué preocuparse. No me van a echar al éter otra vez.

          Después de la breve pausa, decido que no tiene sentido insistir más en esto y acelero el paso para poder reunirme con el resto del grupo. Durante la siguiente hora, aproximadamente, mientras viajamos hacia el palacio, la sensación de cambiar mi atención hacia el Plano Etéreo no vuelve a mí, así que no se lo menciono a ninguno de mis amigos. Todo está bien. No hay nada de qué preocuparse. Si no volvió a pasar después de tanto tiempo, entonces estoy seguro de que no fue nada grave y el evento nunca se repetirá.

          Todo está bien.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch09b_credits
