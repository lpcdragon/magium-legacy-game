  - name: b3_ch09b_logical
    routes:
      - condition: b3_ch9_backup = 0
        texts:
          - source: scene_text
            paragraph: 5
            text: |-
              "¿Sí, mi rey?" Peter dice.

              "Me dijiste que mi cuerpo terrestre usa su aura para vincularse a mi alma desde el Plano Etéreo, ¿verdad?" dice el rey.

              "Sí, señor", responde Peter.

              "Entonces, si el aura está vinculada a mi alma", continúa el rey, "entonces sería lógico suponer que mi alma también tiene un aura separada con la que el aura terrestre puede vincularse, ¿correcto?"

              "Yo... realmente no lo he pensado mucho hasta ahora", dice Peter, "pero lógicamente hablando, debería ser como dices, sí".

              "¡Bien!" el rey del subsuelo dice. "¡Entonces no estoy sólo imaginando cosas!"

              Luego estira el brazo hacia adelante, mientras apunta con la palma hacia nosotros, y de repente una fuerza invisible nos empuja a mí y a Flower hacia atrás unos tres metros.

              "Es un poco más débil que en el plano terrestre, pero parece que también podré usar la manipulación del aura en este plano de existencia", dice el rey del subsuelo, mientras se vuelve hacia nosotros. "Perdón por hacerte esperar. Estoy listo cuando tú lo estés. ¡Solo di la palabra y comenzaremos la batalla!"
          - source: scene_text_2
            paragraph: 6
            text: |-
              "Está bien", le digo, mientras me pongo en una postura especial y hago algunos movimientos muy rápidos con las manos mientras imagino la energía mágica acumulándose en las yemas de mis dedos. "Entonces estoy diciendo la palabra."

              Antes de que el rey tenga tiempo de responder, lo señalo con el dedo y un rayo sale disparado, directo a su pecho. El rayo parece golpearlo al principio, pero luego me doy cuenta de que lo único que hice fue rozar ligeramente su escudo invisible hecho de aura endurecida que lo rodea.

              Siguiendo mi ejemplo, Flower también comienza el ataque, golpeando tanto a Peter como a rey del subsuelo con una andanada de bolas de fuego. Cuando las llamas de las explosiones se apagan, veo que Peter había logrado crear una cúpula de hielo a su alrededor, que los protegía por completo pero que ahora se está derritiendo rápidamente por todo el calor.

              "Ese fue un ataque bastante poderoso que disparaste hacia nosotros, pequeña", dice el rey del subsuelo, una vez que la cúpula de hielo desaparece por completo. "Si no lo supiera mejor, podría incluso tener la idea equivocada de que estabas tratando de matarnos".
        choices:
          - position: 1
            text: Nadie intenta matar a nadie. Todo lo que queremos es derrotaros y poner fin a esta guerra.
            effects:
              - set:
                  current_scene: b3_ch09b_impenetrable
                  b3_ch9_assassinate: 0
          - position: 2
            text: Por supuesto que estamos intentando matarte. Eso es lo que te pasa por conspirar para asesinarnos.
            effects:
              - set:
                  current_scene: b3_ch09b_impenetrable
                  b3_ch9_assassinate: 1
