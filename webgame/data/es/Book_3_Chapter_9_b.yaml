  - name: b3_ch09b_manually
    texts:
      - source: scene_text
        paragraph: 23
        text: |-
          Mientras sigo evitando por poco la multitud de proyectiles guiados, vislumbro a Peter, que parece estar profundamente concentrado en las bolas de fuego que me siguen, e incluso dirige algunas de ellas con sus manos desde lejos.

          ¿Qué está pasando aquí?... ¿Por qué parece que está controlando algunas de esas bolas de fuego manualmente? El objetivo de este hechizo es que se supone que las bolas de fuego siguen a su objetivo por sí solas, de modo que puedas continuar lanzando otros hechizos mientras tu enemigo está distraído. Normalmente, Peter no debería tener por qué dirigir ninguno de los proyectiles.

          Pero ¿y si...?

          ¿Qué pasa si este no es su hechizo anterior en absoluto?... ¿Qué pasa si simplemente usó sus poderes etéreos para crear un montón de bolas de fuego de la nada, de la misma manera que Flower hizo esa palmera y la convirtió en un carro?

          Por supuesto... Si lo pienso así, ¡entonces todo tiene sentido!

          ¡Mi disipación funcionó! Sólo está tratando de engañarme haciéndome pensar que no fue así, para no intentar interrumpirlo y hacer que pierda su concentración en todas estas docenas de bolas de fuego que está controlando individualmente.

          Esto es todo. Esta es la respuesta que estaba buscando. ¡Ahora sé exactamente lo que tengo que hacer!
      - source: scene_text_2
        paragraph: 24
        text: |-
          Después de esquivar algunos proyectiles en llamas más, los alejo de Peter a propósito, y una vez que mi camino hacia él está despejado, me dirijo directamente hacia mi oponente, mientras preparo un hechizo de aturdimiento muy simple que apenas puede marear a alguien durante unos segundos.

          Una vez que me acerco lo suficiente, le lanzo el hechizo y al momento siguiente, todas las bolas de fuego desaparecen, mientras Peter se recupera rápidamente de su breve estupor.

          "¡Ja!" digo. "¡Lo sabía! ¡Sabía que mi disipación no podía haber fallado! Debería haber sabido que esto sería un truco desde el principio".

          "Estás poniendo a prueba mi paciencia..." dice Peter. "No quieres que use mis poderosos hechizos contra ti en este reino. Ríndete ahora, si no quieres arriesgar tu vida innecesariamente".

          "Lo siento, ¿se suponía que eso debía intimidarme?" digo. "Porque eso no sonó aterrador en absoluto. Tal vez deberías intentar invertir algunos puntos más en tu estadística de Farol".

          En lugar de responderme, Peter comienza a lanzar un hechizo aún más complicado que, si no me equivoco, está destinado a llenar un área enorme con interminables gotas de lluvia de un líquido helado que es lo suficientemente frío como para incapacitarte en cuestión de segundos. Tengo que hacer algo al respecto rápido.
    choices:
      - position: 1
        text: Intenta hacer un techo de piedra y colocarlo sobre mi cabeza.
        effects:
          - set:
              current_scene: b3_ch09b_roof
      - position: 2
        text: Espera a que termine de lanzar el hechizo.
        effects:
          - set:
              current_scene: b3_ch09b_counter
      - position: 3
        text: Intenta disipar la lluvia helada antes de que Peter termine de lanzar el hechizo.
        effects:
