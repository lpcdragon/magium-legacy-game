              Tenga en cuenta que este capítulo se dividirá en dos secciones separadas, pero solo habrá un punto de control, al comienzo del capítulo, para que aún pueda reiniciar el capítulo desde el principio en caso de que no haya guardado su juego allí manualmente.

              ----Resumen del capítulo anterior----

              Después de una feroz batalla en Plano Etéreo, Barry y sus amigos lograron derrotar al Supervisor, con un poco de ayuda de rey del subsuelo y Peter.

              Ahora que no queda nadie para reclamar el trono después de la muerte del viejo rey, está a punto de celebrarse una elección en las cavernas subterráneas para establecer a quién nominarán los rebeldes para ser el nuevo rey de Ollendor.
