  - name: b3_ch09b_improvisations
    routes:
      - condition: b3_ch9_element = 0
        texts:
          - source: scene_text
            paragraph: 31
            text: |-
              Así que esto es lo que tenía bajo la manga... Al menos ahora no debería haber más trucos, así puedo concentrarme en...

              Una vez más mis pensamientos se ven interrumpidos, porque dos Manticoras de repente se abalanzan sobre mí desde direcciones opuestas. Instintivamente los esquivo a ambos, pero luego cuatro criaturas voladoras más se lanzan hacia mí, y los otros cien parecen estar preparándose para atacarme también. Ahora entiendo lo que estaba haciendo este tipo.

              Para poder prestar atención a todos esos Manticoras a la vez necesitaba que mi concentración permaneciera ininterrumpida, pero el ataque sorpresa de Peter de antes era justo lo que necesitaba para romper mi concentración. Ahora ya no estoy seguro de cuáles Manticoras son reales y ya no tengo el lujo de sentarme y analizar la situación con calma. Para todos los efectos, ahora prácticamente estoy luchando contra cien Manticoras y un generalista a la vez. Bien jugado.

              Parece que voy a tener que hacer algunas improvisaciones serias si quiero salir vivo de esto. Lo siento Brinhorn, no es nada personal, pero me temo que tu actuación anterior durante esta batalla ya no me sirve de nada.
          - source: scene_text_2
            paragraph: 34
            text: |-
              Justo cuando los Manticoras están a punto de alcanzarme, desato una poderosa ola de fuego que abarca toda el área a mi alrededor. Las ilusiones no se ven afectadas por esto, pero todos los Manticoras reales se convierten fácilmente en cadáveres carbonizados y luego siguen flotando en su lugar, porque no hay fuerza en este reino para hacerlos caer.

              Ja. ¡Lo sabía! ¡Sabía que pedirle a Flower que me enseñara un hechizo que afecta un área grande sería una buena idea!

              Cuando miro hacia Peter para ver qué le pasó, noto que está ileso, porque había conjurado un gran muro de piedra reforzada frente a él en el último momento. No le doy la oportunidad de convocar nuevos Manticoras y le lanzo un enjambre de flechas de fuego, obligándolo a volar lejos de su posición. En lugar de ponerse a la defensiva, Peter contraataca inmediatamente creando una enorme nube de niebla venenosa que rápidamente nos envuelve a ambos, antes de que pueda alejarme de ella.
