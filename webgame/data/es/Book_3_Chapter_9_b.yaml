  - name: b3_ch09b_agreement
    routes:
      - condition: b3_ch9_premonition <> 2
        texts:
          - source: scene_text
            paragraph: 52
            text: |-
              Los drones son trabajadores muy diligentes. Gracias a su impecable organización consiguen vaciar la plaza de cadáveres en menos de cinco minutos. Para cuando los drones y los rebeldes se han ido, Flower finalmente ha terminado de devolver todas las almas de mis amigos a sus santuarios en el Plano Etéreo, y ahora que se han despertado en el plano terrestre, lentamente se están reuniendo alrededor de mí y de Illuna.

              "¿Estás seguro de que eso es lo que dijo el dron de ojos rojos?" Daren me pregunta, después de explicarle lo que pasó con todos los rebeldes inconscientes en el terreno.

              "Sí, estaba bastante claro en su redacción", le digo a Daren. "Si queremos hablar con el Supervisor, tenemos que ir al palacio".

              "No recuerdo que esto fuera parte de nuestro acuerdo original con él...", dice Daren.

              "Realmente nunca estuvimos de acuerdo en que tampoco nos encontraríamos con él en el palacio", digo. "Técnicamente hablando, no está incumpliendo su palabra".

              "Hmm..." dice Daren. "No estoy seguro de cuánto me gusta esto. Fácilmente podría haber enviado un dron de ojos verdes para hablar con nosotros, pero en lugar de eso nos está haciendo llegar hasta allí. Se siente como si estuviera tratando de mostrarnos quién tiene realmente el control aquí".

              "Quiero decir... ¿está realmente equivocado?" digo. "Él está claramente en una posición de negociación superior en este momento. Todas las principales amenazas para él en esta ciudad ya han desaparecido. Somos prácticamente los únicos que todavía podemos desafiarlo de alguna manera".
          - source: scene_text_2
            paragraph: 54
            text: |-
              "Sí", dice Daren. "Eso es lo que me preocupa..."

              "Muy bien, lancé el hechizo", le dice Melindra a Flower.

              "¡Gracias, Melindra!" Flower dice, mientras algunas de las corrientes de aire de Melindra la elevan en el aire. "Perdón por preguntarte esto de la nada, pero Petal quiere evitar mover mi cuerpo tanto como sea posible hasta que encuentre una manera de, um... apagar las llamas rojas en mis ojos".

              "Está bien, no te preocupes", dice Melindra. "Solo quieres que te cargue así hasta que lleguemos al palacio, ¿verdad?"

              "Sí, por favor", dice Flower. "En este momento, estoy un poco ocupado guiando a los rebeldes desde el éter de regreso a sus propios santuarios, así que no puedo darme el lujo de cancelar la transformación todavía".

              "... ¿Estás ayudando a los rebeldes?" Hadrik pregunta, confundido.

              "Bueno, ¡no puedo dejar que todos mueran ahí fuera!" Flower dice.
            condition: b3_ch9_enemies = 0
