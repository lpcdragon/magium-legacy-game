  - name: b3_ch09b_blabbering
    routes:
      - condition: b3_ch9_teleport = 0
        texts:
          - source: scene_text
            paragraph: 11
            text: |-
              "Intenta acercarnos teletransportar al rey y Peter esta vez", le digo a Flower en voz baja. "De esa manera, no podrán rodearnos con la caja sin quedar atrapados".

              "Buena idea", dice Flower. "¡Aquí vamos!"

              Al igual que antes, Flower me agarra del brazo y luego teletransportar salimos de la caja, pero esta vez nos rematerializamos justo al lado de nuestros enemigos. Como predije, el rey evita usar su caja semitransparente cuando nos ve tan cerca de él, y en su lugar intenta usar su manipulación del aura para alejarnos.

              Flower, sin embargo, no le da tiempo a rey del subsuelo para usar su técnica, y ella le dispara un rayo de fuego, lo que lo obliga a concentrar todos sus esfuerzos en reforzar el escudo de aura que lo rodea. Mientras tanto, también aprovecho su confusión para golpear a Peter con el hechizo de relámpago que usé antes sobre el rey.
          - source: scene_text_2
            paragraph: 10
            text: |-
              Para mi sorpresa, en lugar de intentar evadirlo, Peter hace exactamente los mismos movimientos que yo, solo que al revés, y mi rayo desaparece tan pronto como lo alcanza.

              ¿Era esa... la técnica de disipación de Brinhorn? ¿Este tipo en serio está usando mi propia técnica contra mí? Oh, se va a arrepentir de esto.

              "¿De qué estás parloteando?" Peter me pregunta, aparentemente habiendo escuchado mis pensamientos. "¿Qué quieres decir con 'tu propia técnica'? Si intentabas distraerme, deberías haber optado por una mentira que fuera un poco más creíble".

              Ah, mierda. Me olvidé de volver a pensar sin palabras. Será mejor que me asegure de pensar más rápido de ahora en adelante, o le revelaré todos mis planes.

              Bien, a mi modo de ver, esta técnica tiene una debilidad importante, que es el hecho de que necesitas descubrir qué está lanzando tu enemigo muy rápidamente, para poder hacer todos los movimientos al revés y de alguna manera terminarlos lo suficientemente rápido como para contrarrestar el hechizo de tu oponente. Debido a este hecho, la disipación de varios pasos es particularmente vulnerable a las fintas.

              Oh, muchacho... Realmente espero no haber pensado todo eso en voz alta, o quedaré como un completo tonto.
        choices:
