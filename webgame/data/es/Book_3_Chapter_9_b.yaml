      - condition: b3_ch9_assassinate = 1
        texts:
          - source: scene_text
            paragraph: 25
            text: |-
              Rápidamente empiezo a lanzar el mismo hechizo que Peter al revés, luchando por mantener su velocidad para poder terminarlo a tiempo para que la disipación funcione.

              Mientras estoy ocupado concentrándome en los movimientos de mis manos, siento dos cuerdas atadas fuertemente alrededor de mis tobillos, y luego, ni siquiera un segundo después, otras dos cuerdas también se atan alrededor de mis muñecas, jalando mis brazos detrás de mi espalda. Cuando giro la cabeza, me doy cuenta de que las cuatro cuerdas habían sido conjuradas debajo de mí mientras no miraba. La lluvia de hielo tampoco está ni cerca de comenzar, a pesar de que Peter aparentemente ha terminado su hechizo.
          - source: scene_text_2
            paragraph: 25
            text: |-
              ¿Significa esto que todo fue una artimaña? ¿Fingió el hechizo para distraerme y simplemente usó magia de conjuración para crear estas cuerdas? Maldita sea, si pudiera mover un poco mis brazos, podría quemar estas cuerdas con un hechizo de fuego o algo así. Todavía no estoy en un nivel en el que pueda lanzar hechizos sin mover los brazos. ¿No existe algún hechizo que requiera que solo mueva los dedos y que pueda ser útil en esta situación? ¡Piensa, Barry! ¡Tiene que haber algo!

              "Se acabó el tiempo", dice Peter, y luego usa mi hechizo de rayo inicial contra mí, haciéndome perder el conocimiento en cuestión de segundos.
          - source: scene_3
            paragraph: 3
            text: |-
              Después de estar inconsciente por un tiempo, empiezo a escuchar vagamente las voces de rey del subsuelo y Peter, quienes suenan bastante tensos. Cuando intento despertarme, me doy cuenta de que no puedo mover mi cuerpo en absoluto y ni siquiera mis ojos se abren. Siento como si estuviera medio despierto en este momento, con mi mente todavía tratando de decidir si lo que estoy escuchando realmente está sucediendo o si todo es solo un sueño.

              "¡No podemos dejarlos aquí, maldita sea!" el rey del subsuelo dice. "A este ritmo, los van a matar".

              “Con todo respeto señor… ¿por qué le importa tanto lo que les pase?” Peter dice. "Estaban más que dispuestos a matarnos antes, cuando lucharon contra nosotros. ¿Qué obligación tenemos de salvarles la vida?"

              "Pueden haber sido nuestros enemigos en esta lucha, pero eso no niega toda la ayuda que su grupo nos ha brindado en nuestro momento de necesidad", dice el rey del subsuelo. "Al menos despiértalos antes de que nos vayamos. Dales la oportunidad de defenderse de... ¡sea lo que sea que sea esto!"

              "Como desee, mi señor", dice Peter. "Pero sólo despertaré a la niña. La otra puede conocer una manera de cancelar mi teletransportación, y no quiero arriesgarme".

              Poco después de su charla, escucho el sonido de sus cuerpos vibrando fuertemente mientras se teletransportan, y luego solo hay silencio por un momento. Sin embargo, el silencio no dura mucho porque pronto es reemplazado por el sonido de Flower gritándome al oído, mientras ella me sacude violentamente.
