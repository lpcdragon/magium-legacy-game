  - name: b3_ch09b_cube
    routes:
      - condition: b3_ch9_enemies = 2
        texts:
          - source: scene_text
            paragraph: 43
            text: |-
              "Le diré la verdad".

              "¿Quieres decir que le vas a decir que los asesinaste a sangre fría mientras estaban completamente indefensos?..." dice Flower. "¿Cómo crees que va a reaccionar ante eso?"

              "¡Oye, estaban indefensos sólo porque los incapacitamos de antemano!" digo. "Ambos vimos lo fuertes que eran, incluso en este ámbito donde nosotros dos claramente teníamos la ventaja. Simplemente no hay manera de que hubiéramos arriesgado tener que luchar contra ellos nuevamente, especialmente en el plano terrestre. Estoy seguro de que Daren lo entenderá".

              "Está bien, está bien..." dice Flower, en tono derrotado. "No quiero discutir más contigo sobre esto. He tenido suficientes discusiones con Petal en situaciones similares para saber que no sirve de nada tratar de cambiar de opinión si esa es realmente tu perspectiva en la vida. Es solo que..."

              Ella hace una pausa.

              "No importa", dice ella. "Probablemente debería llevarte de regreso a tu 'santuario' antes de que el éter pierda la paciencia. Supongo que ya debes haber recuperado tu memoria, ¿verdad? ¿Sabes hacia dónde debemos ir?"
          - source: scene_text_2
            paragraph: 49
            text: |-
              "Uhh... ¡sí!" digo. "Creo que sí, en realidad. Pero no estoy completamente seguro de si es el lugar correcto. Mis recuerdos del interior de mi propia mente en el Plano Etéreo todavía son un poco vagos, pero por lo que puedo decir, se veía muy diferente del lugar en el que vives con Illuna. Quiero decir, el interior de tu mente parecía una casa real, con pinturas en las paredes de tu habitación y todo. Lo que recuerdo de mi mente parece algo así como... un cubo vacío, de algún tipo. Ni siquiera estoy seguro de si es lo suficientemente grande como para estar de pie en él. Yo... creo que antes de que el Supervisor me sacara de mis casillas, estaba sentado, con las piernas dobladas y la espalda apoyada contra la pared."

              "Oh, un cubo..." dice Flower, con voz nostálgica. "Eso me trae recuerdos. Estoy bastante seguro de que yo también vivía en un cubo, antes de cambiar su estructura desde el interior. Eso fue cuando todavía tenía sólo tres años, creo. Como puedes imaginar, mis recuerdos de aquel entonces son un poco confusos, así que no diré que estoy completamente seguro de esto, pero creo que el lugar que recuerdes debería ser tu propia mente, según tu descripción. ¿Puedes decirme la dirección en la que debemos ir? ¿Está lejos de aquí?"

              "No creo que esté tan lejos", digo. "Tengo este... sentimiento que es muy difícil de describir, pero es como si ese lugar estuviera tratando de atraerme hacia él. ¿Entiendes lo que estoy tratando de decir?"
            condition: b3_ch9_enemies != 0
          - source: scene_3
            paragraph: 16
            text: |-
              "Sí", dice Flower. "Cuanto más fuerte sea ese sentimiento, más cerca deberías estar del cubo. ¿Qué tan fuerte dirías que es el sentimiento en este momento?"

              "Yo diría que es tan fuerte como... ¿tal vez un perro tratando de tirar de mí mientras sostengo su correa?" digo. "Pero un perro muy pequeño. O tal vez uno de tamaño mediano, no estoy seguro. ¡Me están tirando de esa manera!"

              "Hmm..." dice Flower, mientras mira en la dirección que estoy señalando. "Si dices que es tan fuerte como un perro tirando de ti, entonces, según mi propia experiencia, eso debería estar a unas cincuenta millas de aquí, más o menos. Nos teletransportar más cerca de tu santuario, y luego podrás decirme si necesitamos teletransportar nuevamente, o si está lo suficientemente cerca como para volar hacia él".

              "Está bien, estoy listo", digo. "¡Vamos!"
            condition: b3_ch9_backup = 0
          - source: scene_3
            paragraph: 17
