              b3_ch9_listen: 1
  - name: b3_ch09b_illusory
    routes:
      - condition: b3_ch9_listen = 0
        texts:
          - source: scene_text
            paragraph: 37
            text: |-
              Decido ignorar la advertencia de la voz y aprovecho la distracción de Peter para golpearlo con el mismo hechizo de rayo que usé al comienzo de nuestra batalla. Por una vez, Peter fue tomado completamente desprevenido por mi ataque, y aunque intentó disiparse en el último segundo, no fue lo suficientemente rápido. Cuando está a punto de perder el conocimiento, Peter usa las pocas fuerzas que le quedan para pronunciarme unas últimas palabras.

              "Tú... cobarde... triste excusa para--" Peter comienza a decir, pero no logra terminar su frase antes de desmayarse.

              Como los Manticoras ilusorios de Peter ahora están desapareciendo, vuelo hacia el rey, para finalmente poder darle una mano a Flower.

              "Flower, ¿estás listo?" Digo, una vez que me acerco a ella y al rey. "¡Atacémoslo juntos a la cuenta de tres!"

              "¿Atacarlo?" Flower pregunta. "¿Pero qué pasa con la voz en nuestras cabezas? Nos advirtió que no..."

              "Escucha, no sobreviví al Magium dos veces solo para dejarme intimidar por personas como esta... personificación del Plano Etéreo, o lo que sea que se suponía que fuera esa voz", digo. "Si éter fue lo suficientemente paciente como para permitirnos llevar la pelea hasta aquí, entonces estoy seguro de que puede esperar un minuto más para que le pongamos un final adecuado. El rey del subsuelo es el único que queda. Acabemos con él rápido, antes de que nos echen de aquí".
          - source: scene_text_2
            paragraph: 44
            text: |-
              "Estás cometiendo un error..." nos dice el rey del subsuelo.

              "Ya veremos eso", digo. "Flower, ¡vamos!"

              "Umm, está bien... ¡seguro!" Flower dice, y luego dispara un rayo de fuego al rey, mientras yo estoy usando otro ataque eléctrico, para ponerle más presión.

              Mientras atacamos el rey del subsuelo, siento que mi conciencia regresa al plano terrestre unas cuantas veces más, pero esta vez las cosas suceden de manera un poco diferente. En lugar de cambiar de perspectiva entre los dos planos de existencia, estoy empezando a tomar conciencia de lo que me rodea en ambos planos simultáneamente. La única otra ocasión en la que experimenté algo similar a esto fue cuando Magium intentó borrarnos a mí y a Leila de la existencia en la torre de seredium.

              Por ahora, mi conciencia principal todavía parece estar en Plano Etéreo, pero al mismo tiempo también tengo el control de mi cuerpo real desde plano terrestre, excepto que en realidad no lo siento como mi cuerpo en este momento. Se siente más como una especie de... marioneta... que estoy controlando con hilos invisibles.
          - source: scene_3
            paragraph: 12
            text: |-
              Ahora que lo pienso, recuerdo que Flower dijo lo mismo sobre su propio cuerpo en el plano terrestre. Que se siente como si estuviera controlando una marioneta. ¿Podría ser así como Flower ha estado viviendo su vida todo este tiempo?

              Mientras estoy ocupado contemplando mi propia existencia, de repente detecto al rey del subsuelo caminando hacia mí en el plano terrestre, mientras todavía estoy tendido boca abajo en el suelo en medio de un charco.

              "Parece que finalmente se te ha acabado la suerte", me dice el rey del subsuelo, y luego empiezo a sentir una poderosa presión formándose sobre mí.
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch09b_floating
