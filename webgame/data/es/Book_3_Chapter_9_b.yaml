          - source: scene_text_2
            paragraph: 43
            text: |-
              Si no hubiera tenido mi estadística Endurecimiento de aura al máximo, probablemente ya me habría desmayado. Dicho esto, probablemente no cancelará su hechizo hasta que me vea perder el conocimiento, así que creo que tal vez necesite actuar un poco.

              "De todos los trucos sucios..." digo, y luego pretendo desmayarme en ambos planos de existencia al mismo tiempo.

              "... ¿Está muerto?" Escucho el rey del subsuelo preguntando en el Plano Etéreo, mientras todavía tengo los ojos cerrados.
          - source: scene_3
            paragraph: 11
            text: |-
              "No", dice Peter, mientras abro ligeramente un ojo para confirmar que me dio la espalda, y luego empiezo a lanzar un hechizo de relámpago con movimientos muy sutiles. "Lo vi despertarse en el plano terrestre, así que pensé que si lo hacía perder el conocimiento allí, le pasaría lo mismo en este avión".

              "Bien pensado", dice el rey. "Ese es un enemigo menos del que preocuparse. Veamos si podemos..."

              Antes de que el rey termine lo que tenía que decir, le disparo a Peter con el mismo hechizo de relámpago que usé al comienzo de la batalla, tomándolo completamente desprevenido.

              "¿Qué?..." dice Peter, mientras se gira hacia mí mientras poco a poco va perdiendo el conocimiento. "¿Cómo estás... todavía despierto?..."

              Estas son las últimas palabras que Peter logra decir antes de desmayarse, y luego también le sucede lo mismo a su cuerpo el plano terrestre.
