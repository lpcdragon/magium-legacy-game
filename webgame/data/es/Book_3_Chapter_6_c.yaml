  - name: b3_ch06c_explanation2
    texts:
      - source: scene_text
        paragraph: 5
        text: |-
          "Así que de eso se trataba tu ritual", dice Kate, en tono serio.

          "Sí", dice Hadrik, con voz algo vacilante. "Para completar la prueba, tuve que empujar la roca por ese acantilado como la primera vez, y matar a todas esas personas inocentes otra vez. Obviamente, no lo sabía al principio, y al igual que ustedes, pensé que esta era mi única oportunidad de cambiar mi error del pasado. Me tomó mucho tiempo entender lo que el ritual realmente quería de mí. Me tomó incluso más tiempo darme cuenta de que tenía que recrear todo lo que sucedió, no solo el empuje de la roca, así que en realidad tuve que bajar al pueblo y revisar cada casa en busca de sobrevivientes inexistentes, observando de cerca a cada una de las personas que he matado, incluidas las mujeres y los niños. No es exactamente la mejor experiencia, considerando lo mucho que he estado tratando de olvidar esos rostros después de que han perseguido mis sueños durante años."

          "Dioses míos, eso es horrible...", dice Flower. "Pero... ¿cómo esto te llevó a pelear con tus padres?"
      - source: scene_text_2
        paragraph: 3
        text: |-
          "Bueno, como puedes imaginar, cuando regresé a nuestro campamento después de este evento, quedé absolutamente devastado", dice Hadrik. "Lo primero que intenté hacer fue ir con el líder de mi campamento para entregarme, junto con mis amigos, por los crímenes de guerra que habíamos cometido. El líder se rió en mi cara, diciéndome que nuestras reglas sobre crímenes de guerra solo se aplicaban a las guerras con otros clanes de gigantes, no a nuestra guerra en curso con los enanos. También me dijo que esos niños probablemente habrían crecido para convertirse en soldados más tarde de todos modos, así que era mejor eliminarlos cuando todavía eran jóvenes. Esa fue la primera vez que me di cuenta Qué diferente trataría nuestra gente el concepto de honor cuando se trata de razas distintas a los gigantes. Obviamente, no podía dejar esto pasar, y traté de hacer justicia para esos enanos muertos por todos los medios a mi disposición. Los otros gigantes pensaron que estaba bromeando al principio, pero cuando entendieron que hablaba en serio, comenzaron a tratarme con mucha más frialdad, llamándome simpatizante de los enanos y diciendo que ya no tenía derecho a llamarme guerrero después de ponerme del lado de los nuestros. enemigo."

          "¿Es por eso que Gontrok dijo que tus padres creen que has perdido tu honor?" pregunta Daren.
      - source: scene_3
        paragraph: 3
        text: |-
          "No sólo por esto, sino que fue parte de la razón, sí", dice Hadrik. "La otra parte de la razón fue el hecho de que cuando me di cuenta de que no podía obtener justicia para los enanos muertos quedándome con mi clan, decidí ir a un exilio autoimpuesto, transformándome en un enano para poder infiltrarme en las tierras de los enanos y localizar a los familiares restantes de los civiles inocentes que maté en esa aldea. Obviamente, dejar el clan por una razón como esta garantizaría que ya no sería bienvenido si alguna vez decidiera regresar. No me importaba, porque lo único que quería era hacer las cosas bien."

          "¿Al final lograste encontrar a alguno de esos familiares?" dice Kate.

          "Lo hice", dice Hadrik. "Resultó que algunos de los enanos que maté esa noche solo estaban visitando la aldea, y dejaron a sus hijos atrás, en sus propios pueblos. Cuando me enteré de esto, me encargué de criar a esos niños hasta que alcanzaran la mayoría de edad, y también ayudé a algunos otros niños que habían quedado huérfanos debido a la guerra, a lo largo de los años. Finalmente, la guerra entre los gigantes y los enanos terminó, y los niños a los que ayudé habían crecido, ahora tenían sus propios trabajos, esposas y hijos, pero ya no tenía un lugar al que llamar hogar en la nación gigante, así que decidí permanecer en las tierras de los enanos y continuar mi vida transformado en un enano".

          "¿Esos enanos nunca descubrieron que eras un gigante?" Melindra dice.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch06c_explanation3
  - name: b3_ch06c_explanation3
    texts:
      - source: scene_text
        paragraph: 6
        text: '"La mayoría de ellos se enteraron en un momento u otro", dice Hadrik, "pero para entonces yo ya había vivido con ellos durante mucho tiempo, por lo que ya no les importaba mucho. Después de pasar tanto tiempo en las tierras de los enanos, comencé a hablar, actuar y beber como cualquier otro enano, por lo que la mayoría de ellos no vieron mucha diferencia para empezar. Sin embargo, lo único que todavía anhelaba era luchar. Como gigante, estaba prácticamente en mi sangre, y me había cansado un poco de tener que contenerme durante las peleas en las tabernas para no matar a nadie por accidente. Es por eso que eventualmente comencé a emprender aventuras por todo el mundo, para finalmente poder encontrar algunos adversarios que pudieran brindarme un verdadero desafío. Siempre terminaría regresando a las tierras de los enanos después de un tiempo, e iría a beber un poco más a sus tabernas, pero incluso después de todo este tiempo, todavía nunca tuve las agallas para decirles cuál fue mi razón inicial para comenzar a cambiar de forma como enano. Tal vez algún día les cuente sobre esa aldea enana. Tal vez algún día..."'
      - source: scene_text_2
        paragraph: 4
        text: |-
          Cuando Hadrik termina su historia, me doy cuenta de que en algún momento todos dejamos de movernos y simplemente estábamos parados en círculo alrededor de Hadrik, escuchando atentamente lo que tenía que decir.

          "Hadrik", dice Daren, mientras pone su mano sobre su hombro. "¿Podrías hacerme un favor y servirnos dos vasos de cerveza enana? Dos vasos más pequeños, quiero decir. Como los que usaste para el cumpleaños de Flower. No quiero emborracharme demasiado para poder concentrarme en mis hechizos curativos". 

          "¡¿Acabas de ofrecerte a beber conmigo... durante el día?!" pregunta Hadrik, aparentemente en estado de shock total. "¡Pero nunca bebes durante el día!"
      - source: scene_3
        paragraph: 4
        text: |-
          "Sí, bueno... pensé que haría una excepción esta vez", dice Daren, "ya que estoy bastante seguro de que realmente te vendría bien un trago ahora mismo".

          Cuando Hadrik entiende lo que quiere decir Daren, sonríe y luego saca una de sus botellas de cerveza enana de su mochila.

          "Tienes razón", dice Hadrik. "Realmente me vendría bien un trago. Toma, sostén esta botella por un segundo, mientras saco dos vasos. ¿O debería sacar tres? Barry, ¿tienes ganas de unirte?"
    choices:
      - position: 1
        text: Bebe un vaso de cerveza enana con Daren y Hadrik.
        effects:
          - set:
              current_scene: b3_ch06c_drink
              b3_ch6_drink: 1
      - position: 2
        text: No bebas con ellos.
        effects:
          - set:
              current_scene: b3_ch06c_drink
              b3_ch6_drink: 0
  - name: b3_ch06c_drink
    routes:
      - condition: b3_ch6_drink = 1
        texts:
          - source: scene_text
            paragraph: 7
            text: |-
              "Claro, beberé un vaso", digo.

              "Perfecto", dice Hadrik, mientras nos entrega los vasos y luego comienza a llenarlos con cerveza. "En ese caso, brindemos por nuestra contundente victoria contra los guardias reales. Quiero decir, hubiera sido un poco mejor si lograra eliminar a Gontrok para siempre, pero al menos lo hicimos correr con el rabo entre las piernas. ¡Salud!"

              "¡Salud!" Daren y yo decimos, y luego todos bebemos la cerveza de los vasos pequeños de un trago.

              "Probablemente deberíamos ponernos en marcha ahora", dice Hadrik, mientras guarda los vasos y la botella en su mochila. "Ya hemos hecho esperar bastante a esas personas en la zona de cuarentena".
          - source: scene_text_2
            paragraph: 5
            text: |-
              Después de caminar por el túnel por un tiempo, finalmente llegamos a la sala de espera, donde Daren se separa de nosotros y entra al área de cuarentena una vez más. Mientras esperamos que Daren cure a todos los enfermos, Kate continúa su entrenamiento con Melindra en uno de los pasillos vacíos, mientras que Hadrik y Flower también van a hacer sus propios entrenamientos separados en otras áreas más vacías de la base rebelde.

              "Creo que voy a hacerle una visita rápida a mi padre para ver cómo está", me escribe Leila. "¿Quieres venir?"

              "Claro", digo. "¡Dirige el camino!"

              Ambos nos abrimos camino hacia uno de los túneles que salen de la sala de espera y luego comenzamos a dirigirnos hacia el taller del doctor Reidzek a un ritmo relajado.  Mientras caminamos, veo las letras azules de Leila flotando frente a mí, moviéndose a la misma velocidad que nosotros para poder leerlas con claridad.

              "El que nosotros dos caminemos juntos solos a través de este túnel subterráneo nos trae recuerdos, ¿no?" Escribe Leila con una sonrisa. "¡Casi parece como si estuviéramos de nuevo debajo del área de nuestra división en Thilias, tratando de sabotear el evento de la arena!"
