  - name: b3_ch06c_panic
    texts:
      - source: scene_text
        paragraph: 13
        text: |-
          "¡Alberto!" dice Pedro. "¡Barry nos traicionó! ¡Lo escuché hablando con Gontrok en el transceptor hace un momento mientras estaba en la sala del teletransportador! ¡Los guardias reales recibieron la aprobación del rey de Ollendor para matar a todos en el subsuelo, y Barry los está ayudando! ¡Tienes que decírselo a nuestro rey, rápido!"

          "¿Barry está trabajando con la guardia real?..." dice Albert, sorprendido. "¡No, no, eso es imposible! Su hermano fue asesinado por--"

          "¡Su hermano está vivo!" dice Pedro. "Barry nos ha estado mintiendo todo este tiempo. ¡Su hermano está vivo y está siendo rehén del rey de Ollendor! ¡Por eso nos traicionó! Escuché a Gontrok amenazar con matar a su hermano si no obedecía sus órdenes. ¡Y se llevaron al doctor Reidzek también! Hicieron que Barry lo teletransportara a una de las torres de seredium, para que pueda ayudarlos a controlar al Supervisor porque también es un lessathi que es bueno jugando con viejos dispositivos, como Billy Bob!"

          "¡¿Qué?!" Escribe Leila, empezando a entrar en pánico.

          "¡¿El doctor Reidzek ha sido secuestrado?!" dice Alberto. "¡Tenemos que ir a salvarlo ahora! ¿Sabes en cuál de las torres--"
      - source: scene_text_2
        paragraph: 11
        text: |-
          "¡Albert, escúchame, no hay tiempo!" dice Pedro. "¡Barry ha estado teletransportando guardias en las cavernas directamente encima de ti durante una hora entera! ¡Van a derribar el techo y atraparte dentro como ratas en cualquier momento! Tienes que evacuar a todos, ¿me oyes? Tienes que-- ARGH--"

          "Peter, ¡¿qué está pasando allí?!" dice Alberto. "¡¿Pedro?!"

          "Me están persiguiendo algunos aprendices de la guardia real", dice Peter. "Uno de ellos acaba de dispararme con un proyectil. Lo siento, necesito cerrar el transceptor ahora. ¡Buena suerte!"

          "¡Maldita sea!" Albert grita, mientras Peter cierra su transceptor.

          Albert luego mira a un hombre frente a él, que parece haber escuchado toda la conversación y está ahí parado, congelado.

          "¿Por qué estás ahí parado?" Alberto le dice. "Escuchaste lo que dijo Peter. Ve y dile al rey que evacue a todos ahora mismo. ¡Voy a salvar a Peter!"
      - source: scene_3
        paragraph: 10
        text: |-
          Luego corre hacia la sala del teletransportador, volviéndose invisible en el camino, mientras el hombre con el que habló antes se dirige a la sala del trono para advertir al rey sobre lo que está sucediendo. Justo cuando estoy tratando de decidir qué hacer, Leila comienza a correr hacia la sala del teletransportador también, pero la agarro del brazo y la detengo en seco.

          "Leila, ¿adónde vas?" Le digo.

          "Barry... ¡mi padre!" Escribe Leila, luciendo extremadamente asustada. "¡Necesito ir a salvar a mi padre!"

          Al ver la expresión que tiene en su rostro, puedo decir claramente que está demasiado asustada para pensar con claridad en este momento. La mirada que tiene en sus ojos inmediatamente me recuerda el momento en que casi se ahoga en el lago subterráneo, mientras intentaba gritar, pero no salían palabras de su boca.

          "¡Leila, mírame!" Le digo, mientras la agarro ligeramente por los hombros. "Vamos a salvar a tu padre. Juntos. Pero por ahora, voy a necesitar que te calmes, ¿de acuerdo? Si quieres ayudar a tu padre debes pensar con claridad. ¿Entiendes?"

          "¡Sí!" Escribe Leila, mientras intenta salir poco a poco de su estado de pánico. "Sí, lo entiendo..."
