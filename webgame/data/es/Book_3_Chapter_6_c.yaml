              "Claro", dice Peter, que parece haber entrado recientemente en la sala de espera y ahora se acerca a nosotros. "¿Qué es?"
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch06c_herbs
  - name: b3_ch06c_herbs
    texts:
      - source: scene_text
        paragraph: 12
        text: |-
          "El doctor Reidzek ha estado desaparecido por un tiempo, y lo último que sabemos sobre él es que fue a la sala del teletransportador para realizar algunas tareas de mantenimiento periódicas", dice Albert. "Intentamos llamarlo a él y a Barry por el transceptor, pero ninguno de los dos responde. ¿Podrías hacerle una visita rápida a Barry para ver si hay algún problema? Y asegúrate de tener el transceptor abierto, para poder contactarnos en caso de una emergencia".

          "Entendido", dice Peter. "¡Ya vuelvo!"

          "Gracias", dice Albert. "¡Oh, y Peter! ¿Podrías también mantener oculta tu aura mientras te acercas a la sala del teletransportador? Por si acaso."

          "Entendido", dice Peter en un tono más serio, y luego se dirige al túnel que conduce a la sala del teletransportador sin decir una palabra más.

          "Estoy seguro de que el doctor Reidzek está bien", le dice Albert a Leila, cuando ve la expresión ansiosa en su rostro. "Debe haberse quedado demasiado atrapado en su trabajo, como siempre. Sólo tenemos que esperar hasta que Peter llegue a la sala del teletransportador y tendremos noticias de tu padre nuevamente".

          "Sí", escribe Leila, como si ahora estuviera aún más ansiosa que antes. "Sólo tenemos que esperar".

          Mientras estamos allí, esperando que Peter se comunique con nosotros, vemos a Daren saliendo del área de cuarentena y comenzando una conversación con Desmond, quien todavía está vigilando la puerta.
      - source: scene_text_2
        paragraph: 9
        text: |-
          "Desmond, lo... lo siento mucho", dice Daren, con la cabeza inclinada. "No hay forma de salvar a tu hermano. Su enfermedad es demasiado grave en este momento. Si hubiera llegado aquí unos días antes, es posible que todavía hubiera tenido una oportunidad, pero tal como están las cosas ahora es que... él también lo es... Lo siento..."

          "Está bien", dice Desmond, en tono resignado. "No necesitas castigarte por eso. Estoy seguro de que has hecho todo lo que pudiste. ¿Qué pasa con los demás? ¿Hay alguna posibilidad de que alguno de ellos se recupere?"

          "La mitad de ellos ya están curados, incluyéndome a mí", dice Daren. "En cuanto a la otra mitad, todavía es difícil decirlo. Este tratamiento funciona mejor si se detecta la enfermedad en sus primeras etapas, pero si se detecta demasiado tarde, las posibilidades de supervivencia disminuyen drásticamente. Los que están en condiciones críticas no lo lograrán, pero aquellos cuyos síntomas son sólo un poco severos aún pueden tener una oportunidad. Tendremos que esperar un poco más hasta que podamos sacar algunas conclusiones definitivas".

          "Incluso si es sólo la mitad de ellos, esto es mucho más de lo que podríamos haber esperado", dice Desmond. "Hasta hoy, cualquiera que atravesara esa puerta era considerado hombre muerto. Ahora es posible que ya no necesitemos enviar a la gente a cuarentena. Deberías estar orgulloso de lo que has logrado aquí, sanador. Tal vez mi hermano no lo logrará, pero muchas familias ahora podrán volver a ver a sus seres queridos después de pensar que estaban muertos. Debería ser yo quien se disculpe por haberte juzgado mal. Todos estamos en deuda contigo".
      - source: scene_text_2
        paragraph: 10
        text: |-
          "Desmond, quería decirte que tu hermano ya no corre peligro de morir a causa de la enfermedad", dice Daren. "Todavía le llevará un tiempo recuperarse por completo, porque su estado era muy grave, pero si todo va bien, deberíamos poder volver a verlo en una semana o dos".

          "¿Hablas en serio?..." Desmond le pregunta a Daren, luciendo como si todavía estuviera luchando por darle sentido a lo que acaba de escuchar. "¡No, no puede ser! ¡Esto tiene que ser un error! ¡Mi hermano ya no podía salvarse en este momento! ¿Cómo puedes estar tan seguro de que realmente fue él y no otra persona?"

          "Porque dos enfermeras distintas me dijeron que él es el hermano del hombre llamado Desmond que está vigilando la puerta", dice Daren. "No me vas a decir que hay dos Desmond separados custodiando esta misma puerta, ¿verdad?"

          "No... es sólo que yo... no sé qué decir..." dice Desmond, luciendo como si estuviera tratando de no dejar que su alegría lo abrume, ante la remota posibilidad de que Daren esté siendo demasiado optimista. "¡Gracias! Nunca pensé que realmente lo harías... ¡Estaba tan seguro de que eras simplemente un soñador empedernido como el resto de ellos! Ni en mis sueños más locos podría haberlo imaginado... espera, ¿qué pasa con las otras personas en la zona de cuarentena? ¿A cuántos de ellos lograste salvar?"
        condition: b3_ch6_password = 3
