scenes:
  - name: b3_ch06c_explanation
    effects:
      - set:
          ac_b3_ch6_average: 1
        achievement:
          id: ac_b3_ch6_average
          title: Promedio es mi segundo nombre
        condition: strength = 0 AND agility = 0 AND toughness = 0 AND reflexes = 0 AND hearing = 0 AND perception = 0 AND ancient_languages = 0 AND combat_technique = 0 AND premonition = 0 AND bluff = 0 AND magical_sense = 0 AND aura_hardening = 0
    routes:
      - condition: b3_ch6_kelrim <> 1 AND b3_ch6_plan <> 3
        texts:
          - source: scene_text
            paragraph: 2
            text: |-
              "También deberíamos volver a la sala de espera", nos dice Daren. "Hasta luego, Barry. ¡Y ​​gracias por la ayuda!"

              "En cualquier momento..." dice el tipo del teletransportador, y luego todos salimos de la sala del teletransportador para dirigirnos al túnel que conduce a la base rebelde.

              Mientras caminamos, Daren comienza a curar a todos los que resultaron heridos durante la batalla.

              "Entonces, uhm..." dice Hadrik, mientras Daren está ocupado curando a Leila. "Supongo que les debo a todos una explicación sobre todas esas... cosas que Gontrok dijo sobre mí mientras estábamos peleando."
          - source: scene_text_2
            paragraph: 2
            text: |-
              "Sólo si estás listo para hablar de ello", le dice Daren.

              "Sí..." dice Hadrik, mientras mira hacia un lado por un segundo. "Sí, creo que estoy listo".

              "Oh, ¿entonces finalmente les vas a contar sobre tu ritual con la aldea enana y las rocas?" Arraka dice, de repente. "Ya era hora, si me preguntas. Guardar tu pequeño secreto realmente estaba empezando a convertirse en más problemas de lo que valía la pena".

              "¿Lo sabías?...", le pregunta Hadrik, estupefacto.

              "¡Por supuesto que lo sabía!" dice Arraka. "¿En serio pensaste que yo me saltaría tu ritual, de todas las personas? Tu juicio fue obviamente el primero que visité. Para que lo sepas, ahora me debes dos cervezas, enano. Una por salvarte del capitán ogro esa vez, y otra por no revelar la verdad sobre Gontrok y la aldea de los enanos. La próxima vez que salga de este amuleto, espero que pagues".

              "Sí", dice Hadrik, con media sonrisa. "¡Me aseguraré de guardar algunas botellas de cerveza enana para la ocasión!"

              Hace una pausa.

              "Ejem", tose Hadrik nerviosamente, mientras se gira hacia el resto de nosotros. "Entonces, ¿por dónde debería empezar?... ¿Recuerdan esa vez que mencioné sin pensarlo que yo era una especie de oveja negra de mi familia?"

              "¡Sí, lo recuerdo!" Flower dice. "¡Dijiste que las razones por las que no le agradabas a tu familia no tenían nada que ver con tu tamaño!"
          - source: scene_3
            paragraph: 2
            text: |-
              "Exactamente", dice Hadrik. "Bueno, resulta que la razón por la que mi familia me odia es bastante simple, y está directamente relacionada con los eventos que me vi obligado a revivir durante la prueba del Dios del Tiempo. Para empezar desde el principio... Gontrok y algunos otros amigos comunes nuestros me despertaron una noche y me contaron sobre cierta aldea enana que supuestamente estaba siendo utilizada como base temporal para una fuerza de ataque enana que iba a atacar nuestro campamento en los próximos días. Esto fue hace más de cincuenta años, y estábamos en una guerra bastante desagradable con los enanos en ese momento, así que realmente no tenía ninguna razón para sospechar que me estarían mintiendo sobre esto."

              "Entonces, ¿no era una base militar?" pregunta Daren. "¿Era sólo un pueblo normal?"

              "Sí", dice Hadrik. "La aldea en cuestión no era más que un pequeño pueblo enano normal que no tenía soldados en absoluto. Probablemente debería haberme dado cuenta de esto cuando noté que ni siquiera tenían vigías apostados durante la noche, pero me engañé pensando que estaban muy bien escondidos y que podían saltar de los arbustos para atacarnos en cualquier momento. Gontrok me convenció de que necesitábamos tomar la iniciativa antes de que tuvieran la oportunidad de atacar primero, y me llevó a la cima de un acantilado que supervisa el valle en el que se encuentra el pueblo. La razón por la que nos llevó hasta allí fue por algunas rocas enormes que estaban colocadas justo en la cima, que eran demasiado grandes para ser movidas por alguien que no fuera gigantes como nosotros. Él quería que los empujáramos a todos por el acantilado simultáneamente, para que rodaran hasta el pueblo y destruyeran las casas antes de que cualquiera de los aldeanos tuviera tiempo de reaccionar."
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch06c_explanation2
      - condition: b3_ch6_plan = 3
        texts:
          - source: scene_text
            paragraph: 3
            text: |-
              "Chicos, tengo algunas tareas domésticas que hacer, así que cerraré el transceptor ahora", nos dice Rose. "Trata de no meterte en problemas por el resto del día, ¿vale? No creo que pueda congelar el tiempo más hasta que descanse un poco".

              "Intentaremos ser más cuidadosos a partir de ahora", le digo a Rose. "¡Adiós y gracias de nuevo!"

              Una vez que Rose cierra el transceptor, Daren comienza a curar a todos los que resultaron heridos durante la batalla, mientras avanzamos con paso firme hacia la sala de espera.

              "Entonces, uhm..." dice Hadrik, mientras Daren está ocupado curando a Leila. "Supongo que les debo a todos una explicación sobre todas esas... cosas que Gontrok dijo sobre mí mientras estábamos peleando."
