            paragraph: 8
            text: |-
              "Creo que pasaré, por ahora", digo. "No quiero arriesgarme a emborracharme en caso de que tengamos otra batalla más tarde".

              "Haz lo que quieras", dice Hadrik, mientras le entrega a Daren su vaso y luego comienza a llenarlo con cerveza. "En ese caso, Daren, dedicaré este brindis porque finalmente sales de tu caparazón y te ofreces a beber conmigo a una hora tan temprana. Tal vez no toda esperanza esté perdida, y tú también algún día llegarás a apreciar la querida tradición enana de estar borracho en cualquier momento del día, ¿eh? ¿Qué dices? ¡Jajajaja!"

              "¡Lo deseas!" Daren dice con una sonrisa, mientras los dos chocan sus vasos pequeños y luego ambos beben la cerveza de un trago.

              "Probablemente deberíamos ponernos en marcha ahora", dice Hadrik, mientras guarda los vasos y la botella en su mochila. "Ya hemos hecho esperar bastante a esas personas en la zona de cuarentena".
