  - name: b3_ch06c_swimming
    texts:
      - source: scene_text
        paragraph: 9
        text: |-
          "En realidad, yo también solía ser bastante malo nadando, hasta que una vez estaba explorando una cueva con un profesor de arqueología y terminamos atrapados dentro", digo. "Para llegar a la única otra salida, necesitábamos nadar a través de una larga sección submarina de la cueva, y como ambos éramos bastante mal nadadores, tuvimos que pasar horas y horas aprendiendo a contener la respiración durante largos períodos de tiempo y a movernos rápido bajo el agua. Lo curioso es que esta fue probablemente la parte más fácil de todas las cosas que tuvimos que hacer para salir de esa cueva".

          "¿Es esta otra de tus historias 'mundanas' de cuando hacías trabajos ocasionales y viajabas por el mundo?" Escribe Leila, con una pequeña sonrisa.

          "Está bien, está bien, lo admito", digo. "Tal vez, en retrospectiva, algunas de estas historias no son tan aburridas como inicialmente pensé. Ahora, ¿quieres escuchar el resto de la historia o no?"

          "Soy toda oídos", escribe Leila, con una sonrisa, mientras seguimos caminando lentamente hacia el taller de su padre.
      - source: scene_text_2
        paragraph: 7
        text: |-
          Cuando termino de contarle mi historia a Leila, finalmente llegamos a la puerta del doctor Reidzek y llamamos varias veces para hacerle saber que estamos aquí. Al ver que no responde incluso después de que lo llamo, concluimos que no debe estar en su taller en este momento y decidimos esperarlo aquí.

          Mientras esperamos, Leila y yo nos sentamos en el suelo, de espaldas a la puerta, y comenzamos a intercambiar historias sobre nuestras vidas antes del torneo. Leila me cuenta sobre su vida con su padre después de que ella dejó la baliza y yo le cuento varias cosas que he visto mientras viajaba por el Continente Occidental. 

          Por alguna razón, hablar con Leila de esta manera se siente realmente natural, como si nos conociéramos desde hace mucho tiempo y ahora estuviéramos poniéndonos al día con lo que el otro ha estado haciendo desde la última vez que hablamos. Nuestra conversación fluye sin esfuerzo de un tema a otro, haciéndonos perder la noción del tiempo a medida que ambos nos relajamos cada vez más. 

          "Ha pasado un tiempo desde que tuvimos la oportunidad de simplemente hablar y relajarnos así, ¿no es así?" Escribe Leila, mientras estira perezosamente los brazos sobre su cabeza. "Últimamente, parece que todo lo que hemos estado haciendo durante nuestro tiempo libre es entrenar y más entrenamiento. Los únicos momentos en los que realmente podemos relajarnos un poco son en nuestros turnos de noche".
      - source: scene_3
        paragraph: 6
        text: |-
          "Habla por ti mismo", le digo. "La última vez que tomé un turno de noche con Daren, me hizo pararme en el lugar y girar una y otra vez para poder estudiarme desde todos los ángulos como parte de su entrenamiento de aura. Incluso me hizo pararme sobre un pie mientras me tocaba la nariz con ambas manos. ¡Ni siquiera estoy bromeando!"

          Leila se ríe en silencio.

          "Eso no suena tan mal", escribe. "Al menos no tan malo como esa vez cuando Kate casi me da un ataque al corazón durante uno de nuestros turnos de noche al saltar del suelo de repente y matar algunos pájaros al azar con sus carámbanos porque pensó que un mago enemigo los convocó como exploradores..."

          Ella hace una pausa.

          "Oye, tal vez deberíamos hacer un turno de noche juntas también en algún momento", escribe Leila, "sería un buen cambio de ritmo. Y te prometo que conmigo no tendrás que preocuparte de que te digan que te pares sobre un pie y gires en el lugar... mucho".
    choices:
      - position: 1
        text: Acepta tomar el siguiente turno de noche con Leila.
        effects:
          - set:
              current_scene: b3_ch06c_shift
              b3_ch6_shift: 1
      - position: 2
        text: Dile que estaba planeando trabajar en el siguiente turno de noche con Hadrik para animarlo.
        effects:
          - set:
              current_scene: b3_ch06c_shift
              b3_ch6_shift: 0
  - name: b3_ch06c_shift
    routes:
      - condition: b3_ch6_shift = 1
        texts:
          - source: scene_text
            paragraph: 10
            text: |-
              "Sí, eso no parece una mala idea", digo. "Estoy hablando, por supuesto, de hacer nuestro próximo turno de noche juntos y no de la parte de 'girar sobre una pierna'".

              "Ya lo he descubierto, pero gracias por aclararlo", escribe Leila con una sonrisa. "Entonces... ¿tomaremos el segundo turno esta noche, entonces?"

              "¡Suena bien!" digo.

              "¡Estaré deseando que llegue!" Escribe Leila.

              Después de una breve pausa durante la cual ninguno de los dos dice nada, el escrito de Leila aparece nuevamente frente a mí.

              "Mi padre seguro que está tardando un poco en volver, ¿no?" escribe, ahora pareciendo un poco preocupada.

              "¿Tienes la frecuencia mágica de su transceptor, así que puedo intentar llamarlo?" Le pregunto.

              "No", escribe Leila, mientras niega con la cabeza. "No hay forma de comunicarme con él a través de un transceptor, así que realmente no tenía muchas razones para pedirle su número de frecuencia".

              "Bueno, supongo que podríamos intentar preguntar en la sala de espera si alguien vio adónde fue", digo. "Sólo hay un corredor que conduce desde aquí a la sala de espera, por lo que es casi seguro que deberíamos toparnos con él en nuestro camino hacia allí si regresa".

              "Sí", escribe Leila. "Probablemente deberíamos hacer eso".
          - source: scene_text_2
            paragraph: 8
            text: |-
              Ambos nos levantamos y comenzamos a caminar nuevamente por el mismo corredor, regresando al lugar de donde vinimos originalmente. Mientras caminamos, no puedo evitar notar que Leila parece un poco ansiosa.

              "¿Crees que mi padre está bien?..." me escribe al cabo de un rato.

              "¡Oye, estoy seguro de que está bien!" Le digo. "Conociéndolo, probablemente fue a arreglar algún aparato que es demasiado grande para volver a trasladarlo a su taller, y por eso no ha regresado todavía".

              "Sí", escribe Leila, como si estuviera tratando de convencerse a sí misma de que todo está bien. "Sí... eso es probablemente lo que pasó."

              Después de unos minutos más, finalmente llegamos a la sala de espera y comenzamos a preguntar a la gente que estaba allí si vieron pasar al doctor Reidzek, pero ninguno parece haberse topado con él últimamente. Mientras interrogamos a todas las personas que están alrededor, vemos a Albert acercándose a nosotros, quien parece haber venido desde la dirección de la sala del trono.

              "¿Doctor Reidzek?..." dice Albert, después de que le hacemos la misma pregunta que le hicimos a todos los demás en la sala. "Creo que fue a enseñar a nuestros magos blancos más jóvenes cómo usar sus dispositivos de curación hace unas horas... Ah, y después de eso recibió una llamada de Barry para que lo ayudara a hacer un mantenimiento regular en el dispositivo de teletransportación. Sin embargo, eso fue hace más de una hora. ¿No ha regresado desde entonces?"

              "No", escribe Leila. "Lo hemos estado esperando todo este tiempo frente a su taller, pero no ha regresado".
          - source: scene_3
            paragraph: 7
            text: |-
              "Bueno, es posible que esta vez el mantenimiento del teletransportador le esté llevando un poco más de tiempo de lo habitual", dice Albert. "¿Quieres que lo llame?"

              "Sí, por favor", escribe Leila. "Si no es mucha molestia."

              "Está bien", dice Albert, mientras saca su transceptor.

              Luego cambia la frecuencia del transceptor y lo toca una vez, mientras se lo acerca a la boca.

              "Doctor Reidzek, ¿puede oírme?" Dice Albert, pero luego revisa su transceptor nuevamente, mirando su pantalla con mucha atención. "Hmm... Eso es extraño. Su transceptor parece estar cerrado. Sé que hace esto a veces para no perder la concentración mientras trabaja en algo realmente complicado, pero ¿realmente necesitaría concentrarse tanto en arreglar el teletransportador?... Dame un momento. Intentaré llamar a Barry en su lugar".

              Albert cambia la frecuencia del transceptor y lo toca nuevamente, pero una vez más no obtiene ninguna respuesta.

              "Tampoco puedo comunicarme con Barry", dice Albert, visiblemente frustrado. "Está hablando con alguien más en el transceptor. Tendremos que esperar a que termine su conversación antes de que podamos... en realidad, ¿sabes qué? No importa. ¡Oye, Peter! ¿Puedes venir aquí un momento?"

              "Claro", dice Peter, que parece haber entrado recientemente en la sala de espera y ahora se acerca a nosotros. "¿Qué es?"
        choices:
