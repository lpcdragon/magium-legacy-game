      - source: scene_3
        paragraph: 8
        text: |-
          "Realmente lamento lo de tu hermano", dice Daren, luciendo genuinamente deprimido. "Ojalá hubiera podido salvar a todos. Lo único que puedo decirles es que sus últimos momentos serán un poco mejores ahora que dos de las enfermeras han sido curadas de la enfermedad, por lo que podrán dedicar más tiempo a cuidar a los pacientes".

          "Has hecho más que suficiente", dice Desmond. "Ve a descansar un poco. Te lo has ganado".

          "Lo haré pronto", dice Daren. "Gracias."

          Luego comienza a caminar hacia uno de los túneles que salen de la sala de espera, pero cuando nos ve a Leila y a mí se detiene para darnos una breve actualización sobre lo que está haciendo.

          "¡Lo siento, no tengo tiempo para charlar!" Daren nos lo cuenta desde la distancia. "¡Necesito ir a buscar a los magos blancos de los rebeldes para poder enseñarles cómo curar esta enfermedad por sí mismos una vez que yo ya no esté aquí!"

          "¡No te preocupes!" Le digo en voz alta. "Ve y haz lo que tengas que hacer. ¡Estaremos aquí cuando regreses!"

          "Está bien", dice. "¡Hasta luego!"

          No mucho después de que Daren abandona la habitación, finalmente escuchamos la voz de Peter proveniente del transceptor de Albert, pero su tono parece muy alerta y respira con dificultad, como si estuviera corriendo.

          "¡Alberto!" Pedro dice en voz alta. "Alberto, ¿estás ahí?"

          "¡Sí!" dice Alberto. "¿Qué pasó? ¿Dónde está el doctor Reidzek?"
      - source: scene_3
        paragraph: 9
        text: |-
          "La mayoría de los pacientes se encuentran ahora en condición estable", dice Daren. "Todavía hay algunos de ellos que no se han curado por completo porque habían sido afectados muy gravemente por la enfermedad, pero las enfermeras están haciendo todo lo posible para estabilizarlos mientras hablamos. Mientras tanto, me reuniré con algunos de sus magos blancos para poder enseñarles qué hechizos y qué medicamentos necesitan usar para curar a las personas que se enferman después de que yo ya no esté aquí".

          "Bueno, en ese caso no te retendré más", dice Desmond. "Ve a hacer lo que tengas que hacer. Y que los dioses te bendigan, sanador... Todos estamos en deuda contigo".

          Daren le hace un gesto con la cabeza y luego comienza a caminar hacia uno de los túneles que salen de la sala de espera cuando finalmente nos ve a Leila y a mí.

          "¡Lo siento, no tengo tiempo para charlar!" Daren nos lo cuenta desde la distancia. "Necesito ir a buscar--"

          "¡Sí, sí, te escuchamos la primera vez!" Le digo en voz alta. "¡Ve a hacer lo tuyo! ¡Estaremos aquí cuando regreses!"

          "Está bien", dice. "¡Hasta luego!"

          No mucho después de que Daren abandona la habitación, finalmente escuchamos la voz de Peter proveniente del transceptor de Albert, pero su tono parece muy alerta y respira con dificultad, como si estuviera corriendo.

          "¡Alberto!" Pedro dice en voz alta. "Alberto, ¿estás ahí?"

          "¡Sí!" dice Alberto. "¿Qué pasó? ¿Dónde está el doctor Reidzek?"
