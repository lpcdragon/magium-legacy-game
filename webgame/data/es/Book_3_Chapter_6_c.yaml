      - condition: b3_ch6_kelrim = 1
        texts:
          - source: scene_text
            paragraph: 4
            text: |-
              "Kate, quería preguntarte", dice Melindra, mientras entramos al túnel. "¿Cómo lograste deshacer la técnica del aura del capitán antes? ¿Has estado practicando más sin decírmelo?"

              "No sin decírtelo", dice Kate. "Estuviste allí cuando pegué un carámbano a mi mano con mi aura esta mañana, ¿recuerdas?"

              "¡Oh, claro, tú hiciste eso!" Melindra dice. "Casi lo olvido. ¿Pero era eso realmente todo lo que necesitabas para descubrir cómo cancelar la técnica del capitán?"

              "No, pero Daren mencionó ayer que para desenredar un aura, debes imaginarte a ti mismo desatando nudos", dice Kate. "Me tomó un tiempo entender qué quería decir exactamente con eso, pero afortunadamente logré entenderlo antes de que el capitán nos matara a todos".

              "Vaya", dice Daren. "¿Entendiste lo que tenías que hacer sólo con eso? ¡Estoy impresionado!"

              "No fue fácil", dice Kate. "Con suerte, la próxima vez que hables sobre conceptos abstractos como este se te ocurrirán algunas metáforas mejores".

              "¡Haré lo mejor que pueda!" dice Daren.

              Luego comienza a curar a todos los que resultaron heridos durante la batalla, mientras continuamos avanzando constantemente hacia la sala de espera.

              "Entonces, uhm..." dice Hadrik, mientras Daren está ocupado curando a Leila. "Supongo que les debo a todos una explicación sobre todas esas... cosas que Gontrok dijo sobre mí mientras estábamos peleando."
