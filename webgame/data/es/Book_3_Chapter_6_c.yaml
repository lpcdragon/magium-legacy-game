  - name: b3_ch06c_transceivers
    texts:
      - source: scene_text
        paragraph: 16
        text: |-
          Mientras Leila se calma, decido que lo primero que tengo que hacer es llamar a mis amigos y contarles lo que pasó. Mientras saco mi transceptor y empiezo a girar el dial para cambiar el número de frecuencia, mis manos temblorosas me hacen girar el dial con demasiada fuerza dos veces seguidas, antes de que finalmente obtenga el número correcto. Parece que no debería ser yo quien dé consejos sobre cómo mantener la calma. Yo también estoy bastante nervioso.

          "Daren, ¿estás ahí?" Le digo al transceptor después de tocarlo.

          "Sí, estoy aquí con los curanderos", dice Daren. "¿Qué ocurre?"

          "No tengo mucho tiempo para explicar, así que escuchen", le digo. "Aparentemente Barry Nubarrón de la sala de teletransporte nos traicionó, y teletransportó a muchos guardias en las cavernas justo encima de nosotros. Van a volar el techo para que caiga encima de nosotros. Además, el padre de Leila fue secuestrado y el rey lo retiene en una de las torres de seredium. Ven rápido a la sala de espera. Intentaré decirles a los demás que se reúnan aquí también".
      - source: scene_text_2
        paragraph: 14
        text: |-
          "Está bien", dice Daren, sin hacerme ninguna pregunta. "Llama a Kate y Flower. Yo llamaré a Hadrik. Será más rápido de esta manera".

          "Correcto", digo. "Gracias. Hablaré contigo más tarde."

          Luego llamo a Kate y le doy el mismo resumen, intentando hablar lo más rápido que puedo para no perder el tiempo. Justo cuando estoy a punto de llamar a Flower también, escucho una gran explosión justo encima de nosotros y varias rocas comienzan a caer del techo.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch06c_ending
  - name: b3_ch06c_ending
    routes:
      - condition: b3_ch6_transceivers = 2
        texts:
          - source: scene_text
            paragraph: 17
            text: |-
              "¡Cuidado!" Le digo a Leila, mientras la tomo de la mano y la arrastro lejos de las rocas que caen.

              "¡Uf!" Digo, después de que escapemos ilesos. "Eso estuvo cerca--"

              Antes de terminar mi frase, ahora es el turno de Leila de tirarme del brazo, salvándome de un segundo grupo de rocas que acababan de desprenderse del techo. Poco después empezamos a escuchar explosiones en varios lugares más encima de nosotros, ya que el techo comienza a derrumbarse en varias partes de los túneles subterráneos. Mientras Leila todavía me sostiene, una luz blanca nos envuelve a ambos y nuestros cuerpos comienzan a vibrar mientras somos teletransportados lejos de la base rebelde.
          - source: scene_text_2
            paragraph: 15
            text: |-
              Una vez que somos transportados a nuestro nuevo destino, miro rápidamente a nuestro alrededor e inmediatamente reconozco el lugar como el mismo túnel subterráneo en el que fuimos teletransportados por error cuando ayer intentábamos huir de la guardia real vestida de negro. ¿Por qué estamos aquí otra vez?... ¿Se supone que este es el lugar predeterminado al que te envía el teletransportador si no puede llevarte a tu destino correcto?

              No puedo pensar mucho en esto, porque al igual que la última vez que nuestra teletransportación salió mal, un dolor de cabeza muy fuerte se apodera de mí lo que me hace difícil incluso mantenerme despierto. Pronto caigo al suelo mientras intento con todas mis fuerzas suprimir el dolor de mi cabeza, y justo cuando estoy a punto de perder el conocimiento, veo unas grandes letras azules flotando frente a mis ojos.

              "Barry, ¿puedes leer esto? ¡Por favor, respóndeme! ¡Barry!"

              Las palabras de Leila son lo último que puedo ver antes de finalmente ceder al dolor de cabeza y desmayarme en el frío suelo de la cueva.
