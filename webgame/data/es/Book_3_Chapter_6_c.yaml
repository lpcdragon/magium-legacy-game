  - name: b3_ch06c_hearing
    routes:
      - condition: hearing < 4
        texts:
          - source: scene_text
            paragraph: 14
            text: |-
              Mientras Leila se calma, trato de concentrarme en los sonidos que provienen del túnel que conduce a la sala del teletransportador. ¿Dónde están los guardias reales ahora mismo? ¿Nos atacarán desde esa dirección o vendrán desde arriba, como dijo Peter? ¿Los alumnos sólo persiguieron a Peter para silenciarlo o también llegarán aquí después?

              Mientras me concentro un poco más, empiezo a escuchar el sonido de una batalla, pero no puedo decir exactamente quién está ganando, o cuántos guardias están ahora luchando contra Peter y Albert. Sin embargo, lo que puedo decir es que los sonidos se vuelven un poco más fuertes con cada segundo. Están cada vez más cerca de nosotros. ¿Significa esto que la sala de espera pronto se convertirá en un campo de batalla? ¿Qué pasa con la evacuación? ¿Qué hará el rey del subsuelo con todos los civiles que quedarán atrapados en la línea de fuego?

              Maldita sea, no debería perder el tiempo pensando en todo esto. Lo que tengo que hacer es encontrar una manera de salvar al padre de Leila. Estoy seguro de que los rebeldes se manejarán bien.
          - source: scene_text_2
            paragraph: 12
            text: |-
              "¿Barry?..." escribe Leila, cuando me ve perdida en mis propios pensamientos. "Creo que ahora estoy más tranquilo. Intentemos llamar a los demás para que puedan venir a ayudarnos".

              "Tienes razón", digo. "Daren debería ser el más cercano a nosotros. Intentaré llamarlo primero".

              Luego saco mi transceptor y empiezo a girar el dial hasta que llego al número de Daren. Mientras hago esto, giro el dial con demasiada fuerza dos veces seguidas, debido a que me tiembla la mano. Parece que no debería ser yo quien dé consejos sobre cómo mantener la calma. Yo también estoy bastante nervioso.

              Justo cuando estoy a punto de tocar el transceptor, escucho una gran explosión justo encima de nosotros y varias rocas comienzan a caer del techo.
        effects:
          - set:
              failed_checks:
                - '[ Comprobación de audición fallida - nivel 4 ]'
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch06c_ending
      - condition: hearing >= 4
        texts:
          - source: scene_text
            paragraph: 15
            text: |-
              Mientras Leila se calma, trato de concentrarme en los sonidos que provienen del túnel que conduce a la sala del teletransportador. ¿Dónde están los guardias reales ahora mismo? ¿Nos atacarán desde esa dirección o vendrán desde arriba, como dijo Peter? ¿Los alumnos sólo persiguieron a Peter para silenciarlo o también llegarán aquí después?

              Mientras estoy allí y escucho los sonidos del túnel, de repente escucho un débil eco de la voz de Gontrok, que parece estar todavía hablando con el teletransportador a través de su transceptor.

              "¡No quiero escuchar tus excusas!" dice Gontrok. "¡Te dije que la teletransportaras ahora!"

              "¡Pero ella no está lo suficientemente tranquila!" dice el tipo del teletransportador. "Su aura está por todas partes, y si intento teletransportarla ahora, quién sabe dónde terminará..."

              "La necesitamos como rehén, ¿entiendes?" —grita Gontrok. "Si queremos que su padre lessathi haga lo que le decimos, ¡necesitamos encerrarla de manera segura en el calabozo del castillo! Ya tienes las coordenadas de la celda de la prisión. ¡Ahora haz lo que tienes que hacer!"
          - source: scene_text_2
            paragraph: 13
            text: |-
              "Yo... no puedo... ni siquiera tengo un canal abierto para su transceptor, así que rastrear su ubicación exacta será... ¡sólo dame un minuto!" dice el tipo del teletransportador.

              "Leila", digo, después de escuchar la conversación entre Gontrok y el tipo del teletransportador. "Sé que esto va a sonar realmente estúpido, pero necesito que vuelvas a entrar en pánico".

              "¿Qué?..." escribe Leila, ahora luciendo completamente confundida.

              "Están tratando de teletransportarte lejos, pero no pueden hacerlo si tu aura es inestable, así que debes mantener el pánico", le digo. "¿Eso tiene sentido?"

              "Umm, sí..." escribe Leila. "Sí, creo que puedo--"

              De repente, mientras Leila sigue escribiendo, oigo una gran explosión justo encima de nosotros y varias piedras empiezan a caer del techo.
