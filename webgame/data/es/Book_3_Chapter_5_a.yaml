              "¿No deberíamos contactar con Daren y Hadrik?", escribe Leila cuando llegamos a la entrada del túnel que conduce a los dormitorios. "Puede que hayan estado intentando comunicarse con nosotros por nuestros transceptores mientras estábamos fuera."

              "Tienes razón", digo. "Y también debería llamar a Rose. Le dije que la contactaríamos en cuanto regresáramos a la base rebelde."

              Saco mi transceptor y empiezo llamando a Daren. Le doy una explicación breve de por qué hemos estado desaparecidos tanto tiempo, sin entrar en los detalles de lo que vimos bajo la torre de seredium, y luego le aseguro que todos estamos a salvo. Al parecer ha estado intentando contactar con nosotros durante más de una hora. Una vez accede a venir a reunirse con nosotros fuera de la zona de cuarentena, llamo a Hadrik y le doy el mismo resumen breve de lo que hemos estado haciendo. Dice que estará en la sala de espera en unos diez minutos y luego cierra el transceptor.

              Justo cuando termino de hablar con Hadrik, Daren sale de la zona de cuarentena sosteniendo el amuleto de Arraka cerca de su boca como si fuera un transceptor mientras mantiene una acalorada discusión con ella. Muy cerca detrás de ellos vemos al goblin sanador, Kelrim, que los sigue en silencio mientras avanzan en nuestra dirección.
            condition: ch11_saved_rose = 1
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch05a_untangle
  - name: b3_ch05a_untangle
    texts:
      - source: scene_text
        paragraph: 11
        text: |-
          "¡Solo digo que si me hubieras dicho esto desde el principio, no habríamos perdido tantísimo tiempo con mi entrenamiento de aura!", le dice Daren a Arraka en voz alta.

          "Sí te lo dije, imbécil", dice Arraka. "Llevo diciéndote constantemente desde el primer día que lo que necesitabas hacer era desenredar el flujo de tu aura con la mente. ¿Cómo puede ser tan difícil de entender para ti un concepto así?"

          "¡Porque tus palabras suenan como galimatías!", dice Daren. "¿Cómo se suponía que iba a saber que lo que de verdad querías que hiciera era imaginar que lo desataba como si fueran nudos de verdad? ¡Yo creía que tenía que cambiar la dirección de cada flujo por separado! ¡Es que no sabes explicar las cosas con claridad!"

          "¿Ah, sí?", dice Arraka. "Entonces, ¿cómo es que el goblin sí lo entendió, listillo? Solo tuve que decírselo una vez y lo captó al instante. ¿Cuál es tu excusa para eso?"

          "No sé, quizá simplemente se entienden mejor porque los dos son monstruos", dice Daren.

          "¡Soy una elfa, cretino miserable!", dice Arraka. "¡Ya te lo dije una vez antes!"

          "¿Debo entender que están avanzando con la búsqueda de una cura para la gente del área de cuarentena?", dice Illuna cuando Daren y Arraka llegan hasta nosotros.
      - source: scene_text_2
        paragraph: 3
        text: |-
          "Entonces, lo que dices es que ahora te toca a ti apuñalarnos por la espalda a nosotros", le pregunta Illuna al rey.

          "¡Santo cielo, no!", dice el rey del subsuelo. "No planeo hacerles nada. Puede que Breynan no me sea muy leal a mí, pero sí lo es sin duda a la gente de Ollendor, así que no me imagino que siguiera en buenos términos con ustedes si hubieran intentado perjudicar a nuestra gente de alguna manera. Dado que no está diciendo nada, voy a suponer que, como mínimo, no están actuando en contra de los intereses de nuestro pueblo. Eso me basta. Al fin y al cabo, su amigo el sanador ha estado trabajando sin descanso para salvar la vida de mis hombres en la zona de cuarentena desde que llegó aquí, así que sería un insulto para él si los tratara a cualquiera de ustedes como enemigos."

          "¿Eso significa que no vas a preguntarnos qué discutimos con el Supervisor?", dice Kate.

          "Obviamente sigo pensando hacerles esa pregunta", dice el rey. "Pero son libres de no responderme si esa es su decisión. Así que... ¿van a decirme o no cuáles fueron los resultados de sus negociaciones con el Supervisor?"
      - source: scene_text_2
        paragraph: 6
        text: |-
          "Sí", dice Arraka. "Pero solo porque el goblin consiguió explicarle a Daren lo que yo quería de él con palabras lo bastante sencillas como para que hasta alguien como él pudiera entenderlas. Ahora ya prácticamente descubrió la causa de la enfermedad, así que lo único que tiene que hacer es ir a conseguir las herramientas adecuadas para el trabajo."

          "Más fácil decirlo que hacerlo", dice Daren. "Conseguir las herramientas en sí probablemente no será un problema, pero por lo que me contó Kelrim, las tiendas de por aquí andan bastante escasas de hierbas medicinales. No hay muchas ciudades dispuestas a comerciar con una ciudad rebelde como esta, y por lo visto las hierbas medicinales que estoy buscando no suelen crecer en la zona que rodea Ollendor. Vamos a tener que probar en muchas tiendas hasta dar con los ungüentos que necesito, lo cual va a ser un poco difícil, dado que somos criminales buscados en esta ciudad. Y si lo que oí sobre el cierre total es cierto, me pregunto si a los dueños de las tiendas siquiera se les permitirá vender su mercancía."

          "Quizá podrías pedirle ayuda a Rose con las hierbas medicinales", dice Kate. "Con un poco de suerte, quizá conozca buenos sustitutos que sean más comunes en las herboristerías, para que no necesites visitar a tantos vendedores distintos."

          "No es mala idea", dice Daren. "Más tarde me aseguraré de hablar con ella sobre eso."

          "Si van a ir de compras por hierbas medicinales, entonces yo también me uniré", dice Kelrim, el goblin. "Visito esas tiendas a menudo para conseguir mis propios suministros, así que tengo una idea bastante buena de dónde sería más probable encontrar lo que necesitamos."
