  - name: b3_ch05a_sleeve
    texts:
      - source: scene_text
        paragraph: 36
        text: |-
          Mientras Illuna despierta a Flower dentro de su mente, su cuerpo permanece sentado en el suelo con las piernas cruzadas como antes, salvo que los ojos están mirando hacia algún punto al frente con una expresión vacía. Cuando por fin toma el control de su cuerpo, veo que Flower tiene una expresión muy confundida, y sus ojos van de un lado a otro como si intentara procesar demasiada información a gran velocidad. Imagino que Illuna no le dio precisamente demasiados detalles antes de irse a dormir, y da la impresión de que está intentando recomponer un rompecabezas al que le faltan demasiadas piezas.

          "Umm...", dice Flower al girarse para mirarme. "¿Illuna dijo que querías hablar conmigo?..."

          "Sí, en realidad quería hablar contigo sobre el..."

          En vez de continuar la frase, me detengo de golpe, porque enseguida me doy cuenta de que no había hecho ningún plan sobre cómo iba a sacar este tema con Flower.

          "Sobre el...", vuelvo a decir, pero no consigo encontrar las palabras adecuadas para esta situación.
      - source: scene_text_2
        paragraph: 21
        text: |-
          ¿Cómo se supone que voy a iniciar esta conversación? No hablo mucho con Flower en general, así que no tengo ni idea de cómo reaccionaría si sacara un tema serio como este así de la nada. ¿Debería empezar con un asunto completamente distinto e ir conduciendo poco a poco la conversación en la dirección correcta? ¿Estaría siquiera dispuesta a hablar abiertamente conmigo de sus problemas personales, como Illuna? ¿Cómo se supone que voy a lograr que haga las paces con Illuna cuando ni siquiera se me ocurre una forma de empezar la conversación como es debido?

          "Sobre...", digo una vez más, pero esta vez con una voz débil y vacilante.

          "Barry, ¿estás bien?...", dice Flower, viéndose un poco preocupada. "Se te está empezando a poner la cara toda sudorosa."

          "Eh, sí, sí, estoy bien", digo, mientras me seco el sudor de la frente con la manga. "Iba, eh... iba a hablar contigo sobre el... el... el tiempo está muy agradable en esta época del año, ¿no te parece?"

          "¡Oh, por todos los dioses!", oigo gritar a Melindra desde el túnel al que había entrado antes.

          "¿Melindra?...", pregunta Flower, viéndose ahora todavía más confundida que antes.

          "¡¿Melindra?!", pregunto, atónito, mientras la veo salir del pasillo y avanzar furiosa hacia nosotros. "¿Has estado ahí todo este tiempo? ¡No pude sentir tu presencia en absoluto!"
      - source: scene_3
        paragraph: 21
        text: |-
          "Claro que no pudiste", dice Melindra cuando llega hasta nosotros. "Estaba suprimiendo completamente mi aura, y ya de por sí es bastante difícil percibir el aura de una stillwater. Habrías necesitado tener un sentido mágico al menos tan bueno como el mío para poder detectarme."

          "Vale, pero ¿qué estabas haciendo ahí?", digo. "Pensaba que te habías ido a dar un paseo."

          "No me fui a dar un paseo...", dice Melindra. "Me di cuenta de que algo raro pasaba cuando te ofreciste a hacer un turno de guardia con Illuna de la nada, así que quise ver qué ocurría. No pensaba intervenir, pero me obligaste a hacerlo cuando empezaste con aquella interminable sesión de tartamudeos. ¿Qué pasó exactamente? ¿Por qué puedes hablar tan directamente con Illuna, pero no con Flower?"

          "Bueno, eh... ¿cómo lo explico?", digo. "Illuna me da la impresión de que, aunque diga una tontería enorme, no va a dejar que eso la afecte emocionalmente. Flower, en cambio, me parece mucho más frágil, así que no sé muy bien qué está bien y qué no decirle en una situación como esta."

          "¡Estará bien!", dice Melindra. "¡No hace falta que la trates como si fuera un bebé! Mira, deja que te enseñe cómo se empieza una conversación. Flower... Lo que Barry quería decir antes era que quería hablar contigo sobre tu pelea reciente con Illuna."

          "¿Qué?", pregunta Flower, conmocionada. "¡Pero yo no tuve ninguna pelea con Illuna!"
