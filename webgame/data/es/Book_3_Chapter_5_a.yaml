          "Si eso es lo que quieres, no intentaré detenerte", dice Daren. "Pero cuando estemos fuera, asegúrate de mantenerte detrás de mí en todo momento. Nunca se sabe quién podría intentar tendernos una emboscada."

          "Tendré cuidado", dice Kelrim. "Gracias por tu preocupación. Y, por lo que valga, también intentaré aprovechar al máximo mis habilidades curativas si nos atacan."
