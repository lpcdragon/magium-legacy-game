        texts:
          - source: scene_text
            paragraph: 38
            text: |-
              "¿Por eso acabas de llamarla Illuna en vez de Pétalo?"

              "No sé de qué estás hablando", dice Flower, imitando otra vez el tono frío de voz de Kate. "'Pétalo' era solo un apodo infantil que le puse poco después de conocerla por primera vez. Ya he superado esa etapa."

              "Simplemente cambiar tu comportamiento no significa que de repente hayas madurado, ¿sabes?...", digo.

              "¡Sí que lo significa!", dice Flower, obstinada. "Ahora actúo con más madurez, así que eso significa que soy una adulta. ¡Fin de la discusión!"

              "Flower, ¿por qué quieres tanto que te traten como a una adulta?", dice Melindra mirándola con curiosidad. "¿Por qué es tan importante para ti?"

              "¡Porque soy una adulta!", dice Flower. "¿Qué clase de adulta quiere que la traten como a una niña?"

              "Hmm...", dice Melindra. "Dame un segundo."

              Después de decir eso, Melindra mete la mano en la mochila y empieza a sacar varias rocas que luego coloca en el suelo delante de Flower.
          - source: scene_text_2
            paragraph: 22
            text: |-
              "De acuerdo", dice Melindra. "Flower, estas rocas que ves delante de ti son algunas de mis posesiones más preciadas. De toda mi colección, estas probablemente sean mis favoritas. ¿Te gustan?"

              "¡Sí, me encantan!", dice Flower. "¡Son tan bonitas!"

              "¿Y también te gusta hablar conmigo sobre mi colección de rocas?", dice Melindra.

              "¡Claro!", le responde Flower.

              Al oírlas hablar con tanta pasión de las rocas, intento inclinarme un poco más cerca de las piedras en el suelo para observarlas mejor. Por mucho que intento examinarlas, sin embargo, no consigo encontrar ni una sola cosa que las distinga de cualquier roca al azar que podrías recoger en una cueva o del fondo de un río.
