            text: |-
              "Tenemos un trato, entonces", digo. "Como sospechabas, la información que obtuvimos del Supervisor ya se volvió inútil a estas alturas. Te daría los detalles, pero solo pediste una confirmación, así que supongo que no te interesan."

              "Tienes razón", dice el rey del subsuelo. "No me interesan los detalles. Pero gracias por tu honestidad. Aquí tienes las diez monedas de oro que te prometí."

              Entonces me entrega las diez monedas de oro, que guardo en la bolsita de monedas de mi bolsillo.

              "Ahora que la transacción ha concluido", dice el rey, "les recomiendo que vayan a descansar, porque mañana probablemente será un día ajetreado. Volveremos a hablar por la mañana."
