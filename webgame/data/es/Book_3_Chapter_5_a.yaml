  - name: b3_ch05a_contacting
    routes:
      - condition: b3_ch5_negotiations = 1 AND b3_ch4_billy <> 7 AND b3_ch4_billy <> 8
        texts:
          - source: scene_text
            paragraph: 5
            text: |-
              "Quiero decir, a estas alturas el secreto ya salió a la luz, así que supongo que bien podríamos contártelo."

              "Te escucho", dice el rey. "Adelante."

              "Bueno, en realidad no hay mucho que contar", digo. "El Supervisor básicamente nos avisó de que el rey de Ollendor había estado saliendo mucho del palacio últimamente, y de que podíamos predecir adónde iría después si identificábamos a sus exploradores y los seguíamos. Dijo que, usando esta información, podríamos preparar emboscadas para asesinar al rey con más facilidad. El problema es que el Supervisor nos dijo todo esto antes de que el rey ordenara el cierre total de la ciudad, así que cualquier información que obtuviéramos sobre la agenda anterior del rey ya debe de haberse vuelto irrelevante a estas alturas."

              "Sí, sospechaba que ese podía ser el caso...", dice el rey del subsuelo. "Aun así, agradezco su honestidad. La situación ya está bastante mal de por sí, así que es bueno saber que al menos no tendré que preocuparme también de que me oculten información crucial. Les recomiendo que vayan a descansar, porque mañana probablemente será un día ajetreado. Volveremos a hablar por la mañana."
          - source: scene_text_2
            paragraph: 4
            text: |-
              "Mi rey, ¿hay algo en lo que pueda ayudar?", dice Breynan.

              "Bueno, podrías empezar por quitarme algunos de estos informes de las manos", dice el rey del subsuelo, señalando a un hombre que está a su lado sosteniendo una pila de papeles. "Empieza por los de abajo. Esos deberían ser lo bastante fáciles de entender incluso sin conocer de memoria la distribución de la ciudad como la conozco yo. Tenemos que evacuar a tanta gente como podamos antes del amanecer, así que más vale que estés preparado para otra noche sin dormir. Vamos a estar aquí un buen rato."

              "Entiendo", dice Breynan, y luego toma un papel de la pila.

              Dejamos atrás al rey y a Breynan y empezamos a dirigirnos hacia el túnel que lleva a nuestros dormitorios. Mientras cruzamos la sala de espera, pasamos junto a bastantes grupos de refugiados a los que los hombres del rey del subsuelo van dirigiendo a distintas secciones de la base rebelde. Parece que están teniendo algunos problemas para encontrar espacio suficiente para toda esta gente, porque a muchos los están enviando al comedor a pasar la noche en lugar de a los dormitorios.
          - source: scene_3
            paragraph: 2
            text: |-
              "¿No deberíamos contactar con Daren y Hadrik?", escribe Leila cuando llegamos a la entrada del túnel que conduce a los dormitorios. "Puede que hayan estado intentando comunicarse con nosotros por nuestros transceptores mientras estábamos fuera."

              "Tienes razón", digo. "Los llamaré ahora mismo."

              Saco mi transceptor y empiezo llamando a Daren. Le doy una explicación breve de por qué hemos estado desaparecidos tanto tiempo, sin entrar en los detalles de lo que vimos bajo la torre de seredium, y luego le aseguro que todos estamos a salvo. Al parecer ha estado intentando contactar con nosotros durante más de una hora. Una vez accede a venir a reunirse con nosotros fuera de la zona de cuarentena, llamo a Hadrik y le doy el mismo resumen breve de lo que hemos estado haciendo. Dice que estará en la sala de espera en unos diez minutos y luego cierra el transceptor.

              Justo cuando termino de hablar con Hadrik, Daren sale de la zona de cuarentena sosteniendo el amuleto de Arraka cerca de su boca como si fuera un transceptor mientras mantiene una acalorada discusión con ella. Muy cerca detrás de ellos vemos al goblin sanador, Kelrim, que los sigue en silencio mientras avanzan en nuestra dirección.
            condition: ch11_saved_rose = 0
