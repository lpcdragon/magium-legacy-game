  - name: b3_ch05a_magnificence
    routes:
      - condition: b3_ch5_moustache = 0
        texts:
          - source: scene_text
            paragraph: 43
            text: |-
              "¿Qué quieres decir con casi inmortalidad?"

              "Quiero decir que, incluso si la matas, no se quedará muerta", dice Flower. "La mayoría de las banshees mueren para siempre si las matan mientras están poseyendo un cuerpo humano, pero ese no es el caso de Arraka. Creo que lo que hace es repartir el daño entre todas las almas que ha absorbido, así que incluso si el cuerpo poseído muere, ella puede pasar a su forma espiritual y saltar a uno nuevo. Por eso Eiden y Eleya tuvieron que idear ese hechizo que le prohíbe poseer huéspedes que formen parte de las razas civilizadas, para al menos limitar sus poderes."

              "Cualquier huésped excepto tú, porque ese hechizo ya no te reconoce como humana después de tu fusión con Illuna, ¿verdad?", digo.

              "Así es", dice Flower.

              "Espera", digo. "¿Y si Arraka intentara poseer a Tyrath, entonces? Quiero decir... él es increíblemente fuerte. Y además es un monstruo, así que la restricción no funcionaría con él."
          - source: scene_text_2
            paragraph: 25
            text: |-
              "Que alguien sea fuerte no significa que Arraka fuera a obtener ninguna ventaja por poseerlo", dice Flower. "Lo que importa es lo parecidas que sean en naturaleza las dos almas, no lo poderoso que sea el huésped. Incluso si Arraka lograra poseer a Tyrath, probablemente no sería capaz de obtener más poder que el de un mago normal al usar su cuerpo. Pero dudo que pudiera poseerlo. Los dragones son bien conocidos por ser inmunes a los hechizos que afectan a la mente, así que no me sorprendería que eso también los hiciera más resistentes a la posesión. Además, cuanto más fuerte es alguien, más difícil sería poseerlo o absorber su alma, así que no creo que Arraka tuviera ninguna posibilidad de tomar el control de Tyrath ni siquiera si él bajara la guardia."

              "Ya veo", digo.

              "Oye, Flower", dice Melindra. "¿Piensas hacer algún entrenamiento esta noche?"

              "Yo... creo que voy a pasar por ahora", dice Flower. "Todavía me siento un poco cansada después de todo lo que pasó ayer..."

              "Bueno, todavía nos quedan unas horas que matar, así que supongo que por ahora podríamos jugar a las cartas", dice Melindra. "Y cuando nos aburramos de eso, ¡podría enseñarte algunas rocas más! De hecho conseguí unas cuantas nuevas mientras caminaba por estos túneles."

              "Ugh...", digo. "No otra vez las rocas."
          - source: scene_3
            paragraph: 23
            text: |-
              "¿Oh?", dice Melindra con una sonrisita. "¿Todavía no aprecias la magnificencia de mi colección de rocas, Barry? Entonces supongo que no me dejas elección. Flower y yo tendremos que pasar la totalidad de este turno de guardia explicándote con gran detalle qué hace tan únicas a estas rocas. ¡Te enseñaré todo lo que sé, hasta que te conviertas en un experto en rocas de todas las formas y tamaños!"

              "Eres demasiado amable", le digo a Melindra. "Pero no hace falta que te tomes tanta molestia solo por mi bien."

              "¡Oh, pero insisto!", dice Melindra, mientras empieza a sacar algunas rocas más de su mochila. "Flower, ¿te importaría moverte un poquito a la derecha? Estoy intentando alinear estas rocas a la perfección para poder destacar debidamente las mejores cualidades de cada una."

              Durante las tres horas siguientes más o menos, Melindra y Flower se aseguraron de darme un repaso completo de todas y cada una de las características que considerarían valiosas para cada tipo individual de roca, y también me mostraron cómo esos rasgos podían combinarse para aportar todavía más 'valor' a lo que muchos podrían considerar simples piedras corrientes.

              Obviamente, incluso al final del turno de guardia mi opinión original seguía casi intacta, pero al menos ahora podía decir que entendía qué marcaba la diferencia entre una roca ordinaria y una roca coleccionable a sus ojos, así que su pasatiempo ya no me parecería tan incomprensible e ilógico como antes.
