  - name: b3_ch05a_childish
    texts:
      - source: scene_text
        paragraph: 40
        text: |-
          "Verás, Flower, la mayoría de la gente consideraría que estas rocas no tienen nada de especial", dice Melindra. "No solo eso, sino que además consideraría que tener una colección de rocas y hablar sobre ella es algo muy infantil."

          Luego se gira hacia mí justo cuando me inclino hacia delante para examinar las rocas del suelo.

          "¿A que sí, Barry?", me pregunta Melindra con una sonrisa.

          "Eh... más o menos, sí", le digo, volviéndome ahora hacia Melindra. "No voy a mentir. Como mínimo es un pasatiempo un poco raro. Ninguna de estas rocas me parece ni remotamente interesante."

          "¿La gente considera infantil coleccionar rocas?", le pregunta Flower a Melindra, sorprendida. "Entonces, ¿por qué sigues haciéndolo?"

          "Porque no me importa lo que piense la gente", dice Melindra, acercándose a Flower. "Es mi pasatiempo, no el suyo, y si no les gusta, pueden pensar de mí lo que quieran."

          "Pero... ¿no te afecta cuando dicen que te comportas como una niña?", dice Flower.
      - source: scene_text_2
        paragraph: 23
        text: |-
          "Déjame contarte un pequeño secreto", dice Melindra. "Una parte importante de ser adulta es dejar de preocuparte por si la gente te llama niña o no. Eres quien eres, y eso no debería cambiar para ajustarse a las ideas preconcebidas de otras personas sobre lo que es o no apropiado hacer a tu edad. Si la gente insiste en considerar infantil un pasatiempo como este, que lo hagan. Son ellos los que se lo pierden, no tú."

          "Sí, pero...", dice Flower con un tono más vacilante, pero no continúa la frase y se queda en silencio durante unos segundos, reflexionando sobre las palabras de Melindra.

          "No tienes por qué cambiar quién eres si no quieres", le dice Melindra a Flower. "Si te gusta la persona que ya eres, entonces sigue siendo así. No vale la pena hacerte sentir miserable solo para obtener reconocimiento de los demás."

          "No se trata de reconocimiento, es que...", dice Flower, y luego vuelve a quedarse en silencio unos segundos.

          "Es solo que Pétalo es mi mejor amiga y... no quiero ser una carga para ella...", dice Flower, mientras la mirada de sus ojos se vuelve un poco triste.

          "¿Por qué crees que eres una carga para Illuna?", le pregunto.
      - source: scene_3
        paragraph: 22
        text: |-
          "Porque Pétalo siempre es tan seria y tan fiable, y yo soy simplemente... yo", dice Flower. "No quiero decepcionarla. Cada vez que hablamos de mi edad, siento que por alguna razón ella se decepciona más y más. Creo que por fin empieza a cansarse de mi comportamiento infantil después de estos últimos veinte años. Por eso intento cambiar. Simplemente no quiero seguir fallándole."

          "¡No es por eso por lo que Illuna parece decepcionada cuando hablas de tu edad!", digo. "Es porque--"

          De repente me doy cuenta de que no estoy seguro de si la confesión anterior de Illuna debía ser un secreto o no. ¿Se enfadaría conmigo si le dijera a Flower que se siente culpable por el hecho de que la chica ya no pueda envejecer a causa de ella? Quizá sería mejor evitar contárselo por ahora.

          "Mira", le digo a Flower. "Tuvimos una conversación sobre esto con Illuna hace unas horas, antes de despertarte la primera vez en los túneles bajo la torre de seredium, y dijo específicamente que no tiene ningún problema con tu actitud infantil, y también que no ve ninguna razón para que cambies. No solo eso, sino que incluso llegó a decir que estás perfectamente bien tal y como eres. Melindra también estaba allí. Puede confirmarlo."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch05a_overwhelming
  - name: b3_ch05a_overwhelming
    routes:
      - condition: ch11_saved_rose = 1
        texts:
          - source: scene_text
            paragraph: 41
            text: |-
              "¿De verdad dijo eso?", le pregunta Flower a Melindra con una mirada esperanzada en los ojos, casi incapaz de contener su alegría.

              "Esas fueron sus palabras", dice Melindra.

              "Yo... nunca pensé que diría algo así sobre mí", dice Flower. "Estaba empezando a pensar que comenzaba a arrepentirse de haberse quedado atrapada conmigo en el mismo cuerpo. Es que siempre parece tan molesta con todo lo que hago..."

              "Oye, Illuna está gruñona todo el tiempo", digo. "Eso no significa que te odie ni nada por el estilo. A estas alturas deberías saberlo. Y además se irrita con todo el mundo, no solo contigo. Por ejemplo, justo antes de despertarte, Rose y yo intentábamos que Illuna se abriera un poco con nosotros, ¿y sabes lo que hizo? Aprovechó la primera oportunidad que tuvo para irse de nuestra conversación y ponerse a dormir. ¿Te lo puedes creer?"

              "Supongo que eso explicaría el sándwich a medio comer que tengo en el regazo", dice Flower.

              "Exacto", digo. "En fin, el caso es que, por mucho que actúe Illuna, todos sabemos ya que en realidad no lo dice en serio, y tú también deberías saberlo. Así que no hace falta que sigas preocupándote por cosas así, ¿de acuerdo?"
          - source: scene_text_2
            paragraph: 24
            text: |-
              "Vale...", dice Flower. "Intentaré dejar de preocuparme por eso. Pero necesitaré algo de tiempo para decidir qué hacer con... la forma en que he estado actuando últimamente. Todavía estoy un poco confundida sobre qué es lo que quiero ahora mismo."

              "Oye, no tenemos prisa", digo. "Tómate tu tiempo. Aclara tus ideas. Solo no olvides hacer parte del entrenamiento de Arraka cuando no estés demasiado cansada. Al fin y al cabo, el Dios del Tiempo no va a derrotarse solo."

              "La verdad es que me sorprende que Arraka no haya dicho nada durante todo este rato", dice Melindra. "Habría esperado que estuviera encantada de compartir con nosotros parte de su 'sabiduría' mientras hablábamos con Flower sobre sus problemas."

              "Creo que Arraka está dormida en este momento", dice Flower, tomando el amuleto en la mano para mirarlo más de cerca. "Se puede notar un poco por la sensación de su aura."

              "¿Arraka duerme?", dice Melindra, viéndose genuinamente conmocionada. "¿Desde cuándo? ¡No creo haberla visto dormir jamás!"

              "Sí duerme de vez en cuando, pero normalmente solo necesita unas pocas horas a la semana o menos para estar bien descansada", dice Flower. "Es solo una de las ventajas que obtuvo después de absorber todos esos miles de almas en el plano mágico. Ya sabes, aparte de su abrumador poder mágico y su casi inmortalidad."
