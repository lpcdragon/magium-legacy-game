  - name: b3_ch05a_volume
    texts:
      - source: scene_text
        paragraph: 30
        text: |-
          "Umm, Barry, ¿podrías bajar el volumen y colocarte el transceptor junto a la oreja un segundo?", dice Rose. "Quiero preguntarte algo en privado."

          "Claro", digo mientras hago lo que Rose me pidió. "...Ya está. Puedes hablar."

          "Recuerdo que mencionaste que Flower e Illuna no se están llevando demasiado bien ahora mismo", dice Rose en voz baja. "¿Te ofreciste a hacer el turno de guardia con Illuna porque querías ayudarlas a reconciliarse?"

          Echo un vistazo rápido hacia Illuna para ver si pudo oír algo de lo que Rose acaba de decir. Illuna no parece reaccionar de ninguna forma, así que le respondo a Rose con calma, como respondería a cualquier otra pregunta.

          "Sí, más o menos por eso", digo.

          "¡Ya me lo imaginaba!", dice Rose. "¿Te importaría si me uniera a ustedes también un rato? Yo también quería hablar con Illuna sobre esto, pero creo que las cosas podrían salir mejor si los dos habláramos con ella juntos."

          "Claro, puedes unirte a nuestro turno de guardia", digo, mientras Illuna gira de pronto la cabeza hacia mí. "¡Será como en los viejos tiempos!"

          "¡Perfecto!", dice Rose. "Estaré con ustedes en unos minutos. Solo tengo que llevarle a Suzie una bandeja de galletas y vuelvo enseguida."
      - source: scene_text_2
        paragraph: 16
        text: |-
          "¿Debo entender que Rose piensa hacernos compañía esta noche a través del transceptor?", dice Illuna en cuanto aparto el transceptor de mi oído y vuelvo a subir el volumen.

          "Sí, pero no creo que vaya a estar con nosotros durante todo el turno", digo. "Probablemente solo se nos una un poco al principio."

          "Oh, bien", dice Illuna. "Entonces quizá esta vez sí tenga la oportunidad de terminarme el sándwich."

          "¡Yo no contaría con eso!", digo, mientras nos detenemos lo bastante lejos de nuestra habitación como para no despertar a nuestros amigos al hablar, pero también lo bastante cerca como para poder vigilar la entrada.

          Mientras nos sentamos en el suelo, vemos a Melindra salir de nuestra habitación y dirigirse hacia nosotros.

          "¡No me hagan caso!", dice Melindra en voz alta al acercarse. "Solo quería dar un pequeño paseo por estos túneles antes de irme a dormir. ¡Enseguida dejaré de molestarlos!"

          Luego pasa a nuestro lado y se mete en un túnel a la izquierda, dedicándonos un último saludo con la mano antes de desaparecer de nuestra vista.
      - source: scene_3
        paragraph: 17
        text: |-
          "¡Ya volví!", dice Rose después de que pase un poco más de tiempo.

          Justo después de que Rose anuncie su regreso, Illuna conjura un sándwich de la nada y empieza a masticarlo con toda tranquilidad.

          "Vaya, de verdad te hiciste un sándwich...", digo.

          "Sí, pensé que si íbamos a recrear nuestro turno de guardia anterior juntas, bien podríamos hacerlo como es debido", dice Illuna.

          "Bien", digo. "Así que, umm... estas plantas que crecen en las paredes de la caverna son realmente interesantes, ¿eh? Me pregunto cuánto tiempo llevarán aquí."

          "Santo cielo", dice Illuna. "No irás de verdad a empezar la conversación del mismo modo que la vez pasada, ¿no? Solo bromeaba con lo de la recreación. No hace falta que reproduzcas a la perfección todas tus líneas anteriores."

          "Oye, ¡no las reproduje 'a la perfección'!", digo. "La otra vez te pregunté por el tiempo, ¿recuerdas?"

          "Muy ingenioso", dice Illuna. "Bueno, si tu principal tema de interés son las plantas subterráneas, estoy segura de que Rose estará encantada de tener esa conversación contigo, teniendo en cuenta que es herborista. Tengo muchas ganas de escucharla mientras sigo comiéndome este sándwich."
