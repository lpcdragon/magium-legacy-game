          "¿Por qué no le dices tú a Kate cómo descongelar a la gente si eres tan lista?"

          "¡Porque no soy una elementalista!", dice Arraka. "No le servirá de nada que le diga cómo controlo YO mis hechizos. Los elementalistas tienden a hacer este tipo de cosas por instinto, sin pensarlo demasiado. Necesita la perspectiva de otra elementalista que pueda explicarle estas cosas de un modo que pueda entender. Si no, será como si yo le hablara a una pared, como la mayoría de las veces cuando intento enseñarle algo a Daren."

