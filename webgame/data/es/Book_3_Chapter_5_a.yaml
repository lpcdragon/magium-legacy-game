            paragraph: 33
            text: |-
              "Bueno, entonces ¡deja de sentirte culpable!"

              "De verdad tienes don de palabra, ¿eh?", dice Illuna con tono seco.

              "Oye, lo hecho, hecho está", digo. "No puedes dejar que el pasado te siga arrastrando hacia abajo el resto de tu vida. Ya han pasado veinte años. ¿No crees que ya va siendo hora de pasar página?"

              "Con culpa o sin ella, sigo velando por los mejores intereses de Flower", dice Illuna. "No hay ninguna razón para que yo 'pase página'."

              "De verdad creo que estás subestimando un poco a Flower", digo. "Puede que siga actuando como una niña, pero eso no significa que sea completamente incapaz de darse cuenta de lo que ocurre. Es una chica lista. Probablemente sabe muy bien cuál es su situación, pero decide mantenerse positiva con todo esto y aprovechar al máximo lo que tiene. ¿No crees que tendría más sentido interpretar su comportamiento así, teniendo en cuenta su personalidad? Sí, quizá le habría gustado crecer como todo el mundo, pero al mismo tiempo también parece disfrutar de vivir la vida como una niña. ¿Por qué no dejarlo en eso y considerarla una niña de veintinueve años en vez de una adulta? Seguro que al menos eso puedes concedérselo."

              "Lo... pensaré", dice Illuna.
          - source: scene_text_2
            paragraph: 19
            text: |-
              "Si sirve de algo", dice Rose, "yo también estoy de acuerdo con lo que Barry dijo sobre Flower. No me parece el tipo de persona que se engañaría creyendo cosas que no son verdad. Creo que quizá te estás preocupando un poco demasiado."

              "Esa es una posibilidad", dice Illuna. "No voy a negarlo."

              "¡Genial!", digo. "¡Me alegra ver que estamos avanzando!"

              "¿Significa eso que ya has logrado tu objetivo para esta noche?", dice Illuna. "¿Podemos terminar por fin esta conversación?"

              "¡Todavía no!", digo. "Verás, lo que pasa es que también quería hablar con Flower de todo esto, y como dijo que solo dormiría una hora o dos, pensé que tendría ocasión de hablar con ella antes de que terminara este turno de guardia."

              "Pues entonces tengo una idea", dice Illuna. "Estoy bastante segura de que ya ha pasado una hora o más desde que Flower se durmió, así que simplemente la despertaré y los dejaré con ella mientras yo voy a disfrutar de un sueño bien merecido. Diviértanse."

              "¡Eh, espera!", le grito mientras la luz azul de sus ojos se desvanece. "Estaba pensando que quizá los cuatro podríamos hablar y... maldición, ya no me estás escuchando, ¿verdad?"
