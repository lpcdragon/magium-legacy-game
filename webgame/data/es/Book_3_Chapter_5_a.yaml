        text: |-
          "¿Por qué crees que el cierre total va a empeorar?"

          "Porque el propósito entero del cierre total es encontrarnos, y nosotros estamos aquí abajo", dice Daren. "¿Qué crees que va a pasar cuando haya pasado un día entero y todavía no haya ni rastro de nosotros?"

          "Oye, no es como si pudieran mantener el cierre total para siempre", digo. "Tendrán que salir a conseguir comida tarde o temprano, o todos morirán de hambre."

          "No creo que a este rey en particular le importara demasiado que su gente muriera de hambre...", dice Daren. "Y estoy seguro de que tiene suficientes reservas en su palacio como para garantizar su propia supervivencia. En fin, probablemente saldré a la superficie en cuanto las tiendas abran, así que creo que me voy a ir a dormir. Si no hay nada más que quieran hablar conmigo, yo solo--"

          "Solo una pregunta", dice Melindra. "Cuando dijiste que mañana irías de compras, ¿querías decir que pensabas ir tú solo?"

          "Bueno, sí", dice Daren. "No puedo obligarlos a arriesgar sus vidas ahí fuera solo porque decidí por mi cuenta intentar salvar a esta gente. Esta es mi responsabilidad."

