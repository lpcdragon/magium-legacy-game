      - source: scene_text
        paragraph: 22
        text: |-
          "¿De verdad Flower es tan talentosa? ¿Cómo es que no se ha vuelto absurdamente fuerte a estas alturas?"

          "SÍ es bastante fuerte para los estándares de un elementalista", responde con calma. "No puedes compararla con alguien como ese sabio elementalista de tierra o Melindra, porque esas dos tienen mucho más poder mágico que la mayoría de los magos normales. Además, solo puedes llegar hasta cierto punto si dependes únicamente de tu talento natural. Si quieres avanzar al siguiente nivel, también necesitas ser capaz de aprender hechizos de libros y cosas por el estilo, y eso es algo de lo que Flower, por desgracia, es completamente incapaz. De todos modos, eso no es importante ahora. Lo que importa en este momento es que Flower es una elementalista como Kate, así que debería poder darle algunas indicaciones útiles para ayudarla."

          "Bien", digo. "Entonces, si Kate aprende a controlar correctamente sus hechizos de congelación, ¿eso también la ayudará contra el Dios del Tiempo?"
