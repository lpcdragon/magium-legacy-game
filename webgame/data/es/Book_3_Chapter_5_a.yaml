        paragraph: 26
        text: |-
          "Por fin", le dice Hadrik a Daren en voz baja. "Pensé que nunca se iba a callar."

          "¡Todavía puedo oírte, enano!", dice Arraka desde su amuleto, que en este momento sostiene Daren. "¡Estoy justo a tu lado!"

          "Je", dice Hadrik. "Lo sé."

          "¿Puedo recuperar el amuleto por el momento, o planeas volver a la zona de cuarentena?", dice Illuna mientras se acerca a Daren.

          "No, ahora no vuelvo allí", dice Daren. "Necesito descansar. Toma, aquí la tienes."

          Entonces le devuelve a Illuna su amuleto y ella se coloca la cadena alrededor del cuello.

          "Mañana voy a tener que despertarme temprano", dice Daren. "Con un poco de suerte, las tiendas sí tendrán tiempo de abrir un rato por la mañana, antes de que toda esta situación del cierre total empeore aún más."
