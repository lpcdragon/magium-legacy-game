            paragraph: 31
            text: |-
              "¡En realidad, Barry y yo también queríamos hablar contigo de otra cosa!", dice Rose.

              "Por supuesto que había otra cosa", dice Illuna mientras le da otro mordisco a su sándwich.

              "Sí", digo, "el verdadero motivo por el que me ofrecí para este turno de guardia era que pensé que quizá podríamos continuar nuestra conversación anterior sobre ti y Flower."

              "Otra vez no...", dice Illuna. "Creía que ya habíamos terminado con ese tema en particular."

              "Bueno, no exactamente", digo. "Todavía no hemos abordado el problema principal. Toda tu discusión con Flower empezó porque ella quiere que la trates como a una adulta y tú te niegas a hacerlo. Por eso también está intentando actuar con tanta madurez ahora, y por eso empezó a llamarte Illuna en vez de Pétalo. Es porque intenta que la reconozcas como una persona de veintinueve años. ¿Por qué te importa tanto si decide considerarse una adulta? ¿Por qué no dejar que se llame a sí misma como quiera?"

              "¡Porque no es una adulta!", dice Illuna. "¡Y el resto de ustedes tampoco la consideran una persona mayor! ¡Todos la han llamado una niña de nueve años antes!"
          - source: scene_text_2
            paragraph: 17
            text: |-
              "Bueno, sí, pero cuando lo hacemos nosotros, casi siempre es solo por molestar", digo. "En cambio, tú la conoces desde hace veinte años y sigues teniendo este tipo de discusiones con ella. ¿No crees que te estás tomando este asunto demasiado en serio?"

              "Aclárame esto", dice Illuna mientras deja el sándwich a medio comer sobre su regazo. "¿Intentas decirme que todos ustedes consideran a Flower una adulta hecha y derecha de veintinueve años, y que yo soy la única de este grupo que sigue creyendo que tiene la madurez mental de una niña? Rose, ¿tú también crees que a Flower deberían tratarla como a una adulta?"

              "Uhm...", dice Rose. "Admito que me cuesta un poco hablarle como si fuera adulta cuando a menudo actúa de una forma muy parecida a mis hermanos pequeños. Pero también se siente un poco cruel tratarla como a una niña, teniendo en cuenta lo importante que es para ella que la tomen en serio."
          - source: scene_3
            paragraph: 18
            text: |-
              "Mira", digo. "Obviamente el cerebro de Flower no maduró más allá de los nueve años, y todos podemos ver por su comportamiento que en el fondo sigue siendo una niña, pero lo que yo quería decir es que también puede ser seria y fiable cuando hace falta. Desde luego no vas a ver a ninguno de nosotros tratándola como a una adulta solo porque decidió empezar a imitar el comportamiento de Kate, pero sí podríamos llegar a un compromiso y dejar que se llame a sí misma alguien de veintinueve años si eso significa tanto para ella. No hay nada malo en eso, ¿o sí?"

              "¡Sí que lo hay!", dice Illuna. "¡No podemos dejar que viva en una ilusión porque no puede aceptar la realidad! ¡Eso solo la perjudicará a largo plazo! La cruda verdad es que, por mucho que lo desee, nunca va a crecer más allá de los nueve años. Perdió esa oportunidad en el momento en que invadí su cuerpo hace veinte años, y no hay manera de deshacer el daño que ya está hecho. ¡Lo mínimo que puedo hacer ahora es ayudarla a aceptar ese hecho antes de que se hunda todavía más en sus propias ilusiones!"

              "Espera un momento...", digo. "¿Me estás diciendo que esa es la verdadera razón por la que haces esto? ¿Porque te sientes culpable?"

              "¿Y qué pasa si es así?", dice Illuna frunciendo el ceño.
