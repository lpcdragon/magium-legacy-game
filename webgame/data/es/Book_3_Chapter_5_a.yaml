            paragraph: 13
            text: |-
              "Oye, Albert, ¿qué pasa?", digo. "¿Ahora estás atrapado haciendo trabajo de escolta? ¿De verdad a esto ha quedado reducido el asesino más temible del rey del subsuelo?"

              Albert no me responde, pero me dedica una mirada de auténtico odio y luego pasa de largo, mientras nuestro grupo sigue a Hadrik por el túnel de la derecha.

              "Vaya, tú y Albert de verdad no se llevan bien, ¿eh?", me pregunta Hadrik.

              "¿Qué quieres que te diga?", le respondo. "Supongo que no se me da muy bien tratar con asesinos."

              Cuando por fin llegamos a nuestra habitación, lo primero que hacemos es pedirle a Daren que cure a Illuna, porque a pesar de su notable habilidad para disimularlo, todavía no está ni de lejos completamente recuperada después de que la apuñalara por la espalda el guardia real teletransportado de la superficie. Luego le decimos a Daren y a Hadrik que se sienten, porque hay mucho de lo que hablar.

              Cuando terminamos de contarles todos los detalles de lo que estaba ocurriendo debajo de la torre de seredium, vemos claramente que cada uno se ha tomado la noticia de manera distinta. Daren tiene una expresión decidida pero amenazante en los ojos, Hadrik está absolutamente furioso y Arraka no podría mostrarse más impasible.

              "¡Esos bastardos!", grita Hadrik. "¡¿Es que no tienen ningún honor?! ¿Dónde está esa torre en la que tienen a los prisioneros? ¡Iré yo mismo y destrozaré esa máquina que drena energía con mis propias manos si hace falta!"
          - source: scene_text_2
            paragraph: 9
            text: |-
              "No podemos destruir la máquina", dice Melindra. "Hay que desactivarla desde la sala de control. ¿Es que no estabas prestando atención?"

              "¡Entonces les daré una paliza a todos los que haya en esa torre hasta que me digan dónde está la sala de control!", dice Hadrik. "¡Alguien tiene que saber dónde está!"

              "No vas a darle una paliza a nadie, bufón", dice Arraka. "Con suerte, lograrás lanzar un solo puñetazo antes de que el hechizo del torneo que protege a los lugareños te mande de vuelta a tu propio continente."

              "¡Argh!", dice Hadrik. "¡Entonces simplemente esquivaré sus ataques y atravesaré a puñetazos todas las paredes de la torre hasta encontrar adónde tengo que ir! ¡Tenemos que hacer algo! ¿Por qué nadie más está tan enfadado como yo? ¡No lo entiendo!"

              "¿Me lo preguntas a mí, o...?", dice Arraka.

              "Cálmate, Hadrik", dice Daren. "Créeme, yo estoy igual de alterado que tú. Pero no podemos encargarnos de esto nosotros solos. Aunque de algún modo lográramos liberar a la gente de debajo de esa torre, todavía hay otras tres torres en esta ciudad, y apostaría a que en ellas está ocurriendo el mismo tipo de cosas. Si seguimos yendo de torre en torre atacando a todos, al final acabaremos luchando contra todo el ejército de Ollendor. No podemos enfrentarnos solos a un reino entero. El liderazgo de esta ciudad tiene que cambiar si de verdad queremos liberar a esa gente. Y para eso necesitamos aliados. ¿Qué les pareció el Supervisor? ¿Creen que podrá ayudarnos en algo?"
