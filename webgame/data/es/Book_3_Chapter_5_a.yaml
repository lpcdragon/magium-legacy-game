  - name: b3_ch05a_adventure
    texts:
      - source: scene_text
        paragraph: 12
        text: |-
          "Creo que deberíamos empezar a ir hacia nuestra habitación en los dormitorios", digo. "No me gusta demasiado hablar aquí fuera, al descubierto. Hadrik dijo que venía hacia nosotros desde esa dirección, así que lo normal es que nos crucemos con él de camino."

          "De acuerdo", dice Daren. "Nos vemos mañana, Kelrim."

          "¡Adiós!", dice Kelrim, mientras el resto de nosotros nos adentramos en el túnel.

          "Pétalo... digo, ¡Illuna!", dice Flower. "¿Te importaría si me durmiera una hora o dos más? Todavía me siento un poco cansada..."

          "No es ningún problema", dice Illuna.

          "Vale", dice Flower. "Despiértame si pasa algo más."

          "¿Crees que sigue afectada por... lo que vimos debajo de la torre?", me escribe Leila.

          "Bueno, esa imagen es un poco difícil de sacarse de la cabeza", le digo en voz baja para que Daren no nos oiga. "Pero aun así, quizá solo estaba cansada. Illuna la despertó en mitad del sueño, así que supongo que podría simplemente... ¡oye, mira! ¡Ahí está Hadrik!"
      - source: scene_text_2
        paragraph: 8
        text: |-
          "¡Así que oí que se fueron de aventura sin avisarnos!", dice Hadrik en voz alta con su sonrisa de siempre mientras se acerca a nosotros. "¿Intentaban guardarse toda la diversión para ustedes solos, eh?"

          "Diversión no es... exactamente como yo lo describiría, pero te contaremos más cuando lleguemos a nuestra habitación", le digo. "Aquí hay demasiado jaleo con todos los refugiados subiendo y bajando por estos pasillos."

          "Bueno, antes fui a nuestra habitación y sigue estando tan tranquila como siempre", dice Hadrik. "Pero supongo que era de esperar, dado que se aseguraron de darnos la habitación más aislada de todos los dormitorios. No creo que quieran que nos mezclemos demasiado con los lugareños."

          "Yo también lo creo", dice Daren. "Pero nos viene bien, así que no podemos quejarnos. ¿Giramos a la derecha aquí, o?..."

          "Sí, tomamos el primer pasillo a la derecha, luego seguimos un buen rato y cogemos el tercer pasillo a la izquierda."

          "Bien", dice Daren. "Entonces, guía tú."

          Justo cuando estamos a punto de entrar en el siguiente pasillo, vemos a Albert, el asesino, que en este momento está ocupado guiando a un grupo de refugiados hasta sus habitaciones. Nuestras miradas se cruzan durante una fracción de segundo, pero luego Albert aparta rápidamente la vista de mí, fingiendo que nunca me vio.
