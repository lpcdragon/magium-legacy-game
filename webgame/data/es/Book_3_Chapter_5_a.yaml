scenes:
  - name: b3_ch05a_intro
    texts:
      - source: scene_text
        paragraph: 2
        text: |-
          "Ah, ya veo que por fin han regresado", dice con tono despreocupado el rey del subsuelo cuando nos ve entrar en la sala de espera de la base rebelde.

          En este momento está ocupado leyendo un informe de uno de sus hombres mientras permanece de pie junto a la entrada de la base, y apenas nos presta atención. Antes de que pueda responderle, el rey me interrumpe con una pregunta que me toma completamente por sorpresa.

          "¿Debo asumir entonces que ya terminaron sus negociaciones con el Supervisor?", dice con tono casual, sin apartar todavía la vista de la hoja de papel que tiene en las manos.

          "¿De qué estás hablando?...", digo, intentando parecer lo más calmado posible. "Creía que la reunión con el Supervisor estaba programada para mañana."

          El rey del subsuelo suspira y deja de leer su informe para poder mirarme a los ojos.

          "Escucha...", dice el rey con una expresión muy cansada en el rostro. "La situación es extremadamente grave en este momento, así que no estoy precisamente de humor para jugar con ustedes y su grupo. Te lo voy a decir sin rodeos. Llevo sospechando que irían a ver al Supervisor a mis espaldas desde nuestra primera reunión. Por eso me aseguré de que Breynan los acompañara en su pequeña excursión. Quería tener una garantía de que sus negociaciones privadas no traerían ninguna consecuencia negativa para la gente de esta ciudad."
      - source: scene_text_2
        paragraph: 2
        text: |-
          "Breynan", dice Kate frunciendo el ceño. "¿Tú acaso--"

          "¡No les mentí, lo juro!", le dice Breynan a Kate. "¡No he hablado ni una sola palabra con el rey sobre esto!"

          "Me malinterpretas, Kate", dice el rey. "No le ordené a Breynan que hiciera nada. Fue con ustedes por voluntad propia y no actuaba como espía de mi parte. Lo que me puso sobre aviso, en realidad, fue tu comportamiento conmigo."

          "¿Mi comportamiento?...", dice Kate.

          "Sí", dice el rey. "Desde nuestra primera reunión pude ver por la expresión de tus ojos que no confiabas en mí en absoluto. Esto no habría sido un problema si el sanador fuera su líder, pero dado que declaró abiertamente que ustedes suelen tomar las decisiones como grupo, mi intuición me dijo que sería muy improbable que alguna vez aceptaran colaborar conmigo y con mis hombres. Por eso, al final de la reunión, le dije a Breynan que no se le permitiría ir a hablar con el Supervisor. Sabía muy bien que eso lo pondría en mi contra, y que muy probablemente acabaría uniéndose a ustedes en su pequeña misión si los veía dirigirse a la superficie."

          Mientras escucho las palabras del rey, de repente recuerdo que le vi dirigirle una breve mirada a Kate al final de nuestra primera reunión con él, justo antes de decirle a Breynan que no se le permitiría acompañarnos a reunirnos con el Supervisor. ¿De verdad este tipo anticipó nuestras acciones antes incluso de que tuviéramos ocasión de decidirlas por nuestra cuenta?
    effects:
      - set:
          successful_checks:
            - 'Punto de control alcanzado: Partida guardada.'
        condition: checkpoint_rich = 1
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch05a_intro2
              checkpoint_rich: 0
  - name: b3_ch05a_intro2
    texts:
      - source: scene_text
        paragraph: 3
        text: |-
          "¿Qué clase de plan ridículo era ese?...", dice Melindra. "¿Estabas dispuesto a dejar fuera del equipo de negociación a la persona que más sabía sobre el Supervisor solo por una corazonada? ¿Qué habrías hecho si tu suposición resultaba equivocada? ¿Y si Daren nos hubiera convencido de esperar hasta mañana e ir con tus hombres a ver al Supervisor?"

          El rey se encoge de hombros.

          "En ese caso, supongo que simplemente le habría dicho a Breynan que cambié de opinión y que, después de todo, le permitiría reunirse con el Supervisor", dice el rey del subsuelo. "Además, no se trataba solo de mi corazonada inicial. Todas y cada una de sus acciones desde entonces no han hecho más que confirmar mis sospechas. Nunca soltaron sus mochilas ni siquiera cuando les proporcionamos una habitación, y la maga de hielo ha estado proclamando abiertamente su desconfianza hacia mí durante casi toda la duración de nuestra segunda reunión. Para entonces yo ya estaba casi seguro de que irían a ver al Supervisor por su cuenta, y por eso les propuse forjar una alianza basada en la necesidad y no en la confianza. Una alianza en la que cada uno de nosotros sería libre de apuñalar al otro por la espalda cuando le conviniera. Sí recuerdan que les dije eso, ¿verdad?"
      - source: scene_text_2
        paragraph: 3
        text: |-
          "Entonces, lo que dices es que ahora te toca a ti apuñalarnos por la espalda a nosotros", le pregunta Illuna al rey.

          "¡Santo cielo, no!", dice el rey del subsuelo. "No planeo hacerles nada. Puede que Breynan no me sea muy leal a mí, pero sí lo es sin duda a la gente de Ollendor, así que no me imagino que siguiera en buenos términos con ustedes si hubieran intentado perjudicar a nuestra gente de alguna manera. Dado que no está diciendo nada, voy a suponer que, como mínimo, no están actuando en contra de los intereses de nuestro pueblo. Eso me basta. Al fin y al cabo, su amigo el sanador ha estado trabajando sin descanso para salvar la vida de mis hombres en la zona de cuarentena desde que llegó aquí, así que sería un insulto para él si los tratara a cualquiera de ustedes como enemigos."

          "¿Eso significa que no vas a preguntarnos qué discutimos con el Supervisor?", dice Kate.

          "Obviamente sigo pensando hacerles esa pregunta", dice el rey. "Pero son libres de no responderme si esa es su decisión. Así que... ¿van a decirme o no cuáles fueron los resultados de sus negociaciones con el Supervisor?"
    choices:
      - position: 1
        text: Claro que no.
        effects:
          - set:
              current_scene: b3_ch05a_contacting
              b3_ch5_negotiations: 0
      - position: 2
        text: Quiero decir, a estas alturas el secreto ya salió a la luz, así que supongo que bien podríamos contártelo.
        effects:
          - set:
              current_scene: b3_ch05a_contacting
              b3_ch5_negotiations: 1
      - position: 3
        text: Claro, te lo diremos. Por un precio.
        effects:
          - set:
              current_scene: b3_ch05a_price
              b3_ch5_negotiations: 2
  - name: b3_ch05a_price
    routes:
      - condition: b3_ch5_negotiations = 2 AND b3_ch4_billy <> 7 AND b3_ch4_billy <> 8
        texts:
          - source: scene_text
            paragraph: 7
            text: |-
              "Claro, te lo diremos. Por un precio."

              "¿Un precio?...", dice el rey del subsuelo, y se toma unos momentos para pensar en mi oferta. "Bueno, para serte completamente sincero, no puedo decir que estuviera dispuesto a gastar mucho dinero en esta información. Tal como yo lo veo, o llegaron a algún trato secreto con el Supervisor, en cuyo caso obviamente no van a contármelo, o su discusión giró en torno a formas viables de asesinar al rey, que probablemente ya se volvieron irrelevantes ahora que el rey ha ordenado el cierre total de la ciudad. Sin embargo, sí estaría dispuesto a pagarles diez monedas de oro por adelantado si aceptan confirmar o negar mi hipótesis. ¿Qué me dicen?"
        choices:
          - position: 1
            text: Confirmar que la información del Supervisor ya se ha vuelto irrelevante.
            effects:
