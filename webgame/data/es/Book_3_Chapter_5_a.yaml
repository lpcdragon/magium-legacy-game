        paragraph: 12
        text: |-
          "En realidad no", dice Arraka. "Pero al menos será un buen primer paso para enseñarle a ser un poco más versátil con sus hechizos. No puede seguir dependiendo del mismo ataque a larga distancia una y otra vez. Quizá Flower pueda darle ideas de qué hechizos nuevos podría inventar. He notado que la pequeña puede ser bastante ingeniosa cuando se trata de este tipo de cosas. Bien, ahora que eso está resuelto, lo siguiente de lo que tenemos que hablar es del capitán de la guardia real. Este va a ser un poco más complicado. Lo ideal sería enseñarles a todos cómo contrarrestar la técnica de manipulación de aura de ese tipo, pero no creo que tenga tiempo suficiente para hacerlo. Tal y como van las cosas, no me sorprendería que ustedes tuvieran una revancha con él tan pronto como mañana, así que vamos a necesitar una solución más inmediata para este problema. En otras palabras, la próxima vez que aparezca ese viejo, quiero que se lo dejen a Daren."

          "¿A mí?...", dice Daren, sorprendido.

          "¡Sí, a ti!", dice Arraka. "Dijiste que por fin entendiste qué significa desenredar el flujo de un aura, ¿no? Bueno, el mismo concepto se aplica cuando un enemigo intenta envolverlos en su propia aura para empujarlos al suelo. Tú simplemente desenredas su aura y entonces podrás moverte libremente a través de ella. Obviamente, como estás lidiando con un enemigo que intenta atacarte y no con un grupo de enfermos en una enfermería, te resultará muchísimo más difícil lograrlo, pero si de verdad le sacas provecho a esa espada encantada tuya, deberías ser capaz de manejarlo. Sí entiendes cómo podrías desenredar un aura usando tu espada, ¿verdad?"

          "Sí...", dice Daren. "Sí, creo que sí."
      - source: scene_3
        paragraph: 12
        text: '"Bien", dice Arraka. "Bueno, creo que eso será todo por ahora. Si recuerdo algo más, me aseguraré de hacérselo saber mañana. Se acabó la clase. Vayan a dormir."'
        condition: ch11_saved_rose = 0
      - source: scene_3
        paragraph: 13
        text: |-
          "Bien", dice Arraka. "Bueno, creo que eso será todo por ahora. Si recuerdo algo más, me aseguraré de hacérselo saber mañana. Hmm... en realidad, ahora que lo pienso, había una última cosa que quería discutir esta noche. Oye, Rose, ¿sigues ahí?"

          No llega ninguna respuesta a través de mi transceptor. Después de esperar unos segundos más, Arraka vuelve a llamarla, esta vez en voz más alta.

          "¡Oye, ROSE!", grita Arraka. "¿Sigues ahí o no?"

          Hay más silencio durante un rato y luego oímos el sonido de pasos apresurados haciéndose gradualmente más fuertes a medida que Rose vuelve hasta su transceptor.

          "¡Perdón!", dice Rose. "Suzie no podía dormir, así que fui a traerle algo de picar de la despensa. ¿Me perdí algo importante?"

          "No, pero había algo que quería preguntarte sobre tus poderes temporales", dice Arraka. "¿Barry te dijo lo que tienes que hacer antes del próximo ritual del Dios del Tiempo?"

          "Oh, eh, ¡sí!", dice Rose. "Dijo que tengo que asegurarme de que el Dios del Tiempo no pueda volver a robarme mis poderes. He estado trabajando en ello, pero... umm..."

          "¿No sabes por dónde empezar con tu entrenamiento?", dice Arraka.

          "No, no es eso", dice Rose. "Creo que sé lo que tengo que hacer, pero es muy difícil saber si lo estoy haciendo bien sin alguna forma de poner a prueba mis resultados..."
        condition: ch11_saved_rose = 1
