    texts:
      - source: scene_text
        paragraph: 27
        text: |-
          "¿No tienes ningún hechizo que pueda curar a esta gente sin necesitar hierbas?"

          "No existe ningún hechizo que yo conozca que pueda curar a estas personas", dice Daren. "Lo que intento hacer es modificar ligeramente uno de mis hechizos existentes para que pueda funcionar con ellos, pero no hay manera de hacerlo sin las herramientas adecuadas y las hierbas correctas. Por eso necesito ir a comprarlas cuanto antes."

          "Solo una pregunta", dice Melindra. "Cuando dijiste que mañana irías de compras, ¿querías decir que pensabas ir tú solo?"

          "Bueno, sí", dice Daren. "No puedo obligarlos a arriesgar sus vidas ahí fuera solo porque decidí por mi cuenta intentar salvar a esta gente. Esta es mi responsabilidad."

          "¡Oh, no, ni hablar!", dice Melindra. "Si algo hemos aprendido hoy, es que separarnos es mala idea. No se sabe qué puede pasar ahí arriba, sobre todo ahora con este cierre total. Si tú vas, entonces vamos todos. ¿Verdad, Kate?"
      - source: scene_text_2
        paragraph: 15
        text: |-
          "Sí...", dice Kate. "Tienes razón. No podemos permitirnos cometer más errores como este después de lo que pasó hoy."

          "Exacto", dice Melindra. "Y además, Illuna seguramente nos mataría ella misma si tuviera que venir a rescatarnos una segunda vez en menos de veinticuatro horas por culpa de nuestra negligencia."

          "Eso es correcto", dice Illuna.

          "Vale, vale, vienen conmigo", dice Daren. "Puede venir todo el que quiera. Ahora vayamos a dormir, ¿sí? Mañana nos espera otro día largo."

          "¡Illuna y yo haremos el primer turno!", digo, mientras todos los demás se preparaban para hacer sus camas.

          "¿Primer turno?...", dice Daren. "Barry, esto ya no es la naturaleza."

          "De hecho, yo también creo que deberíamos hacer turnos de guardia nocturna", dice Illuna. "No confío demasiado en estos rebeldes, y la forma en que nos aislaron del resto de los dormitorios me resulta un poco sospechosa. Nunca se sabe a quién podrían enviar a asesinarnos en mitad de la noche si no tenemos cuidado."
      - source: scene_3
        paragraph: 16
        text: |-
          "En ese caso, yo haré el segundo turno", dice Kate. "Es lo menos que puedo hacer para compensar todos los problemas que les causé a todos hoy."

          "Yo también haré el segundo turno", escribe Leila con una sonrisa.

          "Muy bien", digo. "Dos turnos bastan por una noche. Kate, Leila, las relevarémos en cuatro horas. Vamos, Illuna."

          "Hmm...", dice Melindra en un tono ligeramente suspicaz mientras me ve salir de la habitación con Illuna.
