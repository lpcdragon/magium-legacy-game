              "Tengo una idea", dice Arraka. "¿Qué tal si dejan de buscar ayuda en todos estos perdedores y empiezan de una vez a buscar formas de resolver sus problemas por ustedes mismos? ¿Creen que estos rebeldes idiotas van a estar ahí para llevarlos de la mano mientras luchan contra el Dios del Tiempo? ¿Creen que estarán ahí para pelear a su lado cuando esa copia mía de hace cinco mil años les meta la mano por la boca y les arranque los esqueletos? ¿Cuándo van a entender de una vez, escorias, que esto no es un juego y que tendrán que tomarse en serio su entrenamiento si quieren tener la más mínima posibilidad de alcanzar sus metas absurdas?"
            condition: b3_ch4_billy = 9
