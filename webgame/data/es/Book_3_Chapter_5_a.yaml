      - source: scene_3
        paragraph: 4
        text: |-
          "¿Estás seguro?...", dice Daren. "Por lo que entendí, la enfermedad avanza mucho más despacio en los goblins, así que aún podrías esperar una o dos semanas a que se levante el cierre total de la ciudad antes de salir a comprar las hierbas. No hace falta que pongas tu vida aún más en peligro saliendo ahí fuera ahora."

          "¿Y qué pasa con toda la gente que moriría mientras tanto si no consigues las hierbas a tiempo tú solo?", dice Kelrim. "¡No puedo permitir que se pierdan más vidas inocentes por nada! ¡Mientras siga respirando, haré todo lo que esté en mi mano por ayudar!"

          Las palabras del goblin sobre vidas inocentes perdidas por nada me golpean más de lo que esperaba. Probablemente no lo hizo a propósito, pero cuando dijo eso me recordó de inmediato a sus amigos goblins, a los que asesinamos sin pensarlo dos veces antes de entrar en la ciudad. El hecho de que no nos esté culpando por la muerte de sus amigos lo vuelve aún peor. Una rápida mirada a Daren y a Kate me dice que ambos están pensando exactamente lo mismo. Al darse cuenta de que no hay realmente nada que pueda decir para arreglar lo que hicimos, Daren decide respetar los deseos del goblin y ofrecerle su apoyo total.

          "En ese caso, puedes estar seguro de que te cubriré la espalda, Kelrim", dice Daren con una mirada seria. "Te prometo que no dejaré que te pase nada mientras estemos en la superficie."

          "Gracias", dice Kelrim. "Y, por lo que valga, también intentaré aprovechar al máximo mis habilidades curativas si nos atacan."
        condition: b3_ch2_goblins = 1
