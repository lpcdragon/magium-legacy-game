            text: |-
              Rose deja escapar una risita suave.

              "¡Casi había olvidado cuánto echaba de menos a Illuna y su malhumor habitual!", dice. "Espero de verdad que las dos puedan resolver su discusión pronto."

              "Yo también", digo.

