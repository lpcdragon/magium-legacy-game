  - name: b3_ch05a_initiative
    texts:
      - source: scene_text
        paragraph: 19
        text: |-
          "¡SÍ nos hemos tomado en serio el entrenamiento!", dice Hadrik en voz alta. "¡Lo hemos hecho todos los días desde los rituales! ¿Qué más quieres de nosotros, vieja bruja senil?"

          "¡Quiero que tomen la iniciativa!", dice Arraka. "Quiero que superen sus malditos límites y vayan mucho más allá. No se limiten a seguir ciegamente mis programas de entrenamiento como marionetas sin cerebro. ¡Aspiran a matar a un DIOS! ¿Cómo piensan hacer algo así si todavía pueden ser derrotados con tanta facilidad por dos miserables guardias reales?"

          "No entiendo por qué te importa tanto esto", dice Kate mientras se apoya de espaldas contra una pared, con los brazos cruzados y mirando el amuleto. "Normalmente te gusta tratarlo todo como una broma, pero por alguna extraña razón nunca te veo hacerlo cuando hablas de nuestro entrenamiento para matar al Dios del Tiempo. ¿Por qué?"

          "¡Porque esto no es una broma, maldita sea!", dice Arraka. "¿Tienen idea de cuántos miles de años he esperado para vengarme de esos autoproclamados dioses del plano mágico? Después de todo este tiempo, aunque yo misma los matara de las formas más dolorosas que se me ocurrieran, seguiría sin ser suficiente. ¿Pero verlos morir a manos de una troupe de circo como ustedes? Esa sería la muerte más cruel y humillante imaginable para un ser hecho de pura magia que ha alcanzado semejante nivel de poder. Desde que Barry me dio esa idea, ni siquiera he podido pensar en un final más apropiado para una bolsa arrogante de basura como Selkram. De un modo u otro, voy a lograr que esto ocurra, y más les vale a ustedes, perdedores, no interponerse en mi camino."
      - source: scene_text_2
        paragraph: 10
        text: |-
          "Aunque resulta reconfortante que por una vez no estés haciendo las cosas por capricho", dice Daren, "¿de casualidad también tendrás algún consejo concreto que darnos? ¿O solo vas a seguir lanzándonos insultos hasta que mejoremos?"

          "Oh, claro que les daré algún consejo concreto", dice Arraka. "¡Oye, enano! ¿Qué demonios fue ese desempeño patético que nos mostraste hoy contra ese amiguito gigante tuyo? ¡Bastó con que te dijera dos palabras para sacarte por completo del combate! ¿Así de blandengue eres? ¿De verdad hacen falta solo dos palabras miserables para convertirte de guerrero curtido en batalla en un broncas torpe de taberna? Si te digo esas dos palabras ahora, ¿vas a pasarte otro día entero compadeciéndote? Pues aquí van, ¡voy a decirlas! Pueblo enano. Pueblo enano. Pueblo enano. ¿Vas a llorar ahora, pequeño gigante?"

          "Arraka", dice Daren con una mirada furiosa en los ojos. "Si dices una sola palabra más, voy a--"
      - source: scene_3
        paragraph: 10
        text: |-
          "No, tiene razón", dice Hadrik. "No debí dejar que me afectara de esa manera con solo unas pocas palabras. Si Barry no hubiera conseguido mantener ocupado a Gontrok mientras yo estaba inconsciente, podría haberlos matado a todos, y habría sido culpa mía. No dejaré que vuelva a pasar."

          "Más te vale", dice Arraka. "Porque si alguna vez estamos a punto de acabar con Selkram y la fastidias porque él te activa algún recuerdo reprimido diciéndote unas cuantas palabras al azar, te juro que te meteré los dedos por las cuencas de los ojos y te arrancaré el cráneo de la columna. Y ya que estamos, ¿qué tal si trabajas también en tus técnicas de combate de verdad, y no solo en tu fortaleza mental? Te he visto practicar algunos movimientos nuevos en los últimos días, pero no usaste ni uno solo en la pelea de hoy. ¿Qué estabas esperando? ¿Una invitación formal?"
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch05a_icicles
  - name: b3_ch05a_icicles
    texts:
      - source: scene_text
        paragraph: 20
        text: |-
          "No sabía que habías estado practicando técnicas últimamente, Hadrik", dice Daren. "Si querías ideas para movimientos nuevos, podrías haberme pedido algunas sugerencias."

          "Bueno, en realidad fue tu historia sobre cómo conseguiste tu cicatriz lo que me hizo querer empezar a entrenar otra vez", dice Hadrik. "¿Recuerdas que dije que tu historia me había parecido extrañamente inspiradora? Fue entonces cuando decidí tomarme un poco más en serio mis debilidades y empezar a probar técnicas nuevas para superarlas. Por desgracia, todavía no estaba realmente listo para usarlas en combate, y así fue como ese bastardo de Gontrok consiguió agarrarme desprevenido, pero me aseguraré de perfeccionar mis movimientos nuevos esta noche. Esta vez no voy a correr más riesgos."

          "Bien por ti", dice Arraka. "Ahora cállate. Todavía no he terminado de dar consejos 'concretos'. ¡Oye, Kate! Voy a preguntarte esto con total franqueza. ¿Qué pasa contigo y los ataques de congelación? ¿Les tienes alergia o algo? Apenas te he visto usarlos desde que te conozco, aunque son por mucho los ataques más fuertes de tu arsenal cuando se usan contra magos enemigos. Con lo tuyo siempre son carámbanos. Tengo una idea. ¿Qué tal si diversificas un poco tus ataques en lugar de ser tan predecible?"
      - source: scene_text_2
        paragraph: 11
        text: |-
          "Uso carámbanos porque son lo más eficiente", dice Kate. "Tienen el mayor alcance y pegan más fuerte. Además son difíciles de detectar porque la mayoría de los enemigos no esperan que los conjure tan alto por encima de ellos a menos que ya me hayan visto usar este ataque una vez. Dado que normalmente funciona, no veo ninguna razón para usar otra cosa."

          "¿Por qué intentas esquivar la pregunta principal?", dice Arraka. "Lo primero que te pregunté fue por qué estás evitando específicamente lanzar hechizos de congelación. Te he visto hacerlo incluso en situaciones en las que te habría convenido más usar un rayo de hielo que un ataque de carámbanos. En esos casos no puedes poner la excusa de la eficiencia, así que ¿cuál es el motivo real?"

          Kate frunce el ceño hacia el amuleto de Arraka durante unos segundos, pero finalmente decide responder a la pregunta.
      - source: scene_3
        paragraph: 11
        text: |-
          "La razón es que tengo mucho menos control sobre los hechizos de congelación que sobre mis ataques de carámbanos", dice Kate. "Puedo congelar a la gente con mis rayos de hielo, pero no puedo descongelarla. Una vez disparo un rayo, ya escapa a mi control. Es distinto a cuando conjuro un carámbano o hago un dragón de hielo. El hielo es algo que puedo controlar a voluntad, y también puedo hacer que desaparezca cuando quiera. No se puede decir lo mismo de ninguno de mis hechizos de congelación. Además, disparar carámbanos me permite atacar a mis objetivos con precisión milimétrica, mientras que la mayoría de mis hechizos de congelación afectan a una zona más amplia, así que si golpeara a alguien por error, no habría manera de deshacer el efecto. Si voy a usar un ataque de congelación, normalmente será solo cuando esté absolutamente segura de que no voy a alcanzar a ninguno de mis aliados por accidente."

          "Bla, bla, bla", dice Arraka. "Lo único que oigo son más excusas lloronas. ¿No sabes cómo descongelar a la gente? Pues aprende a hacerlo. Así de simple."

          "Ya he intentado hacerlo incontables veces", dice Kate. "No funciona."

          "¡Entonces esfuérzate más!", dice Arraka. "¡O pregúntale a alguien, por todos los dioses! Tienes otros dos elementalistas en tu equipo aparte de ti, y una de ellas resulta ser una etérea. ¿Tienes idea de cuántas ventajas obtienes solo por ser etérea? Esa chica puede aprender en un día lo que a un mago normal le llevaría años dominar. Seguro que hay al menos algo que puede decirte para orientarte. Aunque creo que ahora mismo está dormida, así que probablemente no podremos confirmarlo hasta mañana."
    choices:
      - position: 1
        text: ¿Crees que el conocimiento etéreo de Flower se extiende también a la magia de hielo?
        effects:
          - set:
              current_scene: b3_ch05a_knowledge
      - position: 2
        text: ¿De verdad Flower es tan talentosa? ¿Cómo es que no se ha vuelto absurdamente fuerte a estas alturas?
        effects:
          - set:
              current_scene: b3_ch05a_talented
      - position: 3
        text: ¿Por qué no le dices tú a Kate cómo descongelar a la gente si eres tan lista?
        effects:
          - set:
              current_scene: b3_ch05a_unfreeze
  - name: b3_ch05a_knowledge
    texts:
      - source: scene_text
        paragraph: 21
        text: |-
          "¿Crees que el conocimiento etéreo de Flower se extiende también a la magia de hielo?"

          "Lo dudo, pero eso no es importante", dice Arraka. "Todos los elementalistas aprenden sus hechizos de la misma manera. Da igual si usan fuego, hielo o cualquier otra cosa. Aunque Flower no sepa nada de hechizos de hielo, igualmente debería poder darle a Kate algunas indicaciones generales que la ayuden."

          "Entonces, si Kate aprende a controlar correctamente sus hechizos de congelación, ¿eso también la ayudará contra el Dios del Tiempo?", digo.
      - source: scene_text_2
        paragraph: 12
        text: |-
          "En realidad no", dice Arraka. "Pero al menos será un buen primer paso para enseñarle a ser un poco más versátil con sus hechizos. No puede seguir dependiendo del mismo ataque a larga distancia una y otra vez. Quizá Flower pueda darle ideas de qué hechizos nuevos podría inventar. He notado que la pequeña puede ser bastante ingeniosa cuando se trata de este tipo de cosas. Bien, ahora que eso está resuelto, lo siguiente de lo que tenemos que hablar es del capitán de la guardia real. Este va a ser un poco más complicado. Lo ideal sería enseñarles a todos cómo contrarrestar la técnica de manipulación de aura de ese tipo, pero no creo que tenga tiempo suficiente para hacerlo. Tal y como van las cosas, no me sorprendería que ustedes tuvieran una revancha con él tan pronto como mañana, así que vamos a necesitar una solución más inmediata para este problema. En otras palabras, la próxima vez que aparezca ese viejo, quiero que se lo dejen a Daren."

          "¿A mí?...", dice Daren, sorprendido.

          "¡Sí, a ti!", dice Arraka. "Dijiste que por fin entendiste qué significa desenredar el flujo de un aura, ¿no? Bueno, el mismo concepto se aplica cuando un enemigo intenta envolverlos en su propia aura para empujarlos al suelo. Tú simplemente desenredas su aura y entonces podrás moverte libremente a través de ella. Obviamente, como estás lidiando con un enemigo que intenta atacarte y no con un grupo de enfermos en una enfermería, te resultará muchísimo más difícil lograrlo, pero si de verdad le sacas provecho a esa espada encantada tuya, deberías ser capaz de manejarlo. Sí entiendes cómo podrías desenredar un aura usando tu espada, ¿verdad?"

          "Sí...", dice Daren. "Sí, creo que sí."
      - source: scene_3
        paragraph: 12
        text: '"Bien", dice Arraka. "Bueno, creo que eso será todo por ahora. Si recuerdo algo más, me aseguraré de hacérselo saber mañana. Se acabó la clase. Vayan a dormir."'
        condition: ch11_saved_rose = 0
      - source: scene_3
        paragraph: 13
        text: |-
          "Bien", dice Arraka. "Bueno, creo que eso será todo por ahora. Si recuerdo algo más, me aseguraré de hacérselo saber mañana. Hmm... en realidad, ahora que lo pienso, había una última cosa que quería discutir esta noche. Oye, Rose, ¿sigues ahí?"

          No llega ninguna respuesta a través de mi transceptor. Después de esperar unos segundos más, Arraka vuelve a llamarla, esta vez en voz más alta.

          "¡Oye, ROSE!", grita Arraka. "¿Sigues ahí o no?"

          Hay más silencio durante un rato y luego oímos el sonido de pasos apresurados haciéndose gradualmente más fuertes a medida que Rose vuelve hasta su transceptor.

          "¡Perdón!", dice Rose. "Suzie no podía dormir, así que fui a traerle algo de picar de la despensa. ¿Me perdí algo importante?"

          "No, pero había algo que quería preguntarte sobre tus poderes temporales", dice Arraka. "¿Barry te dijo lo que tienes que hacer antes del próximo ritual del Dios del Tiempo?"

          "Oh, eh, ¡sí!", dice Rose. "Dijo que tengo que asegurarme de que el Dios del Tiempo no pueda volver a robarme mis poderes. He estado trabajando en ello, pero... umm..."

          "¿No sabes por dónde empezar con tu entrenamiento?", dice Arraka.

          "No, no es eso", dice Rose. "Creo que sé lo que tengo que hacer, pero es muy difícil saber si lo estoy haciendo bien sin alguna forma de poner a prueba mis resultados..."
        condition: ch11_saved_rose = 1
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch05a_reverse
            condition: ch11_saved_rose = 1
          - set:
              current_scene: b3_ch05a_lockdown
            condition: ch11_saved_rose = 0
