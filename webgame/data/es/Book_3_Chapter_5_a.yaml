  - name: b3_ch05a_reverse
    routes:
      - condition: b3_ch4_billy = 0
        texts:
          - source: scene_text
            paragraph: 25
            text: |-
              "No te preocupes por eso", dice Arraka. "Mientras sientas que sabes lo que estás haciendo, por el momento es más que suficiente. Una vez que te sientas un poco más segura de tus capacidades, te daré una forma más fiable de confirmar tus progresos. Sin embargo, la verdadera prueba llegará durante el próximo ritual. Quiero que para entonces estés lo bastante preparada, porque lo que quiero que hagas es bloquear el primer intento de Selkram de robarte el poder de reversión temporal sin que él lo note. Estará confundido durante un rato, pero jamás sospechará que de verdad eres capaz de defenderte, así que pensará que fue una casualidad. Una vez que te hayas asegurado de que tu técnica funciona correctamente, deja que siga robándote los poderes durante el resto del ritual. No hay manera de que vayamos a estar listos para enfrentarnos a él tan pronto, así que tenemos que mantener el factor sorpresa hasta el tercer ritual. Para entonces, con suerte, el equipo estará en un estado un poco mejor."

              "¿...Eso era todo lo que querías pedirme?", dice Rose.

              "No, también había otra cosa que quería preguntarte directamente", dice Arraka. "Oí que fuiste capaz de ver una premonición y que incluso conseguiste congelar el tiempo lo suficiente como para que estos inútiles atravesaran una sala llena de trampas. ¿Eso significa que ya puedes ralentizar el tiempo? ¿Y revertirlo?"
          - source: scene_text_2
            paragraph: 14
            text: '"Oh, no, no puedo ralentizar ni revertir el tiempo...", dice Rose. "Solo intenté detener el tiempo porque era el hechizo que recordaba como el menos complicado de aprender. Ni se me ocurriría intentar ralentizar el tiempo a mi nivel actual. En cuanto a la reversión temporal... eso es algo que no podía hacer conscientemente ni siquiera cuando estaba vinculada al Magium. No sé cómo conseguí hacerlo aquella vez cuando tú saliste del amuleto. Ah, y la premonición me vino sin que tuviera que hacer nada. No tengo ni idea de qué la desencadenó."'
          - source: scene_3
            paragraph: 14
            text: |-
              "La premonición apareció como resultado de que has adquirido un mejor control sobre tus poderes temporales", dice Arraka. "No vas a poder provocarlas a voluntad por mucho que lo intentes. Además, normalmente la mayoría deberían tener que ver con salvar tu propia vida, no la de otra persona. Me sorprende que tu primera premonición haya sido sobre salvar a Illuna. ¿O quizá pasó porque eres del tipo de persona que se preocupa más por los demás que por sí misma? Hmm... Bueno, sea como sea, desde luego deberías seguir haciendo lo que estás haciendo. Demonios, si consigues mantener este ritmo, podrías llegar a ser más útil que todos estos perdedores juntos. Incluso un supuesto 'dios' lo tendrá difícil para luchar cuando lo estén congelando constantemente en el tiempo. Lo cual es bastante irónico para un autoproclamado dios del tiempo, si te paras a pensarlo."

              "Yo... no sé si sería capaz de congelarlo constantemente", dice Rose. "Ahora mismo ni siquiera puedo mantener el hechizo durante más de treinta segundos sin casi desmayarme."

              "Sí, pero cuando estemos luchando contra Selkram, estarás vinculada al Magium, lo que significa que tendrás mucho más control", dice Arraka. "Y lo que estás haciendo ahora definitivamente ayudará durante el ritual, así que sí, sigue haciéndolo. Solo asegúrate de hacer también ese otro entrenamiento del que hablamos."

              "De acuerdo, lo haré", dice Rose. "Gracias por el consejo."

              "Bien, ahora sí que hemos terminado por hoy", dice Arraka. "Se acabó la clase. Vayan a dormir."
