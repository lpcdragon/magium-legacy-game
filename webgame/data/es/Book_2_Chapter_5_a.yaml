  - name: b2_ch05a_ogres_heard
    texts:
      - source: scene_text
        paragraph: 7
        text: |-
          Casi tan pronto como salgo de mi sala, empiezo a escuchar a dos guardias hablando entre sí, muy lejos en el pasillo.

          "¿Escuchaste que van a traer a los ogros esta ronda?" dice uno de los guardias.

          "¿Te refieres a los que Velgos capturó?" dice el otro guardia.

          "Sí. Escuché que el trol tiene a miembros de su tribu como rehenes, y los está amenazando con matarlos a menos que peleen a su lado. Uno de esos miembros de la tribu es una chamán. No se ven muchas de esas, en estos días."

          "Espera, ¿dijiste chamán? Entonces por eso tenía esas prendas extrañas y marcas en la cara..."

          "¿Qué quieres decir? ¿La viste?"

          "Sí, una de las celdas que estoy vigilando tiene unos cuantos ogros. Es la más cercana a los vestuarios. Supongo que Velgos debe haberle pedido al dueño que los moviera aquí, temporalmente, para poder matar fácilmente a uno o dos de ellos en caso de que los guerreros se porten mal."

          "¡Ja! Esos ogros tontos ni siquiera saben que sus miembros de la tribu están justo bajo sus narices. Se lo merecen. Si fueron lo suficientemente estúpidos como para dejarse capturar, entonces merecen vivir sus vidas como secuaces del trol. ¡Estoy seguro de que ambos nos proporcionarán buen entretenimiento!"

          Los guardias se ríen, y luego reanudan sus patrullas.
    effects:
      - set:
          successful_checks:
            - '[ Comprobación de audición exitosa - nivel 2 ]'
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch05a_toast
  - name: b2_ch05a_toast
    routes:
      - condition: b2_ch5_heard_guards = 1
        texts:
          - source: scene_text
            paragraph: 8
            text: |-
              Avanzo por el pasillo lo más rápido que puedo, e intento averiguar cuál de las puertas lleva a la sala del enano. Cuando escucho la risa de Hadrik proveniente de detrás de una de las puertas, me doy cuenta de que he llegado a mi destino, y toco la puerta tres veces, llamándolo, para que sepa quién es.

              "Hadrik, ¿estás ahí?" digo.

              "¡Sí, sí, dame un segundo!" dice Hadrik, y me abre la puerta unos segundos después.

              Justo como esperaba, parece que el enano trajo más de unas cuantas botellas de ale con él, para hacerle compañía. Probablemente intentó convencer a sus compañeros de equipo de beber con él antes de la batalla, pero no parece que haya tenido mucha suerte.

              "¡Felicidades por ganar tu primera ronda, Barry!" dice Hadrik. "¿Viniste a hacer un brindis, antes de tu próxima batalla?"

              "No exactamente," digo. "Pero sí vine a pedirte una de tus botellas de ale enana, si no es mucha molestia."
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch05a_maliciously
      - condition: b2_ch5_heard_guards = 0
        texts:
          - source: scene_text
            paragraph: 9
            text: "I make my way down the hallway as fast as I can, and I try to figure out which one of the doors leads to the dwarf's room. When I hear Hadrik's laughter coming from behind one of the doors, I realize that I've reached my destination, and I knock on the door three times, calling out to him, to let him know who it is.\r\n\r\n\"Hadrik, are you in there?\" I say.\r\n\r\n\"Yeah, yeah, give me a sec!\" Hadrik says, and he opens the door for me a few seconds later.\r\n\r\nJust as I was hoping, it looks like the dwarf brought more than a few bottles of ale with him, to keep him company. He likely tried to convince his teammates to drink with him before the battle, but it doesn't look like he's had much luck.\r\n\r\n\"Congratulations on winning your first round, Barry!\" Hadrik says. \"Did you come to make a toast, before your next battle?\"\r\n\r\n\"Not exactly,\" I say. \"But I did come here to ask you for one of your dwarven ale bottles, if it's not too much trouble.\""
        effects:
          - set:
              failed_checks:
                - '[ Comprobación de audición fallida - nivel 2 ]'
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch05a_maliciously
  - name: b2_ch05a_maliciously
    routes:
      - condition: b2_ch4_beer = 0 AND b2_ch2_creatures = 1
        texts:
          - source: scene_text
            paragraph: 10
            text: |-
              "Para nada," dice Hadrik. "Originalmente traje estas botellas aquí para dárselas a mis compañeros de equipo, pero nadie aquí parece apreciar las alegrías de compartir un trago antes de una batalla, como yo. Toma la botella que quieras. ¡Tengo de sobra!"

              "¡Perfecto!" le digo, mientras tomo una de las botellas de ale enana del suelo. "Ahora lo único que necesito es una manera de llegar al área de combate antes del inicio de la ronda."

              Luego empiezo a mirar a mi alrededor, para ver si hay algún mecanismo oculto que me permita abrir la reja de hierro por mi cuenta.

              "Quieres entrar a la arena antes de la batalla..." me pregunta Hadrik, confundido.

              "Sí," le digo. "¿Conoces una salida?"

              "Bueno, no, pero siempre está la buena y vieja manera tradicional," dice Hadrik, mientras se acerca a la reja de hierro. "Apártate."

              Luego golpea la reja muy fuerte, arrancándola de sus bisagras, y enviándola volando hacia la arena.

              "¡El camino está despejado!" dice Hadrik.

              "¡Genial!" digo. "¡Muchas gracias!"

              Luego me dirijo hacia el área de combate a través del agujero en la pared, y saludo a Hadrik mientras me voy.

              "¡Nos vemos!" le digo.

              "Eh, nos vemos, supongo..." dice Hadrik.
          - source: scene_text_2
            paragraph: 3
            text: |-
              Mientras avanzo lentamente hacia el trol, con la botella de ale en la mano, el presentador empieza a gritarme, desde su plataforma elevada arriba.

              "¿Qué crees que estás haciendo?" dice. "¡La ronda aún no ha comenzado! ¡Vuelve a tu propia área de división ahora mismo! ¿Me escuchas? ¡Vuelve! ¡Oye, me estás escuchando?"

              Ignoro al presentador, y miro directamente al trol, mientras camino casualmente hacia él. Cuando me ve, Velgos deja de saludar a las multitudes, y empieza a sonreírme maliciosamente.

              "¿Viniste aquí a suplicar por tu vida, humano?" me grita el trol. "¡No te servirá de nada! ¡Tu destino ya está sellado!"

              No digo nada y sigo caminando hacia adelante.

              "¡Maldición!" dice el presentador. "Abran las rejas. ¡Ábranlas ahora!"
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch05a_flammable
      - condition: b2_ch4_beer = 0 AND b2_ch2_creatures = 0
        texts:
          - source: scene_text
            paragraph: 11
            text: |-
              "Para nada," dice Hadrik. "Originalmente traje estas botellas aquí para dárselas a mis compañeros de equipo, pero nadie aquí parece apreciar las alegrías de compartir un trago antes de una batalla, como yo. Toma la botella que quieras. ¡Tengo de sobra!"

