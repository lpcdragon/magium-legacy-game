              Espero a que Leila empiece a usar una ráfaga de ataques contra su oponente, y cuando parece que el trol está a punto de saltar, hago un rápido sprint hacia adelante para poder apuñalarlo con mi hoja mientras está desequilibrado.

              No lo noté de inmediato, pero había algo distinto en la forma en que retrocedió esta vez. Parecía como si al principio no fuera a saltar, y solo se hubiera decidido a hacerlo después de verme lanzarme hacia él. Desafortunadamente, me di cuenta de todo esto demasiado tarde. Velgos saltó hacia atrás, pero esta vez no estaba desequilibrado en absoluto. Solo fingió estarlo para tenderme una trampa, y mientras intentaba apuñalarlo por detrás, el trol lanzó una de sus hojas hacia mi cuello, y me decapitó en un instante.
