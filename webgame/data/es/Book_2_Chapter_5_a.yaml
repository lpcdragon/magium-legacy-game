  - name: b2_ch05a_flammable
    texts:
      - source: scene_text
        paragraph: 14
        text: |-
          Escucho un cuerno señalando el inicio de la segunda ronda, y la reja de mi división empieza a levantarse lentamente. Mientras sigo caminando, me aseguro de avanzar lo suficientemente despacio para darle a Leila tiempo de alcanzarme.

          El trol sigue provocándome. Debe estar pensando que vine aquí a ofrecerle un trago. No creo que haya tenido nunca el privilegio de probar ale enana. A juzgar por la sensación de ardor que sentí en la garganta cuando bebí mi primera botella con Hadrik, apostaría a que esta es la bebida alcohólica más fuerte que el dinero puede comprar. Quizás Velgos estaría un poco más preocupado si supiera lo que tengo en esta botella.

          "¿Estás intentando sobornarme, humano?" dice Velgos, con una risa. "¡Va a hacer falta más que una botella de ale para convencerme de perdonarte la vida! ¿Qué tal si empiezas arrodillándote ante mí? ¡Quiero que cada espectador en la multitud vea lo patético que eres, antes de que te mate!"

          Me detengo justo frente al trol, y le sonrío, mientras levanto mi botella. Leila ahora está a solo unos pocos metros detrás de mí, y se está acercando, con los otros miembros de mi división no muy lejos detrás de ella. Lleva la antorcha escondida detrás de la espalda, asegurándose de que el trol no la note.

          "¡Salud!" le digo al trol, mientras tengo mi botella levantada en el aire.

          "¿Qué estás intentan--" empieza a decir Velgos, pero no lo dejo terminar su frase.

          Rápidamente agarro la botella por el cuello, y la estrello contra el cráneo del trol, cubriéndolo en ale enana de la cabeza a los pies. El trol parece conmocionado, incapaz de entender lo que está pasando.
      - source: scene_text_2
        paragraph: 4
        text: |-
          "¡Leila, ahora!" grito, mientras salto hacia atrás alejándome del trol.

          Tan pronto como doy la señal, Leila lanza su antorcha al trol, encendiendo el líquido inflamable, y haciendo que el trol se prenda en llamas. Velgos empieza a gritar fuerte, mientras intenta extinguir el fuego de su cabeza con sus propias manos. Leila aprovecha al máximo esta oportunidad, y rápidamente se lanza hacia su enemigo, cortando una de sus hombreras directamente de su armadura, con una de sus dagas encantadas. El trol agarra ambas cimitarras en sus manos, e intenta partir a Leila por la mitad, pero ella salta hacia atrás a tiempo, esquivando su golpe.

          "Los voy a destruir," nos grita el trol. "¡Los voy a cortar en pedazos tan pequeños que no encontrarán suficiente de ustedes para darles un entierro decente!"

          Sus ojos están rojos de rabia, mientras el fuego que lo cubre se está apagando lentamente. Las marcas dejadas por las llamas ya están empezando a regenerarse. Supongo que debería haber esperado que el fuego regular no sería suficiente contra un enemigo con tal poder regenerativo. ¿Qué sigue, entonces? Si no decido rápidamente qué voy a hacer ahora, el trol no me dará más tiempo para reaccionar. ¿Debería ir a la ofensiva, o debería retirarme, dándoles a los demás tiempo para unirse a mí?
    choices:
      - position: 1
        text: Intentar cortarle la cabeza al trol
        effects:
          - set:
              current_scene: b2_ch05a_cut
              b2_ch5_first_cut: 0
      - position: 2
        text: Intentar actuar como señuelo, para que Leila pueda cortarle la cabeza al trol
        effects:
          - set:
              current_scene: b2_ch05a_decoy
              b2_ch5_first_cut: 0
      - position: 3
        text: Hacer una retirada táctica.
        effects:
          - set:
              current_scene: b2_ch05a_tactical
              b2_ch5_first_cut: 0
  - name: b2_ch05a_cut
    routes:
      - condition: agility >= 3 AND strength >= 2
        texts:
          - source: scene_text
            paragraph: 15
            text: |-
              Decido aprovechar la oportunidad que Leila me dio, lanzándome hacia el trol y blandiendo mi daga encantada hacia su cuello, desde la dirección donde su hombrera había sido destrozada. Velgos no tiene tiempo de reaccionar, y logro cortarle la cabeza de los hombros en un solo movimiento.

              Rápidamente agarro su cabeza cortada por el pelo, y la lanzo lejos, lo más que puedo. El cuerpo del trol salta hacia atrás, luciendo muy desorientado.

              "¡Esta es nuestra oportunidad!" le digo a Leila. "¡Golpeémoslo con todo lo que tenemos antes de que--"

              Me interrumpo, porque la cabeza del trol ahora está siendo lentamente recreada, comenzando desde el cuello de Velgos. Solo toma unos cinco segundos hasta que la cabeza se regenera completamente, aunque, a juzgar por la expresión en su cara, este debe haber sido un proceso particularmente doloroso.

              "Me voy a tomar mi tiempo matándote," dice Velgos, luciendo como si todavía estuviera intentando contener algo del dolor. "Lo haré lentamente, después de forzarte a ver morir a todos tus amigos."

              "Sí, sí," digo. "Ya lo he escuchado todo antes."
          - source: scene_text_2
            paragraph: 5
            text: |-
              "¡Cuidado!" nos grita Bruce, desde atrás.

              No mucho después de su advertencia, dos ogros muy grandes salen por la reja detrás de Velgos, e intentan golpearnos con sus mazas sobredimensionadas. Tanto Leila como yo saltamos hacia atrás, y nos unimos a nuestros compañeros de equipo, que ahora todos han llegado a nuestra ubicación.

              "Lo sabía," dice nuestro compañero mago. "Sabía que no nos lo pondrían tan fácil como pelear contra un solo trol. ¡Tenían que traer a los ogros también!"

              "Deja de quejarte," dice Bruce. "Los ogros son fáciles de vencer. Son tontos, y lentos como caracoles. Puedo enfrentarme a los dos yo solo."
        effects:
