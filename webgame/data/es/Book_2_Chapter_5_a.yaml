  - name: b2_ch05a_negotiation
    texts:
      - source: scene_text
        paragraph: 27
        text: |-
          "¿Cómo sabrías sobre nuestros miembros de tribu capturados?" dice uno de los ogros.

          "¡No lo escuches, está intentando engañarnos!" dice el segundo ogro.

          "¿De verdad?" digo. "¿Y si les dijera que también sé que uno de los cautivos es la chamán de su tribu, que resulta ser una hembra?"

          "Sabe sobre nuestra chamán," dice el primer ogro. "¡Debe estar diciendo la verdad!"

          "Aun si lo está, no vale la pena," dice el segundo ogro. "El trol nos matará a todos si intentamos ayudar a este humano de cualquier forma."

          "No si lo matamos primero," digo.

          "¡Estás loco!" dice el segundo ogro. "¡El trol es inmortal! ¡Aunque lo mates, volverá a la vida! ¡No hay forma de que podamos vencerlo!"

          "¿Entonces prefieren vivir el resto de sus vidas como sus lacayos?" digo.
      - source: scene_text_2
        paragraph: 7
        text: |-
          "Hermano," dice el primer ogro, "hemos estado a merced del trol por demasiado tiempo. ¡Nunca tendremos una mejor oportunidad que esta para vengar a nuestros guerreros caídos y rescatar a los cautivos!"

          El segundo ogro mira a su compañero de armas durante unos largos segundos, considerando sus palabras cuidadosamente.

          "¿Qué nos pedirías, si aceptáramos ayudarte?" dice el segundo ogro.

          "Solo ayúdenme a matar al trol," digo. "Después de eso, les diré dónde retienen a sus amigos, y serán libres de irse. No se preocupen, no los retienen lejos de aquí. Tendrán tiempo de sobra para liberarlos y salir de la ciudad antes de que reúnan a los guardias de la ciudad."

          "Te tomaré la palabra, humano," dice el segundo ogro, después de pensar en mi oferta unos segundos más. "Más te vale no estar mintiéndonos."

          "No se me ocurriría," digo.

          Los dos ogros intercambian una última mirada, y luego me dan la espalda, preparándose para ir a pelear contra su antiguo aliado.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch05a_prepare
