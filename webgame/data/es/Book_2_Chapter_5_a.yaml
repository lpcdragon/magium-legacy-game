              No mucho después de que matamos a Velgos, Bruce también termina su pelea con los ogros, y luego se dirige directamente hacia nosotros.

              "¿Ya terminaron con el trol?" pregunta Bruce, sorprendido, cuando llega hasta nosotros.

              "Sí, lo matamos hace siglos," digo. "¿Qué te tomó tanto tiempo?"

              "Entonces... ¿la pelea terminó, no?" dice Bruce. "¿Por qué seguimos aquí parados?"

