  - name: b2_ch05a_observe
    routes:
      - condition: perception >= 3
        texts:
          - source: scene_text
            paragraph: 48
            text: |-
              Mantengo mi posición, intentando estudiar cuidadosamente al trol, mientras pelea. Después de observar a los dos combatientes durante un rato, noto que Velgos tiende a dar un gran salto hacia atrás cada vez que siente que los ataques de Leila lo están superando. ¡Eso es definitivamente algo que puedo usar en su contra! Solo tengo que esperar la oportunidad adecuada, y entonces podré apuñalarlo por detrás justo cuando dé el salto.

              Empiezo a esperar a que Leila use una ráfaga de ataques contra su oponente, para poder lanzarme hacia él. No, espera, eso no basta. Solo salta hacia atrás si los ataques vienen del lado donde su hombrera ha sido destruida. De lo contrario, mantiene su posición. No puedo permitirme entrar en la batalla de forma descuidada. Solo tengo una oportunidad. Tengo que hacerlo bien.

              Tan pronto como Velgos parece estar siendo superado, hago un rápido sprint hacia adelante para apuñalarlo por detrás mientras está desequilibrado. Consigo calcular el momento a la perfección, y clavo mi daga en su espalda antes de que tenga la oportunidad de esquivar. La abertura que acabo de crear era todo lo que Leila necesitaba, y rápidamente balancea una de sus dagas hacia el cuello del trol, volviéndole a cortar la cabeza.
        effects:
          - set:
              successful_checks:
                - '[ Comprobación de observación exitosa - nivel 3 ]'
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch05a_troll_final
                condition: is_dead = 0
      - condition: perception < 3
        texts:
          - source: scene_text
            paragraph: 49
