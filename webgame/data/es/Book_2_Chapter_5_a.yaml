            paragraph: 65
            text: Decido llevarme ambas cimitarras, porque sería una pena dejarlas ahí. Pongo ambas armas en sus vainas, y luego engancho las dos vainas a mi cinturón.
            condition: b2_ch5_scimitar = 2
          - source: scene_text_2
            paragraph: 16
            text: |-
              "Humano," dice uno de los ogros, en su idioma. "Hemos cumplido nuestra parte del trato. Seguimos esperando que tú cumplas la tuya."

              "Oh, claro, claro, los rehenes," digo. "Los tienen encerrados aquí mismo, en el edificio principal del coliseo. Los guardias dijeron que los están reteniendo en la celda que está más cerca de los vestuarios. No deberían tener problemas para encontrarla. Solo crucen esa reja de ahí, y giren a la izquierda."

              "Espero que no nos estés mintiendo..." dice el ogro.

              "Déjalo," dice el otro ogro. "Ya cumplió su promesa. No tenemos motivos para dudar de él. Vámonos. Rápido, antes de que envíen a los guardias por nosotros."

              Los dos ogros se alejan de nosotros, y empiezan a dirigirse hacia la reja de la arena, con la intención de liberar a los miembros de su clan que están cautivos.

              "Espera, ¿qué acaba de pasar aquí?" pregunta Bruce, confundido. "¿De qué estabas hablando con ellos? ¿Y por qué los estás dejando ir?"

              "¿Y por qué no?" digo. "El objetivo de la ronda era matar al trol. Nunca dijeron nada sobre los ogros."

              "¿Pero por qué nos ayudaron?" pregunta Bruce.

              "Los estaban obligando a cooperar con el trol," digo, "porque tenía a algunos miembros de su clan como rehenes. Les dije dónde retenían a sus amigos a cambio de que nos ayudaran con el trol."
          - source: scene_3
            paragraph: 3
            text: |-
              "¿Quieres decir que acabas de dejar que se vayan para que puedan traer refuerzos?" dice Bruce, conmocionado.

              "¿Refuerzos para qué?..." digo. "Escucha, los ogros pueden ser tontos, pero no tan tontos. Te garantizo que lo primero que harán después de liberar a sus aliados será huir de la ciudad lo antes posible. Ni de broma se van a quedar esperando a que los guardias de la ciudad se reúnan. Así que quizás maten a parte del personal de la arena al salir. No es mi problema. Deberían haber pensado en los riesgos antes de traer a un montón de ogros al medio de una ciudad poblada por humanos."

              "Bien," dice Bruce. "Olvídate de los ogros. Entonces, ¿qué hacemos ahora? ¿La ronda ha terminado o qué?"

              "Estamos esperando a que vuelva el presentador..." digo. "Se supone que él es quien debe anunciar el final de la pelea."
