              Leila probablemente tendrá mejor oportunidad de cortarle la cabeza al trol que yo. Solo necesito asegurarme de que pueda acercársele sigilosamente.

              Me lanzo hacia Velgos, con mi cuchillo encantado listo, fingiendo que quiero apuñalarlo en el pecho.

              Me acerco lo suficiente a él para hacer que me ataque, pero luego retrocedo rápidamente, y me posiciono de manera que fuerza al trol a darle la espalda a Leila, para poder seguir vigilándome.

