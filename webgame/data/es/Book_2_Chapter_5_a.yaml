          "Oigan, eh, ¿chicos?..." les digo a mis compañeros de equipo que pelean contra el trol. "¡Cambié de opinión! ¡Creo que me vendría bien un poco de ayuda aquí!"

          "¡Maldición!" dice Bruce, furioso. "Sabía que esto era solo una pérdida de tiempo. No necesitamos a dos personas para lidiar con dos míseros ogros. Yo me encargaré de ellos. ¡Tú ven aquí y ayuda con el trol!"

          "¿Crees que voy a dejar que tú--" empieza a decir Velgos, pero Leila rápidamente lanza su daga hacia su cuello, lo que obliga al trol a interrumpir su discurso para defenderse de su ataque.

          Una vez que Bruce toma mi lugar y empieza a pelear contra los ogros, echo un largo vistazo hacia el trol, e intento armar un plan de ataque.
