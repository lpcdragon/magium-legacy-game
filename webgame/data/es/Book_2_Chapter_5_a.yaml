  - name: b2_ch05a_kill_ogres
    routes:
      - condition: agility >= 2
        texts:
          - source: scene_text
            paragraph: 29
            text: |-
              No tiene sentido prolongar esta batalla más. Voy a acabar con ellos lo más rápido posible, para poder reunirme con Leila y los demás.

              A juzgar por el tamaño de sus mazas, ninguna cantidad de reflejos va a salvarme si enfrento a estos monstruos de cerca, debido a la enorme área que pueden cubrir con un solo golpe. O necesito ser lo suficientemente rápido como para entrar y salir de su alcance, o lo suficientemente fuerte como para poder matarlos antes de que ellos acaben conmigo.

              Corro hacia el ogro de mi derecha, incitándolo a intentar aplastarme con su maza, y una vez que lanza el golpe, duplico mi velocidad y lo rodeo, apuñalándolo múltiples veces en la espalda. El otro ogro intenta ayudar a su compañero, pero evita golpear demasiado fuerte, para no darle a su amigo por accidente. Los movimientos ya de por sí lentos del monstruo se ralentizan aún más por contenerse, lo que me deja tiempo de sobra para hacer un rápido sprint hacia él y apuñalarlo en el corazón. Tan pronto como el segundo ogro muere, vuelvo al primero, que ahora está tirado en el suelo, y le corto el cuello, rematándolo.
        effects:
          - set:
              successful_checks:
                - '[ Comprobación de velocidad exitosa - nivel 2 ]'
