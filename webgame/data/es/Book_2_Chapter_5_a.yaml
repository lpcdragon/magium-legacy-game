              "¿Qué crees que estás haciendo?" dice. "¡La ronda aún no ha comenzado! ¡Vuelve a tu propia área de división ahora mismo! ¿Me escuchas? ¡Vuelve! ¡Oye, me estás escuchando?"

              Ignoro al presentador, y miro directamente al trol, mientras camino casualmente hacia él. Cuando me ve, Velgos deja de saludar a las multitudes, y empieza a sonreírme maliciosamente.

              "¿Viniste aquí a suplicar por tu vida, humano?" me grita el trol. "¡No te servirá de nada! ¡Tu destino ya está sellado!"

              No digo nada y sigo caminando hacia adelante.

              "¡Maldición!" dice el presentador. "Abran las rejas. ¡Ábranlas ahora!"
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch05a_flammable
      - condition: b2_ch4_beer = 1 AND b2_ch2_creatures = 0
        texts:
          - source: scene_text
            paragraph: 13
            text: |-
              "Para nada," dice Hadrik. "Sí dije que te debía una cerveza, después de todo. Bueno, la ale enana no es realmente nada parecido a la cerveza, ¡pero ya te haces la idea! Toma la botella que quieras. ¡Tengo de sobra!"

              "¡Perfecto!" le digo, mientras tomo una de las botellas de ale enana del suelo.

              Luego me dirijo hacia el área de combate, a través del agujero en la pared donde solía estar la reja de hierro antes de que Hadrik la arrancara de sus bisagras.

              "¡Nos vemos!" le digo, mientras lo saludo y salgo de su área de división.

              "Eh, nos vemos, supongo..." dice Hadrik, luciendo un poco confundido.
