  - name: b2_ch05a_help
    texts:
      - source: scene_text
        paragraph: 6
        text: |-
          "Déjalo pelear con nosotros. Necesitaremos toda la ayuda posible contra ese trol."

          "Si te preocupa que te apuñale por la espalda," dice Wilhelm, "entonces me aseguraré de estar siempre en tu línea de visión durante la batalla, para que puedas vigilarme sin mucho esfuerzo. ¿Sería eso suficiente para calmar tus preocupaciones?"

          "Supongo..." dice Bruce. "Mientras pueda ver fácilmente dónde estás en todo momento, no eres gran amenaza."

          "Muy bien," dice Wilhelm. "Pelear en la primera línea no es exactamente ideal para mí, pero prefiero hacer esto a verme forzado a pelear solo. Solo espero que no se aprovechen de esta situación para usarme como señuelo."

          ¡Maldición! Ahora perdí el hilo de mis pensamientos. ¿En qué estaba pensando, antes de que me interrumpieran? Estoy seguro de que tenía algo que ver con el trol.

