              "¿Ya terminaron con el trol?" pregunta Bruce, sorprendido, cuando llega hasta nosotros.

              "Sí, lo matamos hace siglos," digo. "¿Qué te tomó tanto tiempo?"

              "Espera, ¿cómo murió el mago?" pregunta Bruce, después de notar el cadáver del mago en el suelo.

              "Lo atraparon usando magia," digo. "Hasta sonaron alarmas y todo. ¿Cómo te las arreglaste para no darte cuenta?"

