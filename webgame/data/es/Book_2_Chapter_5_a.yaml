              El trol ahora intenta desesperadamente jadear por aire, mientras nos mira a Leila y a mí con puro odio en los ojos. Intenta hablar, pero ya no le queda aire en los pulmones. Solo consigue emitir unos sonidos guturales ininteligibles, mientras da unos pasos hacia adelante y estira uno de sus brazos hacia nosotros, en un intento inútil de alcanzarnos. Una vez que se queda completamente sin aliento, cae de rodillas, y empieza a arañarse la garganta con las manos, como si estuviera intentando crear un nuevo conducto para que el aire llegue a sus pulmones. Finalmente, deja de moverse por completo, y cae de bruces al suelo, sin vida.

              "Bueno, eso fue anticlimático..." digo.
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch05a_troll_dead
  - name: b2_ch05a_contrary_without
    texts:
      - source: scene_text
        paragraph: 47
        text: |-
          Mientras me quedo ahí parado, pensando, Leila consigue encontrar una abertura en las defensas del trol, y le corta la cabeza de un solo movimiento. Luego aplasta la cabeza de Velgos bajo su sandalia, pero la cabeza no se regenera en el suelo. En cambio, el trol vuelve a regenerar su cabeza desde el cuello, aunque esta vez parece estar tomando más tiempo crearla completamente, y parece que está teniendo un poco de dificultad recreando exactamente los mismos rasgos faciales que tenía antes.

          Tan pronto como su cabeza vuelve a crecer, Leila empieza a presionar al trol otra vez, asegurándose de que su atención esté puesta en ella todo el tiempo.

          "Santo cielo," dice el mago, exasperado, mientras observa a Leila pelear. "¡Deja de apuntar a la cabeza! ¿No ves que no te está sirviendo de nada?"

          "¡Al contrario!" le digo. "Creo que cortarle la cabeza es exactamente lo que deberíamos estar haciendo. Pudiste ver claramente que al trol le costó regenerar su cabeza cuando se la cortaron la segunda vez. Incluso con la alucinante capacidad regenerativa del trol, tiene que haber algún tipo de límite a cuántas veces puede regenerar su cabeza en un período de tiempo tan corto. ¡Mi suposición es que una o dos decapitaciones más deberían bastar!"

          Echo otro vistazo rápido al campo de batalla, y parece que Velgos y Leila están atrapados ahora mismo en una especie de punto muerto. Ninguno de los dos parece capaz de imponerse, así que siguen esquivando los ataques del otro, con la esperanza de que eventualmente su enemigo baje la guardia.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch05a_observe
            condition: b2_ch5_strategy = 1
          - set:
              current_scene: b2_ch05a_effortlessly
            condition: b2_ch5_strategy = 3
          - set:
              current_scene: b2_ch05a_mage
            condition: b2_ch5_strategy = 2
  - name: b2_ch05a_easily_without
    texts:
      - source: scene_text
        paragraph: 54
        text: |-
          Mientras me quedo ahí parado, pensando, Leila consigue encontrar una abertura en las defensas del trol, y le corta la cabeza de un solo movimiento. Luego aplasta la cabeza de Velgos bajo su sandalia, pero la cabeza no se regenera en el suelo. En cambio, una nueva cabeza se forma desde el cuello del trol, tomándole solo unos cinco segundos regenerarla completamente a su forma original. Sin embargo, a juzgar por la expresión que ahora tiene en la cara, supongo que este debe haber sido un proceso particularmente doloroso.

          Tan pronto como su cabeza vuelve a crecer, Leila empieza a presionar al trol otra vez, asegurándose de que su atención esté puesta en ella todo el tiempo.

          "¿Por qué sigue atacando la cabeza?" me pregunta el mago. "¿No ve que no está funcionando?"

          "Yo no estaría tan seguro de eso," le digo. "Podías notar fácilmente que antes estaba sintiendo mucho dolor, cuando regeneraba su cabeza desde el cuello. Algo me dice que este truco del trol de regenerar cabezas no es algo que pueda hacer indefinidamente. Además, no es como si tuviéramos mejores ideas a estas alturas. ¡Yo digo que sigamos obligándolo a regenerar su cabeza y veamos qué pasa!"
      - source: scene_text_2
        paragraph: 10
        text: |-
          Echo otro vistazo rápido al campo de batalla, y parece que las cosas no van muy bien para Velgos en este momento. Wilhelm está haciendo un muy buen trabajo colocándose constantemente detrás de él sin ser detectado, así que el trol no puede bajar la guardia ni por un solo segundo. Es más, Velgos tampoco puede permitirse dirigir sus ataques contra el asesino, porque si aparta los ojos de Leila por un solo segundo, ella le cortará la cabeza otra vez en un abrir y cerrar de ojos.

          Solo hace falta un paso en falso del trol para que Leila aproveche la oportunidad una vez más y le corte la cabeza de los hombros. Mientras vuelve a aplastarla, el trol regenera su cabeza desde el cuello, pero esta vez parece estar tomando más tiempo crearla completamente, y parece que está teniendo un poco de dificultad recreando exactamente los mismos rasgos faciales que tenía antes. Leila no le deja tiempo para recuperarse del todo, y vuelve a atacarlo, intentando agarrarlo desprevenido una vez más. Sin embargo, Wilhelm parece haberse herido de algún modo en ese último intercambio, así que en este momento se está retirando para atender sus heridas.
    choices:
