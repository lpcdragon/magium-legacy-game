    routes:
      - condition: ancient_languages = 0
        texts:
          - source: scene_text
            paragraph: 25
            text: |-
              "En realidad, preferiría ser yo quien se enfrente a ellos, si no te importa," le digo a Bruce. "No estoy completamente seguro, pero creo que podría ponerlos de nuestro lado, si tengo una pequeña charla con ellos."

              "Eso suena como una idea estúpida," dice Bruce, "pero quién soy yo para juzgar. Puedes quedarte con los ogros, si quieres. El trol es suficiente para mí."

              Los ogros no nos dan la oportunidad de continuar nuestra conversación, y empiezan a correr hacia nosotros, rugiendo a pleno pulmón, mientras balancean sus mazas.

              Como acordamos, los demás se hacen a un lado y empiezan a dirigirse hacia el trol, dejándome pelear contra los ogros completamente solo.

              "¡Eh, ustedes!" les digo a los ogros. "¡Tenemos que hablar!"

              Los dos ogros me ignoran, e intentan golpearme con sus mazas. Por suerte, aunque su fuerza es formidable, esquivar sus ataques torpes es un juego de niños, en un entorno abierto como este.

              "¡Es sobre los miembros de su tribu capturados!" les digo.

              Siguen sin reaccionar. ¿Será porque no entienden Común?

              Les hablaría en su propio idioma si pudiera, pero ni siquiera conozco las palabras básicas de su vocabulario. Esperaba poder llegar a un acuerdo con ellos, pero si ni siquiera pueden entender lo que digo, estoy perdiendo el tiempo.
