scenes:
  - name: b2_ch05a_intro
    effects:
      - set:
          successful_checks:
            - 'Punto de control alcanzado: Partida guardada.'
        condition: checkpoint_rich = 1
    routes:
      - texts:
          - source: scene_text
            paragraph: 2
            text: "\"Stillwater!\" Bruce shouts. \"Hey, stillwater, are you listening?\"\r\n\r\nI suddenly realize that I've been so lost in my own thoughts for the past minute, that I've been completely neglecting my surroundings. Wilhelm seems to have already returned to our room while I was spacing out, and judging by Bruce's tone of voice, I can only assume that he asked me a question, but I cannot for the life of me remember what it was.\r\n\r\n\"Sorry, I wasn't paying attention,\" I tell him. \"Could you repeat that?\"\r\n\r\n\"I was talking about Wilhelm,\" Bruce says. \"We can't let him roam free throughout the arena after what he did last round. Who knows who he'll try to kill next? I say we tie him up, and leave him here. It's safer that way.\""
        choices:
          - position: 1
            text: Wilhelm no es una amenaza. Déjalo hacer lo que quiera. No hará ninguna diferencia.
            effects:
              - set:
                  current_scene: b2_ch05a_threat
                  checkpoint_rich: 0
                  b2_ch5_wilhelm: 0
          - position: 2
            text: No tenemos cuerda. Podríamos simplemente decirle que mantenga su distancia de nosotros.
            effects:
              - set:
                  current_scene: b2_ch05a_rope
                  checkpoint_rich: 0
                  b2_ch5_wilhelm: 0
          - position: 3
            text: Déjalo pelear con nosotros. Necesitaremos toda la ayuda posible contra ese trol.
            effects:
              - set:
                  current_scene: b2_ch05a_help
                  checkpoint_rich: 0
                  b2_ch5_wilhelm: 1
      - condition: b2_ch2_deal = 3
        texts:
          - source: scene_text
            paragraph: 3
            text: |-
              "¡Stillwater!" grita Bruce. "¡Eh, stillwater, ¿me estás escuchando?"

              De repente me doy cuenta de que he estado tan perdido en mis propios pensamientos durante el último minuto, que he estado completamente ignorando mis alrededores. Wilhelm parece haber regresado ya a nuestra sala mientras yo estaba en las nubes, y a juzgar por el tono de voz de Bruce, solo puedo asumir que me hizo una pregunta, pero no puedo por nada del mundo recordar cuál fue.

              "Perdón, no estaba prestando atención," le digo. "¿Podrías repetir eso?"

              "Estaba hablando de Wilhelm," dice Bruce. "Viste esa daga de empuñadura naranja que estaba usando la ronda pasada. No hay duda de que es un asesino a estas alturas. Es demasiado peligroso dejarlo andar libre por la arena. ¿Quién sabe cuándo intentará matar a uno de nosotros? Yo digo que lo atemos y lo dejemos aquí. Es más seguro así."
