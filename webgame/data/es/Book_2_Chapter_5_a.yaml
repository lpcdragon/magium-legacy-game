              "¡No creas que te vas a salir con la tuya tan fácilmente, hijo de puta!" me dice el mago.

              "¿Salir con la mía con qué?" digo.

              "¡Con usarme de señuelo!" grita el mago.

              "Oh, claro, ¡eso!" digo. "Vale, esto es lo que haremos. En la próxima ronda, tú podrás usarme de señuelo a mí, y estaremos a mano. ¿De acuerdo?"

              "¡La próxima ronda es de peleas individuales!" dice el mago.

              "¿Ah, sí?" digo, con tono desinteresado. "Bien, entonces la ronda después de la próxima."

              "¡No hay ronda después de la próxima!" grita el mago. "¡Solo es una pelea opcional!"

