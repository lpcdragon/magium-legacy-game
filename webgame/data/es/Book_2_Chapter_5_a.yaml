  - name: b2_ch05a_smoothly
    texts:
      - source: scene_text
        paragraph: 66
        text: |-
          Después de un poco más de tiempo, el presentador finalmente regresa a su plataforma, luciendo ligeramente molesto.

          "Perdón por la demora, damas y caballeros," dice el presentador. "Después de una discusión con el dueño de la arena, el señor Venard, hemos llegado a la conclusión de que la segunda ronda no puede continuar después de la muerte de Velgos, el mercenario. En otras palabras, el final de esta pelea también marca el final de la ronda. La tercera y última ronda comenzará en breve, en cuanto el equipo organizador termine con los preparativos. Pedimos disculpas por las molestias."

          Luego se vuelve hacia nosotros.

          "Todos los gladiadores tendrán que esperar en sus áreas de división hasta el comienzo de la próxima ronda," dice. "¡Ya no se les permitirá deambular por los pasillos! Sus salas quedarán cerradas hasta el final de la tercera ronda. Esta vez no habrá más... incidentes."

          Estoy bastante seguro de que me estaba mirando directamente a mí cuando dijo esas últimas palabras. Debe seguir molesto porque la última vez entré al área de combate antes del comienzo de la ronda. En fin, al menos ya no necesito más información de mi cuaderno. No poder salir de mi área de división no debería afectarme demasiado.

          En cuanto volvemos a nuestra sala, oímos a una persona gritando fuerte desde el pasillo al otro lado de nuestra puerta. Es la voz del embajador de Ollendor.

          "¿Qué quieres decir con que todo va sobre ruedas?" grita el embajador. "¿Te estás burlando de mí?"
      - source: scene_text_2
        paragraph: 21
        text: |-
          "En absoluto, embajador," dice Venard, el dueño de la arena. "Que yo sepa, no ha habido problemas con ninguna parte del evento de nuestra arena."

          "¿No ha habido problemas?" dice el embajador. "¡Los responsables de la muerte del conde de Ollendor siguen todos vivos, y tú me estás diciendo que no ha habido problemas!"

          "Le aseguro," dice Venard, "que no se les ha dado ninguna ventaja a nuestros invitados por encima de los otros gladiadores de la arena durante estas peleas. Muy al contrario, de hecho. Por supuesto, si tiene alguna duda, es libre de hablar con el equipo organizador para disponer los próximos duelos como usted quiera. Después de todo, siempre ha sido usted quien ha tenido la última palabra con respecto a la organización de estos eventos."

          "¡He sido un necio por dejar las cosas en tus manos hasta ahora!" dice el embajador, furioso. "¡Si eres demasiado incompetente para hacer bien el trabajo, entonces tendré que hacerlo yo mismo!"

          Luego oímos al embajador alejarse hecho una furia por el pasillo, presumiblemente hacia la sala donde el equipo organizador estaba haciendo los preparativos para la siguiente ronda.

          "¡Adiós, embajador!" dice Venard con calma, y luego también lo oímos marcharse.

          "Parece que cierta persona realmente te tiene entre ceja y ceja," escribe Leila, mientras me mira.

          "¿A quién le importa?" digo. "No es que puedan hacer nada ya aunque lo intenten."
    choices:
      - position: 1
        text: Continuar
        effects:
