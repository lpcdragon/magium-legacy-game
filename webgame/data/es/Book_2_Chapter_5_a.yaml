  - name: b2_ch05a_mage_without
    texts:
      - source: scene_text
        paragraph: 57
        text: |-
          "Así que, en fin," le digo al mago, "tengo un plan sobre cómo atacar al trol, pero voy a necesitar tu ayuda con algo."

          "¿Qué quieres decir?" dice el mago.

          "He notado que Velgos realmente no puede seguirle el ritmo a los ataques de Leila," digo, "y no deja de moverse para compensar su falta de habilidad a la hora de desviar sus golpes rápidos. Si nosotros dos nos acercamos desde atrás y lo atacamos por izquierda y derecha al mismo tiempo, no tendrá ningún lugar al que retirarse, y Leila podrá cortarle la cabeza fácilmente. Mejor aún, ni siquiera correríamos ningún riesgo, ¡ya que perdería la cabeza antes de que siquiera tenga la oportunidad de devolvernos el golpe!"

          "Yo... supongo que podría ayudar," dice el mago. "Si no tiene riesgos..."

          "Perfecto," digo, sin darle más tiempo para pensarlo. "¡Entonces vamos!"

          Entonces me lanzo hacia el trol, y el mago se ve obligado a seguirme poco después, para poder alcanzarme. Sabía que saltaría a la oportunidad de unirse a la pelea en cuanto le ofreciera un plan sin riesgos. Ha estado actuando con extrema cautela desde que comenzó la primera ronda, pero está claro que no quiere que lo vean como un cobarde. Por supuesto que estaría más que feliz de poder demostrar su valía sin poner en peligro su vida de ninguna manera. Y mi plan ciertamente suena lo bastante seguro... al menos de la forma en que se lo presenté.
      - source: scene_text_2
        paragraph: 12
        text: |-
          La verdad del asunto es que omití un pequeño detalle cuando le di el resumen. Aunque el trol definitivamente no tendrá oportunidad de dañarnos antes de que le corten la cabeza, dependiendo de cuánto le afecte esta próxima decapitación, podría perfectamente quedarle suficiente energía como para atacarnos, incluso sin tener la cabeza sobre los hombros. Esa es exactamente la razón por la que no voy a apuñalar al trol en absoluto, y voy a dejar que el mago haga todo el trabajo. En cuanto a la seguridad del propio mago... estoy seguro de que encontrará la forma de arreglárselas. Probablemente.

          Ambos conseguimos colocarnos detrás del trol, mientras Leila lo mantiene ocupado, y cuando estamos a distancia de ataque, le hago una seña con la cabeza al mago, y los dos nos lanzamos hacia nuestro enemigo desde lados opuestos. Justo cuando llego a Velgos, salto hacia atrás sin atacarlo de ninguna manera, y dejo que el mago lo apuñale él solo. El mago parece conmocionado por mi traición, pero no tiene mucho tiempo para reaccionar, porque una de las cimitarras del trol ya casi ha alcanzado su cuello.

          Leila aprovecha inmediatamente la distracción, y le corta la cabeza al trol en un abrir y cerrar de ojos. Sin embargo, esto no hace que Velgos detenga su ataque, y sus cimitarras casi llegan al cuello del mago. En el último instante antes de ser alcanzado, el mago salta hacia atrás con velocidad sobrehumana, evitando el golpe mortal por apenas unos centímetros.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch05a_mage_helped
            condition: b2_ch2_cell != 1
          - set:
              current_scene: b2_ch05a_mage_cell1
            condition: b2_ch2_cell = 1
  - name: b2_ch05a_mage_cell1
    texts:
      - source: scene_text
        paragraph: 59
        text: |-
          Esa velocidad de hace un momento era casi comparable a la de Leila, y ella está usando un dispositivo de estadísticas. ¿Podría el mago estar usando también algo parecido?

          Mientras el mago se alejaba, Leila aplastó la cabeza del trol bajo su pie, igual que la última vez, y el trol empezó a regenerar otra vez su cabeza desde el cuello, pero esta vez parecía estar tomando más tiempo crearla completamente, luciendo como si estuviera teniendo un poco de dificultad recreando exactamente los mismos rasgos faciales que tenía antes.

          Antes de que los dos empiecen a pelear otra vez, un ruido muy fuerte y agudo empieza a resonar por toda la arena, y algo dentro del bolsillo derecho del mago empieza a brillar con una intensa luz roja. El mago entra en pánico, e intenta ocultar la luz poniendo la mano sobre el bolsillo, pero el daño ya está hecho.

          "Disculpen el ruido, damas y caballeros," dice el presentador. "Ese es el sonido de nuestros detectores de magia activándose. ¿Podría la persona con la luz roja en el bolsillo quedarse quieta, por favor? Nuestros guardias irán a recogerla en breve."

          Varios guardias de la arena se están dirigiendo ahora al área de combate, con sus espadas preparadas.

          "¡No hay necesidad de que ninguno de los otros gladiadores se alarme!" dice el presentador. "¡Simplemente ignoren a los guardias y continúen sus peleas de forma ordenada!"
      - source: scene_text_2
        paragraph: 13
        text: |-
          Leila y el trol están quietos, mirando fijamente al mago, mientras al mismo tiempo se vigilan el uno al otro por el rabillo del ojo, para asegurarse de que ninguno intente un ataque sorpresa contra el otro durante esta distracción. Mientras tanto, Bruce y los ogros no parecen estar prestando ninguna atención a lo que sucede a su alrededor, y continúan su pelea sin interrupción.

          "No..." dice el mago, con voz asustada, mientras ve a los guardias acercarse.

          Una vez que los guardias lo rodean, uno de ellos intenta agarrar al mago del brazo.

          "Vienes con nosotros," dice el guardia. "Vamos, en marcha."

          "¡No!" grita el mago, apartando su brazo del guardia. "¡Aléjate de mí!"

          "No sirve de nada resistirse, gladiador," dice el guardia, mientras se le acerca e intenta agarrarlo otra vez. "Tu vida se acabó, y lo sabes. Ahora puedes venir con nosotros pacíficamente, o lo haremos por las malas."

          "¡He dicho que te alejes!" grita el mago, más fuerte, y un chorro de llamas brota de sus manos, envolviendo al guardia y quemándolo hasta dejarlo crujiente.

          Todos los demás guardias se mueven rápidamente para inmovilizar al mago, pero él levanta ambos brazos en el aire, arrasándolos a todos con una poderosa ola de fuego que no deja nada más que cenizas a su paso.
      - source: scene_3
        paragraph: 2
        text: |-
          "¡Guardias!" grita el presentador, empezando a entrar un poco en pánico. "¡Abandonen sus puestos y vengan al área de combate inmediatamente. Tenemos a un elementalista de fuego descontrolado causando estragos! ¡Repito! ¡Un elementalista de fuego descontrolado causando estragos!"

          El mago mira a su alrededor, con una expresión vacía en los ojos, como si poco a poco empezara a perder el rumbo. Luego, cuando sus ojos se cruzan con los míos, la expresión de su rostro cambia, y de repente recupera la concentración, mientras sus ojos se llenan de rabia.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch05a_mage_rampage
  - name: b2_ch05a_troll_dead
    texts:
      - source: scene_text
        paragraph: 62
        text: |-
          "¡Eh, Velgos!" dice el presentador. "¿Qué estás haciendo? ¡Deja de perder el tiempo y pelea en serio! ¿Para qué crees que te estamos pagando?"

          Los espectadores parecen no saber muy bien cómo reaccionar. Velgos parecía ser algo así como uno de los favoritos del público, así que verlo morir frente a sus ojos debe de estar provocándoles sentimientos encontrados sobre todo este asunto. No pueden echarnos la culpa por haberlo matado, pero tampoco parecen demasiado dispuestos a vitorearnos. Lo que recibimos en su lugar son unos momentos de incómodo silencio, mientras el presentador todavía está luchando por aceptar la realidad.

          "Velgos..." dice el presentador, esta vez con una voz suplicante. "¡No me hagas esto! ¡Vamos, incluso aposté un buen dinero por ti! ¡No puedes simplemente morirte así! ¿Qué pasa con el resto de la segunda ronda? ¿Quién va a pelear contra las otras divisiones? ¡Velgos, levántate, maldita sea!"

          Una vez que el presentador termina su arrebato, escuchamos a Venard, el dueño de la arena, carraspear desde algún lugar detrás del presentador.

          "Eh, por favor discúlpenme," dice el presentador a los espectadores. "Volveré enseguida..."
      - source: scene_text_2
        paragraph: 15
        text: |-
          Luego se dirige hacia el dueño de la arena, bajando de su plataforma elevada y entrando en uno de los niveles superiores del edificio principal que rodea el área de combate.

          Mientras el presentador hablaba, apenas le prestaba atención, porque estaba concentrado en otra cosa por completo. Después de estudiar durante un rato las cimitarras que habían caído de las manos del trol, llegué a la conclusión de que ambas estaban en sorprendentemente buen estado. También estoy bastante seguro de que al menos ambas tienen encantamientos de filo y durabilidad, así que deberían ser bastante comparables a mi daga, en términos de utilidad.

          Nunca me ha gustado realmente blandir dos armas al mismo tiempo cuando peleo, pero quizás podría llevarme una de estas conmigo, ¿para usarla cuando necesite un arma con mayor alcance? ¿O tal vez debería llevarme también la otra y venderla en una tienda? No estoy exactamente seguro de cuánto valdría, pero si lograra que Daren identificara todos los encantamientos lanzados sobre ella, estoy seguro de que podría negociar un precio razonable en las tiendas locales de armas.
