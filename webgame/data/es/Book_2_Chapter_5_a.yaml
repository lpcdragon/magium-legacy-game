          - source: scene_text
            paragraph: 64
            text: Siempre es bueno tener un arma extra. Recojo una de las cimitarras del suelo, la meto en su vaina, y luego engancho la vaina a mi cinturón.
            condition: b2_ch5_scimitar = 1
