  - name: b2_ch05a_climactic_ogres
    routes:
      - condition: b2_ch5_strategy = 1 AND b2_ch5_first_cut = 0
        texts:
          - source: scene_text
            paragraph: 43
            text: |-
              Mantengo mi posición, intentando estudiar cuidadosamente al trol, mientras pelea. Sin embargo, no logro hacerlo por mucho tiempo, porque Leila pronto consigue encontrar otra abertura en las defensas del trol, y vuelve a cortarle la cabeza.

              Después de que su cabeza es aplastada una vez más, el trol empieza a regenerar una nueva desde el cuello, pero esta vez algo claramente no está bien. La forma grotesca que está emergiendo de su cuello ya no puede llamarse ni remotamente una cabeza. Al rostro le falta la mitad de la piel, los ojos se le están saliendo de las órbitas, y su forma no se parece en nada a la de antes. Más importante aún, parecería que su cabeza no se ha regenerado lo bastante bien como para permitirle respirar.

              El trol ahora intenta desesperadamente jadear por aire, mientras nos mira a Leila y a mí con puro odio en los ojos. Intenta hablar, pero ya no le queda aire en los pulmones. Solo consigue emitir unos sonidos guturales ininteligibles, mientras da unos pasos hacia adelante y estira uno de sus brazos hacia nosotros, en un intento inútil de alcanzarnos. Una vez que se queda completamente sin aliento, cae de rodillas, y empieza a arañarse la garganta con las manos, como si estuviera intentando crear un nuevo conducto para que el aire llegue a sus pulmones. Finalmente, deja de moverse por completo, y cae de bruces al suelo, sin vida.

              "Bueno, eso fue anticlimático..." digo.
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch05a_troll_dead
