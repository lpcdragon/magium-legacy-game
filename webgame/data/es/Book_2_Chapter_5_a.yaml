  - name: b2_ch05a_threat
    texts:
      - source: scene_text
        paragraph: 4
        text: |-
          "Wilhelm no es una amenaza. Déjalo hacer lo que quiera. No hará ninguna diferencia."

          "Sí," dice Bruce, "pero preferiría no tener que cuidarme las espaldas de mis propios compañeros mientras estoy ocupado peleando. Ya fue bastante difícil hacerlo en la primera ronda."

          "No tenemos cuerda para atarlo," dice el mago. "Además, no debería haber razón para inmovilizarlo. Mientras acepte mantener su distancia de nosotros de ahora en adelante, deberíamos estar bien."

          "Si no quieren mi ayuda durante la batalla," dice Wilhelm, "entonces no necesitan decirlo dos veces. No se preocupen, les aseguro que me mantendré lo más lejos posible de ustedes de ahora en adelante."

          ¡Maldición! Ahora perdí el hilo de mis pensamientos. ¿En qué estaba pensando, antes de que me interrumpieran? Estoy seguro de que tenía algo que ver con el trol.

          Al echar otro vistazo hacia el área de combate y ver al trol todavía saludando a las multitudes, mis pensamientos anteriores de repente vuelven a mí.

          "Oye, Leila," digo. "¿Es cosa mía o el trol lleva una armadura diferente esta vez?"

          "Sí," escribe Leila. "Sigue siendo armadura anti-magia, pero ahora también tiene hombreras. Probablemente cambió de armadura para hacernos más difícil cortarle la cabeza otra vez."

          "Corrígeme si me equivoco," digo, "¿pero no es este modelo específico de armadura que lleva vulnerable al fuego regular?"
      - source: scene_text_2
        paragraph: 2
        text: |-
          "La armadura que lleva no lo protege contra fuego regular en absoluto," escribe Leila. "Solo contra fuego mágico."

          "Es lo que pensaba," digo, y luego me dirijo hacia la puerta que da a los pasillos fuera de nuestra sala.

          Mientras me preparo para abrir la puerta, me vuelvo hacia Leila, para darle un último mensaje antes de irme.

          "Leila, ¿podrías hacerme un favor?" le digo. "Necesito que tomes una de las antorchas que iluminan los pasillos y que la traigas contigo a la arena cuando comience la ronda. Asegúrate de que no dejes que el trol la vea, cuando te acerques a él. Cuando ambos estemos en el área de combate, te haré una señal, y entonces puedes lanzarle la antorcha. ¿Entendido?"

          "Sí, pero ¿a dónde vas?" escribe Leila. "¿Qué planeas hacer?"

          "Lo descubrirás pronto," digo, y luego salgo por la puerta.

          Me aseguro de que los guardias no estén a la vista, y empiezo a dirigirme directamente hacia el área de división de Hadrik. Si no me falla la memoria, su sala debería estar muy cerca de la nuestra.
    choices:
      - position: 1
        text: Continuar
        effects:
