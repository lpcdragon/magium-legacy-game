  - name: b2_ch05a_mage
    texts:
      - source: scene_text
        paragraph: 52
        text: |-
          "Así que, en fin," le digo al mago, "tengo un plan sobre cómo atacar al trol, pero voy a necesitar tu ayuda con algo."

          "¿Qué quieres decir?" dice el mago.

          "He notado que Velgos realmente no puede seguirle el ritmo a los ataques de Leila," digo, "y no deja de moverse para compensar su falta de habilidad a la hora de desviar sus golpes rápidos. Si nosotros dos nos acercamos desde atrás y lo atacamos por izquierda y derecha al mismo tiempo, no tendrá ningún lugar al que retirarse, y Leila podrá cortarle la cabeza fácilmente. Mejor aún, ni siquiera correríamos ningún riesgo, ¡ya que perdería la cabeza antes de que siquiera tenga la oportunidad de devolvernos el golpe!"

          "Yo... supongo que podría ayudar," dice el mago. "Si no tiene riesgos..."

          "Perfecto," digo, sin darle más tiempo para pensarlo. "¡Entonces vamos!"

          Entonces me lanzo hacia el trol, y el mago se ve obligado a seguirme poco después, para poder alcanzarme. Sabía que saltaría a la oportunidad de unirse a la pelea en cuanto le ofreciera un plan sin riesgos. Ha estado actuando con extrema cautela desde que comenzó la primera ronda, pero está claro que no quiere que lo vean como un cobarde. Por supuesto que estaría más que feliz de poder demostrar su valía sin poner en peligro su vida de ninguna manera. Y mi plan ciertamente suena lo bastante seguro... al menos de la forma en que se lo presenté.
      - source: scene_text_2
        paragraph: 9
        text: |-
          La verdad del asunto es que omití un pequeño detalle cuando le di el resumen. Aunque el trol definitivamente no tendrá oportunidad de dañarnos antes de que le corten la cabeza, dependiendo de cuánto le afecte esta próxima decapitación, podría perfectamente quedarle suficiente energía como para atacarnos, incluso sin tener la cabeza sobre los hombros. Esa es exactamente la razón por la que no voy a apuñalar al trol en absoluto, y voy a dejar que el mago haga todo el trabajo. En cuanto a la seguridad del propio mago... estoy seguro de que encontrará la forma de arreglárselas. Probablemente.

          Ambos conseguimos colocarnos detrás del trol, mientras Leila lo mantiene ocupado, y cuando estamos a distancia de ataque, le hago una seña con la cabeza al mago, y los dos nos lanzamos hacia nuestro enemigo desde lados opuestos. Justo cuando llego a Velgos, salto hacia atrás sin atacarlo de ninguna manera, y dejo que el mago lo apuñale él solo. El mago parece conmocionado por mi traición, pero no tiene mucho tiempo para reaccionar, porque una de las cimitarras del trol ya va de camino hacia él. Leila aprovecha inmediatamente la distracción, y le corta la cabeza al trol en un abrir y cerrar de ojos. Esto hace que Velgos detenga su ataque a medio movimiento, lo que le da al mago tiempo para sacar su daga del cuerpo del trol y saltar hacia atrás tan lejos como puede. Igual que la vez anterior, Leila arroja la cabeza al suelo, y la aplasta bajo su sandalia.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch05a_troll_final
  - name: b2_ch05a_mage_helped
    texts:
      - source: scene_text
        paragraph: 58
        text: |-
          A juzgar por la velocidad de ese salto, solo puedo asumir que por fin ha decidido activar su propia versión del dispositivo de estadísticas. No veo de qué otra forma podría haberse escapado tan rápido.

          Mientras el mago se alejaba, Leila aplastó la cabeza del trol bajo su pie, igual que la última vez, y el trol empezó a regenerar otra vez su cabeza desde el cuello, pero esta vez parecía estar tomando más tiempo crearla completamente, luciendo como si estuviera teniendo un poco de dificultad recreando exactamente los mismos rasgos faciales que tenía antes.

          "¡Me engañaste!" me grita el mago. "¡No puedo creerlo! ¿Este era tu plan desde el principio? ¿Hacerme quedar como un idiota y usarme de señuelo?"

          "Oye," digo, "¿estás seguro de que de verdad este es el momento para discutir? Ese dispositivo tuyo no va a durar para siempre, ¿verdad? ¿No deberías aprovecharlo al máximo mientras todavía tienes la oportunidad?"

          El mago rechina los dientes, pero no encuentra ninguna buena respuesta para devolverme a gritos. En su lugar, prepara su daga, y se dispone a volver a entrar en acción.

          "¡Maldición!" dice, mientras se une de nuevo a Leila para pelear contra el trol.

          Con ambos flanqueando ahora a Velgos, no pasa mucho tiempo hasta que Leila consigue volver a agarrarlo desprevenido, y le corta la cabeza por tercera vez, aplastándola bajo su pie poco después.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch05a_troll_final
  - name: b2_ch05a_mage_rampage
    routes:
      - condition: agility >= 2
        texts:
          - source: scene_text
            paragraph: 60
            text: |-
              "¡Tú!" me grita el mago. "¡Todo esto es culpa tuya! ¡Hijo de puta traicionero, voy a matarte!"

              "¡Espera, espera, un momento!" le digo, pero el mago ya no está escuchando.

              Extiende los brazos hacia mí, y un chorro de llamas sale de sus manos, abriéndose paso hacia mí a gran velocidad.

              Consigo saltar fuera de su trayectoria a tiempo, pero en cuanto aterrizo en el suelo, veo una columna de fuego empezando a formarse bajo mis pies. Salgo corriendo del camino justo antes de que las llamas llenen el área, pero el mago no me da ni un momento de respiro, y sigue apuntando columnas debajo de mí justo cuando mis pies tocan el suelo.

              "Mierda, mierda, mierda," digo, mientras sigo saltando entre las columnas de fuego, pareciendo como si estuviera realizando una elaborada danza tribal.

              ¿Cómo salgo de esta? ¿Lo ataco? ¿Me está permitido atacarlo? ¿Sigue siendo considerado mi compañero de equipo después de romper las reglas? ¿Me ejecutarán a mí también si intento matarlo? ¿Debería simplemente dejarlo inconsciente? Malditos sean los dioses, ¡no puedo pensar con claridad con tanto salto!

              Mientras el mago me mantiene ocupado, varios guardias más se están lanzando ahora hacia él, intentando clavarle sus hojas por la espalda mientras no está prestando atención. El mago no se deja tomar desprevenido, e inmediatamente empieza a apuntar también a sus nuevos atacantes, sin dejar de hacerme esquivar columnas de fuego.
          - source: scene_text_2
            paragraph: 14
            text: |-
              "¡Velgos, haz algo!" dice el presentador, desesperado. "¡Mátalo! ¡Mátalo ahora, antes de que empeore!"

              El trol frunce el ceño al presentador, y empieza a caminar lentamente hacia el mago, sin dejar de mantener a Leila a la vista. El mago ya ha matado a todos los guardias, pero cuando ve que el trol se le acerca, se olvida por completo de mí, y apunta las manos hacia él en un intento de intimidar a su nuevo enemigo.

              "¡No te acerques!" dice el mago, con un tono asustado. "¡Te quemaré hasta dejarte crujiente!"

              "Adelante," dice Velgos, mientras sigue avanzando hacia el mago, mirando a Leila por el rabillo del ojo. "Me encantaría verlo."

              Cuando Velgos se acerca aún más, el mago deja escapar un gemido, y el trol queda de repente engullido por una columna de fuego recién formada, mucho más grande que las de antes. Velgos sale de las llamas completamente ileso, con una sonrisa maliciosa en la cara, y sigue avanzando lentamente hacia su objetivo.

              "¡Muere, monstruo!" grita el mago, cuando el trol llega hasta él, y empieza a apuñalarlo repetidamente en el pecho con su daga.

              Al ver que no funciona, el mago intenta ir a por el cuello, como Leila, pero Velgos lo bloquea fácilmente con una de sus cimitarras, mientras baja su otra arma sobre el mago, partiéndolo en dos. Casi inmediatamente después de que el mago muere, Leila se lanza detrás del trol, sin darle tiempo a reaccionar, y le corta la cabeza de un solo golpe, aplastándola bajo su pie poco después.
        effects:
          - set:
              successful_checks:
                - '[ Comprobación de velocidad exitosa - nivel 2 ]'
              ac_b2_ch5_tribal: 1
            achievement:
              id: ac_b2_ch5_tribal
              title: Bailarín tribal
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch05a_troll_final
                condition: is_dead = 0
