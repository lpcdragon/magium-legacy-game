              Definitivamente no soy lo suficientemente rápido como para correr en círculos a su alrededor sin que me golpeen, pero con mi nivel de fuerza, quizás pueda lograrlo. Avanzo lentamente hacia uno de los ogros, y espero a que me ataque con su maza. Una vez que deja caer su arma sobre mí, levanto mi cuchillo, sosteniéndolo con ambas manos, y bloqueo su golpe justo encima de mi cabeza. Luego suelto mi cuchillo, y agarro la maza con ambas manos, arrancándola del agarre del ogro. Usando mi arma recién adquirida, le aplasto la cabeza al ogro antes de que tenga tiempo de reaccionar, y luego me muevo hacia su amigo, preparándome para atacarlo también. Ahora que tengo el mismo alcance de ataque que él, el monstruo ya no tiene forma de compensar su lentitud. Intenta golpearme, pero soy mucho más rápido, y logro asestar un golpe antes de que siquiera empiece su movimiento. Un solo golpe bastó para enviar al ogro al suelo. Tan pronto como termino de pelear, suelto la maza, y recojo mi cuchillo del suelo.
