  - name: b2_ch05a_contrary_ogres
    routes:
      - condition: b2_ch5_negotiate = 2 AND b2_ch5_first_cut = 0
        texts:
          - source: scene_text
            paragraph: 36
            text: |-
              Mientras me quedo ahí parado, pensando, el trol finalmente me nota, y sus ojos se llenan de rabia una vez más. Leila aprovecha esta breve distracción, y logra cortarle la cabeza al trol otra vez. Una vez que aplasta su cabeza, el trol empieza a regenerar una nueva desde su cuello, aunque esta vez parece estar tomando más tiempo crearla completamente, y parece estar teniendo un poco de dificultad recreando exactamente los mismos rasgos faciales que tenía antes.

              Tan pronto como su cabeza vuelve a crecer, Leila y Bruce empiezan a presionar al trol otra vez, sin dejarle ninguna oportunidad de contraatacar apropiadamente.

              "Santo cielo," dice el mago, exasperado, mientras observa a Leila pelear. "¡Deja de apuntar a la cabeza! ¿No ves que no te está sirviendo de nada?"

              "¡Al contrario!" le digo. "Creo que cortarle la cabeza es exactamente lo que deberíamos estar haciendo. Pudiste ver claramente que al trol le costó regenerar su cabeza cuando se la cortaron la segunda vez. Incluso con su alucinante capacidad regenerativa, tiene que haber algún tipo de límite a cuántas veces puede regenerar su cabeza en un período de tiempo tan corto. ¡Mi suposición es que una o dos decapitaciones más deberían bastar!"

              Echo otro vistazo rápido al campo de batalla, y parece que las cosas no van muy bien para Velgos en este momento. Leila y Bruce están haciendo un muy buen trabajo flanqueándolo, y el trol no puede atacar a Bruce en absoluto, porque si aparta los ojos de Leila por un solo segundo, ella le cortará la cabeza otra vez en un abrir y cerrar de ojos.
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch05a_climactic_ogres
