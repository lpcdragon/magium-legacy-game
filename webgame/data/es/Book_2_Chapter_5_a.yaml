        paragraph: 23
        text: |-
          No deberíamos enfrentarlo solos. Ya logramos destrozar una de sus hombreras. Eso debería ser suficiente por ahora.

          Le hago señas a Leila para que se retire, y ambos nos dirigimos hacia los otros miembros de nuestro equipo. El trol todavía se está recuperando del fuego, así que elige no venir tras nosotros por el momento. Mientras tanto, dos ogros muy grandes han salido por la reja detrás de Velgos, y ahora están blandiendo sus mazas sobredimensionadas amenazadoramente hacia nosotros.

          "Lo sabía," dice nuestro compañero mago. "Sabía que no nos lo pondrían tan fácil como pelear contra un solo trol. ¡Tenían que traer a los ogros también!"

          "Deja de quejarte," dice Bruce. "Los ogros son fáciles de vencer. Son tontos, y lentos como caracoles. Puedo enfrentarme a los dos yo solo."
