          - source: scene_text_2
            paragraph: 17
            text: |-
              "¡No creas que te vas a salir con la tuya tan fácilmente, hijo de puta!" me dice el mago.

              "¿Salir con la mía con qué?" digo.

              "¡Con usarme de señuelo!" grita el mago.

              "Oh, claro, ¡eso!" digo. "Vale, esto es lo que haremos. En la próxima ronda, tú podrás usarme de señuelo a mí, y estaremos a mano. ¿De acuerdo?"

              "¡La próxima ronda es de peleas individuales!" dice el mago.

              "¿Ah, sí?" digo, con tono desinteresado. "Bien, entonces la ronda después de la próxima."

              "¡No hay ronda después de la próxima!" grita el mago. "¡Solo es una pelea opcional!"

              "Técnicamente solo es opcional si no rompes las reglas, pero entiendo tu punto," digo, mientras hago una breve pausa para pensarlo bien. "Bueno, si así están las cosas, entonces supongo que ya no queda ninguna posibilidad de que estemos a mano. Qué pena. Pero oye, no hay resentimientos, ¿verdad?"
          - source: scene_3
            paragraph: 4
            text: |-
              Mientras el mago rechina los dientes, Bruce se dirige ahora hacia nosotros, después de haber terminado su pelea con los dos ogros.

              "¿Ya terminaron con el trol?" pregunta Bruce, sorprendido, cuando llega hasta nosotros.

              "Sí, lo matamos hace siglos," digo. "¿Qué te tomó tanto tiempo?"

