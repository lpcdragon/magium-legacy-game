            paragraph: 35
            text: |-
              Mientras hablaba con los ogros, vi a Leila y Bruce trabajando juntos, logrando decapitar al trol por segunda vez. Leila aplastó la cabeza de Velgos bajo su sandalia, pero la cabeza no se regeneró en el suelo.

              En su lugar, el trol volvió a regenerar su cabeza desde el cuello, aunque esta vez pareció tomar más tiempo crearla completamente, y parecía estar teniendo un poco de dificultad recreando exactamente los mismos rasgos faciales que tenía antes.

              Mientras me preparo para unirme a mis amigos en la batalla, echo un largo vistazo a Velgos, e intento armar un plan de ataque.
