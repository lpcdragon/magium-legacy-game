  - name: b2_ch06a_funnel
    texts:
      - source: scene_text
        paragraph: 27
        text: |-
          "¿Acabas de...?" digo, pero me detengo unos instantes para ordenar mis ideas. "¿Acabas de dar a entender que la razón por la que las mujeres no pueden nacer siendo magas en nuestro plano terrenal está directamente relacionada con tu exilio del plano mágico?"

          Tras oír mi última frase, Kate, que hasta ahora no parecía estar prestando demasiada atención a nuestra conversación, por fin gira la cabeza hacia nosotros y ahora nos observa atentamente.

          "Así que al fin lo averiguaste, ¿eh, Barry?" dice Arraka. "¿Qué fue lo que te dio la pista? ¿Quizá el hecho de que todas las banshees sean prácticamente espíritus femeninos humanoides? ¿O quizá el hecho de que las hembras de los animales y de los monstruos aún puedan lanzar magia, mientras que sus mujeres son totalmente incapaces de hacerlo, a menos que sus auras hayan sido alteradas de forma drástica? Oh... ¿o quizá el hecho de que las mujeres solo adquieran magia cuando son poseídas por banshees? Esa es una pista bastante obvia, si me preguntas a mí. Demonios, incluso tenías a Flower como ejemplo. Su elemento es el fuego, mientras que el de Illuna es el agua. Está claro que no se limitó a heredar la magia de Illuna, ¿no? ¿Nunca se te ocurrió que, para canalizar esa energía desde el plano mágico, necesitas crear de verdad un vínculo con un espíritu mágico cuya naturaleza sea al menos algo parecida a la tuya? No habrás pensado de verdad que podías sacar esa energía por tu cuenta, sin algún espíritu mágico que te sirviera de embudo, ¿verdad?"

          "Entonces", digo, "¿lo que estás diciendo es que todos y cada uno de los magos del plano terrenal están vinculados, en realidad, a un espíritu del plano mágico?"
      - source: scene_text_2
        paragraph: 23
        text: |-
          "Bueno, sí, pero no es que ninguno de los dos lo haga conscientemente", dice Arraka. "Como están en planos de existencia distintos, el vínculo no necesita ser tan estrecho ni tan personal. La mayoría de los magos probablemente solo se vinculan a un espíritu por instinto, y ni ellos ni los espíritus con los que están vinculados llegan a notarlo jamás durante el resto de sus vidas. Pero ya no puedes vincularte inconscientemente con un espíritu si todos los espíritus con auras parecidas a la tuya están aquí, en el plano terrenal, en vez de allí donde deberían estar. Claro, aún puedes intentar lanzar magia por otros medios, pero entonces tu aura tendría que volverse algo completamente distinto. Como la de la chica stillwater, por ejemplo. O la de tu amiga que usa magia de hielo."

          "¿Pero cómo lograron esos espíritus exiliarte a un plano de existencia completamente distinto?" digo. "¡Seguro que no pudo ser tan simple como echarte y cerrar la puerta con llave detrás de ti!"

          "Oh, por lo que he oído, el exilio fue idea de Memphir", dice Arraka. "Siempre tuvo talento para idear planes absurdamente elaborados como estos, aunque por lo general solo la mitad terminaba saliéndole bien."

          "Memphir es el Dios del Destino, ¿verdad?" digo.
      - source: scene_3
        paragraph: 7
        text: |-
          "Sí, el de las ilusiones", dice Arraka. "No sé cómo se le ocurrió la idea ni cómo logró convencer a tantos espíritus de seguir su plan, pero lo que hicieron básicamente fue alterar todo el sistema que se encarga de asignar espíritus al plano mágico y reprogramarlo para que, en su lugar, asignara a los espíritus femeninos de las razas civilizadas al plano terrenal."

          "¿Se puede hacer eso?" digo.

          "Bueno, obviamente no es fácil", dice Arraka. "Y necesitas una cantidad tremenda de energía para lograrlo incluso si descubres cómo hacerlo, pero esos bastardos lograron reunir a suficientes espíritus de su lado como para llevarlo a cabo."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch06a_nest
  - name: b2_ch06a_nest
    texts:
      - source: scene_text
        paragraph: 28
        text: |-
          "Entonces, ¿por qué no lo devolviste simplemente a como estaba después de que te enviaran aquí?" digo. "¿No deberías tener más que suficiente energía para hacerlo después de absorber a todos esos espíritus?"

          "¡No puedo hacerlo desde aquí!" dice Arraka. "Por eso estamos atascados. Si quisiera deshacer todo lo que hicieron Memphir y su grupo, tendría que acceder directamente al Magium, y no puedo hacer eso desde el plano terrenal."

          "¿El Magium?..." le pregunto.

          "Bueno, no exactamente el Magium", dice Arraka. "Ya sabes a qué me refiero..."

          "No..." digo. "La verdad es que no..."

          "Ya sabes..." dice Arraka. "Me refiero a la parte del Magium que se ocupa específicamente de la creación de espíritus mágicos y luego los envía al plano mágico. Sabes cómo funciona, ¿no? Los espíritus no fueron hechos para reproducirse, aunque estén divididos entre machos y hembras, igual que ustedes aquí en el plano terrenal. Por eso hay una especie de... nido, o como quieras llamarlo, dentro del Magium que se encarga de ir produciendo espíritus nuevos y de enviarlos al plano mágico después de que mueren los viejos, para que haya más o menos la misma cantidad de espíritus en el plano mágico en cualquier momento dado. ¡Solo que esos bastardos lograron cambiar la forma en que funciona! En cuanto terminaron de manipular el nido, este incluso envió al plano terrenal a las que ya estábamos allí, por no hablar de todas las nuevas que se crearon después. ¡Y aun desde Varathia, las únicas partes del Magium a las que puedo acceder son las que no necesito!"
      - source: scene_text_2
        paragraph: 24
        text: |-
          "¿Otras partes del Magium?..." digo, confundido. "No lo entiendo. ¿Qué tan grande es exactamente el Magium? ¿No se suponía que era una especie de artefacto poderoso que solo se encuentra aquí en Varathia?"

          Arraka se queda un largo rato en silencio antes de volver a hablar, durante el cual todos esperamos su respuesta en silencio.

          "¿Acabas..." dice, esforzándose por encontrar las palabras. "¿Acabas de preguntarme qué tan grande es el Magium?"

          "Sí, eso dije", respondo.

          Tras otra breve pausa, Arraka de repente empieza a reírse, más fuerte que nunca antes, y sigue así durante unos diez segundos antes de volver a hablar.

          "Oye..." dice Arraka, casi sin aliento de tanto reírse, "oye, Illuna, ¿has... has oído lo que dijo? ¡Preguntó qué tan grande es el Magium! ¡Aja- AHAHAHAHA!"

          "¡Deja de reírte, maldita sea!" digo, cuando por fin pierdo la paciencia. "¡Dime lo que sabes sobre el Magium!"
      - source: scene_3
        paragraph: 8
        text: |-
          "¡Ahahahaha!" dice Arraka. "¿Viniste aquí a luchar por el Magium, pero ni siquiera sabes qué es? Vaya, eso sí que tiene gracia. Estaría llorando de la risa si no viviera dentro de un amuleto sin cuerpo. No puedo creerlos... De verdad... De verdad vinieron aquí sin siquiera... ¡Ahahahaha!"

          "¡Ya basta!" le digo. "¿Vas a decirme qué es el Magium o no?"

          Arraka me ignora por completo y simplemente sigue riéndose y riéndose, sin dar señales de que piense detenerse pronto.
    choices:
      - position: 1
        text: Amenazar con hacer girar su amuleto hasta que me responda.
        effects:
          - set:
              current_scene: b2_ch06a_threaten
      - position: 2
        text: Esperar a que deje de reírse y volver a preguntarle.
        effects:
          - set:
              current_scene: b2_ch06a_wait
  - name: b2_ch06a_threaten
    texts:
      - source: scene_text
        paragraph: 29
        text: |-
          "¿Quieres que haga girar tu amuleto hasta que me des una respuesta?"

          "¿De verdad quieres hacer eso, Barry?" dice Arraka, dejando de reírse. "¿De verdad crees que a partir de ahora ya no volverás a necesitar mi ayuda? ¿De verdad te gusta tanto que te sorprendan enemigos invisibles?"

          "Déjalo, Barry", dice Daren, mientras me pone una mano en el hombro. "Si no quiere decírnoslo, por mucho que la hagas girar no vas a hacerla cambiar de idea. Tendremos que averiguar por nuestra cuenta qué es el Magium."

          "¡Yo sé lo que es el Magium!" dice Flower.

          "¿Lo sabes?" le pregunto.

          "Sí", dice Flower.

          "Bueno, ¿qué es?" digo.

          "¡Oh, eso no puedo decírtelo!" dice Flower.

          "¿Y por qué demonios no?" digo.

          "Porque no me dejan", dice Flower, sin más.

          "¿Quién no te deja?" le pregunto. "¿Los reyes? ¿Los reyes de Varathia les prohíben revelar la verdadera naturaleza del Magium a los participantes del torneo?"

          "Yo... no puedo responder esa pregunta", dice Flower, algo incómoda.
      - source: scene_text_2
        paragraph: 25
        text: |-
          "¿Pero por qué?" digo. "¿Qué pasará si nos hablan del Magium?"

          "Moriremos", dice Illuna, sin rodeos.

          "¿Quieres decir que enviarán a alguien a ejecutarlas?" digo.

          "No, quiero decir que caeremos muertas", dice Illuna. "En el acto. Muy posiblemente incluso antes de que alcancemos a decirles qué es realmente el Magium."

          "¿Qué quieres decir?" le pregunta Hadrik a Illuna. "¿Por qué caerían muertas solo por responder una pregunta?"

          "Lo que quiere decir es que están bajo un juramento de encantador", dice Daren. "Probablemente las hicieron jurar que no revelarían la naturaleza del Magium a nadie. Ya fuera por los reyes o por alguien más. Seguramente ya se están arriesgando a morir incluso con lo poco que ya nos están diciendo. Deberíamos dejar de preguntarles por esto antes de que a Flower se le escape demasiada información por accidente y termine matándolas a las dos sin querer."

          "Maldita sea", dice Hadrik. "Pensé que de verdad habíamos dado con algo por un segundo."
