      - source: scene_text
        paragraph: 30
        text: |-
          Espero a que Arraka deje de reírse por sí sola, y cuando por fin se le pasa la risa, repito mi pregunta.

          "Bien, ahora que ya terminaste de reírte", digo, "¿piensas decirnos qué es el Magium o no?"

          "Nah", dice Arraka.

          "¿Por qué no?" digo.

          "Porque no tendría ninguna gracia que te lo dijera directamente", dice Arraka. "¡Tienes que ganártelo! ¿No es para eso que estás aquí?"

