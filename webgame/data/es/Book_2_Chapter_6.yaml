  - name: b2_ch06a_tantrum
    texts:
      - source: scene_text
        paragraph: 43
        text: |-
          "¡Maldito seas!" dice Daren, con los ojos llenos de odio. "¡No voy a dejar que hagas esto!"

          "Pero, Daren", dice Eiden, "¡yo pensaba que tú, de entre todos, tendrías todas las razones del mundo para alegrarte por este giro de los acontecimientos! ¿No eras tú quien me dijo que mientras uno nunca se rinda, siempre puede encontrar la forma de salvar a todos? Pues yo la he encontrado. ¡Una forma de salvarlos a todos de su miseria! Te aseguro que una muerte rápida sería un destino mucho mejor de lo que la mayoría de esta gente merece, y en cuanto al resto--"

          "Ah, cállate de una vez", interrumpo a Eiden.

          "¿Perdón?" me pregunta Eiden.

          "Estoy harto de tus estupideces", digo. "Estás actuando como un niño malcriado que monta una rabieta. Cada vez que algo no sale como quieres, rompes todos los juguetes y dejas el patio hecho un desastre para que luego los adultos limpien lo que tú ensuciaste. Hiciste lo mismo con Olmnar. ¿Hacer volar una ciudad por los aires es tu solución habitual para todo?"

          Todos mis amigos, incluido Daren, están demasiado sorprendidos por mi estallido repentino como para decir nada, y se limitan a mirarme sin poder creerlo. Eiden también me mira directamente, con los ojos cerrados, pero la sonrisa ya ha desaparecido de su rostro.

          "¿Adónde quieres llegar?" me pregunta Eiden, con calma.
      - source: scene_text_2
        paragraph: 35
        text: |-
          "Lo que digo", digo, "es que no hay forma de que puedas construir casi tú solo toda una civilización así y luego, en el transcurso de apenas unos pocos cientos de años, simplemente dejar de preocuparte por lo que les pase a estas personas y matarlas como si nada. Esto no es más que negarte a admitir tus errores. Fracasaste. Tenías todo el poder del mundo y aun así no pudiste lograr lo que querías. Y en vez de dar la cara e intentar arreglar las cosas, ¿qué haces? Lo barres todo debajo de la alfombra como si nada de esto fuera culpa tuya, y luego decides acabar con todo con tu propia mano, como si eso fuera a mejorarlo de algún modo. Ya basta. Solo estás haciendo el ridículo."

          "Ya he oído más que suficiente", dice Eiden, con tono desdeñoso. "Hablas sin siquiera conocer la situación en la que se encuentran las otras ciudades. ¿Crees que la esclavitud y las arenas son los verdaderos problemas de Varathia? No tienes ni idea de lo que está ocurriendo en los otros reinos. Algunas de estas personas han caído muchísimo más bajo de lo que podrías imaginar."

          "¿Y qué?" digo. "¿No eres su líder? ¿No es trabajo de un líder asegurarse de que su gente no tome el camino equivocado? ¿Cómo demonios dejaste que esto llegara a este punto? ¿Simplemente los dejaste organizarse solos sin intervenir ni lo más mínimo? Diablos, hasta yo habría hecho un mejor trabajo manteniendo las cosas bajo control, y no sé nada de política."
      - source: scene_3
        paragraph: 12
        text: |-
          "¿Estás diciendo que habrías podido evitar esto si hubieras tenido mis poderes?" dice Eiden. "¿Tú, que ni siquiera pudiste entregar un simple mensaje?"

          "No", digo. "Lo que digo es que habría podido evitar esto incluso sin tener ningún poder. Tú, en cambio, tenías todo el poder que necesitabas, y lo único que lograste fue empeorarlo todo. ¿Y qué demonios fue lo de Olmnar? ¿Creíste que destruyendo esa ciudad el zorro te perdonaría? ¿Eso creíste? ¡No me hagas reír! Si buscas perdón, entonces empieza por arreglar todo lo que rompiste y por dejar de ser un maldito cobarde."

          En cuanto termino la frase, Eiden frunce el ceño y, de repente, todo a mi alrededor se congela, igual que aquella vez en que luché por primera vez contra el dragón. Luego empieza a caminar lentamente hacia mí, mientras todos, excepto nosotros dos, se quedan congelados en el sitio. Parece bastante furioso.
    choices:
