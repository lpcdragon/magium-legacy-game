          - source: scene_text
            paragraph: 17
            text: |-
              "Sí, pero asegúrate de no alterarme las estadísticas."

              "¡Por supuesto!" dice Melindra. "Solo necesito hacer una prueba y luego te lo devuelvo."

              Saco el dispositivo del bolsillo y se lo doy a Melindra.

              Al ver las estadísticas en la pantalla, Melindra alza una ceja y luego vuelve a mirarme con incredulidad.

              "¿En serio?" dice. "¿Todavía no has invertido ni un solo punto en tus estadísticas?"

              "¿Qué puedo decir?" le respondo. "¡Me gusta vivir al límite!"

              "Hmm..." dice Melindra, mirándome con curiosidad durante unos segundos, pero luego vuelve la vista al dispositivo.

              Tras mirarlo unos segundos, la chica empieza a pulsar varias veces seguidas los botones laterales del dispositivo.

              "¡Espera, un momento!" le digo. "Prometiste que no ibas a--"

              "¡Shhh!" me dice Melindra, con una expresión muy seria en la cara.

              Tras unos segundos de silencio, Melindra me devuelve el dispositivo, visiblemente contrariada.
          - source: scene_text_2
            paragraph: 16
            text: |-
              "No funciona", dice. "Supongo que mi aura ha cambiado demasiado desde que me convertí en una stillwater como para que el dispositivo siga reconociéndome como medio lessathi. Qué lástima."

              "¿Qué estabas haciendo hace un momento?" le pregunto a Melindra. "Te vi pulsando los botones del dispositivo de estadísticas, pero no parece haber cambiado nada."

              "Oh", dice Melindra. "Solo usé un código para aumentar temporalmente en unos cuantos puntos la estadística de audición, con el fin de ver si mi capacidad real para oír mejora o no. Está pensado como una prueba para ver qué tan bien reacciona el dispositivo de estadísticas a tu aura antes de que empieces a usarlo. El código solo funciona con la estadística de audición y solo puede activarse una vez al día, durante unos segundos."

              "¿Puedes darme el código?" le pregunto.

              "Claro", dice Melindra. "Es tres veces a la izquierda, tres veces a la derecha, dos veces a la izquierda, cuatro veces a la derecha, y luego izquierda, derecha, izquierda, derecha. Ah, y tienes que hacerlo en menos de cinco segundos o el código no se activará."

              "Tres a la izquierda, tres a la derecha, dos a la izquierda, cuatro a la derecha, izquierda, derecha, izquierda, derecha, entendido", digo. "¡Muchas gracias!"

              "¡De nada!" dice Melindra.
