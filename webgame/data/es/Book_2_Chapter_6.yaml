  - name: b2_ch06a_motives
    texts:
      - source: scene_text
        paragraph: 10
        text: |-
          "¿Ven?" nos dice Melindra, después de terminar de leer el texto de Leila. "¡No hay nada de qué preocuparse!"

          "¿Pero Ollendor no está muy lejos?" dice Daren. "Y además tendrías que llevarnos hasta la persona que tiene el detector de piñas. Eso suena a mucho tiempo perdido, cuando ya llevamos tres días de retraso respecto a todos los demás participantes del torneo."

          "¿Y qué?" dice Melindra. "No es como si alguien hubiera avanzado nada desde que anunciaron los objetivos. Nadie tiene idea de que las piñas solo pueden encontrarse en los bosques sagrados. De hecho, están evitando los territorios del zorro como si fueran la peste, porque no quieren tratar con ella, así que las probabilidades de que encuentren aunque sea una piña en la próxima semana son casi inexistentes. Incluso cuando por fin descubran lo que tienen que hacer, igual tendrán que enfrentarse al zorro dorado. Sin usar un detector, ni siquiera puedo imaginar cómo podrían pasar desapercibidos el tiempo suficiente para ir probando cada piña a mano, así que tendrán que enfrentarse directamente al zorro y a sus seguidores, y creo que ya pueden imaginarse cómo les irá."

          "Lo siento, pero sigo sin creerme esto", dice Kate. "Eres una stillwater. ¿Por qué necesitarías nuestra ayuda para asesinar a un rey?"

          "¡Porque vine a Varathia como participante del torneo!" dice Melindra. "¡Era la única forma que se me ocurrió de volver a este lugar después de que ese maldito rey de Ollendor me exiliara! Pero ahora el hechizo del torneo me impide hacerles daño a los lugareños, así que llevo atrapada aquí desde el primer día, intentando encontrar a alguien que haga el trabajo por mí."
      - source: scene_text_2
        paragraph: 9
        text: |-
          "¿Y qué garantía tenemos de que cumplirás tu promesa una vez que hayamos completado nuestra tarea?" pregunta Daren. "Diablos, ¿qué garantía tenemos siquiera de que no empezarás a actuar como Eiden e intentarás matarnos por diversión a mitad del viaje? Ya sabemos que has colaborado con él en el pasado."

          "¡Pero por el amor de Dios!" grita Melindra, exasperada. "Si están tan preocupados por mis motivos, ¿por qué no me obligan a hacer un juramento? Tú eres un encantador, ¿no? Haz que jure que cumpliré mi parte del trato y que no intentaré hacerles daño, y asunto resuelto."

          "¿Un juramento de encantador?" le pregunta Daren. "¿Hablas en serio? Sabes que morirás si rompes un juramento así, ¿verdad?"

          "¡Sí, claro que lo sé!" dice Melindra.

          "¿Y también querrías que nosotros juráramos que no te haremos daño durante el viaje?" pregunta Daren.

          "Oh, no, no hace falta", dice Melindra. "Además, no es como si pudieran hacerme algo, de todas formas."

          "Mmm..." dice Daren.

          Luego se vuelve hacia nosotros.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch06a_payback
  - name: b2_ch06a_payback
    texts:
      - source: scene_text
        paragraph: 11
        text: |-
          "¿Qué opinan ustedes?" nos pregunta Daren. "Dejando de lado el comentario algo irritante y condescendiente que hizo antes, yo diría que su trato, considerándolo todo, ya no suena tan mal. Como mínimo, no me da la impresión de que esté intentando engañarnos, y encima podríamos salvar un reino en el proceso."

          "Bueno..." dice Hadrik. "No puedo decir que antes haya tenido la oportunidad de hacer caer a un reino, y además daría para una muy buena historia cuando salga a beber en las tabernas... Desde luego suena más divertido que andar buscando piñas, ¡eso seguro!"

          "Admito que, si tomamos en cuenta todo lo que dijo", dice Kate, "su forma de hacer las cosas quizá sí nos dé ventaja sobre los demás participantes, sobre todo porque este concurso parece haber estado amañado desde el principio para que solo los cuatro sabios pasen a la siguiente ronda."

          "Sí, ¿qué se supone que fue eso?" dice Hadrik. "No puedo decir que estuviera apuntando a ganar el torneo, pero aun así esto me tiene bastante furioso. ¿Para qué invitaron siquiera a los otros magos, si no pensaban darles una oportunidad justa? ¿Fue todo solo para aparentar?"
      - source: scene_text_2
        paragraph: 10
        text: |-
          "Están olvidando", dice Illuna, "que la condición para superar esta ronda es llevar las piñas a la ciudad de Galamir. Eso significa que todavía se puede atacar a los sabios en su camino a la ciudad y robarles las piñas. Así que, si son lo bastante fuertes o ingeniosos como para quitarle un objeto a un sabio, todavía pueden pasar a la siguiente ronda, aunque no tengan suficiente poder para hacer brillar una piña. Además, también tienen la opción de unirse al equipo de uno de los sabios, si alguno de ellos los acepta. En otras palabras, hay más de una forma de superar esta ronda, pero todas requieren tratar con los sabios de un modo u otro. Si quieren evitar a los sabios, entonces el detector de piñas probablemente sea su mejor opción."

          "Bueno, no sé ustedes", digo, "pero yo, por mi parte, tengo ganas de causar un pequeño caos en las tierras del embajador de Ollendor. La verdad es que se sentiría bastante bien por fin devolverle un poco de lo que nos hizo pasar en la arena. Y además, Ollendor prácticamente va a convertirse pronto en el nuevo hogar de Leila, así que bien podríamos hacer un poco de limpieza antes de que se mude."

          Leila parece un poco desconcertada por mi último comentario. Creo que esta es la primera vez que de verdad se da cuenta de que ya no tendrá que separarse de nosotros, ahora que la arena terminó.

          "Vendrás con nosotros a Ollendor, ¿verdad?" le pregunto.

          "¡Sí!" escribe Leila, sonriendo feliz. "¡Sí, claro!"
