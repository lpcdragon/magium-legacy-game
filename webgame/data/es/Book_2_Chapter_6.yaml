  - name: b2_ch06a_complex
    texts:
      - source: scene_text
        paragraph: 38
        text: |-
          "Hadrik", dice Daren, "entiendo que estés intentando ponerte del lado de Talmak porque es un enano, pero así no funcionan las cosas en un duelo mágico. No puedes ganar una pelea solo con poder puro. Necesitas tener cierta versatilidad. Como generalista, Azarius puede usar hechizos de muchos tipos distintos, lo que hace que sus ataques sean mucho más impredecibles. Los especialistas siempre estarán en desventaja cuando luchan contra generalistas por esa razón. Por eso intenté con todas mis fuerzas dominar tanto el encantamiento como la magia blanca a lo largo de mi vida. Limitarme a una sola especialización me habría dado muchas menos opciones al luchar contra otros magos entrenados."

          "¡Oh, vamos!" dice Hadrik. "No es como si Talmak solo pudiera usar magia de tierra. Lo viste en el concurso de sabios del año pasado. ¡También puede usar magia de relámpagos! ¡Y un montón de otros hechizos!"

          "Sí", dice Daren. "Hechizos básicos. Nunca lo vi lanzar hechizos complejos fuera de su propia especialización."

          "¿Y qué importa si son hechizos simples?" dice Hadrik. "¡Puede usar su enorme reserva de energía para potenciarlos y entonces serán igual de fuertes que los hechizos más complejos!"
      - source: scene_text_2
        paragraph: 32
        text: |-
          "¡Eso solo sería un desperdicio de energía mágica!" dice Daren. "Hay una razón por la que se inventaron versiones más complejas de los hechizos básicos. Es porque ahorran energía."

          "¿Y por qué le importaría a Talmak ahorrar energía?" dice Hadrik. "Le sobra la energía. No es como si lo hubiéramos visto quedarse sin ella en un duelo alguna vez. Demonios, por lo que sabemos, ¡sus habilidades de regeneración mágica bien podrían ser lo bastante altas como para recuperar la energía antes siquiera de tener oportunidad de gastarla!"

          "¡Uf!" dice Daren. "Barry, ¿puedes creer a este tipo? ¡De verdad está intentando argumentar que Azarius perdería en una pelea contra Talmak!"
    choices:
      - position: 1
        text: Sí que tiene un punto. Quiero decir, Azarius ya es bastante viejo.
        effects:
          - set:
              current_scene: b2_ch06a_old
      - position: 2
        text: Sí, sinceramente no me imagino a Azarius perdiendo nunca en una pelea justa.
        effects:
          - set:
              current_scene: b2_ch06a_fair
  - name: b2_ch06a_old
    texts:
      - source: scene_text
        paragraph: 39
        text: |-
          "Pero tiene razón en algo. Quiero decir, Azarius ya es bastante viejo."

          "¡Ja!" dice Hadrik. "¿Ven? ¡Ni siquiera Barry cree que él ganaría! ¡Y eso que es del Continente Occidental!"

          "Eh..." dice Daren. "No es que por ser del Continente Occidental automáticamente tengas que estar del lado del Sabio del Oeste. Aun así, mantengo lo que dije antes. Puede que Talmak de verdad le diera problemas a Azarius en un duelo, pero no hay manera de que ganara si Azarius peleara en serio."

          "Vale, vale..." dice Hadrik. "¡Bien, entonces tengo otra para ustedes! ¿Quién creen que ganaría en un duelo entre Eiden y Arraka?"

          "Pero si esa pelea ya ocurrió, ¿no?" digo. "Durante el invierno inmóvil, quiero decir. Estoy bastante seguro de que Eiden hizo pedazos a Arraka la última vez que pelearon."

          "Bueno, por lo que he oído", dice Hadrik, "la última vez que pelearon fue Eiden y el zorro contra Arraka, así que era una pelea de dos contra uno."

          "Sí", digo, "pero te olvidas de que Arraka también estaba fusionada con algún otro stillwater en ese momento. Así que no era una pelea de dos contra uno, era una de dos contra dos. Para mí eso ya se parece bastante a un duelo. Como decía, Eiden le pasó por encima a Arraka la última vez que pelearon."

          "¡Eh!" dice Arraka. "¡¡¿Pero qué demonios estás diciendo?!! ¡Aquí nadie le pasó por encima a nadie! ¡Y Therius no cuenta! ¡Era un debilucho! ¡Ni siquiera puedes compararlo con el zorro dorado, y mucho menos con Eiden!"
      - source: scene_text_2
        paragraph: 33
        text: |-
          "Sí, claro", digo. "Si era tan debilucho, ¿cómo es que ni siquiera pudiste apoderarte bien de su cuerpo durante tu despertar?"

          "¡Eso no tiene nada que ver con el poder, idiota!" dice Arraka. "¿Tu amiga no te habló de los etéreos? Ese tipo tenía una ventaja abrumadora mientras peleábamos dentro de su propia mente. ¡En una pelea justa lo habría aniquilado! ¡Y lo mismo va para Eiden!"

          "Ajá", digo. "Eso dices, pero igual perdiste contra él durante el invierno inmóvil."

          "¡Eso es porque Eiden usa trucos!" dice Arraka. "¡En términos de poder puro, soy muchísimo más fuerte que él!"

          "¿Y a quién le importa que técnicamente seas más fuerte que él?" digo. "Pelear no consiste solo en tener fuerza. También tienes que saber cómo usarla."

          "¡No estoy hablando de que él sea más hábil que yo, imbécil!" dice Arraka. "¡Estoy diciendo que hace trampa! ¡No está usando la magia como se supone que debe usarse!"

          "¿Y eso qué se supone que significa?" digo.
      - source: scene_3
        paragraph: 11
        text: |-
          "¡Olvídalo!" dice Arraka. "No voy a quedarme aquí perdiendo el tiempo explicándote cómo funciona la magia. Mira, te diré una cosa. ¿Por qué no le preguntas directamente a Eiden qué quise decir? Lleva ahí plantado, invisible, justo a tu lado desde hace unos veinte segundos, así que seguro que no tiene nada mejor que hacer ahora mismo."

          En cuanto Arraka termina de hablar, Eiden disipa su hechizo de invisibilidad, con su sonrisa cortés de siempre en el rostro y los ojos cerrados.

          "No vas a dejar que me divierta ni un poco, ¿verdad, Arraka?" dice Eiden.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch06a_calamity
