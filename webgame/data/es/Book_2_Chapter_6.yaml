          - source: scene_3
            paragraph: 10
            text: |-
              "No, me la quedo", le digo. "Solo quería saber cómo se compara con la daga que encantaste para mí. Yo diría que están más o menos al mismo nivel, ¿no?"

              "Más o menos", dice Daren. "La calidad del metal es la misma. Pero el mayor alcance podría venirte bien, así que entiendo por qué quieres quedártela."

