  - name: b2_ch06a_elixir
    routes:
      - condition: b2_ch6_crossbow = 0
        texts:
          - source: scene_text
            paragraph: 36
            text: |-
              Decido comprar la ballesta más barata. Ya es infinitamente mejor que la que tengo, y no es como si estuviera planeando participar en un concurso de puntería. No necesito comprar la opción más cara disponible.

              Cuando terminamos de comprar lo que necesitamos, guardo mi nueva ballesta dentro de la mochila, y luego Daren y yo salimos de la tienda, yendo directamente hacia el centro del mercado. Mientras caminamos, de repente recuerdo que hay otra cosa que necesito comprar mientras todavía estoy en la ciudad, así que le digo a Daren que siga adelante y entro en la tienda de pociones.

              "¿Barry?" pregunta Flower al verme entrar en el edificio. "¿No habías ido a comprar armas?"

              "Sí", digo. "Pero recordé que también tenía que comprar algo aquí."

              "¿Qué vas a comprar?" pregunta Flower.

              "...Un elixir anti-veneno", digo, un poco avergonzado.

              Los ojos de Flower se vuelven azules, e Illuna se me queda mirando durante unos segundos, sin decir nada.
          - source: scene_text_2
            paragraph: 31
            text: |-
              "Recuerda comprar también un elixir contra enfermedades ya que estás aquí", dice Illuna por fin. "Son más caros que los anti-veneno, y solo sirven para ciertas enfermedades fáciles de curar, pero aun así, sería bastante patético que murieras por alguna enfermedad varathiana después de haber sobrevivido tanto tiempo al torneo."

              Le pago al tendero diez monedas de cobre por el elixir anti-veneno y una moneda de plata por el elixir contra enfermedades, y luego me los bebo ambos mientras todavía estoy dentro de la tienda. Illuna hace lo mismo con todas las pociones que ha comprado, y luego ambos salimos del edificio en dirección al centro del mercado, donde Hadrik y Daren nos esperan. Al acercarnos, noto que los dos están en medio de una discusión bastante acalorada sobre quién ganaría en un duelo entre Azarius, el Sabio del Oeste, y Talmak, el Sabio del Norte.

              "Escucha", le dice Hadrik a Daren cuando nos acercamos, "sé que Azarius puede lanzar un montón de hechizos. Ese no es el punto. Lo que digo es que, en términos de poder puro, Talmak está muy por encima del Sabio del Oeste. Además, ¡es un elementalista de tierra! ¿De qué sirve un montón de hechizos si al final va a aplastarte entre dos enormes capas de roca?"
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch06a_complex
