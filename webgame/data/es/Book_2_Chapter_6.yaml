            paragraph: 33
            text: |-
              Lo que busco en particular son ballestas de repetición que puedan disparar al menos cinco virotes antes de tener que recargarse, como la que estoy usando ahora mismo.

              Dos de las ballestas en exhibición me llaman la atención, y ambas son mucho mejores que la que tengo, pero una es bastante más cara que la otra. Con la cantidad de dinero que tengo ahora mismo, sinceramente no habría mucha diferencia si comprara una o la otra.

              La ventaja de la cara es que puedo usarla para disparar siete virotes antes de recargar, y además tiene mejor potencia, alcance y precisión. La versión más barata sigue siendo mejor que la ballesta que tengo en todos los sentidos, pero no se puede comparar de verdad con la cara, y solo puede disparar seis virotes antes de recargarse.

              Echo un último vistazo a la sección de armas a distancia para ver si no hay alguna otra ballesta de repetición que pudiera interesarme, pero la mayoría o no valen lo que cuestan o son peores que la que ya tengo. Supongo que, después de todo, voy a tener que elegir entre las dos ballestas que estaba mirando antes.
