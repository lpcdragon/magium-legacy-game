        texts:
          - source: scene_text
            paragraph: 25
            text: |-
              "Espera, ¿hay distintas razas en el plano mágico?"

              "No solo distintas razas", dice Arraka. "Son exactamente las mismas razas que tienen aquí en el plano terrenal. Incluidas las razas monstruosas y las razas animales, por supuesto. No es que tengamos cuerpos ni nada por el estilo, pero puedes distinguir nuestras razas por nuestras auras, igual que puedes hacerlo en este plano de existencia."

              "Espera", digo. "¿Eso significa que nuestros espíritus irán al plano mágico después de morir?"

              "Nah", dice Arraka. "Ustedes no tienen espíritus. Solo tienen almas. Cuando mueren, la materia etérea que compone su alma se descompone y se fusiona con el resto del plano etéreo. Lo mismo ocurre con las almas de los espíritus mágicos como nosotras. Es posible que las almas que se descomponen tras la muerte de alguien de algún modo se reciclen y luego se vinculen con un espíritu recién nacido del plano mágico, pero eso es solo una teoría. Ninguno de los espíritus del plano mágico tiene recuerdos de vidas pasadas en el plano terrenal ni nada por el estilo."

              "Entonces, eh...", digo. "Volviendo a tu exilio del plano mágico... ¿sabes por qué los dioses y los otros espíritus poderosos decidieron expulsar también a los demás espíritus femeninos y no solo a ti?"
          - source: scene_text_2
            paragraph: 22
            text: |-
              "Oh", dice Arraka, "es porque yo solo estaba absorbiendo espíritus femeninos de las llamadas 'razas civilizadas', lo que hizo que pensaran que las demás también encerraban algún peligro y que podían acabar como yo si las dejaban solas demasiado tiempo. En realidad, la única razón por la que absorbía solo este tipo de espíritus era que eran los únicos con auras lo bastante parecidas a la mía como para que yo pudiera absorberlos, dado que soy una elfa. No había nada especial en los espíritus que absorbía. El 'peligro' de que alguien desarrolle la misma técnica de absorción que yo sigue existiendo, incluso después de que nos expulsaran a todas, pero no esperaría que inventaran nada parecido pronto, porque son demasiado estúpidos como para idear por su cuenta un hechizo tan complejo."

              "Espera, ¿eres una elfa?" le pregunto.

              "¡Claro que soy una elfa!" dice Arraka. "¿Qué creías que era?"

              "Bueno, no lo sé", digo. "Siempre supuse que las banshees eran una raza aparte, y la verdad es que no le había dado muchas vueltas hasta ahora."

              "¡Las banshees no son una raza!" dice Arraka. "Es solo un nombre que nos dieron los lugareños después de que nos desterraran al plano terrenal. Puedes distinguir claramente cuáles son nuestras razas por nuestras auras. En serio, ¿qué tan malo es tu sentido mágico? Illuna también es una elfa, pero apuesto a que tampoco sabías eso, ¿verdad?"

              "¿Petal es una elfa?" pregunta Flower, sorprendida.
          - source: scene_3
            paragraph: 6
            text: |-
              "¿Por qué actúas tan sorprendida?" dice Illuna. "Tienes una imagen clara de cómo me veo dentro de tu propia mente. No me digas que esta es la primera vez que notas mis orejas puntiagudas en las últimas dos décadas..."

              "Oh, sí las había notado", dice Flower, "pero siempre pensé que esa era solo la manera en que te imaginaba, y que no tenía nada que ver con cómo te veías de verdad."

              "Entonces", digo, "¿me estás diciendo que las hemos tratado a las dos como si fueran parte de una raza monstruosa, pero todo este tiempo en realidad eran espíritus élficos?"

              "Sí, eso es exactamente lo que estamos diciendo", dice Illuna.

              "Nunca deja de sorprenderme lo malas que pueden ser estas personas para leer auras", dice Arraka. "No me extraña que después de tanto tiempo todavía no hayan descubierto por qué sus mujeres no pueden nacer como magas. Si ni siquiera pueden distinguir nuestras razas, no tienen ninguna posibilidad de averiguarlo por sí mismas."
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch06a_funnel
      - condition: b2_ch6_fox = 1
        texts:
          - source: scene_text
            paragraph: 26
            text: |-
              "¿La zorra proviene del plano mágico? Entonces, ¿cómo terminó aquí?"

              "¿Por qué no se lo preguntas tú mismo?" dice Arraka. "Ahora son amigos, ¿no?"

              "'Amigos' no es exactamente la palabra que usaría para describir nuestra relación con ella", digo.

              "Bueno, lo único que sé", dice Arraka, "es que incluso antes de que me expulsaran del plano mágico, la zorra parecía haberse interesado mucho por los animales que vivían aquí, en Varathia. Por alguna razón, eran mucho más inteligentes que los animales de los otros continentes, y por lo que he oído, la zorra siempre hablaba de lo injustamente que eran tratados estos animales de Varathia en el plano terrenal. No estoy segura de cuándo decidió venir aquí, pero, por lo que pude deducir, debió de hacer un pacto con todas las plantas y animales de la región para que se unieran en algún tipo de relación simbiótica que la ayudara a mantener un cuerpo físico, a cambio de ofrecerles protección. En realidad no sé mucho más que eso, porque estuve atrapada en una montaña mientras todo esto sucedía."

              "Entonces, eh...", digo. "Volviendo a tu exilio del plano mágico... ¿sabes por qué los dioses y los otros espíritus poderosos decidieron expulsar también a los demás espíritus femeninos y no solo a ti?"
