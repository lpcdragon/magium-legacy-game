    texts:
      - source: scene_text
        paragraph: 16
        text: |-
          "¿Hay algo que..." empiezo a decir, pero la chica me interrumpe.

          "¡Date la vuelta!" dice.

          Melindra no espera a que me dé la vuelta, y me agarra por los hombros para girarme ella misma. Tras unos segundos más de silencio, la chica stillwater por fin parece haber encontrado lo que buscaba y deja escapar un fuerte jadeo de asombro.

          "¿Qué?" le pregunto, mientras me vuelvo hacia ella. "¿Qué pasa?"

          "Eres un medio lessathi, ¿verdad?" dice Melindra, con una mezcla de sorpresa y entusiasmo en la voz. "¡Por eso tu aura me resultaba tan familiar! ¡Yo también soy medio lessathi! ¡Qué agradable es por fin conocer a alguien de mi propia raza después de tanto tiempo! Éramos miles antes del invierno inmóvil, pero desde entonces los lessathi se han vuelto mucho más estrictos con sus reglas, y tampoco quedan muchos de ellos, así que hoy en día casi no se ven medios lessathi."

          Hace una pausa.

          "Espera", dice. "¡Así que por eso Eiden se ha interesado por tu grupo!"

          "¿Qué quieres decir?" digo. "¿Qué tiene de especial que yo sea medio lessathi? ¿Tiene algo que ver con mi dispositivo de estadísticas?"

          "Oh, no", dice Melindra. "No con tu dispositivo de estadísticas."

          "Entonces, ¿con qué?" digo.

          "¡Seguro que tarde o temprano lo averiguarás!" dice Melindra.
      - source: scene_text_2
        paragraph: 15
        text: |-
          "A ustedes los stillwaters sí que les gusta hablar con acertijos, ¿no?" le pregunto.

          Melindra sonríe, pero no responde a mi pregunta retórica.

          "Aun así, me sorprende que hayas conseguido hacerte con un dispositivo de estadísticas", dice Melindra. "Yo también tenía curiosidad por ver qué efecto tendría un dispositivo de estadísticas en un torneo como este, con un aura de medio lessathi como la mía, así que intenté comprar uno antes de venir aquí, ¡pero no había ninguno a la venta en ninguno de los lugares donde busqué!"

          "¿En qué continente?" pregunto. "Yo compré el mío en el Continente Occidental. De donde yo vengo, puedes encontrar uno de estos prácticamente en cada esquina."

          "Yo también busqué en el Continente Occidental", dice Melindra. "En más de una ciudad. Todos los dueños de las tiendas me dijeron que se habían quedado sin existencias varias semanas antes de que intentara comprar uno."

          "Espera...", digo. "Ahora que lo pienso, yo también tuve un poco más de problemas de los que esperaba cuando intenté comprar mi potenciador de estadísticas. De hecho, tuve que visitar varias tiendas antes de encontrar uno, y eso fue hace más de un mes. Es más, recuerdo que muchos de los dueños de las tiendas se mostraban muy evasivos cuando les preguntaba cuándo repondrían existencias. Casi parecía que tenían miedo de hablar del tema. ¿Crees que esos comerciantes podrían haber mentido sobre sus existencias porque alguien los amenazó para que dejaran de vender esos dispositivos?"

          "¡Olvídate de eso!" dice Melindra. "¿Podrías prestarme tu dispositivo de estadísticas un momento? Tengo curiosidad por ver qué tan bien resuena con mi aura."
    choices:
