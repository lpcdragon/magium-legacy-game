  - name: b2_ch06a_loopholes
    texts:
      - source: scene_text
        paragraph: 46
        text: |-
          Parte de la furia va desapareciendo poco a poco de los ojos de Eiden mientras hablo, y ahora parece un poco más calmado que antes. También noto que lleva estirando el brazo derecho hacia un lado de vez en cuando desde que se detuvo frente a mí, pero no tengo ni idea de por qué.

          "Una de las ventajas de ser muy bueno leyendo auras", dice Eiden, "es que durante una conversación puedes saber en todo momento no solo si una persona está mintiendo, sino también si está vacilando de alguna manera, a partir de las fluctuaciones de su aura. El hecho de que no hayas mentido ni vacilado ni una sola vez durante todo el discurso que acabas de dar me resulta verdaderamente fascinante."

          Eiden se toma unos momentos para pensar sus siguientes palabras, mientras vuelve a estirar el brazo derecho hacia un lado.
      - source: scene_text_2
        paragraph: 38
        text: |-
          "Esto es lo que vamos a hacer", dice, mientras vuelve a cerrar los ojos y empieza a caminar lentamente de un lado a otro, recorriendo unos pocos pasos. "Lo quieras o no, este torneo va a obligarte a visitar cierta cantidad de ciudades. Ya sabes que vas a visitar Galamir y, dado que te has encontrado con Melindra, voy a asumir que también visitarás Ollendor dentro de poco. Puede que haya otras ciudades también, dependiendo de lo que los organizadores del torneo preparen para las próximas rondas. Voy a observar desde lejos lo que hagas en esas ciudades, para ver cuánto consigues cambiar en el poco tiempo del que dispondrás. Si te mantienes fiel a lo que dijiste hace un momento y de verdad logras hacer cambios radicales por tus propios medios, entonces yo mismo te daré el poder necesario para detener la calamidad que amenaza a esas ciudades, y después te dejaré moldear el destino de esos reinos como te parezca mejor. Si de verdad llega a darse este improbable escenario, entonces yo--"

          "¡Por los dioses!" grito, interrumpiéndolo. "¡Arraka tenía razón! No me lo puedo creer. ¡De verdad estás haciendo trampa!"

          "¿Perdón?" dice Eiden.
      - source: scene_3
        paragraph: 13
        text: |-
          "¡Acabo de darme cuenta de por qué has estado estirando el brazo derecho hacia un lado de vez en cuando desde que lanzaste ese hechizo de congelación del tiempo!" digo. "Y también de por qué has estado yendo de un lado a otro durante los últimos treinta segundos. Es por el mensaje de advertencia, ¿verdad? Yo también tuve acceso a ese mismo hechizo de congelación del tiempo cuando potenciaste mi dispositivo de estadísticas, así que todavía recuerdo cómo funciona. No se te permite alejarte más de unos pocos pasos de tu posición original, así que, si alguna parte de tu cuerpo sobrepasa cierto límite, recibes un mensaje de advertencia diciéndote que, si no retrocedes en los siguientes diez segundos, el hechizo se cancelará."

          "¿Y qué te hace pensar que activar esa advertencia me ayuda de algún modo?" me pregunta Eiden.

          "Te ayuda", digo, "porque quien diseñó ese hechizo nunca se tomó la molestia de tener en cuenta las advertencias reales al calcular su duración. Mientras no sobrepases demasiado el límite y retrocedas justo al final de la cuenta atrás de diez segundos, prácticamente puedes sumarle diez segundos más a la duración del hechizo cada vez que haces esto. Y como el límite de tiempo del hechizo fue añadido por diseño, por motivos de seguridad, y no por limitaciones técnicas, probablemente podrías alargar la duración de este hechizo casi indefinidamente, siempre que confíes lo suficiente en poder mantenerlo bajo control. Así que de eso era de lo que Arraka y Tyrath hablaban todo este tiempo, cuando decían que estabas usando trucos. No es que no necesites obedecer las leyes de la magia porque seas demasiado poderoso. Lo que haces es aprovechar vacíos legales para saltarte las reglas, y haces que parezca que todo fue gracias a tu poder desde el principio. ¡Te estás aprovechando de vacíos legales!"
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch06a_formidable
  - name: b2_ch06a_formidable
    texts:
      - source: scene_text
        paragraph: 47
        text: |-
          "Aunque te reconozco el mérito de haber averiguado todo esto por ti solo", dice Eiden, "la verdad es que no veo cómo podría servirte de ayuda para--"

          "Con Daren fue igual, ¿verdad?" digo. "¡Aquella vez que lo dormiste a pesar de todas sus protecciones también fue porque explotaste algún tecnicismo, y no porque tu hechizo ignorara todas las leyes de la magia!"

          "¿Ah, sí?" pregunta Eiden, alzando las cejas con los ojos cerrados. "¿Y qué tecnicismo podría ser ese?"

          Tras quedarme pensando unos segundos, la respuesta de repente se me viene a la cabeza, como si fuera lo más obvio del mundo.

          "Sobrecarga de protecciones..." digo, mientras veo que la expresión de Eiden cambia un poco, incluso con los ojos cerrados. "Eso es, ¿verdad? He oído que eso solo les pasa a magos muy hábiles que se exceden lanzándose protecciones, sin tener en cuenta que algunos de esos hechizos en realidad pueden hacer más mal que bien porque entran en conflicto entre sí. Si no tienes cuidado, podrías acabar generando pequeñas aberturas en tus defensas que alguien con habilidad para leer el flujo de las auras podría explotar con facilidad. Puedo imaginarme perfectamente a Daren cometiendo un error así."
      - source: scene_text_2
        paragraph: 39
        text: |-
          "¡Extraordinario!" dice Eiden, recuperando la sonrisa. "He usado ese truco incontables veces contra muchos enemigos formidables en el pasado y, aun así, nadie había logrado descubrirlo hasta ahora. Sin embargo, sigo sin ver cómo esto podría ayudarte a ti y a tu grupo si alguna vez llegaran a enfrentarse a mí en serio. Dejando a un lado el hecho de que he tenido cientos de años para aprender estos tecnicismos, aunque lograran aprenderlos todos, mi nivel de poder mágico sigue estando muy por encima del de la mayoría de los seres de esta isla, con muy pocas excepciones. Yo diría que ahora no estás en mejor situación que cuando me conociste por primera vez el segundo día del torneo."

          "Sí lo estoy", digo. "Porque ahora sé que no eres invencible. Si tuviste que aprender todos estos trucos, entonces eso significa que tu poder por sí solo no te bastaba para ganar todas tus batallas. Significa que tienes debilidades. Y si tienes debilidades, puedes ser derrotado."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch06a_accomplish
  - name: b2_ch06a_accomplish
    texts:
      - source: scene_text
        paragraph: 48
        text: |-
          Eiden se echa a reír.

          "Así que aspiras no solo a lograr lo que yo no pude conseguir en toda una vida", dice, "sino también a derrotarme algún día en una batalla de verdad. Y yo que pensaba que no tendría nada interesante que hacer hasta que termine este torneo."

          Hace una pausa.

          "¡Muy bien!" dice Eiden. "En ese caso, esperaré con interés tus progresos. Y también observaré lo que hagas dentro de las ciudades, como dije antes. Ahora bien, ¿tienes alguna otra pregunta antes de que me marche?"

          "Solo una", digo. "¿Qué es el Magium?"

          Eiden sonríe.

          "No pensarías en serio que iba a responderte esa pregunta tan fácilmente, ¿no?" dice.

          "No", digo, "pero tenía que intentarlo."
      - source: scene_text_2
        paragraph: 40
        text: |-
          Eiden me dedica una última sonrisa con los ojos cerrados y luego se teletransporta fuera de mi vista. En cuanto desaparece, el hechizo de congelación del tiempo se cancela, y mis amigos empiezan a mirar a su alrededor, confundidos, intentando averiguar adónde fue Eiden.

          "Así que Eiden se ha ido..." dice Daren al cabo de un rato. "Y Barry es el único que no parece sorprendido por este giro repentino de los acontecimientos. ¿Hay algo que quieras contarnos, Barry?"

          "Daren..." digo. "Estoy seguro de que tienes muchas preguntas y te las responderé dentro de un momento, pero antes voy a necesitar que hagas algo por mí."

          "¿Qué es?" pregunta Daren.

          "Saca pluma y papel de tu mochila", digo, "y anota todos los hechizos de protección que lanzaste sobre ti mismo durante nuestro segundo día en Varathia. Tenemos trabajo que hacer."
