            paragraph: 14
            text: |-
              Daren mueve la mano sobre la espada una vez más, confirmando el segundo juramento de Melindra. La luz de su espada empieza entonces a desvanecerse lentamente, hasta que el arma vuelve a la normalidad.

              "¿Eso es todo?" pregunta Melindra. "¿Ya terminamos?"

              "Sí", dice Daren. "El juramento ya quedó sellado."

              "¡Perfecto!" dice Melindra, recuperando la sonrisa. "Entonces supongo que tu equipo estará formado por ti, la maga de hielo, la chica con la banshee, el gigante que usa cambio de forma para hacerse pasar por enano, y..."

              Melindra se detiene de repente, justo cuando estaba a punto de señalarme, y luego se queda mirándome sin decir nada.

              "¿El enano era un gigante?..." escribe Leila, sorprendida, pero todos estamos demasiado centrados en la chica stillwater como para prestar atención a lo que escribe.

              Melindra empieza a acercarse a mí, con las cejas fruncidas por la concentración, y se detiene a menos de treinta centímetros de mí, examinándome de cerca.

              "Hmm..." dice Melindra, con gesto pensativo, mientras me examina de pies a cabeza.
          - source: scene_text_2
            paragraph: 13
            text: |-
              Al ver a la chica de cerca, no puedo evitar notar que tiene una cara bastante bonita, que se ve muy favorecida por su cabello castaño claro, recogido en una coleta alta. La ropa parecida a un pijama que lleva puesta a plena luz del día puede verse un poco ridícula a primera vista, pero, a diferencia de la ropa de Eiden, la que lleva Melindra parece haber sido elegida con algo más de cuidado desde un punto de vista estético. Además, a diferencia de unos pijamas normales, aunque esta ropa sin duda parece cómoda para moverse, también da la impresión de haber sido diseñada para ajustarse de una manera que resalta su figura esbelta y la forma de su busto.

              "Hmm..." dice Melindra otra vez, esta vez acercando mucho más su rostro al mío, con la misma mirada pensativa, mientras se acaricia la barbilla con la mano derecha.
