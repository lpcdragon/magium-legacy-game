  - name: b2_ch06a_calamity
    routes:
      - condition: b2_ch1_interfere = 0
        texts:
          - source: scene_text
            paragraph: 41
            text: |-
              "¿Otra vez?" le pregunta Daren a Eiden. "¡Por todos los dioses! ¿Qué hará falta para que dejes de seguirnos a todas partes?"

              "No hace falta ser tan grosero", dice Eiden. "Sobre todo cuando he venido hasta aquí solo para felicitarlos por su magnífica actuación en la arena."

              "Ajá", dice Hadrik, sin parecer muy convencido. "¿Seguro que esa es la única razón por la que viniste?"

              "Ahora que lo mencionas, ¡había otra razón!" dice Eiden. "Verán, no pude evitar notar que la dirección en la que se han dirigido desde que salieron de la arena lleva directamente al castillo de Thilias. No me digan que van hacia allá porque el rey Golmyck les encargó algún tipo de misión, ¿verdad?"

              "¿De qué estás hablando?" dice Daren. "Solo vamos al palacio a recoger unos papeles."

              "¿Ah, sí?" dice Eiden, algo sorprendido. "Bueno, entonces solo quería hacerles saber que si resulta que el rey les encarga una misión relacionada de alguna manera con el bienestar de los ciudadanos de Thilias, no deberían molestarse en cumplirla."

              "¿Por qué no?" dice Daren.

              "Porque la ciudad de Thilias no seguirá en pie por mucho tiempo", dice Eiden. "Y, ya puestos, tampoco ninguna de las demás ciudades de Varathia."

              "Espera, qué..." dice Daren, pero le cuesta continuar la frase. "¿Qué estás diciendo?..."
          - source: scene_text_2
            paragraph: 34
            text: |-
              "Lo que digo es que poco antes del final de este torneo", dice Eiden, "habrá una calamidad de tal magnitud que erradicará por completo todas y cada una de las ciudades de esta isla al mismo tiempo."

              "¿Y me estás diciendo que vas a quedarte de brazos cruzados viendo cómo ocurre?" pregunta Daren, horrorizado. "¿Qué te pasa? ¿No se supone que eres el creador de este continente?"

              "En realidad, esa es una idea equivocada bastante común", dice Eiden. "Aunque la gente de estas tierras me llame el Creador, la isla de Varathia lleva existiendo mucho más tiempo del que yo llevo vivo. La única razón por la que la gente empezó a llamarme el Creador hace tantos años fue porque querían que alguien reemplazara al antiguo Creador, para simbolizar el comienzo de una nueva era, y me eligieron a mí para asumir ese papel porque fui prácticamente el fundador de la nueva civilización que surgió tras el invierno inmóvil, junto con el zorro dorado. Ah, y creo que quizá hayas malinterpretado un poco lo que dije antes. De ningún modo voy a quedarme de brazos cruzados mientras ocurre esta calamidad. De hecho, la erradicación de estas ciudades ocurrirá como resultado directo de mis propias acciones."
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch06a_tantrum
      - condition: b2_ch1_interfere = 1
        texts:
          - source: scene_text
            paragraph: 42
            text: |-
              "¿Otra vez?" le pregunta Daren a Eiden. "¡Por todos los dioses! ¿Qué hará falta para que dejes de seguirnos a todas partes?"

              "No hace falta ser tan grosero", dice Eiden. "Sobre todo cuando he venido hasta aquí solo para felicitarlos por su magnífica actuación en la arena."

              "Ajá", dice Hadrik, sin parecer muy convencido. "¿Seguro que esa es la única razón por la que viniste?"

              "Ahora que lo mencionas, ¡había otra razón!" dice Eiden. "Verán, no pude evitar notar que la dirección en la que se han dirigido desde que salieron de la arena lleva directamente al castillo de Thilias. No me digan que van hacia allá porque el rey Golmyck les encargó algún tipo de misión, ¿verdad?"

              "¿De qué estás hablando?" dice Daren, fingiendo ignorancia. "Solo vamos al palacio a recoger unos papeles."

              "¿Ah, sí?" dice Eiden, con un tono que deja claro que no le cree en absoluto. "Bueno, en cualquier caso, solo quería hacerles saber que si resulta que el rey les encarga una misión relacionada de alguna manera con el bienestar de los ciudadanos de Thilias, no deberían molestarse en cumplirla."

              Daren frunce el ceño. "¿Por qué no?" dice Daren.

              "Porque la ciudad de Thilias no seguirá en pie por mucho tiempo", dice Eiden. "Y, ya puestos, tampoco ninguna de las demás ciudades de Varathia."

              "Espera, qué..." dice Daren, pero le cuesta continuar la frase. "¿Qué estás diciendo?..."
