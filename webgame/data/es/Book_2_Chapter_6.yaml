  - name: b2_ch06a_talkative
    texts:
      - source: scene_text
        paragraph: 31
        text: |-
          "¿Por qué actúas como si estuvieras tan decepcionado?" dice Daren. "No es como si alguna vez hubieras tenido la intención de ganar el Magium. Ya nos dijiste que solo estás aquí por el desafío."

          "Bueno, sí", dice Hadrik, "¡pero imagina las historias que podríamos contar si lográramos ponerle las manos encima al Magium antes de que termine el torneo!"

          "No va a pasar", dice Daren. "Aunque averigüemos qué es, seguramente está demasiado bien protegido o demasiado bien escondido como para que podamos hacer algo al respecto. Deberíamos centrarnos en nuestros objetivos y no en intentar engañar al sistema. Vamos, sigamos caminando. Todavía tenemos que hacer unas compras antes de ir a ver al rey."

          Mientras seguimos avanzando hacia el castillo, notamos que Leila y Kate van caminando lado a lado, pero apenas han intercambiado palabra desde que salimos de la arena. Al cabo de un rato, Daren me lleva hacia la parte de atrás del grupo, donde él y Hadrik caminan a un paso más lento, y me hace una pregunta en voz baja.

          "Oye, Barry", dice Daren, "corrígeme si me equivoco, pero se supone que Kate y la chica de pelo blanco eran amigas de la infancia o algo así, ¿no?"

          "Más o menos", digo. "Las dos crecieron en el Faro, pero por lo que he oído, Leila estaba más aislada del resto del grupo por ser lessathi."

          "Aun así", dice Daren, "si se conocen desde hace tanto tiempo, ¿no crees que deberían tener un poco más de tema de conversación? Quizá podríamos darles un pequeño empujón o algo. Ya sabes, ayudarlas un poco a superar la incomodidad inicial."
      - source: scene_text_2
        paragraph: 27
        text: |-
          "Yo digo que esperemos un poco más", le digo a Daren. "Ninguna de las dos es precisamente muy habladora, y encima Leila es muda. Deberíamos darles un poco más de tiempo para que se sientan cómodas la una con la otra antes de entrometernos."

          "¿Sabes qué estaba pensando?" me dice Hadrik. "Si Leila es lessathi, ¿no deberías darle el mensaje de Eiden? El del invierno inmóvil."

          "¡Oye, tienes razón!" le digo. "¡Se lo diré ahora mismo!"

          "Barry..." empieza a decir Daren, pero lo ignoro y llamo a Leila.

          "¡Eh, Leila!" grito.

          "¿Sí?..." escribe Leila, mientras se vuelve para mirarme.

          "Tengo un mensaje de Eiden", digo.

          "¿Eiden?" escribe Leila. "¿Te refieres al stillwater que amenazó al dragón en la arena?"

          "¡Sí, ese mismo!" digo. "¡Dice que recuerdes el invierno inmóvil!"
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch06a_message
  - name: b2_ch06a_message
    routes:
      - condition: b2_ch5_scimitar = 2
        texts:
          - source: scene_text
            paragraph: 32
            text: |-
              "Eh... ¿de acuerdo?" escribe Leila, viéndose muy confundida.

              "No le hagas caso, Leila", dice Kate. "Barry solo está haciendo el idiota otra vez."

              Leila se da la vuelta entonces, y Kate empieza a explicarle los detalles sobre Eiden y lo que significaba mi mensaje.

              "¡Maldita sea, Barry!" dice Daren en voz baja. "¿No crees que deberías tomarte este asunto del mensaje un poco más en serio? La última vez que Eiden lo mencionó, casi morimos por eso."

              "Relájate", le susurro a Daren. "Mi trato con Eiden ya quedó cancelado. Se suponía que debía entregarle su mensaje al primer lessathi que me encontrara, ¿recuerdas? Los primeros lessathi con los que me crucé fueron los amigos de Diane. La razón por la que Eiden casi nos mata fue precisamente porque no cumplí mi parte del trato. El hecho de que lo superara tan rápido y de que nunca llegara a matarnos demuestra que en realidad nunca le importó ese trato para empezar. Si de verdad hubiera querido que ese mensaje fuera entregado, podría haberse teletransportado junto a los lessathi y habérselo dicho él mismo, teniendo en cuenta que ya había reconocido sus auras a distancia cuando me los encontré. Siendo realistas, Eiden probablemente ya se olvidó de ese mensaje y no volverá a mencionárnoslo."

              "Espero que tengas razón...", dice Daren.

              "En cualquier caso", digo, "mi broma de antes no la hice porque sí. ¡Mira!"

              Entonces señalo hacia Kate y Leila, que siguen conversando, salvo que el tema de su charla parece haber pasado de Eiden y sus planes a lo idiota que soy yo.
          - source: scene_text_2
            paragraph: 28
            text: |-
              "¿Ves?" le digo a Daren en voz baja. "¡Ahora ya tienen algo de qué hablar!"

              Media hora después de nuestra conversación, llegamos al primer mercado que encontramos de camino al castillo. Decidimos separarnos en grupos y volver a reunirnos en el centro del mercado cuando cada uno termine de hacer sus compras. Mientras Kate va con Leila para ayudarla a comprar ropa nueva y una mochila, Daren y yo nos dirigimos a la tienda de armas para que yo pueda comprarme una ballesta nueva y para que Daren compre una nueva piedra de afilar mágica. Mientras tanto, Flower e Illuna van a comprar pociones, mientras que Hadrik, que no necesita comprar nada en particular, va directamente hacia el centro del mercado a esperarnos.

              Antes de entrar en la tienda, le enseño a Daren mis cimitarras y le pregunto si podría decirme qué encantamientos tienen y si podría calcular su valor de mercado.

              "Mmm...", dice Daren. "Estas dos parecen tener los mismos dos encantamientos. Afilado y durabilidad. Sin embargo, los encantamientos se hicieron casi exclusivamente con acero élfico, y la calidad de fabricación de las armas también es alta. Si yo fuera tú, no vendería una de estas por menos de cincuenta monedas de oro occidentales."
          - source: scene_3
            paragraph: 9
            text: Una vez dentro de la tienda de armas, lo primero que hago es acercarme al tendero para hablarle de mis cimitarras. Hace falta un poco de regateo, pero al final logro convencerlo de que me compre una de las dos armas por setenta monedas de oro, mientras me quedo la otra para mí. En cuanto termino con la venta, voy de inmediato a la sección de ballestas para ver si encuentro algo que se adapte a lo que necesito.
