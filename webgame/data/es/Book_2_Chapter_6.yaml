  - name: b2_ch06a_shopping
    texts:
      - source: scene_text
        paragraph: 20
        text: |-
          "¿Podrías...?" empieza a escribir Leila, pero hace una pausa durante unos segundos.

          "¿Podrías decirme si yo también soy medio lessathi?" continúa Leila.

          "¿Medio lessathi?" pregunta Melindra, sorprendida.

          Se acerca a Leila y frunce el ceño, igual que hizo conmigo antes.

          "Mmm..." dice Melindra, mientras la estudia durante unos segundos. "No, definitivamente no eres medio lessathi. Es un aura lessathi normal, la mire por donde la mire."

          "Ya veo..." escribe Leila, con una leve sonrisa en el rostro. "¡Gracias por tu respuesta!"

          Al ver su sonrisa aliviada, de repente recuerdo la historia que me contó sobre los lessathi de su juventud que la trataban como si fuera una paria por ser muda y que la acusaban de ser medio lessathi debido a su discapacidad. Parece que las calumnias de esa gente la habían afectado mucho más de lo que había dejado ver hasta ahora.

          "Bueno", dice Melindra, volviéndose hacia el resto de nosotros, "creo que hemos terminado por hoy. Si nadie más tiene objeciones, me gustaría mucho que empezáramos nuestro viaje mañana, al amanecer."

          "En realidad", dice Daren, "todavía necesitamos conseguir unos documentos del rey antes de poder salir de la ciudad. Iremos a verlo más tarde hoy, pero no es seguro que los tenga listos para cuando lleguemos. ¡Espera!"
      - source: scene_text_2
        paragraph: 18
        text: |-
          Daren se quita la mochila y saca de ella un transceptor, que luego le entrega a Melindra.

          "Nos pondremos en contacto contigo a través de este transceptor por si cambian nuestros planes", dice Daren. "No te preocupes por el alcance. Está encantado para cubrir distancias muy largas, así que podremos comunicarnos contigo sin importar en qué parte de la ciudad estés."

          "De acuerdo, entonces", dice Melindra, mientras se guarda el transceptor en uno de los bolsillos. "Si no cambia nada, nos veremos en la puerta norte de la ciudad apenas salga el sol. De todos modos tendremos que dirigirnos al norte para llegar a Ollendor, así que lo mejor será encontrarnos en la puerta que queda más cerca de nuestro destino."

          "Suena bien", dice Daren.

          "¡Los veré a todos mañana!" dice Melindra, con una sonrisa, y luego sigue su camino.

          "¡Maldición!" digo mientras la veo alejarse. "Todavía no nos dijo cómo alguien puede convertirse en un stillwater."

          "A partir de mañana tendrás todo el tiempo que necesites para hacerle esa pregunta", dice Daren. "Vamos a viajar juntos por un tiempo, ¿recuerdas?"

          "Ah, cierto..." digo.

          "En cualquier caso", dice Daren, "probablemente deberíamos ir al palacio. El rey parecía bastante ocupado y no estoy seguro de cuánto tiempo nos estará esperando."
      - source: scene_3
        paragraph: 4
        text: |-
          "Me dijo que deberíamos esperar alrededor de una hora antes de dirigirnos al palacio", digo, "porque todavía tenía que arreglar unas cuantas cosas con su ejército. Sugiero que vayamos de compras mientras tanto. Vi bastantes tiendas mientras caminábamos entre el palacio y la arena, y realmente no vamos a tener otra oportunidad de comprar cosas en mucho tiempo después de salir de Thilias."

          "Sí, probablemente sea lo mejor", dice Daren.
