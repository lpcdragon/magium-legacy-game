              Una vez dentro de la tienda de armas, lo primero que hago es preguntarle al tendero dónde guarda las ballestas, y luego me acerco a la sección de armas a distancia para ver si encuentro algo que se adapte a lo que necesito.
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch06a_crossbow
  - name: b2_ch06a_crossbow
    routes:
