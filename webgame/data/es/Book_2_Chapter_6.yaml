          "Entonces, ¿por qué lo hizo, si no son sus amigos?" dice Melindra.

          "Parece que conoces a Eiden desde hace tiempo", dice Kate. "¿De verdad crees que necesita una razón lógica para todo lo que hace? O, en realidad, para cualquier cosa?"

          "Bueno..." dice Melindra. "Quiero decir... últimamente no... pero si de verdad no son sus amigos, debo decir que me sorprende bastante que los haya dejado con vida..."

          "¿Y quién no?" dice Kate.

          "Entonces, ¿qué era lo que querías pedirnos?" dice Daren.
