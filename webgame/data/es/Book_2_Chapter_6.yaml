        texts:
          - source: scene_text
            paragraph: 21
            text: |-
              "Bueno", dice Enrique, "ya que quedó decidido que pasarán la noche en Thilias, supongo que ya no habrá objeciones a la celebración de esta noche, ¿verdad?"

              Daren suspira.

              "Haz lo que quieras", dice.

              "¡Perfecto!" dice Enrique. "Conozco a algunos de los mejores cocineros de Thilias, y todavía quedan muchas botellas de vino caro en la bodega. ¡Esta noche tendremos un festín que hará quedar en ridículo a los banquetes reales del rey!"

              "Solo procura no excederte", dice Daren. "Nos iremos antes del amanecer, así que no podemos permitirnos quedarnos despiertos hasta muy tarde."

              Después de despedirnos de Enrique con la mano, empezamos a dirigirnos hacia el castillo de Thilias a paso tranquilo. Apenas nos ponemos en marcha, Arraka vuelve a emitir sonidos ahogados desde el interior de su amuleto.

              "¿Qué pasa, Arraka?..." dice Flower, mientras abre el amuleto.

              "¡No puedo creer el descaro de esa chica!" grita Arraka, con la voz sonando otra vez como tres voces separadas hablando al mismo tiempo. "¿Vieron lo que hizo? ¡Simplemente cerró mi amuleto sin ni siquiera decir 'hola'! ¿Esa es forma de comportarse con alguien a quien conoces desde hace cientos de años?"
          - source: scene_text_2
            paragraph: 19
            text: |-
              "Sabes, siempre he querido preguntarte algo", le digo a Arraka. "¿Qué pasa con esa voz tuya? La mayor parte del tiempo suena normal, pero hay veces en que suena como si fueran tres voces hablando al mismo tiempo. ¿Eso es lo que les pasa a las banshees cuando envejecen?"

              "Oh, no, no tiene nada que ver con la edad", dice Arraka. "Esas otras dos voces pertenecen a los dos primeros espíritus que absorbí cuando todavía estaba en el plano mágico. Eh... Elkira y Rinaru, creo... Ya pasó demasiado tiempo. Ya no recuerdo sus nombres con tanta claridad."

              "¿Los dos primeros espíritus?" digo. "¿Quieres decir que absorbiste a más de dos espíritus mientras estabas en el plano mágico?"

              "Oh, sí, absorbí a cientos de ellos", dice Arraka. "El método que usé para absorber a otros espíritus todavía era experimental cuando lo usé con Elkira y Rinaru, por eso sus voces siguen apareciendo de vez en cuando, incluso después de todos esos miles de años. Sin embargo, no volví a tener problemas al absorber a todos los demás espíritus."

              "Pero, ¿los otros espíritus no intentaron detenerte?" le pregunto.

              "Por supuesto que sí", dice Arraka. "Pero yo solo me hacía más fuerte con cada espíritu que absorbía, y para cuando los espíritus realmente poderosos se dieron cuenta de lo que estaba haciendo, yo ya era demasiado para ellos."
