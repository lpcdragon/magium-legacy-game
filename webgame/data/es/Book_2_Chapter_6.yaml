        effects:
          - set:
              current_scene: b2_ch06a_assassins
  - name: b2_ch06a_assassins
    texts:
      - source: scene_text
        paragraph: 6
        text: |-
          "¡Ah, cierto!" dice Melindra, recuperando la sonrisa. "En resumen, ¡quiero que maten a alguien por mí!"

          "¡Eh, eh, eh!" dice Daren. "Voy a detenerte ahí mismo, Melindra. A pesar de lo que hayas oído sobre nosotros, ninguno de nosotros es un asesino. No matamos gente a menos que tengamos muy buenas razones para hacerlo. No vamos a matar a alguien solo porque tú nos lo pidas."

          "¡Oh, pero no les estoy pidiendo que lo hagan gratis!" dice Melindra. "¡Estoy más que dispuesta a compensarlos por esta tarea!"

          "No estamos buscando dinero", dice Daren. "Estamos aquí para participar en un torneo de magos, ¿recuerdas?"

          "¡Lo sé!" dice Melindra. "Cuando hablaba de compensación, quería decir que los ayudaría con sus objetivos. ¿No quieren saber cómo encontrar las piñas?"

          "¿Y por qué necesitaríamos tu ayuda para eso?" dice Daren. "Solo son unas piñas. ¿Qué tan difícil podría ser encontrarlas?"

          Melindra le dedica una sonrisa burlona a Daren y saca del bolsillo lo que parece ser una semilla de piña. Luego coloca la semilla en la palma de su mano, y esta empieza de inmediato a brillar con una luz amarilla intensa, justo como dijo Golmyck cuando anunció nuestros primeros objetivos. Después extiende la mano hacia Daren, invitándolo a tomar la semilla de piña.
      - source: scene_text_2
        paragraph: 6
        text: |-
          "Adelante", dice Melindra, sonriendo. "¡Tómala! Pronto entenderás por qué vas a necesitar mi ayuda."

          Cuando Daren toma la semilla de la mano de la chica stillwater, el intenso resplandor amarillo se desvanece por completo, y la semilla no vuelve a brillar por más que Daren la haga rodar entre las palmas de sus manos.

          "Como pueden ver", dice Melindra, con una sonrisa victoriosa, "las semillas de una piña luminosa no brillan para cualquiera. Solo resuenan con auras que contienen una cantidad extremadamente alta de poder mágico. Si hablamos de concursantes del torneo de magos, dudo que alguien que no sea uno de los cuatro sabios tenga suficiente poder mágico como para hacer que una piña empiece a brillar en sus manos. Necesitarían pura suerte ciega para encontrar una piña luminosa si ni siquiera pueden hacerlas brillar al tocarlas. Si no me creen, pueden pasarse esa semilla entre ustedes. Les garantizo que ninguno podrá hacerla brillar."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch06a_venture
  - name: b2_ch06a_venture
    texts:
      - source: scene_text
        paragraph: 7
        text: |-
          Hacemos lo que dice y nos vamos pasando la semilla de piña entre nosotros para ver si alguien es capaz de hacerla brillar. Por desgracia, parece que Melindra tenía razón, y ninguno de nosotros se acerca ni de lejos al nivel de poder mágico necesario para hacer que la semilla brille.

          "Entonces", dice Daren, mientras le devuelve a Melindra su semilla de piña, "¿debo entender que lo que nos ofrecerás a cambio del asesinato será una de esas piñas luminosas?"

          "Oh, no, no, no", dice Melindra. "Nunca conseguí hacerme con una piña. Tuve la suerte de encontrar unas cuantas semillas en el suelo, cerca del borde de un bosque sagrado, mientras venía hacia aquí. No me atrevería a adentrarme más en uno de esos bosques para buscar una piña de verdad. ¡El zorro dorado me odia a muerte!"

          "Espera", digo. "¿Por qué un bosque sagrado? ¿No podrías conseguirla en otra parte?"

          "No puedes conseguir piñas luminosas en ninguna otra parte", dice Melindra. "Solo crecen en los bosques sagrados, y todos ellos son territorio del zorro dorado."
      - source: scene_text_2
        paragraph: 7
        text: |-
          "¡Oh, no!" grita Hadrik. "¡Ni hablar! ¡Acabamos de salir de allí hace apenas unos días, y ahora tenemos que volver! ¿Qué les pasa a estos organizadores? ¡Es como si no quisieran que nadie gane de verdad este maldito torneo!"

          "Entonces", dice Kate, "si no vas a darnos una piña y tampoco te ofreces a guiarnos por los bosques sagrados, ¿qué es exactamente lo que intentas ofrecernos?"

          "¡Información!" dice Melindra, sonriendo. "Hay un dispositivo creado específicamente para resonar con estas piñas, y puede hacer que brillen sin requerir una gran cantidad de poder mágico, siempre que quien lo use esté lo bastante cerca de ellas. Es un dispositivo muy raro, pero conozco a alguien que lo tiene, y puedo llevarlos hasta esa persona después de que me ayuden con mi objetivo. No puedo decirles quién es esa persona, pero estoy bastante segura de que puedo conseguir que se los preste durante unos días, lo cual debería ser más que suficiente para que encuentren una piña."
    choices:
      - position: 1
        text: ¿Por qué no puedes decirnos quién es esa persona? ¿Es alguien que conocemos?
        effects:
          - set:
              current_scene: b2_ch06a_ollendor
              b2_ch6_person: 1
      - position: 2
        text: ¿Por qué iba a prestarnos gratis un dispositivo tan raro?
        effects:
          - set:
              current_scene: b2_ch06a_ollendor
              b2_ch6_person: 0
  - name: b2_ch06a_ollendor
    routes:
      - condition: b2_ch6_person = 1
        texts:
          - source: scene_text
            paragraph: 8
            text: |-
              "¿Por qué no puedes decirnos quién es esa persona? ¿Es alguien que conocemos?"

              "Dudo mucho que alguno de ustedes haya conocido a esa persona antes", dice Melindra. "La razón por la que no puedo revelar su identidad es que me pidió específicamente que la mantuviera en secreto, si alguna vez necesitaba mencionarla en una conversación. Yo no le daría tantas vueltas, si fuera ustedes. Simplemente es del tipo reservado. No hay nada más que eso."

              "Ya veo..." digo.

              "Entonces, ¿tenemos un trato?" nos pregunta Melindra.

              "Lo siento, Melindra", dice Daren, "pero no puedo ir por ahí asesinando gente para promover mis propios objetivos. Aunque mi objetivo final sea ayudar al mundo entero, no puedo matar a un hombre simplemente porque tú quieras verlo muerto."

              "¿Así que lo que buscas es una justificación moral?" pregunta Melindra, con una mirada curiosa. "Bueno, ¿y si te digo que la persona a la que quiero que asesinen es un tirano que ha matado a miles de inocentes y que gobierna su reino por medio del miedo y la intimidación? ¿Eso ayudaría a hacerte cambiar de idea?"

              "¿De quién estás hablando exactamente?" pregunta Kate.

              "¡Pues del hermano del hombre al que acaban de matar hace apenas unos días!" dice Melindra. "Del rey de Ollendor."
          - source: scene_text_2
            paragraph: 8
            text: |-
              "¿Quieres que asesinemos a uno de los reyes de Varathia?" pregunta Hadrik, horrorizado. "¿Te volviste loca? Nos metieron en una arena solo por matar a un noble, ¿y ahora quieres que matemos a un rey?"

              "Oh, no te preocupes", dice Melindra. "Ollendor nunca participó en la organización de este torneo. Nadie quiere saber nada de ellos. Hasta Golmyck es menos odiado por los otros reyes que el rey de Ollendor. Les aseguro que ninguno de los organizadores se inmutaría si armaran un alboroto en su reino. La única razón por la que los amenazaron con descalificarlos del torneo de magos después de matar al conde de Ollendor fue que estaban dentro de las fronteras de Thilias cuando lo asesinaron. Si empezaran a sembrar el caos en Ollendor, dudo mucho que a alguien le importara un comino. Bueno, salvo a las autoridades locales, claro."

              "Eh... no estoy seguro de qué decir sobre esto", digo.

              "Está diciendo la verdad", escribe Leila. "Ollendor es una especie de reino paria hoy en día. Ni los lessathi ni los demás reyes tienen ya influencia sobre lo que ocurre dentro de sus fronteras. Prácticamente todo el mundo los ignora, y muchos de los reinos ya expulsaron a sus embajadores de sus territorios. Por eso mi padre fue allí, después de escapar de Thilias. Porque es un reino donde nadie podría encontrarlo."
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch06a_motives
      - condition: b2_ch6_person = 0
        texts:
          - source: scene_text
            paragraph: 9
            text: |-
