              "¡Está bien!" dice Melindra, con un puchero. "¡De todos modos no necesitaba tu dispositivo!"

              "Perdona", escribe Leila, tirando suavemente de la manga de Melindra.

              "¿Sí?" dice Melindra, mirando a Leila con curiosidad.

              "Tengo una pregunta", escribe Leila. "¿Eres capaz de distinguir entre lessathi y medios lessathi solo por la sensación de su aura?"

              "Sí", dice Melindra. "He conocido a suficientes medios lessathi a lo largo de mi vida como para poder hacer la distinción. Eso sí, necesitas un sentido mágico bastante agudo para notar la diferencia."
