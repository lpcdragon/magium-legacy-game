  - name: b2_ch06a_range
    routes:
      - condition: ch11_difference <> 1
        texts:
          - source: scene_text
            paragraph: 44
            text: |-
              Reconozco este hechizo. Es el mismo que uno de los hechizos a los que tuve acceso cuando luchaba contra Tyrath con mi dispositivo de estadísticas potenciado. Si consigo caminar lo bastante lejos en una dirección, el hechizo se cancelará de inmediato, y Eiden no podrá volver a lanzarlo durante el resto del día.

              Intento saltar hacia atrás, pero de repente me doy cuenta de que hay una pared invisible detrás de mí que me bloquea el paso. Eiden, que ahora está a apenas un pie de mí, me mira con los ojos abiertos y una expresión muy sombría en el rostro.

              "¿Qué ocurre, Barry?" dice Eiden, con un tono calmado pero amenazante. "¿No dijiste que yo era el cobarde? ¿Por qué intentas huir?"

              "No estaba huyendo a ninguna parte", digo. "Solo intentaba cancelar tu hechizo."

              "Sabes..." dice Eiden. "Ya hacía muchísimo tiempo que nadie me hacía enfadar tanto. Tengo que reconocértelo, Barry. Tienes un talento muy particular para sacar a la gente de quicio. Dime, ¿disfrutas arriesgando la vida en cada oportunidad que se te presenta? ¿De verdad tienes tantas ganas de morir?"

              "No me vas a matar", digo.

              "¿Por qué no?" dice Eiden.

              "Porque, en el fondo, sabes que tengo razón", digo. "Todo lo que dije sobre ti era cierto. Si no, no te habrías enfadado tanto por ello. Matarme ahora solo serviría para darme la razón, y eso es lo último que quieres."
          - source: scene_text_2
            paragraph: 36
            text: |-
              "Realmente te gusta jugar con fuego, ¿verdad?" dice Eiden. "Creo que lo que más me enfurece es el hecho de que de verdad crees lo que estás diciendo. De verdad crees que habrías sido capaz de lograr lo imposible... cambiar la naturaleza humana sin siquiera tener acceso a ninguno de mis poderes. Me pregunto en qué basas exactamente semejantes afirmaciones."

              "Las baso", digo, "en el hecho de que ya llevo intentando lograr lo imposible durante la mayor parte de mi vida. Y, a diferencia de ti, jamás se me ha pasado por la cabeza rendirme. ¡Mírame, demonios! ¡Mira dónde estoy! ¿Quién sería tan idiota o tan terco como para llegar tan lejos solo por un sueño de la infancia? Y aun así, aquí estoy."

              Hago una pausa de unos segundos antes de continuar, pero durante ese tiempo sigo mirando a Eiden directamente a los ojos.

              "No me importa la naturaleza humana", digo al cabo de un rato. "Después de ver cómo la gente de aquí está perfectamente conforme con que traten a otros seres humanos como ganado, y después de ver cómo consideran que ver morir a personas en una arena es una forma de entretenimiento, creo que ya he visto lo suficiente para saber que las cosas aquí tienen que cambiar. Y si tú ya no vas a hacerlo, entonces lo haré yo. No me importa si tengo el poder para hacerlo o no. Lo haré. Voy a hacer todo lo que tú no pudiste hacer, a pesar de tu inmenso poder, y luego voy a volver para restregártelo en la cara."
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch06a_loopholes
