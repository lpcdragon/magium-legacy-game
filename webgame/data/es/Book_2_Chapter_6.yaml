        texts:
          - source: scene_text
            paragraph: 24
            text: |-
              "¿Es esta la razón por la que te expulsaron del plano mágico?"

              "Eh..." dice Arraka. "Probablemente fue parte de la razón. Creo que, más que nada, fue por mis matanzas."

              "¿Matanzas?..." digo.

              "Sí", dice Arraka. "En realidad no hay mucho que hacer en el plano mágico. La mayoría de los espíritus tienden a vivir únicamente para mantener su existencia. Es bastante raro que un espíritu del plano mágico muera de viejo, así que, mientras no hagas nada demasiado arriesgado, teóricamente podrías seguir viviendo para siempre. Por eso es tan divertido matar a un espíritu en el plano mágico. En el plano terrenal, la mayoría de los seres vivos esperan morir en algún momento, pero la gran mayoría de los espíritus del plano mágico se creen inmortales. La desesperación con la que se aferran a la vida en sus últimos momentos no puede compararse con la de ningún ser de este plano de existencia, y eso hace que resulte aún más satisfactorio acabar con ellos."

              "Entonces, ¿qué dijeron los dioses de todo esto?" digo. "¿No dijiste que ellos también viven en el plano mágico? ¿Por qué no pudieron simplemente unirse contra ti para matarte?"
