            paragraph: 12
            text: |-
              "No deberíamos dar el trato por cerrado hasta que el dispositivo esté realmente en nuestras manos."

              "Bueno, sí, obviamente", dice Daren. "Si espera que prácticamente nos enfrentemos solos a todo un reino, ni loco voy a hacerlo a cambio de una vaga promesa de que nos 'guiará' hasta alguien que tiene lo que necesitamos."

              "Suena justo", dice Melindra.

              Una vez que Daren se asegura de que nadie más tenga sugerencias, saca su espada y le hace un corte leve con ella en uno de los dedos de la mano izquierda a Melindra. Melindra esparce sobre la espada parte de la sangre que gotea de su dedo, y el arma empieza a brillar intensamente con una luz blanca.

              "¿Está funcionando?" pregunta Melindra. "¿Puedo decir el juramento?"

              "Sí, el hechizo está funcionando", dice Daren. "Puedes empezar."

              "Bueno", dice Melindra. "Antes que nada, juro que no voy a hacerles daño a ninguno de ustedes."

              "Tú... sí sabes cómo funciona esto, ¿verdad?..." le dice Daren. "Si no especificas una duración, el juramento se vuelve vinculante de por vida. Si acepto tu promesa así, ¡no podrás hacernos daño durante el resto de tu vida!"

              "Escucha", dice Melindra, señalando a Daren con el dedo. "Si vamos a seguir dudando unos de otros, no vamos a llegar a ninguna parte. Acepta el juramento de una vez, ¿sí?"
          - source: scene_text_2
            paragraph: 11
            text: |-
              "Bueno... está bien, supongo...", dice Daren, mientras coloca una mano sobre la espada, y la luz blanca empieza a parpadear.

              "¡Espera, espera, un momento!" dice Melindra.

              "¿En serio?" dice Daren. "Apenas logré cancelar el juramento a tiempo. ¿Qué pasa?"

              "¿Puedo cambiar las palabras 'hacer daño' por 'causar heridas graves'?" dice Melindra. "No me gustaría terminar muerta por darle a alguien una palmada en la espalda."

              "¡Este es un juramento de encantador!" dice Daren. "Cuando dices 'hacer daño', realmente va a significar hacer daño. Darle a alguien una palmada en la espalda o incluso un golpe en la cabeza no entra dentro de eso. Y además, recibirás suficiente aviso si el hechizo considera que estás cruzando la línea. No podrás activarlo por accidente."

              "Ah", dice Melindra. "Bueno, en ese caso, continúa."

              En cuanto Daren termina de confirmar el primer juramento, insta a Melindra a continuar con el segundo.

              "Bueno, eh...", dice Melindra. "Juro que, en cuanto maten al rey de Ollendor, empezaré a guiarlos hacia la persona que tiene el detector de piñas del que les hablé antes, y no haré ninguna pausa a menos que ustedes me lo pidan específicamente. También juro que, en cuanto haya terminado de guiarlos hasta esa persona, no descansaré hasta que el dispositivo esté a salvo en sus manos."
