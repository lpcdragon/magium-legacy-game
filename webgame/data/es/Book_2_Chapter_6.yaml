scenes:
  - name: b2_ch06a_intro
    texts:
      - source: scene_text
        paragraph: 2
        text: |-
          La chica en pijama nos mira con una sonrisa victoriosa en el rostro. Se la ve de lo más satisfecha consigo misma por haber conseguido por fin llamar nuestra atención. A pesar de que es claramente ella quien nos mantiene suspendidos mágicamente en el aire, su aura no muestra absolutamente ningún rastro de magia. Incluso cuando Kate y Flower ocultan sus auras, todavía puedes darte cuenta de que son magas si examinas sus auras con muchísimo cuidado. La chica que tenemos delante, en cambio, no parece distinta de un humano común. Esto puede significar una de dos cosas. O se le da mucho mejor ocultar su aura que a Flower y Kate, o...

          "¡Oye, yo te conozco!" suelta Arraka de repente. "¡Tú eres esa chica stillwater que no paraba de ir detrás de Eiden y del zorro durante el invierno inmóvil! Eh... ¿cómo era el nombre?... ¿Melenda? ¿Milandra?..."

          "Melindra", dice la chica stillwater, con voz fría, y luego hace un gesto con uno de sus dedos, lanzando un hechizo de viento que cierra el amuleto de Arraka.

          Arraka murmura furiosa desde dentro de su amuleto, pero nadie le presta atención. Tras hacer callar a la banshee, la chica stillwater recupera la sonrisa e intenta retomar su discurso por donde lo había dejado.
      - source: scene_text_2
        paragraph: 2
        text: |-
          "Así que, como iba diciendo", dice Melindra, "hay algo que me gustaría pedirles. La razón por la que fui a verlos a la arena fue que escuché que los condenaron por matar a un noble de Varathia, así que pensé--"

          "Espera un segundo..." la interrumpe Hadrik. "¿Eres una stillwater?"

          "Pues sí..." dice Melindra, confundida. "Pensé que eso ya sería obvio a estas alturas. Hasta Arraka dijo antes que--"

          "¿Pero cómo te convertiste en una?" pregunta Hadrik. "¿Naciste así? ¿Las mujeres pueden nacer siendo stillwaters?"
    effects:
      - set:
          successful_checks:
            - 'Punto de control alcanzado: Partida guardada.'
        condition: checkpoint_rich = 1
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch06a_intro2
              checkpoint_rich: 0
  - name: b2_ch06a_intro2
    texts:
      - source: scene_text
        paragraph: 3
        text: |-
          "¡No, claro que no!" dice Melindra, ligeramente irritada. "No nací siendo una stillwater. Me convertí en una stillwater de la misma manera que todos los demás."

          "¿Todos?" pregunto. "¿Hasta Eiden? ¿Eiden también es un mago artificial? ¿No nació siendo mago?"

          "¿Qué es un mago artificial?" dice Melindra, en tono frustrado. "Eiden nació siendo mago. Simplemente se convirtió en un stillwater después, igual que todos los demás. ¿Qué tiene esto de tan difícil de entender?"

          "¿Pero cómo?" le pregunto. "¿Cómo te conviertes en un stillwater?"

          "A ver", dice Melindra. "Si creen que voy a quedarme aquí respondiendo todas y cada una de sus preguntas antes de que siquiera escuchen lo que estoy--"

          "¿Cómo conoces a Eiden?" le pregunta Daren. "¿Trabajas con él?"

          "¡No, no trabajo con Eiden!" dice Melindra, visiblemente alterada. "Si trabajara con Eiden, ¿de verdad creen que necesitaría venir a pedirles ayuda? ¿Por qué no pueden simplemente callarse diez segundos y dejarme terminar una maldita frase--"
      - source: scene_text_2
        paragraph: 3
        text: |-
          "Si quieres nuestra ayuda, entonces ¿qué tal si nos bajas primero?" le pregunta Kate. "No es forma de tratar a alguien a quien intentas pedirle un favor."

          Melindra ahora mira a Kate con una cara de puchero que podría competir con la de Flower cuando se enfada. Tras unos segundos de silencio, la chica stillwater agita una mano, y todos empezamos a descender lentamente hacia el suelo.

          Es curioso. Puede que esta chica tenga poder suficiente para aplastarnos con un simple gesto de los dedos, pero su forma de comportarse hace que parezca una de las personas menos amenazantes que he conocido en mi vida. Quizá incluso menos amenazante que Flower o el embajador de Ollendor.

          "¡Ya está!" dice Melindra, una vez que su hechizo de levitación se cancela por completo. "Todos han vuelto al suelo. Ahora, ¿puedo continuar por donde lo dejé o piensan interrumpirme con todavía más preguntas?"
    choices:
      - position: 1
        text: ¡De hecho, tengo unas cuantas preguntas más!
        effects:
          - set:
              current_scene: b2_ch06a_questions
      - position: 2
        text: Sigue, te estamos escuchando.
        effects:
          - set:
              current_scene: b2_ch06a_listening
  - name: b2_ch06a_questions
    texts:
      - source: scene_text
        paragraph: 4
        text: |-
          "¡De hecho, tengo unas cuantas preguntas más!"

          "¿Qué?" dice Melindra, esforzándose por controlar su temperamento. "¿Qué preguntas?"

          "Bueno, para empezar", digo, "nunca nos dijiste cómo se llega a ser un stillwater."

          "No lo entiendo", dice Melindra. "¿Por qué me hacen esta pregunta a mí? ¿No deberían preguntárselo a Eiden? ¿No son sus seguidores?"

          "¡Ni hablar!" grita Daren.

          Melindra nos mira confundida.

          "¿Sus amigos, entonces?" pregunta.

          "Ni de lejos", dice Kate.
      - source: scene_text_2
        paragraph: 4
        text: |-
          "Entonces, ¿cómo se las arreglaron para atacar a ese noble?" dice Melindra. "¿No fue Eiden quien les dio el poder para hacerlo?"

          "Así fue", dice Kate.

          "Entonces, ¿por qué lo hizo, si no son sus amigos?" dice Melindra.

          "Parece que conoces a Eiden desde hace tiempo", dice Kate. "¿De verdad crees que necesita una razón lógica para todo lo que hace? O, en realidad, para cualquier cosa?"

          "Bueno..." dice Melindra. "Quiero decir... últimamente no... pero si de verdad no son sus amigos, debo decir que me sorprende bastante que los haya dejado con vida..."

          "¿Y quién no?" dice Kate.

          "Entonces, ¿qué era lo que querías pedirnos?" dice Daren.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch06a_assassins
  - name: b2_ch06a_listening
    texts:
      - source: scene_text
        paragraph: 5
        text: |-
          "Sigue, te estamos escuchando."

          "¡Bien!" dice Melindra, sonriendo otra vez. "Ahora, como ya dije antes, si hubiera logrado contactar a Eiden, no los estaría molestando con esto, pero como me ha estado ignorando por completo desde que volví a Varathia, estaba pensando que quizá ustedes, como sus seguidores, podrían--"

          "¿Cómo nos acabas de llamar?" le pregunta Daren, perplejo.

          "Seguidores de Eiden", dice Melindra. "¿No son sus seguidores?"

          "¡Ni hablar!" grita Daren.

          Melindra nos mira confundida.

          "¿Sus amigos, entonces?" pregunta.

          "Ni de lejos", dice Kate.

          "Entonces, ¿cómo se las arreglaron para atacar a ese noble?" dice Melindra. "¿No fue Eiden quien les dio el poder para hacerlo?"
      - source: scene_text_2
        paragraph: 5
        text: |-
