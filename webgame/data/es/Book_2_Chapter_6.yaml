  - name: b2_ch06a_amass
    routes:
      - condition: b2_ch6_banned = 0
        texts:
          - source: scene_text
            paragraph: 23
            text: |-
              "¿Qué les pasa a los espíritus que absorbes? ¿Siguen vivos dentro de ti?"

              "Más o menos", dice Arraka. "Técnicamente siguen ahí, pero están en un estado latente y no son conscientes de nada de lo que ocurre a su alrededor. El proceso de absorción es irreversible, así que, a efectos prácticos, es como si estuvieran muertos."

              "Entonces, ¿qué dijeron los dioses de todo esto?" digo. "¿No dijiste que ellos también viven en el plano mágico? ¿Por qué no pudieron simplemente unirse contra ti para matarte?"

              "¡Ja!" dice Arraka. "¿Crees que no lo intentaron? Los 'dioses' no tienen nada de especial. Son solo espíritus mágicos como el resto de nosotros. Solo empezaron a llamarse así después de descubrir que podían aprovechar la energía de los seres del plano terrenal, siempre que los convirtieran en sus seguidores leales. Una vez que reunieron suficientes seguidores, toda esa adoración se les subió a la cabeza, y empezaron a llamarse dioses, como si de alguna manera fueran más especiales que el resto de nosotros. Pero ni todos esos poderes 'divinos' que obtuvieron de sus adoradores les sirvieron cuando maté yo sola a la mitad de los suyos."

              "¿Mataste a la mitad de los dioses del plano mágico?" le pregunto.
          - source: scene_text_2
            paragraph: 20
            text: |-
              "Sí, pero para ser justa, la mayoría eran de los más débiles, los que no tenían tantos seguidores", dice Arraka. "Los más fuertes, como el Dios de la Muerte, el Dios del Destino y el Dios del Tiempo, lograron hacerme frente bastante bien, así que estuvimos en una especie de punto muerto durante un tiempo, mientras yo iba a absorber más espíritus y ellos trataban de reunir más seguidores."

              "¿Fue entonces cuando decidieron expulsarte del plano mágico?" le pregunto.

              "No, fue algún tiempo después", dice Arraka. "Cuando se dieron cuenta de que no podían reunir seguidores con la misma rapidez con la que yo absorbía otros espíritus, celebraron una especie de reunión a la que invitaron a todos los espíritus poderosos del reino, incluidos los que no se hacían llamar dioses, como el zorro dorado, que por entonces todavía estaba en el plano mágico. En esa reunión decidieron expulsarme de su reino junto con todos los demás espíritus femeninos que pertenecieran a lo que ustedes llaman 'razas civilizadas' aquí en el plano terrenal. Ya sabes, humanos, elfos, gnomos y esas cosas."
