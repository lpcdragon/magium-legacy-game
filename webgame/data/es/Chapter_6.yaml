        paragraph: 451
        text: |-
          "Vaya, eso es feo. Yo usaría una máscara de ahora en adelante si fuera tú."

          "Cuidado, Barry," dice Kate. "Después de esa quemadura en la mitad de mi cara, mi vista puede que ya no sea tan buena como antes. Nadie podría culparme si mi puntería me fallara en batalla, y si uno de mis conos de hielo terminara desfigurándote por accidente..."

          La mirada amenazante que tiene en los ojos se vuelve aún más aterradora por las cicatrices recién adquiridas en su cara.

          "Oye, oye," dice Daren. "No olvidemos que todos somos amigos aquí. Vamos, Rose. Es tu turno de ser curada."
