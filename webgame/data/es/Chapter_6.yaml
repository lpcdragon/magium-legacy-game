      - condition: ch6_defense = 2 AND strength < 4
        texts:
          - source: scene_text
            paragraph: 405
            text: |-
              El poder de mi golpe no fue suficiente para atravesar sus escamas blindadas. El dragón balancea inmediatamente una de sus garras hacia mí, y me veo obligado a teletransportarme lejos de él.

              Luego aplaude sus alas, generando una fuerte ráfaga de viento en un intento de alejarme de él, pero mi hechizo de protección contra el viento hace que parezca una simple brisa.

              Por un momento, pude ver al dragón aparecer en dos lugares al mismo tiempo, como si se hubiera clonado, pero entonces el clon desaparece. Espera un momento. ¡Conozco este efecto! Eso es lo que pasa cuando alguien lanza una ilusión justo frente a ti. ¿Esa ráfaga de viento de antes estaba destinada a desorientarme para que no viera esto?

              Lanzo un hechizo sobre mí mismo que me permite ver a través de las ilusiones. Efectivamente, el dragón frente a mí desaparece en cuanto lanzo el hechizo, y veo al verdadero Tyrath acercándose a mí por la derecha.

              Me teletransporto junto al dragón y le asesto un espadazo. Lo tomo por sorpresa, y se teletransporta lejos para evitar recibir daño.
