              Le disparo un rayo que le da de lleno, aunque no parece haberle afectado en absoluto. De repente, el dragón frente a mí desaparece y un dragón diferente aparece detrás de mí.

              Tyrath azota su cola hacia mí e intenta atraparme con ella. No hubo tiempo para esquivar el golpe, así que instintivamente lancé el hechizo de congelación del tiempo que Eiden usó antes, deteniendo su cola a pocos centímetros de alcanzarme. Mi corazón late como loco. ¿Qué es esto? ¿Qué acaba de pasar? ¿Eso era una ilusión?

              ¡Maldición! Bajé la guardia por completo. No podré lanzar el hechizo de congelación del tiempo de nuevo hasta el final de la batalla, así que más me vale aprovechar esto al máximo.

