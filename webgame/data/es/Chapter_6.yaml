  - name: ch6_stupid
    texts:
      - source: scene_text
        paragraph: 335
        text: |-
          "Eso es una tontería. Tú no fuiste quien lo mató".

          Rose suelta una suave risita.

          "Los discursos reconfortantes no son realmente lo tuyo, ¿verdad, Barry?"

          "Me temo que no. Pero al menos te hice reír, así que no pudo haber sido tan malo, ¿verdad?"

          "No, fuiste el peor", dice Rose, sonriendo. "Vamos, nos estamos quedando atrás. Alcancemos a Daren".

          Poco después de comenzar nuestro viaje, Daren nota que he atado mi ballesta a la parte trasera de mi mochila.

          "Barry, ¿por qué no metes esa ballesta dentro de la mochila, como hiciste con todo lo demás?"

          "Bueno, porque ya está llena con todas mis otras cosas".
      - source: scene_text_2
        paragraph: 11
        text: |-
          "¿Llena? Espera un momento, Barry, ¿me estás diciendo que la mochila que llevas ahora mismo es una completamente normal?"

          "Bueno, sí, las mochilas encantadas son muy difíciles de conseguir si no eres un mago".

          "¿Te das cuenta de que podrías haberme pedido que te la encantara, verdad? Literalmente solo toma unos minutos. Ven, dámela".

          Daren agarra mi mochila y entra en un trance de encantamiento. Sus ojos se vuelven amarillos y la mochila comienza a brillar. El hecho de que Daren se especialice en encantamiento de objetos se me había olvidado por completo. Las mochilas encantadas son infinitamente mejores que las normales. Tienen un espacio casi infinito, y la gente no puede ver lo que hay dentro, así que solo pueden robarte si saben exactamente lo que buscan. Sacar un objeto de una mochila encantada es tan simple como concentrarse en su imagen y meter la mano para buscarlo.

          Rose parece muy interesada en el proceso de encantamiento. Ahora está observando a Daren de cerca.

          "Oye, Barry", dice Daren. "¿Quieres que asegure tu mochila con protección extra o la dejo así? Si la aseguro, solo tú podrás sacar objetos de ella. La única desventaja es que no puedes autorizar a otras personas para sacar objetos de tu mochila una vez que la asegures. Normalmente, la seguridad no debería ser un gran problema con estas mochilas porque alguien tiene que saber exactamente lo que tienes dentro antes de poder sacar un objeto, pero nunca está de más ser precavido".
    choices:
