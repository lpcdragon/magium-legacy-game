  - name: ch6_alone
    texts:
      - source: scene_text
        paragraph: 331
        text: |-
          Decido que es mejor dejarla tranquila. Dudo que cualquier cosa que dijera pudiera hacerla sentir mejor.

          Poco después de comenzar nuestro viaje, Daren nota que he atado mi ballesta a la parte trasera de mi mochila.

          "Barry, ¿por qué no metes esa ballesta dentro de la mochila, como hiciste con todo lo demás?"

          "Bueno, porque ya está llena con todas mis otras cosas".

          "¿Llena? Espera un momento, Barry, ¿me estás diciendo que la mochila que llevas ahora mismo es una completamente normal?"

