  - name: ch6_lose_fight
    effects:
      - set:
          ac_ch6_berserker: 1
        achievement:
          id: ac_ch6_berserker
          title: Modo berserker activado
    routes:
      - condition: ch6_offense = 1 AND ch6_improvise = 2
        texts:
          - source: scene_text
            paragraph: 429
            text: |-
              Ahora soy yo el que empieza a enfadarse. Puedo sentir que mi cuerpo empieza a irradiar calor. Incluso puedo ver vapor saliendo de mí. De repente, puedo sentir que mi velocidad aumenta diez veces. ¿Qué clase de hechizo acabo de lanzar? Mi dispositivo de estadísticas nunca me dijo que tuviera acceso a algo así. Siento que nunca podré perder contra nadie nunca más.

              Todo parece moverse mucho más lento de repente. ¿O soy yo el que se mueve más rápido? Puedo predecir el ataque del dragón antes de que se teletransporte frente a mí, pero no siento la necesidad de esquivar. En cambio, simplemente bloqueo el siguiente zarpazo de Tyrath con mi mano izquierda.

              "No..." dice el dragón, estupefacto.

              Mientras lo mantengo agarrado con mi mano izquierda, le doy un puñetazo en el pecho con el puño derecho. El impacto de mi golpe fue tan fuerte que pude sentir algunas de sus escamas blindadas romperse por la fuerza del golpe, mientras el dragón sale volando más de seis metros hacia atrás. Tyrath escupe sangre, y empieza a hablar, pero no lo dejo. Me teletransporto instantáneamente junto a él y lo agarro por la cola. Luego lo lanzo contra el suelo, y cuando choca con la tierra crea un enorme cráter y envía nubes de polvo volando en todas direcciones.

              Un golpe más debería resolver esto. Mientras me preparo para lanzarme hacia Tyrath para dar el golpe final, puedo sentir que mis poderes empiezan a abandonarme.
          - source: scene_text_2
            paragraph: 52
            text: |-
              ¡No! ¡Ahora no! Iba a terminar con esto. ¡Estaba ganando! No estoy ni cerca de mi límite de cinco minutos. ¿Cómo gasté toda mi energía mágica en solo unos segundos? ¿Fue por el repentino aumento de poder que obtuve hace un momento?

              Por favor, no puede acabar todo así. Solo necesito dar un golpe más. Un golpe más es todo lo que necesito. Por favor...

              Es demasiado tarde. Ya ni siquiera puedo mantener mi hechizo de vuelo. Estoy cayendo. No hay forma de que sobreviva a una caída desde esta altura. Daren y Kate están demasiado lejos para ayudarme. ¿Es esto todo para mí? Después de todo lo que ha pasado, ¿simplemente voy a morir patéticamente así?

              Justo antes de llegar al suelo, de repente me detengo en el aire y luego caigo de bruces, desde una altura de poco menos de un metro. ¿Cómo hice eso? ¿Logré reunir mis últimas gotas de poder para salvarme?

              "Qué decepción", escucho la voz de Eiden desde muy arriba en el cielo. "Qué gran decepción. Barry, esperaba mucho más de ti. No te di toda esa energía mágica solo para que la desperdiciaras activando el modo maximizado temporal de tu dispositivo."
        choices:
          - position: 1
            text: No sé qué significa eso.
