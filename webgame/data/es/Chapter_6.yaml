            paragraph: 341
            text: |-
              "Asegurarla. Más vale prevenir que lamentar".

              "Como desees".

              Una vez que termina de encantar mi mochila, me la devuelve y luego se dirige a Rose.

              "Veo que estás muy interesada en mi oficio. ¿Te gustaría que también encantara tu mochila?"

              Rose se sonroja, dándose cuenta de que había sido un poco demasiado obvia en su curiosidad.

              "¡Sería un honor!", responde ella.

              Una vez que termina con su mochila también, Daren se vuelve hacia mí, con una expresión muy emocionada.

              "Barry, acabo de darme cuenta de algo. ¿Recuerdas cuando dije que tendríamos que viajar hasta una ciudad para encontrar a un local al que pudieras atacar para que te enviaran a casa? ¡Pues ya no necesitamos hacer eso! Ahora tenemos a Rose".

              No había pensado en eso. ¿Cómo no pensé en eso? Debería haber sabido que esto pasaría en el momento en que la conocimos.

              "No, no podría. Aunque signifique volver a casa, no puedo simplemente atacar a Rose así".

              "No tienes que preocuparte por eso", dice Rose, sonriendo. "¡Estaré encantada de ayudar! Y además, ya sabemos que el hechizo te detendría antes de tocarme de verdad gracias a ese mago que me atacó esta mañana".
          - source: scene_text_2
            paragraph: 16
            text: |-
              Me doy cuenta de que estoy sudando. Kate me observa atentamente.

              "Pero, eh... ¿qué hay de escoltar a Rose a casa?"

              "¿Qué hay de qué?", pregunta Daren. "Kate y yo deberíamos ser más que suficientes para lidiar con unos cuantos monstruos".

              "Sí, pero, yo..."

              Las palabras me fallan. No puedo inventar una excusa lo bastante rápido.

              "Yo no..."

              Mientras lucho por encontrar las palabras, Daren finalmente empieza a entender lo que está pasando. Su expresión se vuelve más sombría y seria.

              "Barry, no viniste aquí realmente en contra de tu voluntad, ¿verdad?"

              "No... No, no fue así".

              "Entonces, ¿qué haces aquí?"

              "Yo... me uní por la misma razón que todos los demás. Voy detrás del Magium. Ha sido mi sueño convertirme en mago desde que tengo memoria".

              "¿Cuándo planeabas decirme esto?"
