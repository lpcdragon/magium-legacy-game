    texts:
      - source: scene_text
        paragraph: 334
        text: |-
          "No fue tu culpa".

          "Lo sé. No había nada que pudiera hacer. Ni siquiera sé quién lo mató. Solo sé que quien lo hizo era alguien de mi pueblo. Pero aún así me siento terrible".
