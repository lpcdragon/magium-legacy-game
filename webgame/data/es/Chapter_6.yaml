  - name: ch6_met
    texts:
      - source: scene_text
        paragraph: 332
        text: |-
          "Oye, quería preguntarte, ¿cómo se conocieron tú y Elaria? Parecían conocerse bastante bien".

          Mi pregunta tomó a Rose por sorpresa. Debió darse cuenta de que no estaba actuando como ella misma porque inmediatamente recuperó su sonrisa cuando empezó a responderme.

          "Oh, conocí a Elaria y a Molan hace unos años cuando estaba recolectando hierbas. Molan estaba muy enfermo y ayudé a preparar un ungüento para curar su enfermedad. Hemos sido amigos desde entonces".

          "¿Y luego pasó algo?"

          La sonrisa de Rose se mantuvo en su rostro, pero sus ojos empezaron a mostrar un poco de tristeza.

          "¿Fue tan obvio, eh? Sí, algo pasó, aunque no fue algo que hiciéramos Elaria o yo. Hace unos meses, después de la muerte de nuestro gran sacerdote, la gente empezó a desesperarse. Nuestras últimas reservas de comida se agotaban y no pasó mucho tiempo antes de que solo los ricos tuvieran acceso a cualquier tipo de comida conjurada que quedara. La caza de animales se hizo cada vez más popular, y una guerra entre los animales y los humanos era inevitable. La guerra nos ha costado muchas vidas, incluyendo la del padre de Molan. Desde que murió, no pude volver a mirar a ninguno de los dos a los ojos. Por eso no los he visitado en tanto tiempo".
    choices:
      - position: 1
        text: No fue tu culpa.
        effects:
          - set:
              current_scene: ch6_fault
      - position: 2
        text: Eso es una tontería. Tú no fuiste quien lo mató.
        effects:
          - set:
              current_scene: ch6_stupid
              ch6_rose_deer: 0
      - position: 3
        text: A Elaria no pareció importarle tu presencia.
        effects:
          - set:
              current_scene: ch6_presence
              ch6_rose_deer: 1
  - name: ch6_happened
    texts:
      - source: scene_text
        paragraph: 333
        text: |-
          "Oye, quería preguntarte, ¿pasó algo entre tú y Elaria?"

          Mi pregunta tomó a Rose por sorpresa. Debió darse cuenta de que no estaba actuando como ella misma, porque intentó fingir su sonrisa habitual. No le salió muy bien, porque aunque su boca sonreía, sus ojos seguían mostrando tristeza.

          "¿Fue tan obvio, eh? Sí, algo pasó, aunque no fue algo que hiciéramos Elaria o yo. Hace unos meses, después de la muerte de nuestro gran sacerdote, la gente empezó a desesperarse. Nuestras últimas reservas de comida se agotaban y no pasó mucho tiempo antes de que solo los ricos tuvieran acceso a cualquier tipo de comida conjurada que quedara. La caza de animales se hizo cada vez más popular, y una guerra entre los animales y los humanos era inevitable. La guerra nos ha costado muchas vidas, incluyendo la del padre de Molan. Desde que murió, no pude volver a mirar a ninguno de los dos a los ojos. Por eso no los he visitado en tanto tiempo".
