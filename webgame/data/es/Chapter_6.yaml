  - name: ch6_dragon
    texts:
      - source: scene_text
        paragraph: 376
        text: |-
          Al terminar de usar mi dispositivo, Rose me hace otra pregunta.

          "Espera, entonces si tu potenciador de estadísticas extrae energía mágica de otros magos, ¿eso significa que también está consumiendo los poderes de Daren y Kate?"

          "Obtiene un poco de energía de cada mago en un radio de cincuenta kilómetros, pero la cantidad que toma de cada uno apenas es suficiente para causarles una leve molestia. La mayor parte de la energía que obtiene proviene de los poderosos hechizos que se han lanzado a nuestro alrededor desde el comienzo de este torneo, y esa energía se habría disipado en el aire de todos modos, así que se podría decir que la estoy reciclando, en lugar de robarla. Creo que..."

          Me interrumpe un rugido muy fuerte que resuena a nuestro alrededor.

          "¿Qué fue eso?", pregunta Rose, visiblemente asustada.

          Un segundo rugido, más fuerte, retumba ahora en el aire, mientras siento que se me eriza el pelo de la nuca. Nunca he escuchado este sonido antes en mi vida. No tengo idea de qué bestia podría estar causándolo. ¿Entonces qué es esta sensación de terror que me invade de repente? ¿Por qué me encuentro queriendo correr tan rápido como pueda, en cualquier dirección, mientras me aleje lo más posible de este lugar?
      - source: scene_text_2
        paragraph: 26
        text: |-
          Poco después de que terminara el segundo rugido, un viento muy poderoso empezó a soplar hacia nosotros. Casi puedo sentir cómo intenta levantarme en el aire. Los árboles apenas aguantan, y parece que podrían ser arrancados de raíz en cualquier momento. Tenemos suerte de que esto ocurriera mientras estábamos en un claro, porque de lo contrario habríamos tenido que protegernos también de los árboles que caían, mientras intentábamos mantener el equilibrio contra la fuerza implacable del viento.

          Mientras algunos de los árboles empiezan a caer, una figura monstruosa hace su aparición muy por encima de nosotros. Mide al menos quince metros de alto, con escamas rojas de aspecto muy resistente cubriendo todo su cuerpo, y alas del tamaño de velas de un drakkar. Sus garras parecen tan afiladas como cuchillas, y sus colmillos nos muestran amenazadoramente, pero su apariencia general no es muy diferente de la de un lagarto sobredimensionado.

          Un dragón. Realmente existían. ¿Está pasando todo esto por mi decepción de no haber encontrado ninguna criatura mítica hasta ahora? Si es así, me retracto. Me retracto de todo, solo, por favor, que todo esto sea un sueño. Que todo esto sea solo el final de una pesadilla, antes de que despierte de vuelta en nuestra cueva, y entonces podamos empezar nuestro viaje de nuevo.

          "¡¡¡Al suelo!!!", nos grita Daren, mientras el dragón se acerca, y luego aterriza a unas decenas de metros frente a nosotros, haciendo que todo el suelo tiemble violentamente bajo su peso.

          "No...", dice Rose, incapaz de controlar sus temblores, y apenas capaz de mantener el equilibrio. "Esto no puede estar pasando. Esto no puede estar pasando..."
      - source: scene_3
        paragraph: 2
        text: |-
          El dragón mira a su alrededor, como si estuviera tratando de encontrar algo, y luego grita fuertemente, en la lengua común:

          "¡¿Dónde está?!"

          Al ver que ninguno de nosotros responde, el dragón nos pregunta de nuevo, esta vez dándonos algunos detalles más.

          "¡El Stillwater! ¡¿Dónde está?! Apestan a su hedor. ¿Dónde lo están escondiendo?"
    choices:
