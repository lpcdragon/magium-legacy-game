    routes:
      - condition: ch6_big_plans = 1
        texts:
          - source: scene_text
            paragraph: 431
            text: |-
              "No sé qué significa eso."

              Eiden suspira.

              "Por supuesto que no lo sabes," dice. "Echa un vistazo a tu dispositivo de estadísticas. Lo entenderás cuando lo veas por ti mismo."

              Saco el dispositivo de estadísticas de mi bolsillo y miro la pantalla. ¿Qué... qué estoy viendo exactamente?

              Los números están completamente descontrolados. Cada una de mis estadísticas supera con creces su número máximo, pero están cayendo a un ritmo muy rápido. Ahora entiendo lo que pasó. Debo haber usado accidentalmente toda la energía que Eiden inyectó en mi dispositivo para maximizar temporalmente todas las estadísticas. Por eso de repente me volví tan poderoso. Por eso no reconocí el hechizo.

              "¿Lo entiendes ahora, Barry? La energía que te di nunca estaba destinada a usarse así. La energía mágica no crece en los árboles, ¿sabes? Deberías usarla con más cuidado."
          - source: scene_text_2
            paragraph: 54
            text: |-
              "Eiden..." dice el dragón, mientras se levanta y se eleva en el aire de nuevo. "Te he estado buscando."

              El stillwater sonríe.

              "¡Tyrath! ¡Parece que ha pasado un siglo desde la última vez que te vi! ¿O realmente ha pasado tanto? No lo recuerdo. ¡Ven, dale un abrazo a tu viejo amigo!"

              "Iba a atraerte usando los cuerpos de tus lacayos, pero parece que eso ya no es necesario. Hoy acabamos con esto, de una vez por todas."

              "¡Vamos, Tyrath! ¡No seas tan melodramático! ¡Estás arruinando nuestro feliz reencuentro!"

              En lugar de responder, el dragón lanza su aliento de fuego contra Eiden. El stillwater apunta con su dedo hacia las llamas, y estas se detienen frente a él. Luego hace un gesto hacia el dragón con su mano, y las llamas regresan hacia Tyrath, golpeándolo de lleno.

              "Veo que sigues con tus viejos trucos," dice el dragón. "Pero me he vuelto mucho más poderoso desde que te fuiste. Esto no será como la última vez."
