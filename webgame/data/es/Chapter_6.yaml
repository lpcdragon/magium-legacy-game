              "¿Qué... qué está pasando?..." dice Tyrath, intentando contener el dolor.

              "¿Ha pasado tanto tiempo que lo has olvidado, viejo amigo?" escucho la voz de Eiden viniendo desde la izquierda.

              Me giro y veo al stillwater flotando en el aire junto a nosotros, con su habitual sonrisa en la cara.

              "Eiden..." dice el dragón.

              "Solo porque estas trampas no se han activado en más de un milenio no significa que estén fuera de servicio," continúa Eiden. "Los Lessathi de antaño eran todo menos artesanos descuidados. Esta trampa solo estaba un poco desajustada, eso es todo. ¡Por suerte, tu uso continuo de llamas y los volcanes de Barry fueron suficientes para calentarla!"

              Mientras los dos hablan, el suelo tiembla violentamente y la luz azul se intensifica.
          - source: scene_text_2
            paragraph: 58
            text: |-
              "Lo... van a pagar... Los dos... No descansaré hasta darles caza. Ningún lugar de este continente será seguro para ustedes nunca más. ¿Me oyen? ¡Los cazaré! Borra esa sonrisa de tu cara, maldito plebe..."

              Toda la magia en el aire se desata en un solo momento, y el dragón es teletransportado lejos, mientras la luz azul desaparece y el terremoto se detiene lentamente. La energía de mi dispositivo ha desaparecido. Pude sentirla desvanecerse en el momento en que el dragón fue teletransportado.

              Eiden se vuelve hacia mí.

              "¡Bien hecho, Barry! ¡Has superado con creces mis expectativas!"
