    texts:
      - source: scene_text
        paragraph: 336
        text: |-
          "A Elaria no pareció importarle tu presencia. Personalmente, creo que solo empeoras las cosas al decidir no visitarlos".

          "Supongo... supongo que tienes razón. Después de ver cómo reaccionaron cuando me vieron, ahora me doy cuenta de que quizás fue egoísta de mi parte cortar los lazos con ellos así sin más. Debería haber estado a su lado en su momento de necesidad. La próxima vez que los visite, será diferente. ¡Gracias, Barry, por hacerme entrar en razón!"

          Su cálida sonrisa ha vuelto a su rostro, y esta vez parece sincera.

          "De nada", le digo, mientras terminamos nuestra conversación y continuamos nuestro camino.

          Kate parece haber captado algo de nuestra conversación, porque me está sonriendo levemente.

