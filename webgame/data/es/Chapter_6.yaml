  - name: ch6_ending
    texts:
      - source: scene_text
        paragraph: 452
        text: |-
          Una vez que Daren termina de curarnos a todos, no perdemos más tiempo y reanudamos nuestro viaje, para evitar encontrarnos con magos o criaturas que puedan haber sido atraídos por los fuertes ruidos de nuestra batalla anterior.

          "Todavía no entiendo una cosa, Barry," me dice Kate, mientras caminamos uno al lado del otro. "¿Cómo logró Eiden darte todos esos poderes? Que yo sepa, transferir poderes entre magos es imposible sin algún tipo de herramienta que los asista."

          "Oh, usó mi dispositivo de estadísticas. No estoy seguro de qué hizo exactamente, pero hizo que empezara a brillar, y entonces de repente obtuve todos esos hechizos. He estado jugando con el potenciador de estadísticas desde entonces, para ver si podía desbloquear algunas opciones secretas o algo, pero no pude descubrir cómo lo hizo."

          "Espera, ¿estás diciendo que obtuviste todos esos poderes a través de tu dispositivo de estadísticas? ¡No, eso es imposible! Para que eso funcionara, necesitarías tener incluso menos poder mágico que un humano, de lo contrario no coincidiría en absoluto con la frecuencia mágica del dispositivo."

          Hace una pausa.

          "De hecho, ahora que lo pienso, tu aura mágica siempre fue más débil que la de un humano normal. Muy débil, de hecho. Casi como si fueras un..."
      - source: scene_text_2
        paragraph: 66
        text: |-
          Kate se detiene en seco de repente, y me mira directamente. La expresión en sus ojos se transforma lentamente en una de puro terror y comprensión súbita. Luego, su mirada se oscurece. Más oscura de lo que jamás la he visto, mientras continúa mirándome directamente a los ojos.

          "Casi como si fuera un... ¿qué?"

          "No importa. No era importante. Alcancemos a los demás, nos estamos quedando atrás otra vez."

          El tono de su voz fue tan frío como su magia congelante. No me dice ni una palabra más, y se adelanta para alcanzar a Daren y Rose.

          Genial. Justo lo que necesitábamos. Más conflictos subyacentes en nuestro grupo. Seguro que esto solo puede terminar bien para todos.
