            paragraph: 388
            text: |-
              "Bien, entonces quizá puedas acabar con ese dragón por nosotros."

              "No, Barry, TÚ vas a acabar con ese dragón."

              Eiden chasquea los dedos y mi dispositivo de estadísticas sale volando de mi mano hacia la suya. El dispositivo entonces empieza a brillar de repente y parece que está acumulando una cantidad masiva de energía en muy poco tiempo.

              "¡¡¡Oye!!!"

              "Me doy cuenta de que todo esto debe ser muy confuso para ti, Barry, así que te voy a dar un poco de contexto. La bestia que acaba de atacarlos es Tyrath, el autoproclamado rey de todos los dragones. La razón por la que me busca es porque escribí un mensaje en las estrellas anoche en un idioma antiguo usado principalmente por cazadores de dragones. El propósito del mensaje era hacer saber a todos los cazadores de dragones que entraron en este concurso que un dragón existe en esta isla, y darles un pequeño incentivo extra para cazarlo. Dudo mucho que alguno de ellos represente una amenaza realista para él, pero será divertido de ver."

              Termina de cargar mi dispositivo de estadísticas y me lo devuelve. Al sostenerlo en mi mano, puedo sentir una poderosa oleada de energía mágica recorrerme y fluir por todo mi cuerpo.
          - source: scene_text_2
            paragraph: 38
            text: |-
              "Creo que tu objetivo final era ganar este torneo y convertirte en mago, ¿no? Pues bien, Barry, ahora te estoy dando una muestra de ese poder. Durante unos cinco minutos, tendrás poderes mágicos comparables a los míos. Más que suficiente para ahuyentar al dragón, diría yo. Toda la información que necesitas para usar tus poderes debería haber sido transferida a tu mente por el dispositivo de estadísticas. ¡Estoy deseando ver tu batalla!"

              Eiden entonces empieza a desvanecerse en el aire. Cuando solo su contorno es visible, dice:

              "Oh, y te recomendaría empezar con una barrera mágica. Tus amigos no parecen estar muy bien."
