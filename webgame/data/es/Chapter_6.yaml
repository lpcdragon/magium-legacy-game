              "No... Me siento exactamente igual que antes. Creo que se equivocó. No puedo tener poderes de tiempo. Su hechizo simplemente debió fallar, eso es todo."

              "Hmm... Quizás tengas razón," dice Daren. "De todas formas, deberíamos estar lo suficientemente agradecidos de que de alguna manera logramos salir de esta con vida. He oído historias sobre lo peligroso que era este lugar, pero nunca imaginé que sería tan malo. Estamos todos en un estado terrible. Vamos, déjenme empezar a lanzar algunos hechizos de curación."

              Daren procede a curarnos a todos por turnos. Cuando empieza a curar a Kate, puedo ver claramente que tiene algunas dificultades.
          - source: scene_text_2
            paragraph: 65
            text: |-
              "Lo siento, Kate," dice Daren, al terminar su hechizo. "Esto es todo lo que puedo hacer por ti. Tus heridas eran demasiado profundas para curarlas por completo."

              Mirando a Kate, puedo ver que Daren ha curado la mayor parte del daño causado por el fuego del dragón, pero el lado izquierdo de su cara todavía tiene cicatrices leves. Sorprendentemente, no le queda mal. Kate, después de todo, nunca tuvo realmente un aspecto muy femenino. Su belleza siempre fue de naturaleza más salvaje, y sus cicatrices recién adquiridas la complementan bien.

              "No hay problema," le dice Kate a Daren mientras mira su cara a través de un espejo hecho de hielo. "La mayoría de la gente ya me llamaba monstruo y salía corriendo cuando me veían por primera vez. Al menos ahora tendrán una razón legítima para hacerlo."
