        text: |-
          "¿Son frecuentes los ataques de monstruos en tu zona?"

          "Sí, los monstruos se han vuelto más atrevidos en las últimas décadas. No es solo en nuestra zona, sucede en todo el continente. No estoy segura, pero creo que todo empezó cuando perdimos contacto con el reino animal. Después de que las primeras cacerías de animales fueran iniciadas por la gente de Olmnar hace varias décadas, la líder de los animales, el espíritu del zorro dorado, ordenó a sus súbditos que dejaran de hablar en nuestro idioma. Los monstruos deben haberse enterado de esto, y aprovecharon el hecho de que los humanos y los animales ya no trabajaban juntos para causar estragos."

          "¿Y qué hay de los dioses?", pregunta Daren. "¿No se están involucrando en nada de esto?"

          "Los únicos dioses que actualmente se están involucrando son el dios del Destino y el dios de la Muerte, pero dudo mucho que alguno de ellos tenga nuestros mejores intereses en mente. Se dice que los dos empezaron a trabajar juntos recientemente, y eso bien podría ser cierto, a juzgar por el alto nivel de cooperación entre sus seguidores últimamente."

          "Espera, ¿no es el dios del Destino solo un título elegante para el dios de las Ilusiones?", dice Daren.

          "Sí", responde Rose. "La mayoría de los dioses se nombran a sí mismos según el poder que sus seguidores obtienen al adorarlos. Algunos de ellos, sin embargo, eligen otros nombres para sí mismos, lo cual puede ser un poco confuso. Es lo mismo con el dios de la Muerte. A juzgar por su nombre, pensarías que reina sobre el inframundo, pero en realidad es solo un dios de la Nigromancia, devolviendo a los muertos a la vida para que sirvan a sus órdenes."
