chapter_effects:
  - condition: current_scene = "ch6_eiden_vs_dragon" AND ch6_maximize_mode != 1
    effects:
      - set:
          ac_ch6_immersion: 1
          ch6_maximize_mode: 1
      - achievement:
          id: ac_ch6_immersion
          title: Full immersion
      - enable maximize mode
    trigger: stats-screen-open
scenes:
  - name: ch6_intro
    texts:
      - source: scene_text
        paragraph: 322
        text: |-
          "¡Muy bien, creo que eso es todo!", dice Daren cuando terminamos nuestra reunión de estrategia.

          Actualmente estamos todos sentados en círculo frente a la entrada de nuestra cueva. El sol está bastante alto en el cielo y no hay ni una nube a la vista. Por suerte, Kate ha accedido amablemente a usar su magia de hielo para refrescar un poco el aire a nuestro alrededor. Así podemos disfrutar del clima sin sentirnos como si estuviéramos dentro de un horno.

          "El mediodía está casi sobre nosotros", continúa Daren. "Deberíamos ponernos en marcha lo antes posible. No podemos permitirnos seguir viajando una vez que se ponga el sol, y tenemos un largo camino por delante. Rose, ¿conseguiste todas las hierbas que buscabas?"

          "Oh, no... Acabo de recordar, dejé caer mi bolsa de hierbas cuando me perseguían los goblins".

          "No te preocupes, dudo que alguien la haya robado, así que debe seguir donde la dejaste. ¡Te ayudaré a buscarla! Ven conmigo".

          Me levanto para seguirlos, pero Kate me agarra de la manga.
      - source: scene_text_2
        paragraph: 3
        text: |-
          "Espera", dice ella. "Hay algo que me ha estado molestando desde esta mañana".

          Se la ve muy tensa. Parece que le cuesta sacar las palabras de la boca.

          "¿Estabas tú..."

          Hace una pausa.

          "¿De verdad estabas prendado de mí desde que me viste por primera vez?"

          De todas las cosas que hubiera esperado que me dijera ahora mismo, esta era la última. Muchas gracias, Daren. ¿Qué se supone que le diga ahora?
    effects:
      - set:
          successful_checks:
            - 'Punto de control alcanzado: Partida guardada.'
        condition: checkpoint_rich = 1
    choices:
      - position: 1
        text: Quizás un poco.
        effects:
          - set:
              current_scene: ch6_maybe
              checkpoint_rich: 0
      - position: 2
        text: Claro que no. Daren solo estaba bromeando antes. No te preocupes por eso.
        effects:
          - set:
              current_scene: ch6_joking
              checkpoint_rich: 0
  - name: ch6_maybe
    texts:
      - source: scene_text
        paragraph: 323
        text: |-
          "Quizás un poco", le digo.

          "¿¡Lo estabas!? ¡Pensé que solo estaba bromeando! Lo... siento, no quiero herir tus sentimientos, pero no estoy... interesada ahora mismo".

          "Dije solo un poco. ¿Qué te pasa de repente? Esto no es propio de ti".

          Kate aparta la mirada, respira hondo y exhala antes de continuar.

          "Cuando esos tres magos nos atacaron antes, me hizo darme cuenta de algo. Tú y Rose son las únicas personas que he conocido que no me han tratado como una especie de monstruo. Aunque la gente no siempre lo diga abiertamente como esos tres magos, hay algo en sus ojos que los delata. Algo que deja claro que no me ven como humana. Es lo mismo con Daren. A pesar de lo que dijiste, no creo que realmente crea que no soy una banshee. Creo que es solo cuestión de tiempo antes de que tenga que luchar contra él, tal como he tenido que luchar contra todos los demás".

          Parece que ya está empezando a ver a través de mi mentira. Esperaba poder convencerla de que no perdiera su confianza en Daren, pero parece que nunca tuvo mucha confianza en él para empezar.
      - source: scene_text_2
        paragraph: 4
        text: |-
          Kate vuelve a dirigir su mirada hacia mí.

          "Pero tú y Rose... son diferentes. Cuando hablo contigo, no veo ni miedo ni aprensión en tus ojos. Me hablas con la misma normalidad con la que hablarías con cualquier otra persona. No sé por qué es así. No sé qué te pasa, pero... gracias... por hacerme sentir parte de un grupo por primera vez en mi vida".

          "¡Eh, aquí están!", grita Daren desde la distancia, mientras él y Rose vuelven del bosque. "Encontramos la bolsa de Rose no muy lejos de aquí. Todavía tiene todas sus hierbas dentro. Deberíamos estar listos para irnos".

          Cuando se acerca, nos mira a mí y a Kate y dice:

          "Lo siento, ¿interrumpimos algo?"
    choices:
      - position: 1
        text: Sí, Kate estaba a punto de declararme su amor.
        effects:
          - set:
              current_scene: ch6_profess
      - position: 2
        text: No, tienes razón, deberíamos ponernos en marcha.
        effects:
          - set:
              current_scene: ch6_going
  - name: ch6_joking
    texts:
      - source: scene_text
        paragraph: 324
        text: |-
          "Claro que no. Daren solo estaba bromeando antes. No te preocupes por eso".

          Kate suspira con alivio.

          "Esperaba que fuera el caso", dice ella.

          "¿Qué te pasa de repente? Esto no es propio de ti".

          Kate aparta la mirada, respira hondo y exhala antes de continuar.

          "Cuando esos tres magos nos atacaron antes, me hizo darme cuenta de algo. Tú y Rose son las únicas personas que he conocido que no me han tratado como una especie de monstruo. Aunque la gente no siempre lo diga abiertamente como esos tres magos, hay algo en sus ojos que los delata. Algo que deja claro que no me ven como humana. Es lo mismo con Daren. A pesar de lo que dijiste, no creo que realmente crea que no soy una banshee. Creo que es solo cuestión de tiempo antes de que tenga que luchar contra él, tal como he tenido que luchar contra todos los demás".

          Parece que ya está empezando a ver a través de mi mentira. Esperaba poder convencerla de que no perdiera su confianza en Daren, pero parece que nunca tuvo mucha confianza en él para empezar.
