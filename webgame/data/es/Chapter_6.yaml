  - name: ch6_eiden_leaves
    texts:
      - source: scene_text
        paragraph: 442
        text: |-
          "¡Eiden!" grita Daren, mientras se acerca a nosotros. "¡¿Qué haces TÚ aquí?!"

          "Espera... No entiendo... ¿No es amigo de ustedes?" nos pregunta Rose.

          "Eso creía yo, pero parece que me equivocaba," dice Eiden, fingiendo tristeza.

          Luego se da la vuelta para irse.

          "¡No, espera, no te vayas!" le grita Rose. "¡Estoy segura de que Daren no quiso decir eso!"

          "Te agradezco tu amabilidad, Rose, pero puedo darme cuenta de cuándo no soy bienvenido. ¡Les deseo lo mejor!"

          Entonces empieza a desvanecerse y se teletransporta fuera de nuestra vista. ¿O no? Después de ver lo bien que podía ocultar su presencia antes, empiezo a preguntarme. Es un poco espeluznante, saber que podría estar ahí parado, invisible e indetectable, escuchando todo lo que decimos. Realmente necesitamos encontrar alguna forma de detectar este tipo de cosas.

          "Daren, ¿cómo pudiste hacerle eso a tu amigo? ¡Eso fue horrible!" dice Rose.
    choices:
      - position: 1
        text: ¡Sí, Daren, deberías avergonzarte!
        effects:
          - set:
              current_scene: ch6_ashamed
      - position: 2
        text: Cálmate, Rose, no es tan sencillo.
        effects:
          - set:
              current_scene: ch6_simple
      - position: 3
        text: Pide a Kate que congele toda el área para asegurarse de que Eiden ya no esté cerca
        effects:
          - set:
              current_scene: ch6_freeze
  - name: ch6_ashamed
    texts:
      - source: scene_text
        paragraph: 443
        text: |-
          "¡Sí, Daren, deberías avergonzarte!"

          "¡Maldita sea, Barry! ¿No piensas ponérmelo ni un poco más fácil?"

          "¡Él nos salvó la vida a todos!" dice Rose. "¡Lo vi suceder con mis propios ojos! ¡Todos estaríamos muertos de no ser por él! Él es quien le dio a Barry todos esos poderes que le permitieron luchar contra el dragón. ¿Por qué actúan como si fuera nuestro enemigo?"

          "Es porque es nuestro enemigo," le dice Kate sin rodeos. "Cuando lo conocimos esta mañana, intentó matar a Daren directamente y finalmente decidió no hacerlo, por capricho. Si lo que dices es verdad, y realmente nos salvó la vida a todos, entonces me inclino a creer que esa también fue una decisión que tomó por capricho. ¿Cuál fue la motivación que dio para salvarnos a los cuatro?"

          La réplica de Kate hizo que Rose perdiera un poco de ímpetu.
      - source: scene_text_2
        paragraph: 61
        text: |-
          "Él, eh..."

          Hace una pausa.

          "Dijo que no podía dejar que el dragón ganara, después de haber presumido como un villano de un cuento infantil..."

          "Bueno, ahí lo tienes. Pero dejemos de lado las intenciones de Eiden. Lo que más me interesa saber es cómo llegaron ambos a interactuar con él en medio de nuestra pelea, cuando ni yo ni Daren lo vimos aparecer hasta el final de la batalla."

          "Congeló el tiempo," le digo.

          "¿¡Congeló el tiempo!?" pregunta Daren, perplejo. "¿Cómo es eso siquiera posible?"

          "Ni idea. Solo chasqueó los dedos e hizo que el tiempo se detuviera para todos excepto para él y para mí."

          "Espera, ¿y Rose?" pregunta Kate.

          "Dijo... que yo pude resistir su hechizo porque soy una tejedora del tiempo," responde Rose.

          "¿Qué demonios es una tejedora del tiempo?" dice Kate.
