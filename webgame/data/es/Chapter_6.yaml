  - name: ch6_backstory
    texts:
      - source: scene_text
        paragraph: 371
        text: |-
          Rose y yo nos unimos a los demás, y una vez que terminamos de recolectar provisiones, partimos una vez más. Mientras viajamos, empezamos a hablar de varias cosas: las aventuras de Daren, nuestras vidas antes de unirnos al torneo, las razones por las que todos vinimos aquí. Durante nuestras conversaciones, Daren fue por supuesto quien más habló, mientras que Kate ha sido tan evasiva como siempre sobre su pasado y sus razones para estar aquí. Al escuchar nuestras historias, Rose decide unirse a nuestra conversación, contándonos un poco sobre sí misma.

          "Siempre me gustaron las plantas", nos dice. "Plantas y libros. Así que no es sorpresa que pasé la mayor parte de mi juventud con la nariz enterrada en manuales de herbolaria. Con el tiempo, empecé a aprender más sobre medicina herbal, y me di cuenta de que mis talentos podían usarse para ayudar a las personas necesitadas. La mayoría de la gente a la que ayudo realmente no tiene mucho dinero para pagarme, pero lo poco que me dan es suficiente para ganarme la vida, y sus sinceros sentimientos de gratitud son mucho más gratificantes para mí que el dinero que ganaría trabajando solo para los ricos. He estado viviendo una vida modesta junto con mi hermano y mi hermana que tienen nueve y ocho años respectivamente, y desde que mi padre murió el año pasado, he estado recibiendo ocasionalmente algo de apoyo económico de mi exmarido."

          "¿Estuviste casada?", pregunta Daren.

          "Sí, durante unos años, pero al final no funcionó. Los dos seguimos adelante con nuestras vidas desde entonces, y no tuvimos hijos juntos, así que no hubo resentimientos. Desde que mi padre murió, he tenido que cuidar de mis hermanos yo sola, así que mi enfoque principal durante el último año ha sido mi trabajo y mi familia."

          "¿Pero qué hay de tu madre?", dice Kate.
      - source: scene_text_2
        paragraph: 24
        text: |-
          "Murió hace mucho, al dar a luz a mi hermanita."

          "Oh... Lo siento."

          Rose sonríe.

          "No hay necesidad, no podías haberlo sabido."

          "Entonces, ¿cómo manejaron todos la muerte de su gran sacerdote?", pregunta Daren, intentando cambiar de tema. "Dijiste que él era la última persona viva que podía crear comida de la nada en tu ciudad, así que imagino que debía haber algún plan de respaldo en caso de su inevitable muerte, ¿no?"

          "Oh, sí, mucha gente ha empezado a aprender agricultura, pero el problema es que la mayoría del terreno fértil alrededor de nuestro pueblo ya pertenece a los nobles. Si plantas tus semillas más lejos del pueblo, corres un gran riesgo de que tus cosechas sean saqueadas por monstruos."
