  - name: ch6_nobles
    texts:
      - source: scene_text
        paragraph: 373
        text: |-
          "¿Por qué la gente no se rebela contra los nobles?"

          "Algunos lo hacen, pero los nobles están respaldados por la realeza, así que la mayoría de la gente no se atreve a oponerse abiertamente a ellos. En nuestro pueblo, los rebeldes son casi inexistentes, pero he oído que en algunas ciudades con una situación similar a la nuestra hay guerras civiles en toda regla."

          "¿Y qué pasa con los dioses?", pregunta Daren. "¿No se están involucrando en nada de esto?"

          "Los únicos dioses que se están involucrando actualmente son el dios del destino y el dios de la muerte, pero dudo mucho que alguno de ellos tenga nuestros mejores intereses en mente. Se dice que los dos empezaron a trabajar juntos recientemente, y eso bien podría ser cierto, a juzgar por el alto nivel de cooperación entre sus seguidores últimamente".

          "Espera, ¿el dios del destino no es simplemente un título elegante para el Dios de las Ilusiones?", dice Daren.

          "Sí", responde Rose. "La mayoría de los dioses se nombran a sí mismos según el poder que sus seguidores obtienen al adorarlos. Algunos de ellos, sin embargo, eligen otros nombres para sí mismos, lo que puede resultar un poco confuso. Es lo mismo con el dios de la muerte. A juzgar por su nombre, pensarías que reina sobre el inframundo, pero en realidad es solo un dios de la Nigromancia, que trae a los muertos de vuelta a la vida para servir a sus órdenes".
