  - name: ch6_eiden_vs_dragon2
    texts:
      - source: scene_text
        paragraph: 434
        text: |-
          Tyrath se lanza hacia Eiden, pero este se teletransporta detrás del dragón y le dispara un rayo de fuego. Tyrath se sacude las llamas de encima y vuelve a escupir fuego contra el stillwater. Igual que la última vez, Eiden devuelve las llamas, pero esta vez también rodea al dragón con cuatro pilares de fuego que le explotan en la cara.

          ¿Qué está haciendo? ¿No sabe que los dragones son resistentes al fuego? ¿Por qué sigue atacándolo así?

          "¿Te burlas de mí, stillwater?" dice Tyrath. "Si no empiezas a pelear en serio, lo vas a lamentar."

          Eiden no dice nada, pero sigue sonriéndole al dragón con los ojos cerrados. Ahora está inundando todo el cielo con llamas, y se teletransporta cada vez que el dragón intenta alcanzarlo. Se teletransportan el uno tras el otro tan rápido que apenas puedo distinguir lo que está pasando. Todo el cielo parece estar en llamas, mientras las siluetas borrosas de los dos combatientes son ocasionalmente visibles a través del fuego.

          De repente, toda el área se cubre con una luz azul, y empiezo a sentir un inmenso poder mágico proveniente del aire que nos rodea.
      - source: scene_text_2
        paragraph: 57
        text: |-
          "¿Qué significa esto?" pregunta el dragón.

          "¿Ha pasado tanto tiempo que lo has olvidado, viejo amigo?" dice Eiden. "Solo porque no se han activado en más de un milenio no significa que estas trampas estén fuera de servicio. Esta solo estaba un poco desajustada, eso es todo. ¡Así que tuve que calentarla antes de que empezara a funcionar de nuevo!"

          "No puede ser..."

          La sonrisa de Eiden se amplía.

          "Los Lessathi tienen muchos defectos, pero la mala artesanía no es uno de ellos. ¡La mayoría de los artefactos que construyeron en los viejos tiempos siguen siendo completamente funcionales después de todo!"

          Mientras los dos hablan, el suelo tiembla violentamente y la luz azul se intensifica.

          "Escúchame, stillwater. Tus pequeños trucos no durarán para siempre. Esto no me mantendrá alejado por mucho tiempo. Y cuando salga, vas a desear no haber nacido nunca. ¿Me oyes? ¡Borra esa sonrisa de tu cara, maldito plebe..."

          Toda la magia en el aire se desata en un solo momento, y el dragón es teletransportado lejos, mientras la luz azul desaparece y el terremoto se detiene lentamente.

          Eiden se vuelve hacia mí.

          "Espero que no lo extrañes demasiado. Pasará un tiempo antes de que lo volvamos a ver."
