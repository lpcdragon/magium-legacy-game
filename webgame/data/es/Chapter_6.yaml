  - name: ch6_villain
    routes:
      - condition: ch3_kate_badly_hurt = 0
        texts:
          - source: scene_text
            paragraph: 383
            text: |-
              Kate lanza varios cientos de afiladas cuchillas de hielo hacia el dragón, pero simplemente rebotan en sus escamas blindadas.

              "¡Kate!", grita Daren desde la distancia. "¿Puedes... NGHHH... ¿Puedes hacerme un tobogán?"

              "Sí", grita Kate en respuesta, mientras rápidamente construye un tobogán de hielo que empieza debajo de él y termina en el suelo junto a nosotros. Una vez que ve el tobogán terminado, Daren clava furiosamente su espada en la garra del dragón, que empieza a gritar de dolor y lo suelta justo sobre el tobogán hecho a medida para él.

              Justo cuando Daren termina de deslizarse, el dragón usa su aliento de fuego de nuevo, esta vez apuntando directamente a Kate. Hace que un gran escudo grueso de hielo flote sobre ella para protegerse. Mientras las llamas y el hielo chocan, puedo ver que Kate está haciendo un gran esfuerzo por mantener el fuego a raya.

              Daren corre rápidamente a su posición y le proporciona cobertura antes de que su hielo se derrita. Desafortunadamente, la lucha también lo ha debilitado a él, y no logra mantener la barrera por mucho tiempo. Su barrera se rompe, y su escudo cae al suelo, justo cuando el dragón termina su ataque. La explosión de aire generada por la destrucción de la barrera de Daren lanzó a Rose por los aires, y se golpeó la cabeza contra una roca. Ahora yace en el suelo, inmóvil.

              Piensa, Barry. Piensa. ¿Qué puedes hacer para cambiar la situación? Tiene que haber algo. Tiene que haber una forma de usar todo lo que sabes a tu favor. Tiene que haber una forma. ¡Piensa!
          - source: scene_text_2
            paragraph: 33
            text: |-
              "Se acabó, humanos", grita el dragón triunfalmente desde lo alto. "Su era ha llegado a su fin. Voy a exterminar a cada uno de ustedes, hasta que todo lo que quede de su raza sea un recuerdo olvidado. Y me estoy reservando a Eiden para el final."

              No tiene sentido. Mi dispositivo de estadísticas es inútil aquí. Incluso si tuviera todas mis estadísticas al máximo no tendría oportunidad. Todo esto terminó antes de que comenzara.

              Mientras las llamas del dragón se vierten sobre nosotros, cierro los ojos, esperando mi inminente perdición. Después de unos segundos con los ojos cerrados, me doy cuenta de que sigo vivo. Abro los ojos de nuevo y descubro para mi sorpresa que las llamas del dragón se han detenido en el aire, a unos centímetros de alcanzarnos, como si estuvieran congeladas. Pero eso no es todo. Mirando a mi alrededor, veo que todo lo demás también está congelado. Daren, Kate y Rose están completamente quietos, y ya ni siquiera puedo sentir el viento.

              "En serio", escucho una voz familiar detrás de mí. "¿Cómo iba a dejarlo ganar después de soltar una frase así?"

              Me giro rápidamente y veo a Eiden de pie detrás de mí, con los ojos cerrados como de costumbre y una sonrisa en la cara.

              "Quiero decir, no creo haber leído ni un libro para niños donde el villano principal presuma hasta tal punto. Es vergonzoso, de verdad."
