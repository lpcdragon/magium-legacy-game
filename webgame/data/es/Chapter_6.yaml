            paragraph: 438
            text: |-
              "¿Qué acaba de pasar?"

              "Lamento lo de tu duelo, Barry. Me temo que tendrás que continuarlo en otra ocasión. Tyrath fue atrapado en una vieja trampa para dragones que lleva aquí unos cuantos miles de años. La trampa se suponía que debía activarse a la primera señal de llamas, pero como ha pasado al menos un milenio desde la última vez que se usó, su mecanismo estaba un poco oxidado. Por eso necesitaba calentarse antes de poder activarse. ¡Esa descarga de energía de la trampa seguramente habrá frito tu dispositivo de estadísticas, pero no te preocupes, se recuperará en unos minutos con todas tus estadísticas anteriores!"

              "¿Qué le hizo la trampa al dragón?"

              "Lo transportó a una prisión de dragones en esta isla. Como dudo que haya alguien vigilándola a estas alturas, imagino que no tendrá muchos problemas para escapar, pero aun así, todavía tendrá que destruir las defensas automáticas de la prisión y tendrá que viajar de vuelta hasta aquí. Así que debería pasar al menos unos días antes de que vuelva."
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: ch6_eiden_leaves
      - condition: ch6_lessathi = 2
        texts:
          - source: scene_text
            paragraph: 439
            text: |-
              "¿Quiénes son los Lessathi?"

              "Los Lessathi son la raza más antigua de este continente. Aunque el nombre es un poco difícil de recordar, así que la mayoría de la gente prefiere llamarlos simplemente "los antiguos". Su talento para fabricar artefactos y dispositivos mágicos no tenía rival hace mil años, y todavía usamos muchos de esos artefactos hoy en día. La trampa que acaba de activarse también fue hecha por ellos hace unos dos mil años. Se suponía que debía activarse a la primera señal de llamas, pero como ha pasado al menos un milenio desde la última vez que se usó, su mecanismo estaba un poco oxidado. Por eso necesitaba calentarse un poco primero. ¡Esa descarga de energía de la trampa seguramente habrá frito tu dispositivo de estadísticas, pero no te preocupes, se recuperará en unos minutos con todas tus estadísticas anteriores!"

              "¿Qué le hizo la trampa al dragón?"

              "Lo transportó a una prisión de dragones en esta isla. Como dudo que haya alguien vigilándola a estas alturas, imagino que no tendrá muchos problemas para escapar, pero aun así, todavía tendrá que destruir las defensas automáticas de la prisión y tendrá que viajar de vuelta hasta aquí. Así que debería pasar al menos unos días antes de que vuelva."
        choices:
