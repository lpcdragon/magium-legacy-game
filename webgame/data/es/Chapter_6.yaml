    routes:
      - condition: ch2_human_reason = 1 AND ch3_kate_badly_hurt = 0
        texts:
          - source: scene_text
            paragraph: 339
            text: |-
              "Asegurarla. Más vale prevenir que lamentar".

              "Como desees".

              Una vez que termina de encantar mi mochila, me la devuelve y luego se dirige a Rose.

              "Veo que estás muy interesada en mi oficio. ¿Te gustaría que también encantara tu mochila?"

              Rose se sonroja, dándose cuenta de que había sido un poco demasiado obvia en su curiosidad.

              "¡Sería un honor!", responde ella.

              Una vez que termina con su mochila también, continuamos nuestro camino.

              Pasamos las siguientes horas viajando hacia el sur, tomando la ruta más directa disponible hacia el pueblo de Rose. Su ruta habitual estaba diseñada para evitar la mayoría de las zonas conocidas por ser frecuentadas por monstruos, pero Daren insistió en entregar la cura a los enfermos lo antes posible, y dijo que nuestro grupo debería ser más que capaz de manejar unos cuantos ataques de monstruos.

              El paisaje que hemos visto durante nuestro viaje ha sido bastante decepcionante. Quizás mis expectativas eran demasiado altas, pero siempre pensé que el legendario continente de Varathia estaría lleno de todo tipo de maravillas naturales y criaturas míticas. Todo lo que he visto hoy han sido los típicos bosques de pinos y robles, con un lago o un río aquí y allá para evitar que se vuelva completamente monótono. Al menos han pasado unas horas desde la última vez que nos atacaron, lo cual es todo un logro, a juzgar por cómo ha ido este torneo hasta ahora.
