  - name: ch6_improvise2
    texts:
      - source: scene_text
        paragraph: 418
        text: |-
          "No sé cómo pudiste ver a través de mi ilusión, humano, pero ya no voy a tomármelo con calma contigo."

          Tras terminar su frase, el dragón aparece inmediatamente frente a mí y balancea una de sus garras hacia mi pecho. Lo único que pude hacer fue teletransportarme fuera de peligro a tiempo, con un hechizo de corto alcance apto para combate.

          El dragón y yo pasamos los siguientes segundos teletransportándonos uno tras otro e intentando tomarnos por sorpresa mutuamente. Esto no me está llevando a ningún lado. Desato una poderosa explosión de fuego a mi alrededor, que empuja al dragón unos metros hacia atrás, pero no le hace el menor daño.

          Es verdad. Las leyendas siempre decían que los dragones son inmunes a las llamas, así como a los hechizos que afectan la mente y a las ilusiones. Maldición, hay tantos hechizos grandes que podría lanzar ahora mismo, pero casi todos pondrían en peligro a Kate, Daren, Rose e incluso a mí mismo. Tendría que volver con los demás y lanzar algunos hechizos de protección antes de empezar a disparar tornados con las yemas de los dedos. Si lo hago ahora, quizás aún tenga tiempo para terminar esta pelea antes de que se acaben mis cinco minutos.
    choices:
      - position: 1
        text: Seguir peleando con hechizos seguros
        effects:
          - set:
              current_scene: ch6_elemental3
      - position: 2
        text: Empezar a pelear con hechizos más grandes
        effects:
          - set:
              current_scene: ch6_big_not_planned
  - name: ch6_elemental2
    texts:
