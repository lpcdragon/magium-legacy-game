              "Interesante", dice Eiden. "Rose, he lanzado un hechizo que se supone que congela el tiempo para todos excepto para mí y Barry. ¿Has estudiado magia del tiempo en algún momento de tu vida, por casualidad?"

              "Eh... no, no puedo lanzar ningún tipo de magia. No soy maga."

              La sonrisa de Eiden se ensancha.

              "¡Entonces te ofrezco mis más sinceras felicitaciones. A partir de este momento, eres oficialmente una tejedora del tiempo!"

              "¿Una... qué?"

              Eiden se vuelve hacia mí.

              "Barry, debo admitir que no creo haber visto tanta diversidad en un equipo antes. Una tejedora del tiempo, un sanador con armadura, una superviviente del Faro de Esperanza y un portador de dispositivo de estadísticas. ¡Creo que estoy empezando a apoyarlos!"
