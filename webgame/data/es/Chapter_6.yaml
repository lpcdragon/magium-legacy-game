      - condition: ch2_deer_interaction = 1 AND ch3_treasure = 0
        texts:
          - source: scene_text
            paragraph: 329
            text: |-
              Justo cuando llegamos a la entrada de la cueva, vemos a Molan, el cervatillo, saltando de un lado a otro, muy emocionado.

              "¡Mami, mami, ven rápido! ¡Es la tía Rose! ¡La tía Rose vino a visitarnos!"

              La habitual sonrisa cálida de Rose desapareció de su rostro cuando vio al cervatillo y fue reemplazada por una expresión triste en sus ojos.

              "¿Rose?", dice Elaria mientras sale de la cueva. "Rose, ¿eres tú?"

              "Sí...", responde Rose en el lenguaje de los ciervos, sin atreverse a mirarla a los ojos. "Ha pasado mucho tiempo".

              "Así es. No te hemos visto en meses. Y solías visitarnos tan seguido. Rose, sabes que siempre serás bienvenida en nuestro hogar, ¿verdad?"

              "Lo sé... Lo siento, tengo que irme ahora".

              "¿Tía Rose, no te vas a quedar?", le pregunta el cervatillo.

              "No te preocupes, pequeño", le dice Elaria a su hijo. "Estoy segura de que volverá y se quedará más tiempo cuando esté lista. Debe tener algo importante que hacer. Ya sabes cómo es ella, siempre ocupada ayudando a la gente".
          - source: scene_text_2
            paragraph: 8
            text: |-
              "Gracias... y lo siento", dice Rose, haciendo una reverencia, y luego se aleja de los ciervos.

              "Aquí están sus cosas", dice Elaria, mostrándonos nuestras mochilas. "Me tomé la libertad de preparar algo más de comida para ustedes, por si les da hambre y quieren comer algo que no sean raíces y bayas".

              "Gracias por toda tu ayuda", le digo. "¡Espero que nos volvamos a ver!"

              "Es un continente pequeño. Estoy segura de que nuestros caminos se cruzarán de nuevo algún día".

              Kate y yo nos despedimos de los dos ciervos y seguimos nuestro camino.

              Antes de irnos, me aseguro de llevarme mis botines de guerra de las escaramuzas de esta mañana: una ballesta de uno de los ballesteros que nos emboscaron y una daga de uno de los hombres de Dave el Degollador.

              Nos reunimos con Rose y emprendemos nuestro largo camino.

              Rose parece un poco consternada después de su conversación con Elaria. Me pregunto si debería decirle algo, dadas las circunstancias.
        choices:
          - position: 1
            text: Dejarla tranquila
            effects:
              - set:
                  current_scene: ch6_alone
          - position: 2
            text: Preguntarle cómo conoció a Elaria
            effects:
              - set:
                  current_scene: ch6_met
          - position: 3
            text: Preguntarle si pasó algo entre ella y Elaria
            effects:
              - set:
                  current_scene: ch6_happened
