                  ch6_won_dragon: 2
  - name: ch6_big_not_planned
    texts:
      - source: scene_text
        paragraph: 426
        text: |-
          Estoy perdiendo el tiempo así. No tiene sentido tener todo este poder si no lo uso al máximo.

          Me teletransporto junto a Kate y Daren y conjuro una barrera fuerte a su alrededor y al de Rose para impedir que entre el dragón.

          "Barry, ¿qué ha pasado?", me pregunta Daren. "Este poder mágico que irradia de ti... ¡Es una locura!"

          "Te lo explico después. No tengo mucho tiempo, y necesitaré concentrarme al máximo en lanzar estos hechizos de protección."

          Después de terminar de lanzar los hechizos sobre los tres, hago lo mismo con Rose, y luego salgo volando de la barrera para enfrentar al dragón otra vez. Por fin, ahora puedo ir con todo.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch6_big_spells2
  - name: ch6_big_spells2
    routes:
      - condition: ch6_defense <> 3
        texts:
          - source: scene_text
            paragraph: 427
            text: |-
              Levanto mis manos en el aire y siento todo mi poder mágico fluir a través de mí. Esto es lo que siempre he querido. Esto es lo que he estado buscando toda mi vida. No voy a dejar que un solo dragón se interponga en mi camino.

              Empiezo creando un tornado. El viento a mi alrededor es ahora tan fuerte que literalmente está arrancando trozos de roca del suelo y haciéndolos volar a mi alrededor, chocando con los árboles que van siendo arrancados de raíz uno a uno. Es casi como un escenario de un libro de terror.

              El dragón lucha por mantenerse en el aire, mientras mis protecciones contra el viento me permiten volar a través de las corrientes con facilidad. A continuación, uso mi magia de tierra para animar un gigante hecho de roca. El suelo tiembla violentamente, mientras un enorme gólem de roca se levanta lentamente de él, haciendo que parezca que simplemente hubiera estado durmiendo todo este tiempo. Una vez se pone en pie, puedo ver que el gigante mide unos impresionantes sesenta metros, y en cuanto ve al dragón, usa sus enormes manos para aplastarlo entre ellas.

              Tyrath suelta un rugido ensordecedor. Un rugido tan poderoso que crea una explosión de aire a su alrededor, y realmente destroza las manos del gigante, liberando al dragón. Fue tan fuerte que tuve que usar un hechizo para evitar perder el conocimiento. Solo puedo esperar que Daren y los demás tengan acceso a protección sónica también.
          - source: scene_text_2
            paragraph: 50
            text: |-
              Aunque logró salir, es evidente que Tyrath ha recibido mucho daño de mi último ataque. Ahora está escupiendo fuego más caliente que nunca, envolviendo a mi gigante de roca en llamas y convirtiéndolo en lava fundida.

              Inténtalo todo lo que quieras, pequeño dragón, pero no escaparás de mis garras. Nada puede detenerme ahora.

              Decenas de volcanes empiezan a erupcionar de la tierra mientras uso aún más poder mágico, esta vez para invocar una lluvia de ácido. El dragón grita mientras el ácido quema sus alas, y empieza a disparar fuego desesperadamente por encima de él, para quemar todo el ácido antes de que lo alcance. Me teletransporto junto a Tyrath y apunto mis palmas hacia él, lanzándolo lejos con una poderosa explosión de aire que lo aturde durante unos segundos. Como interrumpí su defensa contra las gotas de ácido, la lluvia ahora vuelve a caer sobre él, y el dragón empieza a gritar de dolor otra vez.

              Se acabó. No es rival para mí. El tiempo que me queda será más que suficiente para acabar con él definitivamente.
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: ch6_win_fight
                  ch6_won_dragon: 1
      - condition: ch6_defense = 3
        texts:
          - source: scene_text
            paragraph: 428
            text: |-
              Levanto mis manos en el aire y siento todo mi poder mágico fluir a través de mí. Esto es lo que siempre he querido. Esto es lo que he estado buscando toda mi vida. No voy a dejar que un solo dragón se interponga en mi camino.

              Empiezo creando un tornado. El viento a mi alrededor es ahora tan fuerte que literalmente está arrancando trozos de roca del suelo y haciéndolos volar a mi alrededor, chocando con los árboles que van siendo arrancados de raíz uno a uno. Es casi como un escenario de un libro de terror.

              El dragón lucha por mantenerse en el aire, mientras mis protecciones contra el viento me permiten volar a través de las corrientes con facilidad. A continuación, uso mi magia de tierra para animar un gigante hecho de roca. El suelo tiembla violentamente, mientras un enorme gólem de roca se levanta lentamente de él, haciendo que parezca que simplemente hubiera estado durmiendo todo este tiempo. Una vez se pone en pie, puedo ver que el gigante mide unos impresionantes sesenta metros, y en cuanto ve al dragón, usa sus enormes manos para aplastarlo entre ellas.

              Tyrath suelta un rugido ensordecedor. Un rugido tan poderoso que crea una explosión de aire a su alrededor, y realmente destroza las manos del gigante, liberando al dragón. Fue lo bastante fuerte como para haberme hecho perder el conocimiento, de no ser por mis protecciones contra ataques sónicos. Solo puedo esperar que Daren y los demás tengan acceso a protección sónica también.
