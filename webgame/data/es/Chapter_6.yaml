  - name: ch6_think
    texts:
      - source: scene_text
        paragraph: 391
        text: |-
          Mientras Eiden desaparece por completo, el tiempo empieza lentamente a reanudar su curso. Sigo el consejo del Stillwater y rápidamente conjuro una barrera protectora alrededor de Kate y Daren. Es increíble lo natural que se siente esto. Es como si hubiera estado lanzando hechizos toda mi vida. ¿Es este realmente el verdadero poder de mi dispositivo de estadísticas?

          Justo cuando termino de lanzar mi hechizo, el tiempo se descongela y el fuego del dragón golpea mi barrera mágica directamente. Las llamas entonces se dispersan en el aire, mientras Kate mira a su alrededor, sorprendida por el descubrimiento de la barrera recién formada que la protege.

          "Daren, ¿tú...?"

          "No, no fui yo. Esta barrera es infinitamente más fuerte que cualquier cosa que yo pudiera conjurar. No sé quién hizo esto."

          "¡Tú!", grita el dragón Tyrath desde lo alto del cielo, señalándome. "¡Tú hiciste esto! No importa. Todo lo que has logrado es convertirte en mi siguiente objetivo. ¡Prepárate para morir!"
      - source: scene_text_2
        paragraph: 41
        text: |-
          Conjuro otra barrera protectora alrededor de mí y Rose justo a tiempo para defendernos de las llamas que se aproximan. Mi barrera aguanta mucho mejor que la de Daren. No hay señales de que se vaya a romper pronto, y apenas siento el calor fuera de ella.

          La pregunta es, ¿qué voy a hacer ahora? Mirando mi dispositivo, puedo ver que mis estadísticas se han mantenido exactamente iguales y no tengo puntos extra disponibles, así que, ¿qué le hizo Eiden? Tendré que averiguarlo más tarde.

          En todo caso, a juzgar por la cantidad de energía extra que puedo sentir en el dispositivo de estadísticas y la velocidad a la que se consume, diría que la estimación que Eiden me dio es precisa. Tengo menos de cinco minutos para terminar esta pelea, pero incluso con todo este poder mágico, el dragón bien podría pulverizarme en un combate uno a uno si no hago esto bien. Tanto Daren como Kate están demasiado agotados para ayudarme, así que estoy solo por el momento. Incluso mientras estoy aquí pensando, el tiempo se agota, pero ¿puedo permitirme empezar a pelear sin ningún plan?
    choices:
      - position: 1
        text: No hay tiempo para pensar. Improvisaré.
        effects:
          - set:
              current_scene: ch6_improvise
              ch6_improvise: 1
      - position: 2
        text: Hacer un plan antes de enfrentar al dragón.
        effects:
          - set:
              current_scene: ch6_plan
              ch6_improvise: 2
  - name: ch6_improvise
    texts:
      - source: scene_text
        paragraph: 392
        text: |-
          Tener todos estos poderes no significa nada si me quedo aquí sentado y los dejo desperdiciarse. Voy a tener que improvisar. Lo primero es lo primero, necesito salir de esta barrera sin acabar carbonizado.

          Lanzo un hechizo de protección contra el fuego, y luego un hechizo para volar. Salgo volando de la barrera, y directo a través de las llamas abrasadoras. Se siente como si estuviera en un horno, pero al menos no tengo quemaduras visibles. El dragón me ve volar a través de su fuego y suelta un rugido intimidante. Me posiciono a la misma altura que él, a unas decenas de metros de donde está flotando y me detengo en el aire.

          Probemos con ácido primero. Creo una bola de ácido y la envío volando hacia el dragón. Tyrath aplaude sus alas, lo que genera una fuerte ráfaga de viento que dispersa el ácido, y me envía girando hacia atrás. Eso me desorientó un poco, así que me tomó unos segundos averiguar adónde fue el dragón. Una vez que lo localizo, le envío un potente chorro de agua en su dirección. El dragón es empujado hacia atrás por la fuerza del impacto, pero aparte de eso, no parece que sufriera ningún daño.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch6_stat_checks
  - name: ch6_plan
    texts:
      - source: scene_text
        paragraph: 393
        text: |-
          Ir sin un plan sería suicida. Tendré que usar este tiempo lo más eficientemente posible. En primer lugar, necesito pensar en mis defensas. Ahora tengo acceso a docenas de poderosos hechizos de protección, pero me tomaría tres minutos lanzarlos todos.

          Incluso si uso el hechizo de congelación del tiempo que Eiden lanzó hace un momento, eso solo me ahorraría unos dos minutos, y me volvería incapaz de usar el hechizo durante el resto de la batalla. Por otro lado, el hechizo de detención del tiempo no es realmente adecuado para el combate, ya que el hechizo se rompe en cuanto me muevo unos metros o interactúo con alguien que está congelado, así que este podría ser el mejor momento para usarlo. ¿O quizás debería intentar limitar el lanzamiento de magia solo a lo absolutamente necesario?

          Veamos... Lo que más voy a necesitar es protección contra el fuego. No puedo pasarme toda la pelea atrapado dentro de esta barrera, y este hechizo me dará algo de inmunidad contra las llamas. Seguirá sintiéndose como estar en un horno, pero al menos no acabaré carbonizado.

          Aparte de eso, a juzgar por cómo he visto pelear al dragón hasta ahora, creo que también me vendría bien algo de protección contra daño físico, para defenderme de sus ataques con garras. No será suficiente para evitar que me mate si me da un golpe, pero quizás me ayude a desviar algunos de sus ataques.
      - source: scene_text_2
        paragraph: 42
        text: |-
          El fuerte viento que puede generar con sus alas también podría ser un problema. Se sentía como si estuviera intentando luchar contra un huracán cuando el dragón hizo su primera aparición, así que supongo que también podría usar algunos hechizos de protección contra el viento.

          Aparte de eso, todo es incertidumbre. Se dice que algunos de los dragones más antiguos pueden lanzar magia, pero no sé si Tyrath es uno de ellos. Más aún, no tengo forma de saber en qué tipo de magia estaría especializado.

          Voy a tener que decidir qué hechizos de protección lanzo en el limitado tiempo que tengo a mi disposición.
    choices:
      - position: 1
        text: Lanzar solo protección contra el fuego. No hay tiempo para más.
        effects:
          - set:
              current_scene: ch6_offense
              ch6_defense: 1
      - position: 2
        text: Lanzar protección contra el fuego, el viento y el daño físico
        effects:
          - set:
              current_scene: ch6_offense
              ch6_defense: 2
      - position: 3
        text: Congelar el tiempo, luego lanzar todos los hechizos de protección que conozca, por si acaso
        effects:
          - set:
              current_scene: ch6_offense
              ch6_defense: 3
  - name: ch6_offense
    texts:
      - source: scene_text
        paragraph: 394
        text: |-
          El dragón ve que su aliento de fuego no está funcionando, así que intenta lanzarse en picado otra vez. Mi barrera es demasiado fuerte para romperse tan fácilmente como la de Daren, así que estará ocupado un rato.

          Ahora que he establecido mi estrategia defensiva, necesito pensar en la ofensiva. Con los hechizos a los que tengo acceso ahora, tengo opciones casi ilimitadas, pero tendré que pensar en una táctica que pueda derrotar a Tyrath en los pocos minutos que me quedan.

          Definitivamente voy a necesitar lanzarme un hechizo de vuelo, ya que será demasiado difícil enfrentarme al dragón de otra manera.

          Lo que más me falta aquí es información sobre mi enemigo. Lo único de lo que dispongo son leyendas y cuentos de hadas, y no estoy seguro de cuánto puedo confiar en ninguno de ellos en esta situación. Una cosa en la que la mayoría de las leyendas coinciden es que los dragones tienen una alta resistencia elemental al fuego y que son inmunes a los hechizos que afectan la mente y a las ilusiones. Aparte de eso, no tengo idea de qué hechizos funcionarían mejor.

          Ya sé que el hielo de Kate no le hizo mucho daño al dragón, pero ¿quizás el agua sería una mejor opción? El agua es, después de todo, el elemento opuesto al fuego. En realidad, olviden el agua, si voy a probar magia elemental bien podría probarlos todos, excepto el fuego, por supuesto.

          La espada de Daren pareció al menos poder atravesar las duras escamas del dragón, pero no sé qué encantamientos tiene. Quizás podría persuadirlo de que me preste su espada durante esta batalla, y luego puedo pelear contra Tyrath cuerpo a cuerpo. La desventaja de este plan es que no parece que tenga un hechizo de mejora de fuerza en mi repertorio, así que el poder de mi golpe dependería enteramente de mi estadística de fuerza.
      - source: scene_text_2
        paragraph: 43
        text: |-
          La magia de cambio de forma es bastante inútil en esta situación, por dos razones principales. En primer lugar, estos hechizos no se pueden usar para transformarse en algo mucho más grande que mi tamaño real, así que no es como si pudiera simplemente convertirme en un dragón y pelear contra Tyrath en igualdad de condiciones. En segundo lugar, no se pueden lanzar hechizos mientras estás transformado, así que mi movilidad se vería muy reducida porque no podría teletransportarme. Simplemente no vale la pena de ninguna manera que lo mire.

          Usar magia de invocación también está descartado, ya que ninguno de estos hechizos fue diseñado para pelear contra un enemigo de este calibre. Lo máximo que cualquiera de las criaturas invocadas podría hacer es molestar moderadamente a Tyrath o servir de distracción.

          Quizás estoy pensando a demasiado pequeña escala. Con los poderes que tengo a mi disposición ahora mismo, podría estar haciendo mucho más daño. Literalmente podría crear un tornado de la nada, o usar magia de tierra para animar un gigante de roca que haría que el dragón pareciera un enano y que podría aplastarlo entre sus manos. También podría crear una ventisca, una tormenta de rayos, una lluvia de ácido e incluso una lluvia de meteoritos.

          El problema con todos estos hechizos grandes es que es casi imposible evitar el daño colateral, así que me vería obligado a lanzar muchas protecciones sobre Daren, Kate, Rose e incluso sobre mí mismo antes para asegurarme de que todos estemos a salvo, lo que me llevaría aproximadamente un minuto. El hechizo de congelación del tiempo no me ahorraría mucho tiempo en este caso, ya que estamos relativamente lejos unos de otros, y moverme cancelaría el efecto de detención del tiempo.

          Ya ha pasado medio minuto de mi tiempo. Tendré que decidir rápido.
    choices:
      - position: 1
        text: Usar magia elemental
        effects:
          - set:
              current_scene: ch6_elemental
              ch6_offense: 1
      - position: 2
        text: Pedir prestada la espada de Daren
        effects:
