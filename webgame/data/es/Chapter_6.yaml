  - name: ch6_sword2
    texts:
      - source: scene_text
        paragraph: 420
        text: |-
          "No sé cómo pudiste ver a través de mi ilusión, humano, pero ya no voy a tomármelo con calma contigo."

          El dragón entonces escupe fuego más caliente que nunca hacia mí. Instintivamente, sostengo la espada frente a mí para defenderme de su ataque. Para mi sorpresa, veo que la espada en realidad absorbe todas las llamas del dragón, y ahora irradia poder mágico, como si estuviera envuelta en llamas.

          ¿La espada de Daren podía hacer algo así? ¿Qué clase de encantamientos locos tiene esta cosa? ¿Significa esto que puedo usar las llamas del dragón como propias?

          Hago un corte con la espada hacia el dragón, lo que envía todas sus llamas de vuelta hacia él, concentradas en un potente rayo.

          ¡Funcionó! ¡No puedo creerlo! Déjame probar si también puede absorber otros elementos mágicos. Concentro mi poder mágico en la espada en forma de rayo. Puedo sentir cómo la espada se carga y cuando termino mi hechizo, puedo ver la corriente eléctrica recorriéndola.
      - source: scene_text_2
        paragraph: 46
        text: |-
          Mientras Tyrath vuela hacia mí, le asesto un espadazo, que desata un poderoso ataque eléctrico que le da de lleno. Eso no le afecta al dragón en lo más mínimo y cuando me alcanza, me ataca con sus garras de nuevo.

          Me teletransporto fuera de su alcance, e intento pensar rápido cuál debería ser mi siguiente movimiento. El fuego no funciona, los rayos no funcionan, el hielo tampoco funciona y no veo cómo potenciar esta espada con aire, agua o tierra serviría de algo. Eso solo deja el ácido como opción, pero la pregunta es, ¿el ácido será absorbido por la espada como todos los demás elementos, o derretirá completamente el metal?

          Solo hay una forma de averiguarlo.
    choices:
      - position: 1
        text: Usar ácido en la espada
        effects:
          - set:
              current_scene: ch6_sword_acid
      - position: 2
        text: Pelear con la espada normalmente
        effects:
          - set:
              current_scene: ch6_sword_simple
  - name: ch6_elemental3
    routes:
      - condition: ch6_defense <> 3
        texts:
          - source: scene_text
            paragraph: 421
            text: |-
              Lanzar hechizos de protección sobre todos desperdiciaría demasiado tiempo. Tendré que hacer mejor uso de mis hechizos ofensivos.

              Uso mi magia de tierra para romper el suelo rocoso en pedazos, y hago que los grandes trozos de roca vuelen hasta mi posición. Luego hago que todas las rocas giren a mi alrededor a gran velocidad, usándolas como escudo contra el dragón. Si intenta más teletransportes sorpresa, va a ser apaleado.

              Saco más trozos de roca del suelo y los envío todos volando hacia Tyrath. Intenta teletransportarse para esquivarlos, pero hay demasiados, y le dan unos cuantos. Ruge furiosamente. Por fin, le hice algo de daño.

              Saco aún más rocas del suelo y hago que todas lo persigan, mientras intenta volar para esquivarlas. Las rocas solo aumentan en número, porque no puede destruirlas con sus garras más rápido de lo que yo puedo crearlas.

              Después de recibir unos cuantos golpes más, Tyrath escupe llamas más calientes que nunca, convirtiendo todas mis rocas en lava fundida. Luego vuela directo a través de la lava y se dirige hacia mí otra vez. Escupe su fuego hacia mí, y convierte todas las rocas que giran a mi alrededor en lava también. Esto no va bien. La lava no es lo bastante sólida para molestarlo, y puede simplemente ignorar el calor dada su resistencia al fuego.
          - source: scene_text_2
            paragraph: 47
            text: |-
              Suelto la lava que gira a mi alrededor, y disparo un rayo de mis manos, lo bastante grande como para envolver al dragón entero. Esto no detiene a Tyrath en su vuelo, y me veo obligado a teletransportarme de nuevo fuera de su camino cuando me alcanza. Los rayos tampoco funcionan. Si puede derretir roca tan fácilmente, entonces no tendrá problemas contra el agua. ¿Qué demonios se supone que use contra él? ¿Ácido?

              Rodeo al dragón con una esfera de ácido, e intento envolverlo en ella. Tyrath suelta un rugido mucho más poderoso que antes. Tan poderoso, de hecho, que crea una explosión de aire a su alrededor, y envía mi ácido volando por todas partes. Su rugido fue tan fuerte que tuve que usar un hechizo para evitar perder el conocimiento. Solo puedo esperar que Daren y los demás tengan acceso a protección sónica también.

              "¡Miserable insolente!", grita el dragón. "¡No quedará ni una mota de polvo de ti cuando termine!"

              Tyrath empieza a teletransportarse hacia mí otra vez, pero esta vez lo hace más rápido. Apenas puedo seguirle el ritmo. ¿Qué demonios estoy haciendo? ¡Controlo más poder mágico del que jamás soñé que sería posible, pero no puedo contener a un solo dragón?!
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: ch6_lose_fight
