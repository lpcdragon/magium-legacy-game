            paragraph: 389
            text: |-
              "¿Qué es una tejedora del tiempo?"

              "Podría decírtelo, pero, ¿no preferirías descubrirlo por ti mismo? ¿No preferirías vivir la emoción de desentrañar este misterio por tu cuenta?

              "No, gracias. Soy el tipo de persona que siempre se spoilea el final antes de terminar un libro."

              "Muy bien. Verás, Barry, una tejedora del tiempo es una persona con un talento natural para manipular el tiempo. Son inmunes a todos los hechizos que afectan al tiempo, pueden congelar el tiempo, ralentizarlo e incluso revertirlo con suficiente práctica. También tienen el don de ver el futuro, aunque es más bien visiones borrosas que otra cosa. Las tejedoras del tiempo son extremadamente raras, y se dice que solo aparecen en el amanecer de una nueva era. Normalmente llevan vidas normales hasta que sus poderes despiertan de repente. La última aparición conocida de una tejedora del tiempo ocurrió hace unos seiscientos años."

              Por un momento, pareció que el tiempo empezaba a reanudar su curso. Pude oír los gritos de Daren, el rugido del dragón, el viento soplando en mi oído, y pude ver la hierba empezar a moverse. Luego todo se congeló de nuevo, como si nada hubiera pasado.

              "Se acaba el tiempo, Barry", dice Eiden. "El hechizo de congelación del tiempo no durará mucho más."

              Eiden chasquea los dedos y mi dispositivo de estadísticas sale volando de mi mano hacia la suya. El dispositivo entonces empieza a brillar de repente y parece que está acumulando una cantidad masiva de energía en muy poco tiempo.
