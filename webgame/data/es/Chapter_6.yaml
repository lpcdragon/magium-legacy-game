        texts:
          - source: scene_text
            paragraph: 385
            text: |-
              "¿Dónde has estado escondido todo este tiempo?"

              "Vamos, vamos, Barry, ¿así se le habla a tu salvador? Para responder a tu pregunta, he estado siguiendo a este dragón durante un tiempo. He estado enmascarando mi presencia para que no pudiera encontrarme usando su vista, olfato, oído o sentido mágico. He estado observando tu batalla desde que comenzó y debo decir que no estoy muy impresionado."

              "¿Me estás tomando el pelo? ¿Qué esperas que haga contra un dragón?"

              "¿Qué tal usar ese dispositivo que tienes en la mano?"

              "¿Sí? ¿Y qué quieres que haga? ¿Maximizar mi fuerza y matarlo a puñetazos?"

              "Em... disculpe... señor..."

              Eiden y yo nos giramos al mismo tiempo y vemos que Rose está de pie y mirando a Eiden, confundida.

              "Em... Hola... Me llamo Rose. ¿Eres amigo de Barry?"

              Eiden frunce el ceño, y hace un gesto con la mano hacia Rose.
          - source: scene_text_2
            paragraph: 35
            text: |-
              "¿Q-Qué estás haciendo?", le pregunta Rose.

              "Interesante", dice Eiden. "Rose, he lanzado un hechizo que se supone que congela el tiempo para todos excepto para mí y Barry. ¿Has estudiado magia del tiempo en algún momento de tu vida, por casualidad?"

              "Eh... no, no puedo lanzar ningún tipo de magia. No soy maga."

              La sonrisa de Eiden se ensancha.

              "¡Entonces te ofrezco mis más sinceras felicitaciones. A partir de este momento, eres oficialmente una tejedora del tiempo!"

              "¿Una... qué?"

              Eiden se vuelve hacia mí.

              "Barry, debo admitir que no creo haber visto tanta diversidad en un equipo antes. Una tejedora del tiempo, un sanador con armadura, una superviviente del Faro de Esperanza y un portador de dispositivo de estadísticas. ¡Creo que estoy empezando a apoyarlos!"
