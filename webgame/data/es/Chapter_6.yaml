  - name: ch6_sword_acid
    texts:
      - source: scene_text
        paragraph: 423
        text: |-
          Es todo o nada. Si todos morimos aquí, no es como si Daren fuera a necesitar esta espada de todos modos. Hagámoslo.

          Lanzo mi hechizo de ácido sobre la espada, y la veo tornarse verde lentamente, mientras empieza a salir vapor de ella. La espada ahora está empapada en ácido, pero el agente corrosivo no está corroyendo el metal como uno esperaría normalmente. En cambio, parece estar potenciándolo. Esta espada es definitivamente una obra impresionante. Si Daren tuviera acceso a magia elemental, sería imparable.

          Esto es. Esta es la carta ganadora que estaba esperando. El dragón ya no tiene ninguna oportunidad.

          Me teletransporto justo al lado de Tyrath y le clavo mi hoja en el pecho. El ácido derrite sus escamas, y la espada atraviesa su dura piel como un cuchillo caliente en mantequilla. El dragón empieza a gritar de dolor, y se teletransporta lejos, disparándome llamas. Las bloqueo con mi espada, pero esto reemplaza el efecto de ácido que tenía antes por uno de fuego. Así que así es como funciona esta cosa.
      - source: scene_text_2
        paragraph: 49
        text: |-
          Le devuelvo el fuego a Tyrath, y lanzo ácido en la espada una vez más. Me teletransporto junto a él otra vez, y le ataco con mi espada potenciada con ácido. Bloquea mi ataque con una de sus garras, pero la espada aún así atraviesa su gruesa piel.

          El dragón pasa el siguiente minuto a la defensiva, teletransportándose lejos de mis ataques y disparándome fuego, mientras yo intento anticipar sus movimientos y teletransportarme tras él. Logra esquivar la mayoría de mis ataques, pero los pocos golpes que le doy le están causando bastante daño. A este ritmo no tendré ningún problema para acabar con él antes de que se me agote la magia.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch6_win_fight
              ch6_won_dragon: 1
  - name: ch6_sword_simple
    routes:
      - condition: strength < 4
        texts:
          - source: scene_text
            paragraph: 424
            text: |-
              Ya he decidido que necesito la espada de Daren para ganar esta pelea. El riesgo de perder la hoja echándole ácido es demasiado grande para que valga la pena.

              Voy a tener que hacer esto rápido. Me teletransporto junto al dragón y le clavo mi hoja en el pecho.

              La espada apenas araña sus escamas blindadas, y el dragón aprovecha mi ataque fallido para balancear su garra derecha hacia mí. Logro bloquear su golpe con mi espada, pero entonces casi inmediatamente me azota con su cola, obligándome a teletransportarme lejos de él.

              Paso los siguientes veinte segundos teletransportándome dentro y fuera del alcance del dragón, intentando romper sus escamas blindadas, pero es inútil. Ni siquiera puedo acercarme a alcanzar su piel con mi hoja.

              Ahora Tyrath ha pasado a la ofensiva. Se teletransporta más rápido y me obliga a gastar mi tiempo esquivando sus ataques en vez de buscar aperturas. Apenas puedo seguirle el ritmo. ¿Qué demonios estoy haciendo? ¡Controlo más poder mágico del que jamás soñé que sería posible, pero no puedo contener a un solo dragón?!
        effects:
          - set:
              failed_checks:
                - '[ Comprobación de fuerza fallida - nivel 4 ]'
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: ch6_lose_fight
      - condition: strength = 4
        texts:
          - source: scene_text
            paragraph: 425
            text: |-
              Ya he decidido que necesito la espada de Daren para ganar esta pelea. El riesgo de perder la hoja echándole ácido es demasiado grande para que valga la pena.

              Voy a tener que hacer esto rápido. Me teletransporto junto al dragón y le clavo mi hoja en el pecho.

              La espada destroza sus escamas blindadas y logra atravesar su gruesa piel. El dragón contiene el dolor, y balancea su garra derecha hacia mí. Saco rápidamente la espada de él y bloqueo su ataque justo a tiempo, pero entonces casi inmediatamente me azota con su cola, obligándome a teletransportarme lejos de él.

              Esto no va a ser fácil. El dragón y yo pasamos el siguiente minuto teletransportándonos uno tras otro, intentando tomarnos por sorpresa mutuamente. Tyrath sigue escupiéndome fuego, pero uso mi espada para absorber sus llamas cada vez, y luego se las devuelvo. El dragón y yo parecemos estar bastante igualados, y le he sacado sangre más de una vez, pero empiezo a preguntarme si tengo lo que hace falta para acabar con él en el poco tiempo que me queda.
