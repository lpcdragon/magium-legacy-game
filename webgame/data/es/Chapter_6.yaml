      - condition: ch6_defense = 3
        texts:
          - source: scene_text
            paragraph: 397
            text: |-
              Empiezo congelando el tiempo, y luego procedo a lanzar sobre mí mismo todos los hechizos de protección que conozco, así como un hechizo de vuelo.

              A continuación, salgo volando de la barrera, y directo a través de las llamas abrasadoras. Se siente como si estuviera en un horno, pero al menos no tengo quemaduras visibles. El dragón me ve volar a través de su fuego y suelta un rugido intimidante. Me posiciono a la misma altura que él, a unas decenas de metros de donde está flotando y me detengo en el aire.

              Probemos con ácido primero. Creo una bola de ácido y la envío volando hacia el dragón. Tyrath aplaude sus alas, lo que genera una fuerte ráfaga de viento que dispersa el ácido, pero mi hechizo de protección contra el viento evita que me lleve volando.

              El dragón ahora está lanzando una ilusión de sí mismo, y dejándola atrás, mientras intenta acercarse a mí por la derecha. Menos mal que ya lancé una protección contra ilusiones antes de empezar esta pelea. No puede sorprenderme así.

              Imito su movimiento anterior y aplaudo mis manos, lo que crea una ráfaga de aire increíblemente fuerte frente a mí, enviando al dragón hacia atrás unos quince metros.
          - source: scene_text_2
            paragraph: 45
            text: |-
              "No sé cómo pudiste ver a través de mi ilusión, humano, pero ya no voy a tomármelo con calma contigo."

              Tras terminar su frase, el dragón aparece inmediatamente frente a mí y balancea una de sus garras hacia mi pecho. Lo único que pude hacer fue teletransportarme fuera de peligro a tiempo, con un hechizo de corto alcance apto para combate.

              El dragón y yo pasamos los siguientes segundos teletransportándonos uno tras otro e intentando tomarnos por sorpresa mutuamente.

              ¡Maldición! Si pudiera lanzar mis hechizos grandes ahora, acabaría con él rápidamente. Creo que aún puedo lograrlo si voy y lanzo los hechizos de protección sobre los demás ahora mismo.
        choices:
          - position: 1
            text: Seguir peleando con hechizos elementales seguros
            effects:
              - set:
                  current_scene: ch6_elemental3
          - position: 2
            text: Empezar a pelear con hechizos más grandes
            effects:
              - set:
                  current_scene: ch6_big_not_planned
  - name: ch6_sword
    routes:
      - condition: ch6_defense = 1
        texts:
          - source: scene_text
            paragraph: 398
            text: |-
              Empiezo lanzando protección contra el fuego y un hechizo de vuelo sobre mí mismo.

              A continuación, me dirijo directamente hacia Daren y Kate.

              "Barry, ¿qué ha pasado?", me pregunta Daren cuando lo alcanzo. "Este poder mágico que irradia de ti... ¡Es una locura!"

              "Lo siento, no hay tiempo para explicar. Pero creo que tengo suficiente poder para derrotar al dragón yo solo. ¿Puedes prestarme tu espada unos minutos?"

              "¿Derrotar al dragón tú solo?... Barry, no..."

              Daren se detiene un momento a pensar en lo que le he dicho.

              "Está bien, aquí tienes la espada. Solo no hagas nada demasiado loco."

              Tomo su espada y me preparo para salir volando de la barrera a enfrentar al dragón.

              "¡Oye, Barry!", me llama Daren, mientras me giro y veo una expresión inusualmente seria en su cara. "Buena suerte..."

              Asiento con la cabeza, mientras salgo volando de la barrera, y directo a través de las llamas abrasadoras. Se siente como si estuviera en un horno, pero al menos no tengo quemaduras visibles. Tyrath me ve volar a través de su fuego y suelta un rugido poderoso. No dejo que me intimide y me lanzo hacia él con fiereza, espada en mano.
        choices:
