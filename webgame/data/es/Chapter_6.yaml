            text: |-
              "No trabajamos con él, lo conocimos hace apenas unas horas."

              "Mentiras. ¿Qué razón habría tenido para dejarlos con vida si no tuviera un uso para ustedes?"

              "Yo, eh... Bueno, nos pidió que entregáramos un mensaje por él."

              "¿Un mensaje?"

              El dragón se ríe.

              "Veo que se ha rebajado a usar engendros de baja cuna para hacer sus tareas serviles hoy en día. Si son solo mensajeros insignificantes, entonces no me sirven para nada."

              El dragón gruñe antes de continuar.

              "Debí haber sabido que estaría perdiendo mi tiempo intentando comunicarme con seres como ustedes. Si tan solo ese Stillwater se hubiera ocupado de sus propios asuntos después de regresar al continente en lugar de escribir ese maldito mensaje en el cielo, lo habría dejado en paz."

              De repente recuerdo el mensaje que estaba escrito en las estrellas anoche. ¿Eso fue obra de Eiden?

              "Espera, ¿entonces realmente conoces la ubicación del Magium?"

              El dragón se detiene, y me mira fijamente durante unos segundos antes de continuar.

              "Así que eres un cazador de dragones, entonces."

              "Espera, ¿qué?..."
          - source: scene_text_2
            paragraph: 30
            text: |-
              "Eres un tonto por desafiarme en mi propio territorio, cazador de dragones. He matado a cientos de los tuyos en el último milenio. He observado a tu patética raza humana tropezar por la vida desde que dejaron de caminar en cuatro patas. Podría haberlos matado o esclavizado a todos en cualquier momento de su miserable existencia, si no estuviera por debajo de mí. ¿Pero ahora te atreves a levantarte contra mí? Tus restos carbonizados servirán como mi regalo para Eiden, para darle la bienvenida de vuelta a mi reino."

              El dragón se eleva al cielo, mientras grita sus últimas palabras hacia nosotros.

              "¡Recen a sus dioses, humanos! Son los únicos que pueden salvarlos de la masacre que vendrá."

              "¡Rápido, todos detrás de mí!", grita Daren, mientras levanta su escudo, y una barrera mágica semitransparente comienza a formarse a nuestro alrededor.

              Kate refuerza nuestra protección creando también una cúpula de hielo grueso para rodearnos. El dragón, que ahora se ha elevado a una altitud suficientemente alta, desata una lluvia de llamas sobre nosotros. Cuando las llamas chocan con nuestras protecciones, empezamos a sentir el aire calentándose a nuestro alrededor. El hielo de Kate ya se ha derretido, y todo lo que se interpone entre nosotros y el torrente de fuego es la barrera mágica de Daren.

              Rose está ahora sentada en el suelo, con una mirada de terror en los ojos, abrazando sus piernas y temblando violentamente.
          - source: scene_3
            paragraph: 4
            text: |-
              "¡Rose!", le grita Kate. "¡Reacciona! Tendremos que estar listos para salir de aquí en cuanto la barrera de Daren se rompa. ¡¿Me oyes?!"

              Las llamas del dragón se han detenido de repente. Al mirar hacia arriba para ver qué pasó, me aterroriza descubrir que el monstruo ahora se lanza rápidamente en picada hacia nosotros. Kate intenta crear otro muro de hielo entre nosotros y el dragón, pero lo atraviesa en un segundo, y luego choca contra la barrera mágica de Daren, destrozándola en un instante. El dragón entonces agarra a Daren con una de sus garras, y se eleva de nuevo al cielo. Podemos escuchar los gritos de Daren mientras el lagarto gigante intenta aplastarlo.
