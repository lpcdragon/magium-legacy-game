  - name: ch6_stats
    routes:
      - condition: ch2_human_reason = 1
        texts:
          - source: scene_text
            paragraph: 374
            text: |-
              Mientras Rose habla, escucho tres pitidos fuertes provenientes de mi bolsillo. Saco mi dispositivo de estadísticas, y me sorprende ver que los números máximos de mis estadísticas ahora se han incrementado a cuatro.

              "¿Qué es eso?", pregunta Rose.

              "Es un juguete", dice Daren antes de que pueda responder. "Ya sabes, esos dispositivos mágicos que simulan una mascota para enseñar a los niños pequeños sobre las responsabilidades. Esos pitidos que escuchaste eran la mascota de Barry pidiéndole comida."

              "¡Oh, me encantan esos juguetes! ¡Desde que le compré uno a mi hermanita no he podido separarla de él!"

              "Ignora a Daren", dice Kate. "Solo estaba haciéndose el gracioso. Lo que Barry tiene ahí es un potenciador de estadísticas. Lo está usando para canalizar energía mágica del aire que luego puede usar para aumentar sus habilidades físicas."

              Rose parece impresionada.

              "Guau, no sabía que eso fuera posible. ¿Así que ese dispositivo básicamente te está convirtiendo en un mago?"
          - source: scene_text_2
            paragraph: 25
            text: |-
              Nunca lo había pensado de esa manera. Es cierto que hay algunos magos que realmente usan su magia para aumentar sus poderes, de una forma similar a como lo hace este dispositivo. ¿Eso me convierte en uno de ellos?

              "Supongo...", le respondo. "Pero es solo temporal. El dispositivo se quedará sin energía una vez que deje de estar rodeado de todos estos magos poderosos de los que extraerla."

              Echo un vistazo a mi potenciador de estadísticas y empiezo a pensar en qué debería gastar mis puntos recién adquiridos.
