      - condition: ch6_defense = 2
        texts:
          - source: scene_text
            paragraph: 396
            text: |-
              Empiezo lanzando protección contra el fuego, el viento y el daño físico sobre mí mismo, así como un hechizo de vuelo.

              Luego salgo volando de la barrera, y directo a través de las llamas abrasadoras. Se siente como si estuviera en un horno, pero al menos no tengo quemaduras visibles. El dragón me ve volar a través de su fuego y suelta un rugido intimidante. Me posiciono a la misma altura que él, a unas decenas de metros de donde está flotando y me detengo en el aire.

              Probemos con ácido primero. Creo una bola de ácido y la envío volando hacia el dragón. Tyrath aplaude sus alas, lo que genera una fuerte ráfaga de viento que dispersa el ácido, pero mi hechizo de protección contra el viento evita que me lleve volando.

              Por un momento, pude ver al dragón aparecer en dos lugares al mismo tiempo, como si se hubiera clonado, pero entonces el clon desaparece. Espera un momento. ¡Conozco este efecto! Eso es lo que pasa cuando alguien lanza una ilusión justo frente a ti. ¿Esa ráfaga de viento de antes estaba destinada a desorientarme para que no viera esto?

              Lanzo un hechizo sobre mí mismo que me permite ver a través de las ilusiones. Efectivamente, el dragón frente a mí desaparece en cuanto lanzo el hechizo, y veo al verdadero Tyrath acercándose a mí por la derecha.
          - source: scene_text_2
            paragraph: 44
            text: |-
              Imito su movimiento anterior y aplaudo mis manos, lo que crea una ráfaga de aire increíblemente fuerte frente a mí, enviando al dragón hacia atrás unos quince metros.

              "No sé cómo pudiste ver a través de mi ilusión, humano, pero ya no voy a tomármelo con calma contigo."

              Tras terminar su frase, el dragón aparece inmediatamente frente a mí y balancea una de sus garras hacia mi pecho. Lo único que pude hacer fue teletransportarme fuera de peligro a tiempo, con un hechizo de corto alcance apto para combate.

              El dragón y yo pasamos los siguientes segundos teletransportándonos uno tras otro e intentando tomarnos por sorpresa mutuamente.

              ¡Maldición! Si pudiera lanzar mis hechizos grandes ahora, acabaría con él rápidamente. Creo que aún puedo lograrlo si voy y lanzo los hechizos de protección sobre los demás ahora mismo.
        choices:
