              "No creo que nadie en nuestro equipo confíe en Eiden ni lo considere un amigo", dice Kate. "Sin embargo, mi opinión es que sería una mala idea para nosotros enemistarnos con él innecesariamente, mientras él todavía no sea hostil hacia nosotros. No hay absolutamente ninguna manera en la que podamos ganar contra Eiden en nuestro estado actual, si decidiera luchar contra nosotros con todo su poder".

              "No es necesario que lo antagonices abiertamente", dice Meridith. "Siempre y cuando te asegures de mantener nuestro plan en secreto, podrás continuar interactuando con él de la misma manera que lo has hecho hasta ahora".

              "Estás olvidando que Eiden puede saber por nuestras auras si le estamos mintiendo o no", dice Kate. "Todo lo que necesitaría es que sospechara un poco de nosotros, y entonces podría enterarse fácilmente de nuestros planes secretos con sólo hacernos unas cuantas preguntas sencillas".

