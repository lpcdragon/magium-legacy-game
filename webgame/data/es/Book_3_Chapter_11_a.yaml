  - name: b3_ch11a_intro2
    texts:
      - source: scene_text
        paragraph: 3
        text: |-
          "¡Oye, espéranos!" Flower dice, mientras ella y el resto de nosotros dejamos nuestros asientos, para que podamos seguir a Daren, quien ya salió corriendo de la habitación. "¡Nosotros también vamos!"

          "En realidad, me gustaría hablar brevemente en privado con mi sobrino y Kate, si no les importa", dice Meridith. "Sólo tomará unos momentos..."

          Illuna y Melindra se han detenido en seco y ahora miran a Meridith con sospecha. Parece que ninguno de los dos se siente muy cómodo con la idea de dejarnos solos con Meridith y Diane en la misma habitación.

          "Está bien", le dice Kate a Melindra y Illuna. "Estaremos bien. Ustedes dos sigan adelante".

          "Está bien", dice Melindra, mientras asiente con la cabeza. "Entonces vámonos."
      - source: scene_text_2
        paragraph: 3
        text: |-
          Luego sale de la habitación, junto con Illuna, y luego Meridith espera un momento para asegurarse de que los demás ya no puedan oírnos, antes de volver a hablar.

          "Tengo una pregunta para ustedes dos", dice Meridith. "¿Cuál dirías que es exactamente la opinión de tu grupo sobre Eiden? ¿Tus amigos lo consideran un amigo o un enemigo?"

          "¿No es esto quizás algo que deberías haber considerado preguntar antes de decirnos que lo matemos?..." dice Kate, confundida.

          "Tienes razón", dice Meridith. "Debería haberte preguntado esto antes, pero supongo que nunca consideré realmente la posibilidad de que alguien pudiera ponerse del lado de ese asesino en masa, excepto quizás Melindra, quien lo conoce desde hace mucho tiempo. Sin embargo, la reacción de tu amigo enano a mi solicitud me ha hecho reconsiderar mi posición. Aparte de su charla sobre el honor, sentí que Hadrik podría tener una ligera renuencia a matar a Eiden, y no estoy segura de entender por qué. ¿Quizás ustedes dos podrían iluminarme?"
    choices:
      - position: 1
        text: Eiden nos ha ayudado en varias ocasiones, por lo que es difícil considerarlo un enemigo.
        effects:
          - set:
              current_scene: b3_ch11a_suspicious
              b3_ch11_friend: 0
      - position: 2
        text: Eiden ha actuado de manera amigable con nosotros en el pasado, pero nunca confié en él.
        effects:
          - set:
              current_scene: b3_ch11a_suspicious
              b3_ch11_friend: 1
      - position: 3
        text: Yo diría que Eiden no es ni nuestro amigo ni nuestro enemigo en este momento.
        effects:
          - set:
              current_scene: b3_ch11a_suspicious
              b3_ch11_friend: 2
  - name: b3_ch11a_suspicious
    routes:
      - condition: b3_ch11_friend = 0
        texts:
          - source: scene_text
            paragraph: 4
            text: |-
              "Eiden nos ha ayudado en varias ocasiones, por lo que es difícil considerarlo un enemigo".

              "¿Entonces es por eso que te dio ese mensaje para mí?" Meridith dice. "¿Porque os considera sus aliados?"

              "Dudo mucho que Eiden nos considere a alguno de nosotros sus aliados", dice Kate. "En mi opinión, la única razón real por la que no nos ha matado todavía es que no se considera amenazado por nosotros. Sin embargo, esto puede cambiar si descubre que hemos acordado ayudarte a matarlo".

              "No veo ninguna razón por la que Eiden deba descubrir que llegaste a un acuerdo conmigo", dice Meridith. "Estamos muy bajo tierra, rodeados por gruesos muros de seredium. Incluso alguien como él no podría estar espiando nuestra conversación en estas condiciones".

              "Estás olvidando que Eiden puede saber por nuestras auras si le estamos mintiendo o no", dice Kate. "Todo lo que necesitaría es que sospechara un poco de nosotros, y entonces podría enterarse fácilmente de nuestros planes secretos con sólo hacernos unas cuantas preguntas sencillas".

              "...Ese es realmente un muy buen punto", dice Meridith, en tono resignado. "Perdóname. Parece que en mi afán por asegurar la desaparición de Eiden, casi te puse a ti y a tus amigos en peligro mortal sin darme cuenta. Quizás sería mejor si te ofreciera un trato diferente... Uno que incluso tu amigo enano estaría dispuesto a aceptar".
          - source: scene_text_2
            paragraph: 4
            text: |-
              "¿Qué quieres decir?" Le pregunto. "¿De qué tipo de trato estás hablando?"

              "Lo que más deseo de tu grupo en este momento es que continúes participando en el torneo de magos", dice Meridith. "De esa manera, al menos sabré que todavía estarás aquí, en Varathia cuando implementemos nuestro plan. Si todos están de acuerdo en continuar con los objetivos del torneo para que los reyes no los echen del continente, entonces personalmente les garantizaré el acceso a nuestro nodo Magium, siempre y cuando nuestro plan funcione perfectamente y logremos matar a Eiden sin su ayuda. Sin embargo, en la remota posibilidad de que Eiden sobrevive, entonces tendrán que decidir por sí mismos si están dispuestos a matarlo o no. En este escenario, obviamente solo obtendrán acceso al nodo Magium si se unen a nuestro lado y matan a Eiden, pero por su seguridad, no les pediré que tomen esta decisión hasta el último momento. De esta manera, incluso si Eiden les hiciera preguntas muy específicas sobre su reunión conmigo, podrían responderle con sinceridad, sin convertirlo en su. enemigo."

              "¿Estás seguro de que estás de acuerdo en ofrecernos ese trato?..." dice Kate. "Honestamente, no parece que estés sacando mucho provecho de ello".

              "No me cuesta mucho darle acceso a su grupo a nuestro nodo Magium, pero me costará todo si nuestro plan para eliminar Eiden falla", dice Meridith. "Si hacerle esta oferta aumenta nuestras probabilidades de éxito contra Eiden incluso en un poquito, entonces el trato vale la pena para mí".
          - source: scene_3
            paragraph: 2
            text: |-
              "En ese caso, creo que la mayoría de nuestros amigos probablemente aceptarán su oferta", dice Kate. "La mayoría de nosotros estábamos participando en el torneo sin pretender obtener el Magium de todos modos, por lo que no deberían tener ningún problema con la idea de continuar completando los objetivos".

              "Espero que tengas razón", dice Meridith.

              "Entonces, sé que esto está un poco fuera de tema", digo, "pero me dijiste antes que conocías los códigos secretos para desbloquear las estadísticas mágicas de mi potenciador de estadísticas, y me preguntaba si hay alguna posibilidad de que puedas--"

              "Por supuesto, por supuesto", dice Meridith. "Solo pásame el dispositivo e ingresaré el código de inmediato. Aunque debo advertirte que estas dos estadísticas funcionarán de manera muy diferente a las que has estado usando hasta ahora".

              "¿Cómo es eso?" pregunto.
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch11a_augmenting
