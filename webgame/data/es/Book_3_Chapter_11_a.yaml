  - name: b3_ch11a_augmenting
    texts:
      - source: scene_text
        paragraph: 7
        text: |-
          "Puede que no seas consciente de esto, pero las estadísticas de 'Poder mágico' y 'Conocimiento mágico' fueron, de hecho, las dos primeras estadísticas que se implementaron en estos dispositivos", dice Meridith. "Cuando estos potenciadores de estadísticas eran solo prototipos, los Lessathi que originalmente los hicieron tenían como objetivo usar estos dispositivos para darse a sí mismos y a los demás miembros de nuestra raza la capacidad de lanzar magia. Desafortunadamente, después de muchos años de experimentos fallidos, finalmente descubrieron que era físicamente imposible para los Lessathi puros lanzar magia como un mago normal, y que los únicos que podían usar estas estadísticas correctamente eran los Medio lessathi. Al darse cuenta de que las dos estadísticas mágicas eran inútiles para ellos, los Lessathi las encerraron detrás de un código secreto y luego comenzaron a trabajar en doce estadísticas nuevas, que eran fundamentalmente diferentes tanto en propósito como en diseño de las dos estadísticas originales."

          "¿Por qué son tan diferentes?" digo. "¿No sigue siendo el principio básico del dispositivo que reúne energía de otros magos y luego convierte esa energía en puntos que pueden usarse para aumentar diferentes habilidades?"
      - source: scene_text_2
        paragraph: 5
        text: |-
          "En primer lugar, tu comprensión de cómo funcionan los potenciadores de estadísticas es ligeramente incorrecta", dice Meridith. "Si bien es cierto que algunas de estas estadísticas aumentan las habilidades que ya posees, como tu audición, fuerza y velocidad, no todas tus doce estadísticas funcionan de la misma manera, como estoy segura de que ya habrás notado. Por ejemplo, las estadísticas de idiomas antiguos y técnicas de combate te permiten acceder a grandes cantidades de información a través de tu aura, pero la cantidad de conocimiento disponible para ti está limitada por tu nivel actual en esa estadística, como medida de seguridad para que tu cerebro no se sobrecargue por accidente. Aunque te parezca que la información está presente en tu cabeza, en realidad solo accedes a ella vinculando tu aura a la del dispositivo de estadísticas. Esta es también la razón por la que pierdes el acceso a toda la información cuando el dispositivo de estadísticas ya no está conectado a tu aura".

          "Oh, creo que ya lo entiendo", digo. "Entonces, lo que estás diciendo es que lo único que estas estadísticas tienen en común es la fuente de energía, pero la forma en que funcionan es, de hecho, diferente para cada estadística. Si tuviera que adivinar, diría que las estadísticas que aumentan mis atributos físicos en función de mis propias habilidades se basan en hechizos de mejora de habilidades que ya utilizan los generalistas para aumentar su oído, concentración, reflejos, etc., ¿verdad?"
      - source: scene_3
        paragraph: 3
        text: |-
          "Precisamente", dice Meridith. "En otras palabras, los Lessathi que estaban trabajando en estos potenciadores de estadísticas abandonaron la idea de usarlos para convertirse en magos, y en su lugar comenzaron a diseñar los dispositivos como herramientas para lanzar magia por ellos. Esencialmente, lo que hicieron con muchas de estas doce nuevas estadísticas fue copiar múltiples hechizos y técnicas existentes que ya estaban siendo utilizados por los magos, y encontraron formas de implementarlos para que pudieran ser lanzados por el propio dispositivo mientras su portador tenía su aura vinculada a él. El mismo principio también se aplica a las tres estadísticas de aura, que se basan en habilidades y técnicas que eran más comúnmente utilizadas por magos razonablemente competentes en la manipulación del aura".

          "¿Qué pasa con la estadística de premonición?" Kate pregunta. "No creo recordar ningún hechizos existente que pueda prever el futuro..."

          "La estadística de premonición probablemente se desarrolló utilizando el conocimiento que obtuvieron de uno de los nodos Magium", dice Meridith. "Aunque me duele admitir esto, los Lessathi de antaño eran mucho más hábiles que nosotros para extraer información de los nodos Magium, por lo que no puedo confirmar esta teoría, ya que sería imposible para nosotros crear dispositivos de esta complejidad. Sin embargo, lo que sí sé es que las Tejedoras del tiempo que son enviadas por el Magium poseen la capacidad de ver pequeños destellos de eventos futuros, por lo que supongo que el dispositivo de estadísticas también debe estar usando una técnica similar para su estadística de premonición."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch11a_implemented
  - name: b3_ch11a_implemented
    texts:
      - source: scene_text
        paragraph: 8
        text: |-
          "Entonces, volviendo a nuestra discusión original", digo, "¿qué es lo que hace que las dos estadísticas mágicas sean tan especiales en comparación con las otras doce estadísticas? ¿Tienen una fuente de energía diferente o algo así?"

          "No, todavía se les quita la energía a los magos, pero la forma en que se usa es completamente diferente de lo que esperarías", dice Meridith. "Cuando implementaron por primera vez las estadísticas de poder mágico y conocimiento mágico, no había ninguna razón para que los diseñadores implementaran un sistema de inversión de puntos, porque solo había dos estadísticas para actualizar, por lo que todo el proceso podía realizarse automáticamente por el dispositivo sin necesidad de la intervención del usuario. El sistema de puntos solo se agregó después de que crearon las otras doce estadísticas, pero en ese momento ya no se estaba trabajando en las dos estadísticas originales, por lo que nunca se actualizaron al nuevo sistema. En otras palabras, no podrás usar tus puntos existentes para mejorar los dos mágicos. estadísticas, pero tan pronto como los desbloquee, comenzarán a usar la energía almacenada en el dispositivo para subir de nivel por sí mismos y no podrás detenerlos".

          "Mmm..." digo. "¿Significa esto que toda la energía recolectada a partir de ahora se usará solo para estas dos estadísticas? ¿Ya no obtendré puntos por mis otras estadísticas? ¿Y qué pasa con mis puntos existentes? ¿Existe algún peligro de que pueda perder alguno de ellos?"
      - source: scene_text_2
        paragraph: 6
        text: |-
          "Puede estar seguro de que sus puntos actuales no se verán afectados por este cambio", dice Meridith. "Una vez que la energía almacenada en el dispositivo se convierte en puntos, solo puede ser utilizada por tus estadísticas regulares, y las estadísticas mágicas ya no tendrán acceso a esa energía. Sin embargo, aunque estoy seguro de que seguirás recibiendo puntos en el futuro, la velocidad a la que te los darán puede volverse más lenta que antes".

          "Bueno, no puede ser peor que en Ollendor, ¿verdad?" digo. "No obtuve ningún punto mientras estuve en esa ciudad".

          "Sí", dice Meridith, "mientras no estés en una ciudad, aún puedes esperar obtener una cantidad razonable de puntos para subir de nivel tus otras estadísticas. Colocamos la mayoría de nuestros extractores de energía cerca de las ciudades de Varathia, porque allí era donde asumimos que se reunirían la mayoría de los concursantes, inicialmente. Fue solo después de que los reyes nos dijeron que no impondrían una regla para evitar que los participantes del torneo se mataran entre sí que comenzamos a usar equipos lessathi con extractores de energía móviles para recolectar tanta energía como pudimos de los magos dispersos por los bosques de Varathia. Diane de hecho estaba ocupada escoltando a uno de esos equipos cuando la encontraste por primera vez."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch11a_inefficient
  - name: b3_ch11a_inefficient
    texts:
      - source: scene_text
        paragraph: 9
        text: |-
          "Entonces, mientras no esté en una ciudad o cerca de uno de tus equipos de extracción de energía, debería estar bien. ¡Entendido!" Digo, mientras saco mi potenciador de estadísticas de mi bolsillo y se lo entrego a Meridith. "Aquí está mi dispositivo. ¿Necesitas algo más para activar las estadísticas, o--"

          "No, solo el dispositivo es suficiente", dice Meridith, mientras presiona rápidamente varios botones seguidos sin siquiera mirar el potenciador de estadísticas, y luego me lo devuelve. "Está hecho. Tus estadísticas mágicas han sido activadas".

          "¿Eso es todo?..." le pregunto confundida, mientras miro bien mi dispositivo. "No puedo decir que realmente... me sienta diferente".

          "En este momento, tu potenciador de estadísticas está ocupado convirtiendo su energía almacenada en niveles para tus nuevas estadísticas", dice Meridith. "Tan pronto como obtengas tu primer nivel, tu dispositivo debería comenzar a emitir un pitido para avisarte que tus estadísticas mágicas están listas".

          "¿No se agotará la energía del dispositivo mucho más rápido ahora que Barry la usará para lanzar hechizos?" Kate dice. "¿Cómo quedará suficiente para subir de nivel cualquiera de sus estadísticas?"
      - source: scene_text_2
        paragraph: 7
        text: |-
          "La energía recopilada de los participantes del torneo no se utiliza para lanzar hechizos", dice Meridith. "Solo se usa para subir de nivel las estadísticas. Las estadísticas mágicas están hechas de tal manera que le dan a Barry la capacidad de extraer energía del plano mágico por sí mismo para lanzar sus hechizos, de manera similar a como lo hacen todos los demás magos. Esta es la razón principal por la que los Lessathi puros nunca pudieron usar estas estadísticas. Dado que nuestras auras están completamente desprovistas de cualquier tipo de magia, es imposible para nosotros lanzar hechizos de la misma manera que los magos normales, sin importar qué tan bien construyamos nuestros dispositivos".

          "Si el dispositivo me permite extraer energía del plano mágico", digo, "¿entonces podría ser posible que yo mismo alimente la energía del dispositivo en lugar de depender de lo que el potenciador de estadísticas extrae de otros magos a mi alrededor? Sé con certeza que existen ciertas herramientas que pueden ayudar a los magos a encender dispositivos con energía mágica. ¡Las he visto utilizadas antes!"

          "Alimentar energía directamente al dispositivo es muy ineficiente y un desperdicio", dice Meridith. "Si la energía mágica no se extrae adecuadamente de las auras de otros magos, entonces el dispositivo la gastará demasiado rápido para ser de utilidad real para ti a largo plazo. Ya deberías saber esto, ya que me dijiste que has usado el Modo de Emergencia en el pasado. Ahora que lo pienso... Nunca te pregunté cómo lograste activar este modo antes. Puedo pensar en muy pocas situaciones en las que el Modo de Emergencia se activaría por sí solo, y ninguna de ellas parece muy probable. ¿Quizás encontraste alguna forma de activarlo manualmente?"
