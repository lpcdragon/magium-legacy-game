    routes:
      - condition: b3_ch11_money = 0
        texts:
          - source: scene_text
            paragraph: 46
            text: |-
              "De acuerdo. No es como si fuera a renunciar al torneo después de llegar tan lejos".

              "¡Es genial escuchar eso!" Meridith dice. "Para ser sincero, este no es exactamente el mejor resultado para mí, pero me alegro de que al menos hayamos podido llegar a un acuerdo".

              "Entonces, ahora que todos hemos acordado umm... matar o no matar a Eiden", dice Hadrik, "¿qué pasa después? ¿Finalmente nos darás el detector de piñas?"

              "Todavía no", dice Meridith. "Hay una última cosa que quiero mostrarte antes de que te vayas".

              "¿Qué es eso?" Daren pregunta.

              "Quiero que pruebes la recompensa que recibirías si me ayudaras", dice Meridith. "Quiero que sepas cómo es realmente acceder al Magium. Sería una lástima que hubieras llegado hasta aquí sin siquiera comprender adecuadamente cómo se supone que te será útil el nodo Magium".
          - source: scene_text_2
            paragraph: 33
            text: |-
              "Ahora que lo mencionas, me preguntaba si este nodo Magium tuyo vendría con un manual de usuario o no", dice Daren. "Porque, seamos justos, dudo que la mayoría de nosotros sepamos qué hacer incluso si tuviéramos acceso a ello".

              "No hay necesidad de preocuparse por eso", dice Meridith. "Tenemos dispositivos que fueron construidos específicamente con el propósito de obtener conocimiento del Magium, sin el riesgo de que te vuelvas loco. El proceso será lento y puede llevar muchos años obtener la información que deseas, dependiendo de lo que estés buscando, pero el potencial es ilimitado. De hecho, traje un dispositivo de este tipo conmigo para poder demostrarte cómo funciona. Entonces, ¿qué dices? ¿Lo intentamos?"

              "Vaya, espera, espera..." dice Arraka, de repente, con un ligero temblor en la voz. "Ustedes, idiotas, no están planeando seriamente regresar a la sala del nodo Magium después de todo lo que pasó, ¿verdad?"

              "Bueno, Arraka, si no lo supiera, casi pensaría que tienes miedo de volver al nodo", dice Hadrik, con una sonrisa.

              "¡¡¡Cierra la boca, monstruo de circo de tamaño pequeño!!!" Arraka grita. "¡No estaba hablando contigo!"

              "Oye, no hay necesidad de recurrir a los insultos", dice Hadrik, como si estuviera disfrutando mucho esto. "El miedo es una emoción completamente natural. No hay por qué avergonzarse de ello."

              "Te lo juro, si no dejas de hablar ahora mismo, voy a--" dice Arraka, pero es interrumpida por unos pitidos muy fuertes que salen de mi bolsillo.
          - source: scene_3
            paragraph: 22
            text: |-
              "¿Qué fue eso?..." dice Arraka. "¿De dónde vino ese sonido?"

              "Ah, Barry, creo que ese es el sonido que se supone que debe hacer tu potenciador de estadísticas una vez que tus estadísticas mágicas estén listas", dice Meridith. "Normalmente, deberías empezar a sentir los efectos de..."

              "¡Guau, esto es genial!" Interrumpo Meridith. "Ya puedo sentir la energía mágica fluyendo a través de mí. Definitivamente no es tan impresionante como lo fue durante el Modo de Emergencia, ¡pero realmente extrañé la sensación de poder lanzar magia en un plano material de existencia! Déjame ver si todavía recuerdo cómo hacer el hechizo de vuelo".

              "Hasta donde yo sé, hechizo de vuelo solo estará disponible en un nivel mucho más tarde", dice Meridith. "Normalmente, deberías haber comenzado con el nivel uno en tus dos estadísticas mágicas, por lo que no deberías poder lanzar nada más que un hechizos muy básico en el... espera, ¿cómo estás haciendo eso?..."

              Mientras Meridith hablaba, logré recrear las corrientes de aire hechizo que usé mientras luchaba contra los esqueletos de stillwater, y ahora estaba volando por la cueva, de una manera muy torpe.

              "¿Qué, el vuelo?" Le pregunto a Meridith, mientras todavía estoy tratando de encontrar el equilibrio en el aire. "Oh, solo estoy usando los poderes elementalista de aire que me otorga el dispositivo para crear algunas corrientes de aire a mi alrededor que se mueven constantemente. Suena complicado al principio, pero si lo tratas como si estuvieras volando un avión, se vuelve mucho más simple".
