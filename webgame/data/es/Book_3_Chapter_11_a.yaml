            paragraph: 6
            text: |-
              "Yo diría que Eiden no es ni nuestro amigo ni nuestro enemigo en este momento".

              "Ya veo..." dice Meridith, con voz pensativa. "¿Y crees que el resto de tus compañeros piensan en él de la misma manera que tú?"

              "Personalmente, estoy de acuerdo con Barry", dice Kate. "Puede que Eiden no haya tomado ninguna acción hostil hacia nosotros recientemente, pero eso no significa que simplemente podamos olvidar el hecho de que casi nos asesinó por capricho unas cuantas veces antes. Dicho esto, tampoco creo que ninguno de nosotros estaría emocionado ante la perspectiva de enfadarse con él innecesariamente, considerando que es casi seguro que nos aniquilaría a todos fácilmente si luchara contra nosotros con todo su poder".

