  - name: b3_ch11a_entrusted
    texts:
      - source: scene_text
        paragraph: 40
        text: |-
          "Uverg..." dice Meridith, tratando con mucho cuidado de no usar un tono desdeñoso. "Si bien aprecio el entusiasmo que has mostrado durante tu investigación, debo admitir que cuando te confié esta tarea, esperaba que hicieras uso de tus... talentos especiales para descubrir la verdadera naturaleza de estos cristales, en lugar de usar las herramientas habituales que tenemos a nuestra disposición. ¿Entiendes lo que quiero decir?"

          "Aaah..." dice Uverg. "Por talentos especiales, ¿te refieres al conocimiento que adquirí del nodo Magium? ¿Es correcto?"

          "¡Sí, exactamente!" Meridith dice. "Me temo que nuestros métodos habituales son simplemente insuficientes cuando se trata de explicar el comportamiento inusual de los cristales en los últimos días. Por eso contaba contigo y tu conexión especial con nuestro Creador para darnos las respuestas que necesitamos".

          "Hmm..." dice Uverg. "Ahora que lo mencionas, tengo conocimiento de un evento similar que ocurrió una vez antes, aunque fue hace más de diez mil años, cuando los Lessathi y los humanos todavía eran una sola raza. ¿Te gustaría saberlo?"

          "¿Lessathi y los humanos solían ser parte de la misma raza?..." pregunta Hadrik, sorprendido. "Es la primera vez que escucho algo así. ¿Es de conocimiento común para ti Lessathi o algo así?"
      - source: scene_text_2
        paragraph: 29
        text: |-
          "No", dice Meridith. "Esto también es una novedad para mí. Uverg, ¿estás absolutamente seguro de que esto es realmente conocimiento procedente del Magium y no sólo algo que estás recordando de un sueño?"

          "Estoy bastante seguro, señora Meridith", dice Uverg. "Perdóneme por no contarle esto antes, pero a veces resulta difícil recordar lo que se supone que es de conocimiento común y cuáles son los hechos oscuros que el Magium me ha revelado solo a mí, especialmente cuando se trata de eventos que sucedieron hace tanto tiempo".

          "Entonces... corrígeme si me equivoco", dice Meridith, "¿pero estás afirmando que los Lessathi alguna vez fueron humanos y que algo sucedió que hizo que perdiéramos toda la magia de nuestras auras?"

          "Sí, aunque no fue algo que ocurrió de la noche a la mañana", dice Uverg. "Tengo entendido que el cambio entre las auras de las dos razas fue más sutil al principio, y que pasaron varias generaciones hasta que las auras se volvieron tan diferentes que ya no podían considerarse la misma raza, a pesar de todas sus otras similitudes".

          "Esto ciertamente explicaría por qué nos vemos exactamente iguales a los humanos, pero nunca hubiera pensado..." dice Meridith, mientras hace una breve pausa para reorganizar los pensamientos en su cabeza. "No hubo menciones de esto en ninguna de nuestras escrituras antiguas. ¿Por qué nuestros ancestros nos mentirían sobre esto?"
      - source: scene_3
        paragraph: 18
        text: '"Lo más probable es que se deba a que nuestros antepasados odiaban a los humanos", dice Uverg. "No estoy del todo seguro, ya que los recuerdos de este pasado lejano son vagos en mi cabeza, pero creo que los humanos normales y los humanos que más tarde se convertirían en Lessathi pertenecían a dos tribus opuestas. Una de las tribus vivía bajo tierra, adorando los nodos Magium como deidades, mientras que la otra tribu vivía en la superficie. Creo que cuando se descubrieron originalmente los nodos Magium, los ancestros de los humanos engañaron a los ancestros de los Lessathi para ir e investigar los túneles subterráneos, y luego les quitaron las cuerdas que usaron para bajar allí, dejándolos a todos varados. Luego también sellaron la entrada, para asegurarse de que nadie volviera a encontrar el camino hacia allí nuevamente. Nuestros antepasados siempre odiaron a los ancestros humanos por hacerles esto, y su odio hacia sus enemigos se ha transmitido de generación en generación, hasta que finalmente pudieron escapar."'
    choices:
      - position: 1
        text: ¿Es por eso que su sociedad prohíbe el matrimonio entre humanos y Lessathi?
        effects:
