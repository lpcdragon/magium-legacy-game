  - name: b3_ch11a_uverg
    texts:
      - source: scene_text
        paragraph: 26
        text: |-
          "¡Uf!" Hadrik dice, mientras se recuesta y bebe un poco más de cerveza. "En realidad me preocupaste por un segundo."

          "¿Escuché esto bien?..." escuchamos una voz proveniente de las partes más oscuras del túnel. "¿Hay palabras insultantes que incluso un enano borracho se avergüenza de compartir con los demás? Ahora tengo curiosidad por saber cuáles son también..."

          "Así que finalmente has decidido salir de tu escondite, ¿no?" Dice Hadrik, mientras mira al hombre que sale de la oscuridad, mientras saca un tercer vaso de su mochila y comienza a llenarlo de cerveza. "Sabes, te he estado llamando durante años, pero nunca respondiste. ¡Puedes sentarte con nosotros, si quieres!"

          "¡Eso no será necesario!" dice el hombre. "Estoy más que feliz de estar de pie".

          Cuando miramos más de cerca al hombre que sale de las sombras, vemos que lleva una bota en la cabeza y calcetines en las manos, mientras que tiene un montón de galimatías ininteligibles escritas en su camisa y pantalones, que sorprendentemente, al menos están usados ​​correctamente. Él también camina descalzo, pero considerando que Flower ha estado haciendo lo mismo desde que la conocimos, eso ya no me parece tan extraño.
      - source: scene_text_2
        paragraph: 20
        text: |-
          "Dices que quieres que te cuentemos sobre los insultos", dice Kleykarth, "pero no estabas tan lejos de nosotros cuando el enano los dijo. ¿Seguramente debiste haber escuchado al menos algunas de las palabras?"

          "Desafortunadamente, yo estaba en trance en ese momento, así que no pude escuchar nada de lo que ustedes dos decían", dice el hombre con la bota en la cabeza. "¡Mis disculpas, buen señor!"

          "¿Un trance?..." pregunta Hadrik, confundido. "¿Qué eres, una especie de chamán o algo así?"

          "No, no, nada de eso", dice el hombre de la bota en la cabeza. "Simplemente estaba tratando de estar en el estado mental adecuado para comunicarme con nuestro Creador. Él me habla, de vez en cuando... Aunque, hay que admitirlo, últimamente se ha vuelto más difícil separar las palabras reales que me ha dicho de mis propios engaños".

          "No intentes tomarlo demasiado en serio", le dice Kleykarth a Hadrik. "El pobre se ha vuelto loco desde que tocó el nodo Magium hace unos meses. Desde entonces ha estado hablando con acertijos".
      - source: scene_3
        paragraph: 11
        text: |-
          "No todas mis palabras son acertijos, buen hombre...", dice el loco. "Además, ¿no crees que estás siendo bastante grosero con nuestro invitado? Has estado hablando tan alto todo el tiempo, que el pobre no ha tenido el valor de pronunciar una sola palabra hasta este momento. Vamos, amigo, ¿no nos harás el honor de unirte a nuestra conversación? Te prometo que a pesar de su apariencia, son gente bastante respetable, ¡y no se burlarán de tu inusual apariencia!"

          Mientras habla, el loco parece estar mirando directamente a uno de los cristales azules del techo.

          "¿Qué te pasa, Uverg?" Kleykarth dice, burlonamente. "¿Tu amiga hada invisible del techo es demasiado tímida para hablar con nosotros?"

          "No creo que sea un hada..." dice Uverg, como si no hubiera captado el tono sarcástico del guardia Lessathi. "Las hadas normalmente no usarían estos cristales para transferirles su conciencia, ¿no crees?"
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch11a_protocol
  - name: b3_ch11a_protocol
    routes:
      - condition: b3_ch8_overseer2 = 0
        texts:
          - source: scene_text
            paragraph: 27
            text: |-
              Espera, ¿este tipo acaba de hablar de alguien que transfirió su conciencia a los cristales azules?... No me digas eso...

              "Amigo mío, ¿no podrías al menos decirnos tu nombre?" Dice Uverg, mientras sigue mirando el mismo cristal de antes. "Me temo que incluso para alguien como yo, se está volviendo un poco vergonzoso seguir hablando así solo".

              "Pregunta no clara", escuchamos una voz metálica proveniente del cristal exacto que el loco estaba mirando. "Desafortunadamente, el protocolo del Supervisor no puede brindarle una respuesta correcta si su pregunta es demasiado vaga. Reformule su consulta anterior".

              "¿El protocolo del Supervisor?..." pregunta Meridith. "¿Por qué ese nombre te suena familiar?"

              "El Supervisor es la inteligencia artificial que solía controlar los artilugios metálicos voladores con ojos rojos y verdes de Ollendor", le digo a Meridith. "Su núcleo fue destruido recientemente, pero parece que logró transferir su conciencia a los cristales azules antes de morir".
          - source: scene_text_2
            paragraph: 21
            text: |-
              "Oh, claro", dice Meridith, "recuerdo haber oído hace mucho tiempo que Biliborrathrathsarran había reactivado una máquina altamente inteligente construida por los Lessathi de antaño, pero no conocía todos los detalles. Desafortunadamente, no hemos obtenido mucha información desde el interior de Ollendor estos últimos años, ya que ha sido demasiado peligroso mantener espías dentro de esa ciudad. Pero, ¿cómo podría una máquina transferir su conciencia a los cristales? ¿Tiene siquiera una conciencia para empezar?"

              "Por lo que nos han dicho", dice Kate, "el Lessathi que construyó al Supervisor también creó un alma fabricada para él, para darle libre albedrío. Sin embargo, la razón por la que puede navegar a través de estos cristales es porque estuvo controlado por el Magium durante un breve período de tiempo, y ha logrado retener parte del conocimiento al que tuvo acceso durante esos pocos minutos".

              "¿El Supervisor entró en contacto con el Creador?" Meridith dice. "Fascinante..."

              "¡Oye, estás ahí, en el cristal azul!" Diane dice, mientras mira al techo. "Si esta pregunta no es demasiado vaga para usted, ¿le importaría decirnos durante cuánto tiempo nos ha estado espiando?"

              "Los cristales me alertaron tan pronto como tus invitados fueron teletransportados al subsuelo, que fue también cuando comencé a seguirte", dice el Supervisor.

              "¡¿Nos has estado siguiendo desde que regresamos de la superficie ?!" Diane dice, sorprendido. "Entonces... ¿también has estado escuchando nuestra conversación privada en la sala de reuniones?"
          - source: scene_3
            paragraph: 12
            text: |-
              "Afirmativo", dice el supervisor. "Sin embargo, cabe señalar que sus planes con respecto al stillwater llamado Eiden son de poco interés para mí. Mi enfoque principal actualmente es desbloquear los secretos de estos cristales azules, así como los del propio Magium, y creo que su nodo Magium me ayudará enormemente a acelerar mi investigación sobre estos temas".

              "¿Crees que puedes usar nuestro nodo Magium sin nuestro permiso?" Meridith dice, en tono amenazador.

              "Eso es correcto", dice el supervisor. "El protocolo del Supervisor considera que su permiso es en gran medida irrelevante, ya que no tiene medios realistas para bloquear mi acceso a su nodo. Si cree que mi evaluación de la situación es incorrecta, no dude en brindar su opinión a una de las unidades de ojos verdes e investigaremos el asunto lo antes posible. Recuerde, ¡su opinión siempre importa!"

              "¿Él es--" Meredith se gira hacia mí, ya que parece tener problemas para encontrar las palabras. "¿Esta máquina se está burlando de mí?"
        choices:
          - position: 1
            text: Bienvenido al club. Se ha estado burlando así de nosotros desde el primer día que lo conocimos.
            effects:
              - set:
                  current_scene: b3_ch11a_exchange
