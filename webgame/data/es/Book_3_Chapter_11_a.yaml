  - name: b3_ch11a_military
    routes:
      - condition: b2_ch8_energizer = 1 AND b3_ch10_benefits = 1
        texts:
          - source: scene_text
            paragraph: 66
            text: |-
              "Hmm..." dice Melindra. "No me parece que el juramento me esté advirtiendo sobre nada, pero haré lo que dices, por si acaso. ¡Gracias por tu preocupación!"

              "De nada", dice Daren, mientras Melindra ahora se eleva en el aire y se prepara para su partida.

              "Oh, una última cosa antes de irme", dice Melindra. "Barry, confío en que no hayas olvidado nuestro acuerdo con respecto a nuestra... ¿asociación después de que toda esta situación del torneo termine?"

              "Por supuesto que no", digo.

              "Bien", dice Melindra. "En ese caso, espero que estés sano y salvo al final de todo esto, porque algo me dice que viajaremos juntos durante bastante tiempo. Tal vez... trates de mantener esos defectuosos instintos de supervivencia bajo control de vez en cuando, ¿quieres? ¿Al menos lo suficiente para que no te maten?"

              "Haré... lo mejor que pueda", digo.

              "Estoy segura de que lo harás", dice Melindra, mientras se impulsa hacia el cielo.

              "Entonces nos vemos a todos más tarde", dice Melindra, mientras nos saluda con la mano desde arriba, y luego comienza a volar, lentamente al principio, pero gradualmente más rápido hasta que la perdemos de vista por completo.

              Justo cuando nos estábamos preparando para partir, Flower saca su transceptor, gira el dial para cambiar la frecuencia de llamada y lo toca una vez.

              "Oye, Melindra, ¿cómo estás?" ella dice.
          - source: scene_text_2
            paragraph: 44
            text: |-
              "...Flower", dice Melindra, "te das cuenta de que cuando dije que podías llamarme tantas veces como quisieras, no quise decir literalmente... ¿sabes qué? No importa. Estoy bien, Flower. ¿Cómo estás?"

              "¡Estoy muy bien, gracias por preguntar!" Flower dice, con una sonrisa. "¡Hablamos luego, adiós!"

              Luego vuelve a tocar su transceptor para cerrarlo y se gira hacia nosotros.

              "¿Y bien?..." dice Flower, cuando se da cuenta de que todos la estábamos mirando. "¿Qué están esperando? ¡Vamos a buscar esas piñas! ¡A toda prisa! ¡Hup, dos, tres, cuatro! ¡Hup, dos, tres, cuatro!"

              Flower luego comienza a hacer una de sus habituales marchas militares mientras nos empuja a todos por detrás, para acelerar el paso. Sin embargo, apenas conseguimos marchar durante poco más de un minuto, porque como ya era de esperar, un tal stillwater con los ojos cerrados ya nos estaba esperando en el camino por delante, luciendo su característica sonrisa educada en su rostro.

              "¡Hola de nuevo, amigos míos!" Eiden nos dice, mientras nos acercamos a él. "¿Disfrutaste tu viaje a la sede de Lessathi? ¿Cómo le va a Meridith?"

              Cuando vio a Eiden, Diane ya estaba empezando a cargar sus poderes eléctricos, pero Kate la detuvo rápidamente, antes de que pudiera hacer cualquier estupidez.

              "Si estás buscando a Melindra, simplemente la extrañaste", le dice Daren a Eiden. "Todos nos despedimos de ella, ni siquiera hace un minuto".
          - source: scene_3
            paragraph: 33
            text: |-
              "Oh, no hay necesidad de preocuparse por eso", dice Eiden. "Estoy seguro de que ella y yo nos volveremos a encontrar en algún momento en el futuro. Sin embargo, como probablemente ya te habrás dado cuenta, Melindra no es el motivo de mi visita".

              "Déjame adivinar", digo. "Quieres saber si entregué tu mensaje o no".

              "¡Aprendes rápido, Barry!" Eiden dice. "Eso es lo que me gusta de ti".

              "Entregué el mensaje, tal como me pediste", digo. "A la propia Meridith."

              "Maravilloso", dice Eiden. "Un trabajo bien hecho. Entonces, ¿te dio una respuesta por mí?"

              "Uh... en realidad no, no", digo.

              "¿No hay respuesta?..." dice Eiden, confundido. "¿Nada en absoluto? ¿Al menos te dijo lo que significaba el mensaje?"

              "Ella, umm... nos dijo que era una declaración de guerra", digo, algo aprensivo.

              "Oh", dice Eiden, en un tono muy decepcionado. "Veo..."
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch11a_continent
