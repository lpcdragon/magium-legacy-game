scenes:
  - name: b3_ch11a_intro
    texts:
      - source: scene_text
        paragraph: 2
        text: |-
          "Déjame ver si entendí bien esto..." Hadrik le dice a Meridith. "Ustedes han estado reuniendo una enorme cantidad de energía de los magos desde el comienzo de este torneo, todo con el propósito de matar a Eiden..."

          "Sí", dice Meridith.

          "Y si no logran asesinarlo ustedes mismos, querrán que seamos su plan de respaldo", dice Hadrik. "Quieres que lo derribemos como a un perro, después de haberlo dejado débil y vulnerable. ¿Es eso lo que nos estás pidiendo?"

          "Así es... no exactamente como lo habría expresado, pero en esencia, tienes razón", dice Meridith, algo aprensivo.

          "¡¿No tienes honor ?!" Hadrik dice, mientras le da a Meridith una mirada de puro disgusto.

          "Quizás ha habido un malentendido", dice Meridith, en un tono un poco más nervioso que antes. "Si me permite explicarle una vez más lo que necesitamos de usted, estoy seguro de que podremos llegar a algún tipo de acuerdo..."

          "No, creo que ya he oído suficiente", dice Hadrik, mientras se levanta de su silla.
      - source: scene_text_2
        paragraph: 2
        text: |-
          Temiendo que Hadrik intente atacar a su aliado, Diane intenta levantarse también, pero Meridith pone su brazo delante de ella y la detiene antes de que pueda ponerse de pie.

          "Tú y el resto de tus subordinados Lessathi podrían estar de acuerdo con usar tácticas tan clandestinas para derrotar a tus enemigos, pero yo no participaré en esto", dice Hadrik. "¡Encuentra a alguien más que haga tu trabajo sucio!"

          Luego se aleja de nosotros y sale corriendo de la habitación, sin mirar atrás ni una sola vez.

          "¡Hadrik! ¡Oye, Hadrik, espera!" Daren grita, pero no obtiene respuesta.

          "Creo que será mejor que vaya tras él", dice Daren, esta vez dirigiéndose a Meridith. "Lo último que queremos es que entre en conflicto con un Lessathi de una de tus facciones opuestas mientras todavía está enojado. Intentaré traerlo de vuelta, si puedo".

          "No es necesario", dice Meridith, ya que todavía parece estar ordenando sus pensamientos después de lo que acaba de suceder. "Reanudaremos esta reunión más adelante. Estoy seguro de que todos ustedes tienen mucho en qué pensar".

          "Está bien", dice Daren. "Entonces nos vemos más tarde. Déjame ver si puedo ponerme al día con Hadrik mientras tanto".
