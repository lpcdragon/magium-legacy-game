                  current_scene: b3_ch11a_insane
  - name: b3_ch11a_insane
    texts:
      - source: scene_text
        paragraph: 12
        text: |-
          "Muy bien", dice Meridith. "En cualquier caso, creo que nuestra discusión aquí ha terminado por el momento. Probablemente deberíamos ir a buscar a Daren y al resto de su grupo. Esperemos que no se hayan metido en ningún problema".

          Todos hacemos lo que dijo Meridith y nos levantamos de nuestros asientos, mientras ella nos lleva fuera de la sala de reuniones y de regreso al pasillo lleno de cristales azules. Cuando volvemos a pasar por la puerta secreta detrás de la cual se encuentra el nodo Magium, de repente se me ocurre una idea y, sin pensarlo, le hago una pregunta a Meridith.

          "Oye, Meridith, hay algo que me he estado preguntando", digo, mientras nos alejamos del nodo Magium. "Dijiste que estarías dispuesto a darnos acceso al nodo Magium, pero ¿qué significa eso exactamente? ¿Cómo se supone que debemos interactuar con él?"

          "Hay ciertas herramientas que nuestra gente ha desarrollado a lo largo de los años, que permiten extraer información del nodo", dice Meridith. "Es un proceso muy largo, pero también muy gratificante. El Magium contiene conocimiento mucho más allá de lo que puedas imaginar. Esta varita que llevo, por ejemplo, no podría haberse construido sin la información que personalmente logré extraer del nodo Magium. Muchos de nuestros otros dispositivos también se fabricaron de la misma manera".
      - source: scene_text_2
        paragraph: 10
        text: |-
          "Entonces, ¿el único método para que podamos acceder a la información contenida en Magium es usar sus herramientas?" Kate pregunta. "¿No hay otra manera?"

          "Por supuesto, hay otras formas, pero no las recomendaría", dice Meridith. "Podrías, por ejemplo, vincular tu aura directamente al nodo para ingresar al reino Magium. Esto te otorgaría una forma mucho más directa de extraer el conocimiento que deseas, pero también sería mucho más arriesgado. Un pequeño error y podrías perderte en el reino Magium para siempre, sin forma de regresar a nuestro mundo. Mientras tanto, desde nuestro punto de vista, estarías atrapado en un trance con ojos amarillos brillantes por el resto de tu vida, hasta Finalmente morirías de sed o de hambre".

          Vincular tu aura directamente al Magium, ¿eh?... Estoy bastante seguro de que esta es la técnica que Arraka usó cuando fuimos al reino de Magium para observar las pruebas de todos durante el ritual del Dios del Tiempo. Me pregunto si podría aprender a hacer eso en el futuro...

          "¿Pero qué pasaría si tocaras el nodo durante un período de tiempo más largo?" Kate pregunta. "¿Sabes lo que pasaría entonces?"
      - source: scene_3
        paragraph: 5
        text: |-
          "Desafortunadamente, sí", dice Meridith, en un tono de voz triste. "Más o menos cada año, recibimos al menos un Lessathi que logra burlar la seguridad y encontrar el camino hacia el nodo Magium, solo para intentar tocarlo. Lamentablemente, casi todos se han vuelto completamente locos. Después de tocar el nodo, la mayoría se niega a hablar, se niega a comer o beber, solo quiere quedarse allí y mirar el nodo, y reaccionan muy violentamente si intentas alejarlos de él. No hemos encontrado manera de hacerlos volver a la normalidad y, por lo general, acaban muriendo de sed unos días después".

          "¿Me estás diciendo que sabías lo peligroso que era este nodo Magium y nos dejaste solos con él, sin siquiera una advertencia?..." pregunta Kate, perplejo.

          "Yo... no pensé que sería necesaria una advertencia", dice Meridith. "Lessathi son atraídos por naturaleza hacia el nodo Magium, por lo que debemos mantenerlos lo más lejos posible de él, pero ninguna de las otras razas ha manifestado jamás ningún tipo de atracción hacia estos nodos. Ni siquiera Medio lessathi. ¿Por qué intentarías tocar una cosa de aspecto tan peligroso si no estuvieras obligado a hacerlo por tu propia naturaleza?"
    choices:
      - position: 1
