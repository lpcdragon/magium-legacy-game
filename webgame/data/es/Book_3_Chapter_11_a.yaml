        effects:
          - set:
              current_scene: b3_ch11a_faction
  - name: b3_ch11a_faction
    routes:
      - condition: b3_ch10_node = 1
        texts:
          - source: scene_text
            paragraph: 13
            text: |-
              "Tal vez deberías hacerle esa pregunta a Barry", dice Kate. "Ya tocó el nodo una vez, antes de que llegáramos a su sala de reuniones".

              "¡¿Tocó el nodo ?!" Meridith dice, en un tono de voz de pánico. "¿Pero cómo sigue aquí? ¿Por qué no se ha vuelto loco? ¡No lo entiendo!"

              "Sólo lo toqué por un breve momento", digo. "Inmediatamente me di cuenta de que la información que estaba recibiendo era demasiada para que mi cerebro pudiera manejarla, así que retiré mi mano lo más rápido que pude para evitar volverme loco".

              "¿Lograste resistir la tentación del conocimiento infinito y tomar la decisión consciente de retirar tu mano del nodo en solo un segundo?..." pregunta Meridith, luciendo aún más confundido que antes. "Pero... si fueras el tipo de persona capaz de tener una cantidad tan increíble de autocontrol, ¿por qué harías algo tan estúpido como tocar el nodo en primer lugar? No lo entiendo... Parece que cuanto más aprendo sobre ti, menos sé realmente".
          - source: scene_text_2
            paragraph: 11
            text: |-
              "No es necesario pensar demasiado en ello", dice Kate. "Así es como siempre ha sido Barry. Por lo que he visto de él hasta ahora, y por lo que he oído de su pasado, le gusta lanzarse constantemente a situaciones en las que una simple decisión de una fracción de segundo podría conducir a su muerte, o algo peor. Estadísticamente hablando, sería imposible para él haber sobrevivido durante tanto tiempo dependiendo sólo de la suerte, así que la única conclusión lógica que puedo sacar de esto es que debe haber desarrollado algún tipo de habilidad sobrehumana para casi siempre tomar la decisión correcta en las condiciones de estrés extremo. Digo 'casi siempre', porque también ha habido situaciones en las que sus decisiones no funcionaron exactamente, por lo que al final tuvo que ser salvado por pura suerte".

              "Ya veo..." dice Meridith.

              "Entonces, ¿alguno de ustedes tiene alguna idea de hacia dónde podrían haber ido sus amigos?"  Diane nos pregunta. "Las paredes seredium nos hacen prácticamente imposible detectar sus auras".
          - source: scene_3
            paragraph: 6
            text: |-
              "Si no me equivoco", dice Kate, "ya pasamos por la entrada secreta del túnel que usamos para llegar hasta aquí, y no creo que Hadrik hubiera podido abrirla sin atravesar la pared. Esto significa que debe haber seguido avanzando por este corredor".

              "Sí, yo también lo creo", dice Meridith. "Solo hay dos maneras de salir de esta área, además del túnel secreto, pero el problema es que una de esas rutas conduce directamente al territorio de la facción Heksol. Tal vez deberíamos revisar ese túnel primero, sólo para estar seguros".

              "¿No está claramente marcada la entrada a ese corredor que conduce al área de la facción Heksol, en el lengua común?" Diane dice. "Seguramente el enano debió leer eso y decidió tomar el otro camino, ¿verdad?"
