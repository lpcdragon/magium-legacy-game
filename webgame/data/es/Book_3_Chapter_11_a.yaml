  - name: b3_ch11a_exchange
    routes:
      - condition: b3_ch11_mocking = 0
        texts:
          - source: scene_text
            paragraph: 29
            text: |-
              "Bienvenidos al club. Se ha estado burlando así de nosotros desde el primer día que lo conocimos".

              "Parece tener talento para meterse en la piel de la gente muy rápidamente", dice Meridith. "Solo lo conozco desde hace poco tiempo y ya tengo ganas de traer una escalera aquí para poder atravesar el cristal con un puñetazo".

              "Uhh... Realmente no recomendaría intentar perforar ninguno de esos cristales azules", dice Hadrik. "Las cosas no le salieron muy bien a la última persona que lo intentó".

              "Sólo estaba bromeando, pero gracias por la advertencia", dice Meridith. "Soy consciente de los peligros que conlleva dañar directamente los cristales, por lo que no me arriesgaría a hacer algo así a menos que tuviera una muy buena razón para ello".

              "Disculpe, señor Supervisor", dice Uverg, el hombre con la bota en la cabeza, "pero no pude evitar escuchar que usted entró en contacto directo con nuestro Creador. ¿Es eso cierto?"

              "Suponiendo que por 'Creador' te refieres al Magium, entonces sí, eso es correcto", dice el Supervisor.

              "¡Asombroso!" Dice Uverg. "¡Nunca pensé que tendría la oportunidad en esta vida de tener una conversación con alguien que pasó por la misma experiencia que yo! ¿Quizás estaría interesado en un intercambio de información sobre lo que aprendimos durante nuestra breve interacción con el Magium? ¡Estoy seguro de que ambos tendríamos mucho que beneficiarnos de algo como esto!"
          - source: scene_text_2
            paragraph: 22
            text: |-
              "El protocolo del Supervisor acepta su propuesta", dice el Supervisor. "Debo admitir que también tenía curiosidad por saber más sobre ti desde que lograste detectarme a través de los cristales. Organizaremos una reunión privada en una fecha posterior, para que podamos discutir esto en profundidad".

              "Si crees que vamos a dejar que ustedes dos mantengan una conversación privada sobre Magium, entonces es posible que sean mucho menos inteligentes de lo que pensé inicialmente", le dice Meridith al Supervisor.

              "Procesando... Procesando..." dice el Supervisor. "El protocolo del Supervisor está detectando una cantidad innecesaria de hostilidad proveniente del líder Lessathi llamado Meridith. Después de un análisis rápido, parece muy probable que esta agresividad no provocada suya sea parcialmente causada por un sentimiento de inferioridad hacia mí".

              "¿Qué?..." dice Meridith, desconcertado.

              "Además", dice el Supervisor, "parece que su comportamiento innecesariamente antagónico hacia mí también puede verse como un resultado indirecto de sus frustraciones cada vez mayores, causadas por su incapacidad para unir a toda su gente bajo una sola bandera y su incompetencia general como líder".
          - source: scene_3
            paragraph: 13
            text: |-
              "¡Jajajajajaja!" Kleykarth se ríe de buena gana. "¡Incompetencia general como líder! ¡Esa es buena! ¡Ya me agradas, Supervisor! Oye, te diré una cosa... ¿Qué tal si tú y Uverg celebran su reunión dentro del territorio de la facción Heksol? De esa manera, podemos asegurarnos de que ustedes dos puedan tener toda la privacidad que necesitan, sin ser interrumpidos. Ah, y no necesitan preocuparse por Meridith. Ella no tiene ningún control real sobre nosotros, por lo que no podrá intervenir. ¿No es así, querido líder?"

              "Realmente estás superando los límites de mi benevolencia, Kleykarth", dice Meridith, frunciendo el ceño.

              "¿Es así?" Kleykarth dice, mientras sonríe. "Bueno, entonces, ¿qué vas a hacer al respecto? ¿Vas a asesinarnos a todos y cada uno de nosotros como lo hiciste con Heksol y luego hacer que tu leal perro use sus poderes ácidos nuevamente para desintegrar nuestros cuerpos sin dejar un solo rastro? ¡Vamos, di lo que realmente quieres decir! ¡Sabes que quieres!"

              "...No", dice Meridith, mientras parece calmarse. "No cederé a sus provocaciones. Usted sabe muy bien que no tiene pruebas para sus afirmaciones y no perderé el tiempo validando sus conspiraciones".
        choices:
