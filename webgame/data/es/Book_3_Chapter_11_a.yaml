              "No te preocupes", le digo. "Estamos hablando de Hadrik. Incluso si conociera a alguien de la facción Heksol, probablemente simplemente les ofrecería un poco de cerveza enana, y ambos ya serían amigos".

              "Espero que tengas razón", dice Meridith.

              Seguimos caminando un rato hasta llegar a la bifurcación del camino, y luego nos dirigimos a través del túnel de la izquierda, que aparentemente parece conducir hacia los cuartos principales de la base Lessathi, según las marcas en las paredes.

              Después de algunos giros y vueltas más, finalmente llegamos a Daren, Flower y Melindra, quienes parecen estar en medio de una acalorada discusión con el guardia Lessathi que tiene la tarea de proteger el túnel de los intrusos.

              "Escucha, hombre", dice Daren en voz alta, mientras parece estar perdiendo los estribos. "No tengo tiempo para tus estúpidos acertijos. Te lo voy a preguntar por última vez. ¿Viste o no a un enano pasando por aquí antes de que nosotros pasáramos?"
          - source: scene_text_2
            paragraph: 14
            text: |-
              "Ya te dije que puede que haya pasado un enano por aquí o no, y que no me vas a sacar más información que esa", dice el guardia. "No es mi deber informarles de todas las personas que cruzan por el túnel. Sin embargo, si existió tal enano, entonces claramente debe haber tenido sus papeles en orden, porque de lo contrario se habría quedado atrapado aquí con el resto de ustedes, buena gente. Ahora, entonces, ¿me mostrarán sus documentos de entrada o tendré que escoltarlos a todos a nuestras agradables y cálidas celdas de prisión?"

              "¡¿Qué parte de que somos invitados de Meridith no entendiste ?!" Daren dice. "¿Cómo crees que podríamos haber entrado aquí si no hubiera sido usando su teletransportador?"

              "Lady Meridith no es la única que tiene acceso al teletransportador", dice el guardia. "Ha habido otros intentos de contrabandear inmigrantes desde la superficie sin solicitar los permisos adecuados a las autoridades en el pasado, y todos tenían historias similares a la suya".

              "Entonces, ¿por qué no le preguntas tú mismo, sabelotodo?" Daren dice. "¡Ella acaba de entrar al túnel!"

              "¡Señora Meridith!" dice el guardia, mientras hace una cortés reverencia. "No sabía que visitarías al Creador hoy. Estaré contigo en un momento. Solo estaba lidiando con estos intrusos mentirosos que afirman que--"

              "Sí, sí, te escuché hablar con ellos", dice Meridith. "No son mentirosos. De hecho, son mis invitados, y lo mismo ocurre con el enano. Dime, ¿realmente viste al enano por el que preguntaban, o en realidad no vino por aquí?"
          - source: scene_3
            paragraph: 7
            text: |-
              "Me temo que hoy no me encontré con ningún enano, señora Meridith", dice el guardia. "¿Quieres que forme un grupo de búsqueda para encontrarlo?"

              Meridith suspira.

              "No, eso no será necesario", dice. "Solo había dos caminos por los que podría haber ido, y si no está aquí, entonces esto significa que debe haber pasado por el túnel de la facción Heksol, como sospechaba. ¿Puedes por favor liberar a estos humanos de tu custodia para que podamos ir a buscarlo juntos?"

              "Umm, sí, claro..." dice el guardia. "Son libres de irse. Pero la próxima vez que invites invitados al metro, ¿podrías pasar por los canales adecuados? Por alguna razón, nunca me informaron de su llegada..."

              "Ciertamente", dice Meridith. "Me aseguraré de que la información llegue correctamente a todas las partes interesadas la próxima vez. Vámonos".

              Mientras Daren y Melindra caminan hacia nosotros, Flower frunce el ceño y le saca la lengua al guardia Lessathi antes de darse la vuelta para unirse a nosotros también.
