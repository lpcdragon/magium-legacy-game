            effects:
              - set:
                  current_scene: b3_ch11a_insane
      - condition: b3_ch11_transferred = 1
        texts:
          - source: scene_text
            paragraph: 11
            text: |-
              "La primera vez que lo usé, Eiden transfirió su energía al dispositivo para activarlo".

              "¿Eiden?..." pregunta Meridith, sorprendido. "¿Pero por qué haría tal cosa? ¿Contra quién estabas luchando en ese momento?"

              "Estábamos siendo atacados por Tyrath, el rey de los dragones", digo. "Estaba a punto de matarnos cuando Eiden congeló el tiempo y me dio esos poderes, para igualar las probabilidades".

              "Ah... eso tiene más sentido", dice Meridith. "Por supuesto que él tendría algo que ganar al ayudarte a derrotar a uno de sus enemigos más fuertes. Pero aun así, si lo que dices es cierto, entonces es posible que la firma del aura de Eiden todavía esté impresa en tu dispositivo. ¿Puedes entregármelo de nuevo solo por unos segundos para que pueda comprobarlo?"

              "Claro", digo, y luego le doy el dispositivo una vez más.

              Tan pronto como lo recibe, Meridith usa su varita para tocar el potenciador de estadísticas, y poco después una luz azul comienza a irradiar desde mi dispositivo, solo para volver a la normalidad unos segundos después.

              "Tal como pensaba..." dice Meridith. "Tu dispositivo ha registrado el aura de Eiden como una fuente potencial de energía para situaciones de emergencia. Esto significa que siempre que Eiden esté cerca, deberías poder activar el modo de emergencia simplemente presionando este botón tres veces en rápida sucesión".

              "¡Guau, eso es increíble!" Digo, mientras tomo mi dispositivo y lo guardo en mi bolsillo. "Entonces, ¿esto significa que ahora puedo robar toda su energía con mi dispositivo y él no podrá hacer nada al respecto?"
          - source: scene_text_2
            paragraph: 8
            text: |-
              "No", dice Meridith. "Tan pronto como se dé cuenta de lo que estás haciendo, Eiden probablemente solo necesitará unos segundos para bloquear la capacidad de tu potenciador de estadísticas de absorber su energía, y entonces nunca podrás volver a usar este método contra él. Sin embargo, dado que esta es una característica muy oscura del dispositivo, dudo mucho que Eiden lo sepa, así que al menos debería tomarlo por sorpresa. Probablemente no obtendrás mucho impulso en tu niveles, y no tendrás tiempo para lanzar más de uno o dos hechizos, pero aun así, tener un as bajo la manga aún podría significar la diferencia entre la vida y la muerte, si alguna vez necesitas luchar contra Eiden de frente".

              "Mmm..." digo. "Puede que tengas razón. Supongo que es bueno tener algo como esto como último recurso, para el peor de los casos. ¡Gracias por informarme sobre esto!"

              "De nada", dice Meridith.

              "¿Tiene alguna idea de si hay otras formas en las que podríamos activar este modo de emergencia cuando se lo ordenemos?" Kate dice. "Por ejemplo, si todos intentáramos transferir nuestra energía mágica al dispositivo al mismo tiempo, ¿quizás eso podría activarlo?"
          - source: scene_3
            paragraph: 4
            text: |-
              "Se necesitarían cantidades ridículas de energía para transferirse muy rápidamente al dispositivo, para tener incluso una pequeña posibilidad de activar este modo", dice Meridith. "Hablando de manera realista, stillwaters son los únicos tipos de magos que poseen cantidades tan altas de energía, pero hasta donde yo sé, Melindra no tiene control total sobre sus poderes, por lo que nunca sería capaz de hacer algo tan complejo como transferir su energía voluntariamente al dispositivo. Si el resto de ustedes intentaran activar el dispositivo con sus niveles de energía, probablemente solo estarían perdiendo el tiempo".

              "Ya veo", dice Kate.

              "Diane, has estado muy callado desde que regresaste de la superficie", le dice Meridith a Diane, pareciendo genuinamente preocupado. "¿Pasa algo?"

              "Umm, no, señora Meridith", dice Diane, luciendo un poco nerviosa. "Es sólo que sabía lo importante que era esta reunión para ti y no quería interrumpir".

              "No es necesario que te preocupes por eso", dice Meridith. "Puedes decir lo que tengas en mente. Sabes que siempre he valorado tu opinión".

              "Gracias, señora Meridith", dice Diane. "¡Me aseguraré de decir lo que pienso cada vez que tenga algo importante que agregar!"
