  - name: b3_ch11a_observation
    texts:
      - source: scene_text
        paragraph: 17
        text: |-
          Justo cuando estábamos a punto de salir, noté que una pequeña área de una de las paredes del túnel parece ligeramente fuera de lugar, en comparación con el resto de la superficie negra seredium. Por alguna razón, esto me molesta, así que me acerco para poder verlo mejor.

          "Barry, ¿qué está pasando?" Daren me pregunta. "¿Por qué te detuviste?"

          "No sé cómo explicarte esto, pero hay algo en esta pared que no me resulta natural", digo, mientras toco su superficie, para ver si puedo notar una diferencia en la textura en comparación con las otras seredium rocas. "¿Podría ser que este túnel en particular haya sido hecho por el hombre, por casualidad?"

          "Definitivamente es posible", dice Meridith. "Estos túneles estuvieron aquí desde mucho antes de que cualquiera de nosotros naciera, por lo que ninguno de nosotros sabe exactamente cómo fueron creados. Aunque realmente no entiendo por qué eso es relevante..."

          "Verás", digo, "la cosa es que hay un arquitecto Lessathi de los viejos tiempos que dejó un montón de piezas de rompecabezas en todos los lugares que construyó, y me preguntaba si por casualidad este no era uno de ellos, considerando que esta es la principal base de operaciones Lessathi. De todos los muros en este lugar, este me parece el más sospechoso, pero no puedo decir exactamente por qué. Melindra, Flower, ustedes son las expertas en rocas que hay por aquí. ¿Podrían echar un vistazo rápido?"
      - source: scene_text_2
        paragraph: 15
        text: |-
          "Realmente no tenemos tiempo para esto..." dice Meridith. "Por lo que sabemos, tu amigo enano ya podría haberse metido en una pelea de borrachos con algunos de los Lessathi de la facción Heksol, y si no estoy allí para detenerlo, quién sabe qué..."

          "Estoy seguro de que Hadrik está bien", le digo, mientras Melindra se acerca y también comienza a examinar la pared. "¿Qué dices, Melindra? ¿Estás notando algo peculiar?"

          "Definitivamente tienes razón en que este lugar fue menos construido por athi, por lo que parece", dice Melindra, "pero no estoy tan seguro acerca de la pieza del rompecabezas. Al menos, no noto ningún mecanismo obvio que pueda causar que la pared se abra. Flower, ¿qué piensas?"

          "Bueno, hay algunos códigos de acceso secretos que he usado en otras ruinas en el pasado para abrir corredores secretos", dice Flower. "Podría probar algunos de esos."

          "No puedes hablar en serio..." dice Meridith. "¡Esto va a tomar una eternidad!"

          "No, no, será muy rápido, ¡mira!" Dice Flower, y luego comienza a golpear la pared varias veces, con algunas pausas entre los golpes, para ver si hay alguna reacción. "Está bien, esos fueron dos de los códigos. ¡Faltan tres más!"
      - source: scene_3
        paragraph: 8
        text: |-
          Tan pronto como Flower termina el tercer código, la roca de aspecto peculiar comienza a deslizarse dentro de la pared por sí sola, y luego se mueve hacia un lado, para que una piedra gris con escritura pueda tomar su lugar, dejando suficiente espacio entre la piedra y el resto de la pared para que pueda pasar un objeto pequeño. Las palabras en la piedra están escritas en lengua común y dicen: 'Si te gusta descubrir secretos, coloca tu palma sobre esta roca'.

          De repente, escucho a Flower jadear, mientras ella también termina de leer la escritura en la superficie rocosa.

          "Barry, ¡creo que tenías razón!" ella dice. "¡Esto realmente parece obra de ese arquitecto Lessathi otra vez! ¡Espera, déjame comprobar!"

          Luego coloca su palma sobre la roca, como dice la escritura, e inmediatamente se arroja una pieza del rompecabezas por el agujero debajo de la piedra, junto con un pequeño pergamino con un texto que también está escrito en lengua común, que dice: 'Encuentra todas las piezas del rompecabezas y compartiré contigo mi mayor secreto. He dejado uno de estos en cada uno de los edificios que he diseñado.'

          "Barry, ¿qué estás esperando?" Flower me lo dice. "¡Pon tu palma sobre la piedra, rápido! ¡Antes de que se deslice hacia la pared!"
    effects:
      - set:
          successful_checks:
            - '[ Comprobación de observación exitosa - nivel 4 ]'
    choices:
      - position: 1
        text: Coloque mi palma sobre la piedra.
        effects:
          - set:
              current_scene: b3_ch11a_heksol
              b3_ch11_puzzle4: 1
      - position: 2
        text: Me niego a tomar una pieza del rompecabezas para mí.
