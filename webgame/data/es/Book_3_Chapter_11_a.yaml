    routes:
      - condition: b3_ch11_transferred = 0
        texts:
          - source: scene_text
            paragraph: 10
            text: |-
              "Aparecí la opción en la pantalla mientras luchaba contra un esqueleto stillwaters".

              "Oh... creo que ahora lo entiendo", dice Meridith. "Su gran cantidad de energía debe haber sido demasiada para que sus auras la absorbieran por completo, por lo que se estaba escapando, lo que activó el mensaje del modo de emergencia. ¿Es eso lo que pasó?"

              "¡Sí, exactamente!" digo.
          - source: scene_text_2
            paragraph: 9
            text: '"¿Tiene alguna idea de si hay otras formas en las que podríamos activar este modo de emergencia cuando se lo ordenemos?" Kate dice. "Por ejemplo, si todos intentáramos transferir nuestra energía mágica al dispositivo al mismo tiempo, ¿quizás eso podría activarlo?"'
          - source: scene_3
            paragraph: 4
            text: |-
              "Se necesitarían cantidades ridículas de energía para transferirse muy rápidamente al dispositivo, para tener incluso una pequeña posibilidad de activar este modo", dice Meridith. "Hablando de manera realista, stillwaters son los únicos tipos de magos que poseen cantidades tan altas de energía, pero hasta donde yo sé, Melindra no tiene control total sobre sus poderes, por lo que nunca sería capaz de hacer algo tan complejo como transferir su energía voluntariamente al dispositivo. Si el resto de ustedes intentaran activar el dispositivo con sus niveles de energía, probablemente solo estarían perdiendo el tiempo".

              "Ya veo", dice Kate.

              "Diane, has estado muy callado desde que regresaste de la superficie", le dice Meridith a Diane, pareciendo genuinamente preocupado. "¿Pasa algo?"

              "Umm, no, señora Meridith", dice Diane, luciendo un poco nerviosa. "Es sólo que sabía lo importante que era esta reunión para ti y no quería interrumpir".

              "No es necesario que te preocupes por eso", dice Meridith. "Puedes decir lo que tengas en mente. Sabes que siempre he valorado tu opinión".

              "Gracias, señora Meridith", dice Diane. "¡Me aseguraré de decir lo que pienso cada vez que tenga algo importante que agregar!"
        choices:
          - position: 1
