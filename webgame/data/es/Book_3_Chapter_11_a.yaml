        paragraph: 44
        text: |-
          "Los Lessathi pasaron las siguientes décadas aprendiendo las costumbres de los humanos e infiltrándose en sus sociedades en los niveles más altos", dice Uverg. "La mayoría de nuestros antepasados eran inventores y caldereros muy hábiles, gracias al conocimiento que obtuvieron de los nodos Magium a lo largo de los años, por lo que les resultó fácil ganarse los favores de muchas figuras importantes de esa época. Una vez que los Lessathi lograron obtener posiciones de poder político suficientemente significativo, dieron un golpe de estado y destronaron a todos los líderes humanos, colocándose a sí mismos y a sus parientes como los nuevos gobernantes. Luego esclavizaron a toda la población humana y procedió a conquistar todas las demás tribus, ciudades o pueblos en las inmediaciones. Cientos de años después, los Lessathi formarían un imperio tan poderoso que se extendería por todo Varathia, aunque para ese momento, los humanos ya no eran sus esclavos. Habían sido liberados por algunos de los gobernantes Lessathi más benevolentes que les siguieron y se les permitió vivir pacíficamente dentro de las ciudades Lessathi, como ciudadanos de segunda clase, que es lo que continuarían siendo hasta el colapso total. del imperio Lessathi, durante el tranquilo invierno."

          "Vaya..." dice Daren. "Casi diez mil años de tratar a los humanos como ciudadanos de segunda clase sólo por las malas acciones de una tribu, de una época muy pasada. Seguro que tu gente puede guardar rencor, ¿eh?"

          "Efectivamente", dice Uverg. "Los Lessathi no olvidan fácilmente. Incluso ahora, después de todos estos años, esto no ha cambiado".

          "Hola, Uverg", dice Hadrik. "¿Te importaría si te hiciera una pregunta personal?"

          "Por supuesto que no", dice Uverg. "Pregunta".
      - source: scene_text_2
        paragraph: 31
        text: |-
          "Está bien", dice Hadrik. "Bueno, por lo que he visto hasta ahora, pareces un tipo bastante inteligente, y no me pareces tan loco, así que me preguntaba ¿cuál es la razón por la que te vistes así?"

          "Oh, ¿te refieres a por qué no estoy usando túnicas azul oscuro como el resto de los Lessathi en este lugar?" dice Uverg. "Honestamente, es sólo una cuestión de preferencia personal. Nunca me ha gustado mucho el 'uniforme' que usa la gente por aquí, y Lady Meridith ha sido lo suficientemente amable como para hacer una excepción conmigo y permitirme usar una camisa y pantalones en su lugar".

          "En realidad, estaba más interesado en saber por qué llevas una bota en la cabeza y calcetines en las manos", dice Hadrik.

          "¡Oh, eso!" dice Uverg. "Esto es en realidad un experimento social que estoy haciendo. Verás, la mayoría de las personas que tocan el nodo Magium como lo hice yo terminan volviéndose bastante locas, así que pensé en intentar disfrazarme como un loco, sin dejar de actuar racionalmente, para ver cuántas personas pueden ver más allá de las apariencias y darse cuenta de que en realidad no me he vuelto completamente loco. Por lo que he visto hasta ahora, hay muy pocas personas aparte de Meridith que me tratan como una persona cuerda. Siempre es interesante ver cuántas personas están dispuestas a ignorar por completo mis argumentos, sin importar cuán bien construidos o lógicos sean, simplemente por mi forma de vestir. En verdad, esta es una mirada fascinante a las profundidades de la psique humana, ¿no le parece?"

          "Umm, claro", dice Hadrik. "Si eso es lo que te gusta hacer, ¿quién soy yo para juzgar?"
      - source: scene_3
        paragraph: 20
        text: |-
          "No se trata sólo de la forma en que te vistes, Uverg", dice Meridith. "Tu forma de pensar también ha cambiado. Siempre fuiste un poco excéntrico, pero nunca habrías pensado en vestirte como una persona loca solo para hacer un experimento social antes de tocar el nodo Magium. Antes no tenías este tipo de completo desprecio por la opinión que la gente tenía sobre ti. Es difícil expresar con palabras exactamente lo que ha cambiado en ti, pero si intentara describirlo, es como si cuando ingresaste al reino Magium, un Una parte de ti permaneció allí y nunca regresó”.

          "Tendré que confiar en su palabra, señora Meridith, ya que personalmente no me siento tan diferente de cómo solía ser", dice Uverg. "Desde mi punto de vista, soy la misma persona, sólo que con muchísimo más conocimiento y con una sed insaciable de aprender incluso más de lo que ya sé. Si la forma en que elijo buscar ese conocimiento me hace parecer loco a los demás, entonces ese es un precio que estoy dispuesto a pagar".

          "Lo sé, Uverg", dice Meridith, con un suspiro. "Ya he aceptado el hecho de que probablemente nunca volverás a ser tu yo anterior, pero eso no significa que tenga la intención de rechazar la persona que eres ahora. Como dije antes, eres libre de usar lo que quieras y de hacer tu investigación de la manera que creas conveniente, siempre y cuando la calidad de tu trabajo siga siendo tan consistente como antes. Ahora, si no hay nada más que puedas informar, realmente me gustaría discutir algo en privado con mis invitados, si no te importa".
    choices:
