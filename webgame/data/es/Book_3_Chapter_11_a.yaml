              "Lo más probable es que el zorro dorado envíe a Leo, el leopardo", dice Meridith, mientras abre un túnel secreto con su varita. "Escuché que los dragones de las montañas también enviarán su propio enviado separado, ya que nunca aceptaron realmente el reclamo de Tyrath de ser su rey legítimo. Ah, y creo que Fyron, el general goblin, asistirá él mismo a la reunión, si no me equivoco. Aparte de eso, creo que el rey de Galamir será quien mediará en la conferencia, y que los otros reyes normalmente deberían asistir a la reunión a través de pantallas holográficas".

              "Parece que habrá muchas caras conocidas en esta reunión", dice Daren. "Todos hemos conocido a Leo el leopardo y al capitán orco, y estoy bastante seguro de que Barry dijo que él y Illuna conocieron a Fyron, así que los únicos que no conoceremos serán los reyes de Varathia y el representante de los dragones. Tal vez tengamos la oportunidad de conocer a algunos de ellos en Galamir".
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch11a_declaration
      - condition: b3_ch11_diane = 2
        texts:
          - source: scene_text
            paragraph: 59
            text: |-
              "Lo siento, pero me parece que Meridith te está enviando a espiarnos".

              "En serio, Barry?..." dice Daren. "Quiero decir, entiendo lo que estás diciendo, pero aun así, ¿no crees que había una mejor manera de expresar tu--"

              "No, no, tiene razón", dice Diane. "Puede que sea amigo de la infancia de Kate, pero eso no significa que te haya dado razones para confiar en mí todavía. Sin embargo, espero que eso cambie una vez que hayamos viajado juntos durante unos días y hayas llegado a conocerme mejor".

              "Parece que Meridith está a punto de terminar su conversación con Magium", dice el Supervisor. "Te dejaré ahora, ya que no deseo comenzar una discusión con ella nuevamente. Solo asegúrate de recordar lo que dije. Meridith no es tu amiga. Si cometes el error de pensar lo contrario, seguramente llegarás a arrepentirte. Adiós."

              "Y... ¡se ha ido!" Hadrik dice, mientras la luz brillante se desvanece del cristal que el Supervisor estaba usando para hablar. "Entonces, ¿cuánto están dispuestos a apostar a que esta no fue la última vez que vimos al Supervisor?"

              "No aceptaré esa apuesta", dice Daren. "El tipo prácticamente admitió que tiene un sistema para avisarle cuando estemos bajo tierra. Mientras estemos cerca de un cristal azul, creo que es seguro asumir que el Supervisor nos está espiando, a menos que se demuestre lo contrario".

              Cuando Hadrik y Daren están terminando su conversación, la puerta secreta al nodo Magium se abre, dando paso a Meridith para pasar.
          - source: scene_text_2
            paragraph: 40
            text: |-
              "Lamento que haya tomado tanto tiempo", nos dice Meridith, mientras cierra la pared detrás de ella. "El Creador tenía algunos asuntos importantes que discutir conmigo y que no podían retrasarse más. De todos modos, creo que los he retenido a todos el tiempo suficiente. Es hora de que les dé su detector de piñas, para que puedan seguir su camino".

              "¡FINALMENTE!" Arraka dice, en voz alta. "Estaba empezando a cansarme mucho de este lugar".

              "¿Tuvo Diane tiempo para darle la buena noticia?" Meridith nos pregunta, ignorando a Arraka.

              "¿Quieres decir que ella vendrá con nosotros al bosque sagrado y a Galamir?" Kate dice. "Sí, ella nos lo dijo."

              "¡Espléndido!" Meridith dice. "Normalmente, no habría estado de acuerdo, ya que su desvío contigo puede retrasarla unos días, pero por lo que he escuchado, los otros enviados diplomáticos también llegarán tarde, por lo que no tiene mucho sentido que Diane, de todas las personas, llegue allí antes. Vayamos hacia el teletransportador. He escondido el detector de piñas dentro de una pared, en algún lugar del camino".

              "Perdón si estoy siendo indiscreto, pero ¿enviado diplomático para qué?" Daren dice, mientras regresamos a teletransportador, junto con Meridith. "¿Qué va a hacer Diane allí?"
