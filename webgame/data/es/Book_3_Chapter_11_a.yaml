              "No..." dice Uverg. "Inventaron un dispositivo de teletransportación".

              "¿Un dispositivo de teletransportación?" Hadrik pregunta. "¿Con sólo las herramientas y materiales que tenían bajo tierra?..."

              "Hay que entender que les llevó cientos de años escapar del subsuelo", afirma Uverg. "Al principio, tuvieron problemas incluso para sobrevivir. Tuvieron que aprender qué tipos de hongos y plantas subterráneas eran comestibles, y pasaron años explorando las vastas redes subterráneas de cuevas que existen en todo Varathia. Pero eventualmente, aprendieron todo lo que necesitaban y comenzaron a explotar todos los recursos a su disposición. Sin embargo, su rápido avance tecnológico no comenzó hasta que finalmente aprendieron cómo extraer conocimiento de los nodos Magium".

