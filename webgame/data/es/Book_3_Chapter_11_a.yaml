  - name: b3_ch11a_exploring
    texts:
      - source: scene_text
        paragraph: 53
        text: |-
          "Encantador", dice Meridith. "Bueno, creo que con esto concluye nuestra sesión. Espero que todos hayan tenido una buena idea de cuánto podrían ganar ayudándome. Nuevamente, no les pido que tomen la decisión ahora, pero aún así sería bueno si--"

          "Meridith", de repente escuchamos un eco de voz desde el interior del nodo Magium. "Acercarse."

          "¡Uhm, sí Creador!" Meridith dice, mientras inmediatamente deja lo que estaba haciendo y se acerca al nodo.

          "Tu aura está temblando de nuevo, Arraka", dice Illuna.

          "Oh, cállate", le dice Arraka.

          "Sólo Meridith", dice una voz diferente, pero aún procedente del nodo. "No hay forasteros".

          "Por supuesto, Creador", dice Meridith, y luego se vuelve hacia nosotros. "¿Podrías esperar afuera unos minutos?"

          "Claro, claro", dice Daren. "No queremos entrometernos. Vámonos, muchachos".
      - source: scene_text_2
        paragraph: 38
        text: |-
          "No tienes que decírmelo dos veces", dice Hadrik, mientras todos salimos de la habitación y luego golpeamos la pared para cerrarla detrás de nosotros.

          "Entonces, ¿qué hacemos ahora?" Hadrik nos pregunta, tras unos segundos de incómodo silencio. "¿Esperamos aquí o vamos a explorar?"

          "No recomendaría ir a explorar sin Meridith", dice Diane. "Es posible que ustedes hayan tenido suerte la primera vez con los dos guardias, pero hay otros Lessathi que pueden estar buscando cualquier excusa para comenzar una pelea con ustedes, especialmente si saben que Meridith entregó el cetro sagrado de Heldenbusorag a Kate. Sería mejor si esperáramos aquí".
      - source: scene_3
        paragraph: 27
        text: |-
          "¡Funciona para mí!" digo. "Esto significa que tendré algo de tiempo para revisar la lista de hechizos de mi dispositivo de estadísticas. Ya estoy reconociendo algunos de los hechizos que Brinhorn usaba a diario mientras yo era su aprendiz. De hecho, lo ayudé a modificar algunos de estos para que fueran un poco más eficientes. Déjame ver si todavía recuerdo el--"

          "Saludos amigos", de repente escucho la voz del Supervisor proveniente de uno de los cristales azules en el techo. "El protocolo Supervisor quisiera disculparse por su comportamiento grosero anterior. Ahora me doy cuenta de que ignorarte por completo durante nuestro último encuentro no fue muy cortés de mi parte".
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch11a_recording
  - name: b3_ch11a_recording
    routes:
      - condition: b3_ch8_overseer2 = 0
        texts:
          - source: scene_text
            paragraph: 54
            text: |-
              "¿Nos acabas de llamar amigos?" Hadrik dice. "Te das cuenta de que fui yo quien destruyó tu núcleo, ¿verdad?"

              "Procesando... Procesando..." dice el Supervisor. "El protocolo Supervisor había olvidado que a algunos de los miembros de su grupo les cuesta entender el sarcasmo. Permítanme aclarar cualquier confusión que pueda haber causado. La verdad es que no considero a ninguno de ustedes como mis amigos. De hecho, los odio a todos, y espero sinceramente que mueran muy dolorosamente en un futuro cercano. Pero eso no viene al caso. Lo que vine aquí a decirles es que después de realizar un análisis exhaustivo, he llegado a la conclusión de que me beneficiaría si tuviera que hacerlo. sembrar desconfianza entre su grupo y Meridith. Como tal, me tomé la libertad de grabar parte de la discusión en curso de Meridith con Magium, que creo que le resultará muy interesante".

              "Creo que se está oxidando un poco, supervisor", dice Daren. "Ya intentaste ese truco contra nosotros en Ollendor, cuando querías que matemos al rey del subsuelo por ti. Simplemente vas a hacer que escuchemos una conversación fuera de contexto nuevamente, ¿no?"

              Como era de esperar, el Supervisor ignora Daren por completo y simplemente reproduce la conversación que grabó usando el cristal azul.
          - source: scene_text_2
            paragraph: 39
            text: |-
              "Creador, con el debido respeto, creo que podrías estar subestimando a Eiden", escuchamos la voz de Meridith, proveniente del cristal. "El mensaje que nos envió fue muy claro. Nos dijo que 'recordemos el invierno quieto'. Es casi seguro que esta es su manera de decirnos que sabe exactamente lo que estamos tratando de hacer y que confía en su capacidad para detenernos. También he recibido informes de que durante las últimas semanas se ha estado teletransportando por todo el continente, preparando un poderoso hechizo propio. ¡Si no hacemos algo, podríamos perder nuestra última oportunidad de acabar con él para siempre!"

              "¿Qué sugieres?" dice el fragmento Magium, con voz de anciano.

              "Puede que no sea el escenario ideal, pero si aceleráramos nuestro plan, podríamos tener todo listo en unos días y luego..." dice Meridith, pero el fragmento Magium la interrumpe.

              "¡No!" dice el fragmento Magium, en voz alta, esta vez con la voz de una mujer joven. "El plan no debe apresurarse, o seguramente fracasará. ¿Entiendes?"

              "...Sí, Creador", dice Meridith, en tono reacio. "Entiendo."

              "Como pueden ver", nos dice el Supervisor, una vez finalizada la grabación, "Meridith de hecho sabe mucho más sobre el mensaje de Eiden de lo que ella quisiera hacerles creer. Mi análisis preliminar también sugiere que este 'plan' suyo puede no afectar solo a Eiden, como parece afirmar, aunque todavía tengo que descubrir todos los detalles".

              "Diane, ¿sabrías por casualidad cómo exactamente Meridith pretende tratar con Eiden?" Kate dice.
          - source: scene_3
            paragraph: 28
            text: |-
              "Me temo que no", dice Diane. "No creo que a ninguna de las personas que conocen los detalles del plan se le permita salir de las cavernas subterráneas, porque siempre existiría el riesgo de que Eiden pudiera capturarlos e interrogarlos. Tengo la sensación de que ni siquiera Jason sabe lo que sucede detrás de escena, y Meridith generalmente le cuenta mucho más de lo que ella me cuenta a mí".

              "Lo siento, ¿quién es Jason?..." pregunta Hadrik.

              "Es el hermano de Diane", le responde Kate. "Lo que me recuerda... ¿Dónde está Jason? Me hubiera gustado al menos saludarlo antes de irme".

              "Jason está ocupado con una misión importante, en algún lugar de la superficie", dice Diane, "así que desafortunadamente, no tendrás la oportunidad de conocerlo hoy. Pero aún así podríamos toparnos con él en nuestro camino al bosque sagrado. Tendré que llamarlo y preguntarle más tarde si puede revelarnos su ubicación o no".

              "¿Te... te escuché bien?" Kate dice, sorprendido. "¿Acabas de decir que vas a venir con nosotros a buscar la piña?"

              "Oh, es cierto, nunca pudimos decírtelo..." dice Diane. "Meridith en realidad estaba a punto de enviarme a Galamir antes de que Melindra la llamara, así que la convencí para que me dejara unirme a su grupo. ¡Ya saben, ya que todos vamos por el mismo camino! ¡Espero que no les importe!"
