  - name: b3_ch11a_crafty
    texts:
      - source: scene_text
        paragraph: 32
        text: |-
          "¡Ja!" dice Kleykarth, mientras toma otro sorbo de cerveza de su vaso. " "Conspiraciones", dice. Todos sabemos que mataste a Heksol, incluso si no hay pruebas. Y te aseguro que tus aduladores de tu facción también lo saben. "Nunca te respetaremos como líder, Meridith, no importa cuánto intentes mantener esta ilusión de diplomacia entre nuestra gente. Será mejor que te acostumbres a eso".

          "¿Debo tomar esto como una amenaza?..." le pregunta Meridith, con cautela.

          "En absoluto", dice Kleykarth. "Verás, a diferencia de ti, nosotros, los de la facción Heksol, nunca rebajaríamos tan bajo como para matar a los de nuestra propia especie, sólo por una lucha de poder. También continuaremos cooperando contigo siempre que nuestros objetivos coincidan, como fue el caso con este torneo de magos. Sin embargo, si esperas tener alguna vez una relación amistosa con nosotros en el futuro, entonces estás muy equivocado. No importa cuántas veces intentes engatusar al líder de nuestra facción, la respuesta siempre será la misma. Si nos dejas dirigir nuestra facción como queramos, podemos coexistir pacíficamente. De lo contrario, las cosas podrían empezar a volverse un poco... menos pacíficas. Puedes tomar ESTO como una amenaza, si no me importa.
      - source: scene_text_2
        paragraph: 23
        text: |-
          "Entendido", dice Meridith. "Entonces supongo que no tendré más remedio que tener otra conversación con el líder de tu facción sobre toda esta situación del Supervisor. Sólo puedo esperar que él esté más dispuesto a entrar en razón que tú".

          "No te preocupes, también planeo hablar con él sobre esto", dice Kleykarth. "Estoy seguro de que estará más que feliz de recibir al Supervisor con los brazos abiertos, una vez que escuche que es un compañero que odia a Meridith. Ah, y puedo hablar bien de ti también, enano, si quieres unirte a nosotros. No creo que tengas problemas para encajar".

          "Oye, realmente aprecio la oferta, amigo", dice Hadrik, "pero no creo que pase suficiente tiempo aquí para visitar tu parte de la base. Quizás la próxima vez, ¿eh?"

          "Bueno, tendré que reunirme con nuestro líder hoy de todos modos, así que probablemente te mencionaré de todos modos", dice Kleykarth. "De esa manera al menos, el papeleo estará hecho para cuando decidas volver a visitarnos. ¿Te parece bien?"

          "¡Seguro!" Hadrik dice, mientras bebe un poco más de cerveza. "¡Me parece bien!"

          "El protocolo del Supervisor también quisiera hablar con el líder de su facción", dice el Supervisor. "¿Sería aceptable que me uniera a usted cuando lo conozca más tarde?"

          "Por supuesto, por supuesto", dice Kleykarth. "Siéntete como en casa. Descubrirás que somos gente muy acogedora, muy diferente a Meridith y sus títeres".
      - source: scene_3
        paragraph: 14
        text: |-
          "Es muy bueno escuchar eso", dice el supervisor. "En ese caso, espero una relación próspera y de beneficio mutuo entre su gente y yo".

          "¡Jajaja!" Kleykarth se ríe. "'Relación próspera', dice. ¿De dónde se te ocurre esto? ¡Me haces reír, hombre!"

          "¿Soy solo yo, o el Supervisor ha estado antagonizando a Meridith a propósito desde el principio, sólo para poder tener una relación amistosa con la facción Heksol?" Kate me dice en voz baja.

          "Es muy probable, sí", le susurro.

          "¿Siempre ha sido así de astuto?..." me pregunta Kate. "No me dio esa impresión en Ollendor".

          "Él también era astuto en aquel entonces", le digo. "Es sólo que estaba haciendo un mayor esfuerzo por ocultar sus verdaderas intenciones en ese momento. Ahora ya no parece importarle mucho las apariencias".

          "Si me disculpan, tengo otros asuntos que atender, así que me iré temporalmente", dice el supervisor. "Sin embargo, me aseguraré de regresar cuando mi nuevo amigo Kleykarth se reúna con su líder. ¡Les deseo a todos un día agradable!"

          "¡Ey!" Meridith dice. "No he terminado de hablar contigo. ¿Me oyes? ¡Supervisor!"

          El cristal de arriba ya no responde de ninguna manera. Parece que el Supervisor realmente se fue, tal como lo prometió.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch11a_infiltrate
  - name: b3_ch11a_infiltrate
    texts:
      - source: scene_text
        paragraph: 33
        text: |-
          "Increíble..." dice Meridith. "¡De hecho se fue! ¿Puedes creer el descaro?"

          "¿Qué pasa, Meridith?" dice Kleykarth. "¿No te gusta cuando los demás no escuchan tus órdenes? ¿Te hace sentir... frustrado? ¡Ajajajaja!"

          "Cada vez que abres la boca te vuelves más impertinente", dice Meridith, en un tono mucho más serio que antes. "¿De verdad quieres ver qué pasa cuando me enfado tanto?"

          De repente, la expresión del rostro de Kleykarth cambia por completo. La confianza en sus ojos ha desaparecido y ahora parece mucho más aprensivo. Parece que incluso en su estupor de borrachera, todavía es capaz de darse cuenta de cuándo ha cruzado la línea.

          "Ahora, ahora... ¡calmémonos todos!" Dice Uverg. "Estoy seguro de que Kleykarth no quiso decir lo que dijo. ¡Es sólo el alcohol el que habla, eso es todo!"

          "Me estás diciendo que me calme, pero tú eres el que más me decepcionó hoy, Uverg", dice Meridith. "Cuando todos dijeron que deberíamos encerrarte porque estabas loco, yo personalmente respondí por ti. Les aseguré que a pesar de tu reciente comportamiento excéntrico, no habías perdido el sentido y que todavía estabas perfectamente lúcido. ¿Y ahora me traicionas así?... ¿Estás del lado de la facción Heksol y aceptas tener una discusión privada con un enemigo potencial que se infiltró en nuestra base? Pensé que dijiste que permanecerías neutral y no te unirías a ninguna de las facciones. ¿Era solo una mentira?"
      - source: scene_text_2
        paragraph: 24
        text: |-
          "Señora Meridith, le pido disculpas si siente que he traicionado su confianza", dice Uverg con voz humilde. "Por favor, créanme cuando digo que esta nunca fue mi intención. Ya sea que vaya a reunirme con el Supervisor o no, ya debería estar claro que será bienvenido en la facción Heksol, y entonces cualquier información que pueda divulgar nunca llegará a sus oídos. Sin embargo, si me hago amigo de él y consigo que me cuente algunos de sus secretos, estoy más que dispuesto a compartir mis hallazgos con usted después. Si bien este puede no ser el escenario ideal que tenía en mente, sigue siendo mejor que la alternativa. Nos guste o no, el Supervisor se infiltrará en nuestra base y obtendrá acceso al nodo Magium. Sin embargo, si no lo convertimos directamente en nuestro enemigo, nuestra relación con él podría volverse 'mutuamente beneficiosa', como dijo. Por supuesto, todo esto dependerá de usted..."

          "Entonces, ¿estás diciendo que realmente no hay forma de detenerlo?" Meridith dice. "¿No ves alguna forma en la que podamos cerrar su conexión con los cristales, o-"
      - source: scene_3
        paragraph: 15
        text: |-
          "Con nuestro nivel actual de conocimientos, me temo que eso simplemente no es posible", afirma Uverg. "Incluso ser capaz de detectarlo a través de los cristales podría resultar difícil en el futuro, ya que es probable que encuentre mejores maneras de ocultar su presencia, ahora que sabe que puedo sentirlo. Entiendo que esto podría no ser lo que quieres escuchar, pero cerrar todas las líneas de contacto con él puede no ser lo mejor para nosotros por el momento".

          "Ya veo..." dice Meridith, mientras parece estar reflexionando sobre las palabras de Uverg. "Tal vez tengas razón. Tal vez no sea una buena idea apresurarnos demasiado con nuestras decisiones hasta que sepamos exactamente con qué estamos lidiando. En esa nota, Barry, dijiste que habías tratado con el Supervisor en el pasado... ¿Quizás hay algún consejo que podrías darnos sobre cómo debemos interactuar con él? ¿O tal vez tiene algún tipo de debilidad que podríamos explotar?"
    choices:
      - position: 1
        text: Dile que no tenga reuniones secretas en habitaciones con cristales.
        effects:
          - set:
              current_scene: b3_ch11a_limitation
              b3_ch11_weakness: 0
      - position: 2
        text: Cuéntale sobre el núcleo del Supervisor.
        effects:
          - set:
              current_scene: b3_ch11a_limitation
              b3_ch11_weakness: 1
      - position: 3
        text: Dígale que el Supervisor sólo puede mentir por omisión.
        effects:
          - set:
              current_scene: b3_ch11a_limitation
              b3_ch11_weakness: 2
  - name: b3_ch11a_limitation
    routes:
      - condition: b3_ch11_weakness = 0
        texts:
          - source: scene_text
            paragraph: 34
            text: |-
              "Una cosa que puedo recomendar es que ya no celebren reuniones privadas en salas con cristales azules", digo. "Esto es lo que solíamos hacer en Ollendor, para asegurarnos de que el Supervisor no pudiera escucharnos".

              "Ya me di cuenta de eso por mí mismo, pero de todos modos, gracias por avisarme", dice Meridith. "Aunque me temo que será un poco difícil evitar la mirada del Supervisor la mayor parte del tiempo, considerando cuántos cristales tenemos en estos túneles. ¿Alguien más tiene alguna idea?"

              "Esto es más una limitación que una debilidad", dice Kate, "pero hasta donde hemos visto, el Supervisor no parece ser capaz de hacer mucho más que observar y comunicarse usando estos cristales. Normalmente, no debería poder atacarte a través de ellos. Aunque sí dijo que era capaz de acceder al nodo Magium, por lo que es posible que haya aprendido a usar mejor los cristales en los últimos días".
          - source: scene_text_2
            paragraph: 25
            text: |-
              "Sí, yo también tenía la misma sospecha, pero no estaba muy seguro", dice Meridith. "Se puede acceder al nodo simplemente vinculando su aura a él, por lo que no requeriría que tenga ninguna capacidad ofensiva. Probablemente no deberíamos descartar por completo la posibilidad de que pueda tener algún tipo de ataque oculto bajo la manga, pero por el momento asumiremos que no puede lanzar ningún hechizos mientras esté dentro de los cristales".

              "Creo que lo más importante a tener en cuenta al tratar con el Supervisor es nunca subestimarlo", dice Daren. "Le gusta actuar como un tonto muchas veces, pero es mucho más inteligente de lo que parece".

              "Sí, lo he notado", dice Meridith. "En el corto tiempo que ha estado aquí, de alguna manera logró obtener una audiencia con el líder de mi facción opuesta con solo decir unas pocas palabras, así que, naturalmente, planeo ser muy cauteloso con él en el futuro. Puedes estar seguro de que lo último que planeo hacer es subestimarlo".

              "Aunque entiendo que es importante estar preparado para cualquier cosa", dice Uverg, "¿has considerado la opción de una alianza abierta con el Supervisor? La información que podría compartir con nosotros podría resultar extremadamente valiosa..."

              "Este 'Supervisor' claramente ha estado enfadándome desde el principio, con la esperanza de ganarse la simpatía de la facción Heksol", dice Meridith. "Si tuviera alguna intención de mantener una relación pacífica conmigo, no se habría comportado así".
            condition: b3_ch11_path = 0 AND b3_ch11_reverse = 0
