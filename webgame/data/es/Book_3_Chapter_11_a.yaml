      - source: scene_text
        paragraph: 25
        text: |-
          "... ¿Qué estaban haciendo exactamente ustedes dos aquí?" Kate pregunta a Hadrik, mientras ve tres botellas de cerveza enana alineadas una al lado de la otra.

          "Oh, estábamos teniendo un pequeño concurso de bebida", dice Hadrik. "Le pedí a este buen tipo que ordenara estas botellas de acuerdo con sus precios, de mayor a menor, después de tomar solo un sorbo de cada una de ellas, y pasó mi prueba con gran éxito. ¿Te gustaría intentarlo? Resulta que tengo algunas botellas más aquí que me encantaría--"

          "Umm, no gracias", dice Kate. "Sólo tenía curiosidad, eso es todo."

          "Entonces, ¿qué es lo que te trae por aquí, 'señora' Meridith?" dice el guardia Lessathi, en tono desdeñoso. "Ha pasado algún tiempo desde que me sentí 'honrado' con su presencia".
      - source: scene_text_2
        paragraph: 19
