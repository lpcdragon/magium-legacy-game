  - name: b3_ch11a_reason
    routes:
      - condition: hearing >= 2
        texts:
          - source: scene_text
            paragraph: 22
            text: |-
              "En realidad, podría haber tenido aún más motivos para ir allí, si estuviera marcado".

              "¿Porqué es eso?" Diane me pregunta.

              "Bueno, él no tuvo exactamente la impresión más favorable de Meridith cuando salió furioso de la habitación", digo. "A mi modo de ver, es posible que en realidad esté ansioso por conversar con alguien a quien no le gusta Meridith tanto como a él".

              "Ese es un buen punto", dice Meridith. "Razón de más para que primero revisemos la ruta de la facción Heksol. Vámonos. La entrada del túnel no está mucho más adelante".

              A medida que nos acercamos al lugar donde el camino se divide en dos, de repente escucho la risa de Hadrik resonando en la distancia.

              "¡Jajajaja!" Hadrik dice. "Sabes, para ser un chico de la 'facción Heksol' no eres tan malo. ¡Toma, toma otro trago!"

              "Todavía te estoy vigilando, ya sabes", escucho otra voz, que supongo que es el Lessathi de la facción Heksol. "No creas que puedes engatusarme simplemente sirviéndome unos cuantos vasos de... oye, esta cerveza no sabe como la primera. ¿Tienes diferentes tipos de cerveza enana en estas botellas?"
          - source: scene_text_2
            paragraph: 17
            text: |-
              "¡Amigo mío, tienes buen gusto!" Hadrik dice. "Hay una diferencia muy sutil, pero esta cerveza en particular tiene una calidad superior a las demás. ¡Oye, esto me da una idea! Te daré tres botellas de cerveza enana para que pruebes, y si puedes identificar correctamente cuál es la más cara, ¡te dejaré quedarte con las tres, gratis! ¿Qué te parece?"

              "Adelante, enano", dice el Lessathi. "Si hay algo en lo que confío plenamente es en mi capacidad para reconocer el buen alcohol".

              "¡Ja!" Hadrik dice. "¡Esperaba que dijeras eso!"

              Mientras miro a mi alrededor, veo que nadie reacciona de ninguna manera, lo que significa que debo ser el único que pudo escuchar Hadrik, gracias a mi estadística de audición.

              De cualquier manera, sonó como si Hadrik de hecho fuera al área de la facción Heksol, tal como pensaba, así que al menos ahora sé que vamos en la dirección correcta.

              Seguimos caminando un rato hasta llegar a la bifurcación del camino, y luego nos dirigimos por el túnel de la derecha, que aparentemente parece conducir hacia el territorio de la facción Heksol, según las marcas en las paredes.

              Unos minutos más tarde, de repente escuchamos la fuerte risa de Hadrik, ya que parece haber terminado el concurso de bebida del que estaba hablando antes.

              "¡Me has vencido de manera justa!" Hadrik dice en voz alta. "¡Aquí está tu recompensa! ¡Sin duda te la has ganado!"
          - source: scene_3
            paragraph: 10
            text: |-
              "¡Tienes toda la razón, lo hice!" dice el guardia de la facción Heksol. "¿De verdad pensaste que servirme dos botellas de cerveza completamente idéntica junto con una tercera botella con una diferencia de sabor casi indistinguible me sacaría de mi juego de alguna manera? Te haré saber que solía ser amigo de un enano que bebía diez veces más que tú. Si todavía estuviera con nosotros hoy, te habría bebido debajo de la mesa en cuestión de minutos".

              "Estoy seguro de que lo habría hecho", dice Hadrik, mientras nos acercamos a él y ahora vemos que sostiene un vaso de cerveza en la mano, mientras lo levanta en alto. "Entonces brindemos en su honor. ¡Que siempre nos cuide desde arriba, con una botella de cerveza enana en la mano y una gran sonrisa de borracho en el rostro!"

              "Enano", dice el guardia, "esta puede ser la primera cosa respetable que has dicho desde que nos conocimos".

              Ahora los dos chocan sus vasos y luego toman un buen trago, antes de que finalmente se fijen en nosotros.

              "¡Bueno, si no es la propia gran jefa!" Hadrik dice, con una sonrisa. "¿Por qué estás ahí parado? Ven aquí. Siéntate con nosotros. ¡Toma una copa!"

              "Me temo que tendré que rechazar tu oferta", dice Meridith. "Tengo algunas reuniones importantes a las que asistir después de esto, lo que requerirá que permanezca sobrio".

              "¿Ella siempre es así?" Hadrik pregunta el guardia Lessathi, mientras le sirve otro vaso de cerveza.

              "Todo el tiempo", dice el guardia Lessathi, y luego toma un sorbo de su vaso lleno.
