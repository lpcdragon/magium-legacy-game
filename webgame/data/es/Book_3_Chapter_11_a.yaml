              "¡¿Lo hiciste?!" Meridith dice, con voz de pánico, mientras se vuelve hacia mí. "Pero... ¿por qué considerarías hacer tal cosa?... ¡Estaba casi seguro de que cualquier ser vivo, aparte de un Lessathi, debería saber instintivamente que no debía acercarse a algo así!"

              "Los instintos de supervivencia de Barry no funcionan", dice Kate. "¿Crees que habría intentado unirse a un torneo contra los magos más poderosos del mundo sin siquiera ser mago?"
