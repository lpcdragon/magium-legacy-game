          "Maldita sea, Hadrik", dice Daren. "¿Tienes idea de los problemas que pasamos mientras intentábamos encontrarte? ¡Un guardia del otro túnel no nos dejó salir y hasta quería enviarnos a su prisión!"
      - source: scene_3
        paragraph: 9
        text: |-
          "¡Oigan, no es mi culpa que ustedes parezcan tan sospechosos!" Hadrik dice, mientras toma otro sorbo de su vaso. "Quiero decir, mírame. Me encontré con un guardia también, y él no está tratando de arrestarme, ¿verdad?"

          "No me des ideas, enano", dice en tono de broma el guardia Lessathi, mientras él y Hadrik se ríen y luego chocan sus vasos antes de tomar otra copa.

          "Ugh..." dice Daren, en tono molesto.

          "Entonces, ¿qué es lo que te trae por aquí, 'señora' Meridith?" dice el guardia Lessathi, en tono desdeñoso, una vez que termina con su cerveza. "Ha pasado algún tiempo desde que me sentí 'honrado' con su presencia".

          "Ahórrame tu sarcasmo, Kleykarth", dice Meridith. "Sólo vine aquí porque me preocupaba que mi invitado enano pudiera pelear con alguien de tu facción. Sin embargo, parece que mi preocupación era injustificada".

          "Por lo que escuché, el enano habría tenido muchas más razones para pelear contigo que con nosotros, 'señora' Meridith", dice Kleykarth. "De hecho, tuvo bastantes palabras que decir sobre ti después de sus primeros vasos de cerveza. ¿Te gustaría escuchar algunas de ellas?"

          "Me interesaría bastante, sí..." dice Meridith, mientras le da a Hadrik una mirada superficial.

          "¡Ahora, eso no será necesario!" Hadrik dice, mientras pone una mano en el hombro del guardia Lessathi.

          "¡Jajaja!" Kleykarth se ríe. "Sólo estaba jugando contigo, enano. No hay necesidad de que entres en pánico. ¡Tus secretos están a salvo conmigo!"
