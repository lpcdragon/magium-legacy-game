        texts:
          - source: scene_text
            paragraph: 52
            text: |-
              Decido escuchar la advertencia de Meridith y no presionar el botón rojo. Después de unos segundos más de mirar la interminable biblioteca de información inalcanzable, creo que ya he tenido suficiente, así que presiono el botón verde nuevamente para cerrar mi conexión al Magium.

              "¿Bien?" Meridith dice, viendo que estoy extrañamente silencioso. "¿Cómo fue?"

              "Eh... estuvo bien", digo, en un tono poco entusiasta. "Tenía la esperanza de obtener al menos ALGUNA información concreta de esta experiencia, pero no he tenido suerte".

              "No te desanimes, Barry", dice Meridith. "Nuestros académicos a veces necesitan semanas o incluso meses para encontrar la información que necesitan en el nodo Magium. No hay nada de malo en no poder encontrar nada útil en menos de un minuto en el primer intento".

              "Supongo que sí", digo.

              "Entonces, ¿quién quiere ser el próximo?" Meridith pregunta.
          - source: scene_text_2
            paragraph: 37
            text: |-
              Después de mí, Kate fue quien se ofreció como voluntario, y luego Hadrik. Ambos parecían impresionados con lo que habían visto, pero por sus reacciones se podía ver fácilmente que, a diferencia de Daren y de mí, los dos no estaban tan interesados ​​en Magium. Meridith también invitó a Melindra a probar el conector Magium, pero ella lo rechazó cortésmente, ya que a pesar de sus recientes interacciones con Eiden, todavía lo consideraba su amigo, por lo que no quería tener nada que ver con el trato de Meridith para matarlo.

              El último en probar el dispositivo fue Flower. Justo cuando estaba a punto de presionar el botón verde, los ojos azules de Illuna de repente comenzaron a brillar, mientras tomaba el control del cuerpo.
          - source: scene_3
            paragraph: 26
            text: |-
              "Permíteme", dice Illuna, mientras presiona el botón rojo, y luego también algunos otros botones en rápida sucesión.

              Al ver lo que está haciendo, Meridith se cruza de brazos, dándole a Illuna una mirada de reproche, pero la deja terminar lo que quiere hacer, y solo comenta sus acciones una vez que viene a devolverle el dispositivo.

              "Has usado este tipo de dispositivo antes, ¿no?" Meridith pregunta a Illuna, mientras toma el conector Magium de sus manos.

              "Sí, lo hice", dice Illuna. "Sin embargo, nuestro viejo dispositivo se rompió hace un tiempo y ha sido bastante difícil conseguir uno nuevo desde entonces. Le agradezco su generosidad al prestarnos uno de los suyos".

              "De nada", dice Meridith. "Por supuesto, si hubiera sido consciente de que sabrías cómo usarlo, nunca te lo habría dado en primer lugar, pero supongo que ya lo sabías, considerando que nunca te molestaste en contarme este pequeño detalle... Entonces, ¿encontraste lo que buscabas, al menos?"

              "En realidad, encontré bastante más de lo que estaba buscando", dice Illuna. "Creo que este nuevo conocimiento adquirido será muy útil para ayudarme a desarrollar algunas técnicas en las que he estado trabajando durante los últimos días".
