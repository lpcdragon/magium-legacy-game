      - condition: b3_ch11_melindra = 0
        texts:
          - source: scene_text
            paragraph: 62
            text: |-
              "¿En serio?... ¿Así de simple?"

              "Así de simple", dice Melindra, mientras escuchamos a Flower comenzar a sollozar de fondo. "Mira, no soy tan bueno con las cosas sentimentales, ¿vale? No tengo idea de qué decir en estas situaciones, así que prefiero ser breve y directo. Además, no es como si nunca nos volviéramos a ver. Estoy seguro de que no será demasiado problema concertar una reunión una vez que todos hayamos terminado lo que nos propusimos hacer".

              "En realidad, es probable que nos volvamos a reunir antes", le dice Kate a Melindra. "Aún existe el ritual del Dios del Tiempo, ¿recuerdas?"

              "Oh, claro", dice Melindra. "Casi me olvido de eso."

              "¿Estás seguro de que no hay manera de que podamos ayudarte a salvar a tu hermano de... dondequiera que esté?" Daren dice. "Tal vez si nos dijeras qué le pasó, podríamos..."
          - source: scene_text_2
            paragraph: 43
            text: |-
              "No, no hay nada que puedas hacer para ayudar, aparte de lo que ya has hecho", dice Melindra. "Sé que he sido un poco esquivo sobre lo que le pasó a mi hermano, pero una de las principales razones de esto es que no estoy del todo seguro de lo que ha sido de él, y prefiero pasar mi tiempo tratando de encontrarlo que pensando en los peores escenarios. Todo lo que puedo decirles con certeza es que hace un tiempo se encontró con algunas personas muy turbias, quienes lo engañaron diciendo que tenían las mejores intenciones, y nunca he vuelto a saber de él desde entonces. Afortunadamente, todavía tengo algunas pistas eso podría ayudarme a llegar hasta él, y con el objeto que recuperé del difunto rey de Ollendor, espero que no me lleve más de unos pocos días llegar hasta él".

              "Pero entonces, ¿no sería más rápido si más de nosotros lo buscáramos al mismo tiempo?" Kate le pregunta.

              "Puedo viajar mucho más rápido cuando estoy solo", dice Melindra. "Puedo volar, ¿recuerdas? Mira, no hay necesidad de que ninguno de ustedes se preocupe por mí o mi hermano. Ya tienen suficiente en sus platos. Les prometo que les haré saber a todos tan pronto como lo encuentre".

              "Bien", dice Kate. "Pero será mejor que mantengas a tu transceptor cerca de ti en todo momento, porque planeo mantenerme en contacto contigo, te guste o no".

              "De hecho, eso me gustaría, icey", dice Melindra con una sonrisa. "Me gustaría mucho".
          - source: scene_3
            paragraph: 32
            text: |-
              "¿Tú... realmente tienes que irte?" Flower pregunta, con voz temblorosa, mientras todavía intenta con todas sus fuerzas evitar llorar. "¿No puedes al menos quedarte con nosotros un poco más? Había mucho más de lo que quería hablarte... ¡Mucho más que podríamos haber hecho juntos!"

              "Lo siento, Flower, pero realmente no puedo darme el lujo de retrasar esto más", dice Melindra. "Una parte de mí realmente desearía haberte llevado conmigo, pero tampoco quiero separarte de tus amigos. De todas las personas aquí, definitivamente eres la que más extrañaré".

              "¿Puedo al menos... puedo llamarte a menudo?" Flower dice. "¿Mientras no estás?"

              "¡Tan a menudo como quieras!" Melindra dice. "Y como dijo Kate, todavía nos volveremos a encontrar durante los rituales, así que estoy seguro de que nos veremos muy pronto".

              "Está bien..." dice Flower, mientras lentamente deja de sollozar. "Puedo vivir con eso".

              "Bueno..." dice Melindra, mientras nos mira por última vez a cada uno de nosotros. "Supongo que esto es todo, entonces."

              "Sí", dice Hadrik. "Esto es todo".

              "No es para arruinar el ambiente ni nada", dice Daren, "pero te recomendaría que te muevas lentamente cuando te alejes de aquí, como precaución adicional. Normalmente, el juramento de encantador que has tomado no debería requerir que hagas nada más, ahora que estamos en posesión del detector de piñas, pero nunca está de más ser demasiado cuidadoso".
