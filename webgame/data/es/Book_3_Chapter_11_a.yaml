  - name: b3_ch11a_connector
    texts:
      - source: scene_text
        paragraph: 49
        text: |-
          "¡Oye, nada mal, Barry!" Melindra me lo dice. "No son tan buenos como mis corrientes de aire, pero parecen hacer el trabajo".

          "Apenas", digo, mientras todavía me tambaleo de un lado al otro del pasillo. "Solía ​​tener un control mucho mejor sobre estas corrientes durante el modo de emergencia. Voy a necesitar trabajar mucho en ellas si alguna vez quiero usarlas en una batalla real en su nivel actual".

          "¿Estás haciendo esto simplemente utilizando el primer nivel de conocimiento mágico y poder mágico?" Meridith me pregunta, sorprendido. "Esto... supera con creces mis expectativas. No pensé que hubiera ningún hechizos útil antes de obtener tu segundo nivel en tus estadísticas".

          "Oh, hay muchos hechizos útiles aquí, créeme", le digo a Meridith. "Claro, no son tan buenos individualmente, pero hay algunas combinaciones bastante letales si sabes lo que estás haciendo. Acabo de empezar a hojear la lista de hechizos disponibles y ya estoy sorprendido por su nivel de variedad. ¡Esto me mantendrá ocupado durante días!"

          "Entonces supongo que tomé la decisión correcta al desbloquear estas estadísticas para ti", dice Meridith. "Espero que encuentres una manera de liberar todo su potencial".

          "Estoy seguro de que lo haré", digo.

          "Ahora, ¿puedes bajar desde allí?" Meridith dice. "Preferiría que todos entremos a la sala del nodo Magium al mismo tiempo".

          "Oh, sí, por supuesto", digo, y luego me dejo caer al suelo de una manera muy poco elegante.
      - source: scene_text_2
        paragraph: 34
        text: |-
          "Espléndido", dice Meridith, mientras ahora golpea la pared frente a ella con su varita, para abrir nuestro camino a la sala de nodos Magium.

          Todos regresamos al interior de la habitación con la gran esfera azul y, a medida que nos acercamos a ella, Meridith saca un pequeño dispositivo con muchos botones de varios colores, que se parece un poco en diseño a mi potenciador de estadísticas.

          "Esto es lo que llamamos un 'conector Magium'", dice Meridith, mientras nos muestra el dispositivo a todos. "Lo usarás para interactuar con el nodo. Como solo eres principiante, recomiendo simplemente presionar el botón verde por ahora. El botón rojo solo debe ser usado por personas que hayan interactuado con Magium al menos unas cuantas veces antes, ya que puede desorientar a un principiante. El resto de los botones tienen algunos propósitos más específicos que no me voy a molestar en explicar ahora, ya que realmente no tenemos tiempo. De todos modos, ¿quién quiere ir primero?"

          "¡A mí!" Daren dice rápidamente, mientras da un paso al frente. "Quiero intentarlo".

          "Muy bien", dice Meridith, mientras le entrega el dispositivo que estaba sosteniendo. "Solo asegúrese de no hacer esto durante más de un minuto. Incluso con el dispositivo actuando como un amortiguador entre usted y el Magium, sigue siendo riesgoso dedicar más tiempo que ese para alguien que nunca ha hecho esto antes".

          "¿Qué pasa con el fragmento Magium?" Illuna pregunta, de repente.
      - source: scene_3
        paragraph: 23
        text: |-
          "Lo siento, ¿qué?" Meridith dice.

          "El 'Creador' con el que hablamos cuando llegamos aquí por primera vez". Illuna dice. "¿Está todavía en esta habitación, mirándonos?"

          "Oh, no, el Creador no siempre está aquí", dice Meridith. "Él sólo nos visita de vez en cuando, para compartir su sabiduría. ¿Por qué querías hablar con él otra vez?"

          "De hecho, todo lo contrario", dice Illuna. "¿Escuchaste eso, Arraka? El fragmento Magium no está aquí. Puedes dejar de inquietarte ahora".

          "No tengo idea de qué estás hablando", dice Arraka. "¿Cómo podría siquiera estar 'inquieto' dentro de un amuleto sin ningún cuerpo del que hablar?"

          "Tu aura se volvía cada vez más inquieta a medida que nos acercábamos a la sala del nodo Magium", dice Illuna. "Para ser honesto, se estaba volviendo un poco molesto".

          "Oh, ¿entonces ahora eres un experto en auras?" Arraka dice. "¿Quizás también quieras darme algunos consejos, mientras estamos en ello?"

          "Lo que tú digas, Arraka", le dice Iluna.
