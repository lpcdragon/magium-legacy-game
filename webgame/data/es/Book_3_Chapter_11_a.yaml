  - name: b3_ch11a_heksol
    routes:
      - condition: b3_ch11_puzzle4 = 1
        texts:
          - source: scene_text
            paragraph: 19
            text: |-
              Pongo mi palma sobre la piedra, como me pidió Flower, y luego recibo la misma pieza del rompecabezas y el mismo mensaje que ella. Poco después, la piedra gris con la escritura vuelve por sí sola al interior de la pared, dando paso a que la roca inicial vuelva a ocupar su lugar.

              "¿Fue eso?" Meridith nos pregunta. "¿Estás listo para partir ahora?"

              "Sí, perdón por el retraso", digo. "Hemos terminado aquí".

              "Entonces sigamos nuestro camino", dice Meridith. "Con un poco de suerte, tal vez Hadrik fue detenido por la persona que custodiaba el túnel y en realidad no logró ingresar al territorio de la facción Heksol".

              Una vez que dejamos atrás a la guardia Lessathi, no nos lleva mucho tiempo llegar a la entrada del túnel, y luego atravesar el otro corredor, para dirigirnos hacia el cuartel principal de la facción contraria de Meridith.

              Unos minutos más tarde, de repente escuchamos la fuerte risa de Hadrik, mientras parece estar teniendo una animada conversación con alguien que supongo que será un guardia Lessathi de la facción Heksol.

              "Tengo que decir que parece que tu amigo enano y yo realmente podríamos habernos llevado bien", dice Hadrik. "Es una lástima que no pude conocerlo mientras aún estaba vivo".
          - source: scene_text_2
            paragraph: 16
            text: |-
              "Sí, al menos tuvo una muerte digna de un enano", dice el guardia de la facción Heksol. "Se peleó con las personas equivocadas mientras estaba completamente borracho, y lo apuñalaron en el pecho. Por la forma en que lo escuché, logró llevarse a cuatro de ellos con él también, antes de graznar. Siempre solía decirme que una pelea de borrachos sería la mejor manera posible de dejar este mundo, así que supongo que finalmente cumplió su deseo".

              "Oye, ¿podrías mirar eso..." dice Hadrik, con una sonrisa, mientras doblamos la esquina y tenemos una línea de visión directa hacia el enano y su nuevo amigo. "¡Si no es la gran jefa! Bueno, ¿para qué estás ahí parada? Ven aquí. Siéntate con nosotros. ¡Toma una copa!"

              Echando un buen vistazo a Hadrik y al guardia Lessathi, veo que están rodeados de botellas de cerveza enanas, de las cuales algunas ya han sido vaciadas. Parece que llevan bastante tiempo bebiendo.

              "Me temo que tendré que rechazar tu oferta", dice Meridith. "Tengo algunas reuniones importantes a las que asistir después de esto, lo que requerirá que permanezca sobrio".

              "¿Ella siempre es así?" Hadrik pregunta el guardia Lessathi, mientras le sirve otro vaso de cerveza.

              "Todo el tiempo", dice el guardia Lessathi, y luego toma un sorbo de su vaso lleno.

              "Maldita sea, Hadrik", dice Daren. "¿Tienes idea de los problemas que pasamos mientras intentábamos encontrarte? ¡Un guardia del otro túnel no nos dejó salir y hasta quería enviarnos a su prisión!"
          - source: scene_3
            paragraph: 9
            text: |-
              "¡Oigan, no es mi culpa que ustedes parezcan tan sospechosos!" Hadrik dice, mientras toma otro sorbo de su vaso. "Quiero decir, mírame. Me encontré con un guardia también, y él no está tratando de arrestarme, ¿verdad?"

              "No me des ideas, enano", dice en tono de broma el guardia Lessathi, mientras él y Hadrik se ríen y luego chocan sus vasos antes de tomar otra copa.

              "Ugh..." dice Daren, en tono molesto.

              "Entonces, ¿qué es lo que te trae por aquí, 'señora' Meridith?" dice el guardia Lessathi, en tono desdeñoso, una vez que termina con su cerveza. "Ha pasado algún tiempo desde que me sentí 'honrado' con su presencia".

              "Ahórrame tu sarcasmo, Kleykarth", dice Meridith. "Sólo vine aquí porque me preocupaba que mi invitado enano pudiera pelear con alguien de tu facción. Sin embargo, parece que mi preocupación era injustificada".

              "Por lo que escuché, el enano habría tenido muchas más razones para pelear contigo que con nosotros, 'señora' Meridith", dice Kleykarth. "De hecho, tuvo bastantes palabras que decir sobre ti después de sus primeros vasos de cerveza. ¿Te gustaría escuchar algunas de ellas?"

              "Me interesaría bastante, sí..." dice Meridith, mientras le da a Hadrik una mirada superficial.

              "¡Ahora, eso no será necesario!" Hadrik dice, mientras pone una mano en el hombro del guardia Lessathi.

              "¡Jajaja!" Kleykarth se ríe. "Sólo estaba jugando contigo, enano. No hay necesidad de que entres en pánico. ¡Tus secretos están a salvo conmigo!"
        effects:
          - set:
              ac_b3_ch11_fourth: 1
            achievement:
              id: ac_b3_ch11_fourth
              title: Cuarta pieza del rompecabezas
        choices:
