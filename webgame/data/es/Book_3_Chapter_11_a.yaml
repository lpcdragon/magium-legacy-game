        texts:
          - source: scene_text
            paragraph: 41
            text: |-
              "¿Es por eso que su sociedad prohíbe el matrimonio entre humanos y Lessathi?"

              "Sí, aunque no siempre ha sido así", afirma Uverg. "Entre los muchos miles de años de historia Lessathi, ha habido períodos en los que los humanos y Lessathi vivieron juntos en paz y armonía, y durante esos tiempos, las relaciones entre humanos y Lessathi no eran tan problemáticas como lo son hoy. Creo que esta nueva dirección de volver a las 'viejas costumbres' comenzó poco después del tranquilo invierno, cuando algunos líderes más radicales comenzaron a surgir. Lady Meridith es probablemente una de las primeras líderes que hemos tenido desde entonces que está tratando activamente de revertir esto. tendencia, pero aún está por verse si finalmente tendrá éxito o no en este esfuerzo".

              "Dijiste antes que conocías un evento similar a este extraño despertar de los cristales que estamos experimentando en este momento", dice Meridith. "¿Esto estuvo relacionado de alguna manera con las transformaciones que esos humanos han experimentado, que los llevaron a convertirse en Lessathi?"
          - source: scene_text_2
            paragraph: 30
            text: |-
              "Creo que sí", dice Uverg. "Por supuesto, sería prácticamente imposible hacer un análisis adecuado después de que haya pasado todo este tiempo, pero lógicamente hablando, uno normalmente asumiría que fue la exposición prolongada a los cristales despiertos lo que desencadenó estos cambios drásticos en las auras de esas personas. Por el conocimiento que me ha dado el Magium, parece que los cristales despertaron de su letargo después de algún tipo de explosión subterránea que fue provocada por accidente. Creo que les llevó más de cien años a los cristales volver a la normalidad desde entonces. Si esto es cierto, entonces sólo puedo esperar que el evento que estamos experimentando ahora no termine cambiando nuestras auras aún más".

              "Podemos preocuparnos de eso más tarde", dice Meridith. "Dijiste que se necesitaron generaciones enteras para que estos cristales tuvieran algún efecto notable en nuestros antepasados, por lo que deberíamos tener tiempo suficiente para resolver las cosas".

              "Supongo que es cierto", dice Uverg.

              "Lo que más me preocupa es si estos cristales podrían tener algún efecto inmediato del que no somos conscientes", dice Meridith. "¿Estos recuerdos tuyos del pasado lejano te dicen algo más que pueda ser útil para nosotros? Por ejemplo, ¿sabrías por casualidad alguna manera de hacer que los cristales vuelvan a dormir?"

              "Me temo que no", dice Uverg. "Todo lo que sé es que cuando nuestros antepasados ​​lograron finalmente escapar de estas cavernas subterráneas, los cristales ya estaban dormidos. No creo que nuestros antepasados ​​hicieran nada especial para que los cristales dejaran de vibrar. Supongo que después de un tiempo, simplemente se detuvieron por sí solos".
          - source: scene_3
            paragraph: 19
            text: |-
              "Hmm..." dice Meridith. "No estoy seguro de cuán útil resultará esta información, pero al menos es un comienzo. Gracias por tus conocimientos, Uverg. Como siempre, agradecemos mucho tu ayuda".

              "Es un placer, Señora Meridith", dice Uverg, mientras se inclina nuevamente.

              "Tengo curiosidad..." dice Diane. "¿Cómo reaccionaron los humanos en la superficie cuando los Lessathi del subsuelo finalmente regresaron al exterior? ¿Intentaron enviarlos de regreso nuevamente?"

              "En realidad, todo lo contrario", afirma Uverg.  "Los recibieron con los brazos abiertos. Verás, habían pasado cientos de años desde que los Lessathi quedaron varados dentro de esas cuevas, por lo que en ese momento nadie en la superficie sabía quiénes eran. Por otro lado, los Lessathi nunca lo olvidaron. El odio por los humanos se transmitió de generación en generación, y cada padre se aseguró de recordar constantemente a sus descendientes que los humanos que vivían arriba eran culpables de sus malas condiciones de vida. Sin embargo, los Lessathi de antaño eran un pueblo paciente, por lo que esperaron el momento oportuno. mintió a los habitantes de la superficie, diciéndoles que no les guardaban rencor por las fechorías de sus antepasados, y decidieron coexistir pacíficamente con los humanos, mientras esperaban el momento oportuno para vengarse.

              "¿Y qué fue exactamente esta 'venganza'?" Daren pregunta.
        choices:
