            paragraph: 31
            text: |-
              "Siempre me ha resultado difícil saber si habla en serio o no en estas situaciones".

              "No creo que hable en serio", dice Kate. "Nunca lo escuché usar ninguna de esas frases suyas en la forma en que fueron pensadas originalmente. De hecho, siempre parece hacer todo lo posible para usarlas en las conversaciones de tal manera que frustre a la gente tanto como sea posible. Creo que en realidad podría estar disfrutando esto".

              "Sí, esa es la impresión que tuve también", dice Meridith. "Siempre supuse que las máquinas debían ser frías, calculadas y sin sentido del humor, pero supongo que me equivoqué. Al menos, este 'Supervisor' claramente parece estar familiarizado con el concepto de sarcasmo."

