            paragraph: 30
            text: |-
              "En realidad, creo que no puede evitar hablar así".

              "¿Estás diciendo que no tiene ningún control sobre sus patrones de habla, porque así es como fue diseñado originalmente para interactuar con la gente?" Meridith dice. "Me resulta un poco difícil de creer. Él es claramente lo suficientemente inteligente como para saber cuándo sería apropiado usar esas frases predeterminadas suyas, así que no creo que esto haya sido un error. Obviamente está tratando de provocarme".

              "Yo también lo creo", dice Kate. "El hecho de que siempre use esas frases suyas en situaciones equivocadas hace que sea muy probable que haya desarrollado un sentido del humor retorcido a lo largo de los años, y que lo esté haciendo todo a propósito para frustrar a la gente".

