      - condition: b3_ch11_red = 1
        texts:
          - source: scene_text
            paragraph: 51
            text: |-
              Decido ignorar el consejo de Meridith de antes y presionar el botón rojo.

              "¡No, no el botón rojo!" Meridith dice en voz alta, cuando ve lo que estoy haciendo. "¡No estás listo!"

              La sensación de calma y paz que tenía antes ha desaparecido por completo. Ahora me siento como si estuviera atrapado dentro de la corriente de un río muy fuerte, sin apenas poder mantener mi cabeza fuera del agua. Hay tanta información inundando mi mente en este momento que es simplemente imposible entender nada.

              Meridith tenía razón. Quizás esto sea demasiado para mí. Tal vez debería presionar el botón rojo nuevamente y dejarlo todo.

              No, no puedo simplemente irme de este lugar con las manos vacías. Estoy seguro de que si me concentro mucho, al menos puedo sacar una buena información de esto. Sólo necesito pensar en algo concreto.  Algo que me resulta fácil de aprender y útil a corto plazo. ¿Qué podría ser eso?

              Al darme cuenta de que se me está acabando el tiempo, me concentro en lo primero que me viene a la mente: mis corrientes de aire. Luego recojo la información en cuestión de segundos y presiono el botón rojo nuevamente, cerrando mi conexión al nodo Magium.

              "Barry, ¿estás bien?" Flower me pregunta, con una mirada preocupada en su rostro.

              Ahora que lo menciona, mi cuerpo parece temblar violentamente, pero no lo noté hasta ahora. Hasta hace un momento, el Magium era todo lo que podía pensar.
          - source: scene_text_2
            paragraph: 36
            text: |-
              "Sí, estoy bien", digo, mientras dejo de temblar. "Uf. Ese fue un gran viaje."

              "Debería haber sabido que las advertencias serían inútiles cuando se trata de ti..." me dice Meridith, mientras sacude la cabeza con desaprobación. "Bueno, al menos espero que hayas aprendido algo de esto".

              "¡De hecho, aprendí algo!" Digo, y luego activo mis corrientes de aire, que ahora me ayudan a mantenerme a flote sobre el suelo sin más problemas de estabilidad, gracias al conocimiento que obtuve del Magium. "¡Mira, mis corrientes de aire funcionan correctamente ahora!"

              "Estaba pensando más en que aprendas a escuchar a los demás cuando te advierten que no hagas algo estúpido, pero supongo que esto será suficiente, por ahora", dice Meridith. "Está bien, ¿quién será el próximo?"

              Después de mí, Kate fue quien se ofreció como voluntario, y luego Hadrik. Ambos parecían impresionados con lo que habían visto, pero por sus reacciones se podía ver fácilmente que, a diferencia de Daren y de mí, los dos no estaban tan interesados ​​en Magium. Meridith también invitó a Melindra a probar el conector Magium, pero ella lo rechazó cortésmente, ya que a pesar de sus recientes interacciones con Eiden, todavía lo consideraba su amigo, por lo que no quería tener nada que ver con el trato de Meridith para matarlo.

              El último en probar el dispositivo fue Flower. Justo cuando estaba a punto de presionar el botón verde, los ojos azules de Illuna de repente comenzaron a brillar, mientras tomaba el control del cuerpo.
