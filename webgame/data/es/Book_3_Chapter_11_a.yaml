  - name: b3_ch11a_declaration
    texts:
      - source: scene_text
        paragraph: 60
        text: |-
          "Es posible", dice Meridith. "Aunque realmente no veo ninguna razón por la cual usted estaría dispuesto a contactarlos. Dudo mucho que tenga relaciones amistosas con alguno de ellos".

          "Fyron es nuestro amigo, más o menos", digo. "¿Verdad, Illuna?"

          "...No según la definición que la mayoría de la gente tiene de la palabra 'amigo', pero claro, puedes llamarlo así si te hace sentir mejor", dice Illuna.

          "Bueno, al menos sabemos que no se convertirá en nuestro enemigo", digo.

          "No, a menos que le beneficie, no", me dice Illuna.

          "Correcto", digo.

          "Entonces", dice Daren, con voz pensativa, "este 'Galamir' es tanto el lugar donde todos los participantes del torneo deben reunirse después de completar su primer objetivo, como el lugar donde llevarán a cabo las negociaciones relativas a una guerra que involucra a todo el continente. De alguna manera, dudo que esto sea una coincidencia. ¿Es Galamir la capital de Varathia por casualidad?"
      - source: scene_text_2
        paragraph: 41
        text: |-
          "No, no es la capital, pero tienes razón al suponer que no es un reino cualquiera", dice Meridith. "De todos los monarcas de Varathia, el rey de Galamir es por lejos el que tiene mayor influencia sobre los otros gobernantes de este continente. Ya sea por chantaje, por manipulación sutil o simplemente a través de la diplomacia, este rey en particular ha logrado poner a muchos de los otros reinos bajo su control, a pesar de que son oficialmente independientes. En ese sentido, debes tener mucho cuidado con cómo te comportas mientras estás en Galamir. Tuviste suerte de que el último noble que mataste fuera de un reino que a nadie le importaba. Pero si le hicieras daño a alguno de los nobles de Galamir, casi seguramente serías expulsado del torneo y teletransportado fuera de este continente en el siguiente minuto, y no creo que ninguno de nosotros quisiera eso".

          "Ya veo..." dice Daren. "Gracias por la advertencia."

          "No estoy seguro de si debería molestarme en preguntar en este momento", dice Meridith, "pero ¿es seguro asumir que Eiden fue quien te dio la capacidad de dañar a los lugareños de Varathia?"

          "Sí", le respondo. "Lo hizo justo después de que conocimos al conde de Ollendor en Thilias".
      - source: scene_3
        paragraph: 30
        text: |-
          "Por supuesto que sí..." dice Meridith, en tono exhausto, mientras ahora abre otro túnel oculto con la ayuda de su varita.

          "Hablando de Eiden", digo, mientras entramos al pasillo, "nunca nos dijiste qué significaba su mensaje para ti. Hemos estado tratando de resolverlo por nosotros mismos durante algún tiempo, pero realmente no llegamos a una conclusión definitiva".

          "¿En realidad?" Meridith dice. "Pensé que habría sido bastante obvio para cualquiera que lo hubiera escuchado".

          Mientras hablaba, Meridith abrió un compartimento secreto que estaba escondido en la pared a nuestra izquierda, revelando una delgada tableta metálica en su interior.

          "Es una declaración de guerra", dice, de manera casual, mientras toma el objeto de dentro de la pared.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch11a_offered
  - name: b3_ch11a_offered
    texts:
      - source: scene_text
        paragraph: 61
        text: |-
          Meridith luego usa su varita para cerrar el compartimento y le entrega la tableta a Kate.

          "Aquí está tu detector de piñas, como te prometí", dice Meridith. "Si tiene alguna pregunta sobre cómo operarlo, puede preguntarle a Diane, pero yo diría que es bastante intuitivo, por lo que no creo que deba encontrar ningún problema".

          "Gracias", dice Kate, mientras guarda la tableta en su mochila.

          "Y ahora que he cumplido mi parte del trato, creo que finalmente es hora de separarnos", dice Meridith. "Me hubiera gustado hablar más con usted, pero desafortunadamente tengo algunos asuntos urgentes que atender, que pueden involucrar o no al Supervisor".

          "Bueno, en ese caso, estamos agradecidos por tu hospitalidad y... por todo lo que nos has mostrado", dice Daren. "Ciertamente nos has dado mucho en qué pensar".

          "Espero que usted también esté pensando en el trato que le he ofrecido", dice Meridith. "Sería una pena si todo este tiempo que he pasado tratando de convencerte fuera completamente en vano".
      - source: scene_text_2
        paragraph: 42
        text: |-
          "Por supuesto", dice Daren. "Como hemos acordado, tendrás tu respuesta cuando llegue el momento".

          "Eso es todo lo que quería escuchar", dice Meridith. "En ese caso, les deseo a todos buena suerte en su viaje. Ah, y cuiden bien de Diane por mí, ¿quieren? Ella es muy importante para mí".

          "Lo haremos", dice Kate.

          "Adiós", nos dice Meridith, y luego se da vuelta para irse.

          "Nos vemos", le dice Diane a Meridith, mientras entra a un túnel oculto y desaparece de nuestra vista.

          "Está bien, entonces ya no hay corredores secretos entre aquí y el teletransportador", dice Diane, mientras se vuelve hacia nosotros. "Sólo quédate cerca de mí y te sacaré de aquí".

          Aproximadamente un minuto después finalmente llegamos a la sala de teletransporte, donde nos estaba esperando el ingeniero de teletransportación Lessathi de la facción de Heksol. Cuando nos ve llegar, frunce el ceño, mientras mira largamente el cetro en la mano de Kate, pero decide no hacer más comentarios al respecto y dirigirse a Diane en su lugar.

          "¿Adonde?" —le pregunta Lessathi con sencillez.
      - source: scene_3
        paragraph: 31
        text: |-
          "El mismo lugar desde donde nos teletransportaste inicialmente", dice Diane. "Encontraremos nuestro camino desde allí".

          "Como desees", dice Lessathi, y luego activa el teletransportador.

          Como siempre, somos envueltos por una luz blanca mientras vibramos fuertemente, y luego nos encontramos todos en la superficie, en el lugar exacto de donde llegamos. Antes de que alguien tenga la oportunidad de hablar, Melindra lanza sus corrientes de aire hechizo sobre sí misma y luego se da vuelta para poder mirarnos a todos.

          "Bueno, chicos, supongo que esto es un adiós", dice Melindra, de la nada.
