  - name: b3_ch11a_adventure
    texts:
      - source: scene_text
        paragraph: 45
        text: |-
          "Por supuesto, por supuesto", dice Uverg. "En ese caso, regresaré para terminar mi informe escrito. Lo dejaré en su escritorio tan pronto como pueda".

          "Por favor, hazlo", dice Meridith.

          "Adiós invitados de Meridith", nos dice Uverg. "¡Ha sido un placer!"

          "¡Sí, encantado de conocerte también!" Hadrik dice, saludando a Uverg mientras se va.

          "Compañero extraño", le dice Hadrik a Meridith, una vez que Uverg ya no está lo suficientemente cerca para escucharlo. "Pero creo que me agrada."

          "Sí", dice Meridith, mientras observa a Uverg alejarse, en la distancia. "Siento lo mismo".

          Luego de unos segundos de pausa, Meridith se gira hacia el resto de nosotros, para finalmente poder iniciar la conversación privada que estuvo intentando tener todo este tiempo.

          "Ahora, entonces..." dice Meridith. "Es hora de decirles por qué los llamé a todos aquí por segunda vez. La verdad es que después de una discusión con Barry y Kate, llegué a la conclusión de que el trato original que les ofrecí no era muy justo para ustedes. Como resultado, se me ocurrió un trato mejor para ustedes, que creo que incluso a Hadrik le podría gustar. Permítanme darles los detalles".
      - source: scene_text_2
        paragraph: 32
        text: |-
          Durante los siguientes minutos, Meridith les cuenta a Hadrik y a los demás sobre el trato que nos ofreció a mí y a Kate mientras todavía estábamos en la sala de reuniones. Durante todo este tiempo, Hadrik no ha hecho más que escuchar en silencio, con una expresión de total incredulidad en su rostro. Una vez que Meridith terminó, Hadrik y los demás no dijeron nada por un rato, como si todavía estuvieran esperando que ella continuara. Al darse cuenta de que Meridith no tiene nada más que decir, Hadrik finalmente rompe el silencio y dice lo que todos los demás estaban pensando.

          "¡¿Eso es todo?!" dice, en voz alta. "¿Todo lo que quieres de nosotros es seguir participando en el torneo y nos dejarás usar el nodo gratis? ¿Y ni siquiera necesitamos decidir ahora si queremos pelear contra Eiden o no? Sí, no me lo creo. Algo huele mal aquí".

          "Como ya dije, solo tendrás acceso a Magium si nuestro plan para matar a Eiden tiene éxito sin tu intervención", dice Meridith. "De lo contrario, tendréis que matarlo vosotros mismos si queréis utilizar el nodo".

          "Sí, ¡pero eso significa que en este caso nos lo darías gratis!" Hadrik dice. "¿Esperas que crea que el Magium es de tan poca importancia para ti que simplemente se lo entregas a todos los que conoces? Ya te dije que no planeo ayudar a matar a Eiden mientras esté debilitado, porque sería deshonroso. Esto significa que no tienes nada que ganar de mí. ¿Estás diciendo que todavía no tendrías ningún problema en darme acceso al Magium en estas condiciones?"
      - source: scene_3
        paragraph: 21
        text: |-
          "En realidad, tengo algo que ganar contigo", dice Meridith. "Mientras sigas viajando con tus amigos durante el resto del torneo, los protegerás del peligro, y hay muchas posibilidades de que al menos algunos de ellos acepten ayudarnos a matar a Eiden para el final del torneo. En cualquier caso, no creo que entiendas lo importante que es este objetivo para nosotros. Matar a Eiden ha sido el deseo de nuestra gente durante seiscientos años. Sería un tonto si no usara todos los medios a mi disposición, cuando He estado muy cerca de lograr finalmente los sueños de nuestros antepasados".

          "Hmm..." dice Hadrik. "Bueno, con trato o sin trato, todavía planeo seguir participando en el torneo, incluso si el premio es falso, ya que vine aquí por la aventura, no por el Magium. Si quieres darme acceso a tu nodo solo por hacer lo que ya iba a hacer, entonces claro, ¿por qué no? ¿Qué tengo que perder?"

          "Me alegra oírte decir eso", dice Meridith. "¿Es seguro asumir que todos los demás también están de acuerdo con Hadrik?"

          "Claro, supongo", dice Daren, mientras Illuna también asiente con la cabeza en el fondo. "Mientras no nos hagas prometer nada sobre Eiden, no tengo ningún problema con el resto de tu trato. Estoy bastante seguro de que el resto de nosotros también sentimos lo mismo".
