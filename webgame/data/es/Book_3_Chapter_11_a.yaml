          - source: scene_3
            paragraph: 16
            text: |-
              "Si bien eso es cierto", dice Uverg, "también debes recordar que fuiste el primero en provocarlo, al declarar abiertamente que no le permitirías acceder al nodo Magium. Esto le dio al Supervisor la única opción más que verte como su enemigo directo y, en su lugar, tratar de aliarse con tus adversarios. Si mostraras más indulgencia hacia él, entonces tal vez él..."

              "No", dice Meridith, simplemente. "El momento de las negociaciones ya pasó. No te prohibiré interactuar con el Supervisor, ya que parece haberse interesado en ti, pero en lo que a mí respecta, el Supervisor es un enemigo potencial que se ha infiltrado en nuestra base, y lo trataré como tal hasta que haya una fuerte razón para creer lo contrario".

              "Como desee, Señora Meridith", dice Uverg, y luego hace una cortés reverencia.

              "De todos modos, creo que ya hemos hablado bastante del tema del Supervisor", dice Meridith. "Tenemos asuntos más urgentes que atender. Hadrik, entiendo que usted está guardando cierto resentimiento hacia mí en este momento, pero hay algo importante que debo discutir con su grupo, y necesito que todos ustedes estén ahí, para que puedan darme sus opiniones. ¿Sería eso aceptable para ustedes?"

              "Está bien, está bien", dice Hadrik, mientras se levanta del suelo y lentamente pone sus botellas en su mochila. "Supongo que ya me he desahogado lo suficiente. Escuchemos lo que tienes que decir".

              "Bien", dice Meridith. "Sígueme."
