            paragraph: 39
            text: |-
              "Señora Meridith, había algo que necesitaba discutir con usted también", dice Uverg. "¿Puedo ir contigo?"

              "¿Esto no puede esperar unas horas más?" Meridith dice. "Preferiría tener mi conversación con ellos en privado".

              "Se trata del análisis de los cristales azules que usted me pidió que hiciera hace unos días", dice Uverg. "Pensé que quizás querrías la respuesta más temprano que tarde".

              "Hmm..." dice Meridith. "Muy bien. En ese caso, podrás acompañarnos por un rato, hasta que termines de darme tu informe, y luego regresarás a tus habitaciones. ¿Entendido?"

              "Por supuesto", dice Uverg.

              "Entonces, dirijámonos hacia los túneles del nodo Magium", dice Meridith. "Tendremos nuestra conversación en el camino".

              "Nos vemos, Kleykarth", dice Hadrik, mientras regresamos por donde vinimos.

              "Sí", dice Kleykarth, mientras extiende un vaso de cerveza hacia Hadrik, sin levantarse del suelo. "Hasta luego, enano."

              "Entonces..." le dice Hadrik a Meridith, mientras nos alejamos de su amigo borracho. "¿Realmente mataste a ese tipo Heksol como dijo Kleykarth? ¡Vamos, sé honesto!"

              "Si estás tratando de irritarme, entonces debes saber que no está funcionando", le dice Meridith.
          - source: scene_text_2
            paragraph: 27
            text: |-
              "Oh, sí", dice Hadrik, mientras ahora se vuelve hacia el resto de nosotros. "Ella lo mató totalmente."

              Caminamos juntos durante unos minutos, hasta llegar de nuevo al lugar donde se cruzaban los dos túneles. Durante este tiempo, prácticamente la única persona que habló fue Uverg, quien se aseguró de darle a Meridith el análisis más detallado y aburrido sobre los cristales que a nadie se le hubiera ocurrido. No pude entender la mitad de las palabras que usó en su informe y he estudiado todos los aspectos de la magia bastante extensamente. Me pregunto cuánto pudo entender Meridith de todo esto.
          - source: scene_3
            paragraph: 17
            text: '"Ejem..." dice Uverg, mientras todavía caminamos uno al lado del otro a través de los túneles subterráneos. "Pasando del análisis a nivel de superficie de los cristales azules, ahora me gustaría resumir algunos de los puntos principales que creo que encontrarán más interesantes, del informe detallado de veinte páginas que dejaré hoy sobre su escritorio. En primer lugar, no estoy seguro de que haya notado esto antes, pero el color de estos cristales no es completamente azul. Si observa con atención, verá que también hay un ligero matiz de índigo, aunque puede ser fácil pasarlo por alto ojo inexperto. Esto para mí fue muy impactante, porque significaría que el mismo nombre que hemos estado usando todos estos años para describir los cristales podría ser completamente incorrecto. Es posible que se necesiten más análisis, por supuesto, pero es muy posible que en un futuro cercano, estos ''cristales azules'' puedan cambiarse oficialmente a ''azules con un ligero tinte de cristales índigo''. ¡En verdad, estamos haciendo historia!'
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch11a_entrusted
