  - name: b3_ch11a_endless
    routes:
      - condition: b3_ch10_node = 1
        texts:
          - source: scene_text
            paragraph: 50
            text: |-
              "Entonces, todo lo que tengo que hacer es presionar este botón verde de aquí, ¿verdad?" Daren pregunta Meridith.

              "Exactamente", dice Meridith. "El resto se volverá obvio una vez que lo presiones".

              "Muy bien, aquí voy", dice Daren, y luego hace exactamente lo que Meridith le dijo.

              "Wow, esto es... No sé cómo describirlo..." dice Daren asombrado. "Es como si cada pieza de información que alguna vez quise saber estuviera casi a mi alcance, pero no lo suficientemente cerca. Cuanto más trato de acercarme a ella, más lejos llega, pero siento que si pudiera pasar unos segundos más así, eventualmente obtendría mi respuesta. Es... fascinante".

              "Desafortunadamente, esto es lo más lejos que puedes llegar como principiante", dice Meridith. "El conector te ayuda a tomar conciencia del potencial infinito del nodo, pero para sacar algo concreto de él, necesitarías meses y meses de arduo trabajo".

              "Sí, creo que entiendo lo que quieres decir", dice Daren, mientras presiona el botón verde nuevamente para cancelar su conexión al nodo. "Si me calmo y lo pienso lógicamente, está claro que obtener el conocimiento que necesito no será tan fácil como parece a primera vista. Pero no estabas bromeando acerca de que el potencial es infinito... Incluso si estamos hablando de simplemente mejorar mi magia, todavía hay decenas de miles de cosas que podría usar. Al menos, ahora sé que no vine hasta aquí hasta Varathia por nada".
          - source: scene_text_2
            paragraph: 35
            text: |-
              "¿Puedo intentarlo a continuación?" digo.

              "Sí, claro, Barry", dice Daren, y luego me entrega el dispositivo. "Creo que te va a encantar".

              "A ver..." digo, mientras me acerco al nodo y presiono el botón verde.

              Tan pronto como hago eso, entiendo inmediatamente de qué estaba hablando Daren. Todavía soy consciente del mundo que me rodea, pero al mismo tiempo siento que mi mente está conectada a una biblioteca interminable, llena de libros que contienen conocimientos que se remontan al principio del universo. Sin embargo, el acceso a ellos es claramente limitado, y no creo que esto se deba sólo a que no tenga experiencia. De hecho, es mucho más probable que el límite lo hayan puesto los diseñadores de este dispositivo, para evitar traumatizar a las personas que aún no están preparadas para ver la realidad.
          - source: scene_3
            paragraph: 24
            text: |-
              Habiendo tocado el nodo Magium una vez, puedo decir con un alto grado de certeza que la información disponible para mí en este momento es solo una pequeña fracción de lo que el Magium tiene para ofrecer.

              De hecho, estoy empezando a pensar que el botón verde está destinado a darme solo una pequeña muestra del conocimiento de Magium, y que el botón rojo es, de hecho, el acceso real a Magium. ¿Quizás debería intentar presionarlo?
        choices:
