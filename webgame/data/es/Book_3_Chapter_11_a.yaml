  - name: b3_ch11a_continent
    texts:
      - source: scene_text
        paragraph: 68
        text: |-
          "¿Ese... no era... el mensaje que intentabas enviarle?" le pregunto. "Mira, si quieres reformular tu mensaje más claramente, no me importaría volver allí para..."

          "El mensaje estaba redactado con mucha claridad", dice Eiden en tono serio. "No tengo dudas de que ella entendió exactamente lo que significaba. Sin embargo, el hecho de que ella eligió interpretarlo de esta manera es extremadamente decepcionante. Por lo que había escuchado, Meridith parecía tener una mentalidad mucho más abierta que los líderes Lessathi anteriores a ella, así que pensé que tal vez ella vería las cosas de manera diferente y preferiría evitar todo el derramamiento de sangre innecesario. Quizás me equivoqué".

          Luego hace una pausa de unos segundos, mientras el resto de nosotros permanecemos en completo silencio.

          "Entonces, ¿aceptaste la oferta de Meridith?" Eiden me pregunta sin rodeos.

          "¿Qué?" -digo nerviosamente. "¿De qué estás hablando? ¿Qué oferta?"

          "La oferta de matarme a cambio de obtener acceso a su nodo Magium, por supuesto", dice Eiden. "¿Supongo que esta fue la razón por la que Meridith los invitó a todos a su cuartel general? Dadas las circunstancias, realmente no veo qué más podría haber necesitado de ustedes. Tal vez podríamos saltarnos las bromas y comenzar la batalla ahora mismo. Todos ustedes parecen haberse vuelto más fuertes en las últimas semanas, así que estoy seguro de que al menos deben haber considerado la idea de intentar matarme una o dos veces..."
      - source: scene_text_2
        paragraph: 45
        text: |-
          "Espera, espera, espera", dice Daren. "¡No estuvimos de acuerdo en nada! Ella nos hizo la oferta, como dijiste, pero nos dio tiempo hasta el final del torneo para responderle".

          "Ah..." dice Eiden. "¡Una decisión sensata! Ahora que lo pienso, supongo que habría sido una tontería aceptar inmediatamente tal oferta, sabiendo que puedo saber fácilmente si estás mintiendo o no por tus auras. Bueno, en ese caso, no hay prisa. Tómate todo el tiempo que necesites para considerar tus opciones. Después de todo, ¡solo está en juego el destino de todo un continente!"

          "¿Continente?" le pregunto. "¿No te refieres a la isla?"

          "Ya sabes, Barry..." dice Eiden, mientras ahora se gira para mirarme con los ojos cerrados. "Estoy empezando a pensar que la verdadera razón por la que sigo volviendo a visitar su grupo es porque me he aficionado a escuchar sus comentarios tremendamente inapropiados e impertinentes. Probablemente debería agradecerle por darle un poco de color a la experiencia que de otro modo sería aburrida y poco interesante que he tenido desde que regresé a Varathia".

          "Oye, de nada", le digo. "¡Siempre feliz de ayudar!"
      - source: scene_3
        paragraph: 34
        text: |-
          "Efectivamente..." dice Eiden, y luego se queda callado por unos momentos, para reflexionar sobre sus próximas palabras.

          "Muy bien, entonces", nos dice Eiden, después de un rato. "Al igual que Meridith, yo también esperaré con gran interés tu respuesta a su oferta. Hasta entonces, continuaremos interactuando de la misma manera que antes. La próxima vez que nos veamos probablemente será en Galamir. Espero ver cómo se manejarán en el escenario bastante... único que encontrarán dentro de esa ciudad. Adiós, por ahora".

          "Sí, nos vemos", digo, mientras Eiden finalmente se teletransporta.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch11a_ending
  - name: b3_ch11a_ending
    texts:
      - source: scene_text
        paragraph: 69
        text: |-
          "Arraka, ¿Eiden se fue de verdad o todavía es invisible?" digo.

          "Sí, se fue de verdad", dice Arraka, en tono exasperado. "No es necesario que me preguntes esto cada vez. Te diré si todavía se esconde".

          "Correcto", digo.

          "¿Es así como ustedes interactúan con Eiden todo el tiempo?" Diane nos pregunta, luciendo genuinamente desconcertado. "Todos ustedes parecían tan... casuales al respecto."

          "Sí, te acostumbras después de un tiempo", dice Daren. "Entonces, ¿hacia dónde íbamos otra vez?"

          "Uh... ¡de esa manera!" Diane dice. "El bosque sagrado más cercano debería estar a unos pocos días de distancia caminando desde aquí si seguimos avanzando en esa dirección general".
      - source: scene_text_2
        paragraph: 46
        text: |-
          "Muy bien, entonces vámonos", dice Daren.

          "Por supuesto", le dice Diane. "Sígueme."

          A medida que seguíamos a Diane más hacia el bosque, mis pensamientos rápidamente comenzaron a alejarse de Meridith, Eiden y su mensaje, porque al menos para mí, había cosas mucho más importantes en las que pensar.
      - source: scene_3
        paragraph: 35
        text: |-
          Mis estadísticas mágicas están funcionando y ahora también sé con certeza que hay una manera de extraer conocimiento del Magium sin el riesgo de ser borrado de la existencia o volverme loco. De repente, la sugerencia de Kate de que use el conocimiento del Magium para modificar mi dispositivo de estadísticas para extraer su energía directamente del plano mágico ya no parece tan descabellada.

          Posiblemente esto sea lo más cerca que he estado de hacer realidad el sueño de mi vida. Quizás esto no fuera tan imposible después de todo.

          Quizás... pueda convertirme en mago.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch11a_credits
