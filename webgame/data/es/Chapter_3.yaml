            paragraph: 176
            text: |-
              Arremeto contra ellos e intento usar mi velocidad para maniobrar mejor que ellos.

              Esta no es una tarea fácil. Ni de lejos. Cuando arremetí por primera vez contra ellos, casi me dan tres virotes de ballesta. Ya me superan en número por mucho. Acercarse a ellos con un arma cuerpo a cuerpo cuando todos tienen ballestas parece casi suicida.

              Pero la velocidad es todo lo que tengo. No tengo la confianza suficiente para disparar mi ballesta mientras me muevo, y si me detengo aunque sea un segundo, recibiré un virote de ballesta a través del cráneo. Tengo que hacer que funcione. En primer lugar, necesito aislarlos. No puedo luchar contra todos a la vez.

              Uso mi agilidad superior para distanciarme rápidamente de ellos, y me aseguro de que han perdido mi rastro por completo. Luego empiezo a disparar mi ballesta a varios árboles que están muy separados entre sí, para distraer a mis atacantes. Unos cuantos muerden el anzuelo y se acercan para investigar el origen del sonido.

              Estos no son soldados entrenados. En el mejor de los casos, podrían ser unos simples guardias personales. No hay forma de que un grupo organizado rompiera jamás su formación por un truco barato como este.
