    routes:
      - condition: ch3_daren_worry = 1
        texts:
          - source: scene_text
            paragraph: 110
            text: |-
              "¿Por qué no?"

              "Compruébalo tú mismo. Venga, intenta volver a nuestra cueva."

              Con dudas, empiezo a desandar mis pasos hacia la cueva. Sin embargo, una vez que empiezo a caminar, siento un poderoso impulso de ir en la otra dirección. Lo intento de nuevo y obtengo el mismo resultado. No importa cuántas veces lo intente, simplemente no puedo seguir yendo en la misma dirección. Sigo girando en la dirección opuesta, a veces, sin siquiera darme cuenta. ¿Es esto algún tipo de hechizo? En toda mi investigación, nunca he leído sobre algo así.

              "¿Qué has hecho?" le pregunto a Kate.

              "Ya veo. Aparentemente ni siquiera alguien tan erudito como tú estaría familiarizado con este hechizo. Es comprensible. Después de todo, realmente no usan magia de sugestión fuera del continente de Varathia. El hechizo que usé es parte de un subconjunto de magia llamado sugestión. Lo que estos hechizos hacen es que insertan una idea dentro de tu cabeza y te hacen pensar que fuiste tú quien la tuvo. Puede que hayas notado que algo estaba mal porque estabas específicamente intentando ir en esa dirección, pero la mayoría de los magos que deambulan por esta zona ni siquiera notarán el efecto del hechizo."

              "¿Pero cómo lo evito?"
          - source: scene_text_2
            paragraph: 25
            text: |-
              "Para contrarrestar el hechizo, todo lo que necesitas hacer es concentrarte en la cueva y visualizarla claramente dentro de tu cabeza cuando te dirijas hacia ella. Mientras tengas un destino fijo en tu cabeza y no simplemente una dirección general, el hechizo no funcionará contigo. Mi conocimiento de este hechizo fue una de las únicas razones por las que pude sobrevivir contra los cazadores de banshees durante tanto tiempo. Cubre un área bastante grande, pero desafortunadamente solo puedo lanzarlo unas dos veces al día, y no dura más de unas pocas horas. Ahora vamos, nuestro destino no está mucho más lejos."

              Después de unos cinco minutos más de caminata, finalmente nos detenemos. El área donde paramos está llena de árboles caídos, similar a donde peleamos ayer. Excepto que esta vez no hay cuerpos. Sin embargo, claramente ha habido una gran batalla aquí. Quizás incluso la batalla que cargó mi dispositivo de estadísticas antes de irme a dormir. Todavía puedo sentir los rastros de magia residual resonando fuertemente en el aire a mi alrededor.

              "Aquí es donde quería traerte. Por favor, dime lo que puedas deducir al estudiar la magia de este lugar..."

              Mientras me concentro en la naturaleza de la magia a mi alrededor, empiezo a percibir fuertes rastros de magia elemental.

              "Parece que al menos un elementalista estuvo peleando aquí," le digo.

              "Sí, ¿pero puedes decir qué elemento estaba usando?"

              Intento concentrarme aún más.
          - source: scene_3
            paragraph: 5
            text: |-
              "Es... no estoy seguro de cómo describirlo. No parece ser ninguno de los cuatro elementos tradicionales. Si tuviera que ponerlo en palabras, diría que es... eléctrico, por naturaleza."

              El rostro de Kate se ilumina lentamente cuando escucha mis palabras. Esta es la primera vez que la veo sonreír, aunque solo sea ligeramente, desde que nos conocimos.

              "Gracias, Stillw-- Barry... ¡Realmente has sido de gran ayuda!"

              Su reacción me tomó por sorpresa.

              "Vaya. Esta es la primera vez que veo este lado tuyo. No sabía que realmente podías ser... agradable."

              "¿Qué se supone que significa eso?"
