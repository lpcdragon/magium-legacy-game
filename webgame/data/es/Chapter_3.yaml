  - name: ch3_speed2
    routes:
      - condition: ch3_prioritize = 1
        texts:
          - source: scene_text
            paragraph: 195
            text: |-
              Corto una rama que parece lo suficientemente sólida como para usarla como arma contundente del árbol detrás de mí, y espero a que los ballesteros se separen.

              Empiezo apuntando al grupo dividido con menos miembros.

              En una fracción de segundo, llego detrás de ellos y dejo fuera de combate al primer hombre con un golpe bien colocado de mi porra improvisada. Antes de que el segundo tenga tiempo de figurarse qué está pasando, lo noqueo a él también, y luego me escondo detrás del siguiente árbol. Afortunadamente, los otros ballesteros están demasiado concentrados en lo que están haciendo y no han notado que sus aliados han sido eliminados. 

              Esto es perfecto. Significa que todavía tengo tiempo para eliminar a otro grupo antes de que se den cuenta de lo que ocurre. Veo a mis próximos objetivos, avanzando cautelosamente hacia uno de los árboles a los que disparé antes. Esta vez son tres. Mejor tener cuidado.

              Al igual que antes, espero a un momento en que todos estén de espaldas a mí, llego detrás de ellos casi al instante, y antes de que tengan oportunidad de darse cuenta de lo que pasa, dos de ellos ya están en el suelo, inconscientes. El tercero, sin embargo, logró desviar mi golpe y ahora intenta apuntar su ballesta a mi estómago.
          - source: scene_text_2
            paragraph: 47
            text: |-
              Le corto la mano con mi daga de hielo, y se ve obligado a soltar su arma. Intento noquearlo de nuevo con mi porra, pero él simplemente bloquea mi golpe otra vez y busca su propio cuchillo. 

              Ya he decidido que no voy a matar a nadie en esta pelea, y no voy a echarme atrás ahora. Pase lo que pase, no voy a terminar con la vida de este hombre. El hombre se lanza hacia mí con su cuchillo, pero esquivo su golpe e intento noquearlo de nuevo. Esta vez, me agarra del brazo y lo retuerce hasta que se rompe. El dolor rompe mi concentración y soy incapaz de esquivar la siguiente estocada de su cuchillo, que me da justo en el estómago. Mientras lucho por mantenerme en pie, el hombre recoge tranquilamente su ballesta del suelo y me apunta a la cara. Su expresión no muestra más que desprecio.

              "Te sobreestimaste, muchacho", dice, mientras aprieta el gatillo.

              Su rostro es lo último que veo antes de que mi conciencia se desvanezca por completo.
        effects:
          - set:
              is_dead: 1
        choices:
          - position: 1
            text: Reiniciar juego
            effects:
              - set:
                  current_scene: ch1_intro1
                  storyboard_controls: Jump to frame "Chapter 1"
                condition: is_dead = 1
