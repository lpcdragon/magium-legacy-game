  - name: ch3_call_daren
    routes:
      - condition: ch3_daren_worry <> 1
        texts:
          - source: scene_text
            paragraph: 118
            text: |-
              Dudo, pero decido seguir el plan de Kate. Intentar luchar contra cien hombres armados yo solo sería suicida.

              "No hagas ninguna tontería," le digo a Kate mientras salgo de su cúpula de hielo. "Solo intenta mantenerte con vida hasta que vuelva."

              Al llegar a los árboles, Kate me grita.

              "¡Espera! Olvidé decirte--"

              El ruidoso cuerno ahoga el sonido de su voz, mientras ella se ve obligada a cerrar de nuevo su cúpula para defenderse de todos los virotes de ballesta entrantes. No estoy seguro de si se dio cuenta de que no escuché todo eso, pero no hay más tiempo para quedarme aquí esperando.

              Logro pasar rápidamente junto a dos de los hombres armados, mientras están concentrados en Kate. Sigo corriendo sin mirar atrás, directo hacia nuestra cueva.

              Sin embargo, al acercarme, empiezo a sentir un poderoso impulso de girar en la otra dirección. Por supuesto. La barrera de Kate. La había olvidado por completo en mi prisa por salir de ese campo de batalla. ¿Era esto lo que Kate estaba intentando advertirme?

              Intento desesperadamente seguir en la dirección correcta, pero sin siquiera darme cuenta, siempre acabo dando la vuelta. Después de correr de un lado a otro unas cuantas veces, de repente siento un dolor agudo en el pecho. Me doy cuenta de que me han disparado. Uno de los hombres que nos atacó debe haber logrado alcanzarme mientras yo perdía el tiempo aquí, corriendo en círculos. Antes de que siquiera tenga la oportunidad de girarme, me disparan dos veces más, y caigo al suelo, mientras mi consciencia se desvanece lentamente.
