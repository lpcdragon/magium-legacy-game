            paragraph: 182
            text: |-
              Me alejo todo lo que puedo e intento aprovechar la distancia que acabo de crear entre nosotros.

              Esta estrategia tampoco está funcionando tan bien como había planeado. Estoy fallando la mayoría de mis disparos y desperdiciando mi munición, mientras mis enemigos se acercan. 

              Desafortunadamente, ya no tengo tiempo para cambiar de táctica. Es todo o nada. Intento retroceder un poco más, pero uno de los hombres estaba esperando justo detrás de mí. Antes de que tenga oportunidad de reaccionar, me apuñala en la espalda y caigo al suelo, incapaz de moverme por el dolor. Lo último que veo es el cuchillo del hombre descendiendo hacia mí mientras asesta el golpe final.
