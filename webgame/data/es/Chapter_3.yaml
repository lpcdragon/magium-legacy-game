    texts:
      - source: scene_text
        paragraph: 96
        text: |-
          "No estoy intentando seducirla, Daren."

          "¡Claro que no!", dice Daren, de forma sarcástica.

          Lentamente, la sonrisa de Daren desaparece de su rostro y adopta un tono más serio.

          "Escucha", dice. "Sé que tienes buen corazón. Pero sabes tan bien como yo que las mujeres simplemente no pueden nacer magos. No está en su sangre. No sé por qué a ti te parece diferente de una banshee normal, y no sé por qué la banshee que lleva dentro no ha despertado todavía, pero es solo cuestión de tiempo. Un día se convertirá en una banshee, y quiero que estés preparado cuando llegue el momento."

          Daren saca un pequeño dispositivo propio de su bolsillo delantero y me lo entrega. Parece ser un transceptor mágico. Estos dispositivos los usan sobre todo los soldados cuando necesitan transmitirse información a corta distancia, sin tener que gritarse.

          "Quiero que lleves esto contigo en todo momento. Si alguna vez estás en peligro, solo tienes que pulsar esto tres veces y vendré a ayudarte lo más rápido posible."
      - source: scene_text_2
        paragraph: 14
        text: |-
          "Solo prométeme algo", le digo.

          "¡Por supuesto!"

          "Prométeme que no intentarás purificarla hasta que la veas transformarse en banshee."

          Daren suspira.

          "Me pides mucho, Barry. Deberías saber mejor que nadie lo difícil que será detenerla una vez se convierta en banshee. Pero si significa tanto para ti, te lo prometo."

          Hace una pausa.

          "Vamos, deberíamos ponernos en marcha. Es hora de despertar a Kate para que haga la segunda guardia."

          Mientras descendemos hacia la cueva, mi dispositivo de estadísticas empieza a pitar. Lo saco del bolsillo y veo que ahora tengo seis puntos más disponibles para gastar. Debe de haber habido una gran pelea en algún lugar cercano.
    choices:
