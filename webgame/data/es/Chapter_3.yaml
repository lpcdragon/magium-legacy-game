  - name: ch3_born
    texts:
      - source: scene_text
        paragraph: 109
        text: |-
          "Bueno, en ese caso, yo también tengo una pregunta para ti. Puede que no seas una banshee, pero tampoco puedes ser una maga. Las mujeres no pueden nacer como magas. Entonces, ¿qué eres?"

          "¿Quién dice que nací siendo maga?"

          Mi mente se queda en blanco por un segundo, mientras intento asegurarme de que entendí correctamente lo que dijo.

          "Espera, ¿me estás diciendo que naciste como una humana normal y que luego te convertiste en maga?"

          "Eso es exactamente lo que estoy diciendo."

          "¿¡Cómo!? ¿Tuviste acceso al Magium? ¿Cómo lo hiciste? ¡Tengo que saberlo!"

          Me doy cuenta demasiado tarde de que dejé que la emoción se apoderara de mí. Kate me mira con una expresión que muestra tanto perplejidad como una comprensión repentina.

          "Por los dioses," dice ella. "Estabas diciendo la verdad, ¿no? Realmente eres un humano, y viniste aquí con la esperanza de convertirte en mago. Escúchame, no tengo idea de qué podría motivarte lo suficiente para embarcarte en esta misión suicida, pero lo único que encontrarás al final de tu viaje será agonía y desesperación. Déjalo ahora, y puede que aún salgas de esto con vida."
      - source: scene_text_2
        paragraph: 24
        text: |-
          "Me hablas de agonía y desesperación, pero tú elegiste convertirte en maga. Seguramente debes entender cómo me siento al respecto, ¿no?"

          "No. Porque convertirme en maga nunca fue mi intención. Y no tengo intención de continuar esta conversación, tampoco. Te di una advertencia. Puedes elegir hacerle caso o puedes ignorarla. Eso es todo lo que estoy dispuesta a decir sobre este tema."

          Antes de darme la oportunidad de responder, se adelanta a toda prisa mientras yo me apresuro a seguirla. Viajamos en completo silencio durante los siguientes diez minutos.

          A medida que nos alejamos más y más de la cueva, la llamo de nuevo.

          "Espera," le digo.

          "¿Qué pasa ahora?"

          "Nos estamos alejando demasiado de nuestra cueva. ¿Qué pasa si alguien ataca a Daren mientras duerme?"

          "Oh, no necesitas preocuparte por él."
