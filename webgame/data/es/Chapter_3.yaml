              Me aseguro de no dejar de moverme ni un segundo, y empiezo a dispararles con mi ballesta. 

              Son diez contra uno. No soy tan tonto como para pensar que simplemente correr en círculos va a ser suficiente para evitar que me disparen. Por suerte, el dispositivo de estadísticas también me ha enseñado formas de manejar una pelea desigual. La clave es ser constantemente consciente de lo que me rodea. Necesito no perder de vista a ninguno de mis enemigos, y conocer su paradero en cualquier momento dado a lo largo de la batalla. 

              Al hacer eso, me aseguro de que ninguno de ellos logre rodearme mientras otros me distraen. Conocer la ubicación de todos mis enemigos también me ayuda a encontrar sus puntos ciegos colectivos. Si solo dos o tres de ellos me ven a la vez, me resulta más fácil esquivar sus disparos.
