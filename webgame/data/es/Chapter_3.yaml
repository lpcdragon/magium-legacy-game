            paragraph: 102
            text: |-
              "Entonces, ¿cómo llegaste a conocer la verdadera función de los dispositivos de estadísticas?" le pregunto a Kate.

              Me da una mirada pensativa, probablemente intentando decidir cuánta verdad está dispuesta a revelarme.

              "Los potenciadores de estadísticas fueron creados en este continente. Yo también nací aquí. Es más común que la gente de este continente sepa lo que hacen estos dispositivos que la gente del resto del mundo."

              "Espera, ¿naciste aquí? ¿No viniste aquí como participante en este torneo?"

              "Nací aquí, pero no pasé toda mi vida aquí. Sin embargo, no es tan fácil regresar una vez que te has ido. Usé este torneo como un medio para volver, porque tengo unos asuntos pendientes que atender."

              "Y supongo que esos asuntos pendientes tuyos están de alguna manera relacionados con lo que quieres que mire."

              No hace ningún comentario, pero su silencio es suficiente para confirmar mi hipótesis. Kate decide cambiar completamente de tema.

              Se detiene frente a mí y me mira directamente a los ojos.
