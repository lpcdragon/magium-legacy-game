              La única forma de estar seguro de que ganamos esta pelea es matar a cada uno de ellos, especialmente a su líder. Si dejo algún superviviente, podrían llamar a refuerzos. ¿Quién sabe cuántos más de ellos están a la espera, simplemente esperando alguna señal para flanquearnos? No puedo correr ese riesgo. No dejaré que ninguno de ellos salga de aquí vivo.

              En ese sentido, me doy cuenta de que he dejado que mis sentimientos se apoderen de mí en mi combate anterior.

              Me doy la vuelta y regreso hacia donde luché contra los cinco ballesteros, con mi ballesta completamente cargada en la mano.

              Los cinco todavía están rodando por el suelo de dolor. Cuando me ven, algunos de ellos intentan alcanzar sus armas. Uno de ellos se las apaña para agarrar su ballesta e intenta apuntarme, con los brazos temblorosos. Le mato a él primero. Luego procedo a ejecutar a sus aliados uno por uno. El último que quedaba vivo me suplicó piedad. No le di ninguna señal de haberle oído y le disparé en la cabeza, sin un segundo de duda.

              Está hecho. Me doy la vuelta y empiezo a pensar en lo que tengo que hacer a continuación.
