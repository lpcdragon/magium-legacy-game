  - name: ch3_deer_end
    texts:
      - source: scene_text
        paragraph: 83
        text: |-
          Hace una pausa.

          "Pero me desvío del tema. Amigos míos, os agradezco una vez más vuestra ayuda. Nuestro hogar es vuestro hogar hasta que decidáis marcharos. Por favor, ¡comed cuanto queráis y no dudéis en pedir más! Estaré por allí si me necesitáis."

          Con estas últimas palabras, Elaria inclina la cabeza y se va a serntar cerca de su cría, que duerme en un rincón oscuro de la cueva.

          Daren, que ha estado comiendo todo este tiempo, nos mira ahora y sacude la cabeza.

          "Vale", dice. "Solo tengo una pregunta para vosotros. ¿Le habéis preguntado si tiene más de esto?"

          Señala el plato de comida que tiene delante.

          "Dijo que podemos pedir repetir cuando queramos", le respondo.

          "¡Perfecto! Entonces no hay necesidad de contenerse."

          Después de que los tres terminamos el banquete, Daren decide retomar nuestra conversación inicial donde la dejamos.

          "Muy bien", dice. "Barry. Voy a necesitar que decidas ahora y nos digas cómo planeas usar ese potenciador de estadísticas en el futuro inmediato, para que podamos preparar nuestras tácticas en consecuencia. No podemos permitirnos ir a nuestro próximo combate sin un plan."
