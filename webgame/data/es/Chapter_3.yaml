  - name: ch3_molan
    texts:
      - source: scene_text
        paragraph: 80
        text: |-
          Se me ocurre un pensamiento sombrío. Miro la carne de ciervo que tengo delante y me doy cuenta de que no he visto a Molan en un rato. No... no pudo haber sido eso... ¿verdad?

          "¿Molan?", grito, poniéndome de pie de un salto y mirando a mi alrededor. "¡Molan!"

          "¿Sí?", responde Molan desde uno de los rincones más oscuros de la cueva.

          Empiezo a calmarme lentamente al oír la voz del cervatillo. Dioses, ¿en qué estaba pensando? Realmente estoy dejando que los sucesos de esta tarde se me suban a la cabeza. Elaria se sorprendió por mi arrebato, pero solo tardó unos segundos en comprender lo que había pasado.

          "Por el gran zorro, no pensarías que yo... Molan es mi único hijo, nunca...

          "Lo siento. Estoy dejando que este torneo me afecte... No pretendía ofenderte."

          "No hay necesidad de disculparse, forastero. Suponer lo peor es natural, dada nuestra situación actual. Quizá mi elección de carne de ciervo no haya sido muy afortunada, pero te aseguro que no he matado a ninguno de los míos para hacer esto. Nuestra protectora, el gran zorro dorado, me ha enseñado el arte de la conjuración de comida. También me he tomado la libertad de conjurar un plato, ya que sé que los humanos no están acostumbrados a comer del suelo."

          "¿Puedes... lanzar magia?

          "Sí, muchos animales de este continente pueden. Es un regalo que nos ofrece nuestra protectora. El padre de Molan solía ser mucho mejor en ello que yo, pero hago lo que puedo."
    choices:
      - position: 1
        text: Preguntar por el zorro dorado
        effects:
          - set:
              current_scene: ch3_fox
      - position: 2
        text: Preguntarle qué le pasó al padre de Molan
        effects:
          - set:
              current_scene: ch3_father
  - name: ch3_fox
    texts:
      - source: scene_text
        paragraph: 81
        text: |-
          "¿Quién es ese zorro dorado del que hablas? ¿Vuestra líder?"

          "Podrías decir eso. Es un espíritu muy antiguo que ha guiado a todos los animales del continente durante miles de años. Es nuestra protectora, nuestra pastora y nuestra maestra, y todos aspiramos a ser como ella."

          Ajeno al significado de nuestra conversación, Daren decidió dejar de esperarme y empezó a comer. Le ofrece a Kate un bocado de carne de ciervo.

          "Barry está ocupado hablando con sus amigos animales. Se nos unirá cuando termine. Come, o tu comida se enfriará."

          "Chitón, estoy intentando escuchar", responde Kate.

          "Estás bromeando. ¿Me estás diciendo que realmente entiendes lo que dicen?

          "Solo un poco. Por eso necesito algo de silencio para concentrarme. Así que cállate."

          Las palabras de Kate parecen haber captado la atención de Elaria.

          "No hay por qué avergonzarse de tu escaso dominio de nuestro idioma, humana forastera", le dice la cierva en la lengua antigua. "Creo que tu nombre es Kate, ¿no es así? Siéntete libre de unirte a nuestra conversación si quieres. Intentaré usar solo palabras más conocidas para facilitar tu comprensión."
      - source: scene_text_2
        paragraph: 7
        text: |-
          Elaria tomó a Kate por sorpresa con su propuesta. Está luchando por formar una frase coherente en el idioma de la cierva.

          "Yo... no... sabía que tú... hablabas común."

          "Puedo entenderlo, pero no se me permite hablarlo. La gran zorra nos ha prohibido hablar en el idioma de los humanos desde que comenzaron las cacerías de Olmnar, hace unas décadas. Los humanos y los animales de este continente habían vivido en armonía durante cientos de años, pero todo cambió cuando la gente de Olmnar empezó a cazar animales por deporte hace unos cuarenta años. Fue entonces cuando la gran zorra decidió cortar todos los vínculos entre el reino animal y los humanos, y nos prohibió volver a hablar la lengua común."

          "¿Entonces... no permitido.. hablar.. nosotros?"

          "Técnicamente no debería hablar con los humanos en general, pero la única regla inamovible es que no se me permite hablar en la lengua común. Respeto a la gran zorra y sus decisiones, pero eso no significa que esté de acuerdo con todas ellas. Me temo que la brecha que ha crecido entre nuestras dos razas solo amplificará más el conflicto entre nosotros. La mayoría de los humanos han olvidado el arte de la conjuración de comida, y sin nosotros para ayudarlos, han empezado a recurrir a métodos más primitivos para adquirir alimento. Lo que antes era solo un deporte practicado por Olmnar, se ha convertido ahora en un medio de supervivencia para muchos humanos. Esta guerra ya nos ha costado muchas vidas, incluido el padre de Molan, y cada día que pasa estoy más cansada de ella..."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch3_deer_end
