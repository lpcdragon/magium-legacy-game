scenes:
  - name: ch3_intro
    effects:
      - set:
          successful_checks:
            - 'Punto de control alcanzado: Partida guardada.'
        condition: checkpoint_rich = 1
    routes:
      - condition: ch2_deer_interaction <> 1
        texts:
          - source: scene_text
            paragraph: 74
            text: |-
              "Así que, Barry, déjame ver si lo he entendido bien", dice Daren. "Estás diciendo que esa baratija que llevas contigo es en realidad un dispositivo que amplifica tus atributos físicos, y que funciona con la magia que nos rodea..."

              "Exacto", respondo.

              "¿Y planeas usar este dispositivo para luchar contra los otros magos que se unieron al torneo?"

              "Correcto."

              Daren, Kate y yo estamos sentados en círculo, en el suelo rocoso de una cueva que encontramos cerca de las montañas del norte. Nuestro viaje hasta aquí ha sido bastante tranquilo, salvo por algunos cadáveres más que hemos visto por el camino. Daren se ha quitado su armadura pesada desde que llegamos y ahora lleva ropa más cómoda.
          - source: scene_text_2
            paragraph: 3
            text: |-
              "Kate, creo que los sucesos de esta tarde han sido demasiado para el pobre muchacho. Está completamente delirante. ¿Crees que podrías hacer que nuestro querido compañero recobre el sentido?

              "No", responde Kate, secamente.

              "Porque no te molestarás en..."

              "Porque tiene razón. El dispositivo que lleva es, en efecto, un potenciador de estadísticas, y la mayoría de esas estadísticas están destinadas a amplificar sus atributos físicos."

              "¿Qué?... ¿No eras tú la que decía que no debíamos confiar en él hace apenas unas horas? ¿Por qué lo defiendes ahora?"

              "No estoy defendiendo a nadie. Conozco la verdadera función de estos dispositivos desde hace mucho tiempo. No necesito confiar en él para saber que está diciendo la verdad."

              "Está bien, me rindo. Tú ganas, Barry. Entonces, ¿cuáles son esas estadísticas tuyas, de todos modos?"
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: ch3_intro2
                  checkpoint_rich: 0
      - condition: ch2_deer_interaction = 1
        texts:
          - source: scene_text
            paragraph: 75
            text: |-
              "Así que, Barry, déjame ver si lo he entendido bien", dice Daren. "Estás diciendo que esa baratija que llevas contigo es en realidad un dispositivo que amplifica tus atributos físicos, y que funciona con la magia que nos rodea..."

              "Exacto", respondo.

              "¿Y este dispositivo te enseñó una lengua antigua que te permitió comunicarte con los dos ciervos?"

              "Correcto."

              Daren, Kate y yo estamos sentados en círculo, en el suelo rocoso de la cueva de nuestros anfitriones ciervos. Nuestro viaje hasta aquí ha sido bastante tranquilo, salvo por algunos cadáveres más que hemos visto por el camino. Daren se ha quitado su armadura pesada desde que llegamos y ahora lleva ropa más cómoda.

              "Barry, no existe tal cosa como hablar con los animales. Te he oído 'hablar' con ellos, y no son más que ruidos extraños de animales. El hecho de que hayas tenido suerte y realmente nos hayan traído a su guarida no demuestra que tengas razón. Kate, ¿podrías hacer que nuestro querido compañero recobre el sentido?"
          - source: scene_text_2
            paragraph: 4
            text: |-
              "No", responde Kate, secamente.

              "Porque no te molestarás en..."

              "Porque tiene razón. El dispositivo que lleva es, en efecto, un potenciador de estadísticas, y una de esas estadísticas otorga al propietario el conocimiento de las lenguas antiguas."

              "¿Qué?... ¿No eras tú la que decía que no debíamos confiar en él hace apenas unas horas? ¿Por qué lo defiendes ahora?"

              "No estoy defendiendo a nadie. Conozco la verdadera función de estos dispositivos desde hace mucho tiempo. No necesito confiar en él para saber que está diciendo la verdad."

              "Está bien, me rindo. Tú ganas, Barry. Entonces, ¿cuáles son esas estadísticas tuyas, de todos modos?"
