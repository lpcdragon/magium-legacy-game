  - name: ch3_dart
    routes:
      - condition: premonition >= 2 AND perception = 3
        texts:
          - source: scene_text
            paragraph: 113
            text: |-
              De repente veo una visión de un dardo siendo disparado hacia Kate. Me doy cuenta inmediatamente de que lo que acabo de ver era una premonición. ¿Pero de dónde vino el dardo?

              Me giro y empiezo a mirar cuidadosamente hacia los árboles a lo lejos.

              Mientras miro hacia el bosque, diviso dos figuras sombrías escondidas detrás de uno de los árboles. Uno de ellos parece estar sujetando una ballesta, y está apuntando directamente a Kate.

              "¿Qué ha pasado?" pregunta Kate. "¿Qué estás buscando?"

              El hombre detrás del árbol dispara su ballesta pero yo lo estaba esperando.

              "¡Cuidado!" digo, mientras empujo a Kate fuera de la trayectoria del dardo.

              "¡Imbécil torpe!" puedo oír a un hombre gritar desde detrás de los árboles. Su voz es aguda, y podría confundirse fácilmente con la de una mujer, si no estuvieras prestando atención.

              "¿Cómo has podido fallar ese tiro? ¡Plan B! ¡Pasemos al plan B! ¡Ahora!"

              De repente, todos los árboles a nuestro alrededor se cubren con una nube de humo. Entre la falta de luz, la distancia y la cortina de humo, ahora es casi imposible saber dónde se esconden nuestros enemigos, excepto por la vaga sensación de sus auras mágicas.
          - source: scene_text_2
            paragraph: 28
            text: |-
              "¡Ríndete, banshee!" dice el hombre con la voz aguda. "Te tenemos rodeada. No hay forma de que puedas saber dónde estamos a través de este humo tan espeso. Si te rindes, les concederemos a ti y a tu compañero humano el regalo de una muerte rápida e indolora."

              Otro enemigo más que no cree que yo sea un Stillwater. Estoy empezando a dudar de que este farol fuera una buena idea después de todo.

              "¿Es esto una broma?" dice Kate. "Puedo percibir que hay al menos un centenar de ustedes escondidos detrás de los árboles a nuestro alrededor. Y sin embargo ninguno de ustedes es mago. ¿De verdad creen que pueden ganar contra magos superándolos en número?"

              "Los magos no son dioses. Sangran igual que el resto de nosotros. Si sangran, pueden morir. Y tú también."

              Después de terminar su frase, sopla un cuerno muy ruidoso que ahoga todos los demás sonidos en el bosque, y de repente una lluvia de virotes de ballesta viene volando hacia nosotros desde todas las direcciones. Kate rápidamente crea una cúpula de hielo a nuestro alrededor para bloquear sus disparos.

              "Barry, ¿puedes verlos a través del humo?"

              Echo un vistazo a través de su cúpula de hielo semitransparente, e intento ver si puedo distinguir alguna figura a través de la cortina de humo distante. Parece que incluso con todas las circunstancias desfavorables, todavía puedo ver a nuestros enemigos con suficiente claridad. Esta estadística de observación es verdaderamente asombrosa.
          - source: scene_3
            paragraph: 6
            text: |-
              "Sí, los veo claramente."

              "Bien, entonces serás mis ojos. Cuando disipe esta cúpula, quiero que me des todas sus posiciones y yo me encargaré de ellos mientras te protejo de cualquier ataque."
