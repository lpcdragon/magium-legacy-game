            paragraph: 175
            text: |-
              Arremeto contra ellos e intento usar mi velocidad para maniobrar mejor que ellos.

              Lamentablemente, no era ni de lejos lo bastante rápido para que tal táctica funcionara. Acortar la distancia entre ellos y yo solo facilitó que los ballesteros me abatieran. Me mataron antes incluso de que tuviera oportunidad de alcanzar mi primer objetivo.
