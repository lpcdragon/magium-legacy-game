    texts:
      - source: scene_text
        paragraph: 132
        text: |-
          "Me dices que puedo quedarme con todo tu dinero," le digo. "Pero eso no es todo tu dinero, ¿verdad? ¿Dónde escondes el resto?"

          "¿Q-Qué quiere decir? ¡Eso es todo lo que tengo conmigo! El resto de mi fortuna está en mi mansión en el Continente Occidental."

          "Conozco a los de tu tipo. Nunca guardarías todo tu dinero en un solo lugar. Especialmente en un lugar como este. Debes tener un escondite secreto enterrado en algún lugar por aquí en caso de emergencia."

          "¡Eso es todo lo que tengo! ¡Lo juro!"

          "Bien."

          Apunto mi ballesta a su cabeza.

          "¡Espere! Tiene razón. Hay más. He enterrado algo de oro junto a ese árbol de allí solo por si acaso. ¡Pero eso es lo último de mi dinero! ¡Lo juro!"

          Voy al árbol del que estaba hablando y empiezo a desenterrar su tesoro para verificar que dice la verdad. Hay aún más oro aquí que el que había en su bolsa. Dudo mucho que este sea su último escondite, pero probablemente no voy a sacarle más información a estas alturas. Vuelvo a donde Kate y el duque de Bagelberry están de pie.

          "¿Ve?" dice el duque. "¡Está todo ahí! ¡Y ahora es suyo!"
