          "En realidad no tuve tiempo de sentir nada. Supongo que estaba demasiado preocupado con seguir vivo."

          "Casi lo olvidaba. Fue tu primera batalla real, ¿verdad? Lo manejaste bien, Barry. ¡Deberías estar orgulloso!"

          Daren se detiene unos segundos para contemplar la lejanía antes de continuar.

          "¿Sabes?, cuando oí hablar de este torneo, mi primer pensamiento fue que finalmente, después de toda una vida de buenas acciones, después de toda una vida intentando marcar la diferencia, alguien me estaba enviando una señal. He intentado toda mi vida salvar al mundo de su miseria, pero por mucho que lo intentara, mis esfuerzos nunca eran suficientes. Pero con la ayuda del Magium... Quizás, solo quizás, podría tener una oportunidad."

