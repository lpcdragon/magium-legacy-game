        texts:
          - source: scene_text
            paragraph: 105
            text: |-
              "Hay algo que me ha estado molestando desde que nos conocimos ayer," dice ella.

              "Cuando Daren y tú me vieron por primera vez, empezaron a cuchichear entre ustedes durante como un minuto. Dijiste que estaban hablando de mi aspecto y al principio estaba dispuesta a creerte, pero entonces pasó todo un día y ninguno de los dos hizo un solo comentario sobre que yo fuera una banshee. Incluso después de que ese mago barbudo idiota se los deletreara cuando estábamos peleando. Ahora me resulta dolorosamente obvio que estaban discutiendo si yo era una banshee o no, y decidieron que no era necesario purificarme."

              Hace una pausa antes de continuar.

              "La pregunta es por qué. Decidí buscar la ayuda de Daren porque me engañé a mí misma pensando que alguien tan bondadoso como él no me sentenciaría a muerte. Pero ahora que he despejado mi mente y lo he pensado, me doy cuenta de cuánto me he puesto en riesgo al mostrarme ante él. ¿Por qué decidió Daren que yo no era una banshee cuando todas las pruebas apuntaban a lo contrario?"

              Kate todavía no confía en mí. Si le digo que yo fui quien convenció a Daren de perdonarle la vida, o no me va a creer, o va a sospechar de mis motivos y perderá completamente la confianza en Daren. ¿Quizás me crea si le digo que fue Daren quien decidió no purificarla?
          - source: scene_text_2
            paragraph: 20
            text: |-
              "Daren dijo que se había encontrado con una banshee antes," le miento. "Dijo que podía notar que eras diferente de algún modo, y que iba a mantenerte vigilada, por el momento."

              "Ya veo," dice Kate con alivio en su voz. "Eso es todo lo que quería preguntar. Sigamos adelante, entonces."

              "Espera, ¿por qué me preguntas todo esto a mí? ¿Por qué no le preguntas a Daren directamente?

              "Porque Daren es quien sabe magia blanca, no tú. Él es quien normalmente querría purificar a una banshee. No quería darle ideas, en caso de que nunca se le hubiera pasado por la cabeza."

              "¿Y por qué creerías que te estoy diciendo la verdad?"

              "Porque no eres un mentiroso muy bueno. Tu cara te delata."

              ¿Ah, sí?...
