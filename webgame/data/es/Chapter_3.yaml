        texts:
          - source: scene_text
            paragraph: 144
            text: |-
              Cojo rápidamente la ballesta del suelo, y salto justo delante de los cinco hombres, apuntando al del medio.

              Mi habilidad de técnica de combate me ha enseñado lo suficiente sobre órganos vitales como para poder dispararle en el pecho sin perforarle los pulmones. Hago lo mismo con uno de sus camaradas, y luego me escondo detrás de un árbol, mientras tres virotes de ballesta pasan rozándome.

              Tres disparos. Solo me quedan tres disparos.

              Salgo de detrás del árbol, y apunto a los que siguen en pie. En vez de esconderse detrás de los árboles ellos mismos, los tres hombres ilesos formaron un muro frente a sus aliados caídos, para asegurarse de que no los remate. Esto es bueno para mí. Es mucho más fácil apuntarles cuando están al descubierto.

              Disparo dos tiros más, todavía asegurándome de no dar en sus órganos vitales, y ambos hombres caen al suelo con un fuerte golpe.

              El último hombre en pie dispara un virote hacia mí, pero lo esquivo en el último segundo, y apunto hacia él.

              Una vez que le disparé, cayó al suelo como todos los demás, gritando de dolor. Rápidamente me alejé, antes de que sus gritos atrajeran a otros ballesteros a este lugar. Estos no estaban en posición de seguirme.
        effects:
          - set:
              successful_checks:
                - '[ Comprobación de técnica de combate exitosa - nivel 2 ]'
        choices:
