        texts:
          - source: scene_text
            paragraph: 85
            text: |-
              Tras tomarme un tiempo para considerar mis opciones, le doy a Daren mi respuesta.

              "Planeo luchar junto a vosotros dos, por muy loco que suene. De lo contrario, solo os estaría retrasando."

              Daren suspira.

              "Tenía el presentimiento de que dirías algo así. Supongo que eso significa que maximizarás tu fuerza, resistencia y técnica de combate entonces. Y quizá premonición, ya que probablemente sea buena contra ataques sorpresa. Solo asegúrate de no sobreestimarte. Deja que Kate y yo nos encarguemos de nuestros oponentes fuertes. Tú solo intenta mantener a los debiluchos fuera de nuestro camino."

              Daren desvía su mirada hacia Kate.

              "Ahora, por nosotros dos. Como dijiste después de nuestra última batalla, preferiría no luchar contra encantadores de armas a menos que no tenga otra opción. Por eso voy a pedirte que te encargues de ellos cuando llegue el momento."

              Kate asiente a Daren, mientras él continúa hablando.

              "En cuanto a mí, soy particularmente bueno contra elementalistas, invocadores y cambiaformas, así que me centraré en ellos si nos encontramos con alguno."

              Está hablando de las especializaciones de los magos. La mayoría de los magos eligen un cierto tipo de magia y dedican su vida a perfeccionarla, en lugar de intentar aprender tantos hechizos como sea posible.
          - source: scene_text_2
            paragraph: 10
            text: |-
              Los encantadores de armas usan su magia para hacer que su equipo sea lo más fuerte posible. Dado que dependen principalmente de sus armas para el combate, es probable que también se entrenen en al menos un arte marcial.

              Los elementalistas son magos que nacen con un talento increíble para manipular uno de los cuatro elementos: agua, aire, fuego o tierra. Sin embargo, nacen con la afinidad para un solo elemento, y suelen tener problemas para dominar otros hechizos, ya que dependen únicamente de su talento para lanzar sus hechizos elementales, y generalmente tienen poco conocimiento de las artes arcanas.

              Los invocadores son magos que se concentran en la invocación de otras criaturas para que luchen por ellos. Dado que eso los deja vulnerables a ataques sorpresa, normalmente también se centran en hechizos defensivos, para mantenerse a salvo mientras sus criaturas invocadas luchan por ellos.

              Los cambiaformas, por otro lado, optan por un enfoque más personal, transformándose ellos mismos en otras criaturas en lugar de recurrir a la invocación. Esto resuelve el problema de vulnerabilidad que tienen los invocadores, pero también limita sus poderes, ya que no pueden lanzar otros hechizos mientras están transformados.

              "¿Y tú, Kate?", pregunta Daren. "¿Tienes alguna debilidad contra algún tipo de magia en particular?"

              "Sí", responde ella.

              "Pero no planeas compartirla con nosotros."
          - source: scene_3
            paragraph: 3
            text: |-
              "No."

              Daren se encoge de hombros.

              "Como quieras. Bueno, creo que eso es todo lo que necesitábamos discutir por ahora. Hora de dormir. Barry y yo haremos la primera guardia. ¡Vamos, Barry!"

              Sigo a Daren fuera de la cueva y juntos empezamos a escalar la montaña, para llegar a un buen punto de observación. La luna está alta en el cielo y las estrellas brillan intensamente. No tendremos problemas para detectar enemigos si se acercan.
