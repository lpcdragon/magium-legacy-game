            text: |-
              Cojo rápidamente la ballesta del suelo, y salto justo delante de los cinco hombres, apuntando al del medio.

              Temiendo darle en alguno de sus órganos vitales, apunto a una de sus piernas, para inmovilizarlo. Hago lo mismo con uno de sus camaradas, y luego me escondo rápidamente detrás de un árbol, mientras tres virotes de ballesta pasan rozándome.

              Tres disparos. Solo me quedan tres disparos.

              Salgo de detrás del árbol, y apunto a los que siguen en pie. En vez de esconderse detrás de los árboles ellos mismos, los tres hombres ilesos formaron un muro frente a sus aliados caídos, para asegurarse de que no los remate. Esto es bueno para mí. Es mucho más fácil apuntarles cuando están al descubierto.

              Disparo dos tiros más, todavía apuntando a sus piernas, y ambos hombres caen al suelo con un fuerte golpe.

              El último hombre en pie dispara un virote hacia mí, pero lo esquivo en el último segundo, y apunto hacia él.

              Noto demasiado tarde que uno de los hombres en el suelo logró recuperar su ballesta y la está apuntando directamente hacia mí.

              No hubo tiempo para reaccionar. Su virote de ballesta me dio justo en la cara, y morí casi al instante.
