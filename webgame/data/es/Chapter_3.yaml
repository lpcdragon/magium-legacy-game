    texts:
      - source: scene_text
        paragraph: 128
        text: |-
          Con la forma en que se comporta, dudo que alguna vez reúna el coraje para atacarnos de nuevo.

          "Muy bien. Me quedaré con tu dinero a cambio de tu vida. Ahora lárgate de mi vista. No quiero volver a verte."

          "¡N-N-No me volverá a ver! ¡Se lo prometo!"

          Se pone de pie torpemente y empieza a correr.

          Sin embargo, antes de que dé siquiera su primer paso, un pico de hielo sale del suelo y lo empala a través del pecho.

          "Por qué... ¿Por qué--" intenta decir, antes de que su cabeza caiga a un lado y su expresión quede en blanco.

          "¡Kate, qué has hecho! ¡Estaba intentando perdonarle la vida!"

          "Y lo hiciste. ¡Felicidades! Gracias a ti, su vida se extendió tres segundos enteros. ¡Deberías estar orgulloso!"
      - source: scene_text_2
        paragraph: 35
        text: |-
          "¿Cómo pudiste hacer esto? ¡Estaba indefenso! ¡Se rindió ante nosotros!"

          "Sí, y le ofrecí una muerte rápida e indolora. ¿No es eso lo que dijo que nos daría a nosotros si nos rendíamos?"

          "¡Eso no significa que tengamos que actuar como él!"

          Kate suspira.

          "Escucha, Barry," dice ella. "No maté a este hombre por una venganza mezquina. Lo maté porque una vez que se hubiera calmado, habría empezado a procurarse un nuevo ejército, y probablemente habría hecho de su misión cazarnos, para poder tomar SU venganza mezquina contra nosotros. Visiblemente era un hombre muy ingenioso. No es fácil convencer a todo un batallón de hombres para que te sigan a una muerte segura. Dudo mucho que fuera el tipo de persona que deja pasar un rencor fácilmente, tampoco. Y como señalé antes, definitivamente no me pareció del tipo misericordioso. ¿No crees que ya estamos en suficiente peligro como está, sin añadir enemigos que nos busquen para matarnos, específicamente?

          "Yo, eh... no lo había pensado de esa manera."

          "No. No lo pensaste. Ahora vamos. Volvamos a nuestra cueva. Hemos terminado aquí."

          Cojo la bolsa de monedas y sigo a Kate.
