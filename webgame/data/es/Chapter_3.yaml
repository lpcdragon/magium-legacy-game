  - name: ch3_final_decision
    texts:
      - source: scene_text
        paragraph: 172
        text: Finalmente, necesito decidir si quiero ir directamente a por el líder, o eliminar a sus tropas primero. Si capturo al líder, entonces hay una posibilidad de que pueda persuadirlo para que detenga el ataque, y terminar la pelea antes. Sin embargo, si no logro capturarlo, solo conseguiré convertirme en el objetivo principal de todo su ejército.
    choices:
      - position: 1
        text: Ir a por el líder e intentar evitar a las tropas por el camino
        effects:
          - set:
              current_scene: ch3_leader
              ch3_final_decision: 1
      - position: 2
        text: Ir a por los ballesteros primero
        effects:
          - set:
              current_scene: ch3_troops
              ch3_final_decision: 2
  - name: ch3_leader
    texts:
      - source: scene_text
        paragraph: 173
        text: |-
          Cuanto antes termine esta pelea, mejor. Eliminar a cada uno de los hombres que nos atacan llevaría demasiado tiempo, y no sé si Kate podrá aguantar mucho más. Decido ir directamente a por su líder.

          Me adentro más en el bosque, para evitar ser detectado, y sigo la dirección general de donde oí hablar por primera vez a su líder. Dudo que tuviera motivos para moverse de su posición original, ya que cree que ya ha ganado esta pelea.

          Mientras corro por el bosque, soy detectado por un grupo de unos diez hombres. Como están relativamente lejos de mí, tienen que acercarse para poder apuntar sus disparos correctamente.
    choices:
      - position: 1
        text: Continuar
        effects:
