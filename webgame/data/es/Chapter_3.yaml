              current_scene: ch3_speed
            condition: ch3_tactic = 1
          - set:
              current_scene: ch3_snipe_first
            condition: ch3_tactic = 3
          - set:
              current_scene: ch3_move_first
            condition: ch3_tactic = 2
          - set:
              current_scene: ch3_clobber
            condition: ch3_tactic = 4
  - name: ch3_troops
    texts:
      - source: scene_text
        paragraph: 174
        text: |-
          No puedo arriesgarme a perder la ventaja del elemento sorpresa. No hay mejor momento que ahora para eliminar a los ballesteros, ya que están todos tan concentrados en Kate. Para cuando su líder se dé cuenta de lo que está pasando, su ejército habrá desaparecido.

          Empiezo a dirigirme en la dirección opuesta a la de donde provino por primera vez la voz de su líder, ya que mi plan se irá al traste si me nota. Dudo que tuviera motivos para moverse de su posición original, ya que cree que ya ha ganado esta pelea.

          Mientras corro por el bosque, soy detectado por un grupo de unos diez hombres. Como están relativamente lejos de mí, tienen que acercarse para poder apuntar sus disparos correctamente.
