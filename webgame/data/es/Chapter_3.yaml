    texts:
      - source: scene_text
        paragraph: 143
        text: |-
          Me alejo lo más que puedo del ballestero que eliminé, y me escondo detrás de un árbol.

          Unos segundos después, oigo los pasos de los cinco hombres al llegar junto a su compañero.

          "¿Quién hizo esto? ¡Muéstrate, cobarde!" grita uno de ellos.

          "Quizás fue esa banshee. Quizás usó su magia para hacerle esto."

          "No seas ridículo, la banshee apenas puede mantenerse en pie."

          Mientras los hombres discuten entre ellos, estoy intentando encontrar el momento adecuado para alejarme de ellos. Mientras permanezco ahí de pie, con mi espalda apoyada contra el árbol, un brazo aparece por detrás de mí, sujetando un cuchillo en la mano. Me raja el cuello rápidamente, y la sangre empieza a brotar.

          "Como una rata en una jaula, jejé..." oigo decir al hombre, mientras caigo al suelo.

          Lo último que veo es el cuchillo del hombre descendiendo hacia mí, mientras asesta el golpe final.
    choices:
