            paragraph: 45
            text: |-
              Lo que necesito decidir ahora es cómo planeo encargarme de todos estos soldados entrenados y mercenarios. Echo un vistazo hacia Kate. Su cúpula todavía está en pie, pero está recibiendo mucho daño. Todos los ballesteros parecen estar concentrados en ella en este momento, y no le están dando ninguna oportunidad de contraatacar.

              Esto significa que podría intentar eliminarlos a todos moviéndome muy rápido de uno a otro, mientras están distraídos. La mayoría de ellos están estacionados en grupos, por lo que no hay forma de eliminarlos a todos sin que me maten a menos que sea increíblemente rápido, o a menos que pueda apuntar mi ballesta mientras me muevo.

              También podría intentar dispararles desde lejos, pero tendría que estar bastante lejos para que no pudieran saber de dónde vienen los disparos, y ese tipo de maniobra llevaría significativamente más tiempo de realizar que cualquiera de mis otras estrategias viables.

              Mis ojos vagan hacia uno de los muchos árboles caídos a mi alrededor, y de repente se me ocurre una idea loca. Doblo las rodillas e intento levantar el árbol del suelo.
