  - name: ch3_crossbowmen_finish
    texts:
      - source: scene_text
        paragraph: 205
        text: |-
          El último hombre en pie, su líder, está ahora de rodillas, llorando y pidiéndome piedad. Por el aspecto de sus lujosas vestiduras, parece ser algún noble rico de una de las ciudades más prósperas del oeste. Eso explicaría cómo pudo motivar a tanta gente a seguirlo en esta misión suicida.

          "¡Por favor!", grita con su voz de niña, mientras solloza. "¡Sólo quería hacerme famoso ganando el torneo! ¡Siento haberte atacado! ¡Por favor, no me mates! ¡Tengo mucho dinero! Aquí, puedes tomarlo. ¡Puedes tomarlo todo! Sólo perdóname la vida. ¡Por favor!"

          Lanza una bolsa de monedas de oro al suelo mientras se arroja a mis pies. Esto es bastante dinero. Fácilmente podría vivir la mayor parte de mi vida restante con lujo con sólo esta cantidad.
    effects:
      - set:
          ac_ch3_army: 1
        achievement:
          id: ac_ch3_army
          title: Un ejército de un solo hombre
    choices:
      - position: 1
        text: Quedarse con su dinero y perdonarle la vida
        effects:
          - set:
              current_scene: ch3_alone_spare_take
              ch3_treasure: 1
      - position: 2
        text: Perdonarle la vida pero no quedarse con su dinero
        effects:
          - set:
              current_scene: ch3_alone_spare_leave
              ch3_treasure: 0
      - position: 3
