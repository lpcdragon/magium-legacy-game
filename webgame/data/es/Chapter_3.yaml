            text: Continuar
            effects:
              - set:
                  current_scene: ch3_intro2
                  checkpoint_rich: 0
  - name: ch3_intro2
    routes:
      - condition: ch2_deer_interaction <> 1
        texts:
          - source: scene_text
            paragraph: 76
            text: |-
              Le muestro la pantalla de mi dispositivo, donde se ven las nueve estadísticas. Daren observa el dispositivo con una mirada larga y pensativa, hasta que decide hablar.

              "Muy bien. Aquí tienes mi opinión. Creo que si vamos a seguir viajando en nuestra formación actual, y si ese dispositivo tuyo realmente hace lo que dices, entonces lo que más nos ayudaría a todos sería que maximizaras esa estadística de observación."

              "¿Observación?... ¿Por qué observación precisamente?", le pregunto.
          - source: scene_text_2
            paragraph: 5
            text: |-
              "Porque si eres bueno observando detalles, es mucho más probable que detectes ilusiones. Normalmente, la mejor forma de saber si estás en una ilusión es notar algo insignificante que haya cambiado en el entorno que te rodea. Ninguna ilusión es perfecta. A veces desaparecen unas cuantas hojas del suelo, otras veces el sol está más alto en el cielo de lo que estaba antes de entrar en la ilusión. Yo soy muy malo notando ese tipo de cosas. Normalmente solo lo veo cuando es demasiado tarde. Eso no me ha matado todavía, pero claro, nunca antes había tenido que luchar contra los magos más fuertes del mundo. Incluso si maximizas todos tus atributos físicos, dudo que alguna vez estés a la altura de Kate o la mía, y mucho menos de todos los demás magos que se unieron a este torneo. Pero con buenas habilidades de observación, bien podrías acabar salvándonos la vida cuando entremos en nuestra primera ilusión."

              Daren hace una pausa.

              "Bueno, de todos modos, esa es solo mi opinión. Puedes tomártela con reservas. ¡Esa baratija es tuya, así que siéntete libre de hacer lo que quieras con ella! Sin embargo, quiero que decidas ahora y nos digas qué vas a elegir, para que podamos preparar nuestras tácticas en consecuencia. No podemos permitirnos ir a nuestro próximo combate sin un plan."
        choices:
          - position: 1
            text: Centrarse en evitar ataques y atraer a los oponentes
            effects:
              - set:
                  current_scene: ch3_tactics
                  ch3_tactics: 1
          - position: 2
            text: Centrarse en luchar contra los enemigos de frente
            effects:
              - set:
                  current_scene: ch3_tactics
                  ch3_tactics: 2
          - position: 3
            text: Centrarse en observar el campo de batalla y proporcionar información táctica
            effects:
              - set:
                  current_scene: ch3_tactics
                  ch3_tactics: 3
      - condition: ch2_deer_interaction = 1
        texts:
          - source: scene_text
            paragraph: 77
            text: "I show him my device's screen, where all of the nine stats are shown. Daren gives the device a long, pondering look, until he decides to speak.\r\n\r\n\"Alright. Here's my two copper pieces. I think that if we're to keep travelling in our current formation, and if that device of yours really does what you say it does, then what would help us all the most would be if you maxed that observation stat.\"\r\n\r\n\"Observation?... Why observation of all things?\" I ask him."
          - source: scene_text_2
            paragraph: 6
            text: |-
              "Porque si eres bueno observando detalles, es mucho más probable que detectes ilusiones. Normalmente, la mejor forma de saber si estás en una ilusión es notar algo insignificante que haya cambiado en el entorno que te rodea. Ninguna ilusión es perfecta. A veces desaparecen unas cuantas hojas del suelo, otras veces el sol está más alto en el cielo de lo que estaba antes de entrar en la ilusión. Yo soy muy malo notando ese tipo de cosas. Normalmente solo lo veo cuando es demasiado tarde. Eso no me ha matado todavía, pero claro, nunca antes había tenido que luchar contra los magos más fuertes del mundo. Incluso si maximizas todos tus atributos físicos, dudo que alguna vez estés a la altura de Kate o la mía, y mucho menos de todos los demás magos que se unieron a este torneo. Pero con buenas habilidades de observación, bien podrías acabar salvándonos la vida cuando entremos en nuestra primera ilusión."

              Daren hace una pausa.

              "Bueno, de todos modos, esa es solo mi opinión. Puedes tomártela con reservas. ¡Esa baratija es tuya, así que siéntete libre de hacer lo que quieras con ella!"

              "Espero no estar interrumpiendo nada importante", dice Elaria mientras se acerca. "Pensé que podríais tener hambre después de un viaje tan largo."

              Empuja un gran plato de carne cocinada hacia nosotros con su pezuña delantera. A juzgar por el aspecto y el olor, parece ser... carne de ciervo.
        choices:
          - position: 1
            text: Preguntarle cómo consiguió el plato
            effects:
              - set:
                  current_scene: ch3_plate
          - position: 2
            text: Preguntarle si son caníbales
            effects:
              - set:
                  current_scene: ch3_cannibals
          - position: 3
            text: Llamar para ver si Molan sigue vivo
            effects:
              - set:
                  current_scene: ch3_molan
  - name: ch3_plate
    texts:
      - source: scene_text
        paragraph: 78
        text: |-
          "¿Cómo has conseguido ese plato?", le pregunto. "Seguramente no lo habrás traído desde la ciudad más cercana."

          "¡No, por supuesto que no! Lo he conjurado de la misma forma que he conjurado la comida que veis ante vosotros."

          "¿Puedes... lanzar magia?"

          Mientras hablamos, oigo a Daren susurrarle a Kate.

          "¡Te juro que nunca me acostumbraré a oírle hablar así!"

          Elaria no le hace caso y responde a mi pregunta.

          "Sí, muchos animales de este continente pueden. Es un regalo que nos ofrece nuestra protectora, el gran zorro dorado. El padre de Molan solía ser mucho mejor en ello que yo, pero hago lo que puedo."
    choices:
      - position: 1
        text: Preguntar por el zorro dorado
        effects:
          - set:
              current_scene: ch3_fox
      - position: 2
        text: Preguntarle qué le pasó al padre de Molan
        effects:
          - set:
              current_scene: ch3_father
  - name: ch3_cannibals
    texts:
      - source: scene_text
        paragraph: 79
        text: |-
          "Espera, ¿entonces vosotros dos sois caníbales?", le pregunto.

          La cierva se ríe.

          "¡No, no lo somos! Pero entiendo por qué lo piensas. Quizá mi elección de carne de ciervo haya sido poco inspirada. Nuestra protectora, el gran zorro dorado, me ha enseñado el arte de la conjuración de comida, y pensé que preferiríais algo de carne en lugar de verduras. También me he tomado la libertad de conjurar un plato, ya que sé que los humanos no están acostumbrados a comer del suelo."

          "¿Puedes... lanzar magia?"

          Mientras hablamos, oigo a Daren susurrarle a Kate.

          "¡Te juro que nunca me acostumbraré a oírle hablar así!"

          Elaria no le hace caso y responde a mi pregunta.

          "Sí, muchos animales de este continente pueden. Es un regalo que nos ofrece nuestra protectora. El padre de Molan solía ser mucho mejor en ello que yo, pero hago lo que puedo."
    choices:
      - position: 1
        text: Preguntar por el zorro dorado
        effects:
          - set:
