              current_scene: ch3_alone_kill_leave
              ch3_treasure: 0
      - position: 5
        text: Presionarlo para que me diga dónde esconde el resto de su oro
        effects:
          - set:
              current_scene: ch3_alone_pressure
              ch3_treasure: 2
  - name: ch3_leader_finish
    texts:
      - source: scene_text
        paragraph: 206
        text: |-
          No puedo permitirme seguir encontrándome con enemigos como estos. Mi prioridad es su líder. Empiezo a moverme con más cautela, asegurándome de tener una vista clara de mis enemigos antes de ser detectado. Logro evitar cualquier resistencia hasta que llego a la ubicación de su líder. Sólo tiene un puñado de guardias rodeándolo. Definitivamente no esperaba una emboscada. 

          Me tomo mi tiempo para neutralizar silenciosamente a todas las fuerzas enemigas que están al alcance del oído de su líder, y luego elimino rápidamente a sus guardias personales, antes de que tengan tiempo de reaccionar. Su líder se acaba de dar cuenta de lo que pasó y ahora grita como una niñita. Por el aspecto de sus lujosas vestiduras, parece ser algún noble rico de una de las ciudades más prósperas del oeste. Eso explicaría cómo pudo motivar a tanta gente a seguirlo en esta misión suicida.

          "¿Q-Q-Qué haces aquí?", pregunta. "¿Cómo llegaste aquí? ¡¿Guardias?! ¡¡Guardias!!"

          "Nadie va a venir a ayudarte. Todos los ballesteros que estaban al alcance de tu oído han sido eliminados. Sólo somos tú y yo".

          "¡N-N-No! No te acerques más. ¡Atrás!"

          Lo agarro por la túnica, para asegurarme de tener toda su atención.

          "Escúchame. No me importa de qué país seas, o cómo conseguiste que tantos hombres te siguieran aquí, pero ahora eres mi rehén. Si no les dices a todas tus tropas que salgan del bosque, suelten sus armas y se rindan, te voy a asesinar aquí mismo y ahora, y luego haré lo mismo con todos tus guardias".
      - source: scene_text_2
        paragraph: 51
        text: |-
          "¡No, espera! ¡No puedo!"

          "Claro que puedes. Ese cuerno que tienes en la mano también funciona como un amplificador de voz mágico, ¿no? Ahora date prisa. Creo que se me está escapando el dedo del gatillo".

          A regañadientes, se pone el amplificador de voz en la boca y llama a sus tropas.

          "¡Atención, todos los hombres! Habla el duque de Bagelberry. Acabo de ser capturado por el enemigo. Repito, acabo de ser capturado por el enemigo. ¡Deben salir todos del bosque, tirar sus armas y rendirse!"

          El bosque queda en silencio, mientras los incesantes ataques de los ballesteros hacia Kate se detienen de repente. Están confundidos, eso lo noto.

          "¡¿Es que no me oyeron?! ¡Como su gobernante, les ORDENO que salgan de ese bosque y suelten sus armas! ¡Ahora!"

          Tras un breve retraso, el primer par de ballesteros empieza a salir de las sombras, seguidos por una oleada de unas pocas docenas de hombres más. Finalmente, todos salen del bosque y lanzan sus armas a los pies de Kate, declarando su rendición.

          "¡Ahí está, hice lo que me pediste!", dice el duque. "¿Ahora me dejarás ir?"

          "¿Y por qué haría eso? Según recuerdo, lo único que nos ofreciste si nos rendíamos era una muerte rápida e indolora".
