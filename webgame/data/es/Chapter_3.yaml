  - name: ch3_alone_pressure
    texts:
      - source: scene_text
        paragraph: 211
        text: |-
          "Me estás diciendo que puedo quedarme con todo tu dinero", le digo. "Pero ese no es todo tu dinero, ¿verdad? ¿Dónde escondes el resto?".

          "¿Q-Qué quieres decir? ¡Eso es todo lo que tengo conmigo! El resto de mi fortuna está en mi mansión en el Continente Occidental".

          "Conozco a los de tu clase. Nunca guardarías todo tu dinero en un solo lugar. Especialmente en un sitio como este. Debes tener un alijo secreto escondido por aquí cerca en caso de emergencia".

          "¡Esto es todo lo que tengo! ¡Lo juro!"

          "Bien".

          Le apunto con mi ballesta a la cabeza.

          "¡Espera! ¡Tienes razón! Hay más. He enterrado algo de oro junto a ese árbol detrás de ti, sólo para estar seguro. ¡Pero ese es el último de mi dinero! ¡Lo juro!"

          Retrocedo y empiezo a desenterrar su tesoro para verificar que dice la verdad. Hay incluso más oro aquí de lo que había en su bolsa. Dudo mucho que este sea el último de sus alijos ocultos, pero probablemente no voy a sacarle más información en este momento.

          "¿Ves?", dice el duque. "¡Está todo ahí! ¡Y ahora es tuyo!"
    choices:
      - position: 1
        text: Perdonarle la vida
        effects:
          - set:
              current_scene: ch3_alone_pressure_spare
      - position: 2
        text: Matarlo de todos modos
        effects:
          - set:
              current_scene: ch3_alone_pressure_kill
