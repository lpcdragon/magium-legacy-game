              "Barry," dice ella. "Necesitas escucharme con atención, porque no puedo mantener esta cúpula por mucho más tiempo. Necesito que vuelvas a nuestro campamento lo más rápido que puedas y llames a Daren. No hay forma de que podamos ganar esta pelea de otro modo."

              Mientras habla, uno de los ojos de Kate está temblando, y el sudor le corre por toda la cara.

              "¡No puedes hablar en serio! Nunca sobrevivirás tanto tiempo. Apenas puedes mantenerte despierta."

              "Me las arreglaré. He estado en situaciones mucho peores y he salido con vida. Además, incluso si me hieren, Daren puede curarme cuando termine la pelea. Ahora date prisa, el tiempo no está de nuestro lado."
