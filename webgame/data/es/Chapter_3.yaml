    texts:
      - source: scene_text
        paragraph: 126
        text: |-
          Acepto seguir su plan, y ella disipa su cúpula.

          "Hay uno allí, justo debajo de esa rama," le digo.

          Envía un cono de hielo en su dirección y le da en el pecho.

          "¡Le diste! Hay otro allí, justo al lado de ese árbol."

          "¿Qué árbol?"

          "Ese."

          "¿De qué lado?"

          "Del izquierdo."

          "¿Cuánto mide?"

          "¿Cuánto mide?..."

          Le calculo la estatura con la mirada.

          "Unos... ¿metro setenta, supongo?"
      - source: scene_text_2
        paragraph: 34
        text: |-
          Envía otro cono de hielo, que le atraviesa la cabeza.

          "Está muerto. Bien, eh, el siguiente está--"

          "Esto está tomando demasiado tiempo," me interrumpe Kate, mientras conjura escudos de hielo flotantes a diestra y siniestra para defendernos de la avalancha de virotes de ballesta. "Tengo una idea."

          Crea dos enormes abanicos hechos de hielo, justo encima de la cortina de humo a nuestra izquierda, y empiezan a moverse solos y a soplar el humo.

          "Está funcionando," dice ella, mientras conjura unos cuantos más para encargarse del resto del humo.

          "¡NO!" grita el hombre con la voz aguda. "¡No dejen que disipe el humo!"

          Ya es demasiado tarde. Ya hay cientos de cuchillas de hielo formándose en el aire, encima de Kate. Las envía volando todas a la vez, en todas las direcciones. Los ballesteros ni siquiera supieron qué los golpeó. Estaban muertos antes de que pudieran levantar la mirada.

          Un último ballestero que logró sobrevivir a la embestida está corriendo hacia nosotros, en un intento desesperado de colocarse detrás de Kate y dispararle antes de que lo note. Kate permanece impasible, y le dispara un cono de hielo directo a la cabeza, haciendo que su cadáver ruede por el suelo, mientras su ballesta cae de sus manos y aterriza unos metros detrás de mí.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch3_ice_hand
  - name: ch3_ice_hand
    texts:
      - source: scene_text
        paragraph: 127
        text: |-
          Después de recoger la ballesta, veo que una enorme mano hecha de hielo está ahora sujetando a su líder por la parte de atrás de su túnica y arrastrándolo hacia nosotros, mientras él lucha frenéticamente por liberarse. Por el aspecto de sus elegantes ropas, parece ser algún noble rico de una de las ciudades más prósperas del oeste. Eso explicaría cómo pudo motivar a tanta gente para seguirlo en esta misión suicida.

          "¡Suéltame! ¡Te lo ordeno! ¡En nombre del duque de Bagelberry! ¡Suéltame!"

          La mano de hielo lo ignora completamente, y lo lanza a nuestros pies. Al vernos, el hombre suelta un fuerte chillido, y salta hacia atrás. Tropieza con sus propios pies y cae de trasero.

          "Por favor... ¡Por favor!" su tono de voz ha cambiado completamente, y parece que está a punto de llorar.

          Se lanza a mis pies.

          "¡Solo quería hacerme famoso ganando el torneo! ¡Siento haberles atacado! ¡Por favor, no me maten! ¡Tengo mucho dinero! Tomen, pueden quedárselo todo. ¡Quédense con todo! Solo perdónenme la vida. ¡Por favor!"

          Lanza una bolsa de monedas de oro al suelo mientras se arroja a mis pies. Esto es bastante dinero. Podría vivir fácilmente la mayor parte de mi vida restante con lujos solo con esta cantidad.
