          - source: scene_text
            paragraph: 199
            text: |-
              Eso fue un poco demasiado arriesgado. Necesito atraer menos la atención si quiero sobrevivir a esta pelea. 

              Empiezo a moverme con más cautela, asegurándome de no ser detectado hasta que tenga una vista clara de todos mis enemigos. Cuando encuentro un grupo más grande, intento distraer a algunos de los hombres y dividir su atención. 

              Luego los elimino metódicamente, aprovechando mi puntería estable y mis tácticas superiores.

              A medida que elimino a más y más de ellos, los ballesteros están empezando a perder gradualmente su voluntad de luchar, y están empezando a huir del campo de batalla en mayor número. No tienen disciplina. Claramente no son soldados. Supongo que tuve suerte en eso. No estoy seguro de lo bien que me habría ido contra profesionales entrenados de verdad.
