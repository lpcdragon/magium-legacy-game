  - name: ch3_second_feeling
    texts:
      - source: scene_text
        paragraph: 153
        text: Una vez que me calmo un poco, de repente me doy cuenta de que esta ha sido la primera vez que he matado a alguien. Fue...
    choices:
      - position: 1
        text: Fácil
        effects:
          - set:
              current_scene: ch3_second_easy
      - position: 2
        text: Necesario
        effects:
          - set:
              current_scene: ch3_second_necessary
      - position: 3
        text: Horroroso
        effects:
          - set:
              current_scene: ch3_second_horrifying
  - name: ch3_second_easy
    texts:
      - source: scene_text
        paragraph: 154
        text: ...fácil. Más fácil de lo que pensé que sería. Tenía miedo de dudar en el último momento, pero el pensamiento nunca cruzó por mi mente. Mis manos y mi cuerpo simplemente se movieron instintivamente como debían, y no hubo movimientos torpes. Esto es un alivio. Probablemente tendré que matar a mucha más gente antes de que este torneo termine. Es bueno saber que no va a afectarme.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch3_glance
            condition: ch3_saved_from_dart = 1
          - set:
              current_scene: ch3_decide_killed
            condition: ch3_saved_from_dart = 0
  - name: ch3_second_necessary
    texts:
      - source: scene_text
        paragraph: 155
        text: ...necesario. No disfruté exactamente, pero era ellos o yo. Estoy seguro de que ellos habrían hecho lo mismo conmigo sin la más mínima traza de duda o remordimiento. En una batalla, hasta la más leve señal de duda puede ser fatal. Todos nos unimos a este torneo sabiendo esto. Sabiendo que podríamos morir en cualquier momento.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch3_glance
            condition: ch3_saved_from_dart = 1
          - set:
              current_scene: ch3_decide_killed
            condition: ch3_saved_from_dart = 0
  - name: ch3_second_horrifying
    texts:
      - source: scene_text
        paragraph: 156
        text: ...horroroso. Mientras miro estos cadáveres manchados de sangre, no puedo evitar pensar que lo que he hecho nunca podrá deshacerse, y siento como si casi pudiera oír los gritos desesperados de los seres queridos de estos hombres, mientras se lanzarían sobre sus cuerpos sin vida. Es decir, si sus cuerpos alguna vez llegan a ellos. No... no puedo dejar que estos sentimientos me abrumen. Hice lo que tenía que hacer. Kate está en peligro. Necesito seguir adelante.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch3_glance
            condition: ch3_saved_from_dart = 1
          - set:
              current_scene: ch3_decide_killed
            condition: ch3_saved_from_dart = 0
  - name: ch3_glance
    texts:
      - source: scene_text
        paragraph: 157
        text: |-
          Echo un vistazo hacia el claro, para ver cómo le va a Kate. Parece que ha renunciado a intentar apuntar a través del humo, y en su lugar ha conjurado unos enormes abanicos hechos de hielo que actualmente están soplando todo el humo.

          A medida que el humo se disipa, puedo ver cientos de cuchillas de hielo formándose en el aire, encima de Kate. Las envía volando todas a la vez, en todas las direcciones. Los ballesteros ni siquiera supieron qué los golpeó. Estaban muertos antes de que pudieran levantar la mirada.

          Parece que en realidad no necesitaba mi ayuda después de todo. Como ya no me queda nada que hacer aquí, vuelvo a donde Kate está de pie.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch3_ice_hand
  - name: ch3_give
    texts:
      - source: scene_text
        paragraph: 158
        text: |-
          "Dame una daga de hielo," le digo.

          "¿Qué?..."

          "Me has oído. Hazme una daga de hielo. Me encargaré de ellos yo mismo."

          "Estás loco. ¿Qué planeas hacer? ¿Matarlos a todos a base de hablar?"

          "O me das esa daga, o voy a ir con las manos desnudas. Tú eliges."

          Una vez que Kate entiende que no voy a cambiar de opinión, forja a regañadientes una daga de hielo y me la entrega. Cuando la agarro, me doy cuenta de que la empuñadura también está hecha de hielo, pero su forma hace que sea lo suficientemente fácil de sujetar, y este no es el momento ni el lugar para quejarme de lo fría que se siente en mi mano.

          "Perfecto," digo. "Ahora abre la cúpula. Y asegúrate de mantenerla cerrada hasta que termine. Quédate a la defensiva todo el tiempo que puedas. No tomes ningún riesgo estúpido."

          "¿Estás seguro de esto?"

          "Tan seguro como puedo estar, dadas las circunstancias. Hazlo."

          Crea una salida lo suficientemente ancha para que yo quepa, mientras salgo y corro hacia el bosque.

          Cuando llego al bosque, noto a un hombre detrás de un árbol, recargando su ballesta. Está de espaldas a mí, y todavía no me ha oído llegar.
    choices:
      - position: 1
        text: Matarlo con mi daga
        effects:
          - set:
              current_scene: ch3_first_kill
              ch3_first_killed: 1
      - position: 2
        text: Usar la empuñadura de la daga para dejarlo inconsciente
        effects:
          - set:
              current_scene: ch3_first_knock
