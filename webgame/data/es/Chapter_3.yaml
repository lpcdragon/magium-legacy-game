            text: Continuar
            effects:
              - set:
                  current_scene: ch3_glance
                condition: is_dead = 0 AND ch3_saved_from_dart = 1
              - set:
                  current_scene: ch3_decide_alive
                condition: is_dead = 0 AND ch3_saved_from_dart = 0
