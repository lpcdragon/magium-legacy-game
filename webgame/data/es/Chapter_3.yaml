  - name: ch3_clobber
    texts:
      - source: scene_text
        paragraph: 184
        text: |-
          Miro a mi alrededor y encuentro un árbol caído que parece tener el tamaño justo para mis intenciones y propósitos. No se esperarán esto.

          Levanto el árbol del suelo y lo lanzo directamente a mi atacantes. El árbol golpea a cinco de ellos de frente, y quedan completamente aplastados bajo su peso. El resto está gritando o simplemente aturdido por el impacto.

          "¡M-M-Monstruo! ¡¡¡MUERE!!!" grita uno de ellos, mientras me dispara con su ballesta.

          Levanto otro árbol caído del suelo y lo uso como escudo para defenderme del perno de su ballesta. Luego lo empuño como una porra y lo uso para aplastar su cabeza contra el árbol enraizado más cercano. Mientras levanto mi porra de gran tamaño para contemplar a mi atacante, noto que no queda nada de la cabeza del hombre, excepto por la pasta roja salpicada en los árboles.
           
          Los otros cuatro hombres empiezan a gritar a todo pulmón. Uno de ellos tiene tanta prisa por irse que tropieza y cae, otro literalmente se meó encima, y los otros dos huyen tan rápido como sus piernas pueden llevarlos, y tan lejos del campo de batalla como sea posible.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch3_clobber2
