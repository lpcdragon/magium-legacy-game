            paragraph: 191
            text: |-
              No hay necesidad de contenerse. Dispararé a matar, y ellos no están en posición de detenerme.

              Uno por uno, los ballesteros caen ante mí, mientras sigo retrocediendo, más profundamente en el bosque. Sus disparos están muy lejos del blanco. Ahora están intentando usar los árboles como cobertura en un intento de flanquearme. Sin embargo, mis habilidades de observación parecen ser tan agudas ahora que incluso puedo prestar atención a múltiples objetivos al mismo tiempo.

              Cada vez que uno de ellos intenta correr hacia el siguiente árbol, lo elimino en un instante. Cada vez que uno de ellos intenta rodearme, le disparo desde lejos. 

              Al final, sólo uno de ellos permanece en pie. Al ver lo que les pasó a sus camaradas, abandona su puesto y echa a correr, intentando alejarse lo más posible del campo de batalla.

              Puede que sea rápido, pero no puede escapar de mi vista. Le apunto con mi ballesta y le disparo en la nuca, matándolo instantáneamente.
