        texts:
          - source: scene_text
            paragraph: 99
            text: |-
              Guardo el dispositivo y entro en la cueva. Despertamos a Kate y ella sale a vigilar la entrada, mientras Daren y yo nos dormimos.

              Despierto con la voz de Kate varias horas después. Está susurrando y asegurándose de que Daren no pueda oírnos.

              "Despierta, Stillwater," dice ella. "Necesito tu ayuda con algo."

              "Espera, ¿necesitas MI ayuda?"

              "Calla, vas a despertar a Daren. Sí, necesito que vengas conmigo y eches un vistazo a algo. No te llevará más de un minuto."

              "¿Y por qué debería ayudarte? Todo lo que has hecho es hacerme la vida imposible desde que nos conocimos."

              "Porque entonces te debería un favor. Y yo siempre pago mis deudas."
          - source: scene_text_2
            paragraph: 17
            text: |-
              Está hablando en serio. Esto debe ser más importante para ella de lo que aparenta.

              "¿Por qué me pides esto a mí y no a Daren? ¡Él es el mago legendario aquí, no yo!"

              "Porque a diferencia de él, pareces ser muy conocedor de las complejidades más oscuras de la magia. No se ven muchas personas hoy en día que sepan cómo funciona un potenciador de estadísticas. Además, tengo algo que quiero preguntarte en privado. Así que ven, antes de que despertemos a Daren."

              Salimos de la cueva y nos dirigimos hacia los árboles. La luna todavía está bastante alta en el cielo. No pueden haber pasado más de dos o tres horas desde que me quedé dormido.

              Mientras caminamos en un silencio incómodo durante unos minutos, decido que bien podría intentar iniciar una conversación.
        choices:
