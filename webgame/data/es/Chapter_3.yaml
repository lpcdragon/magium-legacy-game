            paragraph: 214
            text: |-
              Al acercarme al campo de batalla, me horroriza ver que todos los hombres que salieron del bosque para rendirse han sido ejecutados sumariamente.

              "Kate, ¿qué hiciste?", le pregunto.

              "Les ofrecí una muerte rápida e indolora. ¿No es eso lo que dijeron que nos darían si nos rendíamos?".

              "¿Pero tenías que matarlos a cada uno de ellos?".

              "Sí, tenía que hacerlo".

              Suspira.

              "Escucha, Barry. Sé que puede que no estés acostumbrado a esto, pero tienes que entenderlo. No estamos en una situación en la que pudiéramos mantener de forma realista a un número tan grande de prisioneros. Y no es que hayan hecho nada ilegal, así que tampoco podríamos entregarlos a las autoridades locales. Si los hubiéramos atado y dejado aquí, habrían muerto de hambre o habrían sido asesinados por alguien más. Si simplemente los hubiéramos dejado ir, seguro que vendrían a por nosotros para vengarse más tarde. No había otra forma".
          - source: scene_text_2
            paragraph: 52
            text: |-
              "Supongo... que tienes razón", le digo con vacilación. "Supongo que hemos terminado aquí, entonces. Volvamos a nuestra cueva".

              "Seré honesta", dice Kate, mientras regresamos al campamento. "Realmente no esperaba que lo lograras".

              "Sí. Yo tampoco".

              "Ya te debo dos, Barry. ¿Alguna vez pensaste en abrir un banco?".

              "Lo pensaré cuando termine el torneo".

              Pasamos el resto de nuestro viaje de regreso en silencio. Pero ya no me resultaba incómodo. Después de todo lo que pasamos esta mañana, un poco de silencio es más que bienvenido.
