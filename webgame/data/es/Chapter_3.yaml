    texts:
      - source: scene_text
        paragraph: 207
        text: |-
          Por la forma en que está actuando, dudo que vuelva a reunir el valor para atacarnos de nuevo. 

          "Muy bien. Aceptaré tu dinero a cambio de tu vida. Ahora lárgate de mi vista. No quiero volver a verte nunca más".

          "¡N-N-No me volverás a ver! ¡Lo prometo!"

          Se pone en pie rápidamente y huye tan rápido como puede, sin mirar atrás. Lo veo irse hasta asegurarme de que se ha ido para siempre, luego agarro la bolsa de monedas y me dirijo hacia Kate.
