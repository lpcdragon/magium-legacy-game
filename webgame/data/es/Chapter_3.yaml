            paragraph: 108
            text: |-
              "Hay algo que me ha estado molestando desde que nos conocimos ayer," dice ella.

              "Cuando Daren y tú me vieron por primera vez, empezaron a cuchichear entre ustedes durante como un minuto. Dijiste que estaban intentando decidir si yo era una banshee o no, y Daren dijo que ya habían establecido que no lo era."

              Hace una pausa antes de continuar.

              "La pregunta es por qué. Decidí buscar la ayuda de Daren porque me engañé a mí misma pensando que alguien tan bondadoso como él no me sentenciaría a muerte. Pero ahora que he despejado mi mente y lo he pensado, me doy cuenta de cuánto me he puesto en riesgo al mostrarme ante él. ¿Por qué decidió Daren que yo no era una banshee cuando todas las pruebas apuntaban a lo contrario?"

              Kate todavía no confía en mí. Si le digo que yo fui quien convenció a Daren de perdonarle la vida, o no me va a creer, o va a sospechar de mis motivos y perderá completamente la confianza en Daren. ¿Quizás me crea si le digo que fue Daren quien decidió no purificarla?
