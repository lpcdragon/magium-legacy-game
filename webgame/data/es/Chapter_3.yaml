  - name: ch3_lift
    routes:
      - condition: strength = 3 AND ch3_tried_lift = 1 AND ch3_prioritize >= 3
        texts:
          - source: scene_text
            paragraph: 169
            text: |-
              Mis ojos no pueden creer lo que están viendo. Acabo de lograr levantar todo el árbol del suelo. Y estoy bastante seguro de que también podría lanzarlo si quisiera. Esto es una locura. Debe pesar al menos doscientos kilos. Esto va mucho más allá de cualquier cosa que hubiera soñado lograr con mi dispositivo de estadísticas. Esto es sobrehumano.

              Con este tipo de arma a mi disposición, puede que ni siquiera necesite velocidad o puntería. Hay árboles caídos por todas partes a mi alrededor. Todo lo que necesito hacer es recogerlos y usarlos para aporrear a alguien, o incluso lanzárselos a la gente.

              En cualquier caso, el tiempo se agota. Necesito elegir una estrategia y ceñirme a ella.
