              Al llegar a la barrera de Kate, empiezo a concentrarme específicamente en la cueva, y después de hacer eso, tal como Kate dijo, mi mente se aclara y soy capaz de continuar mi camino. Cuando finalmente llego a nuestro campamento, despierto a Daren sacudiéndolo violentamente.

              "¡Daren! ¡Despierta! Kate está en problemas. Tienes que ayudar. ¡Rápido!"

              "¿Qué?... ¿Qué hora es?"

              "¡No hay tiempo! Tienes que venir conmigo. ¡Por favor!"

              Daren se pone rápidamente su armadura y me sigue fuera de la cueva.
          - source: scene_text_2
            paragraph: 33
            text: |-
              "¡Santo cielo, Barry, cuánto se alejaron ustedes dos!" pregunta Daren mientras corremos hacia Kate.

              No le doy respuesta y empiezo a correr más rápido. Cuando llegamos a nuestro destino, notamos que todo está completamente en silencio, y hay muchos cadáveres en nuestro camino. Una vez que estamos lo suficientemente cerca de Kate como para verla, empezamos a entender por qué no hay ruidos provenientes del campo de batalla. Kate está sentada de rodillas, con la cabeza inclinada hacia abajo, y ambas manos sujetando la empuñadura de una espada de hielo clavada en el suelo. Tanto Kate como su espada de hielo están cubiertas de sangre, y el suelo a su alrededor está sembrado de cadáveres. Cuando nos oye acercarnos, levanta ligeramente la cabeza para mirarnos y dice:

              "Lo siento, ¿dónde están mis modales? Debería haberles dejado al menos unos cuantos supervivientes a ustedes dos."

              Al terminar su frase, suelta su espada y cae de cara al suelo.

              "¡¡¡Kate!!!" grita Daren mientras corre a su lado. Empieza a lanzar su hechizo de curación, pero parece tener dificultades. Después de unos minutos, termina su hechizo, pero Kate todavía no se ha despertado, y algunas de sus heridas no se han cerrado.

              "Este tipo de daño no va a desaparecer simplemente con un hechizo de curación básico," dice Daren. "Va a necesitar bastante tiempo para recuperarse completamente. Al menos ya no está en ningún peligro mortal. ¿Te importaría decirme cómo a ustedes dos se les ocurrió la brillante idea de alejarse tanto de nuestro campamento sin despertarme?"
