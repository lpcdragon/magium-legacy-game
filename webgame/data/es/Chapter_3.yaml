  - name: ch3_vantage
    routes:
      - condition: perception < 1
        texts:
          - source: scene_text
            paragraph: 87
            text: |-
              Mientras hacemos la guardia, Daren empieza a contarme historias sobre sus viajes por el mundo y las aventuras que ha tenido. Me habla de los gigantes de quince metros que viven en el lejano este del Continente Norte. Me cuenta cómo curó él solo la temida peste de Iknar del Continente Oriental, y cómo derrotó al guiverno verde del norte.

              Escucharle contar todas estas historias me hizo comprender por qué le defendí instintivamente de Dave el Degollador ayer. Aunque nunca lo había pensado realmente antes, supongo que siempre le admiré de alguna manera. Es como todos esos héroes de los cuentos de hadas que solía leer de niño, y es un ejemplo vivo de lo que siempre he aspirado a ser.

              "He estado en muchos lugares a lo largo de los años, Barry. Pero dondequiera que voy, siempre es lo mismo. Los fuertes oprimen a los débiles, los muchos matan a los pocos. Dondequiera que voy, hay gente muriendo de hambre, peste, guerra o alguna invasión de monstruos. He visto la muerte toda mi vida, pero nunca me acostumbro a ella. Ver todos esos cadáveres ahí tirados, sin vida, ayer... Me hizo sentir un dolor intenso en el pecho. Era como si pudiera sentir el sufrimiento de cada uno de ellos, y el miedo que recorrió sus corazones al exhalar su último suspiro. ¿Y tú, Barry? ¿Qué sentiste cuando viste a todos esos muertos?"
