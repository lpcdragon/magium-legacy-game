          - source: scene_text_2
            paragraph: 38
            text: |-
              Disparo dos tiros más, todavía apuntando a sus piernas, y ambos hombres caen al suelo con un fuerte golpe.

              El último hombre en pie dispara un virote hacia mí, pero lo esquivo en el último segundo, y apunto hacia él.

              Noto demasiado tarde que uno de los hombres en el suelo logró recuperar su ballesta y la está apuntando directamente hacia mí.

              Por un momento, sentí como si el tiempo se hubiera detenido en seco. Podía ver el virote de ballesta en el aire, dirigiéndose hacia mí. Rápidamente di un paso lateral a la izquierda, y casi pude sentir el viento del virote, mientras pasaba junto a mi cabeza. Luego inmediatamente apunté mi ballesta al último hombre que seguía de pie.

              Una vez que le disparé, cayó al suelo como todos los demás, gritando de dolor. Rápidamente me alejé, antes de que sus gritos atrajeran a otros ballesteros a este lugar. Estos no estaban en posición de seguirme.
