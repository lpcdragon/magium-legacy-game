        paragraph: 137
        text: |-
          "En realidad, preferiría ayudar luchando contra los enemigos cuerpo a cuerpo. ¿Podrías hacerme una daga de hielo?"

          "¿En serio?..."

          Kate hace una pausa para reflexionar sobre mis palabras.

          "Bien, haz lo que quieras," dice finalmente, mientras conjura una daga de hielo y me la entrega.

          Cuando la agarro, me doy cuenta de que la empuñadura también está hecha de hielo, pero su forma hace que sea lo suficientemente fácil de sujetar, y este no es el momento ni el lugar para quejarme de lo fría que se siente en mi mano.

          Abre su cúpula de hielo, mientras yo salgo y corro hacia el bosque.

          Una vez que he pasado a través de la cortina de humo, noto a un hombre detrás de un árbol, recargando su ballesta. Está de espaldas a mí, y todavía no me ha oído llegar.
