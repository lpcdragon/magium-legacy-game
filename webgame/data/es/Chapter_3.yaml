            paragraph: 187
            text: |-
              Los dejo huir. No tengo tiempo para lidiar con desertores cobardes. Los otros dos hombres pronto siguen los pasos de sus aliados y, a medida que se alejan, se desvanecen lentamente en la oscuridad.

              Lo que siguió fue una masacre. No hubo necesidad de esconderme. Ni necesidad de una estrategia. Simplemente los abrume con fuerza bruta. Más de la mitad del batallón enemigo se desmoronó en cuestión de minutos. El resto estaba demasiado asustado para luchar más, y simplemente corrieron tan rápido como pudieron, en cualquier dirección, siempre que fuera lo más lejos posible de mí.
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: ch3_crossbowmen_finish
      - condition: ch3_prioritize = 4 AND ch3_final_decision = 1
        texts:
          - source: scene_text
            paragraph: 186
            text: |-
              Primero, me encargo de los que huyen. Por suerte para mí, ambos corren en línea recta, así que simplemente les lanzo mi árbol. Están demasiado aterrorizados como para pensar siquiera en mirar atrás, así que no tienen oportunidad de quitarse del camino de mi proyectil. El árbol aterriza sobre ambos y los aplasta en un instante. 

              Como me estoy quedando sin árboles caídos que sean lo suficientemente ligeros para levantar, levanto una gran roca del suelo y se la lanzo al hombre que tropezó y cayó mientras intentaba huir, y que ahora está intentando escapar de nuevo. Mi lanzamiento tenía tanta potencia que cuando la roca golpeó al ballestero, literalmente lo levantó del suelo y lo estrelló contra el tronco de un árbol cercano.

              El último hombre vivo, el que se mojó los pantalones, está ahora de rodillas e inclinando la cabeza.

              "¡P-P-Por favor! ¡Piedad!", me dice.

              "No", respondo secamente, mientras recojo una rama del suelo y le aplasto la cabeza.
