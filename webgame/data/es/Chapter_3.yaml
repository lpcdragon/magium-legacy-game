            text: |-
              Mientras hablamos, de repente escucho una voz lejos detrás de mí.

              "¿Qué estás esperando? ¡Dispárale!"

              Me giro inmediatamente, intentando identificar el origen del sonido.

              Quienquiera que estuviera hablando debe estar escondido detrás de los árboles, pero está demasiado oscuro para verlos con claridad.

              "¿Qué ha pasado?" pregunta Kate. "¿Qué estás buscando?"

              Antes de que tenga la oportunidad de reaccionar, un dardo golpea a Kate en su hombro izquierdo, y ella cae de rodillas.

              "Estoy bien..." dice Kate, aunque claramente está mintiendo. Respira con dificultad y parece estar luchando por mantener la consciencia.

              Puedo oír a un hombre reír desde detrás de los árboles. Su voz es aguda, y podría confundirse fácilmente con la de una mujer, si no estuvieras prestando atención.

              "Como era de esperar de una banshee," grita el hombre. "Incluso un dardo somnífero tan caro como este no es suficiente para derribarte. Pero apenas puedes mantenerte en pie. El resultado de esta batalla está claro. Ríndete ahora, y te mostraremos piedad. Les concederemos a ti y a tu compañero humano una muerte rápida e indolora."
