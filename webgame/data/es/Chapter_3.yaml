            text: |-
              Noto que las estrellas no solo brillan de forma inusual esta noche, sino que también parece haber una cierta simetría entre ellas, casi como si formaran símbolos en el cielo.

              De repente me doy cuenta de que los símbolos son de una lengua antigua que mi dispositivo de estadísticas me ha enseñado. Si leo todos los signos juntos, la frase podría traducirse aproximadamente como: "El dragón sabe dónde encontrar la fuente de toda la magia".

              ¿Significa eso que hay un dragón en este continente? ¿Y que conoce la ubicación del Magium? He oído hablar de hechizos que iluminan las estrellas para transmitir información, pero solo en los cuentos de hadas. Y lo mismo ocurre con los dragones. Debe de ser una coincidencia. Intento olvidar lo que he visto y me centro en vigilar la cueva.
