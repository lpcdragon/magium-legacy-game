            paragraph: 11
            text: |-
              "Me temo que esta vez tendré que estar de acuerdo con Kate, doctor", dice Daren. "Estaba bastante claro que el rey del subsuelo no estaba nada contento con la gran cantidad de apoyo que Kelrim estaba obteniendo, y ya debe haberse dado cuenta de que tratar de ganar contra él en una elección justa simplemente ya no es posible. Lamentablemente, creo que mantener al rey del subsuelo como aliado puede que ya no sea una opción para nosotros después de lo que pasó allí en la sala de espera. Las únicas dos opciones que nos quedan son aceptar el trato del Supervisor para tenderle una emboscada al rey junto con él o encargarnos de él. De cualquier manera, probablemente deberíamos... oye, espera un minuto... Olvidé por completo comprobarlo, pero Albert no habría estado siguiéndonos de forma invisible todo este tiempo, ¿verdad?"

              "Relájate", dice Arraka. "Si te estuviera siguiendo, te lo habría contado."

              "Correcto", dice Daren, luciendo algo poco convencido. "De todos modos, lo que iba a decir es que probablemente todos deberíamos tomarnos un tiempo para enfriar nuestras cabezas y llegaremos a una decisión juntos más tarde en la noche. Separémonos y continuemos con nuestros entrenamientos individuales o lo que sea, y nos reuniremos frente a nuestros dormitorios en unas horas. Los llamaré a través de los transceptores cuando sea el momento de reunirnos".
            condition: b3_ch8_king = 5
