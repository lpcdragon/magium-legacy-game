          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch08b_king2
      - condition: b3_ch8_king = 2
        texts:
          - source: scene_text
            paragraph: 6
            text: |-
              "En ese caso, mi voto es para Breynan".

              "¿Breynan, dices?" pregunta el rey, mientras se acaricia la barbilla. "¿Puedo preguntarte qué te hizo elegirlo sobre los demás?"

              "Bueno, él es uno de los tres líderes rebeldes y siento que tiene una buena cabeza sobre sus hombros", digo. "Ser una de las figuras clave de la rebelión debería hacerlo lo suficientemente reconocible para que la gente de Ollendor lo reconozca como rey, y parece lo suficientemente sabio como para poder liderar este reino en la dirección correcta".

              "Lo que dices es cierto, pero los rasgos que has descrito también podrían aplicarse fácilmente a cualquiera de los otros dos líderes rebeldes", dice el rey del subsuelo. "Además, debería ser bastante obvio para cualquiera que haya pasado más de unos minutos con Breynan que no es exactamente la persona más carismática que existe, especialmente si lo comparas con Peter o Albert. Por lo que he observado, Peter es el tipo de líder que inspira a las personas a través de su buena voluntad, Albert las inspira a través de su fuerte personalidad, y Breynan es el tipo que es tolerado por sus subordinados porque proporciona resultados. Si bien admito que probablemente sería un rey competente, y su corazón es más Ciertamente en el lugar correcto, dudo mucho que obtenga mucho apoyo de la gente".

              "¿Estás seguro de que no estás diciendo esto sólo porque él es el único de los tres líderes rebeldes que se opone abiertamente a ti y a tus métodos?" digo.
          - source: scene_text_2
            paragraph: 3
            text: |-
              "En absoluto", dice el rey. "De hecho, solo haría mi vida más fácil si él fuera quien compita contra mí, porque en mi opinión, sus posibilidades de obtener más votos que yo son extremadamente escasas. Si Breynan desea anunciar su candidatura al trono, entonces lo invito a hacerlo. Estoy seguro de que nuestros hombres disfrutarán escuchándonos a los dos mantener un debate. Ahora bien, ¿a su grupo le gustaría hacer alguna otra sugerencia aparte de Breynan, o están todos de acuerdo con la propuesta de su amigo?"

              "Me gustaría proponer al doctor Reidzek como candidato", dice Daren, mientras el padre de Leila vuelve la cabeza hacia él con expresión de asombro.

              "Una excelente elección!" El rey del subsuelo le dice a Daren, después de echar una rápida mirada hacia el padre de Leila, que observe su reacción. "El Doctor Reidzek se ha convertido en un miembro muy respetado de nuestra sociedad en el poco tiempo que nos ha honrado con su presencia, por lo que no tengo dudas de que reuniría muchos votos si aceptara participar en nuestras elecciones. ¿Qué dice, doctor? ¿Debería poner su nombre en las listas de candidatos?"

              "Tengo... miedo de no participar en las elecciones", dice el padre de Leila. "Lo siento, Daren, pero convertirme en rey sería una responsabilidad demasiado grande para un simple inventor como yo. Me uní a esta rebelión porque quería ayudar a mejorar esta ciudad, pero la idea de liderar un reino entero es demasiado para mí. Espero no haber terminado decepcionando a ninguno de ustedes al decir esto".

              "Umm, no... ¡por supuesto que no!" dice Daren. "Es tu elección si quieres ser rey o no. Sólo estaba haciendo una sugerencia, eso es todo..."
