        texts:
          - source: scene_text
            paragraph: 26
            text: |-
              "Incluso si fuera posible descubrir sus verdaderas intenciones", dice Daren, "todavía sería una mala idea contarle al rey sobre nuestra conversación con el Supervisor, porque eso casi garantizaría nuestra exclusión de la misión de mañana. Con lo suspicaz que suele ser el rey del subsuelo con las cosas más pequeñas, realmente no veo cómo podría confiar en nosotros de ningún modo después de enterarse de que estamos teniendo conversaciones secretas con el Supervisor en su propia base subterránea. No creo que podamos obtener más información ni del rey del subsuelo ni del Supervisor, así que tendremos que pensar detenidamente y decidir de qué lado estaremos al final del día. De cualquier manera, probablemente deberíamos... oye, espera un minuto... Olvidé por completo comprobarlo, pero Albert no habrá estado siguiéndonos de forma invisible todo este tiempo, ¿verdad?"

              "Relájate", dice Arraka. "Si te estuviera siguiendo, te lo habría contado."

              "Correcto", dice Daren, luciendo algo poco convencido. "De todos modos, lo que iba a decir es que probablemente todos deberíamos tomarnos un tiempo para refrescar nuestras cabezas y tomaremos una decisión juntos más tarde en la noche. Separémonos y continuemos con nuestros entrenamientos individuales o lo que sea, y nos reuniremos frente a nuestros dormitorios en unas horas. Te llamaré a través de los transceptores cuando sea el momento de reunirnos. Ah, y también le contaré a Breynan sobre nuestra reunión, para que podamos decidir junto con él si queremos unirnos al grupo. Del lado del Supervisor o no."

              "Me parece bien", dice Hadrik. "Muy bien, nos vemos luego. Voy a ver si puedo mejorar un poco más mi nueva técnica de cambio de forma".
