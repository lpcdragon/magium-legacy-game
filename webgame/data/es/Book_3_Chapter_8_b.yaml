  - name: b3_ch08b_hadrik6
    texts:
      - source: scene_text
        paragraph: 51
        text: |-
          "No estoy seguro de si 'cambio' es la palabra que usaría", digo. "Para mí, parece más bien que ha vuelto parcialmente a su antigua personalidad. La que tenía hace cinco mil años, antes de quedar atrapada en una montaña, luego obligada a habitar cuerpos de animales débiles y luego puesta dentro de un amuleto. Todos vimos cómo actuaba la Arraka del pasado durante el ritual. Era como una persona completamente diferente. No hacía chistes ni mataba gente solo por divertirse. Tenía concentración. Creo que el extraño sentido del humor de nuestra Arraka es algo que empezó a desarrollar después de ser desterrada aquí y después de darse cuenta de que no podía encontrar una manera de regresar al plano mágico. Solo empezó a perder el tiempo porque perdió su propósito inicial de vengarse de los dioses, pero ahora que lo ha recuperado, también ha recuperado su concentración, por lo que está actuando menos como una bromista y más como su yo anterior."

          "Eh..." dice Hadrik. "Si me preguntas, incluso la 'bromista' Arraka todavía tenía sus momentos. Por ejemplo, su decisión de no revelar mi prueba del Dios del Tiempo fue tomada antes de que comenzara a ponerse seria. Todavía me sorprende que ella realmente haya esperado a que yo hablara de ello yo misma, en lugar de usarlo para burlarse de mí, para ser honesto. Supongo que incluso alguien como ella puede mostrar algo de decencia básica de vez en cuando".
      - source: scene_text_2
        paragraph: 42
        text: |-
          "No", digo. "Lo que esto demuestra es que ella te está dando un trato preferencial. Quizás tu relación con ella esté progresando sin que te des cuenta".

          "¡Ja!" dice Hadrik. "¿Quién sabe? ¡Tal vez debería preparar los anillos de boda después de todo!"

          Durante las siguientes horas, Daren, Hadrik y yo continuamos hablando sobre varios temas que nos vinieron a la mente de improviso.
      - source: scene_3
        paragraph: 25
        text: |-
          Durante este tiempo, Hadrik intentó en múltiples ocasiones que nos uniéramos a él en su maratón de bebida, pero afortunadamente logramos mantenernos firmes y, al final, Daren y yo bebimos cada uno menos de una botella de cerveza enana, que ya era suficiente para emborracharnos razonablemente. Cuando regresamos a nuestra habitación, despertamos a Leila y Kate para que pudieran comenzar su propio turno de noche y luego nos acostamos.

          Cuando me desperté varias horas más tarde, me alegré de ver que no tenía resaca, lo que significaba que, después de todo, no me excedí con el alcohol la noche anterior. La mayoría de los demás aparentemente ya se habían levantado de la cama y estaban listos para irse, así que decidí levantarme también y comenzar a prepararme para el largo día que nos esperaba. Poco después de que terminé con mis preparativos, Kate y Leila regresaron de su turno de noche y todos nos reunimos frente a nuestra habitación para poder irnos juntas.
