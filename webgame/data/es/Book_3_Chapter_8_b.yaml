chapter_effects:
  - condition: b3_ch3_stats_unavailable = 1
    effects:
      - disable stats
  - condition: b3_ch3_stats_unavailable = 0
    effects:
      - enable stats
scenes:
  - name: b3_ch08b_pardon
    routes:
      - condition: b3_ch6_kelrim <> 1 AND b3_ch6_plan <> 3
        texts:
          - source: scene_text
            paragraph: 3
            text: |-
              "Perdóneme", escucho la voz del rey del subsuelo, y cuando me doy la vuelta, veo que ahora está parado justo a nuestro lado. "Espero no interrumpir nada demasiado importante, pero hay algunos asuntos relacionados con el Supervisor que me gustaría discutir con su grupo, y como ya están todos reunidos aquí, pensé que este sería un buen momento para iniciar una conversación".

              Cuando miro a mi alrededor, de repente me doy cuenta de que ya habíamos llegado a la sala de espera desde hacía un rato, aunque he estado demasiado absorto en nuestra conversación como para darme cuenta. El gran salón está iluminado sólo con antorchas, no quedan cristales en sus paredes y techos después de las recientes explosiones, y actualmente está poblado por bastantes rebeldes y refugiados, aunque la mayoría de ellos son personas que solo he visto de pasada. De las personas con las que he interactuado, reconozco a Albert y Peter, quienes están parados al lado del rey, y por supuesto a Desmond, quien todavía está vigilando la puerta de la área de cuarentena, como de costumbre.

              "No es ninguna molestia", le dice Daren al rey del subsuelo. "En realidad también te estábamos buscando. ¿Estaría bien si te hiciéramos una breve pregunta antes de comenzar a hacer nuestros planes con respecto al Supervisor?"

              "Por supuesto", dice el rey. "¿Qué querías preguntar?"
          - source: scene_text_2
            paragraph: 2
            text: |-
              "Nos preguntábamos si ya has decidido quién será el próximo rey de Ollendor", dice Daren.

              "Nosotros... aún no hemos llegado a una conclusión definitiva", dice el rey del subsuelo, mientras él y Albert intercambian una breve mirada, "pero el escenario más probable es que elegiremos un consejo gobernante tan pronto como la situación en Ollendor se estabilice".

              "Una vez que la situación se estabilice..." repite Daren detrás del rey. "¿Y qué pasa antes de eso? ¿Qué va a pasar inmediatamente después de que el Supervisor ya no sea una amenaza?"
          - source: scene_3
            paragraph: 2
            text: |-
              "Habrá un... período de transición en el que necesitaremos un líder fuerte que pueda unificar a las masas y asegurarse de que no se desvíen en este momento de crisis", dice el rey del subsuelo. "La muerte del viejo rey ya será un shock para muchos de los habitantes de Ollendor, por lo que debemos evitar darles aún más motivos de preocupación al cambiar también el sistema de gobierno de inmediato. El cambio debe realizarse gradualmente, y la idea de un consejo elegido tendrá que ser presentada por un rey que conozcan y en el que confíen".

              "¿Y quién será este 'rey que ellos conocen y en el que confían'?" Pregunta Kate, en un tono ácido. "¿Eres tú?"

              "Si eso es lo que quiere la gente, entonces no dudaría en aceptar esta gran responsabilidad", afirma el rey del subsuelo. "Sin embargo, aún no se ha decidido quién será este rey temporal y, por supuesto, puedes hacer tus propias sugerencias sobre quién crees que sería el más adecuado para asumir este papel tan importante".
        choices:
          - position: 1
            text: ¿Qué tal Albert?
            effects:
              - set:
                  current_scene: b3_ch08b_king
                  b3_ch8_king: 0
          - position: 2
            text: Creo que Peter sería un buen rey.
            effects:
              - set:
                  current_scene: b3_ch08b_king
                  b3_ch8_king: 1
          - position: 3
            text: En ese caso, mi voto es para Breynan.
            effects:
              - set:
                  current_scene: b3_ch08b_king
                  b3_ch8_king: 2
          - position: 4
            text: Si me preguntas, creo que el rey del subsuelo sería la mejor elección.
            effects:
              - set:
                  current_scene: b3_ch08b_king
                  b3_ch8_king: 3
