  - name: b3_ch08b_kelrim
    texts:
      - source: scene_text
        paragraph: 8
        text: |-
          "Si lo que estás buscando es un rey digno de confianza, entonces Kelrim sería mi elección".

          "¿El Goblin?..." dice el rey del subsuelo, pareciendo por primera vez como si realmente se hubiera quedado sin palabras. "¿Un Goblin como nuevo rey de Ollendor? Esa es sin duda una... recomendación única. No quiere decir que no la tomaremos en consideración, por supuesto, pero... eh... ¿a alguien más le gustaría hacer alguna otra sugerencia?"

          "De hecho, también me gustaría dar mi voto a Kelrim", afirma Daren. "Tengo todas las razones para creer que sería un rey excelente".

          "¿A-acabo de escuchar eso verdad?" Dice Kelrim, mientras ahora se acerca rápidamente a nosotros. "Daren, ¿acabas de proponerme como candidato al trono?..."

          "Bueno, para ser más exactos, Barry fue quien te propuso matrimonio primero, pero sí, también estoy de acuerdo con él", dice Daren.
      - source: scene_text_2
        paragraph: 7
        text: |-
          "Yo... les agradezco a ambos por la confianza que han puesto en mí", dice Kelrim, mientras nos mira a los dos por turno, "pero tienen que entender... un Goblin como rey de una ciudad que está compuesta en su mayoría por humanos sería algo completamente sin precedentes. Ya estoy inmensamente agradecido con los ciudadanos de Ollendor por aceptar suficientes razas de monstruos para permitirnos vivir dentro de su ciudad, pero incluso pensar en convertirme en su gobernante siento que me estaría aprovechando demasiado de su generosidad. Y Además, no puedo pensar en nadie más que ustedes dos que considerarían darme su apoyo en este asunto. Lo siento mucho, pero--"

          "¡Te daría mi apoyo!" escuchamos a un hombre hablar en voz alta, mientras sale de la área de cuarentena y cierra la puerta detrás de él.

          El hombre lleva ropa hecha jirones y parece que apenas se está de pie, pero su físico imponente y la expresión implacable en sus ojos le dan una especie de mirada digna incluso en el estado en el que se encuentra.

          "Hermano, ¿qué estás haciendo aquí?" Desmond dice de repente, viéndose muy preocupado. "Aún te estás recuperando. ¡Deberías estar en cama!"

          "¡Disparates!" Dice el hombre que salió de la área de cuarentena, mientras ahora cojea lentamente hacia nosotros. "Como bien puedes ver, ¡estoy en forma como un violín!"

          "¿Ese es el hermano de Desmond?" Le pregunto a Daren en voz baja. "¿Cómo es que ya puede caminar? Pensé que estaba al borde de la muerte apenas ayer."
      - source: scene_3
        paragraph: 4
        text: |-
          "No tengo idea", me responde Daren. "He visto muchas recuperaciones rápidas en mi vida, pero nunca hasta tal punto. Necesitaría una inmensa fuerza de voluntad incluso para ponerse de pie en el estado en el que se encuentra ahora".

          "¿Cómo escuchaste nuestra conversación desde dentro de la área de cuarentena?" Albert le pregunta al hermano de Desmond cuando se acerca a nosotros. "¿Nos has estado espiando a través de la puerta todo este tiempo?"

          "Bueno, no TODO el tiempo", dice el hermano de Desmond mientras se detiene en algún lugar cerca de Kelrim, mientras se apoya con un brazo en el hombro de Daren, para mantener el equilibrio. "Inicialmente quería sorprender a mi hermano pequeño mostrándole lo vivaz que era, pero su discusión fue tan interesante que no pude evitar detenerme a escucharla. En realidad no planeaba intervenir hasta que estas buenas personas de aquí nominaron a nuestro buen amigo Kelrim como el nuevo rey, momento en el cual supe inmediatamente que tenía que presentarme y anunciarle mi apoyo".

          "¿Es ese Sir Horacio?" Escucho a una persona entre la multitud en la sala de espera. "¡Por los dioses, es realmente él! Está vivo. ¡Sir Horace está vivo!"

          "¡Tienes razón!" dice otro hombre. "¡Está vivo y bien! ¡Gracias a los dioses!"

          "¡Sir Horace ha regresado con nosotros!" dice una tercera persona, en tono emocionado. "¡Ha regresado!"
