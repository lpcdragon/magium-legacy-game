        text: Bueno, ¡creo que tu voz suena maravillosa!
        effects:
          - set:
              current_scene: b3_ch08b_leila3
              b3_ch8_voice: 1
      - position: 2
        text: ¡Ah, esa es la razón por la que tu voz sonó tan artificial y antinatural!
        effects:
          - set:
