  - name: b3_ch08b_king
    routes:
      - condition: b3_ch8_king = 0
        texts:
          - source: scene_text
            paragraph: 4
            text: |-
              "¿Qué tal Albert?"

              "Es una propuesta interesante", dice el rey del subsuelo, mientras se acaricia la barbilla. "Con la frecuencia con la que nos has visto a los dos juntos, hubiera pensado que no haría mucha diferencia para ti si era él o yo sentado en el trono".

              "Hay una diferencia", digo. "Albert puede ser leal a ti, pero solía ser uno de los líderes rebeldes antes de convertirse en tu subordinado. Preferiría esperar que él se preocupara por los intereses de la gente de Ollendor que por ti. Y como lo has estado manteniendo a tu lado todo este tiempo, probablemente tendrías menos problemas para dejarlo tomar el trono si los rebeldes y los refugiados votaran por él antes que por ti".

              "Ah, ahora entiendo tu punto", dice el rey. "De hecho, es como usted dice. Albert como rey es un compromiso que estaría dispuesto a hacer, si fuera necesario. ¿Le importaría a su grupo hacer alguna otra sugerencia, o están todos de acuerdo con la propuesta de su amigo?"
          - source: scene_text_2
            paragraph: 4
            text: |-
              "Me gustaría proponer al doctor Reidzek como candidato", dice Daren, mientras el padre de Leila vuelve la cabeza hacia él con expresión de asombro.

              "Una excelente elección!" El rey del subsuelo le dice a Daren, después de echar una rápida mirada hacia el padre de Leila, que observe su reacción. "El Doctor Reidzek se ha convertido en un miembro muy respetado de nuestra sociedad en el poco tiempo que nos ha honrado con su presencia, por lo que no tengo dudas de que reuniría muchos votos si aceptara participar en nuestras elecciones. ¿Qué dice, doctor? ¿Debería poner su nombre en las listas de candidatos?"

              "Tengo... miedo de no participar en las elecciones", dice el padre de Leila. "Lo siento, Daren, pero convertirme en rey sería una responsabilidad demasiado grande para un simple inventor como yo. Me uní a esta rebelión porque quería ayudar a mejorar esta ciudad, pero la idea de liderar un reino entero es demasiado para mí. Espero no haber terminado decepcionando a ninguno de ustedes al decir esto".

              "Umm, no... ¡por supuesto que no!" dice Daren. "Es tu elección si quieres ser rey o no. Sólo estaba haciendo una sugerencia, eso es todo..."
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch08b_king2
      - condition: b3_ch8_king = 1
        texts:
          - source: scene_text
            paragraph: 5
            text: |-
              "Creo que Peter sería un buen rey".

              "¡Esa es realmente una excelente sugerencia!" dice el rey del subsuelo.

              "¿Es?" Le pregunto, algo sorprendido por su reacción.

              "Por supuesto", dice el rey. "De los tres líderes rebeldes, Peter es probablemente el que inspira más confianza en sus hombres. También ha estado al frente de la mayoría de las operaciones importantes de la rebelión, por lo que su rostro debería ser bastante reconocible para muchos de los ciudadanos de Ollendor. Quizás incluso más reconocible que el mío. Si su candidatura al trono es lo que se necesita para apaciguar a su grupo, entonces ciertamente es un compromiso que estaría dispuesto a hacer. Ahora bien, ¿hay también otras sugerencias, o están todos de acuerdo? ¿Con la propuesta de tu amigo?"
          - source: scene_text_2
            paragraph: 5
            text: |-
              "Me gustaría proponer al doctor Reidzek como candidato", dice Daren, mientras el padre de Leila vuelve la cabeza hacia él con expresión de asombro.

              "¡Otra excelente elección!" El rey del subsuelo le dice a Daren, después de echar una rápida mirada hacia el padre de Leila, que observe su reacción. "El Doctor Reidzek se ha convertido en un miembro muy respetado de nuestra sociedad en el poco tiempo que nos ha honrado con su presencia, por lo que no tengo dudas de que reuniría muchos votos si aceptara participar en nuestras elecciones. ¿Qué dice, doctor? ¿Debería poner su nombre en las listas de candidatos?"

              "Tengo... miedo de no participar en las elecciones", dice el padre de Leila. "Lo siento, Daren, pero convertirme en rey sería una responsabilidad demasiado grande para un simple inventor como yo. Me uní a esta rebelión porque quería ayudar a mejorar esta ciudad, pero la idea de liderar un reino entero es demasiado para mí. Espero no haber terminado decepcionando a ninguno de ustedes al decir esto".

              "Umm, no... ¡por supuesto que no!" dice Daren. "Es tu elección si quieres ser rey o no. Sólo estaba haciendo una sugerencia, eso es todo..."
