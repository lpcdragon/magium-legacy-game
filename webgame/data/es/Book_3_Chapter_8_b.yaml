  - name: b3_ch08b_kelrim2
    texts:
      - source: scene_text
        paragraph: 12
        text: |-
          "Sí, sí, he regresado", dice el hermano de Desmond, mientras varias personas corren hacia nosotros para estrecharle la mano. "Pero ya les dije antes, no hay necesidad de llamarme 'Señor'. Mis días de ser guardia real quedaron muy atrás. Durante muchos años, no he sido más que un rebelde y un ciudadano de la subsuelo, como el resto de ustedes. ¡Aquí todos somos iguales! Bueno... Supongo que algunos de nosotros somos más iguales que otros."

          Mientras decía esas últimas palabras, Sir Horace miraba directamente al rey del subsuelo, esperando a ver si respondía a su provocación.

          "Veo que sigues siendo tan popular como siempre, Horace", dice el rey del subsuelo. "Admito que no esperaba verte al otro lado de esa puerta tan pronto. Tu vitalidad nunca deja de sorprenderme incluso después de todos estos años que te conozco".

          "Vamos, 'rey', tú y yo sabemos que mi salud no es el verdadero tema que quieres discutir conmigo ahora mismo", dice el hermano de Desmond, con media sonrisa. "Creo que lo primero que querrías preguntarme es por qué decidí salir de la área de cuarentena ahora de todos los tiempos, especialmente después de que acabas de visitarme para preguntarme amablemente si podía quedarme allí por un tiempo más para que pudieras realizar tu pequeña elección sin interferencias".

          "Se me ha pasado por la cabeza, sí", dice el rey del subsuelo.
      - source: scene_text_2
        paragraph: 13
        text: |-
          "Bueno, voy a ser honesto contigo", dice Horace. "Al principio no estaba planeando interferir, al igual que no he interferido con ninguna de las otras decisiones que has tomado en los muchos años desde que hemos estado trabajando juntos. Todos sabemos que has hecho una buena cantidad de cosas turbias en el pasado, pero la mayor parte ha sido en interés de nuestra gente, por lo que realmente no me habría importado demasiado incluso si fueras a realizar una elección falsa y declararte rey de toda la ciudad. Sin embargo... cuando escuché a Kelrim hablar anteriormente sobre que nadie estaría de su lado si se postulara para rey... No sé cómo decirte esto, pero simplemente me invadió una emoción lo suficientemente fuerte como para dominarme, ¡y aquí estoy!"

          "Una vez más, estás dejando que tus sentimientos nublen tu juicio", dice el rey del subsuelo. "¿Te has detenido a considerar lo que significaría proponer un Goblin como nuevo rey a la gente de Ollendor justo después de que descubren que el viejo rey fue asesinado? ¡Van a pensar que los vendimos a los monstruos! No importará si tiene buenas intenciones o no. Querrán su cabeza en una pica en cuanto anunciemos nuestro apoyo hacia él".

          "Horace, realmente aprecio el hecho de que estés de mi lado, pero no puedo hacer esto", dice Kelrim. "Sólo soy un sanador. No soy ni diplomático ni un guerrero hábil. No tengo habilidades de liderazgo. Ni siquiera sabría por dónde empezar".
      - source: scene_3
        paragraph: 7
        text: |-
          "Entonces te ayudaré", dice Horace. "Seré tu mano derecha. Es lo menos que puedo hacer para pagarte después de toda la ayuda que me has brindado en estas últimas semanas. No necesitas preocuparte por si puedes hacer el trabajo correctamente o no. Todo lo que debes preocuparte es si QUIERES ser rey o no. Esto es lo que debes decidir. ¿Quieres ser rey o no?"

          "¿Quiero... ser rey?" Pregunta Kelrim, como si finalmente estuviera empezando a considerar la posibilidad en serio.
    choices:
