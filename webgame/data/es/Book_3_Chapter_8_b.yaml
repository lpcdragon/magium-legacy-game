        texts:
          - source: scene_text
            paragraph: 49
            text: |-
              "¿Alguna vez escuchaste el chiste sobre el Gólem de roca y el pisoteador de tres patas?"

              "Vamos, Barry, tendrás que esforzarte más que eso", dice Hadrik, con una sonrisa. "No creo que haya un alma viviente en este mundo que no haya escuchado ese chiste antes".

              "Bueno, entonces, ¿qué tal si jugamos a uno de tus juegos de beber para alegrar el ambiente?" pregunta Daren. "Algo que no sea Met-Zek, preferiblemente, porque ya lo hemos jugado muchas veces antes".

              "¡Mira, ahora hay una buena sugerencia!" dice Hadrik. "Creo que podría tener el juego adecuado para jugar. Espera un segundo. Déjame intentar recordar las reglas".

              Durante las siguientes horas, Daren, Hadrik y yo alternamos entre jugar el nuevo juego de cartas de Hadrik y discutir otros temas que nos venían a la mente de improviso.
          - source: scene_text_2
            paragraph: 40
            text: |-
              Durante este tiempo, Hadrik intentó en múltiples ocasiones que nos uniéramos a él en su maratón de bebida, pero afortunadamente logramos mantenernos firmes y, al final, Daren y yo bebimos cada uno menos de una botella de cerveza enana, que ya era suficiente para emborracharnos razonablemente. Cuando regresamos a nuestra habitación, despertamos a Leila y Kate para que pudieran comenzar su propio turno de noche y luego nos acostamos.

              Cuando me desperté varias horas más tarde, me alegré de ver que no tenía resaca, lo que significaba que, después de todo, no me excedí con el alcohol la noche anterior. La mayoría de los demás aparentemente ya se habían levantado de la cama y estaban listos para irse, así que decidí levantarme también y comenzar a prepararme para el largo día que nos esperaba. Poco después de que terminé con mis preparativos, Kate y Leila regresaron de su turno de noche y todos nos reunimos frente a nuestra habitación para poder irnos juntas.
