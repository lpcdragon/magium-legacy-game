            paragraph: 22
            text: |-
              "Entonces, ¿alguien más piensa que el rey del subsuelo aceptó su derrota anterior con demasiada facilidad?" dice Hadrik. "Esperaba que se esforzara un poco más para evitar que Kelrim participara en las elecciones".

              "No podía oponerse abiertamente a él porque eso habría hecho parecer que estaba tratando de manipular el resultado de las elecciones", dice Kate. "Puedes estar seguro de que el rey del subsuelo no va a aceptar esto de brazos cruzados. Probablemente hará todo lo que esté en su poder para impedir que Kelrim sea coronado rey, incluso asesinarlo a él y al resto de nosotros si es necesario. Todos escuchamos lo que le dijo a Albert en esa grabación. Este hombre es del tipo que no deja que nadie se interponga entre él y sus objetivos".

              "Es cierto que el rey parecía insatisfecho con la idea de que un Goblin pudiera convertirse en gobernante de la ciudad", dice el padre de Leila, "pero ¿realmente mataría a tantos de sus aliados sólo para evitar tal resultado? Creo que eso podría ir demasiado lejos incluso para alguien como él".
