  - name: b3_ch08b_kelrim4
    texts:
      - source: scene_text
        paragraph: 14
        text: |-
          "Entonces, ¿qué dices, Kelrim?" Pregunta Horace, con una mirada victoriosa en su rostro. "¿Nos harás a todos el honor de participar en nuestra elección para determinar el próximo rey?"

          "Yo..." dice Kelrim, ya que parece tener dificultades para contener todas las emociones que está sintiendo en este momento. "No quisiera interferir con-- quiero decir... Sólo si el rey del subsuelo está de acuerdo con ello..."

          "¿Escuchaste eso, 'rey'?" Horacio dice. "Kelrim está pidiendo tu bendición. ¿Se la darás?"

          "Por supuesto", dice el rey del subsuelo con una sonrisa educada. "Cualquiera es libre de participar en las próximas elecciones. De lo contrario, no sería justo".
      - source: scene_text_2
        paragraph: 15
        text: |-
          "¡Supongo que eso lo soluciona entonces!" Horacio dice. "Vamos, Kelrim, dejemos que estos finos caballeros terminen su discusión en paz. Además, hay algunas cosas que me gustaría discutir con ustedes en privado, pero prefiero no estar de pie por mucho tiempo. Mis piernas me están matando. Entremos en la área de cuarentena. ¡Haganse a un lado, amigos! Tendrán mucho más tiempo para mostrar su apoyo a Kelrim antes de las elecciones. ¡Abran paso, abran paso!"

          Mientras Horace y Kelrim avanzan hacia la área de cuarentena, la multitud se dispersa lentamente, dejando atrás solo a nuestro grupo, junto con el rey del subsuelo, Albert y Peter.

          "Bueno, entonces..." dice el rey del subsuelo, mientras se gira hacia nosotros. "Creo que ahora deberías tener tu respuesta sobre quiénes serán los candidatos al trono. ¿Pasamos finalmente al tema más apremiante del Supervisor y qué estamos planeando hacer con él?"
      - source: scene_3
        paragraph: 12
        text: Mientras el rey del subsuelo nos hace esta pregunta, de repente me doy cuenta de que olvidé preguntarle qué planea hacer con los prisioneros de la torre del seredium. Por otra parte, supongo que ya no tiene mucho sentido preguntarle sobre eso, ya que Kelrim y Horace probablemente serán quienes tomen este tipo de decisiones de ahora en adelante.
