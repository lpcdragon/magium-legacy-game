            paragraph: 10
            text: |-
              "Entonces, ¿hay otras personas que le gustaría recomendar?" le pregunta el rey a Daren.

              "Uh... no lo sé... quiero decir, ¿qué pasa con Desmond?" dice Daren. "Parece que sería un gran..."

              "¡Oye, mantenme fuera de tu política!" Grita Desmond, mientras todavía está vigilando la puerta del área de cuarentena. "Solicité este puesto como guardia del área de cuarentena específicamente para no tener que volver a aceptar trabajos de alto riesgo. Si crees que puedes obligarme a ser rey, ¡debes estar loco!"

              "¡No, no estábamos tratando de obligarte ni nada!" dice Daren. "Sólo estábamos... discutiendo nuestras opciones".

              "Parece que Desmond tampoco quiere ser rey", dice el rey del subsuelo. "¿Tienes a alguien más en mente?"

              "Bueno, yo... estaba pensando que tal vez..."

              Daren comienza a mirar alrededor de la sala de espera, en un intento desesperado por encontrar a alguien que considere adecuado para un rey, pero después de un rato finalmente deja caer la cabeza, mostrando que se ha rendido.
          - source: scene_text_2
            paragraph: 8
            text: |-
              "No es fácil encontrar a la persona adecuada para un trabajo como este, ¿verdad?" le dice el rey del subsuelo a Daren. "Lamentablemente, es raro encontrarse con una persona que no sólo tenga la fuerza de carácter y las habilidades de liderazgo necesarias para ser rey, sino también la voluntad de aceptar una responsabilidad tan grande. Tenga la seguridad de que celebraremos elecciones justas y la sugerencia de su amigo también se incluirá en la lista de candidatos, siempre y cuando la persona en cuestión esté de acuerdo, por supuesto".

              Luego, el rey mira a Albert, esperando una respuesta.

              "Uh, sí..." dice Albert, luciendo algo confundido. "Si es tu deseo, participaré, mi rey".

              "¡Espléndido!" dice el rey del subsuelo. "Ahora que lo hemos resuelto, ¿deberíamos pasar al tema que inicialmente quería discutir contigo, o tal vez había algo más que quisieras preguntarme?"

              "De hecho, había algo más", dice Kate. "Lo que más quiero saber es qué planeas hacer con los prisioneros en las torres del seredium después de derrotar al Supervisor".

              "¡Naturalmente, los liberaremos!" dice el rey del subsuelo. "Primero tendremos que hacer algo con los guardias estacionados frente a las torres, obviamente, pero tan pronto como..."
