        texts:
          - source: scene_text
            paragraph: 22
            text: |-
              "Tienes razón sobre el Supervisor. Lo detectamos a través de uno de los cristales, antes".

              "¿Pudiste detectarlo?..." pregunta el rey del subsuelo. "Bueno, supongo que no debería sorprenderme demasiado, considerando que tu alma en pena del amuleto ha declarado abiertamente antes que podía sentir el aura de Albert a través de su invisibilidad. ¿Estás seguro de que fue el Supervisor, entonces?"

              "Sí, definitivamente fue él", digo.

              "En ese caso, me aseguraré de limitar al máximo el flujo de información hasta el último momento", dice el rey del subsuelo. "No quisiera que ninguna de las tropas revelara nuestros planes al enemigo por error porque no notaron un pequeño cristal en el techo mientras caminaban por un corredor aleatorio. Gracias por informarme sobre esto. Como prometí, les daremos más detalles sobre la operación de mañana cuando llegue el momento. Lo más probable es que la sesión informativa se lleve a cabo mañana por la mañana. Hasta entonces, siéntanse libres de deambular por la base subterránea y usar sus instalaciones como quieran, como antes".

              "Lo haremos", dice Daren. "Nos vemos entonces."

              El rey del subsuelo asiente, y luego todos seguimos a Daren fuera de la sala de espera, dirigiéndonos a uno de los túneles que está menos poblado y que no tiene cristales azules en sus paredes o techos. Una vez que estamos lo suficientemente lejos de la sala de espera para estar seguros de que nadie puede escucharnos, Hadrik es el primero en dirigirnos una pregunta.
          - source: scene_text_2
            paragraph: 19
            text: |-
              "Entonces, ¿a alguien más le sorprendió que el rey del subsuelo no opusiera mucha resistencia a que Barry nominara a Albert como candidato a rey?" dice Hadrik. "Pensé que sería más... ya sabes... ¿hostil al respecto?"

              "¿Por qué lo estaría?" dice Kate. "Convertirse en rey, Albert, es probablemente uno de los mejores resultados que podría desear. Es el seguidor más leal que tiene, por lo que probablemente seguirá escuchando las órdenes de su amo, incluso si de alguna manera termina ganando las próximas elecciones. En el gran esquema de las cosas, dudo que haría una gran diferencia para el rey del subsuelo si Albert se convirtiera en rey en lugar de él".

              "Sí, está bien, tal vez Albert sea realmente leal", dice Hadrik, "pero la grabación que escuchamos antes hizo que pareciera que el rey del subsuelo ni siquiera consideraría otra opción que él mismo, y que estaría dispuesto a matarnos si sugeriéramos algo diferente. Habrías pensado que al menos intentaría argumentar que él sería la mejor elección, o algo así. No lo sé... Esto me parece un poco sospechoso. ¿Crees que la grabación podría haber sido falsa después de todo? ¡Tal vez deberíamos preguntarle al rey del subsuelo sobre esto! ¡Y luego Melindra, Arraka o Leila podrían leer su aura para ver si está mintiendo!"
            condition: b3_ch8_king = 0
          - source: scene_text_2
            paragraph: 18
            text: |-
              "Entonces, ¿a alguien más le sorprendió que el rey del subsuelo aceptara tan rápidamente a Peter como nominación?" dice Hadrik. "Pensé que sería más... ya sabes... ¿hostil al respecto?"

              "Probablemente piensa que incluso si Peter se convierte en rey, podrá manipularlo fácilmente para que haga lo que quiera", dice Kate. "Ya hemos visto lo manso que puede llegar a ser Peter cuando el rey del subsuelo le levanta un poco la voz. Tal vez se sienta más seguro de sí mismo si su gente demostrara que lo prefieren a él como su gobernante sobre el rey del subsuelo en las próximas elecciones, pero no me haría ilusiones".

              "Sí, está bien, tal vez Peter pueda ser un poco fácil de convencer", dice Hadrik, "pero la grabación que escuchamos antes hizo que pareciera que el rey del subsuelo ni siquiera consideraría otra opción que él mismo, y que estaría dispuesto a matarnos si sugeriéramos algo diferente. Habrías pensado que al menos intentaría argumentar que él sería la mejor elección, o algo así. No lo sé... Esto me parece un poco sospechoso. ¿Crees que la grabación podría haber sido falsa después de todo? ¡Tal vez deberíamos preguntarle al rey del subsuelo sobre esto y luego Melindra, Arraka o Leila podrían leer su aura para ver si está mintiendo!"
