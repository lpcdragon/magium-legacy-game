            paragraph: 18
            text: |-
              "Entonces vayamos directo al grano", dice el rey del subsuelo. "En primer lugar, me gustaría ponerlos a todos al tanto de algunos acontecimientos recientes que han ocurrido en la superficie desde que regresaron de su viaje a la torre del seredium. Según nuestros exploradores, el Supervisor ha estado muy ocupado estas últimas horas. Una de las primeras cosas que hizo después de la muerte del rey aparentemente fue comenzar a asesinar a cada persona de alto rango en la ciudad que conocía la existencia de su núcleo. Daren, creo que Peter ya debió haberte explicado qué es el núcleo del Supervisor. ¿Ya se lo has contado a tus amigos?"

              "Sí", dice Daren. "Ellos lo saben".

              "Bien", dice el rey del subsuelo. "Entonces también debes saber que organizaremos un ataque contra este núcleo suyo mañana, tan pronto como hayamos reunido todas las tropas necesarias. ¿Es seguro asumir que te unirás a nosotros en esta misión?"

              "Sí, ya acordamos que iríamos contigo mañana", dice Daren.
          - source: scene_text_2
            paragraph: 17
            text: |-
              "Muy bien", dice el rey. "Les daremos los detalles exactos de esta misión más adelante, una vez que sepamos con certeza con quién podemos contar para luchar junto a nosotros. Mi esperanza es que el Supervisor no esté al tanto de mi conocimiento sobre el paradero de su núcleo, porque de lo contrario probablemente encontraremos una fuerte resistencia en nuestro camino hacia nuestro objetivo. Sin embargo, si lo sabe, no hay mucho que podamos hacer aparte de superar sus defensas y esperar lo mejor, porque ya traeremos a nuestros mejores hombres en esta misión, por lo que será todo o nada. Una cosa más a tener en cuenta es que, por alguna razón, el Supervisor todavía mantiene el bloqueo de toda la ciudad desde antes, por lo que debemos esperar ser atacados por sus bolas de metal voladoras tan pronto como lleguemos a la superficie, incluso si no tomamos ninguna acción hostil hacia ellas."

              "Entendido", dice Daren.
          - source: scene_3
            paragraph: 9
            text: '"Ah, y otra cosa..." dice el rey del subsuelo. "Debes tener cuidado de no hablar sobre nuestros planes para eliminar al Supervisor cuando estés cerca de cualquiera de los cristales azules. Puede ser difícil de creer, pero Albert me dijo mientras estábamos en la sala del trono que podía sentir a alguien mirándonos a través de los cristales. Cuando le pedí que me diera más detalles, dijo que no podía, porque era más un instinto que cualquier otra cosa, y que no podía sentir ninguna aura extraña proveniente de los cristales usando su sentido mágico. Como he llegado a confiar en los instintos asesinos de Albert a lo largo de los años, mi conclusión fue que el culpable más probable sería el Supervisor, porque hasta donde yo sé, sus bolas de metal también tienen cristales azules dentro de ellas, por lo que de alguna manera debe haber encontrado una manera de resonar con los cristales en las cuevas. Eso también podría explicar por qué los cristales han comenzado a comportarse de manera tan errática de repente, aunque su extraño comportamiento también podría haber sido causado por las recientes explosiones que los afectaron."'
