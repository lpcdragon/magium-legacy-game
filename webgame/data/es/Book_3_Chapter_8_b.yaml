            text: |-
              "Entonces vayamos directo al grano", dice el rey del subsuelo. "En primer lugar, me gustaría ponerlos a todos al tanto de algunos acontecimientos recientes que han ocurrido en la superficie desde que regresaron de su viaje a la torre del seredium. Según nuestros exploradores, el Supervisor ha estado muy ocupado estas últimas horas. Una de las primeras cosas que hizo después de la muerte del rey aparentemente fue comenzar a asesinar a cada persona de alto rango en la ciudad que conocía la existencia de su núcleo. Daren, creo que Peter ya debió haberte explicado qué es el núcleo del Supervisor. ¿Ya se lo has contado a tus amigos?"

              "Ellos conocen sus planes de atacar al Supervisor, pero aún no les he contado los detalles", dice Daren.

              "Ah", dice el rey. "Bueno, en resumen, sé con certeza que todas las bolas de metal voladoras están controladas por una única maquinaria que actúa como el núcleo del Supervisor, y también soy consciente de su ubicación. Queremos reunir tantos guerreros fuertes como sea posible hasta mañana, para que podamos destruir el núcleo del Supervisor antes de que tenga tiempo de consolidar aún más su poder sobre la ciudad. Dado que ya has hablado de nuestros planes para atacar al Supervisor, ¿es seguro asumir que te unirás a nosotros en esta misión?"

