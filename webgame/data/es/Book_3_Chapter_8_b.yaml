  - name: b3_ch08b_leila3
    routes:
      - condition: b3_ch8_voice = 1
        texts:
          - source: scene_text
            paragraph: 38
            text: |-
              "¡Bueno, creo que tu voz suena maravillosa!"

              "Gracias..." escribe Leila, con una mirada inusualmente tímida en sus ojos.

              "Entonces, umm, ¿estaría bien si te preguntara cómo se te ocurrió tu voz?" digo. "¿O es algo demasiado personal?"

              "Está bien", escribe Leila. "No había ningún significado especial detrás de mi voz ni nada. Solo usé las voces de las otras chicas a mi alrededor como punto de referencia, y luego jugué con diferentes tonalidades en mi cabeza hasta que encontré una que me gustó. ¿Qué hay de ti? Tu voz pensante era la misma que usas para hablar, ¿verdad? ¿Fue esto algo que elegiste conscientemente, o es simplemente algo que sucedió sin que lo pensaras mucho?"
          - source: scene_text_2
            paragraph: 31
            text: |-
              "Hmm..." digo, mientras empiezo a acariciar lentamente mi barbilla con mi mano derecha sin darme cuenta. "Ahora que lo mencionas... ¿cómo conseguí esta voz en mi cabeza? Recuerdo que cuando era niño solía pensar con mi voz de niño, pero luego, cuando mi voz al hablar cambió gradualmente con el tiempo a medida que crecí, ¿la voz en mi cabeza cambió al mismo ritmo o se quedó atrás? ¿Alguna vez hice un esfuerzo consciente para actualizar mi voz de pensamiento, o sucedió de forma natural? ¿Y por qué nunca pensé en esto hasta ahora?"

              Mientras todavía estoy ocupado tratando de resolver este enigma tan intrigante, Leila de repente comienza a reírse incontrolablemente, en su habitual forma silenciosa.

              "... ¿Dije algo mal?" Le pregunto, confundida.
          - source: scene_3
            paragraph: 18
            text: |-
              "No, lo siento", escribe Leila, mientras intenta contener su risa silenciosa. "Es solo... es solo que verte pensar en voz alta de esta manera me recordó cómo sonaban tus pensamientos cuando éramos enviados volando de un lado a otro por todos los planos de existencia. ¡Estabas pensando demasiado en las cosas de la misma manera en ese entonces también!"

              "Bueno, en mi defensa", digo, "prácticamente he estado haciendo investigaciones mágicas durante más de la mitad de mi vida, por lo que pensar demasiado en las cosas es prácticamente una segunda naturaleza para mí a estas alturas".

              "¡Supongo que tienes razón!" Escribe Leila, con una sonrisa, ya que ahora parece haber logrado finalmente contener la risa de antes.
