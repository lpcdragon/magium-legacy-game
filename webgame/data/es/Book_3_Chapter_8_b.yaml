            paragraph: 20
            text: |-
              "Entonces, ¿a alguien más le sorprendió que el rey del subsuelo no opusiera mucha resistencia a que Barry nominara a Breynan como candidato a rey?" dice Hadrik. "Pensé que sería más... ya sabes... ¿hostil al respecto?"

              "El rey del subsuelo obviamente no ve a Breynan como una amenaza real", dice Kate. "Considerando la baja cantidad de votos que espera que obtenga, dudo que se moleste siquiera en manipular las elecciones. Incluso podría estar feliz si Breynan se uniera a la contienda, porque competir con un líder rebelde real y ganar le daría más legitimidad a su victoria".

              "Está bien, tal vez las posibilidades de éxito de Breynan sean realmente bajas", dice Hadrik, "pero la grabación que escuchamos antes hizo que pareciera que el rey del subsuelo ni siquiera consideraría otra opción que él mismo, y que estaría dispuesto a matarnos si sugeriéramos algo diferente. Habrías pensado que al menos intentaría argumentar que él sería la mejor elección, o algo así. No lo sé... Esto me parece un poco sospechoso. ¿Crees que la grabación podría haber sido falsa después de todo? ¡Tal vez deberíamos preguntarle al rey del subsuelo sobre esto y luego Melindra, Arraka o Leila podrían leer su aura para ver si está mintiendo!"
