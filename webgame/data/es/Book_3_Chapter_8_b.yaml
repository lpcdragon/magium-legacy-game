              "Ciertamente..." dice Peter, luciendo bastante sorprendido de que el rey del subsuelo esté pidiendo su opinión. "Si realmente crees que la gente puede votar por mí, entonces no rehuiré un papel tan importante como este".

              "¡Espléndido!" dice el rey del subsuelo. "Ahora que lo hemos resuelto, ¿deberíamos pasar al tema que inicialmente quería discutir contigo, o tal vez había algo más que quisieras preguntarme?"

              "De hecho, había algo más", dice Kate. "Lo que más quiero saber es qué planeas hacer con los prisioneros en las torres del seredium después de derrotar al Supervisor".

              "¡Naturalmente, los liberaremos!" dice el rey del subsuelo. "Primero tendremos que hacer algo con los guardias estacionados frente a las torres, obviamente, pero tan pronto como..."
