            paragraph: 33
            text: |-
              ...Dígale al Supervisor que no lo ayudaremos a tenderle una emboscada al rey del subsuelo.

              Una vez que decidimos qué decirle, todo lo que teníamos que hacer era regresar a nuestros dormitorios y gritar el nombre del Supervisor para que nos respondiera inmediatamente desde uno de los cristales, como si hubiera estado allí todo este tiempo, esperando nuestra respuesta.

              Cuando le informamos que no queríamos seguir su plan, el Supervisor claramente no estaba muy contento, pero dijo que aún estaba dispuesto a darnos la oportunidad de cambiar de opinión y que no nos atacaría inmediatamente después de llegar a la superficie, para darnos algo de tiempo para recuperar el sentido y atacar al rey del subsuelo nosotros mismos.

              Tan pronto como todos estuvimos en la misma página con respecto a los eventos de mañana y lo que había que hacer, Breynan regresó a su propia habitación, lejos de nosotros, y también le pedimos amablemente al Supervisor que ya no nos espiara a través de los cristales para que pudiéramos ir a dormir.
