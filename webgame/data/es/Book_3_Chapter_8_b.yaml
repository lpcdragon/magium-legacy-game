  - name: b3_ch08b_leila4
    texts:
      - source: scene_text
        paragraph: 40
        text: |-
          Después de unos segundos de silencio, Leila vuelve a escribir, mientras mira pensativamente hacia la pared que tiene delante.

          "Realmente hemos pasado por muchas cosas juntos, ¿no?...", dice el escrito. "Hemos luchado lado a lado en una arena, hemos escuchado los pensamientos de los demás, nos hemos... aferrado el uno al otro por nuestra vida para no ser borrados de la existencia..."

          Después de que su escritura desaparece, hay una breve pausa durante la cual sentimos como si ambos estuviéramos revisando los eventos de la torre en nuestras cabezas, sin siquiera una palabra de ninguno de nosotros. Hemos estado evitando completamente este tema toda la noche, y ahora que veo lo reacios que somos a discutirlo incluso después de haberlo mencionado, creo que estoy empezando a entender por qué.
      - source: scene_text_2
        paragraph: 32
        text: |-
          "Tenía mucho miedo, ya sabes... cuando todo pasó...", escribe Leila, decidiendo ser la primera en romper el hielo después de una larga pausa en silencio. "Puede que no lo hubiera dejado ver en mi cara, pero recuerdo claramente que en ese momento me invadió un miedo como nunca antes había experimentado en mi vida".

          "Sí..." digo. "Yo también tenía miedo... Incluso con mis defectuosos instintos de supervivencia, el miedo de quedar atrapado en ese vacío sin fin otra vez logró apoderarse de mí para siempre".
      - source: scene_3
        paragraph: 19
        text: |-
          "Yo... no creo que fuera la idea de no existir lo que más me asustaba en ese momento", escribe Leila. "Es más bien... ¿Recuerdas esa conversación que tuvimos en los túneles sobre lo que habría pasado si realmente hubieras sido borrado por el Magium durante las pruebas del Dios del Tiempo?... ¿Sobre cómo en un mundo como ese habría tenido que vivir mi vida tratando de convencer a los demás e incluso a mí mismo de que realmente existías y no eras sólo un producto de mi imaginación? Creo... Creo que esto es lo que realmente tenía más miedo. La idea de perderte de una manera tan horrible... simplemente habría sido demasiado para yo para soportar..."

          Cuando Leila termina de escribir sus palabras, noto que su mano tiembla levemente y que tiene una mirada algo ansiosa en sus ojos.
