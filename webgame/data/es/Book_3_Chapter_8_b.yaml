            paragraph: 52
            text: |-
              "Está bien", dice Daren. "¿Están todos listos?"

              "Para bien o para mal... estamos listos", dice Kate.

              "Entonces vayamos a la sala de espera", dice Daren. "El rey del subsuelo probablemente ya nos esté esperando allí para informarnos".

              "¿Crees que tomamos la decisión correcta?" Dice Hadrik, luciendo un poco inseguro de sí mismo. "Al elegir nuestro lado, quiero decir."

              "Sólo sabremos con certeza si fue la elección correcta una vez que todo haya terminado", dice Daren. "Hasta entonces, sólo nos queda esperar".

              "Sí..." dice Hadrik. "Supongo que tienes razón. Entonces vámonos."
          - source: scene_text_2
            paragraph: 43
            text: |-
              Una vez que todos terminan de hablar, todos nos dirigimos a la sesión informativa del rey del subsuelo, mientras que las palabras de Daren probablemente aún persisten en el fondo de la mente de todos. Supongo que realmente no hay manera de saber nada con certeza hasta que todo termine. Incluso con los preparativos más cuidadosos y las mejores intenciones, todavía existe la posibilidad de que simplemente hayamos pasado por alto algo. Sin embargo, si de algo podemos estar seguros es de esto:

