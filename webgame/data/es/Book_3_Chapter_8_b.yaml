  - name: b3_ch08b_hadrik
    texts:
      - source: scene_text
        paragraph: 34
        text: |-
          "En realidad, sí", escribe Leila. "Barry mencionó antes que quería hacer un turno de noche con Hadrik para poder animarlo un poco. ¿No es así, Barry?"

          "Oh, sí", digo. "Menos mal que me lo recordaste. Casi lo olvido. ¿Estaría bien si tomáramos el primer turno de noche, Hadrik?"

          Hadrik no responde y se limita a mirarnos a Leila y a mí, junto con todos los demás en la habitación.

          "¿Hay algún problema con lo que dije, o...?" Pregunto confundido.

          "No, es solo que... Daren dijo más o menos lo mismo que tú, poco antes de que tú y Leila llegaran aquí", dice Kate. "Dijo que quería tomar una copa con Hadrik para mejorar su estado de ánimo y que ambos estaban planeando tomar el primer turno de noche juntos".
    choices:
      - position: 1
        text: Haz el primer turno de noche junto con Daren y Hadrik.
        effects:
          - set:
              current_scene: b3_ch08b_hadrik2
              b3_ch8_three: 1
      - position: 2
        text: Deje que Daren y Hadrik hagan el primer turno de noche y haga el segundo turno de noche con Leila.
        effects:
          - set:
              current_scene: b3_ch08b_hadrik_leila
              b3_ch8_three: 0
  - name: b3_ch08b_hadrik_leila
    texts:
      - source: scene_text
        paragraph: 35
        text: |-
          "Oh", digo. "Bueno, no tiene mucho sentido que tres de nosotros hagamos un turno al mismo tiempo, así que supongo que tomaré una copa con Hadrik algún otro día. Leila, ¿todavía quieres hacer un turno de noche juntos? Podríamos ofrecernos como voluntarios para tomar el segundo esta noche, si quieres".

          "¡Suena como un plan!" Escribe Leila.

          "Está arreglado, entonces", digo.

          "Guau..." dice Hadrik. "Nunca pensé que vería el día en que dos hombres adultos se ofrecieran a animarme con bebidas la misma noche. Supongo que debo haber sido una verdadera decepción últimamente, ¿eh? Bueno, ¡eso está a punto de cambiar muy pronto! Daren, ¡prepárate! Esta noche haremos un maratón de bebidas. ¡No digas que no te lo advertí!"

          "Si hacer un maratón significa beber sorbos lentos cada pocos minutos, entonces estoy totalmente de acuerdo", dice Daren.

          "¡Jajaja!" dice Hadrik. "¡Ese es Daren para ti! ¡Siempre bromeando!"

          "Aunque no estoy bromeando", dice Daren. "No voy a hacer una maratón de bebida antes de una gran batalla. Sabes que eso no va a suceder".

          "No te preocupes, estoy seguro de que te entusiasmará la idea después de los primeros tragos", dice Hadrik. "Vamos. ¡Tengo todas las botellas que necesitamos aquí en mi mochila!"
      - source: scene_text_2
        paragraph: 28
        text: |-
          Cuando Daren y Hadrik salen por la puerta, el resto de nosotros nos vamos a la cama y yo logro dormir unas cinco horas antes de que Daren venga a despertarme, para que Leila y yo podamos tomar el segundo turno de noche. Una vez que encontramos el pasillo que usaron Daren y Hadrik antes que nosotros, nos sentamos en el suelo con la espalda contra la pared, y mientras comenzamos a hablar, pasan unas horas sin siquiera darnos cuenta.

          Al igual que la última vez que Leila y yo nos sentamos así para hablar, sigo sorprendiéndome de lo fácil que podemos saltar de un tema a otro sin que parezca que nos vamos a quedar sin temas para discutir. En apenas unas horas ya hemos hablado de teorías mágicas, de criaturas y plantas nativas únicamente de Varathia, e incluso de oscuros detalles sobre las técnicas de su padre para fabricar dispositivos. Sin embargo, a pesar de la naturaleza tediosa de algunos de estos temas, por alguna razón no me he sentido aburrido ni una sola vez durante toda esta conversación. Realmente siento que puedo hablar con ella sobre cualquier tema.
      - source: scene_3
        paragraph: 15
        text: |-
          "Sabes, siempre me he preguntado sobre algo..." le digo a Leila, mientras ella está sentada a mi lado, con las piernas dobladas frente a ella. "¿Cómo es que puedes ser tan hablador cuando estás solo conmigo o con Kate, pero cuando estamos en un grupo apenas escribes una palabra? ¿Simplemente no te sientes tan cómodo con los demás, o es un problema que tienes con los grupos en general?"

          "Yo... creo que es más un problema general", escribe Leila, mientras se toma unos segundos para pensar en lo que he dicho. "Realmente no he tenido la oportunidad de interactuar con grupos desde que estaba en Beacon, y en aquel entonces no tenía mi dispositivo de estadísticas para escribir por mí, así que todo lo que podía hacer era sentarme en silencio en un rincón sin decir nada. Dado que éramos principalmente mi padre y yo después de que escapamos de Beacon, parece que no puedo sentirme cómodo con nada más que conversaciones uno a uno, no importa cuánto lo intente".
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch08b_leila2
  - name: b3_ch08b_leila
    texts:
      - source: scene_text
        paragraph: 36
        text: |-
          "Sí, Barry y yo tomaremos el segundo turno de noche, si te parece bien", escribe Leila.

          "Por supuesto", dice Daren. "Hadrik, dijiste antes que estabas de acuerdo con que tomáramos el primer turno, ¿verdad?"

          "Claro", dice Hadrik. "Estaremos bebiendo toda la noche, así que es bueno saber que dormiremos unas cuantas horas para que los efectos del alcohol desaparezcan".

          "No esperaba menos respuesta de tu parte", dice Daren. "De todos modos, tomen sus botellas y síganme. Intentaremos encontrar un lugar con la menor cantidad posible de cristales azules que aún tenga una vista clara de nuestra habitación".

          Cuando Daren y Hadrik salen por la puerta, el resto de nosotros nos vamos a la cama y yo logro dormir unas cinco horas antes de que Daren venga a despertarme, para que Leila y yo podamos tomar el segundo turno de noche. Una vez que encontramos el pasillo que usaron Daren y Hadrik antes que nosotros, nos sentamos en el suelo con la espalda contra la pared, y mientras comenzamos a hablar, pasan unas horas sin siquiera darnos cuenta.
