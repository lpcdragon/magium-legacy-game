  - name: b3_ch08b_skeptical
    routes:
      - condition: b3_ch8_heartfelt = 1
        texts:
          - source: scene_text
            paragraph: 41
            text: |-
              "No te preocupes", le digo a Leila, mientras coloco mi mano sobre la de ella y luego la sostengo suavemente. "No voy a ir a ninguna parte."

              "¿Oh? ¿Debo asumir que ya has ideado un plan para derrotar al Magium, entonces?" Leila escribe con una sonrisa juguetona, mientras sutilmente retira su mano de la mía.

              "¡Por supuesto!" digo. "De hecho, para empezar, el Magium nunca tuvo una oportunidad contra mí. Sólo he fingido estar asustado por él hasta ahora, para engañarlo y hacer que baje la guardia. ¡Si no me crees, puedes preguntarle a Arraka! Ella es quien dijo que soy la mejor persona para lidiar con el Magium, ¡no yo!"

              "Oye, ahora que lo mencionas, Arraka dijo algo acerca de que tú eras la única persona apta para el trabajo", escribe Leila, mientras sigue mi acto. "Admito que estaba un poco escéptico al principio, ¡pero ahora me tienes completamente convencido! Entonces, ¿cuándo planeas revelar tus poderes ocultos que te permitirán asestar el golpe final al Magium?"

              "Todo a su debido tiempo..." digo. "No querrás que revele mis planes secretos y me arriesgue a ser escuchado por nuestro enemigo, ¿verdad?"
          - source: scene_text_2
            paragraph: 33
            text: |-
              "Mis disculpas", escribe Leila, con una sonrisa. "Casi termino poniendo en peligro nuestras vidas por mera curiosidad. ¡Debería haberlo sabido mejor!"

              "Estás perdonado, siempre y cuando te asegures de no sacar a relucir este tema en presencia de ninguno de nuestros amigos", le digo. "¡Digo esto para protegerlos, por supuesto, y no porque me moriría de vergüenza si alguna vez se enteraran de esta discusión!"

              "No hay necesidad de preocuparse", escribe Leila. "¡Tu secreto está a salvo conmigo!"

              Mientras terminamos nuestra conversación, podemos escuchar las voces de algunos de nuestros amigos, provenientes del interior de la habitación en la que dormían.

              "Probablemente deberíamos irnos", escribe Leila, cuando me ve mirando hacia los dormitorios. "Creo que es posible que ya estén todos despiertos".

              "Tienes razón", digo. "No debemos hacerlos esperar. Tenemos un largo día por delante..."
          - source: scene_3
            paragraph: 20
            text: |-
              Leila asiente y luego ambos nos levantamos del suelo para poder comenzar a dirigirnos en dirección a Daren y los demás. Mientras caminamos hacia los dormitorios, puedo ver un texto flotante azul que aparece frente a mí, que parece viajar a la misma velocidad que yo, para que pueda leerlo correctamente.

              "Me divertí mucho esta noche", escribe Leila mientras sonríe. "Me alegro de que hayamos decidido hacer este turno de noche juntos. ¡Tal vez podamos hacerlo de nuevo algún día!"

              "Sí, también me divertí esta noche", digo. "Y estoy seguro de que encontraremos otras oportunidades para hablar así, aunque no sea necesariamente en turnos de noche".

              "¡Esperemos que lo hagamos!" Escribe Leila.

              Cuando llegamos a nuestros amigos, descubrimos que todos ya estaban despiertos y que estaban a punto de llamarnos. En cuanto nos ven, todos se levantan de sus camas, agarran sus mochilas y se reúnen frente a la puerta, para que podamos salir juntos.
