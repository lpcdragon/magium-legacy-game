  - name: b3_ch08b_oblivious
    texts:
      - source: scene_text
        paragraph: 43
        text: |-
          "No te preocupes", le digo a Leila, mientras coloco mi mano sobre la de ella y luego la sostengo suavemente. "No voy a ir a ninguna parte."

          Cuando inicialmente toqué su mano, el primer instinto de Leila fue girarse y mirarme, sorprendida, pero después de escuchar lo que tenía que decir, sonrió levemente y luego giró la palma hacia arriba para poder tomar mi mano también.

          "Lo sé", escribe Leila simplemente y luego ambos nos quedamos en silencio por un tiempo, apartando la mirada el uno del otro mientras nuestras manos permanecen unidas.

          Mientras ambos estamos sentados allí sin decir nada, de repente veo otro de los mensajes de texto azules de Leila frente a mí, excepto que está un poco tembloroso y más borroso de lo habitual.

          "Había... algo que quería preguntarte desde hace un tiempo, excepto que nunca encontré el momento adecuado para hacerlo", dice el escrito, mientras la mirada en los ojos de Leila se vuelve un poco vacilante. "He estado pensando en lo que dijiste hace una semana, cuando mencionaste que estarías dispuesto a regresar a Varathia después del torneo para visitarme si pudieras obtener una carta oficial que te invitara a regresar aquí..."

          "Oh, claro", digo. "¡Recuerdo haber dicho eso!"
      - source: scene_text_2
        paragraph: 34
        text: |-
          "Si tuviera que encontrar una manera de enviarte una invitación así..." continúa Leila, que parece ponerse cada vez más nerviosa con cada palabra que escribe. "¿Considerarías... considerarías llevarme contigo de regreso al Continente Occidental para que pueda acompañarte en algunas de tus aventuras de las que tanto me has contado?"

          "¡Por supuesto!" Le digo. "Quiero decir, mis aventuras en trabajos ocasionales probablemente serán un poco aburridas para alguien como Hadrik o Daren, pero estoy seguro de que no les importará si les digo que querías--"

          "En realidad..." escribe Leila en letras grandes y temblorosas delante de mí, mientras su cara se pone roja de nuevo.

          "En realidad", escribe de nuevo, esta vez en letras más pequeñas, "no estaba hablando de ir juntos como grupo. Esperaba que tal vez pudiéramos ser... ¿solo nosotros dos?..."

          Después de ver la expresión nerviosa en su rostro cuando dijo esas últimas palabras, finalmente entendí lo que quería decir. Por otra parte, una vez que lo explicó así, supongo que se habría necesitado un tipo especial de tonto para permanecer ajeno a la verdadera intención detrás de su pregunta.
    choices:
      - position: 1
        text: Lo tengo. Entonces, sólo nosotros dos. Es una promesa.
        effects:
          - set:
              current_scene: b3_ch08b_leila5
              b3_ch8_heartfelt: 2
      - position: 2
        text: Lo siento, yo... no puedo hacerles eso a mis amigos. Se sentirían traicionados si no los invitara.
        effects:
          - set:
