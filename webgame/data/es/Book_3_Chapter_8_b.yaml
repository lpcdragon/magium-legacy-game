  - name: b3_ch08b_kelrim3
    texts:
      - source: scene_text
        paragraph: 13
        text: |-
          "Lo que él quiere es irrelevante", dice el rey del subsuelo, mientras casi comienza a perder su habitual comportamiento tranquilo, por primera vez desde que lo conozco. "¡Incluso si lo respaldas, nadie va a votar por él! A lo sumo, lo elegirán como el nuevo rey, pensando que tú serás el verdadero gobernante detrás de escena. Pero si así es realmente como va a ser, entonces ¿cuál es el propósito de todas estas charadas? ¿Por qué no simplemente desafiarme directamente? ¡Preferiría que compitas contra mí en las elecciones y ganes que que uses a algún sanador Goblin como representante! Una vez más, digo, nadie en su sano juicio votaría por Kelrim si no fuera por..."

          "¿Escuché eso bien?" dice un hombre, mientras se acerca al rey del subsuelo. "¿Kelrim se postulará para rey?"

          "¡No!" dice el rey del subsuelo, un poco demasiado alto. "¡Sólo lo estábamos discutiendo como una posibilidad! Nadie dijo que en realidad esté..."

          "¿Kelrim se postula para rey?" dice otro hombre, que se acerca rápidamente a nosotros. "¡Votaré por él con ambas manos! Mi esposa habría estado muerta hace mucho tiempo si no fuera por él. ¡Es un héroe!"

          "¿Escuchaste eso?" Escucho a dos hombres hablando a unos cuatro metros de nosotros. "Kelrim planea participar en las elecciones. ¡Y Sir Horace dijo que sería su mano derecha!"
      - source: scene_text_2
        paragraph: 14
        text: |-
          "¿Kelrim como rey?" dice el segundo chico. "¡Esa es la mejor idea que he escuchado en todo el día!"

          Una vez que algunas personas más comienzan a hablar de ello en voz alta, la noticia parece extenderse como la pólvora. Varias personas ya se están agolpando a nuestro alrededor para tener la oportunidad de apretar la mano de Kelrim. Algunos de ellos son antiguas víctimas de la plaga, otros son familiares de las víctimas, mientras que otros son simplemente personas que fueron ayudadas por él desde que llegó a los túneles subterráneos. A medida que toda el área que nos rodea se llena de hombres y mujeres de todas las edades, que vienen a expresar su apoyo al sanador Goblin, cada vez más personas sienten curiosidad por saber a qué se debe tanta conmoción.

          "¿Kelrim?..." Escucho a un hombre a lo lejos, que parece ser uno de los refugiados. "¿Es ese el pequeño que ha estado corriendo curando a todos hasta que casi se desmaya por el cansancio después de que los guardias reales volaron el techo? ¿Se postula para rey? ¡Supongo que entonces sé quién tiene mi voto!"

          "¿Qué pasa con el otro chico?" dice otro refugiado. "¿Cuál era su nombre? ¿Rey del subsuelo o algo así? ¿No sigue él también en la carrera?"
      - source: scene_3
        paragraph: 8
        text: |-
          "Sí, pero ese tipo es muy turbio", responde el primer tipo. "¿Quién en su sano juicio votaría por él después de tener a Kelrim como alternativa?"

          Después de escuchar estas últimas palabras, compruebo cuál es la reacción del rey del subsuelo, por curiosidad. Para mi sorpresa, el hombre es como una fortaleza inexpugnable. Puedes ver claramente que está consumido por la ira si has estudiado sus expresiones faciales durante el tiempo suficiente para notar la diferencia, pero para alguien que no lo conoce bien, probablemente parecería como si no le afectara en absoluto lo que sucede a su alrededor.

          Supongo que tengo que dar crédito a quien lo merece. No creo haber visto nunca a alguien con mayor autocontrol que este.
