                  current_scene: b3_ch08b_ending
      - condition: b3_ch8_three = 3
        texts:
          - source: scene_text
            paragraph: 50
            text: |-
              "Entonces hablemos de tu vida amorosa. ¿Cómo van las cosas con Arraka?"

              "¡Jajajaja!" dice Hadrik. "Ese es el tipo de pregunta que necesitamos para alegrar el ambiente. ¡Bien hecho, Barry!"

              Hace una pausa.

              "Hmm, veamos..." dice Hadrik. "Para ser completamente honesto, Arraka y yo no hemos hablado mucho últimamente. Sin embargo, ella ha pasado mucho tiempo a solas con Daren, especialmente mientras estaban en esa área de cuarentena. ¿Qué piensas, Daren, debería estar poniéndome celoso?"

              "Oye, si la quieres, puedes llevarla, hombre", dice Daren. "No seré yo quien se interponga en el camino de tu amor. Después de lo mucho que he tenido que interactuar con ella en los últimos días debido al entrenamiento de mi aura y todo lo demás, he aprendido a apreciar casi cada momento en el que no tengo que escuchar su irritante voz gritando en mi cabeza. No tengo idea de cómo Illuna la ha soportado durante tanto tiempo".
          - source: scene_text_2
            paragraph: 41
            text: |-
              "Estás diciendo esto, pero en realidad te llevas mucho mejor con ella ahora que antes, ¿no crees?" Hadrik dice, mientras sonríe. "Es posible que ahora estén teniendo discusiones constantes, pero al principio, ustedes dos apenas intercambiaban algunas palabras, aparte de algún insulto ocasional".

              "... No negaré que se ha vuelto más fácil hablar con ella desde las pruebas del Dios del Tiempo", dice Daren. "Ella está actuando mucho más como un miembro legítimo del grupo hoy en día, y se nota. Cuando la conocí, no pensé que sería capaz de hacer otra cosa que hacer bromas a nuestra costa y planear asesinatos indiscriminados. Ahora está actuando más o menos como la entrenadora y coordinadora del equipo, y también se está tomando en serio su papel. Supongo que todo este plan de matar al Dios del Tiempo debe ser muy importante para ella si estaba dispuesta a cambiar tanto en tan poco tiempo. para que todo funcione."
