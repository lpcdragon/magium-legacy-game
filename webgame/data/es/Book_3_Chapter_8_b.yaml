            condition: b3_ch8_king = 4
          - source: scene_text_2
            paragraph: 22
            text: |-
              "Entonces, ¿alguien más piensa que el rey del subsuelo aceptó su derrota anterior con demasiada facilidad?" dice Hadrik. "Esperaba que se esforzara un poco más para evitar que Kelrim participara en las elecciones".

              "No podía oponerse abiertamente a él porque eso habría hecho parecer que estaba tratando de manipular el resultado de las elecciones", dice Kate. "Puedes estar seguro de que el rey del subsuelo no va a aceptar esto de brazos cruzados. Probablemente hará todo lo que esté en su poder para impedir que Kelrim sea coronado rey, incluso asesinarlo a él y al resto de nosotros si es necesario. Todos escuchamos lo que le dijo a Albert en esa grabación. Este hombre es del tipo que no deja que nadie se interponga entre él y sus objetivos".

              "Es cierto que el rey parecía insatisfecho con la idea de que un Goblin pudiera convertirse en gobernante de la ciudad", dice el padre de Leila, "pero ¿realmente mataría a tantos de sus aliados sólo para evitar tal resultado? Creo que eso podría ir demasiado lejos incluso para alguien como él".
            condition: b3_ch8_king = 5
          - source: scene_3
            paragraph: 10
            text: |-
              "Por lo que me dijo Leila, es posible eludir la detección de mentiras mintiendo por omisión", dice Kate. "Si eso es cierto, entonces leer el aura del rey del subsuelo para ver si está diciendo la verdad o no podría ser una de las peores ideas posibles, porque siempre habla con medias verdades y casi nunca miente de frente. Sería muy fácil para él darnos una respuesta cuidadosamente construida que sea técnicamente cierta y lo absuelva de culpa, incluso si está ocultando algo importante que no sabemos".

              "Sí, leer las verdaderas intenciones de ese tipo es una molestia", dice Arraka. "No lo recomendaría. He revisado su aura varias veces, y parece haber adquirido el hábito de agregarle un poco de temblor casi cada vez que habla de una verdad fácilmente verificable, para despistar a posibles lectores de aura como yo. Si hace que parezca que está mintiendo todo el tiempo, incluso cuando es obvio que está diciendo la verdad, se vuelve demasiado molesto cuando intentas diferenciar entre las mentiras reales y las mentiras falsas, considerando lo bueno que es en manipulación del aura. Tal vez podría resolverlo si me esforzara lo suficiente, pero no voy a perder el tiempo en algo tan estúpido como esto".
            condition: b3_ch8_king = 0
          - source: scene_3
            paragraph: 10
            text: |-
              "Por lo que me dijo Leila, es posible eludir la detección de mentiras mintiendo por omisión", dice Kate. "Si eso es cierto, entonces leer el aura del rey del subsuelo para ver si está diciendo la verdad o no podría ser una de las peores ideas posibles, porque siempre habla con medias verdades y casi nunca miente de frente. Sería muy fácil para él darnos una respuesta cuidadosamente construida que sea técnicamente cierta y lo absuelva de culpa, incluso si está ocultando algo importante que no sabemos".

              "Sí, leer las verdaderas intenciones de ese tipo es una molestia", dice Arraka. "No lo recomendaría. He revisado su aura varias veces, y parece haber adquirido el hábito de agregarle un poco de temblor casi cada vez que habla de una verdad fácilmente verificable, para despistar a posibles lectores de aura como yo. Si hace que parezca que está mintiendo todo el tiempo, incluso cuando es obvio que está diciendo la verdad, se vuelve demasiado molesto cuando intentas diferenciar entre las mentiras reales y las mentiras falsas, considerando lo bueno que es en manipulación del aura. Tal vez podría resolverlo si me esforzara lo suficiente, pero no voy a perder el tiempo en algo tan estúpido como esto".
            condition: b3_ch8_king = 1
