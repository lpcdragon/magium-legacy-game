  - name: b3_ch08b_leila5
    routes:
      - condition: b3_ch8_heartfelt = 2
        texts:
          - source: scene_text
            paragraph: 44
            text: |-
              "Lo tengo. Entonces solo nosotros dos. Es una promesa".

              Cuando Leila escucha mi respuesta, su rostro inmediatamente se ilumina de alegría mientras toma mi mano con ambas manos y la aprieta con fuerza, mientras me mira directamente a los ojos.

              "¡Es una promesa!" Leila escribe, todavía radiante, y luego, sin pensarlo, me da un rápido beso en los labios.

              Cuando la emoción inicial desaparece y se da cuenta de lo audaz que era, Leila se sonroja intensamente y gira la cabeza, como si de repente se hubiera vuelto demasiado consciente de sí misma para poder mantener contacto visual directo conmigo. Antes de tener la oportunidad de decir algo, Leila me suelta la mano, se levanta del suelo apresuradamente y coloca uno de sus textos azules frente a mí.

              "Creo que oí que los demás empezaban a despertarse", dice el escrito, mientras Leila sigue evitando mi mirada. "Yo... ¡iré a ver si necesitan algo!"
          - source: scene_text_2
            paragraph: 35
            text: |-
              "Umm... está bien", digo.

              Mientras Leila se prepara para irse, de repente se detiene en seco y se queda allí por unos segundos, probablemente dándose cuenta de que si simplemente se fuera así, me daría la impresión equivocada de que se arrepiente de haberme dado ese beso.

              A pesar de que el sonrojo aún no ha desaparecido por completo de sus mejillas, Leila logra reunir coraje para girarse y mirarme, y esta vez me mira directamente a los ojos, con una sonrisa sincera en su rostro.

              "¡Gracias, Barry, por aceptar trabajar conmigo en el turno de noche!" Escribe Leila. "Realmente disfruté nuestro tiempo juntos. ¡Espero que podamos volver a hacer esto pronto!"

              "Yo también lo espero", le digo a Leila. "Y también disfruté nuestro tiempo juntos. Puedes seguir adelante si quieres. ¡Estaré justo detrás de ti!"
          - source: scene_3
            paragraph: 21
            text: |-
              Leila asiente y luego corre hacia el dormitorio mientras yo agarro mi mochila y me preparo para seguirla también.

              'Solo nosotros dos', ¿eh?

              Hasta este momento, me he negado por completo a reconocer siquiera un futuro en el que no pueda ganar el torneo ni convertirme en mago. ¿Pero ahora?... Ahora empiezo a pensar que tal vez incluso un futuro así no sea tan malo después de todo...

              Tan pronto como regreso a nuestra habitación, veo que todos ya están despiertos y que estaban esperando que yo regresara para poder irnos juntos.

              Cuando entré por la puerta por primera vez, Leila miró brevemente en mi dirección, pero tan pronto como nuestras miradas se encontraron, se sonrojó de nuevo y rápidamente giró la cabeza para que los demás no pudieran ver su rostro. Por suerte, nadie pareció haber visto su reacción aparte de Melindra, quien me lanzó una mirada sugiriendo que entendía lo que estaba pasando, pero que decidió no comentar sobre la situación por el momento.
        effects:
          - set:
              ac_b3_ch8_heartfelt: 1
            achievement:
              id: ac_b3_ch8_heartfelt
              title: Una promesa sincera
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch08b_ending
      - condition: b3_ch8_heartfelt = 3
        texts:
          - source: scene_text
            paragraph: 45
            text: |-
              "Lo siento, yo... no puedo hacerles eso a mis amigos. Se sentirían traicionados si no los invitara".

              "Oh..." escribe Leila, mientras suelta mi mano y mira hacia un lado. "¡Tienes... tienes razón! Deberíamos invitarlos también, por supuesto. No querrían perderse todas las aventuras. Tal vez... sea mejor así..."

              Después de unos segundos más de contemplación silenciosa, suelta mi mano y se levanta del suelo sin mirarme, mientras otro texto azul aparece frente a mí.

              "Creo que escuché a los demás empezar a despertar", dice el escrito. "Probablemente deberíamos irnos".

              "Correcto", digo, en un tono algo vacilante. "Entonces volvamos."

              Mientras regresamos a los dormitorios, Leila camina frente a mí en silencio, como si estuviera tratando de ocultarme su rostro.
          - source: scene_text_2
            paragraph: 36
            text: |-
              "Yo... realmente disfruté nuestro turno de noche juntos", le digo, mientras seguimos avanzando. "Tal vez... podamos hacerlo de nuevo en algún momento".

              Cuando termino de hablar, Leila se detiene en seco de repente, así que decido hacer lo mismo, esperando a ver si llega algún mensaje de texto de ella.

              "Yo también lo disfruté", escribe Leila, unos momentos después, mientras se gira hacia mí.

              Cuando finalmente veo la expresión de su rostro, noto que está tratando de sonreír como suele hacerlo, pero hay un matiz de tristeza en sus ojos que parece que no puede ocultar a pesar de todos sus esfuerzos.
          - source: scene_3
            paragraph: 22
            text: |-
              "¡Gracias por aceptar pasar el turno de noche conmigo, Barry!" Escribe Leila.

              "De nada", digo con voz insegura, mientras Leila ahora se da vuelta y comienza a dirigirse hacia nuestros amigos nuevamente, y yo me muevo para seguirla.

              Ninguno de los dos dice nada más hasta llegar a la habitación en la que dormían los demás, y una vez allí vemos que ya todos estaban más o menos despiertos y que estaban esperando que volviéramos para poder irnos juntos.

              Tan pronto como nos notan, nuestros amigos agarran sus mochilas y salen por la puerta, para que podamos reunirnos todos frente a nuestra habitación.
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch08b_ending
  - name: b3_ch08b_hadrik2
    texts:
      - source: scene_text
        paragraph: 46
        text: |-
          "Bueno, entonces supongo que vamos a tener que hacer un turno de tres hombres para esta noche", digo. "Daren, ¿te parece bien?"

          "Sí, no tengo ningún problema con eso", dice Daren.

          "Guau..." dice Hadrik. "Nunca pensé que vería el día en que dos hombres adultos se ofrecieran a animarme con bebidas la misma noche. Supongo que debo haber sido muy deprimente últimamente, ¿eh? Bueno, ¡eso está a punto de cambiar muy pronto! Daren, Barry, ¡prepárense! Esta noche haremos un maratón de bebidas. ¡No digáis que no os lo advertí!"

          "Si hacer un maratón significa beber sorbos lentos cada pocos minutos, entonces estoy totalmente de acuerdo", dice Daren.

          "¡Jajaja!" dice Hadrik. "¡Ese es Daren para ti! ¡Siempre bromeando!"
      - source: scene_text_2
        paragraph: 37
        text: |-
          "Aunque no estoy bromeando", dice Daren. "No voy a hacer una maratón de bebida antes de una gran batalla. Sabes que eso no va a suceder".

          "No te preocupes, estoy seguro de que te entusiasmará la idea después de los primeros tragos", dice Hadrik. "Vamos. ¡Tengo todas las botellas que necesitamos aquí en mi mochila!"

          Después de que Kate y Leila se ofrecieran a tomar el segundo turno de noche, Hadrik, Daren y yo salimos de la habitación para buscar un buen lugar sin cristales en las paredes o el techo, mientras los demás se van a dormir. Una vez que encontramos un lugar que esté lo suficientemente lejos como para no molestar a los demás con nuestra conversación pero lo suficientemente cerca como para ver la entrada de la habitación donde duermen, los tres nos sentamos en el suelo de manera que todos podamos ver las caras de los demás cuando hablamos, y Hadrik comienza a sacar las botellas de cerveza enana de su mochila.

          "Buenos dioses, hombre", dice Daren, después de que Hadrik saca la sexta botella. "¿Cuántas de estas botellas tienes en esa mochila tuya?"
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch08b_hadrik3
  - name: b3_ch08b_hadrik3
    texts:
      - source: scene_text
        paragraph: 47
        text: |-
          "¡Tantos como necesitemos!" dice Hadrik, y luego toma la séptima botella.

          "¿No has bebido al menos una botella al día desde que empezó el torneo?" dice Daren. "Eso significa que debes haber comprado docenas de estos antes de venir aquí".

          "Más bien cientos", dice Hadrik, mientras guarda su mochila en algún lugar detrás de él y nos entrega una botella a cada uno. "Siempre me abastezco de estas botellas cada vez que vuelvo a las tierras de los enanos, porque sé muy bien que el alcohol en otras regiones del mundo no tiene comparación".

          "¿La mayoría de los encantadores no ponen un límite a la cantidad de artículos que puedes caber en una sola mochila para evitar fallas no deseadas?" dice Daren. "Realmente nunca he tenido ese problema con las mochilas que he encantado, pero escuché que es un problema común para la mayoría de los otros magos que se especializan en este oficio".

          "Sí, por eso pagué dinero extra por mi mochila", dice Hadrik. "No solo puede almacenar una tonelada de artículos en él, sino que también almacena botellas de una manera que evita que se rompan accidentalmente. ¡Está prácticamente hecho a medida para borrachos como yo! Pero de todos modos, ya hemos hablado suficiente sobre esto. Ya se me está secando la garganta. ¡Brindemos!"
      - source: scene_text_2
        paragraph: 38
        text: |-
          "¡Salud!" decimos todos, mientras chocamos nuestras botellas y luego bebemos de ellas.

          "Sabes, si realmente quieres animarme, necesitarás tomar sorbos más largos", dice Hadrik con una sonrisa. "Parece como si nunca hubieras tocado tus botellas".

          "Sí, pero nosotros también nos emborrachamos mucho más fácilmente que tú, ya que eres un gigante y además has tenido mucho tiempo para desarrollar tolerancia a este tipo de alcohol", le digo a Hadrik. "¿Has estado bebiendo cerveza enana durante cuánto... cincuenta años?"

          "Honestamente, he perdido la cuenta", dice Hadrik. "Pero sí, comencé a beber más desde que me mudé a las tierras de los enanos, y ha pasado un tiempo desde entonces. Aún así, incluso después de todos estos años, no puedo decir que mi tolerancia se compare con la de la mayoría de los enanos que he conocido en las tabernas que frecuento. Es como si esos pequeños tuvieran hígados hechos de acero élfico. No es de extrañar que necesitaran inventar un tipo de alcohol tan fuerte como la cerveza enana. ¡Todo lo demás probablemente les sabría a agua!"
      - source: scene_3
        paragraph: 23
        text: |-
          "¿Alguna vez has intentado hacer un negocio vendiendo cerveza enana a personas de otros continentes además del norte?" pregunta Daren. "Apuesto a que se vendería como pan caliente. En realidad, ¿por qué ninguno de los enanos ha pensado en hacer algo como esto? Durante todos mis viajes, creo que solo he visto uno o dos lugares que venden cerveza enana, pero no más que eso. Se podría pensar que una bebida tan conocida como esta sería una de las primeras cosas que intentarían exportar fuera de su tierra natal".

          "Bueno, verás", dice Hadrik, "el problema es que a la mayoría de los enanos no les gusta estar lejos de casa por mucho tiempo. Les gusta visitar otros continentes por periodos cortos de tiempo, pero no querrían ganarse la vida vendiendo alcohol allí. Y los comerciantes de vuestros continentes rara vez vienen a visitarnos, así que no es como si pudiéramos venderles las botellas para que las entreguen al resto del mundo. En la práctica, la única manera en que tu gente llega a probar la cerveza enana es cuando un enano visita uno de vuestros países y comparte sus botellas con la gente de las tabernas locales. Así es como este tipo particular de cerveza se ha vuelto tan conocido en vuestras regiones a pesar de lo difícil que es conseguirlo."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch08b_hadrik4
  - name: b3_ch08b_hadrik4
    texts:
      - source: scene_text
        paragraph: 48
        text: |-
          "Eh..." dice Daren, mientras toma un pequeño sorbo de cerveza. "Nunca supe que a los enanos les gustara tanto su tierra natal. ¿Es por eso que no ves a muchos enanos viviendo en el Continente Occidental, a diferencia de la gente de mi continente, que se mudó allí en masa cuando tuvieron la primera oportunidad, debido a las condiciones climáticas ideales?"

          "Sí, supongo que a los enanos les debe gustar mucho el frío", dice Hadrik. "Aunque, admitiré que hay un cierto encanto en ese lugar una vez que te acostumbras. Creo que se debe a la gente. No importa con quién hables, siempre sientes que estás en buena compañía. Es una verdadera lástima que muchos de los otros gigantes no puedan entender esto. Ha pasado tanto tiempo desde que terminó la guerra entre nuestros dos pueblos, pero no siento que sus opiniones sobre los enanos en general hayan cambiado mucho desde entonces. Incluso alguien como Gontrok, que es un cambiaformas y puede reducir su tamaño para hablar, todavía actúa de la misma manera que--"

          Hace una pausa.

          "Queridos dioses, hablo de él como si todavía estuviera vivo", dice Hadrik. "¿Qué me pasa? Apenas he tocado esta botella y ya estoy diciendo tonterías".
      - source: scene_text_2
        paragraph: 39
        text: |-
          "¿No eran ustedes dos amigos antes de que se pelearan, durante la guerra?" digo. "Tal vez esa es la razón por la que aún no te has acostumbrado a la idea de su muerte".

          "No creo que haya habido un momento en mi vida en el que pudiera haber llamado amigo a Gontrok", dice Hadrik. "A lo sumo podría haberlo llamado compañero de armas, cuando estábamos luchando en el mismo lado. Pero la forma en que murió... por lo que me has dicho, había pocas maneras en las que podría haber tenido una muerte menos honorable. No desearía algo como esto ni siquiera para mis enemigos más odiados. Demonios, incluso su cadáver se está pudriendo en algún lugar en una caverna subterránea, con la cabeza volada y una mano que fue mutilada con tanta fuerza que la naturaleza misma de su existencia cambió. retroactivamente. Dudo que alguien que lo conociera lo reconociera si viera su cuerpo sin cabeza en este momento".
      - source: scene_3
        paragraph: 24
        text: |-
          "¿Le gustaría que recuperáramos su cadáver y le diésemos un entierro digno?" pregunta Daren.

          "No..." dice Hadrik. "Por mucho que no me guste la forma en que murió, eso no cambia el hecho de que no le debo nada a ese tipo y no voy a hacerle ningún favor incluso después de su muerte. Él tomó sus propias decisiones que lo llevaron allí y pagó el precio. Eso es todo".

          Después de que deja de hablar, Hadrik toma un largo trago de su botella y luego la deja en el suelo junto a él.

          "De todos modos, esta discusión se ha vuelto un poco sombría, así que ya sabes...", dice Hadrik. "Ahora es tu oportunidad de animarme. ¡Adelante, haz tu mejor esfuerzo!"
