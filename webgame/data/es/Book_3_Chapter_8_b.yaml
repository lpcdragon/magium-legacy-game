  - name: b3_ch08b_king3
    texts:
      - source: scene_text
        paragraph: 11
        text: |-
          Una vez más, el rey del subsuelo y Albert intercambian una mirada, pero esta vez es Albert quien responde.

          "Daremos prioridad al rescate de los prisioneros que tienen familiares aquí en el subsuelo", dice Albert. "Después de que todos estén a salvo, veremos cuántas personas más podremos salvar sin comprometer la delicada infraestructura de esta ciudad".

          "Entonces lo que estás diciendo es que vas a abandonar a todas las personas inocentes que no conoces ni te importan personalmente", dice Kate.

          "Nadie ha dicho que los abandonemos", afirma el rey del subsuelo. "En algún momento también los rescataremos, por supuesto, pero llevará tiempo. Esto puede ser difícil de entender para un extraño, pero muchos de los ciudadanos de Ollendor dependen en gran medida del uso de sus dispositivos. Por ejemplo, hay muchas personas en esta ciudad que normalmente tendrían que caminar durante horas para llegar desde sus casas a sus lugares de trabajo, pero con el uso de vehículos metálicos voladores que probablemente ya habrás visto deambulando por los cielos antes del cierre, pueden llegar allí en media hora o menos. Si estos vehículos metálicos dejaran de funcionar repentinamente, muchas personas se quedarían sin trabajo y eventualmente se quedarían sin dinero para comprar comida para sus familias. ¿Le gustaría asumir la responsabilidad de arruinar el sustento de todas estas personas solo para sentirse mejor por salvar a unos cuantos prisioneros más?"
      - source: scene_text_2
        paragraph: 12
        text: |-
          "Esos 'pocos prisioneros extra' han estado viviendo en el infierno durante quién sabe cuántos meses", dice Kate, enojada. "¡No te atrevas a comparar su situación con la de algunos holgazanes inútiles que ni siquiera se molestan en caminar unas horas más hasta el trabajo para poder alimentar a sus propias familias!"

          "Puedo ver claramente que esta situación te está afectando a nivel personal", dice el rey del subsuelo, tras ver la furia en los ojos de Kate. "Y admito que tal vez haya simplificado demasiado la precaria situación en la que se encuentran actualmente estos prisioneros... Sin embargo, también creo que tu parcialidad personal te está llevando a hacer algunas comparaciones injustas. Tal vez el ejemplo que usé no fue el más inspirado, pero seguramente podrías ver cómo el mal funcionamiento repentino del principal medio de transporte en una ciudad podría causar que su infraestructura colapse sobre sí misma, ¿no? Incluso hay personas que se ganan la vida transportando mercancías de un extremo de la ciudad a otro. el otro usando sus vehículos metálicos, por el amor de Dios... ¿Te imaginas cómo reaccionaría la gente de Ollendor si todos los dispositivos de la ciudad dejaran de funcionar y miles de personas se quedaran repentinamente sin trabajo tan pronto como un nuevo rey tomara el trono? ¡Habría disturbios de tal magnitud que podrían comenzar toda una guerra civil!
      - source: scene_3
        paragraph: 5
        text: |-
          "Así que esa es la verdadera razón por la que no quieres salvar a esos prisioneros", dice Kate, en tono disgustado. "Es porque arruinaría tus posibilidades de conservar tu precioso trono".

          Después de escuchar lo que Kate tenía que decir, el rey del subsuelo cierra los ojos y sacude la cabeza con desaprobación durante uno o dos segundos.

          "Está claro que no avanzamos en esta conversación", afirma el rey del subsuelo. "Cree lo que quieras. De cualquier manera, creo que ya obtuviste la respuesta que estabas buscando. Ahora, ¿quizás finalmente haya llegado el momento de que tengamos una pequeña discusión sobre el Supervisor y el control que actualmente tiene sobre esta ciudad?"

          "Tal vez deberíamos, sí", dice Daren.
