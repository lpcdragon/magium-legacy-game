  - name: b3_ch08b_workshop2
    texts:
      - source: scene_text
        paragraph: 28
        text: |-
          Como prometí, pasé las siguientes horas caminando de un lugar a otro, tratando de ver si podía recopilar alguna información útil. Visité la mayoría de las áreas principales, como el comedor, las viviendas, la enfermería y el área de recreación, pero lamentablemente no pude lograr mucho más que confirmar algunas de mis sospechas.

          En casi todos los lugares a los que fui, siempre me encontraba con algunos de los hombres que Albert colocó estratégicamente para cantar las alabanzas del rey del subsuelo, pero por lo que pude ver, había muchas personas que realmente no se lo creían. Parecía haber muchos hombres que no estaban exactamente contentos con los métodos del rey del subsuelo y que felizmente votarían por cualquier otra alternativa que se les presentara, y también parecía que el rey del subsuelo tenía una reputación no tan buena entre los refugiados que venían de la superficie.

          Por lo que pude deducir, muchos de estos refugiados lo conocían como algún tipo de jefe de la mafia, lo cual no es tan sorprendente, considerando el título que suena dudoso que eligió para sí mismo y su afición por asesinar a personas que no le agradan. También hubo algunos refugiados que parecían haber recordado erróneamente su nombre como rey del "inframundo" en lugar de "subsuelo", lo que lo hace sonar aún más sospechoso de lo que ya es.
      - source: scene_text_2
        paragraph: 24
        text: |-
          Mientras iba de un lugar a otro, también aprovechaba para ver a mis amigos para ver qué hacían cada vez que yo estaba en la zona. Kate y Arraka estaban en medio de una discusión cuando las encontré. Aparentemente, estaban teniendo una discusión sobre los orígenes de las diversas razas en el mundo, y Kate opinaba que la razón por la que existen exactamente las mismas razas tanto en el plano mágico como en el plano terrestre es porque ambos planos de existencia se originaron en el plano primordial.

          Arraka no estuvo de acuerdo con esta hipótesis, diciendo que no había pruebas sólidas para apoyar su teoría, y que incluso si estas razas se hubieran originado en el plano primordial, todavía no explicaría por qué Magium tiene un sistema para crear nuevos espíritus en el plano mágico con exactamente las mismas razas que antes.

          Aparentemente, la teoría de Arraka es que la división del plano primordial fue un accidente de algún tipo, y que el Magium actualmente está tratando de arreglarlo como un barco que se hunde, regulando artificialmente el número de espíritus en el plano mágico y usando las profecías de los tejedoras del tiempo en el plano terrestre para tratar de evitar eventos cataclísmicos que causarían la muerte de demasiadas personas simultáneamente.
      - source: scene_3
        paragraph: 14
        text: |-
          También parece creer que las razas que tenemos actualmente en los planos mágico y terrestre no tienen nada que ver con las razas originales del plano primordial, y que probablemente también sean el resultado del accidente que causó la división.

          No me quedé con ellos el tiempo suficiente para escuchar el final de su discusión, pero me pareció que Arraka no había tenido mucho éxito en sus intentos de convencer a Kate de cambiar su postura sobre el tema.

          Después de hacer también visitas breves a Hadrik, Daren y Leila, quienes todavía estaban ocupados con las tareas que se propusieron realizar cuando nos separamos por primera vez, el tiempo pasó volando y, finalmente, Daren se puso en contacto con cada uno de nosotros para que finalmente pudiéramos encontrarnos en algún lugar de un túnel abandonado sin cristales y decidir qué le diríamos al Supervisor.

          Hubo una discusión bastante larga, con cada uno dando sus propias opiniones diferentes, pero después de mucho esfuerzo finalmente pude convencer a mis amigos de que nuestro mejor curso de acción sería...
    choices:
      - position: 1
        text: De acuerdo con el plan del Supervisor de tender una emboscada al rey del subsuelo.
        effects:
          - set:
              current_scene: b3_ch08b_answer
              b3_ch8_overseer2: 1
      - position: 2
        text: Dile al Supervisor que no lo ayudaremos a tenderle una emboscada al rey del subsuelo.
        effects:
          - set:
              current_scene: b3_ch08b_answer
              b3_ch8_overseer2: 0
  - name: b3_ch08b_answer
    routes:
      - condition: b3_ch8_overseer2 = 0 AND b3_ch4_billy <> 7 AND b3_ch4_billy <> 8
        texts:
          - source: scene_text
            paragraph: 32
            text: |-
              ...Dígale al Supervisor que no lo ayudaremos a tenderle una emboscada al rey del subsuelo.

              Una vez que decidimos qué decirle, todo lo que teníamos que hacer era regresar a nuestros dormitorios y gritar el nombre del Supervisor para que nos respondiera inmediatamente desde uno de los cristales, como si hubiera estado allí todo este tiempo, esperando nuestra respuesta.

              Cuando le informamos que no queríamos seguir su plan, el Supervisor claramente no estaba muy contento, pero dijo que aún estaba dispuesto a darnos la oportunidad de cambiar de opinión y que no nos atacaría inmediatamente después de llegar a la superficie, para darnos algo de tiempo para recuperar el sentido y atacar al rey del subsuelo nosotros mismos.

              Tan pronto como terminó nuestra conversación con el Supervisor, comenzamos a hacer preparativos para ir a dormir, ya que se estaba haciendo un poco tarde.
          - source: scene_text_2
            paragraph: 27
            text: '"Entonces, ¿alguien tiene ganas de ofrecerse como voluntario para un turno de noche?" Nos pregunta Daren, una vez que todos terminamos de hacer nuestras camas.'
