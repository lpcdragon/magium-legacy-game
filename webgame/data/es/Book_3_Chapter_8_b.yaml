  - name: b3_ch08b_leila2
    texts:
      - source: scene_text
        paragraph: 37
        text: |-
          "Está bien", digo. "Estoy seguro de que a los demás no les importa. Aún así, es una lástima que el doctor Reidzek no pueda modificar su dispositivo de estadísticas para generar también una voz junto con sus mensajes de texto. Tal vez de esa manera hubiera sido más fácil para usted unirse a una discusión de forma natural sin tener que sentir constantemente que está interrumpiendo".

          "¡Sí, exactamente!" Escribe Leila, mientras de repente se gira hacia mí, pareciendo un poco emocionada de que alguien haya logrado ponerse en su lugar y ver las cosas desde su perspectiva. "¡Eso es exactamente lo que siento cada vez que intento unirme a una conversación! ¡Es como si siempre estuviera interrumpiendo!"

          "Bueno, no es una sorpresa que te sientas así", le digo. "Incluso si su dispositivo está diseñado para traducir sus pensamientos en palabras, imagino que todavía hay un retraso considerable entre el momento en que tiene sus pensamientos y el momento en que el dispositivo realmente muestra el texto. Además, por lo que he visto, usted tiene control sobre la posición del texto y también su tamaño, por lo que cuando haya terminado de configurar todas estas variables, el breve momento en el que podía insertarse en la conversación sin hacer las cosas incómodas probablemente ya haya pasado".

          "Mhm", escribe Leila, mientras mira la pared frente a ella mientras extiende lentamente las piernas. "E incluso si de alguna manera logro lograr el momento adecuado, si no coloco el texto en un lugar que sea visible para todos, es posible que se den cuenta demasiado tarde y entonces seguiría interrumpiendo. Tener una voz haría las cosas mucho más fáciles..."
      - source: scene_text_2
        paragraph: 30
        text: |-
          "Bueno", digo, "no estoy seguro de cuánto ayuda esto, pero al menos ahora puedes estar seguro de que hay una persona en el mundo que puede imaginarte con una voz".

          "...¿Qué quieres decir?" Leila escribe, confundida.

          "La voz del Plano Etéreo, ¿recuerdas?" Le digo a Leila. "El que me estaba traduciendo tus pensamientos mientras ambos éramos enviados por la habitación volando por el Magium. Desde ese momento, he estado leyendo inconscientemente todos tus textos con esa voz en mi cabeza, incluso si sé que no es tu voz real. Oye, ¿pasa algo? ¡Tu cara está toda roja!"

          "Había... casi olvidado que podías escuchar la voz de mi cabeza mientras estábamos allí...", escribe Leila, mientras su texto se vuelve borroso y tembloroso, probablemente debido a que está avergonzada.
      - source: scene_3
        paragraph: 17
        text: |-
          "¿La voz de tu cabeza?..." digo. "Espera un momento, ¿quieres decir que la voz que escuché fue en realidad la voz que estás usando en tu propia cabeza mientras piensas?"

          Leila no escribe nada, pero asiente débilmente, mientras su cara sigue roja como un tomate.

          "Pero... ¿cómo?" digo. "Nunca antes has tenido la oportunidad de escuchar tu voz real, ¿verdad?"

          "No es mi voz 'real', ya que no creo que tenga una", escribe Leila, mientras poco a poco se calma y su cara se vuelve menos roja. "pero desde que era pequeño siempre quise tener una voz como la de todos los demás niños, así que como... me hice una en mi propia cabeza, y seguí cambiándola cada pocos años para que sonara más adulta. Creo que la voz que escuchaste fue la última versión, que es la que estoy usando para pensar ahora mismo, porque podía escuchar mis pensamientos resonando a mi alrededor en el Plano Etéreo, y sonaban igual. Para ser honesto, cuando hice esta voz Realmente no esperaba que nadie más que yo lo escuchara, así que hablar de ello así es un poco vergonzoso..."
    choices:
