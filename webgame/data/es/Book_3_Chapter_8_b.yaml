              Cuando le dimos al Supervisor las condiciones bajo las cuales aceptaríamos colaborar con él, intentamos aprovechar al máximo su incapacidad para decir mentiras descaradas, haciendo que los términos de nuestro acuerdo fueran lo más específicos posible, para que no pudiera escaparse de nuestro contrato verbal.

              Daren, por ejemplo, le hizo prometer que sólo capturaría al rey del subsuelo y a sus hombres, pero no los mataría, y que no les sucedería ningún daño durante su encarcelamiento. Otra condición que le hicimos aceptar fue que una vez que el rey del subsuelo estuviera bajo su custodia, el Supervisor terminaría el bloqueo y nos permitiría viajar dentro y fuera de la ciudad ilesos, siempre y cuando no lo atacaramos a él o a sus drones primero.

              Sin embargo, cuando intentamos que prometiera que liberaría a los prisioneros de las torres del seredium, el Supervisor se mostró mucho menos cooperativo. Su respuesta fue que tal como están las cosas ahora, los magos prisioneros eran necesarios para sostener tanto los dispositivos de la ciudad como sus drones, y que no estaría dispuesto a liberarlos hasta que encontrara una fuente alternativa de energía que fuera tan potente como la que proporcionan las torres, en su forma actual.
