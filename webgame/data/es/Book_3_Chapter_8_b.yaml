        texts:
          - source: scene_text
            paragraph: 24
            text: |-
              "Espera, acabo de recordar algo", dice Hadrik. "¿No nos dijo el Supervisor que solo aceptaría a Breynan como rey cuando formáramos nuestra alianza con él? ¿Qué crees que va a decir cuando descubra que hemos elegido a un Goblin del que probablemente nunca haya oído hablar como candidato a rey?"

              "No creo que haya dicho explícitamente que Breynan sería la única opción que aceptaría", dice Daren, "pero si queremos mantener nuestra alianza con el Supervisor, es casi seguro que necesitaremos renegociar nuestros términos con él. Inicialmente acordamos que le dejaríamos gobernar Ollendor detrás de escena, pero eso fue antes de que supiéramos que teníamos a Kelrim como alternativa. Ahora realmente no estaría dispuesto a aceptar nada más que, como máximo, una colaboración entre los dos. No tendría sentido que Kelrim tomara el trono si fuera sólo un títere del Supervisor."

              "De acuerdo", digo. "Primero, vamos a necesitar hablar con Breynan sobre esto, y una vez que hayamos establecido si queremos mantener nuestra alianza con el Supervisor o no, tendremos que hablar con el Supervisor también y ver si ÉL todavía querrá mantener su alianza con nosotros, considerando que hemos cambiado los términos de nuestro acuerdo tan drásticamente. Pero sí, como dijo Daren, probablemente deberíamos tomarnos un descanso por ahora, y resolveremos todo esto más tarde".

              "Me parece bien", dice Hadrik. "Muy bien, nos vemos luego. Voy a ver si puedo mejorar un poco más mi nueva técnica de cambio de forma".
          - source: scene_text_2
            paragraph: 23
            text: |-
              "En ese caso, reanudaré mis lecciones de entrenamiento con Kate", dice Melindra. "Flower, ¿podrías venir con nosotros también? Hay algunas cosas que siento que no puedo explicarle lo suficientemente bien a Kate, y pensé que tal vez podrías encontrar una forma más intuitiva de ayudarla a aprender".

              "¡Claro!" Flower dice. "¿Hacia dónde vamos?"

              "Había un túnel vacío que estábamos usando para entrenar justo antes del ataque de los guardias reales", dice Melindra. "Si ya lo repararon, iremos allí. De lo contrario, buscaremos otro lugar".

              "Entendido", dice Flower. "¡Vamos!"

              "Creo que daré un pequeño paseo por las cuevas", digo, mientras Kate, Flower y Melindra se despiden. "¡Tal vez con un poco de suerte escuche alguna conversación realmente importante que podría sernos útil!"
