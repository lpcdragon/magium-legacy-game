        texts:
          - source: scene_text
            paragraph: 8
            text: |-
              "Si lo que estás buscando es un rey digno de confianza, entonces Kelrim sería mi elección".

              "¿El Goblin?..." dice el rey del subsuelo, pareciendo por primera vez como si realmente se hubiera quedado sin palabras. "¿Un Goblin como nuevo rey de Ollendor? Esa es sin duda una... recomendación única. No quiere decir que no la tomaremos en consideración, por supuesto, pero... eh... ¿a alguien más le gustaría hacer alguna otra sugerencia?"

              "De hecho, también me gustaría dar mi voto a Kelrim", afirma Daren. "Tengo todas las razones para creer que sería un rey excelente".

              "¿A-acabo de escuchar eso verdad?" Dice Kelrim, mientras ahora se acerca rápidamente a nosotros. "Daren, ¿acabas de proponerme como candidato al trono?..."

              "Bueno, para ser más exactos, Barry fue quien te propuso matrimonio primero, pero sí, también estoy de acuerdo con él", dice Daren.
          - source: scene_text_2
            paragraph: 6
            text: |-
              "Yo... les agradezco a ambos por la confianza que han puesto en mí", dice Kelrim, mientras nos mira a los dos por turno, "pero tienen que entender... un Goblin como rey de una ciudad que está compuesta en su mayoría por humanos sería algo completamente sin precedentes. Ya estoy inmensamente agradecido con los ciudadanos de Ollendor por aceptar suficientes razas de monstruos para permitirnos vivir dentro de su ciudad, pero incluso pensar en convertirme en su gobernante siento que me estaría aprovechando demasiado de su generosidad. Y además, no puedo pensar en nadie más que ustedes dos que consideraría darme su apoyo en este asunto. Lo siento mucho, pero incluso si me proponen como candidato, tendré que negarme a participar en las elecciones."

              "Bueno..." dice Daren. "Si eso es lo que sientes entonces supongo que no hay nada que podamos hacer. Pero para que conste, realmente creo que podrías estar subestimándote a ti mismo y al apoyo que la gente de esta sociedad del subsuelo podría estar dispuesta a brindarte".

              "Entiendo que ambos tienen buenas intenciones", nos dice el rey del subsuelo a Daren y a mí, "pero creo que Kelrim tomó la decisión correcta. El reino estará bastante agitado como lo está por la muerte del rey anterior, y no creo que sería prudente avivar aún más las llamas presentando una propuesta tan inusual para el nuevo rey. Ahora bien, ¿alguno de ustedes quisiera hacer alguna otra sugerencia?"
          - source: scene_3
            paragraph: 3
            text: |-
              "Me gustaría proponer al doctor Reidzek como candidato", dice Daren, mientras el padre de Leila vuelve la cabeza hacia él con expresión de asombro.

              "Una excelente elección!" El rey del subsuelo le dice a Daren, después de echar una rápida mirada hacia el padre de Leila, que observe su reacción. "El Doctor Reidzek se ha convertido en un miembro muy respetado de nuestra sociedad en el poco tiempo que nos ha honrado con su presencia, por lo que no tengo dudas de que reuniría muchos votos si aceptara participar en nuestras elecciones. ¿Qué dice, doctor? ¿Debería poner su nombre en las listas de candidatos?"

              "Tengo... miedo de no participar en las elecciones", dice el padre de Leila. "Lo siento, Daren, pero convertirme en rey sería una responsabilidad demasiado grande para un simple inventor como yo. Me uní a esta rebelión porque quería ayudar a mejorar esta ciudad, pero la idea de liderar un reino entero es demasiado para mí. Espero no haber terminado decepcionando a ninguno de ustedes al decir esto".

              "Umm, no... ¡por supuesto que no!" dice Daren. "Es tu elección si quieres ser rey o no. Sólo estaba haciendo una sugerencia, eso es todo..."
        choices:
