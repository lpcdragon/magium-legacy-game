              "Está claro que desde el principio esperaba que el doctor Reidzek rechazara la oferta", dice Kate. "De lo contrario, no habría estado tan entusiasmado con la sugerencia de Daren".

              "Sí, pero aun así", dice Hadrik, "la grabación que escuchamos antes hizo que pareciera que el rey del subsuelo ni siquiera consideraría otra opción que él mismo, y que estaría dispuesto a matarnos si sugeriéramos algo diferente. Habrías pensado que al menos intentaría argumentar que él sería la mejor elección, antes de dejar que Daren diera sus sugerencias. No lo sé... Esto me parece un poco sospechoso. ¿Crees que la grabación podría haber sido falsa después de todo? ¡Tal vez deberíamos preguntarle al rey del subsuelo sobre esto! ¡Y luego Melindra, Arraka o Leila podrían leer su aura para ver si está mintiendo!"
