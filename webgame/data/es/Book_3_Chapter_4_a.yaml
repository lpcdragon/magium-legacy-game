  - name: b3_ch04a_avg_joe
    texts:
      - source: scene_text
        paragraph: 10
        text: |-
          "¿Debo suponer que tus nuevas estadísticas se desbloquearon correctamente?", me pregunta Kate cuando me ve guardarme otra vez el dispositivo de estadísticas en el bolsillo.

          "Sí", digo. "Mi dispositivo vuelve a ser totalmente funcional y ya tengo activadas mis tres estadísticas nuevas."

          "Entonces, ¿de verdad vas a invertir puntos para probar tus estadísticas esta vez o simplemente vas a dejar todos tus puntos sin gastar como antes?", me pregunta Kate con el ceño fruncido.
    choices:
      - position: 1
        text: No voy a gastar ningún punto. Solo empezaré a invertirlos cuando sea absolutamente necesario.
        effects:
          - set:
              current_scene: b3_ch04a_avg_joe2
              b3_ch4_demolisher: 1
      - position: 2
        text: Mira, el dispositivo de estadísticas siempre fue un plan de respaldo. No quiero empezar a depender de él.
        effects:
          - set:
              current_scene: b3_ch04a_avg_joe2
              b3_ch4_demolisher: 2
      - position: 3
        text: No en esta ranura de guardado. Estoy usando esta para el logro de Ciudadano Promedio.
        effects:
          - set:
