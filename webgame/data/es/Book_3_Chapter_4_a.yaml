            paragraph: 7
            text: |-
              'La estadística de Farol u Ocultación de aura está diseñada para ayudarte a controlar tu aura", dice el texto. "Tiene dos propósitos principales. Antes que nada, esta estadística te permitirá mantener el flujo de tu aura lo bastante estable como para evitar la detección de mentiras si tu nivel es lo bastante alto. Igual que ocurre con la estadística de Sentido mágico, los efectos que tenga sobre ti dependerán mucho de tu propia capacidad para controlar tu aura. Si tu control de aura es muy deficiente, entonces tendrás que invertir más puntos en esta estadística para que resulte razonablemente eficaz.'

              'La segunda utilidad de esta estadística se descubrió durante las pruebas', dice la siguiente página. 'Aunque el propósito inicial de esta estadística era solo mantener estable el flujo del aura, algunos de los sujetos de prueba descubrieron que, con suficiente práctica, también podía utilizarse para ocultar completamente sus auras, volviéndose indetectables en términos de sentido mágico. Después de recibir esta nueva información, hicimos unos cuantos ajustes a la estadística de Farol y también le dimos un nombre secundario, para reflejar mejor su potencial. Si no eres capaz de usar esta estadística para ocultar tu aura, ponte en contacto con la persona encargada de tu activación de estadísticas para que pueda reajustar tu dispositivo.'
          - source: scene_text_2
            paragraph: 8
            text: |-
              Cuando pulso el botón de 'página siguiente' una vez más, me aparece un último texto antes de poder pasar a mi pantalla habitual de estadísticas.

              'Esto concluye la introducción de las estadísticas experimentales de aura', dice el texto. 'Pulsar el botón de página siguiente te devolverá ahora a tu pantalla de estadísticas. No olvides que, si tenías puntos invertidos en tus estadísticas antes de la activación, tendrás que repartirlos de nuevo, ya que se han reiniciado.'

              En cuanto pulso el botón, por fin aparece la pantalla de estadísticas y puedo ver que mis tres nuevas estadísticas se han añadido justo debajo de las demás, que en este momento están todas a nivel cero. También me doy cuenta de que tengo un punto adicional disponible para gastar. Este debe de ser el punto de 'bonificación' que el padre de Leila dijo que obtendría por haber bloqueado mis estadísticas por accidente. El que hará que reciba un punto menos cuando me llegue el siguiente lote. Tendré que pensar si quiero empezar a repartir mis puntos ahora o si debería esperar hasta más tarde antes de decidirme.
