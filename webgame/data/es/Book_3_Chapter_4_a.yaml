            text: |-
              "No hay... tiempo para descansar", dice Illuna mientras se pone lentamente de pie y casi vuelve a caer al suelo. "Por lo que sabemos, ahora mismo podríamos estar dentro de territorio enemigo. Tenemos que seguir moviéndonos."

              Illuna intenta dar unos pasos hacia delante, pero vuelve a tropezar justo cuando Kate y yo corremos a sostenerla.

              "Estoy bien", dice Illuna con voz débil mientras consigue recuperar el equilibrio ella sola. "Puedo caminar por mi cuenta."

              "Lo que tu amiga banshee dijo antes es cierto", nos dice Breynan. "De verdad no podemos permitirnos perder más tiempo aquí. Acabo de intentar contactar con Barry desde la sala del teletransportador, pero no he tenido suerte. Debe de haber demasiadas paredes de seredium entre nosotros y él para que podamos alcanzarlo, dado que probablemente estamos situados a la misma altura que la base rebelde. Seguramente tendremos que llegar a la superficie antes de que pueda teletransportarnos otra vez."
