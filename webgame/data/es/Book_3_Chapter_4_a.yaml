  - name: b3_ch04a_attention
    routes:
      - condition: b3_ch4_control = 0
        texts:
          - source: scene_text
            paragraph: 45
            text: |-
              "Yo digo que, por ahora, deberíamos centrarnos en encontrar la salida."

              "Por mucho que me gustaría liberar a toda esta gente aquí y ahora, me temo que tengo que estar de acuerdo con Barry", dice Breynan. "Simplemente no tenemos aquí con nosotros a suficiente gente como para llevar a cabo una misión de rescate de esta magnitud--"

              "¡Atención! ¡Atención todos los prisioneros de debajo de la torre!", oímos de repente la voz de Billy Bob, el lessathi, saliendo de lo que parece ser un amplificador de voz conectado a algún tipo de transceptor, colocado en una esquina elevada de la sala. "Los limpiadores irán a visitarlos dentro de aproximadamente una hora. Prepárense. Si vuelvo a oír hablar de más incidentes, hoy no recibirán más comida. Que quede claro. Esto significa nada de volver a patear a los empleados mientras los lavan, nada de forcejear y, desde luego, nada de morder. Uno de los viejos limpiadores sigue recuperándose desde la última vez que ustedes--"

              "Maestro Biliborrathrathsarran, le pido disculpas por interrumpirlo, pero--", oímos la voz de otro hombre saliendo del amplificador de voz.

              "¡El nombre es Biliborrathrathsarran, idiota!", dice Billy Bob. "Pronunciaste mal la última 'r'. ¿Qué tan idiota hay que ser para no ser capaz de pronunciar bien un solo nombre?"

              "Señor, por favor, esto es muy urgente", dice el sirviente. "El rey ha solicitado su presencia en el castillo de inmediato y--"
          - source: scene_text_2
            paragraph: 28
            text: |-
              "Que espere", dice Billy Bob. "Tengo un experimento importante que debo terminar primero. Lo visitaré cuando haya acabado."

              "¿No podría al menos hacer que uno de sus droons le avisara de que llegará tarde?", dice el sirviente. "Estoy seguro de que debería haber al menos uno de ellos lo bastante cerca como para--"

              "¡Por última vez, se llaman DRONES!", dice Billy Bob. "¡Drones, no droons! ¿Cómo es tan difícil de recordar?"

              "Ooooh", dice Melindra. "¡Así que así se llamaban!"

              "¡Shhh!", digo. "Estoy intentando escuchar."

              "Vale, bien, enviaré uno de los drones", dice Billy Bob. "Quizá eso te haga callar para que pueda seguir con mi trabajo. Unidad número trescientos seis, por favor, acompañe a este hombre fuera de mi taller. Luego encuentre al dron que esté más cerca del palacio e informe al rey de que voy a llegar con al menos dos horas de retraso. A ver, ¿por dónde iba? Ah, sí, estaba haciendo un anuncio y se me olvidó cerrar el canal. Pero ¿terminé el anuncio?... Bah, qué importa. Vuelvo al trabajo."
          - source: scene_3
            paragraph: 17
            text: |-
              A continuación oímos un chasquido procedente del amplificador de voz y el canal de comunicación se cierra.

              "Vale...", digo. "Así que al principio del anuncio oí a Billy Bob mencionar que los prisioneros están situados 'debajo de la torre'. ¿Es seguro asumir que se refería a una de las torres negras de las cuatro esquinas de la ciudad?"

              "Sí, casi con total seguridad nos encontramos bajo una de las torres negras de seredium", dice Breynan. "Lo que significa que la razón por la que Billy Bob ha hecho secuestrar a todos estos magos durante los últimos años es para usar ese recipiente de energía de allí para alimentar los 'drones', vehículos metálicos voladores, gólems gigantes y todos los demás artefactos tecnológicamente avanzados fabricados por los lessathi en esta ciudad. También significa que, si intentamos salir de este lugar por la puerta principal, nos recibirá un pequeño batallón de guardias, todos equipados con armadura anti-magia y artefactos mágicos. Si vamos a escapar de aquí, tendremos que alcanzar un nivel más alto de la torre y encontrar un lugar donde las paredes de seredium sean lo bastante finas como para poder contactar con Barry desde la sala del teletransportador."

              "Pero la pregunta es cómo vamos a llegar a los niveles superiores de la torre sin toparnos con ninguno de los guardias...", digo.
