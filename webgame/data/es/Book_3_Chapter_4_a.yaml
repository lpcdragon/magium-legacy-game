        paragraph: 16
        text: |-
          "¿Debo suponer que tus nuevas estadísticas se desbloquearon correctamente?", me pregunta Kate cuando me ve guardarme otra vez el dispositivo de estadísticas en el bolsillo.

          "Sí", digo. "Mi dispositivo vuelve a ser totalmente funcional y ya tengo activadas mis tres estadísticas nuevas."

          "Entonces, ¿de verdad vas a invertir puntos para probar tus estadísticas esta vez o simplemente vas a dejar todos tus puntos sin gastar como antes?", me pregunta Kate con el ceño fruncido.

          "De hecho, ya he gastado algunos puntos en las estadísticas nuevas", digo. "Con un poco de suerte, quizá pueda probar alguna de ellas pronto."

          "La verdad es que me sorprende que hayas invertido puntos en absoluto", dice Kate. "Al ritmo que llevabas, casi esperaba que llegaras al final de este torneo con todas tus estadísticas a nivel cero."

          "Eh, ni siquiera yo estoy tan loco", digo. "Aunque admito que quizá he sido un poco demasiado prudente hasta ahora."

          "¿Solo un poco?...", dice Kate.

          "Vale, puede que algo más que solo un poco", le respondo. "¡Pero he aprendido la lección, lo juro!"

          "Claro...", dice Kate.
