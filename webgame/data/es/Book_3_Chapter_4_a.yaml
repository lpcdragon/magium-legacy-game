        texts:
          - source: scene_text
            paragraph: 32
            text: |-
              Durante los primeros hechizos, todo va sobre ruedas. Tanto Illuna como Breynan están ejecutando sus movimientos a la perfección, y la trampa reacciona exactamente como debería. Sin embargo, a medida que siguen lanzando sus hechizos, no puedo evitar sentir que algo va mal. Pero ¿cómo puede ser? No están cometiendo errores. Todos sus movimientos son impecables. Seguro que todo es cosa de mi imaginación.

              De repente, noto un temblor muy sutil en el aura de la trampa mágica. Probablemente no me habría dado cuenta si no hubiera invertido puntos en mi estadística de Sentido mágico, pero estoy bastante seguro de que la trampa no debería comportarse así mientras la están disipando. Si dejo que esto siga adelante, puede que activen la trampa sin darse cuenta. Tengo que detenerlos.

              "¡Paren la disipación!", les grito a Illuna y a Breynan. "¡Algo va mal!"

              "¿Qué quieres decir?", dice Illuna mientras tanto ella como Breynan cancelan su técnica y el aura de la trampa vuelve a estabilizarse. "Todo iba sobre ruedas. No vi ninguna fluctuación en el aura de la trampa."
          - source: scene_text_2
            paragraph: 20
            text: |-
              "Hubo un temblor muy sutil en el aura que pude detectar gracias a mi estadística de Sentido mágico", digo. "No creo que sus dos flujos estuvieran lo bastante sincronizados. Deberían intentar ralentizar sus movimientos cuando hagan la disipación. Eso les ayudará a concentrarse."

              "¿Ralentizar los movimientos?...", dice Breynan. "¡Pero los movimientos tienen que hacerse a cierta velocidad para que los hechizos surtan efecto!"

              "Otra vez, da igual que tus hechizos normalmente no fueran a surtir efecto, porque solo estás disipando una trampa", digo. "Los movimientos seguirán siendo correctos aunque los hagas a un ritmo más lento. Prueben a hacer lo que he dicho y verán a qué me refiero."

              "Muy bien", dice Illuna. "Empecemos de nuevo, entonces."

              Breynan e Illuna comienzan a disipar la trampa una vez más, a un ritmo mucho más lento. Me aseguro de estudiar muy de cerca el aura de la trampa mientras están lanzando, pero esta vez no veo ningún temblor. Al final, consiguen llegar al último hechizo sin problemas y la energía mágica que irradiaba la trampa va desapareciendo lentamente, señal de que la trampa ha sido desactivada con éxito.
