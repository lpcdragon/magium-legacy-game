  - name: b3_ch04a_coach
    texts:
      - source: scene_text
        paragraph: 28
        text: |-
          "Flower, ese es tu brazo derecho, no el izquierdo...", digo.

          "¡Oh, te referías a MI lado izquierdo, no al tuyo!", dice Flower. "Perdón, me he confundido un segundo."

          "Te das cuenta de que los dos estamos mirando en la misma dirección, ¿verdad?...", digo.

          "¡Ja, ja, claro!", dice Flower, riéndose de forma muy nerviosa. "ESTAMOS mirando en la misma dirección. ¡Qué tonta! ¡Ja, ja!"

          "Flower, estás demasiado tensa", dice Illuna de repente, mientras sus ojos se vuelven de un azul brillante. "Recuerda tus ejercicios de respiración."

          "¡Petal!", dice Flower, con un gran alivio en la voz. "Quiero decir, ¡Illuna! Sí, tienes razón, se me había olvidado lo de la respiración. ¡Lo haré ahora mismo!"

          Después de escuchar a Illuna, Flower se calma casi de inmediato y luego empieza a respirar hondo y despacio con los ojos cerrados. Tras unos segundos de ejercicios de respiración, Flower vuelve a abrir los ojos, completamente relajada.

          "¡Vale, ya estoy lista para volver a empezar!", dice Flower, haciéndome un saludo militar. "¡Esperando sus órdenes, capitán!"

          "¡Eso es increíble!", digo. "Se calmó en un instante. Illuna, ¿cómo lo has hecho?"

          "A Flower siempre se le ha dado muy mal seguir instrucciones cuando se siente presionada", dice Illuna. "Normalmente la ayudo a calmarse en estas situaciones haciendo que se concentre en mi voz dentro de su mente, pero dijiste que no querías ninguna ayuda mía, así que esta vez me quedé callada."
      - source: scene_text_2
        paragraph: 18
        text: |-
          "Estaba empezando a entrar en pánico cuando Illuna no decía nada", dice Flower. "No me di cuenta de que ustedes dos habían hablado de esto antes de que me despertara."

          "Entonces, ¿Illuna ha estado actuando como tu entrenadora privada dentro de tu mente durante los últimos veinte años?", digo.

          "Bueno, no siempre, pero ayuda mucho", dice Flower. "Y, a cambio, yo intento ayudarla cuando tiene que hablar con la gente. Como, no sé, le digo qué está bien decir y qué no, para que no moleste a nadie por error. A veces puede ser muy brusca..."

          "Vaya, no me había dado cuenta de hasta qué punto dependían tanto la una de la otra", digo. "Perdón por eso. Supongo que no debería haber insistido en enseñarle yo solo los hechizos a Flower."

          "Oh, cierto, ¡el hechizo!", dice Flower, y entonces empieza a ejecutar los movimientos que aprendió conmigo de manera impecable.

          "Vale, así que eran rodillas flexionadas, brazo izquierdo delante, codo derecho doblado, luego girar el brazo izquierdo y el codo derecho y... ¡eh, espera un momento!", dice Flower. "¡Reconozco estos movimientos! Son los mismos movimientos que necesitaba para uno de mis viejos hechizos, solo que al revés. Así que, si no me equivoco, los siguientes movimientos deberían ser algo así..."
      - source: scene_3
        paragraph: 10
        text: |-
          Entonces empieza a recrear exactamente los movimientos necesarios para el hechizo que estaba a punto de enseñarle, sin cometer ni un solo error. Cuando termina, me mira buscando confirmación.

          "¿Ese era el hechizo que intentabas enseñarme?", dice Flower.

          "Eh, sí, era exactamente ese", digo.

          "Oh, hace más de diez años que no uso movimientos para lanzar este hechizo...", dice Flower. "Hoy en día simplemente lo hago controlando el flujo de energía. Pero me sorprende que conozcas uno de mis hechizos, Barry. Nunca escribí sobre él en ninguna parte."

          "Flower, ya te lo dije", dice Illuna. "Este hechizo se inventó mucho antes de que tú nacieras. Tú simplemente lo descubriste de manera instintiva debido a tu naturaleza etérea. En fin, yo me encargaré a partir de aquí. Creo que Flower ya debería conocer la mayoría de los hechizos necesarios para esta trampa, salvo quizá uno o dos. Será más rápido si simplemente le digo qué hechizos debe usar a la inversa, en vez de que tú le enseñes los movimientos desde cero."

          "Sí, sí...", digo. "Adelante, entonces."

          Tal y como dijo Illuna, Flower no tardó mucho en aprender el resto de los hechizos y en empezar a desactivar la trampa. Una vez que comenzó con la técnica de disipación, me acerqué a ella para ver si había alguna fluctuación en el aura de la trampa que pudiera hacer que se activara, pero, por suerte, pese a las preocupaciones de Illuna, Flower consiguió mantener el control de su flujo mágico hasta el final. Cuando terminó, la energía que irradiaba la trampa fue desapareciendo lentamente, señal de que la trampa había sido desactivada con éxito.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch04a_glimpse
  - name: b3_ch04a_cooperate
    routes:
      - condition: ch11_saved_rose = 0
        texts:
          - source: scene_text
            paragraph: 29
            text: |-
              "Bien", digo. "Si de verdad creen que pueden encargarse de esto sin la ayuda de Flower, no insistiré más. Pero se lo advierto... un pequeño error y puede que nos hagan volar a todos por los aires."

              "Tendremos cuidado", dice Illuna. "Breynan, empecemos practicando la sincronización de nuestros flujos mágicos. Una vez que nos sintamos lo bastante cómodos con lo básico, podremos empezar a practicar los hechizos de verdad."

              Durante la siguiente media hora más o menos, Illuna y Breynan pasan el tiempo practicando sus movimientos y sus flujos mágicos bajo mi guía directa. Como yo sabía lo que mejor funcionaba con la técnica de disipación en varios pasos, pude darles algunas indicaciones que aceleraron el proceso y, al final, ambos adquirieron la confianza suficiente como para poder ejecutar la técnica sin cometer errores.

              Dicho esto, la cantidad de concentración que exige la disipación real de un hechizo tan complejo es mucho mayor que la que se necesita cuando solo estás practicando, así que no puedo decir que no me preocupe al menos un poco lo bien que van a llevar esto a cabo. Lo que más me preocupa es el hecho de que Illuna todavía no parece haberse recuperado de su herida, aunque no lo demuestre, así que no estoy seguro de hasta qué punto será realmente capaz de realizar correctamente su parte de la técnica de disipación. Esperemos que sea lo bastante prudente como para cancelar su técnica a tiempo si cree que no va a poder manejarla.
          - source: scene_text_2
            paragraph: 19
            text: |-
              Una vez terminados todos los preparativos, Illuna y Breynan por fin comienzan su técnica de disipación sincronizada, mientras el resto los observamos conteniendo la respiración.

              Durante los primeros hechizos, todo va sobre ruedas. Tanto Illuna como Breynan están ejecutando sus movimientos a la perfección, y la trampa reacciona exactamente como debería. Sin embargo, después de su cuarto hechizo, ya puedo apreciar un cambio en la respiración de Illuna. No pasa nada. Todo irá bien. Mientras mantenga la concentración, debería ser capaz de--

              No me da tiempo a terminar el pensamiento, porque una leve ruptura en la concentración de Illuna hace que pierda el control sobre su flujo mágico, lo que activa de inmediato la trampa que tiene delante. Ninguno de nosotros tiene tiempo de reaccionar y, antes siquiera de darnos cuenta, la explosión de la trampa nos envuelve a todos y nos mata en cuestión de segundos.
