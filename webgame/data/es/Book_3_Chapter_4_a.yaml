            paragraph: 43
            text: |-
              "¿Por qué?", le pregunto a Melindra. "¿Qué pasa?"

              "¿Recuerdas cómo dije antes que estas cadenas me resultaban familiares?", dice Melindra, mientras se acerca a la mesa y luego agarra una de las cadenas con la mano. "Bueno, acabo de darme cuenta de por qué. Es por el metal del que están hechas. Este metal parece una versión muy modificada de los viejos prototipos con los que Billy Bob solía juguetear la última vez que estuve aquí, y por eso me costó tanto reconocerlo, pero los principios básicos deberían seguir siendo los mismos. En resumen, si este metal permanece demasiado tiempo en contacto con el aura de una persona, forma con ella una relación simbiótica. Si intentaras arrancarlo por la fuerza, sería lo mismo que arrancarle uno de sus órganos vitales. Lo mataría en cuestión de segundos."

              "¿Hablas en serio?...", digo. "Entonces, ¿cómo se supone exactamente que se quitan estas cadenas sin matar a los prisioneros?"

              "Tendrías que encontrar la sala de control y desactivarlas manualmente desde allí", dice Melindra. "Esa sería la única manera."
          - source: scene_text_2
            paragraph: 26
            text: |-
              "¿Y si intentáramos destruir el recipiente metálico?", escribe Leila. "¿No tendría eso el mismo efecto que desactivar las cadenas?"

              "Si intentan destruir ese recipiente lleno de energía, causarán una explosión lo bastante grande como para matar a todas y cada una de las personas de esta sala, incluidos nosotros", dice Melindra, soltando la cadena de su mano. "Como dije antes, desactivar las cadenas desde la sala de control es la única forma de liberar a los prisioneros."

              "Entonces podríamos intentar llegar rápido a esa sala, antes de que alguno de los guardias--", empieza a decir Kate, pero Melindra la interrumpe.

              "No tenemos absolutamente ninguna forma de saber dónde pueden haber colocado la sala de control en este lugar", dice Melindra. "Y, dada la importancia de esa sala, sin duda estará fuertemente vigilada. Estamos todos debilitados después de la última pelea, ni siquiera tenemos aquí a todos los miembros de nuestro equipo, y mucho menos a ninguno de los rebeldes aparte de Breynan. Lo que deberíamos estar intentando hacer ahora mismo es encontrar una salida. Este no es momento de jugar a ser héroes."
