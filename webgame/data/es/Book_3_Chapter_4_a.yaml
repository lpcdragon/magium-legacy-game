  - name: b3_ch04a_introduction
    texts:
      - source: scene_text
        paragraph: 6
        text: |-
          Decido que quiero ver la introducción, así que pulso el botón correspondiente de mi dispositivo, lo que hace que aparezca un nuevo texto en la pantalla. Al parecer, el texto de introducción no cabe entero en la pantalla de mi dispositivo, así que voy a tener que pulsar un pequeño botón situado en el lado derecho del potenciador de estadísticas para pasar a las páginas siguientes.

          '¡Enhorabuena!', dice el texto, en la lengua común. '¡Tus nuevas estadísticas se han activado correctamente! Ten en cuenta que estas tres estadísticas todavía se encuentran en fase experimental, así que, si notas algo fuera de lo normal, deberías informar del problema a la persona que se encargó de tu activación. La siguiente sección te dará una breve explicación de cada una de las estadísticas de aura. Si quieres leer más detalles sobre estas estadísticas o releer el texto de esta introducción, encontrarás toda la información en el manual de instrucciones que te entregaron junto con tu dispositivo.'

          Vaya... Así que por aquel entonces sí que repartían manuales de instrucciones. Habría estado bien que yo tuviera uno de esos en vez de verme obligado a averiguar por mi cuenta cómo funciona todo...

          Pulso el botón de 'página siguiente' y el dispositivo empieza a darme información sobre mis estadísticas recién activadas.
      - source: scene_text_2
        paragraph: 6
        text: |-
          'La estadística de Sentido mágico está diseñada para mejorar tus habilidades de análisis de aura', dice el texto de la pantalla. 'Dependiendo de cuántos puntos inviertas en ella, deberías ser capaz de detectar auras desde mucha más distancia que antes, y tu capacidad para distinguir las diferencias entre patrones sutiles en el flujo de las auras también debería mejorar considerablemente. Sin embargo, los resultados que obtendrás con esta estadística dependerán mucho de tus propias habilidades de lectura de aura. Si tu sentido mágico es especialmente débil, puede que los efectos sean menos visibles a menos que inviertas una cantidad suficiente de puntos en la estadística.'

          Cuando pulso el botón del lado derecho de mi dispositivo, me aparece un nuevo texto que describe otra de las estadísticas de aura.

          'El propósito principal de la estadística de Endurecimiento de aura es aumentar tus capacidades defensivas contra ataques mágicos', dice el texto. 'No debería usarse como sustituto de las estadísticas de Resistencia o Reflejos, porque la defensa que ofrece contra ataques físicos es mínima. Nuestras pruebas han demostrado que la estadística de Endurecimiento de aura es más eficaz contra la magia elemental tradicional, pero también debería resultar útil contra la magia elemental creada artificialmente, como la electricidad, el ácido y el hielo. Ten presente que la estadística de Endurecimiento de aura no te defenderá de elementos no mágicos, así que deberías seguir esquivando los proyectiles entrantes si no fueron creados mágicamente de la nada.'
      - source: scene_3
        paragraph: 5
        text: |-
          'Estadística de Endurecimiento de aura - notas adicionales', dice la página siguiente. 'Algunos de nuestros sujetos de prueba también consiguieron usar esta estadística de forma ofensiva, concentrando el efecto de endurecimiento de aura alrededor de sus puños y devolviendo de un golpe los proyectiles mágicos a sus lanzadores. Sin embargo, no se recomienda intentar una técnica así en un entorno no controlado, porque no fuimos capaces de reproducir estos efectos de manera fiable.'

          Cuando vuelvo a pulsar el botón de mi dispositivo, aparece en la pantalla el texto de la tercera estadística experimental.
