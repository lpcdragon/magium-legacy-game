  - name: b3_ch04a_contrary
    texts:
      - source: scene_text
        paragraph: 23
        text: |-
          Al contrario de las estimaciones de Breynan, nos llevó bastante más de 'un abrir y cerrar de ojos' terminar por fin con la trampa que teníamos delante. Después de que Illuna y yo le enseñáramos a Breynan el encantamiento correcto para el hechizo de ácido, también tuvimos que averiguar en qué orden necesitaba lanzar los demás hechizos, y aquello no fue en absoluto una tarea fácil.

          En total, tuvimos que pasar cerca de una hora solo con esa trampa y, cuando por fin creíamos que habíamos terminado, nos topamos con una trampa mágica muchísimo más compleja un poco más adelante en el mismo pasillo. Por desgracia, no tardamos en darnos cuenta de que los métodos que habíamos usado para la trampa anterior ya no servirían con esta. Los hechizos necesarios aquí eran demasiado complejos para que Breynan pudiera manejarlos por sí solo. Sin embargo, si cooperara con Illuna mientras usa mi técnica de disipación en varios pasos, nos enfrentaríamos a un conjunto totalmente nuevo de problemas.
      - source: scene_text_2
        paragraph: 13
        text: |-
          "Escuchen", les digo a Breynan e Illuna, "esta técnica es relativamente segura cuando la usa una sola persona, pero si dos personas cooperan, se vuelve mucho más arriesgada. Si ustedes no sincronizan sus flujos a la perfección, podrían activar la trampa y hacernos volar a todos en pedazos. Tiene que haber alguna otra forma de encargarse de esto."

          "Breynan no puede desactivar esta trampa por sí solo y yo tampoco", dice Illuna. "Nuestra única opción es trabajar juntos, a pesar de los riesgos."

          "¿Y si intentaras despertar a Flower?", digo. "Esta trampa está compuesta sobre todo por hechizos de fuego, así que debería irle como anillo al dedo."

          "Despertar a Flower sería... mala idea", dice Illuna.

          "¿Por qué?", digo. "¿Porque ustedes dos siguen peleadas?"

          "No estamos peleadas", dice Illuna, terca.

          "Sí que lo están", digo. "Flower sigue llamándote 'Illuna' en vez de 'Petal', y siempre está hablando con ese tono excesivamente serio, intentando imitar la forma de hablar de Kate."

          "Yo no... hablo así", dice Kate en voz baja, algo avergonzada.

          "En fin", le digo a Illuna, "ya tienes que reconciliarte con ella. Solo dile que lo sientes y sigue adelante."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch04a_apologize
  - name: b3_ch04a_apologize
    texts:
      - source: scene_text
        paragraph: 25
        text: |-
          "No voy a disculparme", dice Illuna. "Fue ella quien empezó."

          "¡Pero fuiste tú quien le dijo que debía actuar con más madurez!", digo.

          "Yo no dije tal cosa", dice Illuna.

          "¡Sí que la dijiste!", digo. "¡Dijiste exactamente eso!"

          "Lo que dije fue que, si actuara con más madurez, la gente quizá estaría más dispuesta a tratarla como a una adulta", dice Illuna.

          "¿Eso no es lo mismo que he dicho yo?...", le pregunto, confundido.

          "No, no lo es", dice Illuna. "Solo le dije eso porque estaba empeñada en que la trataran como a alguien de veintinueve años. Nunca dije que realmente debiera cambiar su comportamiento. ¿Por qué tendría que cambiar? Está perfectamente bien tal como es."

          "Entonces, ¿dices que en realidad no tienes ningún problema con la actitud infantil habitual de Flower?", le digo. "¿No quieres que se comporte de forma más adulta?"

          "Claro que no", dice Illuna. "¿Por qué iba a pensar eso nadie?"
      - source: scene_text_2
        paragraph: 16
        text: |-
          "Ehhh...", digo. "Bueno, odio decírtelo, pero cuando le dijiste a Flower esas cosas sobre tener que actuar con más madurez, desde luego sonó como si tuvieras un problema con su conducta habitual."

          "Eso es absurdo", dice Illuna. "Ni siquiera usé la palabra 'problema' cuando hablaba con ella."

          "Sí, pero no se trata solo de las palabras que usas", digo. "También importa cómo dices esas palabras, y el tono de tu voz, y... vale, ¿sabes qué? Da igual. A ver si puedo hablar con Flower sobre todo esto más tarde. Pero ahora mismo nos vendría muy bien su ayuda. ¿No puedes olvidarte por un momento de tu pequeña disputa con ella y cooperar con ella solo un rato?"

          "Ya te lo he dicho", dice Illuna. "No voy a despertar a Flower."

          "¿En serio?", digo. "¿Solo porque están teniendo una pequeña discusión?"

          "No es por la discusión", dice Illuna. "La forma de lanzar magia de Flower es distinta a la de la mayoría de los demás magos. La mayoría de sus hechizos los lanza por instinto, debido a que es una etérea. Tú basas tu suposición de que la trampa no se activará por accidente en el hecho de que la gente normalmente mantiene estable su flujo cuando lanza este tipo de hechizos, pero ese no es el caso de Flower. Si vamos a arriesgarnos a activar la trampa de todos modos, prefiero jugármela con Breynan."
    choices:
      - position: 1
        text: Rendirme y dejar que Illuna coopere con Breynan para desactivar la trampa
        effects:
          - set:
              current_scene: b3_ch04a_cooperate
              b3_ch4_insist: 0
      - position: 2
        text: Seguir insistiendo en convencer a Illuna de que despierte a Flower
