              b3_ch4_insist: 1
  - name: b3_ch04a_insist
    routes:
      - condition: ch11_saved_rose = 0
        texts:
          - source: scene_text
            paragraph: 26
            text: |-
              "Aunque lance los hechizos por instinto, sigo pensando que será menos arriesgado que si ustedes dos usan la técnica de disipación al mismo tiempo", digo. "Mira, si pasa algo malo mientras hace la disipación, le diré que se detenga. Me aseguraré de vigilar de cerca el aura de la trampa para que no haya fluctuaciones peligrosas. Y si no te apetece hablar con Flower, no pasa nada. Yo mismo puedo enseñarle todos los movimientos y encantamientos. No tendrás que interactuar con ella en absoluto si no quieres."

              "¿De veras?", dice Illuna, alzando una ceja. "¿Tú mismo le enseñarás los movimientos? ¿Sin ayuda mía de ningún tipo?"

              "Sí, claro", digo. "¿Qué tan difícil puede ser?"

              "Muy bien, entonces", dice Illuna. "En ese caso, la despertaré. Estará contigo enseguida."

              Después de unos segundos de silencio, la luz azul de los ojos de Illuna desaparece y los ojos de Flower recuperan su color verde natural.

              "Vale, ya estoy despierta, ya estoy despierta...", dice Flower con voz soñolienta. "Qué está pasando... ¡guau!"

              Mientras hablaba, Flower de pronto pareció estar a punto de desmayarse y caerse al suelo, pero logró recuperar el equilibrio en el último segundo.

              "Illuna, ¿cómo has conseguido hacerte tanto daño?", pregunta Flower, horrorizada. "¡Casi ni puedo mantenerme en pie! ¿Y cómo hemos llegado aquí?... ¡Esto no se parece en nada a la base rebelde!"
          - source: scene_text_2
            paragraph: 17
            text: |-
              "Flower, ya te explicaremos la situación más tarde", digo. "Por ahora necesitamos que nos ayudes a desactivar esta trampa. Está compuesta solo de hechizos de fuego, así que deberías ser capaz de hacer la disipación de manera natural siempre que te limites a copiar mis movimientos y digas los encantamientos correctos. ¿Puedes ayudarnos?"

              "Eh... creo que sí...", dice Flower, sin parecer muy segura de sí misma.

              "Muy bien", digo. "Para empezar, practiquemos los movimientos. Solo haz lo que yo hago y te saldrá bien."

              Flower asiente con nerviosismo y se coloca a mi lado, preparándose para imitar mis movimientos.

              "Vale, así que lo primero que vas a necesitar hacer es flexionar un poco las rodillas para asegurarte de que el flujo de energía se mantiene estable", digo.

              "Flexionar las rodillas", repite Flower. "Entendido."

              Cuando Flower hace lo que le he dicho, me doy cuenta de que le tiemblan ambas rodillas y de que, por alguna razón, está todavía más nerviosa que antes.

              "¿Está... eh... todo bien?", le pregunto a Flower.

              "¡Claro!", dice Flower con una voz algo temblorosa. "¿Por qué ibas a preguntarlo? ¡Solo dime qué tengo que hacer después!"

              "Claro...", digo. "Así que, lo que tienes que hacer ahora es poner el brazo izquierdo delante de ti con la palma hacia abajo, mientras mantienes el brazo derecho junto al cuerpo con el codo doblado."
          - source: scene_3
            paragraph: 9
            text: |-
              "Palma hacia abajo, codo doblado, ¡entendido!", dice Flower, siguiendo mis instrucciones mientras mira al frente sin siquiera dirigir una sola mirada en mi dirección.

              "No hace falta que memorices todo lo que digo...", le digo. "Puedes limitarte a mirar lo que hago e imitar mis movimientos."

              "¡Tienes razón, perdón!", dice Flower mientras gira la cabeza hacia mí y empieza a observar mis brazos con una expresión de concentración extrema en los ojos. "Entonces, ¿qué sigue?"

              "Eh... ahora tienes que hacer un movimiento circular con el brazo izquierdo, mientras giras el codo derecho para que apunte hacia tu lado derecho."

              Cuando Flower intenta imitarme, de alguna manera hace los movimientos completamente mal y termina también con el codo izquierdo doblado.

              "Flower, eso no es... mis brazos no se movieron así", digo.

              "¡Lo siento!", dice Flower con voz presa del pánico. "¿Puedes hacerlo otra vez? ¡Esta vez me saldrá bien!"

              "Creo que sería mejor volver a empezar desde el principio", digo.

              "Vale...", dice Flower, bajando los brazos, mientras todo su cuerpo parece completamente rígido.

              "Bien, entonces con las dos rodillas ligeramente flexionadas, primero pones delante el brazo del lado izquierdo, así", digo.

              "¡Entendido!", dice Flower mientras vuelve a intentar copiar mis movimientos.
