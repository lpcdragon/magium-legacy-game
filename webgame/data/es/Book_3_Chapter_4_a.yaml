        texts:
          - source: scene_text
            paragraph: 24
            text: |-
              "Pues entonces supongo que es una suerte que tengamos aquí mismo con nosotros a un experto en magia de disipación", dice Melindra mientras me da una palmada fuerte en la espalda. "¿No le parece, señor inventor de la técnica de disipación de Brinhorn?"

              "No soy ningún experto ni nada parecido", digo. "Como ya mencioné antes, inventé esa técnica por capricho."

              "Claro, claro", dice Melindra, y luego nos empuja por detrás tanto a Illuna como a mí para acercarnos a Breynan. "Ahora vayan los dos ahí y vean qué pueden hacer para ayudar. No les va a pasar nada por intentarlo una vez, ¿verdad?"

              "Supongo que no", digo, y entonces empiezo a avanzar lentamente hacia Breynan junto a Illuna.
          - source: scene_text_2
            paragraph: 14
            text: |-
              Mientras camino brevemente a su lado, me doy cuenta enseguida de que Illuna está respirando con mucha dificultad y de que, en realidad, camina de manera bastante más inestable de lo que deja ver. Habría jurado que ya se había recuperado casi del todo de su herida anterior, pero ahora que la miro de cerca empiezo a pensar que solo está fingiendo encontrarse bien para no preocuparnos demasiado. Espero de verdad que sepa lo que está haciendo.

              "No tengo muy claro de qué iba todo eso del 'inventor de la técnica de disipación de Brinhorn', pero vengan a echar un vistazo aquí", dice Breynan, señalando el aire vacío frente a él. "¿Ven este flujo extraño que no deja de ir de un lado a otro? Esto debe de venir de algún tipo de hechizo de electricidad, pero no me resulta nada familiar."

              "No es electricidad, es ácido", dice Illuna. "Lo reconozco porque Arraka me enseñó ese hechizo en el pasado, cuando actuaba como mi mentora."
