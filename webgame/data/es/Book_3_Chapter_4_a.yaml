            paragraph: 15
            text: |-
              "Mira, el dispositivo de estadísticas siempre fue un plan de respaldo. No quiero empezar a depender de él."

              "Por supuesto que dirías algo así", me dice Kate. "No sé ni por qué me molesté en preguntar."

              "Barry, ¿ni siquiera te da un poco de curiosidad ver qué pueden hacer esas estadísticas nuevas?", escribe Leila.

              "Puede que un poco", digo. "Pero ahora mismo lo que me alegra es tener el dispositivo de estadísticas funcionando otra vez. Al menos ahora sé que, si la situación se pone realmente fea, tendré veintiséis puntos que podré colocar de inmediato en la combinación de estadísticas que necesite para sacarnos del apuro."

              "Bueno... supongo que esa es una forma de verlo...", escribe Leila.

              "Teniendo en cuenta cuánto tiempo hace ya que llegamos a Varathia, empiezo a dudar de que vaya a subir nunca ninguna de sus estadísticas", dice Kate. "A este paso, acabará aferrándose a esos puntos hasta el final del torneo."

              "Míralo por el lado bueno", digo. "Si llegamos a ese punto, tendrás tanto la satisfacción de haber sobrevivido a uno de los torneos de magos más letales del mundo como la satisfacción de poder decir: '¡Te lo dije!'"

              "Claro...", dice Kate.
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch04a_disarm
      - condition: b3_ch4_demolisher = 3
        texts:
          - source: scene_text
            paragraph: 11
            text: |-
              "No en esta ranura de guardado. Estoy usando esta para el logro de Ciudadano Promedio."

              "¿Qué?...", dice Kate y se detiene en seco, mirándome como si de repente hubiera empezado a hablar en un idioma extranjero.

              "Perdón", digo. "Quería decir que no voy a empezar a invertir los puntos hasta que sea absolutamente necesario."

              "No, eso no es lo que has dicho...", me dice Kate. "Has hablado de una 'ranura de guardado' y de un logro de 'Ciudadano Promedio'. ¿Qué querías decir con eso?"

              "Yo estaba...", empiezo a decirle, pero no consigo encontrar las palabras adecuadas y me quedo ahí plantado, tratando en vano de formular una frase coherente. "Yo solo..."

              ¿Por qué he dicho siquiera esas cosas? ¿Estaba intentando hacer una broma? ¿Por qué me cuesta tanto recordarlo?...

              Todos los demás también se han detenido ya y ahora nos miran a Kate y a mí por turnos, sin tener del todo claro qué pensar de nosotros.

              "Kate, no hace falta que lo interrogues así", escribe Leila después de ver lo mucho que me cuesta pensar en una respuesta. "Estoy segura de que solo era otra de sus bromas. No hablaba en serio."

              "Sé cómo bromea Barry, y esto no se parecía en nada a sus sarcasmos habituales", dice Kate. "Era otra cosa. De hecho, ni siquiera daba la sensación de que estuviera hablando con Barry. Casi parecía que estuviera hablando con una... persona completamente distinta."
          - source: scene_text_2
            paragraph: 9
            text: |-
              Kate se queda entonces mirándome fijamente, pero por alguna razón no siento que sea a mí a quien está mirando. Siento como si mirara justo a través de mí. Como si sus ojos estuvieran buscando algo distinto que no puede ver. La expresión que tiene ahora mismo empieza a darme escalofríos.

              "Escucha", le dice Melindra a Kate mientras le pone una mano en el hombro por detrás. "Entiendo lo que intentas decir, pero no estoy percibiendo ninguna magia de control mental proveniente de él, y si alguien le hubiera lanzado un hechizo antes, casi con total seguridad lo habríamos sentido. Además, no es que su broma haya sido tan distinta de las habituales. Cuando mencionó 'ranuras de guardado', probablemente se refería a esos dispositivos de mascotas virtuales que los gnomos modificaron hace poco para permitirte guardar tu progreso. Y como sabemos por Arraka que esos mundos que visitamos en el ritual del Dios del Tiempo eran prácticamente versiones alternativas de nuestra realidad, Barry seguramente estaba comparando esta situación con tener múltiples 'partidas guardadas'. Estaba intentando comparar la realidad con un juego, donde usaría una de sus 'partidas' simplemente con el propósito de ver si puede sobrevivir hasta el final siendo una persona completamente promedio. Barry, ¿no era eso lo que querías decir?"
          - source: scene_3
            paragraph: 6
            text: |-
              "¡Sí!", digo. "¡Eso es! ¡Eso es lo que intentaba decir!"

              Debe de haber sido eso... Su explicación tiene todo el sentido del mundo. Yo solo estaba intentando hacer una broma. Eso era todo...

              "Me imaginaba que sería algo así, pero no sabía lo de ese nuevo tipo de dispositivos de mascotas", escribe Leila. "¡Me alegro de que Melindra lo haya aclarado todo!"

              "Entonces, ¿ya hemos terminado aquí?...", nos pregunta Breynan. "¿Podemos seguir avanzando?"

              "Supongo que... sí...", dice Kate con una expresión algo vacilante en los ojos.

              "Bien", dice Breynan. "Sé que no hay enemigos cerca, pero aun así no me siento cómodo quedándome demasiado tiempo en un mismo sitio a menos que sea realmente necesario. ¡Vamos!"

              A medida que todos avanzamos uno a uno, me doy cuenta de que Illuna sigue mirándome con esa expresión seria que siempre tiene y con sus ojos azules brillando intensamente. Cuando le devuelvo la mirada, no aparta los ojos de mí en absoluto y se limita a mirarme fijamente, en completo silencio. Mientras paso a su lado para ir detrás de los demás, su mirada me sigue durante unos segundos más, pero luego por fin se une también a nosotros, sin decir una palabra.
