                  current_scene: b3_ch04a_machine
      - condition: b3_ch4_insist = 1
        texts:
          - source: scene_text
            paragraph: 38
            text: Una vez que estamos todos dentro del pasadizo oculto, Illuna toca con la mano la pared de antes, haciendo que se deslice lentamente de vuelta a su posición original. Entonces empezamos a subir las escaleras, iluminadas por cristales azules brillantes incrustados en las paredes de la caverna, igual que los túneles de afuera, pero también igual que los túneles de la base rebelde y los que hay bajo la arena de Thilias.
          - source: scene_text_2
            paragraph: 23
            text: |-
              Desde luego parece haber un montón de cristales y rocas de seredium debajo de Varathia. Me pregunto si estarán de algún modo conectados con todas las cosas peculiares que ocurren en este continente, como los animales parlantes, las criaturas míticas y el hecho de que este sea el 'único lugar' del plano terrenal donde puedes acceder al Magium, según Arraka. Quizá le pregunte por estas cosas cuando regresemos.

              Guardamos un silencio absoluto mientras subimos las escaleras, para no delatar nuestra posición por si alguien nos está esperando al otro lado del túnel. Según Melindra, la pared del otro lado tiene una concentración inusualmente alta de seredium, lo que hace casi imposible sentir nada más allá de ella. Sin embargo, eso también significa que el enemigo tampoco debería ser capaz de sentir que nos acercamos, lo que nos da el elemento sorpresa.

              En cuanto llegamos a la pared del final de las escaleras, Illuna nos hace una señal para que nos preparemos y luego golpea suavemente la puerta secreta como antes, haciendo que se deslice y nos deje salir del túnel. Para nuestra decepción, las escaleras no nos llevaron en realidad a la superficie, sino a otra sala subterránea, aunque esta parece menos una caverna natural y más un sótano construido por la mano del hombre, con un techo bastante alto. Esta sala concreta en la que hemos terminado parece una especie de cuarto de limpieza, porque aquí hay muchos cubos llenos de agua, junto con trapos mojados que probablemente se usaron hace poco para fregar el suelo.
          - source: scene_3
            paragraph: 11
            text: |-
              Una vez que Illuna cierra de nuevo la puerta secreta a nuestra espalda, se pone otra vez al frente del grupo y empieza a caminar hacia la sala siguiente, que parece estar llena de gente, a juzgar por lo que alcanzo a sentir de sus auras desde aquí.

              "Creo que a estas alturas ya lo habrán notado, pero la sala en la que estamos a punto de entrar está llena de magos", nos dice Melindra en voz baja. "Si intentan atacarnos cuando salgamos de aquí, les sugiero que Kate les bloquee el paso con un muro de hielo y luego retrocedamos hacia los túneles. Para cuando descubran cómo abrir la puerta secreta, nosotros ya estaremos--"

              Melindra se ve interrumpida de repente por Flower, que acaba de abrir la puerta que conduce fuera de la sala y ha soltado una fuerte bocanada de aire, cubriéndose la boca con la mano.

              "¿Qué ha pasado?", pregunta Kate mientras todos corremos hacia ella. "¿Es la guardia real?"

              "No, no es la guardia real", dice Flower con voz temblorosa, mientras intenta evitar que le tiemble el cuerpo. "Es... Es..."

              Cuando llegamos a la puerta y echamos un vistazo dentro de la siguiente sala, enseguida entendemos por qué a Flower le estaba costando tanto encontrar las palabras.
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch04a_machine
  - name: b3_ch04a_machine
    routes:
      - condition: b3_ch3_chains = 0
        texts:
          - source: scene_text
            paragraph: 39
            text: |-
              Lo que estamos viendo ahora mismo es una sala enorme llena de cientos de hombres y muchachos vestidos con harapos sucios, colgados del techo por largas cadenas de hierro atadas a sus muñecas, mientras sus pies apenas tocan el suelo.
              Todos tienen la piel tan pálida y una mirada tan apagada en los ojos que, sinceramente, es un milagro que sigan vivos.

              Al entrar todos en la sala, me doy cuenta de que el techo del que cuelgan las cadenas está hecho en realidad de metal y de que ese techo metálico forma parte de una gran estructura que cubre toda la habitación. Toda esa estructura está conectada a un recipiente metálico situado en el centro de la sala, que simplemente irradia energía mágica. Después de estudiar la sala entera unos segundos más, por fin comprendo qué está pasando aquí y me invade unas ganas repentinas y tremendas de vomitar.

              Esas cadenas no están ahí solo para mantener a los prisioneros en su sitio. Puedo sentir la energía mágica viajando a través de ellas y enviándose al recipiente metálico a través del techo. Toda esta sala se construyó con el único propósito de extraer tanta energía mágica como sea posible de esta gente, hasta el punto de dejarlos convertidos en esos cascarones vacíos que apenas tienen fuerza siquiera para respirar.

              Ninguno de estos hombres o muchachos reacciona de ninguna manera mientras avanzamos por la sala, como si apenas fueran conscientes de lo que los rodea. Sin embargo, de vez en cuando algunas de las personas de la sala parecen despertar al azar para gritar de dolor durante unos segundos, solo para volver otra vez a sus estados casi sin vida en cuanto terminan.
          - source: scene_text_2
            paragraph: 24
            text: |-
              Hacia el centro de la sala hay unas mesas de metal sobre las que yacen boca arriba algunas otras personas, que parecen estar algo más vivas que las que cuelgan del techo, aunque no por mucho. Estos hombres también llevan cadenas atadas a las muñecas, pero en su caso las cadenas están conectadas directamente al recipiente metálico, no al techo. Cuando nos acercamos a ellos, Melindra se detiene para observar una de las cadenas que mantienen suspendidos a los prisioneros del techo.

              "Estas cadenas...", dice Melindra. "Hay algo en ellas que me resulta... familiar..."

              Mientras Melindra sigue mirando las cadenas, uno de los prisioneros de las mesas metálicas nos llama con voz débil.

              "¿Quiénes son ustedes?...", dice el hombre. "Nunca los había visto aquí antes. ¿Son los nuevos limpiadores?"

              "No", digo mientras me acerco a él. "No trabajamos aquí. Llegamos a este lugar por accidente."

              "¿Ustedes... ustedes no están con ellos?...", dice el hombre. "¡Por favor, tienen que ayudarme! Esta gente que nos ha atrapado aquí... nos está usando como ganado. Nos están ordeñando la energía hasta dejarnos secos para alimentar esa máquina. Mi hijo y yo no hicimos nada malo. Una noche simplemente nos sacaron de nuestra casa sin darnos ninguna razón. Ni siquiera sé adónde se lo llevaron. Y tampoco sé si le pasó algo a mi esposa y a mi hija después de eso. Por favor, necesito saber si están a salvo... ¡Necesito salir de aquí!"
          - source: scene_3
            paragraph: 12
            text: |-
              "¿Esto... pasó hace poco?", le pregunto. "¿Su hija se llama 'Alice', por casualidad?"

              "¡Sí!", grita el hombre, bastante emocionado. "¡Así se llama! ¿La has conocido? ¿Está a salvo?"

              "Está a salvo, por ahora", digo. "Ha estado buscándolo."

              "¡Tienes que llevarme con ella!", dice el hombre. "¡Por favor, tienen que cortar estas cadenas y dejarme libre! ¡Se lo ruego!"

              Kate, Leila y yo intercambiamos una mirada y luego avanzo para acercarme más a las cadenas atadas a las muñecas del hombre. Las cadenas no parecen muy resistentes. Estoy bastante seguro de que mi daga encantada debería poder atravesarlas como si fueran mantequilla.

              Saco la daga de la vaina y la sostengo en la mano durante unos segundos, considerando mis opciones, mientras el grito de un niño pequeño resuena débilmente a lo lejos.
        choices:
          - position: 1
            text: Cortar las cadenas con mi daga y liberar al padre de Alice.
            effects:
              - set:
                  current_scene: b3_ch04a_container
                  b3_ch4_cut: 1
          - position: 2
            text: No cortar las cadenas y dejar al padre de Alice sobre la mesa metálica.
            effects:
              - set:
                  current_scene: b3_ch04a_container
                  b3_ch4_cut: 0
