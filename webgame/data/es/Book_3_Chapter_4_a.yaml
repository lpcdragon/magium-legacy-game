            text: |-
              "¿Así que me van a dejar aquí, entonces?", dice el padre de Alice, con miedo en la voz. "Si van a abandonarme, entonces al menos intenten cortar las cadenas. No pueden saber con certeza que voy a morir. ¡No pueden saberlo! Oh no, ya puedo sentir que el recipiente vuelve a activarse. ¡Corten las cadenas! ¡Corten las cadenas, rápido, antes de-- AAGHHH!"

              De repente, el recipiente metálico y todas las cadenas empiezan a brillar con una intensa luz azul, mientras los prisioneros de toda la sala comienzan a gritar al unísono.
