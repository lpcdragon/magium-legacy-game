          successful_checks:
            - 'Punto de control alcanzado: Partida guardada.'
        condition: checkpoint_rich = 1
      - set:
          b3_ch4_average_joe: 1
        condition: strength = 0 AND agility = 0 AND toughness = 0 AND reflexes = 0 AND hearing = 0 AND perception = 0 AND ancient_languages = 0 AND combat_technique = 0 AND premonition = 0
    routes:
      - condition: ch11_saved_rose = 1
        texts:
          - source: scene_text
            paragraph: 2
            text: |-
              "¡Barry!", oigo la voz de Rose a través del transceptor. "--pasó-- ¿están todos bien?--"

              "¡Rose, solo logro oír fragmentos de lo que dices!", digo. "Debe de ser por todo el seredium que hay en el techo de la cueva. Estamos todos bien, pero todavía no estamos del todo seguros de dónde estamos."

              "Lo siento, no he podido-- entender todo eso", dice Rose. "¿A dónde los-- teletransportaron?"

              "¡Aún no lo sabemos!", digo. "A unas cavernas subterráneas que no reconozco. Vamos a tener que explorar un poco para averiguar más. Te volveré a llamar cuando salgamos de aquí."

              "Vale, Barry", dice Rose. "--ten cuidado!"

              "¿No crees que este sea uno de los pasillos de la base rebelde?", me pregunta Kate mientras cierro el canal de comunicación y vuelvo a guardarme el transceptor en el bolsillo.

              "No. Me pasé todo el día explorando sus túneles y este sitio no me resulta nada familiar", digo. "Pero creo que seguimos estando en algún lugar bajo la ciudad."

              "Estoy de acuerdo con Barry", dice Breynan. "Conozco todos los pasillos de nuestra base, incluidos los de las zonas restringidas, y esto desde luego no forma parte de nuestro territorio. Puede que haya enemigos cerca. Tenemos que mantenernos alerta."
          - source: scene_text_2
            paragraph: 2
            text: |-
              "No estoy sintiendo a ninguna otra persona en estos túneles, pero, de nuevo, es algo difícil de determinar con todo este seredium rodeándonos", dice Melindra. "Puedo detectar las auras de la gente que camina por las calles de la ciudad justo encima de nosotros, así que el techo no debe de tener mucho seredium, pero algunas de las paredes de seredium de este lugar son tan gruesas que bloquean por completo mi sentido mágico. Hay una cosa que sí percibo, sin embargo, y es que hay bastantes trampas mágicas repartidas por estos pasillos. Parece que vamos a tener que desactivar al menos algunas antes de poder salir de aquí."

              "Trampas mágicas, ¿eh?...", digo. "Maldición, ahora mismo nos habría venido de maravilla la ayuda de Daren. ¿Es que alguien más aquí sabe siquiera cómo desactivar una trampa? Illuna, estoy bastante seguro de que Flower mencionó que ustedes dos han visitado muchas ruinas en el pasado. Esas ruinas debían de tener trampas, ¿no? ¿Cómo lograban superarlas?"

              "La mayoría de las trampas de las ruinas eran de las antiguas, así que la chica normalmente usaba sus habilidades acrobáticas para salir ilesa", dice Illuna. "En los pocos casos en que nos encontramos con trampas mágicas, tuvimos que depender de Arraka para disiparlas. Flower y yo somos elementalistas, así que desactivar cualquier cosa que no sea la más básica de las trampas mágicas supone un gran desafío para nosotras."
          - source: scene_3
            paragraph: 2
            text: |-
              "¿Arraka puede lanzar magia de disipación desde dentro de su amuleto?...", pregunta Kate. "Creía que los hechizos que podía lanzar eran muy limitados en su estado actual."

              "La magia de disipación no requiere una gran cantidad de energía mágica para lanzarse", dice Illuna. "El problema principal de Arraka mientras está dentro del amuleto es que solo puede almacenar una cantidad muy pequeña de energía dentro de su aura en cada momento, así que la única forma en la que puede lanzar hechizos medianamente poderosos es canalizando la energía fuera del amuleto durante horas y horas, sin que nadie la interrumpa. No es que de repente olvidara cómo lanzar hechizos cuando quedó atrapada ahí dentro. Sigue conservando todos sus conocimientos. Por eso puede lanzar hechizos complejos, como hologramas detallados, objetivos hechos de luz sólida y magia de disipación, pero no consigue lanzar un simple hechizo de explosión para salir de su amuleto. Tardaría tres horas enteras en canalizar la energía necesaria para generar una explosión pequeña, frente a la media hora más o menos que suele necesitar para disipar una trampa."
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch04a_intro2
                  checkpoint_rich: 0
      - condition: ch11_saved_rose = 0
        texts:
          - source: scene_text
            paragraph: 3
            text: |-
              "¿Qué está pasando?", le pregunta Kate a Breynan con tono angustiado mientras lo ve curando a Illuna. "¿Por qué no se despierta?"

              "A diferencia de tu amigo de la armadura pesada, yo no soy sanador", dice Breynan mientras se seca una gota de sudor de la frente. "Nunca he tenido que curar nada más que heridas superficiales en el pasado, y mis hechizos no son nada adecuados para algo tan serio como esto. Por favor, no rompas mi concentración. Ya me cuesta bastante mantenerla estable como está."

              "Entiendo...", dice Kate. "Te dejaré trabajar."

              Después de que esperemos aproximadamente un minuto en silencio, Breynan por fin se levanta del suelo y nos da su veredicto.

              "He hecho todo lo que he podido", dice Breynan. "Ya no debería correr peligro de muerte, pero ha perdido mucha sangre. Le llevará bastante tiempo recuperarse del todo."

              "¿Tienes idea de qué puede ser este lugar?", le pregunto a Breynan, señalando con la cabeza las paredes de la caverna que nos rodean. "No lo reconozco en absoluto, y he pasado por la mayoría de los túneles de su base rebelde."
          - source: scene_text_2
            paragraph: 3
            text: |-
              "Desde luego no forma parte de nuestro territorio", dice Breynan. "Eso sí es seguro. Creo que probablemente seguimos estando en algún lugar debajo de la ciudad, pero no sé si estos túneles están abandonados o si hay enemigos al acecho cerca. Tenemos que mantenernos alerta."

              "No estoy sintiendo a ninguna otra persona en estos túneles, pero, de nuevo, es algo difícil de determinar con todo este seredium rodeándonos", dice Melindra. "Puedo detectar las auras de la gente que camina por las calles de la ciudad justo encima de nosotros, así que el techo no debe de tener mucho seredium, pero algunas de las paredes de seredium de este lugar son tan gruesas que bloquean por completo mi sentido mágico. Hay una cosa que sí percibo, sin embargo, y es que hay bastantes trampas mágicas repartidas por estos pasillos. Vamos a tener que desactivarlas antes de salir de aquí."
          - source: scene_3
            paragraph: 3
            text: |-
              "Trampas mágicas, ¿eh?...", digo. "Maldición, ahora mismo nos habría venido de maravilla la ayuda de Daren. ¿Es que alguien más aquí sabe siquiera cómo desactivar una trampa?"

              "He probado a desactivar unas cuantas trampas mágicas en el pasado", dice Breynan. "Pero necesito ver estas trampas de cerca antes de poder decir si mis habilidades servirían de algo aquí o no."

              "Aún tenemos que esperar a que Illuna se despierte antes de poder irnos", dice Kate. "No podemos arriesgarnos a llevarla encima mientras esté en su estado actual. Si no tenemos cuidado, su herida podría volver a abrirse."

              "Yo... ya estoy despierta...", dice Illuna con tono agotado mientras lucha por incorporarse del suelo.

              Tiene la cara casi blanca y parece estar a solo unos segundos de desmayarse otra vez. Está claro que le supone un esfuerzo enorme mantener la consciencia.

              "¡Illuna, todavía no puedes levantarte!", dice Kate. "¡Necesitas descansar!"
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch04a_intro2
                  checkpoint_rich: 0
  - name: b3_ch04a_intro2
    routes:
      - condition: ch11_saved_rose = 1
        texts:
          - source: scene_text
            paragraph: 4
            text: |-
              "Bueno, Arraka no está aquí con nosotros para ayudarnos con las trampas, así que ahora mismo tú eres nuestra mejor opción", digo. "La has visto usar la técnica de disipación muchas veces, así que a estas alturas ya debes de saber cómo funciona, ¿no?"

              "Saber cómo funciona y ser capaz de ejecutarla con éxito son dos cosas completamente distintas...", dice Illuna.

              "Yo también he probado a desactivar trampas mágicas unas cuantas veces en el pasado, así que quizá podríamos trabajar juntos", dice Breynan. "En cualquier caso, creo que deberíamos ponernos en marcha. Llevo intentando contactar con Barry desde la sala del teletransportador desde que llegamos aquí, pero no he tenido suerte, así que imagino que simplemente hay demasiadas paredes de seredium entre nosotros y él para que la señal pase, teniendo en cuenta que probablemente estamos a la misma altura que él en este momento. Seguramente tendremos que alcanzar la superficie antes de que pueda teletransportarnos otra vez."
          - source: scene_text_2
            paragraph: 4
            text: |-
              De repente, Illuna conjura sobre la cabeza de Leila una cantidad de agua equivalente a la de un cubo y se la deja caer en la cara, lo que hace que ella pegue un salto desde el suelo y mire alrededor de la sala con un ligero pánico.

              "¿Qué ha pasado?", escribe Leila mientras se calma un poco. "¿Dónde están todos los aprendices de la guardia real?"

              "Siguen en la superficie", dice Illuna. "Mientras tanto, a nosotros nos han teletransportado por accidente a un túnel subterráneo sin identificar y estamos tratando de encontrar la salida. Les explicaremos más mientras caminamos. Pongámonos en marcha."
          - source: scene_3
            paragraph: 4
            text: |-
              Después de que Breynan cure la conmoción cerebral que Leila sufrió al golpearse la cabeza contra el pavimento un rato antes, todos empezamos a dirigirnos en la dirección que parece más probable que nos lleve hacia la superficie. Con la ayuda de Melindra, logramos evitar durante un tiempo los caminos que conducen directamente a trampas mágicas, aunque, según sus propias palabras, probablemente nos veremos obligados a empezar a desactivar algunas bastante pronto.

              Mientras caminamos por los pasillos, de repente oigo un pitido largo que sale de mi bolsillo. Me doy cuenta enseguida de que el sonido viene de mi dispositivo de estadísticas y lo saco lo más rápido que puedo para echarle un buen vistazo. Lo que veo ahora mismo en la pantalla es un mensaje de texto que me avisa sobre la activación experimental de estadísticas y me pregunta si quiero ver una breve introducción sobre lo que pueden hacer estas estadísticas.

              Parece que no voy a poder ver ninguna de mis estadísticas hasta que responda a la pregunta de esta pantalla.
