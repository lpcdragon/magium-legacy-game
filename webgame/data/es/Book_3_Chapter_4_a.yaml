    texts:
      - source: scene_text
        paragraph: 21
        text: |-
          "¿También te enseñó a lanzarlo?"

          "Sí, tienes que poner las manos delante de ti formando una 'X' y luego empezar a recitar el encantamiento justo después de dejar que el flujo salga de las puntas de tus dedos", dice Illuna. "Obviamente, los movimientos y el encantamiento no son absolutamente necesarios, pero pueden ayudarte a guiar correctamente el flujo de energía mágica. Por ejemplo, alguien como Arraka, que conoce los entresijos de la magia como la palma de su mano, no necesitaría mover ni un músculo para lanzar este hechizo, pero alguien como yo jamás sería capaz de lanzarlo sin los movimientos de las manos."

          "Movimientos de manos en forma de 'X'...", digo. "Ah, ¿te refieres a la versión avanzada de la mariposa de ácido de Zaldrin? ¿La que se añadió en la quinta edición del manual avanzado de hechizos de ácido hace unos diez años?"

          Al oír mi última frase, Breynan e Illuna giran la cabeza al mismo tiempo para mirarme, sin tener muy claro cómo reaccionar.

          "¿Qué?...", les pregunto, ya que ambos siguen mirándome fijamente. "Llevo toda la vida leyendo libros sobre magia. Estas cosas ya me las sé de memoria."

          "Sí, supongo que eso tendría sentido", dice Illuna. "Para responder a tu pregunta, el hechizo que se lanzó sobre esta trampa no es la mariposa de ácido de Zaldrin, pero se le parece mucho. La única diferencia relevante a la hora de disiparlo es que se añadió una pequeña redirección del flujo para hacer más potente el efecto del hechizo."
      - source: scene_text_2
        paragraph: 12
        text: |-
          "Bueno, siempre que conozcas los movimientos de los hechizos originales, lo único que tienes que hacer es invertirlos", digo. "El único problema es que aún tenemos que averiguar en qué orden se lanzaron estos hechizos..."

          "Lo haces sonar fácil, pero olvidas que no somos Brinhorn", dice Illuna. "Lo máximo que he conseguido sacar de ese hechizo de la 'mariposa' son unas cuantas gotas de ácido. Algo así nunca sería útil en combate."

          "No necesita ser útil en combate...", digo. "Solo estás disipando una trampa. Asegúrate de hacer bien todos los movimientos y estarás bien."

          "Dices todo eso solo porque no eres mago", dice Breynan. "No tienes ni idea de lo difícil que es intentar visualizar cada partícula mágica individual en tu cabeza antes de invertirla. Hace falta una concentración inmensa para hacerlo incluso cuando ya estás familiarizado con los hechizos."

          "¡Pero no hace falta nada de eso si ya estás haciendo los movimientos!", digo. "Lo de las partículas mágicas es solo un paso adicional que Brinhorn añadió cuando escribió las instrucciones porque normalmente prefiere no mover mucho las manos al lanzar sus hechizos. Mira, es muy simple. Solo sigue mis movimientos y verás a qué me refiero."

          Entonces coloco ambos brazos delante de mí y cruzo las manos, manteniendo todos los dedos lo más separados posible entre sí, para empezar con los movimientos que requiere la técnica de disipación.
      - source: scene_3
        paragraph: 8
        text: |-
          "Esto es una estupidez", dice Breynan mientras copia mis movimientos a mi lado y extiende también los brazos hacia la trampa mágica.

          "Vale, ahora lo que tienes que hacer es centrarte solo en el movimiento de tus manos", digo. "No visualices nada. Solo presta mucha atención a tus manos mientras canalizas la energía mágica alrededor de las puntas de tus dedos como harías normalmente al lanzar el hechizo. Luego asegúrate de seguir las manos con la mirada mientras las mueves al revés, y el flujo de magia cambiará por sí solo. ¿Estás listo?"

          "Sí, ¿por qué no?", dice Breynan en un tono nada convencido.

          "Bien, entonces", digo. "Lo haremos a la de tres. Uno. Dos. ¡Tres!"

          Breynan y yo descruzamos las manos al mismo tiempo, luego doblamos los codos y llevamos los brazos hacia atrás junto al cuerpo hasta su posición original. Cuando termina sus movimientos, Breynan se queda inmóvil durante unos segundos en silencio, como si aún intentara entender qué acaba de pasar.

          "Por los dioses, de verdad ha funcionado...", dice Breynan. "¡No me lo puedo creer! Muchacho, ¿cómo sabías todo esto?"

          "Ya te lo he dicho", digo. "Yo inventé la técnica."

          "¡Después de enseñarme esto, quizá sí me incline a creerte!", dice Breynan. "Muy bien, todo el mundo atrás. Tendré esta trampa desactivada en un abrir y cerrar de ojos."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch04a_contrary
  - name: b3_ch04a_manuals
    texts:
      - source: scene_text
        paragraph: 22
        text: |-
          "¿Cómo se llama el hechizo? ¿Lo enseñan en alguno de los manuales?"

          "Es un hechizo parecido al que llaman 'la mariposa de ácido de Zaldrin'", dice Illuna. "Los dos hechizos son casi idénticos salvo por una pequeña redirección del flujo mágico para hacer más potentes los efectos del hechizo."

          "La mariposa de ácido de Zaldrin...", digo. "Ah, ¿te refieres a ese hechizo en el que tienes que poner las manos delante de ti formando una 'X' y luego empezar a recitar el encantamiento justo después de dejar que el flujo salga de las puntas de tus dedos?"

          Al oír mi última frase, Breynan e Illuna giran la cabeza al mismo tiempo para mirarme, sin tener muy claro cómo reaccionar.

          "¿Qué?...", les pregunto, ya que ambos siguen mirándome fijamente. "Llevo toda la vida leyendo libros sobre magia. Estas cosas ya me las sé de memoria."

          "Sí, supongo que eso tendría sentido", dice Illuna. "Para responder a tu pregunta, los movimientos de las manos y el encantamiento no son obligatorios, pero pueden ayudar a guiar correctamente el flujo de energía mágica. Por ejemplo, alguien como Arraka, que conoce los entresijos de la magia como la palma de su mano, no necesitaría mover ni un músculo para lanzar este hechizo, pero alguien como yo jamás sería capaz de lanzarlo sin los movimientos de las manos."
      - source: scene_text_2
        paragraph: 12
        text: |-
          "Bueno, siempre que conozcas los movimientos de los hechizos originales, lo único que tienes que hacer es invertirlos", digo. "El único problema es que aún tenemos que averiguar en qué orden se lanzaron estos hechizos..."

          "Lo haces sonar fácil, pero olvidas que no somos Brinhorn", dice Illuna. "Lo máximo que he conseguido sacar de ese hechizo de la 'mariposa' son unas cuantas gotas de ácido. Algo así nunca sería útil en combate."

          "No necesita ser útil en combate...", digo. "Solo estás disipando una trampa. Asegúrate de hacer bien todos los movimientos y estarás bien."

          "Dices todo eso solo porque no eres mago", dice Breynan. "No tienes ni idea de lo difícil que es intentar visualizar cada partícula mágica individual en tu cabeza antes de invertirla. Hace falta una concentración inmensa para hacerlo incluso cuando ya estás familiarizado con los hechizos."

          "¡Pero no hace falta nada de eso si ya estás haciendo los movimientos!", digo. "Lo de las partículas mágicas es solo un paso adicional que Brinhorn añadió cuando escribió las instrucciones porque normalmente prefiere no mover mucho las manos al lanzar sus hechizos. Mira, es muy simple. Solo sigue mis movimientos y verás a qué me refiero."

          Entonces coloco ambos brazos delante de mí y cruzo las manos, manteniendo todos los dedos lo más separados posible entre sí, para empezar con los movimientos que requiere la técnica de disipación.
      - source: scene_3
        paragraph: 8
        text: |-
          "Esto es una estupidez", dice Breynan mientras copia mis movimientos a mi lado y extiende también los brazos hacia la trampa mágica.

          "Vale, ahora lo que tienes que hacer es centrarte solo en el movimiento de tus manos", digo. "No visualices nada. Solo presta mucha atención a tus manos mientras canalizas la energía mágica alrededor de las puntas de tus dedos como harías normalmente al lanzar el hechizo. Luego asegúrate de seguir las manos con la mirada mientras las mueves al revés, y el flujo de magia cambiará por sí solo. ¿Estás listo?"

          "Sí, ¿por qué no?", dice Breynan en un tono nada convencido.

          "Bien, entonces", digo. "Lo haremos a la de tres. Uno. Dos. ¡Tres!"

          Breynan y yo descruzamos las manos al mismo tiempo, luego doblamos los codos y llevamos los brazos hacia atrás junto al cuerpo hasta su posición original. Cuando termina sus movimientos, Breynan se queda inmóvil durante unos segundos en silencio, como si aún intentara entender qué acaba de pasar.

          "Por los dioses, de verdad ha funcionado...", dice Breynan. "¡No me lo puedo creer! Muchacho, ¿cómo sabías todo esto?"

          "Ya te lo he dicho", digo. "Yo inventé la técnica."

          "¡Después de enseñarme esto, quizá sí me incline a creerte!", dice Breynan. "Muy bien, todo el mundo atrás. Tendré esta trampa desactivada en un abrir y cerrar de ojos."
