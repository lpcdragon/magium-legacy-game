  - name: b3_ch04a_container
    routes:
      - condition: b3_ch4_cut = 1 AND b3_ch3_chains = 0
        texts:
          - source: scene_text
            paragraph: 40
            text: |-
              "¡Barry, espera! ¡No lo hagas!", grita Melindra de repente, presa del pánico, justo cuando mi hoja atraviesa las cadenas.

              Su advertencia llegó demasiado tarde, porque simplemente no tuve tiempo de detener el tajo de mi daga. En cuanto se cortan las cadenas, el padre de Alice empieza a sufrir convulsiones violentas y su cuerpo tiembla sin control durante cinco segundos. Inmediatamente después, su cuerpo deja de moverse por completo, pero también deja de respirar, mientras su aura empieza a desvanecerse lentamente.

              Después de pasar unos segundos contemplando, conmocionado, al hombre muerto que tengo delante, por fin reúno fuerzas suficientes para hablar.

              "¿Qué... qué ha pasado?...", le pregunto a Melindra con voz débil. "No lo entiendo..."

              "El metal del que están hechas estas cadenas es especial", dice Melindra, mientras se acerca despacio a la mesa y luego agarra una de las cadenas con la mano. "Si permanece demasiado tiempo en contacto con el aura de una persona, forma con ella una relación simbiótica. No puedes arrancarlo por la fuerza, porque sería lo mismo que arrancarle uno de sus órganos vitales. Siento no haberme dado cuenta antes."
          - source: scene_text_2
            paragraph: 25
            text: |-
              "Pero hay alguna manera de revertir esto, ¿verdad?...", le pregunto, impotente, aunque ya sé cuál será la respuesta que me dará. "¿Alguna manera de volver a unir las cadenas y devolverle la vida a este hombre?..."

              "Me temo que no", dice Melindra. "Este metal parece una versión muy modificada de los viejos prototipos con los que Billy Bob solía juguetear la última vez que estuve aquí, y por eso me costó tanto reconocerlo, pero los principios básicos deberían ser los mismos. Una vez que has cortado la conexión por la fuerza, no hay manera de deshacer el daño. La única forma en que cualquiera de las personas de esta sala va a poder quedar libre es si encontramos la sala de control y desactivamos estas cadenas desde allí."

              "¿Y si intentáramos destruir el recipiente metálico?", escribe Leila. "¿No tendría eso el mismo efecto que desactivar las cadenas?"

              "Si intentan destruir ese recipiente lleno de energía, causarán una explosión lo bastante grande como para matar a todas y cada una de las personas de esta sala, incluidos nosotros", dice Melindra, soltando la cadena de su mano. "Como dije antes, desactivar las cadenas desde la sala de control es la única forma de liberar a los prisioneros."
          - source: scene_3
            paragraph: 14
            text: |-
              "Entonces podríamos intentar llegar rápido a esa sala, antes de que alguno de los guardias--", empieza a decir Kate, pero Melindra la interrumpe.

              "No tenemos absolutamente ninguna forma de saber dónde pueden haber colocado la sala de control en este lugar", dice Melindra. "Y, dada la importancia de esa sala, sin duda estará fuertemente vigilada. Estamos todos debilitados después de la última pelea, ni siquiera tenemos aquí a todos los miembros de nuestro equipo, y mucho menos a ninguno de los rebeldes aparte de Breynan. Lo que deberíamos estar intentando hacer ahora mismo es encontrar una salida. Este no es momento de jugar a ser héroes."

              "No, no, no...", digo, mientras agarro frenéticamente las cadenas cortadas e intento volver a unirlas a mano. "Tiene que haber alguna forma de traerlo de vuelta. ¡Solo intentaba salvarlo! ¡No podía morir así como así! ¿Cómo se supone que le voy a decir a esa niña que maté a su padre después de que me suplicara que lo salvara?... Tengo que encontrar alguna forma de revertir--"

              Antes de que consiga terminar la frase, el recipiente metálico y todas las cadenas empiezan de pronto a brillar con una intensa luz azul, mientras los prisioneros de toda la sala comienzan a gritar al unísono.
