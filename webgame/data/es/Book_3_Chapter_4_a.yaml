        texts:
          - source: scene_text
            paragraph: 20
            text: |-
              Recorremos los pasillos subterráneos durante unos veinte minutos más hasta que por fin llegamos a un callejón sin salida, en el sentido de que, vayamos por donde vayamos a partir de aquí, nos veremos obligados a desactivar una de las trampas mágicas. Cuando nos acercamos a la entrada de un túnel donde han colocado una de las trampas, Breynan se adelanta para poder observarla bien.

              La trampa es prácticamente invisible a simple vista, pero todos podemos sentir su presencia aunque no la veamos. Aun así, resulta difícil saber qué ocurriría al activarla solo percibiendo el aura y la energía mágica a su alrededor.

              "Reconozco algunos de estos hechizos", dice Breynan. "Uno de ellos es un hechizo que afecta a la mente y también hay alrededor de tres tipos distintos de hechizos de tierra metidos ahí. Dicho esto, no puedo decir que me sintiera muy seguro intentando desactivar esto solo con los conocimientos que tengo. Quizá podríamos estudiar algunas de las trampas de los otros pasillos para ver si tenemos más suerte con ellas."

              "Lo dudo", dice Melindra. "La razón por la que los he traído específicamente a este pasillo es porque la trampa de aquí parecía la más fácil de disipar. Las otras son mucho más complicadas."

              "Pues te digo que no puedo ocuparme de esta yo solo", dice Breynan. "Aunque se suponga que es 'fácil', desactivar trampas nunca ha sido una de mis especialidades. Ni de lejos tengo el nivel de habilidad necesario para disiparla."
          - source: scene_text_2
            paragraph: 10
            text: |-
              "Mmm", digo. "Pero ¿de verdad Breynan es el único de aquí que puede desactivar trampas? Illuna, estoy bastante seguro de que Flower mencionó que ustedes dos han visitado muchas ruinas en el pasado. Esas ruinas debían de tener trampas, ¿no? ¿Cómo lograban superarlas?"

              "La mayoría de las trampas de las ruinas eran de las antiguas, así que la chica normalmente usaba sus habilidades acrobáticas para salir ilesa", dice Illuna. "En los pocos casos en que nos encontramos con trampas mágicas, tuvimos que depender de Arraka para disiparlas. Flower y yo somos elementalistas, así que desactivar cualquier cosa que no sea la más básica de las trampas mágicas supone un gran desafío para nosotras."

              "¿Arraka puede lanzar magia de disipación desde dentro de su amuleto?...", pregunta Kate. "Creía que los hechizos que podía lanzar eran muy limitados en su estado actual."
          - source: scene_3
            paragraph: 7
            text: |-
              "La magia de disipación no requiere una gran cantidad de energía mágica para lanzarse", dice Illuna. "El problema principal de Arraka mientras está dentro del amuleto es que solo puede almacenar una cantidad muy pequeña de energía dentro de su aura en cada momento, así que la única forma en la que puede lanzar hechizos medianamente poderosos es canalizando la energía fuera del amuleto durante horas y horas, sin que nadie la interrumpa. No es que de repente olvidara cómo lanzar hechizos cuando quedó atrapada ahí dentro. Sigue conservando todos sus conocimientos. Por eso puede lanzar hechizos complejos, como hologramas detallados, objetivos hechos de luz sólida y magia de disipación, pero no consigue lanzar un simple hechizo de explosión para salir de su amuleto. Tardaría tres horas enteras en canalizar la energía necesaria para generar una explosión pequeña, frente a la media hora más o menos que suele necesitar para disipar una trampa."

              "Bueno, Arraka no está aquí con nosotros para ayudarnos con las trampas, así que ahora mismo tú eres nuestra mejor opción", digo. "La has visto usar la técnica de disipación muchas veces, así que a estas alturas ya debes de saber cómo funciona, ¿no?"

              "Saber cómo funciona y ser capaz de ejecutarla con éxito son dos cosas completamente distintas...", dice Illuna.
