  - name: b3_ch04a_avg_joe2
    routes:
      - condition: b3_ch4_demolisher = 1 AND b3_ch1_unlock <> 2
        texts:
          - source: scene_text
            paragraph: 12
            text: |-
              "No voy a gastar ningún punto. Solo empezaré a invertirlos cuando sea absolutamente necesario."

              "Por supuesto que dirías algo así", me dice Kate. "No sé ni por qué me molesté en preguntar."

              "Barry, ¿ni siquiera te da un poco de curiosidad ver qué pueden hacer esas estadísticas nuevas?", escribe Leila.

              "Puede que un poco", digo. "Pero ahora mismo lo que me alegra es tener el dispositivo de estadísticas funcionando otra vez. Al menos ahora sé que, si la situación se pone realmente fea, tendré veinticinco puntos que podré colocar de inmediato en la combinación de estadísticas que necesite para sacarnos del apuro."

              "Bueno... supongo que esa es una forma de verlo...", escribe Leila.

              "Teniendo en cuenta cuánto tiempo hace ya que llegamos a Varathia, empiezo a dudar de que vaya a subir nunca ninguna de sus estadísticas", dice Kate. "A este paso, acabará aferrándose a esos puntos hasta el final del torneo."

              "Míralo por el lado bueno", digo. "Si llegamos a ese punto, tendrás tanto la satisfacción de haber sobrevivido a uno de los torneos de magos más letales del mundo como la satisfacción de poder decir: '¡Te lo dije!'"

              "Claro...", dice Kate.
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch04a_disarm
