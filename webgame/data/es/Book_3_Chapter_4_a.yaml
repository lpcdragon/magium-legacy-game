  - name: b3_ch04a_spectacle
    texts:
      - source: scene_text
        paragraph: 44
        text: |-
          "¡Misericordia!", grita uno de los hombres que cuelgan del techo, que había permanecido completamente en silencio hasta ahora.

          "¡Por favor, ten misericordia!", grita otro.

          "¡Misericordia, por favor, te lo suplico!", oímos gritar a otro hombre desde el otro lado de la sala.

          Al final, todos los prisioneros empiezan a repetir exactamente las mismas palabras una y otra vez, aunque resulte obvio que es inútil. No hay nadie más en esta sala que pueda oírlos aparte de nosotros. Después de aproximadamente medio minuto de gritos continuos, la luz de las cadenas y del recipiente por fin se desvanece, y los prisioneros vuelven a quedar en silencio. Mientras tanto, Flower parece absolutamente aterrorizada, Kate apenas logra mantener la compostura, Breynan parece a punto de ponerse enfermo y Leila tiene el aspecto de estar reviviendo algunos recuerdos del Faro de Esperanza.

          Justo cuando creíamos que todo había terminado, oímos la única voz que menos queríamos oír ahora mismo, procedente de algún lugar a unas decenas de pies detrás de nosotros.

          "¿Disfrutaste del espectáculo, Barry?", dice Eiden con tono grave.

          Me giro rápidamente, pero no lo veo por ninguna parte. Claro, está escondido de manera invisible... Sin Arraka nunca tuvimos ninguna posibilidad de detectarlo, y él lo sabe. ¿Acaso ha estado ahí plantado desde el principio?...
      - source: scene_text_2
        paragraph: 27
        text: |-
          "¿Qué ocurre?", dice Eiden, con el mismo tono serio de antes. "¿No dijiste que ibas a salvar a todas las personas de Varathia a pesar de tu falta de poderes? Pues te he dado la oportunidad. ¿A qué esperas?"

          De repente, Melindra suelta un jadeo y señala en la dirección de la voz de Eiden, aunque seguimos sin poder verlo.

          "¡Eras tú!", dice Melindra en voz alta mientras señala hacia Eiden. "¡Tú fuiste quien nos guio hasta aquí desde los túneles subterráneos! ¡Por eso tu aura me resultaba tan familiar! ¡Solo la estabas enmascarando para que no pudiera reconocerte desde lejos!"

          "¿Qué ocurrirá antes, me pregunto?", sigue dirigiéndose Eiden a mí, ignorando a Melindra. "¿Se quebrará por fin tu determinación cuando entiendas de una vez en qué te has metido exactamente? ¿O serás capaz de lograr lo imposible, como afirmaste? Pase lo que pase, espero que sigas manteniéndome entretenido. No me decepciones."
      - source: scene_3
        paragraph: 16
        text: |-
          "¡No me lo puedo creer!", dice Melindra. "¡Otra vez me está ignorando! Bueno, ¡esta vez no se va a salir con la suya!"

          Entonces genera una pequeña explosión de aire justo al lado de donde Eiden estaba de pie de forma invisible, pero lo único que consigue es balancear ligeramente hacia delante y hacia atrás a unos cuantos de los prisioneros que colgaban del techo en las inmediaciones, sin producir ningún efecto visible sobre el propio Eiden.

          "¡Maldita sea!", dice Melindra. "¡Ya se ha ido!"

          "Sí, seguramente solo se teletransportó aquí para dar su discursito y ahora ha vuelto a observarnos desde lejos", digo. "Juro que se la devolveré cuando descifre todas esas lagunas mágicas suyas..."

          "Olvídate de Eiden", dice Kate. "Seguimos sin saber qué camino tenemos que tomar para encontrar la salida. O la sala de control..."
