  - name: b3_ch04a_glimpse
    texts:
      - source: scene_text
        paragraph: 33
        text: |-
          "¡Por fin!", dice Melindra. "Ahora pongámonos en marcha. Creo que tengo una idea bastante buena de dónde podríamos encontrar una salida que lleve a la superficie."

          "¿Qué te hace decir eso?", pregunta Kate mientras todos echamos a andar otra vez.

          "Poco antes de llegar antes a esta trampa, vislumbré a una persona que de algún modo atravesó una de las paredes de seredium y luego desapareció sin dejar rastro", dice Melindra. "Apenas pude distinguir el aura de esa persona por culpa de todas las paredes que había entre nosotros y él, pero estoy dispuesta a apostar a que utilizó un pasadizo secreto para salir de aquí. Entre nosotros y ese lugar no hay trampas ni enemigos, así que podemos ir a investigarlo directamente."

          "¿Había otra persona aquí en estos túneles aparte de nosotros?...", pregunta Kate. "¿Por qué no nos lo dijiste antes?"

          "Bueno, en realidad no quería que nadie se distrajera demasiado mientras la trampa seguía activa", dice Melindra, "porque es mejor mantener la mente calmada y concentrada cuando estás intentando disipar una trampa mágica. Me pareció que era algo que podía esperar, dado que nunca corrimos un peligro inmediato."

          "¿Ha regresado esa persona desde que desapareció a través de esa pared?", pregunta Kate.

          "No", dice Melindra. "No volvió, y no he sentido a ninguna otra persona en estos pasillos aparte de él y nosotros."
    choices:
      - position: 1
        text: ¿Qué te hace pensar que ese pasadizo secreto nos llevará a la superficie?
        effects:
          - set:
              current_scene: b3_ch04a_surface
      - position: 2
        text: ¿Crees que es posible que esa persona nos detectara y fuera a buscar refuerzos?
        effects:
          - set:
              current_scene: b3_ch04a_reinforcements
      - position: 3
        text: ¿Esa persona era un mago? ¿Qué crees que estaba haciendo aquí abajo?
        effects:
          - set:
              current_scene: b3_ch04a_mage
  - name: b3_ch04a_surface
    texts:
      - source: scene_text
        paragraph: 34
        text: |-
          "¿Qué te hace pensar que ese pasadizo secreto nos llevará a la superficie?"

          "Obviamente, no tengo ninguna garantía de que nos ayude a llegar a las calles de la ciudad", dice Melindra. "Pero seguir cualquier pista sigue siendo mejor que vagar sin rumbo, ¿no crees?"

          "Supongo...", digo. "

          "Antes dijiste que apenas podías sentir el aura de esa persona...", escribe Leila. "¿Existe alguna posibilidad de que se tratara de alguien que ya conociéramos? Como, por ejemplo, uno de los guardias reales?"

          "Mmm, ahora que lo mencionas, el aura sí que me resultó familiar", dice Melindra. "Supongo que podría haber sido uno de los guardias reales, pero no estoy muy segura."

          "Si por casualidad se trataba de Gontrok o del capitán de los guardias, nos espera una pelea infernal...", dice Breynan.

          "Solo si siguen ahí, esperándonos", dice Melindra. "Y eso me parecería muy poco probable. Si alguien tan poderoso como ellos supiera que nos acercamos, no tendría ninguna necesidad de esconderse."

          "Sí, tienes razón", dice Breynan.

          "Intentemos acelerar un poco el paso", dice Melindra. "No me gustaría que sus amigos de la base rebelde empezaran a enviar grupos de búsqueda para encontrarnos por llevar desaparecidos demasiado tiempo."
      - source: scene_text_2
        paragraph: 21
        text: |-
          Todos seguimos a Melindra durante unos diez minutos más por los pasillos laberínticos, hasta que de repente se detiene frente a una pared negra vacía de la caverna y empieza a estudiarla de cerca. Enseguida nos damos cuenta de que esa era la puerta secreta de la que hablaba antes, así que nos acercamos también a la zona e intentamos buscar pistas que puedan ayudarnos a abrir el pasadizo oculto.

          "Apártense", nos dice Illuna. "He visto a Fyron abrir puertas secretas de túneles subterráneos más que de sobra como para saber que lo están haciendo todo mal. A ver si consigo recordar cómo lo hace..."

          Entonces se acerca a la pared negra de la caverna y golpea dos veces sobre ella mientras dirige parte de su energía mágica a su superficie de seredium. Reaccionando a su toque, la pared se retrae lentamente dentro del túnel que hay detrás y luego se desliza hacia un lado, dejando espacio suficiente para que varias personas entren al pasadizo secreto al mismo tiempo. Tal y como Melindra había supuesto, el pasaje conduce directamente a un conjunto de escaleras de piedra que ascienden, presumiblemente hacia la superficie.

          "¡Bien hecho!", dice Melindra. "Veamos adónde lleva esto, entonces."
