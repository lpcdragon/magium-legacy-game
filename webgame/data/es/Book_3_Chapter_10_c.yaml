  - name: b3_ch10c_ending
    texts:
      - source: scene_text
        paragraph: 47
        text: |-
          "Entonces quieres que matemos a Eiden por ti, ¿no es así?" Hadrik dice.

          "No", dice Meridith. "Seremos nosotros quienes nos ocuparemos de Eiden. Esa es la única razón por la que comenzamos a acumular tanta energía en primer lugar".

          "Entonces, ¿qué es lo que quieres de nosotros?" Daren pregunta.

          "Quiero que seas nuestro plan de respaldo, en caso de que algo salga mal", dice Meridith. "Si hay algo que he aprendido en las últimas semanas, es que no importa cuán cuidadosamente pensado sea un plan, aún puede fallar espectacularmente si tienes mala suerte. Es por eso que me gustaría tenerte como seguro. No te preocupes, no te estoy pidiendo que vayas a una misión suicida. Incluso si, por algún milagro, Eiden logra sobrevivir hasta el final del torneo, todavía estará en un estado muy debilitado después de que terminemos con él, lo suficientemente débil como para que tu grupo no tenga problemas para acabar con él. Si aceptas brindarnos ayuda en tal escenario, personalmente te otorgaré acceso ilimitado al nodo Magium que visitamos juntos antes."

          "Para que quede claro, no tienes ninguna intención de revelarnos tus planes secretos, ¿verdad?" Daren pregunta.

          "Me temo que no", dice Meridith. "Si por casualidad, Eiden te capturara y extrajera esta información de alguna manera, todos nuestros esfuerzos habrán sido en vano. No puedo permitir que eso suceda".
      - source: scene_text_2
        paragraph: 33
        text: |-
          "Dijiste que nos darías acceso al Magium si algo salía mal con tus planes y nos ofrecimos a ayudar", dice Kate, "pero ¿y si no pasa nada malo? Supongamos que todo sale exactamente como lo planeaste y matas a Eiden sin nuestra ayuda. ¿Y luego qué?"

          "Entonces aún tendrías acceso a Magium", dice Meridith. "No estoy seguro de que te des cuenta de esto, pero para que seas nuestro plan de respaldo, necesitaré que permanezcas en Varathia hasta el final del torneo. Esto significa que necesitarás seguir participando en el concurso y completar tus objetivos, a menos que quieras arriesgarte a ser expulsado del continente por los reyes. Mientras estés dispuesto a hacer este esfuerzo, mereces tener tu premio, sin importar cuál sea el resultado de nuestra confrontación final con Eiden".

          "Entonces, si accediéramos a ayudarte, ¿los reyes no sabrían de nuestro acuerdo?" Kate pregunta.

          "No", dice Meridith. "Este trato es sólo entre tú y yo. Los reyes no saben que tenemos un nodo Magium propio, por lo que no pueden descubrir que estoy dispuesto a otorgarte acceso a él como recompensa por tu ayuda. En otras palabras, te hago esta oferta como líder de Lessathi, no como organizador oficial del torneo. Déjame repetirlo. Todo lo que tienes que hacer es continuar participando en el torneo, tal como lo hacías antes, y ayudarnos contra Eiden en el muy improbable escenario de que nuestro plan falle y TODOS recibiréis el premio que habéis estado buscando todo este tiempo, sin siquiera tener que ganar el concurso".
      - source: scene_3
        paragraph: 25
        text: |-
          Luego se levanta de su silla y nos mira a cada uno de nosotros por turno.

          "Te he hecho mi oferta", dice Meridith. "Si decides aceptarlo o no, depende de ti".

          Luego hace una pausa de unos segundos antes de continuar.

          "Entonces..." dice Meridith. "¿Qué va a ser?"
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch10c_credits
  - name: b3_ch10c_credits
    texts:
      - source: scene_text
        paragraph: 48
        text: |-
          El capítulo undécimo del tercer libro ya está disponible, sin embargo, no es el capítulo final del libro. Este libro tendrá 12 capítulos en total.

          Lamento mucho el enorme retraso. Tuve un bloqueo de escritura muy severo inducido por el estrés que comenzó con la invasión de Ucrania (debido a vivir en un país vecino), y no he podido recuperar la misma velocidad de escritura desde entonces.

          Me doy cuenta de que esto no es realmente una excusa, y estoy intentando con todas mis fuerzas recuperar una velocidad de escritura decente, pero por el momento tuve que dividir el contenido restante hasta el final del libro 3 en dos capítulos separados, debido a la gran distancia entre los puntos de control, así que decidí publicar el 'capítulo 11' por separado.

          El capítulo final siempre estuvo pensado para dividirse en dos partes con un salto de tiempo entre ellas, como el capítulo 10, por lo que al menos puedes estar seguro de que el final del capítulo 11 no te dejará en un gran suspenso.

          Además, debido a los muchos retrasos que he tenido en el pasado, esta vez he decidido hacer la estimación mucho más vaga, porque todavía no sé qué tan rápido podré escribir.
    choices:
      - position: 1
        text: Pasar al siguiente capítulo
        effects:
          - set:
              current_scene: b3_ch11a_intro
              chapter_save: 1
              checkpoint_rich: 1
              storyboard_controls: Jump to frame "Save load game"
