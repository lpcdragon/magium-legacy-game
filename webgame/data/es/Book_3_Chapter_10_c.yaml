            paragraph: 7
            text: |-
              "Creo que será un gran líder".

              "¿Estás hablando de Breynan o del Supervisor?" Eiden me pregunta.

              "Ambos, para ser honesto", digo. "Estoy bastante seguro de que esos dos harán maravillas mientras trabajen juntos".

              "Hmm..." dice Eiden. "Es cierto que, por lo que he oído, el Supervisor está trabajando en una manera de hacer que las torres seredium funcionen sin magos esclavos, lo cual es sorprendente, considerando que no debería tener nada que ganar al hacer tal cosa. ¿Debo entender que su grupo tuvo algo que ver con esto?"

              "Sí, esto fue parte del trato que hicimos con el Supervisor cuando acordamos ayudarlo a tomar el control de la ciudad", digo. "Prometió que liberaría a los prisioneros de las torres tan pronto como encontrara una manera de eliminar la necesidad de encadenar a los magos a esa máquina chupadora de energía".

              "Interesante..." dice Eiden.
          - source: scene_text_2
            paragraph: 4
            text: |-
              Después de decir esto, ambos permanecemos en silencio durante unos cinco segundos más o menos, hasta que finalmente decido que probablemente debería ser yo quien continúe nuestra conversación.

              "Entonces... ¿es esto todo lo que querías preguntar?" Le digo a Eiden.

              "Sí", dice Eiden. "Al menos en lo que respecta a este tema."

              "¿Qué pasa con el segundo tema que querías discutir con nosotros?" Kate dice, mientras frunce el ceño.

              "Es gracioso que hagas esta pregunta, Kate del Faro de Esperanza", dice Eiden, "ya que el siguiente tema de conversación probablemente te concierne más a ti, de todo el grupo. La verdad del asunto es que me estaba aburriendo esperando que todos ustedes llegaran a su próximo destino, y vine aquí con la esperanza de poder pedirles que se apuraran un poco, ya que su próximo encuentro me preocupa tanto como a usted".

              "¿De qué estás hablando?" Kate dice. "¿Por qué nuestro próximo destino nos preocuparía tanto a ti como a mí?"

              "... ¿Quieres decir que no sabes adónde vas?" pregunta Eiden, luciendo bastante sorprendido.

              Luego se vuelve hacia Melindra, que parece muy estresado en este momento.
