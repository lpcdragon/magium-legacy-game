  - name: b3_ch10c_scepter
    texts:
      - source: scene_text
        paragraph: 26
        text: |-
          Luego de unos segundos de silencio, Meridith extiende sus manos frente a Kate, ofreciéndole una especie de cetro con varias joyas incrustadas en él.

          "Esto es para ti", dice Meridith.

          "¿Qué es?" Kate pregunta, en un tono ligeramente sospechoso.

          "Es una de las reliquias más preciadas de nuestro pueblo", dice Meridith. "Ha estado en nuestro poder durante más de mil años, y es uno de los pocos recordatorios que todavía tenemos de la época en que el imperio Lessathi todavía gobernaba el continente. Te ofrezco esto como una disculpa por todo el sufrimiento que mi pueblo te ha causado en el pasado. Me doy cuenta de que no compensará todos esos años agonizantes pasados ​​en el Beacon, pero al menos debería servir como--"

          "¡¡¡Sacrilegio!!!" grita el Lessathi que está operando el teletransportador. "¡Esto es inaudito! ¡Inimaginable! ¿Crees que el cetro sagrado de Heldenbusorag es un recuerdo barato que puedes regalar a visitantes al azar? ¿Cómo te atreves a burlarte de nuestra herencia de esa manera?"

          "No me estoy burlando de nadie", dice Meridith con calma. "La importancia que esta reliquia tiene para nuestro pueblo es exactamente lo que le da valor como disculpa. De lo contrario, no tendría sentido entregársela a ella".

          "¡Yo... no puedo aceptar esto!" Kate dice, mientras da un paso atrás. "Si es tan importante para ti, entonces deberías conservarlo".
      - source: scene_text_2
        paragraph: 15
        text: |-
          "Por favor, tómalo", dice Meridith, mientras toma suavemente la mano de Kate y luego coloca el cetro en su palma. "Esta reliquia sería mucho más útil en tus manos que acumulando polvo en nuestro tesoro. Para un mago como tú, debería ser de gran ayuda para concentrar tu energía durante los ataques. Pruébalo".

          "...Está bien", dice Kate, vacilante, mientras sostiene el cetro hacia adelante y dispara un carámbano a una de las paredes.

          El carámbano penetra fácilmente la gruesa pared seredium y la atraviesa hasta el fondo, haciendo un agujero profundo en su interior.

          "Admito que no esperaba que funcionara tan bien", dice Kate en tono impresionado. "Normalmente, me habría llevado mucho más tiempo afilar y reforzar mágicamente un carámbano hasta tal punto".

          "Me alegra saber que te funciona bien", dice Meridith.

          "Le aseguro que la facción Heksol estará bastante disgustada con sus acciones, Lady Meridith", dice el ingeniero de teletransportación Lessathi, que parece haberse calmado un poco desde su último arrebato. "Les contaré sobre este asunto personalmente".
      - source: scene_3
        paragraph: 12
        text: |-
          "No es necesario informarles", dice Meridith. "Ya hice públicos mis planes poco después de invitar a Kate y a sus amigos aquí. E incluso si tuvieran dudas sobre si seguiría adelante con esto o no, seguramente descubrirán que estaba hablando en serio cuando vean el cetro en las manos de Kate. Los tiempos están cambiando, Grihirt. Tú y tu facción solo necesitarán aceptar esto. Heksol ha estado muerto durante años y, sin embargo, aún le pones su nombre a tu grupo. En algún momento, Tendrás que aceptar la realidad tal como es."

          "Ya veremos", dice Grihirt en tono ácido.

          "Vámonos", nos dice Meridith. "Hay un largo camino desde aquí hasta nuestra principal base de operaciones, por lo que debemos seguir nuestro camino".

          "Correcto", dice Daren, mientras comenzamos a seguirla a través de los túneles oscuros iluminados por antorchas, mientras dejamos atrás al descontento Lessathi.

          "Me doy cuenta de que tal vez fui un poco irrazonable cuando te pedí que vinieras aquí si querías el detector de piñas", dice Meridith, mientras caminamos detrás de ella, "pero te prometo que no te arrepentirás de tu decisión. Puede que no pueda borrar lo que los Lessathi te han hecho en el pasado, pero ciertamente haré que te compensen cien veces más por tus problemas".

          "¿Por qué te esfuerzas tanto para ayudarnos?" Illuna dice. "Pensé que los organizadores del torneo debían permanecer neutrales con los participantes."
    choices:
