  - name: b3_ch10c_prince
    texts:
      - source: scene_text
        paragraph: 28
        text: |-
          "Espera, ¿eso me convierte en un príncipe Lessathi?"

          "En primer lugar, esto es una meritocracia, no una monarquía, por lo que la única manera de convertirse en líder es ascendiendo de rango a través de sus propias habilidades y trabajo duro", dice Meridith. "En segundo lugar, no soy tu madre, sino tu tía. Mi hermana fue quien te dio a luz".

          "¿Esto significa que sabes lo que les pasó a mis padres biológicos?" digo.

          "Sí..." dice Meridith, mientras baja la cabeza. "Fueron asesinados por orden de Lord Heksol por concebir ilegalmente un niño mitad humano, Medio lessathi, y por abandonar Varathia sin su permiso".

          "¿Pero cómo pudieron irse?" digo. "Pensé que sólo los Lessathi de alto rango debían tener acceso a dispositivos de teletransportación que fueran lo suficientemente potentes como para sacarte de este continente".

          "Yo fui quien los ayudó a escapar", dice Meridith. "En ese momento, yo trabajaba como secretaria de Heksol, así que pude obtener los códigos de activación para el teletransportador de su oficina sin su conocimiento. Después de eso, todo lo que tuve que hacer fue pagarle a alguien para que distrajera a los guardias, para que mi hermana y su amante pudieran teletransportar alejarse de aquí sin interferencias".

          "¿Me estás diciendo que hiciste todo esto y de alguna manera terminaste como el nuevo líder de los Lessathi?" Le pregunto. "¿Cómo lograste no ser encarcelado?"
      - source: scene_text_2
        paragraph: 17
        text: |-
          "Heksol sospechó de mí desde el principio, pero no pudo encontrar ninguna prueba definitiva de que yo fuera quien los ayudó", dice Meridith. "Yo era un miembro muy respetado de la sociedad Lessathi incluso a esa temprana edad, por lo que no podía simplemente encarcelarme basándose en sus propias especulaciones. Lo único que pudo hacer en ese momento fue despedirme de mi posición como su secretaria. Lo que sucedió después fue que eventualmente escalé de rango gracias a mis propias habilidades, y años más tarde se vio obligado a aceptarme como su segundo al mando a pesar de sus recelos".

          Ella hace una pausa.

          "Lo siento... realmente no haber intentado nunca buscarte", me dice Meridith. "Cuando me despedí de mi hermana, acordamos que no intercambiaríamos ninguna información de contacto, por lo que no habría peligro de que sus enemigos de alguna manera descubrieran su nueva dirección por mí. Sólo me enteré de sus muertes mucho más tarde, a través de algunos documentos ocultos con los que me topé mientras ordenaba los archivos de la antigua oficina de Heksol. No sabía tu nombre, tu lugar de nacimiento, ni siquiera si todavía estabas vivo en ese momento. No se me ocurrió ninguna manera de encontrarte, excepto vagando por el continentes con esta varita de metal en la mano, esperando que algún día su punta se volviera verde y pensar que simplemente aparecerías en mi puerta después de todos estos años..."

          "Entonces, ¿qué hacemos ahora?" digo. "¿Nos abrazamos?"
      - source: scene_3
        paragraph: 14
        text: |-
          "No..." dice Meridith. "Pero tu repentina aparición no podría haber llegado en mejor momento. Hay alguien muy importante que quiero que conozcas. Iba a llevarlos a todos a verlo de todos modos porque quería presentarle a Kate, pero ahora que sé quién eres, tiene mucho más sentido que lo conozcas también".

          "¿Quién es esta persona a la que quieres presentarme?" digo. "¿Es otro Lessathi?"

          "Pronto lo verás", dice Meridith. "Ven conmigo. No deberíamos perder más tiempo".

          Mientras continuamos viajando por los desiertos pasillos escondidos, de repente siento un escalofrío por mi espalda, porque recién ahora estoy recordando las últimas palabras de Eiden hacia mí:

          "¿No estás contento, Barry? ¡Ahora finalmente tendrás la oportunidad de entregar mi mensaje!"

          Mensaje de Eiden...

          'Recuerda el invierno quieto'. Una frase que está claramente redactada como una amenaza. ¿Cómo reaccionará Meridith cuando le diga esto? ¿Nos hará encarcelar, aunque supuestamente soy su sobrino y Kate es amigo de Diane? ¿Estará ella en un ataque de ira? ¿Se supone que el mensaje debe tomarse como una amenaza? El stillwaters luchó contra los Lessathi durante el tranquilo invierno, pero por lo que nos dijo Melindra, se suponía que Eiden se había puesto del lado de los Lessathi en esa guerra. Quizás no sea tan malo como parece. Tal vez sólo sea una especie de advertencia amistosa.
