      - condition: b3_ch8_overseer2 = 1 AND b3_ch4_billy <> 7 AND b3_ch4_billy <> 8
        texts:
          - source: scene_text
            paragraph: 6
            text: |-
              "Creo que será un gran líder".

              "¿El supervisor?" Eiden dice, mientras acaricia su barbilla. "Lo último que supe de él fue que buscaba agregar más magos esclavos a las torres seredium para potenciar sus drones de manera más eficiente".

              "Ese bastardo..." digo. "¡Nos dijo que los problemas relacionados con las torres se resolverían!"

              "Y lo eran", dice Eiden. "Desde el punto de vista del Supervisor, el único problema que tenían las torres era que no estaban operando a plena capacidad. Ese problema pronto se solucionará, tal como lo prometió".

              "Se va a arrepentir", digo. "Tan pronto como seamos lo suficientemente fuertes para vencerlo, regresaremos a esa ciudad, y luego él correrá el mismo destino que el último rey de Ollendor".

              "Ya veo", dice Eiden.
