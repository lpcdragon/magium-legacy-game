      - condition: b3_ch8_overseer2 = 0 AND b3_ch8_king = 5
        texts:
          - source: scene_text
            paragraph: 8
            text: |-
              "Creo que será un gran líder".

              "Hmm..." dice Eiden. "Tengo que admitir que un sanador goblin como rey es una elección interesante, por decir lo mínimo. También me sorprendió ver cuán cooperativo ha sido el rey del subsuelo durante los últimos eventos que ocurrieron en su ciudad".

              "¿Qué quieres decir?" le pregunto. "¿Qué últimos acontecimientos?"

              "¿No lo has oído?" Eiden dice. "Tu amigo goblin aparentemente fue muy inflexible en su deseo de liberar a cada uno de los prisioneros de las torres seredium, pero si esto se hiciera demasiado apresuradamente, sin duda habría llevado a un estado general de caos, ya que casi todos los dispositivos mágicos en la ciudad, incluidos los vehículos voladores, habrían dejado de funcionar de la nada. Para contrarrestar esto, el rey del subsuelo hizo que sus hombres difundieran rumores durante uno o dos días. asegurándose de que la mayoría de la población supiera por sí misma sobre el estado de los prisioneros y sobre los horrores que han soportado todo este tiempo a manos del rey anterior y sus subordinados. Como resultado, la gente rápidamente salió a las calles para pedir que todos los prisioneros fueran liberados de inmediato, y naturalmente el goblin estuvo muy feliz de cumplir con sus demandas."

              "¡Oh, lo entiendo!" digo. "Y como la propia gente fue la que pidió la liberación de los prisioneros, ya no podían quejarse de que los vehículos voladores ya no funcionaban, ¿verdad?"
          - source: scene_text_2
            paragraph: 3
            text: "\"Obviously, there were still many complaints, but far fewer than there would have been if not for the king of the underground's intervention,\" Eiden says. \"The important part is that the chances of this situation devolving into a civil war are now very slim, which is far more than one could have normally hoped, given the circumstances.\"\r\n\r\n\"Right,\" I say.\r\n\r\nAfter saying this, we both remain silent for about five seconds or so, until I finally decide that I should probably be the one to continue our conversation.\r\n\r\n\"So... is this all you wanted to ask, then?\" I tell Eiden.\r\n\r\n\"Yes,\" Eiden says. \"Regarding this topic, at least.\"\r\n\r\n\"What about the second topic that you wanted to discuss with us?\" Kate says, while frowning.\r\n\r\n\"It's funny that you should ask this question, Kate of the Beacon of Hope,\" Eiden says, \"since the next subject of conversation probably concerns you the most, out of the whole group. The truth of the matter is that I was getting bored waiting for you all to reach your next destination, and I came here in the hopes that I could perhaps ask you to hurry it up a bit, since your next encounter very much concerns me as much as you.\"\r\n\r\n\"What are you talking about?\" Kate says. \"Why would our next destination concern both you and me?\"\r\n\r\n\"...You mean you don't know where you're going?\" Eiden asks, looking rather shocked."
