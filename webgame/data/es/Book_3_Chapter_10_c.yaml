        texts:
          - source: scene_text
            paragraph: 17
            text: |-
              "De hecho", dice Eiden. "Siempre lo hago. Adiós."

              Luego sonríe, se mete las manos en los bolsillos y se teletransporta.

              "Arraka, solo para estar seguros, en realidad se teletransportó, ¿verdad?" digo. "¿No se esconde simplemente de forma invisible en algún lugar cercano?"

              "No, se ha ido", dice Arraka. "Probablemente ya sepa que no tendría sentido hacer algo así mientras yo esté cerca".

              "Probablemente deberíamos prepararnos para reunirnos con el líder de los Lessathi", dice Kate. "No sabemos a quién traerá como guardaespaldas, así que tal vez queramos prepararnos para una batalla, por si acaso".

              Mientras Kate, Flower y yo desmantelamos las tiendas, Hadrik ayuda a Daren a poner las piezas de su armadura en su mochila, como habían discutido anteriormente. Poco después de que hayamos terminado, Melindra regresa con una expresión un tanto disgustada en su rostro.

              "Hablé con Meridith", dice, tan pronto como aterriza en el suelo junto a nosotros. "Resulta que ella tiene una condición EXTRA para nosotros antes de aceptar reunirse con nosotros. Ella dijo eso... espera un minuto, ¿dónde está Eiden?"
          - source: scene_text_2
            paragraph: 10
            text: |-
              "Se fue mientras tú no estabas", le dice Kate.

              "¡¿Se fue ?!" Melindra dice en voz alta. "¿Ni siquiera pudo quedarse unos minutos más para hablar conmigo después de todo este tiempo? ¿Ni siquiera para decir adiós? ¡Te juro que le voy a pagar por esto!"

              "Uhm... ¿estabas diciendo algo sobre una condición extra?" Hadrik dice.

              "Sí, Meridith quiere que nos reunamos con ella en la base principal de Lessathi, que se puede encontrar en algún lugar muy bajo tierra", dice Melindra. "Tienen un dispositivo de teletransporte realmente poderoso que puede llevarnos allí, pero primero necesitarán enviar a alguien aquí para guiarnos a un lugar donde el teletransportador pueda detectar nuestras señales Transceptores'".

              "¿Quiere que vayamos al medio de la guarida de Lessathi?..." dice Daren. "No estoy seguro de cuánto me gusta cómo suena esto".

              "Estoy de acuerdo", dice Kate. "Sería demasiado arriesgado para todos ir. Tal vez debería ser solo yo. Soy el único con quien Meridith pidió específicamente reunirse".
