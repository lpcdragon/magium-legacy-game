              "Exactamente", digo. "Ya sabemos por los Lessathi en Thilias que fueron ellos quienes sabotearon el dispositivo telepático destinado a transmitirnos los objetivos del torneo, por lo que está claro que querían ganar tanto tiempo como fuera posible. Además, incluso escuché a uno de ellos estar molesto por el hecho de que los reyes no aceptarían establecer una regla en la que a los concursantes se les prohibiría matarse entre sí, así que diría que es bastante obvio que querían que la mayor cantidad posible de nosotros estuviéramos vivos. posible para poder extraer más energía de nosotros".

              "¿El Lessathi de Thilias?" Meridith pregunta. "Esos idiotas... debería haber sabido que ni siquiera se les podía confiar un simple secreto".
          - source: scene_text_2
