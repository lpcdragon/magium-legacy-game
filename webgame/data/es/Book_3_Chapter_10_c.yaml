            text: |-
              "Bueno, para ser justos, hablaron de esto en un antiguo idioma Lessathi, mientras no había nadie más a la vista", digo. "No habría podido retomar esa conversación si no fuera por mis puntos en las estadísticas de Audición y Lenguas Antiguas".

              "¿Te escuché bien?..." Daren pregunta a Meridith, perplejo. "¿Acabas de admitir haber hecho todo lo que Barry dijo que hiciste?"

              "Sí, ¿por qué no?" Meridith dice. "Parece que mis propios subordinados revelaron el plan, entonces, ¿de qué sirve ocultarlo más?"

