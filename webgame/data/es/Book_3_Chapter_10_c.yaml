              "¿Crees que no puedo manejarme solo?" Kate dice, con el ceño fruncido.

              "No lo sé", dice Daren. "Tal vez puedas, tal vez no. Existe un riesgo demasiado desconocido al viajar a una base llena de enemigos potenciales como para que nos separemos. Incluso ir allí como grupo podría resultar un desafío, dependiendo de cómo vayan nuestras negociaciones con Meridith".

              De repente, uno de los látigos de agua de Illuna se enrolla alrededor de la cintura de Kate, mientras Kate se da vuelta para entender lo que está pasando.

