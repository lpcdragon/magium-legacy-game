  - name: b3_ch10c_brother
    routes:
      - condition: b3_ch10_worry = 1 AND b3_ch1_kate3 = 0
        texts:
          - source: scene_text
            paragraph: 19
            text: |-
              "¡No puedes ir solo!" Le digo a Kate. "¡Es demasiado peligroso!"

              "Puedo manejarme solo", dice Kate. "No hay necesidad de preocuparse por mí."

              "Me preocuparé por ti todo lo que quiera, muchas gracias", le digo.

              Cuando Kate escucha mis palabras, su rostro rápidamente comienza a enrojecerse y gira la cabeza para ocultar su vergüenza.

              Al ver su reacción, rápidamente me doy cuenta de que debe haber recordado ese momento en el que estábamos discutiendo el gran precio que el ritual del Dios del Tiempo le cobró, mentalmente, y le dije que no debería ocultarme esas cosas porque 'quiero' preocuparme por ella.

              "Barry tiene razón", dice Daren. "Dejarte ir allí solo está fuera de discusión. Lo máximo que podemos intentar es negociar algo con el Lessathi que Meridith enviará a la superficie para hablar con nosotros, pero si no hay nada que podamos hacer al respecto, entonces tendremos que aceptar el riesgo. Hemos llegado demasiado lejos para renunciar a ese detector de piñas ahora".

              De repente, uno de los látigos de agua de Illuna se enrolla alrededor de la cintura de Kate, mientras Kate se da vuelta para entender lo que está pasando.

              "Illuna, ¿qué estás haciendo?" Kate pregunta.
          - source: scene_text_2
            paragraph: 11
            text: |-
              "Pensé que ya habíamos acordado en Ollendor que ya no irías solo y arriesgarías tu propia seguridad por nuestro bien", dice Illuna, mientras tira de la cuerda hecha de agua solidificada para acercar a Kate a ella. "¿Ya olvidaste la promesa que nos hiciste? ¿Necesito mantenerte atado así en todo momento para que no escapes mientras no miramos?"

              "¡Está bien, lo entiendo, lo entiendo!" Kate dice, mientras Illuna todavía tira de ella. "¡Lo siento! ¡No sugeriré volver a ir solo! ¿Puedes desatarme ahora?"

              "Hmph..." dice Illuna, mientras descarta su látigo de agua. "Será mejor que no lo olvides la próxima vez".

              "Melindra, ¿tienes alguna idea de quién enviará Meridith para saludarnos?" Daren pregunta.

              "No, ella no me lo dijo", dice Melindra. "Pero cada vez que me reunía con ella en el pasado, siempre enviaba a una persona diferente para escoltarme a su base. Nuestro punto de encuentro habitual está más adelante. Sígueme. Te llevaré allí".

              "Entonces, ¿es este un buen momento para preguntarte cómo conociste al líder de los Lessathi?" Hadrik le dice a Melindra, una vez que comenzamos a caminar con ella hasta el lugar de encuentro acordado.

              "Mi hermano ha tenido varios tratos con ella en el pasado", dice Melindra. "Él fue quien me la presentó".

              "Si tienes más de seiscientos años y tu hermano todavía está vivo, ¿significa esto que él también es un stillwater?" Kate pregunta.
          - source: scene_3
            paragraph: 8
            text: |-
              "Sí", dice Melindra. "Él y yo éramos los únicos Medio lessathi que estábamos allí cuando--"

              Hace una pausa por un segundo y se da cuenta de que tal vez haya dicho demasiado.

              "Somos los únicos dos Medio lessathi que se convirtieron en stillwaters", se corrige Melindra. "La mayoría de los demás eran magos humanos, incluido Eiden".

              "Y no creo que esté más dispuesto a contarnos cómo se convirtieron en stillwaters que la última vez que hablamos sobre este tema", dice Daren.

              "No", dice Melindra. "Pero tienes que entender, estoy haciendo esto por tu bien también. Eiden ha sido muy minucioso en eliminar todos los rastros que podrían llevar a alguien a esta información, específicamente para que una tragedia como el invierno quieto nunca vuelva a suceder. Si sospechara que tú tomaste posesión de este conocimiento, no se sabe lo que te haría".

              "Tienes razón", dice Daren. "Esto podría ser lo mejor. Ya tenemos suficientes enemigos poderosos. No hay necesidad de agregar otro a la lista. Entonces, ¿vamos por este camino o...?"

              "No", dice Melindra. "Tenemos que rodear estos arbustos y luego girar a la izquierda. Ahora no mucho más".
