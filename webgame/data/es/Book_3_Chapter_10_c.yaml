              "¿Por qué de repente siento que me falta información importante?" digo. "¿Como si estuviera a un paso de descubrir la verdadera naturaleza del Magium en sí, pero luego desperdicié la oportunidad?"

              "¿Quién sabe?" Arraka me dice. "Tal vez si no hubieras sido tan cobarde y hubieras tocado el nodo Magium ya habrías conocido su verdadera naturaleza. Sin embargo, ya es demasiado tarde para eso. Supongo que tendrás que vivir con tu mala decisión por el resto de tus días".

              "¡No la escuches, Barry!" Daren dice. "Hiciste la elección correcta. ¿Quién sabe qué habría pasado si realmente hubieras tocado el nodo?"
          - source: scene_text_2
