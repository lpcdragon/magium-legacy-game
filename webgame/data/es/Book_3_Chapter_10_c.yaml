  - name: b3_ch10c_panicked
    texts:
      - source: scene_text
        paragraph: 35
        text: |-
          "¡¡¡Mierda, mierda, mierda!!!" Arraka grita de repente, con voz aterrorizada. "¡¿Por qué están ahí parados, idiotas?! ¡Huyan! Huyan lejos, antes de que..."

          En menos de un momento, la luz azul de la esfera se extiende en nuestra dirección y nos envuelve por completo. Lo siguiente que sé es que estoy flotando en algún lugar de un mundo sin dimensiones, junto con todos mis amigos, que miran a su alrededor muy confundidos. No tengo mucho tiempo para entender lo que pasó, porque después de solo unos segundos me encuentro nuevamente en el vacío donde el Magium me envió la primera vez cuando intentó borrarme de la existencia.

          Un sentimiento de miedo intenso se apodera de mí mientras me imagino pasando otra eternidad en este lugar que desafía toda razón. Al igual que la última vez, siento que parpadeo dentro y fuera de la existencia varias veces seguidas, y después de cada viaje consecutivo a ese mundo de la nada, me encuentro de nuevo en el reino de Magium, junto con todos mis amigos, quienes están sudando intensamente, con miradas de puro terror en sus ojos, ya que probablemente estén tratando de entender qué les había sucedido.

          "Barry..." Kate dice. "¿Era este el vacío del que me hablaste antes? Te escuché describirlo, pero nunca hubiera imaginado... nunca en mis peores pesadillas que podría ser algo como esto..."

          "¿Qué está haciendo Arraka?" Daren dice, mientras se esfuerza mucho por mantener la calma y la racionalidad, a pesar del evidente temblor en su voz. "¿Por qué no está lanzando el hechizo primordial?"
      - source: scene_text_2
        paragraph: 21
        text: |-
          "¡Lo estoy intentando!" Grita Arraka, con la misma voz de pánico que tenía cuando nos dijo que corriéramos. "¡Lo estoy intentando, pero no funciona! ¡No puedo apuntar a este fragmento Magium en absoluto! ¡Es como si ni siquiera estuviera allí!"

          Una vez más, siento que me arrastran al vacío, pero ahora es peor que antes. Algo me dice que si esto sucede unas cuantas veces más, no podré volver.

          "Magium, ¡espera!" Grita Flower, con evidente desesperación en su voz. "¡Petal y yo te hemos ayudado en el pasado! ¡Podemos hacerlo de nuevo! ¡Solo dinos qué tenemos que hacer! ¡Por favor!"

          De repente, el parpadeo de entrada y salida de la existencia se detiene y nos quedamos simplemente mirándonos el uno al otro en este mundo sin sentido al que hemos sido traídos por la fuerza. El reino de Magium parece aún más absurdo ahora que la última vez que lo visité con Arraka durante el ritual del Dios del Tiempo. La geometría del lugar no se ajusta a ninguna regla que pueda describirse con palabras.

          Lógicamente hablando, aquí no hay dimensiones, pero aún puedo distinguir fácilmente entre cada uno de mis amigos, incluso si sus formas no tienen contornos. El tiempo parece fluir hacia adelante, pero también hacia atrás. Por ejemplo, estoy bastante seguro de que sólo hemos pasado por toda esta terrible experiencia una vez, pero en mi mente he experimentado estos eventos varias veces, incluso al revés y en orden no cronológico.
      - source: scene_3
        paragraph: 17
        text: |-
          No llego a analizar mucho más este mundo, porque el Magium finalmente decide responder a Flower, aunque su voz parece ir cambiando de timbre y tonalidad con cada nueva frase que pronuncia, como si cada vez fuera una persona diferente.

          "En el pasado, es posible que hayas ayudado", escucho la voz de un anciano.

          "Pero en el presente no es así", continúa el Magium, ahora con la voz de una mujer joven.

          "La profecía ya se ha cumplido", oigo hablar a un adolescente.

          "Deberías saber muy bien lo que hay que hacer", dice la voz de una niña.

          "¡No lo hacemos!" Flower dice, en tono ansioso. "¡Realmente no lo sabemos! ¡Ni siquiera hemos descubierto quiénes se supone que son los dos viejos enemigos que chocan todavía! Quiero decir, supongo que esperamos que uno de esos enemigos sea Eiden, ya que él prácticamente nos lo explicó, pero todavía no estamos seguros de quién es el otro--"

          "Entonces ya tienes tu respuesta", interrumpe una mujer Flower, con voz suave.

          "Para salvar muchas vidas, a veces es necesario un solo sacrificio", oímos ahora la voz de un niño pequeño, que apenas puede articular sus palabras.

          "¿Un sacrificio?..." pregunta Flower, en un tono un tanto temeroso. "¿Tú... quieres que matemos a Eiden?"
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch10c_guidance
  - name: b3_ch10c_guidance
    texts:
      - source: scene_text
        paragraph: 36
        text: |-
          "No debemos permitir que la profecía se cumpla", dice un hombre con voz aguda.

          "Si buscas más orientación, el que se llama Meridith debería poder ayudarte", escuchamos la voz de una anciana sabia.

          "¡No vuelvas a fallar!" Ahora dice un anciano en voz alta y enojada.

          Con estas últimas palabras, el Magium nos envía fuera de su reino en una fracción de segundo, y luego nos encontramos nuevamente frente a la habitación con la esfera de luz azul, mientras todos miran a su alrededor en un estado de confusión temporal.

          "¡Asombroso!" Meridith dice, cuando ve que hemos regresado. "¡He hablado con nuestro Creador muchas veces en el pasado, pero nunca me concedió el honor de invitarme a su propio reino! ¿Asumo que esto es lo que pasó? Todos ustedes entraron en una especie de trance con sus ojos brillando intensamente, tal como se describe en nuestras viejas leyendas, ¡así que seguramente debe ser verdad!"

          "Eh, sí..." dice Daren. "Fuimos al reino de Magium. ¿Estás diciendo que no sabías que esto sucedería?"
      - source: scene_text_2
        paragraph: 22
        text: |-
          "¡No, no tenía idea!" Meridith dice. "Estoy seguro de que tienes mucho que discutir en privado después de esta experiencia que te cambiará la vida, así que te dejaré solo por unos minutos mientras preparo la sala de reuniones al final del siguiente corredor. Cuando hayas terminado de contemplar la magnífica forma terrestre de nuestro Creador, puedes cerrar esta puerta tocándola cinco veces seguidas. Te estaré esperando en la habitación al final del túnel, pero no hay prisa. ¡Tómate tu tiempo!"

          "Mhm..." dice Daren. "Definitivamente nos tomaremos nuestro tiempo".

          "Diane, voy a necesitar ayuda para preparar la sala de conferencias", dice Meridith. "¿Me acompañarás, por favor?"

          "Umm... sí, por supuesto", dice, mientras comienza a seguir a Meridith por el pasillo, mientras nos saluda con la mano. "¡Hasta luego chicos!"
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch10c_scattered
  - name: b3_ch10c_scattered
    texts:
      - source: scene_text
        paragraph: 37
        text: |-
          Mientras Meridith y Diane se van, el resto de mis amigos parecen estar haciendo un gran esfuerzo por calmarse. Mientras tanto, por alguna razón, no puedo evitar sentirme atraído hacia la esfera de luz azul. Es como si hubiera una fuerza invisible que me acercara más a él.

          A pesar del increíble peligro que acabo de correr, el premio del torneo está ahí, frente a mí. ¿Podría dejar pasar esta oportunidad?

          "Nunca pensé que habría un nodo Magium tan profundo debajo de la superficie", escucho a Arraka hablar de fondo. "Fui descuidado. No debería haber bajado la guardia con todos estos seredium muros a mi alrededor, bloqueando mi sentido mágico".

          "¿Qué es un nodo Magium?" Hadrik dice. "¿La gran esfera de luz sólida? ¿Se llama así?"

          "Sí", dice Arraka. "Hay varios de estos dispersos por todo el continente de Varathia, y todos están unidos entre sí. Por eso se llaman nodos. Actualmente, están divididos más o menos equitativamente entre las principales potencias de Varathia, así que supongo que tendría sentido que los Lessathi también tuvieran uno, incluso si lo mantienen en secreto".
      - source: scene_text_2
        paragraph: 23
        text: |-
          "¿Los principales poderes de Varathia?" Daren dice. "¿Como quién? ¿Tyrath? ¿Eiden? ¿El zorro dorado?"

          "Sí, esos tres, más los reyes de Varathia y también Fyron", dice Arraka. "La razón por la que están tan divididos es porque realmente no necesitas más de un nodo para acceder a Magium, y había suficientes por ahí para que cada jugador importante obtuviera al menos uno sin necesidad de pelear por ellos. Además, están muy bien escondidos, así que no es como--"

          "Barry, ¿qué crees que estás haciendo?" Daren dice. "¡Aléjate de allí!"

          Mientras los demás hablaban, yo me había ido acercando cada vez más a la misteriosa esfera de luz, hasta que me acerqué lo suficiente como para poder tocarla. Ahora que la veo de cerca, me doy cuenta de que la esfera es más grande que yo y que el centro negro como boca de lobo alrededor del cual gira constantemente la luz azul sólida está hecho de pura oscuridad. De alguna manera, a pesar de toda esta luz brillante que gira a su alrededor, la oscuridad queda completamente intacta, aunque no debería tener sentido, desde un punto de vista lógico.
      - source: scene_3
        paragraph: 18
        text: |-
          La vista de la esfera es realmente fascinante y siento que apenas puedo apartar los ojos de ella.

          "Barry!" Daren grita. "¡No hagas algo de lo que te arrepientas! ¡Retrocede, lentamente!"

          "¡De hecho fue al nodo!" Arraka dice. "¡Ahahahahahahaha! ¡Tócalo, perdedor! ¡Te reto a que lo toques!"
    choices:
