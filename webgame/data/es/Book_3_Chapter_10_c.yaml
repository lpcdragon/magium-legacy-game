  - name: b3_ch10c_phrasing
    texts:
      - source: scene_text
        paragraph: 31
        text: |-
          De cualquier manera, la solicitud de Eiden no se puede ignorar. La última vez que olvidé entregar su mensaje, casi nos mata a todos. No puedo darme el lujo de correr ese riesgo nuevamente.

          "Umm, Meridith", digo, mientras todavía caminamos por uno de los túneles. "Me doy cuenta de que esto va a parecer un poco repentino, pero acabo de recordar que tengo un mensaje para ti. Es... de Eiden".

          "¿Desde Eiden?" Meridith dice, mientras una vez más deja de caminar, pero esta vez no gira para mirarme. "¿Qué mensaje podría tener para mí?"

          "Me dijo que el mensaje es: 'Recuerda el invierno quieto'. " digo.

          No hay reacción de Meridith. Sólo silencio.

          "Él… no me dijo nada más", digo. "Dijo que lo entenderías tan pronto como escucharas estas palabras".

          "¿Estás seguro de que esta fue su frase exacta?" Meridith me pregunta, mientras ahora comienza a caminar lentamente hacia adelante nuevamente. "¿No hay duda?"

          "Sí, estoy seguro de ello", digo, mientras el resto de nosotros nos movemos para seguirla.

          "¿Te pidió que me entregaras este mensaje específicamente?" Meridith dice.
      - source: scene_text_2
        paragraph: 18
        text: |-
          "Bueno, no, no exactamente", digo. "Al principio, se suponía que debía entregárselo al primer Lessathi que encontrara, pero realmente no podía hacerlo, porque apenas estaba consciente en ese momento. Eiden se enojó mucho cuando descubrió que no entregué su mensaje a pesar de haber entrado en contacto con algunos Lessathi, así que esta vez tuve que asegurarme de cumplir su pedido correctamente".

          "¿Cómo supo que entraste en contacto con un Lessathi?" Meridith dice. "¿Fuiste tú quien se lo dijo?"

          "No, él mismo lo descubrió", digo. "Él tiene este sentido mágico increíblemente poderoso que puede usar para identificar el aura de todos en todo el continente, y descubrió por nuestras auras que me acerqué a algunos Lessathi".

          "¡¿Qué acabas de decir?!" Meridith pregunta en voz mucho más alta que antes, mientras ahora se da vuelta para mirarme nuevamente.

          "No lo sé", digo confundida. "¿Qué parte?"

          "¿Acabas de decir que Eiden pudo descubrir que conociste a algunos Lessathi solo por sus auras?" Meridith dice.
      - source: scene_3
        paragraph: 15
        text: |-
          "Quiero decir, sí, estoy bastante seguro de que así fue como pudo detectarlos", digo. "Como dije, puede detectar auras desde distancias extremadamente grandes".

          "¡No lo entiendes!" Meridith dice. "Nosotros Lessathi siempre llevamos brazaletes bajo las mangas, con el propósito específico de pasar desapercibidos. Si Eiden pudo detectar a nuestros hombres desde tan lejos, ¡entonces los brazaletes no tienen sentido!"

          "¡Jajajajaja!" Arraka se ríe de repente. "¿Pensaste que esas baratijas mal hechas podrían mantenerte oculto de Eiden? ¡Tendrían que ser al menos cien veces más fuertes para que algo así funcione!"

          "¿Cien veces más fuerte, dices?..." pregunta Meridith, como si realmente estuviera considerando seriamente la sugerencia de Arraka. "Creo que eso podría ser factible. Probablemente tendremos que reciclar algunas de las pulseras y combinar sus piezas, pero al menos nuestros exploradores estarán más seguros de lo que están ahora. Les diré a nuestros manitas que comiencen a trabajar en esto tan pronto como regrese a nuestra base".

          "Sí, buena suerte con eso", dice Arraka, en tono sarcástico.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch10c_deserved
  - name: b3_ch10c_deserved
    texts:
      - source: scene_text
        paragraph: 32
        text: |-
          "No entiendo por qué estás tan preocupado de que Eiden te detecte", le digo, mientras ahora avanzamos una vez más por uno de los túneles. "¿No fue un aliado de los Lessathi durante la guerra todavía invernal?"

          "¡¿Un aliado?!" Meridith dice, un poco demasiado alto. "¡Eiden fue la razón por la que el invierno quieto comenzó en primer lugar! ¿Debería estarle agradecido por haber cambiado de opinión y cambiar de bando al final, después de que sus amigos ya habían matado a la mayoría de la población Lessathi? ¡El invierno quieto no fue nada parecido a una guerra! Fue una masacre unilateral, ¡y cada stillwater que participó en ella tiene sangre en sus manos!"

          "¡Oye, oye, OYE!" Melindra interviene. "Ni yo, ni mi hermano, ni Eiden participamos en esta supuesta masacre de la que hablas. ¡Y fue culpa del Lessathi que llegó a esto! Si no hubieran mantenido a Eiden y a todos los demás magos encarcelados, las cosas nunca habrían llegado a tal--"

          "¿Fue culpa del Lessathi?" Meridith pregunta furiosamente. "¿Incluso las mujeres y los niños? ¿Estás diciendo que se merecían lo que recibieron?"
      - source: scene_text_2
        paragraph: 19
        text: |-
          "Yo--" dice Melindra, luciendo como si estuviera dudando en dar una respuesta directa. "No estoy tolerando lo que hizo stillwaters. Lo que estoy diciendo es que ellos no fueron quienes lo iniciaron".

          "Espera un minuto..." digo. "¿Estaban encarcelando a los magos porque los Lessathi estaban experimentando con ellos y convirtiéndolos en stillwaters? ¿Es así como comenzó toda esta guerra?"

          "Nadie sabe cómo surgió el stillwaters, excepto los stillwaters", dice Meridith, mientras le da a Melindra una mirada de desdén. "Eiden se ha asegurado de que la información permanezca oculta a nadie más, para que no haya otro humano lo suficientemente fuerte como para desafiarlo nunca más".

          "Entonces tampoco sabes cómo se crean stillwaters", digo. "Interesante..."
      - source: scene_3
        paragraph: 16
        text: |-
          Meridith ahora golpea la pared al final del pasillo oscuro con su varita de metal y se abre otra puerta secreta, que nos lleva a un túnel casi cegadoramente brillante, con sus paredes y techo llenos de cristales azules. Al igual que cuando estábamos en las cavernas subterráneas de Ollendor, los cristales pulsan de vez en cuando, pero parecen estar un poco menos activos que hace cuatro días.

          "¡Vaya, son muchos cristales!" Hadrik dice, mientras la puerta se cierra detrás de nosotros.

          "Efectivamente", dice Meridith, mientras nos dirigimos ahora hacia el lado derecho, donde los cristales son más abundantes. "Si estás preocupado por el comportamiento peculiar de los cristales, debes saber que han estado actuando así durante más de cuatro días, y no se han reportado incidentes hasta ahora. Todavía estamos tratando de descubrir qué desencadenó esto, pero todavía no hemos tenido éxito".
    choices:
      - position: 1
        text: Dile a Meridith que todo comenzó después de que el rey de Ollendor volara las cuevas.
        effects:
          - set:
              current_scene: b3_ch10c_brightly
              b3_ch10_crystals: 1
      - position: 2
        text: No le digas a Meridith nada sobre los cristales.
        effects:
          - set:
              current_scene: b3_ch10c_brightly
              b3_ch10_crystals: 0
  - name: b3_ch10c_brightly
    routes:
      - condition: b3_ch10_crystals = 1
        texts:
          - source: scene_text
            paragraph: 33
            text: |-
              "En realidad conocemos la causa", digo. "Los cristales comenzaron a actuar mal después de que el rey de Ollendor volara las cuevas subterráneas debajo de la ciudad para matar a los rebeldes".

              "¿Estás diciendo que los cristales de aquí fueron afectados por algo que sucedió en Ollendor?" Meridith me pregunta.

              "Sí, estoy bastante seguro de ello", digo. "Allí también se comportaban de la misma manera. Todos tenían vibraciones rítmicas lentas, mientras que la luz se atenuaba gradualmente y luego volvía a brillar, como si todos los cristales respiraran al unísono".

              "Si lo que dices es cierto, será de gran ayuda en nuestra búsqueda para comprender mejor la naturaleza de los cristales azules", dice Meridith. "Gracias por esta valiosa información".

              "De nada", digo.

              "¿Soy solo yo, o no hemos visto ni un solo Lessathi desde que salimos de la sala de teletransporte?" pregunta Kate, mientras continuamos caminando por la caverna subterránea brillantemente iluminada.

              "Estos corredores en particular están restringidos únicamente a los miembros de mayor rango de nuestra comunidad", dice Meridith. "Otras personas no pueden pasar por aquí sin mi permiso expreso".

              "Entonces, ¿esto es como un lugar de reunión para los Lessathi más importantes?" Daren dice.

              "No", dice Meridith, "pero es un lugar muy sagrado al que se le debe dar el debido respeto".
          - source: scene_text_2
            paragraph: 20
            text: |-
              Luego se detiene frente a la única pared seredium que no tiene cristales incrustados y se gira hacia nosotros.

              "Hemos llegado a nuestro destino", dice Meridith. "El que te está esperando se puede encontrar en la habitación más allá de esta pared".

              "Entonces, ¿esto significa que finalmente nos vas a decir con quién debemos encontrarnos?" Hadrik dice.

              "Sí", dice Meridith, mientras ahora nos da la espalda nuevamente para poder golpear la pared seredium varias veces con su varita. "Es alguien de quien sin duda habrás oído hablar antes, pero que probablemente nunca hayas tenido la oportunidad de conocer cara a cara".

              Al igual que en el túnel anterior, la pared reacciona al toque de su varita y la puerta secreta comienza a abrirse lentamente, revelándonos lo que hay al otro lado.

              "Él es la forma más elevada de existencia y ha guiado a nuestro pueblo desde la antigüedad", continúa Meridith, mientras la puerta se ha abierto casi por completo.

              Ahora que podemos ver el interior de la siguiente habitación, vemos que lo único que nos espera allí es una esfera muy grande de luz azul sólida que fluye constantemente alrededor de un centro negro como boca de lobo.

              "Permítanme presentarles a nuestro verdadero Creador", dice Meridith. "¡El Magium!"
