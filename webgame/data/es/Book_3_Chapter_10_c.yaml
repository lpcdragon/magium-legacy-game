        text: Toque el nodo Magium.
        effects:
          - set:
              current_scene: b3_ch10c_colors
              b3_ch10_node: 1
      - position: 2
        text: Aléjese del nodo Magium.
        effects:
          - set:
              current_scene: b3_ch10c_colors
              b3_ch10_node: 0
  - name: b3_ch10c_colors
    routes:
      - condition: b3_ch10_node = 1
        texts:
          - source: scene_text
            paragraph: 38
            text: |-
              Ignoro la advertencia de Daren y toco la esfera azul de oscuridad y luz con mi mano derecha.

              De repente, miles de millones de imágenes y voces aparecen en mi cabeza al mismo tiempo y por un momento tengo la sensación de que entiendo todo lo que hay que saber sobre el universo. Sin embargo, aunque el conocimiento parece estar ahí, a mi alcance, también parece muy lejano, como si pudiera dar una cantidad infinita de pasos hacia él y la distancia entre nosotros seguiría siendo la misma.

              Rápidamente saco mi mano, antes de sentirme abrumado por la inmensa cantidad de información que está inundando mi cerebro, y luego todo el conocimiento desaparece casi tan rápido como lo obtuve.

              Dicho esto, definitivamente me siento diferente ahora de cómo era antes de tocar la esfera. Puede que el conocimiento en sí ya no esté todavía en mi cabeza, pero todavía hay... algo. Siento que la raíz de la información todavía está presente de alguna manera en mi mente. Como si el origen mismo de esas ideas no pudiera ser extraído de mi mente una vez que dejé de tocar la esfera, simplemente quedó abandonada allí, en mi cabeza.

              Si tan solo pudiera encontrar alguna manera de reconstruir el resto de los detalles solo a partir de lo que me queda...

              "¡No puedo creerlo!" Daren dice, mientras me aleja del nodo Magium y fuera de la habitación. "¡No puedo creer que realmente lo hayas hecho! Barry, te lo juro, ¡un día de estos me vas a dar un infarto!"
          - source: scene_text_2
            paragraph: 24
            text: |-
              Luego golpea la pared seredium cinco veces, como dijo Meridith, y la puerta secreta que conduce a la habitación con la esfera azul se cierra detrás de nosotros.

              "¿Y bien?..." dice Daren, al verme ahí parado, sin decir nada. "¿Nos vas a contar qué pasó cuando tocaste la esfera?"

              "No mucho, sinceramente", digo, mientras me recupero lentamente. "Durante ese segundo en que toqué el nodo Magium, sentí que sabía todo lo que había que saber sobre el mundo, pero también sentí que me habría vuelto loco si hubiera mantenido mi mano allí por más tiempo. Y quiero decir realmente loco, no solo mi nivel normal de locura. El conocimiento estaba ahí frente a mí, esperando a ser tomado, pero también sentí que habría necesitado una eternidad para agarrarlo. Si no lo hubiera soltado yo mismo, mi mente probablemente se habría autodestruido por la gran cantidad de sobrecarga de información."

              "Eh..." dice Daren, con voz pensativa. "Debo decir que es una sorprendente cantidad de autocontrol viniendo de ti".

              "¡Oye, ni siquiera yo estoy tan loco!" digo.

              "Es bueno escuchar eso", dice Daren. "Entonces, ¿al menos lograste retener algún conocimiento útil de todo esto?"

              "Es difícil decirlo", le respondo. "Todavía quedan algunos rastros de la información dentro de mi cabeza, pero no sé si algún día podré descifrarlos".

              "Está bien", dice Daren. "Entonces, inútil por ahora. Entendido."
          - source: scene_3
            paragraph: 19
            text: |-
              "Tengo una pregunta", dice Kate, mientras mira con cierta ansiedad hacia la pared entre nosotros y el nodo Magium. "¿Crees que el Magium todavía puede escucharnos a través de la esfera de luz roja ahora que la puerta seredium está cerrada?"

              "Muy improbable", dice Arraka. "Pero no estaría de más alejarse un poco más para estar seguros".

              "Espera, espera, espera..." dice Hadrik, mientras nos alejamos de la pared, y en dirección a la sala de reuniones de Meridith. "¿Acabas de decir esfera roja? ¿Qué quieres decir con roja? Los únicos colores que vi en esa esfera fueron amarillo y negro. ¿Dónde estaba el rojo?"

              "La esfera era claramente verde para mí", dice Daren, "así que supongo que diferentes personas deben verla en diferentes colores. ¿Es así, Arraka?"

              "Correcto", dice Arraka. "Flower, por ejemplo, lo ve violeta, y Illuna también, ya que vive dentro de la mente de Flower. Yo, por otro lado, he pasado por tantos cuerpos terrestres que ya he visto los nodos Magium en todos los colores del arco iris".

              "Pero los cristales son azules para todos, ¿verdad?" Kate pregunta. "Pensé que se suponía que eran 'esencia Magium cristalizada'. ¿Por qué no los vemos en diferentes colores, como el nodo?"
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch10c_common
      - condition: b3_ch10_node = 0
        texts:
          - source: scene_text
            paragraph: 39
            text: |-
              Después de una cuidadosa consideración, decido alejarme de la esfera azul. Probablemente debería al menos preguntarle a Meridith más detalles al respecto antes de hacer algo demasiado loco.

              "Uf..." dice Daren. "Me asustaste allí, por un momento. Pensé que realmente lo ibas a hacer".

              "Al principio iba a hacerlo, pero luego decidí no hacerlo", digo. "Siento que esto podría ser demasiado arriesgado, incluso para mí".

              "Pffft", dice Arraka. "Qué marica."

              "Probablemente deberíamos cerrar la puerta antes de que a nadie se le ocurra alguna idea", dice Daren, mientras golpea la pared cinco veces, como dijo Meridith, y la puerta secreta se desliza lentamente hacia su lugar.

              "¿Crees que el Magium todavía puede escucharnos a través de la esfera de luz roja ahora que la puerta seredium está cerrada?" Kate dice.

              "Muy improbable", dice Arraka. "Pero no estaría de más alejarse un poco más para estar seguros".
          - source: scene_text_2
            paragraph: 25
            text: |-
              "Espera, espera, espera..." dice Hadrik, mientras nos alejamos de la pared, y en dirección a la sala de reuniones de Meridith. "¿Acabas de decir esfera roja? ¿Qué quieres decir con roja? Los únicos colores que vi en esa esfera fueron amarillo y negro. ¿Dónde estaba el rojo?"

              "La esfera era claramente verde para mí", dice Daren, "así que supongo que diferentes personas deben verla en diferentes colores. ¿Es así, Arraka?"

              "Correcto", dice Arraka. "Flower, por ejemplo, lo ve violeta, y Illuna también, ya que vive dentro de la mente de Flower. Yo, por otro lado, he pasado por tantos cuerpos terrestres que ya he visto los nodos Magium en todos los colores del arco iris".

              "Pero los cristales son azules para todos, ¿verdad?" Kate pregunta. "Pensé que se suponía que eran 'esencia Magium cristalizada'. ¿Por qué no los vemos en diferentes colores, como el nodo?"
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch10c_common
  - name: b3_ch10c_common
    routes:
      - condition: b3_ch10_node = 1
        texts:
          - source: scene_text
            paragraph: 40
            text: |-
              "No estoy del todo seguro de cómo funcionan los cristales", dice Arraka, "pero, según lo que he oído, el azul es el color que se ve más comúnmente en los nodos Magium, así que esa podría ser parte de la razón. También puedo confirmar que de todos los colores que he visto mientras poseía animales, el azul fue definitivamente el color que apareció con más frecuencia".

              "Sí, eso tendría mucho sentido, ya que veo la esfera azul", digo.

              "¡Ja!" Hadrik dice. "Un color común para un nombre común. Es como si el universo mismo quisiera atraparte a veces, ¿no?"

              "Eh..." digo. "Créeme, te acostumbras después de un tiempo".

              "Entonces, umm... ¿es este un buen momento para preguntar qué piensan todos sobre lo que nos acaba de pasar en el reino Magium?" Daren dice. "No quisiera despertar un trauma innecesario en nadie, pero siento que esto debe discutirse lo antes posible".

              "Está bien", dice Kate. "Al menos Barry nos advirtió de antemano sobre el vacío y la eliminación de la existencia, por lo que no fue tan impactante como podría haber sido. Dicho esto, no estoy exactamente seguro de qué hay que discutir. Yo diría que el encuentro fue bastante sencillo. El fragmento Magium prácticamente nos confirmó que Eiden es uno de los dos viejos enemigos mencionados en la profecía, y también confirmó más o menos que lo quiere. muerto."

              "Entonces, ¿nos vamos a convertir ahora en los lacayos de Magium?" Hadrik dice. "¿Así de simple? ¿Qué poder tiene sobre nosotros de todos modos? ¿Lo encontraríamos de nuevo si nunca nos acercáramos a una de esas extrañas esferas?"
          - source: scene_text_2
            paragraph: 26
            text: |-
              "No es tan simple", dice Arraka. "Cada vez que Selkram hace sus rituales, te vincula directamente con el Magium, por medio del Tejedora del tiempo que entrega la profecía y que está vinculado con el Magium durante ese tiempo. Mientras estás en ese estado, prácticamente estás parado en la puerta del Magium, así que sí, habría un riesgo notable de que entres en contacto directo con un fragmento de Magium nuevamente incluso si evitas los nodos".

              "Eh..." dice Hadrik. "Bueno, de cualquier manera, no soy títere de nadie, así que supongo que Magium tendrá que borrarme entonces. Si nos vemos obligados a luchar contra Eiden en algún momento, por mí está bien, ¡pero no saldré de mi camino para cazarlo sólo porque una estúpida esfera de luz flotante me lo ordenó!"

              "¡Ese es el espíritu!" Arraka dice. "No te preocupes, me aseguraré de llevarte de contrabando algunas mantas cuando cumplas tu condena dentro del vacío. Escuché que puede hacer mucho frío allí durante el invierno".

              "Guarda las mantas y envíame un poco de cerveza enana", dice Hadrik. "No hay nada que te caliente mejor durante un invierno helado que un poco de alcohol fuerte".

              "Debidamente anotado", dice Arraka.
          - source: scene_3
            paragraph: 20
            text: |-
              "Chicos... creo que podría haber descubierto algo muy importante", dije, después de estar profundamente inmerso en mis propios pensamientos durante más de un minuto, mientras los demás hablaban.

              "¿Como?" Arraka me pregunta, en tono dudoso.

              "Cuando toqué el nodo Magium, aunque fue por muy poco tiempo, todavía podía sentirme conectado con el Magium mismo", digo. "Esto era más que simplemente el 'vínculo' que tenía con él durante los rituales. Era como si el Magium y yo fuéramos uno y el mismo... Yo era uno... con la fuente".

              "¿La fuente?" Daren me pregunta. "¿Quieres decir, como la fuente de toda magia?"

              "No, no, no SÓLO de magia", digo. "Me refiero a la fuente del plano terrestre, el plano mágico, el Plano Etéreo... la fuente de todos los universos paralelos que contienen diferentes versiones de nosotros mismos... la fuente del tiempo y el espacio... la fuente de los pensamientos, la conciencia y el libre albedrío... En otras palabras... la fuente de todo."

              "Entonces, ¿estás diciendo que esta es la verdadera naturaleza del Magium?" Kate me pregunta. "¿No es la fuente de toda la magia, sino la fuente de todo?"
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch10c_informed
