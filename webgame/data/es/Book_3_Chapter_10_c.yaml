  - name: b3_ch10c_message
    texts:
      - source: scene_text
        paragraph: 11
        text: |-
          "Meridith como en... ¿el líder de los Lessathi?..." pregunta Kate.

          "¡Lo siento mucho!" Melindra suelta, de repente. "¡Realmente no sabía nada sobre tu historia con ella o los Lessathi cuando hice el trato contigo por primera vez para ayudarme con Ollendor! Después de enterarme, pensé que podía mantener esto en secreto y reunirme con Meridith yo misma para obtener el detector de piñas, pero ella no lo aceptó. Ella siguió preguntándome en el transceptor para qué necesitaba el dispositivo y con quién viajaba, y cuando le di el nombre de Daren, de alguna manera hizo la conexión de inmediato de que tú estarías en el mismo grupo y pidió conocerte específicamente. Dijo que, a menos que vinieras personalmente a solicitarle el detector de piñas, ella nunca me lo daría. Kate, ¡sé cómo suena esto, pero prometo que puedo solucionarlo de alguna manera!"

          Durante el discurso de Melindra, hubo un murmullo cada vez mayor de fondo, de Daren, Hadrik, Illuna y Flower hablando entre sí en un tono preocupado, mientras Arraka se reía histéricamente desde dentro de su amuleto. Mientras intentaba descubrir mis propios sentimientos al respecto, de repente noté que Eiden me había estado sonriendo todo este tiempo, con los ojos cerrados, como de costumbre.

          "¿No estás contento, Barry?" Eiden me dice, una vez que me ve mirándolo. "¡Ahora finalmente tendrás la oportunidad de entregar mi mensaje!"

          Así es... el mensaje de Eiden. Lo había olvidado por completo, con todo lo que ha estado pasando últimamente. ¿Significa esto que todavía quiere que se lo entregue al Lessathi después de todo este tiempo?
      - source: scene_text_2
        paragraph: 5
        text: |-
          "Melindra, mírame", le dice Kate a Melindra, mientras pone sus manos sobre sus hombros. "Necesito que respires profundamente y te relajes. ¿Puedes hacer eso por mí?"

          "¡Sí, puedo hacer eso!" dice Melindra, y luego comienza a respirar profundamente, una tras otra, aunque es obvio que se está obligando a hacerlo y que no se está relajando en absoluto. "Está bien, ¿qué sigue?"

          "Ahora quiero que escuches atentamente lo que voy a decir", dice Kate. "No es un problema para mí reunirme personalmente con Meridith. Puedes seguir adelante y concertar la reunión".

          "¿Que no es?" Melindra pregunta, luciendo muy confundido. "¿Puedo?"

          "Sí", dice Kate. "Quizás hace poco más de una semana hubiera dicho algo diferente, pero mientras estaba en la primera prueba del ritual del Dios del Tiempo, recibí mucha ayuda de Meridith. De hecho, sin la ayuda de Meridith, casi con seguridad habría terminado muerto. Tal como están las cosas, siento que al menos le debo el beneficio de la duda, considerando que mi buena amiga Diane también me dijo que estaba trabajando con Meridith por su propia voluntad."

          "Entonces... ¿puedo llamar a Meridith?" Melindra dice. "¿Puedo decirle que nos veremos cuando ella quiera?"

          "Sí, puedes", dice Kate.

          "Wow... esto es... ¡No puedo expresar cuánto alivio es esto!" Melindra dice. "Estaba seguro de que intentarías matarme si te dijera esto. ¡O al menos que me pondrías una daga en la garganta y me clavarías a un árbol!"
      - source: scene_3
        paragraph: 4
        text: |-
          "Por supuesto que no", dice Kate. "Nunca le haría eso a un amigo".

          Luego se gira hacia mí y me mira sugiriendo que sabe que fui yo quien le contó a Melindra que me había puesto una daga en la garganta.

          "¿No es así, Barry?" ella dice.

          "Sí, sí, por supuesto", digo. "Melindra simplemente estaba exagerando. ¡Nunca hubo nada de qué preocuparse!"

          "¡En ese caso, haré los preparativos necesarios para contactarla ahora mismo!" Melindra dice.

          "Adelante", dice Kate.

          "Nos vemos en un momento", dice Melindra, mientras se aleja volando de nosotros.

          "Bueno, creo que esto concluye el negocio que tuve con su grupo", dice Eiden. "Estoy seguro de que nos volveremos a ver pronto".

          "Sabes dónde encontrarnos", dice Daren.
