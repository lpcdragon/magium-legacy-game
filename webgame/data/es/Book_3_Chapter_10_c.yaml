            paragraph: 45
            text: |-
              "¿De verdad necesito explicarlo con todas las letras?" digo. "Lo que estoy 'insinuando' es que todo este torneo es una farsa. Nunca planeaste darle a nadie acceso al Magium. La única razón por la que consideraste ofrecerlo como premio fue porque sabías con certeza que esto era lo único que podría atraer a tantos magos a un solo lugar. El verdadero propósito de este torneo nunca fue elegir un campeón para defender Varathia. Fue usar todos esos dispositivos de estadísticas que compraste para extraer una enorme cantidad de energía de los participantes."

              "¡Oh, ahora lo entiendo!" Hadrik dice. "Por eso nos hicieron esperar una semana antes de darnos nuestros primeros objetivos. Y también por eso nos hicieron correr por todo el continente como idiotas, buscando piñas. ¡Estaban ganando tiempo para poder sacarnos suficiente energía!"

              "Exactamente", digo. "Honestamente, lo único que no puedo entender es por qué permitirían que los magos se mataran entre sí. ¿Por qué no simplemente establecer una regla que establezca que no se permite matar antes de que comience el torneo, y luego retrasarnos indefinidamente?"
          - source: scene_text_2
            paragraph: 31
            text: |-
              "Eso es lo que intentamos inicialmente", dice Meridith con calma, mientras todos nos giramos para mirarla. "Esa es también la razón por la que la mayoría de los extractores de energía se han colocado debajo de las principales ciudades de Varathia. Es porque esperábamos que la mayoría de los participantes del torneo buscaran refugio dentro de las ciudades mientras esperaban que se anunciaran los primeros objetivos. Incluso llegamos a sabotear el dispositivo telepático destinado a transmitirles esos objetivos, solo para asegurarnos de que tuviéramos el mayor tiempo posible. Desafortunadamente, los reyes de Varathia no estuvieron de acuerdo con nosotros. Dijeron que hacer cumplir una regla que impida que los participantes del torneo se maten entre sí estaría en contra de la 'tradición' de Varathia y que no la aceptarían y, para colmo, solo nos informaron de esto muy poco antes del comienzo del concurso. Ni siquiera podías empezar a imaginar cuánto afectó esto a nuestros planes..."

              "Entonces, ¿lo estás admitiendo, entonces?..." dice Daren, perplejo. "¿Así?"

              "¿Por qué no?" Meridith dice, mientras se encoge de hombros. "Tus amigos parecían haber resuelto la mayor parte de esto, así que ¿por qué prolongar lo inevitable?"

              Ella hace una pausa.
          - source: scene_3
            paragraph: 24
            text: |-
              "Sin embargo", continúa Meridith, "me gustaría señalar que, de hecho, hubo dos cosas en las que mi sobrino se equivocó en su análisis. En primer lugar, en realidad no tenemos miles de potenciadores de estadísticas escondidos dentro de las ciudades de Varathia. Compramos todos esos dispositivos para poder desmontarlos y usar sus piezas para crear extractores de energía, que serían mucho más potentes que los propios potenciadores de estadísticas. Y en segundo lugar, nadie dijo nunca que no lo haríamos. otorgarle acceso a Magium."

              "¿Hablas en serio?" Le pregunto a Meridith. "¿Estás diciendo que se supone que debo creer que le darás su premio al ganador del torneo cuando ya has admitido que todo el concurso es sólo una artimaña?"

              "No me entiendes", dice Meridith. "Obviamente, el ganador del torneo no recibirá nada. Lo que estaba diciendo es que estoy dispuesto a darte acceso al Magium. A ti y a todos tus amigos. Y todo lo que necesitas hacer para esto es brindarme un poco de ayuda".

              "¿Brindar ayuda?" Kate dice. "¿Qué tipo de ayuda exactamente?"

              "Verás", dice Meridith, "la realidad es que todo este torneo del que has formado parte hasta ahora solo se ha organizado gracias a una persona. Desde la destrucción de Olmnar, hace veinte años, los reyes de Varathia y los Lessathi han estado trabajando juntos por un único propósito común, y después de veinte arduos años, finalmente hemos encontrado una manera de lograrlo. Al final de este torneo, finalmente habrá justicia. Al final de esto torneo, Eiden estará muerto".
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch10c_ending
