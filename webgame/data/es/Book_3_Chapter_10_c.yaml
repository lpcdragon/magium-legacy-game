chapter_effects:
  - condition: b3_ch3_stats_unavailable = 1
    effects:
      - disable stats
  - condition: b3_ch3_stats_unavailable = 0
    effects:
      - enable stats
scenes:
  - name: b3_ch10c_collector
    texts:
      - source: scene_text
        paragraph: 2
        text: |-
          "¿Nunca lo olvidarás?" Eiden dice, con una sonrisa. "¿Ni siquiera si te doy esta piedra rara que encontré durante mis viajes recientes?"

          Luego saca una piedra de su bolsillo y se la muestra a Melindra, y aunque ella se esfuerza por no mostrar sus verdaderos sentimientos, está claro que se siente muy tentada por ello.

          "Incluso para un coleccionista como usted, una roca como ésta debe ser bastante difícil de encontrar hoy en día", afirma Eiden. "¿Cómo solías llamar a este tipo de rocas, otra vez? Deitrah... Dengah..."

          "Una piedra Dedra", Flower y yo decimos al mismo tiempo, sin pensar.

          "¡Sí, una piedra Dedra!" dice Eiden, pareciendo sorprendido e impresionado por nuestra respuesta.

          Luego me mira a mí y a Flower, y luego otra mirada a Kate, quien había estado observando cada uno de sus movimientos y estaba preparando algunos carámbanos desde que comenzó a caminar más cerca de Melindra.

          "Felicitaciones, Melindra", dice Eiden. "¡Parece que hiciste buenos amigos mientras estuve fuera!"

          "Tomaré la piedra", dice Melindra, mientras rápidamente toma la piedra de su mano, mientras parece un poco avergonzada, "y lo consideraré como una forma de disculpa, ¡pero no creas que estás libre de culpa todavía!"

          "Por supuesto, por supuesto", dice Eiden, con su habitual sonrisa educada.
      - source: scene_text_2
        paragraph: 2
        text: |-
          "Entonces, ¿te importaría decirnos el motivo de tu visita o esperas que lo adivinemos?" Illuna dice.

          "Todo a su debido tiempo, Illuna del masacre de los bosques sagrados", dice Eiden. "Pero primero, me gustaría hacer una pregunta que no tiene ninguna relación. ¿No se suponía que había un mago blanco en tu grupo? ¿Qué pasó con Daren? Ya sabes... un tipo de piel oscura... muy alto... ¿lleva armadura todo el tiempo?"

          "Estoy aquí, imbécil", dice Daren. "No actúes como si no me vieras".

          "Mi buen señor, debe estar equivocado", le dice Eiden. "Aparte de tu obvia falta de armadura pesada, el Daren que conozco habría intentado matarme en la primera oportunidad, o al menos, me habría mirado como si estuviera listo para degollarme en cualquier momento. No recuerdo haber tenido ninguna otra conversación contigo desde la última vez que te vi, entonces, ¿qué ha cambiado exactamente?"

          "Así es, no lo recuerdas..." dice Daren, con voz pensativa. "De hecho, no tendrías forma de recordarlo..."

          "¿Disculpe?" Eiden dice.

          "Digamos que... una versión diferente de ti de otro mundo me ha ayudado cuando estaba en mi punto más bajo", dice Daren, "y debido a eso, estoy dispuesto a adoptar una actitud algo más indulgente hacia ti, al menos por el momento".

          "... ¿Estás hablando de las pruebas del Dios del Tiempo?" Eiden pregunta, en un tono más serio de lo habitual.

          "Sí", responde Daren, simplemente.
      - source: scene_3
        paragraph: 2
        text: |-
          "Ya veo", dice Eiden, mientras pasa unos segundos en silenciosa contemplación antes de volver a hablar. "En ese caso, probablemente debería darte una advertencia. Esto puede parecerte obvio, pero Eiden y yo no somos la misma persona. No compartimos los mismos recuerdos y, según la antigüedad de esa versión mía, es posible que él haya tenido una perspectiva de la vida completamente diferente a la que tengo ahora. No sé lo que te dijo ni hasta qué punto te enviaron al pasado, pero no debes cometer el error de pensar que todo lo que hayas discutido en ese juicio se aplica a este mundo. Creer lo contrario probablemente sólo te llevará a la decepción".

          "No te preocupes", dice Daren. "No planeo cometer ese error".

          "Muy bien", dice Eiden. "Ahora que tenemos eso resuelto, tal vez sea hora de cambiar el tema de conversación a uno de los dos temas principales de los que he venido aquí para hablarles. En primer lugar, analicemos Ollendor. Dime, Barry, ¿qué piensas sobre su nuevo rey?"
    choices:
      - position: 1
        text: Creo que será un gran líder.
        effects:
          - set:
              current_scene: b3_ch10c_leader
              b3_ch10_leader: 1
      - position: 2
        text: Realmente no me preocupo mucho por él, para ser honesto.
        effects:
          - set:
              current_scene: b3_ch10c_honest
              b3_ch10_leader: 0
      - position: 3
        text: Creo que era la opción menos mala disponible en ese momento.
        effects:
          - set:
              current_scene: b3_ch10c_available
              b3_ch10_leader: 2
  - name: b3_ch10c_leader
    routes:
      - condition: b3_ch8_overseer2 = 0 AND b3_ch8_king = 0
        texts:
          - source: scene_text
            paragraph: 3
            text: |-
              "Creo que será un gran líder".

              "¿El secuaz de rey del subsuelo?" Eiden dice, mientras levanta una ceja. "¿Es esa tu opinión sobre él?"

              "Bueno, al menos seguramente será mejor que el rey anterior", digo, mientras me encojo de hombros.

              "Efectivamente, pero eso se podría decir de casi cualquier persona", me dice Eiden. "Lo que pregunto es si cree que fue la mejor opción entre las disponibles".

              "Quiero decir, claro", digo. "¿Por qué no? Albert era prácticamente el líder principal de las fuerzas rebeldes antes de comenzar a servir en el rey del subsuelo, así que diría que está más que calificado para el trabajo".

              "Ya veo", dice Eiden.
          - source: scene_text_2
            paragraph: 4
            text: |-
              Después de decir esto, ambos permanecemos en silencio durante unos cinco segundos más o menos, hasta que finalmente decido que probablemente debería ser yo quien continúe nuestra conversación.

              "Entonces... ¿es esto todo lo que querías preguntar?" Le digo a Eiden.

              "Sí", dice Eiden. "Al menos en lo que respecta a este tema."

              "¿Qué pasa con el segundo tema que querías discutir con nosotros?" Kate dice, mientras frunce el ceño.

              "Es gracioso que hagas esta pregunta, Kate del Faro de Esperanza", dice Eiden, "ya que el siguiente tema de conversación probablemente te concierne más a ti, de todo el grupo. La verdad del asunto es que me estaba aburriendo esperando que todos ustedes llegaran a su próximo destino, y vine aquí con la esperanza de poder pedirles que se apuraran un poco, ya que su próximo encuentro me preocupa tanto como a usted".

              "¿De qué estás hablando?" Kate dice. "¿Por qué nuestro próximo destino nos preocuparía tanto a ti como a mí?"

              "... ¿Quieres decir que no sabes adónde vas?" pregunta Eiden, luciendo bastante sorprendido.

              Luego se vuelve hacia Melindra, que parece muy estresado en este momento.
          - source: scene_3
            paragraph: 3
            text: |-
              "Melindra, ¿no les has dicho?" Eiden dice.

              "¡Iba a decírselo!" Melindra dice. "Solo estaba... esperando el momento adecuado, ¡eso es todo!"

              "Entonces no hay mejor momento que el presente, ¿no crees?" Eiden le dice.

              "Melindra, ¿qué está pasando?" Kate pregunta. "¿Quién es esta persona a la que nos llevas y qué tiene que ver todo esto conmigo?"

              "Es... yo... Kate, primero que nada necesito que mantengas la calma", dice Melindra, luciendo como si ella misma estuviera a punto de entrar en pánico. "¿Puedes prometerme eso?"

              "Está bien", dice Kate. "Prometo."

              "Muy bien", dice Melindra, "entonces, umm... lo primero que debo mencionar es que cuando tú y yo nos conocimos, honestamente no tenía conocimiento de nada relacionado con magos artificiales o Faro de Esperanza. Solo descubrí estas cosas mucho más tarde, cuando los escuché hablar de ellas".

              "Es justo", dice Kate. "¿Pero por qué me cuentas esto de repente?"

              "Es porque..." Melindra dice, "verás... la persona que quería que conocieras... mi conocida que tiene el detector de piñas es de hecho... es... ella es--"

              "Es Meridith", dice Eiden, al ver que Melindra no se atreve a decir las palabras. "Ella te está llevando a Meridith".
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch10c_message
