      - source: scene_text
        paragraph: 12
        text: |-
          "Oh, sólo una última cosa antes de irme", dice Eiden. "¿Tal vez tendrías alguna idea de por qué tu Revenant amiga Tejedora del tiempo me ha estado mirando de manera invisible con una daga en la mano y su aura casi completamente suprimida durante los últimos diez minutos más o menos?"

          "Ah, mierda, esperaba que no se diera cuenta de ella", dice Arraka, mientras el Revenant ahora aparece ante nosotros.

          "Rose..." dice Kate, con una mirada de dolor en sus ojos, mientras ve una vez más el Revenant dentro del cuerpo de su viejo amigo muerto.

          "¿Hay algo en lo que pueda ayudarte?" Eiden le dice al Revenant, mientras levanta una ceja.

          "Estaba planeando detener el tiempo y atacarte en tu estado más vulnerable, en el momento exacto en que debías teletransportar alejarte de aquí, pero supongo que ya es demasiado tarde para eso", dice la Revenant, en su habitual tono inexpresivo.

          "Creo que eres un seguidor del Dios de la Muerte......" dice Eiden. "¿Por qué un dios querría verme muerto, si puedo preguntar?"
      - source: scene_text_2
        paragraph: 6
        text: |-
          "Mi maestro, el Dios de la Muerte dijo que sabe de una fuente confiable que tú eres quien orquestó los eventos de hoy", dice el Revenant, "y que no descansará hasta que hayas pagado con tu vida tu impertinencia".

          ¿Los eventos de hoy?... ¿Podría ser que Jirinn ya haya logrado que los dioses se enfrenten entre sí como Arraka planeó?

          "Lo siento, pero no tengo ni idea de qué estás hablando", dice Eiden, confundido. "No he tenido tratos con plano mágico desde hace mucho tiempo."

          "Desafortunadamente para ti, mis órdenes son matarte, no cuestionar tus motivos", dice el Revenant.

          "¡Entonces, por supuesto, puedes intentarlo!" Eiden dice, con una sonrisa.

          En el siguiente segundo, Revenant desaparece ante nuestros ojos y aparece junto a Eiden con su cuchillo en su garganta, pero antes de que pueda cortarle el cuello, es disparada lejos de su enemigo, sin que él tenga que mover un dedo.

          "¿De verdad pensaste que no tendría defensas automáticas en caso de que alguien intentara usar magia del tiempo contra mí?" Eiden dice. "Seguramente, el Dios de la Muerte puede hacer algo mejor que enviar a una persona armada con una daga para asesinarme".
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch10c_revenant2
  - name: b3_ch10c_revenant2
    texts:
      - source: scene_text
        paragraph: 13
        text: |-
          "El Dios de la Muerte... no... confía en mí..." dice la Revenant, mientras apenas logra levantarse del suelo, luciendo como si estuviera haciendo un gran esfuerzo incluso para hablar después de recibir ese golpe de Eiden. "Solo soy... un peón... desechable para él. Dijo... que me envió aquí como una prueba... de mi lealtad".

          "Qué lástima", dice Eiden.

          "No he... terminado todavía", dice Revenant y luego de repente desaparece nuevamente, reapareciendo detrás de Flower en un instante, mientras sostiene la daga en su garganta.

          "¿Rose?..." dice Flower, mientras levanta la cabeza para mirar el Revenant.

          "Lo siento", le dice Revenant a Flower. "El mismo Dios de la Muerte me ha ordenado que te tome como rehén si no puedo matar a Eiden con mis propios poderes".

          "Está bien", dice Flower. "No te lo reprocharé."
      - source: scene_text_2
        paragraph: 7
        text: |-
          "Déjala ir, Revenant", dice Daren, amenazadoramente, mientras apunta con su espada hacia ella.

          "Liberaré a la niña después de que stillwater cumpla con mis demandas", dice Revenant. "Ni un momento antes."

          "¿Y exactamente por qué debería importarme si ella muere o no?" Eiden pregunta.

          "Mi maestro sabe que el zorro dorado te ha pedido que protejas a Flower en el pasado", dice Revenant. "Si no te entregas a mí, la mataré".

          "Me temo que una vez más tu información no es del todo correcta", dice Eiden. "Eleya sólo me pidió que no matara a la niña. Ella nunca dijo nada sobre protegerla".

          "¡Esta chica morirá si no haces lo que te digo!" el Revenant dice. "¿Lo entiendes?"
      - source: scene_3
        paragraph: 5
        text: |-
          "No tengo ningún problema con que la mates", dice Eiden, con una sonrisa. "De hecho, me estarías haciendo un favor. Después de todo, ella es el único ser humano que actualmente puede ser poseído por Arraka, si alguna vez saliera de ese amuleto".

          Después de la respuesta de Eiden, hay una breve pausa durante la cual Revenant simplemente lo mira fijamente, probablemente tratando de descubrir si está mintiendo o no.

          "Continúa..." dice Eiden, después de unos segundos más de silencio. "¿Qué estás esperando? Hazlo".

          Revenant presiona el cuchillo más cerca del cuello de Flower, pero sus ojos inexpresivos ahora muestran una pizca de vacilación. A pesar de lo que dijo en el pasado acerca de ser sólo una herramienta para el Dios de la Muerte, parece que todavía tiene su propio libre albedrío. Tal vez pueda disuadirla de esto, de alguna manera.
