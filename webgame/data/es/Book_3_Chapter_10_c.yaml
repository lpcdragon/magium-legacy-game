  - name: b3_ch10c_revenant3
    routes:
      - condition: b3_ch10_reason = 1
        texts:
          - source: scene_text
            paragraph: 14
            text: |-
              "¡Piensa en lo que estás haciendo!" Le digo al Revenant. "¿Es esto realmente lo que quería el Dios de la Muerte? ¿Matar a Flower indiscriminadamente si Eiden no cede a tus demandas? ¿Realmente quieres perder a tu único rehén? ¿No puedes encontrar otra manera de resolver esto?"

              "Otra forma..." dice la Revenant, mientras poco a poco va aflojando su agarre sobre Flower y alejando el cuchillo de su cuello. "Sí... ¡tiene que haber otra manera!"

              Al ver que Revenant ya no le presta toda su atención, Flower aprovecha la oportunidad para esconderse debajo de sus brazos y alejarse corriendo de su captor. Luego inmediatamente salta y se impulsa hacia el cielo con chorros de fuego que salen de sus pies, de modo que el Revenant ya no puede alcanzarla.
          - source: scene_text_2
            paragraph: 8
            text: |-
              Tan pronto como Flower escapa, Eiden usa su técnica de manipulación del aura en el Revenant para estrangularla con una fuerza invisible, mientras la levanta lentamente del suelo.

              "Acabo de recordar..." dice Eiden, mientras Revenant lucha por liberarse, a pesar de que sus poderes de tiempo no sirven de nada aquí. "Había algo que siempre quise probar con respecto a los Tejedora del tiempo, pero nunca logré hacerlo. De hecho, intenté hacer una prueba similar en Rose mientras ella todavía estaba viva, pero creo que me distraí y eventualmente lo olvidé".

              "¡No!" Kate le grita a Eiden. "¡Déjala en paz!"

              "Hmm..." dice Eiden, mientras mira hacia Revenant quien está tratando desesperadamente de quitar la fuerza invisible de su cuello con sus propias manos mientras aún flota sobre el suelo. "Ahora que lo pienso, incluso si sigo estrangulándote así, no vas a morir pronto, ¿verdad? Dado que un no-muerto como tú en realidad no necesita respirar para mantenerse con vida... Tal vez es hora de un ligero cambio de estrategia".

              Luego envía una cuchilla de viento directamente hacia su cuello, decapitándola en un instante.
          - source: scene_3
            paragraph: 6
            text: |-
              Lo que pasó después está completamente borroso en mi mente. Me parece recordar algún tipo de discusión que tuvo lugar entre Eiden, Daren y Kate, pero no sé exactamente qué fue. Creo que tuvo algo que ver con Revenant y su inmortalidad.

              Al igual que cuando Daren mató al Revenant durante el ritual del Dios del Tiempo, todo esto se siente como un sueño dentro de mi cabeza, pero sé con certeza que fue real. Considerando que el Revenant ahora está vivo y coleando, parado exactamente en el mismo lugar donde estaba justo antes de que Eiden comenzara a estrangularla, solo puedo asumir que el hechizo automático del Magium destinado a mantenerla viva se activó una vez más, y revirtió el tiempo solo para el Revenant y su atacante, mientras que el resto del mundo solo recuerda lo que sucedió antes de la inversión del tiempo como un sueño distante, o en absoluto.

              "¡Fascinante!" Eiden dice. "Siempre supuse que así era como el Magium evita que los Tejedora del tiempo mueran antes de terminar de entregar sus profecías, ¡pero verlo en la práctica es una experiencia completamente diferente! El hechizo parece haber revertido el tiempo lo suficiente para que puedas escapar usando tus propios poderes, pero ¿qué pasaría si sigo matándote una y otra vez, me pregunto? ¿Podrá el hechizo seguir el ritmo o tiene limitaciones? ¿Lo descubriremos juntos?"
        effects:
          - set:
              ac_b3_ch10_reasonable: 1
            achievement:
              id: ac_b3_ch10_reasonable
              title: ¡Seamos razonables!
