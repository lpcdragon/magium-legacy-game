        texts:
          - source: scene_text
            paragraph: 43
            text: |-
              "Creo que sería mejor mencionárselo a Meridith", digo. "Es casi seguro que ya conoce los planes del fragmento Magium, por lo que podría resultar sospechoso si no se lo contamos".

              "Puede que tengas razón", dice Daren. "Después de todo, Magium nos dijo que deberíamos hablar con Meridith si tenemos alguna pregunta. ¿Están todos los demás de acuerdo?"

              "Para mí es lo mismo, ya que no planeo ser parte de esta persecución de ninguna manera", dice Hadrik.

              "Está bien", dice Kate, mientras Flower también asiente.

              "Entonces está arreglado", dice Daren. "Vamos a ver qué quiere Meridith".

              Daren va a abrir la puerta y luego todos ingresamos a la sala de reuniones uno por uno. El interior de la habitación no es muy diferente del salón donde solíamos reunirnos con rey del subsuelo en Ollendor, excepto por el hecho de que hay muchas decoraciones Lessathi en las paredes, que representan su muy querida cresta del halcón que sostiene el sol en sus garras.

              Hay una mesa en el medio de la habitación y suficientes sillas a nuestro lado para que todos podamos sentarnos. Al otro lado de la mesa, solo hay dos sillas, en las que Meridith y Diane ya están sentados. Nada más entrar, Meridith nos invita a sentarnos en las sillas, así que hacemos lo que nos pide y nos sentamos cómodamente en el lado opuesto a ella.

              Una vez que estamos todos en la mesa, Meridith comienza a hablar.
          - source: scene_text_2
            paragraph: 29
            text: |-
              "Debes estar preguntándote por qué te llamé aquí", dice Meridith. "Responderé a todas tus preguntas muy pronto, pero primero me gustaría hacer una pregunta yo mismo. Por favor, entiende que de ninguna manera estás obligado a darme una respuesta y te pido disculpas si estoy siendo demasiado directo, pero ¿hay alguna posibilidad de que puedas decirme lo que has discutido con nuestro Creador después de que fuiste convocado a su reino?"

              Mis amigos y yo intercambiamos una mirada, y luego de unos momentos de silencio, Daren es quien responde Meridith.

              "El Magium nos pidió que matáramos a Eiden para evitar la calamidad predicha por la profecía", dice Daren.

              "¡Entonces mis sospechas eran correctas!" Meridith dice, sonando un poco emocionado. "¡Realmente te invitó a unirte a nuestro lado!"

              "¿Tu lado?" Daren dice. "¿Quieres decir que Magium también te hizo la misma solicitud?"

              "Sí", dice Meridith. "Y he estado trabajando para lograr este objetivo durante mucho tiempo".

              "Antes de continuar con esta discusión, me gustaría hacer sólo una pregunta", digo.

              "¡Sentir la libertad!" Meridith dice. "Pregunta lo que quieras".

              "¿Algo que quiera?" Digo, mientras alzo una ceja. "Muy bien, entonces. En ese caso, ¿podrías decirme si eres tú quien ha estado comprando todos los dispositivos de estadísticas de los otros continentes poco antes del comienzo del torneo de magos?"
          - source: scene_3
            paragraph: 23
            text: |-
              Por unos segundos solo hay silencio, mientras Meridith y yo seguimos mirándonos directamente, sin desviar la mirada.

              "¿Qué te hizo llegar a esa conclusión?" Meridith me pregunta simplemente, sin mostrar ningún cambio en su expresión facial.

              "Bueno, para empezar", digo, "quien haya logrado ese truco debe haber sido alguien con mucho dinero, que sabía que los potenciadores de estadísticas eran más que baratijas de adivino, y que necesitaba hacerse con todos esos dispositivos antes de que comenzara el torneo. No puedo pensar en muchas personas que encajen en esa descripción".

              Luego hago una pausa por varios momentos, para ver si la expresión del rostro de Meridith cambia de alguna manera, pero ella es capaz de controlarse perfectamente.

              "¿Es eso todo?" Meridith dice. "¿Son estas las únicas razones que te llevaron a creer que fui yo quien acumuló todos esos dispositivos?"

              "No", digo. "También está el hecho de que mi potenciador de estadísticas ha estado aprovechando considerablemente menos energía en Thilias y Ollendor que fuera de las dos ciudades. Aparte de esto, conozco a otra persona con un dispositivo de estadísticas que ha estado en Thilias desde el comienzo del torneo, y que ha acumulado muchos menos puntos de estadísticas que yo debido a eso. Si hubiera otros aprovechadores de energía mágica en esas ciudades, como por ejemplo digamos... mil dispositivos de estadísticas, entonces tendría mucho sentido."

              "¿Qué estás insinuando exactamente?" Meridith me pregunta.
