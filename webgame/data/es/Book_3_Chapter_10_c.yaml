  - name: b3_ch10c_designated
    texts:
      - source: scene_text
        paragraph: 22
        text: |-
          Cuando finalmente llegamos al lugar de encuentro designado, vemos que el enviado de Lessathi ya estaba allí, esperándonos. Sin embargo, contrariamente a nuestras expectativas, nuestra guía no era una Lessathi, sino una mujer de veintitrés años con un físico delgado pero musculoso, una cicatriz de quemadura en el brazo izquierdo y cabello corto y rubio que se erizaba por sí solo, debido a la electricidad estática que se acumulaba constantemente a su alrededor.

          "Diane!" Kate dice, en voz alta. "¡Realmente eres tú!"

          "Nunca escuchas, ¿verdad?..." dice Diane, en tono derrotado. "Te advertí que abandonaras este lugar y, aun así, de alguna manera lograste regresar a..."

          Diane no logra terminar lo que estaba diciendo, porque Kate corre hacia ella y la abraza con fuerza.

          "Te tengo", dice Kate, mientras aprieta con más fuerza a su amiga. "Y no vas a escapar. No esta vez".

          "¡Oye, oye, déjame ir!" Diane dice, mientras intenta liberarse del poderoso control de Kate. "¡Me estás avergonzando delante de tus amigos!"
      - source: scene_text_2
        paragraph: 12
        text: |-
          "Finalmente nos volvemos a encontrar, ¿eh?" Hadrik le dice a Diane. "Sabes, pasamos por muchos problemas por tu culpa. Después de que nos dejaste inconscientes en medio del bosque sagrado, fuimos capturados por el zorro dorado y casi nos matan varias veces".

          "¡¿Lo hiciste?!" dice Diane, mientras logra escapar del alcance de Kate, luciendo muy sorprendida. "¡Lo siento! Yo... yo no sabía... no pensé..."

          "¡Jajaja!" Hadrik se ríe. "Cálmate, solo estaba bromeando un poco. Como puedes ver, todos estamos muy vivos y tenemos algunas buenas aventuras, ¡así que todo estará bien cuando termine bien!"

          "...Cierto", dice Diane, en tono incierto. "Yo... realmente les debo una disculpa a todos, sin embargo. No debería haberlos tratado de la forma en que lo hice. Es sólo que... estaba tan desesperada por evitar que Kate entrara en contacto con los Lessathi que yo... actué sin pensar. Siempre hago cosas estúpidas como esta cuando estoy bajo mucho estrés. Es un viejo y mal hábito mío del que nunca he logrado deshacerme, incluso después de todo este tiempo. De todos modos, de verdad, ¡lo siento mucho, mucho! ¡Te prometo que encontraré una manera de compensarte!"
      - source: scene_3
        paragraph: 9
        text: |-
          "Hmm..." dice Daren. "Si estabas tan preocupado por Kate conocer a los Lessathi, entonces ¿por qué estás trabajando para ellos? No te están amenazando ni nada por el estilo, ¿verdad?"

          "No, no, nada de eso", dice Diane. "En pocas palabras, estoy trabajando con Meridith, pero no con los otros Lessathi".

          "Pero... ¿no es ella su líder?" Hadrik dice.

          "En cierto modo", dice Diane. "Los Lessathi se encuentran en un estado fracturado en este momento, y han estado así durante muchos años, desde la muerte de su último líder, Heksol. No desafían abiertamente la autoridad de Meridith, pero muchos de ellos han estado trabajando activamente contra sus intereses desde el comienzo de su nombramiento como nuevo líder de los Lessathi. Meridith cree que algún día podrá reformarlos a todos y hacerlos cambiar sus costumbres, aunque yo soy un mucho más escéptico."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch10c_advanced
  - name: b3_ch10c_advanced
    texts:
      - source: scene_text
        paragraph: 23
        text: |-
          "¿Puedes al menos decirme por qué decidiste quedarte aquí después de todos estos años?" Kate le pregunta. "¿Por qué no dejar Varathia y comenzar una nueva vida? ¿Es por Jason?"

          "Él es parte de la razón, sí..." dice Diane. "Mi hermano siempre ha admirado a Meridith, y él no se alejaría de su lado sin importar qué, pero también está el hecho de que sé lo que los Lessathi pueden hacer si se les deja solos, y no quiero que vuelva a suceder otro Faro de Esperanza. Meridith ha hecho todo lo posible para reparar la mayor cantidad posible de daño causado por ese programa de orfanato, y también ha prohibido la gran mayoría de las prácticas bárbaras que fueron cosas que han hecho Lessathi en el pasado, como tratar a sus hijos con discapacidades como rechazados sociales y sentenciar a muerte a los Lessathi que abandonaron su comunidad. La respeto por hacer todas estas cosas, y es por eso que sigo trabajando junto a ella hasta el día de hoy".

          "No estoy seguro de qué hacer con todo lo que acabas de decir", dice Daren. "Por un lado, me alegro de que Meridith parezca ser alguien con quien se puede razonar, pero por otro lado parece que no tiene mucho control sobre su propia gente. ¿Qué es lo que garantiza que no intentarán capturarnos o algo peor tan pronto como entremos teletransportar en sus dominios?"
      - source: scene_text_2
        paragraph: 13
        text: |-
          "Daren tiene un buen punto", dice Kate. "Diane, ¿estás seguro de que es seguro para nosotros ir a encontrarnos con Meridith en la propia base de operaciones del Lessathi?"

          "No es necesario que te preocupes por eso", dice Diane.

          "¿Por qué no?" Kate pregunta.

          "Porque si alguno de ellos intenta lastimarte, lo mataré", dice Diane, mientras sus ojos ahora brillan con una luz amarilla brillante. "Los mataré a todos y ellos saben que puedo hacerlo. Créeme, no se atreverán a ponerte una mano encima".

          De repente, Flower jadea fuertemente y señala hacia Diane.

          "¡Puedes hacer eso con los ojos brillantes!" Flower dice, luciendo muy emocionado. "¡Eso es genial! No pensé que alguna vez encontraría a alguien más que pudiera hacer esto. ¡Yo también puedo hacerlo, mira!"
      - source: scene_3
        paragraph: 10
        text: |-
          Luego aprieta los puños y se concentra mucho, mientras sus ojos gradualmente comienzan a brillar con un color rojo y su aura se siente como si estuviera ardiendo.

          "Sí, esta es... una técnica etéreo muy avanzada", dice Diane, muy impresionada por lo que Flower le está mostrando. "Normalmente, esto sólo debería ser posible después de años de arduo trabajo y práctica. Me sorprende que ya puedas hacerlo a una edad tan temprana".

          "¡No soy joven!" Flower dice. "¡Tengo treinta años y estoy bastante seguro de que soy mayor que tú!"

          "Um... ¿vale?..." dice Diane, y luego se vuelve hacia nosotros. "¿Está bromeando o?..."
    choices:
      - position: 1
        text: Sí, sólo está bromeando. No te preocupes por eso.
        effects:
          - set:
              current_scene: b3_ch10c_joking
      - position: 2
        text: En realidad, lo creas o no, ella está diciendo la verdad.
        effects:
          - set:
              current_scene: b3_ch10c_truth
  - name: b3_ch10c_joking
    texts:
      - source: scene_text
        paragraph: 24
        text: |-
          "Sí, sólo está bromeando. No te preocupes por eso".

          "¡No estoy bromeando!" Flower grita. "¡Realmente tengo treinta años!"

          Luego, sus ojos se vuelven de un azul brillante cuando Illuna comienza a hablar.

          "Pensé que todos habíamos acordado que ya no nos burlaríamos de la edad de Flower", dice Illuna, mientras me mira con el ceño fruncido. "Si mientras tanto cambias de opinión, te pido cortésmente que regurgites el trozo de pastel que comiste en el trigésimo cumpleaños de Flower y lo devuelvas".

          "Ejem..." digo. "Tienes razón. Lo siento."

          "¿Qué pasó hace un momento?" Diane dice. "¡Los ojos de la niña se volvieron azules de repente y habló en un tono completamente diferente!"

          "Oh, esa era la banshee con la que actualmente comparte cuerpo", digo. "Su nombre es Illuna. Sus dos almas se fusionaron hace veinte años, por lo que el cuerpo de Flower no ha envejecido en absoluto desde entonces. Ahora ambos viven dentro de la misma mente en el Plano Etéreo, donde comen galletas y beben té todos los días".

          "Un alma en pena..." dice Diane. "Supongo que eso explicaría por qué su aura se sentía tan diferente, pero ¿compartir el mismo cuerpo e incluso vivir dentro de la misma mente?... Nunca hubiera pensado que tal cosa sería posible..."

          "Entonces, umm, lamento interrumpir", dice Hadrik, "pero ¿es aquí desde donde se supone que debemos ser teletransportados o tenemos que ir a otro lugar?"
      - source: scene_text_2
        paragraph: 14
        text: |-
          "Necesitamos ir a otro lugar, pero no está lejos de aquí", dice Diane. "¡Vamos, te lo mostraré!"

          "Diane, ¡hay tantas cosas de las que quiero hablarte!" Kate dice, mientras caminamos con Diane hacia el área teletransportación. "Tantas cosas que no sabes. ¡He encontrado Leila! ¡Hemos estado viajando juntos!"

          "¿Leila?..." dice Diane, luciendo como si le estuviera costando recordar quién era. "Oh, la chica muda de cabello plateado que escapó con el cuidador. ¿Aún estaba viva? ¡Bien por ella!"

          "Ahora tiene una manera de hablar", dice Kate. "Ella usa un dispositivo que lee sus pensamientos y los pone en letras flotantes, formando palabras, para que todos podamos leerlas. Nos hicimos muy buenos amigos. Me aseguraré de presentártela algún día. ¡Estoy seguro de que la amarás!"

          "Estoy seguro de que lo haré", dice Diane.

          De camino a nuestro destino, Kate continúa hablando con Diane durante unos minutos más, durante los cuales intenta resumir lo más que pueda sobre lo que ha hecho desde que fue expulsada de Varathia, y sobre lo que nos ha sucedido durante el torneo.

          Cuando llegamos al punto de teletransportación, Diane agarra su transceptor y llama a la persona encargada de manejar el dispositivo de teletransportación. Una vez que terminan con su conversación, Diane nos pregunta por última vez si estamos de acuerdo con esto, y luego le da al Lessathi la señal para transportarnos a su guarida.
      - source: scene_3
        paragraph: 11
        text: |-
          La teletransportación ocurre de manera similar a como nos estaban acostumbrados los rebeldes de Ollendor. Primero estamos envueltos por la habitual luz blanca brillante mientras nuestros cuerpos vibran fuertemente, luego nos encontramos en una caverna junto a un dispositivo teletransportador que parece casi idéntico al de Ollendor, excepto que es un poco más grande. El Lessathi que opera el dispositivo actualmente nos observa atentamente desde detrás del panel de control del teletransportador, y lleva una túnica azul oscuro, al igual que todos los demás miembros de su raza que no son parias como Leila y su padre.

          Cuando me doy la vuelta, veo que Meridith también nos estaba esperando en la sala de teletransporte. La reconocí de inmediato, porque ya vi una versión once años más joven de ella durante el ritual de Kate. Su cabello castaño ahora era un poco más corto de lo que solía ser, y su túnica azul tenía más adornos, probablemente para reflejar con precisión su rango más alto, pero sus ojos verdes parecían tan decididos como cuando todavía tenía treinta y tantos años.

          Tan pronto como nos ve, se acerca y luego se detiene para mirar detenidamente a Kate antes de hablar.

          "¿Supongo que debes ser Kate?" Meridith le pregunta.

          "Sí, ese sería yo", dice Kate.

          "Ya veo..." dice Meridith, y luego suspira profundamente.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch10c_scepter
