  - name: b3_ch10c_revenant4
    texts:
      - source: scene_text
        paragraph: 16
        text: |-
          Justo cuando Eiden se prepara para usar su técnica de manipulación del aura nuevamente, Revenant desaparece repentinamente y parece que su presencia ya no se puede sentir en ningún lugar cercano.

          "Ella escapó", dice Eiden, en tono decepcionado. "Qué aburrido."

          Luego sonríe, se mete las manos en los bolsillos y nos lanza una última mirada con los ojos cerrados antes de marcharse.

          "¡Despedida!" dice, mientras se teletransporta.

          "Arraka, solo para estar seguros, en realidad se teletransportó, ¿verdad?" digo. "¿No se esconde simplemente de forma invisible en algún lugar cercano?"

          "No, se ha ido", dice Arraka. "Probablemente ya sepa que no tendría sentido hacer algo así mientras yo esté cerca".
      - source: scene_text_2
        paragraph: 9
        text: |-
          "Está bien, ¿alguien más piensa que la sincronización del Revenant fue demasiado perfecta?" Daren dice. "Necesitaba amenazar a Eiden tomando a Flower como rehén, y de alguna manera llegó aquí exactamente cuando Eiden nos estaba visitando".

          "El Dios de la Muerte probablemente tenga una manera de monitorear la actividad en toda la isla, como Eiden", dice Illuna. "Es eso, o están rastreando a nuestro grupo, específicamente. Recuerda que el zorro dorado también intentó hacer algo similar con nosotros, antes de que Eiden cancelara su hechizo".

          "Nadie te está rastreando", dice Arraka. "La única razón por la que no te dije que estabas siendo rastreado por el zorro dorado fue porque realmente no me importó lo suficiente como para advertirte sobre ello en ese momento. Ese ya no es el caso. Lo último que querría es que uno de los dioses estuviera escuchando nuestras conversaciones cuando planeamos matarlos".
      - source: scene_3
        paragraph: 7
        text: |-
          "Correcto", dice Illuna. "Para ser honesto, lo que encuentro más desconcertante que el hecho de que puedan rastrear nuestros movimientos es que sabían de alguna promesa que Eiden le hizo al zorro de no matar a Flower, aunque no sabíamos nada al respecto. ¿Cómo exactamente llegas a esa información?"

          "Algunos de los dioses probablemente estén vigilando a Eiden", dice Arraka. "Debe haber tenido al menos algunos encontronazos con seguidores de varios dioses en los últimos seiscientos años, por lo que sería imposible para ellos no saber de su existencia. Es natural que quieran mantenerlo al menos un poco bajo vigilancia, considerando lo poderoso que es".

          "Sí..." dice Illuna. "Esperemos que eso sea todo".
