        texts:
          - source: scene_text
            paragraph: 41
            text: |-
              "¡Aha-Ahahahahahahaha!" Arraka se ríe muy fuerte. "Eso es todo. Eso es exactamente. 'Fuente de todo'. Esas fueron las tres palabras que he estado evitando decir todo este tiempo, porque habrían divulgado la verdadera naturaleza del Magium. Y como ustedes dos todavía están aquí y no han sido borrados de delante de nuestros ojos, entonces esto confirma que deberíamos poder hablar libremente de este tema de ahora en adelante, siempre y cuando no estemos parados justo al lado de un nodo Magium y mientras No estás en medio de uno de los rituales de Selkram. Aun así, no puedo creer que te haya tomado TANTO tiempo para darte cuenta".

              "Me cuesta un poco comprender el comportamiento de estos fragmentos Magium", dice Daren. "Entiendo por qué no nos están atacando ahora, porque estamos fuera de su alcance, pero si uno de sus propósitos principales es evitar que la gente descubra cuál es la verdadera naturaleza de Magium, entonces ¿por qué se te permitió irte antes? ¿No debería el fragmento haber terminado el trabajo de borrarte, considerando que ya casi regalaste las tres palabras una vez antes mientras estabas en el propio patio trasero de Magium?"
          - source: scene_text_2
            paragraph: 27
            text: |-
              "He mencionado esto antes, pero no todos los fragmentos Magium son iguales", dice Arraka. "Por lo general, cada fragmento individual tiene su propio objetivo singular, y solo se enfoca en eso, mientras ignora todo lo demás. El objetivo de este fragmento parece ser garantizar que la profecía del Tejedora del tiempo no se cumpla. Dado que no puede involucrarse directamente en un mundo sin 'deshacerlo de sus costuras' como intentó hacer el fragmento que posee al Supervisor, el fragmento con el que hablamos está tratando de guiar a las personas de este mundo para que cumplan sus órdenes. Por otro lado, el fragmento que intentó borrarme durante el ritual de Selkram era probablemente una entidad diferente cuyo único propósito era lidiar con cualquiera que intentara revelar la verdadera naturaleza de Magium, mientras se encontraba en las inmediaciones de Magium".

              "Entonces, ¿el fragmento con el que hablamos no sabe que estabas tratando de revelar la naturaleza del Magium?" Hadrik pregunta.

              "Teniendo en cuenta que los fragmentos no suelen comunicarse entre sí, la respuesta probablemente sea 'no'", dice Arraka. "Lo que significa que la única razón por la que intentó enviarnos al vacío fue porque quería castigarnos por no hacer ningún esfuerzo para lidiar con la profecía. Este ya es el tercer fragmento Magium que hemos encontrado que intentó terminar con nuestra existencia de una forma u otra. Llámame loco, pero estoy empezando a pensar que nuestras vidas individuales no tienen mucho valor para ellos".

              "El fragmento lo dice por sí mismo", dice Daren. "A veces es necesario un solo sacrificio para salvar muchas vidas. En otras palabras, mientras solo seamos unos pocos los que muramos, me importa un comino".
          - source: scene_3
            paragraph: 22
            text: |-
              "Sí", dice Arraka, "y mientras se encontrara mi copia del pasado, al otro fragmento no le habría importado si destruyera todo nuestro mundo en el proceso. A estas alturas está bastante claro que estos fragmentos acabarán con cualquiera que se interponga en el camino de sus objetivos, por lo que el mejor curso de acción probablemente sea evitar el contacto con ellos tanto como sea posible".

              "Parece que la sala de reuniones de la que nos habló Meridith es la que está allí", dice Kate, mientras señala una puerta al final del túnel. "¿Deberíamos entrar?"

              "Creo que antes de entrar a la sala de reuniones, deberíamos decidir si queremos contarle a Meridith lo que nos dijo el Magium o no", dice Daren, en voz baja.

              "¿Quieres decir que él insinúa fuertemente que deberías matar a Eiden?" Melindra dice. "No estás considerando seriamente hacer eso, ¿verdad? ¡Él te va a destruir!"

              "En este momento sólo estamos discutiendo si debemos mencionar este detalle a Meridith o no", dice Daren. "Una vez que escuchemos su versión de la historia, podremos tomar una decisión más informada, pero tal vez sería mejor dejar que ella saque el tema por su cuenta. ¿Qué piensan ustedes?"
