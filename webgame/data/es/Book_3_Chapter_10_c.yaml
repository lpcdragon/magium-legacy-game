            paragraph: 15
            text: |-
              "Si no le quitas ese cuchillo del cuello ahora mismo, te vas a arrepentir", le digo al Revenant, en tono amenazador.

              "¡Tus amenazas no significan nada para mí!" dice el Revenant, pareciendo como si mis palabras realmente la ayudaran a reunir su determinación en lugar de intimidarla. "La voluntad del Dios de la Muerte es absoluta. Si esta chica va a morir por eso, entonces es un sacrificio necesario para--"

              Antes de que pueda terminar su frase, un látigo de agua azota al Revenant por detrás y se enrolla alrededor de la muñeca del brazo que sostiene el cuchillo, tirando de él hacia atrás. Aprovechando esta oportunidad que le brindó Illuna, Flower se agacha debajo de los brazos de su captor y ella se aleja corriendo de ella. Luego inmediatamente salta y se impulsa hacia el cielo con chorros de fuego que salen de sus pies, de modo que el Revenant ya no puede alcanzarla.
