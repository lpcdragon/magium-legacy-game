            paragraph: 34
            text: |-
              Después de pensarlo detenidamente, decido que es mejor no decirle a Meridith la verdadera causa del extraño comportamiento de los cristales. Es mejor no darle más información de la necesaria hasta que sepa exactamente cuánto se puede confiar en ella.

              "¿Soy solo yo, o no hemos visto ni un solo Lessathi desde que salimos de la sala de teletransporte?" pregunta Kate, mientras continuamos caminando por la caverna subterránea brillantemente iluminada.

