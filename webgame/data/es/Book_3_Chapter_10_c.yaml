  - name: b3_ch10c_secret
    texts:
      - source: scene_text
        paragraph: 27
        text: |-
          "Todos los amigos de Diane son amigos míos, incluido tú, Illuna del masacre de los bosques sagrados", dice Meridith, mientras el resto de nosotros intercambiamos algunas miradas, cuando nos damos cuenta de que ella debe haber estado consciente de la identidad de Flower desde el principio. "Tengo una gran deuda con Diane después de toda la ayuda que ella me ha brindado en estos últimos diez años desde que se cerró Faro de Esperanza. Por lo tanto, tengo la intención de pagarle esa deuda en pequeñas cuotas cada vez que tenga la oportunidad. Si hay algo que necesite... cualquier cosa, no dude en preguntarme y haré todo lo posible para satisfacer sus deseos".

          "No recuerdo haberme presentado", dice Illuna. "¿Podría ser tan atrevido como para preguntarte cómo supiste mi nombre?"

          "Soy el líder de los Lessathi", dice Meridith. "Una de mis principales prioridades es saber lo más posible sobre lo que sucede en Varathia. Ustedes dos se han hecho un gran nombre en los últimos veinte años, y también se rumorea que cuentan con la protección del zorro dorado. Es natural que al menos sepa quién es usted".

          "Es justo", dice Illuna.

          Meridith ahora golpea una de las seredium paredes varias veces con una pequeña varilla de metal y se abre una puerta secreta que nos permite entrar a un túnel oculto.
      - source: scene_text_2
        paragraph: 16
        text: |-
          "Mencionaste antes que podíamos pedir lo que quisiéramos", digo, mientras entramos al túnel y la puerta se cierra detrás de nosotros. "¿Esto incluye información clasificada? Porque existe un código secreto que se supone que desbloquea las estadísticas mágicas de mi dispositivo de estadísticas, pero por lo que entendí, solo se supone que los Lessathi de mayor rango tienen conocimiento de ello".

          "Sé el código que estás buscando, pero creo que te han engañado un poco", dice Meridith, mientras continuamos caminando por el pasillo semiiluminado. "Las estadísticas mágicas no funcionan para Lessathi regulares. Solo funcionan para Medio lessathi. Esa es en realidad la razón principal por la que las dos estadísticas estaban incluso bloqueadas, ya que Medio lessathi eran vistos como inferiores y no se les podía permitir ejercer tal poder. Mi conjetura es que estas estadísticas no se han eliminado por completo de los dispositivos porque los Lessathi de hace seiscientos o setecientos años que los crearon probablemente todavía esperaban encontrar una manera de solucionar este problema, hasta el momento en que estaban casi todos aniquilado durante el quieto invierno. En cualquier caso, incluso si desbloqueo estas estadísticas para ti, no podrás usarlas".

          "En realidad, soy un Medio lessathi, no uno normal", digo. "Ya probé esas estadísticas durante el modo de emergencia, así que sé que funcionan para mí".

          "¿Eres un Medio lessathi?..." dice Meridith. "No, eso no puede ser correcto. Las relaciones románticas entre Lessathi y humanos están estrictamente prohibidas en nuestra comunidad. Y además, si viniste aquí como participante del torneo, debe significar que vivías en algún lugar fuera de Varathia. Esto significa que tú o tus padres debieron tener de alguna manera--"
      - source: scene_3
        paragraph: 13
        text: |-
          Meridith de repente se detiene en seco y se da vuelta para mirarme, examinándome de pies a cabeza.

          "¿Puedo preguntar cuál es tu edad?" Meridith me pregunta, después de una larga pausa. "No pareces tener más de treinta años".

          "Sí, tengo veintiocho años", le respondo.

          "Veintiocho años..." dice Meridith, mientras parece estar haciendo algunos cálculos dentro de su cabeza. "Ese es exactamente el tiempo que ha pasado desde--"

          Ella hace una pausa.

          "¡No, no puede ser!" Meridith continúa. "Pero ¿y si--"

          Ahora usa la varilla hecha de metal de antes para golpear su hombro izquierdo una vez, y luego golpea ligeramente mi hombro también. Al poco de entrar en contacto conmigo, la punta de la varilla comienza a brillar con una luz verde brillante, mientras Meridith simplemente la mira fijamente, en completo silencio.

          "Nuestras auras coinciden..." dice Meridith, mientras todavía parece estar recuperándose del impacto de lo que acaba de ver.

          "¿Y eso qué significa?" Le pregunto.

          "Significa que estamos relacionados por sangre", dice Meridith.
