            paragraph: 43
            text: |-
              Tiene que haber algún lugar que me he perdido. Algún lugar donde pueda sentarme tranquilamente durante veinte segundos para poder terminar de colocar mis pilares en el Plano Etéreo.

              Empiezo a ganar algo de altitud, para poder tener una mejor vista de la zona donde están los Gólems. Mientras hago esto, dos de los Gólems me disparan sus rayos, pero yo estaba listo para ellos y esquivé sus ataques fácilmente. Ahora bien... déjame echar un buen vistazo a tu alrededor. ¿Cuál sería el mejor lugar para posicionarme?

              Mientras sigo volando, tratando de descubrir qué es lo que me estoy perdiendo, los Gólems comienzan a atacarme de nuevo y me veo obligado a alejarme de sus rayos. Desafortunadamente, lo que no me di cuenta fue que los dos primeros rayos solo estaban destinados a llevarme a una trampa, porque los otros dos Gólems anticiparon exactamente en qué dirección esquivaría y me incineraron antes de que pudiera tener la oportunidad de entender lo que estaban haciendo.
