              "Chicos, lamento mucho no haber podido regresar aquí antes", dice Flower. "Tuve un dolor de cabeza realmente desagradable porque me teletransporté demasiadas veces seguidas a grandes distancias y me preocupaba arruinar tu pelea. ¡Ni siquiera imaginé que los derrotarías tan rápido! ¿Cómo lo hiciste?"
