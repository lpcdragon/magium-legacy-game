            paragraph: 44
            text: |-
              Tiene que haber algún lugar que me he perdido. Algún lugar donde pueda sentarme tranquilamente durante veinte segundos para poder terminar de colocar mis pilares en el Plano Etéreo.

              Empiezo a ganar algo de altitud, para poder tener una mejor vista de la zona donde están los Gólems. Mientras hago esto, dos de los Gólems me disparan sus rayos, pero yo estaba listo para ellos y esquivé sus ataques fácilmente. Ahora bien... déjame echar un buen vistazo a tu alrededor. ¿Cuál sería el mejor lugar para posicionarme?

              Cuando tengo una buena vista aérea de toda el área debajo de mí, finalmente logro encontrar lo que estaba buscando. Hay exactamente un lugar que debería protegerme temporalmente de todos los Gólems al mismo tiempo, y ese es el centro de ellos. Siempre que me ubique correctamente, debería estar ubicado justo entre dos pares separados de Gólems, y a una distancia suficiente de ellos para que no puedan caminar instantáneamente hacia mí y atacarme con sus manos.

              Esto es perfecto. Me dirijo hacia allí ahora mismo.

              Los Gólems intentan dispararme un par de veces antes de que llegue a una menor altitud, pero tan pronto como me coloco en el lugar correcto, todos dejan de hacer lo que estaban haciendo y ahora solo me miran confundidos.
