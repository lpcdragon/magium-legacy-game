  - name: b3_ch09c_maintenance
    effects:
      - set:
          ac_b3_ch9_trinkets: 1
        achievement:
          id: ac_b3_ch9_trinkets
          title: No hacen falta baratijas
        condition: b3_ch9_currents = 0 AND b3_ch9_cover = 1
    routes:
      - condition: b3_ch9_hadrik = 0
        texts:
          - source: scene_text
            paragraph: 45
            text: |-
              "¿Cómo supe qué?" digo.

              "Que la hidra estaba a punto de golpearnos con un ataque sónico", me responde Peter. "¿Cómo lo descubriste?"

              "Oh, no lo sabía con seguridad", digo. "Fue solo una corazonada. Mira, la cosa es que he estado observando de cerca las cabezas marrones de la hidra desde que mencionaste que no tendría ningún sentido que respiraran rocas, y la verdad es que no las vi haciendo ningún tipo de ataque elemental durante toda la batalla. Sin embargo, lo que sí noté fue que estas cabezas en particular eran las únicas que siempre estaban en silencio mientras las otras cabezas rugían o gritaban. Entonces, eso me hizo pensar... ¿y si estas cabezas en realidad no tuvieran ningún poder elemental? ¿Y si su único poder fuera su rugido y lo hubieran estado guardando para una ocasión especial todo este tiempo? ¿Y qué mejor manera podría haber de usar su arma definitiva que como último recurso, cuando estaban seguras de que estaban a punto de ser asesinadas?"

              "Huh..." dice Peter, mientras mira contemplativamente la estatua de piedra de la hidra, y luego a mí. "Sabes... Quizás me equivoqué contigo. Quizás no seas el fraude que pensé que eras. Quizás... ¡eres un generalista después de todo!"

              "El protocolo Supervisor te felicita por completar el segundo procedimiento experimental", dice el dron de ojos verdes. "Desafortunadamente, según mis cálculos, sus posibilidades de sobrevivir al tercer procedimiento experimental son muy escasas. Sin embargo, continuaremos pidiendo su cooperación hasta..."
          - source: scene_text_2
            paragraph: 35
            text: |-
              "¡Advertencia!" El Supervisor comienza a decir de repente con una voz monótona, similar a la de los drones de ojos rojos. "El núcleo está bajo ataque. El núcleo se encuentra ahora en un estado crítico. Se solicita inmediatamente a todo el personal a cargo del mantenimiento que--"

              "¿Qué has hecho?" Nos pregunta ahora el Supervisor, con su voz habitual, más expresiva. "¿No te das cuenta de las consecuencias..."

              Una vez más el Supervisor es interrumpido, y cuando comienza a hablar nuevamente, su voz sigue cambiando de tonalidad de una manera muy antinatural.

              "Esto no ha terminado..." dice el Supervisor, mientras comienza a teletransportar alejarse de nosotros, mientras una luz brillante lo envuelve. "Puede que hayas destruido el núcleo, pero todavía tengo los cristales. Y los cristales... son lo único que no puedes permitirte el lujo de destruir... Nos... encontraremos de nuevo..."

              "¡Maldita sea, se está escapando!" Digo, mientras lanzo un hechizo de relámpago al dron de ojos verdes, pero mi ataque no llega a alcanzarlo antes de que desaparezca. "¿Adónde crees que fue? ¿De regreso a su santuario?"

              "Lo más probable es que sí", dice rey del subsuelo. "Pero no importa. Mira lo que está sucediendo en el plano terrestre. Los drones están cayendo como moscas del cielo. Los gigantes Gólems han caído al suelo. El Supervisor ha perdido todo control sobre sus secuaces. Ya no es una amenaza para nosotros".
          - source: scene_3
            paragraph: 23
            text: |-
              "¿En realidad?" Le pregunto al rey, mientras empiezo a controlar mi cuerpo desde el plano terrestre como un títere para hacerlo volar de regreso a la plaza, mientras le hago una señal a Daren para que me siga. "¿No estás preocupado en absoluto por esa siniestra advertencia que nos dio antes de desaparecer? ¿Ni siquiera un poquito?"

              "¿Preocupado por qué?" el rey del subsuelo dice. "¿Acerca de las amenazas vacías de una máquina moribunda? Incluso si de alguna manera logra permanecer con vida después de perder su núcleo, será solo una sombra de lo que era antes. Sin un ejército, el Supervisor es solo otro dron. Y has visto lo que puedo hacer con los drones".

              De repente, escuchamos a Flower teletransportarse hacia nosotros y luego vemos la sorpresa en su rostro, mientras mira la hidra de piedra y el lugar donde solía estar el dron de ojos verdes del Supervisor.

              "Chicos, lo siento, no he llegado a teletransportar a todos todavía", dice Flower, "pero tenía que volver aquí y confirmar que lo que estaba captando con mi sentido mágico era real... ¿Realmente lograron vencer tanto a la hidra como al Supervisor mientras yo estaba fuera? ¡Eso es increíble! ¿Cómo lo hicieron?"
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch09c_indebted
      - condition: b3_ch9_hadrik = 1
