            paragraph: 21
            text: |-
              Mientras estoy ocupado colocando los pilares en el Plano Etéreo, también me aseguro de parpadear de vez en cuando, para poder cambiar mi perspectiva al plano terrestre y posicionarme en un lugar donde el Gólems no pueda dispararme sin correr el riesgo de destruirme entre sí. Después de cambiar mi ubicación varias veces, de repente me doy cuenta de que es posible que me haya quedado sin lugares donde esconderme de los cuatro Gólems y que podría verme obligado a esquivar todos sus ataques muy pronto.

              Justo cuando me estaba preparando para enfrentarme a los gigantes de metal en combate abierto, veo a Daren corriendo hacia mí, con su escudo y espada listos.

              "Barry, ¡por aquí!" Daren dice. "¡Ven y cúbrete detrás de mi escudo!"
        choices:
