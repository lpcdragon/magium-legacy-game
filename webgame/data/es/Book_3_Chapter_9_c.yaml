  - name: b3_ch09c_ending
    texts:
      - source: scene_text
        paragraph: 53
        text: |-
          Pasamos los siguientes minutos escuchando la historia de Hadrik sobre cómo rompió las defensas del Supervisor y destruyó su núcleo. Mientras tanto, el resto de nuestros amigos van despertando uno a uno y uniéndose a nosotros, hasta que Flower finalmente logra guiar a todas las almas de nuestro grupo a sus santuarios.

          Una vez que estemos todos reunidos y Hadrik termine de contar su historia, Illuna también se une a nosotros y ahora nos estamos preparando para ser teletransportados de regreso al subsuelo.

          Mientras Peter habla con Breynan en el transceptor, dándole una actualización sobre nuestra situación actual, siento un mareo repentino y por una fracción de segundo siento como si mi conciencia se alejara nuevamente hacia el Plano Etéreo, donde tengo una vista directa del interior de mi cubo vacío que se supone que es mi santuario. ¿Qué acaba de pasar? ¿Realmente volví a mi perspectiva desde Plano Etéreo por un segundo o simplemente estoy imaginando cosas?

          "¿Estás bien, Barry?" Hadrik dice, cuando me ve congelado en el lugar al final del grupo y sudando intensamente.

          "¿No sentiste nada en este momento?" Le pregunto a Hadrik, mientras intento calmarme.

          "¿Qué quieres decir?" Hadrik pregunta. "¿Qué se suponía que debía sentir?"

          "...Nada", le digo. "Estoy seguro de que no fue nada. Deberíamos... probablemente acercarnos un poco más al resto del grupo. Hará que sea más fácil para Breynan teletransportar nosotros".
      - source: scene_text_2
        paragraph: 43
        text: |-
          Mientras Hadrik asiente y luego camina un poco más cerca de los demás, me quedo allí en el lugar por unos segundos más, contemplando lo que acaba de suceder.

          Una casualidad. Tiene que haber sido una casualidad. Hadrik no experimentó nada inusual, por lo que el Supervisor no volverá a atacarnos. Incluso si lo que vi fuera real, claramente estaba sentado dentro de mi santuario, así que no debería haber nada de qué preocuparse. No me van a echar al éter otra vez.

          Después de la breve pausa, decido que no tiene sentido insistir más en esto y sigo Hadrik también para prepararme para nuestro teletransportación.

          "Todo está bien", me digo a mí mismo, mientras nuestros cuerpos comienzan a vibrar fuertemente y la habitual luz brillante teletransportación nos envuelve a todos.

          No hay nada de qué preocuparse. Mi conciencia solo fue enviada de regreso al Plano Etéreo una vez, y solo por un segundo. Probablemente fue sólo un pequeño efecto secundario debido a la exposición prolongada de mi alma al éter. Probablemente olvidaré todo esto en poco tiempo y el evento nunca se repetirá.

          Todo está bien.
