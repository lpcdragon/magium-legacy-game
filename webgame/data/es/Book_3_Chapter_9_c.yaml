            paragraph: 11
            text: |-
              Poco después de dejar de hablar, empiezo a sentir una de las sensaciones más inquietantes y difíciles de describir que he experimentado en mi vida. La sensación que tengo es como si mi conciencia fuera empujada repetidamente a través de un túnel, de un lado a otro, y parece que no puede decidir en qué extremo del túnel está su destino.

              Mientras esto sucede, me encuentro por un segundo acostado boca abajo en un charco en una calle, durante una tormenta, y durante el segundo siguiente estoy de regreso aquí en el Plano Etéreo, flotando en medio del mar de luz. Después de ser arrojado entre la tierra y Plano Etéreo unas cuantas veces más, puedo sentir toda la luz a mi alrededor conectándose directamente a mi mente, y luego empiezo a escuchar algunos pensamientos muy claros en mi cabeza, como si fueran míos, aunque estoy seguro de que no soy yo quien los piensa.

              "Éste no es el lugar para resolver tu conflicto", dice la voz en mi cabeza. "Regresad a vuestros santuarios ahora y no perturbéis más estos lugares de descanso".

              "Peter, ¿escuchaste eso también?" dice el rey del subsuelo, ya que todos estamos temporalmente congelados en el lugar, sin saber qué hacer. "¿Quién nos contactó hace un momento? ¿Fue el éter?"

              "No estoy... seguro..." dice Peter, mientras mira hacia el rey, con una mirada algo temerosa en sus ojos.
        choices:
