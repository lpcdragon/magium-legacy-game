  - name: b3_ch09c_frantically
    routes:
      - condition: b3_ch9_hydra = 0
        texts:
          - source: scene_text
            paragraph: 24
            text: |-
              "Si no te importa, me gustaría empezar cortándole todas las cabezas", digo.

              "Espera un minuto", dice Peter. "¿No se supone que a una hidra le vuelven a crecer dos cabezas después de cortar una de ellas?"

              "Oh, no, en realidad eso es sólo una idea errónea", digo. "Nosotros también lo pensamos hasta que nos encontramos con una hidra real en una de las ruinas subterráneas de Varathia y vimos que es solo un monstruo con poderes regenerativos muy altos. La razón por la que necesitas cortarle todas las cabezas a la vez es porque puede volver a crecerlas apenas unos segundos después de cortarlas, por lo que la pelea nunca terminará".

              Hago una pausa de unos segundos antes de continuar.

              "Desafortunadamente, me acabo de dar cuenta de que realmente no tengo un hechizo en mi repertorio que pueda ayudarme a cortar todas las cabezas a la vez", digo. "La mayoría de mis ataques poderosos son hechizos de fuego que aprendí de Flower, y como ya te habrás dado cuenta, el fuego no es exactamente el mejor elemento para usar si quieres cortar cosas. ¿Tal vez podrías echarme una mano, Peter?"

              "Si crees que voy a arriesgarme a cortarle la cabeza a una hidra basándose únicamente en tu evidencia anecdótica, entonces estás loco", dice Peter. "Quemarlo con fuego es obviamente nuestra apuesta más segura. Voy a lanzarle una bola de fuego. Siéntete libre de unirte a mí si quieres".
          - source: scene_text_2
            paragraph: 15
            text: |-
              Mientras Peter lanza su bola de fuego a la hidra, Flower envuelve al monstruo en una gran columna de fuego y yo decido hacer lo mismo, usando uno de los hechizos más fuertes que me enseñó Flower. La hidra voladora comienza a gritar de dolor con la mayoría de sus cabezas, pero luego se teletransporta instantáneamente justo en frente de Flower, lanzándose hacia ella con dos de sus cuellos de Serpiente. Apenas logra alejarse usando sus chorros de fuego, pero la hidra se acerca nuevamente a ella usando sus inmensas alas para impulsarse hacia adelante.

              "El protocolo Supervisor olvidó mencionar que esta hidra en particular representa el pináculo de la evolución de todas las especies de hidras que han existido y existirán", dice el dron de ojos verdes. "A lo largo del tiempo, este monstruo ha desarrollado una resistencia muy alta al fuego, ha evolucionado hasta un punto en el que tiene múltiples corazones en lugar de solo uno, e incluso si le cortas todas las cabezas, simplemente volverá a crecer el doble que antes. Permíteme demostrarte".

              De repente, de la nada, una hoja giratoria muy larga viene volando directamente hacia la hidra mientras todavía estaba persiguiendo a Flower, y corta todos sus largos cuellos con facilidad. Mientras la hoja deja de girar lentamente y luego desaparece en el aire, los cuellos con forma de Serpiente se retuercen sin rumbo fijo durante unos segundos, y luego cada uno se divide en dos a medida que vuelven a crecer rápidamente, creando dos cabezas por cada una que ha sido cortada.

              "Ah, mierda..." digo, mientras la hidra ahora gira frenéticamente sus catorce cabezas, tratando de descubrir cuál de nosotros la atacó.
          - source: scene_3
            paragraph: 11
            text: |-
              Poco después de dejar de hablar, empiezo a sentir una de las sensaciones más inquietantes y difíciles de describir que he experimentado en mi vida. La sensación que tengo es como si mi conciencia fuera empujada repetidamente a través de un túnel, de un lado a otro, y parece que no puede decidir en qué extremo del túnel está su destino.

              Mientras esto sucede, me encuentro por un segundo acostado boca abajo en un charco en una calle, durante una tormenta, y durante el segundo siguiente estoy de regreso aquí en el Plano Etéreo, flotando en medio del mar de luz. Después de ser arrojado entre la tierra y Plano Etéreo unas cuantas veces más, puedo sentir toda la luz a mi alrededor conectándose directamente a mi mente, y luego empiezo a escuchar algunos pensamientos muy claros en mi cabeza, como si fueran míos, aunque estoy seguro de que no soy yo quien los piensa.

              "Éste no es el lugar para resolver tu conflicto", dice la voz en mi cabeza. "Regresad a vuestros santuarios ahora y no perturbéis más estos lugares de descanso".

              "Peter, ¿escuchaste eso también?" dice el rey del subsuelo, ya que todos estamos temporalmente congelados en el lugar, sin saber qué hacer. "¿Quién nos contactó hace un momento? ¿Fue el éter?"

              "No estoy... seguro..." dice Peter, mientras mira hacia el rey, con una mirada algo temerosa en sus ojos.
        choices:
