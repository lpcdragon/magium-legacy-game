          title: Premio de consolación
scenes:
  - name: b3_ch09c_teaming
    texts:
      - source: scene_text
        paragraph: 2
        text: |-
          "No creo que hacer equipo con el rey o Peter sea una buena idea", digo. "Probablemente ambos serán más débiles aquí que en el plano terrestre, y acabaremos teniendo que defenderlos durante toda la batalla. Estaríamos mejor solos".

          "Bueno, si tú lo dices, Barry..." dice Flower. "Muy bien, entonces nos teletransportaré directamente al Supervisor. ¿Estás listo?"

          "Sí", digo, y luego ambos quedamos envueltos por la luz brillante habitual que aparece cuando te teletransportan.

          "¡Aquí estamos!" Flower dice, una vez que lleguemos a nuestro destino.

          Cuando miro a mi alrededor, veo que ahora estamos en algún lugar del mar de luz llamado éter, con el dron de ojos verdes del Supervisor flotando a unas seis docenas de pies de distancia de nosotros.

          "Procesando. Procesando..." dice el Supervisor. "El protocolo Supervisor le agradece por ahorrarle el esfuerzo de buscarlo. ¿Podría indicarnos el propósito de su visita para que pueda calcular mis próximas acciones en consecuencia?"
      - source: scene_text_2
        paragraph: 2
        text: |-
          "¿No se suponía que debías ser muy inteligente?" Le pregunto al supervisor. "Deberías poder descubrir la razón por la que vinimos aquí sin que te lo digamos".

          "A juzgar por tu respuesta, el protocolo del Supervisor supone que no has cambiado tu punto de vista y que todavía no estás dispuesto a ayudarme en mi batalla contra los rebeldes", dice el Supervisor. "¿Es eso correcto?"

          "¿Qué te parece esto como respuesta a tu pregunta?" Le digo, mientras me pongo en una postura especial y hago algunos movimientos muy rápidos con las manos mientras imagino la energía mágica acumulándose en las yemas de mis dedos.

          Antes de que el Supervisor tenga tiempo de decir algo más, lo señalo con el dedo y un rayo sale disparado, directo a su ojo verde. El rayo parece golpear al dron al principio, pero luego me doy cuenta de que lo único que hice fue rozar ligeramente el escudo invisible que probablemente ya había lanzado a su alrededor antes de que nos teletransportáramos aquí.

          Siguiendo mi ejemplo, Flower también comienza el ataque, golpeando al Supervisor con una andanada de bolas de fuego. Cuando las llamas de las explosiones se apagan, veo que el Supervisor había logrado crear una cúpula de piedra a su alrededor, que lo protegía por completo pero que ahora se está desmoronando rápidamente en pequeños pedazos de roca.
      - source: scene_3
        paragraph: 2
        text: |-
          "¡Advertencia!" dice el Supervisor. "El protocolo Supervisor ahora activará sus nuevos procedimientos experimentales, diseñados exclusivamente para Plano Etéreo. Tenga en cuenta que estos nuevos procedimientos se basan en el conocimiento de Magium y que, hasta la fecha, no se han probado en gran medida. Si tiene alguna queja con respecto a estos nuevos procedimientos, consulte la sección 5C-E789 del manual operativo de Supervisor".

          "¿Procedimientos experimentales?" Pregunto, confundido. "¿Qué diablos se supone que eso--"

          Antes de terminar mi frase, una poderosa onda de choque de energía negra es liberada por el dron del Supervisor, que nos alcanza en menos de un segundo y desintegra nuestros cuerpos casi inmediatamente después. Apenas tengo unos momentos para entender lo que está pasando antes de que pierdo todos mis sentidos y luego mi conciencia se desvanece por completo.
    choices:
      - position: 1
        text: Reiniciar juego
        effects:
          - set:
              current_scene: ch1_intro1
              storyboard_controls: Jump to frame "Chapter 1"
      - position: 2
        text: Cargar desde el último punto de control
        effects:
          - set:
              chapter_load: 1
              storyboard_controls: Jump to frame "Save load game"
      - position: 3
        text: Cargar partida
        effects:
          - set:
              storyboard_controls: Jump to frame "Save load game"
  - name: b3_ch09c_teleport
    routes:
      - condition: b3_ch9_conclusions = 2
        texts:
          - source: scene_text
            paragraph: 3
            text: |-
              "Está bien", digo. "Entonces vayamos primero a Peter. ¿Puedes teletransportar llevarnos allí ahora?"

              "¡Estoy en ello!" Flower dice, mientras ambos somos envueltos por una luz blanca brillante.

              "¿Qué estás haciendo aquí?" De repente escucho la voz de Peter, una vez que terminamos de teletransportarnos a nuestra nueva ubicación, en medio del éter.

              Cuando me giro para mirar hacia Peter, que estaba a unos tres metros de nosotros, veo que el rey del subsuelo también estaba allí, como dijo Flower, y ya había creado un cuerpo para sí mismo en el Plano Etéreo. Al verlos mejor a los dos, noto el hecho de que los ojos de Peter no brillan intensamente como los de Flower, lo que significa que no debe haber experimentado la misma evolución que le permitiría teletransportar a largas distancias y detectar almas en el Plano Etéreo sin importar dónde se encuentren.

              "Bueno, estábamos a punto de ir a tratar con el Supervisor y pensamos que tal vez quisieras unirte a nosotros", le digo a Peter. "¿Qué dices?"

              "¿Quieres que vayamos contigo después de que deliberadamente nos dijiste que tú y el Supervisor planeaban tendernos una emboscada?" Peter dice. "¿Por qué clase de tontos nos tomas?"

              "Vamos, Peter", digo. "Usa un poco tu cerebro. Eso fue obviamente una broma. ¿Cuál sería el punto de una emboscada si lo anunciara de antemano con tanta descaro?"
          - source: scene_text_2
            paragraph: 3
            text: |-
              "Dices que sólo estabas bromeando, pero ya sabemos que has estado contactando al Supervisor a través de los cristales azules mientras estábamos bajo tierra", dice el rey. "¿Quizás le gustaría arrojarnos algo de luz sobre cuál pudo haber sido su razón para comunicarse activamente con nuestro enemigo en secreto, justo antes de una batalla importante?"

              ¿Él sabe de nuestras conversaciones con el Supervisor? ¿Será que uno de sus hombres nos escuchó cuando hablábamos de ello en los túneles?

              "Mira, no voy a negar que el Supervisor nos dio la opción de unirnos a él, y que consideramos seriamente aceptar su oferta durante la mayor parte de la tarde, pero al final lo rechazamos", digo. "Y tampoco es como si te estuviera pidiendo que me creas sin pruebas. Piénsalo por un segundo. Si realmente quisiéramos tenderte una emboscada ahora, ¿no habría tenido más sentido ir a visitar al Supervisor primero y luego a teletransportar junto con él aquí? ¿Por qué arriesgarte a pasar por todas estas charadas, cuando habría muchas posibilidades de que no nos creyeras y nos atacaras en cuanto nos vieras?"

              "Mi principal conclusión de todo esto es que tú y tu equipo estaban a punto de traicionarnos, y de alguna manera decidiste no hacerlo, por capricho", dice el rey del subsuelo. "Si ese es realmente el caso, entonces ¿qué garantía tenemos de que no cambiarás de opinión en medio de nuestra batalla y cambiarás de bando nuevamente sin ningún motivo?"
          - source: scene_3
            paragraph: 3
            text: |-
              "¿No hay motivo?..." le digo al rey. "¡Estabas planeando asesinarnos, hombre! ¿Cómo es que no es una razón suficiente para considerar cambiar de bando? ¿Crees que no sabíamos de tus planes secretos? El Supervisor nos reprodujo una grabación en la que le dijiste a Albert que tratara con nosotros 'discretamente' si no estábamos de acuerdo con que fueras coronado como el nuevo rey de Ollendor. Si eso no es una admisión directa de traición, ¡entonces no sé qué lo es!"

              "Ah, creo que finalmente estoy empezando a entender lo que está pasando", dice el rey del subsuelo. "De hecho, si eso es lo que has escuchado, entonces no puedo culparte por tus acciones. Probablemente habría interpretado mis palabras de la misma manera que tú, si estuviera en tu lugar. Me doy cuenta de que a estas alturas no tendría sentido decirte que todo esto fue un malentendido, así que voy a dar un acto de fe y confiar en lo que dijiste acerca de rechazar la oferta del Supervisor. Con suerte, con todo esto dicho y hecho, finalmente podamos dejar este argumento atrás y centrarnos en la tarea más importante: planificar nuestro ataque contra nuestro enemigo común".
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch09c_invented
      - condition: b3_ch9_conclusions <> 2
        texts:
          - source: scene_text
            paragraph: 4
            text: |-
              "Está bien", digo. "Entonces vayamos primero a Peter. ¿Puedes teletransportar llevarnos allí ahora?"

              "¡Estoy en ello!" Flower dice, mientras ambos somos envueltos por una luz blanca brillante.

              "¿Qué estás haciendo aquí?" De repente escucho la voz de Peter, una vez que terminamos de teletransportarnos a nuestra nueva ubicación, en medio del éter.

              Cuando me giro para mirar hacia Peter, que estaba a unos tres metros de nosotros, veo que el rey del subsuelo también estaba allí, como dijo Flower, y ya había creado un cuerpo para sí mismo en el Plano Etéreo. Al verlos mejor a los dos, noto el hecho de que los ojos de Peter no brillan intensamente como los de Flower, lo que significa que no debe haber experimentado la misma evolución que le permitiría teletransportar a largas distancias y detectar almas en el Plano Etéreo sin importar dónde se encuentren.

              "Bueno, estábamos a punto de ir a tratar con el Supervisor y pensamos que tal vez quisieras unirte a nosotros", le digo a Peter. "¿Qué dices?"
          - source: scene_text_2
            paragraph: 4
            text: |-
              "En realidad, también nos dirigíamos hacia él", dice rey del subsuelo. "Le agradeceríamos que nos ayudara a transportarnos allí, porque Peter tiene solo una cantidad limitada de teletransportación hechizos que puede usar por día, y preferimos no desperdiciarlos a menos que sea absolutamente necesario".

              "Perfecto", digo. "¡Entonces te llevaremos allí ahora mismo!"

              "Espera un momento", dice el rey. "¿No crees que deberíamos planificar un poco nuestro ataque antes de atacar así?"
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch09c_invented
  - name: b3_ch09c_invented
    texts:
      - source: scene_text
        paragraph: 5
        text: |-
          "¿Planeando nuestro ataque?" digo. "Estaba asumiendo que simplemente le pasaríamos teletransportar y luego resolveríamos el resto cuando llegáramos allí. ¿Existe realmente un plan que hacer cuando ni siquiera conocemos todas las capacidades del Supervisor en este plano de existencia?"

          "No estaba diciendo que debiéramos anticipar cada movimiento del Supervisor", dice el rey del subsuelo, "pero al menos deberíamos saber qué puede hacer cada uno de nosotros antes de lanzarnos a la batalla. No queremos arriesgarnos a interponernos en el camino del otro por accidente incluso antes de comenzar a pelear, ¿verdad?"

          "Supongo que tienes razón", digo.

          "¿Quizás te importaría ir primero?" el rey del subsuelo dice. "Supongo que debe haber alguna razón especial por la cual eres tú quien acompaña a tu etéreo amigo y no a ninguno de los poderosos magos de tu grupo, ¿correcto?..."

          "Oh, sí", digo. "Resulta que ser un mago realmente no te ayuda a lanzar magia en este plano de existencia a menos que seas un etéreo o un ser del plano mágico. Yo, por otro lado, puedo lanzar una buena cantidad de hechizos en este plano, gracias a la gran cantidad de conocimiento en el campo de la teoría mágica que he adquirido a lo largo de mi vida, debido a mi interminable búsqueda de convertirme en un mago".

          "Fascinante..." dice el rey del subsuelo. "No es que no te crea, pero ¿podrías quizás demostrarnos algunos hechizos para que podamos tener una idea general de cómo funciona? ¿Tus hechizos funcionan de la misma manera que los del plano terrestre?"
      - source: scene_text_2
        paragraph: 5
        text: |-
          "Sí", digo, "son prácticamente iguales, excepto por el hecho de que necesito conocer perfectamente el flujo de la magia y la teoría detrás de cada hechizo, o no podrán lanzarse. Déjame darte algunos ejemplos".

          Después de que dejo de hablar, empiezo a lanzar un hechizo básico de cada elemento, para darles una pequeña muestra de lo que puedo hacer. Una vez que termino de presumir, rey del subsuelo pasa unos momentos contemplando lo que acaba de ver antes de volver a hablar.

          "Dada la variedad de hechizos que nos acabas de mostrar, ¿debo entender que eres el equivalente a un generalista en este plano?" el rey del subsuelo dice. "¿Cuántos hechizos más conoces?"

          "Es difícil decirlo", le respondo. "Hay algunos hechizos que ya he probado, así que sé que puedo lanzarlos aquí, pero para muchos otros será una apuesta. Conozco la teoría detrás de muchos hechizos como para poder probarlos todos, y no puedo estar seguro de poder lanzar un hechizo en este plano con éxito antes de probarlo y ver cómo funciona. Una cosa que puedo decirles con certeza es que mi dispositivo de estadísticas no funcionará aquí, porque no lo llevo conmigo en el Plano Etéreo, así que lo único en lo que puedo confiar es en mi magia. Ah, y también podría usar la técnica de disipación de varios pasos que inventé mientras era aprendiz con Brinhorn. Ahora que lo pienso, debería ser bastante simple de hacer incluso en un lugar como este."

          "Disipación en varios pasos..." dice Peter, mientras intenta comprender lo que acabo de decir. "¿Te refieres a la técnica de disipación de Brinhorn?"

          "Sí, ese es", digo.
      - source: scene_3
        paragraph: 4
        text: |-
          "¡¿Qué quieres decir con que lo inventaste?!" Peter se rompe, de repente. "¿Estás loco? ¡Brinhorn fue quien lo inventó, no tú! ¡Está incluso en el nombre!"

          "Bueno, sí, me preguntó si podía ponerle su nombre a la técnica y le dije que no me importaba", digo. "He conocido a cientos de Barrys en mi vida. Realmente no habría tenido mucho sentido ponerle mi nombre a esa técnica".

          "Te estás engañando", dice Peter. "¿Y esperas que crea que Brinhorn incluso consideró aceptarte como aprendiz cuando no podías lanzar ninguna magia? ¡Esto es más que ridículo!"

          "Ahora, ahora, Peter", dice rey del subsuelo. "Admito que lo que nos dijo es un poco difícil de creer, pero acaba de mostrarnos que puede lanzar una amplia variedad de hechizos en este reino, lo que le da un poco de credibilidad a su historia".

          El rey ahora se vuelve hacia mí.

          "De cualquier manera", continúa, "creo que ahora deberíamos saber lo suficiente sobre sus capacidades para solucionarlas. Peter también es un generalista, así que estoy seguro de que ustedes dos se llevarán muy bien".
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch09c_linked
  - name: b3_ch09c_linked
    texts:
      - source: scene_text
        paragraph: 6
        text: |-
          "Con el debido respeto, mi rey, pero llamar generalista a esta persona es un insulto a todos los generalistas que han existido en la historia de nuestro mundo", dice Peter. "Este hombre no es más que un fraude. ¡El hecho de que incluso pudiera soñar con compararse con alguien como Brinhorn nos muestra la poca comprensión que realmente tiene de la teoría mágica! ¡Brinhorn es alguien que ha estado desafiando a Azarius por el título de Sabio del Oeste casi todos los años desde que tengo uso de razón! ¿Quién se cree este 'Barry' que es para pronunciar el nombre de ese hombre con tanta facilidad?"

          "También se podría decir que Brinhorn ha estado perdiendo contra Azarius todos los años y sería igual de preciso", digo. "¿No dirías que describirlo así me haría un poco más fácil compararme con él?"

          "Insolente hijo de..." comienza a decir Peter, pero el rey lo interrumpe.

          "Ya es suficiente, Peter", dice rey del subsuelo. "Le guste o no, seguiremos trabajando con él por el momento, así que intentemos al menos mantener las cosas profesionales, ¿de acuerdo?"

          "...Sí, mi señor", dice Peter. "Por más difícil que sea, intentaré abstenerme de hacer más comentarios, al menos hasta que termine la próxima pelea".

          "Muy bien", dice el rey, y luego se vuelve hacia mí nuevamente. "Ahora, Barry, como ya habrás adivinado, Peter siempre ha sido un gran admirador tanto de Azarius como de Brinhorn, e incluso fue a ver uno de sus duelos oficiales en un momento. Incluso se podría decir que han servido como sus modelos a seguir, hasta cierto punto. Creo que esto debería darte una idea relativamente buena de cuál es su repertorio de hechizos, ¿correcto?"
      - source: scene_text_2
        paragraph: 6
        text: |-
          "Creo que sí, sí", digo.

          "Fantástico", dice rey del subsuelo. "En ese caso, Peter, sólo tengo una última pregunta para ti, si no te importa".

          "¿Sí, mi rey?" Peter dice.

          "Me dijiste que mi cuerpo terrestre usa su aura para vincularse a mi alma desde el Plano Etéreo, ¿verdad?" dice el rey.

          "Sí, señor", responde Peter.

          "Entonces, si el aura está vinculada a mi alma", continúa el rey, "entonces sería lógico suponer que mi alma también tiene un aura separada con la que el aura terrestre puede vincularse, ¿correcto?"

          "Yo... realmente no lo he pensado mucho hasta ahora", dice Peter, "pero lógicamente hablando, debería ser como dices, sí".

          "¡Bien!" el rey del subsuelo dice. "¡Entonces no estoy sólo imaginando cosas!"

          Luego estira los brazos hacia los costados, mientras apunta las palmas en dirección opuesta a él, y de repente una fuerza invisible nos empuja a Flower, Peter y a mí hacia atrás unos tres metros.

          "Es un poco más débil que en el plano terrestre, pero parece que también podré usar la manipulación del aura en este plano de existencia", dice el rey del subsuelo, mientras se vuelve hacia nosotros. "Perdón por hacerte esperar. Estoy listo cuando tú lo estés. ¡Solo di la palabra y comenzaremos la batalla!"

          "Hagamos esto entonces", digo. "Flower, ¿puedes llevarnos con el Supervisor?"

          "¡Sí!" Flower dice. "¡Aquí vamos!"
      - source: scene_3
        paragraph: 5
        text: |-
          La luz blanca del teletransportación nos envuelve una vez más, mientras nuestros cuerpos comienzan a vibrar fuertemente. Unos segundos más tarde nos encontramos en una ubicación diferente dentro del éter, con un dron de ojos verdes flotando a unos seis metros de distancia de nosotros.

          "Procesando. Procesando..." dice el Supervisor. "El protocolo Supervisor les agradece por ahorrarle el esfuerzo de buscarlos. Sin embargo, todavía hay un último asunto que debe resolverse antes de que elija mi próximo curso de acción. ¿Podrían especificar la razón por la cual eligieron teletransportar aquí junto con rey del subsuelo y Peter en lugar de venir solos?"

          "¿No se suponía que debías ser muy inteligente?" Le pregunto al supervisor. "Creo que deberías poder resolverlo sin que te lo digamos".
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch09c_shockwave
  - name: b3_ch09c_shockwave
    texts:
      - source: scene_text
        paragraph: 7
        text: |-
          "A juzgar por tu respuesta, el protocolo del Supervisor supone que no has cambiado tu punto de vista y que todavía no estás dispuesto a ayudarme en mi batalla contra los rebeldes", dice el Supervisor. "¿Es eso correcto?"

          "¿Qué te parece esto como respuesta a tu pregunta?" Le digo, mientras me pongo en una postura especial y hago algunos movimientos muy rápidos con las manos mientras imagino la energía mágica acumulándose en las yemas de mis dedos.

          Antes de que el Supervisor tenga tiempo de decir algo más, lo señalo con el dedo y un rayo sale disparado, directo a su ojo verde. El rayo parece golpear al dron al principio, pero luego me doy cuenta de que lo único que hice fue rozar ligeramente el escudo invisible que probablemente ya había lanzado a su alrededor antes de que nos teletransportáramos aquí.

          Siguiendo mi ejemplo, Flower también comienza el ataque, golpeando al Supervisor con una andanada de bolas de fuego. Cuando las llamas de las explosiones se apagan, veo que el Supervisor había logrado crear una cúpula de piedra a su alrededor, que lo protegía por completo pero que ahora se está desmoronando rápidamente en pequeños pedazos de roca.
      - source: scene_text_2
        paragraph: 7
        text: |-
          "¡Advertencia!" dice el Supervisor. "El protocolo Supervisor ahora activará sus nuevos procedimientos experimentales, diseñados exclusivamente para Plano Etéreo. Tenga en cuenta que estos nuevos procedimientos se basan en el conocimiento de Magium y que, hasta la fecha, no se han probado en gran medida. Si tiene alguna queja con respecto a estos nuevos procedimientos, consulte la sección 5C-E789 del manual operativo de Supervisor".

          "¿Procedimientos experimentales?" Pregunto, confundido. "¿Qué diablos se supone que eso--"

          Antes de terminar mi frase, una poderosa onda de choque de energía negra sale del dron del Supervisor y nos alcanza en menos de un segundo. Sin embargo, en lugar de golpearnos directamente, la onda de choque es detenida por una barrera invisible que se había colocado a unos cincuenta centímetros delante de nosotros, probablemente por el rey del subsuelo. Debido a la fuerza del impacto, podemos ver que comienzan a aparecer varias grietas en la barrera que tenemos frente a nosotros, que poco a poco se va volviendo menos transparente.
      - source: scene_3
        paragraph: 6
        text: |-
          "Si esa ola de energía causó tanto daño a mi barrera, entonces ciertamente nos habría destruido en un instante si alguna vez nos hubiera alcanzado", dice el rey del subsuelo. "No quiero alarmar a nadie, pero dudo que pueda defendernos contra más de... cuatro de estos tipos de ataques, como máximo, antes de que mi escudo de aura semitransparente se rompa. Y una vez que eso suceda, necesitaré una cantidad significativa de tiempo para preparar otro".

          "El protocolo Supervisor se disculpa por las molestias que ha causado", dice el dron de ojos verdes, mientras envía otra poderosa onda de choque hacia nosotros que crea grietas adicionales en la barrera semitransparente del rey, mientras el dron pulsa fuertemente, haciendo un ruido muy extraño. "Los procedimientos experimentales actualmente no funcionan como se esperaba. Tenga paciencia mientras intentamos resolver este problema".
    choices:
      - position: 1
        text: Dile al rey que cancele su barrera y ataque al Supervisor junto con nosotros.
        effects:
          - set:
              current_scene: b3_ch09c_cancel
              ac_b3_ch9_consolation: ac_b3_ch9_consolation + 1
      - position: 2
        text: Dile al rey que mantenga la barrera activa un poco más de tiempo, pero que la cancele antes de que se rompa.
        effects:
          - set:
              current_scene: b3_ch09c_longer
              ac_b3_ch9_consolation: ac_b3_ch9_consolation + 1
      - position: 3
        text: Dile al rey que mantenga activa la barrera hasta que se rompa.
        effects:
          - set:
              current_scene: b3_ch09c_breaks
  - name: b3_ch09c_cancel
    texts:
      - source: scene_text
        paragraph: 8
        text: |-
          "No podemos simplemente esperar aquí hasta que se rompa la barrera", digo. "Tendremos muchas más posibilidades si lo atacamos todos juntos".

          "Si lo atacamos al mismo tiempo, entonces deberíamos esperar hasta después de la siguiente onda expansiva", nos dice el rey en voz baja. "Parece haber un retraso notable entre las explosiones de energía, lo que me hace pensar que necesita esperar un tiempo antes de poder recargarlas".

          "De acuerdo", digo.

          "Prepara tus hechizos", nos dice el rey del subsuelo. "Pronto eliminaré mi barrera".

          Hacemos lo que él dice y luego esperamos a que el Supervisor nos golpee con su próxima onda de choque. Inmediatamente después de que eso sucede, el rey cancela su barrera y luego comenzamos a atacar al dron de ojos verdes con cada hechizo de largo alcance que podamos imaginar, mientras que el rey del subsuelo también usa su manipulación de aura para ejercer un poco más de presión sobre nuestro enemigo.
      - source: scene_text_2
        paragraph: 8
        text: Mientras todavía estamos ocupados lanzando nuestros hechizos ofensivos, el Supervisor libera otra onda de choque mortal sin previo aviso, pero esta vez el rey no logra crear una barrera lo suficientemente rápido. Cuando la ola de energía nos alcanza, desintegra nuestros cuerpos casi de inmediato, y apenas tengo unos momentos para entender lo que está pasando antes de perder la conciencia por completo.
