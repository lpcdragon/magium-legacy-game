          - source: scene_3
            paragraph: 17
            text: |-
              Tal como temía, el algoritmo de predicción de trayectoria del Gólem ahora se ha perfeccionado hasta tal punto que no importa cuán caóticamente crea que me estoy moviendo, el gigante del metal siempre estará un paso por delante de mí. Después de esquivar dos rayos más confiando únicamente en mis reflejos, decido detenerme en el aire y burlarme del Gólem, ya que realmente no tiene mucho sentido tratar de burlarlo más.

              "¡Vamos!" Le grito al Gólem, mientras agito mis brazos como un lunático. "¡Estoy aquí! ¡¿Qué estás esperando?! ¡Haz tu mejor esfuerzo!"

              Después de unos segundos de silencio, el Gólem me dispara su rayo y me aparto del camino en el último momento posible. Luego me detengo en algún lugar encima de Gólem nuevamente, para poder burlarme un poco más.

              "¡¿Qué ocurre?!" Grito. "¿Tu sofisticado algoritmo es demasiado estúpido para alcanzar un objetivo estacionario? ¿Ya no puedo predecir mis movimientos si estoy parado en el lugar? ¡¿Eh?!"

