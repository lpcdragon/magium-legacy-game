  - name: b3_ch09c_chop
    routes:
      - condition: b3_ch9_element = 2
        texts:
          - source: scene_text
            paragraph: 17
            text: |-
              "Si no te importa, me gustaría empezar cortándole todas las cabezas", digo.

              "Espera un minuto", dice Peter. "¿No se supone que a una hidra le vuelven a crecer dos cabezas después de cortar una de ellas?"

              "Oh, no, en realidad eso es sólo una idea errónea", digo. "Nosotros también lo pensamos hasta que nos encontramos con una hidra real en una de las ruinas subterráneas de Varathia y vimos que es solo un monstruo con poderes regenerativos muy altos. La razón por la que necesitas cortarle todas las cabezas a la vez es porque puede volver a hacerlas crecer apenas unos segundos después de que las cortas, por lo que la pelea nunca terminará. ¡Mira, te lo mostraré!"

              Luego envío unos veinte Cuchillas de viento hacia la hidra voladora, cortándole las cabezas todas a la vez.
          - source: scene_text_2
            paragraph: 14
            text: |-
              "¡Ahí vamos!" Digo, mientras los cuellos de Serpiente de la hidra ahora se retuercen sin rumbo fijo. "¡No más hidra!"

              No mucho después de que dejo de hablar, los cuellos comienzan a regenerarse muy rápido, pero en lugar de volver a crecer a sus formas originales, se dividen en dos y crean dos cabezas por cada una que había sido cortada. Antes de que tenga la oportunidad de reaccionar, la hidra se teletransporta frente a mí instantáneamente y se abalanza sobre mí con sus catorce cabezas.

              Lo último que puedo experimentar es que mi cuerpo etéreo se derrite por la saliva ácida, cuando una de las cabezas de hidra verde me traga por completo y luego pierdo el conocimiento por completo.
