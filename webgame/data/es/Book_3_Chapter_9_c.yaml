  - name: b3_ch09c_phrase
    texts:
      - source: scene_text
        paragraph: 49
        text: |-
          Justo cuando estoy a punto de abrir los ojos, recuerdo la advertencia de Flower antes de que me teletransportara.

          "--no importa qué-- ¡abre los ojos!" fueron las palabras que la escuché decir.

          La frase no está completa, pero según la estructura de la oración, se siente como si estuviera diciendo algo como "pase lo que pase, no abras los ojos".

          No puedo estar seguro de esto, pero ella me dijo que debía seguir visualizando el cubo y nunca me dijo cuándo detenerme. Todavía tengo la imagen del cubo frente a mí en este momento, así que supongo que probablemente debería seguir pensando en ello. Esto es lo único de lo que debería preocuparme. Nada más importa. Sigue imaginando el cubo.

          Pasa un minuto entero sin que yo haga nada más que concentrarme en la imagen del santuario que tengo en mi cabeza. O al menos creo que ha pasado un minuto. Es un poco difícil mantener la cuenta del tiempo en esta completa oscuridad.

          Está bien. No hay necesidad de abrir los ojos. Todavía estoy consciente por ahora y esto es todo lo que importa. Hace un minuto, podría haber jurado que solo me quedaban unos segundos de vida, pero de alguna manera sigo aquí. Todavía estoy despierto. Lo que sea que hizo Flower, debe haber tenido al menos algún efecto positivo, o de lo contrario no estaría vivo.
      - source: scene_text_2
        paragraph: 39
        text: |-
          Mientras todavía estoy esperando que algo suceda, de repente me siento empapado de pies a cabeza en agua helada, y cuando instintivamente salto, rápidamente me doy cuenta de que ahora hay tierra bajo mis pies, y ya no siento como si estuviera flotando en una oscuridad sin fin como antes. La lluvia cae a cántaros por mis mejillas, el sonido de un relámpago resuena en la distancia y el viento sigue soplando.

          ¿Es esto?... ¿Finalmente he vuelto al plano terrestre para siempre?

          "¿Estás planeando abrir los ojos pronto o esperas que te hable así?..." Escucho la voz de Flower, hablando en el tono de Illuna.

          Cuando finalmente abro los párpados, veo a Flower parada justo frente a mí con llamas azules en sus ojos, lo que me confirma que Illuna todavía era quien actualmente controlaba su cuerpo en el plano terrestre.

          Todas las conexiones que tenía con Plano Etéreo ya no existen. Aunque estoy intentando cambiar mi conciencia al otro reino, ya no funciona. ¿Podría ser este el resultado de que mi alma finalmente regrese a mi santuario el Plano Etéreo?
      - source: scene_3
        paragraph: 26
        text: |-
          "Había esta... oscuridad", le digo a Illuna. "Me sentí similar al vacío en el que el Magium me hizo flotar cuando casi me borró del mundo, excepto que esta vez todavía tenía mis recuerdos y mi identidad intactos. Espera, no, eso no está bien... También había algo más diferente en esto... la nada en la que estaba. Realmente no pude verlo porque tuve los ojos cerrados todo el tiempo, pero la oscuridad a mi alrededor parecía casi... opresiva. Como si estuviera tratando de tragarme por completo. ¿Tienes alguna idea? ¿Qué pudo haber pasado?"

          "Ah, eso es lo que hizo Flower", dice Illuna. "Tenía algunas sospechas bastante fuertes, pero apenas pude obtener algún tipo de información coherente de ella a través de nuestro enlace telepático cuando hablé con ella antes. Probablemente debería hacerle saber que no terminó matándote por accidente antes de que se dé un ataque al corazón por pura ansiedad".

          "¿Ella pensó que podría haberme matado?..." Pregunto, en un tono incómodo. "Espera, ¿qué hizo ella?"

          En lugar de responderme, Illuna levanta dos dedos en el aire frente a mí, indicándome que guarde silencio mientras ella habla telepáticamente con Flower en el Plano Etéreo. Una vez que termina, baja la mano para que podamos reanudar nuestra conversación.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch09c_ingenuity
  - name: b3_ch09c_ingenuity
    routes:
      - condition: b3_ch9_hadrik = 0
        texts:
          - source: scene_text
            paragraph: 50
            text: |-
              "Está bien, Flower se ha calmado por ahora", dice Illuna. "¿De qué estábamos hablando otra vez? Ah, claro, la oscuridad. Bueno, no hay mucho que decir al respecto, en realidad. La oscuridad es la ausencia de luz. La luz del Plano Etéreo es el éter mismo. El éter fue quien te atacó, así que Flower decidió teletransportar en el único lugar donde estarías realmente a salvo de él. Sin embargo, la única manera de salir del abismo etéreo es imaginar un lugar muy claramente en tu cabeza y estar firmemente convencido de que puedes transportarte allí a través de tus propios poderes. Al ver que ya no respirabas en el plano terrestre, supuse que habías fallado en tu tarea, así que tuve que ser un poco creativo".

              Luego extiende su palma y conjura una esfera flotante de agua sobre ella, insinuando que ella fue la razón por la cual el agua en la que estaba empapado era tres veces más fría que las gotas de lluvia de la tormenta.

              "Wow..." le digo. "No sé qué decir. Gracias. Y Flower. No tengo idea de qué habría pasado si ustedes dos no hubieran intervenido de la forma en que lo hicieron. ¿Cómo se les ocurrieron estas ideas?"

              "...Experiencia", dice Illuna. "Y un poco de ingenio. Digamos que esta no es la primera vez que hemos tenido que hacer uso del abismo etéreo, y probablemente tampoco será la última. Ahora, si me disculpan, tengo que verificar el Flower. Todavía quedan algunos asuntos sin resolver en el Plano Etéreo de los que debemos encargarnos".

              "Espera, ¿Flower está bien?" pregunto. "No puedo volver a cambiar mi conciencia al Plano Etéreo para comprobarlo. ¿Logró escapar del éter?"
          - source: scene_text_2
            paragraph: 40
            text: |-
              "Flower está... bien", dice Illuna. "Por ahora, al menos. No estoy del todo seguro, pero es posible que su reciente transformación la esté protegiendo del éter de alguna manera. Es un poco difícil especular sin conocer más detalles sobre esta nueva forma suya. De todos modos, ya vuelvo".

              Mientras Illuna vuelve su atención al Plano Etéreo, dejando que el cuerpo de Flower mire al frente con una mirada vacía, decido dar un pequeño paseo por la plaza, para ver cuál es la situación.

              Se siente extraño no poder ver más la perspectiva de mi alma desde el Plano Etéreo, después de todo lo que pasó. Aunque sé con certeza que todas las cosas que he experimentado en ese plano de existencia fueron reales, todavía no puedo deshacerme de la sensación de que acabo de despertar de un sueño muy largo.

              Ojalá hubiera podido explorar más ese mundo. Ojalá hubiera podido probar mis hechizos más. Me pregunto si alguna vez tendré la oportunidad de ver ese lugar nuevamente...

              Mientras sigo caminando por la plaza, veo a Peter, rey del subsuelo y Daren parados en medio de unas pocas docenas de rebeldes inconscientes, como si estuvieran discutiendo algo importante. Me acerco a ellos también y los saludo tan pronto como me acerco lo suficiente.

              "Veo que has salido vivo de allí", le digo a Peter y al rey. "¿Esto significa que ambos llegaron a sus santuarios a tiempo?"
          - source: scene_3
            paragraph: 27
            text: |-
              "En realidad, no", dice el rey. "Soy el único que volvió a su propia mente. Aparentemente, Peter no está siendo el objetivo de éter. Supongo que los etéreos deben recibir un trato especial cuando se trata de tales cosas".

              "Sí, Flower tampoco ha tenido ningún problema, así que probablemente tengas razón", le digo al rey. "Oye, eh... ¿Cómo te fue?... Cuando llegaste a tu santuario, quiero decir. ¿Perdiste todo contacto con tu alma también, o todavía puedes ver las cosas desde su perspectiva?"

              "No, perdí por completo la capacidad de ver lo que estaba sucediendo en el Plano Etéreo una vez que regresé a mi propia mente", dice el rey. "Por lo que tengo entendido, así es como se supone que debe ser. El aura de tu alma se vincula con el aura de tu mente tan pronto como ingresa a sus instalaciones, y luego tu mente desde el Plano Etéreo es la que maneja la conexión entre tu alma y tu cuerpo aquí en el plano terrestre. Lo que experimentamos hoy no fue más que una anomalía. A menos que hayas nacido como un etéreo, no es normal ver las cosas desde la perspectiva de tu alma. Lo será. Probablemente nos sentiremos extraños durante unas horas más al no poder cambiar más nuestra conciencia entre planos, pero estoy seguro de que la sensación pasará y que pronto nuestra breve escapada a través de los reinos etéreos se sentirá como nada más que un sueño".

              "Sí..." digo. "Eso es lo que tengo miedo..."
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch09c_stories
