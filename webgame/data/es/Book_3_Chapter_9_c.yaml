  - name: b3_ch09c_conducted
    texts:
      - source: scene_text
        paragraph: 25
        text: |-
          "Procesando... Procesando..." dice el Supervisor. "No hay datos suficientes disponibles. El protocolo Supervisor requiere más encuentros con el ser misterioso que acaba de contactarnos para evaluar adecuadamente su nivel de amenaza. Los experimentos continuarán según lo programado, hasta que se llegue a una conclusión final".

          "¡¿Estás loco?!" Peter pregunta el Supervisor. "¿Quieres cuestionar lo que podría ser el éter en sí solo porque no tienes... suficientes datos?"

          "Por favor, mantenga la calma", dice el supervisor. "Los experimentos no se llevarán a cabo en condiciones ideales si no conservas el control total de tus facultades mentales."

          Cuando el Supervisor termina su frase, doce de las cabezas de la hidra comienzan a rugir fuerte y amenazadoramente. Las únicas dos cabezas que permanecen en silencio son las marrones, que simplemente nos observan a cada uno de nosotros por turno, como si estuvieran tratando de elegir su próximo objetivo.

          "Bueno..." digo, mientras me pongo en posición y comienzo a hacer algunos gestos con las manos en rápida sucesión. "Si el fuego no funciona, entonces también podríamos probar con la electricidad".
      - source: scene_text_2
        paragraph: 17
        text: |-
          Luego apunto con el dedo hacia la hidra y un rayo sale disparado, directo hacia el monstruo. Al igual que con el fuego, la hidra parece sentir su dolor, pero aparte de eso, no parece que mi ataque esté teniendo mucho efecto en la criatura, excepto que me hará el próximo objetivo.

          Anticipo su ataque de teletransportación y corro hacia atrás usando mis corrientes de aire, pero inmediatamente después de su teletransportación, el monstruo rocía ácido con sus dos cabezas verdes en toda el área a mi alrededor. Aunque logro crear una cúpula de roca justo a tiempo para protegerme de la peor parte del ataque, el ácido está devorando la roca muy rápidamente y la hidra parece estar vertiendo más ácido a un ritmo más rápido del que puedo reforzar la piedra.

          "¡Estás cubierto!" dice el rey del subsuelo, mientras hace un escudo invisible muy alto entre la hidra y yo que impide que el resto del ácido llegue a mí. "¡Ahora aléjate de allí!"

          "No tienes que decírmelo dos veces", digo, mientras vuelo rápidamente hacia atrás, hasta que estoy fuera del alcance de los ataques de aliento de la hidra.

          Mientras me distancio del monstruo, siento que mi conciencia regresa al plano terrestre unas cuantas veces más, pero esta vez las cosas suceden de manera un poco diferente. En lugar de cambiar de perspectiva entre los dos planos de existencia, estoy empezando a tomar conciencia de lo que me rodea en ambos planos simultáneamente.
      - source: scene_3
        paragraph: 12
        text: |-
          La única otra ocasión en la que experimenté algo similar a esto fue cuando Magium intentó borrarnos a mí y a Leila de la existencia en la torre de seredium. Por ahora, mi conciencia principal todavía parece estar en Plano Etéreo, pero al mismo tiempo también tengo el control de mi cuerpo real desde plano terrestre, excepto que en realidad no lo siento como mi cuerpo en este momento. Se siente más como una especie de... marioneta... que estoy controlando con hilos invisibles.

          Ahora que lo pienso, recuerdo que Flower dijo lo mismo sobre su propio cuerpo en el plano terrestre. Que se siente como si estuviera controlando una marioneta. ¿Podría ser así como Flower ha estado viviendo su vida todo este tiempo?

          Mientras estoy ocupado contemplando mi propia existencia, de repente detecto un buen número de drones de ojos rojos acercándose a mí en el plano terrestre, mientras todavía estoy tirado en el suelo en medio de un charco. Cuando finalmente me levanto, veo que el rey del subsuelo también está despierto en el plano terrestre, y en este momento se está elevando hacia el cielo para poder luchar contra los drones.

          "¿Tú también?" Le pregunto al rey del subsuelo, dándome cuenta de que no soy el único cuya conciencia cambia constantemente entre planos.

          "Sí", responde el rey con sencillez, y luego vuela más alto hacia el cielo.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch09c_ponders
  - name: b3_ch09c_ponders
    texts:
      - source: scene_text
        paragraph: 26
        text: |-
          "¿Lo que está sucediendo?" Escucho la voz de Flower en el plano terrestre, pero con la tonalidad de Illuna. "¿Cómo controlan ustedes dos sus cuerpos terrestres? Flower me dijo que su pelea en el Plano Etéreo aún no ha terminado".

          Cuando me doy la vuelta, veo que Flower tiene llamas en sus ojos en este plano de existencia también, excepto que aquí actualmente son azules, porque Illuna es quien controla su cuerpo.

          "Creo que el éter podría estar atacándonos", digo. "Una voz misteriosa en nuestras cabezas nos dijo que dejáramos de luchar y volviéramos a nuestros 'santuarios', pero el Supervisor no quiere parar".

          "Por 'santuarios' supongo que se refiere a vuestras mentes desde el Plano Etéreo..." dice Illuna, mientras reflexiona sobre mis palabras durante unos segundos. "Muy bien, ¿entonces les dio un límite de tiempo? ¿Cuánto tiempo tienen hasta que éter destruya sus almas?"
      - source: scene_text_2
        paragraph: 18
        text: |-
          "¿Destruir nuestras almas?..." digo. "¡Oye, no nos apresuremos! Nadie dijo nada sobre destruir almas. Sólo estamos teniendo un pequeño desacuerdo, eso es todo".

          "Correcto", dice Illuna. "Bueno, si no tienes un límite de tiempo, entonces te sugiero que te apresures antes de que este 'desacuerdo' tuyo se convierta en algo mucho más definitivo".

          Mientras Illuna hablaba, pude escuchar una fuerte explosión sobre nosotros, y cuando giré la cabeza para ver qué estaba sucediendo, me di cuenta de que rey del subsuelo acababa de emitir otra de sus ondas de choque de aura que envió a unas pocas docenas de drones a estrellarse todos a la vez.

          "Por favor, absténgase de causar más daño a las unidades de ojos rojos", le dice el dron de ojos verdes al rey en el Plano Etéreo. "Les estás impidiendo completar su tarea".
      - source: scene_3
        paragraph: 13
        text: |-
          "¿Y qué tarea podría ser esa?" pregunta el rey del subsuelo.

          "Las unidades de ojos rojos están intentando sacar a sus camaradas inconscientes de la plaza y llevarlos a celdas seguras donde permanecerán en el futuro previsible", dice el dron de ojos verdes.

          "Sí, eso es lo que pensé", dice el rey.

          "Si no cesas tus acciones el plano terrestre inmediatamente, el protocolo del Supervisor se verá obligado a tomar medidas más extremas para hacer frente a la amenaza que representas para la prosperidad continua de esta ciudad", dice el Supervisor.

          "¿Medidas extremas, dices?..." le dice el rey al Supervisor. "Bueno, entonces ¿por qué no nos muestras estas medidas 'extremas'?"

          "Como desees", dice el Supervisor.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch09c_ensure
  - name: b3_ch09c_ensure
    texts:
      - source: scene_text
        paragraph: 27
        text: |-
          Unos segundos después, comenzamos a escuchar un sonido de alarma muy fuerte resonando por toda la ciudad de Ollendor, el cual se escucha claramente a pesar del ruido que sigue haciendo la tormenta.

          "La ciudad de Ollendor se encuentra ahora en estado de emergencia", escuchamos la voz metálica de los drones de ojos rojos transmitida en voz alta desde lupas de voz mágicas ubicadas estratégicamente por toda la ciudad. "Por favor evacuen sus hogares inmediatamente. Las unidades de ojos rojos los conducirán a las áreas seguras designadas de manera oportuna. Esto no es un simulacro. Repito. Esto no es un simulacro".

          "¿Ese es tu gran plan?" Le digo al dron de ojos verdes en el Plano Etéreo. "¿Evacuar la ciudad para que puedas usar hechizos más grandes contra nosotros sin temor a daños colaterales? Te das cuenta de que el rey todavía está matando a tus drones más rápido de lo que puedes enviarlos, ¿no?"

          El Supervisor no dice nada, sino que envía su hidra para atacarnos nuevamente. Mientras estamos ocupados tratando de mantenernos con vida en el Plano Etéreo, empiezo a sentir algunos temblores de tierra en el plano terrestre, que solo se intensifican con cada momento que pasa. Cuando miro a mi alrededor para descubrir de dónde viene esto, me sorprende ver que cinco de los gigantes de metal Gólems que custodiaban las puertas de la ciudad ahora se acercan lentamente a nosotros desde la distancia, mientras pisotean y destruyen todas las casas en su camino hacia aquí.
      - source: scene_text_2
        paragraph: 19
        text: |-
          "Por favor, mantengan la calma", escucho de nuevo a los drones de ojos rojos hablando a través de las lupas de voz, mientras la gente en las calles huye aterrorizada. "Las unidades de ojos rojos garantizarán tu seguridad mientras las sigas. Si estás preocupado por tus casas destruidas, entonces puedes estar seguro de que serán reconstruidas y que muy pronto recibirás un reembolso por todas las pérdidas monetarias que has sufrido durante este conflicto. ¡Que tengas un buen día!"

          "De ninguna manera..." digo, mientras miro toda la destrucción que los gigantes de metal están dejando a su paso.

          "¿Es esta tu idea de gobernar una ciudad?" Le pregunto al Supervisor en el Plano Etéreo. "¿Vas a destruir un vecindario entero sólo para matar a dos o tres personas que se oponen a ti?"

          "Según mi análisis, la amenaza percibida por el rey del subsuelo es mayor que la de perder varias estructuras", dice el supervisor. "Una vez que termine esta guerra final, los ciudadanos y los drones trabajarán juntos para reparar el daño causado".
      - source: scene_3
        paragraph: 14
        text: |-
          "Maldita sea..." digo. "Oye, rey del subsuelo, ¿estás escuchando? ¡Necesitamos alejar la lucha de la plaza o tus rebeldes morirán aplastados pronto!"

          "¡No puedo dejarlos solos!" me dice el rey. "Si me voy volando ahora, los drones de ojos rojos seguramente aprovecharán la oportunidad y los capturarán a todos mientras estén indefensos".

          "Mierda", digo. "Tienes razón."

          Luego hago una pausa de unos segundos para pensar en mi próximo curso de acción.

          "En ese caso, Flower, ¿puedes volver a tu mente muy rápido y teletransportar Hadrik a su santuario?" digo. "Supongo que ya debe haber recordado dónde está ubicada su mente. Si al menos podemos tener a Hadrik despierto en el plano terrestre, podríamos tener una oportunidad contra el Gólems".

          "¿Sólo Hadrik?..." dice Flower. "¿Qué pasa con los demás?"
    choices:
      - position: 1
        text: Dile a Flower a teletransportar al resto de mis amigos también lo que piensan.
        effects:
          - set:
              current_scene: b3_ch09c_preoccupied
              b3_ch9_hadrik: 0
      - position: 2
        text: Dígale a Flower que debe teletransportar solo Hadrik y luego regrese con nosotros.
        effects:
          - set:
              current_scene: b3_ch09c_preoccupied
              b3_ch9_hadrik: 1
  - name: b3_ch09c_preoccupied
    routes:
      - condition: b3_ch9_hadrik = 0
        texts:
          - source: scene_text
            paragraph: 28
            text: |-
              "Ahora que lo mencionas", le digo a Flower, "tal vez sería mejor si les recordaras a los demás también".

              "Está bien..." dice Flower. "Pero va a tomar un tiempo. Lo sabes, ¿verdad?"

              "Claro, no hay problema", digo. "Podemos encargarnos de la hidra nosotros solos".

              "Simplemente no mueras hasta que yo regrese aquí, ¿de acuerdo?" Flower me lo dice. "Intentaré regresar lo más rápido que pueda".

              Luego vuelve a estar rodeada por una luz brillante y, unos segundos más tarde, se teletransporta.
          - source: scene_text_2
            paragraph: 20
            text: |-
              Ahora que Flower se fue, decido echar un buen vistazo a mi alrededor en ambos planos de existencia, para ver cuál es la situación en este momento.

              Por lo que puedo decir, parece que el Supervisor está actualmente demasiado preocupado con lo que está sucediendo en Ollendor como para prestarnos atención en el Plano Etéreo, y se nota, porque la hidra apenas ha hecho nada digno de mención en el último minuto excepto usar sus ataques de aliento contra nosotros unas cuantas veces.

              Mientras tanto, en el plano terrestre, uno de los metales Gólems ha logrado un avance significativo sobre los otros cuatro, y muy pronto se acercará lo suficiente como para dispararnos su rayo de fuego. Si Hadrik no se despierta pronto, podríamos tener problemas.
        choices:
          - position: 1
            text: Ataca al Supervisor en el Plano Etéreo, mientras está distraído.
            effects:
              - set:
                  current_scene: b3_ch09c_distracted
                  ac_b3_ch9_consolation: ac_b3_ch9_consolation + 1
          - position: 2
            text: Vuela hacia el metal Gólem y mantenlo distraído hasta que Hadrik despierte.
            effects:
              - set:
                  current_scene: b3_ch09c_upwards
      - condition: b3_ch9_hadrik = 1
        texts:
          - source: scene_text
            paragraph: 29
            text: |-
              "Hadrik debería ser suficiente para cuidar el metal Gólems", digo. "Todavía necesitamos tu ayuda contra la hidra, así que no podemos dejarte fuera por mucho tiempo".

              "Está bien", dice Flower. "Me iré entonces. ¡Intenta que no te maten hasta que yo regrese!"

              Luego vuelve a estar rodeada por una luz brillante y, unos segundos más tarde, se teletransporta.
