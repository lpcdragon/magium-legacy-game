  - name: b3_ch09c_longer
    texts:
      - source: scene_text
        paragraph: 9
        text: |-
          "Creo que podría ser una buena idea mantener esa barrera activa un poco más de tiempo", digo en voz baja. "Parece que el Supervisor aún no ha terminado con sus ondas de choque. Pero si sientes que tu escudo está a punto de romperse, dínoslo y nos aseguraremos de atacar el dron todos a la vez".

          "Parece un plan razonable", dice rey del subsuelo. "Sin embargo, todos deberían asegurarse de tener sus hechizos preparados mientras tanto, para poder disparar sus proyectiles en cualquier momento".

          "Te tengo", digo, mientras empiezo a preparar uno de mis hechizos.

          Tal como dijo rey del subsuelo, su barrera es capaz de resistir las siguientes dos ondas de choque sin fallar, pero las grietas ahora son demasiado grandes para ignorarlas. Se siente como si su escudo invisible estuviera listo para fallar en cualquier momento. Justo cuando estaba a punto de preguntarle cuánto tiempo más podrá seguir así, el rey nos da la señal para comenzar el ataque y luego deja caer su barrera.
      - source: scene_text_2
        paragraph: 9
        text: |-
          Tan pronto como eso sucede, comenzamos a atacar al dron de ojos verdes con todos los hechizos de largo alcance que podamos imaginar, mientras que rey del subsuelo también usa su manipulación de aura para ejercer más presión sobre nuestro enemigo.

          Mientras todavía estamos ocupados lanzando nuestros hechizos ofensivos, el Supervisor libera otra onda de choque mortal sin previo aviso, pero esta vez el rey no logra crear una barrera lo suficientemente rápido. Cuando la ola de energía nos alcanza, desintegra nuestros cuerpos casi de inmediato, y apenas tengo unos momentos para entender lo que está pasando antes de perder la conciencia por completo.
    choices:
