                  current_scene: b3_ch09c_indebted
  - name: b3_ch09c_indebted
    texts:
      - source: scene_text
        paragraph: 46
        text: |-
          "Por mucho que me gustaría atribuirme el mérito de haber vencido al Supervisor", dice el rey del subsuelo, "me temo que tu amigo enano fue en realidad quien dio el golpe final. Hiciste un muy buen trabajo al enviarlo de vuelta a su propia mente. Todos estamos en deuda contigo".

          "¡Oye, no lo menciones!" Flower dice. "Pero... ¿significa esto que se acabó? ¿Ganamos?"

          "Yo... eso creo, sí..." digo. "¡Nosotros... ganamos!"

          Justo cuando termino de decir esas palabras, mi mente comienza a ser inundada gradualmente por millones de voces diferentes, junto con imágenes que cambian rápidamente y que pasan frente a mis ojos a una velocidad demasiado alta para que pueda decir de qué se tratan.

          Todas las voces se superponen, pero en su mayoría solo usan palabras diferentes para decir lo mismo:

          '¡Deja este lugar!'

          '¡Salir!'

          "Tú no perteneces aquí".
      - source: scene_text_2
        paragraph: 37
        text: |-
          Intento taparme los oídos, pero no tiene ningún efecto. Todas las voces provienen del interior de mi cabeza y cada vez son más fuertes. Después de quince segundos más de esto, las imágenes dejan de parpadear y mi conciencia comienza a entrar y salir entre lo etéreo y plano terrestre, sin que yo tenga ningún control sobre ello. Mientras todavía estoy luchando por recuperar la compostura, todas las voces se detienen al mismo tiempo. Todos menos uno: la voz que nos decía que volviéramos a nuestros santuarios mientras todavía estábamos luchando contra la hidra.

          "Te habían advertido", me dice simplemente la voz, y luego mi conciencia oscila entre ambos planos de existencia mil veces en un solo segundo, mientras siento como si mi alma estuviera siendo arrancada por la fuerza de mi cuerpo.

          "¡Mi rey, necesitamos que vuelvas a tu mente ahora!" Peter dice, al rey del subsuelo, y luego los dos rápidamente teletransportar se alejan de nosotros.

          Hace frío. Muy frio. Mis pensamientos son todos un revoltijo. Un cansancio extremo ahora se apodera de mí al sentir como la esencia misma de mi ser se desvanece lentamente, junto con mi cuerpo imaginado desde el Plano Etéreo, que se vuelve más transparente a cada momento que pasa.

          "-¡arry!" Escucho la voz de Flower como si fuera un recuerdo lejano. "¡Barry, mírame a los ojos! ¡Mírame! ¡¡¡Barry!!!"
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch09c_pieces
  - name: b3_ch09c_pieces
    texts:
      - source: scene_text
        paragraph: 47
        text: |-
          Con lo que parece ser el último gramo restante de mi fuerza de voluntad, logro enfocar mi mirada en Flower, quien actualmente me sostiene por los hombros mientras sus llameantes ojos rojos brillan más que nunca. Al mirarla mejor, veo que no solo sus ojos están en llamas, sino que todo su cuerpo ahora está hecho enteramente de fuego... O más bien, el tipo de fuego que se siente caliente pero que por alguna razón no me quema, a pesar de que ella me está tocando directamente con él.

          "Barry, ¿recuerdas cómo era el interior de tu mente en el Plano Etéreo, antes de que el Supervisor te echara el alma a patadas?" Flower dice, en voz alta. "¿Puedes imaginarte el interior de tu santuario frente a tus ojos ahora mismo?"

          "El interior de mi santuario..." le digo con voz muy débil. "Sí... Era... como un cubo..."

          "¿Un cubo?" Flower pregunta. "¿Eso es todo? ¿Eso es todo lo que recuerdas?"

          "Sí, no... no era como tu casa, con pinturas y... todas las demás cosas..." digo. "Mi santuario era sólo... un cubo vacío..."

          "Está bien, entonces necesito que pienses en el interior del cubo", dice Flower. "Necesito que lo visualices claramente dentro de tu cabeza. ¿Entiendes?"
      - source: scene_text_2
        paragraph: 38
        text: |-
          "Sí..." digo, con mi voz apenas más fuerte que un susurro.

          Tal como ella me pidió, trato de recordar cada pequeño detalle que puedo del lugar llamado mi 'santuario', y luego lo recreo dentro de mi cabeza. Luego cierro los ojos para poder ver la imagen en mi mente con mayor claridad.

          "Me lo estoy imaginando ahora..." le digo a Flower, con la misma voz débil de antes.

          "¿Tienes una imagen clara de ello?" Flower dice, con voz algo de pánico. "¿Estás seguro?"

          "Sí, sí", le digo con los ojos todavía cerrados. "Lo miro mientras te hablo. ¿Qué hago ahora?"

          Ya no puedo ver mi cuerpo desde Plano Etéreo porque tengo los ojos cerrados, pero puedo decir que solo se ha vuelto más transparente desde que comencé a hablar con Flower. ¿Me pregunto cuantos segundos más me quedan por vivir?...
      - source: scene_3
        paragraph: 25
        text: |-
          "-¡arry!" Flower dice, mientras empiezo a entrar y salir de la conciencia, captando solo fragmentos de lo que ella me está diciendo. "Escúchame con atención, no hay tiempo, pase lo que pase, ¡abre los ojos! ¡¿Me escuchas?! Barry-- ¡¡¡te estoy perdiendo! ¡¡¡Barry!!!"

          Es difícil saberlo con los ojos aún cerrados, pero creo que estoy envuelto nuevamente por la luz blanca del hechizo de teletransportación de Flower. ¿Está intentando enviarme de regreso a mi santuario? ¿Será por eso que me pidió que lo imaginara dentro de mi cabeza?

          Mientras continúo visualizando el cubo vacío en mi mente, la luz brillante tanto del hechizo teletransportación como del éter desaparece, y lo único que puedo ver a través de mis párpados es oscuridad total. ¿Significa esto que teletransportación fue exitoso? No puedo decir si mi cuerpo ha vuelto a la normalidad o no. Aparte de que la luz desaparece, todavía me siento débil y no parece que haya cambiado mucho.

          El silencio a mi alrededor es ensordecedor. La anticipación me está matando. ¿Me teletransporté correctamente o no? ¡Tengo que saberlo!
    choices:
      - position: 1
        text: Abre mis ojos.
        effects:
          - set:
              current_scene: b3_ch09c_eyes
              ac_b3_ch9_consolation: ac_b3_ch9_consolation + 1
      - position: 2
        text: Mantén mis ojos cerrados.
        effects:
          - set:
              current_scene: b3_ch09c_phrase
  - name: b3_ch09c_eyes
    texts:
      - source: scene_text
        paragraph: 48
        text: |-
          Abro los ojos, pero para mi sorpresa no es sólo la luz lo que se ha ido a mi alrededor, sino también todo lo demás. Lo único que veo ante mis ojos es pura oscuridad.

          "Flower, ¿estás ahí?" Intento decirlo, pero mis palabras no salen de mi boca.

          Después de intentar hablar unas cuantas veces más, la debilidad y el cansancio poco a poco se apoderan de mí y pronto ya no tengo fuerzas ni para abrir la boca. Varios segundos después, me encuentro cerrando los ojos nuevamente, pero esta vez pierdo el conocimiento para siempre.
