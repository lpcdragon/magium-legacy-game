            effects:
              - set:
                  current_scene: b3_ch09c_cover
                  b3_ch9_cover: 1
          - position: 2
            text: Dile a Daren que sería mejor si cada uno peleáramos contra dos Gólems.
            effects:
              - set:
                  current_scene: b3_ch09c_fought
  - name: b3_ch09c_cover
    texts:
      - source: scene_text
        paragraph: 40
        text: |-
          "¿Estás seguro de que tu escudo puede resistir cuatro rayos de fuego al mismo tiempo?" Le pregunto a Daren, mientras vuelo detrás de él.

          "Supongo que estamos a punto de descubrirlo", dice Daren, y luego levanta su escudo, creando una barrera semitransparente a nuestro alrededor.

          Los Gólems ahora se están alineando para poder dispararnos mejor y están comenzando a abrir fuego contra nosotros uno por uno. Hasta ahora, la barrera de Daren parece mantenerse bien, pero no se sabe cuándo comenzará a resquebrajarse.

          "Entonces, ¿los estamos deteniendo o?..." me pregunta Daren, mientras los cuatro rayos ahora están golpeando la barrera.

          "Sólo tenemos que mantenerlos ocupados uno o dos minutos más", digo.

          "¿Por qué?" Daren dice. "¿Qué pasa en dos minutos?"

          "El final de la batalla, con suerte", digo, mientras parpadeo y luego vuelvo al Plano Etéreo para crear dos pilares mágicos más que se necesitaban para lanzar el hechizo de parálisis.

          Tan pronto como termino de colocar el último pilar, le doy la señal de "OK" a Peter para que podamos comenzar nuestro casting simultáneo.
      - source: scene_text_2
        paragraph: 34
        text: |-
          Los pilares semi-invisibles que se han colocado en un círculo alrededor de la hidra ahora se están iluminando y comienzan a formar un perímetro de luz verde alrededor del monstruo. La luz se vuelve cada vez más intensa a cada segundo, mientras que el área dentro del perímetro es bombardeada por energía mágica.

          Mientras rey del subsuelo libera a la hidra de su prisión, las luces verdes de los pilares ahora atacan al monstruo al unísono. Al darse cuenta de que su tiempo ha llegado a su fin, la hidra ruge fuertemente con la mayoría de sus cabezas. Las únicas cabezas que permanecen en silencio, como la última vez, son las de color marrón. Casualmente, estas también son las únicas cabezas que no han usado ningún tipo de ataque de aliento hasta ahora.

          Sin ataques de aliento... Sin rugidos... ¿Qué están esperando exactamente?
      - source: scene_3
        paragraph: 22
        text: |-
          Cuando veo las dos cabezas de hidra mirándome directamente, siento un repentino escalofrío por la espalda y sin pensar, corro hacia el rey y Peter, mientras hago algunos gestos muy rápidos con mis manos y canto un encantamiento realmente antiguo que no puedo creer que todavía recuerde después de todo el tiempo que ha pasado desde que leí sobre eso.

          Justo cuando estoy terminando mi hechizo, las cabezas de hidra marrón finalmente abren la boca y el sonido que están haciendo es tan fuerte que parece que podría rompernos los tímpanos en cuestión de segundos. Afortunadamente para nosotros, el hechizo que estaba lanzando antes finalmente se activa, creando una gran barrera anti-sonido alrededor de Peter, el rey y yo, que bloquea todos los ruidos entrantes, sin importar cuán poderosos sean.

          Mientras estamos dentro de nuestro refugio insonorizado, observamos a la hidra rugir en silencio durante unos diez segundos más, hasta que los pilares desataron su última ola de energía sobre el monstruo, convirtiéndolo en piedra.

          "Bueno...?" Digo mientras miro un poco confundido hacia la hidra que se había convertido en estatua y luego desactivo la barrera anti-sonido que nos rodeaba. "Podría haber jurado que este hechizo estaba destinado a simplemente paralizar, no petrificar a su objetivo. Honestamente, no tengo idea de dónde vino la petrificación. Pero bueno, supongo que los mendigos no pueden elegir, ¿verdad?"

          "... ¿Cómo lo supiste?" Pregunta Peter, después de mirarme en silencio durante unos segundos.
