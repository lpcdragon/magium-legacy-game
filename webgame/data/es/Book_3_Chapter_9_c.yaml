  - name: b3_ch09c_stories
    routes:
      - condition: b3_ch9_hadrik = 0
        texts:
          - source: scene_text
            paragraph: 51
            text: |-
              Luego hago una pausa de unos segundos antes de continuar.

              "Entonces, de todos modos... ¿tienes algún plan todavía sobre lo que vamos a hacer con todos estos rebeldes inconscientes?" digo. "¿Crees que existe alguna posibilidad de que encuentren el camino de vuelta a sus mentes por sí solos?"

              "De hecho, estábamos discutiendo eso justo antes de que usted se uniera a nosotros", dice Daren. "Flower le dijo a Peter que intentará guiar a tantos rebeldes como pueda a sus santuarios, pero que necesitará un poco de tiempo para descansar después de cada viaje, porque se enferma si se teletransporta demasiadas veces seguidas. Peter también guiará las almas de algunos rebeldes, pero sus hechizos teletransportación son más limitados, por lo que solo volará a través del éter la mayor parte del tiempo. el tiempo."

              "De cualquier manera, esto probablemente llevará un tiempo", dice Peter. "Ustedes ya han ayudado lo suficiente y merecen un poco de descanso. Tan pronto como todo su grupo esté despierto, hablaremos con Breynan para que pueda teletransportar regresarlos a la base subterránea. Estoy bastante seguro de que todavía debería estar esperándonos en la sala de teletransporte".
          - source: scene_text_2
            paragraph: 42
            text: |-
              "¿Qué hay de ustedes dos?" Le pregunto a Peter y al rey. "¿No volverás con nosotros?"

              "Nos quedaremos aquí un tiempo más para proteger a nuestros camaradas inconscientes", dice Peter. "Sólo para estar seguros. Nunca se sabe qué enemigos podrían estar acechando a la vuelta de la esquina".

              "Por supuesto", digo. "Supongo que nunca está de más tener demasiado cuidado".

              Mientras hablamos, vemos a Hadrik corriendo hacia nosotros y cuando nos ve, hace una carrera rápida en nuestra dirección, alcanzándonos en menos de un segundo.

              "¡Jajaja!" Hadrik se ríe. "¿Vieron ustedes? ¿Vieron lo que le hice al Supervisor? Quiero decir, supongo que no pudieron haberlo visto, pero oh, hombre... Oh, hombre, las historias que tengo que contarles. Espera un segundo, ¡voy a sacar unas cuantas botellas de cerveza enana y te lo contaré todo!"

              Luego saca algunas botellas de su mochila como dijo que haría y nos las entrega.

              "Uh, no hay botellas para nosotros", dice rey del subsuelo. "Seguiremos en servicio activo hasta que todos nuestros hombres sean enviados de regreso sanos y salvos a la base subterránea".

              "¡Claro, no hay problema!" dice Hadrik, mientras guarda Peter y las botellas del rey en su mochila. "Entonces, de todos modos, ¿dónde estaba? Oh, sí, iba a empezar desde el principio. Déjenme contarles lo que pasó justo después de que llegué a la puerta de la base secreta del Supervisor. ¡Hombre, a ustedes les va a encantar esto!"
