  - name: b3_ch09c_holographic
    texts:
      - source: scene_text
        paragraph: 37
        text: |-
          Antes de que el gigante de metal pueda entender lo que está sucediendo, la pequeña forma, también conocida como Hadrik, da un salto alto y golpea a Gólem en la cabeza, enviándolo a volar unos quince metros hacia atrás y luego haciendo que aterrice de espaldas en algunas casas vacías que quedaron completamente destrozadas en el proceso. El enano no le da tiempo al Gólem para volver a levantarse y salta sobre su cabeza, dándole varios puñetazos más hasta que el enemigo deja de moverse por completo.

          "¡Oye, he vuelto!" Hadrik me grita, mientras sigue parado sobre la cabeza de Gólem. "¿Me extrañaste?"

          "No tienes idea..." le respondo.

          "Entonces, ¿cuál es el plan aquí?" Hadrik dice. "¿Debería ocuparme también de los otros cuatro Gólems muy rápido? ¿Hay algo más que deba saber antes de irme?"

          "Olvídate del Gólems", dice en voz alta el rey del subsuelo, mientras ahora vuela más cerca de nosotros. "Tengo una tarea mucho mejor para ti. Primero acerquémonos un poco más. No quiero que cierta persona escuche nuestra conversación".

          Luego, el rey y yo volamos hacia el suelo, mientras Hadrik se baja del metal Gólem y camina en nuestra dirección para encontrarse con nosotros a medio camino.

          "Está bien", dice Hadrik, una vez que estamos todos cerca el uno del otro. "Dijiste que tenías una tarea para mí. Escuchémosla".
      - source: scene_text_2
        paragraph: 28
        text: |-
          "¿Recuerdas cuál era el propósito original de nuestra misión a la superficie?" dice el rey, mientras saca un pequeño dispositivo de metal de su bolsillo. "¿La razón por la que arriesgamos la vida de tantas personas a pesar de saber la fuerza abrumadora que tenía el Supervisor a su disposición?"

          "Sí, um..." dice Hadrik. "Vinimos aquí para destruir el, uhm... núcleo, ¿verdad?... Sí, el núcleo del Supervisor".

          "Precisamente", dice el rey, y luego le entrega a Hadrik el dispositivo de metal. "Y este pequeño dispositivo es lo que te llevará a nuestro objetivo principal. Aquí, déjame mostrarte cómo usarlo".

          Luego presiona un botón en el dispositivo y un pequeño mapa holográfico tridimensional de nuestra zona circundante comienza a flotar sobre él, similar al mapa que Arraka hizo para nosotros cuando caminábamos por el fuerte de los ogros en busca del cáliz sagrado. Este mapa no parece ser tan detallado como el creado por Arraka, y no hay puntos de colores para indicar los enemigos y aliados en nuestra vecindad, pero sí hay dos puntos, que supongo que son los únicos que necesitamos para nuestros propósitos actuales.

          "Veo que ninguno de los dos está sorprendido", dice el rey, después de mirarnos a cada uno por turno. "¿Debo suponer que has visto un mapa holográfico antes?"

          "Sí", digo. "Arraka nos lanzó uno en el pasado".
      - source: scene_3
        paragraph: 18
        text: |-
          "El alma en pena del amuleto, cierto..." dice el rey. "Bueno, este mapa en particular no es nada sofisticado. Es solo un simple hechizo de ilusión que indica la posición actual del dispositivo y la posición del núcleo, mostrándolos como puntos en un mapa tridimensional. El dispositivo fue hecho por el doctor Reidzek, por lo que las posibilidades de que no funcione correctamente deberían ser muy bajas. De todos modos, el punto es que con el Supervisor centrando su atención y la mayoría de sus fuerzas en esta plaza, y con la distracción adicional que se crea por nuestra batalla en curso contra él en el Plano Etéreo, no hay mejor momento que este para destruir su núcleo. Hadrik, con tu velocidad y fuerza, deberías poder llegar a esta ubicación en el mapa, eliminar todas las defensas restantes y destruir el núcleo en cuestión de minutos. Toda esta pelea podría terminar en cuestión de minutos, ¿entiendes lo que estoy diciendo?"

          "Está bien, lo entiendo, pero ¿qué pasa con las bolas de metal voladoras y el gigante Gólems?" Hadrik dice. "¿No podrían matarte también en minutos?"

          "Déjanos eso a nosotros", dice el rey, mientras me da una palmada en la espalda. "Barry y yo lo tenemos todo cubierto. ¿No es así, Barry?"

          "Uh, claro..." digo. "Claro, ¿por qué no?"

          "¿Ver?" el rey le dice a Hadrik. "No hay problema aquí. ¡Ahora vete! ¡Vete, antes de que el Supervisor se dé cuenta de lo que estamos haciendo!"
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch09c_environments
  - name: b3_ch09c_environments
    texts:
      - source: scene_text
        paragraph: 38
        text: |-
          "Correcto", dice Hadrik. "Nos vemos en un momento."

          Luego corre en la dirección que se muestra en el mapa holográfico y desaparece de nuestro campo de visión en unos segundos.

          "Ahora, entonces..." dice el rey, mientras se gira hacia mí. "¿Crees que puedes detener el resto de esos Gólems durante unos minutos como lo hiciste con el primero, o debería hacerlo yo?"

          "Creo que puedo manejar el Gólems", digo. "Ve a encargarte de los drones de la plaza".

          "Muy bien", dice rey del subsuelo. "Buena suerte."

          "Buena suerte para ti también", digo, y luego los dos nos separamos, volando en direcciones opuestas.

          Mientras me dirijo hacia Gólems en plano terrestre, noto que la hidra en Plano Etéreo se dirige directamente hacia mí y me veo obligado a detener lo que estaba haciendo en Ollendor para concentrarme en evadir la hidra.

          Sin embargo, los gigantes del metal se acercan cada vez más a la plaza con cada segundo que pasa. No puedo darme el lujo de ignorarlos sólo porque la hidra está atacando mi alma en un plano diferente de existencia. Si realmente quiero salir vivo de esto, entonces necesitaré encontrar una manera de controlar mi alma y mi cuerpo terrenal al mismo tiempo.
      - source: scene_text_2
        paragraph: 29
        text: |-
          Cierro los ojos mientras la hidra me persigue y trato de visualizar los entornos de Ollendor y éter. Por un lado tengo un mar interminable de luz, y por el otro, tengo el viento que me da en la cara y un montón de edificios destrozados sobre los que estoy volando.

          Cuando abra los ojos, veré ambos entornos al mismo tiempo. Podré controlar mis cuerpos desde ambos aviones al mismo tiempo. Puedo hacer esto. Puedo hacer esto.

          "¡¿Qué te pasa?!" Escucho a Peter gritándome en el Plano Etéreo. "¡Abre los ojos, tonto! ¡La hidra te está alcanzando!"

          Tan pronto como hago lo que dijo Peter, veo la hidra frente a mí, lista para darme un mordisco, pero también veo la tormenta y los edificios derrumbados en mi visión periférica. Aunque no me estoy concentrando en eso en este momento, siento que puedo cambiar sin problemas mi conciencia a mi cuerpo terrestre y luego regresar a mi alma nuevamente con solo parpadear.

          Utilizo una ráfaga de viento para alejarme de la hidra antes de que se lance hacia mí y luego parpadeo.

          Ahora estoy de vuelta en Ollendor, acercándome peligrosamente a los cuatro metales Gólems. Uno de ellos me ataca con un rayo de fuego y ruedo en el aire hacia el lado derecho, apartándome del camino a tiempo y luego continúo mi vuelo hacia ellos a gran velocidad.
      - source: scene_3
        paragraph: 19
        text: |-
          Mientras tanto, con el rabillo del ojo veo a Peter rociando la hidra con ácido en el Plano Etéreo. El monstruo rechaza el ataque, tal como lo hizo con todos los demás elementos que le lanzamos, y una vez que se regenera, comienza a perseguir a Peter. Aprovecho esta breve pausa en el Plano Etéreo para posicionarme entre dos Gólems, esperando poder engañarlos para que se destruyan disparándose sus rayos el uno al otro. Lamentablemente, los Gólems no son tan estúpidos como hubiera deseado y, en lugar de dispararme, caminan lentamente hacia mí para aplastarme entre sus palmas.

          Parpadeo de nuevo y cambio mi enfoque principal al Plano Etéreo, para poder volar más cerca de la hidra y darle una mano a Peter. Empiezo a hacer los movimientos necesarios con las manos para un hechizo de parálisis y, una vez que estoy dentro del alcance, inmediatamente lo lanzo sobre la criatura.

          Para nuestra sorpresa, el monstruo se congela en su lugar justo después de que lo golpeé con mi hechizo, y permanece así durante diez segundos, antes de que finalmente se libere. ¿Diez segundos completos de inmovilización por un hechizo diseñado para paralizar a seres de tamaño humano?... ¡Eso es increíble! Un mamut apenas habría sido detenido por más de un segundo por un hechizo como este.

          ¿Será posible que finalmente hayamos encontrado la única debilidad de la hidra?
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch09c_pillars
  - name: b3_ch09c_pillars
    routes:
      - condition: b3_ch9_hadrik = 1
        texts:
          - source: scene_text
            paragraph: 39
            text: |-
              Mientras Peter y yo nos miramos desde la distancia, solo nos toma unos momentos darnos cuenta de que ambos estamos pensando lo mismo, así que ambos asentimos brevemente y luego nos apresuramos para colocarnos en posición para lanzar un hechizo a gran escala como el que el reino etéreo probablemente nunca antes haya visto.

              Sólo hay una forma de paralizar definitivamente a un monstruo de este tamaño, y todo aquel que alguna vez haya aspirado a convertirse en generalista debería conocerla. Es uno de los hechizos favoritos del sabio Drakesbane, y escuché que lo usa habitualmente cada vez que sale a cazar dragones. Ni yo ni Peter podríamos soñar jamás con lanzar un hechizo tan complejo por nuestra cuenta, pero si trabajáramos juntos y nos sincronizáramos perfectamente, podría valer la pena intentarlo...

              "Mi rey", dice Peter, mientras los dos volamos, colocando pilares mágicos invisibles en posiciones estratégicas, para que puedan actuar como catalizadores de nuestro hechizo de parálisis a gran escala. "¿Sería posible mantener a la hidra alejada de nosotros durante unos... cincuenta segundos? Barry y yo estamos trabajando en algo importante".

              "¿Es eso así?" pregunta el rey, sorprendido. "Supongo que podría mantenerlo ocupado por un minuto más o menos, sí".

              Luego hace una caja semitransparente muy grande alrededor de la hidra, atrapándola dentro. Al darse cuenta de lo sucedido, la hidra intenta usar sus garras y colmillos para salir de la jaula del aura, pero hasta el momento no logra ningún progreso.
          - source: scene_text_2
            paragraph: 30
            text: |-
              "¿Cómo es eso?" el rey pregunta Peter.

              "¡Perfecto!" Peter dice, mientras crea otro pilar en el aire. "¿Puedes seguir atrapándolo en cajas si intenta salir teletransportar?"

              "Creo que puedo, sí", dice el rey, justo cuando la hidra se teletransporta fuera de la caja sólo para quedar atrapada en otra.

              La hidra ahora intenta lanzar llamas a las paredes semitransparentes de su recinto, pero el fuego sólo es repelido por el aura endurecida y regresa para quemar todo el contenido de la caja, incluido el monstruo de catorce cabezas.

              "Jajaja... Esa no es la manera de salir de una prisión de aura, criatura estúpida", dice el rey del subsuelo, mientras casi estalla en un ataque de risa mientras observa a la hidra retorcerse de dolor.
          - source: scene_3
            paragraph: 20
            text: Mientras estoy ocupado colocando los pilares en el Plano Etéreo, también me aseguro de parpadear de vez en cuando, para poder cambiar mi perspectiva al plano terrestre y posicionarme en un lugar donde el Gólems no pueda dispararme sin correr el riesgo de destruirme entre sí. Después de cambiar mi ubicación varias veces, de repente me doy cuenta de que es posible que me haya quedado sin lugares donde esconderme de los cuatro Gólems y que podría verme obligado a esquivar todos sus ataques muy pronto.
