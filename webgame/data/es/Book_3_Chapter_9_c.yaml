              Mientras intento ajustar mis patrones de vuelo para que sean más difíciles de adivinar, el Gólem dispara un rayo de fuego a solo unos centímetros de mí y, de repente, puedo sentir que mi corazón late dos veces más rápido que antes.

              ¿Cómo llegó tan cerca de mí? ¿Soy realmente tan predecible? ¿Qué estoy haciendo mal?

              Al darme cuenta de que muy pronto tendré que empezar a esquivar los láseres justo cuando el Gólem los dispare, empiezo a entrar en pánico un poco.

              ¿Seré lo suficientemente rápido para esquivar cada uno de sus ataques? ¿Y qué pasa con la limitada capacidad de respuesta de las corrientes? ¿Qué tanto me afectará eso cuando tenga que tomar decisiones en una fracción de segundo?

              No me lleva mucho tiempo encontrar la respuesta a mi pregunta, porque el siguiente rayo de fuego finalmente es lo suficientemente preciso como para alcanzarme, y también lo suficientemente potente como para incinerarme en un instante.
