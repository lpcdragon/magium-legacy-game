      - condition: b3_ch9_hydra = 2 AND b3_ch9_element = 0
        texts:
          - source: scene_text
            paragraph: 22
            text: |-
              "Probablemente deberíamos empezar intentando apuñalarle el corazón", digo.

              "¿Cómo apuñalarle el corazón?" Peter dice. "Por lo que he oído, cada hidra nace con su corazón en un lugar diferente, como una especie de mecanismo evolutivo de autodefensa para ayudar a proteger su única debilidad importante. Sería mucho mejor quemarla hasta morir. Técnicamente, su corazón también se destruirá de esta manera, y no tendremos que perder el tiempo buscando una aguja en un pajar".

              "Supongo que tienes razón", digo. "Entonces, ¿deberíamos quemarlo a la cuenta de tres?"

              "Simplemente sigue mi ejemplo", dice Peter. "Ustedes pueden lanzar sus hechizos tan pronto como le lance mi bola de fuego".

              Mientras Peter lanza su bola de fuego a la hidra como dijo, Flower envuelve al monstruo en una gran columna de fuego, y yo decido hacer lo mismo, usando uno de los hechizos más fuertes que me enseñó Flower. La hidra voladora comienza a gritar de dolor con la mayoría de sus cabezas, pero luego se teletransporta instantáneamente justo en frente de Flower, lanzándose hacia ella con dos de sus cuellos de Serpiente. Apenas logra alejarse usando sus chorros de fuego, pero la hidra se acerca nuevamente a ella usando sus inmensas alas para impulsarse hacia adelante.
          - source: scene_text_2
            paragraph: 16
            text: |-
              "El protocolo Supervisor olvidó mencionar que esta hidra en particular representa el pináculo de la evolución de todas las especies de hidras que han existido y existirán", dice el dron de ojos verdes. "A lo largo del tiempo, este monstruo ha desarrollado una resistencia muy alta al fuego, ha evolucionado hasta un punto en el que tiene múltiples corazones en lugar de solo uno, e incluso si le cortas todas las cabezas, simplemente volverá a crecer el doble que antes. Permíteme demostrarte".

              De repente, de la nada, una hoja giratoria muy larga viene volando directamente hacia la hidra mientras todavía estaba persiguiendo a Flower, y corta todos sus largos cuellos con facilidad. Mientras la hoja deja de girar lentamente y luego desaparece en el aire, los cuellos con forma de Serpiente se retuercen sin rumbo fijo durante unos segundos, y luego cada uno se divide en dos a medida que vuelven a crecer rápidamente, creando dos cabezas por cada una que ha sido cortada.

              "Ah, mierda..." digo, mientras la hidra ahora gira frenéticamente sus catorce cabezas, tratando de descubrir cuál de nosotros la atacó.
