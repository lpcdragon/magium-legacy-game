      - condition: b3_ch9_currents = 1 AND aura_hardening > 0 AND perception < 3 AND reflexes < 3
        texts:
          - source: scene_text
            paragraph: 36
            text: |-
              Empiezo a centrar mi conciencia en el plano terrestre y levanto los brazos, provocando que las corrientes de aire de Melindra se activen y me impulsen hacia arriba.

              Cuando llego a una mayor altitud, rápidamente me doy cuenta de que las corrientes de aire no responden en comparación con lo que suelen ser, y es casi seguro que esto se debe a la nueva versión de las corrientes que le pedí a Melindra que me lanzara antes de la batalla. Considerando que ella no está despierta para ayudarme a controlar las corrientes, solo obtengo las desventajas de este hechizo y casi ninguna de las ventajas.

              En realidad, hay una pequeña ventaja. A pesar de su falta de respuesta, al menos estas corrientes se sienten más estables que las antiguas, por lo que no tengo que preocuparme mucho de que el fuerte viento de la tormenta arruine mi dirección.

              Una vez que terminé de probar todas las maniobras básicas de vuelo, me dirijo directamente hacia el Gólem de metal que está más cerca de nosotros, con la esperanza de poder alejarlo de la plaza. Mientras todavía estoy en pleno vuelo, saco la ballesta de mi mochila y disparo algunos rayos en la cabeza del Gólem.

              "¡Ey!" Le grito al Gólem. "¡Oye, por aquí! ¡Por aquí, gran pedazo de basura!"

              Luego le disparo algunos rayos más sólo para asegurarme de captar su atención. El Gólem parece finalmente estar reaccionando ante mí, ya que ahora se da vuelta y abre la boca, listo para dispararme un rayo de fuego.
