  - name: b3_ch09c_breaks
    texts:
      - source: scene_text
        paragraph: 10
        text: |-
          "Sé que esto puede sonar un poco contrario a la intuición", digo en voz baja, "pero creo que lo mejor que podemos hacer ahora es mantener esa barrera lo más alta posible, incluso si termina rompiéndose".

          "¿Oh?" el rey del subsuelo me lo dice. "¿Por qué dices eso?"

          "Bueno", digo, "por lo que nos dijo el supervisor, parecía que las ondas de choque eran sólo un efecto secundario no deseado de su 'procedimiento experimental', y no lo que en realidad pretendía hacer. Dijo que está tratando de solucionar el problema, así que tal vez deberíamos darle algo de tiempo para hacer precisamente eso".

          "¿Estás sugiriendo que deberíamos dejar que nuestro enemigo haga exactamente lo que quiera?..." pregunta Peter.

          "Estoy diciendo que prefiero arriesgarme con cualquiera que sea su procedimiento experimental, que tener que luchar contra él mientras todavía nos está liberando esas ondas de energía", le respondo. "No hay manera de que podamos defendernos contra algo así sin los escudos de aura endurecidos".

          "¿Y después de que se rompa el escudo?" Peter dice, mientras otra onda de choque golpea la barrera invisible del rey, generando algunas grietas más. "¿Y entonces qué?"

          "Entonces tendremos a Flower teletransportándonos lejos de aquí y no regresaremos hasta que tengamos un plan adecuado", digo. "No tiene sentido seguir peleando una batalla que sabemos que no podemos ganar. O al menos creo que no tiene sentido. Todavía soy un poco nuevo en todo esto de 'tratar de no ser innecesariamente imprudente'".
      - source: scene_text_2
        paragraph: 10
        text: |-
          "Es justo", dice rey del subsuelo. "Por ahora, esperemos hasta que mi barrera ceda por completo y veremos adónde vamos a partir de ahí".

          Esperamos en silencio a que lleguen las próximas ondas de choque, mientras observamos cómo se forman más y más grietas en la barrera invisible que tenemos delante. Después de recibir dos golpes directos más de las ondas de energía del Supervisor, el escudo invisible finalmente se rompe, dejándonos completamente indefensos.

          "Está bien, eso es todo", digo. "Flower, prepárate para teletransportar nosotros en algún lugar lejano..."

          "Gracias por su paciencia", dice el Supervisor de repente, mientras los ruidos extraños que estaba haciendo hasta ahora finalmente cesan. "El problema ha sido resuelto. Los procedimientos experimentales continuarán según lo previsto."

          "Entonces, umm... sólo por curiosidad..." le digo al Supervisor, "estos procedimientos experimentales suyos no incluirían más de esas ondas de choque mortales, ¿verdad?"

          "Negativo", dice el supervisor. "Las ondas de choque desintegradoras nunca formaron parte de los procedimientos planificados originalmente".

          "¡Oye, eso es genial!" digo. "Al menos podemos estar seguros de que no habrá más escenarios de muerte instantánea desde el--"

          "Barry, ¡cuidado!" Flower grita y me teletransporta lejos, mientras un enorme rayo desintegrador que fue disparado repentinamente por el dron de ojos verdes estaba a punto de alcanzarme.
      - source: scene_3
        paragraph: 7
        text: |-
          "El protocolo Supervisor se complace en anunciar que su primera prueba del rayo desintegrador es un éxito", dice el dron de ojos verdes, una vez que termina su ataque. "Ahora comenzaremos la segunda fase de pruebas, que implicará disparar más de un rayo al mismo tiempo. Para garantizar las condiciones de prueba más óptimas, permanezca estacionario para que los drones puedan alcanzarlo más fácilmente. Gracias de antemano por su continua cooperación".

          Mientras el Supervisor dice esto, unas pocas docenas de drones de ojos rojos aparecen de la nada a lo largo del éter, rodeándonos por completo. Rápidamente uso mis corrientes de aire para esquivar uno de sus rayos desintegradores y luego destruyo dos de los drones con un hechizo de relámpago, para poder volar más allá de ellos.

          "¡Todos a dispersarse!" Les grito a los demás mientras salgo del perímetro que rodeaban los drones. "¡Necesitamos dividir la atención del Supervisor tanto como podamos! ¡Y no dejes de moverte ni por un momento!"

          "Ya sabemos lo que tenemos que hacer", dice Peter, mientras elimina cuatro drones él solo con un hechizo de hielo y luego se aleja volando de sus otros atacantes. "Ninguno de nosotros nació ayer".

          "Correcto", digo, mientras veinte drones se materializan de repente a mi alrededor, bloqueando todas mis posibles vías de escape.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch09c_researched
  - name: b3_ch09c_researched
    routes:
      - condition: b3_ch9_element = 0
        texts:
          - source: scene_text
            paragraph: 11
            text: |-
              Justo cuando las bolas de metal voladoras están a punto de disparar sus rayos, desato una poderosa ola de fuego que abarca toda el área a mi alrededor. Los drones de ojos rojos no tienen tiempo de reaccionar y se convierten fácilmente en chatarra en llamas, que luego continúa flotando en su lugar, porque no hay fuerza en este reino para hacerlo caer.

              Ja. ¡Lo sabía! ¡Sabía que pedirle a Flower que me enseñara un hechizo que pudiera lidiar con una gran cantidad de drones a la vez sería una buena idea!

              Bien, eso debe haberme ganado unos segundos para pensar, al menos. A ver si se me ocurre un plan o algo así.

              Mientras miro a mi alrededor para ver cuál es la situación en el campo de batalla, diferentes pensamientos pasan por mi cabeza a muy alta velocidad. ¿Cómo trato con esto? ¿Puedo disipar la desintegración? No, no, no, estos rayos que nos disparan los drones son completamente negros. Es como si se estuvieran tragando toda la luz que los rodea. No creo que este tipo de efecto pueda lograrse ni siquiera en plano terrestre. He leído toneladas de artículos de académicos que han investigado la desintegración en el pasado, y la mayoría de ellos estuvieron de acuerdo en que tal hechizo sólo debería ser posible en entornos ideales que no pueden crearse en un plano material de existencia.
          - source: scene_text_2
            paragraph: 11
            text: |-
              Pero ¿qué pasa con la teoría detrás de este hechizo? ¿No había algún tipo de debilidad que pudiera explotar? Había tantos detalles escritos en esos artículos... Tenía que haber algo que pudiera utilizar. ¡Si pudiera recordarlo!

              Mientras me devano los sesos tratando de encontrar una solución, noto que Peter hace algo muy peculiar en segundo plano. A diferencia del resto de nosotros, que principalmente intentamos evadir los ataques de los drones o intentar destruirlos, Peter parece estar más centrado en los propios rayos que se desintegran. Parece estar esperando el momento exacto en que un dron lo ataca, y luego intenta colocar una bola de fuego frente al rayo negro, mientras se mueve hacia un lado para evitar ser golpeado.

              Cuando me doy cuenta de lo que está haciendo, mi cerebro se ve inmediatamente inundado por un enjambre de información que, de otro modo, habría considerado olvidada para siempre. Ahora entiendo lo que está tratando de hacer. Sé exactamente qué teoría intenta probar, pero... lo está haciendo mal. Tengo que contarle sobre esto.

              "Peter, no puedes hacer que el fuego entre en el rayo de esa manera", digo en voz alta, mientras esquivo otro rayo en desintegración proveniente de un dron que estaba cerca de mí. "¡Recuerden lo que dijo Krygell en su artículo! La única manera en que el experimento puede funcionar, en teoría, es si hay alguna manera de proteger el fuego de los efectos de la desintegración hasta que sea engullido por el rayo completamente. De lo contrario, los bordes del rayo negro simplemente lo reducirían a nada."
          - source: scene_3
            paragraph: 8
            text: |-
              "¿Has... leído el artículo del profesor Krygell?..." me pregunta Peter, sorprendido.

              "Sí, pero ese no es el punto", digo, mientras vuelo alrededor, esquivando rayos que se desintegran a izquierda y derecha. "Me acabo de dar cuenta de que hay una manera de hacer que esto funcione, pero todos debemos trabajar juntos".

              "¿Qué quieres decir?" Peter dice, mientras destruye dos drones más, pero luego otros dos aparecen de la nada para ocupar su lugar.

              "Lo único en lo que todos los eruditos estuvieron de acuerdo cuando hablaron de desintegración fue que las auras son, con diferencia, las más resistentes a ella", digo. "Ya hemos visto qué tan bien la barrera de aura endurecida de rey del subsuelo podría resistir esa onda de choque de antes, y también tenemos a Flower, que es etérea y elementalista de fuego, por lo que sería la candidata perfecta para un experimento como este, gracias a la enorme cantidad de control que tiene sobre sus llamas. Si tú y yo podemos mantener a los otros drones alejados de ellos mientras tanto, es posible que puedan lograrlo, ¡pero tenemos que darnos prisa!"
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch09c_feasible
      - condition: b3_ch9_element = 1
        texts:
