  - name: b3_ch09c_feasible
    texts:
      - source: scene_text
        paragraph: 15
        text: |-
          "Peter, ¿te parece factible este plan suyo?" pregunta el rey del subsuelo, mientras también destruye algunos drones con sus técnicas de aura.

          "Lo... lo hace... mi señor", dice Peter.

          "Entonces eso es lo que haremos", dice el rey. "Flower, confío en que hayas entendido lo que debes hacer".

          "Um... sí", dice Flower, algo confundido. "Haz una bola de fuego e intenta meterla dentro de uno de los rayos negros. Yo puedo hacerlo".

          "Entonces hazlo", dice el rey. "Protegeré tus llamas con mi técnica de manipulación del aura tan pronto como las crees".

          "¡Entendido!" Flower dice, y luego crea sus llamas frente a ella, esperando que un dron la ataque.

          "Mata a todos los drones que no estén directamente frente a ella", le digo a Peter, mientras vuelo hacia Flower y comienzo a destruir varios drones con mis hechizos. "Ella necesita mantener toda su atención en sus llamas".
      - source: scene_text_2
        paragraph: 12
        text: |-
          Mientras Peter y yo estamos ocupados luchando contra los drones, Flower y rey del subsuelo logran colocar la bola de fuego protegida por aura exactamente en el camino de uno de los rayos desintegrados entrantes. Justo cuando el rayo negro envuelve las llamas por completo, el rey cancela su escudo de aura endurecido y las llamas rápidamente comienzan a absorber la energía negra del rayo desde el interior, hasta que lo único que queda es una bola de fuego negro puro, como nunca he visto.

          "Llamas negras..." dice Peter mientras mira la bola de fuego negra, con asombro. "Entonces, se puede hacer..."

          "Flower", digo. "Lanza esas llamas tuyas al dron de ojos verdes, ¿quieres? Eso debería llamar su atención".

          Cuando el dron de ojos verdes ve las llamas negras que se dirigen en su dirección, inmediatamente coloca cinco drones de ojos rojos en línea recta frente a él para que puedan bloquear el ataque entrante. Sin embargo, esta estrategia no da ningún resultado, porque las llamas simplemente atraviesan las bolas de metal y las destruyen instantáneamente con solo tocarlas.
      - source: scene_3
        paragraph: 9
        text: |-
          "¡Advertencia! ¡Advertencia! ¡Advertencia!" dice el dron de ojos verdes, mientras comienza a volar en círculos, mientras es perseguido por el fuego negro de Flower. "Los niveles de peligro han superado todos los umbrales aceptables y, por lo tanto, el primer procedimiento experimental debe cancelarse prematuramente. Debido a circunstancias imprevistas, comenzaremos el segundo procedimiento experimental antes de lo previsto".

          "¿Segundo procedimiento experimental?..." digo. "¿Qué segundo experimento--"

          De repente, la bola de fuego de Flower vuelve a su color naranja normal, mientras los drones de ojos rojos desaparecen, y ahora un círculo de invocación azul muy grande comienza a formarse debajo de nosotros.

          "Oh, no", digo, mientras todos nos alejamos de la luz azul que rápidamente comienza a envolver el área. "Oh no, no, no... Por favor, dime que este no será otro mamut de ojos rojos".
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch09c_materialize
  - name: b3_ch09c_materialize
    texts:
      - source: scene_text
        paragraph: 16
        text: |-
          Mi pregunta recibe respuesta muy pronto, cuando una monstruosidad de doce metros de altura comienza a materializarse lentamente frente a nosotros. Mientras lo miro detenidamente, me doy cuenta de que me faltan palabras para describirlo, porque nunca antes había visto algo así. ¿Qué se supone que es exactamente? ¿Una hidra voladora? ¿Un dragón de siete cabezas?

          No tiene patas, como las tendría un dragón, pero las alas son exactamente como las de un draco y todas sus cabezas tienen diferentes colores. Los colores son rojo, verde, amarillo, azul oscuro, azul claro, blanco y marrón. En realidad, ahora que lo miro mejor, no son sólo las cabezas las que tienen estos colores, sino la totalidad de las criaturas con forma de Serpiente que salen del cuerpo principal, mientras que el cuerpo en sí tiene un tinte más rojo claro.

          He investigado muchas criaturas antes de unirme a este torneo, tanto míticas como no míticas, y estoy bastante seguro de que nunca surgió nada parecido a esto durante mis estudios. ¿Podría ser esta la creación original del Supervisor?

          "Experimento número dos", dice el Supervisor. "En este momento estás viendo un ser que tenía el potencial de existir en el plano terrestre pero nunca llegó a existir, debido a una multitud de factores desafortunados. No tiene nombre oficial, por lo que puedes llamarlo como quieras. Si sobrevives al experimento, al protocolo del Supervisor le gustaría mucho escuchar tus impresiones de primera mano sobre la criatura, ya que la información sería particularmente valiosa".
      - source: scene_text_2
        paragraph: 13
        text: |-
          "¿Oh sí?" digo. "Bueno, ¿qué tal si tomas tu información y la metes en tu... cuenca del ojo verde... o cualquier otra cosa que tenga sentido en este contexto ya que en realidad no tienes un--"

          No tengo tiempo para terminar mi frase, ya que una de las cabezas de la hidra lanza fuego en mi dirección y me veo obligado a apartarme de su camino. Inmediatamente después, una de las otras cabezas dispara un rayo de hielo por su boca, lo que obliga a Flower a volar también.

          Mientras miraba la hidra voladora, no pude evitar notar que el fuego salía de la cabeza roja, mientras que de la cabeza salía hielo con un color celeste. También está el hecho de que la cantidad de cabezas que tiene la hidra es exactamente la misma que la cantidad de elementos mágicos que existen en el mundo, si se cuentan también los no tradicionales como el ácido, el hielo y la electricidad. Seguramente esto no puede ser una coincidencia, ¿verdad?...

          "Chicos, no estoy seguro de que ya lo hayan descubierto, pero lo diré de todos modos, por si acaso", digo. "Creo que cada una de las cabezas de esta hidra podría representar un elemento diferente, y que deberíamos poder decir cuál es cuál por sus colores".
      - source: scene_3
        paragraph: 10
        text: |-
          "Creo que quizás tengas razón", dice Peter, mientras mira con mucha atención a la hidra de siete cabezas que en este momento nos mira amenazadoramente. "Si nos guiamos por la lógica simple, supongo que el azul oscuro significa agua, el blanco significa aire, el verde significa ácido, eh... amarillo significa..."

          "El amarillo probablemente sea un rayo", digo. "Ya vimos lo que son el rojo y el azul claro, así que sólo queda el marrón como la tierra".

          "¿Una cabeza de hidra que respira tierra?..." dice Peter. "¿Qué clase de tontería es esta?"

          "Mira, no importa si respira tierra o no", le digo. "Lo importante es que probablemente estará haciendo algo relacionado con la Tierra. Y ahora que sabemos todo esto, debería ser más fácil combatirlo, ya que ya sabemos cuáles son las debilidades de una hidra. Si es como una hidra normal, entonces podríamos intentar cortarle todas las cabezas a la vez, quemarla con fuego o apuñalarle el corazón. Con suerte, cualquiera de estas opciones debería funcionar, pero probablemente deberíamos limitarnos a una sola por ahora".
    choices:
