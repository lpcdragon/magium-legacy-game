  - name: b3_ch09c_upwards
    effects:
      - set:
          ac_b3_ch9_consolation: ac_b3_ch9_consolation + 1
        condition: b3_ch9_currents = 1 AND perception < 3 AND is_dead = 0 AND reflexes < 3
    routes:
      - condition: b3_ch9_currents = 0
        texts:
          - source: scene_text
            paragraph: 34
            text: |-
              Empiezo a centrar mi conciencia en el plano terrestre y levanto los brazos, provocando que las corrientes de aire de Melindra se activen y me impulsen hacia arriba.

              El fuerte viento de la tormenta me está dando muchos problemas con mis maniobras, tal como esperaba, pero al menos todavía conservo el control total de las corrientes mágicas. No puedo imaginar lo malo que habría sido esto si le hubiera dicho a Melindra que lanzara la versión de las corrientes en las que ella necesitaba estar despierta para ayudarme a controlarlas.

              Antes de dirigirme al Gólem, vuelo alrededor durante unos veinte segundos, tratando de ver exactamente qué tan bien puedo manejarme en esta tormenta. Como dijo Melindra, esto no se siente muy diferente a volar un avión en un huracán. De hecho, creo que incluso podría ser un poco más fácil, porque las corrientes de aire responden mucho más que los controles de un artilugio volador gnomo.

              Una vez que terminé de probar todas las maniobras básicas de vuelo, me dirijo directamente hacia el Gólem de metal que está más cerca de nosotros, con la esperanza de poder alejarlo de la plaza. Mientras todavía estoy en pleno vuelo, saco la ballesta de mi mochila y disparo algunos rayos en la cabeza del Gólem.

              "¡Ey!" Le grito al Gólem. "¡Oye, por aquí! ¡Por aquí, gran pedazo de basura!"

              Luego le disparo algunos rayos más sólo para asegurarme de captar su atención. El Gólem parece finalmente estar reaccionando ante mí, ya que ahora se da vuelta y abre la boca, listo para dispararme un rayo de fuego.
          - source: scene_text_2
            paragraph: 23
            text: |-
              Empiezo a volar erráticamente, para que al gigante de metal le resulte más difícil anticipar mis movimientos. El Gólem dispara un rayo hacia mí, y luego otro, y luego otro, fallando cada vez, pero también acercándose con cada disparo consecutivo. ¿Está empezando a predecir mis movimientos?... Quizás no estoy volando lo suficientemente al azar.

              Mientras intento ajustar mis patrones de vuelo para que sean más difíciles de adivinar, el Gólem dispara un rayo de fuego a solo unos centímetros de mí y, de repente, puedo sentir que mi corazón late dos veces más rápido que antes.

              ¿Cómo llegó tan cerca de mí? ¿Soy realmente tan predecible? ¿Qué estoy haciendo mal?

              Al darme cuenta de que muy pronto tendré que empezar a esquivar los láseres justo cuando el Gólem los dispare, empiezo a entrar en pánico un poco.

              ¿Seré lo suficientemente rápido para esquivar cada uno de sus ataques?

              Si me quedara quieto ahora y solo me apartara del alcance del rayo en el último segundo cuando el Gólem me dispara, ¿podría hacerlo?

              Cuando logro evadir por muy poco otro rayo de fuego, de repente obtengo la respuesta a mi pregunta. Según la velocidad del rayo y la distancia entre mi enemigo y yo, diría que debería tener el tiempo suficiente para evitar sus próximos ataques, siempre que su algoritmo de predicción de ruta no mejore mucho de lo que ya es.
          - source: scene_3
            paragraph: 15
            text: |-
              En lugar de darle al Gólem más patrones de movimiento para estudiar, decido dejar de volar y simplemente mirarlo fijamente, esperando que me ataque.

              "¡Oye, estoy aquí!" Le grito al Gólem. "No me muevo. ¿Vas a dispararme o qué?"

              Después de unos segundos de silencio, el Gólem me dispara su rayo y me aparto del camino en el último momento posible. Afortunadamente, mis corrientes de aire responden extremadamente, por lo que pude realizar mi truco perfectamente. Habiendo evadido con éxito el ataque, me detengo en el aire nuevamente, para poder burlarme un poco más del Gólem.

              "¡Casi lo consigues, amigo!" Le digo al gigante del metal. "¿Por qué no lo intentas de nuevo? Estoy seguro de que lo conseguirás la próxima vez".

              Una vez más el Gólem me dispara con su rayo de fuego pero lo evado fácilmente, justo cuando estaba a punto de golpearme. Al ver que mi enemigo ha dejado de intentar apuntar hacia mí y simplemente está parado allí, confundido, me cruzo de brazos y luego los dos comenzamos a simplemente mirarnos, en completo silencio. Nuestro pequeño concurso de miradas continúa por un tiempo más, hasta que veo una forma pequeña pero familiar en el suelo acercándose al Gólem a una velocidad impresionante.
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch09c_holographic
                condition: is_dead = 0
      - condition: b3_ch9_currents = 1 AND perception >= 3
        texts:
          - source: scene_text
            paragraph: 35
            text: |-
              Empiezo a centrar mi conciencia en el plano terrestre y levanto los brazos, provocando que las corrientes de aire de Melindra se activen y me impulsen hacia arriba.

              Cuando llego a una mayor altitud, rápidamente me doy cuenta de que las corrientes de aire no responden en comparación con lo que suelen ser, y es casi seguro que esto se debe a la nueva versión de las corrientes que le pedí a Melindra que me lanzara antes de la batalla. Considerando que ella no está despierta para ayudarme a controlar las corrientes, solo obtengo las desventajas de este hechizo y casi ninguna de las ventajas.

              En realidad, hay una pequeña ventaja. A pesar de su falta de respuesta, al menos estas corrientes se sienten más estables que las antiguas, por lo que no tengo que preocuparme mucho de que el fuerte viento de la tormenta arruine mi dirección.

              Una vez que terminé de probar todas las maniobras básicas de vuelo, me dirijo directamente hacia el Gólem de metal que está más cerca de nosotros, con la esperanza de poder alejarlo de la plaza. Mientras todavía estoy en pleno vuelo, saco la ballesta de mi mochila y disparo algunos rayos en la cabeza del Gólem.

              "¡Ey!" Le grito al Gólem. "¡Oye, por aquí! ¡Por aquí, gran pedazo de basura!"

              Luego le disparo algunos rayos más sólo para asegurarme de captar su atención. El Gólem parece finalmente estar reaccionando ante mí, ya que ahora se da vuelta y abre la boca, listo para dispararme un rayo de fuego.
          - source: scene_text_2
            paragraph: 24
            text: |-
              Empiezo a volar erráticamente, para que al gigante de metal le resulte más difícil anticipar mis movimientos. El Gólem dispara un rayo hacia mí, y luego otro, y luego otro, fallando cada vez, pero también acercándose con cada disparo consecutivo. ¿Está empezando a predecir mis movimientos?... Quizás no estoy volando lo suficientemente al azar.

              Mientras intento ajustar mis patrones de vuelo para que sean más difíciles de adivinar, el Gólem dispara un rayo de fuego a solo unos centímetros de mí y, de repente, puedo sentir que mi corazón late dos veces más rápido que antes.

              ¿Cómo llegó tan cerca de mí? ¿Soy realmente tan predecible? ¿Qué estoy haciendo mal?

              Al darme cuenta de que muy pronto tendré que empezar a esquivar los láseres justo cuando el Gólem los dispare, empiezo a entrar en pánico un poco.

              ¿Seré lo suficientemente rápido para esquivar cada uno de sus ataques? ¿Y qué pasa con la limitada capacidad de respuesta de las corrientes? ¿Qué tanto me afectará eso cuando tenga que tomar decisiones en una fracción de segundo?

              Cuando logro evadir por muy poco otro rayo de fuego, de repente me doy cuenta de que el Gólem había estado inclinando su cabeza ligeramente hacia un lado cada vez, justo antes de atacarme. ¿Cómo no me di cuenta de esto hasta ahora?
          - source: scene_3
            paragraph: 16
            text: |-
              Usando esta nueva información que he aprendido, sigo volando de la misma manera que lo hacía normalmente por un tiempo más, pero tan pronto como veo al Gólem inclinando su cabeza, inmediatamente me lanzo en la dirección opuesta. El gigante de metal se confunde con esto e intenta apuntarme una vez más, pero tan pronto como vuelve a inclinar la cabeza, rápidamente cambio de dirección, dejando al pobre Gólem en un estado aún más perplejo que antes.

              Después de repetir exactamente estos mismos movimientos unas cuantas veces más, el Gólem comienza a quedarse ahí, sin hacer nada, probablemente porque está tratando de entender por qué su impecable algoritmo de predicción de ruta ya no funciona como se esperaba. Esta competencia de miradas entre nosotros continúa por un tiempo más, hasta que veo una forma pequeña pero familiar en el suelo acercándose al Gólem a una velocidad impresionante.
        effects:
          - set:
              successful_checks:
                - '[ Comprobación de observación exitosa - nivel 3 ]'
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch09c_holographic
                condition: is_dead = 0
