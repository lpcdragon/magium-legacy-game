              "Flower, Illuna y yo nos ocuparemos de los guivernos", dice Kate. "El resto no pueden volar, así que no podrán ayudarnos. Creo que todos deberían ir a ocuparse de los magos antes de que pidan más refuerzos."

              "Puede que tengas razón", dice Daren. "Al menos los hemos obligado a revelar el as bajo la manga, así que no deberían poder sorprendernos con nada más... ¡¡¡MALDITA SEA!!!"

              Mientras Daren terminaba la frase, apareció en el suelo un círculo azul enorme en la zona que nos rodea, y una tenue luz azul empezó a envolvernos lentamente.

              "¡Salgan del círculo de invocación!", grita Daren. "¡Fuera, ahora!"
