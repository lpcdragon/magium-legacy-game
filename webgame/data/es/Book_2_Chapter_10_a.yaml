      - source: scene_text_2
        paragraph: 24
        text: |-
          Cuando saco la bolsa de oro del bolsillo y la abro, me doy cuenta de que también llevo unas cuantas gemas dentro. Si les enseño a estos orcos solo el oro, lo más probable es que no consiga comprarlos, pero una sola de estas gemas les bastaría para vivir el resto de sus vidas sin preocupaciones.

          Decido sacar un gran rubí de la bolsa y sostenerlo delante de los orcos para que puedan verlo bien.

          "Tengo muchas más de estas en mi mochila", digo, "así que no me importaría desprenderme de una o dos a cambio de una alianza temporal. Estoy dispuesto a ofrecerles a los dos este rubí por adelantado y, si de verdad me ayudan haciendo retroceder a los otros orcos, también les daré un brillante diamante para acompañarlo. ¿Qué dicen?"

          "Tu oferta es tentadora, humano", dice el segundo orco, sin ser capaz de ocultar del todo la codicia de sus ojos. "Pero ¿qué haríamos los orcos con semejante tesoro? ¿Dónde más viviríamos nuestras vidas, si no es en el dominio de Tyrath? No es como si alguna ciudad humana fuera a aceptarnos jamás dentro de sus murallas."
        condition: ch10_gems = 1
      - source: scene_3
        paragraph: 12
        text: |-
          "He oído que Fyron está acogiendo refugiados", digo. "Sí saben quién es Fyron, ¿verdad?"

          "¿El general goblin?", pregunta el orco con voz pensativa. "Sí... sí que sé quién es. He oído que su campamento ha ido mejorando estos últimos años. También oí que ahora acepta a todo tipo de monstruos, no solo a goblins. Quizá no sería tan mala idea ir a hacerle una visita..."

          "¿Te das cuenta de lo que estás diciendo?", dice el primer orco, horrorizado. "¡Eso es traición!"

          "¿Ah, sí?", dice el segundo orco. "Tyrath apenas nos da dinero suficiente para pagar la comida y las armas. ¿Por qué le eres tan leal? Si aceptamos la oferta de este humano, ¡podríamos vivir como reyes! Piénsalo, hermano."
        condition: ch10_gems = 1
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch10a_bribe2
            condition: ch10_gems = 1
          - set:
              current_scene: b2_ch10a_wyverns
            condition: ch10_gems = 0
  - name: b2_ch10a_bribe2
    texts:
      - source: scene_text
        paragraph: 24
        text: |-
          "Tú no eres hermano mío", dice el primer orco con puro odio en los ojos, y se lanza en picado hacia su antiguo compañero con la lanza apuntándole al corazón.

          El segundo orco consigue elevarse en el aire antes de que el otro lo alcance y le clava la lanza en el pecho a su camarada, haciéndolo caer de su guiverno hacia la muerte.

          "Que este sea el primer sacrificio por nuestra alianza, humano", dice el orco superviviente mientras alza en el aire su lanza ensangrentada.

          "Aquí tienes un rubí por las molestias", digo, mientras le lanzo el rubí que tenía antes en la mano, y el orco atrapa la gema con ambas manos. "Como prometí, también te daré un diamante cuando los demás orcos estén muertos."

          "¡Traidor!", grita otro orco desde el aire, mientras también se lanza con su guiverno hacia nosotros en un intento de ensartar con su lanza a su antiguo aliado.

          El orco traidor no espera a que el adversario llegue hasta él y vuela hacia arriba, hundiendo la lanza en el pecho del guiverno enemigo, lo que hace que la bestia deje de batir las alas y se precipite al suelo junto con su jinete, matándolos a los dos.
      - source: scene_text_2
        paragraph: 25
        text: |-
          "¿Qué está pasando aquí?", grita Kate desde la distancia al ver lo que acaba de ocurrir.

          "Este orco está luchando de nuestro lado a partir de ahora", les grito a ella y a Flower. "¡Asegúrense de no atacarlo!"

          "Vale...", dicen Kate e Illuna al mismo tiempo, y luego continúan combatiendo a sus enemigos en el cielo.

          "Ahora voy a ocuparme del mamut", le digo a mi nuevo aliado orco. "Ya sabes lo que tienes que hacer."

          Dejo entonces atrás al orco y desciendo volando hasta una altitud menor, más cerca del mamut, con el que Hadrik y los demás siguen todavía enfrascados.
    effects:
      - set:
          ac_b2_ch10_creative: 1
        achievement:
          id: ac_b2_ch10_creative
          title: Una solución creativa
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch10a_trample
  - name: b2_ch10a_riders
    routes:
      - condition: combat_technique < 3
        texts:
          - source: scene_text
            paragraph: 25
            text: |-
              No dejo que los jinetes de guiverno se acerquen demasiado e imito un salto en la dirección hacia la que quiero ir, lo que me hace salir disparado lejos de mis enemigos a gran velocidad. Luego giro el cuerpo hacia arriba y empiezo a mover las piernas en círculos, igual que si intentara mantenerme a flote en un lago estando en posición vertical. Eso frena mi impulso y cambia mi dirección, permitiéndome encarar bien a mis enemigos.

              Es una suerte que pueda controlar en gran medida mi dirección y velocidad sin usar los brazos, porque eso me permite utilizar la ballesta en pleno vuelo. También me he dado cuenta de que las habilidades que adquirí al pilotar aeronaves en el pasado están resultando muy útiles a la hora de controlar este tipo de hechizos de vuelo. Probablemente me habría llevado mucho más tiempo acostumbrarme a volar así si nunca hubiera pilotado un avión.

              Apunto el arma hacia uno de los orcos y empiezo a dispararle mientras sigo ocupado intentando salir del alcance de sus lanzas.
          - source: scene_text_2
            paragraph: 26
            text: |-
              Por desgracia, apuntar a blancos que se mueven muy rápido mientras yo también voy volando no es tan fácil como parece. De alguna manera, consigo malgastar todos mis disparos y no me da tiempo a recargar. Intento superar en maniobrabilidad a los guivernos para colocármelos encima y atacar directamente a los jinetes, pero el hechizo de vuelo que me ha proporcionado Melindra no es ni lo bastante rápido ni lo bastante sensible como para que pueda compararme con estas criaturas que llevan volando desde que tienen memoria.

              Intento desviar una de las lanzas del orco y lanzarme sobre él, pero el segundo jinete de guiverno aprovecha mi distracción momentánea y clava su lanza en mi estómago, inmovilizando temporalmente mis movimientos por el dolor. Mientras sigo allí quieto, flotando en el aire, el orco saca rápidamente la lanza de mi cuerpo y me la clava en la garganta, matándome unos instantes después.
