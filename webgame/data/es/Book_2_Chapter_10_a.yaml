  - name: b2_ch10a_trample
    routes:
      - condition: b2_ch10_bribe = 2 AND ch10_gems = 1
        texts:
          - source: scene_text
            paragraph: 27
            text: |-
              Parece que, mientras yo estaba ocupado con los guivernos, el mamut ha cambiado de táctica y ahora está intentando pisotear a Daren y a Nolderan en lugar de centrarse en Hadrik, como antes. Sin embargo, los dos encantadores han conseguido hacer bastante daño a las patas del monstruo mientras yo no miraba, lo que ha reducido mucho la velocidad de la criatura. Al ver que Daren, Nolderan y Leila son perfectamente capaces de esquivar sus embestidas con facilidad, el mamut se ve obligado a volver a centrar su atención en Hadrik, que sigue machacando al monstruo pese a toda la paliza que se ha llevado en esta pelea.

              A medida que me acerco a mi destino, imito un salto en la dirección hacia la que quiero ir, lo que me hace salir disparado hacia la criatura a gran velocidad. Luego giro el cuerpo hacia arriba y empiezo a mover las piernas en círculos, igual que si intentara mantenerme a flote en un lago estando en posición vertical. Eso frena mi impulso y cambia mi dirección, de modo que puedo situarme justo encima del mamut, listo para atacar en cuanto se presente la oportunidad.

              Es una suerte que pueda controlar en gran medida mi dirección y velocidad sin usar los brazos, porque eso me permite también utilizar la ballesta en pleno vuelo. También me he dado cuenta de que las habilidades que adquirí al pilotar aeronaves en el pasado están resultando muy útiles a la hora de controlar este tipo de hechizos de vuelo. Probablemente me habría llevado mucho más tiempo acostumbrarme a volar así si nunca hubiera pilotado un avión.

              Bien entonces... ¿A cuál de los puntos débiles del mamut debería apuntar?... ¿A los ojos? ¿O a los orificios nasales de la parte inferior de la trompa?
        choices:
          - position: 1
            text: Atacar los ojos
            effects:
              - set:
                  current_scene: b2_ch10a_plan
                  b2_ch10_weakpoint: 0
          - position: 2
