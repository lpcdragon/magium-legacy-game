  - name: b2_ch10a_bribe
    texts:
      - source: scene_text
        paragraph: 23
        text: |-
          "¡Esperen!", les digo a los orcos mientras se acercan a mí. "Ustedes pueden hablar el idioma común, ¿verdad? No hace falta que estemos luchando entre nosotros. ¡Quizá podamos llegar a un acuerdo!"

          "¡No hacemos tratos con humanos!", dice uno de los orcos. "Solo servimos a Tyrath."

          Entonces intenta ensartarme con la lanza, pero me lanzo fuera de su alcance y vuelvo a intentar razonar con él.

          "¿Solo Tyrath?", digo. "¿Y si les diera más dinero que el dragón? ¿Eso no podría hacerles cambiar de idea?"

          "¡Nuestra lealtad hacia el rey dragón no puede quebrarse con meras promesas de riqueza!", dice el orco, furioso.

          "Espera un momento", dice el otro orco. "¿De cuánto oro estamos hablando exactamente?"
      - source: scene_text_2
        paragraph: 23
        text: |-
          Saco la bolsa de oro del bolsillo y le enseño al orco las monedas que llevo dentro. El monstruo se ríe al ver la cantidad que le estoy ofreciendo.

          "¿Esperas que traicionemos a nuestro gobernante por esta mísera cantidad de oro?", dice el orco.

          "Es todo el oro que tengo", le digo. "Pero tampoco es un trato tan malo, ¿no? ¡Déjennos en paz un rato y será suyo!"

          "No, humano, ya he oído suficiente de tu 'trato'", dice el orco. "Ven, hermano. Acabemos con este insolente gusano."

          Los dos guivernos vuelven a lanzarse en picado hacia mí mientras sus jinetes preparan las lanzas.
        condition: b2_ch5_scimitar != 2 AND ch3_treasure = 0 AND ch10_gems = 0 AND b2_ch6_crossbow = 1
