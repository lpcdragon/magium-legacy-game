              Illuna le frunce el ceño al amuleto, pero no dice nada.

              "Creo que quizá esté diciendo la verdad", dice Melindra. "Sus niveles de poder me parecen tal y como ella los ha descrito."

              "Sigo pensando que está ocultando algo", dice Illuna. "Pero supongo que no averiguaremos exactamente qué es hasta que lleguemos a nuestro destino y lo veamos por nosotros mismos. Alcancemos a los demás. Estamos empezando a parecer un poco sospechosos."
