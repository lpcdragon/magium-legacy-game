  - name: b2_ch10a_plan
    routes:
      - condition: b2_ch10_weakpoint = 0
        texts:
          - source: scene_text
            paragraph: 29
            text: |-
              Los ojos deberían ser más fáciles de alcanzar, así que iré a por ellos. Sé que se supone que los párpados son muy gruesos, pero, en serio, ¿cuánto pueden resistir? Unos cuantos virotes de ballesta deberían bastar de sobra.

              Cuando desciendo un poco la altitud, me doy cuenta de que Hadrik está agarrado a la trompa del mamut mientras el monstruo no deja de moverla arriba y abajo, intentando que pierda el agarre y se caiga.

              "¡Eh, Barry! ¿Ahora puedes volar?", me grita Hadrik, aún aferrado a la trompa.

              "Por ahora...", le grito de vuelta.

              "¡Genial!", grita Hadrik. "¡Entonces quizá podamos trabajar juntos en esto! Yo sujetaré la trompa del mamut y tú le apuñalarás los ojos. ¿Qué te parece?"

              Mientras Hadrik habla, la intensidad de su voz no deja de fluctuar, dado que la trompa lo lleva continuamente arriba y abajo a gran velocidad.

              "Suena bien", le grito. "Pero ¿cómo piensas inmovilizar la trompa?"
          - source: scene_text_2
            paragraph: 30
            text: |-
              "No te preocupes", dice Hadrik. "Eso ya lo tengo cubierto."

              Entonces se suelta de la trompa y aterriza en el suelo.

              "Solo tienes que mantener ocupado al mamut unos segundos mientras hago un cambio de forma", grita Hadrik.

              ¿Un cambio de forma?... ¿Contra un mamut de ojos rojos? ¿No dijo Golmyck que lo expulsaría del torneo si se convertía en algo mucho más grande que su tamaño actual?

              No tengo tiempo de pensar mucho más en eso, porque el mamut está ahora totalmente centrado en aplastarme con la trompa y apenas me deja un respiro entre dos golpes consecutivos. Cuando el monstruo se fatiga un poco y reduce el ritmo, aprovecho la oportunidad para mirar hacia abajo y ver qué ha estado haciendo Hadrik.

              Al parecer, Hadrik se ha convertido en un caracol gigante... Y se limita a arrastrarse por el suelo a una velocidad ridículamente baja... Joder, más vale que no me esté tomando el pelo ahora mismo. En cualquier caso, ya le dije a Hadrik que seguiría su plan, así que lo único que puedo hacer ahora es seguir esquivando y confiar en que sepa lo que hace.
          - source: scene_3
            paragraph: 13
            text: Después de apartarme de la trompa unas cuantas veces más, me doy cuenta de que Hadrik por fin ha terminado con su cambio de forma y ha vuelto a su forma de enano, plantado con los pies sobre la baba que dejó su forma de caracol. Tiene los brazos alzados y me está mirando directamente.
            condition: b2_ch10_toast = 0
