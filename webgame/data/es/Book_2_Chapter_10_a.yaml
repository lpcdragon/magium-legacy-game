    routes:
      - condition: b2_ch10_traps = 0
        texts:
          - source: scene_text
            paragraph: 45
            text: |-
              "Oye, Barry", dice Kate. "Hay algo que olvidé preguntarte. ¿Cómo conseguiste lanzarte antes ese hechizo de vuelo? ¿Fue con ayuda de tu dispositivo de estadísticas?"

              En cuanto Kate termina la pregunta, veo a Melindra justo detrás de ella, mirándome fijamente con una expresión amenazadora en los ojos.

              "Eh...", digo. "Sí, eso es. Fue el dispositivo de estadísticas."

              "¿Así que por fin has conseguido desbloquear tus estadísticas mágicas?", dice Kate.

              "No, solo fue temporal, igual que las dos últimas veces", digo. "Probablemente los magos monstruo cometieron un error al lanzar el ritual y dejaron escapar un poco demasiada energía hacia mí."

              "Ah, ya veo...", dice Kate, algo decepcionada.

              "Entonces, maestro Nolderan, ¿cómo llegaste a conocer a esos aliados tuyos?", dice Daren.

              "Oh, en su mayoría son gente que he conocido haciendo trabajo de mercenario", dice Nolderan. "Nuestro grupo es bastante diverso. Incluso tenemos una banshee en el equipo. Estoy seguro de que su propia banshee se llevará estupendamente con ella."

              "Sí, siempre me llevo bien con otras banshees", dice Illuna en tono seco, mientras mira hacia el amuleto de Arraka.

              "¿Una banshee?", pregunta Hadrik. "¿Cómo conociste a esa?"

              "Es una larga historia", dice Nolderan. "Si quieren, se la contaré cuando lleguemos."
          - source: scene_text_2
            paragraph: 43
            text: |-
              "Arraka", dice Illuna de repente. "¿Puedes percibir el campamento? ¿Cuántos magos hay dentro esperándonos?"

              "Cinco", dice Arraka. "Incluida la banshee."

              "¿Y qué tan fuertes son?", pregunta Illuna.

              "Es difícil saberlo", dice Arraka, "porque todos parecen estar suprimiendo sus auras para evitar que los detecten, pero la mayoría aparenta estar en el mismo nivel de poder mágico que Nolderan."

              "¿Es difícil saberlo porque eres incapaz de hacerlo o porque no quieres hacerlo?", le pregunta Illuna.

              "¿Me acusas de mentirte?", dice Arraka con tono burlón. "¿A mí? ¿A tu amiga más antigua y querida mentora? Estoy conmocionada. Absolutamente conmocionada..."

              Illuna le frunce el ceño al amuleto, pero no dice nada.

              "Tu amiga banshee no parece confiar demasiado en mí, ¿verdad?", le dice Nolderan a Daren.

              "No lo parece...", dice Daren.

              "No se preocupen", dice Illuna. "Desconfío de todo el mundo. Está en mi naturaleza."

              "Bueno, desde luego es una buena cualidad que tener en un entorno como este", dice Nolderan. "Especialmente para una banshee. Vamos, sigamos avanzando. Llegaremos al campamento pronto."
