    routes:
      - condition: b2_ch10_traps = 0
        texts:
          - source: scene_text
            paragraph: 43
            text: |-
              "Supongo que podríamos pedirle a Arraka que revise periódicamente si hay trampas de camino al campamento de Nolderan."

              "Y yo me aseguraré de usar mi sentido mágico para ver si no hay magos intentando caernos encima", dice Melindra. "Sigo sin entender por qué todos están tan dispuestos a confiar en un tipo al que acaban de conocer. A mí todavía me siguen tratando como si fuera una extraña, pero entonces aparece este nuevo mago y, de repente, es como si ya formara parte del equipo. ¿Qué tiene él de especial?"

              "Bueno", digo, "tal vez si les contaras a los demás el problema que tienes para controlar tus poderes de viento, confiarían más en ti. Si la gente ni siquiera puede contar contigo para luchar junto a nosotros, no puedes esperar que te traten como a una miembro del equipo. En serio, ¿por qué te empeñas tanto en mantener esto en secreto frente a todos? ¿Qué crees que harán cuando lo descubran? ¿Piensas que intentarán matarte?"

              "De hecho, sí", dice Melindra.

              "¿Sí?...", le pregunto, confuso. "¿Pero por qué?"
          - source: scene_text_2
            paragraph: 42
            text: |-
              "¡Porque ya me ha pasado una vez!", dice Melindra. "Hace mucho tiempo viajé durante un tiempo con un pequeño grupo de gente y, en cierto momento, descubrieron mi problema. Querían solucionarlo lanzándome un hechizo de mago blanco que supuestamente me ayudaría limitando la cantidad de energía que podía usar para potenciar cada uno de mis hechizos. En teoría podría haber funcionado, pero yo no quise arriesgarme, porque el aura de un stillwater es demasiado distinta de la de un mago normal y no se puede saber qué va a ocurrir. Podría llegar a ser mortal para alguien como yo. Intenté explicárselo, pero no me tomaban en serio. ¡Esos cabrones incluso intentaron lanzarme ese hechizo mientras dormía, sin mi permiso! ¡Podrían haberme matado si no me hubiera despertado para detenerlos!"

              "No creo en absoluto que Daren intentara lanzarte ese hechizo mientras duermes", digo. "Sobre todo si le explicas por qué piensas que podría ser arriesgado para ti..."

              "¿De verdad?", dice Melindra. "Ustedes prácticamente me obligaron a aceptar un juramento de encantador potencialmente mortal solo para estar dispuestos a venir conmigo, ¿y ahora esperas que crea que de pronto estarían dispuestos a priorizar mi seguridad por encima de la suya solo porque se los pido con amabilidad?"

              "Bueno, llevo bastante tiempo sabiendo cuál es tu problema y el riesgo que supone para nosotros, ¿no?", digo. "Y aun así nunca le he contado a Daren ni a nadie más nada de esto."
          - source: scene_3
            paragraph: 15
            text: |-
              "Supongo que no...", dice Melindra, haciendo una pequeña pausa para reflexionar sobre mis palabras. "Pero aun así prefiero que los demás no lo sepan, al menos hasta que lleguemos a Ollendor. No es como si pudiera ayudar mucho en una batalla aunque quisiera, así que no le veo necesidad a que lo sepan. Y si eso significa que seguirán odiándome, que así sea."

              "Como quieras...", digo. "De todos modos, creo que aquí ya hemos terminado, así que iré a guardar mi tienda. Nos vemos en unos minutos."

              Una vez que todos terminamos con las tiendas, cogemos las mochilas y empezamos a seguir a Nolderan hacia su campamento. Según él, no deberíamos tardar más de treinta minutos en llegar. Por suerte, la batalla con el mamut casi ha conseguido despejarme la borrachera, así que, si alguien vuelve a atacarnos por el camino, ya no tendré que lidiar con ese problema.

              Antes de irnos, Melindra y yo tuvimos una conversación privada con Arraka y le pedimos que nos avisara si había trampas mágicas de camino al campamento de Nolderan. Mientras atravesamos el bosque, nos cruzamos con algunos magos más que están llenando sus mochilas de piñas. Sin embargo, todos ellos parecen bastante aterrorizados al vernos, como si tuvieran miedo de que fuéramos a atacarlos.

              "¿Por qué creen que esos magos estaban tan asustados de vernos?", dice Daren mientras pasamos junto a los recolectores de piñas.

              "Bueno, somos un grupo bastante grande, así que debemos de parecerles bastante intimidantes", dice Hadrik. "Quizá piensen que vamos a robarles las piñas."
            condition: b2_ch10_toast = 1 AND b2_ch9_drink = 1
