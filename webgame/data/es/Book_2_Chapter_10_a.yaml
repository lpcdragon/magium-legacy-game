  - name: b2_ch10a_milady
    texts:
      - source: scene_text
        paragraph: 40
        text: |-
          Durante los siguientes minutos, Daren se dedica a curarnos mágicamente todos los golpes, incluido el ojo morado de Hadrik. Cuando está casi terminando, veo que se abre una tienda a lo lejos y Melindra sale lentamente de ella. Justo cuando sale, noto que las corrientes de aire que me rodean se van desvaneciendo hasta desaparecer por completo.

          "Mira quién por fin se ha dignado a aparecer...", dice Kate.

          "¡Eh, Melindra!", grita Flower, mientras Melindra ya avanza hacia nosotros. "¡Por aquí! ¡Te perdiste la pelea! Además, el antiguo maestro de encantamiento de Daren vino de visita. Está aquí mismo, a mi lado. Se llama Nolderan."

          "¿Es esta otra integrante de su equipo o qué?...", nos pregunta Nolderan.

          Melindra oye la pregunta de Nolderan mientras todavía se está acercando a nosotros y responde antes de que ninguno de nosotros tenga ocasión de decir nada.

          "Solo soy una doncella viajera que desea regresar a casa con su enfermizo padre", dice Melindra en voz alta, con una sonrisa cortés. "Estos valientes guerreros se han ofrecido a escoltarme hasta mi ciudad natal, y ahora viajo con ellos."

          Cuando llega hasta donde estamos, extiende la mano hacia el antiguo maestro de Daren, invitándolo a besarla.

          "¡Encantada de conocerlo!", dice, todavía sonriendo.
      - source: scene_text_2
        paragraph: 40
        text: |-
          "Igualmente, milady", dice Nolderan, mientras le toma la mano, se la besa suavemente y luego la suelta. "¿Puedo preguntar hacia dónde se dirige?"

          "Oh, no es más que un pueblecito", dice Melindra. "Probablemente nunca haya oído hablar de él."

          "La estamos llevando a una ciudad llamada Ollendor", dice Daren.

          Melindra le frunce el ceño al ver con qué facilidad ha revelado nuestro destino, pero no parece que Daren se haya dado cuenta.

          "¿Ollendor?", dice Nolderan, sorprendido. "¡Pues justo pasamos por esa ciudad de camino aquí! Y da la casualidad de que en mi equipo hay un mago capaz de lanzar magia de teletransportación. Si vienen conmigo a nuestro campamento, estoy seguro de que podría convencerlo de que los teletransportara a su destino, y así se ahorrarían unos cuantos días de viaje. ¿Qué dices, Daren? ¿Te gustaría conocer a mis compañeros de equipo?"

          "Yo... supongo que sí...", dice Daren. "Pero no estoy seguro de qué tienen que decir los demás al respecto. ¿A todos los demás también les parecería bien pedirle a uno de los amigos de Nolderan que nos teletransporte a Ollendor?"
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch10a_participant
  - name: b2_ch10a_participant
    routes:
      - condition: b2_ch8_energizer = 1
        texts:
          - source: scene_text
            paragraph: 41
            text: |-
              "Oye, si eso nos lleva allí más rápido, ¿por qué no?", dice Hadrik.

              "Yo no tengo ningún problema", escribe Leila.

              "Yo tampoco", dice Kate. "Y también quiero disculparme por haber desconfiado tanto de ti antes, Nolderan. Nos ayudaste muchísimo en esa pelea contra los orcos y el mamut, y sin duda te has ganado mi confianza."

              "Ni lo menciones", dice Nolderan. "Bueno, si nadie más tiene objeciones, yo sugeriría que nos preparáramos para partir pronto. No me gustaría pasar demasiado tiempo en este sitio cuando podrían aparecer nuevos monstruos teletransportándose y atacarnos en cualquier momento."

              "De acuerdo", dice Daren. "Entonces iremos a guardar las tiendas. Nos reuniremos aquí cuando todos hayamos terminado."

              "¡Oh, Barry, cariño!", dice Melindra con una sonrisa forzada. "¿Podría hablar contigo en privado un momento? ¡Hay algo muy importante de lo que necesito hablarte!"

              Al oír las palabras de Melindra, Kate me frunce el ceño y se dirige a su tienda, mientras Daren se limita a negar con la cabeza, desaprobando la situación, y se aleja.

              "¿Qué pasa, Melindra?...", digo, acercándome a ella mientras todos los demás se alejan lo suficiente como para quedar fuera del alcance de nuestros oídos.
          - source: scene_text_2
            paragraph: 41
            text: |-
              "Barry...", dice Melindra. "¿Te importaría explicarme por qué todos aquí acaban de aceptar sin pensárselo dos veces caminar hacia una posible emboscada?"

              "¿A qué te refieres?", digo. "¿Estás diciendo que Nolderan podría querer matarnos?"

              "¡Sí!", dice Melindra. "¿Acaso no es participante del torneo? ¿Por qué no iba a querer matarlos?"

              "Bueno, para empezar, es un viejo amigo de Daren", digo. "Y si de verdad quisiera vernos muertos, no veo por qué no nos habría dejado simplemente morir a manos de los monstruos en vez de ayudarnos. Incluso le dijimos que huyera mientras todavía tenía la oportunidad, pero aun así eligió quedarse y luchar a nuestro lado. ¿Qué habría ganado con hacer eso?"

              "No sé cuál es su plan", dice Melindra. "No leo mentes. Lo único que sé es que mis instintos me dicen que no confíe en él. Escucha, no estoy diciendo que no debamos ir con él en absoluto. Créeme, no hay nada que me gustaría más que aparecer teletransportados en la mismísima puerta de Ollendor sin ningún esfuerzo por nuestra parte. Pero aun así creo que deberíamos ser prudentes. No deberíamos dar por bueno sin más todo lo que dice este tipo. ¿Entiendes lo que quiero decir?"
        choices:
          - position: 1
            text: Supongo que podríamos pedirle a Arraka que revise periódicamente si hay trampas de camino al campamento de Nolderan.
            effects:
              - set:
                  current_scene: b2_ch10a_intimidating
                  b2_ch10_traps: 0
          - position: 2
            text: Creo que te estás preocupando por nada. A mí Nolderan me parece de fiar.
            effects:
              - set:
                  current_scene: b2_ch10a_intimidating
                  b2_ch10_traps: 1
