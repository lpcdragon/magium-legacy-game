  - name: b2_ch10a_mammoth
    texts:
      - source: scene_text
        paragraph: 18
        text: |-
          Todos salimos corriendo tan rápido como podemos y, cuando miramos atrás, vemos que la luz azul ha llenado toda la zona sobre el círculo hasta una altura de casi treinta pies, y que se ha vuelto diez veces más brillante que antes. Poco después, la tierra empieza a temblar y una criatura enorme empieza a materializarse lentamente de la nada dentro del área que acabamos de abandonar, a medida que el círculo y la luz intensa se desvanecen.

          En cuanto logramos verla con claridad, comprendemos que la criatura que han invocado los magos del dragón es, sin lugar a dudas, un mamut de ojos rojos. Alzándose sobre nosotros hasta una impresionante altura de treinta pies, la criatura nos observa ahora con sus brillantes ojos rojos, como si aún estuviera decidiendo si atacarnos o no. Los mamuts de ojos rojos no suelen ser conocidos por su comportamiento agresivo, a pesar de su aspecto amenazador, pero una criatura invocada está obligada a obedecer cualquier orden de sus amos, así que lo más probable es que no tarde mucho en intentar pisotearnos hasta la muerte.

          Los mamuts, en general, son solo un poco más grandes que los elefantes, y la única gran diferencia entre ambas especies, en cuanto al aspecto, es que los mamuts tienen colmillos mucho mayores y la piel suele estar cubierta de lana. Los mamuts de ojos rojos, en cambio, son mucho más grandes, solo pueden encontrarse en el Continente Norte y son notorios por su ferocidad en batalla cuando luchan para proteger su territorio. Sus pieles están completamente blindadas, son mucho más resistentes que el acero élfico y, cuando luchan, usan la trompa como si fuera un enorme mazo con el que aplastar a sus enemigos, mientras emplean los colmillos como lanzas para ensartar a cualquier superviviente que quede tras su embestida.
      - source: scene_text_2
        paragraph: 17
        text: |-
          Mientras el mamut ruge con fuerza, de pronto siento cómo la presencia de los orcos y los ogros desaparece del bosque, porque se están teletransportando fuera de la zona, igual que la última vez.

          "Por cierto, los magos y el capitán se han ido", dice Arraka. "Pensé que quizá debería avisarlos."

          "Sí, Arraka, todos lo sabemos", dice Illuna. "No es que se hayan esforzado mucho por ocultar ya sus auras durante el último minuto. Seguramente trajeron a los magos solo para invocar a esta bestia y nada más. Vamos a ocuparnos de los guivernos antes de que aparezca alguien más."

          Flower da entonces un salto y se impulsa hacia arriba con sus chorros de fuego, mientras Kate sube de un salto a una plataforma voladora de hielo y crea a su alrededor una jaula de hielo para asegurarse de no caerse.
      - source: scene_3
        paragraph: 10
        text: |-
          "Van a tener que ocuparse ustedes mismos del mamut mientras nosotras luchamos contra los guivernos", dice Kate. "No corran riesgos estúpidos."

          "Más fácil decirlo que hacerlo", dice Daren.

          "Nos las arreglaremos, no te preocupes", dice Nolderan. "Todavía no ha habido un monstruo al que Daren y yo no hayamos conseguido derrotar luchando juntos. Tú solo sigue a tu amiga banshee y haz lo que tengas que hacer."

          Kate asiente con sequedad y luego eleva su jaula por el aire, siguiendo a Illuna hacia los jinetes de guiverno. Mientras Kate se dirige al cielo, el resto mantenemos la posición y observamos al mamut, que ha permanecido notablemente callado desde el rugido de antes. La criatura no se mueve en absoluto y se limita a mirarnos, esperando nuestro siguiente paso.

          "Entonces...", dice Hadrik. "¿Creen que deberíamos atacarlo o qué?..."
    choices:
      - position: 1
        text: Sugerir que retrocedamos despacio, sin dejar de mirar al mamut
        effects:
          - set:
              current_scene: b2_ch10a_suggest
      - position: 2
        text: Dispararle al mamut con la ballesta
        effects:
          - set:
              current_scene: b2_ch10a_shoot
  - name: b2_ch10a_suggest
    texts:
      - source: scene_text
        paragraph: 19
        text: |-
          "Creo que la criatura está esperando a ver qué haremos antes de actuar", digo. "Normalmente, cuando te encuentras con un mamut de ojos rojos, basta con retroceder despacio sin romper el contacto visual para que te deje en paz, pero no sé qué pasa cuando su invocador le ha dado específicamente la orden de matarnos. Probemos a retroceder por ahora. Con un poco de suerte, quizá no ataque."

          "Bueno...", dice Hadrik. "Tú eres el experto en criaturas. Vamos, todos, retrocedamos un poco."

          Todos damos unos pasos atrás, despacio, sin apartar la vista del monstruo, e intentamos observar su reacción. El mamut se queda allí plantado mirándonos durante un rato y, de repente, se echa a correr hacia nosotros con la intención de pisotearnos bajo sus patas.

          "Pues nada, se acabó ese plan", dice Hadrik. "¡Prepárense para luchar!"

          El enano corre entonces hacia la criatura y da un salto, intentando golpearla en la cabeza. El mamut, sin embargo, lo ve venir, se detiene en seco y alza la trompa para poder defenderse. En cuanto Hadrik entra en el alcance del monstruo, el mamut lanza la trompa desde arriba con una fuerza increíble y manda al enano a estrellarse contra el suelo.
      - source: scene_text_2
        paragraph: 18
        text: |-
          "Un solo golpe de esa trompa y estamos muertos", dice Daren, mirando el agujero del suelo que ha dejado Hadrik al caer. "No recomendaría atacar al mamut a menos que estés realmente seguro de tu capacidad para esquivar. Barry, ninguna de tus armas sería capaz de atravesar la gruesa piel blindada de esta criatura, así que será mejor que no te metas. Leila, los encantamientos de tus dagas son un poco mejores, así que puedes intentarlo, si quieres venir con nosotros."

          "Iré con ustedes", escribe Leila.

          "Bien", dice Daren. "Deprisa. No sé cuánto tiempo podrá Hadrik mantener ocupado él solo al mamut."

          Mientras Daren, Nolderan y Leila se dirigen hacia el mamut, de pronto recuerdo que encontré en mi cuaderno una página en la que se detallaban las debilidades de los mamuts de ojos rojos mientras repasaba mis notas para la arena. ¿Debería ir a buscar el cuaderno? Está claro que aquí fuera no voy a servir de gran cosa a este paso. Vale, decidido. Iré a buscar el cuaderno.
      - source: scene_3
        paragraph: 11
        text: |-
          Corro hacia mi tienda y, en cuanto llego, abro la cremallera. De camino no pude evitar fijarme en que la tienda de Melindra seguía cerrada desde que empezó la batalla. No hay forma de que no oyera aquellos cuernos tan fuertes de antes ni los sonidos de todo el combate. Lo que significa que está fingiendo seguir dormida para no tener que delatar el hecho de que no puede controlar el poder de su magia del viento.

          Da igual. No tengo tiempo para pensar en ella. Ahora mismo tengo otras cosas que hacer.

          Entro rápidamente en mi tienda y abro la mochila. Entonces saco mi cuaderno y paso las páginas hasta llegar a los párrafos sobre los mamuts. Y, por fin, aquí está lo que buscaba. La sección de los mamuts de ojos rojos. Pero ¿qué dice bajo 'Debilidades'? A ver...
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch10a_weakness
  - name: b2_ch10a_shoot
    texts:
      - source: scene_text
        paragraph: 20
        text: |-
          "Ya sabes lo que dicen", le digo a Hadrik. "No hay mejor momento que el presente."

          Levanto entonces la ballesta y le disparo al mamut en la cabeza. El virote de la ballesta simplemente rebota en la frente de la criatura sin llegar siquiera a arañarle la superficie, pero mi pequeña hazaña no ha pasado completamente desapercibida, porque parece que he conseguido atraer toda la atención del monstruo. El mamut me mira fijamente a los ojos y empieza a correr hacia mí con la intención de pisotearme bajo sus patas.

          "Muy bien, pequeño mamut", dice Hadrik mientras se cruje los nudillos. "¡A ver qué sabes hacer!"

          El enano corre entonces hacia la criatura y da un salto, intentando golpearla en la cabeza. El mamut, sin embargo, lo ve venir, se detiene en seco y alza la trompa para poder defenderse. En cuanto Hadrik entra en el alcance del monstruo, el mamut lanza la trompa desde arriba con una fuerza increíble y manda al enano a estrellarse contra el suelo.
      - source: scene_text_2
        paragraph: 18
        text: |-
          "Un solo golpe de esa trompa y estamos muertos", dice Daren, mirando el agujero del suelo que ha dejado Hadrik al caer. "No recomendaría atacar al mamut a menos que estés realmente seguro de tu capacidad para esquivar. Barry, ninguna de tus armas sería capaz de atravesar la gruesa piel blindada de esta criatura, así que será mejor que no te metas. Leila, los encantamientos de tus dagas son un poco mejores, así que puedes intentarlo, si quieres venir con nosotros."

          "Iré con ustedes", escribe Leila.

          "Bien", dice Daren. "Deprisa. No sé cuánto tiempo podrá Hadrik mantener ocupado él solo al mamut."

          Mientras Daren, Nolderan y Leila se dirigen hacia el mamut, de pronto recuerdo que encontré en mi cuaderno una página en la que se detallaban las debilidades de los mamuts de ojos rojos mientras repasaba mis notas para la arena. ¿Debería ir a buscar el cuaderno? Está claro que aquí fuera no voy a servir de gran cosa a este paso. Vale, decidido. Iré a buscar el cuaderno.
      - source: scene_3
        paragraph: 11
        text: |-
          Corro hacia mi tienda y, en cuanto llego, abro la cremallera. De camino no pude evitar fijarme en que la tienda de Melindra seguía cerrada desde que empezó la batalla. No hay forma de que no oyera aquellos cuernos tan fuertes de antes ni los sonidos de todo el combate. Lo que significa que está fingiendo seguir dormida para no tener que delatar el hecho de que no puede controlar el poder de su magia del viento.

          Da igual. No tengo tiempo para pensar en ella. Ahora mismo tengo otras cosas que hacer.

          Entro rápidamente en mi tienda y abro la mochila. Entonces saco mi cuaderno y paso las páginas hasta llegar a los párrafos sobre los mamuts. Y, por fin, aquí está lo que buscaba. La sección de los mamuts de ojos rojos. Pero ¿qué dice bajo 'Debilidades'? A ver...
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch10a_weakness
  - name: b2_ch10a_weakness
    texts:
      - source: scene_text
        paragraph: 21
        text: |-
          Por lo visto, la principal debilidad del mamut está justo en la base de la trompa, por la parte inferior. A diferencia de los mamuts normales, ahí es donde este tipo de criatura tiene los orificios nasales, así que esa zona prácticamente carece de cualquier tipo de armadura. Una buena puñalada en esa área debería causar daños serios en las vías respiratorias de la criatura, pero no tengo ni idea de cómo podría hacerse algo así sin que la trompa te estampe contra el suelo.

          Los ojos del mamut también son un punto débil, pero los párpados son bastante gruesos, así que haría falta bastante esfuerzo para atravesarlos. La criatura solo tiene que cerrar los ojos para protegerse, así que, como debilidad, esta no es especialmente útil.

          No encuentro ninguna otra información que pueda ayudarnos en esta situación, así que decido volver a guardar el cuaderno dentro de la mochila y salir de la tienda. Al mirar el campo de batalla, veo que el mamut sigue ocupado defendiéndose de Hadrik, mientras ignora en gran medida que Daren, Nolderan y Leila están intentando abrirse paso a través de su gruesa piel golpeándole las patas. Ahora hay unos cuantos agujeros más en el suelo que cuando entré en la tienda, pero eso, por lo visto, no ha impedido que Hadrik siga saltando hacia el monstruo una y otra vez para acabar estampado contra el suelo repetidamente.
      - source: scene_text_2
        paragraph: 19
        text: |-
          ¿Y ahora qué?... Nadie excepto Hadrik sería capaz de llegar lo bastante alto como para atacar al mamut en los ojos o en los orificios nasales, pero el enano parece tener las manos ocupadas ahora mismo. Kate, Flower e Illuna siguen luchando contra los jinetes de guiverno en el cielo, así que no podrán echarnos una mano. Ojalá tuviéramos a alguien más en el grupo que pudiera volar... Un momento, ¿qué estoy diciendo? Sí que hay alguien más.

          "¡Eh, Melindra! ¿Me oyes?", grito mientras miro hacia la tienda de Melindra.

          No veo ningún movimiento dentro de la tienda ni nada que confirme que me haya oído. Después de unos segundos más de silencio, continúo.

          "Vale, no hace falta que me respondas", digo. "Solo quiero pedirte un pequeño favor. ¿Recuerdas cómo nos hiciste volar a todos por encima del muro de Thilias con tu magia del viento? Pues estaba pensando que quizá podrías encontrar una forma de hacerme volar que también me diera algún tipo de control. Ya sabes, algo así como corrientes de aire seminteligentes que reaccionen a mis movimientos o algo por el estilo. Además, ya tuve acceso a la magia elementalista de viento otras dos veces antes y creo que, en teoría, debería ser posible lanzar un hechizo así. Llevas seiscientos años practicando este tipo de magia, así que seguro que ya sabes hacer algo así, ¿no?"
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch10a_currents
  - name: b2_ch10a_currents
    routes:
      - condition: b2_ch9_drink = 1 AND b2_ch10_toast = 1
        texts:
          - source: scene_text
            paragraph: 22
            text: |-
              Espero unos segundos para ver si obtengo alguna reacción, pero lo único que recibo como respuesta es silencio.

              "Escucha", digo. "No te estoy pidiendo que te unas a la batalla. No hace falta que te delates ni nada. Solo te pido que me lances un hechizo que me permita volar."

              Sigue sin haber respuesta.

              "Vamos, Melindra", digo. "¡Sé que puedes oírme!"

              Espero otros tres segundos, pero no sale ningún sonido del interior de la tienda.

              "¡¡¡Melindra!!!", grito.

              De repente, siento varias corrientes de aire girando a mi alrededor, parecidas a las que sentí cuando Melindra me elevó en el aire por primera vez. Luego, apenas unos segundos después, mi cuerpo se despega del suelo y empiezo a flotar varios pies por encima de la tierra. Cuando muevo un poco las manos, me doy cuenta de que las corrientes de aire reaccionan a mis movimientos y cambian de dirección en consecuencia. Si levanto los brazos hacia arriba, las corrientes me impulsan hacia lo alto. Si los bajo, empiezo a detenerme poco a poco. También parece que las corrientes tienen en cuenta la forma en que inclino el cuerpo y cómo muevo las piernas a la hora de decidir en qué dirección necesito ir.
          - source: scene_text_2
            paragraph: 20
            text: |-
              Obviamente, no van a responder con la misma rapidez que las corrientes que estaba usando para elevarme del suelo cuando utilizaba el modo de emergencia de mi dispositivo de estadísticas, porque estas corrientes de aire concretas necesitan esperar a mis movimientos antes de cambiar mi dirección y mi velocidad, pero es muchísimo mejor de lo que habría esperado de un hechizo de este tipo. Aun así, preferiría no tener todas estas náuseas cada vez que doy un giro brusco, aunque probablemente eso se deba a mi estado actual de borrachera y no sea culpa del hechizo.

              "¡Tienes mi agradecimiento!", grito desde lo alto hacia Melindra, y luego subo un poco más en el aire para hacer una pequeña prueba de vuelo antes de dirigirme hacia el mamut.

              Intento hacer todos los movimientos posibles para entender bien qué es lo que hace que cambie mi dirección, mi altitud y mi velocidad, porque no puedo permitirme cometer errores mientras lucho contra el mamut. Un solo fallo, y su trompa me romperá todos los huesos de una sola sacudida. Mi control sobre este hechizo tiene que ser perfecto.

              "¡Barry, cuidado!", oigo la voz de Kate desde arriba.

              Al levantar la vista, de pronto me doy cuenta de que dos de los jinetes de guiverno se están lanzando en picado hacia mí con las lanzas preparadas, mientras Kate y Flower están demasiado ocupadas luchando con sus propios guivernos como para poder ayudarme de ningún modo.
        choices:
          - position: 1
            text: Intentar atacar a los guivernos
            effects:
              - set:
                  current_scene: b2_ch10a_wyverns
                  b2_ch10_bribe: 0
