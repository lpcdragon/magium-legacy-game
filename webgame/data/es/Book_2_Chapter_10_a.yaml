scenes:
  - name: b2_ch10a_intro
    texts:
      - source: scene_text
        paragraph: 2
        text: |-
          "Eh, Kate", dice Hadrik. "¡Ven aquí un segundo! ¡Tenemos a alguien que nos gustaría que conocieras!"

          Kate acababa de salir de su tienda cuando Hadrik la llamó. Ya casi ha pasado una hora desde que el antiguo maestro de encantamiento de Daren apareció ante nosotros. En cuanto dejamos claro que no había venido con la intención de empezar una pelea, le dijimos que Daren se despertaría dentro de poco y lo invitamos a unirse a nosotros en una partida de Met-Zek.

          Hemos pasado la última hora jugando a las cartas, mientras Nolderan nos contaba diversas historias de los años que pasó enseñándole a Daren artes marciales y magia de encantamiento. El exsabio aceptó jugar al juego con sus reglas originales, así que ya ha conseguido vaciar una botella de ale enana en el poco tiempo que lleva con nosotros. Sin embargo, parece aguantar el alcohol más o menos igual de bien que Hadrik, porque todavía no le noto ninguna señal de estar borracho.

          "¿Quién es este?", pregunta Kate mientras se acerca a nosotros con cautela.

          "¿Recuerdas cuando Daren nos dijo que su antiguo maestro le hizo esa cicatriz durante una sesión de entrenamiento?", dice Hadrik. "Pues este es el antiguo maestro del que hablaba. Se llama Nolderan y, por lo visto, ha venido aquí para saludar a Daren, porque no lo veía desde hacía mucho tiempo."

          "Encantado de conocerla, milady", dice Nolderan mientras hace una reverencia cortés.
      - source: scene_text_2
        paragraph: 2
        text: |-
          "Ahórrate las cortesías", dice Kate. "¿Por qué no dices lo que realmente quieres decir? A estas alturas no estoy haciendo ningún esfuerzo por suprimir mi aura mágica. Si de verdad eres el maestro de Daren, entonces también debes de ser quien le enseñó a luchar contra banshees."

          "Debes de estar pensando en el otro maestro de Daren", dice Nolderan. "El mago blanco. Ambos fuimos exsabios, así que entiendo la confusión. Te aseguro que no tengo ningún problema con ninguna banshee. Mientras esta gente confíe en ti, no veo ninguna razón para considerarte mi enemiga."

          "No es una banshee de verdad, para que lo sepas", le dice Hadrik a Nolderan. "Es una maga."

          "¿Oh?", dice Nolderan alzando las cejas. "Desde luego, eso no es algo que se vea todos los días."

          "¿Cómo sabías que Daren estaría aquí?", le pregunta Kate.

          "No sabía que estaría por esta zona en concreto", dice Nolderan. "Simplemente estaba lo bastante cerca como para sentir su aura, así que decidí venir a saludarlo."

          "¿Simplemente 'estabas' lo bastante cerca?", dice Kate. "¿O sea que ibas vagando solo, por tu cuenta, en mitad de la noche?"

          "En realidad, mi campamento no está muy lejos de aquí", dice Nolderan. "Me ofrecí voluntario para explorar las zonas de alrededor durante mi turno de noche, por eso estaba patrullando por estos alrededores. Aun así, entiendo que desde tu punto de vista esto pueda parecer un poco sospechoso."
    effects:
      - set:
          successful_checks:
            - 'Punto de control alcanzado: Partida guardada.'
        condition: checkpoint_rich = 1
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch10a_intro2
              checkpoint_rich: 0
  - name: b2_ch10a_intro2
    texts:
      - source: scene_text
        paragraph: 3
        text: |-
          "Claro que sospecho de ti", dice Kate. "Ni siquiera tenemos ninguna garantía de que realmente conozcas a Daren. ¿Qué prueba tienes de que eres de verdad uno de sus maestros y no solo algún asesino al que le pagaron para matarlo?"

          "Bueno, si quieres una prueba, puedes preguntárselo al propio Daren", dice Nolderan. "Ahora mismo viene hacia aquí."

          "¿Maestro Nolderan?", dice Daren, conmocionado, mientras se acerca a nosotros. "¿De verdad eres tú? ¡Pareces tan viejo!"

          "La primera vez que nos vemos en más de diez años, ¿y esto es lo que me dices?", dice Nolderan con una sonrisa, mientras deja las cartas a un lado y se levanta del tronco para saludar a su antiguo pupilo. "Quizá si me hicieras una visita de vez en cuando no te sorprendería tanto ver mis canas."

          "Lo siento...", dice Daren. "Es solo que he estado tan ocupado con..."

          "Con salvar el mundo, sí, sí, ya lo sé", dice Nolderan. "No hace falta que te tomes todo tan en serio todo el tiempo, muchacho. Solo estaba bromeando. Lo sé todo sobre tus aventuras. Ahora deja de ser tan aguafiestas y ven a darle un abrazo a tu viejo maestro."

          Entonces Nolderan abraza a Daren durante unos segundos mientras le da fuertes palmadas en la espalda.
      - source: scene_text_2
        paragraph: 3
        text: |-
          "Veo que sigues llevando esa pesada armadura de placas tuya", dice Nolderan cuando suelta a Daren. "¿No te cansas de andar por ahí así? ¿De qué sirven todos esos movimientos sofisticados que te enseñé si ni siquiera puedes hacer la mitad por culpa del peso de la armadura?"

          "Ya te lo dije", dice Daren. "La armadura es la única protección fiable contra el daño físico que tengo. No voy a tirarla."

          "¿Quién necesita protección cuando puede simplemente esquivar los ataques de sus enemigos?", dice Nolderan. "¿De verdad tengo que hacerte una tercera cicatriz para que aprendas la lección de una vez por todas?"

          "Uf...", dice Daren. "No volvamos a empezar con esta discusión. Acabamos de reencontrarnos después de no sé ni cuántos años. ¿No deberíamos estar celebrándolo en vez de ponernos a discutir?"

          "¡Tienes toda la razón, Daren!", dice Nolderan. "Espera, voy a buscar otra botella de ale enana para que podamos hacer un brindis."

          "¿Ale enana?...", dice Daren. "¿A estas horas? ¡No hablarás en serio! ¿Y si nos atacan?"
      - source: scene_3
        paragraph: 2
        text: |-
          "Claro, tenías que decir eso...", dice Nolderan. "Bueno, en ese caso, haré chocar estas dos botellas e imaginaré que también estás bebiendo conmigo. ¡Salud, Daren!"

          Entonces hace chocar dos botellas de ale enana, tal como dijo que haría, y le da un largo trago a una de ellas.

          "Todos están invitados a unirse a este brindis, por supuesto, si quieren", dice Nolderan mientras nos mira a Hadrik, Kate y a mí. "¡Al fin y al cabo, es una celebración!"
    choices:
      - position: 1
        text: Aceptar beber con Nolderan
        effects:
          - set:
              current_scene: b2_ch10a_charmed
              b2_ch10_toast: 1
      - position: 2
        text: Rechazar la oferta de Nolderan
        effects:
          - set:
              current_scene: b2_ch10a_charmed
              b2_ch10_toast: 0
  - name: b2_ch10a_charmed
    routes:
      - condition: b2_ch10_toast = 1 AND b2_ch9_drink = 1
        texts:
          - source: scene_text
            paragraph: 4
            text: |-
              "Claro, me apunto", digo. "Dame la botella."

              "Bien, bien", dice Nolderan mientras me entrega la botella de la que él no bebió. "¿Alguien más?"

              "Bueno, yo ya tengo una botella de ale enana en la mano, así que por qué no", dice Hadrik, uniéndose a nosotros y preparándose para el brindis.

              "Yo paso", dice Kate, sin más.

              "¡Brindemos, entonces!", dice Nolderan, levantando la botella, mientras Hadrik y yo hacemos lo mismo. "¡Salud, amigos míos! Gracias a todos por mantener a salvo a mi viejo alumno durante este torneo. Sé que a veces puede ser un poco cabezota, pero tiene buen corazón."

              "¡Salud!", decimos Hadrik y yo, mientras todos hacemos chocar nuestras botellas y empezamos a beber.

              Cuando dejo la botella, de repente me doy cuenta de que puede que me haya pasado un poco con la bebida, teniendo en cuenta que también tuve que dar bastantes sorbos de ale enana mientras jugaba a las cartas con Hadrik. Ya empiezo a notar que la cabeza me da un poco vueltas por tanto alcohol. Espero que esta sensación de borrachera se me pase pronto.

              "¿Qué está pasando?", pregunta Flower mientras ella y Leila se acercan a nosotros, después de haberse despertado por el ruido. "¿Tenemos visita?"
          - source: scene_text_2
            paragraph: 4
            text: |-
              "Sí, este es el antiguo maestro de encantamiento de Daren", dice Hadrik. "Es la primera vez que se ven en más de diez años, así que estamos haciendo un brindis para celebrar su reencuentro."

              "¿Otra maga?...", pregunta Nolderan al percibir la magia en el aura de Flower.

              "Eh... más o menos", dice Hadrik. "La chica es una maga, pero en el mismo cuerpo también vive una banshee. Se llaman Flower e Illuna. Se nota cuando habla la banshee porque los ojos de la chica se vuelven azules. Al principio confunde un poco, pero enseguida te acostumbras."

              "Ya, ya...", dice Nolderan.

              "¡Encantada de conocerte!", dice Flower, sonriendo.

              "Y esta de aquí es Leila", dice Hadrik. "Es una lessathi."

              "¿Una qué?...", pregunta Nolderan.

              "Eh...", dice Hadrik. "Creo que los lugareños los llaman 'los ancestrales'. ¿Te suena ese nombre?"

              "Oh, sí, sí...", dice Nolderan. "El nombre sí que me suena. Creo que eran una antigua raza olvidada que antes era muy buena fabricando dispositivos mágicos."

              "Sí, exacto", dice Hadrik. "Leila es descendiente de esa raza."
          - source: scene_3
            paragraph: 3
            text: |-
              "Encantada", escribe Leila.

              "Eh...", dice Nolderan, sin saber muy bien cómo interpretar el texto flotante que tiene delante.

              "Ah, olvidé decirte", dice Hadrik. "Leila no puede hablar. Solo puede comunicarse escribiendo."

              "Ah, así que para eso era el texto azul", dice Nolderan mientras vuelve la mirada hacia Leila. "Yo también me alegro de conocerte."

              "Maestro... no es que no me alegre de verlo, pero ¿puedo preguntar qué está haciendo aquí, en Varathia?", dice Daren. "Pensé que ya habías terminado con los torneos de magos después de... bueno, ya sabes..."

              "¿Después de que perdí mi título de sabio, quieres decir?", dice Nolderan. "Puedes decirlo en voz alta, muchacho. No es que me vaya a poner a refunfuñar. Han pasado catorce años desde entonces. A estas alturas ya lo he superado. Claro que desde entonces no he competido demasiado, pero esta vez es diferente. Este torneo del Magium me ha brindado una oportunidad única en la vida, así que no podía dejarla pasar."
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch10a_undefeated
