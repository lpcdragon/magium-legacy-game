            paragraph: 27
            text: |-
              No es fácil apuntar a blancos que se mueven rápido mientras yo mismo también voy volando, pero de algún modo consigo acertarle a uno de los orcos directamente en la cabeza, lo que hace que caiga de su guiverno hacia la muerte y deja confundida a la bestia que montaba. Ahora que solo queda un enemigo, uso la ballesta para obligarlo a ir en la dirección que me conviene y luego me lanzo rápidamente sobre él desde arriba, hundiéndole la hoja en la nuca antes siquiera de que tenga ocasión de desviar mi golpe con la lanza.

              Después de matar a ambos orcos, no espero a ver qué piensan hacer los guivernos por su cuenta, así que empiezo a recargar la ballesta mientras avanzo lentamente hacia el mamut, con el que Hadrik y los demás siguen todavía ocupados.
