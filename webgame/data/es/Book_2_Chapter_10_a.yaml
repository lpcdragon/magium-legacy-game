              "Psst, Barry", me susurra Melindra mientras ahora camina unos doce pies por detrás del grupo, junto con Flower. "¡Por aquí!"

              "¿Qué pasa?", digo en voz baja mientras me acerco a las dos. "¿Encontró Arraka alguna trampa?"

              "No, pero podemos sentir cuántos magos hay esperándonos dentro del campamento", dice Melindra. "Son cinco, incluida la banshee de la que antes hablaba el viejo."

              "Mmm...", digo. "Cinco magos no suena tan mal."

              "¿Y qué tan poderosos son exactamente esos cinco magos?", pregunta Illuna.

              "Es difícil saberlo", dice Arraka, "porque todos parecen estar suprimiendo sus auras para evitar que los detecten, pero la mayoría aparenta estar en el mismo nivel de poder mágico que Nolderan."

              "¿Es difícil saberlo porque eres incapaz de hacerlo o porque no quieres hacerlo?", le pregunta Illuna.

