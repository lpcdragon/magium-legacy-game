      - condition: b2_ch10_toast = 0 AND b2_ch5_scimitar = 0
        texts:
          - source: scene_text
            paragraph: 13
            text: |-
              Entonces corre a toda velocidad hacia un orco que está demasiado ocupado luchando contra Daren como para prestarle atención a Nolderan, da un salto horizontal, gira el cuerpo de lado en pleno aire y lanza sus pies contra la espalda del monstruo. Cuando el orco pierde el equilibrio, el exsabio cae al suelo sobre el hombro izquierdo. Daren aprovecha de inmediato la oportunidad y le clava la espada en la cabeza al monstruo, mientras Nolderan rueda rápidamente hacia un lado para evitar que otra maza orca lo aplaste. En cuanto el exsabio se pone en pie, finta un ataque con una de sus espadas, como si fuera a hacer un tajo completo por la izquierda, y justo cuando el orco levanta el escudo para defenderse, la segunda espada de Nolderan entra por la derecha buscando el cuello del monstruo y le corta la cabeza de un solo golpe.

              Decido que ya es hora de sumarme también a la batalla, así que agarro mi daga con la mano derecha y me lanzo hacia uno de los orcos con los que está luchando Leila.

              El orco me ve venir y bloquea mi primer golpe con el escudo, al tiempo que lanza su maza hacia mi cabeza. No tengo tiempo de desviar el impacto justo después de haber atacado, así que intento echarme hacia atrás de un salto para esquivar el arma del orco.
          - source: scene_text_2
            paragraph: 14
            text: Sin embargo, reacciono demasiado tarde y la maza me golpea con fuerza en la cabeza, aplastándome el cráneo bajo su peso y estrellándome contra el suelo mientras mi consciencia se desvanece para siempre.
            condition: b2_ch9_drink = 0 AND reflexes < 1
          - source: scene_text_2
            paragraph: 14
            text: Sin embargo, reacciono demasiado tarde y la maza me golpea con fuerza en la cabeza, aplastándome el cráneo bajo su peso y estrellándome contra el suelo mientras mi consciencia se desvanece para siempre.
            condition: reflexes < 1
          - source: scene_text_2
            paragraph: 16
            text: |-
              Consigo apartarme a tiempo del peligro y, antes de que el monstruo pueda atacarme por segunda vez, Leila le clava una de sus dagas por la espalda, obligándolo a volver a girarse hacia ella. Aprovecho eso y corro de inmediato hacia mi enemigo, hundiéndole la hoja por la parte trasera del casco, haciendo que le atraviese el cuello por completo. Tras unos segundos gorgoteando sangre, el orco cae por fin al suelo y muere poco después.

              Cuando miro cómo les va a los demás, me doy cuenta de que el resto de los monstruos ya han muerto y de que mis compañeros se están reuniendo junto al bosque para que podamos ir a luchar juntos contra los magos orcos y su capitán.

              "Nos hemos quitado de encima a estos supuestos guerreros 'de élite' en un abrir y cerrar de ojos, ¿eh?", dice Nolderan antes de echarse a reír.

              "Todavía no", dice Daren. "Aún quedan cinco magos esperando en el bosque. Y la habilidad de combate de su capitán es muy superior a la de sus subordinados. Deprisa, lleguemos hasta ellos antes de que..."

              A Daren lo interrumpe de pronto el sonido de un cuerno muy potente procedente de la dirección del capitán orco, lo que nos obliga a todos a taparnos los oídos para amortiguar parte del ruido.

              "¡Mierda!", dice Arraka en cuanto el capitán orco deja de tocar el cuerno. "Se me olvidó comprobar lo de arriba. ¡Se acercan jinetes de guiverno! ¡Se acercan jinetes de guiverno!"
