                  current_scene: b2_ch10a_riders
                  b2_ch10_bribe: 1
          - position: 3
            text: Intentar sobornar a los orcos para que se unan a mi bando
            effects:
              - set:
                  current_scene: b2_ch10a_bribe
                  b2_ch10_bribe: 2
