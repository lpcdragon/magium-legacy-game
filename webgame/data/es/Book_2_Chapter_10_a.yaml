  - name: b2_ch10a_flank
    routes:
      - condition: b2_ch5_scimitar <> 0
        texts:
          - source: scene_text
            paragraph: 10
            text: |-
              "¿De qué estás hablando, muchacho?", dice Nolderan. "¿Crees que voy a salir corriendo y dejar que unos monstruos maten a mi discípulo favorito apenas unos minutos después de que nos hayamos reencontrado?"

              "Estos no son unos monstruos cualquiera", dice Daren. "Son tropas de élite del dragón que gobierna a la mayoría de las razas de monstruos de este continente. No va a ser una pelea fácil."

              "¡Bah!", dice Nolderan. "Ya has dicho eso antes. ¿Recuerdas aquella vez que fuimos a asaltar esa cueva llena de ogros y troles y los masacramos a todos en cuestión de minutos? También entonces decías que sería una pelea difícil."

              "¡Eso pasó cuando yo apenas tenía veinte años!", dice Daren. "Dioses, ahora que lo pienso... Apenas llevaba unos meses entrenando y esa ya era nuestra tercera cacería de monstruos. ¿Cómo demonios lograste convencerme de seguir siendo tu pupilo durante tanto tiempo?"

              "Deja de quejarte", dice Nolderan. "Mi entrenamiento funcionó, ¿no? No puedes limitarte a hacer combates simulados todo el tiempo y esperar convertirte mágicamente en un guerrero curtido. Las batallas de verdad son donde realmente pones a prueba tus habilidades."

              "¿Se están acercando los monstruos?", pregunta Hadrik. "Con mi sentido mágico no termino de notarlo."
          - source: scene_text_2
            paragraph: 8
            text: |-
              "Desde luego que se están acercando", dice Kate. "De hecho, deberíamos verlos de un momento a otro. Parece que han renunciado a intentar flanquearnos por todos los lados, debido a la gran zona sin árboles que tenemos delante y que no puede darles cobertura, así que ahora están intentando reunirse en el bosque que hay detrás de nosotros y a los lados."

              "Al menos eso debería mantenerlos lejos de las tiendas cuando luchemos", dice Hadrik. "Lo último que queremos es que se nos estropeen las tiendas cuando estamos lejos de cualquier ciudad para comprar recambios."

              "¡No olviden la conversación que tuvimos después de nuestra última batalla!", dice Daren. "Hoy nos enfrentamos a muchos más enemigos, así que no podemos permitirnos cometer errores. Leila, nada de lanzarte otra vez contra las líneas enemigas, ¿entendido? Kate, ¿recuerdas en qué tienes que centrarte?"

              "Sí", dice Kate. "Lo recuerdo."

              Entonces dispara varios carámbanos hacia el bosque de nuestra izquierda y dos de los ogros caen muertos de repente detrás de los árboles. Los tres guerreros ogros que quedan con vida se ponen a gritar con fuerza y avanzan hacia nosotros a gran velocidad.

              Al ver que su formación se ha roto, los orcos que se escondían detrás de los árboles a nuestra derecha también se dejan ver y empiezan a avanzar lentamente hacia nosotros mientras forman una línea, con los escudos alzados delante y las mazas en la mano derecha.
          - source: scene_3
            paragraph: 7
            text: |-
              Kate intenta atacar a los tres ogros con otra andanada de carámbanos, pero esta vez usan sus enormes garrotes para defenderse de sus proyectiles.

              "Flower", dice Daren. "Alza el vuelo y bombardea a los ogros con bolas de fuego. Tienen que morir antes de alcanzarnos."

              "¡Voy!", dice Flower, mientras salta por los aires y luego se impulsa hacia arriba usando sus chorros de fuego.

              "El resto tenemos que ocuparnos de los orcos", dice Daren. "Todos llevan armadura anti-magia, así que, si eres elementalista, ni te molestes en atacarlos."

              Mientras Daren hablaba, Flower empezó a disparar bolas de fuego contra los tres ogros que todavía se dirigían hacia nosotros. Los monstruos intentaron apartarse de las explosiones de un salto, pero eso los dejó indefensos ante los carámbanos de Kate, que les atravesaron el cráneo y los mataron a los tres en el acto.

              "Bien", dice Daren. "Los ogros ya están muertos. Acabemos rápido con los orcos y luego iremos a por los magos."
