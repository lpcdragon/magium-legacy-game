  - name: b2_ch10a_breed
    routes:
      - condition: strength < 4 AND b2_ch10_weakpoint = 0 AND b2_ch5_scimitar = 0
        texts:
          - source: scene_text
            paragraph: 33
            text: |-
              "¡Muy bien, Barry!", grita Hadrik. "¡Ahora intenta que el mamut balancee la trompa hacia aquí!"

              Ahora por fin entiendo lo que intentaba hacer. La especie concreta de caracol gigante en la que se ha transformado Hadrik tiene un tipo de baba que se seca casi al instante y se vuelve increíblemente pegajosa, por lo que suele usarse como material base para muchos tipos de pegamento. Como Hadrik tiene los pies metidos en la baba, ahora debería poder agarrarse a la trompa del mamut sin tener que preocuparse de salir despedido por los aires después.

              "¡Buena idea!", le digo a Hadrik. "¡Voy para allá!"

              Entonces me lanzo hacia él y me quedo flotando allí, haciendo de cebo para que el mamut me ataque. El monstruo muerde el anzuelo de inmediato y lanza la trompa con toda su fuerza en nuestra dirección. Me aparto en el último segundo y Hadrik se aferra rápidamente a la trompa con ambas manos, sin soltarla.

              "¡Ahora es tu oportunidad, Barry!", dice Hadrik. "¡Rápido! No sé cuánto tiempo aguantará este pegamento."

              Como el suelo bajo el enano ya está empezando a resquebrajarse por la fuerza con que el mamut intenta retirar la trompa, salgo volando deprisa hacia arriba para atacar el punto débil de la bestia.
          - source: scene_text_2
            paragraph: 31
            text: |-
              Llego hasta los ojos tan rápido como puedo e intento dispararles con la ballesta, con la esperanza de coger al monstruo por sorpresa antes de que cierre los ojos. Por desgracia, al mamut le basta con parpadear por puro instinto para que los virotes de la ballesta simplemente reboten en el párpado. Intento disparar unos cuantos más, pero la criatura no hace más que cerrar los ojos, con lo que mis esfuerzos se vuelven completamente inútiles. Parece que voy a tener que usar la daga para que esto funcione.

              Me lanzo en picado hacia uno de los ojos del mamut a toda velocidad y le hundo la daga con toda la fuerza que soy capaz de reunir.

              Sin embargo, no soy lo bastante fuerte para que el arma llegue hasta el ojo, y la hoja se queda atascada en el párpado. Mientras intento sacarla, Hadrik por fin pierde el agarre y la trompa del mamut viene directa hacia mí, me aplasta como a un insecto y me mata en el acto.
