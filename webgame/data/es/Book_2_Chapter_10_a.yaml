          - source: scene_text_2
            paragraph: 11
            text: |-
              Apuntar desde esta distancia, con el orco en movimiento, es un poco difícil, pero por suerte he invertido un punto en mi habilidad de técnica de combate, así que, tras observar al orco durante unos segundos, pude predecir con precisión cómo se movería. Por desgracia, el casco del orco es demasiado resistente y el virote de la ballesta rebota en él sin causarle ni la más mínima molestia al guerrero. Aun así, esa pequeña ventana de oportunidad le basta a Leila para lanzarse a rematarlo y cortarle la garganta con una de sus dagas.

              Cuando miro cómo les va a los demás, me doy cuenta de que el resto de los monstruos ya han muerto y de que mis compañeros se están reuniendo junto al bosque para que podamos ir a luchar juntos contra los magos orcos y su capitán.

              "Nos hemos quitado de encima a estos supuestos guerreros 'de élite' en un abrir y cerrar de ojos, ¿eh?", dice Nolderan antes de echarse a reír.

              "Todavía no", dice Daren. "Aún quedan cinco magos esperando en el bosque. Y la habilidad de combate de su capitán es muy superior a la de sus subordinados. Deprisa, lleguemos hasta ellos antes de que..."

              A Daren lo interrumpe de pronto el sonido de un cuerno muy potente procedente de la dirección del capitán orco, lo que nos obliga a todos a taparnos los oídos para amortiguar parte del ruido.

              "¡Mierda!", dice Arraka en cuanto el capitán orco deja de tocar el cuerno. "Se me olvidó comprobar lo de arriba. ¡Se acercan jinetes de guiverno! ¡Se acercan jinetes de guiverno!"
            condition: combat_technique = 1 AND b2_ch6_crossbow = 0
          - source: scene_text_2
            paragraph: 13
            text: |-
              Intento predecir hacia dónde se moverá y disparo, pero el virote de la ballesta falla por un margen considerable. Supongo que disparar a blancos en movimiento desde esta distancia va a ser un poco más difícil de lo que pensaba. Quizá debería guardar el tiro por ahora, antes de alcanzar a Leila por accidente. Por suerte, no pasa mucho tiempo hasta que Leila logra pillar al orco con el pie cambiado y aprovecha enseguida para cortarle la garganta con una de sus dagas.

              Cuando miro cómo les va a los demás, me doy cuenta de que el resto de los monstruos ya han muerto y de que mis compañeros se están reuniendo junto al bosque para que podamos ir a luchar juntos contra los magos orcos y su capitán.

              "Nos hemos quitado de encima a estos supuestos guerreros 'de élite' en un abrir y cerrar de ojos, ¿eh?", dice Nolderan antes de echarse a reír.

              "Todavía no", dice Daren. "Aún quedan cinco magos esperando en el bosque. Y la habilidad de combate de su capitán es muy superior a la de sus subordinados. Deprisa, lleguemos hasta ellos antes de que..."

              A Daren lo interrumpe de pronto el sonido de un cuerno muy potente procedente de la dirección del capitán orco, lo que nos obliga a todos a taparnos los oídos para amortiguar parte del ruido.

              "¡Mierda!", dice Arraka en cuanto el capitán orco deja de tocar el cuerno. "Se me olvidó comprobar lo de arriba. ¡Se acercan jinetes de guiverno! ¡Se acercan jinetes de guiverno!"
            condition: combat_technique = 0
          - source: scene_3
            paragraph: 9
            text: |-
              Todos alzamos la cabeza y vemos diez guivernos negros precipitándose rápidamente desde las nubes en las que se habían ocultado hasta ahora. Cada una de las criaturas va montada por un orco con armadura de cuero corriente que empuña una lanza larga o una ballesta. Los guivernos son versiones más pequeñas de los dragones, con una longitud corporal de unos quince pies y unas alas de unos veinte pies de envergadura. Son bastante menos inteligentes que los dragones, sus escamas son mucho menos resistentes y no pueden escupir fuego, pero, aparte de eso, su aspecto es bastante parecido. En cuanto los jinetes de guiverno se dan cuenta de que ya los hemos visto, frenan su descenso y empiezan a dar vueltas por el cielo, esperando el momento adecuado para atacar.

              "Flower, Illuna y yo nos ocuparemos de los guivernos", dice Kate. "El resto no pueden volar, así que no podrán ayudarnos. Creo que todos deberían ir a ocuparse de los magos antes de que pidan más refuerzos."

              "Puede que tengas razón", dice Daren. "Al menos los hemos obligado a revelar el as bajo la manga, así que no deberían poder sorprendernos con nada más... ¡¡¡MALDITA SEA!!!"

              Mientras Daren terminaba la frase, apareció en el suelo un círculo azul enorme en la zona que nos rodea, y una tenue luz azul empezó a envolvernos lentamente.

              "¡Salgan del círculo de invocación!", grita Daren. "¡Fuera, ahora!"
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch10a_mammoth
                condition: is_dead = 0
      - condition: b2_ch9_drink = 0
        texts:
          - source: scene_text
            paragraph: 15
            text: |-
              Entonces corre a toda velocidad hacia un orco que está demasiado ocupado luchando contra Daren como para prestarle atención a Nolderan, da un salto horizontal, gira el cuerpo de lado en pleno aire y lanza sus pies contra la espalda del monstruo. Cuando el orco pierde el equilibrio, el exsabio cae al suelo sobre el hombro izquierdo. Daren aprovecha de inmediato la oportunidad y le clava la espada en la cabeza al monstruo, mientras Nolderan rueda rápidamente hacia un lado para evitar que otra maza orca lo aplaste. En cuanto el exsabio se pone en pie, finta un ataque con una de sus espadas, como si fuera a hacer un tajo completo por la izquierda, y justo cuando el orco levanta el escudo para defenderse, la segunda espada de Nolderan entra por la derecha buscando el cuello del monstruo y le corta la cabeza de un solo golpe.

              Decido que ya es hora de sumarme también a la batalla, así que apunto con mi ballesta a uno de los orcos con los que está luchando Leila.
          - source: scene_text_2
            paragraph: 10
            text: |-
              Apuntar desde esta distancia, con el orco en movimiento, es un poco difícil, pero por suerte he invertido algunos puntos en mi habilidad de técnica de combate, así que, tras observar al monstruo durante unos segundos, pude predecir con precisión cómo se movería. El virote de mi ballesta impacta al orco justo a través de la abertura del casco y lo mata al instante.

              Cuando miro cómo les va a los demás, me doy cuenta de que el resto de los monstruos ya han muerto y de que mis compañeros se están reuniendo junto al bosque para que podamos ir a luchar juntos contra los magos orcos y su capitán.

