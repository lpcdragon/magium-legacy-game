  - name: b2_ch10a_arena
    texts:
      - source: scene_text
        paragraph: 35
        text: |-
          Mientras aterrizo lentamente en el suelo, junto al cadáver del monstruo, Hadrik suelta una carcajada de las buenas. Cuando me fijo bien en él, veo que tiene un ojo morado de todos los golpes que se ha llevado en esta pelea.

          "¡De esto se trata!", dice Hadrik. "¡Es por momentos como este por los que me uní a este torneo! ¡Sabía que quedarme en este grupo era la decisión correcta! ¡Con ustedes no hay forma de quedarse sin enemigos poderosos a los que enfrentarse!"

          "Lo de ustedes dos ahí arriba ha sido una combinación bastante impresionante", dice Nolderan. "No sabía que alguno de ustedes tuviera la capacidad de volar."

          "Sí, bueno, si Barry destaca en algo, es en su ingenio", dice Hadrik. "Eso ya quedó más que claro después de que, contra todo pronóstico, lograra ingeniárselas para salir con vida de la arena."

          "¿Una arena, dices?...", pregunta Nolderan.
      - source: scene_text_2
        paragraph: 38
        text: |-
          "Ah, es verdad, no te contamos eso", dice Hadrik. "En Thilias, todos tuvimos que luchar en un evento de arena y el dueño de esa arena le había tomado una manía tremenda a Barry y a Leila. O mejor dicho, quería convertirlos en las estrellas del espectáculo. Les echó literalmente encima todo lo que tenía y, aun con unos debiluchos por compañeros, lograron salir victoriosos. Más tarde ya te pondremos al corriente de los detalles."

          "Espero que el capitán orco no esté planeando volver a teletransportarse con todavía más refuerzos...", dice Daren. "De verdad necesitamos encontrar una forma de impedir que escapen. Si no, no harán más que volver una y otra vez, hasta que estemos completamente agotados."

          "O podrían intentar hacer un mejor trabajo ocultando sus huellas a partir de ahora", dice Nolderan. "Si han conseguido encontrarlos por segunda vez, entonces seguramente ustedes dejaron un rastro muy evidente que seguir."

          "Sí, seguramente tengas razón...", dice Daren. "Ahora que lo pienso, la única forma de que nos hayan encontrado tan rápido es que se teletransportaran de vuelta al lugar de nuestra batalla anterior y siguieran nuestras huellas hasta el campamento."
    effects:
      - set:
          ac_b2_ch10_mammoth: 1
        achievement:
          id: ac_b2_ch10_mammoth
          title: Matador de mamuts
    choices:
      - position: 1
        text: ¿Y si nos han lanzado un hechizo de rastreo?
        effects:
          - set:
              current_scene: b2_ch10a_checked
              b2_ch10_scouts: 0
      - position: 2
        text: También podrían tener exploradores repartidos por todo el continente.
        effects:
          - set:
              current_scene: b2_ch10a_checked
              b2_ch10_scouts: 1
  - name: b2_ch10a_checked
    routes:
      - condition: b2_ch10_scouts = 0 AND b2_ch10_bribe = 2 AND ch10_gems = 1
        texts:
          - source: scene_text
            paragraph: 36
            text: |-
              "¿Y si nos han lanzado un hechizo de rastreo?"

              "¿Te refieres a como el que el zorro dorado nos lanzó antes de llegar a Thilias?", dice Daren. "No creo que sea el caso. Como mago blanco, debería ser capaz de detectar este tipo de hechizos mejor que nadie. El zorro es un espíritu muy poderoso del plano mágico, así que sus hechizos serían mucho más difíciles de detectar de lo normal, pero estos no son más que unos simples monstruos. No debería tener ningún problema para detectar hechizos lanzados por uno o dos magos orcos."

              "¡Eh, miren, sus elementalistas están bajando otra vez!", dice Nolderan. "Creo que ya han terminado de matar a los jinetes de guiverno. No, espera, queda uno más. Está bajando hacia nosotros. ¡Prepárense!"

              "¡Esperen!", digo. "No lo ataquen. ¡Ese está de nuestro lado!"

              "¿Lo está?...", pregunta Daren, confuso.

              "Sí, lo soborné con unas gemas y cambió de bando en mitad de la batalla", digo.

              "¡Ja!", dice Hadrik. "¿Ves lo que te decía de lo ingenioso que es Barry? Es como si tuviera un suministro constante de ideas locas en la cabeza y, cuando necesita una, la sacara sin más. En serio, ¿a quién más se le habría ocurrido intentar sobornar a un orco enemigo en plena pelea?"
          - source: scene_text_2
            paragraph: 39
            text: |-
              Cuando Kate y Flower aterrizan junto a nosotros, el jinete de guiverno se detiene a una docena de pies del suelo, mientras el guiverno sigue batiendo lentamente las alas para mantener la altitud.

              "Todos los demás orcos han muerto, humano", dice el orco. "He cumplido mi parte del trato."

              "Y ahora yo cumpliré la mía", le digo, mientras saco un diamante de la bolsa de oro y se lo lanzo.

              El orco atrapa el diamante en la mano, lo observa desde varios ángulos para asegurarse de que no es falso y luego lo guarda en la banda que lleva ceñida a la cintura.

              "Debo dejarlos ahora, humano", dice el orco. "Antes de que otras tropas de Tyrath lleguen a este lugar y descubran que sigo vivo. Quizá volvamos a encontrarnos."

              "Sí", digo. "Me aseguraré de saludar si alguna vez visitamos el campamento de Fyron."

              El orco asiente y luego le da una orden a su guiverno, que asciende y se aleja de este lugar todo lo posible.
