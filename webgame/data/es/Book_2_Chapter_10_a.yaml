  - name: b2_ch10a_undefeated
    texts:
      - source: scene_text
        paragraph: 7
        text: |-
          "Perdón por interrumpir", dice Flower, "pero ¿por qué no intentaste recuperar tu título de sabio después de perderlo si era tan importante para ti? ¿No celebran una competición para eso todos los años, en cada uno de sus continentes?"

          "¿Por casualidad eres de Varathia, pequeña?", pregunta Nolderan.

          "Sí, nací aquí", dice Flower. "¿Por qué lo preguntas?"

          "Bueno, supongo que eso explicaría por qué harías una pregunta así", dice Nolderan. "Me imagino que en este continente aislado no les llega demasiada información sobre el mundo exterior, ¿verdad?"

          "Sí que recibimos algunas noticias, pero no muchas...", dice Flower. "¿Se han cancelado las competiciones anuales de sabios en la última década? ¿Por eso dejaste de competir en esos torneos?"

          "Oh, no, las competiciones siguen celebrándose", dice Nolderan. "Es por culpa de la persona que me quitó el título que renuncié a la esperanza de volver a ganar el título de sabio alguna vez..."

          "¿Qué quieres decir?", dice Flower.
      - source: scene_text_2
        paragraph: 5
        text: |-
          "Los cuatro sabios actuales no se parecen en nada a ninguno de los sabios que han ostentado el título en el último siglo", dice Daren. "Están en otra liga. Normalmente, un sabio no mantenía un título más de dos o tres años antes de ser destronado, pero tres de los cuatro sabios actuales llevan más de una década invictos. Azarius, el Sabio del Oeste, lleva más de treinta años siendo sabio. A estas alturas es prácticamente la cara del Continente Occidental. Su retrato sale en los periódicos casi todas las semanas. Uno pensaría que la edad lo habría debilitado, pero cada año parece hacerse más fuerte. Creo que, a estas alturas, casi todo el mundo ve las competiciones anuales como una simple formalidad y asume que Azarius seguirá ostentando el título hasta que muera de viejo."

          "Sé que Azarius te gusta mucho, Daren, pero no deberías hablar solo de él", dice Hadrik. "Puede que los otros tres sabios no hayan conservado sus títulos tanto tiempo como él, pero yo diría que sus hazañas son igual de impresionantes. Talmak, el Sabio del Norte, está considerado el elementalista de tierra más poderoso de nuestra época. Todos los adversarios que ha tenido en los doce años desde que heredó su título no estaban ni cerca de su nivel de poder. El único que de verdad logró plantarle cara fue el sabio anterior, pero ahora está muerto, junto con casi todos los demás magos que se atrevieron a desafiar a Talmak a lo largo de los años. Y luego está Selgurd. El elfo. Madre mía, ni me hagas empezar con el elfo..."

          "¿Él también conservó su título de sabio durante mucho tiempo?", pregunta Flower.
      - source: scene_3
        paragraph: 4
        text: '"No, pero el sabio anterior a él sí", dice Hadrik. "Lo consideraban a la altura de los otros tres sabios de reinado prolongado, y todo el mundo pensaba que nadie lograría derrotarlo jamás. Y entonces aparece este elfo don nadie salido de la nada y lo mata así, sin más, en menos de un minuto. Nadie sabe siquiera cómo lo hizo. Simplemente creó una ilusión para que nadie pudiera ver ni oír lo que estaba ocurriendo en la arena, y cuando la ilusión se desvaneció, el Sabio del Este estaba tirado en el suelo, sin vida, y la multitud se quedó completamente en silencio. Esto ocurrió el año pasado. Se abrió una investigación para averiguar qué provocó exactamente la muerte del viejo sabio, pero hasta ahora no se ha encontrado ninguna prueba. El elfo no quiso decir qué hechizo utilizó, pero el consenso general es que lo más probable es que usara algún tipo de hechizo que afecta a la mente."'
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch10a_drakesbane
              available_points: available_points + 3
              available_points_aux: available_points_aux + 3
  - name: b2_ch10a_drakesbane
    texts:
      - source: scene_text
        paragraph: 8
        text: |-
          "No había heridas externas", dice Daren, "así que, si de verdad fue un hechizo que afecta a la mente, debió de ser parecido al hechizo que el chamán ogro nos lanzó en el fuerte, aquel con el que podías morir dentro de tu propia mente si no tenías cuidado. Sin embargo, los investigadores de hechizos que analizaron los rastros del hechizo no encontraron ninguna coincidencia con ningún hechizo conocido. O eso afirmaban."

          "No sé si los organizadores intentan ocultar algo o no", dice Hadrik, "pero el caso es que el elfo ha conseguido de algún modo hacerse con el título de Sabio del Este, y a mucha gente no le ha gustado nada este giro de los acontecimientos. No tengo muy claro cómo lo hizo, pero Selgurd sí mató a uno de los magos más fuertes de nuestra época con el mínimo esfuerzo, así que sin duda será alguien con quien habrá que contar."

          "¿Y qué hay del Sabio del Sur?", pregunta Flower.
      - source: scene_text_2
        paragraph: 6
        text: '"El Sabio del Sur es con quien luché hace catorce años", dice Nolderan. "No tuve ninguna oportunidad contra él en la competición. Incluso hoy sigue invicto y nunca ha dado realmente la impresión de que alguien supusiera una amenaza seria para él desde que me arrebató el título. El hombre es un renombrado cazador de dragones conocido como Drakesbane. No estoy seguro de cuál es su verdadero nombre, pero ahora todo el mundo lo llama así por la gran cantidad de cabezas de dragón que tiene en su colección. Los dragones son casi una leyenda hoy en día, porque la mayor parte del tiempo permanecen ocultos y ya no atacan aldeas como hacían en el pasado, pero Drakesbane va a cazarlos en su propio territorio por deporte. A mucha gente le gusta fingir que las cabezas de dragón que trae a casa pertenecían en realidad a guivernos, para seguir creyendo que los dragones no existen, pero no creo que nadie que haya visto una de esas cabezas de cerca pudiera engañarse hasta creerse semejante tontería. Hay una diferencia muy clara entre la cabeza de un guiverno y la de un dragón, y esa diferencia sería obvia para cualquiera que no estuviera siendo voluntariamente ignorante."'
      - source: scene_3
        paragraph: 5
        text: De repente, oímos unos pitidos fuertes que salen del bolsillo de Leila y también del mío. Los dos sacamos nuestros dispositivos de estadísticas al mismo tiempo, y veo que ahora tengo tres puntos extra para invertir en mis estadísticas.
    choices:
      - position: 1
        text: Invertir puntos ahora
        effects:
          - set:
              current_scene: b2_ch10a_stats_spent
              storyboard_controls: Jump to frame "Stats"
      - position: 2
        text: Invertir puntos más tarde (pulsando el botón de estadísticas de la parte superior de la pantalla)
        effects:
          - set:
              current_scene: b2_ch10a_fortune
  - name: b2_ch10a_stats_spent
    texts:
      - source: scene_text
        paragraph: 8
        text: |-
          "No había heridas externas", dice Daren, "así que, si de verdad fue un hechizo que afecta a la mente, debió de ser parecido al hechizo que el chamán ogro nos lanzó en el fuerte, aquel con el que podías morir dentro de tu propia mente si no tenías cuidado. Sin embargo, los investigadores de hechizos que analizaron los rastros del hechizo no encontraron ninguna coincidencia con ningún hechizo conocido. O eso afirmaban."

          "No sé si los organizadores intentan ocultar algo o no", dice Hadrik, "pero el caso es que el elfo ha conseguido de algún modo hacerse con el título de Sabio del Este, y a mucha gente no le ha gustado nada este giro de los acontecimientos. No tengo muy claro cómo lo hizo, pero Selgurd sí mató a uno de los magos más fuertes de nuestra época con el mínimo esfuerzo, así que sin duda será alguien con quien habrá que contar."

          "¿Y qué hay del Sabio del Sur?", pregunta Flower.
      - source: scene_text_2
        paragraph: 6
        text: '"El Sabio del Sur es con quien luché hace catorce años", dice Nolderan. "No tuve ninguna oportunidad contra él en la competición. Incluso hoy sigue invicto y nunca ha dado realmente la impresión de que alguien supusiera una amenaza seria para él desde que me arrebató el título. El hombre es un renombrado cazador de dragones conocido como Drakesbane. No estoy seguro de cuál es su verdadero nombre, pero ahora todo el mundo lo llama así por la gran cantidad de cabezas de dragón que tiene en su colección. Los dragones son casi una leyenda hoy en día, porque la mayor parte del tiempo permanecen ocultos y ya no atacan aldeas como hacían en el pasado, pero Drakesbane va a cazarlos en su propio territorio por deporte. A mucha gente le gusta fingir que las cabezas de dragón que trae a casa pertenecían en realidad a guivernos, para seguir creyendo que los dragones no existen, pero no creo que nadie que haya visto una de esas cabezas de cerca pudiera engañarse hasta creerse semejante tontería. Hay una diferencia muy clara entre la cabeza de un guiverno y la de un dragón, y esa diferencia sería obvia para cualquiera que no estuviera siendo voluntariamente ignorante."'
      - source: scene_3
        paragraph: 5
        text: De repente, oímos unos pitidos fuertes que salen del bolsillo de Leila y también del mío. Los dos sacamos nuestros dispositivos de estadísticas al mismo tiempo, y veo que ahora tengo tres puntos extra para invertir en mis estadísticas.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch10a_fortune
  - name: b2_ch10a_fortune
    texts:
      - source: scene_text
        paragraph: 9
        text: |-
          "¿Tú también recibiste tres puntos?", le pregunto a Leila.

          "Sí, los puse todos en reflejos", escribe Leila, mientras ambos guardamos de nuevo nuestros dispositivos de estadísticas en los bolsillos.

          "¿Eso eran... baratijas del adivino?", pregunta Nolderan, confundido.

          "En efecto", digo.

          "No las usan para adivinación", dice Daren. "Las usan para mejorar mágicamente sus capacidades físicas. Sé que es un poco difícil de creer, pero lo he visto con mis propios ojos, así que puedo confirmar que es verdad."

          "Interesante...", dice Nolderan. "Siempre pensé que esos aparatos no eran más que juguetes, pero supongo que me equivocaba. ¿Hasta qué punto funcionan exactamente?"

          "Depende de tu condición física real", escribe Leila. "Si eres más débil, los dispositivos de estadísticas te harán menos efecto."

          "Ya veo...", dice Nolderan.

          "Entonces... ¿qué has estado haciendo todos estos años?", le pregunta Daren a su antiguo maestro. "He oído rumores de que has empezado a trabajar de mercenario, pero no sé si eran verdad o no."
      - source: scene_text_2
        paragraph: 7
        text: |-
          "Oh, eran verdad, vaya que sí", dice Nolderan. "Perder mi título de sabio tan poco después de haberlo conseguido y de una manera tan espectacular no fue precisamente bueno para mi negocio. La gente empezó a pensar que yo no era más que un viejo acabado y, poco a poco, comenzaron a buscar otros maestros de encantamiento y otros maestros de artes marciales. Después de todo, en el Continente Sur no faltan. Así que, cuando la gente dejó de acudir a mí para que la entrenara, decidí que mis talentos estarían mejor aprovechados en otra parte. Verás... cuando trabajas de mercenario, a nadie le importa tu reputación. Solo necesitan que saques el trabajo adelante. Puede que no sea la carrera ideal, pero pone comida en la mesa."

          "Lo siento muchísimo...", dice Daren. "No sabía que estos últimos años habían sido tan duros para ti. Al menos debería haberte dejado un transceptor para mantenernos en contacto."

          "No lo sientas", dice Nolderan. "Todos tenemos altibajos. Así es la vida. Pero, como he dicho, por lo menos este torneo me ha brindado la oportunidad de cambiar mi vida para mejor. Por eso estamos todos aquí, ¿no? Para intentar cambiar nuestras vidas a mejor."

          "En realidad...", dice Daren. "La razón por la que vine aquí es que..."

          "Oye, no es que quiera interrumpirte ni nada", dice Arraka, "pero Illuna me dijo que les avisara cuando hubiera enemigos intentando rodearnos, y casualmente eso es exactamente lo que está pasando ahora mismo mientras hablo."

          "¿Otra vez monstruos?", pregunta Daren.
      - source: scene_3
        paragraph: 6
        text: |-
          "Sí, monstruos", dice Arraka. "Más que la última vez. Todos están suprimiendo sus auras otra vez, pero reconozco al orco y a los dos ogros que se nos escaparon hace dos días. Deben de haber ido a buscar refuerzos. Ya no detecto a los dos goblins que los sacaron del apuro la última vez, así que deben de tener mucha más confianza en sus posibilidades de ganar esta vez. Cuento al menos quince guerreros y cinco magos. No, espera, mejor diecisiete guerreros. Cinco de ellos son ogros, incluidos los dos de antes. Doce son orcos, incluido su capitán con las hachas de batalla en llamas. Los cinco magos son una mezcla de orcos y ogros, pero esta vez ya no hay goblins."

          "Bueno, maestro", le dice Daren a Nolderan. "Creo que ha llegado el momento de que te vayas. Estos monstruos han venido aquí específicamente para matar a nuestro grupo, así que, mientras los evites de camino a tu campamento, lo más probable es que te ignoren y se centren en nosotros. Es una pena que este reencuentro haya tenido que ser tan corto, pero mientras ambos sigamos participando en este torneo, estoy seguro de que nuestros caminos volverán a cruzarse. Suponiendo que sobrevivamos a esta batalla, claro..."
