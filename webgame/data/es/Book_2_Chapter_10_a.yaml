      - condition: b2_ch10_toast = 0
        texts:
          - source: scene_text
            paragraph: 6
            text: |-
              "Yo paso, pero gracias por ofrecerlo", digo.

              "Yo también paso", dice Kate.

              "¿Y tú, Hadrik?", dice Nolderan. "No dejarás que este viejo haga un brindis él solo, ¿verdad?"

              "Bueno, todavía tengo esta botella de ale enana en la mano, así que sí, claro, me apunto", dice Hadrik mientras se prepara para unirse al brindis.

              "¡Bien!", dice Nolderan, y deja en el suelo la segunda botella que tenía en las manos. "¡Brindemos, entonces! ¡Salud, amigos míos! Gracias a todos por mantener a salvo a mi viejo alumno durante este torneo. Sé que a veces puede ser un poco cabezota, pero tiene buen corazón."

              "¡Salud!", dice Hadrik, mientras ambos hacen chocar sus botellas y empiezan a beber.

              "¿Qué está pasando?", pregunta Flower mientras ella y Leila se acercan a nosotros, después de haberse despertado por el ruido. "¿Tenemos visita?"
