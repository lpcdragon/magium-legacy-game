  - name: b2_ch10a_splitting
    texts:
      - source: scene_text
        paragraph: 11
        text: |-
          Mientras hablábamos, los orcos se han dividido en dos grupos, cada uno formando un muro con sus escudos y avanzando lentamente hacia nosotros desde ambos lados. Sin embargo, el capitán orco de nuestra última batalla no aparece por ninguna parte.

          "Yo me encargo de los de la izquierda", dice Nolderan mientras se dirige hacia los monstruos.

          "Hay cinco orcos a la izquierda", dice Daren, empezando a seguir a su antiguo maestro hacia la batalla. "Yo voy contigo. Hadrik debería poder ocuparse él solo de la mitad de los guerreros sin demasiados problemas."

          Entonces ve que Leila se ha quedado atrás, sin saber qué hacer.

          "Leila, ve a ayudar a Hadrik", dice Daren. "El maestro Nolderan y yo deberíamos poder arreglárnoslas contra cinco orcos."

          Leila asiente y se dirige hacia los orcos de la derecha junto con Hadrik.

          "Yo iré a buscar a los magos", dice Kate.

          "No, espera", dice Daren. "No deberíamos correr el riesgo de separarnos. Podría haber trampas esperándonos en el bosque. Iremos todos juntos cuando terminemos con los guerreros."

          "Entendido...", dice Kate.
      - source: scene_text_2
        paragraph: 9
        text: |-
          Daren se lanza entonces a la batalla junto a su maestro, mientras Hadrik y Leila se preparan para enfrentarse a los monstruos de la derecha. El primero en trabarse con el enemigo es Hadrik. Atraviesa de un puñetazo el muro de escudos de los orcos de la derecha, hundiendo uno de los escudos del monstruo y derribando de espaldas a su portador. Luego salta muy alto por los aires y cae con el puño sobre un segundo orco justo cuando el monstruo levanta el escudo para protegerse.

          El sonido del puñetazo de Hadrik al golpear el escudo de metal retumba por todo el claro y, justo después, oímos el grito del orco cuando el brazo se le rompe por toda la presión. Mientras el guerrero aún intenta recuperarse, Hadrik lo agarra rápidamente por los pies y lo lanza contra dos de sus compañeros, haciendo que los tres se estrellen contra el suelo.

          Mientras tanto, Daren y Nolderan ya han alcanzado a los orcos de la izquierda y ahora los están flanqueando por ambos lados, obligando a los monstruos a renunciar a su muro de escudos y a centrarse en los adversarios que tienen delante. Cuando Nolderan empieza a luchar, puedo ver claramente el parecido entre su estilo de combate y el que usa Daren. Sin embargo, el estilo de Nolderan parece centrarse mucho más en no recibir ni un solo golpe, mientras que a Daren a menudo le gusta desviar los ataques y bloquearlos con el escudo mientras combate.
      - source: scene_3
        paragraph: 8
        text: |-
          Otra cosa que estoy notando es la increíble sincronización entre los dos. Aunque hayan estado separados más de diez años, se nota claramente que conocen de memoria los movimientos del otro y que no necesitan comunicar sus acciones con palabras en pleno fragor del combate, porque uno siempre sabe lo que el otro planea hacer a continuación. Más aún, parece que ninguno de los dos duda en bajar la guardia mientras el otro le cubre la espalda. Está claro que un nivel así de trabajo en equipo solo puede alcanzarse entre guerreros que han pasado muchos años luchando juntos, hombro con hombro.

          "Como en los viejos tiempos, ¿eh, Daren?", dice Nolderan después de rebanarle limpiamente la cabeza a un orco de los hombros.

          "¡Sí, veo que sigues siendo tan temerario como siempre!", dice Daren, mientras bloquea con el escudo una de las mazas de los monstruos. "¡No puedo creer que sigas vivo después de tanto tiempo!"

          "Podrás decir eso, pero está claro que estás disfrutando de la pelea", dice Nolderan con una sonrisa, mientras se aparta con un paso danzante de un enemigo y se prepara para enfrentarse a otro. "Aquí tienes otra temeridad para ti, muchacho. ¡Prepárate!"
