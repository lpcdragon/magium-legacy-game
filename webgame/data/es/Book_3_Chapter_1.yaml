  - name: b3_ch01a_humiliate
    texts:
      - source: scene_text
        paragraph: 20
        text: |-
          "¿Esa es la verdadera razón por la que aceptaste ayudarnos? ¿Humillar al Dios del Tiempo?"

          "¡Por supuesto!", dice Arraka. "Que Selkram sea derrotado por un grupo de enclenques como ustedes es la forma perfecta de vengarme de él, sobre todo teniendo en cuenta lo arrogante que es y lo mucho que desprecia a todos los seres del plano terrenal. Y aunque las cosas no salgan según lo previsto, aún podría tener la oportunidad de escapar del amuleto en medio de toda la confusión, y entonces lo mataría yo misma. ¡En cualquiera de los dos casos, yo gano!"

          "Entonces, ¿eso es todo?...", dice Melindra. "¿Ese es su gran plan para acabar con el Dios del Tiempo? ¿Creen de verdad que con un poco de entrenamiento basta para derribar a un dios?"

          Arraka se ríe.
