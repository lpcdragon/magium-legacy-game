              title: Contraseña conseguida
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch01a_ending
  - name: b3_ch01a_ending
    texts:
      - source: scene_text
        paragraph: 50
        text: |-
          "Bueno, si las cosas se ponen realmente mal, Melindra podría simplemente hacernos pasar volando por encima de las murallas como hizo en Thilias, ¿no?", dice Hadrik. "No es como si unos cuantos ballesteros fueran a detenernos."

          "Dentro de unos minutos tendremos las murallas de la ciudad a la vista y entonces tendrán la respuesta", dice Melindra. "Ahora, por favor, dejen de hablar para que pueda concentrarme en estas rocas. Quiero terminar de enseñárselas a Flower antes de llegar a Ollendor."

          Hacemos lo que dice Melindra y guardamos silencio durante los siguientes minutos, hasta que termina de mostrárselas todas. Después de guardarlas en la mochila, Melindra nos dice que veremos Ollendor en cuanto pasemos la línea de sauces que tenemos delante.

          "Entonces, ¿todos recuerdan cuando les dije que en Ollendor todavía conservan viejas reliquias de los días de gloria del imperio lessathi?", dice Melindra.

          "Sí, dijiste algo así cuando estábamos en la segunda etapa del ritual del Dios del Tiempo", dice Daren. "¿Por qué lo preguntas?"
      - source: scene_text_2
        paragraph: 29
        text: |-
          "Bueno...", dice Melindra, y luego aparta las ramas de sauce que tenemos delante para que podamos salir del bosque.

          Lo que vemos al salir del bosque nos deja atónitos por un instante, mientras todos nos quedamos mirando en completo shock la ciudad que puede verse a lo lejos, frente a nosotros. Tal y como nos dijo Melindra, parece que siguen conservándose las ruinas de las torres negras de seredium que antes reunían energía mágica para el antiguo imperio lessathi, pero lo que omitió decirnos es que, al parecer, todavía son funcionales, incluso en este estado de deterioro.

          De forma similar a como funcionaba todo hace cinco mil años, estas torres tienen grandes plataformas flotantes a cada lado que transportan magos por sus distintos niveles, y encima de cada una de las torres en ruinas hay una hebra púrpura de energía mágica que se mueve caóticamente en todas direcciones. Alguien debe de haber restaurado estas torres de algún modo, pero no devolviéndoles toda su funcionalidad, porque su tamaño es al menos cuatro veces menor que el de las torres que vimos durante el ritual, y la energía que irradian no es ni de lejos tan impresionante como la de hace cinco mil años.
      - source: scene_3
        paragraph: 17
        text: |-
          Aun así, parece que incluso esta cantidad menor de energía basta de sobra para alimentar todos los artilugios mágicos que puedan necesitar. El aire sobre la ciudad está lleno de vehículos metálicos voladores, también están presentes las grandes pantallas holográficas en el cielo que vimos en el antiguo imperio lessathi y, aparte de todo eso, parece haber bastantes gólems metálicos de veinte pies de altura patrullando la zona alrededor de la ciudad, listos para atacar a cualquier intruso no deseado. Mientras miramos la ciudad que tenemos delante con la boca abierta, un pájaro solitario intenta inocentemente volar por encima de las murallas para pasar al otro lado.

          Justo cuando sobrepasa la muralla, uno de los gólems gira de inmediato la cabeza hacia él y lanza de su boca un enorme rayo de fuego que incinera al instante a su objetivo, dejando solo cenizas en el aire donde antes estaba el pájaro.

          Mientras el resto nos limitamos a mirar al frente sin poder creerlo, Hadrik rompe el silencio haciéndole una pregunta a Melindra.

          "Entonces...", dice Hadrik. "Supongo que eso significa un 'no' al plan de hacernos pasar volando por encima de las murallas, ¿verdad?"
