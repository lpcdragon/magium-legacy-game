  - name: b3_ch01a_humanity
    texts:
      - source: scene_text
        paragraph: 42
        text: |-
          "No estoy... seguro de que la única razón de Eiden fuera humillarte", digo.

          "¿Qué quieres decir?", me pregunta Daren. "¿Qué otra razón podría haber tenido?"

          "Bueno", digo, "quiero decir, sí... quizá ese fuera su objetivo al principio, pero cuando te pusiste de rodillas y le dijiste que harías cualquier cosa que quisiera, por humillante que fuera, no te pidió nada, ¿recuerdas?"

          "Ah, viste esa escena...", dice Daren, con aspecto algo avergonzado. "Sí, ahora que lo pienso, tienes razón. Cuando le dije que haría cualquier cosa, pensé que se lanzaría de cabeza a la oportunidad, pero me dio el poder así, sin pedir nada a cambio. En realidad no, sí que pidió algo... Me pidió que 'le demostrara que estaba equivocado'. ¿Qué crees que quiso decir con eso?"

          "Casi con total seguridad estaba hablando de la discusión que tuviste con él antes", digo. "¿No lo recuerdas? Cuando se conocieron, le dijiste que todavía hay bondad por la que vale la pena luchar, y que mientras no te rindas encontrarás la manera de corregir las injusticias del mundo. Eso fue lo que dio inicio a toda tu rivalidad con él. Así que quizá, después de verte arrojarte de rodillas ante tu peor enemigo solo por salvar a una esclava, algo se le removió por dentro. Cuando te pidió que le demostraras que estaba equivocado, creo que quería que le mostraras con tus acciones durante este torneo que de verdad todavía queda esperanza para la humanidad, como dijiste, y que se equivocó al renunciar a todos los humanos como lo hizo."
      - source: scene_text_2
        paragraph: 24
        text: |-
          "No...", dice Daren, incrédulo. "Eso no puede ser lo que quería decir. Eiden perdió su humanidad hace muchísimo tiempo. Puede que en algún momento tuviera buenas intenciones, ¡pero eso fue hace cientos de años! Has visto cómo actúa. Considera a los humanos poco más que insectos. Él mismo lo dijo. No hay manera de que ahora esté teniendo dudas, después de todo este tiempo."

          "¿Seguro que no?", digo. "Porque si vamos a juzgarlo por cómo reaccionó cuando le dije que salvaría todas las ciudades de Varathia, yo diría que la situación podría ser muy distinta. Creo que, en el fondo, quiere estar equivocado, pero ya es demasiado tarde para que dé marcha atrás. Por eso nos está dando una última oportunidad de hacer lo que él no pudo hacer antes de que todo se vaya definitivamente al traste."

          "Madre mía...", dice Daren. "Había olvidado por completo que tú también dijiste que resolverías todos los problemas de Varathia por tu cuenta. Entre ganar el torneo, matar al Dios del Tiempo y salvar las ciudades, tienes una agenda bastante apretada por delante, ¿verdad, Barry?..."

          "¡Oye, ya me conoces!", digo, intentando parecer lo más confiado posible. "¡Todo forma parte del trabajo!"
      - source: scene_3
        paragraph: 15
        text: |-
          "¿Pero qué demonios?...", dice Daren. "¿Te golpeaste la cabeza o algo? ¡Juraría que acabo de oír algo de vacilación en tu voz!"

          "¿De qué estás hablando?", digo. "¡Claro que no vacilé! Yo nunca vacilo. Quizá fuiste tú el que se golpeó la cabeza, y no yo."

          "Claro...", dice Daren, mirándome con sospecha. "Escucha, si crees que tu plan de arreglar todos los problemas de Varathia es demasiado temerario, no tienes por qué seguir adelante con ello. Ya sabemos por la profecía que tendremos la posibilidad de salvar las ciudades de la destrucción de todos modos, así que no necesitas depender de la generosidad de Eiden. De hecho, quizá sería mejor que no diésemos su palabra por sentada en absoluto, porque quién sabe cuándo podría cambiar de idea... Y aunque tengas razón sobre él y de verdad desee estar equivocado en lo referente a su postura sobre la humanidad, no creo que nos vaya a facilitar la vida cuando recorramos esas ciudades. De hecho, estoy casi seguro de que hará todo lo posible por ponernos las cosas tan difíciles como pueda, tanto para 'ponernos a prueba' como para divertirse al mismo tiempo. Quizá nos convenga más centrarnos por ahora en la profecía y ocuparnos de las ciudades después de que uno de nosotros obtenga acceso al Magium."
    choices:
      - position: 1
        text: Tienes razón. Ya tenemos bastantes cosas de las que preocuparnos.
        effects:
          - set:
              current_scene: b3_ch01a_uneventful
              b3_ch1_cities: 0
      - position: 2
        text: No he cambiado de idea. Sigo queriendo salvar las ciudades antes de que termine el torneo.
        effects:
          - set:
              current_scene: b3_ch01a_uneventful
              b3_ch1_cities: 1
      - position: 3
        text: En realidad, nunca quise salvar esas ciudades en primer lugar.
        effects:
          - set:
              current_scene: b3_ch01a_uneventful
              b3_ch1_cities: 2
  - name: b3_ch01a_uneventful
    routes:
      - condition: b3_ch1_cities = 0
        texts:
          - source: scene_text
            paragraph: 43
            text: |-
              "Tienes razón. Ya tenemos bastantes cosas de las que preocuparnos."

              "No te preocupes", dice Daren. "Una vez obtengamos acceso al Magium, estoy seguro de que será mucho más fácil arreglar lo que sea que necesite arreglo en esas ciudades. Si estas cosas llevan ocurriendo tanto tiempo en Varathia, pueden esperar unas cuantas semanas más hasta que el torneo termine."

              "Dejando a un lado las ciudades de Varathia", digo, "creo que lo más importante que deberíamos hablar ahora mismo es si ya terminaste con tu práctica de aura, porque me estoy cansando un poco de quedarme aquí parado."

              "Ah, sí, perdón por eso...", dice Daren. "Solo necesito comprobar unas cuantas cosas más, pero voy a necesitar que te des la vuelta unas cuantas veces más antes de terminar. El flujo de tu aura es diferente a tu espalda de como es por delante, y me resulta demasiado difícil distinguir las diferencias si no lo veo desde el ángulo adecuado."

              "Vale, pero procura darte prisa", digo. "Esto está empezando a resultar un poco incómodo."

              Después de pasarse diez minutos enteros intentando analizar mi aura, Daren acabó rindiéndose y dijo que mañana le haría unas cuantas preguntas más a Arraka para aclarar una vez más qué era exactamente lo que se suponía que debía buscar. El resto de nuestro turno de guardia fue bastante tranquilo y principalmente hablamos de varias cosas de nuestras vidas antes de venir a Varathia, para hacer pasar el tiempo. Cuando llegó el momento de terminar nuestro turno, fueron Hadrik y Melindra quienes vinieron a relevarnos.
          - source: scene_text_2
            paragraph: 25
            text: |-
              Desde aquel día en que luchamos contra el Sabio del Norte, Melindra ha empezado a relacionarse con el grupo de una forma mucho más normal, e incluso se ofreció a hacer algunos turnos de guardia nocturna de vez en cuando. Aunque todavía no ha superado del todo su costumbre de provocar reacciones en la gente por diversión, los demás han empezado a entender que no hay mala intención detrás de sus actos, así que hoy en día la mayoría simplemente la ignora cuando vuelve a sus viejas andanzas. Por lo que he visto, Flower y yo seguimos siendo las personas en las que Melindra más confía dentro de nuestro grupo, pero desde luego se comporta de forma mucho más relajada con los demás que antes.

              Dejamos a Hadrik y a Melindra justo cuando estaban a punto de empezar una partida de cartas, y cada uno se fue a su tienda para dormir lo que quedaba de noche.

              Cuando me desperté a la mañana siguiente, fui a desayunar algo que había preparado Flower y, después de que todos termináramos de comer, reanudamos el viaje, con Melindra a la cabeza como siempre.

              No mucho después de nuestra partida, Daren empezó a hacerle a Arraka varias preguntas técnicas sobre cómo analizar auras, para sorpresa de todos los que lo rodeaban. Al ver que no pensaba callarse por sí solo, Arraka acabó decidiendo dejar de ignorar a Daren y dirigirse a él directamente.

              "¿Te volviste loco?", dice Arraka. "Nuestra sesión de entrenamiento no está programada hasta esta tarde. ¿Por qué demonios me estás haciendo todas estas preguntas ahora?"
            condition: ch11_saved_rose = 0
          - source: scene_text_2
            paragraph: 26
            text: |-
              Desde aquel día en que luchamos contra el Sabio del Norte, Melindra ha empezado a relacionarse con el grupo de una forma mucho más normal, e incluso se ofreció a hacer algunos turnos de guardia nocturna de vez en cuando. Aunque todavía no ha superado del todo su costumbre de provocar reacciones en la gente por diversión, los demás han empezado a entender que no hay mala intención detrás de sus actos, así que hoy en día la mayoría simplemente la ignora cuando vuelve a sus viejas andanzas. Por lo que he visto, Flower y yo seguimos siendo las personas en las que Melindra más confía dentro de nuestro grupo, pero desde luego se comporta de forma mucho más relajada con los demás que antes.

              Dejamos a Hadrik y a Melindra justo cuando estaban a punto de empezar una partida de cartas, y cada uno se fue a su tienda para dormir lo que quedaba de noche.

              Cuando me desperté a la mañana siguiente, fui a desayunar algo que había preparado Flower, y luego llamé a Rose por el transceptor para darle un breve resumen de lo que habíamos hablado con Arraka durante la reunión. Una vez terminé mi conversación con Rose y todos los demás también acabaron de comer, reanudamos el viaje, con Melindra a la cabeza como siempre.

              No mucho después de nuestra partida, Daren empezó a hacerle a Arraka varias preguntas técnicas sobre cómo analizar auras, para sorpresa de todos los que lo rodeaban. Al ver que no pensaba callarse por sí solo, Arraka acabó decidiendo dejar de ignorar a Daren y dirigirse a él directamente.

              "¿Te volviste loco?", dice Arraka. "Nuestra sesión de entrenamiento no está programada hasta esta tarde. ¿Por qué demonios me estás haciendo todas estas preguntas ahora?"
            condition: ch11_saved_rose = 1
          - source: scene_3
            paragraph: 16
            text: |-
              "¡Porque lo que me dijiste no tiene ningún sentido!", dice Daren, exasperado. "¿Cómo se supone que voy a encontrar la línea de flujo correcta en el aura de Barry cuando hay un millón de ellas y todas se ven exactamente iguales?"

              "¿Qué quieres decir con que se ven iguales?", dice Arraka. "Todas y cada una son completamente distintas. Incluso sus movimientos son más o menos independientes unos de otros. ¿De verdad eres TAN estúpido? ¿Cuánto tengo que simplificar esto para no sentir que estoy hablando con una pared?"

              "Creo que primero deberías aprender a detectar el aura de un lessathi normal, Daren", dice Flower con un tono inusualmente serio. "Incluso Arraka pensó al principio que Barry era un lessathi normal, y ya sabes lo buena que es con las auras. Si esta no es una diferencia que ella pueda distinguir de un vistazo sin buscarla expresamente, entonces no tienes ninguna posibilidad de encontrarla al primer intento. Illuna puede decir la diferencia entre el aura de un lessathi y la de un humano, así que quizá podría explicártelo en términos que te resulten más fáciles de entender."

              "¡Te dije que no hace falta que me llames por mi nombre real!", dice Illuna. "Puedes seguir llamándome Petal, como siempre."

              "Lo que tú digas, Illuna", dice Flower.

              "Ugh...", dice Illuna. "Haz lo que quieras."

              "Espera, ¿ustedes dos siguen peleadas desde ayer por la tarde?...", digo.

              "No estamos peleadas", dice Flower, sin más.

              "Claro...", digo.
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch01a_subjects
      - condition: b3_ch1_cities = 1
        texts:
          - source: scene_text
            paragraph: 44
            text: |-
              "No he cambiado de idea. Sigo queriendo salvar las ciudades antes de que termine el torneo."

              "Como quieras, Barry", dice Daren. "Solo decía que hay otras opciones que puedes considerar si estás empezando a echarte atrás con todo este asunto."

              "Dejando a un lado las ciudades de Varathia", digo, "creo que lo más importante que deberíamos hablar ahora mismo es si ya terminaste con tu práctica de aura, porque me estoy cansando un poco de quedarme aquí parado."

              "Ah, sí, perdón por eso...", dice Daren. "Solo necesito comprobar unas cuantas cosas más, pero voy a necesitar que te des la vuelta unas cuantas veces más antes de terminar. El flujo de tu aura es diferente a tu espalda de como es por delante, y me resulta demasiado difícil distinguir las diferencias si no lo veo desde el ángulo adecuado."

              "Vale, pero procura darte prisa", digo. "Esto está empezando a resultar un poco incómodo."

              Después de pasarse diez minutos enteros intentando analizar mi aura, Daren acabó rindiéndose y dijo que mañana le haría unas cuantas preguntas más a Arraka para aclarar una vez más qué era exactamente lo que se suponía que debía buscar. El resto de nuestro turno de guardia fue bastante tranquilo y principalmente hablamos de varias cosas de nuestras vidas antes de venir a Varathia, para hacer pasar el tiempo. Cuando llegó el momento de terminar nuestro turno, fueron Hadrik y Melindra quienes vinieron a relevarnos.
