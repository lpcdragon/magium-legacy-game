    routes:
      - condition: b3_ch1_kate1 = 0
        texts:
          - source: scene_text
            paragraph: 23
            text: |-
              Intento pasar junto a Kate, pero ella da un paso a un lado para volver a bloquearme el paso. Repetimos esto dos veces más, hasta que al final me veo obligado a preguntarle qué está pasando.

              "¿Vas a dejarme pasar o...?", digo.

              "No, no voy a hacerlo", dice Kate, sin más.

              "¿Y la razón es...?", digo.

              Kate se limita a mirarme con la misma expresión seria durante unos dos segundos antes de volver a hablar.

              "¿Por qué vacilaste antes, cuando Hadrik dijo que tú serías quien ganaría este torneo?", me pregunta Kate.

              "Oh...", digo mientras me tomo unos segundos para ordenar mis pensamientos antes de responder. "Solo fue que... me pilló por sorpresa, eso es todo. Estaba absorto pensando en las estrategias de Arraka y tardé un poco en darme cuenta de que Hadrik me estaba hablando. ¿De verdad te parece tan raro que dude al responder una pregunta como para que hayas tenido que venir expresamente a preguntármelo?"
          - source: scene_text_2
            paragraph: 16
            text: |-
              "No", dice Kate. "Pero esta no es la única vez en que has actuado de forma extraña durante estos últimos días. Te has estado comportando raro desde aquellos rituales. Aunque sigues intentando actuar como tu antiguo yo despreocupado para no despertar sospechas, está clarísimo que solo estás fingiendo. Antes tenías una especie de... ignorancia obstinada frente a cualquier obstáculo que en realidad fuera imposible de superar. No era ni valentía ni ausencia de miedo. Era otra cosa. Parecía como si tu yo de antes fuera literalmente incapaz de procesar la mera noción del peligro. Pero ahora eres distinto. De algún modo te has vuelto capaz de entender lo que el peligro es de verdad, y eso te está devorando por dentro."

              Hace entonces una pausa de unos segundos y me frunce el ceño mientras me mira directamente a los ojos.

              "Así que, ¿piensas hablar de ello o vas a seguir fingiendo que no ha pasado nada?", dice Kate.

              "Vaya...", digo. "De verdad supiste leerme como un libro abierto, ¿eh? Supongo que ya no tiene mucho sentido ocultarlo si por tu cuenta ya fuiste capaz de averiguar todo esto. Vamos... hasta esas dos rocas de allí y te contaré lo que quieres saber."

              Kate y yo empezamos a caminar hacia dos rocas grandes que se encuentran todavía en lo alto de la colina, pero lejos de donde Daren, Hadrik y Arraka están teniendo su sesión de entrenamiento. Una vez llegamos, cada uno se apoya de espaldas en una de ellas, mientras Kate cruza los brazos y me mira con intensidad.
