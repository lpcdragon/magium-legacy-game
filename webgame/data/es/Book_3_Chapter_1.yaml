scenes:
  - name: b3_ch01a_intro
    texts:
      - source: scene_text
        paragraph: 2
        text: |-
          "Oye, Barry, ¿ya terminaste de comer?", dice Daren. "Ya casi es la hora de nuestra reunión diaria de estrategia con Arraka."

          "Sí, ya casi he terminado", digo, mientras dejo mi plato en el suelo y empiezo a seguir a Daren. "Vamos."

          Ya han pasado tres días desde nuestro encuentro con el Dios del Tiempo. Durante estos últimos días nos hemos ido acercando poco a poco a la ciudad de Ollendor, y según Melindra deberíamos llegar a nuestro destino mañana, antes del mediodía. Mientras viajábamos, todos intentamos evitar en la medida de lo posible hablar de los rituales por los que pasamos, y nos esforzamos por actuar como si nada hubiera cambiado. Sin embargo, aunque en la superficie nuestras conversaciones no parecían muy distintas de antes, cada día quedaba más claro que todos habíamos sido afectados de algún modo por las pruebas del Dios del Tiempo.

          Probablemente esa sea también la razón por la que la mayoría de la gente de nuestro grupo acabó aceptando mi idea de que Arraka nos entrenara para derrotar a Selkram. Algunos se mostraron más reacios que otros, pero al final las únicas dos personas que no participan oficialmente en nuestras reuniones diarias son Leila y Melindra. Teniendo en cuenta que Leila se quedará en Ollendor con su padre y que Melindra ya no seguirá viajando con nosotros una vez haya cumplido su juramento, probablemente sea lo mejor. Al fin y al cabo, los planes de Arraka parecen requerir mucho tiempo para llevarse a cabo.
      - source: scene_text_2
        paragraph: 2
        text: |-
          "Todavía no puedo creer que de verdad estemos teniendo estas reuniones con Arraka...", me dice Daren mientras subimos despacio hacia nuestro punto de encuentro, situado en lo alto de una pequeña colina cerca del campamento. "Si me hubieras dicho hace una semana que alguna vez aceptaría algo así, me habría reído en tu cara."

          "No es como si tuviéramos mucha elección", digo. "Tú mismo lo dijiste. No tenemos ninguna experiencia tratando con dioses. La única de nuestro grupo que ha luchado contra ellos en igualdad de condiciones es Arraka. Si dependiera solo de nosotros hacer un plan de batalla, ni siquiera sabríamos por dónde empezar..."

          "Sí, sí, ya lo sé", dice Daren. "Es solo que se siente raro, ¿entiendes? No hace tanto que intentó matarnos. En realidad, ¿qué estoy diciendo? Nos mató, antes de que el tiempo se revirtiera. ¿Y ahora de pronto actúa como nuestra entrenadora? ¿Por qué aceptaría algo así? Si me preguntas a mí, esto huele raro."

          "Pero sí que tiene sus propias cuentas pendientes con los dioses", digo. "Ellos fueron quienes la desterraron del reino mágico, ¿recuerdas? Claro que querría vengarse de ellos de cualquier forma que pudiera. Y como lleva décadas atrapada en un amuleto, nosotros somos la mejor oportunidad que tiene."
    effects:
      - set:
          b3_ch1_unlock: 0
      - set:
          successful_checks:
            - 'Punto de control alcanzado: Partida guardada.'
        condition: checkpoint_rich = 1
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch01a_intro2
              checkpoint_rich: 0
  - name: b3_ch01a_intro2
    texts:
      - source: scene_text
        paragraph: 3
        text: |-
          "Supongo...", dice Daren. "Pero aun así, pienso tomarme con pinzas todo lo que diga. Todavía existe la posibilidad de que esto sea solo una de sus trampas habituales y nos esté haciendo perder el tiempo por pura diversión."

          Cuando por fin llegamos a la cima de la colina, vemos que todos, salvo Daren y yo, ya estaban allí esperándonos. Parece que Leila y Melindra también han decidido unirse a la reunión, aunque solo sea como espectadoras. Leila también ha presenciado nuestras reuniones las dos últimas veces, pero Melindra no se había molestado en venir hasta ahora. Supongo que al final la curiosidad pudo con ella al ver que estas sesiones de entrenamiento estaban convirtiéndose de verdad en algo habitual, en lugar de que nos rindiéramos tras los dos primeros intentos.

          "¡Llegan tarde!", nos dice Arraka a Daren y a mí mientras nos acercamos a ella y a los demás. "La penalización por llegar tarde a mi clase son veinte flexiones. Y más les vale no intentar hacer trampa, o les pondré un gorro de burro y los mandaré a sentarse en una esquina."
    choices:
      - position: 1
        text: Vale, vale, haré las flexiones.
        effects:
          - set:
              current_scene: b3_ch01a_fine
      - position: 2
        text: ¿Qué tal si tú haces primero veinte flexiones y yo hago las mías justo después?
        effects:
          - set:
              current_scene: b3_ch01a_afterwards
  - name: b3_ch01a_fine
    texts:
      - source: scene_text
        paragraph: 4
        text: |-
          "Vale, vale, haré las flexiones", digo.

          "¿Desde cuándo Arraka puede decirnos lo que tenemos que hacer?", dice Daren.

          "¿Y qué más da?", digo mientras me tiro al suelo y empiezo a hacer las veinte flexiones. "De todos modos, solo es un poco de ejercicio físico. Prefiero esto a perder el tiempo discutiéndolo eternamente."

          "¡Sí, pero aun así es una cuestión de principios!", dice Daren. "Y además llevo armadura pesada, así que no me apetece quitármela solo para seguirle el juego al numerito cómico de Arraka."

          "¿Ah, sí?", dice Arraka. "Bueno, ¿y qué pasa si decido que ya no quiero seguirles el juego a sus esfuerzos cómicos por derrotar a un dios? De todos modos, solo los estaba ayudando por aburrimiento. ¿No eran ustedes los que me suplicaron de rodillas que les diera la información que necesitaban?"

          "En realidad, lo único que hice fue hacerte una pregunta sencilla", digo mientras me levanto del suelo. "Fuiste tú quien se lanzó a la oportunidad de vengarse de los dioses a la primera que tuvo, no yo."

          "¡Ja!", dice Arraka. "Ahora que lo pienso, ¡nunca me suplicaste en condiciones que te ayudara! ¿Qué tal si arreglamos eso arrodillándote ahora mismo? Si suenas lo bastante desesperado, quizá acepte continuar con sus pequeñas sesiones de entrenamiento."
      - source: scene_text_2
        paragraph: 3
        text: |-
          "O quizá podrías dejar de hacer perder el tiempo a todos y seguir con la reunión", dice Illuna con tono firme. "No vinimos aquí a escuchar tus disparates."

          "¡Está bien, está bien!", dice Arraka. "Solo me estaba divirtiendo un poco, nada más. No hace falta ponerse tan rígidos por cada cosa. Todos, acérquense. Es hora de revisar sus progresos."

          No sé si es solo imaginación mía, pero hoy en día Arraka parece comportarse con mucha más obediencia hacia Illuna, y también se la toma más en serio que antes. Creo que toda su actitud hacia su exdiscípula ha empezado a cambiar poco a poco desde aquella vez en la que Illuna la amenazó con devolverla al Magium. Da la impresión de que, aunque no lo admita, Arraka ha empezado a sentir un respeto nuevo por Illuna después de ver cómo la enfrentó durante aquellos acontecimientos.

          "Empecemos con Daren, entonces", dice Arraka. "Esto promete. Dime, Daren, ¿cuánto has avanzado en contactar con el espíritu del plano mágico con el que estás vinculado? ¿Cero? Por favor, dime que otra vez es cero. ¡Sería divertidísimo!"

          "Bueno, quizá sería más de cero si tus consejos sirvieran para algo más que para soltar galimatías sin sentido", dice Daren. "Quiero decir, ¿cómo se supone que alguien va a sacar información útil de frases vagas como: 'Tienes que desenredar con tu mente el flujo de tu aura hasta que puedas verlo con claridad en tu cabeza', o 'Puedes pensar en el vínculo con tu espíritu como una cuerda muy larga e invisible de la que puedes agarrarte y tirar hasta conseguir llamar la atención del espíritu'?"
      - source: scene_3
        paragraph: 2
        text: |-
          "¡Solo un bruto como tú podría ver mis palabras de sabiduría como algo distinto de una bendición pura!", dice Arraka. "¿Tienes idea de cuántos matarían por tenerme como mentora? Bueno, no específicamente a mí, sino a alguien como yo, con miles de años de conocimientos sobre magia y que proviene del mismísimo plano de existencia de donde sale toda la energía mágica de este mundo. ¡Y en lugar de eso, mira lo que estás haciendo! Estás desperdiciando todo este inmenso potencial por la simple razón de que eres demasiado perezoso para intentar entender lo que te enseño."

          "¡Sí que intenté entenderlo!", dice Daren. "Pero nada de lo que has dicho tiene sentido para mí."

          "¡Pues inténtalo más!", dice Arraka. "O haz mejores preguntas. ¿Qué es exactamente lo que te cuesta? ¿La parte de la visualización? ¿El hecho de que tu sentido mágico sea demasiado débil para distinguir entre las incontables capas que componen tu aura? ¿Eres siquiera capaz de hacer cosas básicas, como determinar la edad de una persona analizando su aura? No tengo ni idea de lo que ustedes, debiluchos, son capaces de hacer. Lo único que sé es que su sentido mágico no es ni remotamente tan refinado como el mío, pero eso podría significar cualquier cosa."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch01a_swim
  - name: b3_ch01a_afterwards
    texts:
      - source: scene_text
        paragraph: 5
        text: |-
          "¿Qué tal si tú haces primero veinte flexiones y yo hago las mías justo después?", digo.

          "Ten cuidado, Barry...", dice Arraka. "Si vas a hacer chistes así, podría llevarme la impresión equivocada de que ya no quieres mi ayuda. Al fin y al cabo, solo hago estas reuniones de estrategia por la bondad de mi corazón. No tengo ninguna obligación de seguir ayudándolos si ni siquiera puedes molestarte en controlar esa lengua tuya."

          "Bueno, no soy ningún experto en matar dioses", digo, "pero de algún modo dudo que estas flexiones vayan a acercarme a mi objetivo de derrotar al Dios del Tiempo..."

          "¿Ah, sí?", dice Arraka. "Bueno, ¿y qué pasa si decido que ya no merece la pena perder el tiempo en estas reuniones? De todos modos, solo los estaba ayudando por aburrimiento. ¿No eras tú el que me suplicó de rodillas que te diera la información que necesitabas?"

          "En realidad, lo único que hice fue hacerte una pregunta sencilla", digo. "Fuiste tú quien se lanzó a la oportunidad de vengarse de los dioses a la primera que tuvo, no yo."

          "¡Ja!", dice Arraka. "Ahora que lo pienso, ¡nunca me suplicaste en condiciones que te ayudara! ¿Qué tal si arreglamos eso arrodillándote ahora mismo? Si suenas lo bastante desesperado, quizá acepte continuar con sus pequeñas sesiones de entrenamiento."
