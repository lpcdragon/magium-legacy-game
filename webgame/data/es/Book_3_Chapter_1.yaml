            paragraph: 29
            text: |-
              "Vaya, Kate, no sabía que te importara."

              "No seas idiota...", dice Kate. "Claro que me importa. Vamos, bajemos de esta colina. Leila probablemente te está esperando para trabajar en tu dispositivo de estadísticas."

              "Espera", digo. "¿Y tu propio ritual?"

              "¿Qué pasa con él?...", dice Kate.

              "¿Cómo lo... estás llevando?", digo. "Siempre te aseguras de que tus verdaderos sentimientos no se te noten en la cara, así que nunca puedo saber si algo te está afectando o no. Por eso intento preguntártelo directamente..."

              "Oh...", dice Kate mientras mira hacia un lado, y su expresión seria de antes se relaja un poco, probablemente en un intento de dejar de ocultarme su estado de ánimo actual.
