        texts:
          - source: scene_text
            paragraph: 26
            text: |-
              "Supongo que debería empezar por el principio", digo. "¿Recuerdas aquella vez en que te conté cómo mi hermana pequeña fue poseída por una banshee hace quince años y cómo mató a mis padres antes de que yo tuviera la oportunidad de salvarlos?"

              "Sí, lo recuerdo", dice Kate.

              "Bueno, resulta que la verdadera historia de lo que pasó fue un poco distinta", digo. "Solo me di cuenta en el ritual, cuando el Dios del Tiempo me obligó a revivir mi pasado, pero la realidad es que nunca llegué demasiado tarde para salvar a mis padres de la banshee. Estaba allí mismo, viéndolos morir, pero estaba demasiado asustado para hacer nada y simplemente me quedé paralizado de miedo. Solo cuando la banshee intentó matar también a mi hermano conseguí reunir por fin el valor para atacarla. Esto fue algo que había bloqueado por completo en mi mente durante los últimos quince años, y la única razón por la que lo recordé fue porque necesitaba recrear exactamente los acontecimientos de mi pasado para salir del ritual de Selkram."

              "Ya veo...", dice Kate, empezando a parecer un poco preocupada.
          - source: scene_text_2
            paragraph: 17
            text: |-
              "La cuestión es que no fueron solo mis recuerdos los que se vieron afectados por lo que pasó entonces", digo. "De algún modo, debí sentir una necesidad tan fuerte de no volver a quedarme paralizado por el miedo que eliminé de forma subconsciente mis instintos de supervivencia de mi proceso de toma de decisiones. Pero ahora que me doy cuenta de lo que pasó, me resulta un poco más difícil mantener la misma actitud de antes. No puedo evitar preguntarme si las decisiones que estoy tomando de verdad están bien o si solo son mis instintos defectuosos volviendo a activarse y nublándome el juicio..."

              "¿Es por eso por lo que vacilaste al responderle a Hadrik antes?", dice Kate. "¿Estás empezando a tener dudas sobre tus razones para haberte unido a este torneo?"

              "¡No!", suelto al principio, pero luego me tomo unos segundos para reconsiderar mis palabras. "Quiero decir... no lo creo... Todavía quiero ganar y convertirme en mago. Es solo que..."

              Hago una pausa, sin saber exactamente qué decir.
          - source: scene_3
            paragraph: 10
            text: |-
              "¿Es solo que ya no estás tan seguro de poder lograr lo imposible como antes?", dice Kate.

              "Es más que eso", digo. "Ni siquiera sé si el premio que busco es realmente lo que creía que era. No tengo ni idea de si existe alguna forma de usar el Magium para concederme poderes mágicos. Ni siquiera estoy seguro de que siga QUERIENDO el Magium. Todas las leyendas decían que se suponía que era la fuente de toda la magia, pero creo que es mucho más que eso. Casi fuimos borrados de la existencia solo porque Arraka eligió mal sus palabras mientras estábamos en el territorio del Magium. Incluso si obtuviera acceso al Magium, ¿y luego qué?... ¿Cómo sabría siquiera usarlo? No hay manera de que pudiera aprender a manipular ese extraño mundo con la misma seguridad con la que lo hacía Arraka. Y para empeorar las cosas, un simple error por mi parte podría llevar a mi aniquilación instantánea. Si de algún modo ganara el torneo y pudiera usar libremente el Magium, ¿por dónde sabría siquiera empezar?"
