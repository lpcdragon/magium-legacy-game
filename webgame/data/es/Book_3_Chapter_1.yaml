  - name: b3_ch01a_solution
    texts:
      - source: scene_text
        paragraph: 28
        text: |-
          "¿No nos dijiste que se suponía que debías tener cierta comprensión innata del Magium gracias a la sangre lessathi que corre por tus venas?", dice Kate. "O al menos eso deberías tener, según la teoría de Arraka. Si eso fuera cierto, entonces quizá tendrías más posibilidades de sacarle un uso real al Magium que los magos que se unieron al torneo."

          "Sí", digo, "pero antes pensaba que el Magium era la fuente de toda la magia. En ese contexto, no era irreal suponer que podría usarlo para convertirme en mago. Pero ahora que he visto de lo que es capaz el Magium... ya no estoy seguro ni de querer usarlo. Solo de pensar en volver a ese mundo se me eriza el vello de la nuca."

          "Entonces no uses el Magium", dice Kate. "Ya tienes la solución a tu problema ahí mismo, en el bolsillo. Puedes usar tu potenciador de estadísticas para convertirte en mago. Solo tienes que encontrar una manera de desbloquear tus estadísticas mágicas, y entonces ni siquiera necesitarás ya el Magium."

          "Eso solo funcionaría mientras siga aquí, en este torneo", digo. "En cuanto deje de haber magos a mi alrededor para alimentar el dispositivo, la energía se irá agotando por sí sola hasta que el potenciador de estadísticas quede completamente inutilizable."
      - source: scene_text_2
        paragraph: 18
        text: |-
          "¿Pero y si intentaras usar el conocimiento del Magium para modificar tu dispositivo de estadísticas?", dice Kate. "Por lo que dijo Arraka, supongo que de algún modo es posible acceder al Magium incluso sin entrar en su mundo. Seguro que, entre todo ese conocimiento, también habría una forma de hacer que tu dispositivo de estadísticas obtenga su energía directamente del plano mágico en vez de tomarla de otros magos, ¿no crees?"

          "¡Yo... creo que podrías tener razón!", digo, saltando de repente de la roca en la que estaba apoyado. "Sí... ¿Por qué no se me ocurrió? Aunque no sepa exactamente qué es el Magium, al menos debería poder obtener algo de conocimiento de él. Y, dada mi ventaja por ser medio lessathi, quizá de verdad pueda fabricar mi propia versión de un dispositivo de estadísticas con suficiente práctica. ¡Eso es brillante!"

          "Entonces, ¿debo suponer que ahora has recuperado algo de motivación para ganar esta competición?", dice Kate, levantando una ceja mientras sigue apoyada de espaldas en la roca.

          "¡Sí, desde luego!", digo.

          "Bien", dice Kate. "Quizá ahora por fin puedas centrarte más en nuestros objetivos que en tu propio caos interior. Ya me estaba cansando ver tu cara deprimida todo el día."
