              "Últimamente he tenido un poco de problema para dormir, pero nada demasiado serio", dice Kate, mientras sigue mirando hacia un lado. "Ya han pasado tres días, así que en gran parte ya lo he superado."

              "¡A mí no me parece en absoluto que lo hayas superado!", digo. "Si no supiera más, pensaría que llevas horas peleando tú sola contra un ejército de dragones, por lo cansada que te ves ahora mismo."

              Kate me frunce el ceño.

              "¿Ves? Por eso procuro que nunca se note en la cara cómo me siento realmente", dice. "No quiero que otras personas empiecen a preocuparse por mí cuando ya tienen sus propios problemas con los que lidiar."
        choices:
          - position: 1
            text: ¡Pero yo quiero preocuparme por ti!
            effects:
              - set:
                  current_scene: b3_ch01a_approached
                  b3_ch1_kate3: 0
          - position: 2
            text: Bueno, si estás segura de poder con ello, no insistiré más.
            effects:
              - set:
                  current_scene: b3_ch01a_approached
                  b3_ch1_kate3: 1
      - condition: b3_ch1_kate2 = 2
        texts:
          - source: scene_text
            paragraph: 31
            text: |-
              "Espera un momento. ¿Esta es tu manera de decir que estabas preocupada por mí?"

              "Esta no es mi manera de decir nada...", dice Kate. "Simplemente te di mi consejo porque sentí que lo necesitabas. Eso es todo. Vamos, bajemos de esta colina. Leila probablemente te está esperando para trabajar en tu dispositivo de estadísticas."

              "Espera", digo. "¿Y tu propio ritual?"

              "¿Qué pasa con él?...", dice Kate.

              "¿Cómo lo... estás llevando?", digo. "Siempre te aseguras de que tus verdaderos sentimientos no se te noten en la cara, así que nunca puedo saber si algo te está afectando o no. Por eso intento preguntártelo directamente..."

              "Oh...", dice Kate mientras mira hacia un lado, y su expresión seria de antes se relaja un poco, probablemente en un intento de dejar de ocultarme su estado de ánimo actual.
