      - condition: perception = 4 AND ancient_languages = 4 AND b3_ch1_unlock <> 2
        texts:
          - source: scene_text
            paragraph: 47
            text: |-
              Mientras Melindra sacaba una de las rocas de la mochila para enseñársela a Flower, no pude evitar fijarme en que tenía unos símbolos muy pequeños y apenas visibles grabados en la superficie, que normalmente habría ignorado de no ser porque además estaban escritos en una de las lenguas antiguas que me ha enseñado mi dispositivo de estadísticas. No necesité pedirle a Melindra que me dejara mirar la roca más de cerca, porque la giró en todos los ángulos posibles mientras se la enseñaba a Flower, lo que me dio tiempo de sobra para leer el texto. Al parecer, los símbolos estaban escritos en un dialecto muy antiguo de la lengua goblin, y su significado era: 'La contraseña es pico de grifo.'

              Aquellas palabras no me dijeron gran cosa, pero quién sabe. Quizá más adelante encuentre alguna utilidad para esa información.

              Mientras Melindra estaba ocupada enseñándole sus rocas a Flower, Daren decidió hacer una comprobación final para ver si todos seguíamos recordando nuestros planes de infiltración para la ciudad, que habíamos hablado largo y tendido durante el día anterior.

              "Muy bien, entonces, todos saben lo que tenemos que hacer una vez lleguemos a Ollendor, ¿verdad?", dice Daren.

              "Sí, sí, ya hemos hablado de esto antes", dice Hadrik. "Dependiendo de lo estricta que sea la seguridad, o intentamos colarnos o entramos por la puerta principal a la fuerza. No es que tengamos muchas otras opciones, de todos modos."
          - source: scene_text_2
            paragraph: 28
            text: |-
              "Un momento...", dice Melindra, volviéndose de repente hacia nosotros. "¿Han estado discutiendo cómo infiltrarse en la ciudad de Ollendor sin incluirme en sus reuniones?"

              "Bueno, te pedimos que te unieras un millón de veces, pero no hacías más que darnos largas, ¡así que al final tuvimos que hacer una reunión sin ti!", dice Daren. "No es como si pudiéramos empezar a planear estas cosas después de haber llegado ya a la ciudad."

              "¿Por qué no?", pregunta Melindra, confundida. "¿No habría sido mejor esperar a ver las defensas de la ciudad antes de hacer planes concretos?"

              "Bueno, sí, claro, pero tampoco es que no tengamos ya una idea general de a qué podríamos enfrentarnos", dice Daren. "Quiero decir, ya hemos visto las defensas de Thilias, así que supongo que Ollendor no puede ser tan diferente."

              "Oh, te aseguro que Ollendor es bastante diferente en lo que respecta a sus defensas", dice Melindra.

              "Entonces, ¿por qué no nos dices simplemente esas diferencias para que podamos ajustar nuestros planes en consecuencia?", le pregunta Daren.

              "Porque me resultaría más difícil explicárselas que simplemente mostrárselas", dice Melindra. "Lo entenderán cuando lleguemos."
        effects:
