  - name: b3_ch01a_sharpen
    texts:
      - source: scene_text
        paragraph: 16
        text: |-
          "Oh...", dice Melindra, acariciándose la barbilla. "Entonces, ¿su objetivo es que destierren a esos tres dioses al plano terrenal?"

          "Nah", dice Arraka. "Memphir es el único que conoce lo bastante bien el Magium como para hacer una cosa así, e incluso él probablemente no tendría el valor de volver a intentarlo después de lo que les pasó la última vez que lo hicieron. Aun así, Memphir casi con total seguridad se vería obligado a unirse al bando de los desterrados, así que el escenario más probable es que pronto hubiera una guerra total y duradera entre el Dios del Destino, el Dios de la Muerte, el Dios del Tiempo y todos los demás dioses y espíritus del reino mágico. Aunque tampoco me extrañaría que el Dios del Destino consiguiera poner a algunos otros dioses de su lado incluso en una situación así. Siempre ha sido un bastardo astuto."

          "Espera, entonces, si los otros dioses y espíritus van a hacer nuestro trabajo por nosotros, ¿por qué seguimos entrenando para luchar contra el Dios del Tiempo?...", dice Hadrik.

          "No podrán acabar con esos tres tan fácilmente", dice Arraka. "Si ni yo fui capaz de matarlos, entonces los otros espíritus tampoco podrán hacerlo. Como mucho, podemos aspirar a un punto muerto. Pero Selkram no puede salir ileso de una batalla así. Quedará gravemente debilitado, y eso es justo lo que necesitamos."
      - source: scene_text_2
        paragraph: 10
        text: |-
          "Pero sigo sin entender por qué Daren y yo somos los únicos que intentamos hablar con nuestros espíritus", dice Hadrik. "Si esto es tan importante, ¿no debería participar todo el mundo? Estoy bastante seguro de que tanto Kate como Leila tienen mejor sentido mágico que yo."

          "¿Y a quién contactarían, pedazo de idiota?", dice Arraka. "Kate es una maga artificial, así que no está conectada a ningún espíritu, y Leila ni siquiera es maga. Tú y Daren son los únicos en este grupo que están vinculados a espíritus mágicos. Bueno, técnicamente Flower está vinculada a Illuna, supongo, pero ella no está en el plano mágico, así que no cuenta."

          "Sí, pero yo decía que ellas deberían intentar contactar con nuestros espíritus, en lugar de con los suyos", dice Hadrik.

          "Eso no funciona así", dice Arraka. "Ya te lo dije ayer. Tienen que contactarlos ustedes mismos. Si alguien pudiera hacerlo desde fuera, yo misma ya lo habría hecho, ya que puedo ver esas malditas cuerdas invisibles que los atan a sus espíritus tan claras como el día. En fin, solo estamos perdiendo el tiempo discutiendo esto. Sigamos con el resto de la reunión. Kate, ¿cómo vas? ¿Lograste afilar mágicamente tus carámbanos lo suficiente como para afectar a esos objetivos que te di?"
      - source: scene_3
        paragraph: 5
        text: |-
          "No, los carámbanos simplemente siguen atravesándolos", dice Kate. "Intenté volcar mucha energía mágica en mis proyectiles para hacerlos todo lo poderosos que fuera posible, pero sigue sin tener ningún efecto, por más que lo intento."

          "No es en el poder en lo que tienes que centrarte", dice Arraka. "Es en el filo. Déjame explicártelo. Esos objetivos que hice para ti fueron creados a partir de una sustancia similar a la 'luz sólida' que compone el cuerpo energético de Selkram. Para poder afectar directamente a algo así, debes centrarte menos en el aspecto físico de tu hielo y más en su aura. Cuando afilas mágicamente tus proyectiles, lo que en realidad haces es afilar las auras de tus carámbanos, no los carámbanos mismos. Lo mismo ocurre cuando usas el afilado mágico con cualquier otro elemento. Y si el aura está lo bastante afilada, puede afectar incluso a un cuerpo hecho casi por completo de energía. Por eso da igual lo poderosos o rápidos que vuelvas tus proyectiles si su aura no es lo bastante buena."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch01a_trembling
  - name: b3_ch01a_trembling
    texts:
      - source: scene_text
        paragraph: 17
        text: |-
          Arraka se queda entonces en silencio durante uno o dos segundos mientras todos esperamos pacientemente a que retome el hilo.

          "Además", continúa Arraka, "ten en cuenta que los objetivos que hice para ti también tienen algo de materia física añadida para ponértelo un poco más fácil. Con Selkram va a ser muchísimo más difícil que eso. Claro que, si Melindra se uniera también a nosotros, las cosas podrían simplificarse bastante. Estoy casi segura de que sus cuchillas de viento son más que suficientemente afiladas como para destruir mis objetivos, y con un poco de guía por mi parte quizá incluso pudiera cortar luz sólida de verdad en cuestión de días. ¿Qué dices, Melindra? ¿No te gustaría tomarte al fin esa dulce, dulce venganza contra el Dios del Tiempo después de todo lo que te hizo?"

          "Ya te dije que no me interesa", dice Melindra. "Solo vine a esta reunión por curiosidad, no para unirme a sus planes. Yo no tengo deseos de morir, a diferencia del resto de la gente aquí."

          Hace una pausa.

          "Pero... supongo que podría darle a Kate algunos consejos sobre cómo afilar mejor su hielo, si quiere...", continúa Melindra.
      - source: scene_text_2
        paragraph: 11
        text: |-
          "Gracias...", dice Kate. "Aceptaré tu ayuda con gusto."

          "Dijiste que Kate tiene que centrarse en el filo del aura, pero ¿qué pasa con el endurecimiento de aura?", le pregunta Hadrik a Arraka. "¿Podría intentar golpear al Dios del Tiempo con los puños si endureciera bastante mi aura?"

          "Eh...", dice Arraka. "Supongo que en teoría podría ser posible, pero sin duda sería mucho menos efectivo. Podrías probar a darle puñetazos a algunos de los objetivos de Kate para ver qué tal vas, pero yo no me haría muchas ilusiones en tu lugar. A ver, veamos quién seguía en la lista... Ya confirmé que Barry y Leila no han avanzado nada en desbloquear las estadísticas mágicas del dispositivo de estadísticas, así que supongo que nos quedan Flower e Illuna, pero ya conozco sus progresos porque siempre ando colgando de su cuello. Flower, tú limítate a seguir concentrándote en afilar tu elemento, igual que Kate. Illuna, tú también podrías hacer eso, pero creo que deberías seguir trabajando en esas técnicas que te enseñé cuando todavía era tu mentora. Afilar tu elemento te saldrá mucho más natural una vez hayas practicado lo suficiente esas técnicas."
      - source: scene_3
        paragraph: 6
        text: |-
          "Lo tendré en cuenta", dice Illuna.

          "Muy bien", dice Arraka. "Así que tenemos a Barry trabajando en desbloquear sus estadísticas mágicas, tenemos a Kate, Flower e Illuna trabajando en su magia elemental, y tenemos a Daren, cuya espada encantada bien podría ser el único arma medianamente capaz de herir al Dios del Tiempo ahora mismo, pero que ni siquiera puede defenderse de alguien que le lance una piedra sin cubrirse de armadura pesada... ¡Me encanta! Este equipo es tan absolutamente desesperanzado que, si de verdad terminan matando a Selkram, sería lo más gracioso que haya pasado jamás en toda la historia combinada de los planos mágico y terrenal. Quiero decir, ¡imaginen la humillación que sentiría Selkram en sus últimos momentos tras ser derrotado por este grupo de debiluchos! ¡Tiemblo de emoción solo de pensarlo!"
    choices:
      - position: 1
        text: Sí, tengo que admitir que sería bastante gracioso.
        effects:
          - set:
              current_scene: b3_ch01a_admit
      - position: 2
        text: ¿Qué tal si seguimos con la reunión y dejamos los insultos por una vez?
        effects:
          - set:
              current_scene: b3_ch01a_insults
      - position: 3
        text: ¿Esa es la verdadera razón por la que aceptaste ayudarnos? ¿Humillar al Dios del Tiempo?
        effects:
          - set:
              current_scene: b3_ch01a_humiliate
  - name: b3_ch01a_admit
    texts:
      - source: scene_text
        paragraph: 18
        text: |-
          "Sí, tengo que admitir que sería bastante gracioso."

          "¿Y sabes qué es todavía más gracioso?", dice Arraka. "El hecho de que él nunca sospecharía ni en un millón de años que intentarías oponerte a él de algún modo. ¡Su estupidez es el camuflaje perfecto! Si nadie mete la pata, deberíamos poder sabotearlo delante de sus narices y no se dará cuenta de nada hasta el último momento."

          "Entonces, ¿eso es todo?...", dice Melindra. "¿Ese es su gran plan para acabar con el Dios del Tiempo? ¿Creen de verdad que con un poco de entrenamiento basta para derribar a un dios?"

          Arraka se ríe.
      - source: scene_text_2
        paragraph: 12
        text: |-
          "No, esto es solo el principio", dice. "En las próximas semanas voy a enseñarles a estos zopencos todo lo que necesitan saber para luchar específicamente contra Selkram. Les contaré todas sus debilidades, todas sus manías, todas las formas de provocarlo para que haga algo estúpido y todo lo demás que se me ocurra tras todos mis años de enfrentamientos con él. Y además, como inevitablemente tendremos que pasar al menos por uno más de los rituales de Selkram antes de poder atacarlo abiertamente, otra de las cosas que haré será enseñarles a estos perdedores todo lo que necesitan saber para borrar de una vez por todas esa sonrisa arrogante, engreída e irritante de la cara de mi yo del pasado. Le enseñaré a esa bufona lo que significa meterse con alguien de mi calibre. Será erradicada de la faz de la tierra, y será esta patética troupe de circo la que acabará con ella. No se me ocurre un final más apropiado para esa cretina que rechazó mi benevolente oferta e intentó amenazarme abiertamente para convertirme en su mascota."

          "Eh... sí te das cuenta de que ahora mismo estás hablando de ti misma, ¿verdad?", dice Hadrik.

          "¿De mí misma?", dice Arraka. "Esa triste imitación OJALÁ pudiera ser yo. Puede pensar que es lista, pero ya veremos quién se ríe al final cuando haya terminado con ella."

          "Sí, pero si nos cuentas sus debilidades, ¿no significaría que también nos estarías contando tus propias debilidades?...", dice Hadrik. "¿No nos ayudaría eso a luchar también contra ti y no solo contra ella?"
      - source: scene_3
        paragraph: 7
        text: |-
          "Esas debilidades son de hace cinco mil años", dice Arraka. "Desde entonces he encontrado la manera de sortear la mayoría. Y además, si alguna vez volvemos a pelear, preferiría que fuera algo más emocionante que yo convirtiéndolos a todos en polvo en unos pocos segundos. Ese tipo de batalla anticlimática arruina un poco toda la tensión, ¿saben a qué me refiero?"

          "Nos estamos desviando otra vez", dice Illuna. "Arraka, ¿cuál era ese nuevo plan que dijiste que se te ocurrió antes hoy mientras viajábamos? Pensaba que tenías información nueva importante que darnos, aparte de nuestra rutina habitual de repasar progresos."

          "¡Ah, sí!", dice Arraka. "¿Recuerdan cómo les dije que la próxima vez que estemos en un ritual vamos a necesitar tener un control absoluto de nuestras emociones para dejar de darle a ese bastardo toda la energía que necesita? Pues nuestros esfuerzos serán inútiles si no nos coordinamos también con todos los demás grupos que recibieron la profecía después de nosotros. Ya sabemos que el Sabio del Oeste y su pupilo estaban entre esos grupos y, por lo que entendí, algunos de ustedes ya se encontraron con ese 'Azarius' en este continente. Así que mi pregunta es: ¿tienen algún medio de comunicarse con él? ¿Tal vez un transceptor que Daren le haya dado?"
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch01a_unfortunate
  - name: b3_ch01a_insults
    texts:
      - source: scene_text
        paragraph: 19
        text: |-
          "¿Qué tal si seguimos con la reunión y dejamos los insultos por una vez?"

          "Oh, lo siento, ¿te sentiste insultado porque te llamé debilucho?", dice Arraka en tono burlón. "¿Debería haber usado otra palabra? ¿Corto de luces, quizá? ¿Zoquete? ¿Idiota? ¿Simplón? ¿Cabeza hueca? Puedes quedarte con la que prefieras si crees que te describe mejor. No querría que sintieras que no te estoy tomando en serio, al fin y al cabo."

          "Entonces, ¿eso es todo?...", dice Melindra. "¿Ese es su gran plan para acabar con el Dios del Tiempo? ¿Creen de verdad que con un poco de entrenamiento basta para derribar a un dios?"

          Arraka se ríe.
