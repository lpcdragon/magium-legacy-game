  - name: b3_ch01a_talented
    texts:
      - source: scene_text
        paragraph: 12
        text: |-
          Mientras Hadrik masculla por lo bajo lo que parece ser una palabrota enana, decido hacerle a Arraka una pregunta sobre las auras, ahora que seguimos con este tema.

          "¿También deberíamos los demás practicar nuestras habilidades de lectura de auras?", digo.

          "No", dice Arraka. "Como acabo de decir, si no eres ya un mago poderoso, tardarías años en dominar lo básico, así que tú, por ejemplo, solo estarías perdiendo el tiempo. Kate es una maga relativamente poderosa y probablemente sí se beneficiaría de aprender esto, pero prefiero que se centre en las tareas que le he dado, ya que nuestro tiempo es limitado. Illuna ya conoce más o menos lo básico, y Flower no es que lo haya aprendido exactamente, pero es capaz de captar algunas de estas cosas a simple vista, probablemente por ser una etérea. Y en cuanto a la chica muda... eh... Leila era su nombre, ¿no? En fin, creo que Leila quizá ya sepa bastante más que lo básico, ya que es capaz de saber por sus auras si están mintiendo o no. Esa es una habilidad bastante rara incluso para un lessathi, así que, en lo que respecta a la lectura de auras, está en otro nivel comparada con ustedes. No sé si eso es fruto de muchos años de práctica o de que simplemente es especialmente talentosa en este campo."

          "En realidad no soy tan talentosa...", escribe Leila. "Muchas veces no consigo descubrir cuándo la gente está mintiendo, incluso después de leer sus auras. Solo con personas muy fáciles de leer, como Barry, siempre logro saber si mienten o no."
      - source: scene_text_2
        paragraph: 7
        text: |-
          "La chica muda plantea algo importante", dice Arraka. "Barry, tus dotes para engañar son sencillamente abismales. La cara y el tono de voz no suelen delatarte, pero cuando mientes sobre algo, tu aura se sacude como loca. Si no haces algo con ese problema tuyo, corres el riesgo de delatarnos ante Selkram antes siquiera de que nos dé tiempo a poner el plan en marcha. ¡Controla de una vez tu aura!"

          "¿Y cómo se supone que esperas que haga eso?", digo.

          "Invirtiendo algunos puntos en tu estadística de Farol, obviamente", dice Arraka. "¿De verdad tengo que decírtelo todo?"

          "¿Mi... estadística de Farol?...", digo.

          "Sí, la que te ayuda a mantener tranquilo el flujo de tu aura incluso cuando sueltas una mentira descarada", dice Arraka. "Se llama literalmente 'Farol'. No tiene pérdida."

          "¿De qué estás hablando?", digo. "¡Yo no tengo esa estadística en mi dispositivo de estadísticas! ¡Y Leila tampoco!"

          "¿Qué?...", dice Arraka. "No, eso no puede estar bien. Debes de estar mirando en otro sitio o algo así. Dame ese dispositivo de estadísticas tuyo. Acércalo a mi amuleto para que pueda estudiar bien las partículas mágicas de la pantalla. Les encontraré esa estadística."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch01a_hidden
  - name: b3_ch01a_hidden
    texts:
      - source: scene_text
        paragraph: 13
        text: |-
          "Bueno, si tú lo dices...", digo mientras saco el dispositivo de estadísticas del bolsillo y lo pongo justo delante del amuleto de Arraka.

          Tras unos quince segundos de silencio, Arraka por fin decide volver a hablar.

          "Aquí hay algo que no cuadra...", dice. "No es solo que falte tu estadística de Farol. También faltan las otras dos estadísticas relacionadas con el aura. ¡No veo por ninguna parte en la pantalla la estadística de Sentido mágico ni la de Endurecimiento de aura! ¿Podrían haberlas eliminado? No... ¡Ocultas! Están ocultas, sin duda. Creo que estas estadísticas pueden venir ocultas por defecto, y que los tipos que vi usar potenciadores de estadísticas hace seiscientos años debían de haberlas desbloqueado manualmente. Es la única explicación que se me ocurre."
      - source: scene_text_2
        paragraph: 8
        text: |-
          "¿Acabas de decir algo sobre una estadística de Endurecimiento de aura?", digo mientras vuelvo a guardarme el dispositivo de estadísticas en el bolsillo. "¿Se supone que eso es algo parecido a la técnica que inventó Hadrik para poder defenderse en su forma transformada, cuando no podía lanzarse magia de protección a sí mismo?"

          "¿Eh?...", dice Arraka. "Ah, sí, el enano sí usa algo parecido. Pero obviamente no fue el primero en inventar esa técnica. Muchos otros idearon técnicas similares en el pasado, con más o menos el mismo propósito. Pero olvidemos eso por ahora. Creo que quizá les haya encontrado una tarea nueva a ti y a Leila. Supongo que todavía no han avanzado nada hacia desbloquear sus estadísticas de Poder mágico y Conocimiento mágico, pero quizá tengan más suerte si intentan desbloquear sus estadísticas de aura. También deberían conseguir que Daren los ayude, ya que es encantador. Pero procuren no trastear demasiado con el dispositivo. No querríamos que rompieran el potenciador de estadísticas por accidente y te volvieras todavía más inútil de lo que ya eres."
    choices:
      - position: 1
        text: Le echaré un vistazo con Leila y Daren, a ver qué encontramos.
        effects:
          - set:
              current_scene: b3_ch01a_inconvenient
              b3_ch1_unlock: 1
      - position: 2
        text: Preferiría esperar a reunirnos con el padre de Leila para que él le eche un vistazo.
        effects:
          - set:
              current_scene: b3_ch01a_inconvenient
              b3_ch1_unlock: 0
  - name: b3_ch01a_inconvenient
    routes:
      - condition: b3_ch1_unlock = 1
        texts:
          - source: scene_text
            paragraph: 14
            text: |-
              "Le echaré un vistazo con Leila y Daren, a ver qué encontramos."

              "Bien", dice Arraka. "Pueden hacerlo cuando terminemos la reunión. Pero recuerden no atosigar a Daren a menos que esté descansando de su entrenamiento de aura. Lo más crucial ahora mismo es que Daren y Hadrik encuentren la forma de contactar con los espíritus a los que están vinculados en el plano mágico. Todo lo demás va después."

              "No lo entiendo", dice Melindra. "¿Por qué es tan importante que Hadrik y Daren contacten con esos espíritus? ¿Cómo se supone que eso podría ayudarlos de algún modo a luchar contra el Dios del Tiempo?"

              "Ah, claro, tú no estuviste en nuestras dos últimas reuniones", dice Arraka. "Bueno, una de las razones por las que Daren necesita contactar con su espíritu es para que por fin pueda librarse de la increíblemente incómoda debilidad de no poder crear barreras mágicas contra ataques físicos. Está bastante claro que ese problema suyo viene del hecho de que está vinculado de forma incorrecta con su espíritu, así que si hablan las cosas, quizá encuentren la manera de arreglarlo. Así podría por fin quitarse esa horrible armadura suya y ponerse algo más apropiado para un mago, como una armadura ligera de cuero. Por no hablar de que, según su exmaestro, muchos de los movimientos que le enseñó no pueden usarse por culpa del peso de su armadura, y todos vimos lo bien que luchaba ese viejo vejestorio. Si Daren pudiera usar aunque fuera la mitad de esos movimientos vistosos, sería una mejora enorme."
          - source: scene_text_2
            paragraph: 9
            text: |-
              "Vale, ¿pero y Hadrik, entonces?", dice Melindra. "¿Qué ganaría él contactando con su espíritu?"

              "Nada", dice Arraka. "Pero ese no es el punto. Lo que importa es que NOSOTROS sí tendríamos algo que ganar con que él contacte con su espíritu."

              "¿Y por qué sería eso?", dice Melindra.

              "Bueno", dice Arraka, "la segunda y mucho más importante razón por la que queremos entrar en contacto con un espíritu del plano mágico es que queremos provocar un pequeño conflicto entre el Dios del Tiempo, el Dios de la Muerte y todos los demás espíritus."

              "¿Un conflicto?...", dice Melindra.

              "Mhm...", dice Arraka. "Verás, no sé cuánta atención le prestaste a mi discusión con Selkram, pero una de las cosas que mencioné al hablar con él fue que descubrí que también intentó absorber a otros espíritus, igual que yo, para ganar más poder. Fracasó miserablemente y, obviamente, nunca volvió a intentar algo así después de las primeras veces, pero los demás espíritus no lo saben. De hecho, lo más probable es que los demás no sepan absolutamente nada de que él y Ulruk intentaron absorber espíritus, porque si lo supieran, habrían intentado expulsarlos del plano mágico igual que hicieron conmigo. No parece que ninguno de los espíritus se haya dado cuenta de que las múltiples voces que usan Selkram y Ulruk al hablar provienen de los espíritus que absorbieron de forma incorrecta, pero eso cambiaría si yo pudiera entrar de algún modo en contacto con uno de los espíritus del plano mágico y contárselo todo."
          - source: scene_3
            paragraph: 4
            text: |-
              "¿Pero te creerían?...", dice Melindra.

              "Se verían obligados a creerme si les diera pruebas suficientes", dice Arraka. "Y como fui yo quien inventó la técnica, obviamente sé exactamente qué tienen que comprobar para convencerse de que esas voces provienen de espíritus mal absorbidos. ¡En cuanto descubran esto, será un caos absoluto! Todos los dioses y espíritus poderosos del reino mágico empezarán a temer por su propia existencia e intentarán deshacerse tanto de Selkram como de Ulruk. Eso también obligaría al Dios del Destino a escoger un bando en este conflicto y, aunque a Memphir quizá no le importe demasiado el Dios del Tiempo, desde luego no podría volverse contra el Dios de la Muerte en mitad de su alianza. Por tanto, los tres dioses no tendrían otra opción que formar una nueva alianza, convirtiéndose al mismo tiempo en enemigos de todos los espíritus del plano mágico. El Dios de las Tormentas y el Dios de los Mares sin duda liderarían la carga contra ellos, y también hay espíritus animales y monstruosos bastante poderosos que podrían suponer un buen desafío para nuestro trío divino."
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch01a_sharpen
      - condition: b3_ch1_unlock = 0
        texts:
