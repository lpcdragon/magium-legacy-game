  - name: b3_ch01a_mechanisms
    texts:
      - source: scene_text
        paragraph: 34
        text: |-
          "Sí...", digo mientras miro pensativo a lo lejos. "Supongo que esto demuestra que, a pesar de todo lo que hemos pasado juntos, al final del día no dejamos de ser un grupo de desconocidos que solo se conocen desde hace poco más de dos semanas, desde que empezó este torneo. No es como si lleváramos toda una vida viajando juntos como para sentirnos lo bastante cómodos como para hablar de este tipo de cosas sin dudarlo. Y además, la mayoría de la gente de nuestro grupo es o bien del tipo al que no le gusta cargar a los demás con sus problemas, o bien del tipo que no quiere parecer débil mostrando que estas cosas pueden afectarle. Si alguna vez vamos a tener conversaciones sinceras sobre cómo nos afectaron estos rituales, probablemente ocurrirá poco a poco y solo después de que todos hayan conseguido lidiar con sus propios problemas por sí mismos."

          "Supongo que tienes razón", escribe Leila. "No todo el mundo se sentirá cómodo abriéndose a personas a las que conoce desde hace tan poco. Pero quizá eso cambie con el tiempo..."

          Hace una pausa.

          "En fin", escribe Leila, "creo que deberíamos empezar a trabajar en tu dispositivo de estadísticas. Quizá tengamos suerte y hagamos algo de progreso hoy antes de irnos a dormir."
      - source: scene_text_2
        paragraph: 21
        text: |-
          Pasamos las dos horas siguientes trasteando con mi potenciador de estadísticas para ver si de algún modo podíamos desbloquear las tres estadísticas de aura ocultas de las que Arraka me había hablado durante la reunión. Como no queríamos molestar a Daren durante su sesión de entrenamiento con Arraka, al principio intentamos apañarnos con las herramientas de encantamiento que él ya nos había dado dos días atrás, cuando empezamos a trabajar en averiguar el código secreto necesario para activar las estadísticas mágicas. Sin embargo, cuando Daren bajó de la colina, le preguntamos si podía darnos algunas herramientas más apropiadas, porque las que habíamos estado usando antes servían mejor para nuestra tarea previa de descifrar códigos y no eran tan útiles para nuestro nuevo objetivo de encontrar menús ocultos.

          Con la ayuda de Daren y con los conocimientos de Leila sobre dispositivos mágicos aprendidos de su padre, al final conseguimos descubrir los menús ocultos de los que hablaba Arraka, pero ahora nos enfrentábamos a un nuevo problema, ya que el único método que Daren y Leila lograban imaginar para desbloquear estas estadísticas ocultas era arriesgado y, si teníamos mala suerte, incluso podía dejar mi dispositivo completamente inutilizado.
      - source: scene_3
        paragraph: 12
        text: '"Por mucho que le dé vueltas, no veo otra opción", dice Daren, sosteniendo dos herramientas metálicas afiladas en las manos y usándolas para manipular el aura alrededor de mi dispositivo de estadísticas. "No sé si el padre de Leila podría pensar en una idea mejor que esta, pero no se me ocurre otra manera de desbloquear estas estadísticas extra que romper por la fuerza el sello que hay sobre ellas. El problema es que, si existe algún tipo de medida de seguridad para impedir que ocurra algo así, tu dispositivo de estadísticas podría entrar en un modo de bloqueo de emergencia que podría impedirte por completo usar tus estadísticas normales hasta que se desactive el bloqueo. Si eso ocurre, seguir trasteando con el dispositivo sin tener una comprensión muy profunda de cómo funcionan sus mecanismos podría hacer que se rompiera por completo. Quizá de verdad sería mejor esperar al padre de Leila y ver si se le ocurren otras ideas antes de seguir avanzando con este plan."'
    choices:
      - position: 1
        text: Dejar el dispositivo de estadísticas como está
        effects:
          - set:
              current_scene: b3_ch01a_crossbow
              b3_ch1_unlock: 1
      - position: 2
        text: Intentar desbloquear por la fuerza las estadísticas ocultas.
        effects:
          - set:
              current_scene: b3_ch01a_crossbow
              b3_ch1_unlock: 2
  - name: b3_ch01a_crossbow
    routes:
      - condition: b3_ch1_unlock = 1
        texts:
          - source: scene_text
            paragraph: 35
            text: |-
              "Sí, no deberíamos arriesgarnos", digo. "Tendremos que seguir con esto en Ollendor."

              "De acuerdo, entonces", dice Daren. "En ese caso, ¿estás listo para hacer el primer turno de guardia nocturna? La mayoría de los demás ya se han ido a dormir."

              "Ah, sí, deja que vaya a por mi ballesta a la tienda y enseguida voy contigo", digo.
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch01a_oversee
      - condition: b3_ch1_unlock = 2
        texts:
          - source: scene_text
            paragraph: 36
            text: |-
              "No creo que tomaran medidas tan drásticas solo por desbloquear unas cuantas estadísticas ocultas", digo. "No es como si hiciera falta un código secreto para activarlas, como pasa con esas dos estadísticas mágicas. Yo digo que intentemos desbloquearlas por la fuerza y veamos qué pasa."

              "Bueno, es tu dispositivo, Barry, así que puedes hacer con él lo que quieras", dice Daren con cierta reticencia. "Esperemos que tus instintos acierten en esta."

              Entonces mueve un poco más las dos herramientas metálicas afiladas en el aire sobre el potenciador de estadísticas y, tras unos segundos, se detiene, mirando el dispositivo con intensidad.

              "Allá vamos", dice Daren, juntando ambas herramientas metálicas y tocando con ellas mi dispositivo.

              En cuanto lo hace, la pantalla de mi dispositivo se pone roja, y lo único que aparece es: '¡Advertencia! ¡Brecha de seguridad! Por su seguridad, este dispositivo ha sido bloqueado hasta que uno de los diseñadores pueda revisarlo y desbloquearlo manualmente."
          - source: scene_text_2
            paragraph: 22
            text: |-
              "Bueno...", dice Daren, mirando mi cara de shock. "No puedes decir que no te lo advertí. Como te dije antes, si ahora seguimos manipulándolo aún más, corremos el riesgo de romperlo por completo. Ya no nos queda otra opción que esperar hasta llegar a Ollendor y confiar en que el padre de Leila pueda arreglar esto de alguna manera. Pasó mucho tiempo modificando el dispositivo de estadísticas de Leila, así que con un poco de suerte quizá también sepa una forma de cancelar el bloqueo. Tendrás que vivir uno o dos días sin un potenciador de estadísticas funcional, hasta que por fin lo encontremos."

              "Sí...", digo, tranquilizándome un poco después del shock inicial. "Lo entiendo. Me las arreglaré hasta entonces."

              "Así que, sé que no estás precisamente de buen humor ahora mismo, pero deberíamos ir preparándonos para el primer turno de guardia", dice Daren. "La mayoría de los demás ya se han ido a dormir."

              "De acuerdo", digo. "Déjame ir a por la ballesta a la tienda y enseguida voy contigo."
        effects:
          - set:
              ac_b3_ch1_regrets: 1
            achievement:
              id: ac_b3_ch1_regrets
              title: Sin arrepentimientos
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch01a_oversee
  - name: b3_ch01a_complicated
    texts:
      - source: scene_text
        paragraph: 37
        text: |-
          Pasamos las dos horas siguientes trasteando con mi potenciador de estadísticas, continuando desde donde lo dejamos ayer, para ver si podíamos desbloquear mis dos estadísticas mágicas. Durante la primera media hora o así trabajamos por nuestra cuenta, usando algunas herramientas de encantamiento que Daren nos había dado dos días atrás. Cuando Daren bajó de la colina, le pedimos que nos echara una mano, y acabó trabajando junto con nosotros en el dispositivo durante la siguiente hora y media. Por desgracia, ni la experiencia de Daren con el encantamiento ni los conocimientos de Leila sobre dispositivos mágicos adquiridos de su padre estuvieron ni remotamente cerca de bastar para que pudiéramos hacer algún progreso apreciable.

          "Creo que deberíamos rendirnos por ahora", dice Daren, sosteniendo en sus manos una herramienta metálica redonda con pequeños pinchos y haciéndola girar en el aire sobre el dispositivo de estadísticas mientras intenta analizar su aura. "Descifrar un código así es demasiado complicado como para hacerlo en unas pocas horas. Ni siquiera estoy seguro de que exista una posibilidad realista de que lleguemos a lograrlo. En cualquier caso, Barry y yo deberíamos ir preparándonos para el primer turno de guardia nocturna. La mayoría de los demás ya parece haberse ido a dormir."

          "De acuerdo", digo. "Déjame ir a por mi ballesta a la tienda y enseguida voy contigo."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch01a_oversee
  - name: b3_ch01a_oversee
    texts:
      - source: scene_text
        paragraph: 38
        text: |-
          Le doy las buenas noches a Leila y voy a mi tienda para sacar la ballesta de la mochila. Luego vuelvo hacia la colina de antes, donde Daren me está esperando ahora mismo. Está sentado en el suelo, al pie de la colina, en un lugar desde el que podemos vigilar el campamento sin estar demasiado lejos de él, de modo que podríamos llegar rápidamente a las tiendas en caso de emergencia.

          "Un momento, Barry", me dice Daren justo cuando llego hasta él. "¿Podrías quedarte quieto ahí unos segundos sin moverte? Estoy intentando comprobar una cosa."

          "Eh, claro, supongo...", digo, deteniéndome y mirándolo confundido.

          Entonces se queda mirándome un rato con una expresión de enorme concentración.

          "Bien, ahora date la vuelta", me dice Daren.

          "Vale...", le respondo mientras hago lo que dice.

          "Hmm...", dice Daren tras otros pocos segundos. "¿Podrías darte la vuelta otra vez, pero esta vez de lado?"
    choices:
      - position: 1
        text: Hacer lo que dice
        effects:
          - set:
              current_scene: b3_ch01a_backwards
      - position: 2
        text: Preguntarle qué intenta conseguir
        effects:
          - set:
              current_scene: b3_ch01a_accomplish
      - position: 3
        text: ¿Quieres que también me marque un bailecito, ya que estamos?
        effects:
          - set:
              current_scene: b3_ch01a_dance
  - name: b3_ch01a_backwards
    routes:
      - condition: ch11_saved_slave <> 3
        texts:
          - source: scene_text
            paragraph: 39
            text: |-
              Vuelvo a girarme, asegurándome de que esta vez tenga una buena vista lateral de mí. Después de unos diez segundos más, Daren sigue sin haber encontrado lo que buscaba, así que me hace otra petición.

              "¿Podrías volver a ponerte de frente?", dice Daren. "Y quizá dar dos pasos hacia delante. En realidad no, olvida lo que he dicho. Necesito que retrocedas más. Empieza a caminar lentamente hacia atrás y te diré cuándo parar."

              "En serio, tío, ¿piensas decirme qué estás intentando conseguir aquí o vamos a seguir haciendo esto toda la noche?", digo mientras me giro para mirarlo.

              "Oh, cierto, cierto, perdón...", dice Daren, dándose cuenta por fin de lo ridícula que debe de parecer toda esta situación desde mi punto de vista. "Debería haber empezado explicándote qué estaba pasando."

              Hace entonces una pausa, con un aspecto algo avergonzado por lo que está a punto de decir.

              "Estaba intentando ver si podía detectar el hecho de que eres medio lessathi solo por el flujo de tu aura", dice Daren. "Arraka me enseñó hoy cómo hacerlo, pero sigo pensando que me falta captar algo..."

              "¿Estás usando tu tiempo libre para practicar algo que aprendiste de Arraka?...", le pregunto, atónito. "¿Tú?!"
          - source: scene_text_2
            paragraph: 23
            text: |-
              "¡Eh, no tienes por qué parecer tan sorprendido!", dice Daren. "También he estado practicando antes de hoy, ¿no?"

              "Sí, ¡pero nunca en tu tiempo libre!", digo. "Solo lo hacías durante las franjas diarias de tiempo que todos acordamos dedicar a perfeccionar nuestras habilidades, en preparación para nuestra inevitable batalla contra el Dios del Tiempo. E incluso entonces parecía que lo hacías todo a medias, sin tomártelo realmente en serio."

              "¡Eso es porque no pensaba que Arraka fuera a darnos consejos genuinamente buenos!", dice Daren. "Cuando la oí decir por primera vez todas esas cosas sobre las auras que sonaban tan absurdas, juraría que nos estaba tomando el pelo. No esperaba que hablara en serio sobre nada de esto. Solo después de ver esa 'cascada' en el aura sobre las cabezas de la gente me di cuenta de que no estaba bromeando, como hace normalmente."

              "Eh...", digo con voz pensativa. "Qué curioso. Yo habría jurado que la verdadera razón por la que no querías seguir los consejos de Arraka era porque es malvada y sospechabas que tenía motivos ocultos para querer ayudarnos."
          - source: scene_3
            paragraph: 13
            text: |-
              "Sí, bueno", dice Daren, "si hay algo que he aprendido de todo aquello de los rituales es que solo porque alguien sea malvado no significa que siempre vaya a tener malas intenciones. Sobre todo si hablamos de personajes impredecibles como Eiden o Arraka. Aunque te ayuden completamente de la nada, aún podría ser simplemente algo que decidieron hacer por capricho o por una razón meramente egoísta, pero no insincera. Como Arraka, que le está dedicando tanto esfuerzo a este plan simplemente porque le hace gracia imaginar que un grupo tan débil derrote al Dios del Tiempo."

              Hace una pausa y desvía la mirada hacia un lado.

              "O como Eiden, que me ofreció darme el poder para salvar a Ella simplemente porque quería verme humillarme, y no porque tuviera ningún otro motivo oculto", dice Daren con un tono de voz mucho más pesado.
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch01a_humanity
      - condition: ch11_saved_slave = 3
        texts:
          - source: scene_text
            paragraph: 39
            text: |-
              Vuelvo a girarme, asegurándome de que esta vez tenga una buena vista lateral de mí. Después de unos diez segundos más, Daren sigue sin haber encontrado lo que buscaba, así que me hace otra petición.

              "¿Podrías volver a ponerte de frente?", dice Daren. "Y quizá dar dos pasos hacia delante. En realidad no, olvida lo que he dicho. Necesito que retrocedas más. Empieza a caminar lentamente hacia atrás y te diré cuándo parar."

              "En serio, tío, ¿piensas decirme qué estás intentando conseguir aquí o vamos a seguir haciendo esto toda la noche?", digo mientras me giro para mirarlo.

              "Oh, cierto, cierto, perdón...", dice Daren, dándose cuenta por fin de lo ridícula que debe de parecer toda esta situación desde mi punto de vista. "Debería haber empezado explicándote qué estaba pasando."

              Hace entonces una pausa, con un aspecto algo avergonzado por lo que está a punto de decir.

              "Estaba intentando ver si podía detectar el hecho de que eres medio lessathi solo por el flujo de tu aura", dice Daren. "Arraka me enseñó hoy cómo hacerlo, pero sigo pensando que me falta captar algo..."

              "¿Estás usando tu tiempo libre para practicar algo que aprendiste de Arraka?...", le pregunto, atónito. "¿Tú?!"
          - source: scene_text_2
            paragraph: 23
            text: |-
              "¡Eh, no tienes por qué parecer tan sorprendido!", dice Daren. "También he estado practicando antes de hoy, ¿no?"

              "Sí, ¡pero nunca en tu tiempo libre!", digo. "Solo lo hacías durante las franjas diarias de tiempo que todos acordamos dedicar a perfeccionar nuestras habilidades, en preparación para nuestra inevitable batalla contra el Dios del Tiempo. E incluso entonces parecía que lo hacías todo a medias, sin tomártelo realmente en serio."

              "¡Eso es porque no pensaba que Arraka fuera a darnos consejos genuinamente buenos!", dice Daren. "Cuando la oí decir por primera vez todas esas cosas sobre las auras que sonaban tan absurdas, juraría que nos estaba tomando el pelo. No esperaba que hablara en serio sobre nada de esto. Solo después de ver esa 'cascada' en el aura sobre las cabezas de la gente me di cuenta de que no estaba bromeando, como hace normalmente."

              "Eh...", digo con voz pensativa. "Qué curioso. Yo habría jurado que la verdadera razón por la que no querías seguir los consejos de Arraka era porque es malvada y sospechabas que tenía motivos ocultos para querer ayudarnos."
          - source: scene_3
            paragraph: 14
            text: |-
              "Sí, bueno", dice Daren, "si hay algo que he aprendido de todo aquello de los rituales es que solo porque alguien sea malvado no significa que siempre vaya a tener malas intenciones. Sobre todo si hablamos de personajes impredecibles como Eiden o Arraka. Aunque te ayuden completamente de la nada, aún podría ser simplemente algo que decidieron hacer por capricho o por una razón meramente egoísta, pero no insincera. Como Arraka, que le está dedicando tanto esfuerzo a este plan simplemente porque le hace gracia imaginar que un grupo tan débil derrote al Dios del Tiempo."

              Hace una pausa y desvía la mirada hacia un lado.

              "O como Eiden, que me ofreció darme el poder para salvar a aquella esclava simplemente porque quería verme humillarme, y no porque tuviera ningún otro motivo oculto", dice Daren con un tono de voz mucho más pesado.
