  - name: b3_ch01a_dance
    routes:
      - condition: ch11_saved_slave <> 3
        texts:
          - source: scene_text
            paragraph: 41
            text: |-
              "¿Quieres que también me marque un bailecito, ya que estamos?", le digo a Daren mientras me giro para mirarlo.

              "¡La verdad es que no es mala idea!", dice Daren con una sonrisa. "Podrías probar ese baile enanil en el que saltas sobre un pie con los brazos detrás de la cabeza mientras no dejas de girar sobre ti mismo una y otra vez. No te preocupes, ya te diré cuándo parar."

              "Por desgracia, mi profesor de baile enanil se olvidó de enseñarme ese", digo. "Pero en serio, ¿piensas decirme qué estás intentando conseguir aquí o vamos a seguir haciendo esto toda la noche?"

              "Oh, cierto, cierto", dice Daren, dándose cuenta por fin de lo ridícula que debe de parecer toda esta situación desde mi punto de vista. "Supongo que debería haber empezado explicándote qué estaba pasando."

              Hace entonces una pausa, con un aspecto algo avergonzado por lo que está a punto de decir.

              "Estaba intentando ver si podía detectar el hecho de que eres medio lessathi solo por el flujo de tu aura", dice Daren. "Arraka me enseñó hoy cómo hacerlo, pero sigo pensando que me falta captar algo..."

              "¿Estás usando tu tiempo libre para practicar algo que aprendiste de Arraka?...", le pregunto, atónito. "¿Tú?!"
