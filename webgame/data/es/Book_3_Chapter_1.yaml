  - name: b3_ch01a_unfortunate
    routes:
      - condition: ch11_saved_rose = 1
        texts:
          - source: scene_text
            paragraph: 21
            text: |-
              "No", dice Daren. "Pero ojalá le hubiera dado uno cuando tuve la oportunidad. Me aseguré de encantar muchos de estos transceptores antes de venir a Varathia, cuando oí rumores de que quizá permitirían equipos en las primeras etapas del torneo, pero no estaba realmente seguro de cómo reaccionaría Azarius si le daba un transceptor así sin más, sobre todo porque se esforzó deliberadamente por no formar ningún tipo de equipo antes de venir aquí, a diferencia del resto de los sabios."

              "Bueno, eso es desafortunado", dice Arraka. "Esperaba que al menos tendríamos un poco de ventaja inicial para esta parte del plan, pero supongo que tendremos que hacerlo todo desde cero otra vez. En fin, dejando a un lado el hecho de que no tenemos forma de contactar con esa gente, nuestro mayor problema es que, aparte de Azarius, no tenemos ni idea de quién más fue visitado por la tejedora del tiempo. Mi suposición es que Eiden probablemente quedó fuera de la profecía esta vez, ya que seguramente estará implicado directamente en desencadenar los acontecimientos profetizados, así que, aparte de él, solo puedo asumir que la profecía se les ha dado a los grupos de magos más fuertes que participan en este torneo, y quizá a algunas de las figuras importantes de Varathia, como Tyrath, el zorro dorado o algunos de los reyes. Pero no podemos ir lanzando suposiciones al aire. Necesitamos información sólida. Y la única que podría tener esa información es la propia tejedora del tiempo."
          - source: scene_text_2
            paragraph: 13
            text: |-
              "Rose ya nos dijo que las únicas personas a las que recordaba haber visitado después de dejarnos fueron Azarius y su pupilo", digo. "Dijo que después de eso todo en su cabeza estaba borroso."

              "¡Pues tendrá que esforzarse más por recordar!", dice Arraka. "Es la única que podría averiguar esta información de manera realista sin que tengamos que recorrer todo el continente preguntándoselo a gente al azar. Y no es como si pudiéramos saltarnos esta parte del plan, además. Como les dije ayer, impedir que el Dios del Tiempo reúna más energía no es suficiente. También tenemos que hacer que gaste tanta energía como sea posible mientras mantiene esos rituales suyos. Tengo una idea bastante buena del tipo de cosas que podríamos hacer dentro de esos rituales para obligarlo a gastar mucha energía, pero a menos que todos los demás que queden atrapados en esos rituales hagan lo mismo, ¡solo será una pérdida de tiempo! Por cierto, ¿qué pasa con esa otra cosa que necesitábamos de Rose? ¿Está trabajando en una forma de impedir que Selkram robe su poder de inversión temporal en el futuro? Porque, ya sabes... de poco sirve luchar contra alguien que puede simplemente revertir el tiempo para curarse las heridas cada vez que se ve en apuros."
          - source: scene_3
            paragraph: 8
            text: |-
              "Rose ni siquiera ha conseguido usar con éxito ninguno de sus poderes del tiempo todavía", digo. "Ha estado intentando activarlos durante estos últimos días, pero no es ni de lejos tan fácil como lo era cuando estaba conectada al Magium."

              "¡Da igual que pueda controlar sus poderes o no!", dice Arraka. "Esto es un asunto totalmente distinto. Limitar el control que otras personas tienen sobre sus poderes debería ser más fácil que usar esos poderes ella misma. Dile que solo tiene que averiguar dónde está ubicado en su mente el poder de inversión temporal y esconderlo detrás de un muro que las fuerzas externas no puedan romper."

              "Eh... vale", digo. "Se lo diré. No sé cuánto ayudará, pero se lo diré."

              "Estará bien", dice Arraka. "Si fue lo bastante lista como para descubrir cómo usar sus poderes del tiempo mientras estaba conectada al Magium, también debería ser capaz de entender lo que significan mis palabras. Aunque seguramente tardará un tiempo en ponerlo todo en práctica."
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch01a_winner
      - condition: ch11_saved_rose = 0
        texts:
          - source: scene_text
            paragraph: 21
            text: |-
              "No", dice Daren. "Pero ojalá le hubiera dado uno cuando tuve la oportunidad. Me aseguré de encantar muchos de estos transceptores antes de venir a Varathia, cuando oí rumores de que quizá permitirían equipos en las primeras etapas del torneo, pero no estaba realmente seguro de cómo reaccionaría Azarius si le daba un transceptor así sin más, sobre todo porque se esforzó deliberadamente por no formar ningún tipo de equipo antes de venir aquí, a diferencia del resto de los sabios."

              "Bueno, eso es desafortunado", dice Arraka. "Esperaba que al menos tendríamos un poco de ventaja inicial para esta parte del plan, pero supongo que tendremos que hacerlo todo desde cero otra vez. En fin, dejando a un lado el hecho de que no tenemos forma de contactar con esa gente, nuestro mayor problema es que, aparte de Azarius, no tenemos ni idea de quién más fue visitado por la tejedora del tiempo. Mi suposición es que Eiden probablemente quedó fuera de la profecía esta vez, ya que seguramente estará implicado directamente en desencadenar los acontecimientos profetizados, así que, aparte de él, solo puedo asumir que la profecía se les ha dado a los grupos de magos más fuertes que participan en este torneo, y quizá a algunas de las figuras importantes de Varathia, como Tyrath, el zorro dorado o algunos de los reyes. Pero no podemos ir lanzando suposiciones al aire. Necesitamos información sólida. Y la única que podría tener esa información es la propia tejedora del tiempo."
          - source: scene_text_2
            paragraph: 14
            text: |-
              "El revenant ya nos dijo que las únicas personas a las que recordaba haber visitado después de dejarnos fueron Azarius y su pupilo", digo. "Dijo que después de eso todo en su cabeza estaba borroso."

              "¡Pues tendrá que esforzarse más por recordar!", dice Arraka. "Es la única que podría averiguar esta información de manera realista sin que tengamos que recorrer todo el continente preguntándoselo a gente al azar. Y no es como si pudiéramos saltarnos esta parte del plan, además. Como les dije ayer, impedir que el Dios del Tiempo reúna más energía no es suficiente. También tenemos que hacer que gaste tanta energía como sea posible mientras mantiene esos rituales suyos. Tengo una idea bastante buena del tipo de cosas que podríamos hacer dentro de esos rituales para obligarlo a gastar mucha energía, pero a menos que todos los demás que queden atrapados en esos rituales hagan lo mismo, ¡solo será una pérdida de tiempo! Por cierto, ¿qué pasa con esa otra cosa que necesitábamos del revenant? ¿Lograste contactar con ella por el transceptor, al final?"
          - source: scene_3
            paragraph: 9
            text: |-
              "No, he intentado contactar con ella varias veces, pero su canal del transceptor ha permanecido cerrado desde aquel día del ritual", digo. "No creo que vayamos a tener oportunidad de hablar con ella a menos que sea ella quien necesite ponerse en contacto con nosotros."

              "Maldición", dice Arraka. "Eso no es bueno. Si no conseguimos que de algún modo impida que Selkram le robe sus poderes de inversión temporal, luchar contra él carecerá totalmente de sentido. ¿De qué sirve herir a alguien si puede seguir revirtiendo el tiempo para curar todas sus heridas?"

              "En el peor de los casos, seguiremos viéndola en el siguiente ritual, ¿no?", digo. "Podremos contarle entonces nuestro plan."

              "Sí", dice Arraka, "pero me habría gustado darle algo más de tiempo para prepararse, porque crear un bloqueo mental de esta complejidad no es algo que pueda hacerse de la noche a la mañana."
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch01a_winner
  - name: b3_ch01a_winner
    texts:
      - source: scene_text
        paragraph: 22
        text: |-
          "Vaya, estoy impresionada...", dice Melindra. "De verdad parece que le has dedicado mucho tiempo y esfuerzo a este plan tuyo, Arraka. No sabía que lo llevaras dentro. Siempre te había visto más como una improvisadora que como una planificadora cuidadosa."

          "Arraka es mucho más astuta de lo que aparenta", dice Illuna con voz fría. "Nunca deberías subestimar de lo que es capaz, incluso estando atrapada dentro de un amuleto."

          "Vaya, vaya, Illuna", dice Arraka. "Casi haces que parezca que yo fuera el enemigo aquí. Estamos todas en el mismo bando, ¿recuerdas? Pero sí, desde luego hacía mucho tiempo que no me esforzaba tanto en un plan como este. Casi se siente como si hubiera vuelto al plano mágico, tramando uno de mis grandes planes para acabar con los dioses y sus aliados. Claro que las cosas irían muchísimo mejor si no tuviera que cargar con tanto lastre, pero los mendigos no pueden ponerse exquisitos, ¿no?"

          "Oye", dice Hadrik. "Que sepas que uno de esos lastres de los que hablas va a ser el futuro ganador del torneo del Magium."

          Entonces se vuelve hacia mí con una sonrisa.

          "¿Verdad que sí, Barry?", dice Hadrik.
      - source: scene_text_2
        paragraph: 15
        text: |-
          "¿Eh?... Oh, sí... ¡Sí, claro!", digo con un tono algo vacilante, mientras Kate se vuelve a mirarme con sospecha.

          "Ajá", dice Arraka. "El ganador. Claro..."

          Permanece en silencio unos dos segundos y luego continúa.

          "En fin, hay mucho más que me gustaría hablar con todos ustedes sobre Selkram y sus debilidades, pero como ya dije antes, nuestra prioridad número uno ahora mismo debería ser ponernos en contacto con uno de los espíritus del plano mágico. Por eso voy a pasar el resto de esta reunión intentando enseñarles a Daren y a Hadrik los fundamentos de las auras, con la esperanza de que esta vez logremos hacer un progreso de verdad. Todos los demás, retirados. Pueden ir a ocuparse de sus propias tareas relacionadas con Selkram o de lo que sea que quieran hacer. Daren, Hadrik, vengan aquí. Tenemos trabajo."

          Mientras todos se alejan de la zona de reunión, yo también me preparo para irme, pero justo cuando doy mi primer paso, Kate se planta delante de mí bloqueándome el paso, mientras me mira con una expresión muy seria.
