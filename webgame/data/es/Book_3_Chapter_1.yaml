  - name: b3_ch01a_subjects
    texts:
      - source: scene_text
        paragraph: 46
        text: |-
          "La chica payasa tiene razón en algo", dice Arraka. "Quizá por ahora sea mejor que Illuna le dé clases un tiempo, hasta que sea capaz de percibir auras lessathi. Si no sirve para nada más, al menos hará que deje de fastidiarme con todas esas preguntas absurdas. Por suerte, también tenemos un lessathi normal en el equipo, así que no le faltarán sujetos de prueba para sus sesiones de práctica."

          "¿Sujetos de prueba?", escribe Leila, con un poco de aprensión en los ojos.

          "Solo necesita analizar tu aura, así que no tendrás que hacer nada más que darte la vuelta unas cuantas veces para que pueda mirarte mejor", le digo a Leila. "Como mucho te vas a marear un poco, pero nada más."

          "Oh, vale...", escribe Leila, pareciendo más aliviada. "Puedo hacer eso."

          "Entonces, eh...", dice Daren, mirando con vacilación hacia Flower. "Illuna, ¿tienes un momento, o...?"
      - source: scene_text_2
        paragraph: 27
        text: |-
          Los ojos de Flower se vuelven azules de golpe, mientras Illuna mira a Daren durante unos segundos antes de responder.

          "Ven aquí", dice Illuna al final. "Veremos qué puedo enseñarte de aquí a que lleguemos a la ciudad."

          Viajamos unas horas más antes de que Melindra nos dijera por fin que nos estábamos acercando a nuestro destino. Durante ese tiempo, Daren estuvo practicando sus habilidades de lectura de aura con la ayuda de Illuna y Leila, aunque por lo que he visto el progreso ha sido un poco lento.

          Cuando Daren por fin decidió tomarse un descanso, Flower aprovechó la oportunidad para preguntarle a Melindra por las nuevas rocas que había añadido a su colección durante estos últimos días.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch01a_infiltrate
  - name: b3_ch01a_infiltrate
    routes:
      - condition: b3_ch1_unlock = 2
        texts:
          - source: scene_text
            paragraph: 48
            text: |-
              Mientras Melindra estaba ocupada enseñándole sus rocas a Flower, Daren decidió hacer una comprobación final para ver si todos seguíamos recordando nuestros planes de infiltración para la ciudad, que habíamos hablado largo y tendido durante el día anterior.

              "Muy bien, entonces, todos saben lo que tenemos que hacer una vez lleguemos a Ollendor, ¿verdad?", dice Daren.

              "Sí, sí, ya hemos hablado de esto antes", dice Hadrik. "Dependiendo de lo estricta que sea la seguridad, o intentamos colarnos o entramos por la puerta principal a la fuerza. No es que tengamos muchas otras opciones, de todos modos."
          - source: scene_text_2
            paragraph: 28
            text: |-
              "Un momento...", dice Melindra, volviéndose de repente hacia nosotros. "¿Han estado discutiendo cómo infiltrarse en la ciudad de Ollendor sin incluirme en sus reuniones?"

              "Bueno, te pedimos que te unieras un millón de veces, pero no hacías más que darnos largas, ¡así que al final tuvimos que hacer una reunión sin ti!", dice Daren. "No es como si pudiéramos empezar a planear estas cosas después de haber llegado ya a la ciudad."

              "¿Por qué no?", pregunta Melindra, confundida. "¿No habría sido mejor esperar a ver las defensas de la ciudad antes de hacer planes concretos?"

              "Bueno, sí, claro, pero tampoco es que no tengamos ya una idea general de a qué podríamos enfrentarnos", dice Daren. "Quiero decir, ya hemos visto las defensas de Thilias, así que supongo que Ollendor no puede ser tan diferente."

              "Oh, te aseguro que Ollendor es bastante diferente en lo que respecta a sus defensas", dice Melindra.

              "Entonces, ¿por qué no nos dices simplemente esas diferencias para que podamos ajustar nuestros planes en consecuencia?", le pregunta Daren.

              "Porque me resultaría más difícil explicárselas que simplemente mostrárselas", dice Melindra. "Lo entenderán cuando lleguemos."
        effects:
          - set:
              failed_checks:
                - '[ Dispositivo de estadísticas bloqueado - comprobación fallida ]'
              b3_ch1_password: 0
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch01a_ending
