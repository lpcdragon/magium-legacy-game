      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch01a_swim
  - name: b3_ch01a_swim
    texts:
      - source: scene_text
        paragraph: 6
        text: |-
          "No podemos distinguir nada más allá de lo básico, vieja bruja estúpida", dice Hadrik. "¡Ya te lo dijimos ayer!"

          "¿Pero qué es lo básico para ustedes?", dice Arraka. "En el plano mágico, ser capaz de determinar la edad o la raza de alguien a partir de su aura se considera algo básico. ¿Pueden hacer eso, al menos?"

          "¡No, claro que no!", dice Hadrik. "Lo único que podemos saber por un aura es cuánto poder mágico tiene alguien. Principalmente usamos este sentido para averiguar dónde están nuestros enemigos y si pueden lanzar algún tipo de magia."

          "¿Eso es todo?...", dice Arraka, horrorizada. "¡Entonces por qué demonios no dijeron eso desde el principio! ¡Eso lo cambia todo! Lo que ustedes, idiotas, tienen que hacer primero es entrenamiento básico de aura. Empiecen con ejercicios de respiración y vayan progresando desde ahí. En serio, ¿cómo demonios han llegado a este nivel de destreza mágica sin dominar lo básico? Con sus niveles de poder mágico, averiguar la edad de alguien debería ser una tarea básica. Solo concéntrense en las pequeñas corrientes giratorias que hay justo encima de la cabeza de una persona. Las que transmiten una sensación fría, aunque parezca que están soltando vapor. No las verán al primer intento, pero si miran con mucho cuidado, notarán que están ocultas por una especie de cascada que les tapa la vista. Obviamente, cuando les digo que miren con cuidado, me refiero con el sentido mágico, no con los ojos..."
      - source: scene_text_2
        paragraph: 4
        text: |-
          "¡Esa descripción suena todavía peor que las que nos diste ayer!", dice Hadrik. "¿Cómo se te ocurren estas cosas?"

          "Sí", dice Daren. "Si me preguntan a mí, probablemente lo hace a propósito para que nos... espera un momento..."

          Entonces se acerca a Flower para mirar mejor el amuleto de Arraka.

          "¿Acabas de decir algo de una cascada?...", dice Daren mientras mira el amuleto con intensidad.

          "Sí, la edad está escondida justo detrás", dice Arraka. "Tienes que imaginar que atraviesas la cascada y agarras las corrientes giratorias entre las manos hasta que dejen de moverse. Ahí será cuando el número de la edad se vuelva lo bastante claro como para que puedas leerlo."
      - source: scene_3
        paragraph: 3
        text: |-
          "¡Jajajaja!", se ríe Hadrik. "Daren, ¿has oído eso? ¡Creo que quiere que te des un baño!"

          Daren no dice nada y sigue mirando fijamente el amuleto de Arraka con profunda concentración.

          "¿Daren?...", dice Hadrik.

          "No, no, no, esto no puede estar bien...", le dice Daren a Arraka al cabo de un rato. "Aquí me dice que tu edad es menos trescientos quince. Salvo que tenga que descifrarlo o algo así, este número no me dice nada."

          "¡No leas mi edad, idiota!", dice Arraka. "La oculto a propósito para que la gente no pueda saber exactamente cuántos años tengo. También le he enseñado a Illuna a hacer lo mismo. Lee el aura de otra persona. Como la de la maga de hielo. O la de la chica muda. Ninguna de las dos tiene la edad oculta de ninguna manera, y deberían resultarte fáciles de ver."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch01a_nine
  - name: b3_ch01a_nine
    texts:
      - source: scene_text
        paragraph: 7
        text: |-
          Daren hace lo que dice Arraka y ahora dirige la mirada hacia Kate. Tras mirarla pensativo durante unos buenos diez segundos, por fin decide volver a hablar, dirigiéndose directamente a Kate.

          "Kate, tienes veintidós años...", dice. "¿Es correcto?"

          "Sí", dice Kate. "Eso creo. Nunca llegué a conocer a mis padres, así que no sé mi fecha exacta de nacimiento, pero según la estimación de edad que me dieron cuando me uní por primera vez al Beacon, lo que has dicho debería ser correcto."

          "Y Leila, ¿tienes diecinueve años?", pregunta Daren tras mirar también a Leila durante unos segundos.

          Leila asiente.

          "Barry tiene veintiocho años, como dijo, y Hadrik tiene..." dice Daren, pero entonces se detiene de golpe mientras sigue mirando encima de la cabeza de Hadrik.

          "Creo que aquí pasa algo raro", dice Daren. "El aura de Hadrik me muestra que tiene más de cien años, pero esa no puede ser su edad real. ¿O sí?..."

          Hadrik se ríe.

          "El aura no se equivoca, Daren", dice Hadrik. "Los gigantes vivimos mucho más que los humanos. Según sus estándares, probablemente parezca tener más o menos tu edad, pero en realidad soy mucho mayor."
      - source: scene_text_2
        paragraph: 5
        text: |-
          "Eh...", dice Daren. "Supongo que la razón por la que me sorprendió tanto es que siempre se me olvida que eres un gigante. En tu forma de enano aparentas tener unos cuarenta y tantos."

          "¿Y yo qué?", le pregunta Flower a Daren. "¿Qué dice mi aura sobre mi edad?"

          "¿Tu edad?", pregunta Daren mientras mira encima de su cabeza durante unos segundos.

          Entonces abre la boca para decir algo, pero cambia de idea y solo le responde unos segundos después.

          "Nueve años", dice Daren. "Dice que tienes nueve años."

          "¡Nooooo!", dice Flower, visiblemente frustrada. "¡Eso no es lo que dice! ¡Dice que tengo veintinueve! ¡Petal, dile lo que realmente dice!"

          "Lo único que veo cuando miro tu edad es el número nueve", dice Illuna.

          "¡No, hay un 'dos' justo delante de ese 'nueve' y lo sabes!", dice Flower, mientras veo a Daren sonriendo con sorna al fondo. "Puedo sentir perfectamente el aura que hay sobre mi cabeza, ¡y dice veintinueve! ¡Sé que puedes verlo!"
    choices:
      - position: 1
        text: Yo también solo puedo ver el número nueve cuando miro encima de la cabeza de Flower.
        effects:
          - set:
              current_scene: b3_ch01a_age
              b3_ch1_age: 0
      - position: 2
        text: ¡Dejen de molestarla! Flower puede tener la edad que le dé la gana.
        effects:
          - set:
              current_scene: b3_ch01a_age
              b3_ch1_age: 1
      - position: 3
        text: Escuchen, independientemente de lo que diga su aura, creo que todos podemos ponernos de acuerdo en cuál es su verdadera edad.
        effects:
          - set:
              current_scene: b3_ch01a_age
              b3_ch1_age: 2
      - position: 4
        text: Flower, ¿por qué te obsesiona tanto este número? Todos sabemos cuánto tiempo has vivido.
        effects:
          - set:
              current_scene: b3_ch01a_age
              b3_ch1_age: 3
  - name: b3_ch01a_age
    routes:
      - condition: b3_ch1_age = 0
        texts:
          - source: scene_text
            paragraph: 8
            text: |-
              "Yo también solo puedo ver el número nueve cuando miro encima de la cabeza de Flower."

              "¡Estás mintiendo!", dice Flower. "¡Apuesto a que ni siquiera puedes ver la edad que tengo encima de la cabeza! ¿Por qué nadie quiere admitir que tengo veintinueve años?"

              "La razón por la que nadie quiere admitir que tienes veintinueve años es porque nunca actúas conforme a tu edad", dice Illuna. "Si actuaras de una forma más madura, quizá la gente estaría más dispuesta a tratarte como a una adulta. Para mí, sigues siendo la misma niñita que conocí hace todos esos años, y no has cambiado ni un poco desde entonces."

              "¡Vale, ya lo entiendo!", dice Flower en voz alta, y luego hace un puchero. "Si esto te molesta tanto, entonces dejaré de actuar así. Seré seria y madura, y hablaré como una adulta. ¿Te parecerá bien eso... Illuna?"

              Por un momento pude ver que los ojos de Flower se volvían azules, mientras Illuna se quedaba mirando al frente, en estado de shock.

              "Yo nunca dije que tuvieras que usar mi nombre real cuando..." empieza a decir Illuna, pero Flower la interrumpe.
          - source: scene_text_2
            paragraph: 6
            text: |-
              "No, está bien", dice Flower, intentando imitar el tono y la expresión más fríos de Kate, aunque al hablar se le nota claramente un poco de tristeza en los ojos. "De todos modos, era una cosa infantil. Ya no te molestaré usando ese apodo..."

              "No estabas..." empieza a decir Illuna, pero ahora es Arraka quien la interrumpe.

              "¿Qué tal si ustedes dos continúan su drama en su tiempo libre?", dice Arraka. "Al fin y al cabo, no vinimos aquí a escuchar sus 'disparates', ¿no es así, Illuna?"

              "Muy bien", dice Illuna, mientras su expresión se ensombrece. "Puedes continuar con la sesión de entrenamiento."

              "¡Gracias!", dice Arraka. "Así que, como iba diciendo, en lo que Daren y Hadrik deben concentrarse ahora mismo es en aprender los fundamentos de la lectura de auras. Los fundamentos de verdad, quiero decir. No ese tipo de cosas que literalmente cualquier persona del mundo puede hacer. Como magos poderosos, deberían tener la ventaja de poder aprender esto en cuestión de días en lugar de años, con un poco de orientación. Les daré información más específica al final de esta reunión. Daren parece bastante hábil para este tipo de cosas cuando se lo propone, pero no estoy muy segura de qué decir del enano. Hace falta cierto nivel de inteligencia para dominar lo básico, y Hadrik no es precisamente lo que uno llamaría un erudito. Aun así, veremos qué puede hacerse."
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch01a_talented
      - condition: b3_ch1_age = 1
        texts:
          - source: scene_text
            paragraph: 9
            text: |-
              "¡Dejen de molestarla! Flower puede tener la edad que le dé la gana."

              "¡Sí, eso es!", dice Flower.

              "Al fin y al cabo, ¿quién de nosotros no soñó también con ser adulto cuando todavía era niño?", digo.

              "¡Yo no soy una niña!", grita Flower. "¡Tengo veintinueve años! ¿Por qué nadie quiere admitirlo?"

              "La razón por la que nadie quiere admitir que tienes veintinueve años es porque nunca actúas conforme a tu edad", dice Illuna. "Si actuaras de una forma más madura, quizá la gente estaría más dispuesta a tratarte como a una adulta. Para mí, sigues siendo la misma niñita que conocí hace todos esos años, y no has cambiado ni un poco desde entonces."

              "¡Vale, ya lo entiendo!", dice Flower en voz alta, y luego hace un puchero. "Si esto te molesta tanto, entonces dejaré de actuar así. Seré seria y madura, y hablaré como una adulta. ¿Te parecerá bien eso... Illuna?"

              Por un momento pude ver que los ojos de Flower se volvían azules, mientras Illuna se quedaba mirando al frente, en estado de shock.

              "Yo nunca dije que tuvieras que usar mi nombre real cuando..." empieza a decir Illuna, pero Flower la interrumpe.
          - source: scene_text_2
            paragraph: 6
            text: |-
              "No, está bien", dice Flower, intentando imitar el tono y la expresión más fríos de Kate, aunque al hablar se le nota claramente un poco de tristeza en los ojos. "De todos modos, era una cosa infantil. Ya no te molestaré usando ese apodo..."

              "No estabas..." empieza a decir Illuna, pero ahora es Arraka quien la interrumpe.

              "¿Qué tal si ustedes dos continúan su drama en su tiempo libre?", dice Arraka. "Al fin y al cabo, no vinimos aquí a escuchar sus 'disparates', ¿no es así, Illuna?"

              "Muy bien", dice Illuna, mientras su expresión se ensombrece. "Puedes continuar con la sesión de entrenamiento."

              "¡Gracias!", dice Arraka. "Así que, como iba diciendo, en lo que Daren y Hadrik deben concentrarse ahora mismo es en aprender los fundamentos de la lectura de auras. Los fundamentos de verdad, quiero decir. No ese tipo de cosas que literalmente cualquier persona del mundo puede hacer. Como magos poderosos, deberían tener la ventaja de poder aprender esto en cuestión de días en lugar de años, con un poco de orientación. Les daré información más específica al final de esta reunión. Daren parece bastante hábil para este tipo de cosas cuando se lo propone, pero no estoy muy segura de qué decir del enano. Hace falta cierto nivel de inteligencia para dominar lo básico, y Hadrik no es precisamente lo que uno llamaría un erudito. Aun así, veremos qué puede hacerse."
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch01a_talented
      - condition: b3_ch1_age = 2
        texts:
          - source: scene_text
            paragraph: 10
            text: |-
              "Escuchen, independientemente de lo que diga su aura, creo que todos podemos ponernos de acuerdo en cuál es su verdadera edad."

              "Sí, es..." empieza a decir Flower, pero entonces Daren, Illuna y yo decimos su edad al mismo tiempo.

              "Nueve años", decimos los tres al unísono.

              "¡No tengo nueve años!", grita Flower. "¡Tengo veintinueve! ¿Por qué ninguno de ustedes quiere admitirlo?"

              "La razón por la que nadie quiere admitir que tienes veintinueve años es porque nunca actúas conforme a tu edad", dice Illuna. "Si actuaras de una forma más madura, quizá la gente estaría más dispuesta a tratarte como a una adulta. Para mí, sigues siendo la misma niñita que conocí hace todos esos años, y no has cambiado ni un poco desde entonces."

              "¡Vale, ya lo entiendo!", dice Flower en voz alta, y luego hace un puchero. "Si esto te molesta tanto, entonces dejaré de actuar así. Seré seria y madura, y hablaré como una adulta. ¿Te parecerá bien eso... Illuna?"

              Por un momento pude ver que los ojos de Flower se volvían azules, mientras Illuna se quedaba mirando al frente, en estado de shock.

              "Yo nunca dije que tuvieras que usar mi nombre real cuando..." empieza a decir Illuna, pero Flower la interrumpe.
