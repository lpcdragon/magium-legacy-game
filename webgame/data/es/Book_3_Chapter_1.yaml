  - name: b3_ch01a_approached
    routes:
      - condition: b3_ch1_kate3 = 0
        texts:
          - source: scene_text
            paragraph: 32
            text: |-
              "¡Pero yo quiero preocuparme por ti!"

              Al principio, Kate se queda un poco impactada por mi elección de palabras, pero luego entiende lo que quería decir y empieza a mirar hacia el suelo mientras me responde.

              "Bueno...", dice, casi murmurando. "Si tanto te gusta preocuparte, quizá intente ocultar un poco menos estas cosas de ahora en adelante, cuando estemos solo tú y yo."

              Hace una pausa.

              "Pero aun así", continúa, mirándome ahora a los ojos, "preferiría que dejaras este tema por el momento, ya que esto es algo con lo que prefiero lidiar yo sola."

              "De acuerdo", digo. "En ese caso, no insistiré más."

              "Gracias", dice Kate. "Ahora volvamos al campamento. No deberíamos hacer esperar más a Leila."
          - source: scene_text_2
            paragraph: 20
            text: |-
              Después de terminar nuestra conversación, Kate y yo pasamos por donde Arraka estaba entrenando a Daren y a Hadrik, y luego empezamos a bajar despacio la colina para llegar al campamento.

              Cuando nos acercamos a las tiendas, vemos que Leila está sentada sobre una roca junto a un tocón, que probablemente quiere usar como mesa improvisada para que podamos colocar mi dispositivo de estadísticas mientras trabaja en él. Kate se adelanta en dirección a su tienda, mientras yo saco mi potenciador de estadísticas del bolsillo y lo pongo sobre el tocón para que Leila y yo podamos seguir trabajando desde donde lo dejamos ayer.

              "Perdona la tardanza", le digo a Leila. "Kate tenía unas cuantas cosas que hablar conmigo, así que no pude bajar enseguida."

              "No pasa nada", escribe Leila, sonriendo. "Me alegra que por fin hayan encontrado tiempo para hablar en privado. Supongo que al final te abordó por tu repentino cambio de actitud de estos últimos días, ¿no?"

              "Eh... sí", digo. "Sí, exactamente. ¿Cómo lo sabías? ¿Ya habías hablado de esto con Kate?"
          - source: scene_3
            paragraph: 11
            text: |-
              Leila niega con la cabeza.

              "No", escribe. "Pero podía ver la inquietud en sus ojos cada vez que notaba que no estabas actuando como tú mismo, y conociendo a Kate, supuse que tarde o temprano te enfrentaría directamente con eso. Entonces, ¿qué tal fue la conversación? ¿Kate consiguió ayudarte de algún modo?"

              "Sí...", digo. "Desde luego que sí."

              "¡Me alegra oír eso!", escribe Leila. "Sinceramente, no estaba muy segura de que fueras a estar dispuesto a hablar con ella sobre tu ritual, teniendo en cuenta que todos han estado evitando por completo este tema durante estos últimos días. Entiendo que cada uno de nosotros se vio afectado por esas pruebas de una manera distinta, pero a veces es mejor sacarse estas cosas del pecho que seguir guardándoselas por dentro."

              "¿Te refieres a como me contaste a Kate y a mí lo de tu ritual al día siguiente de la profecía?", digo.

              Leila asiente.

              "Me sorprendió que más gente no sintiera la necesidad de hablar de ello", escribe Leila. "Habría pensado que la mayoría querría hablar de estas cosas con amigos, en vez de intentar fingir que no pasó nada..."
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch01a_mechanisms
                condition: b3_ch1_unlock = 1
              - set:
                  current_scene: b3_ch01a_mechanisms
                condition: b3_ch1_unlock = 2
              - set:
                  current_scene: b3_ch01a_complicated
                condition: b3_ch1_unlock = 0
