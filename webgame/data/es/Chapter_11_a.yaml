  - name: ch11a_braided
    texts:
      - source: scene_text
        paragraph: 41
        text: |-
          Suzie se queda sin aliento.

          "¿Hará todo lo que yo diga?" pregunta.

          "¡Todo lo que digas!" dice Rose, con una sonrisa.

          Suzie chilla de felicidad cuando escucha la respuesta de Rose.

          "Ella, sígueme," dice. "¡Sé exactamente lo que vamos a hacer a continuación!"

          "Sí, seño-- señor..." dice Ella, mientras sigue a la niña dentro de la mansión.

          "¿Estás segura de que fue buena idea?" pregunta Hadrik.

          "¡Estoy segurísima!" dice Rose. "Ahora vengan, les mostraré a cada uno su habitación para que puedan desempacar."

          Después de que cada uno se instaló en su propia habitación, fuimos a encontrarnos afuera con Rose, que necesitaba ir a visitar el distrito de Sparrow, para llevar todas sus hierbas recolectadas a los enfermos. Dijo que probablemente volvería al atardecer, y que dejaría la casa a nuestro cuidado hasta entonces. Mientras todos nos despedimos de Rose, Suzie sale de repente por la puerta principal, tirando a Ella de la mano, mientras se apresura hacia nosotros.
      - source: scene_text_2
        paragraph: 30
        text: |-
          Si no supiera que Ella se fue con Suzie hace un rato, me habría tomado un minuto darme cuenta de quién era la que la niña llevaba de la mano. La ex esclava era casi irreconocible, ya que ahora llevaba un elegante vestido verde, mientras su pelo había sido limpiado y meticulosamente trenzado. Se veía impresionante. Supongo que esto explica lo que las dos han estado haciendo durante las últimas dos horas.

          "¡Ta-dááán!" dice Suzie, con una mirada muy orgullosa en su cara.

          "Wow," dice Hadrik. "Eso es eh... un cambio considerable. ¿Fuiste tú quien le trenzó el pelo, Suzie?"

          "¡Sip!" dice la niña, radiante. "¿No es hermosa? ¡Vamos, Ella, no seas tímida, y date la vuelta para que todos puedan ver!"

          Ella parece estar muy avergonzada por todo esto, y sus mejillas no podrían estar más rojas. Probablemente no está acostumbrada a recibir tanta atención. Se da la vuelta, tal como se le ordenó, para que todos pudiéramos ver su pelo trenzado. Mirándolo de cerca, se puede ver claramente que se le dedicó mucho trabajo. La niña debió haber estado en eso por lo menos durante la mayor parte de una hora.

          "¡Vamos, Ella!" dice Suzie, mientras le agarra la mano y la jala de vuelta hacia la mansión. "¡Vamos a jugar!"
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch11a_exhaustion
  - name: ch11a_exhaustion
    texts:
      - source: scene_text
        paragraph: 42
        text: |-
          Hadrik, Kate, Flower y yo pasamos el resto del día en una de las mesas de picnic, charlando y comiendo más de las delicias mágicamente creadas por Flower. Daren no salió de la mansión en todo el día, así que debió haber pasado la mayor parte del tiempo en su habitación. Mientras todos nos sentábamos en la mesa, de vez en cuando veíamos a Suzie y a Ella, corriendo por el patio o jugando a las escondidas. A medida que el sol empezaba a ponerse, se hacía evidente que Ella hacía un gran esfuerzo por seguir el ritmo de las demandas de la niña, cada vez más cansada.

          "¡Más rápido!" dice Suzie, mientras Ella corre por el patio, llevándola a caballito. "¡Tú puedes, Ella! ¡Más rápido!"

          "Oye, Suzie," dice el hermanito de Rose, mientras observa a Ella correr en círculos por el patio. "Ella hará todo lo que le digas, ¿verdad?"

          "¡Sip!" dice la niña.

          "¡Dile que se pare de manos!" dice el niño.

          "¿Qué?" pregunta Suzie, horrorizada. "¡No! ¿Por qué le diría que hiciera eso?"

          "¡Porque sería divertido de ver!" dice el niño.

          "¡No le voy a decir que se pare de manos, Kevin!"

          "¿Por qué no? Va a hacer todo lo que le digas, así que ¿cuál es el problema?"

          "¡Eso no significa que tengamos que burlarnos de ella!" dice Suzie, visiblemente molesta.
      - source: scene_text_2
        paragraph: 31
        text: |-
          "¡Pfff!" dice Kevin. "Qué aburrida eres."

          "¡No, tú eres el aburrido!" dice Suzie. "¡Eres solo un malo maloso, y por eso no tienes amigos!"

          Suzie se baja de la espalda de Ella y la abraza fuerte, mientras le lanza una mirada amenazadora a su hermano.

          "No te preocupes, Ella," dice la niña. "¡Nunca haría nada para hacerte daño!"

          Ella ahora parece que apenas puede mantenerse en pie.

          "Gracias... señorita..." dice, con las últimas fuerzas que le quedan, y luego se desmaya, por agotamiento.

          "¡Ella!" grita Suzie.

          Cuando vemos lo que pasó, Hadrik y yo nos lanzamos simultáneamente hacia Ella, y lo primero que hacemos es asegurarnos de que sigue viva. La chica aún respira, pero tiene una fiebre muy alta.

          "¡Yo hice esto!" dice Suzie, mientras las lágrimas empiezan a correr por su cara. "¡La maté! ¡No debería haberle pedido que me llevara a caballito! ¡Debería haber visto que estaba demasiado cansada! ¡Ahora va a morir y es todo mi culpa!"

          Después de terminar su última frase, la niña rompe en un llanto incontrolable y entierra la cabeza entre sus brazos.
    choices:
      - position: 1
        text: Tratar de consolar a Suzie
        effects:
          - set:
              current_scene: ch11a_comfort
      - position: 2
        text: Dejar que otro se encargue de Suzie e ir a llamar a Daren
        effects:
          - set:
              current_scene: ch11a_someone_else
  - name: ch11a_comfort
    texts:
      - source: scene_text
        paragraph: 43
        text: |-
          "Suzie, escúchame," le digo a la niña, mientras pongo mis manos en sus hombros. "Ella iba a trabajar hasta el agotamiento te lo ordenara o no. No es tu culpa."

          "Iré a buscar a Daren," dice Kate, mientras se dirige hacia la mansión.

          "¡Eso no lo sabes!" me dice Suzie. "¡No puedes saberlo!"

          "Sí, sí puedo," le digo a la niña. "Intentamos que Ella descansara pero no nos hizo caso. Rose solo te la confió porque sabía que tú no la harías trabajar más de lo que ella misma se habría trabajado. No va a morir. Solo está agotada, eso es todo. Se recuperará después de una buena noche de sueño."

          "Barry, vamos," dice Hadrik. "Necesitamos llevarla a una cama. ¿Sabes si quedan habitaciones vacías en la mansión?"

          "Sí, hay una al final del pasillo largo a la derecha," digo. "Te muestro el camino. ¡Vamos, Suzie, tú también vienes!"

          Logramos acostar a Ella en una cama, y poco después, Kate y Daren también llegan corriendo a la habitación.

          "¿Por qué nadie le dijo que descansara?" dice Daren, mientras lanza un hechizo de curación sobre la chica. "Ya estaba bastante agotada cuando la conocimos."

          "Lo intentamos," dice Kate, "pero no nos hizo caso. Tenía demasiado miedo de que si mostraba cualquier debilidad, la descartaríamos sin pensarlo, como aquel noble."
      - source: scene_text_2
        paragraph: 32
        text: |-
          "Ese malnacido," dice Daren, mientras aprieta el puño. "Lo mataría si no estuviera ya muerto."

          Después de que Daren terminó su hechizo, pudimos ver que la respiración de la chica empezaba a ser más relajada.

          "Me encargué de la fiebre," dice Daren, "pero la fatiga sigue ahí. Necesitará descansar un rato para recuperarse por completo."

          "Dios mío, ¿qué pasó aquí?" dice Rose, al entrar a la casa y vernos a todos parados alrededor de la cama de Ella.

          "La chica se sobreesforzó y se desmayó por agotamiento," dice Hadrik.

          "Me imaginé que eso podría pasar..." dice Rose. "¿Va a estar bien?"

          "Está bien," dice Daren. "Solo está cansada. Pero no podrá trabajar más por el resto del día."

          "Todavía puedo... trabajar..." dice Ella, al despertarse al escuchar las palabras de Daren, e intenta levantarse de la cama, solo para caer de espaldas poco después.

          "¡Ella, estás viva!" dice Suzie, y la abraza con todas sus fuerzas. "¡Estás viva!"

          "Amo, todavía puedo trabajar," dice Ella, con una mirada desesperada en sus ojos, mientras intenta levantarse de la cama de nuevo pero falla. "Por favor, solo deme otra orden."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch11a_fever
              available_points: available_points + 2
              available_points_aux: available_points_aux + 2
