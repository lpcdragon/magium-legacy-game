  - name: ch11a_silent
    texts:
      - source: scene_text
        paragraph: 14
        text: |-
          Me quedo callado, y actúo como si Eiden no me hubiera preguntado nada.

          Eiden sonríe, y se dirige a Kate.

          "¿Y tú, Kate?" le pregunta. "La oferta que le hice antes a Daren sigue en pie. Estoy dispuesto a darte el poder gratis, si simplemente lo pides. ¿Estás segura de que quieres dejar las cosas así?"

          "No es... asunto nuestro," dice Kate, con un poco de duda en su voz. "No podemos salvar a todos."

          "¡Qué pragmática!" dice Eiden, con una sonrisa.

          "¡Estoy seguro de que podemos llegar a algún tipo de acuerdo!" le dice Daren al noble, empezando a desesperarse. "¡Traigo mucho dinero conmigo! ¡Podría comprarle la chica por diez veces su precio!"

          "Ya tengo todo el dinero que necesito, forastero," dice el noble. "Es mucho más importante para mí ahora mismo ayudarte a ver la luz. Me lo agradecerás después."

          "Por favor, si tan solo pudiera escuchar--" empieza a decir Daren, pero no llega a terminar su frase.

          Con un movimiento rápido de su mano, el noble le corta el cuello a la chica de par en par, y cuando le suelta el pelo, su cuerpo simplemente cae al suelo como una muñeca sin vida, mientras un charco de sangre comienza a formarse lentamente debajo de ella.

          "¡No!" grita Daren, mientras corre hacia el cuerpo de la chica, e intenta lanzar todos los hechizos de curación que conoce sobre ella. "No, no, no, no, no, no, no..."
      - source: scene_text_2
        paragraph: 10
        text: |-
          Mientras sigue repitiendo la misma palabra, una y otra vez, la voz de Daren comienza a temblar, y no pasa mucho antes de que se derrumbe en lágrimas, mientras toma el cuerpo de la chica en sus brazos, y la abraza con todas sus fuerzas. Rose está horrorizada, mientras observa toda la escena desenvolverse frente a sus ojos, mientras que Kate está mirando hacia otro lado, con una expresión triste en su cara.

          "Típico de un bruto ignorante de otro continente, ponerse a llorar por una esclava muerta," dice el noble. "Pensé que al hacer esto, podría finalmente hacerte entrar en razón, pero parece que me equivoqué. Realmente eres un caso perdido. Te compadezco."

          Cuando escucha las palabras del noble, Daren deja de llorar lentamente, suelta a la esclava, y mira hacia el suelo, con una mirada muy oscura en su cara.

          "Eiden," dice. "Dame el poder."

          "¿Estás seguro de que esto es lo que quieres?" pregunta Eiden.

          "Dijiste que me lo darías gratis mientras lo pidiera," dice Daren. "Lo estoy pidiendo ahora. Dame el poder."

          Eiden sonríe ampliamente, mientras levanta las manos, y un viento poderoso comienza a girar a su alrededor por unos segundos. Cuando el viento se detiene, Eiden baja las manos, y mira hacia Daren.

          "Está hecho," dice.
