            paragraph: 21
            text: |-
              "Sí, voy a salvarlos a todos," digo. "Voy a hacer lo que tú no estás dispuesto a hacer, a pesar de todo tu poder. Voy a hacerlo aunque no sea un sabio ni un stillwater, ni algún otro ser supremo todopoderoso que se haya metido en este torneo. No tengo idea de cómo lo voy a hacer, pero encontraré la manera, y cuando termine, voy a volver y te lo voy a refregar en la cara. ¿Es una respuesta suficiente a tu pregunta?"

              Mientras hablaba, noté que Eiden abrió los ojos por primera vez desde que lo conocí. Al principio, pareció ser por la sorpresa, pero luego su mirada se transformó lentamente en una de tristeza y arrepentimiento, mientras yo continuaba hablando. Cuando terminé mi monólogo, Eiden cerró los ojos de nuevo, y sonrió.

              "Lo es, en efecto," me responde. "Estaré esperando con ansias ver cómo pones tus palabras en acción. Pero por ahora, creo que mi trabajo aquí está hecho, así que me retiraré."

              Eiden se eleva en el aire y se prepara para teletransportarse fuera de la ciudad.

              "Ah, hay una última cosa que debo decirles antes de irme," dice el stillwater, mientras se vuelve hacia Daren y Kate. "El hechizo que acabo de lanzar sobre Barry fue un hechizo de área de efecto y no uno dirigido. Esto significa que afectó toda el área a mi alrededor y no solo a él, así que ustedes dos han recibido el mismo don que su amigo. El efecto de mi hechizo dura indefinidamente, así que este poder es suyo para usar como quieran de ahora en adelante. ¡Dicho esto, me despido!"
