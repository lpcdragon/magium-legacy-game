        texts:
          - source: scene_text
            paragraph: 51
            text: |-
              "Lo siento, no quise decirlo así. ¡Por favor, olvida lo que dije!"

              "No te preocupes," dice Rose, sonriendo. "¡Ya lo olvidé!"

              Luego se levanta de la cama y le da un mordisco a uno de los muffins.

              "¡Vaya, estos están realmente buenos!" dice. "Debería hacerlos más seguido. ¿No te importa si me llevo dos, verdad? Suzie siempre me ha superado con los muffins, ¡y me gustaría presumir un poco de esto!"

              "Claro que no," digo. "¡Para empezar, eran tuyos!"

              Rose sonríe de nuevo, y toma dos muffins de la bandeja, antes de empezar a salir de la habitación. Se detiene en la puerta y se gira para mirarme una última vez.

              "Gracias de nuevo, Barry," dice Rose. "Por todo lo que has hecho. No tienes idea de cuánto significa todo esto para mí. Espero poder devolverte el favor algún día."

              Hace una pausa.

              "¡Buenas noches, Barry!" dice, después de unos segundos.

              "¡Buenas noches, Rose!" digo, mientras se da la vuelta y sale de la habitación.

              Después de que se fue, comí unos cuantos muffins más y luego me fui a dormir. Me desperté varias horas después, con el sonido de la voz de Daren.
          - source: scene_text_2
            paragraph: 34
            text: |-
              "¡Barry, despierta!" dice. "¿No estarás planeando quedarte dormido otra vez, verdad? ¡Vamos, levántate, o te dejaremos atrás!"

              Cuando Daren se va, echo un vistazo por la ventana y veo que el sol apenas había salido hace una hora. Todos ya estaban esperando afuera, mientras los hermanos de Rose corrían por el patio, tan animados como siempre.

              Salto de la cama y me visto, pero no me llevo la mochila. Probablemente Daren solo quiso decir que íbamos al centro a conseguir provisiones. Me llevo algo de dinero y mi daga, por si acaso, y luego bajo las escaleras.

              "Ya era hora," dice Daren, cuando me acerco a todos los que estaban esperando en el patio. "¿Por qué tardaste tanto?"

              "¿A dónde vamos?" le pregunto a Rose, ignorando completamente la pregunta de Daren.

              "Vamos a un hospital del distrito de los Mendigos," dice Rose. "Fui ayer, después de visitar el distrito de Sparrow, y vi muchos heridos que no estaban siendo tratados adecuadamente debido a una grave falta de personal cualificado. Ninguno parecía estar en estado crítico, pero los hechizos de curación de Daren serían una bendición para esas personas. Al principio, solo quería llevar a Daren, pero Hadrik insistió en que fuéramos todos."
          - source: scene_3
            paragraph: 8
            text: |-
              "Es más seguro si nos mantenemos todos juntos," dice Hadrik. "Solo porque estemos en una ciudad no significa que podamos bajar la guardia. Seguimos en medio de un torneo mortal, después de todo."

              "De acuerdo, si todos están listos, deberíamos irnos," dice Rose. "Esta vez tomaremos la ruta más corta, así que asegúrense de quedarse cerca de mí para que no se pierdan."
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: ch11a_incriminated
      - condition: ch11_romance_rose = 1
        texts:
          - source: scene_text
            paragraph: 53
            text: |-
              "¡Por supuesto! Siempre me siento así cuando hablo contigo."

              Las mejillas de Rose se han puesto aún más rojas que antes.

              No dice una palabra durante unos segundos, y luego de repente pone una expresión muy decidida.

              "¡Muy bien, entonces!" dice Rose, mientras se levanta de la cama, va a cerrar y echar el cerrojo de la puerta del dormitorio, y luego vuelve a colocarse justo delante de mí.

              "¿Qué estás--" empiezo a decir, pero no me da tiempo a terminar, porque Rose se inclina y me besa suavemente en los labios.

              Luego se sube encima de mí y lentamente me empuja sobre la cama, mientras sus labios permanecen presionados contra los míos.

              "Espera, espera, espera," digo. "¿Vamos a hacer esto ahora?"

              "¿Por qué no?" me pregunta Rose, con una sonrisa juguetona. "¿Preferirías que hiciéramos esto en unas ruinas, mientras luchamos contra un montón de ogros?"

              "Bueno, no, pero... quiero decir, todavía estamos más o menos en medio de un torneo mortal de magos," digo.

              "No nos estamos casando, Barry," dice Rose, sonriendo. "Es solo una noche. Mientras me tome mi té de infertilidad por la mañana, bien podríamos separarnos mañana y nada habrá cambiado."
          - source: scene_text_2
            paragraph: 35
            text: |-
              "Sí, pero--"

              Rose pone su dedo índice sobre mis labios para hacerme callar.

              "No voy a escuchar ni una palabra más de ti," dice. "Esto es mi agradecimiento por todo lo que has hecho por mí desde que nos conocimos. ¡Vamos a hacer esto, y punto!"

              Sonríe.

              "No tienes que preocuparte por nada, Barry," dice. "Solo cierra los ojos y déjame encargarme de todo. ¡Te prometo que ninguno de los dos se va a arrepentir de esto!"

              Luego presiona sus labios contra los míos una vez más, mientras comienza a desabrochar lentamente mi camisa. Las siguientes dos horas parecieron ser casi un sueño. ¿De verdad seguía en el mismo lugar donde había estado luchando desesperadamente por mi vida durante casi una semana? ¿El mismo lugar donde pasé el tiempo luchando contra dragones, esquivando trampas y robando tesoros a los ogros? En realidad, ahora que hago una pausa para pensarlo, la semana pasada empieza a sonar mucho más como un sueño que lo que pasó esta noche. Quizás realmente fue un sueño. Es decir, en serio... ¿Dragones? ¿Quién en su sano juicio creería una historia así?
          - source: scene_3
            paragraph: 9
            text: |-
              Con estos últimos pensamientos, pongo la cabeza en la almohada, abrazo a Rose fuertemente entre mis brazos y cierro los ojos. Me despierto varias horas después, con el sonido de la voz de Daren.

              "¡Barry, despierta!" dice. "¿No estarás planeando quedarte dormido otra vez, verdad? ¡Vamos, levántate, o te dejaremos atrás!"

              Cuando Daren se va, echo un vistazo por la ventana y veo que el sol apenas había salido hace una hora. Todos ya estaban esperando afuera, mientras los hermanos de Rose corrían por el patio, tan animados como siempre. Parece que después de todo no fue un sueño.
