  - name: ch11a_serious
    texts:
      - source: scene_text
        paragraph: 36
        text: |-
          Una vez que termino con mi dispositivo de estadísticas, lo guardo en el bolsillo y me voy a dormir. Me despierto varias horas después, con el sonido de la voz de Daren.

          "Espera, ¿sigues durmiendo?" dice Daren. "Despiértate y vístete, ¿quieres? Todos te estamos esperando abajo. Apúrate o te dejamos. Lo digo en serio."

          Cuando Daren se va, echo un vistazo por la ventana y veo que el sol apenas había salido hace una hora. Todos ya estaban esperando afuera, mientras los hermanos de Rose corrían por el patio, tan animados como siempre.

          Salto de la cama y me visto, pero no llevo mi mochila. Daren probablemente solo quiso decir que íbamos al centro a buscar algunos suministros. Llevo algo de dinero conmigo, y mi daga, por si acaso, y luego bajo.

          "¿Adónde vamos?" le pregunto a Rose, mientras me acerco a todos los que estaban esperando en el patio.
      - source: scene_text_2
        paragraph: 25
        text: |-
          "Vamos a un hospital del distrito de los Mendigos," dice Rose. "Fui ahí ayer, después de visitar el distrito de Sparrow, y vi muchos heridos que no estaban siendo tratados adecuadamente debido a una grave falta de personal calificado. Ninguno de ellos parecía estar en estado crítico, pero los hechizos de curación de Daren serían una bendición para esa gente. Al principio, solo quería llevar a Daren, pero Hadrik insistió en que fuéramos todos."

          "Es más seguro si nos mantenemos todos juntos," dice Hadrik. "Solo porque estemos en una ciudad, no significa que podamos bajar la guardia. Después de todo, seguimos en medio de un torneo mortal."

          "Bueno, si todos están listos, deberíamos ponernos en marcha," dice Rose. "Esta vez tomaremos la ruta más corta, así que asegúrense de mantenerse cerca de mí para no perderse."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch11a_incriminated
  - name: ch11a_task
    texts:
      - source: scene_text
        paragraph: 37
        text: |-
          "¡No puedo creerlo!" dice Hadrik, después de escuchar toda nuestra historia. "¿Entonces están diciendo que ahora Flower y yo somos los únicos que no pueden atacar a los locales porque no estábamos ahí cuando Eiden lanzó su hechizo?"

          "En realidad, yo nunca tuve ese problema," dice Flower. "No estoy participando en el torneo, ¿recuerdan? Su hechizo no me afecta."

          "¡Genial!" dice Hadrik. "¡Simplemente genial! ¿Por qué tuve que entrar a esa tienda de armaduras? ¡Ni siquiera tenían nada que valiera la pena comprar!"

          "Disculpe, amo," dice Ella, que está sentada justo a mi lado. "No... quiero interrumpir, pero no me ha dado ninguna tarea desde que llegamos aquí."

          "Oh, está bien," le digo. "No te preocupes. Por ahora puedes simplemente sentarte ahí y descansar."

          "S-s-sí señor..." dice la chica.

          En lugar de calmarla, mis palabras parecen haberla puesto aún más nerviosa. Ahora está inquieta y sudando mientras mira fijamente la mesa frente a ella.
      - source: scene_text_2
        paragraph: 26
        text: |-
          "¡Aquí están!" dice Rose, mientras se acerca a nosotros y se sienta junto a Flower. "Daren ya deshizo su equipaje. ¿Quieren que les muestre sus habitaciones?"

          "Podemos hacer eso después," dice Hadrik. "Ella ha estado sentada ahí mordiéndose las uñas durante los últimos quince minutos porque no tiene nada que hacer. ¿No tienes algún trabajo en la casa que necesite hacerse?"

          "¡Oh no, no podría hacerla trabajar tan pronto después de lo que ha pasado!" dice Rose.

          Se vuelve hacia la chica.

          "Ella," dice Rose, "puedes ir a dormir todo lo que necesites, y después de que estés bien descansada, te haré el recorrido de la casa. ¿Te parece bien?"
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch11a_loyalty
  - name: ch11a_loyalty
    texts:
      - source: scene_text
        paragraph: 38
        text: |-
          Ella se pone de pie de golpe, con una mirada de mucho miedo en su rostro.

          "¡No hay necesidad de hacerme la prueba!" dice la chica. "¡Prometo que trabajaré lo más duro que pueda! ¡No los decepcionaré! ¡Lo prometo!"

          Su repentino arrebato nos dejó temporalmente sin palabras, mientras todos nos miramos entre nosotros por unos segundos.

          "Ella, nadie le está haciendo pruebas a nadie," dice Rose. "Por favor, siéntate, debes de estar muy cansada..."

          "Sí, señor..." dice Ella, con un tono agudo, casi como si estuviera a punto de llorar, y se sienta de nuevo.

          "Rose, ¿de qué está hablando?" digo. "¿A qué tipo de prueba se refiere?"

          "No... no sé..." dice Rose. "Nunca había oído hablar de nada así."

          "Está hablando de la prueba de lealtad," dice Kate, de repente. "Es una prueba que se usa para asegurarse de que los prisioneros no intenten escapar de sus captores. La usaban bastante en el Beacon."

          "No lo entiendo," dice Hadrik. "¿Por qué la chica cree que la estamos poniendo a prueba? Nunca dimos a entender que estuviéramos haciendo algo así."
      - source: scene_text_2
        paragraph: 27
        text: |-
          "Porque todos están siendo demasiado amables," dice Kate. "Y así es siempre como empieza una prueba de lealtad. En el Beacon, de vez en cuando, un miembro del personal o un completo desconocido empezaba a actuar muy amable y considerado con uno de los huérfanos, de la nada. Después de un tiempo, cuando estaban seguros de haberse ganado su confianza, de repente decían que querían ayudarlos a escapar. Si el huérfano les creía y seguía sus instrucciones, sería recapturado por la misma persona que intentó ayudarlo, y le dirían que todo fue una prueba de lealtad que había fallado. Luego los golpeaban salvajemente por romper las reglas, o los mataban para servir de ejemplo a todos los otros huérfanos. De esta manera, si alguien alguna vez realmente intentaba ayudar a uno de nosotros, nunca les creeríamos, y elegiríamos seguir siendo prisioneros, por miedo."

          Rose se queda sin aliento.

          "Dios mío, eso es horrible," dice. "Pero si lo que dices es cierto, ¿cómo vamos a convencer a Ella de que estamos diciendo la verdad?"

          "No vamos a convencerla," dice Kate. "Incluso después de oírnos discutir las cosas abiertamente frente a ella así, probablemente todavía piensa que todo es parte de un acto elaborado, para hacer que baje la guardia. Debe creer que una vez que acepte descansar, habrá fallado la prueba, y la consideraremos inútil, igual que aquel noble."
    choices:
      - position: 1
        text: Preguntarle a Kate si hay algo que podamos hacer para que la chica sospeche menos de nosotros.
        effects:
          - set:
              current_scene: ch11a_suspicious
      - position: 2
        text: Ordenarle a Ella que vaya a podar los arbustos del jardín, para calmar sus miedos.
        effects:
          - set:
              current_scene: ch11a_bushes
  - name: ch11a_suspicious
    texts:
      - source: scene_text
        paragraph: 39
        text: |-
          "¿Hay algo que podamos hacer para que Ella sospeche menos de nosotros?" le pregunto a Kate.

          "Sí," dice Kate. "Primero que nada, vas a tener que dejar de mimarla. Solo está empeorando las cosas."

          "De acuerdo," dice Rose, con una mirada decidida en su rostro, mientras se vuelve hacia la chica. "Ella, vas a ir marchando a esa casa y me vas a traer un vaso de agua. La cocina se ve desde el salón principal. Está equipada con un fregadero con agua corriente, y hay algunos vasos en uno de los estantes superiores. ¿Entendiste todo?"

          "Sí, señor," dice la chica, mientras se levanta apurada. "¡Se lo traeré enseguida!"

          Mientras la chica corre hacia la casa, Rose suelta un gran suspiro, como si lo que acababa de hacer le hubiera costado una gran cantidad de energía.

          "Espero no haber sido muy dura con la pobre chica," dice Rose, con una mirada preocupada en su rostro.

          "Vamos a tener que pensar en una forma de hacer que Ella se acostumbre más a su situación actual," dice Kate. "Darle órdenes así solo puede servir como solución temporal."

          Mientras todos nos sentamos ahí a pensar, Ella sale de la casa, con un vaso de agua en la mano, y con los dos hermanos de Rose corriendo en círculos a su alrededor.
      - source: scene_text_2
        paragraph: 28
        text: |-
          "¡Creo que quizás tenga una idea!" dice Rose, con una sonrisa, mientras los mira a los tres.

          "¡Eres muy bonita!" le dice Suzie a Ella, mientras se acerca a nosotros.

          "Eh... Gracias, seño-- señor," dice Ella, viéndose un poco confundida.

          Suzie se ríe.

          "Me caes bien," dice. "¡Eres graciosa!"

          "¡Creo que tengo el trabajo perfecto para ti, Ella!" dice Rose, después de que Ella le trae el vaso de agua.

          "¿Q-q-qué quiere que haga, señor?" pregunta Ella.

          "¡Quiero que sigas a mi hermanita Suzie a donde sea que vaya, y que escuches cada una de sus órdenes por el resto del día!" dice Rose, con una sonrisa malvada.

          "Por supuesto..." dice Ella. "No la decepcionaré."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch11a_braided
  - name: ch11a_bushes
    texts:
      - source: scene_text
        paragraph: 40
        text: |-
          "Bien," digo. "Ella, ve a podar esos arbustos de allí. ¡Es una orden!"

          "Sí, señor," dice la chica, mientras se levanta apurada y va a buscar unas tijeras de podar.

          "¡Maldita sea, Barry!" dice Hadrik. "¡Estamos tratando de ayudarla, no de estresarla más!"

          "No, esto está bien," dice Kate. "Tener algo que hacer al menos le tranquilizará la mente por el momento. Mientras tanto, vamos a tener que pensar en una forma de hacer que se acostumbre más a su situación actual."

          Mientras Ella empieza a podar uno de los arbustos, los hermanos de Rose salen corriendo de la mansión y se paran justo a su lado, aparentemente intentando iniciar una conversación.
