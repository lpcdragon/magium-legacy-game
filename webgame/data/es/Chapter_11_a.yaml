  - name: ch11a_clown
    texts:
      - source: scene_text
        paragraph: 35
        text: |-
          "Lamento lo de antes," nos dice Hadrik a mí y a Kate, mientras nos sentamos en la mesa del jardín. "Exageré. No estuve ahí cuando todo pasó, así que no tenía derecho a quejarme. Estoy seguro de que ambos hicieron lo que creyeron mejor, dada la situación."

          "No hay necesidad de disculparse," dice Kate. "Todos nos vimos afectados por la muerte de la esclava de alguna manera. No te culpo por haberte molestado tanto."

          Mientras todos nos sentábamos en la mesa y hablábamos, los hermanos de Rose también se nos unían de vez en cuando, cuando tomaban un descanso de correr por el patio.

          "Oye, tú," dice el hermanito de Rose, mientras mira hacia Flower. "¿Por qué estás vestida de payaso?"

          "¡No estoy vestida de payaso!" dice Flower, visiblemente molesta. "¿Eres tonto? ¡Esta ropa es la misma que usaba cuando trabajaba como trapecista y acróbata en el circo!"

          "Trapecistas, acróbatas, payasos: todo lo mismo," dice el niño.

          Flower se ve como si estuviera a punto de explotar.
      - source: scene_text_2
        paragraph: 24
        text: |-
          "No le hagas caso," le dice Suzie a Flower. "A Kevin a veces le gusta actuar como un idiota. Tu ropa está bien. Y tu pelo es muy bonito."

          "Eh, ¿gracias, supongo?" dice Flower, confundida.

          "Ojalá tuviera un pelo largo y rojo hermoso como el tuyo," dice Suzie. "¿Me dejarías trenzarte el pelo? ¿Por favor?"

          "¡No!" dice Flower, horrorizada, y agarra su pelo con las manos, como si lo estuviera protegiendo de un depredador peligroso.

          "Está bien," dice Suzie, con una mirada triste en su cara.

          Cuando se acercó la hora de dormir, cada uno empezó a dirigirse hacia su propia habitación y acordamos vernos de nuevo por la mañana, para planear qué queríamos hacer a continuación. Antes de irme a dormir, me di un buen baño largo en uno de los muchos baños disponibles en la mansión. Fue agradable bañarse en agua caliente, para variar, después de todos esos días lavándome en lagos y ríos fríos. Cuando entré a mi habitación, mi dispositivo de estadísticas empezó a pitar fuerte. Ha pasado un tiempo desde que obtuve puntos nuevos para gastar en mis estadísticas. Necesito ser muy cuidadoso con lo que elijo mejorar esta vez, porque a este ritmo, quién sabe cuándo obtendré mi próximo lote de puntos.

          Saco el dispositivo del bolsillo y empiezo a pensar cómo aprovechar mejor estos puntos.
