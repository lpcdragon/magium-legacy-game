          "Ya era hora," dice Daren, cuando me acerco a todos los que estaban esperando en el patio. "¿Por qué tardaste tanto?"

          "¿A dónde vamos?" le pregunto a Rose, ignorando completamente la pregunta de Daren.

          "Vamos a un hospital del distrito de los Mendigos," dice Rose. "Fui ayer, después de visitar el distrito de Sparrow, y vi muchos heridos que no estaban siendo tratados adecuadamente debido a una grave falta de personal cualificado. Ninguno parecía estar en estado crítico, pero los hechizos de curación de Daren serían una bendición para esas personas. Al principio, solo quería llevar a Daren, pero Hadrik insistió en que fuéramos todos."

          "Es más seguro si nos mantenemos todos juntos," dice Hadrik. "Solo porque estemos en una ciudad no significa que podamos bajar la guardia. Seguimos en medio de un torneo mortal, después de todo."

          "Muy bien, ¿están todos listos?" dice Rose.

          "¡Espera, Rose, acabo de recordar que quería preguntarte algo!" dice Flower.

          "Sí, Flower, ¿qué pasa?" pregunta Rose.
      - source: scene_text_2
        paragraph: 36
        text: |-
          "¿Te pasó algo mientras estabas en tu habitación anoche?" dice Flower.

          "No, no pasó nada, ¿por qué lo preguntas?" dice Rose.

          "Bueno, pensé que quizás tenías miedo de que te atacaran mientras dormías, o algo así, ya que esta mañana te vi salir de la habitación de Barry en lugar de la tuya," dice Flower.

          Después de que Flower termina su frase, sus ojos de repente se vuelven de un azul brillante, mientras Illuna se da una fuerte palmada en la frente. La cara de Rose se había puesto completamente roja, y todos nos estaban mirando fijamente.

          "Rose," dice Kate, luciendo muy nerviosa. "¿T-t-tú y Barry--"

          "¡Jajajaja!" Hadrik ríe a carcajadas. "¡Bien hecho, Barry! ¡Siempre supe que lo tenías en ti!"

          "Esperen," dice Rose, tratando de no entrar en pánico. "¡Esto no es lo que piensan! Solo fue una noche. No estamos--"

          Daren tose fuerte, de repente, y ahoga las palabras de Rose.

          "Rose," dice. "¿Hacia dónde dijiste que estaba el hospital? ¿Tomamos el mismo camino que ayer?"
      - source: scene_3
        paragraph: 10
        text: |-
          "¡No!" dice Rose, mientras se apresura a ponerse delante de nosotros. "Ya no hay razón para tomar ese camino tan largo. Podemos tomar una ruta más directa esta vez. Síganme, les mostraré el camino."

          Después de que salimos de la mansión, nadie volvió a mencionar nada sobre Rose y yo. La intervención de Daren parece haber sido suficiente para hacerlos entrar en razón a todos. Puede que sea un imbécil la mayor parte del tiempo, pero cuando las cosas se ponen difíciles, supongo que realmente puede ser de gran ayuda. Le debo una por esto.
