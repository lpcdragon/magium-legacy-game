  - name: ch11a_fever
    texts:
      - source: scene_text
        paragraph: 45
        text: |-
          "No," dice Rose, mientras la mira con el ceño fruncido. "Ya no puedes trabajar más hoy. Ni siquiera puedes levantarte de la cama. Eso significa que como esclava, ahora eres completamente inútil para mí. Y el único destino que le espera a una esclava inútil es la muerte."

          Ella mira a Rose con miedo en los ojos, pero ya no tiene fuerzas para resistirse. Rose toma la mano de la chica entre sus palmas, la mira a los ojos y le da una cálida sonrisa.

          "Pero ya no eres una esclava," dice Rose. "Has dejado de ser esclava desde que Barry te salvó de ese noble, hoy. No te traje aquí para que trabajaras para mí como esclava. Te traje aquí para trabajar como sirvienta. Si realmente te considerara mi esclava, nada debería haberme impedido acabar con tu vida cuando te convertiste en una carga. Tú mejor que nadie deberías saber esto."

          El miedo en los ojos de Ella empieza a desvanecerse lentamente, y parece que finalmente está empezando a entender lo que Rose realmente quiere decir.

          "Eres libre, Ella," continúa Rose. "Ya no estás atada a nadie ni a nada. Puedes ir a donde quieras y hacer lo que quieras por el tiempo que quieras. No tienes que escuchar las órdenes de nadie nunca más, y puedes tomar tus propias decisiones sin vivir con miedo."

          Rose hace una pausa.
      - source: scene_text_2
        paragraph: 33
        text: |-
          "Pero si me permites hacerte una petición egoísta..." dice Rose. "Te estaría muy agradecida si eligieras quedarte aquí. No tengo mucho dinero para darte, y los niños probablemente te volverán loca la mitad del tiempo, pero Suzie ya se ha encariñado mucho contigo, y creo que te extrañaría mucho si te fueras. No puedo prometerte que tendrás una buena vida aquí, pero puedo prometerte que haremos todo lo posible para que te sientas como en casa. Ella, ¿sería mucho pedirte que sigas trabajando para nosotros un poco más?"

          "¡No!" dice Ella, mientras parece que está a punto de llorar. "¡Por supuesto que no! ¡Me encantaría seguir trabajando aquí! ¡El tiempo que he pasado aquí ha sido el más feliz de mi vida! ¡No quiero irme! ¡Prometo que trabajaré duro y que nunca traidionaré su confianza!"

          "¡Entonces nuestro contrato está completo!" dice Rose, mientras sonríe y le estrecha la mano a la chica. "Puedes empezar a hacer las tareas del hogar cuando estés completamente recuperada, pero si de verdad quieres no quedarte sin hacer nada hoy, puedes seguir jugando con Suzie. ¡Estoy bastante segura de que ella no piensa separarse de tu cama en un buen rato!"

          Ahora que Rose finalmente había logrado calmar las preocupaciones de Ella, decidimos dejarla sola con Suzie, para que pudiera despejar la mente del trabajo por unas horas. Como se acercaba la hora de dormir, cada uno empezó a dirigirse hacia su propia habitación y acordamos vernos de nuevo por la mañana, para planear qué queríamos hacer a continuación.
      - source: scene_3
        paragraph: 7
        text: |-
          Antes de irme a dormir, me di un buen baño largo en uno de los muchos baños disponibles en la mansión. Fue agradable bañarse en agua caliente, para variar, después de todos esos días lavándome en lagos y ríos fríos. Cuando entré a mi habitación, mi dispositivo de estadísticas empezó a pitar fuerte. Ha pasado un tiempo desde que obtuve puntos nuevos para gastar en mis estadísticas. Necesito ser muy cuidadoso con lo que elijo mejorar esta vez, porque a este ritmo, quién sabe cuándo obtendré mi próximo lote de puntos.

          Saco el dispositivo del bolsillo y empiezo a pensar cómo aprovechar mejor estos puntos.
    choices:
      - position: 1
        text: Invertir puntos ahora
        effects:
          - set:
