        paragraph: 28
        text: |-
          Encontramos a Flower unos minutos después, en una de las calles que habíamos tomado cuando entramos a la ciudad por primera vez. Ya había terminado de reemplazar la cadena del amuleto de Arraka, y también se sorprendió de que no la esperáramos en nuestro punto de encuentro, pero accedió a posponer sus preguntas hasta después de llegar a la casa de Rose.

          Esta vez tomamos un camino algo más largo, para asegurarnos de que nadie que vio la escena anterior nos estuviera siguiendo. A medida que avanzábamos por la ciudad, el paisaje empezó a cambiar lentamente, y en lugar de chozas en ruinas, comenzamos a ver casas más elegantes, e incluso algunas mansiones. El olor pútrido de las calles también había desaparecido para cuando finalmente llegamos a la casa de Rose. Para nuestra sorpresa, a pesar de sus afirmaciones previas de vivir en relativa pobreza, la casa de Rose era de hecho una mansión muy grande, con dos pisos y un patio del tamaño de un pequeño parque.

          "Kate, ya puedes dejar de suprimir tu aura mágica," dice Rose, mientras caminamos por su patio. "¡Mis hermanos no saben qué es una banshee, así que no hay necesidad de esconderte de ellos!"
      - source: scene_text_2
        paragraph: 20
        text: |-
          "Rose, no quiero sonar grosero," dice Hadrik, "pero ¿no me dijiste que tú y tus dos hermanos vivían una vida modesta aquí en la ciudad?"

          Rose se sonroja.

          "Yo no soy quien compró esta casa," dice Rose. "Aquí es donde solía vivir con mi antiguo marido, antes de que nos divorciáramos. Me dijo que no le importaba que me quedara con esta casa, ya que él poseía muchas otras mansiones en mejores zonas de la ciudad. Al principio quise rechazarlo, pero tenía a mis dos hermanos y a mi padre enfermo que cuidar en ese momento y habría sido muy difícil para mí seguir viviendo con ellos en nuestra vieja casa pequeña."

          "Ah, ¿estaba tratando de reconquistarte con un pequeño regalo de despedida?" pregunta Hadrik, con una sonrisa.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch11a_passion
  - name: ch11a_passion
    texts:
      - source: scene_text
        paragraph: 29
        text: |-
          "En realidad, no," dice Rose. "La razón principal por la que nos separamos es que Enrique nunca fue el tipo de hombre que sería feliz atado a una sola mujer. Después de divorciarnos, me dijo que durante nuestro matrimonio, se sentía como un pájaro enjaulado al que le negaban la libertad de surcar los cielos, en busca de estrellas que brillaran intensamente en la noche. También me dijo que sin importar cuántas estrellas terminara visitando, yo siempre seguiría siendo el sol que las eclipsa a todas, y que nunca amaría a otra mujer con tanta pasión como me había amado a mí."

          Rose se ríe suavemente.

          "Siempre fue difícil tomárselo en serio cuando decía cosas así," dice, sonriendo.

          "¡Miren, es Rose!" escucho a una niña gritar desde lejos, mientras viene corriendo hacia nosotros. "¡Rose volvió! ¡Vengan rápido!"

          La niña, que parece ser la hermana de ocho años de Rose, ahora le hace señas a su hermano de nueve años, y ambos corren por el patio hasta que finalmente nos alcanzan.
      - source: scene_text_2
        paragraph: 21
        text: |-
          "¡Rose, mira!" dice la niña, con un tono orgulloso en su voz, mientras saca algo de su bolsillo y se lo muestra. "¡Billy ya tiene catorce años! ¡Y está tan animado como siempre! ¿Ves?"

          "¡Qué buena noticia, Suzie!" dice Rose, sonriendo, mientras le acaricia la cabeza a su hermana. "Admito que estaba un poco preocupada por él mientras estuve fuera, ¡pero ahora veo que no tenía razón para dudar de ti!"

          Noto que la mascota virtual que Suzie tiene en la mano se parece increíblemente a mi dispositivo de estadísticas. Incluso más de lo que recordaba. ¿Podría ser también algún dispositivo antiguo hecho por los lessathi que guarda poderes ocultos como la 'baratija del adivino' que tengo en mi bolsillo?
    choices:
      - position: 1
        text: Preguntarle a Suzie si me puede prestar su juguete un segundo para verlo.
