  - name: ch11a_prevented
    texts:
      - source: scene_text
        paragraph: 32
        text: |-
          "Bueno, ahora que por fin estamos aquí," dice Hadrik, mientras todos nos sentamos en una de las muchas mesas de jardín en el patio de Rose, "¿alguien me puede decir qué le pasó a Daren para que se convirtiera en un amargado aún peor de lo habitual?"

          Kate y yo intercambiamos una mirada, y luego empezamos a darle a Hadrik y a Flower un relato completo de los eventos que se perdieron mientras estaban de compras.

          "¡Maldición!" dice Hadrik, después de escuchar toda nuestra historia. "Si tan solo no hubiera entrado a esa estúpida tienda. Si hubiera estado ahí con ustedes, le habría pedido el poder a Eiden en lugar de Daren y habría salvado la vida de esa pobre chica."

          Hace una pausa.

          "Aun así, no entiendo," dice Hadrik. "Ambos estaban ahí. Podrían haber evitado esto. ¿Por qué no hicieron nada?"
    choices:
      - position: 1
        text: No era asunto nuestro.
        effects:
          - set:
              current_scene: ch11a_business
      - position: 2
        text: Habría sido demasiado arriesgado.
        effects:
          - set:
              current_scene: ch11a_risky
  - name: ch11a_business
    texts:
      - source: scene_text
        paragraph: 33
        text: |-
          "No era asunto nuestro."

          "¿No era asunto nuestro?" dice Hadrik, con furia en sus ojos. "¿¡No era asunto nuestro!? ¿Entonces estás diciendo que está bien dejar que una chica inocente sea asesinada frente a tus ojos mientras no la conozcas? ¿Es eso lo que me estás diciendo?"

          "Hadrik," dice Kate. "No podemos salvar a todos..."

          "¡Eso no significa que tengamos que ignorar lo que pasa justo frente a nuestras narices!" dice Hadrik, mientras golpea la mesa con ambos puños. "¡No puedo creerlo! ¡Apenas siento que los conozco! ¡Es como si ambos se hubieran convertido en Arraka!"

          "¿Y qué tiene eso de malo?" pregunta Arraka, mientras Hadrik agarra su mochila, se levanta de la mesa y cruza el patio a zancadas hasta la entrada de la mansión.

          "¿Pueden creer a este tipo?" nos pregunta Arraka. "Un momento está todo entusiasmado con pelear y beber, y de repente empieza a actuar como el sanador. ¿Qué tiene de especial que una esclava muera?"

          "Cállate, Arraka," dice Flower.

          "¿Qué?" dice Arraka. "Esa chica se lo estaba buscando. Estaba tratando de holgazanear en el trabajo, y encima le contestó mal a su dueño cuando le dijo que volviera a trabajar. Yo también la habría matado si fuera mi esclava y se portara así conmigo. De hecho, probablemente la habría matado de todas formas solo por diversión."

          "Arraka, ¿quieres pasar los próximos veinte años con tu amuleto cerrado otra vez?" dice Flower.
      - source: scene_text_2
        paragraph: 23
        text: |-
          Esta vez, la chica logró callarla. Parece que Arraka no está muy interesada en volver a su antigua forma de vida en el futuro cercano.

          "¿Le... pasó algo a Hadrik?" dice Rose, mientras se acerca a nosotros. "Me pidió que le indicara cómo llegar a su habitación cuando nos encontramos en el pasillo, y después de dárselas, simplemente pasó de largo, sin decir una palabra más. Se veía bastante molesto por algo."

          "Se enojó mucho cuando le contamos lo que le pasó a la chica esclava antes," dice Kate.

          "Oh..." dice Rose. "Ya veo..."

          "¿Podrías llevarnos a nuestras habitaciones también?" digo, tratando de cambiar de tema. "Me vendría muy bien una siesta en una cama de verdad ahora mismo."

          "Por supuesto," dice Rose. "Síganme."

          Después de mostrarnos a todos nuestras habitaciones, Rose nos dijo que ahora necesitaba ir a visitar el distrito de Sparrow, para llevar todas las hierbas que había recolectado a los enfermos. Dijo que probablemente volvería al atardecer, y que dejaría la casa a nuestro cuidado hasta entonces. Como ninguno de nosotros tenía muchas ganas de socializar después de todo lo que había pasado, decidimos pasar el resto de la tarde en nuestras habitaciones, hasta que Rose volviera.

          Una vez que regresó, nos juntamos todos en una de las mesas de picnic en el patio, y Hadrik también se unió, después de calmarse un poco. Daren, sin embargo, no ha salido de su habitación en absoluto desde que llegamos a la mansión.
