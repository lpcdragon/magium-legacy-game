  - name: ch11a_incriminated
    texts:
      - source: scene_text
        paragraph: 55
        text: |-
          Nos tomó menos de una hora llegar al distrito de los Mendigos esta vez. El olor nauseabundo seguía ahí, pero de alguna manera ya no me molestaba tanto. Quizás me había acostumbrado a él mientras tanto.

          "Rose," dice Kate, mientras viajamos por el distrito de los Mendigos, "¿estás segura de que es buena idea que te vean a nuestro lado ahora mismo? Bien podríamos habernos convertido en criminales buscados en esta ciudad después del incidente de ayer."

          "Oh, no tienes que preocuparte por mí," dice Rose. "Hace unos años, nuestro rey promulgó una ley que nos impide a los locales ser incriminados simplemente por asociarnos con criminales de otros continentes. Como la gente de Varathia no suele asociarse con forasteros en general, se asume que cuando lo hacen, es porque están siendo tomados como rehenes. El rey gnomo ha promulgado muchas leyes así que nos protegen del daño en los últimos años. Es visto como un rey del pueblo, y muchos lo admiran por ello."
