              "Señor..." dice la chica esclava, mientras me tira suavemente de la manga. "Disculpe, señor..."

              Cuando me doy vuelta, la chica hace una reverencia, y luego se presenta.

              "Mi nombre es Ella," dice, "pero la mayoría de mis amos simplemente me llamaban 'chica esclava'. Sé que quizás no parezca gran cosa, pero si me acepta, juro servirle lo mejor que pueda, hasta el día de mi muerte. Solo déme mi primera orden, y nuestro contrato estará completo."
