  - name: ch11a_poster
    texts:
      - source: scene_text
        paragraph: 58
        text: |-
          "¿De dónde vino esa luz?" pregunta Hadrik. "¿La hicieron esos dos magos?"

          "Es muy probable," dice Illuna. "Puede que no te hayas dado cuenta porque sigo controlando el cuerpo, pero Flower también se ha desmayado, y no puedo despertarla. Parece que está en una especie de estasis, muy parecida a la que yo le provoqué cuando estábamos en el fuerte de los ogros."

          Mientras Daren intenta despertar a Rose, los dos magos que venían hacia nosotros finalmente hacen su aparición. Uno de ellos va vestido con túnicas negras y tiene un tatuaje de culebra en su cabeza calva, mientras que el otro lleva túnicas verdes y un aro de plata en la cabeza. Los reconozco inmediatamente como los dos seguidores del Dios de la Muerte y el Dios del Destino que intentaron matarnos con los esqueletos stillwater el día que conocimos a Hadrik.

          "Mucho para tu estúpida trampa, Zack," dice el mago de las túnicas verdes. "Pagamos todo ese dinero y lo único que logramos fue noquear al único miembro de su equipo que ni siquiera puede pelear."

          "Silencio, idiota," dice Zack. "El mercader nos advirtió que la trampa tenía pocas probabilidades de éxito contra magos entrenados. Y no solo atrapamos a una, sino a dos. Si miras con atención, puedes ver que la niña es en realidad una fusión de dos almas. Logramos poner a la anfitriona en un estado latente, mientras que la banshee sigue controlando el cuerpo."

          "¡Ustedes!" grita Daren a los dos magos. "¿Cómo siguen aquí después de herir a Rose? ¿Por qué el hechizo del torneo no los envió de vuelta?"
      - source: scene_text_2
        paragraph: 38
        text: |-
          "Yo te haría la misma pregunta, sanador con armadura," dice el mago de las túnicas verdes. "¿No mataste tú o alguno de tus amigos a un local ayer? Eso es lo que dice este cartel, después de todo."

          Saca un cartel enrollado de su manga y lo despliega frente a nosotros, para que todos podamos ver su contenido. En el pedazo de papel, vemos unos bocetos mal dibujados de mí, Daren, Kate y Eiden junto con un título que dice: 'Se buscan - Vivos o muertos - Daren, el sanador con armadura, y sus cómplices, por el asesinato del conde de Ollendor'. La recompensa por nuestras cabezas está en una moneda local con la que no estoy familiarizado, pero supongo que probablemente están ofreciendo mucho dinero, dadas las circunstancias.

          "Casualmente vimos este cartel ayer mientras buscábamos algunas recompensas para matar el tiempo," dice el mago de las túnicas verdes, "y rápidamente acordamos que no era una mera coincidencia, sino la mano del destino guiando nuestras acciones."

          "No fue el destino," dice Zack, "fue el mismísimo Dios de la Muerte quien nos daba otra oportunidad de compensar nuestro miserable fracaso de la semana pasada. Esta vez nos aseguraremos de enviarlos a todos a sus tumbas, en nombre de mi dios."
