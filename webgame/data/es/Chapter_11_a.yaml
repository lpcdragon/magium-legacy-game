  - name: ch11a_toy
    routes:
      - condition: ch11_toy = 1
        texts:
          - source: scene_text
            paragraph: 30
            text: |-
              "Eh, Suzie," digo, "¿me puedes prestar ese juguete tuyo un segundo? Solo quiero ver algo."

              "¡No!" dice la niña. "¡Es mío! ¡No puedes tenerlo!"

              Sinceramente, no sé qué otra cosa esperaba cuando hice esa pregunta.

              "Está bien, entonces ¿qué tal un intercambio?" digo, mientras saco mi potenciador de estadísticas del bolsillo. "Te dejo jugar con esto mientras yo le echo un vistazo a tu juguete. ¿Trato?"

              La niña trata de fingir indiferencia cuando ve mi dispositivo de estadísticas, pero es bastante fácil ver que le he despertado el interés. Finalmente, cede y acepta intercambiar temporalmente su dispositivo por el mío. Mientras estudio su juguete de cerca, noto que hay una pequeña marca en el costado que se parece mucho a un tenedor doblado, pero aparte de eso, no hay nada más que llame la atención. Ni siquiera sentí esa leve sensación de cosquilleo que normalmente siento cuando mi dispositivo de estadísticas intenta unirse a mi aura. Quizás después de todo solo sea un juguete.

              "¿Estás seguro de que es buena idea simplemente entregarle tu dispositivo así, Barry?" me pregunta Hadrik, con una sonrisa. "¿No te preocupa que te desordene por completo todas las estadísticas mientras juega con él?"

              "Nah," digo. "Me aseguré de bloquear todas las estadísticas antes de dárselo. Lo único que puede hacer con él ahora es mirar la pantalla."

              Una vez que termino de ver el juguete, se lo devuelvo a la hermana de Rose, a cambio de mi dispositivo de estadísticas.
          - source: scene_text_2
            paragraph: 22
            text: |-
              "¡Me engañaste!" dice Suzie, con cara de puchero. "Tu juguete está roto. No hace nada. ¡Eso no es justo!"

              "La vida nunca es justa, niña," le digo, mientras guardo mi dispositivo en el bolsillo. "¡Es mejor aprenderlo mientras eres joven!"

              "¡No le hagas caso, Suzie!" dice Rose. "Barry se pone gruñón porque sus padres solo le daban juguetes rotos cuando era niño."

              Suzie se ríe.

              "¡Pobre Barry!" dice.

              "¡Pobre Barry!" la imita su hermano.

              "Rose," dice Daren. "¿Podrías mostrarme mi habitación? Lo único que quiero ahora mismo es acostarme en una cama por un rato."

              "¡Por supuesto!" dice Rose. "¡Sígueme, te mostraré el camino!"

              "¡Nosotros también vamos, nosotros también vamos!" dicen los hermanos de Rose, al unísono.

              "¡Está bien, está bien, ustedes también vienen!" dice Rose, sonriendo.

              Luego se vuelve hacia nosotros.

              "¡Por favor, pónganse cómodos!" dice Rose. "Pueden entrar a la casa y esperar en el salón principal si gustan."

              "¡Nah, estamos bien por ahora, gracias!" dice Hadrik. "Nos sentaremos en una de estas mesas de picnic."

              "¡Ya vuelvo!" dice Rose, y luego se va con Daren y sus hermanos dentro de la mansión.
