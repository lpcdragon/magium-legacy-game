  - name: ch11a_slave
    texts:
      - source: scene_text
        paragraph: 10
        text: |-
          "¿Qué demonios le pasa a todo el mundo?" dice Daren. "Todos actúan como si esto fuera perfectamente normal. No puedo simplemente quedarme aquí parado y ver cómo esto sigue así. Le voy a dar a ese gordo bastardo una lección que nunca olvidará."

          "¡Daren, espera!" dice Rose, mientras lo agarra del brazo. "¡No puedes! Ese hombre está emparentado con uno de los reyes de Varathia, y esa chica es su esclava. ¡Es su propiedad legítima!"

          "Es su... ¿qué?" dice Daren, mientras su mirada se oscurece.

          Rose duda por un segundo, cuando ve la mirada en sus ojos.

          "Esa chica es una esclava..." continúa Rose. "No tiene ningún derecho, ni libertades. Ese hombre tiene el derecho legal de usarla de la forma que quiera, y de deshacerse de ella cuando le parezca conveniente."

          Daren simplemente se queda ahí parado y mira a Rose por unos segundos, como si no pudiera creer lo que estaba escuchando.

          "¿¡Estás diciendo que esto es normal?!" le pregunta Daren, furioso. "¿¡Tratar a otra persona así?! ¿¡Como si no fuera más que un objeto?! ¿¡Encuentras esto normal, Rose?!"

          Rose abre la boca para hablar, pero no le salen palabras por unos segundos.
      - source: scene_text_2
        paragraph: 6
        text: |-
          "Independientemente de si encuentro algo de esto normal o no," dice Rose, con voz temblorosa, "el hecho es que las reglas del torneo aún te prohíben atacar a cualquiera de los locales. Viste lo que le pasó a ese mago que intentó atacarme en el bosque. Te van a teletransportar fuera de aquí antes de que siquiera tengas la oportunidad de hacer algo."

          Daren aprieta el puño, mientras su mano empieza a temblar de rabia, pero es incapaz de encontrar una réplica apropiada. En su lugar, decide voltear la cabeza, y continuar observando la escena espantosa que se desarrollaba frente a nuestros ojos.

          "Lo siento," dice la chica, mientras el hombre la golpea sin piedad. "¡Por favor, lo siento!"

          "No pedí tus disculpas, maldita," dice el hombre, mientras mira su cara ahora hinchada con asco. "Pedí que fueras útil. ¿Cómo se supone que espere algo de ti si ni siquiera puedes cargar unas cuantas bolsas?"

          Ahora que lo menciona, me doy cuenta de que hay al menos diez bolsas llenas de ropa y víveres tiradas en el suelo junto a la chica. Deben pesar una tonelada.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch11a_favor
  - name: ch11a_favor
    texts:
      - source: scene_text
        paragraph: 11
        text: |-
          "¡Señor, por favor!" suplica la chica, de rodillas. "Apenas pude dormir mientras estaba en el mercado de esclavos, y no he descansado ni un minuto desde que me compró esta mañana. Si tan solo me diera unas horas para recuperar mis fuerzas--"

          El noble agarra a la chica por el pelo y le levanta la cabeza, para mirarla directamente a los ojos.

          "¿Entonces estás diciendo que es mi culpa que seas tan inútil?" dice. "¿Es eso?"

          "¡N-n-no, señor!" dice la chica, aterrorizada. "Yo nunca..."

          "Quizás debería destriparte aquí mismo, y encontrarme una esclava de verdad," dice el hombre. "Una que pueda cargar unas cuantas bolsas. Una que no responda. Después de todo, solo pagué diez monedas de plata por ti. Eso es prácticamente calderilla para mí."

          "¡No, por favor!" dice la chica, empezando a llorar. "¡Prometo que no volveré a responder! ¡Prometo que seré buena! ¡Solo denme otra oportunidad!"

          "¿Ves ahora, Daren?" escuchamos la voz de Eiden viniendo de detrás de nosotros.

          "¡Tú!" dice Daren, incapaz de contener su furia al ver la cara de Eiden.
      - source: scene_text_2
        paragraph: 7
        text: |-
          "¿Ves la verdadera cara de la humanidad que tan desesperadamente intentas proteger?" dice Eiden. "Mira a tu alrededor. Cualquiera de estas personas que pasan por aquí podría fácilmente dominar a ese payaso y salvar a la chica. Pero no lo harán. Algunos te dirían que solo están obedeciendo la ley. Otros te harían creer que solo lo hacen para proteger a sus familias. Pero todos sabemos cuál es la verdadera razón. La ignoran porque es conveniente. Porque es más fácil mentirse a sí mismos y seguir con sus vidas que enfrentar la realidad e intentar darle algún sentido a su miserable existencia."

          Al escuchar las palabras de Eiden, Rose baja la cabeza, y comienza a mirar al suelo en silencio.

          "Pero tú no eres como ellos, ¿verdad, Daren?" continúa Eiden. "Estoy seguro de que habrías saltado a salvar a esa pobre chica en un instante, si no fuera por el hechizo del torneo protegiendo al noble."

          "Cállate," dice Daren.

          "Es una verdadera lástima, ¿no?" dice Eiden. "El hecho de que estés obligado a quedarte aquí sin hacer nada, por culpa de un insignificante hechizo."

          Eiden sonríe.

          "¿Qué pasaría si te dijera, Daren, que tengo una forma de evadir ese hechizo?" dice.

          "Diría que has perdido la cabeza," dice Daren.

          Eiden se ríe.
      - source: scene_3
        paragraph: 4
        text: |-
          "No tienes que creerme," dice. "Una vez que te dé el poder, sabrás que es verdad. Todo lo que tienes que hacer es pedirlo. Pídeme el poder, Daren, y te lo daré sin pedir nada a cambio."

          "¡Debes haberte vuelto completamente loco si realmente piensas que alguna vez consideraría pedirte un favor!" dice Daren.

          "¿Oh?" dice Eiden. "¿Entonces supongo que estás conforme con dejar a esa chica a su suerte, mientras te marchas como todos los demás?"

          Daren aprieta el puño y se muerde el labio, pero no dice nada.
