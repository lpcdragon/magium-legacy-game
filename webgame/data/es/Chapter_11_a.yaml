  - name: ch11a_luxurious
    texts:
      - source: scene_text
        paragraph: 7
        text: |-
          Después de terminar su conversación con nosotros, Ralph le hizo una seña a su colega, y este abrió las puertas de la ciudad para dejarnos pasar.

          Al entrar a la ciudad, me sorprendió ver que, en lugar de lujosas mansiones y villas, nos recibieron casas de madera destartaladas y un hedor que podría espantar hasta a una mofeta. La mayoría de la gente en las calles vestía harapos, y todos nos miraban con inquietud mientras pasábamos. Naturalmente, cada uno de ellos tenía un mensaje de advertencia flotando sobre su cabeza, diciéndome que no podía hacerles daño.

          "Perdóname si sueno ignorante, Rose," dice Daren después de caminar por las calles de la ciudad un rato. "Pero, ¿no se supone que las ciudades de Varathia representan la cúspide de la civilización humana?"

          "Así es," dice Rose. "Pero este es el distrito de los Mendigos. Entramos por la puerta este, pero los nobles y la realeza generalmente solo usan la puerta oeste cuando vienen a la ciudad, y rara vez, si es que alguna vez, pisan esta zona."

          "¿Sus ciudades están divididas según la cantidad de riqueza que posee cada individuo?" pregunta Daren, conmocionado.

          "Sí," dice Rose. "¿No es lo mismo en los otros continentes?"

          "¡No, por supuesto que no!" dice Daren. "¡Eso solo aumentaría aún más la disparidad entre los ricos y los pobres, y causaría conflictos innecesarios entre ellos!"

          "Ah, en Varathia, la mayoría de la gente pobre tiene demasiado miedo de buscar conflicto con los nobles, porque al hacerlo solo estarían poniendo en peligro a sus familias enteras."
    choices:
      - position: 1
        text: ¿Sus familias? ¿No hay leyes contra ese tipo de cosas?
        effects:
          - set:
              current_scene: ch11a_families
      - position: 2
        text: Sus nobles están empezando a sonar menos como nobles y más como una banda de matones.
        effects:
          - set:
              current_scene: ch11a_thugs
  - name: ch11a_families
    texts:
      - source: scene_text
        paragraph: 8
        text: |-
          "¿Sus familias? ¿No hay leyes contra ese tipo de cosas?"

          "¡Las hay!" dice Rose. "Pero los nobles no están sujetos a ellas."

          "¡Eso suena terrible!" dice Daren. "No puedo ni empezar a imaginar la cantidad de discriminación que esta gente enfrenta cada día de sus vidas por culpa de estas leyes injustas. ¿Cómo se permite que esto ocurra?"

          "Eh, bueno..." dice Rose. "Técnicamente, son los nobles y la realeza los que lo permiten, así que obviamente no tienen ningún problema con cómo están las cosas ahora mismo. Ustedes realmente viven en un mundo completamente diferente al nuestro, ¿no?"

          De repente, Flower, que no había dicho realmente ni una palabra desde que entramos a la ciudad, jadea fuerte y se cubre la boca con ambas manos.

          "¡Oh, dioses!" dice. "¡Lo olvidé por completo! Necesitaba comprar una cadena nueva para el amuleto de Arraka. ¿Pueden esperarme aquí? Estoy bastante segura de que había una tienda que tenía lo que quería en algún lugar cerca de las puertas de la ciudad."

          "¡Pues date prisa, entonces!" dice Hadrik. "No me gustaría pasar más tiempo aquí del absolutamente necesario. Este lugar me pone los pelos de punta."

          Mientras Flower se apresura hacia la tienda, Hadrik empieza a buscar algo que hacer mientras espera.
      - source: scene_text_2
        paragraph: 5
        text: |-
          "Oye, Daren," dice Hadrik. "Hay una tienda de armaduras justo ahí, en la esquina. ¿Quieres venir a ver qué tienen? ¡Esta podría ser la oportunidad perfecta para que por fin te deshagas de ese horrible peto tuyo!"

          "Paso," dice Daren, con un tono ácido en su voz.

          "Como quieras," dice Hadrik con una sonrisa, y entra a la tienda de armaduras.

          "Ustedes dos realmente no se llevan bien, ¿verdad?" le pregunta Kate a Daren.

          "No sé de qué hablas," dice Daren. "Hadrik y yo nos llevamos perfectamente bien."

          "Claro..." dice Kate.

          Mientras todos estamos ahí parados esperando, de repente escuchamos el grito de una chica viniendo de nuestra derecha. Cuando nos damos vuelta, vemos que un hombre grande de unos cincuenta años está golpeando brutalmente a una chica de quince años, en medio de la calle. A juzgar por su ropa extravagante y las joyas alrededor de su cuello, parecería ser uno de los nobles locales, o tal vez incluso de la realeza.
      - source: scene_3
        paragraph: 3
        text: La chica está vestida con harapos, pero no del tipo de harapos que usaría la gente que hemos visto hasta ahora en el distrito de los Mendigos. Estas ropas suyas se ven mucho más desgastadas, y no parece que se haya puesto ningún esfuerzo en hacerlas lucir estéticamente agradables ni siquiera cuando eran nuevas. Dejando su ropa de lado, lo que es realmente extraño aquí es que la chica no parece ofrecer ningún tipo de resistencia mientras la golpean. No levanta las manos para defenderse, no intenta huir, y no pide ayuda. Es más, la gente en las calles simplemente pasa de largo junto a ellos y los ignora, como si nada estuviera pasando.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch11a_slave
  - name: ch11a_thugs
    texts:
      - source: scene_text
        paragraph: 9
        text: |-
          "Sus nobles están empezando a sonar menos como nobles y más como una banda de matones."

          "Yo, eh..." dice Rose, mientras empieza a mirar a su alrededor, con ansiedad. "Yo no diría ese tipo de cosas en voz alta si fuera tú..."

          "¿Qué van a hacer?" pregunto. "¿Meterme en la cárcel por decir mi opinión?"

          "Sí, de hecho," dice Rose. "Ustedes realmente viven en un mundo completamente diferente al nuestro, ¿no?"

          De repente, Flower, que no había dicho realmente ni una palabra desde que entramos a la ciudad, jadea fuerte y se cubre la boca con ambas manos.

