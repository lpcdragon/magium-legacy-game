  - name: ch11a_details
    texts:
      - source: scene_text
        paragraph: 27
        text: |-
          "Teniendo en cuenta el duro entrenamiento que reciben los esclavos hoy en día, dudo mucho que Ella hiciera algo para dañar a los niños," dice Rose. "También pasará un buen tiempo antes de que me vaya de nuevo en un viaje tan largo lejos de casa, así que tendré mucho tiempo para conocerla y descubrir qué tipo de persona es."

          Rose hace una pausa.

          "Además," dice, "tanto Daren como Eiden me hicieron darme cuenta de que no he sido completamente honesta conmigo misma hasta ahora respecto a cómo tratan a los esclavos en nuestra sociedad. Lo que dijo Eiden era completamente cierto. Realmente he estado haciendo la vista gorda ante toda esta situación porque era más conveniente así. No tengo excusa. Incluso si no puedo cambiar cómo funciona nuestra sociedad, aún puedo intentar ayudar donde pueda. ¡Ver a Barry enfrentar el problema tan directamente frente a mis ojos me dio el valor para finalmente empezar a hacer algo al respecto! Y por ahora, la forma en que puedo ayudar es proporcionar un hogar y un sentido de propósito a esta pobre chica desafortunada."

          "¡Bueno, ya estás curada!" le dice Daren a Ella.

          "Gracias, señor," dice la chica.
      - source: scene_text_2
        paragraph: 19
        text: |-
          Ahora que sus moretones se han ido, y la veo bien a la cara, de repente me doy cuenta de que Ella bien podría competir con Rose en un concurso de belleza. A pesar de que su pelo negro desordenado y los harapos que lleva no le hacen ningún favor, su rostro tiene todos los rasgos que hacen que una chica se vea hermosa sin maquillaje. Tiene una nariz pequeña, pómulos altos, labios llenos y grandes ojos marrones, mientras que las proporciones de su cuerpo parecen casi perfectamente equilibradas. Si hubiera vivido una vida normal, y hubiera asistido a una escuela como todas las otras chicas de su edad, probablemente habría sido muy popular. Las chicas habrían matado por tenerla en sus grupos, y los chicos la habrían cortejado todos los días. Habría tenido una vida que la mayoría de las chicas de su edad solo podrían soñar. Si hubiera vivido una vida normal...

          "¡Muy bien, entonces!" dice Rose, mientras echa un vistazo de reojo hacia toda la gente que estaba parada al lado de la calle, mirándonos. "No deberíamos quedarnos aquí más tiempo. Vamos a buscar a Hadrik y a Flower, y tomaremos otra ruta hacia mi casa."

          Cuando Hadrik nos vio entrar a la tienda a buscarlo, pareció un poco decepcionado. Parece que le habría gustado ver la mercancía de la tienda un poco más antes de irse.

          "¿Por qué vinieron todos a buscarme tan temprano?" pregunta Hadrik. "¿No íbamos a esperar a que Flower volviera?"

          "Algunas... cosas pasaron que nos hicieron decidir tomar otra ruta hacia mi casa," dice Rose. "Les contaremos todos los detalles cuando lleguemos."
      - source: scene_3
        paragraph: 6
        text: |-
          "Ajá," dice Hadrik. "¿Y supongo que esos detalles también cubrirán cómo reclutaron a un nuevo miembro del equipo en mi ausencia?"

          "¡Captas rápido!" dice Rose, con una sonrisa juguetona.

          "Me llamo Hadrik," dice Hadrik, mientras se acerca a Ella, "pero la mayoría de los amigos me llaman 'el enano'. ¡Encantado de conocerte!"

          El enano extiende su mano hacia la chica, pero ella se asusta, y por instinto salta hacia atrás cuando él se acerca. Ella entonces nos mira a mí y a Rose, aparentemente pidiendo nuestra aprobación, y cuando le asiento con la cabeza, agarra vacilante la mano de Hadrik y la estrecha débilmente.

          "Nunca habías conocido a un enano antes, ¿verdad, muchacha?" le pregunta Hadrik a Ella, con una sonrisa.

          "Es un poco más complicado que eso," dice Rose. "Como dije, repasaremos los detalles cuando lleguemos a mi casa. Vamos, vayamos a buscar a Flower."
