  - name: ch11a_knock
    texts:
      - source: scene_text
        paragraph: 46
        text: |-
          "¡Toc, toc!" dice Rose, parada cerca de la puerta, al verme concentrado intensamente en el dispositivo de estadísticas. "¿Estoy interrumpiendo algo?"

          "No, no, ¡ya casi terminaba!" digo, mientras guardo el potenciador de estadísticas en el bolsillo.

          "Qué bueno que no te dormiste todavía," dice, mientras entra a mi habitación, llevando una bandeja llena de muffins. "¡Sé que estos muffins no se compararán con nada de lo que Flower pueda preparar, pero realmente quería mostrarte mi agradecimiento por lo que hiciste hoy de alguna manera!"

          Coloca la bandeja en una mesita cerca de mi cama y se sienta en la cama a mi lado.

          "Están muy buenos," le digo, después de darle un mordisco, "¡pero no había necesidad de tomarte la molestia de hacerlos solo para mí! No recuerdo haber hecho nada especial. Tú fuiste quien tuvo la idea de que Ella pasara el día con Suzie. Fuiste tú quien finalmente logró calmarla, no yo."

          "Sabes muy bien de qué hablo, Barry," dice Rose. "Hablo del momento en que te pusiste a salvar la vida de esa chica, a pesar de los enormes riesgos y peligros a los que te expusiste por eso."

          "Oh, ¡no hay necesidad de agradecerme por eso!" digo. "Solo lo hice porque me pareció lo correcto en ese momento, no porque quisiera alguna recompensa."
