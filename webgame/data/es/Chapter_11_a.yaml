      - source: scene_text
        paragraph: 44
        text: |-
          "Iré a buscar a Daren," digo. "Ustedes búsquenle una habitación vacía y acuéstenla en una cama."

          Hadrik me asiente, y salgo corriendo por la puerta de la mansión y subo las escaleras hasta la habitación de Daren.

          "¡Daren!" grito mientras golpeo la puerta de su habitación lo más fuerte que puedo. "¡Daren, ¿estás ahí?"

          "Barry, ¿qué pasó?" pregunta Daren al abrir la puerta. "¿Nos están atacando?"

          "No, pero Ella acaba de desmayarse por agotamiento y tiene una fiebre muy alta," le digo. "¡Necesitamos tu ayuda!"

          "Guíame," dice Daren, mientras se pone serio.

          Bajo las escaleras y me dirijo hacia la habitación vacía más cercana a la entrada de la mansión, ya que probablemente era hacia donde se habían dirigido los demás. Efectivamente, cuando llegamos, vemos que todos ya nos estaban esperando, y que Ella estaba acostada en una cama, todavía inconsciente.

          "¿Por qué nadie le dijo que descansara?" dice Daren, mientras lanza un hechizo de curación sobre la chica. "Ya estaba bastante agotada cuando la conocimos."

          "Lo intentamos," dice Kate, "pero no nos hizo caso. Tenía demasiado miedo de que si mostraba cualquier debilidad, la descartaríamos sin pensarlo, como aquel noble."
