  - name: ch11a_hostages
    texts:
      - source: scene_text
        paragraph: 56
        text: |-
          "¿Rehenes? ¿El hechizo que los protege de los forasteros ha fallado antes?"

          "El hechizo que usaron para evitar que nos atacaran nunca se había usado antes, que yo sepa," dice Rose. "No sé cómo lograron hacerlo para este torneo, pero supongo que cooperaron con un mago muy talentoso o que de alguna manera consiguieron un nuevo dispositivo poderoso. Hasta ahora, cada vez que se invitaba gente a este continente, los mantenían bajo estricta supervisión y los teletransportaban de vuelta si se portaban mal. Sin embargo, ha habido casos en los que no se vigiló adecuadamente a los forasteros, y estos causaron bastante daño antes de que finalmente fueran castigados."

          "¿Dijiste antes que tu rey es un gnomo?" dice Hadrik. "¿Escuché bien?"

          "Sí, escuchaste bien," dice Rose.

          "¿Estamos hablando del mismo tipo de gnomos?" pregunta Hadrik. "Ya sabes, los enanos frágiles que no pueden dejarse barba y que son aún más pequeños de lo normal. Los que son tan desorganizados que ni siquiera pueden formar su propio país, eligiendo en cambio vivir como nómadas que nunca se asientan en un lugar por más de unos pocos años."

          "Puede que muchos los vean como desorganizados," dice Rose, "pero nadie puede negar el hecho de que también son increíblemente ingeniosos, y que la mayoría de los grandes inventores de nuestro tiempo son de origen gnomo. El rey de Thilias también fue un famoso inventor antes de ser elegido rey."
      - source: scene_text_2
        paragraph: 37
        text: |-
          "¿Elegido?" pregunta Kate, conmocionada. "¿Quieres decir que el actual rey de Thilias no es de sangre real?"

          "Sí, eso es lo que estoy diciendo," dice Rose. "El antiguo rey de Thilias no dejó heredero, y antes de morir de vejez hizo un anuncio público, diciendo que quería que el próximo rey fuera elegido mediante votación, para que pudiera convertirse en un verdadero rey del pueblo. Naturalmente, los nobles no estaban de acuerdo con esto, pero no podían desafiar al rey abiertamente, así que se vieron obligados a realizar la votación a pesar de sus recelos. Como Golmyck era muy conocido por sus inventos y su personalidad alegre, rápidamente se convirtió en el candidato favorito, y finalmente fue elegido por una amplia mayoría para gobernar nuestro reino."

          "No quiero interrumpir," dice Illuna, "pero ¿se supone que este mercado debe estar tan desierto a esta hora? Hubiera esperado que al menos los comerciantes estuvieran despiertos a estas horas de la mañana."

          "No, tienes razón," dice Rose. "Esto es extraño. Normalmente este lugar está lleno de gente a esta hora del día. Y ahora que lo pienso, la mayoría de las calles por las que hemos pasado también estaban vacías."

          "Esto me huele a emboscada," dice Hadrik.
      - source: scene_3
        paragraph: 11
        text: |-
          "Sí, definitivamente es una emboscada," dice Arraka. "Hay dos magos dirigiéndose hacia nosotros ahora mismo. Aparecerán frente a nosotros cuando pasen esa esquina."

          Justo cuando Arraka termina su frase, toda el área a nuestro alrededor se ilumina con una luz verde brillante durante unos segundos, e inmediatamente después, Rose pierde el conocimiento y cae al suelo. Daren corre a su lado para comprobar su pulso, y nos hace una señal de que sigue viva.
