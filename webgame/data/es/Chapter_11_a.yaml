  - name: ch11a_wonderful
    texts:
      - source: scene_text
        paragraph: 15
        text: |-
          En cuanto escucha las palabras de Eiden, Daren saca su espada de su vaina, y en menos de un segundo, la balancea con todas sus fuerzas, decapitando al noble en el acto. Toda la gente que estaba caminando por la calle hasta ahora se ha detenido de repente, y ahora todos miran el cadáver del noble cayendo al suelo, con una mirada aterrorizada en sus ojos.

          De repente, el silencio es roto por la risa de Eiden.

          "¡Maravilloso!" dice. "¡Maravilloso! Deja que esta imagen se grabe en tu mente y tu corazón, sanador. Que esto marque el comienzo de tu camino hacia la desesperación. Que nunca sea olvidado. El día en que elegiste tu orgullo inútil por encima de la vida de una chica inocente."

          Daren grita, y se lanza hacia Eiden, blandiendo su espada contra él ferozmente. Eiden flota en el aire, fuera de su alcance, y luego se vuelve hacia mí y Kate.

          "Una última cosa antes de irme," dice Eiden. "Creo que debería hacerles saber que el hechizo que acabo de lanzar sobre Daren fue un hechizo de área de efecto y no uno dirigido. Esto significa que afectó toda el área a mi alrededor, y no solo a él. Ustedes dos han recibido el mismo don que su amigo sanador. Si no me creen, pueden verificar fácilmente que digo la verdad mirando a cualquiera de las personas a su alrededor, e intentando imaginar golpearlos. Verán que el hechizo del torneo ya no presenta ninguna resistencia. El efecto de mi hechizo dura indefinidamente, así que este poder es suyo para usar como quieran de ahora en adelante. ¡Dicho esto, me despido!"
      - source: scene_text_2
        paragraph: 11
        text: |-
          Eiden entonces chasquea los dedos, y desaparece inmediatamente sin dejar rastro. Cuando hago lo que dijo e intento imaginar golpear a uno de los lugareños, me doy cuenta de que no mentía. Cuando me imaginé golpeando al noble antes, definitivamente sentí algún tipo de fuerza que intentaba impedir que mis propios pensamientos se formaran, pero nada de eso sucedió esta vez.

          Mirando hacia Daren, veo que ahora está envainando tranquilamente su espada y se da vuelta para mirarnos. Tiene la misma mirada oscura en sus ojos que tenía antes.

          "Hemos terminado aquí," dice Daren, mientras camina hacia nosotros. "Vamos a buscar a Hadrik y Flower para poder seguir nuestro camino y dejar este lugar atrás."

          "Daren, yo..." empieza a decir Rose, pero Daren simplemente pasa de largo junto a ella, sin darle la oportunidad de hablar, y se dirige hacia la tienda de armaduras en la que Hadrik había entrado antes.

          Cuando Hadrik nos vio entrar a la tienda a buscarlo, pareció un poco decepcionado. Parece que le habría gustado explorar los productos de la tienda un poco más antes de irse.

          "¿Por qué vinieron todos a buscarme tan pronto?" pregunta Hadrik. "¿No íbamos a esperar a que Flower volviera?"

          "Pasaron algunas... cosas que nos hicieron decidir tomar otra ruta hacia mi casa," dice Rose. "Les contaremos todos los detalles cuando lleguemos. Vamos, vamos a buscar a Flower."
