  - name: ch11a_alone
    texts:
      - source: scene_text
        paragraph: 6
        text: |-
          "Dice que está bien, así que dejémosla tranquila por ahora."

          "Supongo... que eso sería lo mejor..." dice Kate, luciendo un poco preocupada.

          "¡Miren, las puertas de la ciudad están justo frente a nosotros!" grita Daren, quizás un poco demasiado fuerte. "¡Vamos, ya casi llegamos!"
      - source: scene_text_2
        paragraph: 4
        text: |-
