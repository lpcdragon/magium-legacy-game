scenes:
  - name: ch11a_intro
    texts:
      - source: scene_text
        paragraph: 2
        text: |-
          "¿Eres el Stillwater que destruyó la ciudad entera de Olmnar con un chasquido de sus dedos?" le pregunto a Eiden.

          "Así es," responde Eiden.

          "¿Pero eso no pasó hace como... veinte años?" digo. "¿Cuántos años tienes exactamente?"

          Eiden se detiene un momento a pensar.

          "Para ser honesto, perdí la cuenta hace unos cuantos cientos de años," dice. "Los calendarios han cambiado al menos cinco veces desde que nací, así que no tengo ni idea de en qué año estaríamos según el calendario antiguo. La aproximación más cercana que puedo darte es que estoy en algún punto de mis seiscientos y algo."

          "¿Tienes... más de seiscientos años?" le pregunto.

          "Sí, eso es lo que acabo de decir," dice Eiden. "Intenta prestar atención."

          "¿Cómo pudiste?..." le pregunta Flower a Eiden, mientras una lágrima corre por su mejilla. "¿Cómo pudiste matar a toda esa gente? ¡¿Qué te hizo la gente de Olmnar?!"

          "¿A mí?" dice Eiden. "Nada. Pero la gente de Olmnar fue la primera en empezar a cazar animales como deporte. Son la única razón de toda la guerra que ha comenzado entre los animales y los humanos. Necesitaban ser castigados."
      - source: scene_text_2
        paragraph: 2
        text: |-
          "¿Castigados?" pregunta Flower, mientras sus ojos se vuelven rojos de ira una vez más. "¡¿Todos necesitaban ser castigados?! ¡¿Incluso los ancianos?! ¡¿Incluso los niños?! ¡¿Quién te dio el derecho?! ¡Si acaso, debería haber sido decisión de Eleya, no tuya!"

          "¡Ah, claro, la vieja zorra!" dice Eiden. "Casi olvido por qué vine aquí en primer lugar."

          Se vuelve hacia mí.

          "Barry," dice Eiden, "¿sabías que el zorro dorado lanzó un hechizo de rastreo sobre todos ustedes antes de que dejaran las ruinas lessathi?"

          "¿Un hechizo de rastreo?" pregunto. "¿Por qué haría eso?"

          "¡No lo sé!" dice Eiden. "¡Pero sospecho que ella también debe de haber desarrollado un interés en ustedes!"

          Entonces empieza a mover su dedo índice por el aire, como si estuviera presionando unos botones invisibles frente a él. Después de un rato, una luz dorada empieza a brillar intensamente a nuestro alrededor, y poco después aparece frente a nosotros un holograma de la cabeza de la zorra.

          "¿Eiden?" dice Eleya. "¿Eiden, eres tú?"

          "Hola, vieja amiga," dice Eiden. "¿Me extrañaste?"

          "Eiden, ¿qué estás haciendo?" dice la zorra. "¡Detente ahora mismo!"

          El Stillwater no le hace caso y sigue manipulando su hechizo, hasta que agarra lo que parece ser una cuerda dorada hecha de luz sólida.
      - source: scene_3
        paragraph: 2
        text: |-
          "¡Eiden!" grita Eleya. "¡Eiden, no te ATREVAS!"

          Eiden sonríe y le saluda con la mano a la zorra mientras tira de la cuerda dorada, y tanto la luz que nos rodea como la cabeza de la zorra desaparecen rápidamente con un fuerte sonido metálico.
    effects:
      - set:
          successful_checks:
            - 'Punto de control alcanzado: Partida guardada.'
        condition: checkpoint_rich = 1
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch11a_intro2
              checkpoint_rich: 0
  - name: ch11a_intro2
    texts:
      - source: scene_text
        paragraph: 3
        text: |-
          "¿Eso fue todo?" le pregunto a Eiden. "¿Desactivaste el hechizo?"

          "Sí, pero el hechizo está configurado para reactivarse si sus objetivos permanecen en la misma zona durante demasiado tiempo," dice Eiden. "Creo que los escuché decir que se dirigían a la ciudad de Thilias, ¿no es así? Permítanme llevarlos a su destino. ¡Sin cargo alguno!"

          Chasquea los dedos, y de repente siento que todo mi cuerpo se comprime en un solo punto, todos mis sentidos se desvanecen por un breve instante, y cuando despierto, me encuentro de pie frente a un enorme muro de piedra que parece extenderse hasta donde alcanza la vista.

          Me vuelvo hacia Rose, quien parece haberse recuperado de su violenta tos, y que ahora está midiendo los muros con la mirada.

          "Rose, ¿esto es...?" empiezo a preguntar, pero Rose me responde antes de que termine mi pregunta.

          "Sí," dice. "La ciudad de Thilias. No mentía. Realmente nos teletransportó a nuestro destino..."

          "¡Rose!" grita Daren mientras corre hacia nosotros.

          Al parecer, el efecto de parálisis se ha disipado, porque Kate y Hadrik también se han levantado y ahora se acercan lentamente.

          "Rose, ¿estás bien?" dice Daren. "¿Necesitas curación?"

          "No, estoy bien..." dice Rose. "¡Solo fue un gran susto, nada serio!"
      - source: scene_text_2
        paragraph: 3
        text: |-
          "Arraka," digo mientras miro hacia el amuleto de Flower. "¿Detectas a Eiden en algún lugar cerca de nosotros? ¿Está escondido de forma invisible otra vez?"

          "No, no se teletransportó aquí con el resto de nosotros," dice Arraka.

          "¿Podrías avisarnos si alguna vez detectas a Eiden escondido de forma invisible cerca de nosotros de nuevo?" digo.

          "Sí, claro, sin problema," dice Arraka.

          "¿En serio?" pregunto, sorprendido. "¿Así de fácil?"

          "Así de fácil," dice Arraka. "Mientras pueda fastidiar a Eiden, el tiempo estará bien empleado para mí."

          "Entonces, supongo que tú y Eiden tienen historia, ¿no?" pregunto.

          "Ah, sí, él y yo nos conocemos desde hace mucho," dice Arraka.

          "¿Es así?..." digo.

          "Flower..." dice Kate mientras se acerca. "¿Estás bien?"

          "Estoy bien," dice Flower, secamente, mientras se limpia las lágrimas de los ojos con el dorso de la mano.

          "¿Necesitas hablar, o--" empieza a decir Kate, pero Flower la interrumpe.

          "¡Estoy BIEN!" grita Flower.
    choices:
      - position: 1
        text: ¡Ah, sí, definitivamente te ves bien!
        effects:
          - set:
              current_scene: ch11a_definitely
      - position: 2
        text: Quizás deberíamos tomar un pequeño descanso antes de entrar a la ciudad.
        effects:
          - set:
              current_scene: ch11a_break
      - position: 3
        text: Dice que está bien, así que dejémosla tranquila por ahora.
        effects:
          - set:
              current_scene: ch11a_alone
  - name: ch11a_definitely
    texts:
      - source: scene_text
        paragraph: 4
        text: |-
          "¡Ah, sí, definitivamente te ves bien!"

          Flower me frunce el ceño.

          "No soy estúpida," dice. "Sé que te estás burlando de mí. También sé que todos nosotros juntos no tendríamos oportunidad contra Eiden si decidiera ir con todo. ¡Lo SÉ! Pero aun así, ¡no podía quedarme ahí sin hacer nada!"

          "Si te hace sentir mejor," dice Daren. "Yo actué de forma muy parecida a ti la primera vez que conocí a Eiden, y ni siquiera tenía un rencor personal contra él como tú."

          "¿En serio?" pregunta Flower.

          "Sí," dice Daren. "Ya sabía que no tenía oportunidad contra él, pero cargué contra él como un toro de todas formas, y el bastardo simplemente me puso a dormir con un solo movimiento de su mano."
      - source: scene_text_2
        paragraph: 4
        text: |-
          "¡Ustedes, ahí!" escuchamos gritar a un guardia de la ciudad mientras corre hacia nosotros. "¿A qué vienen? ¡Identifíquense!"

          "¡Está bien, Ralph!" dice Rose, sonriendo. "¡Vienen conmigo!"

          Mientras el guardia se acerca, veo un mensaje de advertencia frente a mis ojos, diciéndome que no le haga daño porque es un local. Luego recibo el mismo mensaje por uno de los colegas del guardia, que se quedó cerca de las puertas.

          "¡Rose, gracias a los dioses que has vuelto!" dice Ralph. "Toda la situación con la plaga de aceite solo ha empeorado mientras estabas fuera. Todo el distrito de Sparrow ha sido puesto en cuarentena."

          El guardia nos mira a cada uno de nosotros.

          "Supongo que ustedes son a quienes debo agradecer por traer a Rose de vuelta a casa sana y salva," dice. "¡Tienen mi más profunda gratitud! Nuestra ciudad no sería la misma sin ella."

          "¿Hay algo que deba saber antes de ir al distrito de Sparrow, Ralph?" dice Rose.

          "Sí," dice Ralph. "La enfermera Martha dijo que necesitaba hablar contigo en cuanto regresaras. Deberías pasar por su tienda antes de hacer cualquier otra cosa."

          "De acuerdo," dice Rose. "Me aseguraré de ir allí en cuanto lleve a mis nuevos amigos a mi casa, entonces. ¡Gracias por avisarme!"
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch11a_luxurious
  - name: ch11a_break
    texts:
      - source: scene_text
        paragraph: 5
        text: |-
          "Quizás deberíamos tomar un pequeño descanso antes de entrar a la ciudad."

          "Podríamos hacer eso," dice Rose. "Ya estoy varios días adelantada en mi horario. Unas pocas horas más no harán mucha diferencia."

          "¿Oíste eso, Flower?" digo. "Podemos simplemente--"

          De repente noto que la chica se ha alejado mientras no estaba mirando, y que actualmente se dirige hacia las puertas de la ciudad.

          "¡Oye, Flower, espéranos!" digo mientras la alcanzo.

          "Déjame en paz," dice Flower.

          "Oye, ¿esa es forma de hablarle a--"
