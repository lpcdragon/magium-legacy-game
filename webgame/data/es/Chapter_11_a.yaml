    texts:
      - source: scene_text
        paragraph: 49
        text: |-
          "Lo sé," dice Rose, sonriendo. "Y por eso te agradezco. Tus acciones desinteresadas son lo que me dieron el valor para finalmente empezar a enfrentar el problema que he estado tratando de ignorar durante todos estos años. Ver la cara de esa chica iluminarse cuando le dije que podía quedarse aquí me hizo más feliz que cualquier otra recompensa. Después de todos estos años, finalmente siento que estoy empezando a hacer una diferencia. ¡Y todo es gracias a ti, Barry!"

          De repente, Rose aparta la mirada de mí, como si acabara de recordar algo.

          "Quizás no deberíamos estar aquí sentados, hablando así," dice Rose. "No querría que Kate se hiciera ideas equivocadas sobre nosotros si pasa por aquí..."

          "¡Espera, creo que la que tiene ideas equivocadas eres tú!" digo. "Nunca hubo nada entre Kate y yo. ¡En serio! No sentí que el corazón me latiera con fuerza cuando la conocí, a diferencia de cuando te vi por primera vez."

          Rose se sonroja al escuchar lo que dije.

          "¿Sentiste que el corazón te latía con fuerza cuando me viste por primera vez?" me pregunta Rose. "¿Sigues... sintiendo lo mismo por mí ahora?"
