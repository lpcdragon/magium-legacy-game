  - name: ch11a_nothing
    texts:
      - source: scene_text
        paragraph: 12
        text: |-
          "Bueno, ¿Daren?" le pregunta Eiden, después de un rato. "¿Qué vas a hacer?"

          "Voy a demostrarte que estás equivocado," dice Daren. "Hay algo de bondad en cualquier persona. Incluso en alguien tan podrido como este noble."

          Entonces se dirige hacia el noble y la esclava sin decir otra palabra. La esclava estaba ahora intentando desesperadamente levantar todas las bolsas del suelo, pero se le seguían cayendo sin importar cuántas veces redistribuyera el peso entre sus manos. El noble se había cansado de sus repetidos fracasos, y estaba a punto de golpearla de nuevo, pero fue interrumpido por Daren gritándole.

          "¡Espere!" dice Daren, al alcanzarlo. "¡Le está haciendo daño!"

          El noble se queda ahí parado y mira a Daren por unos segundos, como congelado.

          "¿Qué eres, algún tipo de payaso?" dice el noble. "¿O quizás te pagan por decirle obviedades a la gente? ¿Qué me vas a decir después? ¿Que el cielo es azul? ¿Que el sol sale por el este?"
      - source: scene_text_2
        paragraph: 8
        text: |-
          "¿¡No lo entiende?!" dice Daren. "¡Es humana, igual que usted! Sangra como usted, siente dolor como usted, puede asustarse, puede estar feliz o triste. ¿Cómo puede hacerle esto a un ser humano?"

          "No es un ser humano, imbécil," dice el noble. "Es una esclava. Es una forma de existencia inferior a un gusano o incluso un insecto. ¿Tú te detienes a pensar en el dolor de cada bicho que aplastas entre tus manos?"

          "¡No puede hablar en serio!" dice Daren. "¿No tiene ojos? ¿No puede ver que ella es igual que nosotros?"

          "No, forastero, eres tú quien no puede ver," dice el noble. "Sé que este es un concepto difícil de entender para un bárbaro como tú, pero siento que es mi deber como ser superior educarte."

          El noble agarra a la chica esclava por el pelo, y la pone frente a Daren.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch11a_civilization
  - name: ch11a_civilization
    texts:
      - source: scene_text
        paragraph: 13
        text: |-
          "Esto de aquí es una esclava," dice el noble. "Eso significa que está en lo más bajo de la jerarquía. En un mundo civilizado, los humanos están todos clasificados según su estatus. Los que están abajo sirven para hacer la vida más fácil a los que están arriba. De esta manera, las mentes iluminadas pueden concentrarse en gobernar, mientras que las formas de vida inferiores pueden concentrarse en las tareas mundanas que son más adecuadas para ellas. La existencia de los esclavos es una de las principales razones por las que nuestra civilización es mucho más avanzada que la de todos los otros continentes. ¿Quién crees que construyó esa muralla gigante por la que pasaste al entrar a la ciudad? ¿Quién crees que construyó los castillos, o nuestro complejo sistema de alcantarillado? Los esclavos son el cimiento de una sociedad sana y avanzada, y tu incapacidad para comprender un concepto tan simple solo demuestra que eres producto de una civilización muy inferior a la de Varathia."

          "¡Está equivocado!" dice Daren. "¡Esto no es civilización! ¡Esto es inhumano! ¡Está tratando las vidas humanas como si no fueran nada! No es demasiado tarde. Todavía puede cambiar. Si tan solo escuchara lo que digo..."

          "Veo que las palabras se desperdician con los de tu clase," dice el noble, decepcionado. "No sé por qué esperaba algo diferente. Si las palabras son demasiado complicadas para tu entendimiento, quizás una demostración visual sea necesaria."

          Se mete la mano en el bolsillo, y saca un cuchillo.

          "No, espere, ¿qué está haciendo?" dice Daren, empezando a entrar en pánico.
      - source: scene_text_2
        paragraph: 9
        text: |-
          "Te voy a mostrar, forastero, lo que le pasa a una esclava que ya no puede cumplir su propósito," dice el noble. "Después de que termine con su miserable vida, verás que nada va a cambiar. Nadie llorará su muerte, nadie se detendrá a mirar, nadie se verá afectado por su muerte, y la vida simplemente seguirá adelante sin ella, como si nunca hubiera existido."

          "¡Espere!" grita Daren. "¡No quise ofenderlo con lo que dije! Solo por favor, baje el cuchillo, y podemos continuar nuestra conversación donde la dejamos. ¡Por favor!"

          La chica esclava parece haber perdido completamente toda esperanza que le pudiera quedar. La mirada en sus ojos está completamente vacía, mientras mira al suelo y espera pacientemente lo inevitable.

          "¡Mira eso!" dice Eiden, hacia mí. "Ese bruto va a hacer que maten a la pobre chica. ¿Estás de acuerdo con esto, Barry?"
