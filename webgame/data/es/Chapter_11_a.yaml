            paragraph: 20
            text: |-
              "Escucha bien, porque solo lo voy a decir una vez," digo. "Te vas a largar de mi vista y vas a dejar a la chica con nosotros. ¿Entiendes?"

              "¿¡La esclava?!" dice el noble. "¿¡Has sacrificado tu vida y la de tus amigos por una esclava sin valor?! Te la voy a dar si eso es lo que quieres, forastero. Pero espero que no seas tan estúpido como para pensar que te la voy a entregar de una pieza."

              El noble intenta agarrar su cuchillo del suelo, pero le piso la mano con mi bota antes de que tome el arma, lo que lo hace gritar de dolor y retraer su brazo lo más rápido posible.

              "¡Vas a pagar por esto, forastero!" dice el noble, mientras retrocede de un salto. "¡Todos lo pagarán! ¡Incluyéndote a ti, herborista!"

              Rose se ve un poco asustada, mientras el noble señala con su dedo hacia ella.

              "¡Así es!" dice. "¡Recuerdo quién eres! ¡Sé dónde vives! Despídete de la vida tranquila que has llevado hasta ahora. Solo va a ser un infierno para ti después de que-- ¡¡¡AAAARRRGH!!!"

              Antes de que pueda terminar su amenaza, el noble es envuelto en llamas, y en cuestión de segundos, se convierte en cenizas, mientras el fuego se apaga casi tan rápido como apareció. Los lugareños que estaban caminando por la calle se detienen a mirar el montón de cenizas acumulándose en el suelo, con una mirada aterrorizada en sus ojos.
          - source: scene_text_2
            paragraph: 14
            text: |-
              ”Mira, Barry, así es como se hace bien el trabajo," dice Eiden. "No querrías causarle más problemas a tu amable anfitriona de los que ya le has causado, ¿verdad?"

              "Supongo que no..." digo.

              Eiden sonríe.

              "Ahora bien," dice Eiden, "si no te importa que pregunte, ¿cuál es tu plan para salvar a los otros miles de esclavos en esta ciudad?"

              "¿Perdón?" digo.

              "Seguramente te habrás dado cuenta de que esta no es la única esclava en Varathia," dice Eiden. "Hay miles más como esta chica, que están viviendo un infierno mientras hablamos, y que ni siquiera pueden estar seguras de que sobrevivirán el día. ¿Vas a salvarlas a ellas también, Barry?"

              Eiden sonríe ampliamente.

              "A menos, por supuesto, que solo planees salvar a las que se crucen en tu camino, para poder darte palmaditas en la espalda, y pretender que hiciste una diferencia."
