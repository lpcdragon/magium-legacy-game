    texts:
      - source: scene_text
        paragraph: 24
        text: |-
          "¡Claro! ¡Supongo que puedes empezar por lustrarme las botas! Están un poco sucias."

          "Como desee, amo," dice Ella, mientras se pone de rodillas y se prepara para limpiar mis botas con una de sus mangas.

          "¡Espera, para!" digo, mientras salto hacia atrás. "Era una broma. ¡Una broma!"

          Después de terminar mi frase, siento un dolor repentino en la cabeza, cuando Kate me jala del pelo por detrás.

          "¡Tú y tus bromas estúpidas!" dice Kate. "¿No podrías haberte contenido por al menos un minuto más?"

          "¿Amo?" me pregunta la chica, confundida.

          "Ella, no necesitas hacer nada por mí," digo, mientras Kate me suelta. "¡Puedes ir a donde quieras y hacer lo que te plazca de ahora en adelante!"

          "Lo siento, no entiendo..." dice Ella.

          "¡Lo que Barry quiso decir es que eres libre de venir con nosotros!" dice Rose, con una sonrisa, mientras pone su mano en el hombro de la chica. "Estamos yendo hacia mi casa, que no está lejos de aquí."
      - source: scene_text_2
        paragraph: 16
        text: |-
          "S-s-sí señor," dice Ella. "Por supuesto."

          "Pero por ahora, creo que deberías empezar por deshacerte de esos moretones," dice Rose. "Ese hombre alto de allí vestido con armadura resulta ser el sanador de nuestro grupo. ¡Te curará en un santiamén! ¿Verdad, Daren?"

          Daren parecía estar profundamente sumido en sus propios pensamientos cuando Rose lo llamó. Le tomó un momento recobrar el sentido y darse cuenta de lo que ella quería de él.

          "Sí..." dice. "Claro. Ven aquí, y te echaremos un vistazo."

          Mientras Ella va a que la curen, Rose nos aparta a mí y a Kate para tener una pequeña conversación privada con nosotros.

          "Barry, no puedes simplemente salvar a la chica así y luego decirle que puede hacer lo que quiera," Rose me susurra. "Eso es casi tan cruel como no haber hecho nada y dejarla a su suerte."

          "¿A qué te refieres?" le pregunto.

          Rose suspira.

          "Incluso si la chica entiende tus verdaderas intenciones, ¿qué esperarías que hiciera una vez que sea libre?" pregunta Rose. "No tiene hogar adónde ir, ni familia, ni amigos, ni posesiones, y para empeorar las cosas, todos saben que ha sido esclava hasta hace poco. Incluso si de alguna manera lograra encontrar un lugar donde trabajar, a nadie le importaría si alguien la secuestrara y la convirtiera en esclava de nuevo. Con suerte, le estarías dando una pequeña muestra de libertad, que le sería arrebatada unos días después."
      - source: scene_3
        paragraph: 5
        text: |-
          "Si nos estás contando todo esto, supongo que tienes una idea de lo que podemos hacer con ella," digo.

          "¡Así es!" dice Rose, sonriendo. "¡Voy a contratarla como sirvienta en mi casa! Siempre me ha preocupado un poco dejar a mis dos hermanos solos cuando me iba por mucho tiempo, así que normalmente le pedía a mi exmarido que los visitara de vez en cuando, pero si tuviera una sirvienta que se encargara de las cosas, ¡me sentiría mucho más tranquila!"

          "¿No te preocupa dejar a tu hermanito y hermanita solos en casa con una persona que apenas conoces?" pregunta Kate.
