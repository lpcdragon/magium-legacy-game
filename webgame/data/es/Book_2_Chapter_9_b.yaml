  - name: b2_ch09b_energizer_rose
    routes:
      - condition: b2_ch9_weavers = 1 AND ch11_romance_rose = 0
        texts:
          - source: scene_text
            paragraph: 25
            text: |-
              "¿Podrías al menos decirnos qué sabes sobre... Uf..."

              Mientras hablaba, de pronto sentí unas fuertes ganas de vomitar y tuve que contenerme, aunque a esas alturas ya era bastante obvio que no podía seguir ocultando mi estado al resto.

              "Barry... ¿pasa algo?", pregunta Rose.

              "Oh, el hechizo energizante debe haberse agotado otra vez...", dice Melindra. "Supongo que debería prepararme para que me golpee una fuerte sensación de cansancio dentro de unos minutos."

              "Espera, ¿hechizo energizante?", dice Rose. "¿De qué está hablando?"
          - source: scene_text_2
            paragraph: 17
            text: |-
              "Melindra pasó la noche en la tienda de Barry, ayer", dice Kate, con voz fría. "Los dos usaron un hechizo energizante, pero Barry nunca había usado uno antes, así que está sufriendo dolores de cabeza y náuseas provocados por la fatiga."

              "Oh...", dice Rose. "Ya veo..."

              "Así que, eh...", dice Hadrik, intentando cambiar de tema. "¿Cómo van las cosas en Thilias?"
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch09b_thilias
