  - name: b2_ch09b_ending
    texts:
      - source: scene_text
        paragraph: 43
        text: |-
          Hadrik tiene razón. Puedo sentir a un mago acercándose lentamente hacia nosotros y no está haciendo ningún esfuerzo por ocultar su presencia. Por la sensación que me transmite su aura, diría que es, sin duda alguna, uno de los magos más fuertes que se han unido a este torneo. Cuando por fin lo vemos bien, descubrimos que es un hombre de piel oscura, rondando los cincuenta y tantos, con el pelo corto y gris, una constitución musculosa y una mirada severa e inflexible. Empuña dos grandes espadas en las manos y lleva una armadura de cuero que parece estar fuertemente encantada. El hombre avanza despacio hasta llegar junto a Hadrik y a mí, y luego se detiene justo frente a nosotros, con una expresión bastante calmada en la cara.

          "¿Puedo preguntar si este es el campamento donde se aloja Daren, el sanador con armadura?", dice el hombre. "De ser así, me gustaría mucho reunirme con él."
      - source: scene_text_2
        paragraph: 29
        text: |-
          "Creo que ya conoces la respuesta a esa pregunta", dice Hadrik. "Pero antes de dejarte avanzar más, me temo que primero vas a tener que presentarte. Dinos... ¿quién eres y cómo conoces a Daren?"

          "Me sorprende que Daren no les haya hablado de mí", dice el hombre. "Nos conocemos desde hace mucho tiempo. Somos viejos amigos."

          "Eso sigue sin responder a la pregunta", dice Hadrik.

          El hombre sonríe.

          "Muy bien", dice. "En ese caso, me presentaré. Me llamo Nolderan. Soy un exsabio, un encantador de renombre y un maestro de artes marciales. Y además, soy el hombre que le dejó esa cicatriz a Daren."
