scenes:
  - name: b2_ch09b_inseparable
    texts:
      - source: scene_text
        paragraph: 2
        text: |-
          "Oh, eran mucho más que simples aliados", dice Melindra. "Hace seiscientos años, eran casi inseparables. Casi habrías pensado que eran pareja de verlos, de no ser porque uno de ellos era humano y el otro era un espíritu con forma de zorro del plano mágico."

          Inseparables, ¿eh? Bueno, supongo que eso explica por qué Eiden se enfadó tanto cuando sugerí que destruyó la ciudad de Olmnar porque buscaba el perdón del zorro...

          "Eh...", dice Hadrik. "Vaya, cada día se aprende algo nuevo..."

          "¡Eh, Melindra, todavía no les has contado la parte más graciosa!", dice Arraka.

          "¿De qué estás hablando?", le pregunta Melindra a Arraka, en tono frío.

          "¡Hablo de cómo el zorro lleva décadas confinado a sus bosques sagrados por su pelea con Eiden!", dice Arraka.

          "¿Por qué?", pregunta Daren. "¿Eiden lo encerró ahí con un hechizo?"

          "No es por Eiden", dice Melindra. "Es por el dragón, Tyrath. Siempre que sale de sus bosques sagrados, el zorro pierde la mayor parte de sus poderes. El dragón lo sabe y aprovecharía la oportunidad para matarlo en cuanto saliera de su reino."
      - source: scene_text_2
        paragraph: 2
        text: |-
          "Sí", dice Arraka, "pero cuando el zorro y Eiden todavía eran amigos, Tyrath no se atrevía a atacar al zorro ni siquiera cuando salía de los bosques sagrados, porque sabía que Eiden se teletransportaría de inmediato para ayudarlo, ya que podía sentirlos a ambos desde el otro lado del continente."

          "Espera", digo. "¿Esa es la única razón por la que el dragón no ha atacado al zorro mientras estaba fuera de sus bosques sagrados? ¿Por Eiden? ¿No podría simplemente... mandar a algunos de sus escuadrones de élite a pelear contra Eiden y matar al zorro mientras él estuviera distraído o algo así?"

          "No", dice Melindra. "Definitivamente no. Eiden jamás se distraería de vigilar al zorro por culpa de unos cuantos peleles. Es demasiado importante para él. Si quisieras distraer a Eiden del zorro, necesitarías llevarle todo un ejército para combatirlo. O un dios."

          "Un momento", dice Hadrik. "¿No tenían el zorro, el dragón y Eiden algún tipo de pacto que les impedía luchar entre ellos? ¿Por qué intentaría el dragón romper ese pacto matando al zorro, sabiendo que eso lo llevaría a un enfrentamiento directo con Eiden?"
      - source: scene_3
        paragraph: 2
        text: |-
          "¡Porque sería una oportunidad demasiado buena como para dejarla pasar!", dice Arraka. "Y una de las principales razones por las que el dragón aceptó hacer este pacto en primer lugar fue porque sabía que Eiden y el zorro eran aliados, y no quería arriesgarse a luchar contra ambos al mismo tiempo. Iniciar una pelea con Eiden sería un precio pequeño a pagar por librarse del zorro, sobre todo porque vive convencido de que podría derrotar a Eiden sin destruir todo el continente en el proceso, si se esforzara lo suficiente."

          "¿Y tú no crees que pudiera?", pregunta Daren.

          "Claro que no", dice Arraka. "Tyrath no tendría ninguna oportunidad contra Eiden si este fuera con todo. ¿Recuerdan cuando Eiden reveló su aura en la arena y yo dije que por fin se estaba poniendo un poco serio? Pues no estaba bromeando esa vez. Eiden es mucho más poderoso de lo que deja ver. Yo debería saberlo. Luché contra él en el invierno inmóvil. Probablemente podría enfrentarse al dragón en igualdad de condiciones incluso sin recurrir a sus trucos. ¿Pero con sus trucos? Probablemente lo destruiría sin pestañear."
    choices:
      - position: 1
        text: Si de verdad es tan poderoso, entonces ¿por qué no ha matado a Tyrath hasta ahora?
        effects:
          - set:
              current_scene: b2_ch09b_reveal
              b2_ch9_tyrath: 0
      - position: 2
        text: ¿Por qué me da la impresión de que te estás inventando excusas por haber perdido en el invierno inmóvil?
        effects:
          - set:
              current_scene: b2_ch09b_reveal
              b2_ch9_tyrath: 1
      - position: 3
        text: Pero ¿por qué Eiden sería mucho más poderoso que los stillwaters normales?
        effects:
          - set:
              current_scene: b2_ch09b_reveal
              b2_ch9_tyrath: 2
  - name: b2_ch09b_reveal
    routes:
      - condition: b2_ch9_tyrath = 0
        texts:
          - source: scene_text
            paragraph: 3
            text: |-
              "Si de verdad es tan poderoso, entonces ¿por qué no ha matado a Tyrath hasta ahora?"

              "Bueno, la primera vez que hicieron este pacto también negociaron una tregua entre los tres ejércitos", dice Melindra. "Y no es que Eiden siempre haya estado enfrentado al dragón. Incluso solíamos tener consejos mensuales en los que Eiden, el zorro y el dragón se reunían para hablar de los problemas comunes que afectaban a todos sus reinos. Yo participé en algunos de esos encuentros y, aunque las discusiones entre Eiden y Tyrath no eran muy distintas de lo que son hoy, en aquel entonces desprendían un aire mucho más amistoso. Creo que, aunque no quiera admitirlo, a Eiden le entristecería ver morir al dragón."

              "¡Ja! ¡Ni hablar!", dice Arraka. "Seguro que Eiden solo mantiene vivo al dragón porque le divierte."

              "¿Quién sabe?", dice Melindra, encogiéndose de hombros. "Hace mucho tiempo que no tengo una conversación de verdad con Eiden, así que ya no sé qué pasa por su cabeza."
          - source: scene_text_2
            paragraph: 3
            text: |-
              "Hoy nos has estado contando bastantes cosas sobre el pasado de Eiden, Melindra...", dice Illuna de pronto. "¿Puedo preguntar a qué debemos este repentino cambio de actitud por tu parte?"

              "Bueno, como obviamente soy la espía de Eiden", dice Melindra, con un tono sarcástico en la voz, "no puedo mantenerlo todo en secreto. Necesito revelar de vez en cuando algo de información sensible para asegurarme de que ustedes empiecen a confiar de verdad en mí."

              Luego mira directamente a Kate, con una sonrisa burlona.

              "¿No estás de acuerdo?", le pregunta.

              Kate le frunce el ceño, pero no dice nada.

              "Eh... quizá ya va siendo hora de cambiar de tema", dice Hadrik, intentando evitar que estalle otra discusión entre Kate y Melindra. "Por ejemplo, ¿ustedes también se dieron cuenta de que en realidad no nos hemos encontrado con muchos animales mientras atravesábamos estos bosques? Yo esperaba que estos lugares estuvieran rebosantes de vida salvaje, pero en su mayoría solo nos hemos topado con monstruos y otros magos."
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch09b_circles
      - condition: b2_ch9_tyrath = 1
        texts:
          - source: scene_text
            paragraph: 4
            text: |-
              "¿Por qué me da la impresión de que te estás inventando excusas por haber perdido en el invierno inmóvil?"

              "¿Eres idiota o qué?", dice Arraka. "Ya te dije que Eiden es más débil que yo. Solo perdí porque sus trucos me pillaron por sorpresa. No perdería una segunda vez."

              "Claro", le digo, en tono poco convencido.
          - source: scene_text_2
            paragraph: 3
            text: |-
