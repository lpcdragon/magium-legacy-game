              "El zorro los envió a investigar ese hechizo oculto de Eiden que encontramos esta mañana", digo. "No me apetecía contarles nada al respecto, así que les dije que no habíamos encontrado nada parecido."

              "Oh, ya veo...", dice Flower. "Muy bien, pues dejémosles un poco de tiempo para salir de aquí y luego podremos volver a la cúpula de hielo de Kate."

              Hacemos lo que dice Flower y esperamos un rato, hasta que los lobos y el oso pasan junto a los árboles en llamas. Una vez que dejamos de verlos, también nos abrimos paso hacia fuera y regresamos junto a nuestros amigos. Mientras volvemos hacia la cúpula, notamos que la tormenta se está calmando poco a poco, aunque el cielo todavía no se ha despejado del todo. El viento resulta mucho más soportable ahora mismo y los rayos casi han cesado. Unos minutos después, por fin llegamos junto a nuestros compañeros, que nos habían estado esperando impacientes dentro de la cúpula de hielo.
          - source: scene_3
            paragraph: 4
            text: "\"You can come out of the dome, now!\" Flower shouts at them. \"The storm is almost over.\"\r\n\r\n\"Oh, good, you're all unharmed,\" Daren says, as the ice dome gets dismissed, and he gets to have a good look at the three of us. \"I was getting worried that I might have to heal some serious burn wounds, with how long you took to come back. Did you find who you were looking for?\"\r\n\r\n\"Yes,\" Flower says. \"The animals are all safe. We can be on our way, now.\"\r\n\r\n\"Alright,\" Daren says. \"Let's get going, then. Preferably in a direction that leads us away from the forest fire.\""
