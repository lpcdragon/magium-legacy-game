  - name: b2_ch09b_things
    texts:
      - source: scene_text
        paragraph: 15
        text: |-
          "Entonces, ¿cómo van las cosas con Kate?"

          "Han ido... mejor de lo que esperaba", escribe Leila, con una leve sonrisa. "Kate y yo no hablábamos mucho durante nuestro tiempo en el Faro, así que no pensé que de verdad fuera a considerarme su amiga. Me alegra saber que me equivocaba."

          "Sí, yo también me sorprendí al ver lo mucho que se ha abierto contigo estos dos últimos días", digo. "Kate suele ser del tipo callado y rara vez sale de su caparazón, así que ha sido agradable ver este otro lado suyo por una vez."

          "No siempre fue así...", escribe Leila. "Solía hablar mucho más cuando estábamos en el Faro, sobre todo con su amiga Diane. Quizá esté empezando a volver a ser como antes, ahora que por fin tiene gente en la que puede confiar."

          "Tienes razón", digo. "Creo que esta es la primera vez en al menos diez años que logra formar parte de un grupo en el que realmente puede apoyarse sin temer que la apuñalen por la espalda."

          "¿Crees que yo también podría hacerlo algún día?", escribe Leila.
      - source: scene_text_2
        paragraph: 12
        text: |-
          "¿Hacer qué?", digo.

          "Formar parte de vuestro grupo...", escribe Leila.

          "¿De qué estás hablando?", digo. "¡Si ya formas parte de nuestro grupo!"

          Leila niega con la cabeza.

          "Solo temporalmente", escribe Leila. "Cuando terminen todos vuestros asuntos en Ollendor, yo me quedaré atrás con mi padre y ustedes se marcharán de la ciudad para vivir su siguiente aventura."

          "Sí, pero tampoco es que vayamos a hacer esto para siempre", digo. "Al final, el torneo terminará y nuestro grupo se disolverá, pero eso no significa que no vayamos a volver a vernos más adelante. Y cuando eso ocurra, serás bienvenida a unirte a nosotros."

          "No... no estoy segura de lo fácil que será para nosotros volver a encontrarnos después de que se vayan de Varathia", escribe Leila.

          "Bueno, he oído que los ciudadanos de Varathia pueden invitar a gente de fuera", digo, "así que no creo que sea un problema tan grande si nos envías una invitación oficial."
    choices:
      - position: 1
