  - name: b2_ch09b_group
    texts:
      - source: scene_text
        paragraph: 16
        text: |-
          "Entonces, ¿qué te parece nuestro pequeño grupo hasta ahora?"

          "No está mal", escribe Leila, sonriendo. "La alegría de Hadrik puede resultar un poco agotadora a veces y Daren puede ser demasiado severo en ciertas situaciones, pero todos son buena gente y disfruto de su compañía."

          "Sí, puede ser bastante divertido estar con ellos", digo. "No te preocupes, al cabo de un tiempo te acostumbras a sus rarezas. Demonios, incluso yo logré acostumbrarme a Arraka, y ya has visto cómo es. Supongo que esto es lo que pasa cuando viajas con las mismas personas durante un largo periodo de tiempo y afrontas muchas dificultades junto a ellas. Antes de darte cuenta, pasas a formar parte de un grupo muy unido y casi empiezas a pensar en ellos como en una familia."

          "¿Crees que yo también podría hacerlo algún día?", escribe Leila.
