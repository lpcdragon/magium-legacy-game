      - condition: b2_ch9_weavers = 1
        texts:
          - source: scene_text
            paragraph: 27
            text: |-
              "¿Podrías al menos decirnos qué sabes sobre las tejedoras del tiempo en general?"

              "No sé demasiadas cosas sobre las tejedoras del tiempo en general", dice Melindra. "La mayor parte de lo que sé procede de la única tejedora del tiempo que conocí y, como ya dije, prefiero no discutir los detalles. Sin embargo, hay una cosa de la que estoy bastante segura, y es que lo más probable es que los poderes de su amiga despierten por completo pronto."

              "¿Pero será capaz de controlarlos?", digo.

              "No lo sé", dice Melindra. "Eso dependerá de ella."

              "Mmm...", digo.

              "Quizá ya va siendo hora de cambiar de tema", dice Daren. "No querríamos preocupar todavía más a Rose de lo que ya está. Recibió un buen consejo sobre cómo lidiar con los hechizos que congelan el tiempo, así que dejémoslo ahí por ahora."

              "De acuerdo", dice Hadrik. "Así que, ¿cómo van las cosas en Thilias?"
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch09b_thilias
      - condition: b2_ch9_weavers = 0
        texts:
          - source: scene_text
            paragraph: 28
            text: |-
              "Rose, ¿recuerdas qué estabas haciendo antes de que el tiempo se congelara?"

              "Yo... no estaba haciendo nada especial", dice Rose. "Acababa de terminar de cocinar y llevaba la comida a mis hermanos, al patio."

              "¿Sentiste alguna emoción fuerte justo antes de activar el hechizo?", digo.

              "No...", dice Rose. "Solo estaba llevando los platos. No ocurrió nada fuera de lo normal antes de que el tiempo se congelara."

              "Mmm...", digo.

              "Quizá ya va siendo hora de cambiar de tema", dice Daren. "No querríamos preocupar todavía más a Rose de lo que ya está. Recibió un buen consejo sobre cómo lidiar con los hechizos que congelan el tiempo, así que dejémoslo ahí por ahora."

              "De acuerdo", dice Hadrik. "Así que, ¿cómo van las cosas en Thilias?"
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch09b_thilias
  - name: b2_ch09b_thilias
    routes:
      - condition: b2_ch1_interfere = 1
        texts:
          - source: scene_text
            paragraph: 29
            text: |-
              "En realidad no ha pasado gran cosa desde que ustedes se fueron", dice Rose. "Supongo que la noticia más importante sería que el señor Venard ha anunciado su retirada."

              "¿El dueño de la arena?", pregunta Daren.

              "Sí", dice Rose. "Su retirada ha pillado por sorpresa a mucha gente. Dicen que las arenas no volverán a ser lo mismo sin él. La razón que dio para decidir retirarse fue que el último evento de la arena fue el momento culminante de su carrera y que, como ya ha cumplido su objetivo de organizar el mayor espectáculo que haya visto jamás Thilias, quiere pasar página y dejar el resto a la siguiente generación."

              "Eh...", dice Hadrik. "Bueno, supongo que nunca volvería a tener la oportunidad de reunir tantas criaturas raras en toda su vida, así que cualquier otro evento que organizara a partir de ahora acabaría resultando aburrido en comparación con aquel en el que luchamos nosotros. No puedo culparlo por querer terminar su carrera en lo más alto."
          - source: scene_text_2
            paragraph: 19
            text: |-
              "También está el hecho de que su reserva de criaturas quedó completamente agotada tras el último evento", dice Daren, "así que probablemente no quisiera lidiar con el esfuerzo de conseguir criaturas nuevas otra vez. Me imagino que pasará bastante tiempo antes de que Thilias vuelva a tener otro evento de arena."

              "Los eventos con criaturas se han suspendido por tiempo indefinido", dice Rose, "pero los combates en la arena seguirán adelante según lo previsto. No estoy segura de cuánta gente seguirá asistiendo a los eventos cuando descubran que ya no habrá más criaturas, eso sí..."
          - source: scene_3
            paragraph: 8
            text: |-
              "¡Rooooose!", oímos la voz de Suzie salir del transceptor. "¡Kevin está siendo malo conmigo otra vez!"

              "¡Ahora voy, Suzie!", grita Rose.

              Luego vuelve a dirigirse a nosotros.

              "Lo siento, tengo que dejarlos por ahora", dice Rose. "Ya volveremos a hablar en otro momento. ¡Gracias por la ayuda!"

              Todos nos despedimos de Rose y luego ella cierra el transceptor para ir a ocuparse de sus hermanos.

              "Entonces, ¿vamos a volver a nuestro juego?", pregunta Hadrik.

              "Yo digo que terminemos la ronda que estábamos jugando antes de que nos interrumpieran y luego lo dejemos por hoy", dice Daren. "Quiero asegurarme de dormir algo antes de que otra tormenta aparezca de la nada para despertarnos."
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch09b_shift
      - condition: b2_ch1_interfere = 0 AND b2_ch2_deal <> 3
        texts:
          - source: scene_text
            paragraph: 30
            text: |-
              "No van demasiado bien", dice Rose. "Hoy nos enteramos de que asesinaron al señor Venard."

              "¿El dueño de la arena?", pregunta Daren. "¿Quién lo mató?"

              "Nadie lo sabe", dice Rose. "Hay muchos rumores, pero ninguno parece creíble. Los guardias de la ciudad siguen intentando encontrar al culpable."

              "No creo que lleguen a encontrarlo nunca", digo. "Lo más probable es que el dueño de la arena fuera asesinado por los lessathi. Sé con certeza que desobedeció sus órdenes directas para ayudarnos a Leila y a mí, y no creo que los lessathi se tomen muy bien la insubordinación."
          - source: scene_text_2
            paragraph: 20
            text: |-
              "¡Eso es terrible!", dice Rose. "Pero ¿por qué iba a elegir ayudarlos sabiendo el riesgo que corría?"

              "Dijo que no le importaba lo que le pasara después", digo. "Quería asegurarse de que aquel evento de arena fuera perfecto, y no iba a dejar que nadie lo arruinara. Ni siquiera los lessathi."

              "Ya veo...", dice Rose.
          - source: scene_3
            paragraph: 8
            text: |-
              "¡Rooooose!", oímos la voz de Suzie salir del transceptor. "¡Kevin está siendo malo conmigo otra vez!"

              "¡Ahora voy, Suzie!", grita Rose.

              Luego vuelve a dirigirse a nosotros.

              "Lo siento, tengo que dejarlos por ahora", dice Rose. "Ya volveremos a hablar en otro momento. ¡Gracias por la ayuda!"

              Todos nos despedimos de Rose y luego ella cierra el transceptor para ir a ocuparse de sus hermanos.

              "Entonces, ¿vamos a volver a nuestro juego?", pregunta Hadrik.

              "Yo digo que terminemos la ronda que estábamos jugando antes de que nos interrumpieran y luego lo dejemos por hoy", dice Daren. "Quiero asegurarme de dormir algo antes de que otra tormenta aparezca de la nada para despertarnos."
