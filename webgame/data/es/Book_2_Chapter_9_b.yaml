  - name: b2_ch09b_conversation
    routes:
      - condition: b2_ch9_flip = 1 AND b2_ch9_drink = 0
        texts:
          - source: scene_text
            paragraph: 40
            text: |-
              "Da la vuelta a tu carta, Hadrik", le digo.

              Hadrik me sonríe y pone su carta boca arriba. Al parecer, la carta que había dejado boca abajo era una de las peores que podría haber tenido en esta situación. No solo perdió la ronda, sino que lo hizo de forma espectacular. Casi me pregunto si no estaría buscando simplemente una excusa para volver a beber de su botella.

              "¡Buena llamada, Barry!", dice Hadrik. "Por un momento casi pensé que te tenía."

              Luego vuelve a beber de su botella de ale, antes de barajar otra vez y repartirnos nuevas cartas.

              "En fin", dice Hadrik, mientras ambos empezamos a colocar nuestras cartas en el suelo para comenzar una nueva ronda. "Estaba pensando que quizá podríamos tener una charla con los demás sobre Melindra. No sé si es buena idea dejar las cosas así hasta que lleguemos a Ollendor. Ya es bastante malo que vayamos a tener que infiltrarnos por nuestra cuenta en una ciudad fuertemente fortificada. Preferiría no tenernos también peleando entre nosotros a cada paso del camino."

              "Si volvemos a tener otra conversación privada sin Melindra, solo lograremos enfadarla aún más", digo. "Hoy ha dejado bastante claro que le han molestado todas esas veces en las que la excluíamos de las conversaciones porque no confiábamos en ella. No hace falta retorcer más el cuchillo en la herida."
          - source: scene_text_2
            paragraph: 27
            text: |-
              "¿Pero cómo vamos a convencer a los demás de que se lleven bien con Melindra, entonces?", dice Hadrik.

              "No lo sé", digo. "Pero desde luego no será hablando. Seamos serios. Si con tener una conversación bastara para arreglar toda esta situación, no estaríamos donde estamos ahora. Melindra tiene que ganarse la confianza del equipo con sus actos, no con palabras. Dudo que a estas alturas nada de lo que tú y yo podamos decir vaya a marcar una gran diferencia."

              Al terminar de hablar, miro las cartas que tengo en el suelo y de pronto me doy cuenta de que la ronda ya había terminado y de que la había ganado por un margen bastante amplio. De hecho, los puntos que obtuve en esta ronda fueron justo los suficientes para hacerme ganar toda la partida.

              Vaya... Bueno, supongo que siempre hay una primera vez.

              "¡Felicidades por ganar una partida de Met-Zek por primera vez, Barry!", dice Hadrik, mientras veo salir lentamente el sol detrás de él. "Ahora creo que deberíamos hacer una pequeña pausa para recibir como se debe a nuestro nuevo invitado. Llegará hasta nosotros en breve."
