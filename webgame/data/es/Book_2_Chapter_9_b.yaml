  - name: b2_ch09b_spell
    routes:
      - condition: b2_ch9_spell = 1
        texts:
          - source: scene_text
            paragraph: 12
            text: |-
              "De hecho sí nos topamos con un hechizo así", digo. "Para encontrarlo, tendrán que caminar en esa dirección durante unas horas, hasta llegar a un río. Luego tendrán que seguir ese río corriente abajo durante aproximadamente otra hora, y deberían poder detectar el hechizo, siempre que su sentido mágico sea lo bastante bueno."

              "Agradecemos mucho su ayuda", dice el segundo lobo. "Por desgracia, ahora mismo no tenemos nada con lo que recompensarlos, pero si alguna vez se acercan a uno de los bosques sagrados en el futuro, no duden en enviarnos un mensaje. Los lobos no olvidamos nuestras deudas con facilidad."

              "De acuerdo", digo. "Pero creo que deberían darse prisa y salir de aquí antes de que el fuego se extienda aún más. La salida está por allí."

              "Tiene nuestra más sincera gratitud, humano", dice el segundo lobo. "Espero que volvamos a encontrarnos. Vamos, hermano, salgamos de este lugar infernal."
          - source: scene_text_2
            paragraph: 9
            text: |-
              "¡Vaya, no sabía que hablabas tan bien la lengua de los animales, Barry!", dice Flower, mientras los tres animales se dirigen hacia la salida. "Solo logré entender ciertas partes de lo que dijiste. ¿Cuál era esa misión de la que hablaba el lobo antes?"

              "El zorro los envió a investigar ese hechizo oculto de Eiden que encontramos esta mañana", digo. "Les dije dónde podían encontrarlo, así que fueron a buscarlo."

              "Oh, ya veo...", dice Flower. "Muy bien, pues dejémosles un poco de tiempo para salir de aquí y luego podremos volver a la cúpula de hielo de Kate."

              Hacemos lo que dice Flower y esperamos un rato, hasta que los lobos y el oso pasan junto a los árboles en llamas. Una vez que dejamos de verlos, también nos abrimos paso hacia fuera y regresamos junto a nuestros amigos. Mientras volvemos hacia la cúpula, notamos que la tormenta se está calmando poco a poco, aunque el cielo todavía no se ha despejado del todo. El viento resulta mucho más soportable ahora mismo y los rayos casi han cesado. Unos minutos después, por fin llegamos junto a nuestros compañeros, que nos habían estado esperando impacientes dentro de la cúpula de hielo.
          - source: scene_3
            paragraph: 3
            text: |-
              "¡Ya pueden salir de la cúpula!", les grita Flower. "La tormenta casi ha terminado."

              "Oh, bien, todos están ilesos", dice Daren, mientras se disipa la cúpula de hielo y puede observarnos bien a los tres. "Estaba empezando a preocuparme de que fuera a tener que curar quemaduras graves, con lo mucho que tardaron en volver. ¿Encontraron a quienes buscaban?"

              "Sí", dice Flower. "Todos los animales están a salvo. Ya podemos seguir nuestro camino."

              "Muy bien", dice Daren. "Entonces pongámonos en marcha. Preferiblemente en una dirección que nos aleje del incendio forestal."
        effects:
          - set:
              ac_b2_ch9_helper: 1
            achievement:
              id: ac_b2_ch9_helper
              title: ¡Soy un ayudante!
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch09b_leila
