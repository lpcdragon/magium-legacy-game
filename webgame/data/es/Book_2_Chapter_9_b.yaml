        texts:
          - source: scene_text
            paragraph: 35
            text: |-
              "Claro, tomaré unos sorbos", digo. "Pero no me voy a beber una botella entera. Me emborracho demasiado rápido con el ale enana y preferiría mantenerme relativamente sobrio, por si realmente tenemos que pelear con alguien."

              "Me basta con eso", dice Hadrik. "¡Vamos allá!"

              Después de vestirme y coger mis armas, sigo a Hadrik fuera de mi tienda y luego ambos nos dirigimos a un lugar que nos ofrece una buena vista de todas las tiendas, sin estar lo bastante cerca como para despertar a los demás cuando hablemos. Ahora el cielo está casi despejado, así que parece que no tendremos que preocuparnos por otra tormenta hoy. Nos sentamos cada uno en el tronco de dos árboles caídos que están frente a frente y luego hacemos chocar nuestras botellas de ale enana.

              "¡Salud, Barry!", dice Hadrik.

              "¡Salud!", digo, mientras ambos empezamos a beber de nuestras botellas.

              "Sabes", dice Hadrik, "como esta noche estamos bebiendo los dos, estaba pensando que quizá podríamos jugar una o dos partidas de Met-Zek con las reglas originales, esta vez."

              "¿Te refieres al juego de cartas con faroles en el que tenías que dar un sorbo de ale cada vez que perdías una mano?", digo.
          - source: scene_text_2
            paragraph: 22
            text: |-
              "¡Ese mismo!", dice Hadrik.

              "Perfecto", digo. "Vamos a ello."

              Pasamos los siguientes minutos colocando las cartas y luego empezamos a jugar. Las reglas son tan complicadas como recordaba. No entiendo muy bien cómo este puede ser un juego que normalmente se juega en tabernas. Lo normal sería pensar que, llegados a cierto punto, los jugadores estarían demasiado borrachos como para poder jugarlo correctamente. O quizá se supone que eso forma parte del encanto del juego. Quién sabe.

              En cualquier caso, hay al menos una cosa que sé con certeza, y es que no se me da demasiado bien este juego. Desde que empezamos a jugar, Hadrik apenas ha perdido manos y mi puntuación deja bastante que desear. La buena noticia, sin embargo, es que Hadrik acabó aburrido de esperar a perder una mano para dar un sorbo de su botella y empezó a beber a intervalos aleatorios. Cuanto más borracho se iba poniendo, menos atención prestaba a sus manos, y eso hizo que el enfrentamiento entre los dos se equilibrara un poco más, aunque, con la cantidad de veces que yo había tenido que beber de la botella de ale, también empezaba a costarme concentrarme, incluso si solo estaba dando pequeños sorbos para evitar emborracharme demasiado.

              "Oye, Barry", dice Hadrik, mientras coloca una carta boca arriba en el suelo. "Llevo un tiempo queriendo preguntarte... ¿Cuál es tu opinión sobre Melindra hasta ahora? Has tenido ese pequeño episodio con ella en tu tienda y, aparte de Flower, pareces ser la única otra persona con la que ha hablado en privado. Sé sincero, ¿crees que acabará encajando en el grupo?"
        choices:
