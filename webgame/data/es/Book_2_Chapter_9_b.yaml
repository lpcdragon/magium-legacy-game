              "Bueno, como obviamente soy la espía de Eiden", dice Melindra, con un tono sarcástico en la voz, "no puedo mantenerlo todo en secreto. Necesito revelar de vez en cuando algo de información sensible para asegurarme de que ustedes empiecen a confiar de verdad en mí."

