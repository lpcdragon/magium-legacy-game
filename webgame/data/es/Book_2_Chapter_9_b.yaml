        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch09b_circles
  - name: b2_ch09b_circles
    texts:
      - source: scene_text
        paragraph: 6
        text: |-
          "Lo más probable es que la mayoría de los animales ya hayan ido a los bosques sagrados", dice Flower, "donde pueden recibir la protección directa del zorro dorado hasta que termine este torneo. Sería demasiado peligroso para ellos deambular por esta zona con tantos magos recorriendo estas tierras. Recuerden que el hechizo del torneo solo está hecho para proteger a los ciudadanos de Varathia, no a los animales también."

          "Aun así, todavía quedan algunos idiotas que se quedaron atrás", dice Arraka. "Por ejemplo, ¿ven ese incendio forestal de allí? Llevo dos minutos mirando a un oso y a dos lobos correr en círculos, intentando encontrar una salida hacia un lugar seguro, pero están prácticamente rodeados de árboles en llamas. Seguramente las llamas los devorarán en cualquier momento."

          "¿Qué?", pregunta Flower, horrorizada. "¡Eso es horrible!"

          "Lo sé, ¿verdad?", dice Arraka. "Nada supera al entretenimiento gratis. ¿Alguien quiere apostar cuánto tiempo les queda de vida?"

          "¡¡¡No!!!", grita Flower.
      - source: scene_text_2
        paragraph: 4
        text: |-
          "Vaya, de verdad que no te gusta apostar, ¿eh?", dice Arraka.

          "Espera, ¿hay un incendio forestal?", dice Daren, mientras intenta mirar a través de la cúpula de hielo semitransparente en busca de rastros de humo. "¿A qué distancia está de nosotros? ¿Existe riesgo de que el fuego se extienda más de lo que ya lo ha hecho?"

          "Bueno", dice Arraka, "ya casi no llueve, los rayos no han parado y el viento sigue soplando con fuerza, así que yo diría que están todas las condiciones para que el fuego siga extendiéndose. Pero, por la dirección en la que sopla el viento, diría que no debería alcanzarnos, a menos que un rayo caiga sobre algún árbol justo a nuestro lado o algo así."

          "Oh", dice Daren. "Bueno, en ese caso, deberíamos poder esperar aquí hasta que termine la tormenta."

          "¿Qué quieres decir?", pregunta Flower. "¿Y esos animales atrapados entre los árboles en llamas? ¡Tenemos que ayudarlos!"

          "¿Por qué íbamos a arriesgar nuestras vidas para ayudar a unos animales?", dice Daren. "Son problemas del zorro, no nuestros."

          "Estoy de acuerdo con Daren", dice Kate. "No deberíamos asumir riesgos innecesarios en una situación como esta."

          "¡No puedo creerlos!", dice Flower. "Pues Petal y yo vamos a ir. ¡Incluso sin su ayuda!"
    choices:
      - position: 1
        text: Ofrecerme para ir con Flower
        effects:
          - set:
              current_scene: b2_ch09b_save
              b2_ch9_animals: 1
      - position: 2
        text: Quedarme callado
        effects:
          - set:
              current_scene: b2_ch09b_silent
              b2_ch9_animals: 0
  - name: b2_ch09b_silent
    texts:
      - source: scene_text
        paragraph: 7
        text: |-
          "No creo que esa sea una buena idea...", dice Daren.

          Flower lo ignora y usa su magia de fuego para abrir un agujero en la cúpula de hielo de Kate.

          "¿Me estás escuchando?...", le dice Daren a Flower mientras ella sale de la cúpula.

          Por un segundo parece que Flower por fin va a responderle al darse la vuelta para mirarnos, pero enseguida me doy cuenta de que la persona a la que en realidad está mirando no es Daren, sino Melindra.

          "Melindra, ¿qué estás haciendo?", dice Flower. "¡Tenemos que darnos prisa!"

          "¿Yo?", dice Melindra, con expresión de sorpresa.

          "¡Sí, tú!", dice Flower. "¡Vamos, no tenemos tiempo que perder!"

          "Uf, está bien...", dice Melindra mientras también sale de la cúpula de hielo de Kate para seguir a Flower. "Supongo que iremos a salvar a unos animales..."

          "¡Maldita sea!", dice Daren, mientras Kate va cerrando poco a poco el agujero de su cúpula. "¡Cuidado con los rayos! ¡Y con las ramas en llamas que caen de los árboles!"

          "¡Tendremos cuidado!", grita Flower de vuelta, y luego desaparece entre los árboles junto con Melindra.
      - source: scene_text_2
        paragraph: 5
        text: |-
          "¿Seguro que no deberíamos ir detrás de ellas?...", nos pregunta Hadrik.

          "Flower e Illuna han sobrevivido durante los últimos veinte años apoyándose solo la una en la otra", dice Kate. "No deberían tener problemas para arreglárselas contra un simple incendio forestal."

          "Supongo...", dice Hadrik.

          "Si no vuelven en veinte minutos, iremos a buscarlas", dice Daren. "Pero espero que no haga falta..."

          Aunque todos habíamos acordado esperar dentro de la cúpula a que Flower regresara, estaba claro que nos íbamos poniendo cada vez más inquietos con cada minuto que pasaba. Diez minutos después, cuando casi empezábamos a considerar si debíamos salir antes a buscar a Flower, por fin vemos a Flower y a Melindra salir del bosque, vivas y sanas.

          "¡Ya pueden salir de la cúpula!", nos grita Flower. "La tormenta casi ha terminado."

          "Oh, bien, ambas están ilesas", dice Daren, mientras se disipa la cúpula de hielo y puede observarlas bien a las dos. "Estaba empezando a preocuparme de que fuera a tener que curar quemaduras graves, con lo mucho que tardaron en volver. ¿Encontraron a quienes buscaban?"

          "Sí", dice Flower. "Todos los animales están a salvo. Ya podemos seguir nuestro camino."

          "Muy bien", dice Daren. "Entonces pongámonos en marcha. Preferiblemente en una dirección que nos aleje del incendio forestal."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch09b_leila
  - name: b2_ch09b_save
    texts:
      - source: scene_text
        paragraph: 8
        text: |-
          "En realidad, yo también voy", digo.

          "¡Oh, vamos!", dice Daren. "¡Son animales!"

          "Animales que pueden hablar, además", digo. "No es como si fueran bestias tontas."

          "¡Pero siguen siendo animales!", dice Daren.

          "¡Barry, vamos!", me dice Flower, después de usar su magia de fuego para abrir un agujero en la cúpula de hielo de Kate.

          "Vale", digo. "Guía tú."

          "¡Barry, espera!", dice Daren.

          "Relájate", le digo al salir de la cúpula. "No es como si fuera a morir en un incendio forestal después de haber sobrevivido tanto tiempo en este torneo. Tenemos a Illuna con nosotros, que puede apagar las llamas con su magia de agua. Estaremos bien."

          "Melindra, ¿qué estás haciendo?", dice Flower, al ver que Melindra se ha quedado dentro de la cúpula. "¡Tenemos que darnos prisa!"

          "¿Yo?", dice Melindra, con expresión de sorpresa.
      - source: scene_text_2
        paragraph: 6
        text: |-
          "¡Sí, tú!", dice Flower. "¡Vamos, no tenemos tiempo que perder!"

          "Uf, está bien...", dice Melindra mientras también sale de la cúpula de hielo de Kate para seguir a Flower. "Supongo que iremos a salvar a unos animales..."

          "¡Maldita sea!", dice Daren, mientras Kate va cerrando poco a poco el agujero de su cúpula. "¡Cuidado con los rayos! ¡Y con las ramas en llamas que caen de los árboles!"

          "Sí, sí, tendremos cuidado", le digo a Daren, y luego todos nos dirigimos hacia el humo negro que sale de los árboles en llamas a lo lejos.

          Corremos en la misma dirección durante aproximadamente un minuto, con Flower a la cabeza. El aguacero de antes se ha convertido en una llovizna mientras estábamos dentro de la cúpula, pero el viento sigue siendo tan fuerte como siempre. A la velocidad a la que vamos, seguramente llegaremos a los árboles en llamas en menos de un minuto.

          "Me sorprende que hayas venido con nosotros", le digo a Melindra mientras corremos lado a lado detrás de Flower. "Tenía la impresión de que no te caían muy bien el zorro dorado y sus animales."

          "No me importan los animales", dice Melindra. "Solo vine porque Flower me lo pidió."

          "Ya veo...", digo.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch09b_save2
  - name: b2_ch09b_save2
    texts:
      - source: scene_text
        paragraph: 9
        text: |-
          "¡Concéntrense!", dice Flower. "Ya estamos cerca del fuego. Arraka, ¿puedes mostrarnos exactamente dónde están ahora mismo los animales?"

          "Bueno, podría, pero ¿dónde estaría la diversión en eso?", dice Arraka.

          "Claro que dirías eso...", dice Flower. "Da igual, los encontraremos por nuestra cuenta. Deberíamos poder sentir sus auras en cuanto nos acerquemos lo suficiente."

          "Eh...", dice Melindra. "Si están buscando al oso y a los lobos, entonces están en esa dirección. Yo también puedo sentir auras a distancia, ¿recuerdan?"

          "¡Oh, cierto, se me había olvidado por completo!", dice Flower. "¡Muchas gracias, Melindra! Vamos, acerquémonos más."

          Cuando empezamos a acercarnos al incendio forestal, enseguida descubrimos que entre nosotros y los árboles en llamas hay una espesa capa de humo negro que vamos a tener que atravesar antes de llegar a nuestro destino.

          "Melindra, ¿podrías apartar este humo con tu magia de aire?", dice Flower.

          Melindra se queda ahí quieta sin decir nada y parece estar muy concentrada en el humo que tiene delante. Al mirarla, de pronto recuerdo que era incapaz de controlar por completo sus poderes, lo cual explicaría por qué simplemente se queda mirando el humo, incapaz de decidirse.
      - source: scene_text_2
        paragraph: 7
        text: |-
          "¿Melindra?...", pregunta Flower otra vez, en voz más baja.

          "Seguramente está pensando que necesitará una gran ráfaga de aire para despejar toda esta zona de humo", le digo a Flower. "Ven aquí. Deberíamos darle espacio."

          "Oh, vale...", dice Flower mientras empieza a seguirme.

          Cuando Melindra entiende lo que estoy haciendo, me dedica un seco asentimiento y luego se prepara para lanzar su hechizo. Una vez que Flower y yo estamos lo bastante lejos, Melindra desata una potentísima ráfaga de aire que dispersa todo el humo y nos deja una vista despejada del bosque en llamas que tenemos delante. En cuanto estamos dentro del alcance, Illuna dispara un potentísimo chorro de agua con las manos y lo usa para apagar, uno por uno, los árboles que arden frente a nosotros.

          "Las llamas se han apagado", dice Flower. "¡Avancen!"

          Después de pasar junto a los árboles en llamas, no tardamos mucho en encontrar a los tres animales detectando sus auras. En cuanto llegamos hasta ellos, los dos lobos se giran para encararnos, gruñendo y enseñándonos los colmillos de forma amenazante, y el oso se alza sobre las patas traseras para parecer más intimidante.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch09b_failed
              b2_ch9_animals: 1
            condition: ancient_languages_aux < 2
          - set:
              current_scene: b2_ch09b_success
              b2_ch9_animals: 2
            condition: ancient_languages_aux >= 2
  - name: b2_ch09b_failed
    texts:
      - source: scene_text
        paragraph: 10
        text: |-
          "Esperen", nos dice Flower. "Entiendo un poco su lengua. Intentaré comunicarme con ellos."

          Entonces empieza a hacer varios sonidos de animales y a señalar hacia el camino por el que vinimos, mientras los lobos van dejando de gruñir poco a poco para escucharla.

          "¡Apartémonos para que puedan pasar!", nos dice Flower, y todos nos hacemos a un lado para darles paso libre hacia la salida.

          Los lobos y el oso nos miran con recelo durante unos segundos, pero al final deciden seguir las indicaciones de Flower y pasan despacio junto a nosotros, sin mirar atrás.

          "No estoy segura de cuánto han entendido de lo que dije", dice Flower, "pero al menos captaron la dirección correcta. Dejémosles un poco de tiempo para salir de aquí y luego podremos volver a la cúpula de hielo de Kate."
      - source: scene_text_2
        paragraph: 8
        text: |-
          Hacemos lo que dice Flower y esperamos un rato, hasta que los lobos y el oso pasan junto a los árboles en llamas. Una vez que dejamos de verlos, también nos abrimos paso hacia fuera y regresamos junto a nuestros amigos. Mientras volvemos hacia la cúpula, notamos que la tormenta se está calmando poco a poco, aunque el cielo todavía no se ha despejado del todo. El viento resulta mucho más soportable ahora mismo y los rayos casi han cesado. Unos minutos después, por fin llegamos junto a nuestros compañeros, que nos habían estado esperando impacientes dentro de la cúpula de hielo.

          "¡Ya pueden salir de la cúpula!", les grita Flower. "La tormenta casi ha terminado."

          "Oh, bien, todos están ilesos", dice Daren, mientras se disipa la cúpula de hielo y puede observarnos bien a los tres. "Estaba empezando a preocuparme de que fuera a tener que curar quemaduras graves, con lo mucho que tardaron en volver. ¿Encontraron a quienes buscaban?"

          "Sí", dice Flower. "Todos los animales están a salvo. Ya podemos seguir nuestro camino."

          "Muy bien", dice Daren. "Entonces pongámonos en marcha. Preferiblemente en una dirección que nos aleje del incendio forestal."
    effects:
      - set:
          failed_checks:
            - '[ Comprobación de lenguas antiguas fallida - nivel 2 ]'
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch09b_leila
  - name: b2_ch09b_success
    texts:
      - source: scene_text
        paragraph: 11
        text: |-
          "Esperen", les digo, en la lengua antigua de los animales. "¡Estamos aquí para ayudar!"

          "¿Cómo han entrado aquí?", me pregunta uno de los lobos, en la lengua de los animales. "Llevamos más de cinco minutos dando vueltas por esta zona y no hemos encontrado ni una sola salida."

          "Tenemos una elementalista de agua en el equipo", les digo. "¿Qué hacían ustedes tres aquí? ¿No se suponía que debían esperar en los bosques sagrados hasta que terminara este torneo de magos?"

          "El zorro dorado nos envió a una misión", dice el otro lobo.

          "¡No les cuentes lo de la misión!", dice el primer lobo.

          "Han venido hasta aquí para rescatarnos", dice el segundo lobo. "Como mínimo, podríamos mostrar un poco de sinceridad."

          "¿Qué misión les encargó?", digo. "Quizá podamos ayudar, a menos que sea un secreto, claro."

          "Nos dijeron que es posible que el stillwater Eiden haya lanzado un hechizo peculiar en algún lugar de esta zona", dice el segundo lobo. "A mi hermano y a mí nos enviaron aquí para investigarlo, porque ambos tenemos un sentido mágico muy agudo. El oso es nuestro guardaespaldas. No se habrán topado por casualidad con un hechizo apenas detectable que lleve la firma de Eiden durante su viaje, ¿verdad?"
    effects:
      - set:
          successful_checks:
            - '[ Comprobación de lenguas antiguas exitosa - nivel 2 ]'
    choices:
      - position: 1
        text: Contarle lo del hechizo de Eiden.
        effects:
          - set:
              current_scene: b2_ch09b_spell
