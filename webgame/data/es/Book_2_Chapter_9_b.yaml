      - condition: b2_ch9_amused = 1
        texts:
          - source: scene_text
            paragraph: 37
            text: |-
              "Es difícil de decir", le digo, mientras también coloco una carta boca arriba en el suelo. "Tuve una pequeña conversación con ella esta mañana, pero no logré convencerla de que dejara de antagonizar al grupo con sus actos. Dijo que no debería intentar cambiar la forma en que vive solo para acomodarse a los demás y que Eiden nunca tuvo problema con la forma en que se comportaba."

              "Sí, me temía que dijera algo así", dice Hadrik.

              "El caso es que, aunque empezara a cambiar de actitud ahora mismo, ya se ha hecho mucho daño", digo. "Kate no parece confiar en ella en absoluto. Y los demás... bueno, no estoy seguro con respecto a los demás, pero a mí me queda claro que, aparte de Flower, nadie está intentando de verdad ser su amigo."

              "Lo sé", dice Hadrik. "Por eso intenté montar esa partida de cartas antes de irnos a dormir. Esperaba que quizá, si todos hablaban un poco más entre sí, llegarían a algún tipo de entendimiento. Pero por ahora no he tenido suerte."
          - source: scene_text_2
            paragraph: 24
            text: |-
              Luego mira sus cartas y se le dibuja una sonrisa confiada en la cara mientras deja una de ellas boca abajo en el suelo. Ahora bien, las reglas de este juego dicen que puedes interrumpir cualquier ronda en cualquier momento para pedirle a tu adversario que ponga todas sus cartas boca arriba. Si su carta resulta ser mala, perdería la ronda al instante y yo ganaría cinco veces más puntos de los que obtendría si esperara a que la ronda terminara. Sin embargo, si hago eso y la carta que dejó boca abajo era en realidad una buena carta, yo perdería cinco veces más puntos de los que perdería normalmente.

              Así que la cuestión es... ¿Puso una carta buena? ¿O una mala?
