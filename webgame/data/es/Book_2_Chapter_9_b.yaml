    texts:
      - source: scene_text
        paragraph: 17
        text: |-
          "Entonces, ¿qué has estado haciendo últimamente?"

          "Bueno", escribe Leila, "de algún modo he conseguido convertirme en la árbitra de todos los futuros concursos entre Hadrik y Daren gracias a mi actuación de hoy. Y Hadrik también me ha preguntado si podría usar mi texto flotante para mostrar permanentemente las puntuaciones mientras jugamos a las cartas. Así que... ¡supongo que estoy en camino de convertirme en una miembro de pleno derecho del equipo!"

          "¡Eso está bien!", digo. "Avísame cuando hayas impresionado a suficientes miembros del grupo y me aseguraré de darte tu carné oficial de miembro."

          "¿Crees que podría conseguirlo algún día?", escribe Leila.
