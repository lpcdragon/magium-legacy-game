            paragraph: 18
            text: |-
              "Melindra pasó la noche en la tienda de Barry, ayer", dice Kate, con voz fría. "Los dos usaron un hechizo energizante, pero Barry nunca había usado uno antes, así que está sufriendo dolores de cabeza y náuseas provocados por la fatiga. Creo que puedes imaginar para qué usaron el hechizo energizante."

              "Sí... entiendo...", dice Rose, intentando parecer calmada, aunque por su tono de voz era evidente que estaba profundamente decepcionada.

              "Lo siento", dice Kate.

              "No hay motivo para disculparse", dice Rose. "Lo que pasó entre Barry y yo fue solo una noche. No había ningún compromiso. ¿Verdad, Barry?..."

              El tono de su voz al dirigirse a mí sonó casi como si me estuviera suplicando que lo dejara estar. Cualquier excusa que intentara poner a estas alturas probablemente solo empeoraría las cosas. Quizá de verdad haya llegado el momento de dejarlo ir.

              "Sí...", le digo. "Tienes razón."

              Después de que termino la frase, se hace una larga pausa durante la cual ninguno de nosotros dice nada.

              "Así que, eh...", dice Hadrik, intentando cambiar de tema. "¿Cómo van las cosas en Thilias?"
