  - name: b2_ch09b_revenant
    routes:
      - condition: b2_ch8_energizer = 3
        texts:
          - source: scene_text
            paragraph: 20
            text: |-
              "¿Hola?", oigo decir a la voz de Rose. "¿Sigue abierto este canal?"

              Oír la voz de Rose así, de la nada, hace que se me salte un latido. Como no oye ninguna respuesta por mi parte, la voz vuelve a llamarme una vez más.

              "¿Me estás oyendo?", vuelve a decir la voz de Rose.

              Cálmate, Barry. Esta no es Rose. Sabes perfectamente quién es. Es el revenant. El hecho de que tenga acceso a este canal significa que está usando el viejo transceptor de Daren. El que le dio a Rose el segundo día del torneo. Golpeo el transceptor una vez para que pueda oírme y luego intento responderle con la mayor calma posible.
          - source: scene_text_2
            paragraph: 15
            text: |-
              "¿Qué quieres?", digo.

              "Así que puedes oírme, entonces", dice el revenant. "Bien. Asegúrate de dejar este canal abierto. Volveré a ponerme en contacto contigo pronto. No intentes llamarme. Mantendré este canal cerrado por mi lado hasta que tenga un motivo para llamarte. Adiós."

              "¡Maldición, espera!", digo, pero ya no sirve de nada intentar contactar con ella.

              El canal de comunicación de su lado ya está cerrado.
        choices:
          - position: 1
            text: Dejar el canal abierto por mi lado.
            effects:
              - set:
                  current_scene: b2_ch09b_channel
                  b2_ch9_channel: 1
          - position: 2
            text: Cerrar el canal por mi lado también.
            effects:
              - set:
                  current_scene: b2_ch09b_channel
                  b2_ch9_channel: 0
      - condition: b2_ch8_energizer <> 3
        texts:
          - source: scene_text
            paragraph: 19
            text: |-
              "¿Hola?", oigo decir a la voz de Rose. "¿Sigue abierto este canal?"

              Oír la voz de Rose así, de la nada, me golpea como una daga clavándoseme en el pecho. De pronto me doy cuenta de que he estado evitando por completo pensar en Rose desde aquel día en que brindamos con Enrique en su memoria. Incluso cuando me prometí que no evitaría pensar en su muerte, aun así acabé haciéndolo. Supongo que algunas cosas son más fáciles de decir que de hacer, después de todo.

              "¿Me estás oyendo?", vuelve a decir la voz de Rose.

              Cálmate, Barry. Esta no es Rose. Sabes perfectamente quién es. Es el revenant. El hecho de que tenga acceso a este canal significa que está usando el viejo transceptor de Daren. El que le dio a Rose el segundo día del torneo. Golpeo el transceptor una vez para que pueda oírme y luego intento responderle con la mayor calma posible.
          - source: scene_text_2
            paragraph: 14
            text: "\"What do you want?\" I say.\r\n\r\n\"So you can hear me, then,\" the revenant says. \"Good. Make sure to leave this channel open. I will be contacting you again soon. Don't try to call me. I will be keeping this channel closed on my side until I'll have a reason to call you. Goodbye.\"\r\n\r\n\"Damn it, wait!\" I say, but it's no use trying to contact her anymore.\r\n\r\nThe channel of communication on her side is now closed."
        choices:
          - position: 1
            text: Dejar el canal abierto por mi lado.
            effects:
              - set:
                  current_scene: b2_ch09b_channel
                  b2_ch9_channel: 1
          - position: 2
            text: Cerrar el canal por mi lado también.
            effects:
              - set:
                  current_scene: b2_ch09b_channel
                  b2_ch9_channel: 0
  - name: b2_ch09b_channel
    routes:
      - condition: b2_ch9_channel = 1
        texts:
          - source: scene_text
            paragraph: 21
            text: |-
              Decido dejar el canal abierto por mi lado. No tengo ni idea de lo que pueda estar planeando el revenant, pero al menos escucharla no puede hacer daño.

              "¿Era... quien creo que era?", me pregunta Daren, mientras él y los demás se acercan a mí.

              "Sí", digo. "Era el revenant. Por lo visto, todavía conserva tu viejo transceptor."

              "¿Qué quería?", dice Daren.

              "Estaba comprobando si el canal seguía abierto", digo. "También dijo que volvería a ponerse en contacto conmigo más tarde y que debía dejar el canal abierto, pero no me dijo por qué. Intenté pedirle más detalles, pero cerró el canal por su lado."

              "Eh...", dice Hadrik. "Bueno, no sé el resto de ustedes, pero todo esto me ha matado un poco el ambiente. Creo que voy a recoger las cartas por ahora y terminaremos la partida en otro momento."
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch09b_shift
      - condition: b2_ch9_channel = 0
        texts:
          - source: scene_text
            paragraph: 22
            text: |-
              Decido cerrar el canal por mi lado también. No tengo ninguna obligación de hacer lo que me diga el revenant.

              "¿Era... quien creo que era?", me pregunta Daren, mientras él y los demás se acercan a mí.

              "Sí", digo. "Era el revenant. Por lo visto, todavía conserva tu viejo transceptor."

              "¿Qué quería?", dice Daren.

              "Estaba comprobando si el canal seguía abierto", digo. "También dijo que volvería a ponerse en contacto conmigo más tarde y que debía dejar el canal abierto, pero no me dijo por qué. Intenté pedirle más detalles, pero cerró el canal por su lado, así que yo también decidí cerrar el mío y dar el asunto por terminado."

              "Quizá sea lo mejor...", dice Daren.

              "Eh...", dice Hadrik. "Bueno, no sé el resto de ustedes, pero todo esto me ha matado un poco el ambiente. Creo que voy a recoger las cartas por ahora y terminaremos la partida en otro momento."
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch09b_shift
  - name: b2_ch09b_freezing
    routes:
      - condition: b2_ch8_energizer = 1
        texts:
          - source: scene_text
            paragraph: 23
            text: |-
              "¿Barry?", dice Rose. "¿Puedes oírme?"

              "Sí, te oigo", digo, mientras me levanto y golpeo el transceptor a través del bolsillo para que pueda oírme, intentando concentrarme con todas mis fuerzas en lo que está diciendo.

              "¿Era Rose a quien acabo de oír?", grita Hadrik desde la distancia.

              "Sí", le grito de vuelta, y luego saco el transceptor del bolsillo para enseñárselo. "Está en el transceptor."

              "Muy bien, hagamos una pausa", dice Hadrik, mientras él y los demás dejan sus cartas en el suelo y se dirigen hacia mí.

              "Barry, ¿están todos los demás ahí contigo?", me pregunta Rose.

              "Sí, ahora vienen", digo. "Espera un segundo."

              Luego espero a que todos los demás lleguen hasta donde estoy antes de seguir hablando.

              "Vale, ya están aquí", le digo a Rose, intentando mantener la voz calmada mientras ignoro el dolor de cabeza. "¿De qué querías hablarnos?"
          - source: scene_text_2
            paragraph: 16
            text: |-
              "Yo... no sé muy bien cómo explicarlo...", dice Rose. "Hace unos minutos ocurrió algo... Y fue realmente aterrador. Solo iba caminando por la casa cuando me di cuenta de que todo a mi alrededor estaba completamente congelado. Intenté llamar a mis hermanos, pero no respondían, no respiraban, solo estaban ahí parados, mirando al frente, mientras incluso las hojas que caían de los árboles flotaban en el aire, completamente inmóviles. Y yo no podía hacer nada. Al final el tiempo volvió a la normalidad por sí solo, pero no tengo ni idea de por qué ni de si esto podría volver a pasar. Solo puedo asumir que de algún modo activé mis poderes temporales por accidente, pero no tuve absolutamente ningún control sobre ellos. Me asusta muchísimo pensar que la próxima vez que esto ocurra quizá no sea capaz de deshacer el hechizo y me quede atrapada para siempre así, en un mundo donde todo el mundo está congelado en el tiempo salvo yo..."

              "Oh, yo no me preocuparía demasiado por eso", dice Melindra de pronto.

              "¿Qué?...", dice Daren. "¿Qué quieres decir? ¿Por qué no debería?"

              "Porque ningún hechizo que congele el tiempo dura para siempre", dice Melindra. "Por mucho que tarde, el hechizo tendría que terminar en algún momento. Pero si no te apetece esperar y no tienes ninguna forma directa de cancelar el hechizo, siempre puedes intentar interactuar físicamente con alguna de las personas que están congeladas en el tiempo. Hay una cosa que todos los hechizos que congelan el tiempo tienen en común, y es que no puedes interactuar físicamente con ningún ser vivo congelado en el tiempo sin activar la cancelación de tu hechizo."
          - source: scene_3
            paragraph: 7
            text: |-
              "Eso es...", empieza a decir Rose, pero se interrumpe. "¡Gracias! Probaré eso la próxima vez que active por accidente un hechizo de congelación del tiempo."

              "Dime una cosa...", dice Melindra. "No serás por casualidad una tejedora del tiempo, ¿verdad?"

              "Lo soy...", dice Rose. "O al menos eso fue lo que Eiden me dijo que era cuando Eiden me vio por primera vez."

              "¿Ah, sí?", dice Melindra. "Qué interesante..."

              "¿Debemos entender entonces que ya conociste antes a una tejedora del tiempo, Melindra?", pregunta Daren.

              "Sí", dice Melindra. "Pero fue durante el invierno inmóvil. Y como ya dije..."

              "Sí, sí", la interrumpe Daren. "Ya nos dijiste que no hablarías con nadie sobre el invierno inmóvil, por la razón que sea. Lo entendemos."
        choices:
          - position: 1
            text: ¿Podrías al menos decirnos qué sabes sobre las tejedoras del tiempo en general?
            effects:
              - set:
                  current_scene: b2_ch09b_energizer_rose
                  b2_ch9_weavers: 1
          - position: 2
            text: Rose, ¿recuerdas qué estabas haciendo antes de que el tiempo se congelara?
            effects:
              - set:
                  current_scene: b2_ch09b_energizer_rose
                  b2_ch9_weavers: 0
