            paragraph: 41
            text: |-
              Dejo que la ronda continúe con normalidad y coloco otra de mis cartas boca arriba.

              "Esperaba que no me desafiaras", dice Hadrik, con una sonrisa.

              Luego coloca otra carta boca arriba en el suelo y le da la vuelta a la carta que había dejado boca abajo. Al parecer, esa carta era increíblemente mala, lo que me habría hecho ganar la ronda si lo hubiera desafiado antes, pero, en combinación con la nueva carta que ahora ha puesto en el suelo, le otorga un bonificador inmenso que prácticamente hace que yo pierda la ronda al instante.

              "Más suerte la próxima vez, ¿eh, Barry?", dice Hadrik, mientras empieza a barajar.

              "Lo que tú digas", digo, y vuelvo a dar otro sorbo de mi botella.

              Una vez que Hadrik termina de barajar, reparte nuestras cartas y empezamos una nueva ronda.

              "En fin", dice Hadrik, mientras ambos empezamos a colocar nuestras cartas en el suelo. "Estaba pensando que quizá podríamos tener una charla con los demás sobre Melindra. No sé si es buena idea dejar las cosas así hasta que lleguemos a Ollendor. Ya es bastante malo que vayamos a tener que infiltrarnos por nuestra cuenta en una ciudad fuertemente fortificada. Preferiría no tenernos también peleando entre nosotros a cada paso del camino."

