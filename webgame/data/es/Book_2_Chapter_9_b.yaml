  - name: b2_ch09b_leila
    texts:
      - source: scene_text
        paragraph: 14
        text: |-
          Con la tormenta ya pasada, el resto del viaje de aquel día resultó relativamente tranquilo, salvo por algún que otro encontronazo más con magos que estaban recogiendo piñas de los árboles. Tras varias horas caminando, decidimos montar el campamento un poco antes de lo habitual, porque el cielo aún no se había despejado del todo y queríamos asegurarnos de dormir algo antes de que una nueva tormenta asomara su fea cabeza y saliera volando con todas nuestras tiendas.

          Antes de irnos a dormir, Hadrik insistió en que todos nos uniéramos a otra partida de cartas que había aprendido en tabernas enanas. Aunque yo conseguí usar mi investigación del cuaderno como excusa para no participar, los demás no tuvieron tanta suerte. Parecía que a quienes más quería ver participando en el juego era a Kate y a Melindra, porque ambas intentaron negarse varias veces, pero Hadrik no iba a aceptar un no por respuesta.
      - source: scene_text_2
        paragraph: 11
        text: |-
          Era bastante obvio lo que estaba intentando hacer. Su verdadero objetivo seguramente era crear una situación en la que Kate y Melindra se vieran obligadas a interactuar entre sí, con la esperanza de que empezaran a llevarse mejor. Probablemente todos sabían eso tan bien como yo, pero a Hadrik es bastante difícil negarle algo cuando se le mete algo en la cabeza, así que al final todos tuvieron que aceptar a regañadientes unirse a su partida.

          Después de unos quince minutos sentado sobre la hierba, leyendo mi cuaderno, de pronto veo un mensaje azul flotando delante de mis ojos.

          "¿Sigues ocupado con tu cuaderno?", escribe Leila.

          "Sí", digo, levantando la vista para mirarla. "Esos vacíos legales no van a encontrarse solos. ¿No estabas jugando hace un momento a las cartas con Hadrik?"

          "Sí", escribe Leila, "pero el juego exige que digamos los nombres de las cartas lo más rápido posible, y mis mensajes escritos no se forman instantáneamente, así que estaba en demasiada desventaja frente a los demás. ¿Puedo sentarme?"

          "Claro", le digo, mientras Leila se sienta en la hierba a mi lado.
