    routes:
      - condition: b2_ch8_energizer = 1
        texts:
          - source: scene_text
            paragraph: 18
            text: |-
              "No estoy segura de lo bien que funcionaría eso", escribe Leila, "teniendo en cuenta que mi padre y yo somos criminales buscados. Además, Ollendor es un reino paria, así que los demás reinos jamás aprobarían una invitación así, aunque yo no fuera considerada una criminal."

              "Sí, pero estás olvidando que nuestro objetivo en Ollendor es asesinar a su rey", digo. "Lo más probable es que las cosas no sigan igual después de que eso ocurra. Y puede que tu historial criminal se borre en el futuro, con un poco de ayuda de Golmyck. Creo que dejó bastante claro que está de tu lado, así que estoy seguro de que encontrará la manera de ayudarte una vez que haya ganado un poco más de influencia en su ciudad. ¡Piensa en positivo!"

              "Quizá tengas razón...", escribe Leila. "Como mínimo, algo me dice que Hadrik jamás abandonaría Varathia sin celebrar una última fiesta, independientemente de quién acabe ganando el torneo, así que seguro que nos veremos al menos una vez más antes de que se vayan."

              "¿Ves? ¿Qué te dije?", digo. "Ya entiendes cómo funciona nuestro grupo y apenas llevas viajando con nosotros poco más de dos días. ¡Prácticamente ya eres miembro oficial del equipo!"

              "Entonces me aseguraré de esforzarme para ser digna de ese título", escribe Leila, sonriendo.

              "¡Oye, Leila!", grita Hadrik. "Sé que es mucho pedir, pero ¿podrías venir a ayudarnos a llevar la puntuación con esos útiles textos flotantes tuyos? Quizá podamos cambiar un poco las reglas para que juegues con nosotros en igualdad de condiciones."
          - source: scene_text_2
            paragraph: 13
            text: |-
              "Parece que mis talentos hacen falta en otra parte", me escribe Leila, mientras se levanta de la hierba. "Buena suerte con tu cuaderno, Barry. ¡Ha sido divertido charlar contigo!"

              "Lo mismo digo", digo. "¡Asegúrate de trabajar duro para poder ganarte tu puesto permanente en el grupo!"

              "Lo haré", me escribe Leila.

              Luego se aleja de mí y empieza a dirigirse hacia los demás.

              "¡Ya voy!", escribe con grandes letras azules mientras se apresura a reunirse una vez más con la partida de cartas.
          - source: scene_3
            paragraph: 5
            text: |-
              Durante los siguientes veinte minutos más o menos, me concentro únicamente en mi cuaderno, intentando ignorar los sonidos de fondo que hacen Hadrik y los demás mientras juegan. Por desgracia, concentrarme con todas mis fuerzas no basta para lograr otro gran avance. Quizá deba empezar a adoptar un enfoque distinto en vez de limitarme a repasar toda la información que tengo disponible y esperar que al final se me ocurra algo. ¿Pero qué otro enfoque hay?...

              Mientras estoy sentado allí pensando, empieza a darme un fuerte dolor de cabeza y unas náuseas que destrozan por completo mi concentración. Parece que el segundo hechizo energizante también se ha agotado. Bueno, supongo que no tiene sentido seguir estudiando más por ahora. Más vale que me tumbe boca arriba e intente pensar lo menos posible en el dolor y en el cansancio.

              Después de unos diez minutos tumbado boca arriba, de pronto oigo una voz conocida hablar en voz alta a través de mi transceptor.
