            paragraph: 31
            text: |-
              "Han ido muy mal...", dice Rose. "Hoy mismo nos ha llegado la noticia de que el rey Golmyck ha fallecido. El comunicado oficial del palacio es que ha sufrido un ataque al corazón, pero mucha gente sospecha que lo asesinaron. Toda la ciudad está de luto. No estoy segura de qué va a pasar ahora. No se ha anunciado ninguna nueva elección. Se rumorea que los nobles pretenden poner esta vez a uno de los suyos en el poder para no tener que volver a lidiar con alguien como Golmyck."

              "Golmyck no puede haberse muerto así como así", dice Daren. "No tendría sentido. Estaba perfectamente sano la última vez que lo vimos. Creo que esto podría haber sido obra de los lessathi. Golmyck nos dijo que uno de estos días iba a reunirse con algunos representantes del reino animal para hablar sobre cómo enfrentarse a los lessathi de tu ciudad. Quizá los lessathi se enteraron de esa reunión de algún modo y decidieron matarlo antes de que fuera demasiado tarde."

              Al oír las palabras de Daren, de pronto me doy cuenta de lo que ocurrió. La razón por la que los lessathi se enteraron de lo que planeaba el rey con los animales fue por el dispositivo que me dieron para sabotear la habitación insonorizada de Golmyck. Debió de invitar a los animales a su sala subterránea, creyendo que sería seguro mantener allí la conversación, y sin saberlo reveló todos sus secretos al enemigo. Yo... fui quien hizo que mataran a Golmyck.
