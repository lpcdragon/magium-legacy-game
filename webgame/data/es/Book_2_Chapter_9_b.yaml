            text: |-
              "Es difícil de decir", le digo, mientras también coloco una carta boca arriba en el suelo. "Sinceramente, no puedo decir que haya estado precisamente en buenos términos con ella hasta ahora. De algún modo conseguí pactar una tregua con ella esta tarde, así que al menos nuestra pequeña disputa ha terminado por el momento, pero, por lo que he visto, la mayoría de la gente de nuestro grupo no parece tener muy buena opinión de ella. Kate, al menos, no parece confiar en ella en absoluto. No estoy seguro con respecto a los demás, pero está bastante claro que, aparte de Flower, nadie está intentando de verdad ser su amigo."

              "Lo sé", dice Hadrik. "Por eso intenté montar esa partida de cartas antes de irnos a dormir. Esperaba que quizá, si todos hablaban un poco más entre sí, llegarían a algún tipo de entendimiento. Pero por ahora no he tenido suerte."
          - source: scene_text_2
            paragraph: 26
            text: "He then looks at his cards, and he gets a confident grin on his face, as he places one of his cards on the ground, facing down. Now, the rules of this game state that you can interrupt any round, at any moment, to ask your adversary to turn all his cards face up. In case his card is bad, his round would be immediately forfeited, and I would gain five times more points than I would have gained, if I waited for the round to be over. However, if I do this, and the card facing down was actually a good card, I would be losing five times the points that I'd lose normally. \r\n\r\nSo, the question here is... Did he place down a good card? Or a bad card?"
        choices:
          - position: 1
            text: Decirle que dé la vuelta a su carta
            effects:
