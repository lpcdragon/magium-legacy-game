              Kate le frunce el ceño, pero no dice nada.

              "Eh... quizá ya va siendo hora de cambiar de tema", dice Hadrik, intentando evitar que estalle otra discusión entre Kate y Melindra. "Por ejemplo, ¿ustedes también se dieron cuenta de que en realidad no nos hemos encontrado con muchos animales mientras atravesábamos estos bosques? Yo esperaba que estos lugares estuvieran rebosantes de vida salvaje, pero en su mayoría solo nos hemos topado con monstruos y otros magos."
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch09b_circles
      - condition: b2_ch9_tyrath = 2
        texts:
          - source: scene_text
            paragraph: 5
            text: |-
              "Pero ¿por qué Eiden sería mucho más poderoso que los stillwaters normales?"

              "¿Y cómo quieres que lo sepa?", dice Arraka. "Para cuando me fusioné con Therius, los stillwaters ya estaban en guerra con los lessathi. No conozco la historia de cómo llegaron a existir los stillwaters, y tampoco me molesté en averiguarla."

              "Claro", digo.
          - source: scene_text_2
            paragraph: 3
            text: |-
