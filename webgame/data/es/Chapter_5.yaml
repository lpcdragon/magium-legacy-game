  - name: ch5_monster
    texts:
      - source: scene_text
        paragraph: 319
        text: |-
          "¡Detente!", grita ella, y el mago llamado Clive se detiene en seco.

          "Apártate de mi camino, mujer", dice él. "O te mataré junto con esa monstruosidad que tanto te empeñas en defender".

          "No puedes hacerle daño. No lo permitiré. Estoy en deuda con ella por salvarme la vida. Y a mí tampoco puedes hacerme daño. ¡Soy ciudadana de Varathia!"

          "¡Ja! ¿Crees que sus tontas reglas pueden detenerme? He asesinado a gente antes. Te enseñaré un truquito: mientras no te pillen en el acto, no tienen pruebas reales. ¿Qué, de verdad no te crees sus cuentos de hadas sobre que su hechizo me teletransportará de alguna manera antes de que te mate? Cualquiera más inteligente que una rata se daría cuenta de que eso no es más que un farol".

          Tiene razón. Incluso para la magia, un hechizo como el que Varathia dice haber lanzado sobre nosotros iría mucho más allá de lo que sabemos que es posible. Para detener un ataque antes de que ocurra, se necesitaría algo parecido a... la lectura del pensamiento.

          "Clive", dice uno de los otros hombres. "Quizá deberías dejarla en paz. No deberíamos ir atacando a los lugareños en nuestro segundo día".

          "No te preocupes, no voy a atacarla", dice Clive con una sonrisa malvada. "¡Solo voy a enseñarle a esta pequeña zorra cuál es su sitio!"
      - source: scene_text_2
        paragraph: 32
        text: |-
          "¡No!", grita Daren, mientras corre hacia Rose.

          Al mismo tiempo, Kate extiende su brazo hacia Clive y un cono de hielo sale lentamente de su palma.

          Clive lanza rápidamente su cuchillo a la cara de Rose y ella cierra instintivamente los ojos. El mago detiene su golpe a escasos centímetros de su objetivo y todo su cuerpo empieza a vibrar ruidosamente, mientras se ve envuelto en una luz blanca.

          "Ah, mierd--", empieza a decir, pero es teletransportado fuera del continente y lejos del torneo.

          "¿Qué le has hecho a Clive, asquerosa-- ¡¡AARGHH!!"

          El hombre que empezó a hablar fue interrumpido inmediatamente por uno de los conos de hielo de Kate, que le atravesó el hombro derecho.

          "Normalmente, no me lo pensaría dos veces antes de matar a una escoria como tú", dice Kate. "Pero prefiero evitar que Rose sea testigo de una espantosa carnicería. Así que te ofrezco la oportunidad de retirarte. ¿Qué me dices?"

          El hombre con el cono de hielo en el hombro derecho rechina los dientes.

          "Olvida a la banshee", le dice a su camarada. "¡Salgamos pitando de aquí!"

          Una vez que los dos se han alejado lo suficiente, Kate se vuelve hacia Rose y le dice:

          "He cambiado de opinión. Sería un honor servirte de escolta hasta que llegues a tu ciudad natal. Siento haberte juzgado mal. Lo que acabas de hacer ha sido muy valiente y heroico".
