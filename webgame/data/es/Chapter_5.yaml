  - name: ch5_rescue
    texts:
      - source: scene_text
        paragraph: 304
        text: |-
          No es el momento de preocuparse por el reglamento del torneo. La vida de esa mujer está en peligro. Tenemos que actuar ahora.

          "¡Daren! ¡Ven rápido!"

          "¿Qué? ¿Qué pasa?"

          "Una de las lugareñas está siendo atacada por un grupo de goblins cerca de aquí. ¡Si nos damos prisa, podemos llegar a tiempo para rescatarla!"

          Daren pone cara seria y agarra su espada.

          "Vamos", dice, y me sigue mientras me dirijo en la dirección de donde oí el grito.

          Al acercarnos, las auras mágicas de los monstruos se intensifican. Hay cuatro de ellos y tienen a la mujer rodeada, pero no parece que hayan llegado a herirla todavía.

          Cuando finalmente llegamos al alcance visual de los atacantes, se confirman mis sospechas. Son goblins, en efecto. Criaturas viles y horribles, de no más de un metro de altura, con colmillos en lugar de dientes, narices ganchudas, orejas puntiagudas y piel verde. A pesar de sus apariencias, los goblins son bastante inteligentes y suelen estar organizados en clanes con jerarquías claramente definidas, a diferencia de la mayoría de las otras razas de monstruos. También son lo suficientemente listos como para fabricar y usar herramientas, así como armas y armaduras.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch5_goblins
  - name: ch5_goblins
    routes:
      - condition: ancient_languages < 3
        texts:
          - source: scene_text
            paragraph: 305
            text: |-
              En cuanto nos ven, uno de ellos les grita algo a sus aliados en un idioma que no entiendo, y luego todos se dispersan rápidamente. Visiblemente, no estaban preparados para una lucha real.

              Una vez que los goblins se han ido, me doy la vuelta para asegurarme de que la mujer que acabamos de salvar no esté herida de ninguna manera. Ahora que la veo bien, me quedo brevemente atónito por lo hermosa que es.  Tiene el pelo largo y castaño rojizo, una cintura delgada y una sonrisa cálida, mientras que sus rasgos faciales son suaves y femeninos, a diferencia de los de Kate, y sus ojos castaños claros irradian amabilidad. Lleva un vestido castaño rojizo a juego con su pelo, y parece estar en la mitad de la veintena. La mujer hace ahora una elegante reverencia ante nosotros, como gesto de gratitud.

              "Muchísimas gracias a todos por su ayuda", dice. "¡No sé qué habría hecho sin ustedes! Mi nombre es Rose. ¡Encantada de conocerlos!"
        effects:
          - set:
              failed_checks:
                - '[ Comprobación de lenguas antiguas fallida - nivel 3 ]'
              ch5_goblins: 0
        choices:
          - position: 1
            text: ¡Gajes del oficio!
            effects:
              - set:
                  current_scene: ch5_work
          - position: 2
            text: Tuviste suerte de que lográramos llegar a tiempo.
            effects:
              - set:
                  current_scene: ch5_lucky
          - position: 3
            text: No hay problema. Nos encanta ayudar a la gente. ¡Pero también aceptamos donaciones!
            effects:
              - set:
                  current_scene: ch5_donations
      - condition: ancient_languages = 3
        texts:
          - source: scene_text
            paragraph: 306
            text: |-
              En cuanto nos ven, uno de ellos les grita algo a sus aliados. De repente me doy cuenta de que está hablando en una de las lenguas antiguas que mi dispositivo de estadísticas me ha enseñado.

              "¡Guerreros humanos!", dice él. "Olviden a la mujer. ¡Retirada!"

              "Esperen", les grito en su propia lengua.

              "¿El humano habla nuestra lengua?"

              "Sí. Ahora dime, ¿por qué atacaron a la mujer?"

              "Porque estamos muriendo de hambre, humano. No íbamos a matarla. Solo queríamos quitarle la comida que lleva en su mochila".

              "¿Por qué están aquí fuera, robando a la gente? ¿No debería su clan proporcionarles comida y refugio?"
          - source: scene_text_2
            paragraph: 21
            text: |-
              "Fuimos desterrados de nuestro clan hace dos días. No teníamos dinero para pagar nuestro tributo anual. Ahora somos parias. Vivimos de las sobras. Ni siquiera sabemos distinguir entre bayas venenosas y comestibles, así que no podemos vivir de la tierra".

              "¿A cuánto ascendía el tributo anual para los cuatro?"

              "Dos piezas de cobre".

              ¿Dos piezas de cobre? Eso es apenas el precio de una hogaza de pan. Pensándolo bien, los goblins no pueden trabajar para los humanos abiertamente ya que se les considera monstruos. Hay gente que se sabe que contrabandea mercancías y armas a los goblins, pero son raros y operan fuera de la ley. No debería sorprender que el dinero sea mucho más valioso para ellos que para nosotros.

              Tengo dinero de sobra, pero la pregunta es: ¿quiero dar siquiera dos piezas de cobre a unos monstruos que han atacado a una mujer indefensa hace un minuto?
        effects:
          - set:
              successful_checks:
                - '[ Comprobación de lenguas antiguas exitosa - nivel 3 ]'
        choices:
          - position: 1
            text: Darles las dos piezas de cobre
            effects:
              - set:
                  current_scene: ch5_goblins2
                  ch5_goblins: 1
          - position: 2
            text: No darles nada y enviarlos por su camino.
            effects:
              - set:
                  current_scene: ch5_goblins2
                  ch5_goblins: 2
  - name: ch5_goblins2
    routes:
      - condition: ch5_goblins = 1
        texts:
          - source: scene_text
            paragraph: 307
            text: |-
              Saco dos piezas de cobre de mi bolsillo derecho y se las lanzo a los goblins. Su líder atrapó las dos monedas al vuelo y ahora las mira como si no pudiera dar crédito a sus ojos.

              "¿Qué significa esto?", me pregunta.

              "Dos piezas de cobre. Para tu tributo anual. Ahora puedes volver a tu clan y dejar de robar a la gente".

              "¡No, no te creo! ¡Es una trampa! No escuchen ni una palabra de lo que dice. ¡Tiene que ser una trampa!"

              "Ehm... Disculpe... ¿señor goblin?"

              No reconozco la voz, así que me doy la vuelta para ver quién acaba de hablar. Me doy cuenta de que es la mujer que salvamos de los goblins. Ahora que la veo bien, me quedo brevemente atónito por lo hermosa que es.  Tiene el pelo largo y castaño rojizo, una cintura delgada y una sonrisa cálida, mientras que sus rasgos faciales son suaves y femeninos, a diferencia de los de Kate, y sus ojos castaños claros irradian amabilidad. Lleva un vestido castaño rojizo a juego con su pelo, y parece estar en la mitad de la veintena. En su mano sostiene unas bayas azules que ahora muestra a los goblins.
          - source: scene_text_2
            paragraph: 22
            text: |-
              "He oído que hablaban de que tenían problemas para distinguir entre bayas comestibles y venenosas, ¡y he pensado que podría ayudarles!"

              "¿Usted... puede entendernos también?"

              "Sí, aunque no tan bien como este hombre que está a mi lado. Solo he captado la mitad de lo que hablaban, ¡pero lo suficiente para entender por qué me atacaron allí atrás! Soy herborista, así que sé bastante de plantas. Aunque no puedo enseñarles todo lo que sé, puedo decirles una regla general que pueden seguir para asegurarse de no envenenarse. Deben quedarse con las bayas azules, ya que son lo suficientemente comunes como para encontrarlas en cualquier región de este continente, e incluso las más venenosas solo dan dolor de estómago como mucho. En cuanto a encontrar las que no son venenosas, basta con buscar bayas azules que sean de un color oscuro. Solo las bayas de color azul claro son peligrosas".

              Se come una de las bayas de color azul oscuro que sostiene para demostrar que no miente, y luego le lanza una bolsa llena de ellas al líder goblin. 

              "Tengan, estoy segura de que les darán mucho mejor uso a estas bayas que yo. Acabo de comer. Y por favor, no ataquen más a gente indefensa".
        effects:
