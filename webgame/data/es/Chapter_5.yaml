          - source: scene_text_2
            paragraph: 5
            text: |-
              Le entrego el dispositivo y él lo mira fijamente durante unos segundos.

              "¿Vas a hacer alg--"

              "¡Shhh!"

              Recoge una piedra del suelo y la lanza contra un pino cercano. La piedra da en el blanco y rebota, dejando una ligera marca en la corteza del árbol.

              "Pensé que algo aquí andaba mal", dice Daren. "Mira esa marca. Apenas se nota que estoy usando un dispositivo de estadísticas ahora mismo. Pero ese lanzamiento tuyo de antes... ¡Eso fue una locura! Fue tan fuerte que levantó al degollador del suelo y lo estampó contra un árbol. ¿Cómo consigues tanta potencia con esto?"

              "No estoy... seguro. Pensé que solo estaba reaccionando a la increíble cantidad de poder mágico que nos rodea. Debe haber algo en mí específicamente que hace que el potenciador de estadísticas funcione tan bien. Pero sin saber exactamente cómo funciona, es difícil decir qué podría ser".

              "Hmm..."

              Me devuelve el dispositivo.

              "Supongo que no sirve de nada quedarse aquí lanzando conjeturas, entonces. Ya lo averiguaremos más tarde. Vamos a buscar a Kate".

              Los dos nos dirigimos a nuestra cueva y procedemos a despertar a Kate de su sueño.
