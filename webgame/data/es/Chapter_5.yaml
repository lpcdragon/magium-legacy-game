  - name: ch5_work
    texts:
      - source: scene_text
        paragraph: 311
        text: |-
          "¡Gajes del oficio!", le digo.

          "¿Ah, sí?", pregunta ella, sonriendo juguetonamente. "Supongo, entonces, que la razón por la que se ha unido a este torneo es para ayudar a la gente necesitada".

          "Bueno, yo, esto..."

          "No le hagas caso a Barry", dice Daren. "Solo le gusta presumir ante las damas bonitas. Como habrás adivinado, solo somos unos participantes del torneo de magos que andaban cerca y oyeron tu grito. Estoy seguro de que cualquier otro en nuestro lugar habría hecho lo mismo".

          "Está siendo demasiado modesto, señor espadachín. Muchos otros probablemente habrían dudado en ayudarme debido a la regla de no interferencia del torneo, es decir, si es que hubieran tenido siquiera la tentación de ayudarme en primer lugar. Me gustaría pagarles por su amabilidad, pero no traje dinero conmigo, ya que temía encontrarme con ladrones".

          "Si me permites preguntar", interrumpe Kate. "¿Qué hacías sola en medio de la naturaleza?"

          "Bueno, señorita, err..."
      - source: scene_text_2
        paragraph: 26
        text: |-
          "Kate", dice Kate, mientras se señala a sí misma. Luego nos señala secamente a mí y luego a Daren, dándole a Rose también nuestros nombres.

          Rose sonríe y continúa.

          "Señorita Kate, estaba aquí buscando unas hierbas muy raras que solo crecen en esta zona del continente. Ha habido un brote de plaga de aceite en mi ciudad natal y, como herborista, puedo reconocer las plantas que se necesitan para la cura".

          "Lo siento, ¿qué es la plaga de aceite?"

          "Oh, no sabía que esta enfermedad no existe fuera de nuestro continente. Los médicos no están seguros de su causa, pero lo que ocurre es que el sudor de los pacientes se vuelve tan espeso como el aceite, y tienen una fiebre muy alta, con tos violenta. Algunos de nosotros tenemos una inmunidad natural, pero los que no tienen tanta suerte son puestos en cuarentena en algún lugar y abandonados allí para que mueran solos. La única cura que conocemos para esta enfermedad se extrae de las plantas muy raras que he venido a recolectar aquí".

          "¿Pero por qué eres tú la que ha venido a por las hierbas? ¿Tienes familiares infectados? ¿Por qué no contrataste al menos a unos guardaespaldas para que te acompañaran?"
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch5_creator
  - name: ch5_lucky
    texts:
      - source: scene_text
        paragraph: 312
        text: |-
          "Tuviste suerte de que lográramos llegar a tiempo para rescatarte. ¿En qué pensabas viniendo aquí fuera tú sola?"

          "Barry, estás siendo demasiado duro", me dice Daren.

          "No, tiene razón", dice Rose. "Venir aquí sola fue muy imprudente por mi parte. Es solo que... se me acababa el tiempo. Y nadie estaba dispuesto a venir conmigo para ayudar. No tuve otra opción..."

          "Si me permites preguntar", interrumpe Kate. "¿Qué hacías sola en medio de la naturaleza?"

          "Bueno, señorita, err..."

          "Kate", dice Kate, mientras se señala a sí misma. Luego nos señala secamente a mí y luego a Daren, dándole a Rose también nuestros nombres.

          Rose sonríe y continúa.
