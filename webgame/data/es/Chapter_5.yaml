  - name: ch5_private_truth
    routes:
      - condition: ch4_ending <> 2
        texts:
          - source: scene_text
            paragraph: 293
            text: |-
              Se detiene un momento para mirarme directamente a los ojos. 

              "¿Cómo sabes lo del Faro?", me pregunta.

              "Eiden nos dijo que eres una superviviente de ese lugar poco antes de atacar a Daren. Sin embargo, no quiso darnos ningún detalle. Dijo que deberíamos preguntártelo a ti personalmente. ¿Entonces de qué se trata?"

              "Es... complicado".

              "Sin duda. No hace falta que me cuentes toda la historia. Un breve resumen bastará".

              "¿De verdad no tienes nada mejor que hacer que entrometerte en mis asuntos personales?"

              "Si fuera solo una cuestión de privacidad, no lo habría sacado a colación. Pero no lo es, ¿verdad? Has estado ocultando cosas desde que nos conocimos. Fue lo mismo cuando te pregunté por los hombres con túnica que busca Eiden. Te lo pregunto porque no quiero que este secretismo tuyo acabe matándonos a todos".
          - source: scene_text_2
            paragraph: 14
            text: |-
              "No lo hará".

              "¿Cómo puedes estar tan segura?"

              Desvía la mirada por un segundo.

              "Simplemente no lo hará".

              Hace una pausa.

              "No... no pienso mantener esto en secreto para siempre. Es solo que... este no es el momento adecuado. Prometo que lo aclararé todo a su debido tiempo. Ahora, si eso es todo lo que querías discutir conmigo, volveré a dormir".

              Regresa al interior de la cueva, pero yo no la sigo. En su lugar, me tumbo apoyando la espalda contra la pared exterior de la cueva y empiezo a ordenar mis pensamientos.

              Han pasado muchas cosas desde que me uní a este torneo. La gente muere a diestra y siniestra, y los organizadores ni siquiera se molestan en darnos nuestros objetivos. Y para colmo, está ese Stillwater. ¿Qué podría pretender conseguir uniéndose a un torneo como este? ¿Cuál es su propósito?
