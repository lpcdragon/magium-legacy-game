        paragraph: 321
        text: |-
          "¿Desde cuándo aprecias tú la valentía y el heroísmo?"

          Kate, que está de pie justo a mi lado, me da un puñetazo en el hombro derecho. Su puñetazo fue lo suficientemente fuerte como para dejar un buen moretón.

          "¡Maldita sea, Kate! ¿Has oído hablar alguna vez de la moderación?"

          "¡Cállate! Te lo has buscado. Intentaba ser amable y has arruinado el momento".

          "Sí, bueno, ser amable no te pega. Ahora bien, dar puñetazos, por otro lado..."

          Rose deja escapar una risita, que llama nuestra atención.

          "Lo siento", dice ella, sonriendo. "Es solo que me han recordado a mis hermanos pequeños, que siempre se pelean así. Parecen estar muy unidos".

          Kate se sonroja. Es la primera vez que la veo sonrojarse desde que la conocí ayer. Le sienta bien.
