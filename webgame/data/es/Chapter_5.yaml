        text: |-
          Diga lo que diga Kate, no tengo forma de saber cómo reaccionará Daren si se entera de que en realidad aspiro a ganar este torneo como todo el mundo. Y además, si descubre que le he estado mintiendo todo este tiempo, solo se disgustará más. No tengo más remedio que seguir mintiéndole, en este punto.

          Me tumbo apoyando la espalda contra la pared exterior de la cueva y empiezo a ordenar mis pensamientos. Han pasado muchas cosas desde que me uní a este torneo. La gente muere a diestra y siniestra, y los organizadores ni siquiera se molestan en darnos nuestros objetivos. Y para colmo, está ese Stillwater. ¿Qué podría pretender conseguir uniéndose a un torneo como este? ¿Cuál es su propósito?
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch5_scream
  - name: ch5_scream
    routes:
      - condition: ch5_admit_lie = 0
        texts:
          - source: scene_text
            paragraph: 297
            text: |-
              Mientras estoy allí sentado pensando, de repente oigo el grito de una mujer que viene de muy lejos. Al mismo tiempo, aparece un mensaje de advertencia flotando ante mis ojos, diciéndome que no la hiera porque es una de las lugareñas. 

              Aunque está bastante lejos de aquí, a juzgar por los débiles rastros de magia que vienen de su dirección, es seguro asumir que está siendo atacada por monstruos. No parecen muy grandes, ni particularmente poderosos, así que probablemente estemos hablando de un puñado de goblins.   

              Las reglas del torneo son un poco confusas sobre qué pasaría si salváramos a uno de los lugareños del ataque de un monstruo. La regla general es no intervenir en absoluto en los asuntos de la gente de Varathia, pero no se aplica mediante un hechizo, como la regla que nos impide herirlos directamente, por ejemplo.

              Desde una perspectiva lógica, sería menos arriesgado no intervenir. No hay forma de saber con certeza si tomar una acción aquí no me haría ser expulsado del torneo. Pero entonces...

              La mujer vuelve a gritar, esta vez más fuerte, y sonando más aterrorizada.
        choices:
