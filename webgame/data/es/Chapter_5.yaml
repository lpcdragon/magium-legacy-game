        paragraph: 280
        text: |-
          "¿Tal vez sea más viejo de lo que parece?"

          Daren hace una pequeña pausa para reflexionar sobre mi pregunta.

          "Puede que hayas dado en el clavo, Barry", me dice Daren. "Cuando luché contra él, podía anticipar cada uno de mis movimientos, y ni siquiera se molestó en usar magia para evitar mis primeros golpes. A la mayoría de los guerreros curtidos en mil batallas les habría costado esquivar incluso el primer tajo de mi espada. Sin embargo, no estoy muy seguro de cómo podríamos averiguar cuál es su edad real".

          "¿Tal vez podríamos preguntárselo?"

          "¿Preguntárselo? ¿Has perdido el juicio?"

          "¿Por qué dices eso? No es que tenga ninguna razón para ocultarnos su verdadera edad. Y no parece tener problemas para alternar entre el intento de asesinato y una conversación casual".

          "A veces me pregunto qué pasa por tu cabeza, Barry..."

          "En cualquier caso, creo que deberíamos despertar a Kate. Necesita oír lo que ha pasado, y nos vendría bien otra reunión de estrategia ahora mismo".

          Los dos nos dirigimos a nuestra cueva y procedemos a despertar a Kate de su sueño.
