    texts:
      - source: scene_text
        paragraph: 313
        text: |-
          "No hay problema. Nos encanta ayudar a la gente. ¡Pero también aceptamos donaciones!"

          "¡Maldita sea, Barry!", dice Daren.

          Rose ríe entre dientes.

          "No pasa nada, no me ha ofendido el comentario de Barry. Con mucho gusto les habría recompensado por rescatarme, pero lamentablemente no traje dinero conmigo, ya que temía encontrarme con ladrones".

          "Si me permites preguntar", interrumpe Kate. "¿Qué hacías sola en medio de la naturaleza?"

          "Bueno, señorita, err..."

          "Kate", dice Kate, mientras se señala a sí misma. Luego nos señala secamente a mí y luego a Daren, dándole a Rose también nuestros nombres.
