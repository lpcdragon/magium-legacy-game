        paragraph: 303
        text: |-
          "Solo hicimos lo que cualquier otro habría hecho en nuestro lugar".

          La mujer sonríe.

          "En efecto. La mayoría de la gente habría hecho lo mismo que usted, y me habría dejado morir para no arriesgarse a ser expulsado del torneo".

          Mientras la mujer habla, siento que se me enrojecen las orejas. 

          "¡Pero finalmente decidió seguir a su amigo aquí a pesar de la regla de no interferencia del torneo, y por eso le doy las gracias! Mi nombre es Rose. ¡Encantada de conocerlos a todos!"

          "Si me permites preguntar", interrumpe Kate. "¿Qué hacías sola en medio de la naturaleza?"

