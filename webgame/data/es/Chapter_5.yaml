              "Bueno, solo te digo lo que vi. Yo tampoco pretendo entenderlo. En cualquier caso, creo que deberíamos despertar a Kate. Necesita oír lo que ha pasado, y nos vendría bien otra reunión de estrategia ahora mismo".

              Los dos nos dirigimos a nuestra cueva y procedemos a despertar a Kate de su sueño.
