  - name: ch5_ignore
    routes:
      - condition: ch5_admit_lie = 0
        texts:
          - source: scene_text
            paragraph: 300
            text: |-
              No he venido aquí para hacerme el héroe. Ganar el torneo es lo prioritario. No debo olvidar eso. Si existe la más mínima posibilidad de que salvar a esta mujer me haga ser expulsado del torneo, entonces no debo interferir.

              "¿Qué es ese ruido?", pregunta Daren al acercarse a la entrada de la cueva.

              "Una de las lugareñas está siendo atacada por un grupo de monstruos. Probablemente goblins".

              "¡Por los dioses! Entonces, ¿por qué no me llamaste en el momento en que oíste su voz?"

              "Bueno, las reglas del torneo dicen que no debemos interferir en los asuntos de la gente de Varathia".

              "¿De verdad crees que alguien nos va a pedir cuentas por salvar la vida de una de las lugareñas? ¿Qué te pasa, Barry? Esto no es propio de ti".

              Pasa a mi lado sin decir otra palabra y se dirige hacia el origen del sonido. 

              Kate, que estaba lo suficientemente cerca como para haber oído nuestra conversación, se aclara la garganta y dice:
          - source: scene_text_2
            paragraph: 17
            text: |-
              "Si te sirve de algo, creo que has tomado la decisión correcta. No hay forma de saber con certeza qué pasará si rompemos la regla de no interferencia".

              "Gracias. Pero es demasiado tarde para preocuparse por eso ahora. No podemos abandonar a Daren así. Vamos".

              Al alcanzar a Daren, nos sorprende ver que ya no hay monstruos en las cercanías.

              "Mira quién ha decidido aparecer", dice Daren.

              "¿Qué ha pasado? ¿Dónde están los goblins?", le pregunto.

              "Todos salieron huyendo asustados al verme. No eran un grupo muy valiente. Ni siquiera tuve que desenvainar mi espada".

              Miro a mi alrededor para ver si la mujer que gritaba resultó herida de alguna manera. Cuando la veo bien, me quedo brevemente atónito por lo hermosa que es.  Tiene el pelo largo y castaño rojizo, una cintura delgada y una sonrisa cálida, mientras que sus rasgos faciales son suaves y femeninos, a diferencia de los de Kate, y sus ojos castaños claros irradian amabilidad. Lleva un vestido castaño rojizo a juego con su pelo, y parece estar en la mitad de la veintena. La mujer hace ahora una elegante reverencia ante nosotros, como gesto de gratitud.

              "Muchísimas gracias a todos por su ayuda", dice. "¡No sé qué habría hecho sin ustedes!"
        choices:
          - position: 1
            text: Es a Daren a quien deberías agradecer, no a nosotros.
            effects:
              - set:
                  current_scene: ch5_humble
          - position: 2
            text: Solo hicimos lo que cualquier otro habría hecho en nuestro lugar.
            effects:
              - set:
                  current_scene: ch5_stead
