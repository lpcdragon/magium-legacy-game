  - name: ch5_threat
    routes:
      - condition: ch2_human_reason = 1
        texts:
          - source: scene_text
            paragraph: 285
            text: |-
              "Para mí suena a amenaza. Sin duda encajaría con la forma de hacer las cosas de Eiden, por lo que hemos visto hasta ahora. Nos envía a luchar contra sus enemigos, y luego se ríe de ello después".

              Kate asiente.

              "Estoy de acuerdo", dice ella. "No nos habría dejado vivos solo para enviar un mensaje a unos viejos amigos. Una amenaza velada a unos viejos enemigos, por otro lado, parece mucho más probable. No estoy segura de qué es exactamente el invierno en calma, pero estoy dispuesta a apostar que seremos atacados en el momento en que terminemos de decir las palabras".

              "Así que, o luchamos contra todo un grupo clandestino respaldado por la realeza de este continente, o luchamos contra un maníaco loco superpoderoso que puede evaporarnos en un abrir y cerrar de ojos. La buena noticia es que no hay límite de tiempo. ¡Si logramos evitar encontrarnos con esos caballeros con túnica hasta el final del torneo, podríamos estar a salvo!"

              "Ahora espera un momento", dice Daren. "No hay razón para asumir que el mensaje es una amenaza solo por la redacción de la frase. Además, ¡creo que lo que es más importante ahora mismo es encontrar una forma de vencer a Eiden, no hablar de su mensaje!"

              "¿Y cómo sugieres que hagamos eso, exactamente?", dice Kate. "Solo le llevó medio segundo ponerte a dormir, y estoy bastante segura de que tus protecciones son mejores que las mías en ese departamento. Solo eso sería suficiente para eliminarnos a todos, pero he oído que tiene todo un arsenal de otros hechizos en su bolsillo".

              "¿Entonces qué? ¿Significa eso que todos deberíamos inclinarnos ante él ahora y convertirnos en sus lacayos?"
          - source: scene_text_2
            paragraph: 7
            text: |-
              "¿Cuándo he dicho yo algo así? Lo único que digo es que no tenemos información suficiente para elaborar ninguna estrategia viable contra él en este momento. Hasta que encontremos alguna debilidad en esa magia suya, deberíamos estar agradecidos por el tiempo que Barry nos ha comprado con su trato, por mucho que dure".

              "Tal vez tengas razón. Con suerte, el tiempo que Barry nos ha comprado será suficiente para descubrir la debilidad de Eiden".

              "Kate", digo. "¿Tienes un minuto?"

              Kate me mira, confundida.

              "Por supuesto", dice ella, finalmente, y luego me sigue fuera de la cueva.

              Mientras salimos, Daren me guiña un ojo y me levanta el pulgar. Típico de Daren, malinterpretar completamente este tipo de situación. A veces me pregunto si entiende siquiera el lenguaje corporal.

              "Voy a preguntarte directamente", le digo a Kate una vez que llegamos a la entrada de la cueva. "¿Qué es el Faro de Esperanza?"
        choices:
