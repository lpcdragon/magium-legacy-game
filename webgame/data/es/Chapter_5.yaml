          - source: scene_text
            paragraph: 276
            text: |-
              "¡Barry!", me llama Daren de nuevo mientras se acerca a los árboles.

              "Estoy aquí", le respondo.

              Entra en el bosque y empieza a buscar a Dave el Degollador.

              "¿Dónde está el degollador?"

              "Si miras con atención, todavía puedes ver algunas de sus cenizas cerca de esa roca de allí".

              "¿Cenizas?... No me digas que ese dispositivo tuyo ahora te da también poderes de fuego".

              "No fui yo, fue el Stillwater. Eiden volvió y quemó a Dave hasta dejarlo hecho cenizas justo cuando estaba a punto de acabar conmigo. Dijo que no era apropiado que un cartero muriera antes de salir de la oficina de correos".

              "Espera, ¿estás diciendo que usó magia de fuego? ¿No usó magia de aire aquella vez que me inmovilizó contra el suelo? ¡Normalmente lleva toda una vida dominar incluso un solo elemento!"
