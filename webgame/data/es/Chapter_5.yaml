  - name: ch5_creator
    texts:
      - source: scene_text
        paragraph: 314
        text: |-
          "Oh, no... Mi familia está bien, gracias a los dioses. Vine aquí porque todos los enfermos son demasiado pobres para permitirse el dinero para enviar a alguien a recolectar hierbas para ellos. Y yo tampoco tenía dinero para contratar guardaespaldas que me acompañaran. No soy médico, pero me ofrezco como voluntaria para ayudar a cuidar a los enfermos tan a menudo como puedo. Con la muerte de nuestro Gran Sacerdote, el número de enfermos aumenta cada día. Él era la última persona en nuestro pueblo que sabía cómo crear comida mediante magia y, por mucho que lo intentó, no consiguió enseñar su oficio a ninguno de sus discípulos. Mucha gente está empezando a envenenarse por comer las bayas equivocadas del bosque, otros están muriendo de hambre y otros han recurrido a... a..."

          Se detiene un poco para animarse a decir las palabras que tenía en la punta de la lengua.

          "la caza de animales", termina su frase.

          "Espera, ¿entonces es verdad que en tu continente está prohibido cazar animales?", pregunta Daren, sorprendido.

          "Lo... estaba. Hubo un tiempo en que cada ciudad de Varathia tenía al menos diez personas que sabían crear comida de la nada, usando magia. Esa habilidad les fue enseñada por el Creador, y ellos la enseñaron a sus discípulos lo mejor que pudieron. Pero aquellos que podían aprender la habilidad eran individuos muy raros y talentosos. Desde la misma fundación de Varathia hace seiscientos años, todas las ciudades dependían fuertemente del Creador para encontrar a estos individuos talentosos y enseñarles este oficio. Pero entonces, el Creador simplemente desapareció hace unos cien años y el número de personas que aún conocían el oficio de fabricar comida empezó a disminuir".
      - source: scene_text_2
        paragraph: 29
        text: |-
          "A riesgo de preguntar algo obvio, ¿quién es el Creador?", pregunta Daren.

          "Oh, lo siento. Olvidé lo poca información sobre nosotros que llega a los otros continentes. El Creador fue... el fundador de nuestra civilización. Todo lo que somos hoy se lo debemos a él. Él y el espíritu protector de todos los animales, el gran Zorro Dorado, decidieron juntos hace seiscientos años poner fin a toda guerra y hambre, uniendo el reino humano y el animal, y guiándolos hacia una era de paz y prosperidad. Enseñaron tanto a humanos como a animales a crear lo que necesitaban con magia, y así eliminaron la necesidad de trabajo y conflicto. Comida, agua, calor, refugio, cada una de esas cosas podía obtenerse por medios mágicos. Por lo que he oído, debió de ser el paraíso".
    choices:
      - position: 1
        text: ¿Por qué desapareció el Creador?
        effects:
          - set:
              current_scene: ch5_disappear
      - position: 2
        text: ¿Cómo vivió el Creador tanto tiempo?
        effects:
          - set:
              current_scene: ch5_long
  - name: ch5_disappear
    texts:
      - source: scene_text
        paragraph: 315
        text: |-
          "¿Por qué desapareció el Creador?"

          "Nadie lo sabe con certeza. Hay muchos relatos sobre lo que llevó a su desaparición, pero no tenemos forma de saber si alguno de ellos es cierto. Algunos dicen que se volvió loco en las últimas décadas de su reinado y simplemente nos dejó sin mediar palabra. Otros dicen que estaba decepcionado con la humanidad y decidió abandonarnos. Otros dicen que simplemente se aburrió de nosotros y se fue a crear otra civilización en un continente diferente. La mayoría de la gente, sin embargo, piensa que murió y que los reyes de Varathia decidieron ocultarlo al pueblo para evitar el pánico. Mientras el pueblo mantenga la esperanza de que el Creador pueda volver para salvarlos a todos, aún puede haber cierta sensación de orden".

          Hace una pausa.

          "Pero debo de estar aburriéndolos con estas historias. Les agradezco de nuevo de todo corazón que me hayan rescatado allí atrás. Solo desearía que hubiera algo que pudiera ofrecerles a cambio".

          Daren sonríe.

          "Bueno, tendrás tiempo para pensar en eso de camino a casa, porque vamos contigo".

          "¡¿Qué?!", dice Kate.
    choices:
      - position: 1
        text: Esa parece una idea genial.
        effects:
          - set:
              current_scene: ch5_great
      - position: 2
        text: ¿No crees que deberías consultarnos antes de tomar una decisión así?
        effects:
          - set:
              current_scene: ch5_consult
  - name: ch5_long
    texts:
      - source: scene_text
        paragraph: 316
        text: |-
          "¿Cómo vivió el Creador tanto tiempo? Por lo que nos cuentas, ¡debió de vivir al menos unos cientos de años!"

          "Sí. Esa es una de las razones por las que cada vez hay más gente que ni siquiera cree ya en su existencia. Ya ha pasado mucho tiempo desde que desapareció, y antes tampoco se mostraba realmente ante mucha gente. Solo los miembros de las familias reales llegaban a verlo. Hay muchos que dicen que el Creador fue simplemente un invento de los reyes, y que están usando su desaparición como excusa para quedarse con el poder de crear comida para ellos mismos. En algunas de las ciudades, estos grupos de gente han empezado a rebelarse contra sus reinos y están al borde de guerras civiles". 

          Hace una pausa.

          "Pero debo de estar aburriéndolos con estas historias. Les agradezco de nuevo de todo corazón que me hayan rescatado allí atrás. Solo desearía que hubiera algo que pudiera ofrecerles a cambio".

          Daren sonríe.

          "Bueno, tendrás tiempo para pensar en eso de camino a casa, porque vamos contigo".

