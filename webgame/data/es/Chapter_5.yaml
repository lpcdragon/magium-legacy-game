  - name: ch5_reckless
    texts:
      - source: scene_text
        paragraph: 320
        text: |-
          "¿De verdad? Porque a mí me ha parecido imprudente y estúpido."

          Kate, que está de pie justo a mi lado, me da un golpe en la nuca.

          "¿A qué diablos ha venido eso?", le pregunto.

          "¿Es que no tienes nada de tacto?"

          "Tengo más que tú. Al menos yo no golpeo a la gente de repente sin ningún motivo".

          "¿Quieres otro chichón en la cabeza a juego con el que te acabo de hacer?"

          Rose deja escapar una risita, que llama nuestra atención.

          "Lo siento", dice ella, sonriendo. "Es solo que me han recordado a mis hermanos pequeños, que siempre se pelean así. Parecen estar muy unidos".
      - source: scene_text_2
        paragraph: 33
        text: |-
          Kate se sonroja. Es la primera vez que la veo sonrojarse desde que la conocí ayer. Le sienta bien.

          "Ya veo por qué", dice Daren, sonriendo. "Barry está prendado de Kate desde la primera vez que la vio".

          "¡¿Qué?!", me pregunta Kate, tomándose la broma de Daren un poco demasiado en serio.

          "Eh, vamos", dice Daren. "¡Tendrán que continuar esta conversación más tarde, en privado! Ahora que somos cuatro, tendremos que replantear nuestra estrategia de batalla. Tenemos que asegurarnos de que no le pase nada a Rose si nos encontramos con algún monstruo de camino a su ciudad natal".

          Y así, terminamos pasando el resto de la mañana discutiendo diferentes tácticas y estratagemas.
