  - name: ch5_humble
    texts:
      - source: scene_text
        paragraph: 302
        text: |-
          "Es a Daren a quien deberías agradecer, no a nosotros. Él es quien corrió a salvarte, a pesar de la regla de no interferencia del torneo de magos".

          "Soy muy consciente", dice la mujer, sonriendo educadamente. "Eso no niega, sin embargo, el hecho de que ustedes dos finalmente también siguieran a su amigo aquí, a pesar de esa regla, ¡y por eso les doy las gracias! Mi nombre es Rose. ¡Encantada de conocerlos a todos!"

          "Si me permites preguntar", interrumpe Kate. "¿Qué hacías sola en medio de la naturaleza?"

          "Bueno, señorita, err..."

          "Kate", dice Kate, mientras se señala a sí misma. Luego nos señala secamente a mí y luego a Daren, dándole a Rose también nuestros nombres.

          Rose sonríe y continúa.
      - source: scene_text_2
        paragraph: 19
        text: |-
          "Señorita Kate, estaba aquí buscando unas hierbas muy raras que solo crecen en esta zona del continente. Ha habido un brote de plaga de aceite en mi ciudad natal y, como herborista, puedo reconocer las plantas que se necesitan para la cura".

          "Lo siento, ¿qué es la plaga de aceite?"

          "Oh, no sabía que esta enfermedad no existe fuera de nuestro continente. Los médicos no están seguros de su causa, pero lo que ocurre es que el sudor de los pacientes se vuelve tan espeso como el aceite, y tienen una fiebre muy alta, con tos violenta. Algunos de nosotros tenemos una inmunidad natural, pero los que no tienen tanta suerte son puestos en cuarentena en algún lugar y abandonados allí para que mueran solos. La única cura que conocemos para esta enfermedad se extrae de las plantas muy raras que he venido a recolectar aquí".

          "¿Pero por qué eres tú la que ha venido a por las hierbas? ¿Tienes familiares infectados? ¿Por qué no contrataste al menos a unos guardaespaldas para que te acompañaran?"
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch5_creator
