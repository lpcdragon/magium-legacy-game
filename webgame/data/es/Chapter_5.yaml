  - name: ch5_great
    texts:
      - source: scene_text
        paragraph: 317
        text: |-
          "Esa parece una idea genial."

          "¿Tú también?", me pregunta Kate, decepcionada.

          "Bueno, no es que tengamos nada que hacer hasta que nos den nuestros objetivos", le digo. "Y probablemente estaremos más seguros en una de las ciudades que aquí fuera en la naturaleza, donde nos atacan cada pocas horas. ¿No dijiste tú misma que no tienes pistas específicas sobre el paradero del amigo que buscas ahora mismo?"

          "Supongo... pero--"

          "¡Entonces está decidido!", dice Daren con entusiasmo. 

          "¡No!", dice Kate. "¡No hay nada decidido! Yo nunca he dicho que esté de acuerdo con esto".

          "Por favor, escúchenme", interrumpe Rose. "Daren, realmente aprecio lo que intentas hacer, pero no quiero que te pelees con tus amigos por ello. Créeme, estaré bien. Sé que puede haber parecido que no sabía lo que hacía allí atrás, pero en realidad he recorrido estos caminos yo sola antes. He evitado a propósito todas las zonas frecuentadas por monstruos o bandidos, y he investigado mucho de antemano. La única razón por la que me encontré con esos goblins fue porque eran un grupo descarriado, alejado de cualquier otro campamento goblin. No volverá a ocurrir".

          "Cállate un segundo", dice Kate. "¿Oyen eso?"
      - source: scene_text_2
        paragraph: 30
        text: |-
          Ahora que lo menciona, oigo un débil silbido, aunque no reconozco la melodía. Se está acercando. De repente la música se detiene, justo cuando los silbadores entran en nuestro campo visual. Son tres. Encantadores de armas, por su aspecto. Parecen más limpios que el grupo de Dave el Degollador y no huelen como ellos, pero aparte de eso, no se ven muy diferentes. Probablemente nos atacarán en cuanto nos vean, como todos los demás.

          Y yo que pensaba que ya habíamos cubierto nuestro cupo de peleas inútiles por hoy. 

          "Clive, ¿ves eso?", dice uno de los hombres.

          "Por los dioses, es una banshee", dice otro.

          El tercer hombre empieza a gritar y cae de espaldas.

          "¡Monstruo! ¡Maten al monstruo!", grita uno de ellos, con puro terror en su voz.

          Kate no parece estar tomándose esto muy bien. Está mirando hacia el suelo, pero esta vez no es rabia lo que veo en sus ojos. Si tuviera que adivinar, diría que se siente miserable.

          El hombre llamado Clive corre ahora gritando hacia Kate, con la espada en la mano, listo para atravesarla. Daren prepara su propia espada pero, antes de que llegue a actuar, es Rose quien se interpone entre Kate y el mago atacante.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch5_monster
  - name: ch5_consult
    texts:
      - source: scene_text
        paragraph: 318
        text: |-
          "¿No crees que deberías consultarnos antes de tomar una decisión así?"

          "¡Vamos! ¿Qué les pasa a ustedes? Estaremos mucho más seguros dentro de un pueblo que aquí fuera en la naturaleza. ¿No sería mejor esperar en algún lugar seguro hasta que recibamos nuestros objetivos?"

          "Encontrar una ciudad es una cosa, escoltar a una lugareña hasta ella es otra. Rescatarla de los goblins puede no ser interpretado como interferir en los asuntos locales, pero convertirse en sus guardaespaldas personales roza peligrosamente el territorio de la 'interferencia externa'".

          "Solo diremos que necesitábamos un guía. Relájate, estaremos bien".

          "No, estoy de acuerdo con Barry", dice Kate. "No deberíamos perder el tiempo escoltando a lugareños. Los objetivos podrían anunciarse en cualquier segundo".

          "Por favor, escúchenme", interrumpe Rose. "Daren, realmente aprecio lo que intentas hacer, pero no quiero que te pelees con tus amigos por ello. Créeme, estaré bien. Sé que puede haber parecido que no sabía lo que hacía allí atrás, pero en realidad he recorrido estos caminos yo sola antes. He evitado a propósito todas las zonas frecuentadas por monstruos o bandidos, y he investigado mucho de antemano. La única razón por la que me encontré con esos goblins fue porque eran un grupo descarriado, alejado de cualquier otro campamento goblin. No volverá a ocurrir".

          "Cállate un segundo", dice Kate. "¿Oyen eso?"
