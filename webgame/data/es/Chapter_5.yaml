  - name: ch5_goblins3
    routes:
      - condition: ch5_goblins = 1
        texts:
          - source: scene_text
            paragraph: 309
            text: |-
              El goblin parece casi paralizado. Toma vacilante una de las bayas y se la come. Una vez que comprueba por sí mismo que no estaba envenenada, empieza a llorar. Mientras solloza, uno de sus amigos goblins viene a abrazarlo y empiezan a llorar juntos. 

              Así que esto es lo que se siente al ser un goblin. Nunca lo supe. La mujer del pelo castaño rojizo mira a los goblins y sonríe feliz. Es increíble lo feliz que puede estar por unos monstruos que estaban a punto de robarle todo hace unos minutos.

              Una vez que recupera el control de sí mismo, el líder goblin se vuelve hacia nosotros y dice:

              "Humanos, nunca olvidaré su amabilidad. Yo, Uluk Mihtun, juro que pagaré esta deuda, a ambos. Nos volveremos a ver. Hasta entonces..."

              El goblin pone su mano izquierda sobre su estómago y su mano derecha sobre su pecho. El resto de los goblins imitan sus gestos y todos dicen a la vez:

              "¡Tunak Madar!"

              Tunak Madar... Si no me equivoco, por lo que me ha enseñado el dispositivo de estadísticas, deduzco que esta es una de las formas más altas de respeto y gratitud que existen en su idioma. No tiene traducción en ningún otro idioma que se acerque siquiera a su significado.
          - source: scene_text_2
            paragraph: 24
            text: |-
              Mientras los goblins se marchan, me doy la vuelta para ver que Daren está frunciendo mucho el ceño y frotándose la frente, mientras que Kate simplemente se queda allí parada, mirándonos con la boca abierta.

              "Muy bien", dice Daren. "¿Alguien puede explicarme qué acaba de pasar?"

              La mujer ríe suavemente.

              "Lo siento", dice ella. "Me doy cuenta de que toda esta situación debe de haber parecido muy extraña si no entendían lo que decíamos. En resumen, han sido desterrados de su clan hace dos días por falta de dinero y tuvieron que recurrir al pequeño robo para no morir de hambre, ¡así que les ayudamos en lo que pudimos! Pero, ¿dónde están mis modales? Mi nombre es Rose. Muchísimas gracias a todos por su ayuda. ¡No sé qué habría hecho sin ustedes!"
