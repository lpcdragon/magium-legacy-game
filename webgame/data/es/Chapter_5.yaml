            paragraph: 295
            text: |-
              Tal vez Kate tenga razón. ¿En qué estaba pensando cuando le mentí a Daren de esa manera? Me ha demostrado nada más que honestidad hasta ahora, y yo he traicionado su confianza. Se va a molestar por esto, pero prefiero decirle la verdad ahora que esperar a que se entere por su cuenta más tarde.

              "Daren, tengo algo que decirte", digo al entrar en la cueva.

              Kate, que se disponía a volver a dormir, me observa ahora atentamente, esperando a ver si realmente pienso seguir adelante con ello.

              "Oye, Barry, realmente no deberías empezar una conversación así. Normalmente, las conversaciones que empiezan con esas palabras nunca terminan bien".

              Respiro hondo.

              "Quería decirte que te mentí ayer sobre la verdadera razón por la que estoy aquí. La verdad es que nadie me obligó a venir a este lugar. Vine aquí por mi propia voluntad. Vine porque quiero ganar este torneo. Porque ha sido mi sueño desde que era un niño convertirme en mago, y el Magium puede concederme ese deseo. Siento no haber sido honesto contigo sobre esto".
