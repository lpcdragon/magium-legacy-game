scenes:
  - name: ch5_intro
    effects:
      - set:
          successful_checks:
            - 'Punto de control alcanzado: Partida guardada.'
        condition: checkpoint_rich = 1
      - set:
          is_dead: 0
    routes:
      - condition: ch4_ending = 1
        texts:
          - source: scene_text
            paragraph: 273
            text: |-
              "¡Daren!", grito. "¿Daren, puedes oírme?"

              "¿Barry? ¡Espera ahí mismo! ¡Voy a por ti!"

              Bueno, no es que vaya a ninguna parte. Todavía me duelen las rodillas de muerte. Apenas me he movido de mi posición original para evitar más dolor. Eiden sí que me dio una buena. 

              "¡Barry! ¡¿Qué ha pasado?!", dice Daren cuando me ve.

              "Oh, no mucho. Solo un pequeño regalo de despedida de nuestro amigo común".

              "¡Eiden!", dice Daren, mientras aprieta el puño.

              Lanza un hechizo de curación sobre mí y, de repente, me veo envuelto en una cálida y reconfortante luz. El dolor me abandona por completo y consigo ponerme en pie sin dificultad. Siempre supe que existían hechizos de curación como este, pero presenciar uno de primera mano es otra cosa. La mayoría de los sanadores que he conocido en mi vida apenas podían curar hematomas leves o esguinces de tobillo.
          - source: scene_text_2
            paragraph: 3
            text: |-
              "¿Dónde está el Stillwater?"

              "Se ha ido. Acabo de verle matar a Dave el Degollador junto con toda una banda de secuaces. Resulta que puede lanzar magia de fuego, magia de combustión y teletransporte sin despeinarse. Eiden se molestó porque Dave el Degollador lo confundió conmigo y yo me aproveché de la situación".

              "¡Ja! ¡Se lo tiene merecido! Pero, ¿cómo terminé inconsciente en el suelo?"

              "¿Quieres decir que no lo recuerdas? Simplemente agitó su mano con indiferencia y te dejó dormido".

              "¿Qué?... Eso no puede estar bien. Tengo tanta protección contra los hechizos de sueño que debería ser casi inmune. ¡Al menos debería ser capaz de mantener la consciencia! ¿Y qué fue eso de que usaba magia de fuego? Estoy bastante seguro de que usó magia de aire conmigo cuando lo conocimos por primera vez. ¡Normalmente lleva toda una vida dominar incluso un solo elemento!"
        choices:
          - position: 1
            text: ¿Tal vez tenga algún artefacto que lo esté ayudando?
            effects:
              - set:
                  current_scene: ch5_artifact
                  checkpoint_rich: 0
          - position: 2
            text: ¿Tal vez sea más viejo de lo que parece?
            effects:
              - set:
                  current_scene: ch5_older
                  checkpoint_rich: 0
          - position: 3
            text: ¿Tal vez hizo un pacto con algún dios?
            effects:
              - set:
                  current_scene: ch5_pact
                  checkpoint_rich: 0
      - condition: ch4_ending = 2
        texts:
          - source: scene_text
            paragraph: 274
            text: |-
              "¡Daren!"

              No hay respuesta.

              "¡Oye, Daren!"

              Daren se despierta de repente y empieza a mirar a su alrededor, confundido.

              "¿Qué ha pasado? ¿Dónde está el Stillwater?", me pregunta.

              "Es la segunda vez que me haces exactamente las mismas preguntas. Se ha ido. Desapareció justo después de ponerte a dormir".

              "¿Ponerme a dormir?... ¡No, eso no puede ser! Tengo tanta protección contra los hechizos de sueño que debería ser casi inmune. ¡Al menos debería ser capaz de mantener la consciencia!"

              "Bueno, solo te digo lo que vi. Yo tampoco pretendo entenderlo".

              "¿Entonces les importaría decirme quién era ese Stillwater?", nos pregunta Kate. "¿Y de qué trataba ese trato del que hablaba?"

              Daren y yo empezamos a ponerla al corriente de los detalles de nuestro primer encuentro con Eiden.
          - source: scene_text_2
            paragraph: 4
            text: |-
              Después de que terminamos de hablar, Kate se toma unos momentos para reflexionar sobre nuestras palabras.

              "Entonces, déjame ver si lo he entendido bien...", dice. "Barry, cambiaste nuestras vidas por un mensaje".

              "Exacto", digo.

              "Y tenemos que entregar este mensaje a cualquier hombre con túnica que podamos encontrar que lleve un broche con la imagen de un halcón sosteniendo el sol en sus garras".

              "Sí. ¿Te dice algo esa descripción?"

              "Sí...", dice, y casi inmediatamente mira hacia el suelo.

              Está ocultando algo de nuevo. Lo sé.

              "Son un grupo clandestino", continúa. "La mayoría de las veces no se muestran realmente en público. Nadie sabe exactamente quiénes son, ni qué hacen. La mayoría de la gente ni siquiera sabe que existen. Pero hay rumores de que cuentan con el respaldo de los reyes de Varathia".

              "¿Cuentan con el respaldo de los reyes?", pregunta Daren. "¿Qué querría Eiden con esos peces gordos? Solo tienes que decirles que recuerden el invierno en calma, ¿verdad? Me pregunto qué se supone que significa eso".
        choices:
          - position: 1
            text: Suena a amenaza.
            effects:
              - set:
                  current_scene: ch5_threat
          - position: 2
            text: Suena a mensaje cifrado.
            effects:
              - set:
                  current_scene: ch5_coded
