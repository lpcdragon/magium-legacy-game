  - name: b2_ch02a_thanks
    texts:
      - source: scene_text
        paragraph: 25
        text: |-
          "Gracias por hacérmelo saber," digo.

          "Bueno, eso es todo lo que quería decir por esta noche," dice Wilhelm. "Deberíamos ir ambos a dormir. Escuché que el período de recreación empieza temprano mañana."

          "Sí, yo también escuché eso," digo. "¡Buenas noches!"

          "¡Igualmente!" dice Wilhelm, mientras se dirige hacia su celda.

          Después de que Wilhelm cierra su puerta, la chica del cabello plateado me observa durante unos segundos más, y luego también entra a su habitación, cerrando la puerta detrás de ella. Decido que no tiene sentido quedarme merodeando por más tiempo, así que me dirijo a mi habitación también. Cuando entro a mi celda, veo que el único mueble disponible para mí es una cama hecha enteramente de piedra. Cierro la puerta con la llave que me dio el trabajador del escritorio, tiro mi mochila al suelo, y luego voy a sentarme en la cama.

          La única fuente de luz en la habitación parece venir de una ventana muy pequeña encima de mí, que me da una vista directa hacia el pasillo fuera del área recreativa. No parece haber movimiento en los túneles fuera de mi celda. Los guardias deben estar durmiendo o patrullando un pasillo diferente. Saco un suéter de mi mochila y lo uso como almohada improvisada para poner en mi fría cama de piedra. Tan pronto como coloco mi cabeza sobre él, me quedo dormido, y me despierto unas siete horas después, al sonido de la voz de un guardia, que viene de fuera de mi celda.

          "Levántate," dice el guardia. "Es hora de recreación. Ve a recrearte. Vamos, sal de aquí."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch02a_recreation
