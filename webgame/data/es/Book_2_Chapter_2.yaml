              El pico de la criatura atraviesa mi carne como si fuera papel, y siento un dolor intenso mientras el pájaro empieza a alimentarse de mí mientras todavía respiro. Salto hacia atrás, abandonando mi daga, pero el pájaro rápidamente balancea su garra hacia mí, y esta vez me remata de una vez por todas.
