            paragraph: 17
            text: |-
              Uso mi mano izquierda para desviar su puño, y luego rápidamente le doy un puñetazo en el estómago, antes de que tenga la oportunidad de lanzar un segundo ataque. La fuerza de mi golpe le quitó completamente el aliento al hombre y lo envió de rodillas al suelo. Después de unos diez segundos de mirar al vacío y jadear por aire, el hombre corpulento finalmente se recupera y se pone de pie. Durante algunos segundos más, el hombre simplemente se queda ahí mirándome, con puro asombro, sin decir nada.

              "¿Y bien?" digo. "¿No vas a atacarme de nuevo?"

              "Quizás estaba equivocado sobre ti, stillwater," dice el hombre corpulento, en un tono que sugiere que todavía está tratando de superar el shock de lo que acababa de presenciar.

