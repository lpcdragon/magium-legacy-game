    routes:
      - condition: b2_ch2_cell = 1
        texts:
          - source: scene_text
            paragraph: 12
            text: |-
              "Supongo que elegiré la celda número tres, entonces," digo.

              "Muy bien," dice el trabajador del escritorio. "La celda número tres está ubicada en el lado izquierdo del área recreativa. Su número está escrito en la puerta."

              Se detiene frente a una puerta y saca una llave de su bolsillo.

              "Esta es la llave de su celda," dice, mientras me entrega la llave. "Se le recomienda dejar sus pertenencias dentro de su celda y cerrar la puerta con llave cuando esté fuera. Puede elegir pasar la mayor parte de su tiempo encerrado dentro de su celda individual si lo desea, pero se le requerirá pasar al menos dos horas al día en el área recreativa durante el período recreativo, para aprender a llevarse bien con sus nuevos compañeros de equipo."

              El trabajador del escritorio luego saca otra llave de su bolsillo y la usa para abrir la puerta frente a él.

              "Esta puerta lo llevará al área recreativa de su división," dice. "Le recomiendo que vaya directamente a dormir, porque su próximo período recreativo está programado para mañana por la mañana."

              Le asiento y luego paso por la puerta abierta.

              "Adiós," dice el trabajador del escritorio, mientras cierra la puerta detrás de mí.
          - source: scene_text_2
            paragraph: 7
            text: |-
              La habitación en la que me encuentro ahora solo está iluminada por unas pocas velas. El área recreativa parece estar vacía, excepto por un hombre particularmente corpulento, que lleva una armadura de cuero, y que ahora se acerca a mí con paso firme.

              "Te estaba esperando," dice el hombre, en un tono amenazante. "Escuché que te traerían esta noche."

              "¿Te conozco?" le pregunto, confundido.

              "No, no veo por qué me conocerías," dice el hombre corpulento, mientras se detiene a unos pasos frente a mí. "Yo tampoco sé quién eres."

              "Entonces, ¿por qué me estabas esperando?" digo.

              "Porque escuché a los guardias hablando," dice el hombre. "Estaban hablando de un grupo de magos que mató al conde de Ollendor, y los escuché decir que un miembro de ese grupo sería enviado a nuestra división esta noche. Debo admitir que no esperaba a un stillwater."

              Permanezco en silencio. No tendría sentido corregirlo. Prefiero que todos piensen que soy un stillwater todopoderoso a revelar el hecho de que no soy un mago en absoluto.

              "Sin embargo, no importa," continúa el hombre corpulento. "Podrías ser uno de los cuatro sabios, para lo mucho que te servirá. La magia no está permitida aquí. Bien podría aplastar tu insignificante cabeza con mis propias manos y no podrías hacer nada al respecto."

              "Y, ¿por qué querrías hacer eso?" le pregunto. "¿No se supone que somos parte del mismo equipo?"
