  - name: b2_ch02a_directly
    texts:
      - source: scene_text
        paragraph: 85
        text: |-
          En realidad, pensándolo mejor, tal vez es mejor no arriesgarse.

          Reprimo mi impulso de montar al grifo y lo apuñalo en la garganta en cuanto baja la cabeza para comer de nuevo. Apunté a sus cuerdas vocales para asegurarme de que no gritara y alertara a los demás, pero no logré pasar completamente desapercibido.

          Un grifo que estaba comiendo cerca vio lo que le pasó a su compañero y ahora avanza lentamente hacia mí. Espero a que se acerque más, pero no le doy la oportunidad de atacar, y rápidamente lo apuñalo en el pecho con mi daga encantada. La bestia de repente deja de moverse y cae lentamente hacia el suelo, con una mirada vacía en su rostro.

          Una vez más, la información de mi cuaderno fue precisa. Si no hubiera leído esos diagramas detallados que explican la anatomía de los grifos ayer, nunca habría podido localizar la ubicación del corazón de este con tanta precisión. Ahora a encargarse de los otros dos.

          Los dos grifos restantes no parecieron prestar mucha atención a lo que les pasó a sus compañeros, y están demasiado ocupados disfrutando de sus comidas como para verme acercarme lentamente. Apuñalo al primero en la parte trasera del cuello mientras todavía estaba comiendo. El segundo ve lo que pasó e intenta ponerse de pie, pero reacciono rápido y lo apuñalo en el corazón, matándolo al instante.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch02a_acrobatic
  - name: b2_ch02a_acrobatic
    texts:
      - source: scene_text
        paragraph: 86
        text: |-
          Leila todavía estaba luchando cuando terminé con los grifos, pero estaba a punto de acabar. Las arpías estaban todas muertas, y solo quedaban dos lobos terribles y un tigre dientes de sable en pie.

          Mientras me acerco a ella, Leila hace una impresionante demostración de destreza acrobática, dando una voltereta lateral sobre uno de los lobos y aterrizando con los pies en la cabeza del otro lobo, aplastándola contra el suelo. Luego toma sus dos dagas y las lanza a las cabezas del lobo y el tigre restantes, enviando sus cuerpos sin vida rodando al suelo de la caverna.

          "Me encargué de los grifos y las gárgolas," le digo a Leila mientras ella recupera sus dos dagas de los cuerpos del lobo y el tigre. "Quedan algunas ratas, pero no son exactamente una amenaza. Creo que hemos terminado aquí."

          "Todavía no," escribe Leila. "No hemos terminado hasta que averigüemos quién abrió las puertas de las celdas."

          "Bueno, si se estaban escondiendo en esta habitación, ya los habríamos visto," digo. "Y solo había un camino para llegar aquí desde el lago. El único lugar donde podrían estar escondidos es más allá de este túnel."

          "Tienes razón," escribe Leila. "Vámonos."
      - source: scene_text_2
        paragraph: 45
        text: |-
          Nos dirigimos al final del túnel, y ambos preparamos nuestras dagas mientras avanzamos hacia la siguiente área de las cavernas. Al entrar ahora en un túnel mucho más estrecho, no podemos evitar notar que hay dos sillas de madera cerca de la entrada que parecen haber sido volcadas con prisa, y que hay un cuenco de estofado fresco tirado en el suelo, sin tocar.

          "¿Crees que los tipos que estaban sentados en esas sillas son los que abrieron las puertas de las celdas?" le pregunto a Leila.

          "Es una posibilidad," escribe Leila. "De cualquier manera, deberíamos esperar una emboscada en cuanto salgamos de este túnel. ¡Prepárate!"
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch02a_trolls
  - name: b2_ch02a_leave
    texts:
      - source: scene_text
        paragraph: 87
        text: |-
          "Olvídate de las criaturas," digo. "Encontrar una salida de aquí es mucho más importante."

          "De acuerdo," escribe Leila mientras suelta la piedra de su mano. "Vámonos, entonces."

          Nos dirigimos al final del túnel, y ambos preparamos nuestras dagas mientras avanzamos hacia la siguiente área de las cavernas. Al entrar ahora en un túnel mucho más estrecho, no podemos evitar notar que hay dos sillas de madera cerca de la entrada que parecen haber sido volcadas con prisa, y que hay un cuenco de estofado fresco tirado en el suelo, sin tocar.

          "Parece que ya nos han detectado," digo.

          "Sí," escribe Leila. "Probablemente están esperando para emboscarnos al final de este túnel. ¡Prepárate!"
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch02a_trolls
  - name: b2_ch02a_trolls
    texts:
      - source: scene_text
        paragraph: 88
        text: |-
          Justo como Leila anticipó, en el momento en que salimos del túnel, fuimos recibidos por seis lanzas afiladas apuntando en nuestra dirección. Las lanzas no estaban siendo empuñadas por humanos, sino por monstruos horrendos que tenían el tamaño de humanos, solo que con piel gris, narices largas y puntiagudas, grandes colmillos y la apariencia de salvajes. Los monstruos que nos enfrentaban eran troles.

          Los troles no son tan listos como los goblins, pero definitivamente son más listos que los ogros, y lo que es particularmente peligroso sobre ellos es el hecho de que tienen poderes regenerativos increíbles. A menos que les cortes la cabeza limpiamente o uses fuego para matarlos, pueden incluso regenerar una extremidad si les das suficiente tiempo. Estos no son el tipo de enemigos que esperaba encontrar aquí.

          "¡Tirad vuestras armas!" dice uno de los troles en la Lengua Común, con lo que es probablemente el acento más destrozado que he escuchado en mi vida.

          Leila y yo intercambiamos una mirada, pero nos aferramos a nuestras armas, mientras los troles parecen estar cada vez más impacientes.
      - source: scene_text_2
        paragraph: 46
        text: |-
          "¡Tirad vuestras armas ahora, o seréis ejecutados en el acto!" dice el trol.

          Antes de que tengamos la oportunidad de responder a los troles, de repente escucho la voz de Flower viniendo de detrás de los monstruos.

          "De alguna manera, tenía el presentimiento de que tú serías la fuente de toda esta conmoción," dice la voz.

          "¿Flower?" pregunto.

          En cuanto dejo de hablar, un látigo de agua sale de la nada y decapita a los seis troles de un solo golpe. Después de que los cuerpos de los troles caen al suelo, le echo un buen vistazo a Flower, y veo que sus ojos son de un azul brillante.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch02a_ending
  - name: b2_ch02a_ending
    texts:
      - source: scene_text
        paragraph: 89
        text: |-
          "Flower está dormida," dice Illuna.

          Le echa un rápido vistazo a Leila, antes de volver la mirada a mí.

          "Veo que has hecho una nueva amiga," dice Illuna.

          "Sí," digo. "La conocí en las celdas de detención debajo de las arenas. Es una compañera de mi división. También compite aquí como gladiador."

          "Mi nombre es Leila," escribe Leila mientras extiende su mano hacia Illuna. "¡Encantada de conocerte!"

          "Encantada," dice Illuna, en su habitual tono desinteresado, sin mostrar ninguna sorpresa ante la peculiar forma de hablar de la chica.

          Luego se da la vuelta, dejando a Leila con la mano extendida en el aire, mientras se dirige de vuelta por donde vino.

          "¿Qué están esperando?" dice Illuna cuando ve que no nos movemos. "Síganme."

          "Espera, ¿a dónde vamos?" le pregunto.

          "Hay un 'amigo' mío que me gustaría que conocieras," dice Illuna. "Creo que encontrarás que su propósito al venir aquí es bastante similar al tuyo."

          "¿Qué amigo?" digo. "¿Y qué quieres decir con 'similar'? No lo entiendo. ¿Qué viniste a hacer aquí?"

          "Vaya, Barry, pensé que eso ya habría sido obvio a estas alturas," dice Illuna. "Vinimos a sabotear la arena."
    choices:
      - position: 1
        text: Siguiente capítulo
        effects:
          - set:
              next_chapter_crash: 1
              current_scene: b2_ch03a_intro
              chapter_save: 1
              checkpoint_rich: 1
              storyboard_controls: Jump to frame "Save load game"
