  - name: b2_ch02a_hiding
    texts:
      - source: scene_text
        paragraph: 65
        text: |-
          "La persona que salvé es a quien he estado llamando padre durante los últimos diez años," escribe Leila. "Él es quien me rescató del Faro hace tantos años, cuando estaba a punto de perder toda esperanza."

          "¿Es por eso que los dos se convirtieron en parias?" le pregunto.

          Leila asiente.

          "Mi padre había sido uno de los cuidadores del Faro," escribe Leila. "Cuando ya no pudo soportar vernos sufrir más, decidió ayudarnos a escapar, aunque sabía que esto significaría que sería marcado como un paria por el resto de su vida."

          "¿Hubo otros que escaparon contigo?" le pregunto.

          Leila niega con la cabeza.

          "Mi padre trató de convencer a otros niños de que lo siguieran, pero tenían demasiado miedo para confiar en él," escribe Leila. "Debieron pensar que estaba tratando de engañarlos. No tuvo tiempo de hablar con todos, porque uno de los huérfanos lo delató ante los otros lessathi y se vio obligado a huir. Hizo un último intento de salvar a los huérfanos, abriendo sus celdas antes de abandonar las instalaciones, pero al final, yo fui la única que lo siguió."

          "¿No intentaron capturarlos después?" digo.
      - source: scene_text_2
        paragraph: 37
        text: |-
          "Sí," escribe Leila. "Por eso nos vimos obligados a vivir los siguientes años de nuestras vidas escondiéndonos en los bosques de Varathia. Al principio, cambiábamos de ubicación cada pocos días, para asegurarnos de que no siguieran nuestro rastro. Pero, después de unos meses, mi padre finalmente logró obtener todas las piezas que necesitaba para hacer un dispositivo de sugestión. Los hechizos de sugestión son hechizos que pueden implantar ciertos pensamientos en las mentes de las personas y hacerles creer que esos pensamientos son en realidad propios. El dispositivo que mi padre hizo podía lanzar un hechizo que hacía que la gente evitara un área, porque cada vez que se acercaban, tenían un impulso repentino de rodearla."

          "¡Oh, conozco ese hechizo!" digo. "Tengo un amigo que lo usa todo el tiempo."

          "Este hechizo nos permitió finalmente establecernos en un lugar," escribe Leila. "Construimos nuestra propia cabaña de madera en medio del bosque, cerca de un río, e incluso cultivamos un jardín. Algunos de los animales parecían ser inmunes al hechizo de sugestión, pero no parecían importarles nuestra presencia. Incluso nos traían comida de vez en cuando."

          "Entonces, ¿cómo fue capturado tu padre?" pregunto. "¿Tu hechizo de sugestión falló?"
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch02a_meridith
  - name: b2_ch02a_meridith
    texts:
      - source: scene_text
        paragraph: 66
        text: |-
          "No," escribe Leila. "Nos fuimos del bosque, eventualmente. Escuchamos que el liderazgo de los lessathi había cambiado mientras estábamos fuera, y que su nueva líder, Meridith, había prohibido las cacerías de lessathi parias. Mi padre insistió en que nos mudáramos a una ciudad, porque así tendría acceso más fácil a las piezas que necesitaba para trabajar en sus dispositivos. En ese momento, no entendía por qué querría arriesgar su seguridad solo para trabajar en algunos dispositivos. Solo entendí su verdadero propósito unos años después, cuando me regaló mi potenciador de estadísticas en mi cumpleaños número 16. En aquel entonces, solo podía escribir unas pocas palabras, pero lo fue perfeccionando con los años, y eventualmente llegó a un punto en el que podía poner casi todos mis pensamientos en palabras usando mi dispositivo."

          "Oh, no," digo. "¡Acabo de recordar algo!"

          "¿Qué?" escribe Leila.

          "¡El dispositivo!" digo mientras rápidamente saco el potenciador de estadísticas de mi bolsillo. "¡Me olvidé completamente del dispositivo de estadísticas!"

          Empiezo a sacudir el potenciador de estadísticas para asegurarme de que no tenga agua dentro, y luego pruebo todos los botones uno por uno, sin fijar ninguna estadística, para ver si todo sigue funcionando correctamente. Cuando Leila entiende lo que estoy haciendo, empieza a reírse en silencio.

          "Se necesita más que un poco de agua para que estos dispositivos dejen de funcionar," escribe Leila. "¡No te preocupes, tu potenciador de estadísticas está bien!"
      - source: scene_text_2
        paragraph: 38
        text: |-
          "Lo siento," digo después de asegurarme de que el dispositivo de estadísticas todavía funciona, "no debí haberte interrumpido. Estabas a punto de contarme cómo fue capturado tu padre."

          "Sí," escribe Leila. "Verás, el asunto es que, aunque las cacerías de parias estaban prohibidas, eso no significaba que los viejos rencores se hubieran olvidado. Los lessathi que trabajaron con mi padre en el Faro habían querido castigarlo durante mucho tiempo, pero no podían hacerlo abiertamente. Así que lo que hicieron, finalmente, fue falsificar algunos documentos que decían que mi padre tenía una enorme deuda con el dueño de nuestra casa. Pusieron al dueño de su lado, y él mintió diciendo que nunca habíamos pagado nuestro alquiler desde que nos mudamos a su casa. No teníamos ningún testigo a nuestro favor, mientras que los lessathi tenían todos los testigos y los documentos falsos que necesitaban para probar la culpabilidad de mi padre. Dado que no podía pagar su deuda, mi padre fue vendido como esclavo a uno de los nobles de Thilias. Yo escapé antes de que pudieran venderme a mí también, y he estado viviendo en las afueras de la ciudad durante meses, tratando de encontrar una forma de liberarlo, pero no fue hasta el comienzo del torneo que tuve la oportunidad de hacerlo realmente."

          Cuando Leila deja de hablar, de repente me doy cuenta de que le he estado haciendo todas estas preguntas, pero nunca me molesté en decirle que actualmente estoy viajando con una de sus viejas compañeras del Faro. ¿Debería decírselo, sin embargo? Kate nunca me dijo nada sobre Leila antes. Solo ha mencionado a Diane. ¿Fue eso porque pensó que Leila estaba muerta, o porque la consideraba una enemiga por ser lessathi? No estoy seguro de si querría darle esperanzas a esta chica, en caso de que Kate nunca quiera verla.
