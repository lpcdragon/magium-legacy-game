  - name: b2_ch02a_space
    routes:
      - condition: agility >= 3
        texts:
          - source: scene_text
            paragraph: 79
            text: |-
              Decido que es demasiado arriesgado permitirme quedar acorralado dentro de una habitación, así que me preparo para enfrentar a todas las bestias al mismo tiempo.

              Mi velocidad me permite moverme rápidamente dentro y fuera del combate, así que aprovecho esto para lanzarme repetidamente de un lado a otro entre los grifos, cortándolos con mi daga cada vez que tengo la oportunidad. Las criaturas están actuando confusas y siguen lanzando sus picos hacia adelante, como si esperaran apuñalarme con ellos por casualidad cuando me lanzo hacia ellos. Uno de ellos corre hacia mí en un intento de abrumar mis defensas, pero distanciarse de sus aliados fue un error fatal. Ahora que ya no tengo miedo de ser atacado por los otros, me lanzo al costado de la criatura mientras se acerca a mí y la apuñalo repetidamente en el costado del pecho. El grifo ya no tiene fuerza para contraatacar y cae al suelo, desangrándose lentamente hasta morir.

              Dos de los otros grifos se dirigen ahora hacia mí, tratando de agarrarme desprevenido. Cubro mi daga con la sangre de su compañero moribundo y me lanzo hacia ellos. Antes de alcanzarlos, lanzo mi daga hacia el de la izquierda, enviando la sangre de la hoja volando a los ojos de la criatura, cegándola por unos segundos. Uso la apertura que he creado para encargarme del grifo de la derecha. Para cuando el otro grifo recupera la vista, mi daga encuentra su camino a la parte trasera de su cabeza, matándolo al instante. El último de los grifos parece un poco indeciso ahora, y parece que no puede decidir si quiere retirarse o no. No le doy tiempo de alcanzar una decisión, y me lanzo directo hacia la criatura, acabando con su vida de un solo golpe certero de mi daga.
        effects:
          - set:
              successful_checks:
                - '[ Comprobación de velocidad exitosa - nivel 3 ]'
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch02a_acrobatic
                condition: is_dead = 0
      - condition: agility < 3 AND strength >= 3
        texts:
          - source: scene_text
            paragraph: 80
            text: |-
              Decido que es demasiado arriesgado permitirme quedar acorralado dentro de una habitación, así que me preparo para enfrentar a todas las bestias al mismo tiempo.

              Tengo bastantes puntos en mi estadística de fuerza, así que probablemente debería encontrar una forma de aprovecharlos al máximo.

              Miro los barrotes de hierro de la puerta de la celda de las gárgolas y noto que una de las barras de hierro parece suelta. Me toma unos segundos, pero logro sacarla con éxito y la agarro con ambas manos para ver qué tan bien podría funcionar como arma improvisada. Después de balancearla un par de veces, concluyo que la barra de hierro será más que suficiente para mis necesidades y propósitos. Con su longitud de más de dos metros y medio, debería poder mantener fácilmente a los grifos a distancia mientras los golpeo repetidamente y los estrello contra las paredes.

              Inicio la pelea golpeando a uno de los grifos en la cabeza con mucha fuerza con la barra de hierro. El golpe envió a la bestia estrellándose contra el suelo, e hizo que los tres grifos restantes aceleraran el paso mientras siguen avanzando hacia mí con una mirada amenazante en sus ojos. No espero a que se acerquen más y balanceo la barra de hierro hacia el grifo que está más cerca de mí, enviándolo de cabeza contra una pared. Luego uso mi arma improvisada para golpear las patas delanteras de los dos grifos restantes en un solo movimiento. Cuando caen al suelo, los empalo uno por uno con mi barra de hierro, y luego me aseguro de que todos los grifos estén muertos, antes de dirigirme hacia Leila.
        effects:
          - set:
              failed_checks:
                - '[ Comprobación de velocidad fallida - nivel 3 ]'
              successful_checks:
                - '[ Comprobación de fuerza exitosa - nivel 3 ]'
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch02a_acrobatic
                condition: is_dead = 0
      - condition: agility < 3 AND strength < 3
        texts:
          - source: scene_text
            paragraph: 81
            text: No espero a que hagan el primer movimiento, y me lanzo hacia el grifo que está más cerca de mí, apuñalándolo en el cuello mientras no estaba prestando atención. Los otros tres grifos empiezan a batir sus alas y a hacer ruidos amenazantes, mientras avanzan lentamente hacia mí. Uno de ellos se lanza hacia mí con su pico, pero logro hacerme a un lado y apuñalarlo en el ojo. Intento retroceder para posicionarme mejor, pero uno de los otros grifos predice mis movimientos y me golpea por detrás con una de sus garras delanteras. Antes de que pudiera recuperarme del dolor, el grifo me apuñaló en el pecho con su pico, matándome al instante.
