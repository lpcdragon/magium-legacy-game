              Intento esquivar su golpe, pero no soy lo suficientemente rápido, y su puñetazo me envía al suelo. Puedo sentir la habitación girando conmigo durante unos segundos, y cuando finalmente logro levantarme, veo que ahora hay otro hombre frente a mí que está tirando de mi atacante por detrás, para evitar que me golpee de nuevo.

              "Cálmate, Bruce," dice el segundo hombre. "Sabes que no podemos permitirnos perder hombres antes del evento de la arena."

              "Suéltame, maldito seas," dice Bruce, mientras logra soltarse del agarre del otro hombre.

              Luego me mira, con disgusto.
