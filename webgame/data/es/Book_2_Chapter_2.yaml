  - name: b2_ch02a_griffins
    texts:
      - source: scene_text
        paragraph: 75
        text: |-
          Ahora que las gárgolas están muertas, mi siguiente prioridad deberían ser los grifos. Leila ya parece tener las manos llenas luchando contra los tigres dientes de sable y los lobos terribles a la vez, así que no puedo hacer que luche contra los grifos también. Dicho esto, no creo que sea buena idea que yo luche contra todos a la vez tampoco. Al menos debería encontrar una forma de distraerlos primero. Es bueno que haya estado leyendo mi cuaderno todo el día ayer. Creo que puedo saber el truco exacto para captar la atención de los grifos. Estas criaturas pueden parecer feroces, pero su comportamiento es el de un ave de presa. Y estoy dispuesto a apostar que los han dejado al borde de la inanición, solo para que sean más agresivos cuando comience la arena. Mientras pueda hacer que esas ratas gigantes vengan hacia aquí, los grifos no podrán resistir la tentación, y sus instintos naturales seguramente se activarán.

          Me tumbo en el suelo de espaldas a las ratas, para engañarlas haciéndoles creer que estoy muerto o gravemente herido por la batalla contra las gárgolas. ¡Está funcionando! Algunas de ellas vienen hacia mí. Las otras también me han notado y se apresuran para adelantarse a las ratas que ya se están moviendo hacia mí. Necesito mantener la calma. No debo asustarlas. Solo un poco más cerca. Solo un poco más.

          Los grifos no están reaccionando. ¿Quizás debería cortar a una de las ratas con mi daga, para que los grifos puedan oler la sangre?
    choices:
      - position: 1
        text: Cortar a una de las ratas con mi daga cuando se acerque.
        effects:
          - set:
              current_scene: b2_ch02a_slice
      - position: 2
        text: Cuando las ratas se acerquen, levantarme lentamente para no ahuyentarlas.
        effects:
          - set:
              current_scene: b2_ch02a_slowly
  - name: b2_ch02a_slice
    texts:
      - source: scene_text
        paragraph: 76
        text: |-
          Cuando la primera rata me alcanza, agarro mi daga firmemente en mi mano derecha y la uso para apuñalar a la criatura en el pecho. La rata empieza a chillar de dolor mientras la sangre sale de su pecho, y todas las ratas que se dirigían hacia mí antes ahora se dispersan de miedo.

          Mientras la rata que apuñalé muere, los grifos finalmente empiezan a prestarme atención y todos se dirigen hacia mí. Esto es exactamente lo que estaba tratando de evitar. Pero supongo que es demasiado tarde para quejarse ahora. Solo tendré que arreglármelas con lo que tengo.

          Agarro a la rata muerta por la cola y la lanzo lejos, en un intento de distraerlos. Los grifos no mueven la cabeza en absoluto e ignoran completamente a la rata muerta mientras siguen avanzando hacia mí. No sé por qué pensé que eso funcionaría. Los grifos no son carroñeros. Por supuesto que elegirán a la presa viva en lugar de la muerta, si se les da a elegir. Supongo que tengo que luchar contra todos a la vez, después de todo.

          ¿O no? Mirando la puerta de la celda de las gárgolas, me doy cuenta de que no es lo suficientemente ancha como para permitir el paso a más de uno de los grifos a la vez. Tal vez podría entrar en la celda y apostarme frente a la puerta, obligando a los grifos a atacarme uno por uno. Por supuesto, esto también significa que tendré que mantener mi posición y no retroceder ni un segundo, porque si logran pasar por esa puerta, me tendrán acorralado.
    choices:
      - position: 1
        text: Atraer a los grifos dentro de la celda de las gárgolas y contenerlos en la puerta.
        effects:
          - set:
              current_scene: b2_ch02a_lure
      - position: 2
        text: Luchar contra ellos en el túnel, donde hay más espacio para moverse.
        effects:
          - set:
              current_scene: b2_ch02a_space
  - name: b2_ch02a_lure
    routes:
      - condition: toughness >= 3
        texts:
          - source: scene_text
            paragraph: 77
            text: |-
              Me retiro dentro de la celda de las gárgolas y me aposto frente a la puerta, con mi daga lista. Como esperaba, los grifos me siguen, y el primero en entrar por la puerta bloquea el paso a todos los demás. Me lanzo a su pecho con mi daga, pero la bestia bloquea mi golpe con una de sus garras delanteras. Mientras lucho por sacar el cuchillo de su garra, el grifo baja su pico sobre mí, apuntando a mi pecho.

              El pico de la criatura se hunde en mi piel, pero no pasa del músculo. Todavía duele, pero al menos no estoy en peligro mortal. Soporto el dolor y logro sacar la daga de la garra de la bestia. Mientras está ocupada tratando de desgarrarme con su pico, aprovecho la oportunidad y la apuñalo en el ojo. El grifo se echa hacia atrás por el dolor con un fuerte grito, pero no le doy la oportunidad de retirarse y lo remato con un corte certero en la garganta.

              La criatura cae al suelo, bloqueando la entrada a la celda con su cadáver. Esto, sin embargo, no detiene a los otros grifos, que ahora parecen más decididos que nunca a entrar en la celda, probablemente debido al olor de sangre que sale de la herida en mi pecho. Uno de los grifos trepa torpemente sobre el cuerpo de su compañero muerto e intenta atacarme, pero su equilibrio estaba comprometido y pude esquivar fácilmente a la bestia, asestándole un golpe letal en el corazón. Los dos grifos restantes finalmente empiezan a tener algunas dudas, después de ver a su segundo compañero ser eliminado tan fácilmente. Uno de los grifos decide que no valgo el riesgo y se va a probar suerte con las ratas gigantes que corren por el túnel.
          - source: scene_text_2
            paragraph: 42
            text: No espero a que el otro grifo haga su movimiento, y me lanzo hacia él, clavándole mi daga en el pecho antes de que tenga tiempo de reaccionar. Cuando la bestia cae al suelo, rápidamente me dirijo hacia el último de los grifos, que ahora tiene la espalda vuelta hacia mí. Aprovecho esto y le corto ambas patas traseras, para limitar su movilidad. Cuando la criatura cae al suelo, no pierdo el tiempo y asesto el golpe final en la parte trasera de su cuello.
        effects:
          - set:
              successful_checks:
                - '[ Comprobación de resistencia exitosa - nivel 3 ]'
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch02a_acrobatic
                condition: is_dead = 0
