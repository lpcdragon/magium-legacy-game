        texts:
          - source: scene_text
            paragraph: 34
            text: |-
              "Está bien, vamos," digo.

              Leila asiente y abre la puerta de su celda. Mientras ambos entramos a su habitación, noto el hecho de que Wilhelm nos estaba observando atentamente, y había un poco de decepción en su rostro cuando vio que acepté la petición de la chica tan fácilmente.

              Es solo después de que Leila cierra la puerta con llave que de repente empiezo a sentir una sensación de peligro, y salto hacia atrás alejándome de ella, observándola con cuidado.

              "¿Qué estás haciendo?" escribe Leila, mirándome confundida.

              "Estoy intentando determinar si esto es una trampa o no," le digo.

              "¿Una trampa?" escribe Leila, con una expresión algo conmocionada en el rostro. "¿Con qué propósito? ¿No sabes que matar o herir gravemente a un miembro de tu propia división va contra las reglas?"

              "No realmente," le digo. "Nadie se molestó en decirme las reglas de la arena antes de venir aquí."

              "¡Pero es una de las reglas estándar de todas las arenas de Varathia!" escribe Leila.

              "No soy de por aquí, ¿recuerdas?" digo.

              Leila suspira y va a sentarse en su cama.

              "En ese caso," escribe Leila, "más vale que también tengas cuidado de no dañar a los organizadores ni a ninguno de los espectadores. Eso también va contra las reglas."
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch02a_outcasts
      - condition: b2_ch2_lessathi = 1
        texts:
          - source: scene_text
            paragraph: 35
            text: |-
              "Lo siento, pero si quieres preguntarme algo, vas a tener que hacerlo aquí," digo.

              No hay reacción de Leila después de escuchar mis palabras, pero tampoco hay texto durante varios segundos.

              "Muy bien," dice la escritura, después de un rato. "Entonces te haré la pregunta aquí."

              Hay otra breve pausa antes de que aparezca el siguiente texto.

              "En realidad no eres un stillwater, ¿verdad, Barry?" dice la escritura.

              Su nueva escritura de repente me ha hecho consciente de mi entorno. Echo un vistazo rápido para ver si alguien está realmente lo suficientemente cerca como para leer lo que Leila me está escribiendo, y noto que Wilhelm se ha acercado un poco más a nosotros desde que comencé a hablar con la chica, y ahora parece estar estudiándome de cerca.

              "Por supuesto que soy un stillwater," le digo a Leila. "¿Qué te haría pensar lo contrario?"

              "El hecho de que eres un lessathi," escribe Leila.

              "¡Está bien, lo entiendo!" le digo a Leila. "Iremos dentro de tu celda."

              Leila sonríe y abre la puerta de su habitación. Mientras ambos entramos, Wilhelm me observa atentamente, con una leve sonrisa burlona en el rostro.

              "Realmente no te gusta aceptar un no como respuesta, ¿verdad?" le pregunto a Leila, mientras cierra la puerta con llave.
          - source: scene_text_2
            paragraph: 20
            text: |-
              "Lo siento," escribe. "Pero tú empezaste. ¿Por qué no querías venir conmigo?"

              "¡Porque apenas te conozco!" digo. "¿Cómo iba a saber que no me estabas atrayendo a una trampa o algo así? De hecho, todavía no estoy completamente seguro de que esto no sea una trampa."

              Leila me mira, un poco conmocionada.

              "¿Una trampa?" escribe Leila. "¿Qué podría yo posiblemente ganar haciendo algo así? ¿No sabes que matar o herir gravemente a un miembro de tu propia división va contra las reglas?"

