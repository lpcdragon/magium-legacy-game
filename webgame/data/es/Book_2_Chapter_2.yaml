            paragraph: 47
            text: |-
              "No, gracias," digo. "Me gusta mantener las cosas desafiantes."

              Hay una breve pausa durante la cual ninguno de los dos dice nada.

              "¿Es esa tu respuesta final?" me pregunta el lessathi.

              "Claro," digo.

              "Aunque dije que podríamos hacer las cosas más fáciles para ti en la arena si aceptabas ayudarnos," dice el lessathi, "lo que omití decir fue que también podemos hacer las cosas más difíciles para ti si te niegas."

              "¿De qué manera?" pregunto.

              "Por ejemplo, podríamos hacer que los guardias confisquen tu dispositivo de estadísticas y te dejen completamente indefenso," dice el lessathi.

              "Está bien, no sé cómo te enteraste de mi dispositivo de estadísticas," digo, "pero estoy bastante seguro de que no es ilegal usarlo, según las reglas de tu arena."

              "Nunca dije que fuera ilegal," dice el lessathi. "Solo dije que haríamos que los guardias lo confiscaran. Una pequeña charla con el dueño de la arena debería ser suficiente para torcer las reglas en esta ocasión especial. Ahora, ¿tenemos un acuerdo o no?"
