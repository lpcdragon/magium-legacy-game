  - name: b2_ch02a_tell_servant
    routes:
      - condition: b2_ch2_tell_servant = 1 AND ch11_saved_rose = 0
        texts:
          - source: scene_text
            paragraph: 6
            text: |-
              Saco el dispositivo de estadísticas de mi bolsillo y se lo muestro.

              "Me refiero a este objeto," digo. "¿Lo conoce?"

              El sirviente sonríe.

              "Sí, estoy familiarizado con él," dice. "No se preocupe. El efecto del potenciador de estadísticas no cuenta como lanzamiento de hechizos. Los detectores de magia en las arenas definitivamente lo ignorarán."

              "Oye, Barry," dice Daren, y tanto el sirviente del rey como yo giramos la cabeza hacia él.

              "¿Cuánto tiempo podemos retrasar nuestro viaje a la arena?" dice Daren, mirando al sirviente del rey. "¿Puede esperar media hora? Estaba pensando que podría lanzar algunos encantamientos básicos de filo y durabilidad en las dagas de mis amigos, si encuentro una tienda que venda acero élfico en el camino."

              "Hay tiempo suficiente," dice el sirviente del rey. "Si está buscando una tienda que venda materiales de encantamiento, debería haber una en el mercado al que llegaremos en breve."

              "¿Por qué necesitas acero élfico, específicamente?" le pregunto a Daren.

              "El acero élfico es la mejor calidad de acero que el dinero puede comprar," dice Daren, "y los encantamientos básicos como filo y durabilidad dependen en gran medida de la calidad de los materiales usados para el encantamiento."

              "¿Hay alguna posibilidad de que puedas encantar mi ballesta también?" pregunto.
          - source: scene_text_2
            paragraph: 3
            text: |-
              "No se permite el uso de armas a distancia dentro de las arenas de Varathia," dice el sirviente del rey.

              "Seré honesto contigo, Barry," me dice Daren, "incluso si las armas a distancia estuvieran permitidas, aun así no te recomendaría encantar tu ballesta. Sería mucho mejor comprar una nueva. El encantamiento básico simplemente no es un buen sustituto para una artesanía pobre. Con las dagas es diferente, porque la calidad del metal es mucho más importante que la forma en que se hizo la hoja."

              "¿Por qué sigues hablando de encantamientos básicos?" dice Hadrik. "¿No se supone que eres uno de los encantadores más hábiles del mundo? ¿Por qué no simplemente lanzas algunos de esos encantamientos locos que tienes en tu espada sobre las dagas de Barry y Kate?"

              Daren lo mira con el ceño fruncido.

              "Cuanto más avanzado es el encantamiento, más tiempo y recursos requiere," dice. "Me tomaría semanas lanzar los encantamientos que usé en mi espada, y costaría una pequeña fortuna adquirir los materiales necesarios. Dudo que haga algo más que encantamientos básicos durante la duración de este torneo. Barry, Kate, denme sus dagas. Las encantaré a ambas tan pronto como lleguemos a esa tienda."

              Una vez que encontró la tienda, Daren entró, y no salió hasta que pasó exactamente media hora.
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch02a_gems
