          - source: scene_text_2
            paragraph: 18
            text: |-
              "Buenos días," dice Wilhelm. "Espero no estar interrumpiendo nada. Solo quería hablar contigo sobre nuestra conversación de anoche. Creo que quizás empezamos con el pie izquierdo. Si te he dado algún motivo para desconfiar de mí, entonces te prometo que haré todo lo que esté en mi poder para--"

              "Escucha, Wilhelm," lo interrumpo. "Después de lo que te dije anoche, asumí que serías lo suficientemente inteligente como para mantenerte alejado de mi camino hasta el final de los eventos de la arena, pero parece que me equivoqué. No hay problema. Simplemente dejaré mi postura un poco más clara esta vez."

              "¿Qué quieres decir?" me pregunta Wilhelm, con un poco de aprensión en la voz.

              "Quiero decir que te voy a dar una opción," digo. "No estoy seguro de por qué querrías matarme. No sé si te han contratado, o si tienes algún motivo personal. Pero al final, solo eres un asesino, no eres un luchador. Para matar a alguien, no puedes pelear de frente. Necesitas el elemento sorpresa. Ahora, por supuesto, todavía puedes intentar tomarme desprevenido, pero tu problema será que sabré exactamente qué esperar. Si crees que vale la pena el riesgo, entonces adelante, hazlo. Si no, te sugiero que te mantengas alejado de mí hasta que terminemos con la arena."

              "Entiendo," dice Wilhelm, con la apariencia de alguien a quien le han quitado todo el viento de las velas. "No te molestaré más."

              Luego se da la vuelta para irse.
