  - name: b2_ch02a_princess
    texts:
      - source: scene_text
        paragraph: 31
        text: |-
          De repente me doy cuenta de que la chica del cabello plateado me estaba observando de nuevo. De hecho, creo que me ha estado observando durante mucho tiempo. Wilhelm se da cuenta de que miro hacia la chica y me lanza una sonrisa burlona.

          "Yo no perdería mi tiempo intentando hablar con esa," dice Wilhelm. "Todos lo hemos intentado, pero no dice ni una palabra. Creo que nuestra pequeña princesa de cabello plateado es muda, o ha hecho algún tipo de voto de silencio. De cualquier manera, dudo que consigas sacarle algo."

          Luego hace una reverencia cortés y vuelve a su rincón de la habitación. Mientras Wilhelm pasa al lado de la chica de vuelta, ella no le presta atención, y sigue mirándome directamente a mí.

          Bien, ahora estoy seguro de que lo está haciendo a propósito. Pero, ¿qué quiere de mí? ¿Quiere que vaya a hablar con ella? Supongo que solo hay una forma de averiguarlo.

          Con calma empiezo a dirigirme hacia ella, mientras presto mucha atención a sus reacciones. La chica parece imperturbable ante mi decisión de acercarme, y sigue mirándome a los ojos incluso después de que me detengo frente a ella.
      - source: scene_text_2
        paragraph: 19
        text: |-
          Ahora que observo mejor a la chica, veo que es al menos una cabeza más baja que yo, y que tiene una constitución muy frágil. Puedo ver por qué Wilhelm eligió llamarla princesa. Definitivamente no parece una luchadora. Su ropa, sin embargo, no se parece en nada a lo que una princesa podría usar. Lleva una blusa beige simple, unos leggings cortos que parecen cómodos para moverse, y sandalias de madera. A pesar de su cuerpo de apariencia frágil, la chica lleva dos cuchillos en el cinturón, y sus brazos y piernas están llenos de moretones, lo que indica que probablemente ha estado en una pelea poco antes de ser encarcelada.

          Viendo que la chica no tiene intención de decir nada, tomo la iniciativa de iniciar una conversación.

          "Entonces, ¿me vas a decir por qué me has estado observando durante los últimos cinco minutos?" le pregunto, directamente.

          La chica no me da señales de haberme escuchado, y sigue mirándome, sin ningún cambio en su expresión.

          "¿Y bien?" digo. "¿No vas a decir nada?"

          Todavía sin respuesta. Wilhelm tenía razón. Esto no tiene sentido.

          Me doy la vuelta para irme, pero entonces de repente siento algo tirando de mi manga. Cuando me doy la vuelta, veo que la chica ahora me sostiene por la manga de la camisa, y hay una escritura de color azul, flotando en el aire, frente a su rostro. La escritura está en Lengua Común, y dice simplemente: "Espera".
      - source: scene_3
        paragraph: 6
        text: |-
          La escritura luego desaparece y es reemplazada por un nuevo texto, esta vez diciendo: "¿Es verdad, lo que dicen de ti?"

          "¿Qué quieres decir?" pregunto, mirando a la chica. "¿Qué dicen de mí?"

          Al igual que antes, la frase anterior ahora está siendo reemplazada por un nuevo texto, que dice: "Dicen que la razón por la que te trajeron aquí es porque atacaste a un noble. ¿Es verdad?"
