            paragraph: 22
            text: |-
              "Yo también lo he notado," le digo. "Solo he conseguido dos puntos desde que entré a la ciudad, pero solía obtener puntos mucho más rápido antes, a menos que estuviera viajando por áreas completamente desiertas. ¿Quizás es solo porque no hay muchos magos del torneo que hayan encontrado el camino a esta ciudad?"

              "Quizás," escribe Leila. "O quizás es porque en esta ciudad hay otros portadores de algún dispositivo de estadísticas, y la energía se está dividiendo equitativamente entre nosotros."

              "¿Crees que podría haber otros lessathi usando dispositivos de estadísticas en esta ciudad?" le pregunto.

              "No lo sé," escribe Leila. "Es una posibilidad. ¿Puedo ver tu potenciador de estadísticas, por favor?"

              "Sí, claro, supongo..." digo, mientras saco mi dispositivo de estadísticas del bolsillo y se lo muestro.

              La chica le da al dispositivo una larga mirada reflexiva, antes de volver a escribir.

              "Esto no tiene nada que ver con la razón por la que te pedí tu potenciador de estadísticas, pero siento que necesito preguntar," escribe Leila. "Barry, ¿por qué no has gastado ni un solo punto de estadísticas hasta ahora?"
