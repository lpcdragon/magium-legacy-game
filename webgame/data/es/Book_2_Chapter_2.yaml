  - name: b2_ch02a_gallows
    texts:
      - source: scene_text
        paragraph: 15
        text: |-
          La cara del hombre se contorsiona en un gruñido al escuchar mis palabras.

          "¿Tienes idea de lo que has hecho, pequeño bastardo?" grita el hombre.

          "No," digo. "Ni la menor idea. ¿Por qué no me lo explicas?"

          "Oh, te lo explicaré," dice el hombre, rechinando los dientes. "Tu pequeña hazaña con ese noble ha sellado el destino de todos nosotros. Escuché a los guardias diciendo que el próximo evento de la arena será el más grande en toda la historia de Varathia. No esperan que ninguno de nosotros salga con vida. Nos están enviando a todos a la muerte, solo para asegurarse de que también te maten a ti en el proceso."

          El hombre ahora está apretando su puño con tanta fuerza que la sangre empieza a gotear de él. Mientras los dos hablábamos, las puertas que daban a las celdas individuales se iban abriendo una por una, y las personas que habían sido despertadas por el sonido de la voz del hombre corpulento ahora salían de sus habitaciones para ver el espectáculo.

          "La única razón por la que vine a Thilias," dice el hombre corpulento, "fue porque escuché que el rey gnomo rara vez dejaba que los eventos de la arena en su ciudad pusieran en peligro las vidas de los gladiadores. Vine aquí porque pensé que había dinero fácil que ganar. ¿Pero ahora?... Ahora simplemente estoy aquí sentado, esperando mi ejecución. Maldiciendo mi destino. ¡Maldiciendo a ti!"
      - source: scene_text_2
        paragraph: 8
        text: |-
          "¿Por qué no simplemente te vas, entonces?" digo.

          "¡¿Crees que no lo intenté?!" grita el hombre, aún más fuerte que antes. "El dueño de la arena no deja salir a ninguno de nosotros. Es la primera vez en años que se le permite hacer el espectáculo tan mortal como quiera. ¿Sabes que ha estado recolectando bestias raras y manteniéndolas en los túneles subterráneos durante los últimos diez años, esperando la oportunidad de exhibirlas frente a un público? Bueno, ahora que finalmente se le ha dado permiso, el hombre planea hacernos luchar contra cada una de ellas. Quiere hacer de esto el momento cumbre de su carrera. No le importa lo que el rey de Thilias le haga si se excede. Mientras este único espectáculo sea exitoso, bien puede morir, en lo que a él respecta, y nosotros también."

          "Contrólate," le digo. "Estás actuando como si nos enviaran al patíbulo, no a un combate de la arena. No vine aquí a perder el tiempo, revolcándome en autocompasión. Vine aquí a ganar."

          Después de escuchar lo que tenía que decir, el hombre corpulento pierde por completo el poco autocontrol que le quedaba, y lanza su puño derecho a mi cara, con toda su fuerza.
