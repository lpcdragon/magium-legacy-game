  - name: b2_ch02a_backup
    texts:
      - source: scene_text
        paragraph: 42
        text: |-
          "¿Puedes saber todo eso con solo mirarlo?" le pregunto.

          "No, por supuesto que no," escribe Leila. "No mirando. Puedo saberlo sintiendo el flujo de la energía mágica que lo rodea. ¿Tú no puedes?"

          "Bueno, supongo que puedo sentir el flujo más o menos," digo, "pero no hay manera de que pudiera distinguir cuál de nuestros dos dispositivos está recopilando más que el otro."

          "Eso es extraño," escribe Leila. "Si ni siquiera puedes notar la diferencia entre nuestros dos dispositivos, entonces, ¿cómo supiste que el potenciador de estadísticas fue diseñado para funcionar con lessathi antes de venir a este torneo? Por lo que me has dicho, no parece que conozcas a ninguno de los otros lessathi, así que debiste haberlo descubierto por tu cuenta de alguna manera. A menos que..."

          Leila se detiene.

          "A menos que no tuvieras absolutamente idea de cuán poderoso sería realmente el dispositivo," continúa Leila, "y estuvieras planeando seguir fingiendo que eres un stillwater hasta el final del torneo, con tu dispositivo de estadísticas solo como un plan de respaldo."
    choices:
      - position: 1
