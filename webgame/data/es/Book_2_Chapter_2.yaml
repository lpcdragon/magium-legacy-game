              Echo un vistazo rápido por la habitación para ver a quién más pusieron en mi división. Aparte de Bruce y Wilhelm, a quienes conocí anoche, está la chica del cabello plateado que me estaba observando, y luego hay otros dos individuos que parecen versiones tipo gladiador de Dave el Degollador. Los dos matones parecen ser los únicos que realmente están hablando entre sí. Los otros tres están cada uno en algún lugar lo más lejos posible de los demás, apoyados con las espaldas contra las paredes, con los brazos cruzados, esperando a que termine el período de recreación.

              ¿Qué se supone que debo hacer ahora? No puedo decir que tenga ganas de hablar con ninguna de estas personas. ¿De qué hay que hablar? Ni siquiera nos dijeron cómo sería la primera ronda. ¿Cómo se supone que hagamos una estrategia? Quizás debería simplemente volver y buscar un libro para leer o algo.

              Mientras estoy ahí pensando en volver a mi celda, Wilhelm de repente se aleja de la pared y empieza a dirigirse hacia mí. Cuando se detiene frente a mí, veo que tiene una mirada inusualmente decidida en el rostro.
          - source: scene_text_2
            paragraph: 17
            text: |-
              "Buenos días," dice Wilhelm. "Tengo noticias para ti que creo que podrían resultarte útiles. Por lo que he escuchado, en unas horas, el embajador y el dueño de la arena deberían estar discutiendo asuntos importantes sobre la organización de los eventos de la arena. Los guardias de este lugar tienen la costumbre de escuchar este tipo de conversaciones y generalmente les gusta discutirlas entre ellos. Asegúrate de prestar mucha atención a lo que dicen cuando estén fuera de tu celda. Yo haré lo mismo."

              "Eso es interesante," digo. "Lo tendré en cuenta."

              "Muy bien," dice Wilhelm. "Eso es todo lo que quería decirte. Me aseguraré de avisarte si escucho algo. Espero que tú hagas lo mismo."

              "Por supuesto," digo.
