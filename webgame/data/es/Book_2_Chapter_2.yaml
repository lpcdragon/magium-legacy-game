  - name: b2_ch02a_fist
    routes:
      - condition: toughness >= 2
        texts:
          - source: scene_text
            paragraph: 16
            text: |-
              No intento esquivar su golpe, y el puño del hombre me impacta en el puente de la nariz. El impacto del golpe no me causó casi ningún dolor, y ni siquiera me movió un centímetro de mi posición original. Mientras el hombre corpulento retrae su brazo, lo miro con la misma expresión desinteresada en mis ojos que la que el trabajador del escritorio tenía cuando me miró.

              Esto enfurece aún más al hombre, y comienza a poner más fuerza detrás de sus puñetazos, pero eso no le ayuda mucho. Después de unos veinte segundos de golpearme continuamente tanto en la cabeza como en el estómago, durante los cuales ni siquiera me molesté en bloquear un solo golpe, mi atacante de repente retrocede, como si solo ahora comprendiera la futilidad de sus acciones. El asombro era claramente visible en su rostro, mientras simplemente se quedaba ahí mirándome, sin decir nada.

              "¿Terminaste?" le pregunto.

              "Quizás estaba equivocado sobre ti, stillwater," dice el hombre corpulento, en un tono que sugiere que todavía está tratando de superar el shock de lo que acababa de presenciar.

              Luego pone ambas manos sobre mis hombros y me mira con la esperanza de un hombre que ya no se había atrevido a tener esperanza.

              "¡Quizás tenías razón!" dice. "¡Quizás todavía podemos ganar esto... siempre y cuando trabajemos juntos!"
        effects:
