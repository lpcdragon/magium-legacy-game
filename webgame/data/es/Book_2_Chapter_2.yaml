  - name: b2_ch02a_creatures
    texts:
      - source: scene_text
        paragraph: 69
        text: |-
          A medida que avanzábamos por las cavernas, eventualmente llegamos a un túnel que tenía celdas de prisión a ambos lados, con puertas hechas de barrotes de hierro oxidado. Dentro de las celdas, lo que vimos en lugar de prisioneros fueron criaturas de todas las formas y tamaños que o nos gruñían amenazadoramente, o nos estudiaban cuidadosamente, esperando a ver qué haríamos. Hay lobos terribles, gárgolas, ratas gigantes, arpías, grifos y tigres dientes de sable, todos encerrados en diferentes celdas del mismo túnel, y algo me dice que esto es solo una pequeña fracción de la vasta variedad de criaturas que el dueño de la arena tiene a su disposición.

          "No están vigiladas," escribe Leila. "Creo que no esperaban intrusos viniendo desde esta dirección. Esto significa que todavía hay una posibilidad de que podamos salir de este lugar sin ser detectados."

          Leila recoge una piedra del suelo y empieza a lanzarla al aire y atraparla repetidamente, mientras mira hacia una de las celdas. De repente me doy cuenta de que la piedra que está lanzando al aire es justo del tamaño correcto para pasar a través de los barrotes de hierro. Con su fuerza al máximo, probablemente podría fácilmente destrozar la cabeza de uno de esos tigres con un solo lanzamiento.

          "Ahora, la cuestión es," escribe Leila, "¿deberíamos matar a estas criaturas mientras tenemos la oportunidad, o deberíamos concentrarnos en encontrar una salida de este lugar?"
    choices:
      - position: 1
        text: Matar a las criaturas.
        effects:
          - set:
              current_scene: b2_ch02a_kill
              b2_ch2_creatures: 1
      - position: 2
        text: Dejar a las criaturas en paz y concentrarnos en encontrar una salida.
        effects:
          - set:
              current_scene: b2_ch02a_leave
              b2_ch2_creatures: 0
  - name: b2_ch02a_kill
    texts:
      - source: scene_text
        paragraph: 70
        text: |-
          "Yo digo que las matemos," le digo a Leila. "Para esto vinimos aquí, después de todo. Pero debemos asegurarnos de hacerlo en silencio. Lo último que queremos es alertar a los guardias que haya en este lugar."

          "Lo haré en silencio," escribe Leila, y lanza la piedra a la cabeza de uno de los tigres dientes de sable.

          La piedra le rompe el cráneo al tigre, y la criatura cae al suelo con un golpe sordo. Leila no pierde el tiempo y lanza una segunda piedra a otro de los tigres en la celda. En ese momento, comenzamos a escuchar un chillido ensordecedor de las arpías en la celda opuesta. Las arpías son criaturas horrendas que tienen la apariencia de mujeres con escamas, alas y garras. Pueden parecer casi humanas, pero en realidad no podrían ser más diferentes. Son aproximadamente tan inteligentes como los reptiles más primitivos, y el doble de feroces. Sus chillidos probablemente están destinados a alertar a quien esté a cargo de vigilar estas celdas.

          Leila rápidamente cambia sus objetivos y empieza a golpear a las arpías en su lugar, pero ahora todo el túnel está siendo inundado por los rugidos y gritos de todas las criaturas que están siendo retenidas en las celdas. Esto no es bueno. Alguien seguramente escuchará este ruido, y si ese alguien tiene una forma de abrir las celdas remotamente, estaremos rodeados por estas criaturas en poco tiempo. Miro a mi alrededor para ver cuáles de las criaturas serían las más peligrosas para nosotros si las liberaran.
      - source: scene_text_2
        paragraph: 40
        text: |-
          Los lobos terribles, las ratas gigantes y los tigres dientes de sable son todos mortales, pero al final, no son mucho más poderosos que los animales normales. Leila ya está ocupándose de las arpías, lo que me deja elegir entre las gárgolas y los grifos.

          Los grifos son criaturas que tienen cuerpos, colas y patas de leones, mientras que sus cabezas, alas y garras son las de águilas. Pueden ser una molestia, pero su poder principal radica en atacar desde arriba, lo cual sería difícil de hacer aquí debido al techo relativamente bajo.

          Las gárgolas, por otro lado, también tienen otros medios de lucha además de sus ataques aéreos. Podrían describirse con precisión como ogros más delgados, con alas y cuernos, mientras que su fuerza es comparable a la de los ogros también. Aunque sus alas no serían de mucha ayuda aquí, podrían aplastarnos los huesos con sus manos desnudas si se acercaran lo suficiente a nosotros.

          Decido que las gárgolas son, con diferencia, las más peligrosas del grupo, así que recojo una piedra del suelo y se la lanzo a la cabeza de una de ellas.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch02a_gargoyles
