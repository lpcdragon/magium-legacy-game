              "¿Y tu esposa?" pregunta Kate. "¿Tiene ella el transceptor número cero?"

              "Sí," dice Daren. "Pero no hay frecuencia cero. Necesitas conocer un código secreto para poder contactarla usando estos transceptores. Tomé esta precaución para asegurarme de que nadie que use estos transceptores pueda llamarla por accidente."

