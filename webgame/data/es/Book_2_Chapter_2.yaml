scenes:
  - name: b2_ch02a_intro
    texts:
      - source: scene_text
        paragraph: 2
        text: |-
          "Escucha, Arraka," dice Daren, mientras caminamos hacia la arena. "¿Estás absolutamente segura de que el Eiden contra el que luchaste durante el invierno inmóvil es la misma persona con la que estamos lidiando ahora? Quiero decir, han pasado seiscientos años, ¿no? ¡Nadie te culparía si cometieras una confusión después de todo este tiempo!"

          "Maldición, esta es la tercera vez que me haces exactamente la misma pregunta," dice Arraka. "Sí, es el mismo Eiden de hace seiscientos años. ¡Métetelo en tu dura mollera de una vez!"

          "Daren, ¿por qué te cuesta tanto creerlo?" dice Kate. "Ya sabíamos que tenía seiscientos años y que era un viejo conocido de Arraka y del zorro dorado. Dado su poder, no era tan descabellado asumir que fue él quien derrotó a Arraka en aquel entonces."

          "No es el hecho de que pudiera vencer a Arraka lo que me cuesta creer," dice Daren. "Es el hecho de que sea conocido como el fundador de la civilización de este continente cuando todo lo que le hemos visto hacer hasta ahora es causar estragos, ¡con el único propósito de divertirse!"

          "La gente cambia con el tiempo," dice Kate. "Corrígeme si me equivoco, pero ¿no te dijo Eiden cuando lo conociste que la razón por la que mantiene los ojos cerrados es porque se cansó de ver la fealdad de la humanidad? Has visto cómo actuó con el conde y el embajador de Ollendor. Está claro que ya no siente otra cosa que asco y desdén por los habitantes de Varathia."
      - source: scene_text_2
        paragraph: 2
        text: |-
          "Dejando a Eiden de lado," digo yo, "¿no deberíamos más bien estar discutiendo nuestros planes para la arena?"

          "¡No te preocupes por la arena!" dice Hadrik. "¡Yo solo debería ser más que suficiente para lidiar con lo que sea que el embajador nos lance!"

          "¿Ah, sí?" digo yo. "¿Y qué pasa si nos separan?"

          "Barry tiene razón," dice Daren. "Lo primero que debemos asegurarnos es que podamos seguir comunicándonos entre nosotros, incluso si deciden meternos en celdas diferentes."

          Daren se quita la mochila, y luego saca tres transceptores de ella.

          "Kate, Hadrik, Flower, tomen estos," dice, mientras le da a cada uno de ellos un transceptor. "Barry, tú ya tienes un transceptor. No creo haberte mostrado esto antes, pero tienes un dial en el lado derecho de tu transceptor que puedes usar para cambiar tu frecuencia de llamada, para que coincida con la frecuencia de firma de uno de los otros transceptores. ¿Todos ven el dial del que hablo?"

          "Sí," respondemos todos.

          "Bien," dice Daren. "Cada uno de los transceptores tiene asignado un número, que corresponde a su propia frecuencia de firma única. Asegúrense de memorizar el número de todos los demás para saber a quién contactar cuando sea necesario. Los números están grabados en la parte trasera de los transceptores."
      - source: scene_3
        paragraph: 2
        text: |-
          Miro la parte trasera de mi transceptor y veo que tengo asignado el número 'dos'. Cuando intercambiamos nuestros números, descubro que Kate era el número tres, Flower era el cuatro y Hadrik era el cinco.

          "Muy bien," dice Daren. "Ahora todos conocen sus números. Como nota aparte, si alguna vez necesitan comunicarse con transceptores que no fueron encantados por mí, hay un pequeño botón junto al dial que pueden usar para cambiar a frecuencias normales. Yo usaré el transceptor con el número 'seis'."

          "¿Y el número 'uno'?" pregunto.
    effects:
      - set:
          successful_checks:
            - 'Punto de control alcanzado: Partida guardada.'
        condition: checkpoint_rich = 1
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch02a_intro2
              checkpoint_rich: 0
  - name: b2_ch02a_intro2
    routes:
      - condition: ch11_saved_rose = 0
        texts:
          - source: scene_text
            paragraph: 3
            text: |-
              Daren se detiene durante unos segundos.

              "Ese es el número del transceptor que usaba originalmente," dice Daren, en voz baja. "El que le di a Rose."

              "Oh," digo yo, y luego todos nos quedamos en silencio por unos momentos.

              "Entonces, eh, ¿sabemos con certeza que nos van a permitir quedarnos con nuestros transceptores después de que nos envíen a nuestras celdas?" pregunta Hadrik.

              "Se les permitirá quedarse con cualquier objeto que deseen," dice el sirviente del rey, habiendo escuchado nuestra conversación. "Cada uno de ustedes tendrá su propia celda personal en la que podrán guardar sus pertenencias, pero también se les permitirá llevar objetos consigo."

              "¿Y las armas?" pregunta Daren. "¿Se nos permite usar nuestras propias armas y armaduras durante las peleas en la arena?"

              "Sí, siempre que sus armas no lancen hechizos, se les permite usar cualquier arma que tengan a su disposición," dice el sirviente.

              "¿Qué entiende usted por 'lanzar hechizos'?" pregunto. "¿Un objeto que mejora tus habilidades físicas se consideraría 'lanzamiento de hechizos'?"

              "Depende de la naturaleza del objeto," dice el sirviente. "Sin saber a qué objeto en particular se refiere, no puedo darle una respuesta definitiva a su pregunta."
