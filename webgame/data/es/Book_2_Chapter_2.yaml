            paragraph: 48
            text: |-
              "Bueno, señor lessathi, ¡supongo que tenemos un trato!" digo.

              "¡Excelente!" dice el lessathi. "Aquí tienes el dispositivo del que te hablé."

              El lessathi lanza una pequeña pieza de metal a través de la ventana de mi habitación. Parece bastante ordinaria, excepto por unos grabados en ella.

              "Asegúrate de no perderlo," dice el lessathi. "Sería difícil conseguir un repuesto."

              Puedo escuchar al lessathi moverse para irse.

              "Ah," dice. "Y deberías esperar una incorporación de último momento a tu equipo antes de que comience el evento de la arena. Él se encargará de la mayoría de tus problemas."

              Con estas últimas palabras, el lessathi se marcha. Espero un minuto para asegurarme de que se ha ido de verdad, y luego vuelvo a leer mi cuaderno.
