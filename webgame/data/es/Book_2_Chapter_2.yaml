        texts:
          - source: scene_text
            paragraph: 19
            text: |-
              Reacciono justo a tiempo y logro quitarme del camino antes de que su brazo me alcance. Mi atacante no pierde tiempo e intenta golpearme de nuevo, esta vez con su puño izquierdo. Tropiezo un poco, porque no recuperé adecuadamente mi equilibrio después de esquivar su último golpe, pero logro evitar su siguiente golpe de todas formas. Durante el siguiente medio minuto, el hombre corpulento desata una lluvia de puñetazos sobre mí, intentando tomarme desprevenido al menos una vez. Sin embargo, incluso si en ciertos momentos parecía que estaba a punto de cometer un error, siempre de alguna manera logré recuperar el equilibrio y evitar milagrosamente ser golpeado, aunque pudiera haber parecido imposible para cualquiera que estuviera observando la pelea.

              Después de darse cuenta de que no está llegando a ninguna parte, el hombre corpulento deja de atacarme y simplemente se queda ahí mirándome durante unos segundos.

              "Ahora entiendo de dónde viene tu confianza," dice, con disgusto. "Veo que puedes manejarte bastante bien, incluso sin tu magia. Pero no cometas el error de pensar que puedes simplemente evitar pelear para siempre. El evento de la arena no terminará hasta que tú o los monstruos estén muertos."

              "No te preocupes," digo. "¡Esquivar no es lo único en lo que soy bueno!"
