  - name: b2_ch02a_swim
    texts:
      - source: scene_text
        paragraph: 59
        text: |-
          "Tan listo como lo estaré jamás, supongo," digo.

          Leila entonces coloca su mano en la pared, y al mismo tiempo, puedo sentir una especie de corriente mágica fluyendo a través de mi palma. Casi inmediatamente después, el suelo debajo de nosotros se abre, y lo siguiente que sabemos es que ambos estamos cayendo en un pozo, mientras podemos ver el suelo de nuestra habitación cerrándose lentamente de nuevo, sobre nuestras cabezas. Después de lo que pareció una caída de cien pies, caemos en un lago subterráneo, con un gran chapuzón. Mientras pataleo para mantenerme a flote, miro arriba para ver si hay alguna forma de volver por donde vinimos.

          Las paredes y el techo de la caverna a nuestro alrededor parecen estar cubiertos de algún tipo de cristales azules brillantes que proporcionan bastante iluminación a lo largo del área, pero no veo ninguna forma obvia de escalar de vuelta a nuestra celda. Las únicas cosas que llevan hacia arriba son unas cuerdas que están atadas a una polea que cuelga del techo, pero no hay forma de que pudiera escalar hasta allí arriba por una cuerda.

          De repente, puedo escuchar el sonido de chapoteos repetidos detrás de mí, y al voltear a ver, veo a Leila agitando desesperadamente sus brazos en el agua, con la boca abierta de par en par, como si hubiera olvidado que no podía hablar e intentara gritar. Dándome cuenta de lo que está pasando, nado rápidamente hacia ella y la agarro por los hombros para detener el movimiento de sus brazos.
      - source: scene_text_2
        paragraph: 33
        text: |-
          "¡Leila, está bien!" le digo, mientras ella me mira aterrorizada. "Solo agárrate a mí. Te llevaré a la orilla."

          Le toma unos momentos, pero finalmente se calma y se agarra a mí con ambos brazos, sujetándome con mucha fuerza. Una vez que la llevo a salvo a la orilla, nos tomamos un descanso para recuperar el aliento. Ambos estamos empapados hasta los huesos, y el aire aquí abajo definitivamente no es tan cálido como en la superficie. Idealmente, haría un fuego en esta situación, pero ¿se puede encontrar madera en una caverna subterránea como esta?

          Mi pregunta se responde inmediatamente cuando me doy la vuelta y veo una cabaña de madera a unos cientos de pies de donde estamos. También hay una gran pila de troncos apilados justo frente a su puerta. Qué conveniente.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch02a_dragging
  - name: b2_ch02a_dragging
    texts:
      - source: scene_text
        paragraph: 60
        text: |-
          Mientras miro hacia la cabaña, Leila tira de mi camisa para llamar mi atención. Cuando volteo a verla, veo que está arrodillada, con su cabello mojado cubriendo la mayor parte de su rostro, y la cabeza inclinada.

          "Lo siento," escribe simplemente.

          "¿Por qué?" pregunto.

          "Por arrastrarte a esto," escribe.

          "Leila," digo, "si no me hubieras arrastrado a esto, habrías terminado ahogándote en ese lago."

          Leila sigue mirando al suelo, mientras su escritura desaparece lentamente.

          "Escucha," digo, "no hay nada de qué disculparse. Yo tampoco pensé que esto sería una trampa. Todavía no estoy seguro de si es una trampa, en realidad. Quiero decir, estoy seguro de que originalmente fue diseñado como una trampa, pero quién sabe si alguien siquiera recuerda que existe. De cualquier manera, aunque hayamos perdido el camino de vuelta, no creo que estemos en el lugar equivocado. Lo único que ha cambiado es que ahora también tenemos que buscar un camino de regreso a nuestras celdas, mientras buscamos las criaturas."

          Mientras hablo con Leila, las cuerdas que llevan al techo empiezan a llamar mi atención. Todas salen del agua, y la forma en que están distanciadas entre sí me hace pensar que están atadas a algún tipo de plataforma en el fondo del lago. Posiblemente un ascensor. Me pregunto si hay una palanca o algo en el fondo del lago que pudiera activar el ascensor y sacarnos de aquí.
    choices:
      - position: 1
        text: Nadar al fondo del lago para ver si puedo encontrar una forma de activar el ascensor.
        effects:
          - set:
              current_scene: b2_ch02a_cabin
              b2_ch2_elevator: 1
      - position: 2
        text: Ignorar el ascensor e ir directamente a la cabaña de madera para encender un fuego.
        effects:
          - set:
              current_scene: b2_ch02a_cabin
              b2_ch2_elevator: 0
  - name: b2_ch02a_cabin
    routes:
      - condition: b2_ch2_elevator = 1
        texts:
          - source: scene_text
            paragraph: 61
            text: |-
              "Se me acaba de ocurrir algo," digo. "¿Ves esas cuerdas?"

              Leila asiente.

              "Creo que podrían estar atadas a una plataforma en el extremo inferior," digo. "Quiero revisar el fondo del lago y ver si hay algún tipo de palanca que pueda usar para activar el ascensor. ¿Puedes esperarme aquí?"

              "Está bien," escribe Leila.

              Salto al lago y nado de vuelta hacia las cuerdas. Cuando las alcanzo, tomo una respiración profunda y me sumerjo en el agua. Parece que tenía razón. Realmente hay una plataforma en el fondo mismo del lago, atada a las cuerdas. Sin embargo, no hay ningún mecanismo obvio que parezca que pueda usarse para operar el ascensor, por lo que puedo ver. Lo único que se asemeja a algo así es un pilar de piedra, junto a la plataforma, con un agujero en la parte superior con forma de araña. Si este ascensor requiere algún tipo de llave con forma de araña para activarse, entonces no tengo suerte. Después de unas cuantas rondas más sin éxito rodeando la plataforma en busca de señales de una palanca, finalmente me quedo sin aire y vuelvo a la superficie para llenar mis pulmones. Esto es inútil. A menos que encuentre esa llave de araña, no hay forma de que pueda operar este ascensor. Mejor me vuelvo a la orilla.

              "¿Encontraste algo?" escribe Leila al verme salir del agua.
          - source: scene_text_2
            paragraph: 34
            text: |-
              "No vi ninguna palanca," digo mientras exprimo el agua de mi camisa. "Lo máximo que pude encontrar fue un pilar con un agujero en forma de araña. A menos que encontremos algún tipo de llave con forma de araña, ese ascensor no va a sernos de mucha utilidad. Vamos a la cabaña. Tal vez encontremos algo de pedernal o algo para encender un fuego."

              Leila asiente, y ambos comenzamos a caminar hacia la cabaña. Hay algo que me ha estado molestando de esta cabaña de madera desde que la vi por primera vez. A menos que haya algunos árboles creciendo milagrosamente en estas cavernas en algún lugar, esta cabaña no podría haber sido construida por alguien que quedó atrapado aquí antes que nosotros. Esto significa que probablemente fue construida por las mismas personas que diseñaron la trampa, o al menos por personas que saben de ella y que pueden llegar a este lugar por otros medios. El hecho de que haya un montón de troncos convenientemente colocados justo al lado del lago en el que caímos me hace creer que esto se hizo intencionalmente. ¿Por qué se tomarían la molestia de hacer las cosas más cómodas para nosotros? ¿Es esta su forma de concedernos nuestro último deseo, antes de enviar a las bestias a matarnos?

              Al llegar a la cabaña, entro con cuidado, asegurándome de que no haya trampas. La cabaña no tiene chimenea ni salida de humo, pero hay algo de leña dentro, y también algo de pedernal. Saco la leña y el pedernal afuera, y luego tomo algo del musgo seco de las paredes de la cueva para proporcionar un poco de yesca. Una vez que preparamos el fuego, Leila y yo nos sentamos junto a él, tratando de acercarnos lo más posible al calor.
