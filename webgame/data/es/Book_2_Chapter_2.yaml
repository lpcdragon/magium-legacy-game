              No esperaba que se moviera tan rápido sin usar sus alas, pero afortunadamente, mis reflejos fueron lo suficientemente buenos como para poder apartarme a tiempo. Si recuerdo correctamente lo que estaba escrito en mis notas, las gárgolas normalmente tienden a esperar hasta que rodean a su víctima antes de hacer su ataque. La que se lanzó directamente hacia mí debe haberlo hecho solo porque la enfurecí al golpearla con la piedra antes. Mientras no deje que me rodeen, las otras dos probablemente dudarán en atacarme, dándome el tiempo para acabar con su compañera más impulsiva.
