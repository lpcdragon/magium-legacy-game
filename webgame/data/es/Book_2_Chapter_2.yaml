            paragraph: 27
            text: |-
              "Entonces, ¿qué es lo que están tratando de hacer?"

              "Estamos tratando de interferir sutilmente con la forma en que funciona uno de los dispositivos del gnomo. Uno de los inventos del rey gnomo actualmente está haciendo que su sala secreta sea completamente insonorizada, lo que nos impide escuchar sus conversaciones privadas. Sin embargo, en este momento, no tenemos ningún agente en quien el rey confíe lo suficiente como para permitirle acceso a su sala secreta. Por eso acudimos a ti. No estamos pidiéndote que hagas esto gratis, por supuesto. Hay formas en las que podríamos hacer tus peleas aquí en la arena mucho más fáciles para ti. Todo lo que necesitas hacer es aceptar ayudarnos, y nosotros nos encargaremos del resto."

              No hay forma de que pudiera aceptar este trato después de haber convencido a todos de ayudarme a librar al rey de los lessathi en su ciudad. Aunque, por otro lado, este tipo dice que todo lo que necesito hacer para obtener mi recompensa es aceptar ayudarlo. Ya que voy a atacarlos después de todos modos, supongo que no tendría mucho que perder si le miento ahora.
        choices:
