            text: |-
              "Sí, es Barry," digo.

              "¿Barry?" pregunta el hombre, un poco sorprendido. "Ese es un nombre inusual para un mago."

              "Eso me han dicho."

              "Perdóname, no quería sonar grosero. Es solo que la mayoría de los magos que he conocido en el pasado han tenido nombres muy singulares. La mayoría de los padres que descubren que tienen un mago en la familia sienten la necesidad de presumirlo de cualquier manera que puedan, así que generalmente les dan nombres pretenciosos como Zalnir o Vasiroth. Es casi como una tradición. Pero darte un nombre tan común como Barry..."

              "Mis padres nunca han sido del tipo que sigue tradiciones."

              "Ya veo," dice el hombre, sonriendo, mientras extiende su mano hacia mí. "Mi nombre es Wilhelm. ¡Encantado de conocerte!"

              Le estrecho la mano al hombre, y sigue sonriéndome, con una expresión amistosa en el rostro.

              "Escucha," dice Wilhelm. "Sé que realmente no has tenido la mejor de las recepciones aquí en nuestra división, pero personalmente creo que no hay nada peor que tener una pelea con un compañero de equipo antes de un evento de vida o muerte como este. Solo quería que supieras que estoy de tu lado."
