  - name: b2_ch02a_deal
    texts:
      - source: scene_text
        paragraph: 45
        text: |-
          Hojeo las páginas de nuevo, tratando de adivinar qué criaturas es más probable que el dueño de la arena lance contra nosotros. Hay arpías, huargos, guivernos, sabuesos de tres cabezas, mamuts, arañas gigantes, águilas gigantes... La lista es interminable. Y no olvidemos que cada tipo de criatura tiene sus propias subcategorías que no pueden ignorarse, porque a veces son enormemente diferentes entre sí. Puedes tener arañas rojas, arañas verdes, arañas negras con manchas blancas e incluso arañas de diez patas, cada una con sus propios comportamientos y debilidades únicos.

          Ahora que lo pienso, Bruce mencionó que el dueño de la arena era aficionado a las criaturas peligrosas, pero ¿eso significa que también podría estar manteniendo monstruos de tipo humanoide aquí? La mayoría de la gente trata a los monstruos como si fueran todos criaturas sin mente, pero la realidad es un poco diferente. Los monstruos de la variedad humanoide son generalmente mucho más inteligentes que la criatura promedio. Algunos de ellos incluso están organizados en tribus y pueden comunicar información avanzada entre ellos a través de sus propios idiomas, aunque la mayoría de ellos no hablan el idioma común. Los ogros del fuerte eran un ejemplo de eso. Si tienen algún monstruo aquí que sea tan fuerte como el capitán ogro o el chamán, entonces podríamos tener una pelea infernal por delante.

          Mientras me siento en mi cama y leo, de repente escucho la voz de un hombre que viene de la ventana de mi celda.

          "Saludos," dice la voz.
      - source: scene_text_2
        paragraph: 25
        text: |-
          Me doy la vuelta para ver si puedo echar un vistazo al rostro del hombre, pero se está escondiendo detrás del muro fuera de mi celda.

          "¿Te conozco?" le pregunto.

          "No," dice la voz. "Pero escuché que había un compañero lessathi entre los prisioneros que fueron traídos aquí ayer por la noche, así que vine a hacerte una visita."

          "Un compañero lessathi, dices..." le digo.

          "Sí," dice la voz. "Estoy aquí para ofrecerte un trato. Normalmente no hacemos tratos con criminales, pero como eres un lessathi, creo que es justo darte una segunda oportunidad."

          Hace una pausa.

          "Continúa..." digo.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch02a_soundproof
  - name: b2_ch02a_soundproof
    routes:
      - condition: b2_ch1_interfere = 0
        texts:
          - source: scene_text
            paragraph: 46
            text: |-
              "Verás," continúa la voz, "no pudimos evitar notar que el rey de Thilias parece haber depositado una cantidad inusual de confianza en ti y en tus compañeros. Suficiente confianza como para invitaros a su sala secreta bajo el trono. Ese no es el tipo de invitación que se consigue fácilmente."

              Hace otra pausa para ver si tengo algo que decir. Espera unos segundos más y luego continúa donde lo dejó.

              "El trato que queremos ofrecerte es simple," dice la voz. "Todo lo que necesitas hacer es convencer al rey de que te deje entrar en su sala secreta de nuevo, mientras llevas uno de nuestros dispositivos."

              "¿Este dispositivo tuyo es una bomba, por casualidad?" le pregunto.

              La voz se ríe suavemente.

              "Por supuesto que no," dice. "Si quisiéramos asesinar al rey, te aseguro que habría métodos mucho más fáciles y sin riesgo para conseguirlo."
          - source: scene_text_2
            paragraph: 26
            text: |-
              "Entonces, ¿qué es lo que están tratando de hacer?"

              "Estamos tratando de interferir sutilmente con la forma en que funciona uno de los dispositivos del gnomo. Uno de los inventos del rey gnomo actualmente está haciendo que su sala secreta sea completamente insonorizada, lo que nos impide escuchar sus conversaciones privadas. Sin embargo, en este momento, no tenemos ningún agente en quien el rey confíe lo suficiente como para permitirle acceso a su sala secreta. Por eso acudimos a ti. No estamos pidiéndote que hagas esto gratis, por supuesto. Hay formas en las que podríamos hacer tus peleas aquí en la arena mucho más fáciles para ti. Todo lo que necesitas hacer es aceptar ayudarnos, y nosotros nos encargaremos del resto."
