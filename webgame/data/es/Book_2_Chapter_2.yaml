  - name: b2_ch02a_gems
    routes:
      - condition: ch10_gems = 1
        texts:
          - source: scene_text
            paragraph: 9
            text: |-
              Después de que Daren salió de la tienda, primero le dio a Kate su daga, y luego se detuvo frente a mí, con la mano extendida, como si esperara algún tipo de pago.

              "Serán diez monedas de oro," dice Daren. "Puedes pagarlas con dinero del Continente Occidental si quieres."

              "¿Me estás cobrando dinero?" le pregunto, un poco sorprendido.

              "Bueno, ¿qué esperabas?" dice Daren. "No es que me hayan dado todo ese acero élfico gratis, ¿sabes?"

              "¡Pero no le pediste dinero a Kate!" digo.

              "Eso es porque no la vi guardándose unas cuantas docenas de gemas caras en cierta fortaleza de ogros hace unos días," dice Daren. "Tú, por otro lado, deberías tener dinero de sobra."

              "Así que así es como es," digo, con una sonrisa.

              "Suéltalo," dice Daren, con la mano aún extendida.

              "Está bien, está bien," digo, mientras coloco diez monedas de oro en la palma de Daren, y luego recupero mi daga.
          - source: scene_text_2
            paragraph: 5
            text: |-
              Nos tomó unas dos horas más llegar del mercado a las arenas. Una vez que llegamos a nuestro destino, nos despedimos del sirviente del rey, y luego entramos en un pequeño edificio cerca de la arena que nos dijeron que era la 'oficina principal'. La habitación en la que entramos se parecía más al interior de una prisión que a una oficina, pero había un hombre sentado en un escritorio frente a nosotros, que parecía estar organizando unos papeles cuando entramos. El hombre no nos prestó atención hasta que terminó lo que estaba haciendo, y luego se levantó y nos saludó con un breve asentimiento.

              "Me dijeron que vendrían aquí esta noche," dice, en un tono desinteresado. "Solo tres de ustedes participarán, ¿verdad?"

              "Cuatro," dice Hadrik, con una amplia sonrisa, mientras le entrega su carta de admisión del rey al trabajador del escritorio.

              "Ya veo," dice el trabajador del escritorio, después de leer la carta. "Muy bien, entonces. Dado que soy el único que todavía está trabajando a esta hora tardía, tendré que pedirles que esperen pacientemente en este vestíbulo, mientras llevo a cada uno de ustedes a sus celdas individuales."
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch02a_cell
      - condition: ch10_gems = 0
        texts:
          - source: scene_text
            paragraph: 10
            text: |-
              "Espera, ¿no nos vas a pedir dinero?" Kate le pregunta a Daren, después de que nos devuelve a ambos nuestras dagas.

              "No, está bien," dice Daren. "El acero élfico realmente no era tan caro, y tengo dinero de sobra."

              Kate no parece creerle del todo, pero decide no insistir más en el asunto.

              Nos tomó unas dos horas más llegar del mercado a las arenas. Una vez que llegamos a nuestro destino, nos despedimos del sirviente del rey, y luego entramos en un pequeño edificio cerca de la arena que nos dijeron que era la 'oficina principal'. La habitación en la que entramos se parecía más al interior de una prisión que a una oficina, pero había un hombre sentado en un escritorio frente a nosotros, que parecía estar organizando unos papeles cuando entramos. El hombre no nos prestó atención hasta que terminó lo que estaba haciendo, y luego se levantó y nos saludó con un breve asentimiento.

              "Me dijeron que vendrían aquí esta noche," dice, en un tono desinteresado. "Solo tres de ustedes participarán, ¿verdad?"

              "Cuatro," dice Hadrik, con una amplia sonrisa, mientras le entrega su carta de admisión del rey al trabajador del escritorio.

              "Ya veo," dice el trabajador del escritorio, después de leer la carta. "Muy bien, entonces. Dado que soy el único que todavía está trabajando a esta hora tardía, tendré que pedirles que esperen pacientemente en este vestíbulo, mientras llevo a cada uno de ustedes a sus celdas individuales."
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch02a_cell
  - name: b2_ch02a_cell
    texts:
      - source: scene_text
        paragraph: 11
        text: |-
          "¿No podemos ir todos de una vez?" pregunta Hadrik.

          "No," dice el trabajador del escritorio. "El embajador de Ollendor insistió en que ninguno de ustedes debe conocer las ubicaciones de las celdas de los demás. También se aseguró de que cada uno de ustedes sea colocado en divisiones separadas, para que no puedan trabajar juntos durante los eventos de la arena."

          "¿Divisiones?" pregunta Daren, confundido.

          "Empezaremos con el lessathi," dice el trabajador del escritorio, ignorando a Daren.

          Camina hacia una puerta detrás de él y se da vuelta hacia mí.

          "Por aquí," dice.

          Echo un último vistazo a todos los demás y luego voy a seguir al trabajador del escritorio.

          "¡Buena suerte, Barry!" grita Flower, mientras me dirijo hacia la puerta. "¡Petal y yo estaremos animándote desde el público! ¡Y estoy segura de que Arraka también!"

          Una vez que la puerta se cierra detrás de mí, empiezo a caminar lentamente detrás del trabajador del escritorio, mientras ambos comenzamos a abrirnos camino por un muy largo tramo de escaleras. No intercambiamos ninguna palabra mientras atravesamos los oscuros pasillos debajo de las arenas. Con todos los giros y vueltas que tomamos, era difícil saber si todavía podría encontrar el camino de regreso por mi cuenta. Las antorchas dentro de los túneles subterráneos estaban tenuemente encendidas, y todas las puertas parecían iguales. Después de un largo período de silencio, el trabajador del escritorio finalmente decide hablar.
      - source: scene_text_2
        paragraph: 6
        text: |-
          "Actualmente hay dos celdas vacías en tu división," dice. "Celda número tres y celda número cinco. Están ubicadas en lados opuestos del área recreativa. No he recibido órdenes de colocarte en ninguna celda específica de las dos. ¿Cuál preferirías?"

          "No lo sé," digo. "¿Cuál es la diferencia entre las dos?"

          "No hay diferencia," dice el trabajador del escritorio, secamente.

          "¿Ninguna diferencia en absoluto?" pregunto.

          "Ninguna en absoluto."

          "Entonces, ¿por qué me pregunta?"

          "Le pregunto para que pueda tomar una decisión. Ahora elija. ¿Cuál será? ¿Celda número tres o celda número cinco?"
