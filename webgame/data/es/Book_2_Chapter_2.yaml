      - condition: strength < 2 AND combat_technique >= 3
        texts:
          - source: scene_text
            paragraph: 72
            text: |-
              La piedra golpea a la gárgola en la cabeza, pero el golpe no es lo suficientemente poderoso para matar al monstruo, y solo consigue enfurecerlo más. Lanzo otra piedra, pero esta vez la gárgola la atrapa con su mano derecha. Antes de que pueda encontrar una tercera piedra, todas las rejas de hierro se abren al mismo tiempo y las bestias lentamente empiezan a salir de sus celdas.

              La gárgola que golpeé con la piedra se lanza rápidamente hacia mí e intenta agarrarme por el cuello con su mano derecha.

              Anticipo su movimiento y me hago a un lado antes de que me alcance, clavándole mi daga encantada en el corazón. Las otras dos gárgolas intentan flanquearme, pero empujo el cadáver de su compañero muerto sobre una de ellas mientras me lanzo hacia la otra. Logro hacer una finta exitosa, fingiendo que estoy a punto de apuñalar a esta también en el corazón, pero cambio la dirección de mi estocada en el último momento y le abro el cuello a la gárgola con un movimiento rápido de mi daga.

              La última de las gárgolas intenta tomarme por sorpresa por detrás, pero nunca le quité el ojo de encima durante la pelea, así que supe exactamente cuándo agacharme y cuándo contraatacar. Asesté el golpe final con una puñalada en el ojo, y luego me di la vuelta para ver qué habían estado haciendo las demás bestias mientras estaba ocupado con las gárgolas.
