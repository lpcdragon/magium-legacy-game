  - name: b2_ch02a_slowly
    texts:
      - source: scene_text
        paragraph: 82
        text: |-
          Me levanto lentamente, tambaleándome un poco, para dar a las ratas la falsa impresión de que todavía estoy herido por la batalla. Las ratas gigantes se detienen a mirarme, sin saber qué hacer. No parecen cómodas atacándome mientras estoy de pie, pero tampoco parece que quieran retirarse.

          Sus pocos momentos de indecisión les cuestan caro, porque ahora los grifos finalmente les han prestado atención y corren a toda velocidad hacia su presa. El primer grifo en llegar se abalanza sobre una de las ratas y la remata con su pico. El resto de las ratas ahora se están dispersando, pero no son lo suficientemente rápidas para escapar de los grifos. Eventualmente, cada uno de los cuatro grifos logra matar al menos una de las ratas gigantes, y ahora todos están ocupados festejando con sus botines bien ganados, ignorando completamente el hecho de que todavía estoy aquí.

          No podría haber pedido un mejor giro de los acontecimientos. Los grifos están separados unos de otros y están completamente concentrados en comer sus comidas. ¡Todo lo que necesito hacer ahora es matarlos silenciosamente, uno por uno, y ni siquiera tendrán la oportunidad de atacarme!

          Mientras me acerco al grifo que está más cerca de mí con mi cuchillo en mano, no puedo evitar pensar que esta es probablemente la única oportunidad que tendré en mi vida de montar un grifo. Simplemente está ahí tumbado, sin prestarme atención. Todo lo que tendría que hacer es saltar sobre su espalda, y sería como un jinete de grifo de esas historias que solía leer cuando era niño. Quiero decir, tienen grifos encerrados aquí, así que seguramente los habrán domesticado lo suficiente como para que la gente los monte, ¿verdad?
      - source: scene_text_2
        paragraph: 43
        text: |-
          ¡No, no, no! ¡Esto es estúpido! ¿En qué estoy pensando? ¿Estoy tratando de que me maten?

          Intento sacarme estos pensamientos de la cabeza mientras me acerco al grifo y me preparo para atacar. El grifo está tumbado sobre su vientre, con sus garras delanteras sujetando a la rata muerta, mientras usa su pico para cortar la carne. Sigue ignorándome.

          Quizás no haría daño si simplemente me subiera a su espalda rápidamente. No es como si fuera a tener otra oportunidad como esta. Y si las cosas van mal, simplemente saltaré y lo mataré con mi daga. No hay nada que pueda salir mal si le doy un intento rápido, ¿verdad?
    choices:
      - position: 1
        text: Intentar montar al grifo
        effects:
          - set:
              current_scene: b2_ch02a_rider
      - position: 2
        text: Matar al grifo directamente
        effects:
          - set:
              current_scene: b2_ch02a_directly
  - name: b2_ch02a_rider
    routes:
      - condition: toughness >= 3
        texts:
          - source: scene_text
            paragraph: 83
            text: |-
              ¡Muy bien, allá vamos!

              Me agarro al pelaje del grifo y me subo a su espalda, pasando mi pierna derecha por encima para ponerme en posición de montar. En cuanto me subo, el grifo se pone de pie y empieza a batir sus alas violentamente, tratando de tirarme. Me aferro a su pelaje y de alguna manera logro no ser lanzado de su espalda, pero entonces el grifo gira su cabeza hacia mí y me ataca con su pico. Instintivamente salto hacia atrás para evitar el golpe, pero esquivar el ataque de la criatura me hace perder el equilibrio y caigo al suelo.

              Mientras intento levantarme, el grifo baja sus patas traseras sobre mí, y sus garras se hunden en mi pecho. Las garras atravesaron mi piel, pero no fueron lo suficientemente afiladas para pasar del músculo. Apuñalo a la criatura en la pata con mi daga, lo que hace que retraiga sus garras por el dolor, y luego rápidamente ruedo hacia un lado para ponerme de pie. No pierdo el tiempo y me lanzo hacia el grifo, abriéndole la garganta de un tajo y acabando con su vida para siempre.

              Bueno, supongo que ahora puedo decir que monté un grifo. Y también puedo decir con certeza que nunca volveré a intentar algo así.
          - source: scene_text_2
            paragraph: 44
            text: |-
              Un grifo que estaba comiendo cerca vio lo que le pasó a su compañero y ahora avanza lentamente hacia mí. Espero a que se acerque más, pero no le doy la oportunidad de atacar, y rápidamente lo apuñalo en el pecho con mi daga encantada. La bestia de repente deja de moverse y cae lentamente hacia el suelo, con una mirada vacía en su rostro.

              Una vez más, la información de mi cuaderno fue precisa. Si no hubiera leído esos diagramas detallados que explican la anatomía de los grifos ayer, nunca habría podido localizar la ubicación del corazón de este con tanta precisión. Ahora a encargarse de los otros dos.

              Los dos grifos restantes no parecieron prestar mucha atención a lo que les pasó a sus compañeros, y están demasiado ocupados disfrutando de sus comidas como para verme acercarme lentamente. Apuñalo al primero en la parte trasera del cuello mientras todavía estaba comiendo. El segundo ve lo que pasó e intenta ponerse de pie, pero reacciono rápido y lo apuñalo en el corazón, matándolo al instante.
        effects:
          - set:
              successful_checks:
                - '[ Comprobación de resistencia exitosa - nivel 3 ]'
              ac_b2_ch2_griffin: 1
            achievement:
              id: ac_b2_ch2_griffin
              title: Jinete de grifo
