  - name: b2_ch02a_tactical
    texts:
      - source: scene_text
        paragraph: 54
        text: |-
          Después de terminar de hablar con todos, volví a mi lectura y seguí haciéndolo hasta más tarde en la noche, cuando fui interrumpido por el crujido de una puerta y por el sonido de una voz familiar.

          "Adiós," escucho la voz desinteresada del empleado de escritorio viniendo del área de recreación, mientras una puerta se cierra de golpe.

          Inmediatamente me doy cuenta de lo que esto significa, y abro la puerta de mi celda para ver quién es el miembro más nuevo de nuestra división. El hombre que acaba de entrar en el área de recreación simplemente irradia energía mágica, y no hace ningún intento de ocultarla. Sin embargo, no parece ser uno de los participantes del torneo, porque estoy viendo una señal de advertencia sobre su cabeza diciéndome que no le haga daño. Debe ser uno de los magos locales. A juzgar por la expresión de su rostro, está claro que no vino aquí por voluntad propia, así que probablemente ha sido enviado aquí porque violó la ley varathiana de alguna manera. El mago me nota, pero no se molesta en reconocer mi presencia y va directamente a su habitación.

          El resto del día fue mayormente sin incidentes, excepto por una llamada de borracho que recibí de Hadrik por el transceptor, que insistía en pasarme a uno de sus compañeros de equipo, por la forma tan graciosa en que imitaba a un noble famoso del Continente Occidental.

          A la mañana siguiente, me despertó el mismo guardia del día anterior, diciéndome que había comenzado el período de recreación.
      - source: scene_text_2
        paragraph: 29
        text: |-
          "¡Arriba, arriba!" dice el guardia. "¡Es hora de recreación!"

          Abro la puerta de mi celda y comienzo a dirigirme hacia un área vacía de la sala de recreación, igual que ayer. Mientras camino, escucho a los dos matones de mi división hablando en voz alta a varios metros de mí, y me doy la vuelta para ver qué pasa. Parece que están hablando con Leila, mientras ella se apoya casualmente con la espalda contra la pared, observándolos en silencio.

          "Oye, princesa," dice uno de los matones. "¿Qué tal si nos llevas a los dos a tu habitación, como hiciste con el stillwater ayer?"

          "Sí," dice el otro matón. "Tenemos información táctica muy importante que nos gustaría discutir contigo."

          Leila sigue mirándolos sin decir nada. El primer matón que habló concluye que no estaba siendo lo suficientemente intimidante, así que ahora coloca ambas manos en la pared detrás de ella, mientras se inclina más cerca de su rostro.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch02a_knocks
  - name: b2_ch02a_knocks
    texts:
      - source: scene_text
        paragraph: 55
        text: |-
          "Escucha, princesa," dice el matón. "Puedes dejar el acto de silencio. Sé que me puedes entender. Así que más te vale espabilar y hacer lo que te digo, o si no te voy a hacer tanto daño que desearás que--"

          El matón no pudo terminar su frase, porque Leila decidió que ya había tenido suficiente y le dio un puñetazo en el estómago tan fuerte que el hombre cayó al suelo y empezó a retorcerse de dolor.

          "¡Perra!" dice el otro matón mientras saca su cuchillo, pero no tiene oportunidad de usarlo, porque una patada repentina de Leila lo envía volando contra una pared cercana.

          "¡Por los dioses, eso fue increíble!" escuchamos gritar a Bruce desde el otro extremo de la habitación.

          Se apresura hacia Leila y la agarra por ambos hombros. Leila parece un poco sorprendida, pero rápidamente se da cuenta de que no hay mala intención detrás de las acciones del hombre, así que no lo ataca.

          "¡Con esa fuerza, podrías acabar con un pequeño batallón tú sola!" dice Bruce con entusiasmo. "¿Cómo lograron capturarte?"

          De repente, Bruce se da cuenta de que se dejó llevar demasiado y suelta a Leila.

          "Lo siento," dice Bruce. "Sé que no te gusta hablar. Pero solo quiero que sepas que te cubro la espalda. Cuando sientas que estás en apuros en la arena, recuerda que puedes contar conmigo para ayudarte. Eso es todo lo que quería decir."

          Leila parece un poco confundida, pero asiente lentamente, en reconocimiento de sus palabras.
      - source: scene_text_2
        paragraph: 30
        text: |-
          "Muy bien, entonces," dice Bruce. "Estaré por allí si me necesitas."

          Luego se aleja de ella y vuelve a su extremo de la habitación.

          El matón que recibió el puñetazo en el estómago logró ponerse de pie y ahora se apresura hacia su compañero caído, que todavía no se ha despertado de su colisión con la pared. Finalmente, logra despertarlo, y luego ambos caminan hacia su rincón de la habitación, sin atreverse siquiera a mirar hacia Leila en su camino de vuelta.

          No pasó nada más durante el período de recreación de dos horas. El mago de ayer se aisló, como todos los demás, y no ha intercambiado una sola palabra con nadie. Habría esperado que Wilhelm le diera la bienvenida a la división, como hizo conmigo, pero parece que no lo consideró digno de la molestia.

          Después de que volvemos a nuestras celdas, voy a sentarme en mi cama y abro mi cuaderno. No mucho después de que empiezo a leer, escucho tres golpes suaves en mi puerta.

          "¿Quién es?" pregunto.

          No hay respuesta. Unos segundos después, hay tres golpes más en la puerta que son un poco más fuertes que los anteriores.
    choices:
      - position: 1
        text: Abrir la puerta.
        effects:
          - set:
              current_scene: b2_ch02a_open
              b2_ch2_upset: 0
      - position: 2
        text: Decirles que no voy a abrir la puerta hasta que me respondan.
        effects:
          - set:
              current_scene: b2_ch02a_answer
              b2_ch2_upset: 1
  - name: b2_ch02a_open
    texts:
      - source: scene_text
        paragraph: 56
        text: |-
          "Está bien, está bien, ya voy," digo mientras dejo mi cuaderno y me levanto de la cama.

          Cuando abro la puerta, me sorprende ver que mi visitante misterioso era, de hecho, Leila.

          "Oh, eres tú," digo.

          Leila no dice nada, pero veo su escritura azul formándose frente a ella, como de costumbre.

          "¿Puedes venir conmigo?" escribe Leila. "Hay algo que necesito mostrarte."

          "Claro," digo. "Déjame cerrar la puerta con llave."

          Después de terminar de cerrar la puerta con llave detrás de mí, sigo a Leila y nos dirigimos hacia su celda. Una vez que ambos estamos dentro de su habitación y ella cierra la puerta con llave, señala hacia la pared detrás de su cama, y su escritura azul aparece frente a ella una vez más.

          "Por favor, coloca tu mano en esa pared y dime si sientes algo especial," escribe Leila.

          Coloco mi mano en la pared, como ella dice, pero no siento nada.

          "¿Podrías darme algún tipo de pista?" digo. "¿Qué estoy buscando, exactamente?"

          "No intentes mirar," escribe Leila. "Necesitas sentirlo. Intenta concentrar tu sentido mágico en tu mano mientras tocas la pared, y entenderás a qué me refiero."

          Mientras hago lo que Leila dice, de repente me doy cuenta de que la pared de alguna manera está resonando perfectamente con mi aura mágica, y que está reaccionando directamente a mi toque.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch02a_passage
  - name: b2_ch02a_answer
    texts:
      - source: scene_text
        paragraph: 57
        text: |-
          "Si no me vas a responder, no voy a abrir la puerta," digo.

          Sigue sin haber respuesta. Después de una breve pausa, puedo escuchar tres golpes más en la puerta. Los ignoro y vuelvo a leer mi cuaderno. Al ver que ya no reacciono, mi visitante ahora ha pasado a golpear una vez por segundo, sin parar. Después de aproximadamente un minuto de golpes constantes, finalmente alcanzo mi límite y voy a abrir la puerta, dejando mi cuaderno en la cama.

          "¿Qué pasa?" grito, pero de repente me quedo en silencio cuando veo que la persona parada frente a mí no era otra que Leila.

          "Oh..." digo, mientras rápidamente entiendo por qué no estaba recibiendo respuesta antes.

          Leila me está mirando fijamente y parece bastante molesta. Sin decir una palabra, me agarra del brazo y empieza a tirar de mí hacia su habitación.

          "¡Espera, necesito cerrar la habitación con llave!" digo.

          Se detiene, pero no me suelta el brazo. Espera hasta que encuentro mi llave y cierro la puerta con llave, y luego empieza a tirar de mi brazo otra vez, sin mirarme.

          "¡Mira, lo siento!" digo. "Se me había olvidado que no podías hablar."
      - source: scene_text_2
        paragraph: 31
        text: |-
          Leila no da señales de haberme escuchado y sigue tirando de mí hasta que llegamos frente a su puerta. Entonces me suelta mientras busca en sus bolsillos la llave de su celda. Una vez que abre la puerta, me da la misma mirada molesta de antes y señala hacia su habitación.

          "Está bien, está bien, ya voy," digo mientras entro en su celda.

          Después de cerrar la puerta con llave, Leila me agarra del brazo otra vez y coloca mi mano izquierda en la pared detrás de su cama. Luego me mira directamente a los ojos, como si estuviera esperando algún tipo de reacción de mi parte.

          "¿Hay... algo especial en esta pared?" le pregunto, confundido.

          "Sí," escribe Leila, con su habitual texto azul.

          "Bueno, ¿puedes darme algún tipo de pista?" digo. "¿Qué estoy buscando, exactamente?"

          "No intentes mirar," escribe Leila. "Necesitas sentirlo. Intenta concentrar tu sentido mágico en tu mano mientras tocas la pared, y entenderás a qué me refiero."

          Mientras hago lo que Leila dice, de repente me doy cuenta de que la pared de alguna manera está resonando perfectamente con mi aura mágica, y que está reaccionando directamente a mi toque.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch02a_passage
  - name: b2_ch02a_passage
    texts:
      - source: scene_text
        paragraph: 58
        text: |-
          "Está bien, tienes razón," le digo. "Definitivamente hay más en esta pared de lo que se puede ver a simple vista. Pero no está haciendo nada. Aunque esté reaccionando directamente a mi toque, siento que todavía está esperando a que algo suceda."

          Leila asiente.

          "Eso es porque la pared en el lado opuesto de la habitación está hecha de la misma manera," escribe Leila. "Creo que estas paredes reaccionan directamente a nuestras auras lessathi, y que se supone que actúan como interruptores que necesitan ser presionados al mismo tiempo por dos lessathi diferentes."

          "¿Interruptores para qué?" pregunto.

          "Para abrir un pasadizo a las cavernas subterráneas debajo de estos túneles," escribe Leila. "He visto este tipo de interruptores antes, en otros edificios construidos por lessathi. Siempre abren pasajes secretos. Y he oído que las cavernas debajo de nosotros son donde el dueño de la arena tiene a todas las criaturas encerradas. Si pudiéramos echar un vistazo rápido, al menos sabríamos a qué nos vamos a enfrentar. O mejor aún, podríamos sabotear todo el espectáculo, matando a las criaturas una por una mientras están en sus jaulas, en lugar de luchar contra todas a la vez en la arena."

          "Eso sí que suena tentador," digo. "Pero ¿y si nos atrapan? ¿No podrían descalificarnos por hacer trampa?"

          "No hay reglas que digan que no podemos matar a las criaturas antes de que comience el evento de la arena," escribe Leila. "Sin embargo..."
      - source: scene_text_2
        paragraph: 32
        text: |-
          Leila hace una pausa.

          "¿Sin embargo, qué?" pregunto.

          "Sin embargo," continúa Leila, "las reglas de la arena sí establecen que la seguridad de los participantes no está garantizada fuera del área designada para su división."

          "Entonces, lo que estás diciendo es que si nos atrapan en el acto, pueden soltar a todas sus bestias sobre nosotros sin ninguna restricción."

          Leila asiente.

          "Podemos ir a echar un vistazo," escribe Leila, "y si vemos que hay demasiados guardias, volvemos a nuestras celdas."

          Me detengo un momento a pensar.

          "De acuerdo," digo. "Echaremos un vistazo y luego decidimos."

          Leila asiente de nuevo. Luego va al otro extremo de la habitación, cerca de la puerta, extendiendo su mano hacia la pared.

          "¿Estás listo?" escribe.
