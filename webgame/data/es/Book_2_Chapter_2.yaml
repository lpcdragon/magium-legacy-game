        texts:
          - source: scene_text
            paragraph: 32
            text: |-
              "Sí, eso sería lo principal," digo.

              "¿Pero por qué atacar a un noble?" dice la escritura azul en el aire. "¿No sabías lo peligroso que sería atacar a un noble en Varathia, y mucho menos matar a uno?"

              "Sí lo sabíamos," digo. "Pero estábamos intentando liberar a un esclavo. Y de todas formas, ese bastardo se lo merecía."

              La escritura desaparece de nuevo, pero esta vez hay una breve pausa antes de que aparezca el siguiente texto.

              "No parece que te gusten mucho nuestros nobles, ¿verdad?" dice la escritura.

              "Oh, los odio con toda el alma," digo.

              La chica sonríe. Es la primera vez que veo un cambio real en su expresión facial.

              "Ya veo," dice la escritura. "Por favor, permíteme presentarme, mi nombre es Leila, y también fui traída aquí porque intenté liberar a un esclavo de un noble."

              La chica luego extiende su mano hacia mí.

              "Soy Barry," digo, mientras le estrecho la mano. "¡Encantado de conocerte!"

              "Barry, tengo un favor que pedirte," dice la escritura. "¿Podríamos continuar nuestra conversación dentro de mi celda? Hay algo más que quiero preguntarte, y preferiría hacerlo en privado."
