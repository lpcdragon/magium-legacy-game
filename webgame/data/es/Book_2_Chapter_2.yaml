            paragraph: 37
            text: |-
              "Mencionaste que tuviste que esperar hasta poder maximizar tu fuerza, velocidad y técnica de combate, y que tu nivel máximo actual es tres," digo. "¿Pero eso no significaría que solo tenías nueve puntos de estadísticas disponibles hasta ayer?"

              "Sí, y todavía los tengo," escribe Leila. "Esa es la razón por la que quería hablar contigo en privado. Cuando vi por primera vez lo rápido que estaba ganando mis puntos de estadísticas hace una semana, me quedé asombrada, pero eso fue solo porque no sabía del torneo. Aparentemente, había sido anunciado muchas veces en los últimos meses, pero es fácil perderse este tipo de anuncios cuando vives principalmente en las afueras de la ciudad, para evitar ser detectada. Fue ayer por la tarde, cuando el rey gnomo anunció los objetivos de la primera ronda, que me enteré por primera vez del torneo. Esto me hizo darme cuenta de cuánta energía mágica realmente hay a nuestro alrededor. Habría esperado que el potenciador de estadísticas recopilara mucha más energía, dadas estas circunstancias. Lo que quería preguntarte era esto: ¿Cuántos puntos pudiste gastar en tus estadísticas hasta ahora?"

              "Diecinueve puntos," le respondo.

              "¿Diecinueve?" escribe Leila, luciendo algo conmocionada.

              Hace una pausa.

              "Entonces supongo que mi suposición era correcta," escribe Leila. "Realmente es más difícil para un potenciador de estadísticas recopilar energía dentro de esta ciudad."
