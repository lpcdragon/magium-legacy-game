              "Escucha," dice. "Vi que estabas hablando con Wilhelm anoche, después de tu pelea conmigo, así que quería darte una advertencia."

              "¿Una advertencia?" digo.
          - source: scene_text_2
            paragraph: 14
            text: |-
              "Sí," dice Bruce. "Sobre Wilhelm. Puede parecerte un tipo normal, pero en realidad es un asesino entrenado. Puedo notarlo por la forma en que se mueve y habla. Nunca se puede confiar en estos tipos de asesinos. No son guerreros de verdad como tú y yo. La única forma en que saben pelear es apuñalando a la gente por la espalda. ¡Deberías tener cuidado con él. No creas nada de lo que dice!"

              "Vaya," digo. "Es bueno saberlo. Lo tendré vigilado. ¡Gracias!"

              "Solo asegúrate de no dejarte matar antes de la arena," dice Bruce. "Eres el único aparte de mí que realmente puede pelear en esta maldita división."

              Bruce luego me da una palmada en el hombro y vuelve a donde estaba al principio. Justo cuando estaba a punto de ir a buscar ese libro, es ahora Wilhelm quien se me acerca, con una mirada decidida en el rostro.

              "Escucha," dice Wilhelm. "No estoy seguro exactamente de qué estabas hablando con Bruce, pero deberías tener cuidado con él."

              "¿Debería?" le pregunto.

              "Sí," dice Wilhelm. "Ya viste cómo te trató anoche. Es el tipo de persona que le gusta actuar antes de pensar, y estos tipos de individuos siempre son peligrosos. Puede actuar amistosamente contigo ahora, pero quién sabe qué hará mañana. Cuando estás frente a brutos impredecibles que prefieren confiar en sus puños en lugar de su razón, nunca puedes saber cuándo se volverán contra ti."
          - source: scene_3
            paragraph: 4
            text: |-
              "Qué amable," le digo. "Pero tengo la sensación de que no es de esto de lo que viniste a hablarme, ¿verdad?"

              "No, no lo es," dice Wilhelm. "Lo que quería decirte es que, por lo que he escuchado, en unas horas, el embajador y el dueño de la arena deberían estar discutiendo asuntos importantes sobre la organización de los eventos de la arena. Los guardias de este lugar tienen la costumbre de escuchar este tipo de conversaciones y generalmente les gusta discutirlas entre ellos. Asegúrate de prestar mucha atención a lo que dicen cuando estén fuera de tu celda. Yo haré lo mismo."

              "Ya veo," digo. "Lo tendré en cuenta."

              "Muy bien," dice Wilhelm. "Eso es todo lo que quería decirte. Me aseguraré de avisarte si escucho algo. Espero que tú hagas lo mismo."

              "Por supuesto," digo.
