            paragraph: 18
            text: |-
              Me aparto de su puño, luego agarro su brazo y se lo retuerzo detrás de la espalda. El hombre cae de rodillas por el dolor, e intenta con todas sus fuerzas no gritar, mientras sigo doblándole el brazo hacia atrás.

              "¿Te rindes?" le pregunto al hombre corpulento, mientras sigo tirando de su brazo.

              El hombre no dice nada, mientras sigue luchando por soportar el dolor.

              "¿Te rindes?" le pregunto de nuevo, más fuerte, mientras le retuerzo el brazo más violentamente.

              Esta vez, el hombre corpulento no pudo contenerse más, y soltó un grito.

              "¡Sí, maldito seas!" grita. "¡Me rindo! ¡Me rindo!"

              Mientras suelto su brazo, el hombre retrocede de mí e intenta recuperar la compostura.
          - source: scene_text_2
            paragraph: 9
            text: |-
              "Quizás te subestimé, stillwater," dice, mientras el sudor le gotea de la frente. "Quizás puedes pelear incluso sin tu magia. Pero va a tomar más que unas pocas técnicas de artes marciales para salir de esa arena con vida."

              "No te preocupes," digo. "¡También tengo algunos otros trucos bajo la manga!"

              "Ya veremos," dice el hombre corpulento, y luego se da la vuelta y se dirige hacia su celda.

              De las cuatro personas que estaban observando nuestra pelea, dos ahora regresan a sus celdas, una se dirige hacia mí, y la última todavía está de pie junto a la puerta, observándome atentamente. El que se dirige hacia mí es un hombre de aproximadamente mi edad, que lleva el pelo recogido en una coleta, y que tiene una forma de sonreír que me recuerda a Eiden. La que se quedó junto a la puerta, observándome, es una chica de largo cabello plateado, que no parece tener más de veinte años.

              El hombre de la coleta se detiene frente a mí y sonríe cortésmente.

              "Veo que pudiste defenderte contra Bruce incluso sin tu magia," dice. "¡Impresionante! No muchos se atreverían a enfrentarlo de frente como acabas de hacer. ¿Puedo preguntarte tu nombre?"
