          - source: scene_text
            paragraph: 63
            text: |-
              "Oye, esto no está nada mal," le digo a Leila mientras las dos hacemos lo posible por calentarnos junto al fuego. "¡Para un fuego rápido improvisado que encendimos con pedernal y musgo, diría que nos fue bastante bien!"

              Leila asiente.

              Luego se da la vuelta hacia el fuego, tratando de secarse el pelo sin quemárselo.

              "Sabes, siempre he querido preguntarte," digo mientras la veo secarse el pelo. "¿El plateado es tu color de pelo natural? Nunca había visto a nadie con pelo plateado antes, pero de nuevo, no puedo decir que haya conocido a muchos lessathi en mi vida."

              Leila no me responde y simplemente mira al frente por un rato. Es difícil distinguir qué expresión tiene en su rostro, por el pelo que le cubre los ojos.

              "¿Es algo de lo que no quieres hablar?" digo.

              "No, está bien..." escribe Leila.

              Hace una pausa.

              "¿Has oído hablar del Faro de Esperanza?" escribe.

              "Si te refieres al orfanato que estaba experimentando con la creación de magos artificiales, entonces sí, he oído hablar de él," digo. "¿Eras una de las lessathi que trabajaban allí?"
          - source: scene_text_2
            paragraph: 35
            text: |-
              Leila niega con la cabeza.

              "No," escribe. "Yo era uno de los experimentos fallidos. La razón por la que mi pelo es plateado es porque fue perdiendo su color gradualmente, como efecto secundario de los varios años en que experimentaron conmigo, tratando de convertirme en maga. Mi pelo solía ser negro azabache."

              "Oh, dioses," digo. "¿Es esta también la razón por la que perdiste tu voz?"

              "No," escribe Leila. "Nací así. Y me hicieron pasar un infierno por ello. No recuerdo mucho de cuando era pequeña, pero sí recuerdo lo que los otros lessathi solían decir de mí. Decían que yo no era una de las suyas de verdad. Decían que los lessathi son una raza pura que no puede tener defectos de nacimiento, y sospechaban que la razón por la que nací muda era porque en realidad era medio lessathi, lessathi solo a medias. Creo que incluso la persona que alguna vez solía llamar mi padre tenía dudas sobre mí. Nunca pareció considerarme su verdadera hija, y siempre culpaba a mi madre por morir y dejarlo a cargo de su hija. Probablemente por eso no lo pensó dos veces cuando le preguntaron si alguno de los lessathi que trabajaban en el Faro estaba dispuesto a ofrecer a sus hijos como voluntarios para la experimentación."

              "Espera, acabas de decir que solías llamarlo tu padre," digo. "Pero dijiste ayer que la razón por la que te trajeron aquí fue porque salvaste a tu padre de la esclavitud. Esta persona que salvaste... ¿es alguien diferente de tu padre biológico?"
