  - name: b2_ch02a_transceivers
    routes:
      - condition: hearing >= 3
        texts:
          - source: scene_text
            paragraph: 52
            text: |-
              No mucho después de que el lessathi se va, empiezo a escuchar algunas voces en un pasillo distante fuera de mi celda. Reconozco una de las voces como la del guardia que me despertó esta mañana.

              "Oye, ¿te enteraste de la reunión de esta mañana?" dice el guardia.

              "¿La del dueño y el embajador?" dice la otra voz.

              "Sí," dice el guardia. "Escuché que van a sacar al minotauro en la segunda ronda."

              "¿El minotauro?" pregunta la otra voz, conmocionada. "¿Te refieres al campeón invicto de la arena?"

              "El único e inigualable," dice el guardia. "Y también escuché que van a usar los escorpiones gigantes y las manticoras para la primera ronda."

              "¿Y la tercera ronda?" dice la otra voz. "¿Seguirá habiendo duelos entre los gladiadores?"

              "Sí, los supervivientes tendrán que luchar entre ellos en duelos uno contra uno al final," dice el guardia. "Pero nadie espera que ninguno de ellos pase de la primera ronda."

              La última frase fue apenas audible, ya que los guardias se alejaban cada vez más de mí mientras hablaban. Lo último que escucho de ellos es el estruendo de sus risas, mientras sus voces se desvanecen por completo.
          - source: scene_text_2
            paragraph: 28
            text: |-
              Escorpiones y manticoras, ¿eh? Menos mal que tengo notas extensas escritas sobre ellos en mi cuaderno. Al menos no entraremos completamente desprevenidos.

              Pasé el resto de la tarde leyendo mis notas. Cuando me apetecía tomarme un descanso, llamé a Daren, Kate y Hadrik a través de los transceptores para saber cómo les iba. Daren me dijo que no soportaba a ninguno de sus compañeros de equipo, y que todos eran mercenarios cobardes que habían venido aquí para ganar dinero fácil. Kate dijo que casi mató a uno de sus compañeros de equipo durante el período de recreación, y que solo se detuvo cuando descubrió que estaba en contra de las reglas. Nadie había intentado buscarle pelea desde entonces.

              Hadrik parecía estar un poco mejor. Por lo que me contó, ya había convertido a la mayoría de sus compañeros de equipo en sus compañeros de copas, y pasaban mucho más tiempo en el área de recreación que las dos horas diarias que se les exigía.

              También me aseguré de contarles a mis amigos todo lo que había escuchado de los dos guardias antes, así como las debilidades y comportamientos de cada tipo de escorpiones y manticoras que conocía. Con suerte, esta información les ayudará de alguna manera.
        effects:
          - set:
              b2_ch2_heard: 1
              successful_checks:
                - '[ Comprobación de audición exitosa - nivel 3 ]'
        choices:
