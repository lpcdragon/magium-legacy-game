    routes:
      - condition: b2_ch2_kate = 1
        texts:
          - source: scene_text
            paragraph: 67
            text: |-
              "Acabo de darme cuenta de que nunca te dije por qué sabía del Faro de Esperanza," digo. "¿Recuerdas haber conocido a una chica llamada Kate mientras estabas en el orfanato?"

              Leila asiente.

              "La recuerdo," escribe Leila. "Siempre solía pasar el tiempo con los hermanos elementalistas que más tarde se convirtieron en parte de la fuerza de élite de los lessathi. Escuché que la enviaron a morir a una jungla lejana junto con todos los demás huérfanos, después de que cerraron el Faro..."

              "Bueno, tu información no es incorrecta, pero creo que puede haberte llevado a algunas conclusiones equivocadas," le digo. "Kate no está muerta. Sobrevivió. ella fue quien me contó sobre el Faro de Esperanza."

              "¿Sobrevivió?" escribe Leila, mientras su rostro de repente se ilumina de alegría.

              "Sí," digo. "Conocí a Kate aquí, en el torneo, y actualmente estoy viajando con ella. ¿Te gustaría verla?"

              La expresión alegre en el rostro de Leila lentamente es reemplazada por una de tristeza, mientras mira hacia otro lado.

              "No creo que ella quiera verme," escribe Leila. "Me tenían en una celda separada de los demás en el orfanato, y nunca pudimos hablar mucho. Además, no creo que quiera encontrarse con una lessathi como yo, después de todo lo que ha pasado a manos de los lessathi del orfanato."
          - source: scene_text_2
            paragraph: 39
            text: |-
              "¡Oye, no puedes saber eso hasta que le preguntes!" digo. "Yo también soy lessathi y sigo siendo su amigo, ¿recuerdas?"

              Leila no responde y sigue mirando hacia otro lado, como antes.

              "Muy bien, entonces," digo mientras me levanto del suelo. "¡Está decidido! En cuanto salgamos de aquí, la llamaré por el transceptor y organizaremos un encuentro entre ustedes dos. ¡En marcha! Tu ropa ya debería haberse secado, ¿no?"

              Leila asiente con vacilación mientras agarra mi mano y la ayudo a levantarse. Dejamos el fuego atrás y nos dirigimos hacia los túneles más allá de la cabaña de madera. Durante los siguientes veinte minutos más o menos, caminamos en silencio a través de las cavernas subterráneas, usando un palo largo que había conseguido de la cabaña para probar el suelo en busca de trampas. En las áreas que estaban completamente oscuras, tuvimos que depender de nuestros dispositivos de estadísticas para iluminar el camino frente a nosotros, pero afortunadamente los cristales azules brillantes que habíamos visto antes también estaban esparcidos por estos túneles, incrustados en las paredes, así que no tuvimos que preocuparnos por la iluminación la mayor parte del tiempo.
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch02a_creatures
