  - name: b2_ch02a_outcasts
    texts:
      - source: scene_text
        paragraph: 36
        text: |-
          "¿Hay alguna otra regla estándar de la arena que deba conocer?" pregunto.

          "Sí," escribe Leila. "La magia y las armas a distancia no están permitidas en la arena, y tampoco los objetos que puedan lanzar hechizos. Pero no te preocupes, tu potenciador de estadísticas no cuenta como un objeto que lanza hechizos. Los detectores de magia de la arena lo ignorarán."

          La chica se ríe cuando ve la expresión en mi rostro. Incluso su risa es silenciosa.

          "Sí, sé lo de tu dispositivo de estadísticas," escribe Leila, mientras sonríe.

          "¿Cómo?" le pregunto.

          Leila saca un pequeño objeto de su bolsillo y me lo muestra. Es un dispositivo de estadísticas, igual que el mío.

          "Verás, mi potenciador de estadísticas es un poco especial," escribe Leila. "No solo me permite transformar mis pensamientos en palabras escritas a voluntad, sino que también me permite saber cuándo hay otros dispositivos de estadísticas en mi área. Mi padre es quien hizo estas modificaciones. Cuando llegaste aquí, casi me creí tu historia de stillwater, pero cuando vi que traías un potenciador de estadísticas contigo, supe de inmediato que eras un lessathi. No habría tenido sentido llevar un dispositivo así contigo, a menos que fueras parte de la única raza para la que fue diseñado."

          "Pero lo mismo aplica para ti también, ¿no?" le pregunto, empezando a finalmente entender lo que está pasando. "Lo que significa que tú también eres una lessathi."

          Leila asiente.
      - source: scene_text_2
        paragraph: 21
        text: |-
          "Entonces, ¿cómo es que estás aquí, en esta arena?" digo. "Tenía la impresión de que los lessathi tienen un estatus más alto que la nobleza en este continente. ¿No puede tu padre simplemente mover algunos hilos para que te liberen?"

          Leila mira al suelo durante unos segundos, antes de que aparezca su nuevo texto.

          "Mi padre y yo somos marginados," escribe. "No nos tratan de la misma manera que a los otros lessathi. Hemos estado escondiéndonos durante años, pero hace unos meses mi padre fue vendido a un noble y convertido en esclavo. La razón por la que estoy aquí es porque me atraparon ayer, poco después de que logré rescatarlo."

          "Ya veo," digo.

          "Después de que lo esclavizaron, nunca pensé que volvería a verlo," escribe Leila. "Pero hace una semana, cuando comenzó el torneo y empecé a recibir mis primeros puntos de estadísticas, finalmente sentí que tenía una oportunidad de liberarlo. Esperé hasta poder mejorar mis estadísticas de velocidad, fuerza y técnica de combate a su nivel máximo de tres, y luego derroté sola a todos los guardias que custodiaban a mi padre. Solo desearía haber esperado hasta poder invertir un poco en resistencia también..."

          Leila luego me muestra los moretones en sus brazos y piernas.
      - source: scene_3
        paragraph: 7
        text: '"Después de liberar a mi padre," continúa Leila, "le hice prometer que, incluso si me capturaban, iría a Ollendor sin mí, y me esperaría allí. Ollendor es la única ciudad restante de Varathia donde los lessathi no tienen poder. En Ollendor, estaríamos a salvo de ellos. Pero los guardias de la ciudad me atraparon antes de que pudiera salir de la ciudad. Los contuve hasta que mi padre pudo escapar, pero ya estaba debilitada por la batalla anterior, y no pude vencerlos a todos. Al final, me ataron y me enviaron aquí. Llegué a esta celda ayer por la tarde, poco antes de que tú hicieras tu aparición."'
