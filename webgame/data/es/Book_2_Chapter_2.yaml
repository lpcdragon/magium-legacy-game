              "Ya veo," digo. "Lo tendré en cuenta."

              "Muy bien," dice Wilhelm. "Eso es todo lo que quería decirte. Me aseguraré de avisarte si escucho algo. Espero que tú hagas lo mismo."

              "Por supuesto," digo.
