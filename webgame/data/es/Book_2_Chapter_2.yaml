  - name: b2_ch02a_better
    texts:
      - source: scene_text
        paragraph: 43
        text: |-
          "¿Qué quieres decir? ¡Por supuesto que sabía que el dispositivo funciona mejor para los lessathi!"

          Leila empieza a reírse silenciosamente, tapándose la boca con la mano.

          "Eres un pésimo mentiroso," escribe Leila. "Tu aura se pone toda puntiaguda cuando no dices la verdad."

          "¿Mi aura se pone... puntiaguda?" pregunto.

          "¡No puedo creer lo loco que estás!" escribe Leila, mientras sonríe. "¡Nadie en su sano juicio pensaría siquiera en intentar engañar su camino a través de un torneo como este! Ahora entiendo por qué pareces tan tranquilo, incluso después de haber escuchado lo que el dueño de la arena está preparando para nosotros. Esto es simplemente otro día normal para ti, ¿verdad?"

          "Bueno, no sé si llegaría tan lejos como para llamarlo normal," digo. "Esta es solo la tercera vez que me meten en una prisión desde que llegué a Varathia. Todavía hay margen de mejora."

          "¡Oigan, ustedes dos!" escucho a un guardia gritándonos desde la ventana de la celda de Leila. "Pueden tener todas las conversaciones privadas que quieran en su tiempo libre. Este es el período de recreación. ¡Vuelvan afuera!"

          "¡Sí, señor!" digo, y ambos nos dirigimos de vuelta al área recreativa.

          Una vez afuera, ambos volvemos a nuestras posiciones originales, sin decirnos otra palabra. Ya habíamos dicho lo que necesitábamos decir, y no había razón para darle a Wilhelm más oportunidades de espiar nuestras conversaciones.
      - source: scene_text_2
        paragraph: 24
        text: |-
          El resto del período de recreación transcurrió en silencio. No teníamos nada que discutir sobre las próximas peleas, y nadie parecía estar de humor para charla ociosa. Como no podíamos simplemente quedarnos parados sin hacer nada durante dos horas, cada uno intentó encontrar algo en qué ocupar el tiempo. Bruce empezó a hacer flexiones, Wilhelm eligió afilar su daga, yo pasé mi tiempo leyendo de mi cuaderno y los dos matones decidieron jugar a los dados. Leila parecía ser la única contenta con simplemente quedarse ahí, contemplando una pared vacía frente a ella hasta que el período de recreación terminó.

          Tan pronto como el período de recreación terminó, todos volvimos tranquilamente a nuestras celdas. Continué leyendo de mi cuaderno durante unas horas más después de dejar el área recreativa. He estado leyendo mis notas sobre varias criaturas que he encontrado en mis estudios, pero hay tantas que es difícil memorizar toda la información de memoria.

          Todavía recuerdo el día en que encanté este cuaderno. Fue el día en que decidí comenzar mi viaje alrededor del mundo, con la esperanza de encontrar una forma de convertirme en mago. El encantamiento me costó una fortuna, pero seguía siendo mucho más barato que encantar una mochila, y era más que suficiente para mis intenciones y propósitos. Un bloc de notas con un número infinito de páginas. ¿Había alguna otra herramienta que pudiera haberme servido mejor en mi búsqueda de conocimiento?
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch02a_deal
