  - name: b2_ch09a_dismantling
    texts:
      - source: scene_text
        paragraph: 22
        text: |-
          "Pero yo no... tengo tienda...", dice Melindra con la misma voz somnolienta. "Te dije que olvidé..."

          "Hablo de una de las tiendas de Daren", digo. "He hablado con él y accedió a prestarte una por esta noche."

          "¿Lo hizo?", dice Melindra, esta vez abriendo de verdad los ojos.

          "Sí, ahora ve a dormir allí", digo. "Daren te enseñará dónde está."

          "Vale, vale...", dice Melindra, levantándose y preparándose para salir de la tienda. "Ya voy."

          En cuanto Melindra sale, vuelvo a entrar en mi tienda, cierro la cremallera detrás de mí y me quedo dormido casi en cuanto apoyo la cabeza en la almohada.

          Cuando me despierto a la mañana siguiente con el sonido de la gente desmontando sus tiendas, veo que apenas entra luz del exterior a través de la mía. Al abrir la cremallera, me doy cuenta de que eso se debe a que el cielo está actualmente cubierto de nubes oscuras y no se ve ni el más mínimo atisbo del sol, a pesar de que ya debe de haber salido hace al menos una hora. Parece que la mayoría de los demás ya se han despertado y, presumiblemente, ya han desayunado.
      - source: scene_text_2
        paragraph: 19
        text: |-
          No mucho después de salir de mi tienda, Melindra viene corriendo hacia mí con una expresión inusualmente seria en la cara.

          "Escucha", dice Melindra, deteniéndose frente a mí. "No pretendía echarte anoche de tu propia tienda."

          "Sí, ya lo sé", digo. "No pasa nada."

          "¡No, sí pasa!", dice Melindra. "¡Lo único que quería hacer era colarme en silencio en tu tienda, dormitar unas horas y luego largarme sin que nadie se diera cuenta! ¡No quería montar todo este alboroto!"

          "¿Y qué?", le pregunto, confundido. "Conseguiste tu tienda, ¿no?"

          "¡Sí, pero ese no es el punto!", dice Melindra. "¡El punto es que no quería causarte tantos problemas precisamente cuando eras tú quien me estaba ayudando!"

          "Huh...", digo, dedicándole una mirada larga y pensativa. "Así que SÍ eres capaz de que te importen los demás, entonces..."

          Hago una pausa un segundo antes de continuar.

          "Pero si ese es el caso, ¿por qué eliges comportarte como lo haces?", digo.

          "¿De qué estás hablando?", dice Melindra.
    choices:
