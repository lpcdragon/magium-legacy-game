              En cuanto llego al tocón, me siento, saco el cuaderno de la mochila y empiezo a leer.

              "¿Qué estás leyendo?", me pregunta Melindra no mucho después de que empiezo a estudiar.

              "Unas notas que escribí hace mucho sobre algunos hechizos...", le digo sin levantar la vista del cuaderno.

              "¿Ah?...", dice Melindra. "Qué interesante."

              Entonces la oigo darle un mordisco a algo crujiente, lo que llama mi atención y hace que gire la vista hacia ella. Melindra está delante de mí comiendo unas galletas de un paquete que me resulta inquietantemente familiar.

              "Melindra, ¿de dónde has sacado ese paquete de galletas?", le pregunto.
          - source: scene_text_2
            paragraph: 38
            text: |-
              "¿Oh, esto?", dice Melindra con una sonrisa ladeada. "Pues lo saqué de tu mochila, ahí al lado. Como vi cuánto las disfrutabas antes, me entraron ganas de probarlas también. Tu mochila estaba desprotegida y sin vigilancia, así que supuse que no te importaría si me servía unas cuantas de tus galletas."

              Suelto un suspiro.

              "No me digas que todavía estás intentando vengarte de mí por no dejarte dormir en la tienda...", digo. "¿No podemos simplemente poner fin a esta disputa y seguir adelante?"

              "¡Claro que sí!", dice Melindra. "En cuanto te disculpes por lo que has hecho, estaré encantada de declarar una tregua."
