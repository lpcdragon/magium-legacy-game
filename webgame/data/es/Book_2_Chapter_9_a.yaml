        paragraph: 40
        text: |-
          "¡Se acabó!", grita Daren, furioso. "¡Esto zanja el asunto! Ahora mismo no estás en condiciones de caminar por un campo de batalla. Ni siquiera estás en condiciones de prestar atención a lo que te rodea. Has estado a menos de un segundo de morir, Barry. ¿Lo entiendes? La próxima vez no tendrás tanta suerte. Vas a dejar que Melindra te lance ese maldito hechizo energizante, y punto. ¡Se acabaron las excusas!"

          "Sí...", digo. "Creo que tienes razón. Eso ha estado demasiado cerca... Melindra, puedes lanzarme el segundo hechizo energizante cuando quieras."

          Al oír mis palabras, Melindra se me acerca, pronuncia un encantamiento y apunta hacia mí con las manos. En cuanto termina, siento cómo desaparecen el dolor de cabeza, las náuseas y la sensación de fatiga. Sin embargo, por alguna razón, no me siento ni de lejos tan lleno de energía como la primera vez que me lanzó el hechizo.

