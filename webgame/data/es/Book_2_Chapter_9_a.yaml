  - name: b2_ch09a_buddies
    texts:
      - source: scene_text
        paragraph: 28
        text: |-
          "¿Un hechizo?", pregunta Daren. "¿Aquí, en esta zona? Pero no noto nada."

          "Es uno de los hechizos de Eiden", dice Melindra. "Está diseñado para seguir oculto ante la gente que no tiene un sentido mágico lo bastante agudo. Puedo saber por la firma del aura que lo lanzó él, pero no puedo decir para qué se supone que sirve. Debe de ser algún tipo de hechizo diseñado por él mismo, aunque no lo conozco."

          "Ah, sí, recuerdo haber visto este hechizo en muchos otros sitios durante la última semana", dice Arraka. "Eiden debe de haberlo estado lanzando por todo el continente desde que volvió aquí. Y probablemente siga haciéndolo ahora mismo, mientras hablamos. Lanzar hechizos complicados como estos requiere mucho tiempo y concentración."

          "¿Pero qué hace?", pregunta Kate.

          "¿Y yo qué voy a saber?", dice Arraka. "No es como si fuera una investigadora de hechizos. No puedo saber lo que hace un hechizo tan complejo solo con mirarlo. Pero hay una cosa que sí puedo decir con certeza, y es que el hechizo está esperando a que algo lo active. Sea lo que sea."
      - source: scene_text_2
        paragraph: 22
        text: |-
          "¿Podría tener esto algo que ver con esa calamidad de la que habló Eiden?", pregunta Hadrik. "O quizá con los lessathi. Tal vez todos sean bombas, preparadas para explotar cuando detecten a un lessathi cerca."

          Al oír eso, Leila da de repente unos pasos atrás, alejándose de la zona que Melindra está inspeccionando.

          "Quiero decir", continúa Hadrik, "creo que ya está bastante claro que Eiden y los lessathi no son precisamente mejores amigos. Le dijo a Barry que les entregara ese mensaje amenazante y, por lo que tengo entendido, mató a un montón de ellos durante el invierno inmóvil, así que tampoco es que necesitara una razón especial para matar a más ahora."

          "¿Qué demonios estás diciendo?...", dice Melindra, mientras sigue concentrada en analizar el hechizo oculto. "Eiden nunca mató a ningún lessathi durante el invierno inmóvil. Se puso de su lado..."

          "¿Hizo qué?...", pregunta Hadrik.

          "Oh...", dice Melindra, dándose cuenta de repente de lo que acaba de hacer. "No creo que debiera haberles contado eso."

          "Espera, entonces ¿Eiden luchó contra los stillwaters durante el invierno inmóvil?", dice Daren.

          "Ah, sí, mató a un montón durante aquella época", dice Arraka. "¡Casi tantos como yo!"

          "¿Qué quieres decir?", pregunta Kate. "¿No eras tú la líder de los stillwaters durante la guerra del invierno inmóvil?..."
      - source: scene_3
        paragraph: 12
        text: |-
          "Oh, no, no, no", dice Arraka. "Therius era su líder. Yo solo estaba fusionada con él. Y los dos no éramos precisamente amigos. Intentábamos arrebatarnos el cuerpo mutuamente todo el tiempo. Pero lo más gracioso ocurrió cuando tuvo que dormir por primera vez. Ya no tenía forma de impedirme tomar el control de su cuerpo, así que sembré el caos por todo su campamento. Aquellos idiotas intentaron matarme junto con él, pero yo los aplasté como a bichos. Aun así, dejé viva a la mitad para poder jugar un rato con ellos. Tendrían que haberle visto la cara a Therius cuando se despertó y vio los cadáveres de sus amigos. Y la parte más divertida fue que, después de aquello, ninguno de sus amigos volvió a seguirlo por voluntad propia, así que a partir de entonces tuvo que liderarlos mediante el miedo y la intimidación. Ay, qué tiempos aquellos."

          "¿Pero qué desencadenó el invierno inmóvil?", pregunta Kate. "¿Por qué estaban en guerra los lessathi y los stillwaters? ¿Y por qué Eiden no estaba del lado de los stillwaters?"

          "¿De verdad crees que yo estaba prestando atención?", dice Arraka. "Acabo de decirte que masacré a la mitad de mi propio ejército en una sola noche. No es como si me importara escuchar sus razones para ir a la guerra."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch09a_puzzle
  - name: b2_ch09a_puzzle
    routes:
      - condition: b2_ch8_energizer = 0 AND b2_ch1_puzzle2 = 1 AND ch8_first_puzzle = 1
        texts:
          - source: scene_text
            paragraph: 29
            text: |-
              "Y supongo que Melindra tampoco nos va a revelar esa información", dice Daren.

              "Ya he dicho demasiado", dice Melindra. "Le prometí a Eiden hace mucho tiempo que no le daría a nadie ningún detalle importante sobre el invierno inmóvil, y pienso mantener esa promesa."

              "Ya...", dice Daren.

              "En cualquier caso, como no puedo decir para qué se supone que sirve este hechizo, recomiendo que por ahora lo evitemos", dice Melindra. "No hay manera de saber qué podría activarlo, así que no deberíamos correr riesgos innecesarios. Vamos, sigamos."

              Durante las siguientes horas más o menos seguimos a Melindra mientras nos alejaba del río y nos internaba de nuevo en lo espeso del bosque. A medida que pasaba el tiempo, el viento, que esta mañana era apenas una brisa, empezó a intensificarse poco a poco, mientras el cielo seguía tan oscuro como siempre. Pasamos la mayor parte de esas horas escuchando algunas de las historias de Hadrik y Daren sobre sus diversas aventuras, y poco más, aunque una cosa que sí noté fue que Melindra y Flower parecían a menudo más ocupadas con sus propias conversaciones que prestando atención a las charlas del grupo.
          - source: scene_text_2
            paragraph: 23
            text: |-
              Por alguna extraña razón, cuanto más hablaban entre ellas dos, más cosas encontraban que tenían en común, lo que no hacía más que dar pie a nuevos temas de conversación que parecían no acabarse nunca.

              Una vez pasado el mediodía, decidimos hacer una pequeña pausa para almorzar. Esta vez no le pedimos a Flower que preparara comida, para que pudiera conservar su energía mágica en caso de ataque. Como no tenía demasiado hambre, me senté en un tocón y saqué un paquete de galletas de mi mochila para usarlo como una pequeña merienda de media tarde.

              "Barry, pensaba que llevabas comida contigo", dice Flower al verme abrir el paquete de galletas. "Si solo vas a comer esas galletas, podría prepararte un almuerzo de verdad con magia. No sería tan grave."

              "No, llevo comida de sobra", digo. "Es solo que ahora mismo no tengo demasiada hambre. Y, además, estas galletas me encantan. Las compré en una tienda cerca de mi casa, de vuelta en el Continente Occidental, y ninguna otra galleta que haya probado sabe igual."

              "¿Hmm?...", dice Melindra desde detrás de Flower, como si lo que acabo de decir sobre mis galletas le hubiera despertado la curiosidad por algún motivo.
          - source: scene_3
            paragraph: 13
            text: |-
              "Ah", me dice Flower. "Bueno, también había otra cosa de la que quería hablar contigo."

              "Adelante", le digo, mientras le doy un mordisco a una de mis galletas.

              "¿Recuerdas cuando encontramos aquella pieza del rompecabezas dentro del castillo de Thilias?", dice Flower.

              "Sí, me acuerdo", digo.

              "Bueno, Melindra me dijo antes que sabe dónde podemos conseguir otra de las piezas del rompecabezas", dice Flower. "Dijo que ella misma tuvo una pieza hace unos cuantos siglos, pero que no le apetecía perder el tiempo buscando las otras, así que al final la tiró. Pero sabe de dónde la sacó. La encontró en un edificio abandonado de uno de los distritos más pobres de Ollendor."

              "Ya veo...", digo.

              "En fin", continúa Flower, "cuando Daren oyó nuestra conversación, dijo que ustedes también encontraron una pieza del rompecabezas en las ruinas donde nos conocimos y que eres tú quien la tiene. ¿Te importaría dármela o tú también estás intentando reunir todas las piezas?"
        choices:
          - position: 1
            text: Preferiría quedármela, si no te importa.
            effects:
              - set:
                  current_scene: b2_ch09a_coaxed
                  b2_ch9_puzzle_give: 0
