              "Sí", digo. "De todos modos no pensaba hacer nada con ella. Espera, deja que la saque de la mochila."

              Entonces termino una de mis galletas y me inclino hacia el lado del tocón para sacar la pieza del rompecabezas de la mochila. En cuanto se la doy a Flower, se queda mirándola un rato y luego suelta un chillido de emoción.

              "¡Muchísimas gracias, Barry!", dice Flower. "¡Me aseguraré de no desperdiciarla!"

              "Claro", digo. "Vuelve loca."

              "Muy bien, eso era todo lo que quería pedirte", dice Flower. "Te dejaré comer en paz. ¡Disfruta de tus galletas!"
