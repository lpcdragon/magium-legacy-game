scenes:
  - name: b2_ch09a_intro
    effects:
      - set:
          successful_checks:
            - 'Punto de control alcanzado: Partida guardada.'
        condition: checkpoint_rich = 1
    routes:
      - condition: b2_ch8_energizer = 3
        texts:
          - source: scene_text
            paragraph: 2
            text: |-
              "¿Barry?", me pregunta Kate al verme dirigirme hacia ella. "¿Qué estás haciendo? ¿No te fuiste a dormir?"

              "Oh, no podía dormir", digo. "Así que decidí dar un pequeño paseo nocturno para tomar un poco de aire fresco."

              "¿Por qué no podías dormir?", dice Kate.

              "Porque recibí una visita en mitad de la noche", digo. "Y la cosa se estaba poniendo un poco demasiado abarrotada ahí dentro para mi gusto."

              "¿Una visita?", pregunta Kate, horrorizada. "¿Pero cómo es posible? ¡Estuve vigilando todo el tiempo! Nadie se acercó siquiera a tu tienda."

              "¿Recuerdas ese hechizo que Eiden usa siempre para ocultar su presencia?", le digo. "Melindra también conoce ese hechizo."
          - source: scene_text_2
            paragraph: 2
            text: |-
              "¿Melindra?", dice Kate. "¿Fue ella la que te visitó? ¿Y te echó de tu propia tienda?"

              "Espera, espera, no, lo entendiste todo mal", le digo. "No me echó de la tienda. Elegí irme por mi cuenta."

              "¿Pero por qué ibas a hacer algo así?", dice Kate. "¿Por qué no simplemente decirle que se fuera y ya está?"
        choices:
          - position: 1
            text: Porque no quería echarla como a un perro cuando no tenía dónde dormir.
            effects:
              - set:
                  current_scene: b2_ch09a_dog
                  checkpoint_rich: 0
                  b2_ch9_dog: 0
          - position: 2
            text: Porque no quería perder más tiempo discutiendo con ella.
            effects:
              - set:
                  current_scene: b2_ch09a_dog
                  checkpoint_rich: 0
                  b2_ch9_dog: 1
          - position: 3
            text: Porque pensé que, ya que estaba despierto, podía venir a charlar contigo.
            effects:
              - set:
                  current_scene: b2_ch09a_dog
                  checkpoint_rich: 0
                  b2_ch9_dog: 2
      - condition: b2_ch8_energizer = 1
        texts:
          - source: scene_text
            paragraph: 3
            text: |-
              "Barry...", dice Kate con una mirada sombría. "¿Qué hace Melindra dentro de tu tienda?"

              Mierda. No pensé que todos ya estarían despiertos. Todo el mundo nos está mirando y Leila puede saber por el flujo de mi aura si estoy mintiendo o no. Tengo que elegir mis palabras con cuidado.

              "Eh, verás...", digo, mientras intento observar la reacción de Leila por el rabillo del ojo. "Melindra olvidó meter su tienda en el equipaje y me preguntó si podía dormir conmigo esta noche."

              "¿Y simplemente la dejaste dormir contigo?", me pregunta Kate, con suspicacia. "¿Así sin más?"

              "Pues sí", digo, mientras siento que una gota de sudor empieza a formarse lentamente al lado de mi frente. "Ahora mismo está aquí, en mi tienda, ¿no?"

              Leila se limita a mirarme fijamente, sin reaccionar de ningún modo. ¿Sabe que estoy faroleando? Y, si es así, ¿piensa dejarme salir de esta o va a delatarme más tarde?
          - source: scene_text_2
            paragraph: 3
            text: |-
              No llego a seguir dándole vueltas a mi pregunta porque, apenas un momento después, Melindra me agarra del brazo por detrás con ambas manos y se aprieta contra mí, igual que hizo ayer.

              "¡Cariño!", dice Melindra, en tono burlón y con una falsa expresión triste en los ojos. "¿Por qué no les cuentas lo que pasó anoche? ¿Acaso nuestra noche juntos no significó nada para ti?"

              "Barry... ¿de qué está hablando?", dice Kate, con la misma mirada sombría de antes.

              "De dormir", le digo, mientras empiezo a pellizcarle con mucha fuerza uno de los brazos a Melindra. "Está hablando de dormir."

              "¿Por qué tienes que ser tan frío conmigo, amor mío?", me dice Melindra. "¿Ya olvidaste que fuiste tú quien me tuvo despierta toda la noche, hasta que amaneció?"

              "¿La tuviste despierta toda la noch--", empieza a decir Hadrik, pero sus palabras se transforman de repente en una risa entrecortada e incontrolable.

              "Toda la noche... ¡Ja, ja, ja, ja!", dice Arraka, que también empieza a reírse.

              "Ya he oído suficiente", dice Kate, alejándose furiosa de nosotros mientras Hadrik y Arraka siguen riéndose al unísono.
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch09a_energizer4
                  checkpoint_rich: 0
      - condition: b2_ch8_energizer = 2
        texts:
          - source: scene_text
            paragraph: 5
            text: |-
              "Barry...", dice Kate con una mirada sombría. "¿Qué hace Melindra dentro de tu tienda?"

              "Espera", digo. "Sé lo que parece, pero puedo explicarlo..."

              "Relájate, hielitos, no pasó nada", le dice Melindra a Kate al salir de la tienda y ponerse en pie. "Solo me estaba proporcionando un lugar donde dormir. Eso es todo."

              "¿Y por qué exactamente tendría que hacer algo así?", pregunta Kate.

              "Si quieres más detalles, pregúntaselos a Barry", dice Melindra. "Mientras tanto, yo estaré por allí, junto a la orilla del río, recogiendo más piedras. Que se diviertan."

              "Bueno, ¿Barry?", dice Kate mientras Melindra se dirige al río. "¿Cuáles son exactamente esos detalles de los que hablaba Melindra?"

              "Para resumir", digo, "Melindra olvidó meter una tienda en el equipaje y no le apetecía pedirles una prestada a Daren o a Hadrik porque no se lleva muy bien con ellos, así que decidió venir a verme a mí."

              "¿Y simplemente la dejaste dormir en tu tienda?", dice Kate. "¿Así sin más?"
          - source: scene_text_2
            paragraph: 5
            text: |-
              "Bueno, me dijo varias veces que no tenía ningún otro sitio adonde ir", digo. "¿Qué se suponía que debía hacer? ¿Echarla como a un perro?"

              "Hmm...", dice Kate, todavía sin estar segura de si creerme o no.

              "Está diciendo la verdad", escribe Leila. "Puedo verlo por su aura."

              "Bueno, si Leila dice que estás diciendo la verdad, entonces así debe de ser", dice Kate. "Perdón por haber sospechado de ti."

              "No te preocupes", digo. "Probablemente yo también habría sospechado de mí mismo si estuviera en tu lugar."

              "Muy bien, todos", dice Hadrik, aplaudiendo en el aire. "Se acabó el espectáculo. Disuélvanse. Tenemos que prepararnos para irnos pronto, ¿recuerdan?"

              "Barry, ¿tienes algo de comer?", dice Flower, mientras la multitud frente a mi tienda empieza a dispersarse poco a poco. "Podría prepararte algo si quieres."

              "Sí que tengo comida, pero tendría que ser idiota para rechazar tu oferta", digo. "¿Qué plato tienes en mente?"

              "Bueno", dice Flower. "El evento de la arena me recordó unas viejas recetas que conocía. No sé si alguna vez tuviste la oportunidad de comer estofado de aplastador o pastel de puercospín arquero, pero ambos son platos muy raros, normalmente reservados para reyes. ¡Te los tendré listos en un segundo!"
          - source: scene_3
            paragraph: 2
            text: |-
              En cuanto Flower termina de hacer aparecer la comida para mí, va a ver a Melindra para preguntarle si ella también quiere que le prepare algo. Me tomo mi tiempo para saborear la comida y, mientras como, no puedo evitar fijarme en que hoy el cielo está especialmente oscuro, sin que se vea ni el más mínimo rastro de sol a través de las nubes que lo cubren. Va a venir una tormenta pronto. Puedo sentirlo.

              Una vez termino de comer, decido empezar a desmontar mi tienda. Lo primero que hago es volver a meterme dentro para sacar la mochila, pero cuando voy a agarrarla, me doy cuenta de que hay otra mochila tirada encima. No tardo en darme cuenta de que es la mochila de Melindra y de que debió de colarla dentro de mi tienda anoche, mientras yo seguía dormido.
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch09a_sleep2
                  checkpoint_rich: 0
      - condition: b2_ch8_energizer = 0
        texts:
          - source: scene_text
            paragraph: 7
            text: |-
              Cuando me despierto a la mañana siguiente con el sonido de la gente desmontando sus tiendas, veo que apenas entra luz del exterior a través de la mía. Al abrir la cremallera, me doy cuenta de que eso se debe a que el cielo está actualmente cubierto de nubes oscuras y no se ve ni el más mínimo atisbo del sol, a pesar de que ya debe de haber salido hace al menos una hora. Parece que la mayoría de los demás ya se han despertado y, presumiblemente, ya han desayunado.

              No mucho después de salir de la tienda, Melindra viene corriendo hacia mí con una sonrisa falsa en la cara y me agarra del brazo con ambas manos, apretándose contra mí igual que hizo ayer.

              "Barry, cariño mío, ¡lo pasé de maravilla anoche!", dice Melindra. "Dime, ¿dormiste bien después de que yo saliera de tu tienda? ¡Porque yo dormí como un bebé!"

              "¿Barry?...", me pregunta Kate, mirándome con una expresión seria. "¿De qué está hablando Melindra?"

              "Oh, pensé que a estas alturas ya sería obvio", dice Melindra. "¿No me vieron salir anoche de su tienda? Seguro que no es tan difícil sumar dos más dos."

              "¡Maldita sea, suéltame!", digo, apartándome de Melindra de un tirón. "Kate, escucha, Melindra vino ayer a mi tienda solo porque olvidó traer una tienda y necesitaba un sitio donde dormir. No pasó nada, ¡lo juro!"
          - source: scene_text_2
            paragraph: 7
            text: |-
              "Hmm...", dice Kate, mirándome sin saber si debería creerme o no.

              "Está diciendo la verdad", escribe Leila. "Puedo verlo por su aura."

              "Bueno, si Leila dice que estás diciendo la verdad, entonces así debe de ser", dice Kate. "Perdón por haber sospechado de ti."

              "¡Hmph!", dice Melindra, frunciendo el ceño. "Qué aburrido."

              Entonces se mete en mi tienda y sale poco después con su mochila en la mano izquierda. Por lo visto, debió de colarla allí ayer mientras yo seguía dormido. Tras salir de la tienda, Melindra empieza a alejarse, pero luego se detiene en seco y gira la cabeza hacia mí.

              "¡Oh, casi lo olvido!", dice, mientras empieza a acercarse lentamente hacia mí.

              En cuanto está lo bastante cerca, extiende la mano derecha hacia mí y me toca con la palma en la parte superior del brazo izquierdo. Apenas la aparta, empiezo a sentir un fuerte viento soplándome en los oídos, aunque en realidad en el aire solo debería haber una brisa ligera. El sonido del viento que oigo en los oídos me dificulta muchísimo escuchar cualquier cosa de lo que sucede a mi alrededor.

              Melindra me está mirando ahora con una sonrisita ladeada mientras se inclina hacia mí para asegurarse de que puedo oír lo que está a punto de decir.
          - source: scene_3
            paragraph: 4
            text: |-
              "Esto es por haberme hecho dormir con los bichos anoche", dice Melindra a gritos, junto a mi oído. "¡Disfruta del resto de tu mañana!"

              "¡Eh, espera!", le digo, mientras se aleja de mí. "¡Deshaz el hechizo! ¡Maldita sea, vuelve aquí!"

              Mientras Melindra se dirige hacia la orilla del río, puedo ver que los demás mueven los labios, pero lo único que oigo es el sonido del viento. Daren parece ahora estar mirándome y hablándome, pero apenas logro distinguir unas pocas palabras de lo que dice. Al ver que no obtiene respuesta, Daren se acerca a mí y empieza a gritarme al oído.

              "¿Qué hechizo te lanzó?", grita Daren tan fuerte como puede.

              "¡No lo sé!", le grito de vuelta. "Algún hechizo de viento. No lo reconozco. ¡Tengo un viento constante soplándome en los oídos y apenas puedo oírte hablar!"
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch09a_kick
                  checkpoint_rich: 0
  - name: b2_ch09a_dog
    routes:
      - condition: b2_ch9_dog = 0 AND ch11_saved_rose = 0
        texts:
          - source: scene_text
            paragraph: 14
            text: |-
              "Porque no quería echarla como a un perro cuando no tenía dónde dormir."

              "¿No tenía dónde dormir?", pregunta Kate. "¿Qué quieres decir? ¿No trajo una tienda?"

              "Olvidó meter una en el equipaje", digo.

              "¿Todo esto va por eso?", dice Kate. "¿No podía simplemente pedirles una tienda a Daren o a Hadrik?"

              "No quería pedírsela porque no se lleva muy bien con ellos", digo.

              "Vaya...", dice Kate. "Así que así fue como acabaste cargando con ella. ¿Y cuál es tu plan? ¿Pasarte el resto de la noche haciendo turnos para que la stillwater pueda dormir cómodamente en tu tienda?"

              "No pienso quedarme aquí toda la noche", digo. "En cuanto empiece el turno de Hadrik y Daren, les pediré que le monten una tienda para que me deje en paz. Pero pensé que, ya que estaba despierto, podía venir aquí a charlar contigo."

              "¿Ah, sí?", pregunta Kate. "¿Y de qué querías hablar conmigo?"

              "No lo sé", digo. "De muchas cosas. Siento que hace siglos que no tenemos ocasión de hablar a solas."
          - source: scene_text_2
            paragraph: 13
            text: |-
              "Tienes razón...", dice Kate. "Ha pasado bastante tiempo. Creo que la última vez que tuvimos una conversación privada fue aquella vez en que celebrábamos que nos habíamos librado de los collares del zorro dorado. Cuando... Rose todavía estaba viva..."

              Las palabras de Kate me golpean como una daga atravesándome el pecho. De repente me doy cuenta de que he estado evitando por completo pensar en Rose desde aquel día en que brindamos con Enrique en su memoria. Incluso después de prometerme a mí mismo que no evitaría pensar en su muerte, aun así lo hice. Supongo que algunas cosas son más fáciles de decir que de hacer, al fin y al cabo.

              "Sí... cuando Rose todavía estaba viva...", digo, y ambos guardamos silencio durante unos instantes.

              "Entonces... ¿cómo van las cosas con Leila?", digo, tratando de cambiar de tema.

              "Van... genial", dice Kate con una leve sonrisa. "Hemos hablado mucho de cómo han sido nuestras vidas desde que dejamos el Faro. Ha pasado mucho tiempo. Las dos teníamos muchas historias que contar..."

              "Entonces, ¿han vuelto a ser amigas?", le pregunto.

              "¿Qué quieres decir?", dice Kate.

              "Bueno, al principio no se hablaban demasiado", digo. "Así que pensé que quizá habrían discutido o algo así antes de que ella dejara el Faro, y que eso hacía difícil iniciar una conversación."
          - source: scene_3
            paragraph: 9
            text: |-
              "Oh, no, no es eso...", dice Kate. "Es solo que..."

              Hace una pausa.

              "Verás", dice, "Leila y yo nunca fuimos exactamente amigas cuando estábamos en el Faro... Yo pasaba la mayor parte del tiempo con Diane y su hermano, y a Leila no le permitían socializar mucho con el resto de nosotros porque era lessathi. Pero aun así, la primera vez que descubrí que había muerto, me quedé destrozada. Dioses, ¿por qué tuve que creerme las mentiras de esos lessathi cuando dijeron que estaba muerta? ¿Por qué no intenté buscarla?"

              "Eh, aunque lo hubieras hecho, no es como si fueras a avanzar mucho, ¿no?", digo. "Leila ha vivido toda su vida aquí en Varathia con su padre adoptivo, así que no habrías tenido más suerte encontrándola que la que tuviste intentando llegar hasta Diane. No te castigues demasiado por ello. Lo importante es que estaba a salvo... al menos hasta hace poco."

              "Sí, tienes razón", dice Kate. "Le debo muchísimo a su padre. Espero que lo conozcamos cuando lleguemos a Ollendor, para poder expresarle mi gratitud."
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch09a_notebook
