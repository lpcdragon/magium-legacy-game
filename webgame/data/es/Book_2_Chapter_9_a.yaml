  - name: b2_ch09a_detector
    texts:
      - source: scene_text
        paragraph: 25
        text: |-
          "Tal vez encontraron un detector y se están llevando las piñas hasta él."

          "Lo dudo", dice Melindra. "Si de verdad tuvieran acceso a un detector, se lo habrían llevado con ellos. Se puede transportar fácilmente con una sola mano."

          "Es posible que conozcan a alguien que tenga un detector, pero no quiera dárselo", digo. "No podemos saberlo con certeza."

          "Supongo...", dice Melindra.

          "Bueno, sea cual sea la razón", dice Daren, "hay al menos una cosa de la que podemos estar seguros. Y es del hecho de que, de una forma u otra, esta gente ha conseguido descubrir que no puede hacer que las piñas se iluminen por sí misma."

          "Pero siguen sin saber que las piñas solo pueden encontrarse en los bosques sagrados", dice Melindra. "De lo contrario, no estarían perdiendo el tiempo por esta zona. Mientras no conozcan esa información crucial, todavía les queda mucho camino hasta completar su objetivo."

          "Para ser sincero, lo que más me preocupa ahora mismo no tiene nada que ver con esos magos que están recogiendo piñas", dice Daren. "Miren el cielo. No ha hecho más que oscurecerse desde que nos despertamos esta mañana. Tengo la sensación de que pronto habrá una tormenta."

          "¿Suelen tener tormentas a menudo en Varathia?", le pregunta Hadrik a Flower.
      - source: scene_text_2
        paragraph: 21
        text: |-
          "No, son bastante raras", dice Flower. "Pero cuando llega una, suele ser bastante desagradable. Sobre todo en verano."

          "En ese caso, será mejor que tengamos cuidado con los árboles que caen", dice Daren. "Además, deberíamos contar con quedar empapados hasta los huesos en cuanto empiece a llover de verdad, así que probablemente tendremos que hacer una pausa luego para secarnos cerca de un fuego."

          "Yo podría hacer una cúpula de hielo para protegernos de la tormenta", dice Kate.

          "¡Y yo podría hacer pequeñas bolas de fuego para que giren a nuestro alrededor y nos sequen!", dice Flower. "Para eso no hace falta encender un fuego de verdad."

          "Sí, pero creo que quizá sería mejor que ustedes dos conservaran vuestra energía mágica", dice Daren. "No hay forma de saber cuándo nos encontraremos con otro de los escuadrones de élite de Tyrath, así que siempre deberíamos estar listos para ellos."
      - source: scene_3
        paragraph: 11
        text: |-
          "Dudo mucho que volvamos a encontrarnos con otro de los grupos de élite de Tyrath en bastante tiempo", dice Melindra. "No es como si crecieran en los árboles ni nada por el estilo. No puede permitirse enviar a todos sus mejores guerreros tras un solo grupo de magos. Para cuando volvamos a verlos, probablemente ya vamos a... Vaya..."

          Melindra se detiene de repente en seco, como si estuviera a punto de chocar con algo, y luego empieza a estudiar con mucho cuidado un espacio vacío frente a ella, mientras el resto nos reunimos a su alrededor intentando entender qué está haciendo.

          "¿Estás viendo algo ahí?...", dice Hadrik, confuso, mientras intenta tocar el espacio vacío con una de las manos.

          "¡No, no lo toques!", grita Melindra, mientras sigue inspeccionando la zona. "Aún no sé qué hace exactamente el hechizo."
