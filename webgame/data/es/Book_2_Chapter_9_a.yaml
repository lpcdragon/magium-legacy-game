            paragraph: 49
            text: |-
              "No", digo. "No voy a disculparme cuando eres tú quien irrumpió en mi tienda en mitad de la noche."

              "Entonces la disputa continuará", dice Melindra, mientras le da otro mordisco a una galleta.

              "¿Estás segura de eso?", digo. "Verás, si aceptaras una tregua, podría pedirle a Daren que te prestara una tienda para esta noche y no tendrías que pasar dos noches seguidas sin dormir ahí fuera. A menos, claro, que creas que esta vez serás capaz de reunir el valor para pedirle la tienda tú misma..."

              Melindra frunce el ceño y no dice nada durante unos segundos.

              "Vale", dice, mientras me devuelve las galletas. "Tienes tu tregua. Me estaba empezando a aburrir de buscar nuevas formas de fastidiarte, de todos modos."

              "Bueno", digo, "en ese caso, si no tienes nada más que hablar, me gustaría volver a leer mi cuaderno, si no te importa."

              "Sí", dice Melindra. "Lo que sea."
