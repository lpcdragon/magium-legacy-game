          - source: scene_text
            paragraph: 20
            text: |-
              "No lo sé. No estaría tan seguro de eso."

              "¿Por qué no?", pregunta Kate.

              "Bueno, el ganador de la pelea seguiría dependiendo de varios factores", digo. "Por ejemplo, si la pelea ocurriera bajo tierra o dentro de un edificio, no podrías salir volando para ponerte a salvo. E incluso si peleáramos en un campo abierto, todavía podría llevarme la ventaja si empezáramos relativamente cerca el uno del otro. Por lo que he visto en el pasado, eres particularmente vulnerable a los ataques por sorpresa, así que si lograra acercarme a ti más rápido de lo que pudieras reaccionar para defenderte, creo que tendría una buena oportunidad de... ¡Espera un segundo! Esta conversación que estamos teniendo ahora mismo... es solo hipotética, ¿verdad? Si el torneo nos obligara a enfrentarnos... no intentarías matarme de verdad, ¿o sí?"

              "No lo haría", dice Kate. "¿Y tú?"

              "Yo... no creo que pudiera, no...", digo.

              "Bueno, entonces", dice Kate, haciendo desaparecer su daga de hielo en el aire, "supongo que ambos deberíamos sentirnos afortunados de no ir a competir el uno contra el otro."
          - source: scene_text_2
            paragraph: 18
            text: |-
              Hace una pausa.

              "Pero creo que ya sabes que con Daren las cosas no irán tan bien", continúa Kate. "Ustedes dos son prácticamente los únicos miembros de nuestro grupo que de verdad aspiran a ganar este torneo, así que, si ambos siguen por el camino actual, al final no les quedará más remedio que pelear entre ustedes. Solo puede haber un ganador del torneo del Magium."

              "Sí... lo sé", digo.

              Mientras los dos permanecemos en silencio un rato, acabamos viendo cómo se abre la tienda de Daren al otro lado del campamento y, poco después, Daren también sale y empieza a dirigirse hacia nosotros.

              "¿Barry?", pregunta Daren cuando se acerca. "¿Qué haces aquí? Estaba bastante seguro de que Kate era la única que hacía el primer turno."

              "Podría preguntarte lo mismo", digo. "¿No se suponía que tu turno empezaba dentro de una hora o algo así?"

              "Dentro de una hora y media", dice Daren. "Pero no podía dormir. No dejaba de pensar en la pelea de hoy y en intentar encontrar maneras en las que podríamos habernos desempeñado mejor. Así que pensé que bien podía venir aquí y relevar a Kate antes de tiempo, para que al menos ella pudiera descansar un poco."
          - source: scene_3
            paragraph: 10
            text: |-
              "Oh, bueno, mi historia es un poco más larga que eso", digo.

              Entonces empiezo a contarle cómo Melindra entró en mi tienda porque olvidó traer la suya y cómo al final la dejé dormir dentro mientras yo me iba a unirme a Kate en su turno.

              "Así que eso fue lo que pasó", dice Daren. "De acuerdo... Barry, ven conmigo y le montaremos la tienda nueva a Melindra. Kate, deberías irte a dormir. Yo me encargaré del resto de tu turno."

              "Aceptaré esa oferta", dice Kate, levantándose del suelo. "Buena suerte con... la tienda de Melindra."

              Entonces empieza a dirigirse hacia su propia tienda, mientras Daren y yo vamos hacia la suya para sacar una tienda de repuesto de su mochila. Una vez terminamos de montar la nueva tienda, vuelvo a la mía para despertar a Melindra.

              "Eh, Melindra, ¡despierta!", le digo.

              "Mmmnnn...", dice Melindra, con los ojos medio cerrados y voz somnolienta. "Déjame dormir un poco más..."

              "Puedes dormir todo lo que quieras en tu propia tienda, pero no aquí", digo.
