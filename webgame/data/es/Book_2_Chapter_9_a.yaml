    texts:
      - source: scene_text
        paragraph: 17
        text: |-
          Hace otra pausa.

          "¿Y tú, Barry?", dice Kate. "¿Cómo va lo de tu cuaderno? ¿Encontraste algo útil?"

          "Es difícil saberlo", digo. "Tengo mucha información en el cuaderno, pero también faltan muchísimas cosas. Si de algún modo lograra averiguar cómo activar esas estadísticas mágicas del dispositivo de estadísticas, sería mucho más fácil completar las notas con los detalles que necesito, pero no creo que vaya a ser capaz de desbloquear esas estadísticas ocultas yo solo."

          "¿Crees que el padre de Leila podría ayudarte?", dice Kate.

          "Es una posibilidad", digo. "Pero por ahora no me haré ilusiones. Por lo que me contó el general goblin, para activar esas estadísticas ocultas necesitaría unos códigos secretos a los que solo debería tener acceso la cúpula lessathi, y dudo que el padre de Leila tenga alguna razón para conocerlos."

          Mientras Kate y yo nos tomamos otro pequeño descanso de la conversación, de pronto recuerdo lo que Melindra me dijo en la tienda sobre que Kate siente algo por mí. ¿Debería hablarlo con ella? No, no, no, eso solo acabaría poniéndonos en una situación incómoda. Pero, por otro lado, si nunca hablo con Kate de esto, las cosas nunca se aclararán.
      - source: scene_text_2
        paragraph: 15
        text: |-
          Tal vez podría encontrar una forma de sacar el tema de manera sutil, sin sobresaltarla demasiado. Debería dejar que la conversación fluya de forma natural y, cuando encuentre la oportunidad adecuada, introducir la idea como algo secundario, solo para ver cómo reacciona. Sí, eso podría funcionar. Eso haré.

          "Entonces, Kate...", digo. "Hay algo que me preguntaba..."

          "¿Sí?", dice Kate.

          "No sentirás algo por mí, por casualidad, ¿verdad?", digo.

          Maldita sea, eso no tuvo nada de sutil, ¿verdad?

          "...¿Has perdido la cabeza?", dice Kate, mirándome fijamente, sin saber muy bien qué pensar de mí.

          "¡No, espera!", digo. "Sé que parece que te estoy preguntando esto completamente de la nada, pero la verdad es que Melindra me dijo algo antes que me llevó a hacerte esta pregunta."

          "Melindra otra vez...", dice Kate. "¿Qué te dijo?"

          "Bueno...", digo. "Me dijo que quizá tú sentías algo por mí... por esa mirada que le lanzaste cuando me agarró del brazo ayer, mientras fingía que éramos pareja."

          "Oh...", dice Kate, adoptando una expresión pensativa y apartando la mirada a un lado. "Ya veo..."

          Tras unos segundos de reflexión, Kate vuelve a mirarme directamente a los ojos y sigue hablando.
