              "Dentro de una hora y media", dice Daren. "Pero no podía dormir. No dejaba de pensar en la pelea de hoy y en intentar encontrar maneras en las que podríamos habernos desempeñado mejor. Así que pensé que bien podía venir aquí y relevar a Kate antes de tiempo, para que al menos ella pudiera descansar un poco."
          - source: scene_3
            paragraph: 10
            text: |-
              "Oh, bueno, mi historia es un poco más larga que eso", digo.

              Entonces empiezo a contarle cómo Melindra entró en mi tienda porque olvidó traer la suya y cómo al final la dejé dormir dentro mientras yo me iba a unirme a Kate en su turno.

              "Así que eso fue lo que pasó", dice Daren. "De acuerdo... Barry, ven conmigo y le montaremos la tienda nueva a Melindra. Kate, deberías irte a dormir. Yo me encargaré del resto de tu turno."

              "Aceptaré esa oferta", dice Kate, levantándose del suelo. "Buena suerte con... la tienda de Melindra."

              Entonces empieza a dirigirse hacia su propia tienda, mientras Daren y yo vamos hacia la suya para sacar una tienda de repuesto de su mochila. Una vez terminamos de montar la nueva tienda, vuelvo a la mía para despertar a Melindra.

              "Eh, Melindra, ¡despierta!", le digo.

              "Mmmnnn...", dice Melindra, con los ojos medio cerrados y voz somnolienta. "Déjame dormir un poco más..."

              "Puedes dormir todo lo que quieras en tu propia tienda, pero no aquí", digo.
