            paragraph: 12
            text: |-
              "Supongo que tienes razón", digo. "Prefiero ponerme malo por la noche antes que retrasar a todo el mundo en una pelea."

              "¡Espléndido!", dice Melindra. "Ahora, ¿qué hay para desayunar?"

              "Bueno", dice Flower. "El evento de la arena me recordó unas viejas recetas que conocía. No sé si alguno de ustedes ha tenido la oportunidad de comer estofado de aplastador o pastel de puercospín arquero, pero ambos son platos muy raros, normalmente reservados para reyes. ¡Se los tendré listos en un segundo!"

              Pasamos los siguientes veinte minutos más o menos saboreando la comida y, mientras comemos, no puedo evitar fijarme en que hoy el cielo está especialmente oscuro, sin que se vea ni el más mínimo rastro de sol a través de las nubes que lo cubren. Va a venir una tormenta pronto. Puedo sentirlo.

              Una vez terminamos de comer, Melindra y yo empezamos a desmontar mi tienda, mientras Flower va a ver qué están haciendo los demás.

              "Espera, primero voy a sacar mi mochila", me dice Melindra, mientras entra en la tienda.

              "Ah, cierto", digo. "Tu mochila también estaba ahí dentro. Por cierto, ¿cuándo conseguiste colarla?"

              "La hice pasar flotando por encima de ti con mi magia de viento mientras todavía dormías", dice Melindra, sacando su mochila de la tienda. "Vale, ya he terminado. Pongámonos a trabajar."
          - source: scene_text_2
            paragraph: 12
            text: |-
              Los dos pasamos los siguientes minutos desmontando la tienda y, una vez terminamos, voy a devolverle su tienda a Hadrik mientras los demás se preparan para marcharse. Kate sigue pareciendo molesta, pero Daren da la impresión de haber superado ya lo que ocurrió esta mañana. Cuando por fin estamos todos listos para irnos, Melindra toma la delantera y todos empezamos a seguirla mientras caminamos por la orilla del río, igual que ayer.

              No mucho después de que empezamos a caminar, Hadrik me arrastra hasta la parte trasera del grupo para poder mantener una breve conversación conmigo en privado.

              "Escucha, Barry", dice, mientras seguimos al grupo desde cierta distancia. "Sé que esta mañana me reí en tu cara y todo eso, pero quería decirte que no intentaba burlarme de ti. ¡En realidad estoy bastante impresionado! Quiero decir, sabías perfectamente lo que implicaba hacer lo que hiciste, teniendo en cuenta cuánta gente de nuestro grupo detesta a Melindra, ¡y aun así lo hiciste! ¡Y durante toda una noche, nada menos! ¡Como si te diera igual que te pillaran o no! Hace falta tener agallas para hacer algo así, y eso lo respeto. Solo quería dejarlo claro."

              "Eh... ¿gracias?...", le digo, sin saber muy bien cómo responder a su pequeño discurso.

              "¡Muy bien, me alegro de que hayamos tenido esta charla!", dice Hadrik, dándome una fuerte palmada en la espalda. "No te preocupes por los demás. Seguro que se les pasa en poco tiempo."

              Tras esas últimas palabras, se va a reunirse con el resto del grupo y yo no tardo en seguirlo también.
