  - name: b2_ch09a_sleep2
    texts:
      - source: scene_text
        paragraph: 6
        text: |-
          Saco ambas mochilas y luego paso los siguientes minutos desmontando mi tienda. Después de devolvérsela a Hadrik, voy a la orilla del río para devolverle a Melindra su mochila. Cuando llego hasta ella, Melindra estaba justo a punto de terminar su comida.

          "Toma", digo, arrojándole la mochila a Melindra. "Te olvidaste esto."

          "Ah, cierto", dice Melindra. "Gracias."

          Entonces da un último bocado a su propio pastel de puercoespín, vaciando así el plato.

          "Sabes...", le digo. "Tengo que admitir que me sorprendió un poco que antes le reconocieras a Kate sin más que anoche no pasó nada. Pensé que ibas a volver a pegarte a mí como ayer para provocar otra reacción en Kate."

          Cuando termino la frase, Melindra se me queda mirando con incredulidad durante unos segundos.

          "¿Qué clase de monstruo sin corazón crees que soy?", dice al final. "¡Claro que no iba a ponerte en una situación así después de que acabaras de ayudarme!"

          Su respuesta me toma por sorpresa. Tardo dos o tres segundos en recomponer mis pensamientos antes de volver a hablar.
      - source: scene_text_2
        paragraph: 6
        text: |-
          "Huh...", digo, dedicándole una mirada larga y pensativa. "Así que SÍ eres capaz de que te importen los demás, entonces... Pero si ese es el caso, ¿por qué eliges comportarte como lo haces?"

          "¿De qué estás hablando?", dice Melindra.

          "Bueno", digo, "por lo que vi de tu comportamiento ayer, nunca parece importarte de verdad lo que la gente piense de ti. No te esfuerzas por recordar el nombre de nadie, no te paras a pensar si decir lo que piensas tan a las claras va a molestar o no a la gente que tienes alrededor, y no me diste la impresión de que te importara demasiado que tu costumbre de provocar reacciones en los demás pudiera hacer que los otros se enfadaran contigo."

          "¿Y por qué iba a importarme que los demás se enfaden conmigo?", dice Melindra. "No necesito que sean mis amigos. Solo necesito que hagan el trabajo."

          "¿Pero necesitas que sean tus enemigos?", digo.

          "Eiden no se convirtió en mi enemigo cuando yo me comportaba así con él", dice Melindra.

          "¡Bueno, la mayoría de la gente no es Eiden!", digo.
      - source: scene_3
        paragraph: 3
        text: |-
          "¡Pero eso no significa que tenga que cambiar mi forma de vivir solo para acomodarme a los demás!", dice Melindra.

          "No te estoy diciendo que cambies todo tu estilo de vida", digo. "Solo te estoy diciendo que no cabrees a propósito a todo el mundo que conoces. ¿No puedes hacer al menos eso? ¿O prefieres pasar el resto de nuestros días en este viaje sin ni siquiera poder pedirle a alguien el simple favor de prestarte una tienda para pasar la noche?"

          Melindra me está mirando ahora con las cejas fruncidas y con otra de sus expresiones de puchero.

          "Vale", dice. "Quizá podría cambiar un poco mi comportamiento. Pero solo un poco."

          "Bueno, es un comienzo", digo. "En fin, creo que pronto deberíamos prepararnos para irnos. Veo que los demás ya han desmontado todas sus tiendas y están cogiendo las mochilas."

          Melindra y yo cogemos nuestras mochilas también y nos reunimos con los demás, que están terminando de prepararse para nuestra partida. Cuando ya estamos todos listos, Melindra toma la delantera y todos empezamos a seguirla mientras caminamos por la orilla del río, igual que ayer.
