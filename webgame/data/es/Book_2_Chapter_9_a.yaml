            paragraph: 18
            text: |-
              "Es verdad que me quedé un poco impactada cuando vi por primera vez esa escena entre ustedes dos", dice Kate. "Te había visto mantener una conversación privada con ella apenas unos minutos antes y me preocupaba que quizá hubieras olvidado la promesa que le hiciste a Rose antes de dejar Thilias. Le prometiste a Rose que volverías a por ella al final del torneo, ¿no?"

              "Sí...", digo. "Se lo prometí."

              "Bueno, espero que no le falles", dice Kate. "Creo que, a pesar de todas sus bromas, se tomó tus palabras muy en serio y estará esperando tu regreso."

              "Lo sé", digo. "No le fallaré."

              "Sé que lo que Melindra estaba haciendo ayer era solo una broma", dice Kate, "pero aun así creo que deberías ir con cuidado con ella. No hay manera de saber qué pasa por la cabeza de esa mujer. Y... no necesitas preocuparte por si yo siento algo por ti. Me alegro por ti y por Rose, y espero que puedas cumplir tu promesa después de que todos logremos sobrevivir a este torneo hasta el final."
          - source: scene_text_2
            paragraph: 16
            text: |-
              "¿No quieres decir después de que gane el torneo?", le digo con una sonrisa ladeada.

              "Por supuesto", dice Kate, y luego sonríe levemente. "Después de que ganes."

              Entonces hace aparecer una daga de hielo de la nada y empieza a lanzarla hacia arriba y a recogerla con la mano una y otra vez mientras sigue hablándome.

              "¿Sabes?", dice Kate, "deberías considerarte muy afortunado de que en realidad no piense competir contra ti en este torneo. Con tus hechizos de protección inexistentes y tus ataques a distancia poco fiables, no tendrías forma de ponerme siquiera un dedo encima, mientras yo flotaría bien alto en una jaula de hielo haciéndote llover carámbanos encima."
