              current_scene: b2_ch09a_pinecones
  - name: b2_ch09a_energizer4
    texts:
      - source: scene_text
        paragraph: 4
        text: |-
          "Ugh...", dice Daren, negando con la cabeza en señal de desaprobación. "Escucha, no voy a juzgar, pero intenta al menos desmontar tu tienda y desayunar dentro de la hora. No pensamos quedarnos aquí mucho más tiempo. Y Melindra, quizá la próxima vez podrías pedirle una tienda de repuesto a Hadrik o a mí en vez de irrumpir en las tiendas de la gente en mitad de la noche. Solo una sugerencia."

          "¡Lo tendré en cuenta!", dice Melindra, con una sonrisa.

          "Muy bien, vámonos, Hadrik, Flower", dice Daren, mientras se dirige hacia su propia tienda.

          "Toda la noche...", dice Hadrik, con una lágrima en el ojo, mientras aún intenta contener la risa. "Madre mía, qué manera de empezar la mañana. Gracias por las risas, Barry. Han sido muy apreciadas."
      - source: scene_text_2
        paragraph: 4
        text: |-
          "Cuando quieras", digo con tono seco, y entonces Hadrik, Leila y Flower se alejan de mí, mientras Flower me dedica una última mirada con expresión preocupada.

          "¡Bueno, eso ha sido divertido!", dice Melindra. "Ahora, ¿qué hay para desayunar? Me muero de hambre."

          "¿Hablas en serio?", le digo. "¿Vas a quitarle hierro a lo que pasó así sin más?"

          "¿Qué quieres decir?", pregunta Melindra, con una curiosidad genuina. "¿Qué pasó?"

          "¡Me dejaste en evidencia delante de todos, eso pasó!", digo. "¿Por qué tenías que decir todo eso? ¿Qué pretendías?"

          "Oh, lo hice porque me parecieron divertidas sus reacciones", dice Melindra. "Especialmente la reacción de la maga de hielo. ¿Por qué lo preguntas? ¿No te parecieron divertidas sus reacciones?"

          Al mirar a Melindra a los ojos, de pronto me doy cuenta de que, en realidad, no se está burlando de mí y que está haciendo esta pregunta con la más absoluta sinceridad.
