  - name: b2_ch09a_downhill
    texts:
      - source: scene_text
        paragraph: 54
        text: |-
          "Buena suerte averiguando eso", dice Melindra. "Lo conozco desde casi toda mi vida y ni siquiera yo tengo idea de lo que está tramando."

          "Tal vez esté intentando recuperar el corazón del zorro", dice Arraka en tono burlón. "Oí que acabaron bastante mal después de aquel numerito que montó en Olmnar. Y tampoco creo que antes de eso estuvieran precisamente en los mejores términos."

          "Su relación llevaba mucho tiempo deteriorándose poco a poco", dice Melindra. "Creo que todo empezó cuando las ciudades bajo el cuidado de Eiden comenzaron a introducir el concepto de la esclavitud, y a partir de ahí todo fue cuesta abajo. El zorro siempre culpó a Eiden de todas las barbaridades que acabaron ocurriendo en sus ciudades. No dejaba de decir que, si las hubiera puesto en cintura y les hubiera impuesto reglas más estrictas, no se habría llegado a ese punto. Pero en aquel entonces, Eiden tenía esa creencia ingenua de que todos los humanos son intrínsecamente buenos y de que, si se les dejaba a su aire el tiempo suficiente, acabarían encontrando el camino correcto. Pensaba que, mientras a la gente se le diera todo lo que necesitaba sin tener que trabajar por ello y no se le diera ninguna razón para pelear entre sí, todos vivirían como una gran familia feliz. Bueno, todos podemos ver cómo salió eso."

          "¡¿Así que me estás diciendo que simplemente se rindió?!", grita Daren de repente.
      - source: scene_text_2
        paragraph: 43
        text: |-
          "Oh, no, no se rindió 'sin más'", dice Melindra. "Intentó razonar con ellos durante mucho tiempo. Mucho más tiempo del que dura tu vida. Y sí consiguió guiarlos de vuelta por el buen camino unas cuantas veces. Pero, cuanto más traicionaban sus expectativas, más dejó de importarle. Creo que fue cuando lo traicionaron precisamente las personas en las que más confiaba cuando acabó perdiendo la cabeza. Ni siquiera recuerdo sus nombres. El rey y la reina de una de las ciudades. Parecían gente tan agradable también... hasta que se descubrió que dirigían en secreto un espectáculo clandestino donde la gente era devorada viva por perros. Recuerdo que, después de enterarse Eiden de lo que hacían, organizó todo un evento de arena solo para que el rey y la reina fueran devorados vivos por los mismos perros que usaban en sus propios espectáculos. Fue poco después de todo ese episodio cuando Eiden me dijo que por fin se rendía, y también más o menos por aquella época cuando empezó a cerrar los ojos."

          "¿Así que iba a dejar que esos bastardos hicieran lo que les diera la gana?", dice Daren, furioso. "¿Y qué pasaba con toda la gente inocente de esas ciudades que no tenía nada que ver con todas esas atrocidades?"
      - source: scene_3
        paragraph: 20
        text: |-
          "Dejó de preocuparse por ellos", dice Melindra. "Empezó a llamarlos a todos ovejas y decía que merecían todo lo que les estaba pasando. Incluso empezó a alentar algunas de las cosas más retorcidas que ocurrían en esas ciudades, diciendo que era 'lo que la gente quería'. Fue más o menos por entonces cuando el zorro empezó a perder de verdad la fe en él y también cuando comenzó a imponer todas esas reglas absurdamente estrictas en su propio reino para evitar a toda costa que ocurriera lo mismo que en las ciudades de Eiden. Al final, Eiden se marchó del continente sin decir una palabra, en un viaje de autodescubrimiento o lo que demonios fuera, y cuando volvió por primera vez, hace veinte años, se enteró de la caza de animales que había en Olmnar y... bueno, creo que todos saben lo que pasó entonces. Ahí fue cuando tuvo su ruptura oficial con el zorro, y poco después volvió a abandonar el continente."

          "Sí", dice Arraka. "Probablemente intentó decirle que había resuelto el problema destruyendo Olmnar, cuando en realidad fue precisamente su marcha la que provocó que comenzaran las cacerías de animales. ¡Qué idiota!"

          "Eh...", dice Hadrik. "No es que quiera interrumpir ni nada, pero ¿no eran Eiden y el zorro solo dos viejos aliados del invierno inmóvil? ¿Por qué Arraka estaba bromeando antes con que Eiden intentaba recuperar su corazón? ¿Por qué importa tanto que hayan acabado mal o no?"
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch09b_inseparable
              storyboard_controls: Jump to frame "Book 2 Chapter 9 b"
