  - name: b2_ch09a_favor
    texts:
      - source: scene_text
        paragraph: 23
        text: |-
          "Bueno", digo, "por lo que vi de tu comportamiento ayer, nunca parece importarte de verdad lo que la gente piense de ti. No te esfuerzas por recordar el nombre de nadie, no te paras a pensar si decir lo que piensas tan a las claras va a molestar o no a la gente que tienes alrededor, y no me diste la impresión de que te importara demasiado que tu costumbre de provocar reacciones en los demás pudiera hacer que los otros se enfadaran contigo."

          "¿Y por qué iba a importarme que los demás se enfaden conmigo?", dice Melindra. "No necesito que sean mis amigos. Solo necesito que hagan el trabajo."

          "¿Pero necesitas que sean tus enemigos?", digo.

          "Eiden no se convirtió en mi enemigo cuando yo me comportaba así con él", dice Melindra.

          "¡Bueno, la mayoría de la gente no es Eiden!", digo.

          "¡Pero eso no significa que tenga que cambiar mi forma de vivir solo para acomodarme a los demás!", dice Melindra.

          "No te estoy diciendo que cambies todo tu estilo de vida", digo. "Solo te estoy diciendo que no cabrees a propósito a todo el mundo que conoces. ¿No puedes hacer al menos eso? ¿O prefieres pasar el resto de nuestros días en este viaje sin ni siquiera poder pedirle a alguien el simple favor de prestarte una tienda para pasar la noche?"

          Melindra me está mirando ahora con las cejas fruncidas y con otra de sus expresiones de puchero.
      - source: scene_text_2
        paragraph: 20
        text: |-
          "Vale", dice. "Quizá podría cambiar un poco mi comportamiento. Pero solo un poco."

          "Bueno, es un comienzo", digo. "En fin, creo que pronto deberíamos prepararnos para irnos. Veo que los demás casi han terminado de desmontar sus tiendas, así que supongo que ya han desayunado."

          "Sí, ya hemos terminado de comer", dice Melindra. "Deberías hablar con Flower para que te prepare algo. Recordó algunas recetas nuevas después de ver la arena, que se supone que son platos raros reservados para reyes. Creo que se llamaban pastel de puercospín arquero y estofado de aplastador. Ahora, si me disculpas, voy a sacar mi mochila de tu tienda."

          "Espera, ¿cuándo dejaste tu mochila ahí dentro?", digo, mientras Melindra se mete en mi tienda.

          "La hice pasar flotando por encima de ti con mi magia de viento mientras todavía dormías", dice Melindra. "Vale, ya la encontré."

          Entonces sale de mi tienda con la mochila en la mano y se dirige a la orilla del río a recoger más de sus piedras. Una vez termino de desmontar mi tienda y devolvérsela a Hadrik, voy a ver a Flower para pedirle que cree comida para mí con su magia. Paso los siguientes veinte minutos más o menos saboreando la comida y luego me reúno con los demás, que parecen estar preparándose para nuestra partida. Cuando ya estamos todos listos, Melindra toma la delantera y todos empezamos a seguirla mientras caminamos por la orilla del río, igual que ayer.
