  - name: b2_ch09a_energizer_path2
    routes:
      - condition: b2_ch9_cast1 = 0
        texts:
          - source: scene_text
            paragraph: 36
            text: |-
              No mucho después de volver a ponernos en marcha, de pronto siento una intensa sensación de fatiga y un fuerte dolor de cabeza que casi me hace caer de rodillas. Y como si el dolor de cabeza no bastara, una sensación de náusea también empieza a abrirse paso poco a poco mientras mantengo los ojos cerrados e intento ignorar el dolor.

              "¿Barry?", pregunta Daren. "¿Qué te pasa?"

              "Estoy teniendo... un poco de dolor de cabeza...", digo, intentando mantener un tono de voz lo más tranquilo posible.

              "Oooh, ¡debe de haberse acabado el efecto del hechizo energizante!", dice Melindra. "Supongo que eso significa que el mío también se acabará pronto."

              Entonces pronuncia rápidamente un encantamiento y mueve las manos en el aire mientras se lanza un segundo hechizo energizante a sí misma.

              "¿Qué energi--?", dice Daren, pero se interrumpe cuando entiende lo que está pasando. "Ah, estás hablando de lo de anoche, ¿verdad? Y déjame adivinar: Barry nunca había usado un hechizo energizante antes, así que está sufriendo la peor clase de efectos secundarios. ¿Tengo razón?"

              "Sí", dice Melindra. "Pero todo esto debería solucionarse si le lanzo otro hechizo energizante."
          - source: scene_text_2
            paragraph: 29
            text: |-
              "¡No!", le digo. "¡Ya dije que no quiero que me lances un segundo hechizo energizante! Daren, por casualidad no tendrás algún hechizo que cure dolores de cabeza y náuseas, ¿verdad?"

              "Sí lo tengo", dice Daren, "pero no voy a arriesgarme a lanzarte ahora mismo ningún tipo de hechizo curativo, a menos que estemos hablando de una emergencia que ponga en peligro tu vida. Lanzar hechizos curativos sobre alguien cuyo corazón se ha visto debilitado hace poco por un hechizo energizante es buscarse toda clase de problemas. Sinceramente, será mejor que dejes que Melindra te lance ese segundo hechizo energizante. Seguiría forzándote el corazón, sí, pero al menos lo haría de manera más gradual, y el riesgo de un fallo cardíaco cuando solo has usado este hechizo una vez antes en toda tu vida es prácticamente inexistente."
