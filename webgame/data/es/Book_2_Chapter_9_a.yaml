              Al oír el tono de la voz de Daren, me doy cuenta enseguida de que no tengo tiempo de girarme ni tiempo de pensar, así que dejo que me guíen los instintos y salto para apartarme del árbol que cae detrás de mí justo en el momento en que estaba a punto de aplastarme bajo su peso.

              Mientras miro el gran tronco del árbol caído frente a mí, me doy cuenta con horror de que, si hubiera reaccionado solo una fracción de segundo más tarde, se habría acabado para mí.
