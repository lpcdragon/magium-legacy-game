  - name: b2_ch09a_drying
    texts:
      - source: scene_text
        paragraph: 51
        text: |-
          "Ya he tenido bastante de esto", dice Kate de repente, y una gran cúpula de hielo empieza a formarse rápidamente a nuestro alrededor hasta cubrirnos por completo, protegiéndonos del viento y la lluvia.

          "Kate, ¿qué estás haciendo?", dice Daren.

          "Vamos a descansar un rato", dice Kate. "Tal como están las cosas, solo nos estamos agotando sin ninguna razón. Apenas avanzamos con este viento empujándonos hacia atrás y, a este paso, la mitad de nosotros estaremos exhaustos antes incluso de meternos en una pelea."

          "Incluso yo me veo obligada a estar de acuerdo con la maga de hielo", dice Melindra. "Intentar caminar a través de esta tormenta es una pérdida de tiempo absoluta. Será mejor que simplemente descansemos un rato y reanudemos el viaje después."

          "Bueno, si los demás también están de acuerdo con esto...", dice Daren.

          "Sí, creo que a todos nos vendría bien una pequeña pausa justo ahora", dice Hadrik.

          "¡Entonces los secaré a todos!", dice Flower.

          Entonces hace aparecer unas cuantas docenas de pequeñas bolas de fuego voladoras y nos envía varias a cada uno. Las bolas de fuego empiezan enseguida a girar a nuestro alrededor, acercándose muchísimo a la ropa para evaporar toda el agua.

          "Vaya... cuidado con eso...", dice Hadrik al ver una bola de fuego acercarse a su cara.

          "No te preocupes", dice Flower. "Llevo secándome así desde siempre. No te vas a quemar."
      - source: scene_text_2
        paragraph: 40
        text: |-
          "Eso espero...", dice Daren, mirando con desconfianza una de las bolas de fuego que giran a su alrededor.

          Una vez estamos todos secos, Flower cancela el hechizo y cada una de las bolas de fuego se desvanece en el aire.

          "¡Muy bien!", dice Hadrik, juntando las manos con una fuerte palmada. "Bueno, parece que vamos a quedarnos aquí un rato, así que ¿qué tal si encontramos algo de lo que hablar antes de morirnos de aburrimiento?"

          "¿Como qué?", dice Daren.

          "Como que, por ejemplo, Barry podría contarnos cómo va su progreso para encontrar los vacíos legales de Eiden", dice Hadrik. "Eso es algo que le interesa a todo el mundo, ¿no?"

          "O quizá podríamos evitar revelar nuestras estrategias delante de alguien que ha admitido abiertamente ser amiga de Eiden", dice Kate con tono frío.

          "Vamos", dice Hadrik. "No es como si fuera a ir a contárselo. ¿No viste cómo Eiden la ignoró hace dos días?"

          "Y aun así ella sigue considerándolo su amigo", dice Kate. "Lo dijo ella misma. ¿Qué le impide contarle todas nuestras estrategias la primera vez que vuelva a encontrarse con Eiden?"

          "¿En serio?...", dice Melindra. "¿Quieren que haga también otro juramento de encantador por eso? Porque lo haré, ¿saben? Tal vez así al menos ya no sentirán la necesidad de bajar la voz por cada pequeña cosa que dicen cuando estoy lo bastante cerca para oírlos."
    choices:
      - position: 1
        text: No hace falta que hagas otro juramento de encantador, Melindra.
        effects:
          - set:
              current_scene: b2_ch09a_oath
              b2_ch9_oath: 0
      - position: 2
        text: La verdad, no sería tan mala idea.
        effects:
          - set:
              current_scene: b2_ch09a_oath
              b2_ch9_oath: 1
  - name: b2_ch09a_oath
    routes:
      - condition: b2_ch9_oath = 0
        texts:
          - source: scene_text
            paragraph: 52
            text: |-
              "No hace falta que hagas otro juramento de encantador, Melindra."

              "¿Ah, no?", dice Melindra. "Entonces, ¿qué prefieres que haga? ¿Taponarme los oídos?"

              "Nada", digo. "Porque en realidad aún no he descubierto nada nuevo sobre los vacíos legales de Eiden."

              "Maldición...", dice Hadrik. "Así que supongo que seguimos sin conocer ninguna debilidad de Eiden, entonces."

              "Bueno, yo no diría que no conocemos NINGUNA debilidad de Eiden", digo. "Solo depende de lo que estés dispuesto a considerar una debilidad. Por ejemplo, ¿recuerdas aquella vez que Eiden nos teletransportó a todos a tu ubicación justo después de que volvieras a convertirte en gigante y retaras a todo el mundo a una pelea?"
          - source: scene_text_2
            paragraph: 41
            text: |-
              "¡Ah, sí, me acuerdo!", dice Hadrik. "Fue el segundo día del torneo."

              "Bueno", digo, "la cosa es que Eiden teletransportó a todos los participantes del torneo que había en los alrededores, incluidos Daren, Kate y yo, pero no se dio cuenta de nuestra presencia hasta más tarde. Eso significa que, aunque tenga la capacidad de vigilar a todos los de la isla con su sentido mágico, sigue sin poder concentrarse en todos al mismo tiempo. Eso demuestra que, incluso con todo su poder, todavía tiene algunas debilidades propias de una persona normal. Todavía puede distraerse."

              "Bueno, en lo que se refiere a debilidades, esta no parece muy útil", dice Hadrik.

              Me encojo de hombros.

              "Es un comienzo", digo. "Cuando te enfrentas a un enemigo de este calibre, yo diría que cualquier pequeño dato ayuda."

              "Justo", dice Hadrik. "Entonces, ¿y si intentáramos descubrir cosas sobre su pasado? O sus motivaciones. Tal vez eso podría ayudarnos a luchar contra él de alguna forma. Como por ejemplo, quizá podríamos averiguar por qué está llenando todo el continente con esos extraños hechizos invisibles."
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch09a_downhill
      - condition: b2_ch9_oath = 1
        texts:
          - source: scene_text
            paragraph: 53
            text: |-
              "La verdad, no sería tan mala idea."

              "Desde luego no haría daño", dice Kate.

              "¿Van en serio?...", dice Daren.

              "Bueno, ya los oíste, encantador", dice Melindra, acercándose a él y tocando con un dedo el filo de su hoja.

              Luego levanta el dedo en el aire, con pequeñas gotas de sangre cayendo de él, mientras espera a que Daren active el encantamiento del juramento en su espada.

              "Vale, lo que sea", dice Daren, sosteniendo la espada bajo el dedo de Melindra y dejando que caigan sobre ella unas cuantas gotas de sangre.

              "Di el juramento y acabemos con esto, ¿quieres?", dice Daren, mientras su espada empieza a brillar intensamente con una luz blanca.

              "Vale", dice Melindra. "Juro que nunca le diré a Eiden nada sobre ninguna estrategia que ustedes comenten, ni sobre nada que digan que pudiera usarse contra él de ninguna manera."

              Hace una pausa.

              "¿Les basta con eso o quieren que añada algún otro voto a la lista, ya que estamos?", dice Melindra.
          - source: scene_text_2
            paragraph: 42
            text: |-
              "Basta con eso...", dice Kate.

              "Por fin", dice Daren, colocando la mano sobre la espada para confirmar el juramento, y entonces la espada pierde su luz.

              "Bueno... Eso acaba de pasar...", dice Hadrik. "Ahora, Barry, ¿qué ibas a contarnos sobre los vacíos legales de Eiden?"

              "Oh, no iba a contarles nada", digo. "Porque no he descubierto nada nuevo desde que encontré el vacío legal sobre los hechizos de protección de Daren."

              "Espectacular", dice Melindra. "Bueno, al menos ahora todos pueden estar tranquilos sabiendo que esta información crucial jamás llegará a los oídos de Eiden."

              "Maldición...", dice Hadrik. "Así que supongo que seguimos sin conocer ninguna debilidad de Eiden, entonces."

