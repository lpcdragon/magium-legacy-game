              "¿Recuerdas cómo encontré un corredor secreto en el castillo de Thilias la primera vez que lo visitamos?"

              "Oh... sí, sí, me acuerdo", digo.

              "Bueno", dice Flower, "la cuestión es que lo que encontré dentro de ese corredor fue una pieza del rompecabezas colocada allí por un antiguo arquitecto de Varathia, y también un mensaje que decía que, si encontraba todas las piezas del rompecabezas, descubriría uno de los mayores secretos del arquitecto."

              "Ya veo...", digo.

              "En fin", continúa Flower, "cuando Daren oyó nuestra conversación, dijo que ustedes también encontraron una pieza del rompecabezas en las ruinas donde nos conocimos y que eres tú quien la tiene. ¿Te importaría dármela o tú también estás intentando reunir todas las piezas?"
