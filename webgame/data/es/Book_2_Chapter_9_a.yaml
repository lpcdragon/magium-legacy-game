    texts:
      - source: scene_text
        paragraph: 24
        text: |-
          Viajamos en línea recta durante la siguiente hora más o menos y, de vez en cuando, vemos a uno o dos magos demasiado ocupados como para reparar en nosotros, llenando sus mochilas de piñas como si les fuera la vida en ello.

          "¿Qué creen que están haciendo?", nos pregunta Hadrik mientras pasamos junto a dos magos ocupados recogiendo piñas. "¿No se supone que deberían limitarse a comprobar si las piñas se iluminan en sus manos? ¿Por qué iban a molestarse en recogerlas de verdad?"
