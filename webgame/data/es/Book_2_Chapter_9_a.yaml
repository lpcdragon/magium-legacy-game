  - name: b2_ch09a_kate_path
    texts:
      - source: scene_text
        paragraph: 34
        text: |-
          Como no tengo nada concreto que hablar con nadie en particular, decido sacar mi cuaderno y ponerme a leer.

          Al cabo de un rato, me doy cuenta de que los demás se están reuniendo poco a poco y preparándose para partir, así que vuelvo a guardar el cuaderno en la mochila y me preparo para unirme a ellos también.

          "Prepárense", dice Daren. "La lluvia podría empezar a caer en cualquier momento, a juzgar por la intensidad del viento. Recuerden mantenerse juntos y tener cuidado con los árboles que puedan caer."

          "Vamos por aquí", dice Melindra, tomando la delantera. "Síganme."

          Seguimos a Melindra durante media hora más o menos y, durante ese tiempo, el viento se intensifica considerablemente. Al cabo de un rato, empezamos a ver relámpagos y, poco después, nos cae encima un aguacero como nunca habíamos visto. Tarda menos de un minuto en dejarnos a todos completamente empapados y el potente viento que nos lanza las gotas de lluvia a la cara hace que parezca casi como si estuviéramos bajo una cascada, en vez de simplemente caminando bajo la lluvia. A medida que avanzamos, el viento empieza a soplar todavía más fuerte y ahora sí parece de verdad que los árboles están a punto de ser arrancados de raíz.
      - source: scene_text_2
        paragraph: 26
        text: |-
          "¡Manténganse cerca unos de otros!", grita Daren para asegurarse de que podamos oírlo por encima del ruido del viento. "Y cuidado con los rayos. Siempre deberíamos procurar tener árboles altos a nuestro alrededor, para que los rayos los alcancen a ellos y no a nosotros. Eviten volar a toda costa. Vamos, sigan avanzando."

          Mientras avanzamos a través de la tormenta, el viento acaba por arrancar algunos árboles de raíz, pero todos logramos evitar sufrir heridas al mantenernos alerta y prestar atención a lo que nos rodea.

          Seguimos adelante durante otros veinte minutos, pero la tormenta no parece que vaya a detenerse pronto. De hecho, empeora a cada minuto. Cada vez que oímos un trueno, parece casi como si alguien hubiera detonado un poderoso hechizo explosivo en nuestras inmediaciones. El viento es ahora casi lo bastante fuerte como para empujarnos hacia atrás mientras caminamos y el número de gotas de lluvia también ha aumentado muchísimo. ¿Es que esta tormenta no va a terminar nunca?
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch09a_drying
  - name: b2_ch09a_energizer_path
    routes:
      - condition: ch11_saved_rose = 1 AND ch11_romance_rose = 1
        texts:
          - source: scene_text
            paragraph: 35
            text: |-
              Me pregunto si Kate sigue molesta conmigo por lo que pasó anoche. Tal vez debería ir a hablar con ella. Sí, definitivamente debería ir a hablar con ella.

              Dejo la mochila junto al tocón y voy hacia Kate, que sigue comiendo sola su almuerzo. Cuando llego hasta ella, Kate me lanza una mirada de reojo y luego sigue comiendo sin mirarme.

              "Oye...", digo, colocándome delante de ella. "Me preguntaba si podríamos hablar."

              "¿Por qué?", me responde Kate con voz fría, mirando solo su comida. "¿Qué hay de qué hablar?"

              "Bueno, parecías muy molesta esta mañana, cuando descubriste lo que pasó anoche entre Melindra y yo", digo.

              "¿Lo parecía?", dice Kate, con la misma voz fría. "No lo recuerdo."

              Entonces da otro mordisco a su queso salado, sin establecer contacto visual conmigo.

              "Sí que lo parecías", digo. "Y sigues estándolo. Escucha, no quería enfadarte."
          - source: scene_text_2
            paragraph: 27
            text: |-
              "Bueno, quizá deberías haber pensado en eso antes de compartir cama con el enemigo", dice Kate.

              "¡Melindra no es nuestra enemiga!", le digo.

              "Es una stillwater", dice Kate. "Y amiga de Eiden. Lo único que ha hecho desde que se unió al grupo ha sido ocultarnos información importante y no ofrecer ayuda alguna, ni siquiera cuando luchábamos por nuestras vidas. ¿Qué te estaba pasando por la cabeza cuando elegiste dormir con ella?"

              "Mira, sé que no te gusta Melindra, pero..."

              "He terminado de hablar de esto", dice Kate, levantándose de repente del suelo y dirigiéndose hacia una zona donde no hay nadie del grupo.

              "Espera, ¿adónde vas?", le pregunto.

              "A algún sitio donde pueda tener un poco de paz y tranquilidad mientras termino de comer", dice Kate. "No me sigas."

              Después de dar unos pasos, se detiene unos segundos al recordar que había algo que se le había olvidado decirme.

              "Ah", dice Kate, "y la próxima vez que decidas hacerle una promesa a Rose de volver a por ella, quizá podrías tomártela un poco más en serio."

              Entonces se adentra más en el bosque y me deja atrás sin decirme una palabra más.
          - source: scene_3
            paragraph: 17
            text: |-
              Como está claro que Kate no quiere seguir hablando conmigo ahora mismo, decido volver a mi tocón para leer un poco antes de que nos marchemos. Cuando llego al tocón, me siento, saco el cuaderno de la mochila y empiezo a leer.

              Al cabo de un rato, me doy cuenta de que los demás se están reuniendo poco a poco y preparándose para partir, así que vuelvo a guardar el cuaderno en la mochila y me preparo para unirme a ellos también.

              "Prepárense", dice Daren. "La lluvia podría empezar a caer en cualquier momento, a juzgar por la intensidad del viento. Recuerden mantenerse juntos y tener cuidado con los árboles que puedan caer."

              "Vamos por aquí", dice Melindra, tomando la delantera. "Síganme."
        choices:
          - position: 1
            text: Continuar
            effects:
