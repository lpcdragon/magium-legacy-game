  - name: b2_ch09a_kick
    texts:
      - source: scene_text
        paragraph: 8
        text: |-
          "Bueno, ¡eso no me suena a ningún hechizo estándar que conozca!", me grita Daren. "Técnicamente, podría intentar disiparlo, pero como no estoy familiarizado con él, ¡podría hacer más mal que bien! Si fuera una maldición o algo así, sería justo mi especialidad, pero esto parece más bien un hechizo que está aprovechando sus poderes elementales de algún modo. ¡Creo que sería mejor intentar convencer a Melindra de que deshaga el hechizo ella misma!"

          "Bueno, dijo '¡Disfruta del resto de tu mañana!', así que no creo que tenga pensado disiparlo pronto", digo.

          "¡Quizá cambie de opinión!", grita Daren. "En cualquier caso, ve a desmontar tu tienda y a desayunar, y luego ya veremos qué hacemos."

          Mientras Daren vuelve a desmontar su propia tienda, Flower se me acerca para preguntarme algo. Sin embargo, apenas logro entender la mitad de las palabras que está diciendo.

          "Barry... ¿algo de...?", dice Flower, mientras el sonido del viento en mis oídos me impide oír la frase completa. "...hacer algo... si quieres."

          "¿¡QUÉ!?", le pregunto.

          "¡Te estaba preguntando si quieres que te prepare algo de comer!", grita Flower, después de acercarse más a mí.
      - source: scene_text_2
        paragraph: 8
        text: |-
          "Tengo algo de comida en mi mochila", digo, "pero tendría que ser idiota para rechazar tu cocina. ¿Qué plato tienes en mente?"

          "Bueno", grita Flower. "El evento de la arena me recordó unas viejas recetas que conocía. No sé si alguna vez tuviste la oportunidad de comer estofado de aplastador o pastel de puercospín arquero, pero ambos son platos muy raros, normalmente reservados para reyes. ¡Te los tendré listos en un segundo!"

          En cuanto Flower termina de hacer aparecer la comida para mí, va a ver a Melindra para preguntarle si ella también quiere que le prepare algo. Me tomo mi tiempo para saborear la comida y, una vez termino de comer, decido desmontar mi tienda. Luego se la devuelvo a Hadrik y me preparo para partir.

          Cuando nos reunimos todos para reanudar el viaje, miro largamente al cielo y veo que está todavía más oscuro que cuando me desperté. Tengo la sensación de que pronto podría desatarse una tormenta. Mientras sigo allí parado, mirando hacia arriba, de repente aparece frente a mi cara un mensaje azul flotante.

          "Daren lleva diez segundos preguntándote si ya estás listo para irte...", escribe Leila.

          "¿Qué?", digo, girando la cabeza hacia los demás.
      - source: scene_3
        paragraph: 5
        text: |-
          Ahora mismo todos me están mirando, incluido Daren, que tiene una expresión ligeramente molesta en la cara.

          "Oh, sí, sí, ya estoy listo para irme", les grito por puro instinto, aunque están todos bastante cerca de mí.

          Daren se golpea la frente con fuerza con la mano derecha y luego empieza a discutir con Melindra, aunque yo no puedo oír ni una palabra de lo que dicen. Por la forma en que gesticulan, estoy bastante seguro de que Daren está intentando darle razones de por qué sería una mala idea que yo siguiera sordo durante todo el viaje. Le cuesta un rato, pero al final consigue convencerla para que deshaga su hechizo, y Melindra hace un movimiento circular con una de las manos, mientras siento cómo el viento de su hechizo deja poco a poco de soplarme en los oídos.

          "Ya deshice el hechizo", dice Melindra. "Ahora puede oírnos."

          "Por fin", dice Daren. "Ahora vamos, pongámonos en marcha. Ya hemos perdido bastante tiempo. Melindra, guía el camino."

          Tal como Daren le pidió, Melindra va al frente del grupo para guiarnos hasta nuestro destino mientras todos empezamos a caminar una vez más por la orilla del río.
