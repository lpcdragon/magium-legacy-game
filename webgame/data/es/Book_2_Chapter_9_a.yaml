  - name: b2_ch09a_feelings
    texts:
      - source: scene_text
        paragraph: 41
        text: |-
          Mientras miro hacia Kate, no puedo evitar acordarme de lo que Melindra me dijo ayer sobre que Kate siente algo por mí. ¿Debería ir a hablarlo con ella? No, no, no, eso solo acabaría poniéndonos en una situación incómoda. Pero, por otro lado, si nunca hablo con Kate de esto, las cosas nunca se aclararán.

          Tal vez podría encontrar una forma de sacar el tema de manera sutil, sin sobresaltarla demasiado. Debería dejar que la conversación fluya de forma natural y, cuando encuentre la oportunidad adecuada, introducir la idea como algo secundario, solo para ver cómo reacciona. Sí, eso podría funcionar. Eso haré.

          Dejo la mochila junto al tocón y voy hacia Kate, que sigue comiendo sola su almuerzo. Cuando llego hasta ella, Kate me nota y deja de comer mientras me mira para ver qué quiero.

          "Oye...", digo, colocándome delante de ella. "Me preguntaba si podía hablar contigo de algo."

          "Claro", dice Kate, dejando el plato en el suelo a su lado y mirándome directamente a los ojos para mostrarme que ahora tengo toda su atención. "¿Sobre qué?"
      - source: scene_text_2
        paragraph: 35
        text: |-
          Muy bien, Barry, aquí vamos. Solo recuerda: compórtate con naturalidad y sé sutil.

          "Hay algo en lo que llevo pensando desde ayer por la tarde y no consigo sacármelo de la cabeza...", digo.

          Entonces hago una pequeña pausa antes de continuar.

          "No sentirás algo por mí, por casualidad, ¿verdad?", digo.

          Maldita sea, eso no tuvo nada de sutil, ¿verdad?

          "...¿Has perdido la cabeza?", dice Kate, mirándome fijamente, sin saber muy bien qué pensar de mí.

          "¡No, espera!", digo. "Sé que parece que te estoy preguntando esto completamente de la nada, pero la verdad es que Melindra me dijo algo ayer que me llevó a hacerte esta pregunta."

          "Melindra otra vez...", dice Kate. "¿Qué te dijo?"

          "Bueno...", digo. "Me dijo que quizá tú sentías algo por mí... por esa mirada que le lanzaste cuando me agarró del brazo ayer, mientras fingía que éramos pareja."

          "Oh...", dice Kate, adoptando una expresión pensativa y apartando la mirada a un lado. "Ya veo..."

          Tras unos segundos de reflexión, Kate vuelve a mirarme directamente a los ojos y sigue hablando.
