  - name: b2_ch09a_panicked
    texts:
      - source: scene_text
        paragraph: 11
        text: |-
          Entonces va a la orilla del río, donde Flower estaba practicando con sus bolas de fuego, y le hace señas para que venga con ella frente a mi tienda. Cuando Flower llega hasta donde estoy, me llama con un tono preocupado.

          "Barry, ¿estás bien?", dice Flower. "No te preocupes, no creo que los demás estén tan enfadados contigo de verdad. Seguro que se les pasa antes de que termine el día."

          "Sí", digo, "bueno, habría sido muchísimo mejor si cierta persona se hubiera limitado a cerrar la boca, pero supongo que ya es demasiado tarde para pensar en eso."

          "Habla en serio", dice Melindra. "¿De verdad crees que tus amigos habrían dado más credibilidad a mi palabra que a la tuya si no fueras tan mal mentiroso? Te delataste muchísimo antes de que yo interviniera. Lo único que hice fue volver la situación más entretenida."

          "¿Qué quieres decir con que me delaté?", digo. "¡No dije nada que pudiera hacerme parecer sospechoso!"

          "No, tiene razón", dice Illuna. "Era obvio que estabas mintiendo incluso sin leer tu aura. Se te da realmente mal farolear cuando estás bajo presión."

          "¡Eh, Melindra!", dice Arraka. "Solo quiero comprobar una cosa contigo. Cuando dijiste que habían pasado toda la noche despiertos, ¿querías decir que les lanzaste a los dos un hechizo energizante?"

          "¿Y qué si fue así?", pregunta Melindra.

          "¡Ja!", dice Arraka. "¡Lo sabía! Ay, esto no hace más que mejorar y mejorar."

          Flower jadea.
      - source: scene_text_2
        paragraph: 11
        text: |-
          "Barry, ¿usaste un hechizo energizante?", dice. "¿Lo habías usado alguna vez antes?"

          "No, no lo usé, pero ¿por qué iba a importar eso?", digo.

          "¡Porque los hechizos energizantes tienen efectos secundarios muy serios la primera vez que los usas!", dice Flower. "¿No lo sabías?"

          "¿Qué?...", digo. "No, no sabía nada de ningún efecto secundario. Cuando estaba aprendiendo sobre magia, no pensé que estudiar hechizos energizantes fuera a servirme de gran cosa, así que nunca me molesté en aprender detalles sobre ellos."

          "¡Oooh!", dice Melindra. "¡Ahora me acuerdo! La primera vez que usé este hechizo sí tuve unos dolores de cabeza espantosos y una fuerte sensación de náuseas. Han pasado cientos de años desde entonces, así que se me había olvidado por completo."

          "¡Tienes que estar bromeando!", digo. "¿Y qué pasa con todos esos otros hombres a los que les lanzaste este hechizo energizante? ¿De verdad nunca notaste que se pasaban todo el día con dolor de cabeza después de pasar la noche contigo?"

          "Oh", dice Melindra. "Bueno, nunca me quedaba el tiempo suficiente para ver que aparecieran los efectos secundarios. Pero no te preocupes, te lanzaré otro hechizo energizante cuando empieces con el dolor de cabeza y estarás bien."
      - source: scene_3
        paragraph: 8
        text: |-
          "¡Lanzarle otro hechizo energizante!", dice Arraka. "¡Ja, ja, ja, ja! Me parto de risa. En serio, me estás matando. ¡Ja, ja, ja!"

          "Barry, ¡no puedes dejar que te lance otro hechizo energizante!", dice Flower, con una expresión de pánico en los ojos. "¡Y menos después de pasar una noche entera sin dormir! ¡Eso solo hará que los efectos secundarios sean aún peores cuando desaparezca el efecto del segundo hechizo!"

          "Bueno", dice Melindra, "¿quieres pasarte todo el día viajando con dolor de cabeza o prefieres tenerlo después de que montemos el campamento y puedas descansar? Solo digo que no tienes muchas opciones. No es como si un pequeño dolor de cabeza fuera el fin del mundo cuando estás a salvo en tu campamento y no necesitas estar constantemente alerta a todo lo que te rodea."
