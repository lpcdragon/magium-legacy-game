            paragraph: 42
            text: |-
              "No lo sé. No estaría tan seguro de eso."

              "¿Por qué no?", pregunta Kate.

              "Bueno, el ganador de la pelea seguiría dependiendo de varios factores", digo. "Por ejemplo, si la pelea ocurriera bajo tierra o dentro de un edificio, no podrías salir volando para ponerte a salvo. E incluso si peleáramos en un campo abierto, todavía podría llevarme la ventaja si empezáramos relativamente cerca el uno del otro. Por lo que he visto en el pasado, eres particularmente vulnerable a los ataques por sorpresa, así que si lograra acercarme a ti más rápido de lo que pudieras reaccionar para defenderte, creo que tendría una buena oportunidad de... ¡Espera un segundo! Esta conversación que estamos teniendo ahora mismo... es solo hipotética, ¿verdad? Si el torneo nos obligara a enfrentarnos... no intentarías matarme de verdad, ¿o sí?"

              "No lo haría", dice Kate. "¿Y tú?"

              "Yo... no creo que pudiera, no...", digo.

              "Bueno, entonces", dice Kate, haciendo desaparecer su daga de hielo en el aire, "supongo que ambos deberíamos sentirnos afortunados de no ir a competir el uno contra el otro."
          - source: scene_text_2
            paragraph: 36
            text: |-
              Hace una pausa.

              "Pero creo que ya sabes que con Daren las cosas no irán tan bien", continúa Kate. "Ustedes dos son prácticamente los únicos miembros de nuestro grupo que de verdad aspiran a ganar este torneo, así que, si ambos siguen por el camino actual, al final no les quedará más remedio que pelear entre ustedes. Solo puede haber un ganador del torneo del Magium."

              "Sí... lo sé", digo.

              Entonces ambos permanecemos en silencio un rato antes de volver a hablar.

              "Muy bien", digo. "Supongo que te dejaré terminar de comer. Mientras tanto, iré a ver si encuentro más información útil en mi cuaderno sobre los vacíos legales de Eiden."

              "Buena suerte", dice Kate, recuperando su plato y reanudando la comida.

              Después de terminar mi conversación con Kate, vuelvo hacia mi tocón para leer un poco antes de que nos marchemos.
