  - name: ch7_home_address
    texts:
      - source: scene_text
        paragraph: 562
        text: |-
          "¿¡Qué!?" pregunta Daren, completamente atónito.

          "Tienes unas habilidades deductivas realmente impresionantes, Barry," me dice Hadrik. "¿Cómo lo averiguaste?"

          "Bueno, desde que te vi en el claro, pude notar por tu aura mágica que ya estabas usando cambio de forma. Pero la magia de cambio de forma solo puede usarse para modificar tu tamaño o para transformarte en otra criatura. No puede usarse para disfrazarte como otra persona. Así que supuse que tenías que tener algún tipo de razón para parecer más pequeño de lo que realmente eras. Fue entonces cuando recordé tu forma de gigante de cuando nos llamaste por primera vez. Normalmente debería ser imposible que alguien se transforme en gigante, porque violaría las leyes del cambio de forma. Eso me hizo darme cuenta de que tenía que ser al revés, y que la forma de gigante era en realidad tu forma original."

          Hadrik se ríe de nuevo.

          "Bueno, descubriste mi secreto," dice. "¿Qué vas a hacer ahora? ¿Me delatarás a los organizadores para que me echen del torneo? ¿Vas a usar esta información para chantajearme y que os ayude con los objetivos?"
      - source: scene_text_2
        paragraph: 75
        text: |-
          "¿Qué?" le pregunto. "No, no seas ridículo. Si hiciera algo de eso, ¿qué te impediría a ti denunciarme también por haberme unido a este torneo de magos siendo un humano corriente? La realidad es que a los organizadores probablemente les da igual. Ni siquiera se molestaron en hacer una evaluación mínima de los concursantes, y dejaron que cientos de personas corrientes como yo se unieran a este torneo sin siquiera considerar las implicaciones. ¿Por qué les iba a importar si también dejaron entrar a un par de gigantes?"

          "Creo que puede que tengas razón," dice Hadrik. "Bueno, supongo que ya son suficientes preguntas por ahora. ¡Si seguimos así, puede que termine dando mi dirección de casa! ¡Jajajajaja!"

          Mientras avanzamos por el bosque, empezamos a ver unas luces amarillas brillantes circulando alrededor de los árboles.

          "¿Qué son esas cosas?" pregunto, mientras señalo hacia una de las luces amarillas. "¿Luciérnagas enormes?"

          "Oh..." dice Rose. "Oh, no... Esto no es bueno. Tenemos que salir de este lugar lo más rápido posible."

          "¿Por qué?" le pregunto. "¿Qué pasa?"

          "No son luciérnagas, son espíritus del bosque. Debemos haber entrado en su bosque sagrado por accidente. ¡No se nos permite estar aquí!"
