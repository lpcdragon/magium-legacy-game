  - name: ch7_help
    texts:
      - source: scene_text
        paragraph: 503
        text: |-
          "Lo siento, Daren, pero no puedo abandonarla así. No tienes que hacer esto si no quieres."

          Con estas palabras, dejo a Daren atrás y me pongo al lado de Kate en el campo de batalla.

          "¿¡Qué estás haciendo!?" me pregunta Kate. "¿Qué demonios te pasa? ¿No entiendes que esta pelea no se puede ganar? ¡Iba a ganar tiempo suficiente para que escaparais! ¡No se suponía que vinieras aquí!"

          "Tío, sí que sabes cómo arruinar el momento. Y yo que pensaba que esto se convertiría en un momento emotivo e inspirador para consolidar nuestra amistad."

          "¡Lo único que está a punto de consolidarse aquí es un garrote de hielo que voy a usar para partirte tu estúpida cabeza!"

          "Jeh. Debería enfadarme, pero de algún modo este escenario parece mucho más apropiado para nuestros últimos momentos juntos."

          "Qué patético," dice el mago de túnicas rojas. "Deberías haberte quedado atrás y dejar que la banshee peleara contra nosotros. ¿De verdad crees que puedes marcar alguna diferencia?"

          "No lo sé. ¿Por qué no me lo dices tú? ¿Crees que un stillwater podría marcar alguna diferencia en esta pelea?"

          "No. Ni siquiera un stillwater podría cambiar las tornas contra tanta gente. Pero tú ni siquiera eres eso, ¿verdad? Eres solo un tipo corriente que intenta abarcar más de lo que puede."
      - source: scene_text_2
        paragraph: 33
        text: |-
          "Supongo que las tácticas de intimidación no funcionan mucho contigo, ¿eh?" le pregunto mientras saco mi daga. "Bien, hagámoslo. ¡Da tu mejor golpe!"

          Mientras los dos hablábamos, los demás magos estaban ocupados moviéndose para rodearnos. Eiden parece haberse teletransportado lejos, probablemente por aburrimiento, y el enano también está corriendo hacia nosotros. El Sabio del Oeste parece no saber qué hacer con todo este asunto, y observa todo desde lejos mientras se acaricia suavemente la barba blanca.

          El mago de las túnicas rojas decide iniciar lanzando una bola de fuego a Kate. Conjura rápidamente un muro de hielo frente a ella, que se derrite al impactar con la bola de fuego, pero nos protege de la explosión. El mago de las túnicas rojas se prepara para atacarla de nuevo, pero antes de que pueda actuar, Hadrik se coloca entre Kate y su atacante y empieza a jadear pesadamente.

          "Esperad... Solo... dadme un segundo..." dice, mientras todos lo miran confundidos. "Tío... es que no me acostumbro a correr con estas piernas tan cortas..."

          "No tengo nada en contra tuya, enano," dice el mago de los ojos enloquecidos y las túnicas rojas. "Hazte a un lado y déjanos encargarnos de ese monstruo que tienes detrás."

          "Me temo que no puede ser," dice el enano. "¡No puedo quedarme de brazos cruzados mientras tratáis a una dama con falta de respeto!"
      - source: scene_3
        paragraph: 5
        text: |-
          "¿Una qué?..." pregunta el elementalista de fuego, conmocionado. "Por favor, dime que no eres tan estúpido como pareces. ¿Sientes esa aura mágica que viene de ella? Incluso alguien como tú debería poder entender lo que eso significa y lo que hay que hacer. Esa mujer que tienes detrás es una banshee. Una abominación nacida de las profundidades más oscuras del infierno que necesita ser erradicada."

          "¿Ah sí?" dice Hadrik, con una sonrisa satisfecha. "¿Lo es?"
