            paragraph: 482
            text: |-
              "Oye, Barry, ¿me escuchas?", oigo la voz de Daren desde el transceptor.

              Toco el dispositivo una vez y le respondo.

              "Sí, Daren, te escucho alto y claro. ¿Qué pasa?"

              "Odio tener que interrumpirte y todo eso, pero si queremos llegar a cualquier tipo de refugio antes de que se ponga el sol, deberíamos ponernos en marcha ahora mismo."

              Kate y yo nos miramos.

              "De acuerdo", digo. "Estaremos ahí enseguida."

              Toco el transceptor de nuevo para desactivarlo, y empezamos a caminar hacia Daren.

              "¿Qué vas a decirle a Daren?", me pregunta Kate mientras volvemos.
