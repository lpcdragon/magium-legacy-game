  - name: ch7_beacon
    texts:
      - source: scene_text
        paragraph: 474
        text: |-
          "¿Tiene esto algo que ver con el Faro de Esperanza?"

          "Sí... Esto tiene todo que ver con el Faro de Esperanza."

          Hace una pausa.

          "El Faro era... una especie de orfanato. Acogían a niños de todo el continente y les ofrecían refugio y comidas gratis. Yo nací en Varathia, y fui abandonada de niña, así que me enviaron allí a una edad muy temprana. La institución estaba dirigida por un puñado de Lessathi muy influyentes en aquel entonces, que tenían lazos profundos con la realeza varathiana. Desafortunadamente, el verdadero propósito de ese orfanato no era dar refugio a niños que no tenían hogar, sino explotarlos porque no tenían familiares que pudieran preguntar por ellos. Mediante repetidos experimentos, los Lessathi intentaban encontrar una forma de convertir a humanos normales en magos."

          "Entonces, ¿lo que dices es que obtuviste tus poderes como resultado de esos experimentos?"

          "Así fue... Aunque los métodos que usaban tenían una probabilidad de éxito extremadamente baja. Inyectar circuitos mágicos a la fuerza en un cuerpo humano no solo es un procedimiento muy arriesgado, sino también... particularmente doloroso. De los miles de huérfanos que fueron retenidos en esa institución, solo un puñado de nosotros sobrevivió. Debido a la falta de resultados, los Lessathi eventualmente dejaron de recibir fondos para su proyecto de la realeza, y se vieron obligados a cerrar el Faro."
      - source: scene_text_2
        paragraph: 17
        text: |-
          "Entonces, eh... ¿simplemente los dejaron ir después de eso?"

          "No, no lo hicieron. Yo era parte de los rechazados. Sus prolongados experimentos habían fallado de alguna manera en matarme, pero mi magia era tan débil en ese momento que apenas podía conjurar un copo de nieve. No tenían necesidad de rechazados, así que simplemente nos abandonaron en otros continentes. Usaron su magia de teletransportación para transportar a cada uno de nosotros a varias selvas remotas alrededor del mundo, sin nada a nuestro nombre más que la ropa que llevábamos puesta, y algunos cuchillos que nos dieron para defendernos. Yo tenía doce años en ese momento."

          Los ojos de Kate se desvían a la izquierda mientras habla y su mirada se vuelve más distante. Debe estar reviviendo esos momentos de hace mucho tiempo mientras me los cuenta.

          "Pasé semanas en esa selva, cazando animales pequeños y evitando depredadores para sobrevivir. Cuando finalmente logré llegar a la civilización, fui recibida con gritos aterrados, y gente huyendo al verme. No me llevó mucho tiempo enterarme de las banshees, y entender que ya no había un lugar para mí en la sociedad. Con el tiempo, empecé a encontrarme con cazadores de banshees y magos blancos que querían purificarme. Afortunadamente, para cuando empecé a encontrármelos, mis poderes mágicos habían aumentado considerablemente, y pude defenderme."
    choices:
      - position: 1
        text: Lo siento mucho...
        effects:
          - set:
              current_scene: ch7_sorry_beacon
      - position: 2
        text: ¿Qué pasó con los otros rechazados?
        effects:
          - set:
              current_scene: ch7_rejects_beacon
  - name: ch7_lessathi
    texts:
      - source: scene_text
        paragraph: 475
        text: |-
          "¿Puedes primero decirme quiénes son exactamente estos Lessathi? Tenía entendido que eran alguna raza antigua de este continente que se extinguió hace mucho tiempo."

          "Sí y no. Son de hecho la raza más antigua de este continente, por lo que la mayoría de la gente se refiere a ellos simplemente como 'los antiguos'. Sin embargo, aunque su civilización cayó hace cientos de años, todavía hay pequeños grupos de Lessathi aquí y allá, manteniéndose ocultos e intentando influir en los acontecimientos desde las sombras. Que yo sepa, no hay registros que expliquen la razón exacta de la caída de su civilización, pero se cree comúnmente que su propia arrogancia fue de alguna manera la fuente de su perdición. Su estandarte es, después de todo, un halcón sosteniendo el sol en sus garras, donde el halcón representa a los Lessathi, y el sol representa a los dioses."

          "Espera un momento, reconozco esa descripción del estandarte. ¿Me estás diciendo que Eiden quiere que transmita su mensaje a los restos de alguna raza olvidada hace mucho tiempo?"

          "Sí, eso es lo que digo. No tengo ni idea de dónde conoce a estas personas ni cuál es el significado de su mensaje. Tenía la impresión de que la mayoría de la gente ni siquiera sabe que los Lessathi todavía existen. Son muy reservados, y también muy aislados de todas las demás razas. Tienen sus propias aldeas, ocultas del resto del mundo, y solo se les permite casarse con otros Lessathi. Por eso me sorprende mucho que desconozcas tu propia herencia."

          "Entonces, si los antiguos están ocultos de la mayor parte del mundo, ¿cómo es que tú sabes tanto sobre ellos?"

          Kate hace una pausa.
      - source: scene_text_2
        paragraph: 18
        text: |-
          "¿Recuerdas cómo Eiden dijo que yo era una superviviente del Faro de Esperanza?"

          "Sí. Nunca me dijiste qué era."

          "El Faro era... una especie de orfanato. Acogían a niños de todo el continente y les ofrecían refugio y comidas gratis. Yo nací en Varathia, y fui abandonada de niña, así que me enviaron allí a una edad muy temprana. La institución estaba dirigida por un puñado de Lessathi muy influyentes en aquel entonces, que tenían lazos profundos con la realeza varathiana. Desafortunadamente, el verdadero propósito de ese orfanato no era dar refugio a niños que no tenían hogar, sino explotarlos porque no tenían familiares que pudieran preguntar por ellos. Mediante repetidos experimentos, los Lessathi intentaban encontrar una forma de convertir a humanos normales en magos."

          "Entonces, ¿lo que dices es que obtuviste tus poderes como resultado de esos experimentos?"

          "Así fue... Aunque los métodos que usaban tenían una probabilidad de éxito extremadamente baja. Inyectar circuitos mágicos a la fuerza en un cuerpo humano no solo es un procedimiento muy arriesgado, sino también... particularmente doloroso. De los miles de huérfanos que fueron retenidos en esa institución, solo un puñado de nosotros sobrevivió. Debido a la falta de resultados, los Lessathi eventualmente dejaron de recibir fondos para su proyecto de la realeza, y se vieron obligados a cerrar el Faro."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch7_lessathi2
  - name: ch7_lessathi2
    texts:
      - source: scene_text
        paragraph: 476
        text: |-
          "Entonces, eh... ¿simplemente los dejaron ir después de eso?"

          "No, no lo hicieron. Yo era parte de los rechazados. Sus prolongados experimentos habían fallado de alguna manera en matarme, pero mi magia era tan débil en ese momento que apenas podía conjurar un copo de nieve. No tenían necesidad de rechazados, así que simplemente nos abandonaron en otros continentes. Usaron su magia de teletransportación para transportar a cada uno de nosotros a varias selvas remotas alrededor del mundo, sin nada a nuestro nombre más que la ropa que llevábamos puesta, y algunos cuchillos que nos dieron para defendernos. Yo tenía doce años en ese momento."

          Los ojos de Kate se desvían a la izquierda mientras habla y su mirada se vuelve más distante. Debe estar reviviendo esos momentos de hace mucho tiempo mientras me los cuenta.

          "Pasé semanas en esa selva, cazando animales pequeños y evitando depredadores para sobrevivir. Cuando finalmente logré llegar a la civilización, fui recibida con gritos aterrados, y gente huyendo al verme. No me llevó mucho tiempo enterarme de las banshees, y entender que ya no había un lugar para mí en la sociedad. Con el tiempo, empecé a encontrarme con cazadores de banshees y magos blancos que querían purificarme. Afortunadamente, para cuando empecé a encontrármelos, mis poderes mágicos habían aumentado considerablemente, y pude defenderme."
    choices:
      - position: 1
        text: Lo siento mucho...
        effects:
          - set:
              current_scene: ch7_sorry_lessathi
      - position: 2
        text: ¿Qué pasó con los otros rechazados?
        effects:
          - set:
              current_scene: ch7_rejects_lessathi
  - name: ch7_sorry_lessathi
    texts:
      - source: scene_text
        paragraph: 477
        text: |-
          "Lo siento mucho..."

          La mirada en los ojos de Kate se oscurece al escuchar mis palabras.

          "¿Parezco alguien que necesita tu lástima?", me dice, fríamente.

          "No, no quise decirlo así. ¡De verdad!"

          Kate suspira.

          "Lo sé", me dice. "Olvida lo que dije. Es la primera vez que le cuento esta historia a alguien, así que no sé qué esperaba."

          "Entonces, ¿qué pasó con los otros rechazados?"

          "Los demás... no lo lograron. Todos eran mucho más jóvenes que yo cuando fueron arrojados a la selva, así que no podían sobrevivir por su cuenta, incluso con las dagas que les dieron los Lessathi. Pasé los primeros años de mi nueva vida intentando rastrear a los otros huérfanos que fueron liberados, con la esperanza de que al menos algunos hubieran sobrevivido, pero al final, lo único que pude hacer por ellos fue darles un entierro decente."
      - source: scene_text_2
        paragraph: 19
        text: |-
          "¿Y Diane?"

          Kate se quedó algo desconcertada por mi pregunta. Supongo que olvidó que ya me había dicho el nombre de su amiga.

          "Diane era... mi mejor amiga, y la única razón por la que decidí volver a este agujero infernal", dice Kate. "Era una de las muy pocas personas que reaccionaron favorablemente a sus experimentos. Tanto ella como su hermano eran con mucha diferencia los más talentosos de todos los magos que habían sido creados en esa instalación. Debido a su talento, fue asignada a la fuerza de élite de los Lessathi, y a menudo servía como guardaespaldas personal de los miembros de más alto rango de su grupo."

          "Espera, si se volvieron tan fuertes, ¿cómo es que no se rebelaron?"

          "Los Lessathi tenían unos collares que usaban para evitar que los magos usaran su magia contra ellos. Los efectos eran algo similares a los de los hechizos que nos impiden atacar a los locales en este torneo. Estoy bastante segura de que los artefactos usados para lanzar estos hechizos sobre nosotros también fueron hechos por los Lessathi, hace unos miles de años."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch7_shelter
