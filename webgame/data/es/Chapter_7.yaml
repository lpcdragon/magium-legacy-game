    texts:
      - source: scene_text
        paragraph: 485
        text: |-
          "Voy a decirle la verdad. Si vamos a seguir viajando juntos, necesita saberlo."

          "No va a creer lo que te dije. No tengo pruebas que respalden mis afirmaciones."

          "No te preocupes, ¡ya encontraremos la manera!"

          Kate no parece compartir mi optimismo sobre el asunto, pero decide dejarlo por ahora.

          Al volver, vemos a Daren y Rose con sus mochilas listas, esperándonos impacientemente.

          "Por fin", dice Daren. "Espero que hayáis dicho todo lo que necesitabais, porque no vamos a hacer más descansos. ¡Vamos!"

          Mientras caminamos los cuatro lado a lado por el bosque, intento pensar en una manera de sacar el tema del pasado de Kate. ¿Debería decírselo a Rose también? ¿Cómo van a reaccionar a todo esto? Quizás debería esperar hasta que acampemos.

          Antes de terminar mi hilo de pensamientos, nuestro viaje se ve interrumpido una vez más, esta vez por un violento temblor de tierra.
    choices:
