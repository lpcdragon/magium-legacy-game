            text: |-
              Es todo o nada. Saco mi daga y me lanzo contra uno de los gólems que tengo delante.

              Mi golpe fue definitivamente lo suficientemente potente como para cortar la coraza de roca del gólem, pero mi daga no lo era. Mi arma se hace pedazos ante mis ojos, y la criatura aprovecha la oportunidad para dejar caer uno de sus enormes puños sobre mí.

              Si intento bloquear esto directamente, la fuerza del impacto me romperá los huesos, independientemente de mi fuerza. Sin embargo, conozco una técnica de combate que me permitirá usar la propia fuerza del gólem en su contra.

              Cuando el puño de la criatura se acerca, me hago a un lado, agarro al gólem por el brazo y lo lanzo directamente contra otro de los gólems, haciéndolos pedazos a los dos. ¡Ja! Conseguí dos de ellos. Hora de ver cómo le va a Daren.

              Me sorprende gratamente ver que mientras yo estaba ocupado peleando contra ese gólem, Daren consiguió derribar a tres por sí solo, y ahora va a por el cuarto. Ahora hay suficiente espacio para maniobrar, y estos gólems son bastante lentos, así que ya no deberían suponer un peligro para mí.
          - source: scene_text_2
            paragraph: 43
            text: |-
              Se oyen varios gritos de pájaros, fuertes y dolorosos, que vienen de arriba, y casi inmediatamente después, vemos cinco grandes halcones cayendo al suelo al mismo tiempo, cada uno de ellos atravesado por al menos un carámbano en el pecho.

              Kate está detrás de nosotros, con la capucha quitada, y su característica mirada fría en los ojos.

              "Tácticas de invocador típicas," dice. "Distraer a los enemigos con carne de cañón y luego atacar por sorpresa desde arriba. Me sorprende que hayas conseguido sobrevivir tanto tiempo sin saber esto, Daren. Debes haber llevado una vida bastante protegida durante tus heroicas campañas."

              "¡Cállate!" dice Daren mientras atraviesa otro gólem de roca. "Iba a encargarme de esos pájaros cuando bajaran. No todos tienen elegantes ataques a distancia ilimitados para usar a su antojo."
