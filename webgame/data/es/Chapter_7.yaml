  - name: ch7_okay2
    texts:
      - source: scene_text
        paragraph: 495
        text: |-
          Cuando termino de hablar con Rose, noto que hay un fuerte murmullo proveniente de la gente a mi alrededor, y todos se están moviendo para despejar el centro del claro, donde Eiden y Hadrik están adoptando sus posturas de combate, como si se prepararan para un duelo.

          "¿Qué está pasando?", le pregunto a Daren.

          "Van a pelear sin usar magia."

          "¿¡Qué!? ¿Cómo hemos llegado a esto?"

          "El enano desafió a Eiden a una pelea, y el Stillwater dijo que sería de mala educación rechazar su desafío después de haber venido hasta aquí. También dijo que sería aburrido matar al enano con un chasquido de sus dedos, así que sugirió la regla de 'sin magia'."

          Mientras Daren habla, mi atención se dirige hacia un viejo mago frente a mí. Me resulta extrañamente familiar. Al mirar más detenidamente al viejo mago, de repente me doy cuenta de que lo conozco muy bien.

          Es imposible vivir en el Continente Occidental y no haber visto su cara al menos una vez en tu vida. Su retrato aparece casi todos los meses en los periódicos, después de todo. El hombre que está frente a mí no es otro que el legendario Azarius, el Sabio del Oeste.
      - source: scene_text_2
        paragraph: 25
        text: |-
          Hay muchos magos fuertes en el mundo, pero solo cuatro de ellos son oficialmente reconocidos como la élite entre las élites. Los llaman los cuatro sabios, y cada uno de ellos representa uno de los cuatro continentes principales del mundo. El título de sabio se gana o se mantiene a través de concursos anuales que organizan las naciones líderes de cada continente. Dado que cada uno de los cuatro continentes principales lleva el nombre del punto cardinal que representa su posición en el mapa del mundo, cada título de sabio también lleva el punto cardinal apropiado en su nombre.

          El Sabio del Oeste tiene exactamente el aspecto que he visto en las fotos. Un hombre viejo, de casi ochenta años, con una larga barba blanca como la nieve, sosteniendo un largo bastón de madera en la mano derecha, y vistiendo túnicas tradicionales, así como un sombrero puntiagudo. Es como un ejemplo viviente de lo que la mayoría de la gente imaginaría al pensar en un mago.

          "¡Barry! ¡Eh, Barry! ¿¡Me estás escuchando!?"

          Me doy cuenta de que debo haberme quedado embobado mirando al viejo sabio, porque no tengo ni idea de lo que Daren ha estado diciendo durante los últimos diez segundos.

          "Lo siento, ¿podrías repetir lo que acabas de decir? No creo que lo haya pillado todo."

          "Estaba diciendo que esta es la oportunidad perfecta para salir de aquí. No nos prestarán ninguna atención porque están demasiado concentrados en ver la pelea."
