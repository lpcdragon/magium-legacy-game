    texts:
      - source: scene_text
        paragraph: 505
        text: |-
          El elementalista de fuego frunce el ceño al enano.

          "Veo que no tiene sentido hablar contigo," dice. "Muy bien, entonces."

          El mago levanta las manos en el aire, y una enorme columna de fuego giratoria empieza a formarse a su alrededor. Todos los demás magos se apartan de su camino para evitar quedar calcinados.

          "¡Enano, vas a lamentar buscar pelea conmigo! ¡Contemplad! ¡Contemplad el poder de Felran, el elementalista de fuego más poderoso del Continente Oriental!"

          Mientras habla, la columna de fuego se hace aún más grande.

          "Veo que ya has aceptado tu destino. Ni siquiera intentas levantar una barrera mágica a tu alrededor. No te preocupes, haré que sea rápido. Aunque no puedo garantizarte que sea indoloro. ¡YAJAJAJAJAJAJAJAJA!"

          Su risa es tan enloquecida como la mirada en sus ojos. Hadrik no dice nada, pero puedo ver cómo aprieta el puño derecho con mucha fuerza, y puedo sentir cómo el aura mágica a su alrededor se endurece considerablemente.

          "¡MUERE!" grita el mago, mientras envía todo el fuego hacia el enano en forma de rayo. Hadrik espera a que el fuego lo alcance, y justo antes de que lo golpee, lo golpea con todas sus fuerzas. Sin embargo, en lugar de dispersarse, todo el fuego es devuelto a su dueño al doble de velocidad. Antes de que pueda siquiera entender lo que está pasando, Felran queda completamente incinerado, dejando atrás solo un montón de cenizas que ahora se dispersan con el viento.
      - source: scene_text_2
        paragraph: 35
        text: |-
          "¡Ese maldito hijo de una morsa!" dice Hadrik. "¡Estaba intentando matarme de verdad!"

          Al ver la amenaza que supone el enano, todos los demás magos que se preparaban para atacar a Kate ahora intentan coordinarse para atacarlo al mismo tiempo.

          "¡Basta!" grita Azarius, el sabio. "No habrá más derramamiento de sangre este día. Si alguno de vosotros, mocosos, todavía tiene ganas de armar jaleo, seré yo contra quien pelearéis a continuación. ¿Me he expresado con claridad?"

          Algunos de los magos parecieron considerar de verdad la propuesta del viejo mago durante unos segundos, pero al final todos decidieron no aceptarla y comenzaron a envainar sus armas. El sabio se dirige hacia nosotros, y mientras camina, todos los demás magos se apartan apresuradamente para dejarle paso libre.

          "¡Saludos, amigos!" dice, sonriendo, mientras nos mira a los cuatro uno por uno. "Pido disculpas por no haber detenido esta ridícula pelea antes. Me temo que la curiosidad pudo más que yo, y esperaba que dejar que las cosas siguieran su curso me brindara la rara oportunidad de ver al gran héroe Daren en acción. Cuando quedó claro que eso no iba a suceder, ¡simplemente tuve que poner fin a esta tontería!"
