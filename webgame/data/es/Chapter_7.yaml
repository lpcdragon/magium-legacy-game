  - name: ch7_acquaintances
    texts:
      - source: scene_text
        paragraph: 540
        text: |-
          "Nos conocimos ayer, así que supongo que se podría decir que somos conocidos."

          "¿Oh? Pero pareces estar más cómodo a su alrededor que tu compañero. Dime, Barry, ¿tú también la consideras una banshee?"

          "¿Qué? ¡No! ¡Claro que no!"

          "Interesante... ¿Puedo preguntarte entonces si sabes sobre el Faro de Esperanza?"

          "Sí, ella..."

          Echo un breve vistazo hacia Kate antes de continuar.

          "Ya me lo contó todo..."

          "Espera un momento," nos interrumpe Daren. "¿No dijo Eiden algo sobre el Faro esta mañana?"

          "Sí, dijo que Kate era una superviviente de allí," le digo.

          "¿Una superviviente?" pregunta Daren. "Sí, ahora me acuerdo. Y no quiso decirnos qué significaba eso. ¿Qué es este Faro de Esperanza, de todos modos?"

          "Para decirlo sin rodeos," dice Azarius, "el Faro de Esperanza era una instalación de experimentación humana disfrazada de orfanato. El propósito de esa institución era crear magos artificialmente. Los poderes mágicos de Kate son un resultado directo de esos experimentos."
      - source: scene_text_2
        paragraph: 59
        text: |-
          "¿Y ella es... qué?..." pregunta Daren, aparentemente demasiado en shock como para poder formar una frase coherente.

          "Kate, ¿eras una maga?" pregunta Rose, sorprendida.

          "Sí..." responde Kate. "¿Qué pensabas que era?"

          "Bueno, esos magos que conocimos en el bosque esta mañana no paraban de gritar que eras una banshee, así que más o menos asumí que eso es lo que eras... Todos parecían saber qué significaba, así que no quise parecer tonta preguntando."

          Kate se ríe suavemente.

          "Supongo que las etiquetas no son realmente muy importantes para ti, ¿verdad, Rose?" dice, sonriendo.

          "Aun así, tengo que admitir," dice Hadrik, con una sonrisa, "no esperaba conocer a dos supervivientes del Faro en el mismo día. ¡Este torneo es realmente algo fuera de lo común!"

          "¿Dos supervivientes?" le pregunto. "¿Quieres decir que hay otra maga artificial aquí en este continente además de Kate?"

          "¡Así es!" dice el enano. "¡Y es tremendamente fuerte también! Me noqueó casi sin esfuerzo. Estoy bastante seguro de que usaba rayos de la misma forma en que los elementalistas usarían agua o fuego. ¡Ser una maga artificial tiene sus ventajas!"
    choices:
