  - name: ch7_ask_me_anything
    texts:
      - source: scene_text
        paragraph: 558
        text: |-
          "Bueno..." dice Kate. "Supongo que yo también debería irme."

          Daren, Rose y yo nos giramos a mirarla simultáneamente.

          "Supongo... que esto es un adiós..." dice. "Hemos tenido nuestros altibajos, pero me alegro mucho de haber podido pasar este corto tiempo con vosotros. ¡Muchas gracias por la paciencia que habéis tenido conmigo!"

          Luego hace una profunda reverencia, y se prepara para marcharse.

          "Kate, ¿qué dices de repente?" le pregunta Rose. "Te das cuenta de que vamos contigo, ¿verdad?"

          "¿Vamos?" empieza a decir Daren, pero le doy un codazo en el costado. "Quiero decir, eh... Por supuesto que vamos. Naturalmente."

          "¿Qué?..." dice Kate, sorprendida. "¡No, Rose, no podéis! ¿Qué pasa con todas las personas enfermas que os esperan en vuestro pueblo?"

          "¡Oh, no tienes que preocuparte por eso!" dice Rose. "Con todos los atajos que hemos tomado hasta ahora, llevo días de ventaja respecto a mi calendario original. Nunca habría tenido el valor de tomar una ruta tan directa si tú no hubieras estado ahí para escoltarme. Acompañarte a ver a tu amiga es lo mínimo que puedo hacer para devolverte el favor. Y además, Hadrik dijo que el campamento al que te diriges no está muy lejos de aquí. ¿Verdad, Hadrik?"
      - source: scene_text_2
        paragraph: 71
        text: |-
          "Así es," responde Hadrik. "¡Es verdad!"

          "¿Lo ves?" dice Rose, sonriendo. "¡Todo sale bien!"

          "Pero... yo no podría..." empieza a decir Kate, pero Hadrik la interrumpe.

          "¡Está decidido entonces!" dice en voz alta, ahogando completamente el sonido de la voz de Kate. "¡Todos vamos a ver a la amiga de Kate! Venga, seguidme, voy a intentar tomar un atajo."

          Con estas últimas palabras, todos cogemos nuestras mochilas y nos apresuramos a seguir a Hadrik. Kate se queda ahí parada durante unos momentos, sin saber qué hacer, pero luego decide seguirle también, y en poco tiempo empieza a caminar a nuestro lado de nuevo, como si nuestra discusión anterior nunca hubiera tenido lugar.

          Caminamos en completo silencio durante unos minutos. Kate siempre ha sido del tipo callado, así que no me sorprende mucho, pero no creo que haya visto nunca a Daren pasar más de un minuto sin abrir la boca. Debe estar todavía en shock después de lo que ha oído sobre el Faro. Probablemente sigue teniendo dificultades para interiorizar esa información, dado lo firmemente que se ha aferrado a la opinión de que Kate era una banshee hasta ahora.

          "¡Vaya, sí que sois un grupo callado!" dice Hadrik, tras unos minutos más de silencio incómodo. "Bueno, pues rompo el hielo yo. ¡Venga, preguntadme lo que queráis!"
