  - name: ch7_woman_mage
    texts:
      - source: scene_text
        paragraph: 538
        text: |-
          "Maestro Azarius," dice el joven que está a su lado. "No pretendo ser maleducado, pero ¿puedo preguntarle por qué eligió intervenir en esta pelea? ¿No fue usted quien me enseñó que las banshees son demonios repugnantes en los que no se puede confiar?"

          "Henry, te he dicho muchas veces que no hace falta que seas tan formal cuando te dirijas a mí. Puedes llamarme simplemente Azarius. En cuanto a tu pregunta, antes de responderte, debo preguntarte esto: ¿Recuerdas la primera lección que te enseñé sobre las banshees? ¿Recuerdas por qué las banshees necesitan poseer cuerpos humanos o animales para sobrevivir?"

          "¡Por supuesto! Las banshees nacieron originalmente en el plano mágico de existencia, pero fueron desterradas hace mucho tiempo y maldecidas a vivir el resto de sus vidas en nuestro plano terrenal. En este plano, no es posible vivir mucho tiempo sin un cuerpo físico, así que las banshees se vieron obligadas a adaptarse, robando los cuerpos de otros organismos vivos. Una vez que es tomado por una banshee, el cuerpo deja de envejecer, pero debido a la incompatibilidad entre el alma de la banshee y el cuerpo físico, el vínculo entre los dos se deteriorará con el tiempo, lo que obliga al espíritu a cambiar de huésped cada pocas décadas."

          "¡Muy bien!" dice Azarius. "Ahora, dime, ¿percibes algún tipo de vibración de otro mundo emanando del cuerpo de esta mujer? ¿Su aura mágica parece de alguna manera diferente a la de cualquier otro mago que hayas encontrado en tu vida?"

          "No, pero no lo entiendo... ¿Cómo es posible?..."
      - source: scene_text_2
        paragraph: 57
        text: |-
          El sabio sonríe.

          "Es porque ella no es una banshee. Es una mujer con poderes mágicos. Una mujer maga, si lo prefieres."

          "¿¡Qué!?" exclama Daren. "¿Cómo puedes estar tan seguro? No puedes decirme en serio que basas todo tu razonamiento en algo tan vago."

          "Me sorprendes, sanador con armadura," dice Azarius, pensativo, mientras se acaricia la barba. "La forma en que has formulado tu última frase sugiere que no crees que esta mujer sea otra cosa que una banshee. Y sin embargo, pareces viajar con ella. De lo más peculiar."

          Daren parece un poco avergonzado después de oír la observación del sabio, pero Azarius no le presta atención y en cambio se acerca a mí.

          "¿Y tú qué opinas, Barry?" me pregunta. "Por lo que he podido deducir, los cuatro viajáis juntos. ¿Cómo definirías tu relación con la joven llamada Kate?"
