  - name: ch7_giant
    texts:
      - source: scene_text
        paragraph: 488
        text: |-
          "¿Qué es esto, un terremoto?", dice Daren.

          "Por favor que no sea un dragón, por favor que no sea un dragón, por favor que no sea un dragón", dice Rose, empezando a entrar en pánico.

          A medida que el terremoto se intensifica, empezamos a ver una figura humana en la distancia, que se hace cada vez más grande, hasta alcanzar una altura de quince metros. El hombre gigante viste una armadura de cuero, tiene una barba negra que le llega hasta el pecho, y una gran sonrisa en la cara. Cuando empieza a hablar, su voz es tan fuerte que ahoga completamente cualquier otro sonido en un radio de ocho kilómetros. Tampoco ayuda que esté gritando.

          "Ahora que tengo la atención de todos", dice el hombre gigante. "Me gustaría aprovechar esta oportunidad para presentarme. Mi nombre es Hadrik, pero mis amigos me llaman 'el enano'. ¡Vine a este torneo por una sola razón: probar mi fuerza contra los magos más poderosos del mundo! Entonces, ¿qué dicen todos? ¡Tengamos un pequeño combate de práctica antes de ir a por nuestros objetivos! ¡Estaré esperando aquí mismo a cualquier retador! Intentaré contenerme tanto como pueda, pero no hago promesas. ¡Jajajajajajajajaja!"

          Su risa es fuerte y jovial, parecida a la risa que escuchas de taberneros y posaderos amigables. ¿Qué le pasa a este tipo? ¿No se da cuenta de en qué clase de lugar está?

          El gigante empieza a encogerse lentamente mientras se ríe, y eventualmente desaparece detrás de los árboles.
      - source: scene_text_2
        paragraph: 24
        text: |-
          "¡Maldita sea!", dice Daren. "¡Eso es un cambio de forma impresionante. Debe tener mucho poder mágico para poder transformarse en algo tan grande!"

          "¿No tienes ni el conocimiento básico de la magia de cambio de forma?", le pregunta Kate. "No puedes simplemente transformarte en algo diez veces más grande que tu tamaño normal, no importa lo poderoso que seas. Viola los principios fundamentales del cambio de forma. Esto fue obviamente una ilusión."

          "¿Ah sí? Ya que estás tan segura de que fue una ilusión, ¿podrías explicar cómo logró hacer un temblor de tierra tan realista mientras mantenía el hechizo de ilusión?"

          "¿Cómo voy a saber eso? Quizás tiene un aliado que se especializa en magia de tierra. ¿Cómo es eso siquiera relevante?"

          Algo no cuadra aquí. Aunque los principios fundamentales de los que habla Kate deberían prohibir el uso del cambio de forma de esa manera, una ilusión tampoco es mucho más probable. No hay forma de que ninguna ilusión pudiera llegar tan lejos, no importa lo poderoso que sea el mago. Debe haber algo que se nos escapa. ¿O quizás el hombre que se hace llamar Hadrik logró encontrar una manera de eludir temporalmente las leyes de la magia tal como las conocemos?
    choices:
      - position: 1
