scenes:
  - name: ch7_intro
    effects:
      - set:
          successful_checks:
            - 'Punto de control alcanzado: Partida guardada.'
        condition: checkpoint_rich = 1
    routes:
      - condition: ch3_kate_badly_hurt = 0
        texts:
          - source: scene_text
            paragraph: 453
            text: |-
              "Barry, me gustaría hablar contigo, en privado", me dice Kate, mientras los cuatro nos tomamos un pequeño descanso cerca de un río.

              Sabía que esto iba a pasar. Lo he estado esperando desde que tuvimos esa discusión sobre mi dispositivo de estadísticas hace dos horas. Apenas me dirigió la palabra después de eso, y la mirada que me ha estado dando durante la última hora me ha provocado escalofríos. Sea cual sea la razón de su repentino cambio de actitud hacia mí, no puedo dejar que las cosas sigan así. Necesitamos aclarar esto, de una forma u otra.

              "De acuerdo", digo. "Tú guías."

              Kate se adelanta y empiezo a seguirla, pero antes de dar mi primer paso, Daren me agarra del hombro.

              "Recuerda, Barry... Tres toques."

              La mirada en sus ojos es completamente seria. Me doy cuenta de que está hablando del transceptor mágico que me dio anoche, que todavía llevo en el bolsillo. Me dijo que lo tocara tres veces en caso de estar en peligro. Supongo que él también debe haber notado que algo andaba mal con la forma en que Kate se ha estado comportando durante las últimas dos horas.
          - source: scene_text_2
            paragraph: 3
            text: |-
              Asiento con la cabeza y me suelta. Luego sigo a Kate, que se dirige más adentro del bosque. Caminamos en silencio durante aproximadamente un minuto.

              "¿Hasta dónde vamos exactamente?", le pregunto, pero no me da respuesta y sigue caminando hacia adelante.

              Después de aproximadamente otro minuto, finalmente se detiene y se gira hacia mí, con la misma mirada fría en los ojos que me ha estado dando desde que luchamos contra el dragón.

              "¿Piensas decirme qué...?"

              Kate no me deja terminar la frase y de repente hace aparecer una daga de hielo en su mano derecha, que casi de inmediato pone contra mi garganta. Intento retroceder, pero me doy cuenta de que hay un árbol justo detrás de mí. Ahora está presionando la hoja con fuerza contra mi garganta, y puedo sentir un hilo de sangre bajando por mi cuello, mientras mi espalda es empujada contra el tronco del árbol.

              "Si haces cualquier tipo de ruido, te cortaré la garganta aquí y ahora. ¿Entiendes?"
        choices:
          - position: 1
            text: Sí.
            effects:
              - set:
                  current_scene: ch7_yes
                  checkpoint_rich: 0
                  ch7_tap: 0
          - position: 2
            text: Si querías pedirme dinero prestado, podrías haberlo pedido amablemente.
            effects:
              - set:
                  current_scene: ch7_borrow
                  checkpoint_rich: 0
                  ch7_tap: 0
          - position: 3
            text: Tocar el transceptor mágico tres veces, sin que ella se dé cuenta.
            effects:
              - set:
                  current_scene: ch7_tap
                  checkpoint_rich: 0
                  ch7_tap: 1
      - condition: ch3_kate_badly_hurt = 1
        texts:
          - source: scene_text
            paragraph: 454
            text: "\"Barry, I would like to have a word with you, in private,\" Kate tells me, as the four of us are taking a small break near a river.\r\n\r\nI knew this was coming. I've been expecting it ever since we had that discussion about my stat device two hours ago. She barely spoke a word to me after that, and the look she's been giving me for the past hour has been sending chills down my spine. Whatever the reason for her sudden change of attitude towards me, I can't let things go on like this. We need to clear this up, one way or the other.\r\n\r\n\"Alright,\" I say. \"Lead the way.\"\r\n\r\nKate goes on ahead and I start to follow her, but before I take my first step, Daren grabs me by the shoulder.\r\n\r\n\"Remember, Barry... Three taps.\"\r\n\r\nThe look in his eyes is dead serious. I realize he's talking about the magical transceiver he gave me last night, which I'm still carrying in my pocket. He told me to tap it three times in case I'm in danger. I guess he must have also noticed that something was wrong with the way Kate's been acting for the past two hours."
          - source: scene_text_2
            paragraph: 4
            text: |-
              Asiento con la cabeza y me suelta. Luego sigo a Kate, que se dirige más adentro del bosque. Caminamos en silencio durante aproximadamente un minuto. Ya no respira con dificultad. Sus movimientos también se ven mucho más naturales. Me alegra ver que finalmente se ha recuperado, al menos.

              "¿Hasta dónde vamos exactamente?", le pregunto, pero no me da respuesta y sigue caminando hacia adelante.

              Después de aproximadamente otro minuto, finalmente se detiene y se gira hacia mí, con la misma mirada fría en los ojos que me ha estado dando desde que luchamos contra el dragón.

              "¿Piensas decirme qué...?"

              Kate no me deja terminar la frase y de repente hace aparecer una daga de hielo en su mano derecha, que casi de inmediato pone contra mi garganta. Intento retroceder, pero me doy cuenta de que hay un árbol justo detrás de mí. Ahora está presionando la hoja con fuerza contra mi garganta, y puedo sentir un hilo de sangre bajando por mi cuello, mientras mi espalda es empujada contra el tronco del árbol.

              "Si haces cualquier tipo de ruido, te cortaré la garganta aquí y ahora. ¿Entiendes?"
        choices:
          - position: 1
            text: Sí.
            effects:
              - set:
                  current_scene: ch7_yes
                  checkpoint_rich: 0
                  ch7_tap: 0
          - position: 2
            text: Si querías pedirme dinero prestado, podrías haberlo pedido amablemente.
            effects:
              - set:
                  current_scene: ch7_borrow
                  checkpoint_rich: 0
                  ch7_tap: 0
          - position: 3
            text: Tocar el transceptor mágico tres veces, sin que ella se dé cuenta.
            effects:
              - set:
