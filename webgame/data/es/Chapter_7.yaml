  - name: ch7_watch_not_call
    texts:
      - source: scene_text
        paragraph: 499
        text: |-
          "En realidad, creo que deberíamos ver la pelea también."

          "¿Ah, sí? ¿Y por qué? Dame una buena razón."

          "Recopilar información. ¿Recuerdas cómo Eiden esquivó todos tus ataques con facilidad la primera vez que lo conocimos? Ya que no va a usar magia, esto debería darnos información muy valiosa sobre su entrenamiento en artes marciales."

          "¿Lo suficientemente valiosa como para arriesgar nuestras vidas por ella?"

          "Sí, en realidad. ¿Te das cuenta de que probablemente tendremos que luchar contra él al final de este torneo, verdad? ¿No deberíamos aprovechar cada oportunidad que tengamos para intentar encontrar sus debilidades, incluso a riesgo de nuestra propia seguridad?"

          Daren refunfuña, como siempre hace cuando no encuentra un contraargumento lo suficientemente bueno que lanzarme a la cara. Finalmente, se calma y da un paso adelante para ver mejor la batalla que está a punto de comenzar.

          Kate, que ha escuchado nuestra discusión, también se adelanta para ver mejor la pelea. Lleva la capucha puesta y se cubre con su capa verde para ocultar el hecho de que es una mujer.

          Justo cuando los dos contendientes se preparan para lanzarse el uno contra el otro, una voz muy fuerte sale de mi bolsillo izquierdo.

          "¿Hola? ¿Hay alguien ahí? ¿Alguien puede oírme? ¿Hola?" grita Rose a través del transceptor.
      - source: scene_text_2
        paragraph: 29
        text: |-
          Mierda. Se me había olvidado por completo que el dispositivo estaba al máximo volumen. Esto es malo. Esto es muy malo. Todos y cada uno de los magos me están mirando ahora, incluso los dos que estaban a punto de empezar a pelear.

          Toco rápidamente el transceptor para hablar con Rose, pero antes de que pueda decir nada, es Eiden quien responde a su pregunta.

          "Sí, Rose. Todos podemos oírte," dice en voz alta.

          "¿Ese es... ese es Eiden?" pregunta Rose.

          "Rose, escúchame," digo mientras saco el transceptor de mi bolsillo. "Nos han teletransportado a todos adonde apareció el gigante hace un minuto. ¿Recuerdas dónde era? ¿Puedes venir hacia nosotros?"

          "Sí, lo recuerdo, pero..."

          "Lo siento, pero no tengo más tiempo para hablar. Te pondré al día cuando llegues. ¡Ten cuidado!"

          Apago el transceptor y miro a mi alrededor. Los magos siguen mirándome fijamente. Esto no va a terminar bien, ¿verdad?

          "Espera, espera, espera... Tienes que estar bromeando. ¿Otro stillwater?" dice uno de los magos.

          "No, este es solo un humano corriente," dice Azarius. "Se nota por la mirada en sus ojos."
      - source: scene_3
        paragraph: 4
        text: |-
          "¿De qué estáis hablando?" pregunta Eiden, sonriendo. "Por supuesto que es un stillwater. ¿No lo visteis todos pelear contra ese dragón en el cielo él solo hace unas horas?"

          Hay un fuerte murmullo de nuevo, mientras muchos de los magos confirman haberme visto luchar contra el dragón. Si quiero hacerme pasar por uno en este torneo, nunca habrá una oportunidad mejor que esta.
    choices:
