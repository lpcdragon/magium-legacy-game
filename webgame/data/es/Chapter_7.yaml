  - name: ch7_sister
    texts:
      - source: scene_text
        paragraph: 462
        text: |-
          "Sucedió hace quince años", le digo. "Mi familia y yo vivíamos en una aldea bastante aislada, donde la gente realmente no sabía mucho sobre banshees y magos en general. Cuando mi hermana empezó a desarrollar poderes mágicos, todos nos alegramos mucho, porque pensamos que teníamos una maga en la familia. Luego, una noche..."

          Empiezo a tener recuerdos de la noche en que mi hermana se convirtió en banshee. Es como si su risa siniestra todavía resonara en mis oídos.

          "Una noche, llegué a casa y encontré los cuerpos de mis padres tirados en charcos de sangre, con mi hermana de pie sobre ellos. Solo que ya no era mi hermana. Todo era diferente en ella, incluso su aura mágica. Estaba a punto de matar a mi hermano menor cuando cogí una horca del suelo y la empalé con ella. Tuve suerte. La banshee acababa de despertar, lo que la hacía vulnerable. Si hubiera llegado aunque fuera unos minutos más tarde, no creo que nadie hubiera podido detenerla."

          Hago una pausa y miro a Kate directamente a los ojos.
      - source: scene_text_2
        paragraph: 7
        text: |-
          "El transceptor de Daren está hecho para que pueda avisarle cuando esté en peligro simplemente tocándolo tres veces. Podría haberlo hecho en el momento en que pusiste tu daga en mi garganta, pero no lo hice, por la misma razón por la que no me negué a ir solo contigo a este bosque, a pesar de los riesgos obvios. Es porque quería hablar las cosas contigo y asegurarme de que aclaremos las cosas entre nosotros. Ahora, dime, Kate, ¿todavía crees que estoy diciendo todo esto solo para ganarme tu confianza y poder capturarte o asesinarte?"

          La mano de Kate que sostiene la daga empieza a temblar, y la feroz determinación que tenía en los ojos se va apagando lentamente. Baja su daga y dirige la mirada hacia el suelo a su izquierda.

          "No, no lo creo", me responde. "Estoy... realmente arrepentida. Por todo..."
    choices:
      - position: 1
        text: No necesitas disculparte.
        effects:
          - set:
              current_scene: ch7_apologize
      - position: 2
        text: ¿Seguimos siendo amigos, entonces?
        effects:
          - set:
              current_scene: ch7_friends
  - name: ch7_apologize
    texts:
      - source: scene_text
        paragraph: 463
        text: |-
          "No necesitas disculparte."

          "¡Sí, sí necesito!", estalla. "¡Casi te mato a sangre fría! ¡No te atrevas a restarle importancia como si fuera nada!"

          "Oye, cálmate, sigo vivo, ¿no?"

          "¡Eso no viene al caso! ¡Estaba lista para cortarte la garganta en cualquier momento! ¿Y ahora me dices que deberíamos olvidarnos de esto y actuar como si nada hubiera pasado?"

          "De acuerdo, admito que quizás exageré un poco. No quise decirlo así. Solo estaba diciendo que deberíamos dejar el pasado atrás y seguir adelante."

          "¿¡Por qué!? ¿Por qué todavía estás dispuesto a confiar en mí después de todo lo que ha pasado? ¿Qué te pasa? ¿Estás completamente loco?"

          "¡Por supuesto que sí! Seguramente te habrás dado cuenta de esto cuando descubriste la verdadera razón por la que me uní al torneo."
      - source: scene_text_2
        paragraph: 8
        text: |-
          Ahora me mira como si no pudiera creer las palabras que estoy diciendo.

          "Así que...", le digo mientras le extiendo la mano. "¿Seguimos siendo amigos?"

          Kate parece estar todavía recuperándose del shock de lo que acabo de decir.

          "¿Amigos?... ¿Cómo puedes siquiera decir algo así después de lo que acaba de pasar? ¿No entiendes que te estás poniendo en peligro al viajar conmigo?"

          "¿Y qué? ¿Cómo sería viajar contigo más peligroso que tener que luchar contra un Stillwater y un dragón en el mismo día? Al menos si vienes con nosotros, me sentiré más seguro sabiendo que me cubres las espaldas."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch7_idiot
  - name: ch7_friends
    texts:
      - source: scene_text
        paragraph: 464
        text: |-
          "¿Seguimos siendo amigos, entonces?"

          "¿Amigos?...", me pregunta, conmocionada.

          Me mira, intentando averiguar si estoy hablando en serio o no.

          "Estás loco", dice. "¡Casi te mato!"

          "Pero no lo hiciste."

          "¡Eso no viene al caso! ¡Estaba lista para cortarte la garganta en cualquier momento! ¿Y ahora me hablas de amistad? ¿Qué te pasa? ¿Estás completamente loco?"

          "¡Por supuesto que sí! Seguramente te habrás dado cuenta de esto cuando descubriste la verdadera razón por la que me uní al torneo."

          Me mira como si no pudiera creer las palabras que estoy diciendo.

          "Entonces, ¿somos amigos o no?", digo, mientras le extiendo la mano.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch7_idiot
  - name: ch7_idiot
    texts:
      - source: scene_text
        paragraph: 465
        text: |-
          Kate hace una pausa y me mira vacilante.

          "¿Estás seguro de esto?", me pregunta.

          "¡Sí, sí, estoy seguro! Venga ya. ¡Dame la mano de una vez! Se me está durmiendo el brazo."

          Kate sonríe con tristeza, mientras sorbe y se limpia las lágrimas de los ojos con la manga.

          "Eres un idiota", me dice mientras agarra mi mano y la aprieta con firmeza.

          "Lo sé", le digo mientras terminamos nuestro apretón de manos. "Deberíamos irnos. Daren y Rose deben estar impacientándose."

          "Espera", dice. "Todavía te debo una explicación por todo esto. Es lo mínimo que puedo hacer."
    choices:
      - position: 1
        text: ¿Tiene esto algo que ver con el Faro de Esperanza?
        effects:
          - set:
              current_scene: ch7_beacon
      - position: 2
        text: ¿Puedes primero decirme quiénes son exactamente estos Lessathi?
        effects:
          - set:
              current_scene: ch7_lessathi
  - name: ch7_kill
    texts:
      - source: scene_text
        paragraph: 466
        text: |-
          "No la llamé aquí para matarte."

          "¡Cállate! ¡No me creo ni una palabra de lo que dices!"

          De repente, una capa de hielo se forma a mi alrededor y me ata al árbol que tengo detrás.

          "Esto se acaba ahora", dice Kate, mientras retira su daga de mi garganta y se prepara para darme el golpe final.

          Intento desesperadamente liberarme del bloque de hielo, pero la única parte de mi cuerpo que todavía puedo mover es la cabeza. Daren, ¿dónde estás?

          "¡Esto es por Diane, maldito!", me grita Kate mientras balancea su daga de hielo hacia mi cara.

          Su brazo se detiene a unos centímetros de alcanzarme, y su mano que sostiene la daga empieza a temblar. Me mira directamente a los ojos e intenta mover su brazo hacia adelante, pero no puede obligarse a hacerlo. Su rabia se va desvaneciendo lentamente mientras me mira, y sus ojos empiezan a humedecerse de nuevo. Mientras está ahí de pie con el cuchillo en la mano, el agarre que tiene sobre su arma empieza a debilitarse, y finalmente esta cae al suelo, junto con un torrente de lágrimas que fluyen por su cara.
      - source: scene_text_2
        paragraph: 9
        text: |-
          "Lo siento...", me dice, llorando. "Lo siento mucho... Por todo..."

          "Ya es suficiente, Kate", escucho la voz de Daren, mientras se revela de detrás de un árbol. "Ríndete ahora, y no tendré que hacerte daño."

          "Daren, espera...", empiezo a decir, pero me interrumpe.

          "Lo siento, Barry, pero ahora que ha llegado a esto, no puedo simplemente dejarlo pasar. Es demasiado peligrosa para dejarla sola. Voy a purificarla."

          Kate se limpia las lágrimas de la cara y recupera su mirada fría, mientras se gira hacia Daren y empieza a hablar.

          "No suenes tan decepcionado, Daren. Ambos sabemos que has estado esperando este momento desde que pusiste los ojos en mí por primera vez. Y ambos sabemos que rendirme simplemente no está en mi naturaleza."

          "Como quieras", dice Daren, secamente, y se lanza hacia Kate, con su espada en mano.
