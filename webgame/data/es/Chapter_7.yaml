          "Ajá," me dice Daren. "Lo que tú digas, Barry."

          Mientras los dos hablábamos, Kate estaba siendo rodeada por unas pocas docenas de magos. Eiden parece haberse teletransportado lejos, probablemente por aburrimiento, y el enano también está corriendo hacia Kate. El Sabio del Oeste parece no saber qué hacer con todo este asunto, y observa todo desde lejos mientras se acaricia suavemente la barba blanca.

