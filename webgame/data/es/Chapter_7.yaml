              Mientras empiezo a moverme para esquivar a los gólems, me doy cuenta de que no es ni de lejos tan fácil como esperaba. Puede que sean extremadamente lentos, pero el gran número de ellos hace casi imposible evitar sus ataques solo con mi velocidad. Necesito salir de aquí rápido, o me van a machacar hasta matarme.

              De repente veo una abertura en su formación, probablemente creada cuando Daren mató a uno de ellos. Me lanzo hacia ella con toda la velocidad que puedo, pero uno de los gólems me ve y me intercepta antes de que escape. Un solo puñetazo fue suficiente para aplastar completamente mi cráneo, mientras mi cuerpo caía al suelo sin vida.
