    texts:
      - source: scene_text
        paragraph: 486
        text: |-
          "Voy a decirle la verdad."

          "No va a creer lo que te dije. No tengo pruebas que respalden mis afirmaciones."

          "No te preocupes, ¡ya encontraremos la manera!"

          Kate no parece compartir mi optimismo sobre el asunto, pero decide dejarlo por ahora.

          Al volver hacia Daren, lo encontramos apoyado contra un roble, con los brazos cruzados y una expresión de desagrado en la cara.

          "Habéis tardado bastante", dice.

          "Mis disculpas", le dice Kate fríamente. "Prometo que jugaré a la rayuela todos los días a partir de ahora, para no ser una carga la próxima vez que me apuñales en la pierna."

          Daren ignora su comentario sarcástico y se gira hacia mí.

          "¿Y bien? ¿Qué te contó? Más vale que sea bueno."
      - source: scene_text_2
        paragraph: 22
        text: |-
          Antes de que tenga la oportunidad de responderle, escucho un jadeo de mujer a nuestra derecha. Rose, que vino a ver cómo estábamos, ahora está mirando la herida de la pierna de Kate y cubriéndose la boca con ambas manos.

          "Por los dioses, ¿quién te hizo esto?", le pregunta Rose.

          "Solo unos matones insignificantes. No hay de qué preocuparse, ya me encargué de ellos, y la herida no es muy profunda. Estoy segura de que Daren puede arreglar esto en un momento. ¿No es así, Daren?"

          "Por supuesto", responde, frunciendo el ceño.

          Daren empieza a lanzar su hechizo de curación en Kate, y mientras su herida se cierra, puedo verlo vacilar por unos momentos. Luego junta sus dedos y golpea su pierna con ellos, en tres lugares separados. Cuando termina, puedo sentir que el aura mágica de Kate vuelve a su flujo normal. Daren debe haber cancelado el efecto de su maniobra de interrupción de hechizos de antes.

          "Continuaremos nuestra discusión anterior en otra ocasión", dice Daren, mientras se levanta y recoge su mochila del suelo.

          Los cuatro reanudamos nuestro viaje, pero no pasa mucho tiempo antes de que seamos interrumpidos de nuevo, esta vez por un violento temblor de tierra.
