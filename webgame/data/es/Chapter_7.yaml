  - name: ch7_agree_kate
    texts:
      - source: scene_text
        paragraph: 489
        text: |-
          "Creo que Kate tiene razón", digo. "Las leyes de la magia no pueden romperse así, no importa lo hábil que sea un mago."

          Daren frunce levemente el ceño.

          "Solo dices eso para caerle bien", me dice.

          "Bueno, de todos modos no importa", dice Kate. "Esto es obviamente una trampa. Sinceramente no puedo imaginar cómo alguien podría ser tan estúpido como para caer en algo tan..."

          De repente, los cuerpos de Kate, Daren y el mío empiezan a vibrar con fuerza, mientras nos envuelve una luz blanca.

          "Oh, no...", dice Kate.

          "¿Qué? ¿Qué está pasando?", nos pregunta Rose.

          "¡Rose, atrapa!", dice Daren, mientras le lanza su transceptor.

          En cuanto lo atrapa, los tres somos teletransportados al mismo tiempo. La sensación que tengo es la misma que tuve cuando fui transportado por primera vez a este continente. Se siente casi como si cada fibra de mi cuerpo estuviera siendo descompuesta y luego lentamente recompuesta, mientras mantengo plena consciencia de mí mismo durante todo el proceso. Cuando recupero todos mis sentidos, me encuentro rodeado de unas pocas docenas de magos, con Daren y Kate de pie justo a mi lado. Los magos miran a su alrededor, confundidos.
    choices:
      - position: 1
