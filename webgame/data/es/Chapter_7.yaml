  - name: ch7_bet_your_life
    texts:
      - source: scene_text
        paragraph: 513
        text: |-
          "¿Estás dispuesto a apostar tu vida en eso, mago blanco?"

          "No," dice, sonriendo. "Pienso apostar TODAS nuestras vidas en ello."

          Una docena de hombres armados se colocan frente a él y empiezan a blandir sus armas. Los magos que no están aliados con el sanador parecen contentarse con simplemente observar por ahora.

          "Son todos encantadores de armas," me susurra Daren. "Pero parecen mucho más débiles que Dave el Degollador, así que debería poder con todos yo solo sin mucho problema. El problema principal va a ser ese sanador. Apuesto a que usa hechizos de curación que funcionan durante el combate, a diferencia de mí, así que a menos que mate a cada uno de los hombres de un solo golpe, es poco probable que caigan mientras el mago blanco siga en pie."

          Daren tiene razón. Simplemente intentar incapacitar a estos hombres temporalmente no va a funcionar en esta situación. Es matar o morir, y no puedo permitirme dejar que Daren se encargue de todos él solo. Al fin y al cabo, soy yo el objetivo. Necesito ayudarle de cualquier forma que pueda.
    choices:
      - position: 1
        text: Ayudar a Daren disparando a los esbirros en la cabeza con mi ballesta
        effects:
          - set:
              current_scene: ch7_assist
      - position: 2
        text: Intentar pillar al sanador por sorpresa con mi velocidad y apuñalarlo en el corazón
        effects:
          - set:
              current_scene: ch7_surprise
  - name: ch7_intimidate
    texts:
      - source: scene_text
        paragraph: 514
        text: |-
          Me meto las manos en los bolsillos y empiezo a caminar lentamente hacia el mago sanador, intentando imitar el porte despreocupado y la sonrisa relajada de Eiden. Mientras me acerco, los magos que parecían ser parte de su grupo empiezan a entrar en pánico y se apartan para dejarme paso. Cuando me detengo justo frente al sanador, mirándolo con una sonrisa en la cara, puedo ver cómo le cae el sudor de la frente. Justo como pensaba. Con la excepción de Daren, la mayoría de los curanderos son todo ladrido y poca mordida.

          "¿Qué te pasa?" le pregunto. "¿No dijiste que este era el mejor momento para atacar? Pues aquí estoy. ¡Da tu mejor golpe!"

          El mago rubio intenta agarrar su daga, pero le tiembla demasiado la mano para poder desenfundarla. Puedo ver el miedo en sus ojos mientras mira desesperadamente a su alrededor buscando apoyo de sus aliados, pero todos están demasiado asustados para decir nada.

          "¡E-e-estás de suerte, stillwater!" dice finalmente. "He cambiado de opinión. Preferiría luchar contra ti en igualdad de condiciones, después de que te hayas recuperado del todo. Nunca me han gustado las peleas injustas. Nos veremos pronto. Venga, hombres, nos vamos."

          El mago blanco se dirige hacia el bosque, y unos diez magos empiezan lentamente a seguir sus pasos. Después de que toda la escena termine, puedo ver a Eiden sonreír desde lejos, mientras también se marcha teletransportándose fuera del claro.
      - source: scene_text_2
        paragraph: 37
        text: |-
          Justo cuando empezaba a pensar que el peligro había pasado, de repente me encuentro rodeado por diez gólems de roca, cada uno siendo al menos el doble de mi tamaño. Así que también había un invocador poderoso entre estos magos. Fui un descuidado al bajar la guardia solo porque asusté a unos cuantos debiluchos.

          "¿Qué te pasa, stillwater?" oigo una voz que viene de detrás del muro de gólems. "¿Por qué no intentas caminar hacia mis gólems como hiciste con ese cobarde sanador? ¡A lo mejor los asustas!"

          "¡Barry!" grita Daren mientras atraviesa uno de los gólems de un tajo y se une a mi lado.

          Todavía quedan nueve gólems, y nos tienen rodeados. Daren no podrá destruirlos a todos él solo mientras también me defiende. Necesito hacer algo.
