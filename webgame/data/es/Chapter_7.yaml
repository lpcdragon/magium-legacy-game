  - name: ch7_biscuits
    texts:
      - source: scene_text
        paragraph: 472
        text: |-
          Me quito la mochila y meto la mano derecha dentro. Parece completamente vacía por fuera, pero una vez que me concentro en la imagen del paquete de galletas que estoy buscando, puedo sentirlo materializarse de inmediato en la palma de mi mano. Al sacarlo, agarro una de las galletas y se la doy a Kate.

          "Toma", le digo. "Debes tener hambre después de toda esa pelea."

          Me mira confundida por un segundo y luego decide aceptar mi ofrenda.

          "...Gracias", dice mientras le da un mordisco y empieza a comer en silencio.

          "Las conseguí en una tienda cerca de mi casa. Siempre tenían las mejores galletas. Es una lástima que no conociera a Daren en aquel entonces. Si hubiera tenido una mochila como esta, la habría llenado con cientos de estas delicios..."

          "Barry...", me interrumpe Kate mientras levanta la cabeza y me mira directamente a los ojos. "¿Por qué me salvaste?"

          "¿Qué quieres decir? ¿Por qué no lo haría?"

          "Porque casi te maté a sangre fría hace unos minutos."

          "Sí, sí, claro. Puedes actuar toda dura ahora, pero cuando llegó el momento de la verdad no tuviste el valor de hacerlo, ¿recuerdas?"
