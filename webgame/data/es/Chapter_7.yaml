            paragraph: 512
            text: |-
              "¡Sois todos unos patéticos!" dice un mago que lleva túnicas rojas y tiene una mirada particularmente enloquecida. "¡Sois docenas y aun así dudáis? Si sois demasiado cobardes para atacarle, entonces lo haré yo mismo."

              El mago de las túnicas rojas sale de la multitud y adopta su postura de combate.

              "¡Espero que estés a la altura de mis expectativas, stillwater. Pienso llevarme tu cabeza como trofeo!"

              "No si yo tengo algo que decir al respecto," dice Daren, mientras se coloca frente a mí con su espada apuntando hacia el mago que acababa de hablar.

              "¿El sanador con armadura se enfrenta a mí?" pregunta el elementalista de fuego. "¡Esto se pone cada vez mejor! A este ritmo, voy a ganar este torneo mucho antes de que anuncien los primeros objetivos."

              Levanta las manos en el aire, y una enorme columna de fuego giratoria empieza a formarse a su alrededor.

              "Contempla, héroe. Contempla el poder de Felran, ¡el elementalista de fuego más poderoso del Continente Oriental!"

              El pilar de fuego se hace cada vez más grande, y los demás magos empiezan a apartarse de su camino para evitar quedar calcinados.
          - source: scene_text_2
            paragraph: 36
            text: |-
              "Veo que ambos ya habéis aceptado vuestro destino. Ni siquiera intentáis levantar barreras mágicas a vuestro alrededor. No os preocupéis, haré que sea rápido. Aunque no puedo garantizaros que sea indoloro. ¡YAJAJAJAJAJAJAJAJA!"

              Su risa es tan enloquecida como la mirada en sus ojos. Daren no dice nada, pero observa al elementalista de fuego atentamente, con su espada frente a él.

              "¡MORID!" grita el mago, mientras envía todo el fuego hacia nosotros en forma de rayo. Justo cuando las llamas nos alcanzan, con un rápido tajo de su espada Daren devuelve todas las llamas a su dueño, incinerándolo en el acto y convirtiéndolo en cenizas.

              "¿¡Habéis visto eso!?" grita uno de los magos. "Su espada absorbió las llamas y las devolvió directamente al otro mago. ¡Son demasiado fuertes! ¡No podemos esperar vencerlos!"

                "No importa lo fuertes que sean," dice un mago con túnicas blancas y pelo largo y rubio que parece ser algún tipo de sanador. "Vinimos a este torneo para ganar. Sabíamos en lo que nos metíamos. Y además, el stillwater no ha lanzado ningún tipo de hechizo desde que le pusimos los ojos encima. ¿Creéis que eso es una coincidencia? Sea un stillwater o no, es imposible reponer completamente tu energía mágica en apenas dos horas después de una pelea contra un dragón. Debe estar en un estado vulnerable. ¡Ahora es el mejor momento para atacar!"
