    texts:
      - source: scene_text
        paragraph: 506
        text: |-
          "¿Quién, yo? ¡No soy un stillwater!"

          "¡No seas tan modesto, Barry!" dice Eiden. "Estoy bastante seguro de que todos aquí ya te vieron pelear contra un dragón tú solo hace unas horas."

          Hay un fuerte murmullo de nuevo, mientras muchos de los magos confirman haberme visto luchar contra el dragón.

          "¡No soy un stillwater, en serio!" les digo. "Solo estaba usando un artefacto para aumentar mis poderes cuando luché contra ese dragón."

          "¡Paparruchas!" dice un mago mayor. "No existen artefactos que te otorguen ese tipo de poder. Solo intentas que bajemos la guardia."
