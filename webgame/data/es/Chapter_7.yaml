  - name: ch7_welcome
    texts:
      - source: scene_text
        paragraph: 553
        text: |-
          "De nada," le digo.

          "Me siento tan terrible por todas las cosas que te he dicho y hecho hasta ahora..." dice ella. "No sé cómo podría devolverte el favor."

          "No me debes nada, solo fue un combate de práctica. Ni siquiera me lastimé ni nada. ¡Estoy bien, de verdad!"

          "Es típico de ti decir algo así," dice Kate, sonriendo levemente.

          Luego se gira hacia Hadrik.

          "Y gracias a ti también..." le dice. "Llevo mucho dinero conmigo, te prometo que haré que valga la pena."

          "¿De qué hablas?" le pregunta Hadrik. "Ya dije que teníamos un trato, ¿no? No hay necesidad de que me pagues nada. Ahora date prisa y coge tu mochila. Será mucho más difícil encontrar el camino por el bosque cuando oscurezca."

          "Por supuesto," dice Kate. "¡Vuelvo enseguida!"

          "Amigos míos," nos dice Azarius, mientras Kate pasa apresuradamente junto a él para coger su mochila. "Ha sido un gran privilegio conoceros a todos, pero me temo que nosotros también debemos marcharnos. Solo tengo una pregunta antes de irnos... No he podido evitar notar que los cuatro parecíais conocer al joven stillwater incluso antes de que nos teletransportara a todos a este claro. ¿Sabríais por casualidad alguna información que pudiera resultar útil si alguna vez tuviéramos que enfrentarnos a él en batalla?"
