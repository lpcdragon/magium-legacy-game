  - name: ch7_god_of_death
    texts:
      - source: scene_text
        paragraph: 535
        text: |-
          El nigromante se libera del agarre de su aliado y empieza a lanzar un hechizo.

          "Dime, Azarius," dice. "¿Has oído hablar alguna vez del invierno inmóvil?"

          "He oído varios relatos sobre ello cuando visité este continente en el pasado, sí," responde el sabio con calma. "Pero ninguno de ellos era lo que yo llamaría fiable. Supuestamente, fue una gran guerra que se libró en este continente entre stillwaters y ancestrales hace unos seiscientos años."

          "En efecto," dice Zack. "Pero, ¿qué dirías si te contara que los restos de los stillwaters que murieron en esa guerra aún pueden encontrarse en las profundidades del subsuelo, dispersos por todo el continente?"

          Mientras el nigromante habla, docenas de esqueletos empiezan a emerger lentamente del suelo bajo nuestros pies.

          "¿Qué dirías si te contara que puedo devolver a la vida a estos stillwaters como mis títeres, con casi toda su antigua destreza mágica intacta?"
      - source: scene_text_2
        paragraph: 54
        text: |-
          Los esqueletos ahora están empezando a atacar a todos los magos a nuestro alrededor mientras huyen gritando de terror. El cielo mismo se ha oscurecido y ha empezado literalmente a llover fuego y azufre. Kate está luchando por mantener un techo de hielo sobre nuestras cabezas para protegernos de las llamas, pero se derrite casi tan rápido como ella lo refuerza.

          "¿Qué harías, sabio? ¡Dímelo!"

          "Bueno, ya que me lo preguntas tan educadamente," dice Azarius, sonriendo. "Lo que haría es esto."

          El Sabio del Oeste golpea el suelo con su bastón, y puedo sentir una vibración muy intensa en el aire a nuestro alrededor. Los esqueletos de repente han dejado de arrasar y están todos simplemente de pie, vibrando ruidosamente. Después de unos segundos, todos sus huesos se hacen pedazos al mismo tiempo, mientras la lluvia de fuego se detiene, y el cielo empieza a despejarse una vez más.

          Zack, el nigromante, parece estar estupefacto, mientras mira desesperadamente a su alrededor para ver si no queda al menos uno de sus secuaces no-muertos que haya escapado de la masacre.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch7_illusion
  - name: ch7_illusion
    texts:
      - source: scene_text
        paragraph: 536
        text: |-
          "Fue un hechizo impresionante, sin duda," dice Azarius. "Pero al final, a pesar de su ridícula cantidad de poder mágico, esos esqueletos eran solo un montón de viejos huesos secos unidos con magia. Un ataque sónico lo suficientemente potente puede hacer pedazos cualquier objeto siempre que se iguale correctamente su frecuencia de vibración. Ahora, si no me equivoco, ese hechizo tuyo tiene una duración de unos cinco minutos y solo puede lanzarse una vez al día. A menos que tengas algún otro truco bajo la manga, creo que hay unas cuantas personas que les gustaría hablar contigo y tu compañero..."

          Todos los magos que estaban siendo perseguidos por esqueletos hace unos momentos ahora han rodeado al nigromante y a su aliado, y se puede ver que están sedientos de sangre.

          "Estoy harto de tus tonterías, Zack," dice el compañero del nigromante. "Todas las veces es igual. Estoy cansado de tener que salvarte siempre el pellejo. La próxima vez que estemos en un pueblo, tú invitas a las bebidas."

          El mago con la diadema en la cabeza entonces lanza algo al suelo, que explota y llena toda el área con un denso humo gris.

          "¡Rápido!" dice uno de los magos. "¡Dispersad el humo! No los dejéis escapar."
      - source: scene_text_2
        paragraph: 55
        text: |-
          Un elementalista de aire disipa todo el humo, y podemos ver a Zack y a su amigo a unos cien metros de nosotros, corriendo hacia los árboles.

          "¡A por ellos!" dice un mago, y todos empiezan a perseguirlos.

          Finalmente, los magos desaparecen en el bosque, y las únicas personas que quedan en el claro somos yo, Daren, Kate, Hadrik, Azarius, y un joven, probablemente de unos dieciocho o diecinueve años, que parece ser el fiel sirviente del sabio.

          "¡Realmente nunca deja de asombrarme lo fácilmente que la gente puede ser engañada por simples ilusiones como esa!" dice Azarius, mientras se acaricia la barba.
    choices:
      - position: 1
        text: ¿Ilusión? ¿No querrás decir bomba de humo?
        effects:
          - set:
              current_scene: ch7_smoke
      - position: 2
        text: Espera, ¿estás diciendo que esos magos todavía están escondidos por aquí, invisibles?
        effects:
