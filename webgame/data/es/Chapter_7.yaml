          "Me pilló desprevenido tu velocidad. Normalmente, no soy tan débil."

          "¿Oh?" dice el enano, sonriendo. "¿Qué tal una revancha, entonces? Aunque tengo que advertirte que esta vez no voy a ir con calma contigo."

          "¡No!" grita Kate, mientras se acerca a nosotros y luego se gira hacia mí. "Barry, siento mucho que te hayas lastimado por mi culpa. No debería haberte dejado luchar en mi lugar."

          Ahora se gira hacia Hadrik.

          "Enano," dice Kate. "¿Qué tal otro trato? Yo lucharé contra ti en lugar de Barry, y si gano, me llevarás al campamento de mi amiga. Pero en lugar de un combate a puñetazos, tendremos un duelo mágico."

          "¿Un duelo mágico?" dice Hadrik, con una sonrisa. "¿Estás segura de eso?"

          "Completamente."

          "Bueno, ¡entonces tenemos un trato! ¡Derrótame en un duelo mágico y personalmente te llevaré adonde quieras ir! Solo voy a necesitar unos segundos para prepararme, si no te importa."

          "Por supuesto," dice Kate. "Siéntete libre de lanzar los hechizos de protección que quieras. Yo ya lancé los míos esta mañ..."

          Mientras Kate hablaba, el enano empezó a ganar tamaño rápidamente. El suelo comenzó a temblar violentamente mientras crecía más y más, mientras su piel empezaba a cubrirse de escamas negras y alas empezaban a brotarle de la espalda. Cuando terminó su transformación, Hadrik se había convertido en un dragón negro en toda regla, casi del mismo tamaño que Tyrath.
      - source: scene_text_2
        paragraph: 67
        text: |-
          "Listo," dice Hadrik, mostrando los colmillos para exhibir su habitual amplia sonrisa. "¡Ahora estoy preparado!"

          "Que los dioses nos amparen..." dice Kate, mirando hacia arriba al enorme monstruo que había aparecido frente a ella.

          "¡Aaaaaaaah!" Rose empieza a gritar de repente al ver al dragón. "¡Aléjate! ¡Aléjate!"

          "Rose, tranquila," le dice Daren. "Es solo Hadrik en su forma transformada. No es un dragón de verdad."

          "¿Qué te pasa, Kate?" dice Hadrik. Su voz es mucho más profunda y fuerte que cuando está en su forma de enano. "No vas a echarte atrás ahora, ¿verdad?"

          Kate frunce el ceño.

          "No," dice Kate. "Solo me sorprendí un poco, eso es todo. Pero si es una pelea de dragones lo que quieres, no tengo objeciones."

          Kate está ahora ensamblando su propio dragón hecho de hielo esculpido, con un tamaño a la altura del de Hadrik. Pero esto parece diferente de todos sus otros hechizos. El dragón de hielo que ahora se encuentra frente a nosotros parece casi como si fuera una criatura real, viva y que respira. Esto está a un nivel completamente diferente de lo que ha lanzado antes. Debe estar dando absolutamente todo.

          "Puede que tengas la apariencia de un dragón," dice Kate. "Pero ambos sabemos que el cambio de forma no te da la capacidad de escupir fuego, y tampoco puedes lanzar hechizos de fuego mientras estás en esa forma. Veamos cuánto aguantas contra mi hielo."
