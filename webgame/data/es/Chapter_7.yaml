          "Aun así, tengo que admitir," dice Hadrik, con una sonrisa, "no esperaba conocer a dos supervivientes del Faro en el mismo día. ¡Este torneo es realmente algo fuera de lo común!"

          "¿Dos supervivientes?" le pregunto. "¿Quieres decir que hay otra maga artificial aquí en este continente además de Kate?"

          "¡Así es!" dice el enano. "¡Y es tremendamente fuerte también! Me noqueó casi sin esfuerzo. Estoy bastante seguro de que usaba rayos de la misma forma en que los elementalistas usarían agua o fuego. ¡Ser una maga artificial tiene sus ventajas!"
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch7_in_or_out
  - name: ch7_in_or_out
    texts:
      - source: scene_text
        paragraph: 543
        text: |-
          "¿Sabes hacia dónde se dirigía?" pregunta Kate.

          "Tu amiga y sus amigos de túnicas azul oscuro tienen un campamento montado no muy lejos de aquí," dice Hadrik. "Por lo que entendí, no tenían planes de irse hasta mañana por la tarde."

          "¿Podrías llevarme hasta ellos?" suelta Kate, quizá un poco demasiado fuerte.

          El enano parece un poco tomado por sorpresa por la repentina petición de Kate.

          "Por favor..." añade ella, esta vez en una voz más baja y suplicante.

          "Hmm..." dice Hadrik. "Me estás pidiendo bastante, muchacha. La última vez apenas escapé con vida. ¿Es esta mujer tu amiga?"

          "Sí..." dice Kate. "Es una amiga muy antigua..."

          Hadrik le da a Kate una larga mirada pensativa antes de decidirse a hablar.

          "Te diré qué," dice el enano. "Aceptaré llevarte al campamento de tu amiga con una condición."

          "¡Dila!" dice Kate, con la cara iluminándosele de repente.
      - source: scene_text_2
        paragraph: 62
        text: |-
          Hadrik sonríe.

          "¡Tu amigo de ahí tiene que vencerme en un duelo!" dice, mientras se gira hacia mí.

          "¿¡Barry!?" grita Kate, con una mezcla de sorpresa y decepción en la voz. "¿Quieres que Barry te derrote en un duelo? ¡No puedes hablar en serio! ¿Por qué él de entre todas las personas?"

          "Bueno, no sé si es un stillwater o no, pero estoy bastante seguro de que lo vi peleando contra un dragón en el cielo él solo hace unas horas. ¡Rara vez se tiene la oportunidad de conocer a un oponente más digno!"

          Kate me mira con indecisión, probablemente queriendo ver cuál es mi reacción a todo esto.

          "No busco un combate a muerte," dice Hadrik. "No queremos desgastarnos por completo antes de que el torneo siquiera empiece. ¡Un breve combate de práctica será suficiente! Sin magia, sin armas, igual que mi pelea con el stillwater de antes. ¡Y como tenemos prisa, quien haga caer al otro al suelo primero será declarado vencedor!"

          El enano se gira hacia mí, sonriendo otra vez.

          "Así que, ¿qué dices, Barry? ¿Aceptas o no?"
    choices:
      - position: 1
        text: Aceptar el desafío
        effects:
          - set:
              current_scene: ch7_accept
      - position: 2
        text: Rechazar el desafío
        effects:
          - set:
              current_scene: ch7_refuse
  - name: ch7_accept
    routes:
      - condition: ch7_call_rose = 0
        texts:
          - source: scene_text
            paragraph: 549
            text: |-
              "Claro, ¿por qué no? Lo intentaré."

              "¡Ja! ¡Ese es el espíritu!" dice Hadrik.

              "¡Barry, espera!" dice Kate. "¡Te van a matar!"

              "¡Estaré bien!" le digo mientras me muevo para alinearme con el enano, dejando unos seis metros de distancia entre nosotros.

              Kate no intenta detenerme más, pero puedo ver que tiene una mirada de inquietud en los ojos. Los demás se apartan ahora para darnos el espacio que necesitamos para empezar nuestra pelea.

              Hay algo que me ha estado molestando desde que nos teletransportaron aquí. No estoy seguro de si alguien más lo ha notado, pero el enano ha estado usando cambio de forma todo este tiempo. Lo noto por la sensación de su aura mágica. Esta no es su forma original. Que yo sepa, la magia de cambio de forma solo puede usarse para cambiar tu tamaño, o para transformarte en otra criatura. No puede usarse para disfrazarte como otra persona. ¿Qué posible beneficio podría obtener Hadrik de transformarse en un enano?

              Entonces recuerdo de repente su primera aparición. ¡Por supuesto! ¡Ahora todo tiene sentido! ¿Cómo no me di cuenta antes? La magia de cambio de forma no puede usarse para convertirte en un gigante, pero sí puede usarse para convertirte en un enano. Él no usó magia para hacerse de quince metros de alto, simplemente volvió a su forma original. ¡Hadrik es un gigante! La razón por la que se hace pasar por un enano es probablemente porque los gigantes nunca fueron invitados a este torneo, y teme que lo echen si descubren la verdad.
          - source: scene_text_2
            paragraph: 64
            text: |-
              ¡Esto significa que tiene una fuerza inhumana! Cuando usas cambio de forma para hacerte más pequeño, normalmente retienes una pequeña parte de tu masa original y la mayor parte de tu fuerza original. Un solo puñetazo suyo podría hacerme pedazos. Necesito tener mucho cuidado aquí. Aunque dijo que esto iba a ser un combate de práctica, realmente no parece el tipo de persona que sabe contenerse.

              Ahora que sé que es un gigante, ¡puedo usar esta información a mi favor! Como eligió transformarse en un enano y no en un humano, sus proporciones corporales son completamente diferentes a las de su cuerpo normal. Él mismo dijo que no estaba acostumbrado a correr con piernas cortas. Estoy dispuesto a apostar a que esto afecta su sentido del equilibrio de alguna manera. Solo necesito usar técnicas que apunten específicamente a hacerle perder el equilibrio.

              Hadrik ahora sonríe y se hace crujir los nudillos.

              "Bueno, Barry," dice después de un momento. "¡Allá voy!"

              El enano viene cargando directamente hacia mí, sin molestarse en usar maniobras evasivas. Justo antes de alcanzarme, acelera y aparece justo frente a mí, casi como si hubiera usado teletransportación.

              Sin embargo, en lugar de ir a por un puñetazo, intenta pincharme con el dedo índice.
