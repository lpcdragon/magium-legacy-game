              Afortunadamente, mi velocidad es más que suficiente para esquivar eficazmente los ataques de los gólems de roca. Tienen movimientos muy lentos, y es fácil predecir cómo van a atacar.

              Después de esquivar a unos cuantos gólems, echo un vistazo hacia Daren para ver cómo le va, y me sorprende gratamente descubrir que ya ha despachado a cuatro y va a por el quinto. Ahora hay suficiente espacio para maniobrar, y estos gólems son bastante lentos, así que ya no deberían suponer un peligro para mí.

