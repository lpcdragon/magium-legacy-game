  - name: ch7_everything
    texts:
      - source: scene_text
        paragraph: 556
        text: |-
          "No sabemos mucho sobre él, la verdad, ya que recién lo conocimos esta mañana," le digo. "Por lo que pude notar, tiene una cantidad ridícula de poder mágico y puede usar múltiples tipos de magia elemental. También parece ser capaz de ignorar completamente las leyes tradicionales de la magia. Cuando lo conocimos por primera vez, simplemente evadió todas las protecciones mágicas de Daren y lo durmió con un simple movimiento de la mano. Ah, y una cosa más. Parece ser virtualmente indetectable cuando se vuelve invisible. No pude sentir ni un rastro de su aura mágica cuando estaba ocultando su presencia."

          "Interesante..." dice Azarius, mientras golpea el suelo con su bastón y siento una onda de aire golpearme en la cara. "Bueno, a menos que también haya encontrado la forma de eliminar completamente su presencia física de este plano, podemos estar seguros de que al menos no está escuchando nuestra conversación ahora mismo. Acabo de usar un hechizo de sonar para detectar todos los objetos y personas en la zona, y somos los únicos magos en este claro. También tengo otra pregunta para ti. ¿Sabes si tiene algún enemigo aquí en este continente?"

          "¡Sí! El dragón contra el que luché en el cielo hace unas horas, Tyrath, estaba buscando específicamente a Eiden y lo quería muerto. Creo que también se ha enemistado con los lessathi. Nos dijo que transmitiéramos un mensaje a cualquier anciano que encontremos, y que les dijéramos que 'recuerden el invierno inmóvil'. Dado lo que te oí decir sobre el invierno inmóvil antes, solo puedo suponer que es una amenaza."
      - source: scene_text_2
        paragraph: 69
        text: |-
          "Ya veo," dice el viejo sabio mientras se acaricia la barba. "Esto podría resultar ser información invaluable, si alguna vez llegamos a enemistarnos con él. El stillwater dijo antes que no participaba en el torneo, pero nunca está de más ser demasiado precavido. Gracias por compartir esto conmigo."

          "De nada," le digo.

          "¡Maestro Azarius!" dice el pupilo del mago, mientras se acerca a nosotros con un mapa en las manos.

          "Azarius," dice el sabio. "Simplemente llámame Azarius."

          "Sí, maestro Azarius."

          El sabio suspira.

          "Dime, Henry, ¿qué pasa?"

          "He notado que hay una concentración inusualmente grande de magia alrededor de esta zona," dice Henry, mientras señala la parte inferior de su mapa. "¿Quizás pueda ser lo que estamos buscando?"

          "Quizás..." dice Azarius. "En cualquier caso, no está muy lejos de aquí, así que supongo que podríamos llegar antes de que oscurezca demasiado para ver algo. Marca la ubicación en el mapa."

          "Entendido."

          Cuando Kate vuelve con su mochila, Azarius se gira hacia nosotros.
      - source: scene_3
        paragraph: 7
        text: |-
          "Adiós, amigos míos," dice. "Os deseo un buen viaje, y espero que volvamos a encontrarnos."

          "¡Adiós, Azarius! ¡Adiós, Henry!" dice Rose, mientras todos les decimos adiós con la mano. "¡Estoy segura de que nuestros caminos se volverán a cruzar algún día!"

          Henry mira hacia atrás con una expresión de sorpresa en la cara. Probablemente no está acostumbrado a que la gente reconozca su existencia mientras viaja junto al Sabio del Oeste. Asiente brevemente a Rose, y luego se apresura a alcanzar a Azarius, mientras ambos se alejan lentamente de nosotros y desaparecen en las profundidades del bosque.
