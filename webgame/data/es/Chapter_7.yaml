  - name: ch7_ending
    texts:
      - source: scene_text
        paragraph: 566
        text: |-
          Cuando miro hacia Diane, puedo ver a dos hombres con túnicas azul oscuro acercándose por detrás de ella. Ambos llevan las capuchas puestas, así que no puedo ver sus caras con claridad.

          "¿Qué pasa aquí?" pregunta el hombre de la derecha. "¿Más intrusos?"

          "Mira," dice el de la izquierda. "Uno de ellos es ese enano que ella se negó a matar esta tarde. Esta vez ha traído a sus amigos."

          Se gira hacia Diane.

          "¿Y bien? ¿A qué esperas? ¡Acaba con ellos! ¿O estás esperando a que traigan aún más amigos para vengarse de nosotros?"

          "¡No!" dice ella. "No los mataré."

          "Típico," dice el hombre de la derecha. "Apártate. Los acabaré yo mismo."

          "Si te atreves a ponerles un solo dedo encima, te mataré aquí y ahora," dice Diane.

          "¿Te atreves a amenazarme, maldita? ¿No te das cuenta de la posición en la que estás?"

          "Déjalo, Zenir," dice el hombre de la izquierda mientras pone la mano en el hombro del otro. "Sabes perfectamente que no somos rival para ella en combate. Vamos, hagamos los preparativos para nuestra partida. No deberíamos quedarnos aquí mucho más tiempo, ahora que nuestra ubicación ha sido descubierta."
      - source: scene_text_2
        paragraph: 79
        text: |-
          "Tienes razón," dice Zenir mientras se calma. "Deberíamos prepararnos para irnos de aquí lo antes posible."

          Entonces señala amenazadoramente hacia Diane y dice:

          "¡Lady Meridith se enterará de esto, te lo aseguro!"

          "Cuento con ello," dice Diane, sonriendo desafiante.

          Zenir frunce el ceño, y luego va a seguir a su aliado de vuelta a su campamento principal. Una vez que los dos ya no son visibles, Diane se gira de nuevo hacia los cinco, y nota que sigo consciente.

          "¿Sigues despierto?" dice, mientras se acerca a mí. "Extraño... Un voltaje tan alto normalmente debería haberos hecho perder la consciencia a todos. Entonces, ¿por qué eres tú el único que ha podido mantener la consciencia?"

          Cuando se acerca más a mí, parece sorprendida por un breve momento, y luego sonríe.

          "Ya veo," dice. "Eres un lessathi. Kate debe confiar mucho en ti si está dispuesta a viajar contigo a pesar de este hecho."

          "Espera," empiezo a decirle. "¿Por qué tú..."

          "Cuida bien de ella, ¿quieres?" dice Diane, sonriendo, mientras me pone un dedo en la frente. "¡Cuento contigo para mantenerla a salvo de ahora en adelante!"

          Entonces envía una descarga de electricidad por todo mi cuerpo, y lo último que veo es su triste sonrisa, mientras lentamente pierdo la consciencia y todo se vuelve oscuro.
