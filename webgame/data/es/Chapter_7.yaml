              current_scene: ch7_biscuits
  - name: ch7_knife
    texts:
      - source: scene_text
        paragraph: 470
        text: |-
          "Entonces, ¿vas a decirme por qué me pusiste un cuchillo en la garganta?"

          Kate no dice nada y simplemente se queda sentada, mirando al suelo. Antes de que tenga la oportunidad de preguntarle de nuevo, levanta la cabeza y me mira directamente a los ojos, con una mirada seria pero triste en la cara.

          "Barry, ¿por qué me salvaste?", me pregunta.

          "¿Qué quieres decir? ¿Por qué no lo haría?"

          "Porque casi te mato a sangre fría hace unos minutos."

          "Sí, sí, claro. Puedes actuar toda dura ahora, pero cuando llegó el momento de la verdad no tuviste el valor de hacerlo, ¿recuerdas?"

          "Tú...", empieza a decir Kate mientras me agarra de la camisa.

          Cuando me ve sonreír, se calma y me suelta, reclinándose contra el árbol que tiene detrás.
      - source: scene_text_2
        paragraph: 13
        text: |-
          "Ahora entiendo...", dice, mirando hacia otro lado. "Entiendo que tú eres quien me ha estado protegiendo desde que nos conocimos ayer. Todo me vino a la mente en ese momento en que intenté matarte. ¿Por qué Daren nunca me miró como si fuera un ser humano si fue él quien llegó a la conclusión de que yo no era una banshee? ¿Por qué tú y Daren tenían una forma secreta de comunicarse en caso de que me volviera contra ustedes si él confiaba tanto en mí? Solo había una forma en que todo podía tener sentido. Simplemente no quería creerlo."

          Vuelve su mirada hacia mí.

          "Barry, si no hubieras estado ahí para detener a Daren de matarme ayer, habría pagado caro por mi insensatez. Y aun así, he pagado tu amabilidad poniéndote un cuchillo en la garganta. ¿Podrás perdonarme algún día?"

          "Oye, ¡estás haciendo que esto suene mucho peor de lo que realmente fue! Todo está bien cuando acaba bien, ¿no? Lo importante es que no se hizo ningún daño duradero, y una vez que Daren te cure la pierna y tus poderes de hielo vuelvan, todo podrá volver a la normalidad."

          Hago una pausa.

          "Entonces...", le digo a Kate mientras le extiendo la mano. "¿Seguimos siendo amigos?"
