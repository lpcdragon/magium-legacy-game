  - name: ch7_kate_vs_hadrik
    texts:
      - source: scene_text
        paragraph: 555
        text: |-
          Hadrik sonríe, y se eleva hacia el cielo. El dragón de Kate lo sigue, y mientras tanto, ella empieza a construir una prisión de hielo a su alrededor, que luego usa para elevarse en el aire, para tener una mejor vista de la pelea.

          Los dos dragones se lanzan el uno contra el otro y atacan con garras y colmillos. El hielo reforzado de Kate parece resistir bastante bien los ataques de Hadrik. Estoy bastante seguro de que Tyrath habría cortado su dragón de hielo como si fuera mantequilla. Supongo que su título de 'rey de todos los dragones' no era solo de adorno después de todo.

          Kate ahora intensifica sus ataques disparando también a Hadrik con cientos de carámbanos mientras su dragón de hielo sigue persiguiéndolo. Cada vez que Hadrik intenta ir a por Kate, ella mueve su jaula para esquivarlo y envía a su dragón de hielo para interceptarlo. Algunos de los carámbanos impactan al dragón negro en el ala izquierda, y empieza a caer del cielo, mientras el dragón de hielo aprovecha al máximo la oportunidad y se lanza directamente sobre su oponente.

          Los dos dragones se estrellan contra el suelo, con el de hielo encima, inmovilizando al negro en su sitio con las garras. Kate ahora desciende lentamente también, todavía en su jaula de hielo, y mira a Hadrik, esperando su siguiente movimiento.

          "¡Vale, vale, me rindo, tú ganas!" dice Hadrik, mientras vuelve a transformarse en su forma de enano.

          Al escuchar sus palabras, Kate baja su jaula, y una vez que está a salvo en el suelo, deshace tanto la jaula como el dragón.
