          - source: scene_text_2
            paragraph: 48
            text: "The summoner prepares to call more creatures into battle, but before he can act, Hadrik places himself between Kate and her attacker and starts panting heavily.\r\n\r\n\"Hold on... Just... give me a sec...\" he says, while everyone looks at him, confused. \"Man... I just can't get used to running with these short legs...\"\r\n\r\n\"Is this supposed to be some sort of a joke?\" asks the elf. \"You dwarves have always had a sense of humor beyond my understanding. Step aside, if you know what's best for you.\"\r\n  \r\n\"No can do, I'm afraid,\" Hadrik says. \"I can't just stand idly by and let you hoodlums treat a lady with disrespect!\"\r\n\r\n\"A lady?! I must admit, I've heard the rumors about dwarves drinking so much that they have ale running through their veins instead of blood, but I never thought them to be true.\"\r\n\r\n\"Aye! And I never expected that old saying about elves never leaving home without a stick up their arse to turn out to be true, either. It's a crazy world we're living in, I'll tell you that!\""
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: ch7_azarius_vs_summoner
  - name: ch7_azarius_vs_summoner
    texts:
      - source: scene_text
        paragraph: 530
        text: |-
          El invocador frunce el ceño al oír las palabras del enano.

          "Esa 'dama' que tanto te empeñas en proteger es una banshee. Es una plaga sobre esta tierra que debe ser tratada de inmediato."

          "¿Ah sí?" dice Hadrik, con una sonrisa satisfecha. "¿Lo es?"

          "Si no vas a quitarte de mi camino, entonces puedes unirte a estos tontos en sus muertes. Ya he oído suficientes estupideces tuyas por hoy."

          Justo cuando el invocador y todos los demás magos se preparan para atacar, un fuerte grito de Azarius el sabio congela a todos en el sitio.

          "¡Basta!" grita. "No habrá más derramamiento de sangre este día. Si alguno de vosotros, mocosos, todavía tiene ganas de armar jaleo, seré yo contra quien pelearéis a continuación. ¿Me he expresado con claridad?"
      - source: scene_text_2
        paragraph: 49
        text: |-
          "¿¡Qué!?" pregunta el elfo. "¿¡Te has vuelto loco!? ¿Te das cuenta de lo que pasará si dejamos a este monstruo maligno campar a sus anchas?"

          "Soy bien consciente de las consecuencias, y estoy dispuesto a asumir toda la responsabilidad de mis actos. Sin embargo, eres libre de retarme a un duelo si crees que tu causa es la justa."

          El invocador parece estar a punto de explotar, pero finalmente decide simplemente darse la vuelta y marcharse, sin decir una palabra más. Los demás magos que estaban a punto de unirse a la pelea ahora están todos envainando sus armas.

          "Lamento profundamente no haber detenido esta ridícula pelea antes, amigos míos," dice Azarius, mirándonos a los cuatro uno por uno. "Me temo que la curiosidad pudo más que yo y no pude evitar querer terminar esto antes de tener la rara oportunidad de ver al gran héroe Daren en acción."
    choices:
      - position: 1
        text: ¿Por qué nos ayudas?
        effects:
          - set:
              current_scene: ch7_azarius_why
      - position: 2
        text: Te equivocas, ¡no estamos aliados con la banshee!
        effects:
          - set:
              current_scene: ch7_wrong_stay
  - name: ch7_azarius_why
    texts:
      - source: scene_text
        paragraph: 531
        text: |-
          "¿Por qué nos ayudas?"

          "Bueno, no podía quedarme de brazos cruzados viendo cómo estos matones creciditos atacaban a una joven dama indefensa."

          "¿¡Indefensa!?" grita Kate.

          "¿Joven dama?..." pregunta Daren, confundido.

          Antes de que puedan terminar su conversación, un mago vestido con túnicas negras y con un tatuaje de culebra en su cabeza calva los interrumpe haciendo un fuerte sonido de chasquido con la lengua.

          "Esto no puede ser, Sabio del Oeste," dice. "Esto simplemente no puede ser."

          Azarius se gira hacia él, sonriendo con calma.

          "¿Un seguidor del Dios de la Muerte nos honra con su presencia?" dice. "Si hice algo que te ofendiera, ¡por favor, expón tu queja!"
      - source: scene_text_2
        paragraph: 50
        text: |-
          "Mi queja es simple, sabio. Mi dios requiere más sacrificios este día, y tú lo has privado de ellos al interrumpir esta pelea."

          "¿Oh? Pero estaba bastante seguro de que a pesar de su título, Ulruk, el Dios de la Muerte, solo se dedica a la nigromancia y no gobierna realmente el reino de los muertos. ¿Por qué ha empezado de repente a interesarse por los asuntos de personas que aún están vivas? Si simplemente buscas cadáveres frescos, te aseguro que hay muchos por estos alrededores después de los eventos de ayer."

          "No cuestiones el juicio del gran Ulruk, hereje. Tus acciones han enfurecido a mi dios, ¡y ahora sentirás su ira!"

          Un mago que lleva un diadema de plata en la cabeza y túnicas verdes agarra al nigromante por el brazo.

          "Cálmate, Zack," dice. "Queda mucho tiempo hasta el final del día. Podemos simplemente matar a más gente después de que salgamos de aquí y el número de muertes será el mismo."

          "¡Suéltame, idiota! Solo viajo contigo porque mi dios me lo ordenó. ¡No te atrevas a decirme lo que tengo que hacer! Este asunto no tiene nada que ver contigo ni con tu Dios del Destino."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch7_god_of_death
  - name: ch7_wrong_stay
    texts:
      - source: scene_text
        paragraph: 532
        text: |-
          "Te equivocas, ¡no estamos aliados con la banshee!"

          De repente siento cómo me golpean con fuerza en la parte de atrás de la cabeza con algo muy frío. Cuando me giro, veo a Kate sosteniendo un garrote improvisado hecho de hielo en las manos.

          "Te lo juro, Barry, uno de estos días..."

          El sabio se ríe.

          "No hay por qué alarmarse, amigos míos," dice. "La única razón por la que decidí intervenir fue porque no podía quedarme sentado viendo cómo estos matones creciditos atacaban a una joven dama indefensa."

