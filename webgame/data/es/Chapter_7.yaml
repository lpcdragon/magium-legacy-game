        paragraph: 507
        text: |-
          "En realidad, yo también estoy bastante ocupado. ¿Quizás en otro momento?"

          "Buen intento, chico," dice uno de los magos. "Pero te leo como un libro abierto. En realidad no eres un stillwater, ¿verdad?"

          "¡Tonterías!" dice Eiden. "Seguramente todos lo visteis luchar contra un dragón en el cielo él solo hace unas horas, ¿no?"

          Hay un fuerte murmullo de nuevo, mientras muchos de los magos confirman haberme visto luchar contra el dragón.

          "Dice la verdad," les digo. "Ese dragón estaba en mi camino, así que tuve que deshacerme de él. Pero no tenéis que preocuparos por eso. A menos, claro, que planeéis poneros en mi camino también..."

          Los magos empiezan a hablar entre ellos, pero dudan en responder a mi provocación.
