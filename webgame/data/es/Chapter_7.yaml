          "Entiendo", le digo.

          "Bien. Ahora, quiero que me escuches con atención y respondas a mis preguntas. Dime, ¿dónde tienes a Diane?"

          "... ¿Qué?"

          La frialdad en los ojos de Kate empieza a ser reemplazada por ira.

          "No creas que puedes salirte con la tuya simplemente fingiendo ignorancia como has estado haciendo hasta ahora. Sé quién eres. Te lo pregunto de nuevo. ¿Qué has hecho con Diane? ¿Dónde la tienes? ¡Respóndeme!"

          "No tengo ni idea de lo que estás hablando. ¿Quién es Diane?"

          "¡Maldito seas!", me grita Kate furiosa, mientras las lágrimas empiezan a formarse en sus ojos. "¡Maldito seas hasta el infierno! ¡Confié en ti! ¡En ti y en Rose! ¿Era todo esto parte de tu plan para recapturarme? ¿Estabas intentando acercarte a mí para pillarme desprevenida? ¿Rose también trabaja contigo?"

          "¿Qué?... No, escúchame..."

          "¿Dónde están los otros Lessathi? ¿Están esperando para emboscarme mientras hablamos? ¿Están todos esperando tu señal?"

          ¿Piensa que soy un Lessathi? ¿La raza que construyó la trampa para dragones? ¿Qué le pasa? No tiene ningún sentido lo que dice.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch7_diane
  - name: ch7_diane
    routes:
      - condition: ch7_tap = 0
        texts:
          - source: scene_text
            paragraph: 458
            text: |-
              "Maldita sea, Kate, no sé qué te ha pasado, pero no soy un Lessathi. ¿Crees que estaría perdiendo el tiempo aquí intentando convertirme en mago si tuviera la capacidad de construir poderosas trampas y dispositivos mágicos?"

              "¡Mientes!", me grita Kate. "¡Mientes descaradamente! Los humanos no podrían sobrevivir con un aura mágica tan débil, y no hay otra raza que se parezca exactamente a los humanos y posea tan poca energía mágica."

              "Aunque de alguna manera yo sea un Lessathi, eso no niega el hecho de que fui criado por humanos y nunca he conocido a esos tipos que te capturaron. ¿Tiene esto algo que ver con el Faro de Esperanza? No trabajo con ninguno de ellos. ¡Por favor, confía en mí en esto!"

              "¿¡Por qué!?", grita mientras una lágrima le resbala por la cara. "¿Por qué debería confiar en ti? ¿En qué te diferencias del resto de ellos? ¿Por qué debería creer que no me traicionarás, como todos los demás que he conocido en mi vida?"
        choices:
          - position: 1
            text: ¡Porque estoy enamorado de ti!
            effects:
              - set:
                  current_scene: ch7_love
          - position: 2
            text: Porque te ayudé cuando fuimos atacados por los ballesteros.
            effects:
              - set:
                  current_scene: ch7_helped
      - condition: ch7_tap = 1
        texts:
          - source: scene_text
            paragraph: 459
            text: |-
              "Maldita sea, Kate, no sé qué te ha pasado, pero no soy un Lessathi. ¿Crees que estaría perdiendo el tiempo aquí intentando convertirme en mago si tuviera la capacidad de construir poderosas trampas y dispositivos mágicos?"

              "¡Mientes!", me grita Kate. "¡Mientes descaradamente! Los humanos no podrían sobrevivir con un aura mágica tan débil, y no hay otra raza que se parezca exactamente a los humanos y posea tan poca energía mágica."

              "Aunque de alguna manera yo sea un Lessathi, eso no niega el hecho de que fui criado por humanos y nunca he conocido a esos tipos que te capturaron. ¿Tiene esto algo que ver con el Faro de Esperanza? No trabajo con ninguno de ellos. ¡Por favor, confía en mí en esto!"

              "¿¡Por qué!?", grita mientras una lágrima le resbala por la cara. "¿Por qué debería confiar en ti? ¿En qué te diferencias del resto de ellos? ¿Por qué debería creer que no me traicionarás, como todos los demás que he conocido en mi vida?"

              "Kate, nunca haría nada para hacerte daño..."

              "¡MENTIROSO! ¿Creías que no me daría cuenta? ¿Me tomas por tonta? Daren se ha estado acercando lentamente a nosotros desde el momento en que puse mi cuchillo en tu garganta. Se mueve en silencio e intenta suprimir su aura mágica, pero aún puedo sentirlo. Lo llamaste aquí, ¿verdad? ¡Estabas planeando hacer que me matara!"
        choices:
          - position: 1
            text: No lo llamé aquí para matarte.
            effects:
              - set:
                  current_scene: ch7_kill
          - position: 2
            text: Por favor, cálmate. Todavía podemos hablar las cosas.
            effects:
              - set:
                  current_scene: ch7_calm
  - name: ch7_love
    texts:
      - source: scene_text
        paragraph: 460
        text: |-
          "¡Porque estoy enamorado de ti!"

          Cuando Kate escucha mis palabras, golpea el árbol detrás de mí con tanta fuerza que deja una gran abolladura y sus nudillos empiezan a sangrar. Puedo verla literalmente temblando de rabia.

          "¿¡Todo es una broma para ti!?", me grita.

          De repente, se escucha un sonido proveniente de mi bolsillo, y esta vez no es mi dispositivo de estadísticas.

          "Barry, ¿estás bien?", dice Daren a través del transceptor mágico. "¿Sigues ahí?"

          Toco el dispositivo con mi mano izquierda para activarlo y le respondo.

          "Sí, Daren, estoy bien. Solo estoy teniendo una conversación más larga con Kate. Te avisaré cuando terminemos."

          "Oh, de acuerdo. No quería interrumpir, solo estaba empezando a preocuparme, eso es todo. Tómate tu tiempo."

          "¿Qué era eso?", me pregunta Kate, mientras apago el transceptor.

          Es gracioso. Todavía tiene su daga contra mi garganta mientras me habla, pero me encuentro inusualmente calmado con todo esto. Me pregunto si será por todo lo que he pasado desde que me uní a este torneo ayer.
      - source: scene_text_2
        paragraph: 5
        text: |-
          "Era un dispositivo que Daren me dio para comunicarme con él en caso de emergencia", le digo.

          "¿Qué?... No, eso no puede ser. Nunca hablamos de esto durante nuestras reuniones de estrategia. ¿Por qué no me habría dado también a mí un dispositivo así si es para emergencias?"

          "Porque Daren no confía en ti."

          "Pero dijiste..."

          "Lo siento, Kate. Tenía miedo de que no me creyeras si te decía la verdad. El hecho es que yo fui quien convenció a Daren de no realizar el ritual de purificación en ti cuando nos conocimos."

          "No... ¡Mientes!"

          "¿Miento? ¿No eres tú la que dijo que Daren nunca te miró como si fueras un ser humano?"

          Kate vacila.

          "¿Por qué tú, de entre todas las personas...?"

          "Es por mi hermana, que se convirtió en banshee hace mucho tiempo. Así es como supe que tú eras diferente."

          "¿De verdad esperas que crea...?"

          Se detiene cuando ve la expresión en mi cara. Debe haberse dado cuenta de que esta vez estoy hablando en serio.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch7_sister
  - name: ch7_helped
    texts:
      - source: scene_text
        paragraph: 461
        text: |-
          "Porque te ayudé cuando fuimos atacados por los ballesteros esta mañana. Si te hubiera querido muerta o capturada, ese habría sido el mejor momento para aprovechar la oportunidad."

          Kate parece estar considerando mis palabras, aunque todavía hay duda en sus ojos.

          De repente, se escucha un sonido proveniente de mi bolsillo, y esta vez no es mi dispositivo de estadísticas.

          "Barry, ¿estás bien?", dice Daren a través del transceptor mágico. "¿Sigues ahí?"

          Toco el dispositivo con mi mano izquierda para activarlo y le respondo.

          "Sí, Daren, estoy bien. Solo estoy teniendo una conversación más larga con Kate. Te avisaré cuando terminemos."

          "Oh, de acuerdo. No quería interrumpir, solo estaba empezando a preocuparme, eso es todo. Tómate tu tiempo."

          "¿Qué era eso?", me pregunta Kate, mientras apago el transceptor.

          Es gracioso. Todavía tiene su daga contra mi garganta mientras me habla, pero me encuentro inusualmente calmado con todo esto. Me pregunto si será por todo lo que he pasado desde que me uní a este torneo ayer.
