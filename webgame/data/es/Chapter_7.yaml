            paragraph: 519
            text: |-
              Es todo o nada. Saco mi daga y me lanzo contra uno de los gólems que tengo delante.

              Mi daga apenas araña la superficie de la coraza de roca del gólem. Definitivamente no había suficiente fuerza detrás de mi golpe. La criatura aprovecha la oportunidad y deja caer uno de sus enormes puños sobre mí.

              Por suerte, soy lo suficientemente rápido para apartarme de su camino y consigo escapar ileso. Daren está derribando a los gólems mucho más rápido de lo que hubiera esperado. Ya ha derribado a tres y va a por el cuarto. Ahora hay suficiente espacio para maniobrar, y estos gólems son bastante lentos, así que ya no deberían suponer un peligro para mí.

              Se oyen varios gritos de pájaros, fuertes y dolorosos, que vienen de arriba, y casi inmediatamente después, vemos cinco grandes halcones cayendo al suelo al mismo tiempo, cada uno de ellos atravesado por al menos un carámbano en el pecho.
          - source: scene_text_2
            paragraph: 41
            text: |-
              Kate está detrás de nosotros, con la capucha quitada, y su característica mirada fría en los ojos.

              "Tácticas de invocador típicas," dice. "Distraer a los enemigos con carne de cañón y luego atacar por sorpresa desde arriba. Me sorprende que hayas conseguido sobrevivir tanto tiempo sin saber esto, Daren. Debes haber llevado una vida bastante protegida durante tus heroicas campañas."

              "¡Cállate!" dice Daren mientras atraviesa otro gólem de roca. "Iba a encargarme de esos pájaros cuando bajaran. No todos tienen elegantes ataques a distancia ilimitados para usar a su antojo."
