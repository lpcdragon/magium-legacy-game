  - name: ch7_spirits
    texts:
      - source: scene_text
        paragraph: 563
        text: |-
          "¿Qué son los espíritus del bosque?"

          "Son guardianes," me dice Rose. "Jurados a proteger tanto a los animales como al bosque y mantenerlos a salvo de todo daño."

          "¿Y quién exactamente decidió que no se nos permite pasar por estos bosques?"

          "El gran zorro dorado. Por favor, ¡no hay tiempo para hablar! Tenemos que salir de aquí antes de que sea demas..."

          "¿Kate?..." oímos la voz de una mujer, viniendo de detrás de un árbol. "Kate, ¿eres tú?"

          Cuando la mujer que parece ser la amiga de Kate se muestra ante nosotros, vemos que tiene una complexión bastante musculosa, aunque de ningún modo la hace parecer poco atractiva. Tiene ojos azules, y el pelo corto y rubio que se le levanta en la cabeza, probablemente como efecto secundario de sus poderes eléctricos. Lleva pantalones de cuero ajustados y una camiseta de tirantes gris, mientras que su edad parece cercana a la de Kate. También tiene una cicatriz de quemadura en el brazo izquierdo, que probablemente es un recuerdo de una batalla reñida.

          "¡Diane!" dice Kate, incapaz de contener su alegría. "No puedo creer que seas tú de verdad... No sabes cuánto tiempo llevo intentando encontrar..."

          "¡IDIOTA!" grita Diane, silenciando inmediatamente a Kate. "¿Por qué has vuelto? ¡Se suponía que no debías estar aquí!"
      - source: scene_text_2
        paragraph: 76
        text: |-
          "Diane, escúchame, he vuelto para salvarte... He vuelto para sacarte de este lugar."

          "¡No necesito que me salven!" dice Diane, mientras se señala el cuello para mostrarle a Kate que ya no lleva un collar. "Estoy trabajando con ellos por voluntad propia."

          "¿Qué?... Pero, ¿por qué? No entiendo..."

          "¡No importa! Lo que importa es que tienes que salir de aquí. ¡Rápido! Antes de que los ancianos vuelvan. Y deja de buscarme. Por favor..."

          "¡No!" grita Kate. "¡No me voy de aquí sin ti!"

          "Sí que lo harás," dice Diane, mientras sus ojos empiezan a brillar intensamente, y corrientes eléctricas empiezan a formarse a su alrededor.

          "Kate, quizá deberíamos retirarnos por ahora," le digo, mientras empiezo a sentir cómo se me eriza el vello de la piel por la electricidad estática a mi alrededor.

          "¡No!" dice Kate. "Si no piensa entrar en razón hasta que le meta algo de sentido común a golpes en su estúpida cabeza, entonces yo..."

          Antes de que Kate pueda terminar su frase, hay una repentina y poderosa descarga de electricidad en el aire a nuestro alrededor, que nos electrocuta a todos violentamente y luego nos hace caer al suelo al unísono. De los cinco, parece que soy el único que ha mantenido la consciencia, aunque apenas puedo moverme.
