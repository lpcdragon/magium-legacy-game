  - name: ch7_numb
    texts:
      - source: scene_text
        paragraph: 473
        text: |-
          "¿Amigos?...", me pregunta, conmocionada.

          Me mira, intentando averiguar si estoy hablando en serio o no.

          "¿Estás completamente loco?"

          "¡Por supuesto que sí! Seguramente te habrás dado cuenta de esto cuando descubriste la verdadera razón por la que me uní al torneo."

          "¿Cómo puedes siquiera considerar seguir viajando conmigo después de lo que ha pasado? ¿No entiendes que te estás poniendo en peligro con solo estar cerca de mí?"

          "¿Y qué? ¿Cómo sería viajar contigo más peligroso que tener que luchar contra un Stillwater y un dragón en el mismo día? Al menos si vienes con nosotros, me sentiré más seguro sabiendo que me cubres las espaldas."

          Kate hace una pausa y me mira vacilante.
      - source: scene_text_2
        paragraph: 16
        text: |-
          "¿Estás seguro de esto?", me pregunta.

          "¡Sí, sí, estoy seguro! Venga ya. ¡Dame la mano de una vez! Se me está durmiendo el brazo."

          Kate sonríe débilmente, mientras agarra mi mano y la aprieta con firmeza.

          "Eres un idiota", dice.

          "Lo sé", le digo mientras terminamos nuestro apretón de manos. "Ahora, vamos, deberíamos ponernos en marcha. Si seguimos aquí parados, Daren seguramente empezará a pensar que encontraste la forma de atacarme de nuevo o algo así. Estoy seguro de que puedo encontrar la manera de suavizar las cosas con él de algún modo."

          "No, espera... No podemos seguir así. Te debo una explicación por todo lo que ha pasado. Es lo mínimo que puedo hacer."
    choices:
      - position: 1
        text: ¿Tiene esto algo que ver con el Faro de Esperanza?
        effects:
          - set:
              current_scene: ch7_beacon
      - position: 2
        text: ¿Puedes primero decirme quiénes son exactamente estos Lessathi?
        effects:
