  - name: ch7_summoner_vs_dwarf
    routes:
      - condition: ch7_intimidate = 0
        texts:
          - source: scene_text
            paragraph: 528
            text: |-
              Uno de los magos empieza a gritar muy fuerte, mientras señala a Kate.

              "¡Aaaaaaaah! ¡Una banshee! ¡Es una banshee! ¡Rápido, matadla antes de que despierte por completo!"

              Muchos de los magos que parecían indecisos sobre toda esta pelea hasta ahora empiezan poco a poco a unirse a la batalla también, para matar a Kate. Eiden parece haberse teletransportado lejos mientras luchábamos contra los gólems, y Hadrik, que ahora ha perdido a su compañero de duelo, también está corriendo hacia nosotros, probablemente buscando unirse a la diversión.

              El mago invocador está fuera de sí de alegría gracias a este último giro de los acontecimientos. Ahora que lo veo bien, mide unos seis pies de alto y tiene orejas largas y puntiagudas, ojos verdes y pelo rubio. He viajado mucho en mi vida, pero esta es la primera vez que veo a un elfo en persona. Normalmente, están muy aislados del resto del mundo y rara vez salen del reino élfico del Continente Oriental. Oí que también los habían invitado aquí, pero no esperaba realmente que ninguno apareciera. Supongo que esto demuestra la importancia que el Magium tiene para los magos de todo el mundo.

              "¡Ja!" dice triunfante. "Esto es lo que os pasa por aliaros con una banshee, campesinos. Es hora de que os demuestre por qué los elfos somos superiores a vosotros en todos los sentidos. Y voy a empezar encargándome de esa monstruosidad que mató a mis pobres halcones."
          - source: scene_text_2
            paragraph: 47
            text: |-
              El invocador se prepara para llamar a más criaturas a la batalla, pero antes de que pueda actuar, Hadrik se coloca entre Kate y su atacante y empieza a jadear pesadamente.

              "Esperad... Solo... dadme un segundo..." dice, mientras todos lo miran confundidos. "Tío... es que no me acostumbro a correr con estas piernas tan cortas..."

              "¿Se supone que esto es algún tipo de broma?" pregunta el elfo. "Los enanos siempre habéis tenido un sentido del humor más allá de mi comprensión. Hazte a un lado, si sabes lo que te conviene."

              "Me temo que no puede ser," dice Hadrik. "¡No puedo quedarme de brazos cruzados mientras tratáis a una dama con falta de respeto!"

              "¿¡Una dama!? Debo admitir que había oído los rumores de que los enanos beben tanto que tienen cerveza corriendo por las venas en lugar de sangre, pero nunca pensé que fueran ciertos."

              "¡Sí! Y yo nunca esperé que ese viejo dicho de que los elfos nunca salen de casa sin un palo metido en el trasero resultara ser cierto tampoco. ¡Es un mundo loco en el que vivimos, eso te lo digo!"
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: ch7_azarius_vs_summoner
      - condition: ch7_intimidate = 1
