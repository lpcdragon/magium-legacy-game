            paragraph: 515
            text: |-
              "Muy bien," le digo. "Entonces iré a matar al sanador rápidamente."

              "Barry, no seas estúpido. Es obvio que el sanador va a estar muy protegido una vez que empe..."

              No le dejo terminar la frase y me lanzo hacia el mago blanco con toda mi velocidad, mientras aún está indefenso.

              Los magos no tuvieron ninguna oportunidad de reaccionar. Fui demasiado rápido para ellos. Antes de que siquiera tengan la oportunidad de parpadear, llego detrás del sanador y lo apuñalo directamente en el corazón, matándolo al instante. Cuando cae al suelo, sus esbirros se paralizan de miedo durante unos segundos. Sin embargo, no tardan mucho en reaccionar y decidir unánimemente huir del campo de batalla tan rápido como pueden.

              Mientras los cobardes huyen con el rabo entre las piernas, Daren camina lentamente hacia mí, meneando la cabeza en señal de desaprobación.
