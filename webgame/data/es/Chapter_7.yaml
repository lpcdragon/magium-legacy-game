  - name: ch7_disagree
    texts:
      - source: scene_text
        paragraph: 491
        text: |-
          "Siento decir que realmente no estoy de acuerdo con ninguno de los dos", les digo.

          Tanto Daren como Kate se giran hacia mí simultáneamente.

          "Kate tiene razón sobre las leyes fundamentales del cambio de forma", continúo. "Pero un hechizo de ilusión sería igual de improbable. No hay hechizos de ilusión que puedan alcanzar tan lejos, no importa lo poderoso o hábil que seas como mago. Debe haber algo que se nos está escapando."

          "Bueno, de todos modos no importa", dice Kate. "Esto es obviamente una trampa. Sinceramente no puedo imaginar cómo alguien podría ser tan estúpido como para caer en algo tan..."

          De repente, los cuerpos de Kate, Daren y el mío empiezan a vibrar con fuerza, mientras nos envuelve una luz blanca.

          "Oh, no...", dice Kate.

          "¿Qué? ¿Qué está pasando?", nos pregunta Rose.

          "¡Rose, atrapa!", dice Daren, mientras le lanza su transceptor.

