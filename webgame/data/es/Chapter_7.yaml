            paragraph: 38
            text: |-
              "En serio, Barry, ¿no podrías al menos avisarme antes de hacer algo tan arriesgado? ¿Y si los enemigos hubieran decidido rodearte después de tu numerito en lugar de salir corriendo?"

              Mientras me preparo para responder a su pregunta, de repente me doy cuenta de que unos diez gólems de roca han aparecido de la nada y ahora nos rodean completamente, cada uno siendo al menos el doble de mi tamaño.

              Así que también había un invocador poderoso entre estos magos. Fui un descuidado al bajar la guardia solo porque asusté a unos cuantos debiluchos.

              "¿Qué te pasa, stillwater?" oigo una voz que viene de detrás del muro de gólems. "¿No vas a apuñalar a los gólems con tu cuchillito también?"

              Esto no es bueno. Daren no podrá luchar contra todos estos gólems él solo mientras también me defiende. Necesito hacer algo.
