      - source: scene_text_2
        paragraph: 27
        text: |-
          La pelea comienza de repente, sin previo aviso. Ambos luchadores se lanzan el uno contra el otro al mismo tiempo, y Hadrik inicia saltando al aire, levantando su pierna derecha lo más alto que puede y bajándola como un hacha, en un intento de aplastar el cráneo del stillwater. Eiden se hace a un lado con toda tranquilidad y la bota del enano golpea el suelo, creando un pequeño cráter y lanzando escombros por todas partes. El stillwater no pierde el tiempo y golpea a Hadrik en el pecho con la palma de su mano derecha, su golpe enviando una potente ráfaga de aire a su alrededor y empujando al enano diez pies hacia atrás.

          "¿Qué demonios es esto?" grita uno de los magos. "¡Apenas han empezado a pelear y ya están usando magia para aumentar su fuerza!"

          "No están usando magia," dice otro mago. "He estado monitorizando de cerca sus auras mágicas desde que empezaron, y no ha habido fluctuaciones hasta ahora."

          "¿Qué, me vas a decir que simplemente hicieron muchas sentadillas y flexiones? No puedes volverte tan poderoso solo con entrenamiento."
      - source: scene_3
        paragraph: 2
        text: |-
          Sí, se puede, en teoría. Existe un tipo de magia que ayuda a superar las limitaciones del cuerpo humano durante el entrenamiento físico. La desventaja es que a menos que tengas una esperanza de vida de cientos de años, tendrías que pasar la mayor parte de tu vida entrenando para alcanzar sus niveles de fuerza. ¿Podrían estar usando dispositivos de estadísticas también?

          Los dos contendientes ahora se mueven tan rápido que apenas puedo seguirlos. Eiden conecta la mayoría de sus golpes, pero el enano no parece tener ningún problema para encajarlos. Hadrik, sin embargo, no ha conseguido golpear al stillwater ni una vez. Cada vez que parece que tiene una oportunidad decente, Eiden fluye como el agua y se aparta de su camino sin esfuerzo, utilizando después el impulso del enano en su contra para hacerle perder el equilibrio.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch7_watch_call2
  - name: ch7_watch_call2
    texts:
      - source: scene_text
        paragraph: 498
        text: |-
          "Ese bastardo..." me susurra Daren. "Estaba conteniéndose la primera vez que peleamos. Diablos, ni siquiera estoy seguro de si se está tomando esto en serio ahora."

          Pasan unos minutos más, y la pelea todavía no parece ir a ninguna parte. Al menos los dos combatientes parecen estar disfrutando bastante.

          "¡Sois todos unos patéticos!" grita un mago que lleva túnicas rojas y tiene una mirada particularmente enloquecida. "¡Sois docenas y aun así tenéis miedo de enfrentaros a un solo stillwater? ¡No me digáis que de verdad planeáis ver la pelea hasta el final!"

          Eiden y Hadrik han detenido ahora su batalla y ambos miran al mago que acaba de hablar.

          "Cálmate, amigo mío," dice Azarius. "Ya nos dijo que no participa en el torneo. ¿Por qué deberíamos atacarle sin una buena razón?"

          "Eres un tonto por creerle, viejo. Un tonto y un cobarde. Si todos sois demasiado cobardes para atacarle, entonces lo haré yo mismo."

          Se gira hacia Eiden y levanta las manos en el aire.

          "Contempla, stillwater. Contempla el poder de Felran, ¡el elementalista de fuego más poderoso del Continente Oriental!"

          Mientras habla, se forma una enorme columna de fuego giratoria a su alrededor.
      - source: scene_text_2
        paragraph: 28
        text: |-
          "Veo que ya has aceptado tu destino. Ni siquiera intentas levantar una barrera mágica a tu alrededor. No te preocupes, haré que sea rápido. Aunque no puedo garantizarte que sea indoloro. ¡YAJAJAJAJAJAJAJAJA!"

          Su risa es tan enloquecida como la mirada en sus ojos. Eiden lo mira con calma, con los ojos cerrados, y levanta una ceja.

          "¡MUERE!" grita el mago, mientras envía todo el fuego hacia el stillwater en forma de rayo. Antes de que las llamas lo alcancen, Eiden extiende su brazo derecho frente a él, con la palma hacia el mago elementalista. Todo el fuego se detiene y se condensa en una pequeña esfera brillante, flotando frente a su mano. La esfera es entonces lanzada de vuelta hacia su dueño original, a una velocidad impactante, incinerando al elementalista en un instante. Las llamas desaparecen tan rápido como aparecieron, dejando solo un montón de cenizas donde antes se erguía el orgulloso mago.

          "¡Vaya! Desde luego no te andas con miramientos," le dice Hadrik al stillwater.

          "Él tampoco, y de poco le sirvió," dice Eiden.

          Luego me mira, con los ojos aún cerrados, y sonríe maliciosamente. Oh, no. Debe haberse dado cuenta de que también me teletransportó aquí junto con todos los demás. ¿Qué estará tramando esta vez?

          "¡Muy bien, continuemos entonces!" dice el enano, sonriendo.
      - source: scene_3
        paragraph: 3
        text: |-
          "Lo siento muchísimo, pero ha surgido algo y ya no tengo tiempo para terminar nuestro duelo. Sin embargo, ¡hay otro stillwater en este claro que estoy seguro de que estará más que encantado de ser tu próximo oponente!"

          Mientras me mira, sonriendo, todos los magos giran la cabeza y me notan por primera vez.
