  - name: ch7_daren_vs_kate
    texts:
      - source: scene_text
        paragraph: 468
        text: |-
          Kate conjura una plataforma de hielo debajo de ella, y la usa para elevarse en el aire, fuera del alcance de Daren.

          "¡Vuelve aquí y pelea limpio, maldita sea!", le grita Daren a Kate mientras ella sube más.

          Una vez que alcanza una altitud suficientemente alta, empieza a hacer llover espadas de hielo sobre Daren, mientras él se defiende con su escudo. Su barrera defensiva parece estar aguantando mucho mejor de lo que normalmente lo hace contra armas normales. Ninguna de las espadas de hielo de Kate logra atravesarla, aunque lo está atacando desde todas las direcciones.

          Daren ahora levanta su espada en el aire y la mueve en un movimiento circular constante. Mientras su espada se mueve, puedo ver el aire empezando a girar a su alrededor a gran velocidad. Una vez que deja de rotar su espada, hace un corte poderoso hacia Kate, generando una fuerte ráfaga de viento que la derriba de su plataforma de hielo.

          Logra conjurar rápidamente un tobogán improvisado de hielo debajo de ella e inmediatamente después de aterrizar en el suelo, se gira hacia Daren con las palmas apuntando hacia él. Un rayo de hielo sale disparado de sus manos y se dirige directamente hacia Daren, que ahora sostiene su espada frente a él. El rayo golpea su espada de lleno, pero en lugar de congelarse, el arma absorbe la energía del ataque y empieza a irradiar una aura mágica fría.
      - source: scene_text_2
        paragraph: 11
        text: |-
          Daren entonces hace un corte con su espada hacia Kate, lo que envía el rayo de hielo de vuelta hacia ella. Por los pelos logra esquivarlo e intenta contraatacar, pero Daren, que ya la había alcanzado, le hace un corte con su espada en el tobillo izquierdo, haciéndola caer sobre una rodilla. Intenta atacarlo con un rayo de nuevo, pero todo lo que logra hacer es apuntar con las palmas hacia él, mientras el hielo se niega a salir de sus manos. El bloque de hielo en el que me atrapó también empieza a derretirse lentamente.

          "No...", dice incrédula.

          "Me temo que eso ya no funcionará, Kate", dice Daren. "No podrás lanzar ningún tipo de magia durante los próximos treinta minutos. Ya te lo dije, me especializo en lidiar con elementalistas. Mi escudo me protege contra la mayoría de los ataques mágicos, mi arma puede absorber los elementos, y tengo una técnica de espada que puede cortar temporalmente tu conexión con el plano mágico. Nunca tuviste oportunidad desde el principio."

          Kate intenta levantarse, pero se da cuenta de que no puede esperar correr más rápido que Daren con su pierna herida. Derrotada, no dice ni una palabra más y baja la cabeza, mirando al suelo como lo haría una criminal condenada mientras espera su ejecución.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch7_promised
  - name: ch7_promised
    texts:
      - source: scene_text
        paragraph: 469
        text: |-
          "Vamos, Kate. No te pongas así. Deberías saber mejor que nadie que el ritual de purificación tiene casi ninguna posibilidad de fracasar. Una vez que nos ocupemos de la banshee dentro de ti, podremos seguir viajando juntos, como antes."

          Daren recita un encantamiento y prepara su espada, que empieza a brillar con una luz blanca intensa.

          "¡Daren, NO! ¡Lo prometiste!", le grito.

          Daren detiene su espada al escuchar mis palabras.

          "¡Prometiste que no intentarías purificarla hasta que la vieras convertirse en banshee!"

          Kate levanta la cabeza y me mira, con una mezcla de tristeza y arrepentimiento visible en sus ojos.

          "No puedo creerlo, Barry", me dice Daren. "Casi te mata hace un momento, ¿y todavía dices cosas así?"

          "No iba a matarme. Pero si tengo razón en que ella no es una banshee, entonces eras tú el que estaba a punto de matarla hace un momento. Por favor, dame unos minutos más con ella. Estoy seguro de que si hablamos las cosas todavía podemos arreglar esto."

          "¿Te has vuelto loco?"

          "¿Por qué? Tú mismo lo dijiste. No puede lanzar magia durante la próxima media hora, y no va a ir a ningún lado con esa herida en la pierna que le hiciste. No estaré en ningún peligro."
      - source: scene_text_2
        paragraph: 12
        text: |-
          Daren baja su espada y refunfuña, pero no encuentra una buena razón para no concederme mi petición.

          "Bien, puedes quedártela. Pero más vale que tenga una maldita buena razón para todo esto."

          Hace un gesto hacia Kate.

          "Bueno, ya escuchaste a Barry. Ve con él."

          Kate se levanta e intenta caminar hasta donde estoy, pero tropieza debido a su herida en la pierna. Me apresuro hacia ella para agarrarla antes de que caiga, y luego ambos nos adentramos más en el bosque. Mientras caminamos, Kate sostiene mi brazo izquierdo con las dos manos, para evitar caer de nuevo. No me dice ni una palabra mientras nos alejamos de Daren, pero me agarra el brazo con mucha fuerza, a pesar de que no ha tropezado ni una vez desde que empezamos a caminar.

          Una vez que hemos puesto suficiente distancia entre nosotros y Daren, ayudo a Kate a recostarse con la espalda contra un roble, y ella simplemente se queda mirando al suelo, todavía sin decir nada.
    choices:
      - position: 1
        text: Entonces, ¿vas a decirme por qué me pusiste un cuchillo en la garganta?
        effects:
