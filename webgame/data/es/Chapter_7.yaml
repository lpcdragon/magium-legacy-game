          "Bueno, no puedo decir que me entusiasme mucho, pero trato es trato. ¡Haz las maletas, Kate, voy a llevarte hasta tu amiga!"

          "Muchísimas gracias..." dice Kate. "Llevo mucho dinero conmigo, te prometo que haré que valga la pena."

