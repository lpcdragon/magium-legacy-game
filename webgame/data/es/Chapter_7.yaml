  - name: ch7_rush
    texts:
      - source: scene_text
        paragraph: 559
        text: |-
          "¿Por qué te lanzaste a defender a Kate antes en el claro?"

          "Bueno, había oído todo sobre el Faro a través de la amiga de Kate, y ella también me enseñó cómo diferenciar entre magos artificiales y banshees por la sensación de su aura mágica. ¡No podía quedarme de brazos cruzados y dejar que ocurriera una tragedia ante mis ojos por un desafortunado malentendido!"

          "¿Podrías decirme cómo conociste a Diane?" le pregunta Kate a Hadrik.

          "¿Diane?..." dice el enano, confundido. "¡Ah, es verdad, así se llamaba tu amiga!"

          "Nos conocimos por casualidad esta tarde, mientras buscaba un oponente poderoso contra quien pelear. La confundí con una banshee, y me entusiasmó la idea de tener un combate uno contra uno con una rival tan fuerte. Desafortunadamente para mí, resultó ser un poco demasiado poderosa, y me neutralizó con un solo hechizo. Sus amigos de las túnicas azules le ordenaron que acabara conmigo, pero ella se negó a hacerlo. Al final dejaron de intentar razonar con ella y le dijeron que simplemente se asegurara de que no me interpusiera en su camino."

          "¿Mi amiga... desafió a los ancianos?" pregunta Kate, sorprendida.

          "¡Así es!" dice Hadrik. "Cuando me di cuenta de que realmente hablaba en serio sobre perdonarme la vida, le pregunté si de verdad era una banshee, y fue entonces cuando me contó todo sobre el Faro de Esperanza, y sobre los magos artificiales."

          "¿Podrías contarnos por qué te gusta tanto pelear?" le pregunta Rose.
      - source: scene_text_2
        paragraph: 72
        text: |-
          "¿Por qué un pájaro bate sus alas?" dice Hadrik. "¿Por qué una culebra se arrastra por el suelo? ¡Disfruto peleando porque lo llevo en la sangre! Mi padre fue un guerrero, y su padre antes que él, y lo mismo para todos los miembros de mi clan."

          "Mahad selak..." le digo a Hadrik.

          "¡Mahad maktar!" me responde él, sin pensarlo.

          Hadrik entonces se da cuenta de la trampa que le he tendido y empieza a reír a carcajadas.

          "¡Me pillaste, Barry!" dice. "Bien jugado."

          "Lo siento, no entiendo..." dice Rose.

          "Gloria en la vida, gloria en la muerte," le traduzco. "Muchos de los gigantes del Continente Norte viven y mueren por este credo, y algunos de los clanes incluso lo usan como saludo entre miembros. Lo leí una vez en un libro que describía las razas y la cultura del Continente Norte."

          "Pero, ¿por qué un enano como Hadrik conocería este credo?" pregunta Rose, todavía confundida.

          "Es porque en realidad no es un enano. Es un gigante usando cambio de forma."
