  - name: ch7_wrong_leave
    routes:
      - condition: ch7_help_kate = 0
        texts:
          - source: scene_text
            paragraph: 533
            text: |-
              "Te equivocas, ¡no estamos con ella!"

              Al oír mis palabras, Kate se gira para mirarme. Tiene una expresión muy triste en los ojos, pero no dice nada, y rápidamente aparta la cabeza.

              "¡Eso no es algo muy bonito que decir sobre tu amiga!" dice Azarius. "Especialmente después de que ella intentara cubriros para manteneros a salvo."

              Se gira hacia Kate.

              "Jovencita, ¿está usted bien?"

              "¿Joven... cita?" pregunta Kate, con aspecto de tener dificultades para comprender sus palabras.

              Antes de que puedan terminar su conversación, un mago vestido con túnicas negras y con un tatuaje de culebra en su cabeza calva los interrumpe haciendo un fuerte sonido de chasquido con la lengua.

              "Esto no puede ser, Sabio del Oeste," dice. "Esto simplemente no puede ser."

              Azarius se gira hacia él, sonriendo con calma.

              "¿Un seguidor del Dios de la Muerte nos honra con su presencia?" dice. "Si hice algo que te ofendiera, ¡por favor, expón tu queja!"
          - source: scene_text_2
            paragraph: 52
            text: |-
              "Mi queja es simple, sabio. Mi dios requiere más sacrificios este día, y tú lo has privado de ellos al interrumpir esta pelea."

              "¿Oh? Pero estaba bastante seguro de que a pesar de su título, Ulruk, el Dios de la Muerte, solo se dedica a la nigromancia y no gobierna realmente el reino de los muertos. ¿Por qué ha empezado de repente a interesarse por los asuntos de personas que aún están vivas? Si simplemente buscas cadáveres frescos, te aseguro que hay muchos por estos alrededores después de los eventos de ayer."

              "No cuestiones el juicio del gran Ulruk, hereje. Tus acciones han enfurecido a mi dios, ¡y ahora sentirás su ira!"

              Un mago que lleva un diadema de plata en la cabeza y túnicas verdes agarra al nigromante por el brazo.

              "Cálmate, Zack," dice. "Queda mucho tiempo hasta el final del día. Podemos simplemente matar a más gente después de que salgamos de aquí y el número de muertes será el mismo."

              "¡Suéltame, idiota! Solo viajo contigo porque mi dios me lo ordenó. ¡No te atrevas a decirme lo que tengo que hacer! Este asunto no tiene nada que ver contigo ni con tu Dios del Destino."
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: ch7_god_of_death
      - condition: ch7_help_kate = 1
