            paragraph: 501
            text: |-
              "Muy bien, vámonos."

              Los tres empezamos a alejarnos del claro. Kate lleva la capucha puesta y se cubre con su capa verde para ocultar el hecho de que es una mujer, moviéndose con mucha cautela para evitar atraer atención hacia sí misma. Mientras nos abrimos paso entre la multitud, la mayoría de la gente simplemente nos ignora mientras intentan llegar al centro para ver mejor la pelea. ¡A este ritmo, saldremos de aquí en un santiamén!

              "¡Eh, mira por dónde vas, canijo!"

              Miro detrás de mí para ver de qué va el alboroto. Un hombre muy grande, al menos una cabeza más alto que Daren, mira furiosamente hacia Kate, que parece haberse chocado con él por accidente. Intenta pasar silenciosamente junto a él, pero el hombre la agarra por la capa y la levanta en el aire.

              "No te atrevas a ignorarme, hijo de..."

              Cuando la capucha cae de la cabeza de Kate y su rostro queda al descubierto, el gran mago se paraliza de miedo durante unos segundos. Entonces la suelta inmediatamente, retrocede un metro y empieza a gritar a pleno pulmón.

              "¡Aaaaah! ¡Aléjate de mí, monstruo! ¡Aléjate!"

              Toda la atención se ha dirigido ahora hacia nosotros. Incluso Eiden y Hadrik han detenido su pelea para mirar en nuestra dirección.
          - source: scene_text_2
            paragraph: 31
            text: |-
              "Otra vez no," dice Daren, exasperado.

              "¿Por qué gritas tan fuerte, imbécil?" pregunta un mago que lleva túnicas rojas y tiene una mirada particularmente enloquecida. "Solo es una banshee. Somos docenas aquí. No tiene ninguna oportunidad."

              "No es solo una banshee," dice otro mago. "Tiene aliados. La vi hablar con esos dos de ahí hace unos segundos."

              "¿Qué clase de banshee se alía con magos, idiotas?" les grita Kate, con una mirada muy decidida en su rostro. "No me insultéis. He venido aquí sola. Y voy a acabar con todos vosotros yo sola también."

              Por un momento, sus palabras me confundieron, pero entonces me di cuenta de que debía estar intentando protegernos. Cuando intento acercarme a Kate, Daren me detiene.

              "Eh, eh, no nos precipitemos," me susurra. "¿Por qué deberíamos arriesgar nuestras vidas solo porque ella se niega a purificarse? No podemos seguir así para siempre."

              "¿Cómo puedes decir algo así? ¿No es nuestra amiga?"

              "No lo sé, ¿lo es? Cuando volviste de tu pequeña reunión en el bosque hace unos minutos tenías un moratón en el cuello que no estaba ahí antes de que te fueras. Eso fue cosa de Kate, ¿verdad? Intentaste ocultármelo por alguna razón, pero deberías saber tan bien como yo que ella nos causa más problemas de los que vale."
