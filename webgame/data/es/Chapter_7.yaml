      - source: scene_text
        paragraph: 484
        text: |-
          "No voy a decirle nada. Daren no sabe que me atacaste, ¿recuerdas?"

          Kate parece como si le hubieran quitado un peso de encima.

          "Gracias", dice, simplemente, y caminamos el resto del camino en silencio.

          Al volver, vemos a Daren y Rose con sus mochilas listas, esperándonos impacientemente.

          "Por fin", dice Daren. "Espero que hayáis dicho todo lo que necesitabais, porque no vamos a hacer más descansos. ¡Vamos!"

          Los cuatro reanudamos nuestro viaje, pero no pasa mucho tiempo antes de que seamos interrumpidos de nuevo, esta vez por un violento temblor de tierra.
