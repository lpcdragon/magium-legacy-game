  - name: ch7_trap
    texts:
      - source: scene_text
        paragraph: 492
        text: |-
          Parece que no fuimos los únicos teletransportados aquí de repente. Reconozco a uno de los magos como el gigante que nos desafió. Es sorprendentemente más bajo de lo que esperaba. No creo que tenga mucho más de metro veinte. Eso explica por qué lo llaman 'el enano'. A juzgar por la posición de un árbol muy alto que había elegido como punto de referencia cuando salimos, diría que nos han teletransportado justo al centro del claro donde Hadrik hizo su primera aparición hace unos momentos. ¿Es obra del enano?

          "¡Buenas tardes, caballeros!", escuchamos una voz proveniente de arriba.

          Todos miramos hacia arriba al mismo tiempo y vemos a un pequeño mocoso flotando casualmente en el aire con las manos en los bolsillos y los ojos cerrados. Eiden. Por supuesto que tenía que ser Eiden.

          "Siento profundamente interrumpirlos a todos de sus actividades diarias, pero pensé que esta sería una espléndida oportunidad para que todos los participantes del torneo que estaban en la zona se conocieran mejor."

          Luego levanta las cejas y empieza a mirar a su alrededor, todavía con los ojos cerrados.

          "Huh...", dice. "Sinceramente, esperaba que esto fuera algún tipo de trampa, o al menos una emboscada bien planeada, pero parece que me equivoqué. Qué decepcionante."

          "Barry", me susurra Daren mientras Eiden habla. "Saca tu transceptor y dile a Rose dónde estamos. Dile que venga hacia nosotros, y la encontraremos a medio camino, en cuanto logremos salir de aquí."
    choices:
      - position: 1
        text: Rose puede esperar hasta que estemos fuera de aquí sanos y salvos.
        effects:
          - set:
              current_scene: ch7_wait
              ch7_call_rose: 0
      - position: 2
        text: De acuerdo, ya me encargo.
        effects:
          - set:
              current_scene: ch7_okay
              ch7_call_rose: 1
  - name: ch7_wait
    texts:
      - source: scene_text
        paragraph: 494
        text: |-
          "Rose puede esperar hasta que estemos fuera de aquí sanos y salvos. No quiero llamar la atención sobre nosotros."

          Daren no parece estar muy de acuerdo conmigo, pero tampoco quiere empezar una discusión, así que asiente lentamente.

          "¿Y quién podrías ser tú, joven Stillwater?", le llama un viejo mago a Eiden.

          Al observar más detenidamente al mago que acaba de hablar, de repente me doy cuenta de que lo conozco muy bien. Es imposible vivir en el Continente Occidental y no haber visto su cara al menos una vez en tu vida. Su retrato aparece casi todos los meses en los periódicos, después de todo. El hombre que está frente a mí no es otro que el legendario Azarius, el Sabio del Oeste.

          Hay muchos magos fuertes en el mundo, pero solo cuatro de ellos son oficialmente reconocidos como la élite entre las élites. Los llaman los cuatro sabios, y cada uno de ellos representa uno de los cuatro continentes principales del mundo. El título de sabio se gana o se mantiene a través de concursos anuales que organizan las naciones líderes de cada continente. Dado que cada uno de los cuatro continentes principales lleva el nombre del punto cardinal que representa su posición en el mapa del mundo, cada título de sabio también lleva el punto cardinal apropiado en su nombre.

          El Sabio del Oeste tiene exactamente el aspecto que he visto en las fotos. Un hombre viejo, de casi ochenta años, con una larga barba blanca como la nieve, sosteniendo un largo bastón de madera en la mano derecha, y vistiendo túnicas tradicionales, así como un sombrero puntiagudo. Es como un ejemplo viviente de lo que la mayoría de la gente imaginaría al pensar en un mago.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch7_wait2
  - name: ch7_okay
    texts:
      - source: scene_text
        paragraph: 493
        text: |-
          "De acuerdo, ya me encargo", le digo mientras saco mi transceptor.

          Noto que el volumen estaba al máximo. Menos mal que lo vi antes de que Rose intentara contactarnos por su cuenta. Bajo el volumen al mínimo y pongo el transceptor cerca de mi oído para escuchar bien, luego toco el dispositivo suavemente con la otra mano.

          "Rose, ¿me escuchas?", susurro a través del transceptor.

          No hay respuesta.

          "Rose, tienes que tocar el dispositivo una vez para que yo pueda escuchar lo que dices."

          "¿Barry? Barry, ¿dónde estás? ¿Qué pasó?"

          "Rose, escúchame con atención, no puedo hablar mucho. Nos teletransportaron a donde apareció el gigante hace un minuto. ¿Recuerdas dónde era? ¿Puedes venir hacia nosotros?"

          "Sí, sé dónde es. Estaré ahí enseguida. ¡Ten cuidado!"
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch7_okay2
  - name: ch7_wait2
    texts:
      - source: scene_text
        paragraph: 496
        text: |-
          Eiden parece confundido, y gira rápidamente la cabeza a izquierda y derecha como si se estuviera asegurando de que no hay otro Stillwater flotando a su lado.

          "¿Se refiere acaso a mí?", le dice al sabio. "Estoy bastante seguro de que soy considerablemente más viejo que usted, Sabio del Oeste."

          El enano llamado Hadrik suelta una carcajada repentina, captando la atención de todos.

          "¡Jajajajajajaja! Cuando llamé a todos antes, esperaba unos cuantos retadores fuertes, ¡pero nunca me atreví a soñar que un Stillwater aparecería de verdad! ¿Qué me dices entonces? ¿Te apuntas a una breve sesión de entrenamiento para calentar antes del torneo?"

          "En realidad, no participo en el torneo", dice Eiden, sonriendo. "Sin embargo, sería una falta de respeto por mi parte rechazar tu desafío, después de haberme teletransportado hasta aquí."

          Hace una pausa.
      - source: scene_text_2
        paragraph: 26
        text: |-
          "¡Muy bien, entonces! Una sesión de entrenamiento será. Pero no querría simplemente aplastarte con un chasquido de mis dedos. Eso sería demasiado aburrido. ¿Qué tal si ambos acordamos no usar magia durante la duración de nuestra batalla?"

          "¡JA! Me gusta tu estilo, Stillwater. ¡Estamos de acuerdo, entonces! ¡Nada de magia hasta el final de la batalla! ¡La pelea termina cuando uno de nosotros ya no pueda pelear, o cuando uno de nosotros se rinda!"

          El Stillwater sonríe de nuevo, y empieza a descender lentamente hacia el enano. Cuando aterriza en el suelo, hay un fuerte murmullo proveniente de los magos alrededor del claro, y todos se apartan para darles a los dos combatientes el espacio que necesitan para empezar su pelea. El Sabio del Oeste observa a los dos intensamente, con las cejas fruncidas.

          "¡Esta es nuestra oportunidad!", me dice Daren. "Salgamos de aquí mientras todos están viendo la pelea."
