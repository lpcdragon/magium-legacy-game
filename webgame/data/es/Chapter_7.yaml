  - name: ch7_go_not_call
    texts:
      - source: scene_text
        paragraph: 500
        text: |-
          "Muy bien, vámonos."

          Los tres empezamos a alejarnos del claro. Kate lleva la capucha puesta y se cubre con su capa verde para ocultar el hecho de que es una mujer, moviéndose con mucha cautela para evitar atraer atención hacia sí misma. Sin embargo, antes de que demos siquiera cinco pasos, una voz muy fuerte proveniente de mi bolsillo izquierdo ahoga todos los demás ruidos del área.

          "¿Hola? ¿Hay alguien ahí? ¿Alguien puede oírme? ¿Hola?" grita Rose a través del transceptor.

          Mierda. Se me había olvidado por completo que el dispositivo estaba al máximo volumen. Esto es malo. Esto es muy malo. Todos y cada uno de los magos me están mirando ahora, incluso los dos que estaban a punto de empezar a pelear.

          Toco rápidamente el transceptor para hablar con Rose, pero antes de que pueda decir nada, es Eiden quien responde a su pregunta.

          "Sí, Rose. Todos podemos oírte," dice en voz alta.

          "¿Ese es... ese es Eiden?" pregunta Rose.
      - source: scene_text_2
        paragraph: 30
        text: |-
          "Rose, escúchame," digo mientras saco el transceptor de mi bolsillo. "Nos han teletransportado a todos adonde apareció el gigante hace un minuto. ¿Recuerdas dónde era? ¿Puedes venir hacia nosotros?"

          "Sí, lo recuerdo, pero..."

          "Lo siento, pero no tengo más tiempo para hablar. Te pondré al día cuando llegues. ¡Ten cuidado!"

          Apago el transceptor y miro a mi alrededor. Los magos siguen mirándome fijamente. Esto no va a terminar bien, ¿verdad?

          "Espera, espera, espera... Tienes que estar bromeando. ¿Otro stillwater?" dice uno de los magos.

          "No, este es solo un humano corriente," dice Azarius. "Se nota por la mirada en sus ojos."

          "¿De qué estás hablando?" pregunta Eiden, sonriendo. "Por supuesto que es un stillwater. ¿No lo visteis todos pelear contra ese dragón en el cielo él solo hace unas horas?"

          Hay un fuerte murmullo de nuevo, mientras muchos de los magos confirman haberme visto luchar contra el dragón. Si quiero hacerme pasar por uno en este torneo, nunca habrá una oportunidad mejor que esta.
    choices:
      - position: 1
        text: Intentar convencerles de que soy un stillwater
        effects:
          - set:
              current_scene: ch7_convince
      - position: 2
        text: Decirles que en realidad no soy un stillwater
