  - name: ch7_smoke
    texts:
      - source: scene_text
        paragraph: 537
        text: |-
          "¿Ilusión? ¿No querrás decir bomba de humo?"

          "No, no, me refería a lo que pasó después del humo. Los dos magos que visteis correr hacia el bosque eran en realidad señuelos. Los magos de verdad esperaron invisibles a que todos se fueran y luego se teletransportaron. Supuse que habían aprendido la lección, así que los dejé ir con una severa advertencia por ahora."

          "¡Barry! ¡Kate! ¡Daren!" oímos gritar a Rose desde el otro extremo del claro. "Gracias a los dioses que estáis bien..."

          Mientras se acerca a nosotros, se detiene para recuperar el aliento. Debe haber venido corriendo todo el camino hasta aquí.

          "¿Qué ha pasado?" nos pregunta. "¿Cómo habéis acabado todos en este lugar?"

          "Fue Eiden," dice Daren. "Nos teletransportó aquí junto con otros cincuenta magos, probablemente con la esperanza de vernos matarnos entre nosotros, pero al final se aburrió y se teletransportó. La mayoría de los demás magos abandonaron el claro a toda prisa hace unos segundos, persiguiendo a un nigromante que intentó matarnos a todos pero fracasó miserablemente."
      - source: scene_text_2
        paragraph: 56
        text: |-
          "Ya veo..." dice Rose.

          Se gira hacia Hadrik y se acerca a él, ofreciéndole un apretón de manos.

          "¡Tú debes de ser el gigante que usaba cambio de forma antes! ¡Encantada de conocerte! Me llamo Rose. ¿Conseguiste encontrar al retador que buscabas?"

          "Sí, muchacha," dice Hadrik, sonriendo, mientras le agarra la mano y se la estrecha. "¡Creo que sí!"

          ¿Acaba de echarme un vistazo rápido cuando dijo eso? Oh, dioses, espero que no. Quizás fue solo mi imaginación.

          "¡Me alegra oír eso!" dice Rose, sonriendo.

          Luego se gira hacia Azarius.

          "Perdona, ¿te conozco de algún sitio?" le pregunta. "Me resultas muy familiar."

          "No creo que nos hayamos visto antes, pero mi retrato aparece en los periódicos de vez en cuando, así que puede que me conozcas de ahí. Mi nombre es Azarius. ¡Encantado de conocerte!"
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: ch7_woman_mage
