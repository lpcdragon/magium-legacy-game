            paragraph: 24
            text: |-
              "¿Cómo es tu ciudad?" digo. "¿Qué pasa con Billy Bob?"

              "Biliborrathrathsarran ya ha sido eliminado", dice el Supervisor. "Uno de los protocolos que le pedí al doctor Reidzek que eliminara fue el que me prohibía matar a la persona que me activó. Tan pronto como pude matarlo, envié algunos de mis drones a su ubicación y lo asesinaron sin ningún problema".

              "Maldita sea, no pierdes el tiempo, ¿verdad?" digo. "Entonces, ¿qué planeas hacer exactamente con nosotros?"

              "Tu destino aún no se ha decidido", dice el Supervisor. "El protocolo Supervisor deberá realizar un análisis dependiendo de cuáles serán sus próximos objetivos dentro de esta ciudad. Ahora, ¿hay algo más en lo que pueda ayudarle?"
            condition: is_dead = 0 AND b3_ch4_billy = 0
          - source: scene_3
            paragraph: 25
            text: |-
              "Uhm, no, no, creo que ya has dejado las cosas bastante claras", digo. "Entonces, ahora que has obtenido el control de la ciudad y todo... ¿qué planeas hacer con nosotros, exactamente?"

              "Tu destino aún no se ha decidido", dice el Supervisor. "El protocolo Supervisor deberá realizar un análisis dependiendo de cuáles serán sus próximos objetivos dentro de esta ciudad. Ahora, ¿hay algo más en lo que pueda ayudarle?"
            condition: is_dead = 0 AND b3_ch4_billy <= 6 AND b3_ch4_billy != 0
          - source: scene_3
            paragraph: 26
            text: |-
              "¿Cómo es tu ciudad?" digo. "¿Qué pasa con Billy Bob? Y, de hecho, ¿cómo se mueven tus drones con tanta libertad? Pensé que tenías que ponerlos en 'modo de mantenimiento' para que los lessathi no pudieran desactivarte".

              "El rey de Ollendor cometió el error de colocar uno de mis drones cerca de la celda del doctor Reidzek", dice el Supervisor. "Pensó que Biliborrathrathsarran estaba perdiendo el control sobre mí y quería una segunda opinión sobre cómo obtener un mejor control sobre mí y mis drones. Así fue como hice el trato con el doctor Reidzek para liberarlo a cambio de desactivar el protocolo que me impedía matar a la persona que me activó primero. Tan pronto como pude matar a Biliborrathrathsarran, envié algunos de mis drones a su ubicación y lo asesinaron sin ningún problema".

              "Maldita sea, no pierdes el tiempo, ¿verdad?" digo. "Entonces, ¿por qué no nos estás atacando? ¿Pensé que habías dicho que nos querías muertos la última vez que te vimos?"

              "Parte del trato que hice con el doctor Reidzek fue permitirte un paso seguro a la base rebelde", dice el Supervisor. "Esa es la única razón por la que todavía estás vivo. Sin embargo, la próxima vez que te teletransportes fuera de tus túneles subterráneos, debes esperar que nuestras interacciones sean un poco menos placenteras".

              "Entendido", digo.

              "Ahora, ¿hay algo más en lo que pueda ayudarte?" dice el Supervisor.
            condition: is_dead = 0 AND b3_ch4_billy = 9
