  - name: b3_ch07a_line
    texts:
      - source: scene_text
        paragraph: 39
        text: |-
          "¡Si quieres matar al rey, será mejor que hagas cola! ¡Nosotros llegamos aquí primero!"

          "Bueno, de todos modos no es que pueda atacarlo directamente", dice Loyrang. "El hechizo del torneo todavía me impide lastimar a cualquiera de los lugareños, ¿recuerdas? Obviamente lo que quise decir es que te ayudaría a matarlo por mí".

          "¡Pagarás por esto, traidor!" dice el ilusionista. "Gontrok, ¿por qué estás ahí parado? ¡Mátalo inmediatamente!"

          "Loyrang, ¿por qué haces esto?" dice Gontrok. "¡Pensé que éramos un equipo! ¿Por qué querrías abandonar todo lo que hemos construido aquí? ¡El rey ya acordó nombrarme como el nuevo capitán de la guardia real! ¡Es solo cuestión de tiempo hasta que lo convenza de que todos los demás reinos están detrás de él, y entonces finalmente podremos darle un uso adecuado a todo este arsenal tecnológicamente avanzado! Con el rey de Ollendor como nuestro títere, conquistaremos todas las demás ciudades de Varathia y nos convertiremos en los gobernantes de este continente. ¿No es esto lo que tú también querías?"

          "¿El rey como tu marioneta?..." dice el ilusionista, desconcertado. "¿Olvidaste por completo que todavía estoy aquí o simplemente me estás ignorando en este momento?"
      - source: scene_text_2
        paragraph: 33
        text: |-
          "Fuiste tú quien ideó todos estos grandes planes, Gontrok, no yo", responde Loyrang a Gontrok, actuando como si el ilusionista nunca hubiera dicho nada. "Soy un mercenario. Sólo estoy en esto por el dinero. Unirme a la guardia real contigo parecía una buena idea en ese momento, pero últimamente ha sido un poco más problemático de lo que vale la pena. Es por eso que decidí ayer que ya era hora de reducir mis pérdidas y probar suerte en otra parte".

          "¿Así que ibas a irte así sin más?" —grita Gontrok. "¿Sin siquiera decirme una palabra?"

          "¿Y qué se suponía que debía decir, hmm?" pregunta Loyrang. "¿Habrías dejado la ciudad conmigo si te hubiera pedido que lo hicieras? Por supuesto que no lo harías. Ya has puesto demasiado esfuerzo en esta artimaña tuya como para siquiera considerar abandonar tus planes. No tenía sentido hablar contigo sobre eso, porque ya sabía lo que ibas a decir".

          "Entonces, ahora vas a hacer que maten al rey y arruinarás todas mis ambiciones sin pensarlo dos veces, ¿no es así?" Gontrok dice enojado.
      - source: scene_3
        paragraph: 14
        text: |-
          "Habla en serio, Gontrok", dice Loyrang. "Tus ridículos planes nunca habrían funcionado en un millón de años. ¿No ves que ni siquiera eres capaz de tener una conversación normal conmigo sin revelar todos tus planes secretos a uno de los aliados más confiables del rey? El rey obviamente ha sido consciente de tus ambiciones ocultas desde el principio. La única razón por la que te mantuvo cerca de él fue porque sospechaba que los organizadores habían manipulado el hechizo de protección de tal manera que funcionaría mal contra los ciudadanos de Ollendor, y quería tener a alguien poderoso que lo defendiera de los otros participantes del torneo por si acaso. No eres más que una herramienta útil para él. Te aseguro que planea deshacerse de ti un minuto después de que termine el torneo."

          "¡No puedes saber eso!" dice Gontrok.

          "¡Por supuesto que puedo!" dice Loyrang. "¡Conozco gente! No me cuesta mucho descubrir qué opinión tiene el rey de ti. Pude verlo todo en su rostro cada vez que habló contigo. El hombre no confía en ti ni un poco. Te ha estado guiando todo este tiempo. Ha estado usando tu propia codicia en tu contra para mantenerte a raya. Es por eso que te nombró el nuevo capitán. Él sabe exactamente lo que buscas y no tiene miedo de darte lo que quieres para evitar aumentar tus sospechas. Quiere que seas su perro leal hasta el momento en que ya no te necesite, momento en el cual te ejecutará sin pensarlo dos veces."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch07a_vibrating
  - name: b3_ch07a_join
    texts:
      - source: scene_text
        paragraph: 40
        text: |-
          "¡Qué coincidencia! ¡Nosotros también queremos matar al rey! ¿Por qué no unimos fuerzas?"

          "Bueno, sí, eso es más o menos lo que tenía en mente", dice Loyrang. "No puedo matar al rey yo mismo, porque el hechizo del torneo todavía me impide lastimar a cualquiera de los locales, pero eso no significa que no pueda ayudarte a ti y a tu grupo proporcionándote información crucial".

          "¡Pagarás por esto, traidor!" dice el ilusionista. "Gontrok, ¿por qué estás ahí parado? ¡Mátalo inmediatamente!"

          "Loyrang, ¿por qué haces esto?" dice Gontrok. "¡Pensé que éramos un equipo! ¿Por qué querrías abandonar todo lo que hemos construido aquí? ¡El rey ya acordó nombrarme como el nuevo capitán de la guardia real! ¡Es solo cuestión de tiempo hasta que lo convenza de que todos los demás reinos están detrás de él, y entonces finalmente podremos darle un uso adecuado a todo este arsenal tecnológicamente avanzado! Con el rey de Ollendor como nuestro títere, conquistaremos todas las demás ciudades de Varathia y nos convertiremos en los gobernantes de este continente. ¿No es esto lo que tú también querías?"

          "¿El rey como tu marioneta?..." dice el ilusionista, desconcertado. "¿Olvidaste por completo que todavía estoy aquí o simplemente me estás ignorando en este momento?"
      - source: scene_text_2
        paragraph: 33
        text: |-
          "Fuiste tú quien ideó todos estos grandes planes, Gontrok, no yo", responde Loyrang a Gontrok, actuando como si el ilusionista nunca hubiera dicho nada. "Soy un mercenario. Sólo estoy en esto por el dinero. Unirme a la guardia real contigo parecía una buena idea en ese momento, pero últimamente ha sido un poco más problemático de lo que vale la pena. Es por eso que decidí ayer que ya era hora de reducir mis pérdidas y probar suerte en otra parte".

          "¿Así que ibas a irte así sin más?" —grita Gontrok. "¿Sin siquiera decirme una palabra?"

          "¿Y qué se suponía que debía decir, hmm?" pregunta Loyrang. "¿Habrías dejado la ciudad conmigo si te hubiera pedido que lo hicieras? Por supuesto que no lo harías. Ya has puesto demasiado esfuerzo en esta artimaña tuya como para siquiera considerar abandonar tus planes. No tenía sentido hablar contigo sobre eso, porque ya sabía lo que ibas a decir".

          "Entonces, ahora vas a hacer que maten al rey y arruinarás todas mis ambiciones sin pensarlo dos veces, ¿no es así?" Gontrok dice enojado.
      - source: scene_3
        paragraph: 14
        text: |-
          "Habla en serio, Gontrok", dice Loyrang. "Tus ridículos planes nunca habrían funcionado en un millón de años. ¿No ves que ni siquiera eres capaz de tener una conversación normal conmigo sin revelar todos tus planes secretos a uno de los aliados más confiables del rey? El rey obviamente ha sido consciente de tus ambiciones ocultas desde el principio. La única razón por la que te mantuvo cerca de él fue porque sospechaba que los organizadores habían manipulado el hechizo de protección de tal manera que funcionaría mal contra los ciudadanos de Ollendor, y quería tener a alguien poderoso que lo defendiera de los otros participantes del torneo por si acaso. No eres más que una herramienta útil para él. Te aseguro que planea deshacerse de ti un minuto después de que termine el torneo."

          "¡No puedes saber eso!" dice Gontrok.

          "¡Por supuesto que puedo!" dice Loyrang. "¡Conozco gente! No me cuesta mucho descubrir qué opinión tiene el rey de ti. Pude verlo todo en su rostro cada vez que habló contigo. El hombre no confía en ti ni un poco. Te ha estado guiando todo este tiempo. Ha estado usando tu propia codicia en tu contra para mantenerte a raya. Es por eso que te nombró el nuevo capitán. Él sabe exactamente lo que buscas y no tiene miedo de darte lo que quieres para evitar aumentar tus sospechas. Quiere que seas su perro leal hasta el momento en que ya no te necesite, momento en el cual te ejecutará sin pensarlo dos veces."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch07a_vibrating
  - name: b3_ch07a_work
    texts:
