              Pasamos junto a todos los prisioneros, entramos en el túnel oculto y luego subimos otro tramo de escaleras hasta llegar a lo que parece ser una especie de taller que probablemente Billy Bob normalmente utiliza para trabajar en sus dispositivos.

              Tal como esperábamos, el rey todavía está dentro de la habitación y, hasta donde sabemos, parece ser el único aquí. Sus guardias no están a la vista.
