  - name: b3_ch07a_nullified
    texts:
      - source: scene_text
        paragraph: 57
        text: |-
          "No, creo que ya has explicado suficiente", dice Eiden. "Es hora de que coseches lo que has sembrado". 

          Unos segundos más tarde, comenzamos a escuchar los sonidos desesperados del rey tratando de respirar mientras probablemente está siendo estrangulado por una de las técnicas de manipulación del aura de Eiden.

          "No sirve de nada intentar llamar a tus guardias reales... o a lo que queda de ellos", dice Eiden. "He anulado temporalmente los efectos de tu dispositivo para que ya no pueda teletransportarlos. Estás solo".

          Después de unos momentos más de sonidos ahogados, escuchamos que el rey comienza a toser violentamente, lo que sugiere que Eiden podría haberlo soltado para escuchar lo que tiene que decir.

          "Tú..." dice el rey, mientras poco a poco va recuperando la voz. "Sólo por unas rocas azules... ¿harías algo como esto? ¡¿Cómo te atreves?!"
      - source: scene_text_2
        paragraph: 43
        text: |-
          "¿Sólo algunas rocas azules?...", dice Eiden. "Mi querido rey, ni siquiera puedes empezar a comprender qué efectos tendrán tus acciones de hoy en este continente y en todo el mundo que nos rodea. Que te estrangulen casi hasta la muerte es algo tan insignificante que simplemente palidece en comparación con las ramificaciones de los acontecimientos de hoy".

          "Los demás reyes tenían razón..." dice el rey de Ollendor. "¡Estás loco! ¡No puedes quedarte con vida! ¡Eres una amenaza demasiado grande para todos nosotros!"

          "Y sin embargo, ninguno de estos reyes ha tenido el descaro de decirme esto en la cara, a pesar de haber estado planeando mi asesinato en secreto durante los últimos veinte años...", dice Eiden. "Sin embargo, te felicitaré por ser el primero en decirme esto tan abiertamente. Quizás sea necesaria una pequeña recompensa para mostrarte cuánto aprecio tu sinceridad. Te dejaré ahora, pero debes esperar que tu recompensa llegue a esta misma habitación en los próximos minutos. Adiós, rey de Ollendor".

          Después de que Eiden se teletransporta, escuchamos al rey toser unas cuantas veces más y luego el transceptor queda en completo silencio.
    choices:
