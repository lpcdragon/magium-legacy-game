            paragraph: 21
            text: |-
              El gigante da unos pasos hacia Leila, como si estuviera a punto de atacarla en cualquier momento, pero después de unos segundos se da vuelta y corre hacia mí.

              Me aparto del camino justo a tiempo, pero él inmediatamente acorta la distancia entre nosotros nuevamente e intenta aplastarme la cabeza con su puño derecho.

              Afortunadamente, logro alejarme de él una vez más, pero incluso con mi estadística de velocidad al máximo, el gigante aún puede seguirme, lo que significa que todo lo que puedo hacer por ahora es seguir corriendo alrededor de la cueva, esquivando cada uno de sus ataques en el último segundo, mientras espero poder escapar de él.
