            paragraph: 63
            text: |-
              Apunto mi ballesta justo por encima de la rodilla izquierda del rey y aprieto el gatillo. Justo cuando hago esto, de repente me doy cuenta de que por alguna razón desconocida mi mente había sido completamente engañada al pensar que estaba apuntando a mi adversario, cuando en realidad estaba apuntando a mí mismo.

              Termino disparándome en el ojo, lo que me mata instantáneamente.
          - source: scene_3
            paragraph: 23
            text: |-
              "Pensé que habíamos acordado que convertiríamos a Breynan en rey y que tú gobernarías desde las sombras", digo. "¿Estás rompiendo tu palabra, por casualidad?"

              "El protocolo Supervisor no está diseñado para decir mentiras descaradas", dice el dron de ojos verdes. "Lo único que soy capaz de hacer es retener información crítica a propósito y engañar a la gente mediante la omisión de hechos importantes. Nuestro acuerdo sigue en pie. Mientras puedas conseguir que Breynan sea el rey, el protocolo Supervisor seguirá sus órdenes lo mejor que pueda".

              "Correcto", digo.

              "Ahora, ¿hay algo más en lo que pueda ayudarte?" dice el Supervisor.
            condition: is_dead = 0 AND b3_ch4_billy = 7
