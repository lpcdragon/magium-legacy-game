              "Entonces dame la versión realmente corta y veré si puedo resolverla por mi cuenta", digo. "Si no, podemos irnos".

              "Bien", escribe Leila. "Pero va a ser una explicación MUY breve. Ven aquí".

              Me acerco a Leila y le pongo ambas manos en las sienes, mientras ella me dice a través de su escritura exactamente a qué tipos de fluctuaciones del aura debo prestar atención.
          - source: scene_text_2
            paragraph: 8
            text: |-
              Después de unos veinte segundos, empiezo a comprender finalmente cómo los movimientos de mis manos influyen en los cambios muy sutiles en el aura de Leila, y esto me ayuda a identificar mejor la fuente de su dolor de cabeza. A pesar de las instrucciones apresuradas e incompletas de Leila, logro improvisar una técnica que se acerca bastante a la que ella usó conmigo, y puedo ver cómo la expresión tensa que tenía en su rostro poco a poco se convierte en una mucho más relajada.

              "El dolor... ¡se va!" Leila escribe asombrada mientras todavía le estoy masajeando las sienes. "¡No pensé que pudieras aprender a hacer esto tan rápido! Me tomó horas de práctica lograr hacerlo bien cuando mi padre me enseñó la técnica por primera vez".

              "Probablemente sea más fácil para mí debido a mi Sentido mágico mejorado", digo. "Mientras puedas notar adecuadamente cada cambio menor en el aura, es más fácil improvisar la técnica. Dime cuando el dolor haya desaparecido por completo, así sabré cuándo parar".

              "Creo que ahora estoy bien", escribe Leila. "Aún quedan algunas náuseas, como en tu caso, pero eso no se soluciona con un masaje. Habrá que esperar a que pase solo. Vamos a seguir."

              "Está bien", digo, mientras quito mis manos de la cabeza de Leila. "Sígueme. Estoy bastante seguro de recordar hacia dónde fuimos la última vez".
          - source: scene_3
            paragraph: 3
            text: |-
              "Entonces... ¿qué crees que les pasó a todos en la base rebelde?" Leila me escribe, mientras caminamos por los túneles. "No supondrás que ninguno de ellos quedó enterrado bajo los escombros de todas esas explosiones, ¿verdad?..."

              "No sé los rebeldes ni los civiles, pero todos en nuestro grupo han pasado por cosas mucho peores que algunos derrumbes", digo. "No me preocuparía que quedaran enterrados bajo los escombros, pero claro, esas explosiones son probablemente la menor de sus preocupaciones en este momento. Si lo que dijo Peter fuera cierto, el rey de Ollendor ha enviado un pequeño ejército para atacar a la gente en el subsuelo, y lo que queda de la guardia real también estará allí, incluidos los aprendices. Va a ser una pelea dura para ellos, se mire como se mire".

              "¿Puedes intentar llamarlos a través del transceptor?" Escribe Leila. "Tal vez tengamos suerte y puedas comunicarte con ellos".

              "Las paredes que nos rodean están llenas de seredium, así que no me haría ilusiones, pero puedo intentarlo, claro", digo.

              Luego saco mi transceptor, configuro la frecuencia en el número de Daren y lo presiono una vez.
