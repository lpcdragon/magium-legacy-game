  - name: b3_ch07a_wreaking
    texts:
      - source: scene_text
        paragraph: 71
        text: |-
          Sin pensarlo dos veces, agarro la mano de Leila y luego ambos comenzamos a girar en el aire, mientras el viento intenta separarnos.

          "¡No te atrevas a soltarte!" Leila dice con la boca cerrada.

          "¡No lo haré!" Digo, y ambos damos vueltas por un rato más, mientras nuestras almas en el plano etéreo también se aferran la una a la otra.

          "¿Qué demonios?" escuchamos la voz de Daren desde algún lugar debajo de nosotros, mientras ahora entra a la habitación por la puerta secreta, junto con Hadrik, Kate, Flower, Illuna, Melindra y Arraka.

          "¿Lo que está sucediendo?" Kate nos grita, tratando de hacer que su voz sea más fuerte que el sonido del viento y las vibraciones del cristal. "¿Cómo podemos ayudar?"

          "¡Es el cristal!" Digo en voz alta mientras Leila y yo seguimos girando juntas en el aire como una hélice lenta. "El cristal azul dentro del dron se ha despertado y dice que está buscando a Arraka. Creo que está conectado de alguna manera con el Magium. ¡El cristal dijo que Arraka había amenazado la estructura misma de toda existencia y que necesita ser eliminada!"
      - source: scene_text_2
        paragraph: 50
        text: |-
          "¡¿Qué hiciste esta vez?!" Illuna le grita a Arraka, mientras toma su amuleto en su mano.

          "¡No fui yo!" Dice Arraka, con voz ligeramente asustada. "¡Debe haber sido la otra Arraka! ¡La de las pruebas del Dios del Tiempo! Probablemente esté causando estragos en todos los universos paralelos, tratando de encontrar una manera de regresar al plano mágico. ¡Al menos sé que eso es lo que habría hecho si estuviera en su lugar!"

          "Entonces, ¿estás planeando poner fin a esto, o vas a seguir dando vueltas con tus pulgares incorpóreos mientras todo este mundo cae en el olvido?" Illuna dice en voz alta.

          "Sí, sí, dame un minuto..." dice Arraka, y luego vemos al dron de ojos verdes reaccionando ante ella y acercándose al amuleto.

          Cuando el dron la alcanza, comienza a brillar con una luz azul brillante y luego, sin previo aviso, la vibración del cristal en su interior se detiene y la habitación vuelve a la normalidad por completo, como si nada hubiera pasado en primer lugar.
      - source: scene_3
        paragraph: 28
        text: |-
          Sin tener ningún recuerdo de nuestra caída, Leila y yo nos encontramos tirados boca abajo en el suelo, con las manos todavía agarradas para salvar la vida. Cuando nos damos cuenta de que el peligro ha pasado, los dos nos soltamos y nos levantamos del suelo confundidos, tratando de entender cómo todo lo que hay en la habitación puede seguir intacto incluso después de todo lo sucedido.

          "... ¿Cómo conseguiste que el Magium nos dejara en paz tan rápido?" Illuna le pregunta a Arraka, mientras ahora suelta su amuleto.

          "Le mostré al cristal mis recuerdos de lo que pasó con el otro Arraka durante el ritual de Selkram y le di las coordenadas de su universo", dice Arraka. "A juzgar por lo rápido que todo volvió a la normalidad, diría que mi intuición era correcta, y ella era de hecho la que el Magium estaba buscando. Estoy seguro de que esa copia mía de segunda categoría tendrá el mejor momento de su vida muy pronto. ¡Aha-Ahahahahaha!"
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch07a_ending
  - name: b3_ch07a_ending
    texts:
      - source: scene_text
        paragraph: 72
        text: |-
          "Deberías considerarte afortunado de que Magium no recordara tus travesuras en su reino y decidiera acabar con este universo también, sólo para estar seguro", dice Illuna.

          "Te das cuenta de que esto no era el Magium en sí, ¿verdad?", dice Arraka. "Era solo una fracción de su voluntad, manifestada a través del cristal, que probablemente se despertó debido a la destrucción de las cavernas llenas de cristales de la base rebelde. Probablemente ni siquiera sabía quién era yo o qué hice en el reino de Magium. La única razón por la que reaccionó ante estos dos perdedores en primer lugar fue porque lo más probable es que pudiera sentir por sus auras que habían estado en contacto con el Arraka del ritual de Selkram, por lo que debe haber asumido que ella estaba escondida en algún lugar de este mundo. De todos modos, el peligro ya no existe, así que puedes relajarte.

          "No estoy exactamente seguro de cómo puedes decirnos que nos relajemos cuando sólo una fracción del Magium casi acaba con nuestro mundo entero, pero supongo que al menos podemos estar de acuerdo en que deberíamos estar a salvo por ahora", dice Illuna.

          "Esto... no es algo que haya calculado", dice de la nada el dron de ojos verdes del Supervisor, esta vez en su tono de voz normal. "Necesitaré algo de tiempo para analizar lo que ha sucedido. Mientras tanto, me gustaría pedirles que abandonen esta torre. Continuaremos nuestra discusión anterior en una fecha posterior".

          "¡Sólo un momento!" Dice Melindra, mientras se acerca al cadáver del rey y luego le quita uno de los anillos de los dedos. "¡Muy bien, ahora podemos irnos!"
      - source: scene_text_2
        paragraph: 51
        text: |-
          "Oh, entonces, después de todo, era uno de los anillos", le digo a Melindra. "He estado revisando sus bolsillos, pero no estaba exactamente seguro de cuál de los artículos necesitabas".

          "Me di cuenta", dice Melindra. "Y aprecio la consideración".

          "Está bien, bueno... ciertamente tengo muchas preguntas que hacer, pero probablemente deberíamos hablar más una vez que estemos de regreso en la base rebelde", dice Daren. "Muchas personas resultaron heridas durante el colapso de las cuevas y necesitan toda la ayuda médica que puedan obtener. Albert debería estar listo para teletransportarnos en cualquier momento. Como habrás adivinado, Barry Nubarrón ya no nos teletransportará más, ya que actualmente está bajo custodia de los hombres del rey del subsuelo. ¿Estás listo para irte?"

          "¡No hay necesidad de ser tan severo, Daren!" Melindra dice. "¿Ya olvidaste que casi corriste solo a las cuevas debajo de esta torre cuando escuchaste de Albert que Barry fue teletransportado aquí y Gontrok fue tras él? ¡Todavía tenemos un poco de tiempo! ¿Por qué no haces lo que realmente viniste a hacer aquí y le das un gran abrazo a tu buen amigo Barry?"
      - source: scene_3
        paragraph: 29
        text: |-
          "Está bien, antes que nada, cállate", le dice Daren a Melindra. "Y en segundo lugar, si nadie más tiene nada que decir, me gustaría llamar a Albert al transceptor ahora".

          "En realidad, sólo tengo una breve pregunta antes de irnos", digo. "Daren, ¿recuerdas cuántos dedos tenía Gontrok en su mano izquierda?"

          "Por supuesto", dice Daren. "Tenía tres dedos. ¿Por qué lo preguntas?"

          "Oh, sólo quería confirmar algo", digo, mientras Leila y yo intercambiamos una mirada rápida. "No te preocupes por eso. Puedes llamar a Albert ahora".

          "Muy bien, entonces", dice Daren, mientras saca su transceptor y le da a Albert la señal para teletransportarse.

          "¿Me estoy volviendo loco aquí?" El doctor Reidzek le pregunta a Leila en voz baja, mientras todos nos acercamos, para poder teletransportarnos. "¿No tenía Gontrok cinco dedos en cada una de sus manos?"

          "Lo... explicaremos más tarde", le escribe Leila, y luego una luz blanca nos envuelve a todos, mientras todos somos teletransportados fuera de la torre y de regreso a los túneles subterráneos de la base rebelde.
