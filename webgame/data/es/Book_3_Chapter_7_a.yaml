          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch07a_intro3
      - condition: b3_ch7_force = 2
        texts:
          - source: scene_text
            paragraph: 3
            text: |-
              "¡Irse!" Le digo a la fuerza misteriosa. "¡Tu cara es fea y no le gustas a nadie!"

              La fuerza ahora ha dejado de sacudirme, pero lo que está haciendo es tirar de mi cara por ambos lados, por las mejillas, haciéndome sentir como si mi boca fuera a partirse por la mitad.

              "¡Oye, ya basta!" Digo, mientras lucho por pronunciar las palabras correctamente mientras mi boca se abre de par en par. "Sólo porque eres feo, no significa que tengas que desquitarte conmigo por decirte lo--"

              Dejo de hablar de repente, porque tan pronto como abro los ojos me doy cuenta de que la persona frente a mí no era otra que Leila, quien en ese momento me miraba con el ceño fruncido mientras sostenía mis mejillas con ambas manos.

              "Oh..." le digo, mientras lentamente descubro lo que está pasando.

              "¿Estás despierto ahora, o debería seguir poniéndote estos por un tiempo más, por si acaso?" Escribe Leila, mientras levanta una ceja.

              "No, estoy uh... estoy despierta..." digo, mientras Leila me libera. "Ejem... Perdón por lo que dije antes. Todavía estaba un poco confundido, y--"
