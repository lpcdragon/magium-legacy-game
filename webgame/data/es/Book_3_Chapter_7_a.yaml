            paragraph: 24
            text: |-
              Continúo evitando los ataques de Gontrok hasta que Leila lo flanquea nuevamente desde un costado, y luego, en los pocos segundos durante los cuales no me presta atención, uno los dedos de mi mano derecha y los uso para golpear algunos puntos de presión en la parte posterior de su cuello. Mientras hago esto, también presto mucha atención al flujo de su aura, para poder ver si lo que estoy haciendo está funcionando o no.

              Sinceramente, es bastante difícil improvisar una técnica con la que no estoy muy familiarizado, pero al menos pude practicar un poco cuando la usé con Leila antes, así que no me quedaré completamente ciego aquí. En el muy poco tiempo que tengo a mi disposición, logro interrumpir parte del flujo normal del aura de Gontrok, pero no consigo terminar lo que estaba a punto de hacer antes de que él se dé vuelta, tratando de darme un codazo en la cara, y así obligarme a retirarme una vez más.

              "¿Qué diablos estabas tratando de hacer ahora? ¿Pincharme en el cuello?" Me pregunta Gontrok, mientras se masajea incómodamente la nuca con la mano. "Será mejor que tomes esta pelea en serio si no quieres terminar aplastado en esa pared".

              "¿No deberías decir cosas así después de haber logrado golpearme al menos una vez?..." le pregunto a Gontrok. "No quiero ser grosero ni nada por el estilo, pero tus amenazas se sienten un poco vacías en este momento".
            condition: b3_ch7_massage = 2
          - source: scene_text_2
            paragraph: 22
            text: |-
              "Te golpearé tan pronto como dejes de correr en círculos como un pollo sin cabeza", dice enojado Gontrok. "¿Qué tal si luchas como un hombre en lugar de seguir deshonrándote actuando de una manera tan cobarde?"

              "Pelearé como quiera, muchas gracias", le digo.

              "Entonces te daré la muerte que te mereces", dice Gontrok. "La muerte de un patético cobarde."

              Luego salta hacia mí y comienza a atacarme con una elaborada serie de fintas que pretenden engañar a mis reflejos demasiado sensibles para que me hagan esquivar en el momento equivocado, dejándome así vulnerable.

              Soy capaz de predecir sus fintas las primeras veces, pero eventualmente se vuelve demasiado difícil adivinar cuándo está a punto de golpearme de verdad o no, así que no tengo más remedio que comenzar a confiar exclusivamente en mis reflejos para evadir sus próximos ataques. Desafortunadamente, esto es exactamente lo que Gontrok estaba esperando, y tan pronto como me ve esquivando una de sus fintas, inmediatamente sigue con un puñetazo tan fuerte que atraviesa mi cabeza y me rompe el cráneo en un solo movimiento.
