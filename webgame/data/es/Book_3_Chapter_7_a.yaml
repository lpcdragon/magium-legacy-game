  - name: b3_ch07a_intro3
    texts:
      - source: scene_text
        paragraph: 6
        text: |-
          "No me malinterpretes", escribe Leila, "el dolor en mi cabeza es insoportable, pero no es nada comparado con lo que solíamos experimentar a diario en Faro de Esperanza. Supongo que cuando creces en un ambiente como ese, llegas a desarrollar un poco de tolerancia al dolor y las náuseas sin darte cuenta. Vamos, veamos si podemos lograr que des algunos pasos hacia adelante. Estoy segura de que te sentirás mejor una vez que avances un poco".

          Sigo su consejo y trato de alejarme de mi ubicación inicial, colocando un pie delante del otro mientras sigo agarrando a Leila para mantener el equilibrio. Después de no más de diez segundos le pedí a Leila que me volviera a bajar, porque empezaba a sentir que estaba a punto de desmayarme nuevamente.

          "Esto no funciona", le digo a Leila, mientras todavía estoy descansando en el suelo, con la espalda contra la pared. "Creo que tendrás que seguir adelante sin mí. A este paso, sólo voy a retrasarte, y necesitas encontrar a tu padre lo más rápido posible. ¡Déjame aquí y te alcanzaré más tarde, lo prometo!"

          "No seas estúpido...", escribe Leila. "No te dejaré atrás. Si alguno de los guardias reales se teletransporta aquí y te encuentra en este estado, te matará en un instante. Dame un momento. Intentaré ver si puedo recordar una técnica que aprendí de mi padre hace un tiempo. Él solía hacer esto por mí a veces, cuando los otros lessathi del Beacon no estaban mirando, y me quitó algo del dolor de cabeza. Creo que funcionó así".
      - source: scene_text_2
        paragraph: 6
        text: |-
          Leila ahora se arrodilla a mi lado y comienza a masajear ligeramente mis sienes con sus manos. Mientras ella hace esto, puedo sentir el aura alrededor de mi cabeza cambiando su flujo y volviéndose más y más tranquila con cada momento que pasa. Una vez que finalmente terminó con su técnica, el dolor en mi cabeza se redujo considerablemente y, aunque todavía persiste una fuerte sensación de náuseas, se ha vuelto mucho más soportable.

          "¡Eso fue increíble!" Le digo a Leila, que ahora se está levantando. "Se sentía casi como si estuvieras usando magia. ¡O al menos una técnica de manipulación del aura, como el capitán de los guardias!"

          "Incluso si no puedo lanzar hechizos", escribe Leila, "sigo siendo bastante buena detectando el flujo de auras, así que mientras pueda encontrar los puntos de presión correctos, eventualmente podré descubrir lo que necesito hacer".

          Luego me ofrece su mano y me ayuda a ponerme de pie.

          "¿Cómo te sientes?" Escribe Leila. "¿Crees que puedes caminar?"

          "Sí", le digo. "Todavía siento náuseas, pero no es nada comparado con cómo estaba antes. ¿Pero qué hay de ti? ¿Sigue el dolor en tu cabeza? ¿Has intentado usar esta técnica contigo mismo para ver si funciona?"

          "Lo he probado en el pasado, pero parece que sólo funciona si lo usas con otra persona", escribe Leila. "El dolor sigue ahí, pero... puedo manejarlo. De todos modos, veamos si podemos rastrear nuestros pasos de ayer. Creo que primero debemos ir por este camino. ¿Vienes?"
    choices:
      - position: 1
        text: Pregúntale a Leila si puede enseñarme la técnica del masaje para poder usarlo con ella.
        effects:
          - set:
              current_scene: b3_ch07a_massage
              b3_ch7_massage: 1
      - position: 2
        text: Deja que Leila se encargue sola de su dolor de cabeza y síguela.
        effects:
          - set:
              current_scene: b3_ch07a_massage
              b3_ch7_massage: 0
  - name: b3_ch07a_massage
    routes:
      - condition: b3_ch7_massage = 1 AND magical_sense < 2
        texts:
          - source: scene_text
            paragraph: 7
            text: |-
              "Antes de irnos, ¿podrías intentar enseñarme esa técnica de masaje?" digo. "Tal vez pueda ayudarte a deshacerte de tu dolor de cabeza".

              "Barry, eso no es... no es tan simple...", escribe Leila. "¡Me llevaría demasiado tiempo explicártelo!"

              "Entonces dame la versión realmente corta y veré si puedo resolverla por mi cuenta", digo. "Si no, podemos irnos".

              "Bien", escribe Leila. "Pero va a ser una explicación MUY breve. Ven aquí".

              Me acerco a Leila y le pongo ambas manos en las sienes, mientras ella me dice a través de su escritura exactamente a qué tipos de fluctuaciones del aura debo prestar atención.
          - source: scene_text_2
            paragraph: 7
            text: |-
              Después de aproximadamente medio minuto moviendo mis manos alrededor de los lados de su cabeza, tratando en vano de encontrar los cambios sutiles en el flujo del aura de los que Leila me habla, finalmente me doy cuenta de que no estoy haciendo ningún progreso notable, así que decido rendirme.

              "Tenías razón", le digo a Leila, mientras quito mis manos de su cabeza. "No está funcionando. Probablemente deberíamos irnos".

              "Está bien, vámonos", escribe Leila, y luego los dos nos adentramos más en la cueva.
          - source: scene_3
            paragraph: 3
            text: |-
              "Entonces... ¿qué crees que les pasó a todos en la base rebelde?" Leila me escribe, mientras caminamos por los túneles. "No supondrás que ninguno de ellos quedó enterrado bajo los escombros de todas esas explosiones, ¿verdad?..."

              "No sé los rebeldes ni los civiles, pero todos en nuestro grupo han pasado por cosas mucho peores que algunos derrumbes", digo. "No me preocuparía que quedaran enterrados bajo los escombros, pero claro, esas explosiones son probablemente la menor de sus preocupaciones en este momento. Si lo que dijo Peter fuera cierto, el rey de Ollendor ha enviado un pequeño ejército para atacar a la gente en el subsuelo, y lo que queda de la guardia real también estará allí, incluidos los aprendices. Va a ser una pelea dura para ellos, se mire como se mire".

              "¿Puedes intentar llamarlos a través del transceptor?" Escribe Leila. "Tal vez tengamos suerte y puedas comunicarte con ellos".

              "Las paredes que nos rodean están llenas de seredium, así que no me haría ilusiones, pero puedo intentarlo, claro", digo.

              Luego saco mi transceptor, configuro la frecuencia en el número de Daren y lo presiono una vez.
        effects:
          - set:
              failed_checks:
                - '[ Comprobación de sentido mágico fallida - nivel 2 ]'
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch07a_massage2
