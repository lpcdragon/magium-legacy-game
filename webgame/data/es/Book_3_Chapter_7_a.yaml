  - name: b3_ch07a_attack
    texts:
      - source: scene_text
        paragraph: 15
        text: |-
          "Lista cuando tú lo estés, princesa", dice Gontrok. "Comenzaré a contar los sesenta segundos tan pronto como realices tu primer ataque".

          Leila asiente y casi inmediatamente después se lanza hacia su adversario de la misma manera que lo hizo la primera vez que lo atacó, intentando degollarlo con ambas dagas. Exactamente al mismo tiempo, también corro hacia Gontrok, usando mi propia daga para intentar cortarle el cuello por detrás. 

          Sin embargo, a pesar de nuestros mejores esfuerzos, la gruesa piel del gigante detiene fácilmente nuestras espadas y ninguno de nuestros cortes es lo suficientemente profundo como para siquiera sacar sangre. 

          "No recuerdo haberte dado permiso para atacarme al mismo tiempo que ella, enano", me dice Gontrok, mientras gira ligeramente la cabeza en mi dirección.

          "¿Quién dice que necesito tu permiso?" Digo, mientras lo golpeo una vez más.

          "Descarado como siempre, por lo que veo", dice Gontrok. "Parece que tendré que romperte el brazo para darte una lección adecuada, una vez que esto termine".
      - source: scene_text_2
        paragraph: 16
        text: |-
          Después de algunos intentos fallidos más de cortarle el cuello al gigante, Leila de repente decide cambiar de objetivo, esta vez con el objetivo de apuñalar a su oponente en el ojo. Como era de esperar, esto obliga a Gontrok a retirarse, dando un rápido salto hacia atrás para evitar la espada de Leila.

          "Oye," le dice Gontrok a Leila, luciendo un poco molesto, "esto no era parte de nuestro trato. Creí haber dicho que podías degollarme o cortarme la cabeza, no apuñalarme en el ojo".

          "Dijiste que podía degollarte, cortarte la cabeza o 'lo que sea'", escribe Leila. "La parte 'lo que sea' de tu declaración implica que también podría atacarte de cualquier otra forma que considere adecuada".

          "Lo que quise decir con eso es que puedes atacarme de la forma que quieras, siempre y cuando sigas apuntando a mi cuello", dice Gontrok.

          "Entonces tal vez deberías haber sido más específico con tu fraseo", escribe Leila.

          "¡Intentaste apuñalarme en el maldito ojo!" Dice Gontrok, ahora luciendo un poco más enojado que antes. "¡Rompiste nuestro acuerdo!"

          "Tú también lo hiciste, alejándote de tu lugar antes de que transcurrieran los sesenta segundos", escribe Leila. "Desde mi punto de vista, eres tú quien perdió la apuesta, no yo".
      - source: scene_3
        paragraph: 7
        text: |-
          "Parece que estamos en un callejón sin salida", dice Gontrok con el ceño fruncido.

          "Eso parece", escribe Leila.

          "Realmente no quería hacer esto, pero parece que no tengo otra opción", dice Gontrok. "Estoy seguro de que el rey preferiría que te trajeran ante él con una o dos muñecas rotas que nada. Debo advertirte que no te lo tomaré con calma a partir de ahora. Prepárate".

          "Menos conversaciones. Más peleas", escribe Leila.

          "Como quieras", dice Gontrok.

          "¡Leila, luchemos juntas contra él!" digo.

          Leila me saluda con la cabeza y luego ambos nos ponemos en posición de batalla, esperando a que Gontrok inicie la pelea.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch07a_respite
