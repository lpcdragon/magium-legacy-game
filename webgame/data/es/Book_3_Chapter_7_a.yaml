chapter_effects:
  - condition: b3_ch3_stats_unavailable = 1
    effects:
      - disable stats
  - condition: b3_ch3_stats_unavailable = 0
    effects:
      - enable stats
scenes:
  - name: b3_ch07a_intro
    texts:
      - source: scene_text
        paragraph: 2
        text: |-
          El mundo entero da vueltas y tengo un dolor de cabeza tremendo. Esta tiene que ser la peor resaca que he tenido en mi vida. ¿Qué bebí ayer para llegar a este estado?

          No lo recuerdo. Y si intento concentrarme en recordar cualquier cosa que haya sucedido antes de irme a dormir, empiezo a sentir como si cien pequeñas dagas se movieran a través de mi cerebro. Necesito volver a dormir. Estoy seguro de que todo mejorará una vez que descanse más.

          Así es. Necesito dormir. Mantendré los ojos cerrados y apoyaré la cabeza en la almohada. ¿Tengo siquiera una almohada? ¿Dónde fue que me volví a quedar dormido? No importa. Todo lo que tengo que hacer es irme a la cama y luego me ocuparé de todo.
      - source: scene_text_2
        paragraph: 2
        text: |-
          Algo no está bien. No puedo acostarme por alguna razón. Siento como si la parte superior de mi cuerpo estuviera siendo mantenida en posición vertical por una fuerza desconocida que no me suelta. Ahora esta fuerza me sacude violentamente. Quiere que despierte, pero no perderé. Mis ojos permanecen cerrados.

          La fuerza todavía me sacude. Simplemente no sabe cuándo darse por vencido. ¿No ve que estoy tratando de dormir aquí? Habla de ser grosero. Tal vez debería darle una parte de mi mente a esta fuerza misteriosa. Si lo regaño, es posible que desaparezca y me deje en paz. Sólo necesito elegir las palabras adecuadas para asegurarme de que dejarán de molestarme para siempre.
    effects:
      - set:
          b3_ch7_force: 0
          b3_ch7_massage: 0
          b3_ch7_bet: 0
          b3_ch7_fingers: 0
          b3_ch7_door: 0
          b3_ch7_tyrant: 0
          b3_ch7_assassinate: 0
      - set:
          successful_checks:
            - 'Punto de control alcanzado: Partida guardada.'
        condition: checkpoint_rich = 1
    choices:
      - position: 1
        text: Dile a la fuerza misteriosa que necesito unos minutos más para descansar.
        effects:
          - set:
              current_scene: b3_ch07a_intro2
              checkpoint_rich: 0
              b3_ch7_force: 0
      - position: 2
        text: Dile a la fuerza misteriosa que se vaya y deje de molestarme.
        effects:
          - set:
              current_scene: b3_ch07a_intro2
              checkpoint_rich: 0
              b3_ch7_force: 1
      - position: 3
        text: Dile a la fuerza misteriosa que su cara es fea y que a nadie le gusta.
        effects:
          - set:
              current_scene: b3_ch07a_intro2
              checkpoint_rich: 0
              b3_ch7_force: 2
  - name: b3_ch07a_intro2
    routes:
      - condition: b3_ch7_force = 0
        texts:
          - source: scene_text
            paragraph: 4
            text: |-
              "Dame unos minutos más", le digo a la fuerza misteriosa. "Todavía me duele la cabeza. Necesito acostarme y descansar".

              El temblor ha cesado. La fuerza ahora está colocando suavemente la parte superior de mi cuerpo nuevamente en el suelo, para que pueda irme a dormir.

              ¡Funcionó! ¡Mis palabras convencieron a la fuerza de dejarme en paz! Por fin ha llegado el momento de un merecido descanso.

              Me quedo dormido casi instantáneamente, pero después de lo que no pudieron haber sido más de tres minutos, la fuerza me levanta nuevamente y comienza a golpear ligeramente el lado derecho de mi cara. Al ver que esto no me despierta, la fuerza decide abrir mis ojos por sí sola, hasta que finalmente decido abrirlos por mi propia voluntad.

              "Sólo unos minutos más", empiezo a decir. "Sólo unos minutos más y estaré..."

              Cuando abro los ojos por completo, me sorprende ver a Leila frente a mí, que actualmente mantiene mis ojos abiertos con sus dedos y que ahora está haciendo flotar un texto azul brillante frente a mí.

              "Lo siento, Barry, pero no puedo dejarte descansar más que esto", dice el escrito. "Los guardias reales podrían estar detrás de nosotros en cualquier momento. Necesitamos movernos".

              Mientras leo el texto de Leila, todo lo que pasó antes de desmayarme de repente vuelve a mí.
          - source: scene_text_2
            paragraph: 4
            text: |-
              Nunca se trató de que yo tuviera resaca. Fuimos teletransportados aquí por error y perdí el conocimiento debido al dolor de cabeza que tuve por la teletransportación fallida. Y el padre de Leila... ¡fue secuestrado! Tiene razón, ¡no tenemos tiempo que perder! Necesitamos encontrar la salida de esta cueva lo más rápido posible.

              Me levanto del suelo y empiezo a mirar a mi alrededor, tratando de determinar hacia dónde debemos ir. Mientras muevo la cabeza, la fuerte sensación de náuseas de antes regresa a mí con toda su fuerza, haciéndome perder el equilibrio mientras simplemente me quedo en el lugar. Leila me atrapa antes de que caiga al suelo y luego va hacia mi lado derecho, tomando mi brazo y poniéndolo alrededor de su cuello para que pueda agarrarme de ella en caso de que sienta que estoy a punto de caer nuevamente.
          - source: scene_3
            paragraph: 2
            text: |-
              "No deberías hacer ningún movimiento brusco", escribe Leila. "Eso sólo empeorará tu dolor de cabeza. Intente mover la cabeza lentamente, hasta que se acostumbre a la sensación de náuseas".

              "Maldita sea, esto es mucho peor que la última vez que terminamos aquí", digo, mientras lucho por no desmayarme otra vez por el dolor. "Me duele tanto la cabeza que siento que va a explotar..."

              "Sí", escribe Leila. "El dolor de cabeza es mucho más fuerte ahora que antes. Con lo mal que fue esta teletransportación, me sorprende que estemos vivos. El dispositivo de teletransportación debe haber tenido algún tipo de mecanismo de seguridad implementado para que la vida de las personas no se pusiera en riesgo en caso de un mal funcionamiento grave".

              "Espera un minuto..." digo. "¿Por casualidad estás teniendo el mismo dolor de cabeza que yo ahora mismo?"

              "Si te refieres a la sensación de pequeños puñales moviéndose a través de mi cerebro, entonces sí", escribe Leila.

              "Bueno, entonces seguro que estás manejando esto mucho mejor que yo", le digo. "En este momento, estoy teniendo dificultades incluso para mantener esta conversación contigo sin colapsar".
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch07a_intro3
      - condition: b3_ch7_force = 1
        texts:
          - source: scene_text
            paragraph: 5
            text: |-
              "Vete", le digo a la fuerza misteriosa. "¡Deja de molestarme! ¡Estoy tratando de dormir!"

              La fuerza ahora ha dejado de sacudirme y, en cambio, está golpeando ligeramente el lado derecho de mi cara. Al ver que esto no me despierta, la fuerza decide abrir mis ojos por sí sola, hasta que finalmente decido abrirlos por mi propia voluntad.

              "¿No me escuchaste?" digo. "¡Te dije que te fueras! ¿Qué tiene que hacer un hombre para dormir un poco por aquí?"

              Cuando abro los ojos por completo, me sorprende ver a Leila frente a mí, que actualmente mantiene mis ojos abiertos con sus dedos y que ahora está haciendo flotar un texto azul brillante frente a mí.

              "Barry, ¿me reconoces?" Escribe Leila, con una expresión ligeramente preocupada en su rostro. "¿Puedes decir quién soy?"

              "Sí..." digo. "Sí, lo siento, solo estaba--"

              Mientras intento encontrar mis palabras, todo lo que pasó antes de desmayarme de repente vuelve a mí.
          - source: scene_text_2
            paragraph: 5
            text: |-
              Nunca se trató de que yo tuviera resaca. Fuimos teletransportados aquí por error y perdí el conocimiento debido al dolor de cabeza que tuve por la teletransportación fallida. Y el padre de Leila... ¡fue secuestrado! No podemos darnos el lujo de perder más tiempo aquí. ¡Necesitamos movernos!

              Me levanto del suelo y empiezo a mirar a mi alrededor, tratando de averiguar qué camino debemos tomar para salir de la cueva. Mientras muevo la cabeza, la fuerte sensación de náuseas de antes regresa a mí con toda su fuerza, haciéndome perder el equilibrio mientras simplemente me quedo en el lugar. Leila me atrapa antes de que caiga al suelo y luego va hacia mi lado derecho, tomando mi brazo y poniéndolo alrededor de su cuello para que pueda agarrarme de ella en caso de que sienta que estoy a punto de caer nuevamente.
