          - source: scene_text
            paragraph: 66
            text: |-
              "En realidad, si estás tan interesado en ver al rey muerto, ¿por qué no lo matas tú mismo?" Le digo al Supervisor.

              "Solicitud reconocida", dice el Supervisor. "Ahora comenzamos el procedimiento de asesinato. Por favor, esperen".

              "¡No te atreverías!" le dice el rey al Supervisor, furioso.

              Justo cuando el rey termina de pronunciar sus palabras, escuchamos el sonido de hélices provenientes de la entrada principal de la sala, mientras varios drones de ojos rojos están entrando al taller. Antes de que el rey tenga tiempo de reaccionar, todos los drones lo atacan a la vez con fuego y rayos, apuntando primero al dispositivo protector sobre su rodilla y luego al resto de su cuerpo, matándolo así en cuestión de segundos.

              "¡Mi rey, NO!" escuchamos a la guardia real ilusionista gritar desde algún lugar dentro de la habitación, mientras el cadáver del rey de Ollendor ahora cae al suelo.

              A pesar de su grito, el ilusionista no dice nada más, y no parece tener muchas ganas de revelarnos su posición. 

              Habiendo terminado su trabajo, los drones de ojos rojos ahora se retiran de la habitación de manera ordenada y poco después el dron de ojos verdes del Supervisor se vuelve hacia nosotros para hacernos una pregunta.
