  - name: b3_ch07a_hadrik
    texts:
      - source: scene_text
        paragraph: 11
        text: |-
          "Probablemente fue Hadrik", digo. "¡Él y los demás debieron haber obligado al tipo del teletransportador a enviarlos aquí después de enterarse de lo que nos pasó!"

          "¿No crees que habrían intentado llamarnos a través de los transceptores tan pronto como llegaron aquí?" Escribe Leila.

          "Lo más probable es que lo hicieran, pero luego se dieron cuenta de que había demasiados muros de seredium entre nosotros y ellos, ¡y por eso comenzaron a destruirlos!" digo. "Déjame intentar llamar a Hadrik por el transceptor. ¡Tal vez podamos localizarlo ahora!"

          "Si tú lo dices..." escribe Leila, pareciendo poco convencida de mis argumentos.

          Luego saco mi transceptor e intento comunicarme con Hadrik, pero desafortunadamente, parece que no puedo comunicarme con él.

          "Oye, Hadrik, ¿puedes oírme?" Grito fuerte mientras guardo mi transceptor en mi bolsillo. "Estamos por aquí--mmghf"

          Antes de que pueda terminar lo que estaba a punto de decir, Leila corre hacia mí y pone ambas manos sobre mi boca, silenciándome.
      - source: scene_text_2
        paragraph: 13
        text: |-
          "Barry, ¿qué crees que estás haciendo?" Escribe Leila, que todavía me impide hablar. "¿Y si el que está ahí fuera es Gontrok y no Hadrik?"

          "¡Oh, puedo oírte, está bien!" Escucho a Gontrok gritar desde la distancia. "¡Quédate donde estás! Estaré contigo tan pronto como rompa algunas de estas paredes más".

          "Ah, mierda", digo, mientras el sonido de otra pared rompiéndose se puede escuchar en algún lugar más cercano a nosotros. "Lo lamento."

          "...Normalmente no debería ser capaz de determinar nuestra ubicación con solo escucharnos una vez", escribe Leila. "Intentemos alejarnos más de aquí. Con suerte, eso le hará perder la pista".

          "Está bien, vámonos", digo.
      - source: scene_3
        paragraph: 6
        text: |-
          A medida que avanzamos hacia la torre de seredium, seguimos escuchando a Gontrok destruir paredes en algún lugar lejano de nosotros, pero parece estar golpeándolas al azar, sin intentar ir en ninguna dirección específica. ¿Tal vez espera que una vez que atraviese suficientes paredes de seredium eventualmente pueda sentir nuestras auras? Mientras intento descifrar el significado detrás de las extrañas acciones de Gontrok, el gigante comienza a gritar a todo pulmón una vez más, esta vez llamando a uno de sus asociados en lugar de a nosotros.

          "¡¿Estás feliz ahora, estúpido ilusionista?!" dice Gontrok. "¿Finalmente dejé suficiente espacio para que puedas lanzar tu pésimo hechizo?"

          Justo después de que Gontrok termina de hablar, todos los pasillos dentro de la cueva se llenan con una luz verde brillante y tan pronto como la luz se apaga, aparece de la nada una línea hecha de humo verde, que hasta donde sé parece estar marcando el camino exacto que hemos estado siguiendo desde que fuimos teletransportados a estas cavernas.

          "Entonces, sólo necesito seguir este rastro de humo, ¿verdad?" Gontrok vuelve a gritar fuerte. "¡Bien, entonces! Lamento haberlos hecho esperar, amigos de Hadrik. ¡Estaré allí con ustedes en breve!"

          "Maldita sea", digo. "Necesitamos alejarnos del humo verde. ¡Corre!"
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch07a_enchantments
  - name: b3_ch07a_gontrok
    texts:
      - source: scene_text
        paragraph: 12
        text: |-
          "Creo que fue Gontrok", digo. "El chico del teletransportador finalmente debe haber descubierto dónde terminó transportándonos, y ahora Gontrok le ordenó que lo teletransportara al mismo lugar".

          "Sí, yo también creo que es así", escribe Leila. "Probablemente deberíamos seguir avanzando. Que rompa algunas paredes aquí y allá no debería acercarlo más a encontrarnos si ni siquiera sabe hacia dónde vamos".

          "Está bien, vámonos", digo.
      - source: scene_text_2
        paragraph: 14
        text: |-
          Poco después de que comenzamos a movernos, escuchamos a Gontrok gritar desde la distancia, confirmando nuestras sospechas.

          "¿Dónde os escondéis, cobardes?" dice Gontrok. "¡Sé que estás ahí! ¡Muéstrate!"
