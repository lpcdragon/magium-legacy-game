        texts:
          - source: scene_text
            paragraph: 64
            text: |-
              Apunto mi ballesta justo encima de la rodilla izquierda del rey y coloco mi dedo en el gatillo. Justo cuando estoy a punto de disparar, noto que hay algo ligeramente fuera de lugar en la perspectiva. Es como si lo que estoy viendo frente a mí estuviera hecho para replicar la realidad, excepto por algunas discrepancias muy pequeñas que sólo pueden verse si les prestas mucha atención. ¿Estoy viendo una ilusión?

              Cuando me concentro un poco más en los ángulos que no son como deberían ser, la ilusión frente a mí desaparece de repente, y me doy cuenta de que en lugar de apuntar al rey, en realidad había estado apuntando con la ballesta a mí mismo todo el tiempo.

              Maldita sea, estuvo cerca. Casi me disparé en el ojo ahí atrás. ¿Cómo sucedió esto? ¿Fue obra de la guardia real ilusionista?

              "Barry, ¿qué pasa?" Escribe Leila cuando me ve mirando mi arma.

              Miro bien alrededor de la habitación para asegurarme de que no haya más discrepancias, y luego le disparo al rey rápidamente, para no darle tiempo al ilusionista para lanzar otro hechizo. Primero, le disparo por encima de la rodilla, como dijo el Supervisor, y luego le disparo directo a la cabeza.

              "¡Mi rey, NO!" escuchamos a la guardia real ilusionista gritar desde algún lugar dentro de la habitación, mientras el cadáver del rey de Ollendor ahora cae al suelo.
          - source: scene_text_2
            paragraph: 46
            text: |-
              A pesar de su grito, el ilusionista no dice nada más, y no parece tener muchas ganas de revelarnos su posición.

              Después de una breve pausa, el Supervisor rompe el silencio haciéndonos una pregunta.

              "El rey de Ollendor ya está muerto", dice el Supervisor. "Has cumplido tu propósito original al venir aquí. ¿Significa esto que ahora te irás o todavía tienes asuntos pendientes en mi ciudad?"

              "Bueno, antes que nada, todavía necesito... espera un segundo, ¿qué quieres decir con 'tu ciudad'?" le pregunto.

              "Como acabo de decir, el rey de Ollendor está muerto, al igual que la mayoría de sus guardias reales", dice el Supervisor. "Eso significa que esta ciudad ahora está bajo mi control directo. Por lo tanto, ahora es 'mi ciudad'. Por favor, pregúntame si necesitas más aclaraciones".
