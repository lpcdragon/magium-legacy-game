            paragraph: 29
            text: |-
              Seguramente, después de varios ataques más provenientes de Gontrok, mis sospechas se confirman y ahora puedo decir sin lugar a dudas que él efectivamente está usando la técnica en la que estaba pensando.  Evito sus ataques por un tiempo más hasta que Leila finalmente lo distrae una vez más, y luego rápidamente continúo desde donde lo dejé la última vez, juntando mis dedos nuevamente y golpeando varios puntos más en la parte posterior del cuello de Gontrok, mientras puedo sentir el flujo de su aura volviéndose cada vez más errático.

              "¡Dije que ya basta!" Gontrok grita de repente, mientras se gira hacia mí y comienza a atacarme incluso más rápido que antes.

              Las fintas que está usando ahora se están volviendo cada vez más complejas y ya casi no puedo seguirles el ritmo.

              Es sólo gracias a mi conocimiento muy avanzado de artes marciales que de alguna manera logro permanecer con vida el tiempo suficiente para que Leila distraiga una vez más a Gontrok y me dé la oportunidad que necesito para finalmente perfeccionar mi técnica de alteración del aura. Cuando Gontrok le da la espalda una vez más, rápidamente golpeo su nuca con mis dedos unas cuantas veces más, excepto que ahora finalmente siento que sé lo que estoy haciendo. Antes de que Gontrok tenga la oportunidad de darse la vuelta, su aura se vuelve completamente loca y, a juzgar por su reacción, esto claramente está teniendo en él tanto impacto como esperaba.
          - source: scene_text_2
            paragraph: 24
            text: |-
              "¡Puaj!" Dice Gontrok, mientras se agarra la frente con ambas manos. "¡¿Qué me hiciste, bastardo astuto?!"

              "No mucho", digo. "Acabo de hacerte sentir unas náuseas fuertes. No te preocupes, pasarán pronto. Por más de una razón. ¡Leila, prepárate!"

              Luego le doy una patada a Gontrok en la parte posterior de una de sus rodillas y lo jalo por los hombros, haciéndolo caer de espaldas. Mientras el gigante instintivamente pone ambas manos debajo de él mientras cae, Leila aprovecha su falta temporal de defensa para abalanzarse sobre él con ambas dagas apuntando a sus ojos. Justo cuando está a punto de dar el golpe final, un chillido muy agudo llena la habitación y por alguna razón, inmediatamente después todos perdemos fuerza en nuestros músculos durante unos segundos, lo que hace que soltemos nuestras armas involuntariamente.

              Habiendo sido salvado por este misterioso aliado, Gontrok rápidamente se levanta del suelo y mira a su alrededor, como si estuviera tratando de encontrar la fuente del sonido que acaba de escuchar.
          - source: scene_3
            paragraph: 10
            text: |-
              "Pensé que te había dicho que no interfirieras en mis batallas, ilusionista", dice Gontrok. "Esto fue obra tuya, ¿no? ¿Dónde te escondes esta vez? ¡Muéstrate!"

              "Si quieres que te maten, puedes hacerlo en tu tiempo libre", de repente escuchamos la voz de la guardia real ilusionista que escuchamos ayer discutiendo con Gontrok antes de que se teletransportaran. "Te han dado una orden del rey, en caso de que la hayas olvidado, y se espera que sigas con vida hasta que esa orden se haya cumplido".

              Al igual que la última vez, la voz de la guardia real parece venir de todos lados a nuestro alrededor, y es imposible sentir su aura, aunque estoy seguro de que debe estar escondido de manera invisible en algún lugar de este corredor. Gontrok también parece estar un poco confundido al hablar con su aliado, porque ya ha estado buscando en tres lugares diferentes desde que comenzaron su conversación.
