        paragraph: 41
        text: |-
          "¿Vas a matar al rey? ¡Perfecto! ¡Entonces menos trabajo para nosotros!"

          "No, no, no lo entiendes", dice Loyrang. "Cuando dije que 'haría' que lo mataran, lo que quise decir es que te ayudaría a hacerlo. Todavía no puedo atacar a ninguno de los lugareños debido a los efectos del hechizo del torneo, ¿recuerdas?"

