  - name: b3_ch07a_massage2
    texts:
      - source: scene_text
        paragraph: 9
        text: |-
          "Daren, ¿estás ahí?" digo en voz alta. "¡Oye, Daren!"

          Como era de esperar, no obtengo respuesta.

          "Es inútil", digo, mientras cierro mi transceptor y lo guardo de nuevo en mi bolsillo. "No sabremos qué les pasó hasta que salgamos de aquí".

          "Y por fuera de aquí, ¿te refieres a dentro de esa torre con toda la gente encadenada en el sótano?" Escribe Leila, luciendo un poco preocupada.

          "Bueno, no es que conozcamos otra salida de estas cuevas", digo. "Podríamos terminar atrapados aquí durante días si intentamos encontrar otra salida por nuestra cuenta".

          "La última vez pudimos escapar de allí porque teníamos a alguien que nos teletransportó...", escribe Leila. "Esta vez, el ingeniero de teletransporte de los rebeldes ya no está de nuestro lado, lo que significa que la única salida de esa torre será a través de su puerta principal fuertemente custodiada".

          "Lo sé", le digo a Leila. "Pero como dije, no tenemos muchas opciones. Probablemente también necesitaremos entrar a esa torre de todos modos si queremos salvar a tu padre, así que es mejor que lo hagamos ahora, mientras todavía tenemos el elemento sorpresa".
      - source: scene_text_2
        paragraph: 10
        text: |-
          "¡¿Mi padre?!" Escribe Leila. "¿Qué quieres decir? ¿Por qué estaría él allí?"

          "Bueno", digo, "sabemos que el rey quiere su ayuda para controlar al Supervisor, y por lo que vimos durante nuestra visita anterior, parecía que esa torre en particular era donde Billy Bob había establecido su principal base de operaciones. Si el rey realmente quiere que tu padre se convierta en un reemplazo de Bilibolbrathatastran o como se llame, entonces hay muchas posibilidades de que el primer lugar al que quiera llevarlo sea la oficina de trabajo de lessathi".

          "Eso es ciertamente posible, pero también es posible que simplemente lo mantengan en una celda hasta que acepte cooperar con ellos", escribe Leila. "No hay manera de saberlo con seguridad".
      - source: scene_3
        paragraph: 4
        text: |-
          "Estoy seguro de que los guardias de la torre nos dirán todo lo que necesitamos saber si se lo preguntamos amablemente", digo. "Siempre que sepan las respuestas, por supuesto."

          "Lo que más me interesa saber ahora es ¿qué camino se supone que debemos tomar a continuación?" Escribe Leila. "¿Izquierda o derecha? Todos estos túneles parecen completamente idénticos... Me está costando mucho recordar cuál de estos corredores atravesamos ayer".

          "Creo que pasamos por aquí", le digo a Leila, mientras señalo hacia uno de los túneles. "Sabremos que es el camino correcto si no detectamos ninguna trampa mágica delante de nosotros. Normalmente, las trampas con las que nos topamos antes aún deberían estar desarmadas".

          "A menos que alguien haya colocado algunas trampas nuevas mientras estábamos fuera...", escribe Leila.

          "¿En sólo una noche?" digo. "Lo dudo. Ni siquiera había guardias patrullando estos corredores, por lo que el rey y sus hombres claramente no sabían de su existencia. Mientras no envíen a ninguno de los guardias reales para interceptarnos, nuestro viaje hacia la torre debería ser muy sencillo. Vamos, sigamos adelante. Creo que reconozco la siguiente sección".
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch07a_massage3
  - name: b3_ch07a_massage3
    routes:
      - condition: b3_ch6_transceivers <> 2
        texts:
          - source: scene_text
            paragraph: 10
            text: |-
              Seguimos caminando por los túneles subterráneos durante algún tiempo, tratando de orientarnos buscando rocas de aspecto familiar en el suelo y en las paredes. Por suerte para nosotros, Flower y Melindra me hicieron tomar un curso de capacitación extenso sobre el reconocimiento de características distintivas de todo tipo de piedras durante nuestro último turno de noche, y esto me hace mucho más fácil distinguir entre estos corredores casi idénticos. También ayuda que los cristales azules incrustados en las paredes sean muy brillantes, por lo que no es necesario que saquemos nuestros dispositivos de estadísticas para iluminar nuestro camino.

              "Entonces... ¿por qué supones que fuimos teletransportados aquí, de todos los lugares?" Escribe Leila, mientras los dos examinamos las paredes para confirmar que todavía estamos en el camino correcto. "¿Crees que existe alguna posibilidad de que el Barry de la sala del teletransportador todavía estuviera secretamente de nuestro lado y quisiera ayudarnos a escapar?"

              "No, no creo que eso sea lo que pasó", digo. "Supongo que esta cueva es el lugar predeterminado al que te envía el dispositivo de teletransportación si la teletransportación sale terriblemente mal. Como decías antes, el dispositivo debe haber tenido un mecanismo de seguridad incorporado, para evitar matar personas accidentalmente en caso de que la persona que opera el dispositivo no siga los protocolos de seguridad adecuados. Nos enviaron exactamente a este mismo lugar la última vez que nuestra teletransportación salió mal, y dudo que fuera una coincidencia".

              "¿Tienes alguna idea de por qué querrían teletransportarnos fuera de la base rebelde, en lugar de simplemente dejarnos allí?" Escribe Leila. "¿Podría tener algo que ver con mi padre?"
          - source: scene_text_2
            paragraph: 11
            text: |-
              "Es posible", digo. "Seguramente debieron haber sabido que tú eras su hija, considerando que el tipo del teletransportador era su informante, así que tal vez estaban planeando que trabajaras como su asistente, o algo así. El hecho de que yo también fuera teletransportado aquí junto contigo probablemente fue solo un accidente, causado por el hecho de que tú me estabas abrazando en ese momento".

              "Ya veo", escribe Leila. "En ese caso, probablemente sea sólo cuestión de tiempo hasta que descubran dónde estamos y envíen algunos guardias tras nosotros. Tal vez deberíamos intentar acelerar un poco nuestro paso".

              Después de unos minutos más de caminata, finalmente llegamos al lugar donde Breynan e Illuna desactivaron la primera trampa mágica ayer, y seguimos avanzando mientras intentamos usar nuestro Sentido mágico para descubrir si hay alguien siguiéndonos o no. Hasta ahora, no parece que haya nadie en estos túneles excepto nosotros, pero con la gran cantidad de seredium en estas paredes, es difícil saberlo con seguridad. 

              Si nuestros perseguidores ocultaran sus auras adecuadamente, entonces no creo que hubiera ninguna forma de detectarlos, pero lo mismo ocurre con ellos también. Teniendo en cuenta que nos hemos asegurado de ocultar nuestras auras desde que comenzamos a viajar por estos corredores, nuestros enemigos deberían tener muchas dificultades para rastrearnos usando solo su Sentido mágico. En última instancia, creo que todo se reducirá a qué tan bien cada uno de nosotros será capaz de navegar a través de este lugar laberíntico sin perderse.
          - source: scene_3
            paragraph: 5
            text: |-
              Mientras avanzábamos por los túneles, de repente escuchamos el débil eco de un muro destrozado en algún lugar relativamente lejos de nosotros. Leila y yo nos hemos detenido en seco y nos miramos con aprensión, sin estar del todo seguros de cómo reaccionar ante esto.

              "Eso no sonó como una explosión", digo. "Sonaba más como si alguien se hubiera abierto camino a través de una de las paredes de la caverna".

              "Así que debe haber sido Hadrik... o Gontrok", escribe Leila.
        choices:
          - position: 1
            text: Probablemente fue Hadrik.
            effects:
              - set:
                  current_scene: b3_ch07a_hadrik
          - position: 2
            text: Creo que fue Gontrok.
            effects:
              - set:
                  current_scene: b3_ch07a_gontrok
