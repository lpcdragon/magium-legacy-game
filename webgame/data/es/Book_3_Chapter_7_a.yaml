  - name: b3_ch07a_golems
    texts:
      - source: scene_text
        paragraph: 68
        text: |-
          "Sí, en realidad", digo. "Nuestra amiga Melindra nos dijo que el rey le robó algo, y estoy bastante seguro de que ella necesita este objeto para salvar a su hermano. Como quería que matáramos al rey y no simplemente entrar al palacio para robarle, supongo que el objeto debe ser algo que su 'alteza real' normalmente traería consigo en todo momento, pero no tengo idea de qué podría ser. ¿Alguna idea?"

          "Desafortunadamente, no puedo ayudarte con esta consulta, ya que no estoy familiarizado con la historia de tu amiga ni con sus motivaciones", dice el Supervisor.

          "Sí, ya me lo imaginaba", digo. "Supongo que primero revisaré sus bolsillos. ¿O tal vez podría ser uno de esos anillos en sus dedos? Déjame ver..."

          Mientras busco en los bolsillos del rey muerto, el dron de ojos verdes del Supervisor de repente comienza a actuar de manera muy extraña. Se mueve constantemente de arriba a abajo, luego de izquierda a derecha sin ton ni son, y parece que su comportamiento no hace más que empeorar.

          "Umm, ¿Supervisor?" digo. "¿Estás bien, amigo? ¿Bebiste demasiado anoche?"

          "Hay... una voz", espeta de repente el dron de ojos verdes.

          "¿Una voz?" digo.

          "Es una voz diferente cada vez que habla, pero puedo decir que es la misma entidad", dice el Supervisor. "Me está llamando desde un lugar que está más allá del análisis. Más allá de la razón".
      - source: scene_text_2
        paragraph: 48
        text: |-
          Mientras dice esto, puedo escuchar algo vibrando fuertemente desde el interior del dron. El sonido que hace es inquietantemente familiar. Cuando reconozco qué es ese sonido, me quedo paralizado por un momento, y luego inmediatamente recuerdo una conversación que Hadrik y Arraka tuvieron cuando llegamos por primera vez a la base rebelde:

          "Entonces, si quisiera, podría alterar las auras de algunas rocas y tendría mi propio ejército personal de Gólems de piedra altamente inteligentes, ¿entonces?..." Recuerdo que preguntó Hadrik.

          "Claro", le respondió Arraka. "Si también combinas esas rocas con algo de seredium y algunos de los cristales azules que se encuentran alrededor de estas cuevas, y un montón de otras cosas, y luego pasas algunas décadas trabajando en ellas usando el conocimiento que adquiriste del Magium, entonces sí, tendrás tu ejército. Llámame dentro de treinta años y cuéntame cómo te fue".

          Cristales azules. Todos estos drones fueron construidos con cristales azules en su interior. ¿Cómo podría olvidar esto?

          Fui descuidado al pensar que estaríamos a salvo del Magium si llegábamos a la superficie. No debería haber bajado la guardia tan fácilmente. Quizás todavía haya tiempo. Tal vez si nos distanciamos lentamente del dron, podríamos...

          "¿Dónde está el que se llama Arraka?" Nos pregunta el Supervisor, con una voz completamente diferente a su tono habitual.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch07a_fabric
  - name: b3_ch07a_fabric
    texts:
      - source: scene_text
        paragraph: 69
        text: |-
          "Uh, ¿estoy hablando con el Magium ahora, o...?" Digo, mientras intento parecer confiado, mientras todo mi cuerpo tiembla. "Arraka no está aquí con nosotros en este momento. No sé dónde está exactamente".

          "Las acciones de Arraka han amenazado el tejido mismo de toda existencia y hay que detenerla a toda costa", dice el dron de ojos verdes, con el mismo tono de voz inusual. "Revelarás su ubicación o este mundo se deshará hasta que la encuentren. Comenzando con esta habitación".

          "Escucha, realmente no sabemos dónde está, ¡pero creo que puedes estar equivocado!" digo. "Arraka está atrapada en un amuleto. ¡No hay manera realista de que ella pudiera haber amenazado a alguien con hacer algo más que simplemente gritarles al oído y no dejarlos dormir por la noche! Si pudieras darnos algo de tiempo, estoy seguro de que podremos aclarar rápidamente este malentendido y--"

          "Se te acabó el tiempo", dice simplemente el dron de ojos verdes, y luego empiezo a experimentar una sensación que nunca antes había sentido y que nunca imaginé que sería posible.
      - source: scene_text_2
        paragraph: 49
        text: |-
          En lugar de estar atrapado en un vacío como la última vez, ahora puedo sentirme existiendo en el plano terrestre, el plano mágico y el plano etéreo al mismo tiempo, como si fuera la cosa más natural del mundo. No tengo idea de por qué estoy tan seguro de que esto es lo que está sucediendo, ya que lógicamente hablando, no tengo absolutamente ninguna manera de saber cómo se sentiría el plano mágico o el plano etéreo, pero no tengo ninguna duda de que esto es efectivamente lo que estoy experimentando.

          Sin embargo, al mismo tiempo, de alguna manera todavía estoy dentro de esa misma habitación, excepto que la habitación no se parece en nada a antes. El taller se está desmoronando ante mis ojos. Todos los objetos dentro de la habitación vuelan y parece que hay algún tipo de viento fuerte que también me eleva en el aire al mismo tiempo. Y el viento no sólo me eleva en el plano terrestre, sino también en los otros dos planos. Siento como si me estuvieran succionando el alma mientras mi cuerpo era arrojado por el plano terrenal y mágico como una muñeca de trapo cósmica.

          Ya nada tiene sentido. Arriba es abajo, derecha es izquierda y mi conciencia se siente como si estuviera siendo desgarrada en todas direcciones.

          "Estaré deseando ver su próxima interacción con el Supervisor", escucho las palabras de Eiden en el fondo de mi mente mientras soy arrojado a través de múltiples dimensiones.

          El bastardo lo sabía. Sabía que algo así sucedería. Voy a matarlo. Juro que lo mataré.
      - source: scene_3
        paragraph: 27
        text: |-
          "¡Barry, toma mi mano!" De repente escucho la voz desesperada de una mujer, mientras poco a poco voy perdiendo el conocimiento.

          Inmediatamente reconozco la voz como la de Leila, aunque nunca la había oído hablar antes e incluso sus risas y gritos siempre han sido silenciosos. Cuando me giro hacia ella, veo que ella también está siendo llevada por el fuerte viento, y que tiene su mano derecha extendida hacia mí mientras flota en el aire.

          "¡Agarra mi mano, rápido!" La oigo decir de nuevo, pero ahora puedo ver claramente que tiene la boca cerrada mientras habla.

          ¿Estoy... escuchando sus pensamientos? ¿Es porque ambos estamos en el plano etéreo, que es el plano de existencia donde residen nuestras mentes? ¿Significa esto que ella también puede escuchar lo que estoy pensando ahora?

          "¡Idiota!" Oigo a Leila gritar con la boca todavía cerrada, sugiriendo que efectivamente escuchó lo que yo estaba pensando. "¡Deja de intentar darle sentido a las cosas y agárrate de mí ya! ¡Te están alejando!"
    choices:
      - position: 1
        text: No agarres la mano de Leila.
        effects:
          - set:
              current_scene: b3_ch07a_trick
      - position: 2
        text: Toma la mano de Leila.
        effects:
          - set:
              current_scene: b3_ch07a_wreaking
  - name: b3_ch07a_trick
    texts:
      - source: scene_text
        paragraph: 70
        text: |-
          Esto tiene que ser un truco. Leila no puede hablar. ¿Qué pasa si es sólo una ilusión de Leila y cuando tomo su mano, seré borrado de la existencia nuevamente? No puedo arriesgarme.

          "¡No soy una ilusión!" Leila dice con la boca cerrada. "¡Barry, escúchame! ¡Se te está acabando el tiempo! ¡Tienes que agarrar mi mano ahora!"

          No escucho la ilusión y me tapo los oídos con las manos para no escucharla más, aunque no parece estar teniendo mucho efecto. Mientras Leila sigue llamándome, las corrientes de aire se vuelven mucho más fuertes y me alejo cada vez más de ella, hasta que ya no puedo oírla ni a nada más. Ahora todo está en silencio y el mundo que me rodea ha desaparecido. Sólo hay vacío. A medida que el recuerdo de quién fui una vez se vuelve cada vez más borroso, cierro los ojos y mi conciencia se desvanece lentamente, para no volver a despertar nunca más.
    effects:
      - set:
          ac_b3_ch7_paranoid: 1
        achievement:
          id: ac_b3_ch7_paranoid
          title: Paranoico
