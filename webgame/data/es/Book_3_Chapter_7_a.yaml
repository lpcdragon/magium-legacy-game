  - name: b3_ch07a_vibrating
    texts:
      - source: scene_text
        paragraph: 42
        text: |-
          "¡Ya he oído suficiente de esto!" dice Gontrok. "No vas a ayudar a nadie a matar al rey. No te lo permitiré".

          "¿Se supone que eso es una amenaza?" dice Loyrang, en su característico tono relajado. "Gontrok, amigo mío... ¿Nunca te has preguntado por qué decidí viajar contigo cuando te encontré el primer día del torneo? ¿De verdad pensaste que me arriesgaría a caminar lado a lado todo este tiempo con alguien que pensé que tendría la más mínima posibilidad de derrotarme en la batalla? Claramente no debes conocerme muy bien."

          "Entonces, ¿primero insultas mi inteligencia y ahora insultas mi destreza en el combate?" Dice Gontrok, ya que parece apenas poder contener su ira. "¿En serio crees que puedes darte el lujo de tener tanta confianza sólo porque esas armas tuyas son lo suficientemente afiladas como para cortarme la piel?"

          "Créanme, no es sólo por el filo de mis armas que tengo confianza", dice Loyrang. "Si no me crees, eres libre de probar mis habilidades cuando estés listo. Pero no me culpes si pierdes uno o dos brazos en el proceso..."

          Gontrok de repente deja escapar una risa, pero no es el tipo de risa que alguien deja escapar cuando algo le divierte. Es más bien el tipo de risa que normalmente esperarías escuchar de alguien que está a sólo unos momentos de estallar.
      - source: scene_text_2
        paragraph: 34
        text: |-
          "Qué día ha sido este..." dice Gontrok, una vez que termina de reír. "Primero tuve que cuidar a ese tipo quejoso del teletransportador, luego estos dos tontos me tomaron por tonto, y ahora mi compañero de armas de confianza me dice que está a punto de cortarme los brazos. Y para colmo, hay un zumbido muy molesto de fondo que suena y sigue y sigue mientras intento hablar, ¡¡¡y ME ESTÁ ENOJANDO!!!"

          Gontrok tiene razón. No estoy seguro exactamente de cuándo empezó, pero todos los cristales azules que están incrustados en las paredes de la caverna que nos rodean han estado vibrando durante un tiempo, y parece que se vuelven más fuertes a cada segundo. Gontrok hace una pausa por unos momentos, esperando que el sonido desaparezca por sí solo, pero cuando se da cuenta de que a partir de ahora solo será más fuerte, levanta la voz, probablemente en un intento de ahogar el ruido proveniente de los cristales.
      - source: scene_3
        paragraph: 15
        text: |-
          "¡¿Entonces quieres mostrarme lo fuerte que eres, Loyrang?! grita Gontrok. "¿Es eso todo? ¿O tal vez tu estrategia es engañarme haciéndome pensar que será una pelea justa pero en lugar de eso me has tendido una trampa en el suelo frente a mí? Conozco a tu tipo... No planeas pelear limpio en absoluto, ¿verdad? No intentes mentirme; Sé cómo sois vosotros, los no gigantes. ¡Sois todos iguales! ¡Cada uno de ustedes! ¿Les mataría luchar con al menos una pizca de dignidad? ¿El honor no significa nada para ti? ¿Hay... ARGH, este tres veces maldito ruido nunca terminará? ¿Qué les pasa a estos cristales? ¿No ves que estoy intentando tener una conversación aquí? ¡Calla, maldito seas! ¡¡¡Dije ¡¡¡CALLE!!!"

          Mientras grita esas dos últimas palabras, Gontrok golpea furiosamente uno de los cristales de la pared a su izquierda con el costado de su puño. Sin embargo, en lugar de romperse, el cristal comienza a emitir una luz azul mucho más brillante que la anterior, que llena todo el pasillo y nos ciega durante unos segundos. Luego, mientras todos recuperamos lentamente la vista, de repente escuchamos el grito de Gontrok, lleno de ira y total incredulidad.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch07a_fingers
  - name: b3_ch07a_fingers
    texts:
      - source: scene_text
        paragraph: 43
        text: |-
          "¡¿Qué diablos es esto?!" Grita Gontrok, mientras nos muestra su mano izquierda.

          Lo que estoy viendo ahora es extremadamente difícil de expresar con palabras. Parece como si su mano izquierda hubiera sido esencialmente cortada por la mitad, faltando por completo el dedo meñique y el anular, así como los dos nudillos correspondientes a ellos y el lado izquierdo de la palma. Sin embargo, de alguna manera, su mano parece haber sido así desde que nació. No sólo no sale sangre de los dedos faltantes, sino que tampoco se ve tejido cicatricial. Si alguien viera su mano ahora por primera vez, no habría razón para creer que esos dos dedos faltantes alguna vez existieron.

          Pero eso no es todo... Por una fracción de segundo, cuando vi su mano por primera vez después del destello cegador de luz azul, estuve casi convencido de que su mano había estado así todo el tiempo. Aunque todavía tengo recuerdos claros de que su mano estaba intacta hace sólo unos momentos, estaba a punto de creer que la mano izquierda de Gontrok solo tenía tres dedos desde el principio. Mientras lucho por entender cómo pudo haber sucedido algo como esto, Gontrok grita de nuevo, mientras observa detenidamente a todas las personas en la habitación a su lado.

          "¡¿Por qué me miran así, tontos?!" Dice Gontrok, mientras levanta su mano izquierda para asegurarse de que todos puedan verla correctamente. "¿No tienes ojos? Te lo preguntaré de nuevo. ¡¿Qué diablos es esto?!"
      - source: scene_text_2
        paragraph: 35
        text: |-
          "¿Qué quieres decir con 'qué es esto'?..." dice Loyrang. "Es tu mano. ¿En serio te has desviado tanto que has olvidado cómo es tu mano izquierda?"

          "¡Mira los dedos, imbécil!" —grita Gontrok. "¡¿No ves que sólo son tres?!"

          "Sí, tu mano izquierda sólo tiene tres dedos", dice Loyrang. "Siempre ha habido sólo tres dedos en tu mano izquierda. ¿Esperas que ahora te tengamos lástima? ¿Vas a decirme que quieres que pelee contigo con una mano detrás de mi espalda para igualar las probabilidades?"

          "Estás llevando esta broma demasiado lejos, Loyrang", dice Gontrok. "¡Estos dos dedos desaparecieron de la nada después de que golpeé el cristal con ellos y lo sabes! ¡Lo viste con tus propios ojos! ¡Estabas todos aquí!"

          "¡Gontrok, sal de ahí!" dice el ilusionista. "Este bastardo traidor debe haberte lanzado algún tipo de hechizo alucinante mientras estábamos distraídos por la luz azul. Escúchame. Nunca has tenido más de tres dedos en tu mano izquierda. Así es como naciste. ¡No te dejes engañar por un simple truco como este, maldita sea!"

          Mientras los tres guardias reales discuten, Leila me tira ligeramente de la manga y cuando me giro para mirarla, puedo ver que parece bastante angustiada.

          "Barry... por favor dime que no me estoy volviendo loca", escribe Leila. "También recuerdas que Gontrok tenía cinco dedos en su mano izquierda antes, ¿verdad? No es sólo un hechizo que afecta la mente. Esos dedos realmente existieron... ¿verdad?"
    choices:
      - position: 1
        text: No te estás volviendo loco. Su mano izquierda definitivamente tenía cinco dedos antes.
        effects:
          - set:
              current_scene: b3_ch07a_disappeared
              b3_ch7_fingers: 0
      - position: 2
        text: ¿De qué estás hablando? Su mano izquierda siempre ha tenido tres dedos.
        effects:
          - set:
              current_scene: b3_ch07a_disappeared
              b3_ch7_fingers: 1
  - name: b3_ch07a_disappeared
    routes:
      - condition: b3_ch7_fingers = 1 AND bluff >= 1
        texts:
          - source: scene_text
            paragraph: 44
            text: |-
              "¿De qué estás hablando?" Le respondo a Leila en voz baja, mientras Gontrok y los demás siguen hablando entre ellos. "Su mano izquierda siempre ha tenido tres dedos."

              "Barry..." escribe Leila. "Ya sabías que podría darme cuenta de que estabas mintiendo antes de decir eso, ¿no?"

              "Eso sí lo sabía, sí", le respondo.

              Inmediatamente después de decir esto, Leila me golpea ligeramente en el brazo.

              "Bueno, supongo que al menos estoy agradecida de que no hayas visto la necesidad de usar tu estadística de farol conmigo para engañarme de verdad", escribe Leila. "Eso habría significado llevar la broma demasiado lejos".

              "¡Oye, ni siquiera yo soy tan insensible!" digo.

              "Correcto..." escribe Leila, pareciendo algo poco convencida. "Entonces, ¿tienes alguna idea de lo que pudo haber pasado después de que Gontrok golpeó ese cristal?"

              "Bueno, los dedos que estaban más cerca del cristal son los que desaparecieron", digo, "así que supongo que estos cristales deben tener algún tipo de mecanismo de defensa que se activa cuando alguien los ataca. Lo que realmente no puedo entender es la razón por la cual no quedó sangre ni tejido cicatricial después de que la mitad de su mano fue prácticamente cortada. Además, por un segundo, incluso yo estaba casi convencido de que la mano de Gontrok era así desde el principio. Es como los dedos no simplemente desaparecieron, sino que fueron completamente... borrados... de la existencia..."
          - source: scene_text_2
            paragraph: 36
            text: |-
              Mientras digo esas palabras, un repentino escalofrío recorre todo mi cuerpo y comienzo a temblar incontrolablemente mientras gotas de sudor frío se forman lentamente en un lado de mi frente. Si los dedos de Gontrok realmente han desaparecido por completo, entonces la única entidad que conozco que es capaz de hacer algo como esto es el propio Magium. ¿Significa esto que estos cristales están conectados de alguna manera al Magium? ¿El Magium nos está mirando ahora mismo?

              De repente empiezo a girar frenéticamente, para poder ver dónde están colocados cada uno de los cristales. Hay muchísimos de ellos. Demasiados para contarlos... Y están por todas partes. Si el Magium realmente fuera capaz de observarnos a través de estos cristales, entonces no habría lugar para que nos escondiéramos en estas cuevas. Estamos atrapados aquí como ratas. No hay escapatoria.

              "Barry, ¿qué te pasa?" Escribe Leila. "Oye, ¿estás leyendo esto?"

              Mis instintos de supervivencia son defectuosos. Morir no me asusta. Pero ¿qué pasa con dejar de existir? ¿Estoy listo para volver a pasar una eternidad flotando en ese vacío? ¿Estoy dispuesto a pasar un momento infinitamente largo contemplando la contradicción de existir y no existir al mismo tiempo? No, no puedo volver allí otra vez... No puedo rendirme. Aún no.
          - source: scene_3
            paragraph: 16
            text: |-
              Mientras lucho por idear un plan de acción que nos saque de estas cuevas de manera segura, escucho a Gontrok gritarles a los otros guardias reales desde algún lugar un poco más adelante en el pasillo.

              "¡Ya estoy harto de ustedes, idiotas!" —grita Gontrok. "¡Si todavía no me crees, te lo demostraré ahora mismo con esta piedra!"

              Luego toma una piedra del suelo con su mano derecha y se la muestra a Loyrang.

              "Voy a estrellar esta roca contra ese cristal y verás cómo desaparece ante tus ojos", dice Gontrok. "¡Entonces veremos quién es el loco!"

              "¡No, no lo hagas!" Digo en voz alta, mientras Gontrok levanta el brazo y se prepara para golpear el cristal azul con la roca.

              Sin embargo, Gontrok no logra terminar su movimiento porque su brazo se congela en su lugar y también el resto de su cuerpo, como si estuviera inmovilizado por una fuerza invisible. Mientras el gigante lucha por liberarse de la técnica del aura, vemos a Eiden salir de la invisibilidad en algún lugar no muy lejos detrás de él con los ojos cerrados, como siempre.
