          - source: scene_text
            paragraph: 23
            text: |-
              Después de unos segundos de concentrarme en el aura del gigante, finalmente descubrí por qué pensé que había algo extraño en ello. De hecho, no fue el aura en sí lo que llamó mi atención, sino el flujo de magia dentro de ella que es específico de alguien que actualmente está cambiando de forma. El flujo es claramente inestable. He estudiado cómo se supone que funciona el cambio de forma, y ​​nada de lo que está haciendo es un procedimiento estándar. Debe estar usando algún tipo de versión mal modificada del hechizo de cambio de forma normal para poder obtener alas y otros apéndices útiles sin la necesidad de transformarse completamente en una criatura diferente. ¿Quizás haya alguna manera de convertir esta inestabilidad de su aura en una ventaja para mí?

              Mientras estoy allí, pensando, Gontrok me ataca de nuevo con un golpe extremadamente rápido, haciéndome saltar detrás para esquivarlo mientras Leila busca una vez más una buena oportunidad para flanquear a mi oponente. Siento como si hubiera docenas de pensamientos concurrentes corriendo por mi cabeza mientras evito los aparentemente interminables ataques de Gontrok. De todas las ideas que se me ocurren en este momento, dos en particular parecen bastante prometedoras, pero ambas implican el uso de una variación de la técnica de masaje del padre de Leila para alterar el aura del gigante.
          - source: scene_text_2
            paragraph: 21
            text: |-
              Si pudiera encontrar los puntos de presión correctos, podría aturdirlo brevemente o al menos hacerle sentir una fuerte sensación de náuseas, pero hacer esto mientras concentra todos sus ataques en mí podría ser un poco arriesgado. La segunda idea sería decirle a Leila que use la técnica del punto de presión sobre Gontrok mientras lo mantengo ocupado, pero no estoy seguro de si ella podría modificar la técnica del masaje correctamente a menos que le dé una guía paso a paso muy específica en medio de la batalla.

              Ambas opciones tienen sus altibajos, así que supongo que tendré que seguir mis instintos en esta.
        effects:
