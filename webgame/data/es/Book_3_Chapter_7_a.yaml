  - name: b3_ch07a_loyrang
    routes:
      - condition: b3_ch7_bet = 2
        texts:
          - source: scene_text
            paragraph: 38
            text: |-
              "Oh, ¿la pelea finalmente terminó?" Ahora escuchamos la voz familiar de cierto mercenario de piel oscura, que aparentemente acaba de dejar de reprimir su aura y ahora está entrando a nuestro corredor. "Gracias a los dioses. Creo que debí haber estado a sólo unos segundos de morir de aburrimiento".

              "¿Qué estás haciendo aquí, Loyrang?" le pregunta el ilusionista al guardia real de piel oscura, mientras todavía se acerca a nosotros. "Se suponía que debías ayudar a los demás a destruir la base rebelde".

              "Lo siento, ¿cómo te llamas?" Loyrang le pregunta al ilusionista, mientras mira en una dirección aleatoria donde imagina que su colega de la guardia real podría estar escondido.

              "Mi nombre es..." el ilusionista comienza a decir, pero Loyrang lo interrumpe.

              "No importa", dice Loyrang. "No vine aquí para hablar contigo de todos modos. Oye, Gontrok, tenía una pregunta para ti. ¿Tienes alguna idea de cómo podemos quitar estos extraños dispositivos debajo de nuestro cuello? He estado tratando de quitarme el mío desde ayer, pero la maldita cosa parece estar implantada en mi piel o algo así".
          - source: scene_text_2
            paragraph: 32
            text: |-
              "¿Por qué querrías quitártelo?" pregunta Gontrok. "Esos dispositivos fueron puestos allí para que el rey pueda teletransportarnos hacia él cuando esté en peligro".

              "Está bien, pero hipotéticamente hablando, si alguien quisiera que le quitaran ese dispositivo, ¿cómo lo haría?" dice Loyrang.

              "¡No puedes quitar el dispositivo!" dice Gontrok. "Ya nos dijeron esto el día en que nos convertimos en guardias reales. ¿No estaban escuchando? La única situación en la que estos dispositivos se desprenderían de su piel es si el rey muere".

              "Tenía miedo de que pudieras decir algo así...", dice Loyrang.
          - source: scene_3
            paragraph: 13
            text: |-
              "Oye, Loyrang, ¿qué te pasa?" dice Gontrok. "No estás actuando como tú mismo".

              "¿No es obvio, cretino?" dice la guardia real ilusionista. "Está planeando traicionarnos. Intentará matar al rey para poder huir de la ciudad sin ser teletransportado de regreso. ¿Ya olvidaste que él también intentó huir ayer?"

              "Cuida tu lengua", dice Gontrok. "Este es mi amigo del que estás hablando."

              "En realidad, tiene razón", dice Loyrang. "Hacer que maten al rey es exactamente lo que planeo hacer".

              "No lo estás... ¡no, no puedes hablar en serio!" dice Gontrok. "¿Por qué harías algo como esto?"
        choices:
          - position: 1
            text: Si quieres matar al rey, ¡será mejor que hagas cola! ¡Estuvimos aquí primero!
            effects:
              - set:
                  current_scene: b3_ch07a_line
          - position: 2
            text: ¡Qué coincidencia! ¡Queremos matar al rey también! ¿Por qué no unimos fuerzas?
            effects:
              - set:
                  current_scene: b3_ch07a_join
          - position: 3
            text: ¿Vas a matar al rey? ¡Perfecto! ¡Entonces menos trabajo para nosotros!
            effects:
