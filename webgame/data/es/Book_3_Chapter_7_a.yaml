  - name: b3_ch07a_busy
    texts:
      - source: scene_text
        paragraph: 30
        text: |-
          Continúo evitando los ataques de Gontrok hasta que Leila lo flanquea nuevamente desde un costado, y luego, en los pocos segundos durante los cuales él no me presta atención, trato de comunicarle rápidamente a Leila lo que quiero que haga.

          "Hola, Leila", digo. "¿Podrías intentar usar una técnica similar al masaje de tu padre con Gontrok? Básicamente, lo que necesito que hagas es unir tus dedos y presionar varios puntos de presión en la parte posterior de su cuello en lugar de presionar toda tu palma en su frente".

          "Pero... ¿cómo sería eso igual a la técnica de mi padre, entonces?..." escribe Leila, confundida, mientras Gontrok ahora se ha detenido a mirarme con los ojos muy abiertos, probablemente preguntándose si me había vuelto loca.

          "El hecho de que tengas que usar puntos de presión para afectar su aura es el mismo, pero el método es ligeramente diferente", digo. "No te preocupes, intentaré guiarte paso a paso".

          "¿Quieres darme un masaje ahora?" Me pregunta Gontrok. "¿Son estas las últimas divagaciones de un hombre que ya ha aceptado su muerte? ¿Por qué no vienes aquí para que pueda sacarte de tu miseria?"

          "¡Leila, hazlo ahora!" Digo, mientras me apresuro a atacar a Gontrok con mi daga.

          "Tu daga no funcionará conmigo, bufón", dice Gontrok, mientras lo ataco y luego retrocedo rápidamente para que no tenga tiempo de agarrar mi arma.
      - source: scene_text_2
        paragraph: 25
        text: |-
          Al mismo tiempo, Leila junta sus dedos y golpea a Gontrok en el cuello varias veces por detrás, como le dije, pero no parece tener mucho efecto en su aura.

          "¡Y darme masajes en el cuello tampoco te ayudará!" Dice Gontrok, mientras intenta agarrar a Leila nuevamente, pero ella retrocede justo a tiempo.

          "Leila, intentémoslo una vez más, pero más lento", le digo. "Te diré cuándo empezará a funcionar".

          "Ustedes dos realmente están poniendo a prueba mi paciencia..." dice Gontrok, y luego comienza a atacarme una vez más, obligándome a retroceder.

          Leila intenta interrumpir el aura del gigante unas cuantas veces más mientras lo mantengo distraído, pero finalmente no logra descubrir cómo se supone que debe modificar la técnica de su padre para darle dolor de cabeza a Gontrok, y es demasiado difícil para mí mostrarle lo que debe hacer mientras yo estoy ocupado evitando los golpes de mi oponente. Después de algunos intentos fallidos más de Leila y yo tratando de derrotar a Gontrok, de repente sentimos la presencia de un familiar mercenario de piel oscura que aparentemente ahora se está abriendo camino lentamente hacia nuestro corredor.

          "Perdón por interrumpir", dice Loyrang, en su tono casual habitual, mientras sus manos están colocadas cerca de las empuñaduras de sus dos espadas, listas para desenvainarlas si surge la necesidad. "Iba a dejarte terminar tu pelea pero estaba tomando demasiado tiempo así que me aburrí de esperar hasta el final".
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch07a_loyrang
  - name: b3_ch07a_ignore
    routes:
      - condition: combat_technique < 2
        texts:
          - source: scene_text
            paragraph: 31
            text: |-
              Decido que no debería perder el poco tiempo precioso que tengo mirando un aura y que, en su lugar, debería intentar formular un plan de ataque. Desafortunadamente, la distracción de Leila no funciona por mucho tiempo, y Gontrok pronto me ataca de nuevo con un puñetazo extremadamente rápido, haciéndome saltar hacia atrás para esquivarlo.

              Mientras una vez más estoy luchando por evitar los ataques aparentemente interminables de Gontrok, sigo tratando de encontrar una manera de vencerlo sin usar armas, pero después de pasar por todos los escenarios plausibles en mi cabeza, la única solución realista que se me ocurre es seguir evadiéndolo hasta que se rinda, ya sea por fatiga o por aburrimiento. Somos dos, así que mientras podamos conservar nuestra resistencia adecuadamente haciendo que él nos ataque por turnos, tal vez podamos lograrlo.

              Después de esquivar algunos de sus golpes más, Gontrok de repente deja de perseguirme y me lanza una mirada de total desprecio, mientras me observa esperándolo a una distancia relativamente segura.

              "¿Qué estás tratando de hacer exactamente aquí? ¿Evitar mis ataques hasta que decida dejarte en paz por aburrimiento?" dice Gontrok. "Será mejor que tomes esta pelea en serio si no quieres terminar aplastado en esa pared".

              "¿No deberías decir cosas así después de haber logrado golpearme al menos una vez?..." le pregunto a Gontrok. "No quiero ser grosero ni nada por el estilo, pero tus amenazas se sienten un poco vacías en este momento".
          - source: scene_text_2
            paragraph: 26
            text: |-
              "Te golpearé tan pronto como dejes de correr en círculos como un pollo sin cabeza", dice enojado Gontrok. "¿Qué tal si luchas como un hombre en lugar de seguir deshonrándote actuando de una manera tan cobarde?"

              "Pelearé como quiera, muchas gracias", le digo.

              "Entonces te daré la muerte que te mereces", dice Gontrok. "La muerte de un patético cobarde."

              Luego salta hacia mí y comienza a atacarme con una elaborada serie de fintas que pretenden engañar a mis reflejos demasiado sensibles para que me hagan esquivar en el momento equivocado, dejándome así vulnerable.

              Soy capaz de predecir sus fintas las primeras veces, pero eventualmente se vuelve demasiado difícil adivinar cuándo está a punto de golpearme de verdad o no, así que no tengo más remedio que comenzar a confiar exclusivamente en mis reflejos para evadir sus próximos ataques. Desafortunadamente, esto es exactamente lo que Gontrok estaba esperando, y tan pronto como me ve esquivando una de sus fintas, inmediatamente sigue con un puñetazo tan fuerte que atraviesa mi cabeza y me rompe el cráneo en un solo movimiento.
