              "Creo que prefiero dejarlo abierto por ahora", digo. "No sabemos qué pasará dentro de la torre, y preferiría que no cerráramos nuestra única ruta de escape en caso de que las cosas empeoren".

              "Muy bien, entonces dejémoslo abierto", escribe Leila.

              Le hago un gesto con la cabeza y luego comenzamos a subir las escaleras que conducen al sótano debajo de la torre del seredium. Una vez llegamos a lo alto de las escaleras, atravesamos la segunda puerta que Eiden ha dejado abierta y entramos en el mismo armario lleno de cubos y trapos mojados con el que nos tropezamos durante nuestra anterior visita a la torre.
