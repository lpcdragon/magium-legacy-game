  - name: b3_ch07a_weapons
    texts:
      - source: scene_text
        paragraph: 34
        text: |-
          Bien, probablemente solo tenga unos segundos hasta que Leila comience a atacar a Gontrok. ¿Qué podríamos hacer para derrotarlo sin usar nuestras armas? Piensa, Barry. ¡Pensar!

          "Lista cuando tú lo estés, princesa", dice Gontrok. "Comenzaré a contar los sesenta segundos tan pronto como realices tu primer ataque".

          Leila asiente y casi inmediatamente después se lanza hacia su adversario de la misma manera que lo hizo la primera vez que lo atacó, intentando degollarlo con ambas dagas. Sin embargo, a pesar de sus mejores esfuerzos, las espadas de Leila son fácilmente detenidas por la gruesa piel del gigante y ninguno de sus cortes es lo suficientemente profundo como para siquiera sacar sangre. 

          "¿Eso es todo lo que tienes?" Gontrok se burla de ella. "¡Y aquí estaba yo, esperando un desafío real! ¡Qué decepción!".

          Mientras Leila se prepara para golpearlo de nuevo, de repente se me ocurre una idea que podría funcionar, pero no lo sabré con certeza hasta que la pruebe. Probémoslo.

          Me muevo detrás de Gontrok, uno los dedos de mi mano derecha y luego los uso para golpear la nuca varias veces, mientras sigo de cerca el flujo de su aura.
      - source: scene_text_2
        paragraph: 29
        text: |-
          "¡Oye, deja de intentar pincharme el cuello, maldito imbécil!" dice Gontrok. "¿Te has vuelto loco? ¡Dije que bastara!"

          "¿Qué te pasa, Gontrok?" Escribe Leila. "¿Tienes miedo de un pequeño masaje?"

          "¡No tengo miedo de nada!" Gontrok dice furiosamente. "Él puede masajearme todo lo que quiera, pero tan pronto como pasen tus sesenta segundos, ¡está muerto!"

          Ignoro las divagaciones de Gontrok y sigo con lo que estaba haciendo. Si mi intuición es correcta, entonces si intento una variación de la técnica de masaje del padre de Leila, podría interrumpir el aura del gigante lo suficiente como para hacer que se caiga, lo que le haría perder automáticamente su apuesta con Leila ya que no tiene permitido moverse. Todo lo que necesito hacer es encontrar los puntos de presión correctos.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch07a_weapons2
  - name: b3_ch07a_weapons2
    routes:
      - condition: b3_ch7_massage <> 2
        texts:
          - source: scene_text
            paragraph: 35
            text: |-
              Desafortunadamente, esto no parece ir tan bien como esperaba. Tal vez sería una mejor idea pedirle ayuda a Leila, ya que ella claramente sabe cómo usar la técnica de su padre mejor que yo.

              "Oye, Leila, ¿podrías intentar hacer lo mismo que yo, pero desde el lado opuesto?" digo. "Estoy tratando de improvisar una versión modificada de la técnica de masaje de tu padre, pero parece que no puedo entender lo que estoy haciendo mal".

              "Pero ¿por qué... espera? Creo que entiendo lo que estás buscando", escribe Leila, mientras observa más de cerca los movimientos de mis manos. "Déjame ver si puedo descubrir cómo hacerlo correctamente".

              Luego envaina sus dagas y junta sus dedos como yo, para poder comenzar a pinchar la garganta de Gontrok con ellos.

              "Ustedes dos realmente están empezando a ponerme de los nervios, ¿lo sabían?" dice Gontrok. 

              Leila no reacciona a las palabras de Gontrok, ya que ahora centra toda su atención en su técnica. Después de algunos intentos fallidos, Leila finalmente encuentra los puntos de presión correctos y una vez que deja de mover los dedos, inmediatamente puedo sentir que el aura del gigante se vuelve completamente loca.

              "¡Puaj!" Dice Gontrok, mientras ahora se agarra la frente con ambas manos. "¡¿Qué me hicieron, bastardos astutos?!"
          - source: scene_text_2
            paragraph: 30
            text: |-
              "Bueno..." digo, mientras veo a Gontrok dar dos pequeños pasos hacia atrás para no perder el equilibrio. "Parece que lo que te hicimos es que te hicimos perder la apuesta. Se suponía que no debías moverte de ese lugar hasta que terminaran los sesenta segundos, pero te vi retroceder dos pasos hace un momento. No vas a negar eso, ¿verdad?"

              "¡Solo retrocedí dos pasos porque me engañaste!" Dice Gontrok, mientras todavía está luchando para lidiar con su dolor de cabeza. "¡Eso no fue un masaje, fue otra cosa! ¡No era parte del trato!"

              "Y aún así, antes dijiste muy claramente que no ibas a cancelar la apuesta por lo que estaba haciendo Barry", escribe Leila. "También me dijiste que podía atacar tu cuello de la forma que quisiera, no sólo con mis dagas. ¿Estás diciendo que estás incumpliendo tu palabra?"
          - source: scene_3
            paragraph: 12
            text: |-
              "¡No, por supuesto que no!" Dice Gontrok, mientras su dolor de cabeza parece estar mejorando. "¡No hay ningún honor en romper la palabra!"

              "Entonces, ¿nos dejarás ir?" Leila escribe con calma.

              "Yo... pero mis órdenes... yo no... ¡Argh! ¡Al diablo con esto!" dice Gontrok. "El hecho de que ustedes dos sean perros sin honor que recurren a pequeños trucos para ganar no significa que deba rebajarme a su nivel. ¡Un trato es un trato! Eres libre de irte. ¡Ahora sal de mi vista!"

              "¡¿Qué acabas de decir?!" De repente escuchamos la voz de la guardia real ilusionista que escuchamos discutiendo con Gontrok ayer antes de que se teletransportaran.

              Al igual que la última vez, la voz de la guardia real parece venir de todos lados a nuestro alrededor, y es imposible sentir su aura, aunque estoy seguro de que debe estar escondido de manera invisible en algún lugar de este corredor.
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch07a_loyrang
      - condition: b3_ch7_massage = 2
        texts:
          - source: scene_text
            paragraph: 36
            text: |-
              Por alguna razón, mi técnica improvisada parece estar teniendo mucho más efecto en su aura de lo que esperaba. ¡Debo ser mucho mejor en esto de lo que pensaba! Después de unos segundos más de golpearle la nuca, su aura se vuelve completamente loca, y ya puedo decir que esto está teniendo un gran impacto en el gigante por la forma en que está reaccionando.

              "¡Puaj!" Dice Gontrok, mientras ahora se agarra la frente con ambas manos. "¡¿Qué me hiciste, bastardo astuto?!"

              "Yo tampoco estoy exactamente seguro", digo, mientras veo a Gontrok dar dos pequeños pasos hacia atrás para no perder el equilibrio. "Pero lo que sí sé es que acabas de perder la apuesta. Se suponía que no debías moverte de ese lugar hasta que terminaran los sesenta segundos, pero te vi retroceder dos pasos hace un momento. No vas a negar eso, ¿verdad?"
          - source: scene_text_2
            paragraph: 31
            text: |-
              "¡Solo retrocedí dos pasos porque me engañaste!" Dice Gontrok, mientras todavía está luchando para lidiar con su dolor de cabeza. "¡Eso no fue un masaje, fue otra cosa! ¡No era parte del trato!"

