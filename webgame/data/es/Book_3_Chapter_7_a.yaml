              Después de predecir con éxito sus primeras fintas, de repente me doy cuenta de que no se trata sólo de un conjunto aleatorio de movimientos que inventó en el acto, sino de una táctica que ya existe y que conozco gracias a mi estadística de técnica de combate. Si la información que tengo es verdadera, entonces debería ser bastante fácil distinguir los ataques falsos de los reales, porque cada vez que realmente quiera golpearme, se acercará un poco más a mí para que sus golpes puedan tener más impacto. Si no lo veo intentando cerrar demasiado la brecha entre nosotros, entonces probablemente solo esté haciendo una finta. Con esta información, debería poder resistirlo el tiempo suficiente para que Leila me dé otra oportunidad. Veamos si funciona.
