              "El protocolo Supervisor no está diseñado para decir mentiras descaradas", dice el dron de ojos verdes. "Lo único que soy capaz de hacer es retener información crítica a propósito y engañar a la gente mediante la omisión de hechos importantes. Nuestro acuerdo sigue en pie. Mientras puedas conseguir que Breynan sea el rey, el protocolo Supervisor seguirá sus órdenes lo mejor que pueda".

