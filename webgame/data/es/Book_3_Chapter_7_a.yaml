      - condition: bluff >= 3
        texts:
          - source: scene_text
            paragraph: 18
            text: |-
              "Te das cuenta de que Leila no estaba mintiendo en este momento, ¿verdad?" Le digo a Gontrok. "Nuestras armas son realmente tan afiladas como la espada de Daren".

              "¿En serio pensaste que una mentira descarada como esta funcionaría... espera un minuto, qué acabas de decir?..." dice Gontrok, pareciendo de repente mucho menos confiado que antes.

              "Dije que estas armas tienen los mismos encantamientos que la espada de Daren", le respondo. "¿No debería haber sido obvio desde el principio? Somos sus compañeros de equipo y él es un encantador. Por supuesto que estaría más que feliz de encantar nuestras espadas".

              "¡No, así no es como funciona!" -dice Gontrok en un tono cada vez más inseguro. "Estos encantamientos requieren muchos recursos... ¡y tiempo! ¡Mucho tiempo! No hay manera de que él pudiera--"

              "¡Oye, hombre, siéntete libre de pensar lo que quieras!" digo. "Sólo quería advertirte, eso es todo. Diviértete con tu patética y deshonrosa muerte. Estoy seguro de que los dioses te recibirán con los brazos abiertos en sus salones de banquetes cuando sepan cómo pasaste tus últimos momentos en este plano terrestre".

              "Gontrok, prepárate", escribe Leila. "Voy a intentar cortarte la garganta primero. Asegúrate de no moverte ni un centímetro".
          - source: scene_text_2
            paragraph: 18
            text: |-
              "Vaya, ahí..." dice Gontrok, mientras ahora comienza a sudar un poco. "Dame un poco más de tiempo para pensar en esto antes de..."

              "Aquí voy", escribe Leila, y luego se lanza rápidamente hacia su adversario de la misma manera que lo hizo la primera vez que lo atacó, tratando de degollarlo con ambas dagas.

              En un momento de pánico, Gontrok se olvida por completo de su trato con Leila y salta hacia atrás, evitando por completo sus ataques. Al darse cuenta de lo que ha hecho, el gigante gira la cabeza hacia Leila, con los ojos muy abiertos, esperando ver su reacción.

              "Rompiste el trato", escribe Leila simplemente. "Se suponía que no debías moverte de ese lugar antes de que transcurrieran los sesenta segundos. Esto significa que yo gano y nos dejarás en paz. ¿Correcto?"

              "¡No!" —grita Gontrok. "¡Eso no es lo que pasó! Te dije que necesitaba más tiempo para pensar las cosas y simplemente corriste hacia mí sin siquiera--"

              "Me dijiste que necesitabas más tiempo después de que ambos habíamos acordado aceptar la apuesta", escribe Leila. "Nunca mencionaste ningún retraso en nuestro acuerdo inicial. ¿Estás diciendo que vas a incumplir tu palabra?"
          - source: scene_3
            paragraph: 9
            text: |-
              "¡No, por supuesto que no!" dice Gontrok. "¡No hay ningún honor en romper la palabra!"

              "Entonces, ¿nos dejarás ir?" Leila escribe con calma.

              "Yo... pero mis órdenes... yo no... ¡Argh! ¡Al diablo con esto!" dice Gontrok. "¡Un trato es un trato! Preferiría morir antes que perder mi honor por algo tan estúpido como esto. Eres libre de irte. ¡Ahora sal de mi vista!"

              "¡¿Qué acabas de decir?!" De repente escuchamos la voz de la guardia real ilusionista que escuchamos discutiendo con Gontrok ayer antes de que se teletransportaran.

              Al igual que la última vez, la voz de la guardia real parece venir de todos lados a nuestro alrededor, y es imposible sentir su aura, aunque estoy seguro de que debe estar escondido de manera invisible en algún lugar de este corredor.
