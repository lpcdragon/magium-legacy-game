  - name: b3_ch07a_barbarian
    texts:
      - source: scene_text
        paragraph: 47
        text: |-
          "Dejemos que un bárbaro glorificado concluya que usar una piedra para aplastar un cristal que acaba de quitarle los dedos de la existencia es una buena idea", dice Eiden. "Por favor, dímelo, Gontrok... ¿Cómo se siente saber que el único propósito significativo que tendrá tu cabeza será evitar que las gotas de lluvia caigan por tu garganta?"

          Tan pronto como Eiden se reveló, todos los cristales de la cueva que nos rodeaban comenzaron a vibrar más fuerte y con más frecuencia que antes. Están reaccionando ante él... ¿Pero por qué? ¿Es porque es un stillwater? No, no es eso. Melindra también es stillwater y nunca había visto los cristales comportarse de esta manera a su alrededor. ¿Pero entonces cuál es la razón?

          Justo cuando me hago esta pregunta, de repente recuerdo cómo Arraka mencionó en un momento que Eiden y el zorro dorado debieron haber aprendido el hechizo de creación de alimentos del propio Magium. Si Eiden y el zorro están conectados al Magium de alguna manera, entonces podría explicar por qué los cristales reaccionan así, pero ¿por qué solo vibran y no hacen nada más? ¿De qué están hechos exactamente estos cristales?

          "Entonces, fuiste tú", dice Gontrok, mientras intenta girar un poco la cabeza para poder ver a Eiden con el rabillo del ojo. "Estos cristales estuvieron reaccionando a ti todo este tiempo. Tú eres quien hace esto".
      - source: scene_text_2
        paragraph: 37
        text: |-
          "Una deducción brillante", dice Eiden, acercándose al gigante. "Ahora dime, Gontrok, ¿quién dio la orden de destruir la guarida rebelde subterránea, que resulta estar tan llena de estos cristales azules como las cavernas en las que nos encontramos actualmente? ¿Fuiste tú o el rey?"

          "El rey daba las órdenes, pero yo era quien las cumplía", dice Gontrok, y luego se ríe. "Tus preciosos rebeldes ya deben estar muertos, ¿no? Y también tus amigos intrusos. Sé que has estado tratando de ayudarlos. No soy tan estúpido. Podría decir lo que estabas haciendo incluso si el rey se negara a verlo. Pero ahora están todos muertos, excepto estos dos imbéciles, aquí. ¿Cómo te hace sentir eso? ¿Estás finalmente listo para mostrar tus verdaderos colores? ¿Vas a vengar a tus amigos y matar a los guardias reales que masacraron? ellos?"

          "Tus guardias reales ya están muertos", dice Eiden. "Los rebeldes, el rey del subsuelo y los 'intrusos' acabaron rápidamente con ellos y probablemente pronto también terminarán con las tropas que han sido enviadas tras ellos".

          "¡No, eso es imposible!" Grita Gontrok, mientras todavía sostiene su brazo sobre su cabeza con la piedra en su mano, incapaz de moverla. "¡Estás mintiendo! No puedes..."

          "Escúchame, Gontrok", dice Eiden en tono serio, mientras usa su técnica de manipulación del aura para girar a Gontrok hacia él, mientras mantiene su brazo derecho en alto para molestarlo. "No podría importarme menos si me crees o no. La única razón por la que todavía te mantengo con vida es porque todavía tengo una pregunta que hacerte. Así que dime, Gontrok, ¿el rey te ha mencionado algo sobre la tercera regla de oro?"
      - source: scene_3
        paragraph: 17
        text: |-
          "¿Regla de oro?" dice Gontrok. "¿De qué tipo de tonterías estás hablando? ¿Y qué pasa con ustedes los humanos y sus técnicas cobardes? ¿Es esto en serio lo que llaman una pelea? ¿Están planeando simplemente mantenerme inmovilizado así y atravesar mi corazón con una espada sin siquiera darme la oportunidad de defenderme? ¿Dónde está su honor?"

          "¿Honor?" dice Eiden, pareciendo genuinamente confundida. "Perdón por preguntar, pero ¿no eres tú el mismo Gontrok que era famoso por haber matado a la mayor cantidad de civiles enanos durante la última gran guerra del Continente Norte?..."

          "¿Y qué?" dice Gontrok. "¿Qué tiene eso que ver con algo?"

          "Ah, ya veo", dice Eiden. "Así que así es..."

          Luego libera a Gontrok de su técnica de aura, lo que hace que el gigante finalmente baje el brazo y suelte la roca que había estado sosteniendo hasta ahora.

          "Ahora eres libre de atacarme", dice Eiden. "No usaré ningún tipo de magia para luchar contra ti. Espero que disfrutes de tu último duelo 'honorable'".

          "No sé qué pasa por tu cabeza, pero me aseguraré de que te arrepientas", dice Gontrok.
