              "Como acabo de decir, el rey de Ollendor está muerto, al igual que la mayoría de sus guardias reales", dice el Supervisor. "Eso significa que esta ciudad ahora está bajo mi control directo. Por lo tanto, ahora es 'mi ciudad'. Por favor, pregúntame si necesitas más aclaraciones".
