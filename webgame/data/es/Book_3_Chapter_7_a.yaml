  - name: b3_ch07a_honorable
    texts:
      - source: scene_text
        paragraph: 48
        text: |-
          Luego corre hacia Eiden lo más rápido que puede, tratando de sorprenderlo con una rápida serie de golpes. Después de unos segundos de esquivar los ataques sin esfuerzo de la misma manera que esquivó a Daren durante su primer encuentro, Eiden agarra el brazo derecho de Gontrok en medio de uno de sus golpes, lo gira detrás de su espalda y luego golpea varios puntos de presión cerca de su codo en rápida sucesión.

          Inmediatamente después, Eiden presiona su palma izquierda contra la parte exterior del codo de Gontrok mientras todavía sostiene su brazo con la otra mano, y esto hace que el antebrazo del gigante se doble hacia atrás de una manera extremadamente antinatural, mientras podemos escucharlo gritar de agonía.

          "¡¿Qué me hiciste, loco bastardo?!" Gontrok dice mientras suda intensamente, con su brazo derecho colgando a su lado como un trozo de carne inútil.

          "Te di un duelo honorable", dice Eiden con frialdad, con los ojos aún cerrados. "¿No es esto lo que querías?"

          "¡Ve a ararte tú mismo, pedazo de mierda sádico!" Dice Gontrok, y luego intenta golpear a Eiden con los tres dedos restantes de su mano izquierda.

          Eiden atrapa el puño entrante con su mano derecha y luego dobla los dedos del gigante hacia atrás hasta que los escuchamos crujir. Mientras Gontrok grita de nuevo, Eiden pone su mano izquierda sobre la cabeza del gigante, haciéndolo explotar en un millón de pedazos de carne y sangre que cubren el suelo y las paredes a su alrededor. Cuando el cuerpo del gigante está a punto de caer al suelo, Eiden usa un hechizo de fuego para incinerarlo por completo, dejando solo las cenizas del otrora orgulloso guerrero llamado Gontrok.
      - source: scene_text_2
        paragraph: 38
        text: |-
          "Ahora, entonces..." dice Eiden, mientras usa un hechizo de agua para limpiar la sangre de su pijama. "¿Había alguien más que quisiera tener un duelo?"

          "No, creo que usted ha dejado su punto bastante claro", dice Loyrang, cuyo uniforme todavía está cubierto de la sangre de su antiguo colega.

          "Bien", dice Eiden, y luego comienza a dirigirse en dirección a la torre de seredium mientras lentamente se vuelve invisible nuevamente. "Ahora le haré una breve visita al rey de Ollendor. Si no llegas demasiado tarde, es posible que escuches una conversación bastante interesante. ¿Confío en que todavía sepas cómo encontrar el camino a la torre del seredium?"

          "Umm, sí", digo. "Sí, todavía conocemos el camino".

          "Muy bien", dice Eiden. "En ese caso, dejaré las puertas secretas abiertas para usted. Estaré deseando ver su próxima interacción con el Supervisor".

          "¿Qué?..." digo. "¿Por qué? ¿Qué va a pasar con el Supervisor?"

          No hay respuesta. Probablemente Eiden ya se haya ido.

          "Creo que Eiden debe haberse teletransportado a algún lugar más dentro de los túneles", digo. "Probablemente deberíamos ir tras él. Loyrang, ¿dijiste que vendrías con nosotros?"
      - source: scene_3
        paragraph: 18
        text: |-
          "En realidad, he cambiado de opinión", dice Loyrang. "Por lo que tengo entendido, el stillwater te estará esperando en la torre y, para ser sincero, preferiría estar lo más lejos posible de él". 

          "Sí, supongo que es comprensible", digo. "Nos vemos entonces."

          "Antes de irme, probablemente debería darte un último consejo", dice Loyrang. "Si te preocupa que el mago ilusionista indetectable te ataque mientras tienes la guardia baja, debes saber que no puede usar ningún hechizo ofensivo y que lo único que hace bien es ayudar a sus aliados desde las sombras lanzando ilusiones o usando hechizos para aturdir temporalmente a sus enemigos. Mientras no tenga a nadie con quien trabajar, en realidad no será una gran amenaza para ti. Solo pensé en hacértelo saber".
