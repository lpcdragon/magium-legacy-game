      - source: scene_text
        paragraph: 49
        text: |-
          "Muy bien, ¡gracias por el aviso!"

          "¡Adiós y buena suerte!" dice Loyrang.

          "Lo mismo te ocurre con lo que sea que planees hacer a partir de ahora", le digo. "Te veré."

          Después de separarnos de Loyrang y comenzar a dirigirnos nuevamente hacia la torre del seredium, Leila me escribe otro mensaje.

          "¿Adónde crees que fue Loyrang?" Lo dice la escritura de Leila. "Sólo conocemos una salida de estos túneles, y es el camino por el que vamos".

          "Ni idea", digo. "Tal vez piensa que si regresa al lugar donde fue teletransportado por primera vez, lo teletransportarán de regreso o algo así. Hablando de manera realista, a menos que sepa cómo desarmar trampas mágicas, probablemente deambulará por las cuevas sin rumbo por un tiempo y cuando se dé cuenta de que no tiene otro lugar a donde ir, terminará de regreso aquí".

          Mientras camino y hablo, continuamente giro la cabeza para examinar los cristales y ver si alguno de ellos da señales de querer atacarnos. Los cristales se han calmado un poco desde que Eiden se distanció de nosotros, pero todavía vibran lentamente, lo que significa que es probable que Eiden aún no haya abandonado los pasillos subterráneos.
      - source: scene_text_2
        paragraph: 39
        text: |-
          "Pareces estar muy preocupada por los cristales", me escribe Leila, después de ver cómo giro ansiosamente la cabeza ante cada vibración un poco más fuerte que las demás. "¿Crees que existe algún riesgo de que nos hagan lo mismo que le hicieron a Gontrok?"

          "Yo... no lo sé", digo. "Sólo parecieron reaccionar porque Gontrok intentó hacerles daño directamente, pero la última vez que sucedió algo como esto, todos fuimos atacados indiscriminadamente y no pareció importar que algunos de nosotros fuéramos simples espectadores inocentes".

          "¿Estás hablando del momento en que Arraka casi consigue que te borren de la existencia mientras estabas en el dominio de Magium?" Escribe Leila.
      - source: scene_3
        paragraph: 19
        text: '"¡Era más que eso!" digo. "Y también menos. No sé cómo explicarlo. Normalmente, cuando hablas de no existir, te imaginas que simplemente ya no estás allí, pero esto era otra cosa... A pesar de que la noción misma de mí había sido borrada del universo, todavía había una parte de mí que estaba allí. No estoy seguro de si ya sabía quién era, pero el tiempo que pasé allí en ese vacío es algo que nunca olvidaré. Se siente como si hubiera estado flotando allí durante un millón de vidas. pero al mismo tiempo también sé que en nuestro mundo no pudo haber sido más de un segundo. El mundo entero seguía parpadeando a mi alrededor, y cada vez que regresaba allí, sentía como si estuviera pasando una cantidad infinita de tiempo en el mar de la nada, aunque sé que es imposible... no es una experiencia que quisiera repetir".'
