  - name: b3_ch07a_enchantments
    routes:
      - condition: b3_ch6_coward <> 2
        texts:
          - source: scene_text
            paragraph: 13
            text: |-
              Comenzamos a correr por el túnel, pero el humo sigue cada uno de nuestros movimientos y hagamos lo que hagamos, no somos capaces de deshacernos de él. Justo cuando estamos a punto de girar en otra esquina, Gontrok pasa rápidamente junto a nosotros a una velocidad impresionante y se detiene frente a nosotros, bloqueándonos el camino.

              "Bueno, bueno, si no es la princesa de cabello plateado y su príncipe no tan encantador", dice Gontrok. "Me encantaría quedarme y charlar contigo, pero desafortunadamente el rey me ha ordenado que le lleve a la hija del calderero lessathi viva e ilesa, así que no tengo tiempo que perder. ¿Qué tal si hacemos un trato? Me entregas a la niña y te dejaré salirte con la tuya con sólo dos piernas rotas. Yo diría que es un compromiso más que razonable, considerando la alternativa..."

              Antes de que Gontrok termine lo que estaba diciendo, Leila corre muy rápidamente hacia él, apuntando ambas espadas directamente a su cuello. Gontrok instintivamente se aparta del camino, pero Leila lo ataca de nuevo, justo cuando está recuperando el equilibrio. Después de esquivar los cortes de Leila unas cuantas veces más, Gontrok se cansa de estar a la defensiva e intenta agarrarla con ambas manos.

              Al ver que su oponente finalmente está tomando represalias, Leila salta hacia atrás y luego mira a Gontrok a los ojos, mientras hace aparecer su escritura azul frente a él.

              "Pensé que debías llevarme ante el rey 'viva e ilesa'", escribe Leila. "¿Por qué te defiendes de repente?"
          - source: scene_text_2
            paragraph: 15
            text: |-
              "Cállate", dice Gontrok, después de leer los escritos de Leila. "El rey nunca dijo que no tengo permitido agarrarte e inmovilizarte. Y además, ese ataque tuyo fue solo para mostrar, ¿no? Ahora que miro mejor tus armas, ni tú ni tu guardaespaldas tienen hojas lo suficientemente afiladas como para atravesar la piel de un gigante, sin importar cuán fuertes puedan ser tus ataques".

              "¿De verdad crees que puedes saber con precisión cuántos encantamientos tiene una daga con solo mirarla?" Escribe Leila. "¿No crees que este exceso de confianza tuyo podría terminar costándote la vida algún día?"

              "¡Ja!" dice Gontrok. "Algún día, tal vez. Pero no hoy. Si crees que tienes lo necesario para matarme, entonces ¿por qué no hacemos una pequeña apuesta? Me quedaré aquí en el lugar durante un minuto completo y durante este tiempo puedes intentar degollarme, cortarme la cabeza o lo que sea. No lo esquivaré y no me defenderé de ninguna manera. Sin embargo... si todavía me quedo en pie después de que pase ese minuto, vendrás conmigo a visitar al rey por tu propia voluntad, sin oponer ninguna resistencia. ¿Qué dices?"

              "Te vas a arrepentir", escribe Leila, mirando fríamente a Gontrok mientras prepara sus dagas.

              Gontrok se ríe y luego le sonríe maliciosamente a Leila. 

              "¡Tenemos un trato, entonces!" él dice.
