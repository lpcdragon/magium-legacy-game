        paragraph: 16
        text: |-
          "¡Leila, no dejes que te provoque!" digo. "Probablemente esté tratando de engañarte de alguna manera. En su lugar, deberíamos luchar contra él juntos. ¡Estoy seguro de que podemos vencerlo si trabajamos juntos!"

          "Tal vez tengas razón", escribe Leila. "Por muy bueno que parezca este trato suyo, realmente no puedo tener ninguna garantía de que esté diciendo la verdad".

          "¿Estás insinuando que podría hacer algo tan deshonroso como romper mi palabra?" Dice Gontrok, viéndose claramente disgustado.

          "Apenas te conocemos", escribe Leila. "No tenemos ninguna razón para creer que seas más honorable que un asesino común. Todo lo que tenemos es tu palabra".

          "Muy bien, entonces", dice Gontrok. "Realmente no quería hacer esto, pero parece que no tengo otra opción. Estoy seguro de que el rey preferiría que te trajeran con una o dos muñecas rotas que nada. Debo advertirte que no te lo tomaré más con calma a partir de ahora. Prepárate".

          "Menos conversaciones. Más peleas", escribe Leila.

          "Como quieras", dice Gontrok.
