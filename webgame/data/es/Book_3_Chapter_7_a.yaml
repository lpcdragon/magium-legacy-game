  - name: b3_ch07a_dimension
    texts:
      - source: scene_text
        paragraph: 52
        text: |-
          "Creo que estoy empezando a entender por qué incluso Arraka parecía un poco conmocionado después de que regresaste de ese lugar", escribe Leila. "Entonces, ¿crees que estos cristales podrían estar conectados de alguna manera con el Magium?"

          "Sí, es la única explicación que se me ocurre que tendría sentido", digo. "Esos dedos tuvieron que haber sido eliminados de la existencia. No había señales de lesión en la mano de Gontrok, y viste cómo reaccionaron Loyrang y el ilusionista cuando se les preguntó al respecto. ¡Ninguno de los dos recordaba que, para empezar, tenía cinco dedos!"

          "Pero muchos de nosotros todavía los recordábamos", escribe Leila. "Nosotros dos lo hicimos, y también Gontrok e incluso Eiden. ¿Crees que esto significa que los cristales no lograron borrar los dedos adecuadamente de las mentes de todos por alguna razón?"

          "No, mi teoría es que todos en el mundo que conocían esos dedos se han olvidado de ellos, y que nosotros éramos la excepción", digo. "Para Gontrok, podría haber sido demasiado difícil borrar la noción de sus dedos de su mente, porque tenía demasiados recuerdos de ellos desde su nacimiento y eliminar todos esos recuerdos habría resultado en que su mente se deteriorara más allá del punto de recuperación. En el caso de Eiden, creo que podría estar conectado de alguna manera con el Magium, porque esos cristales claramente estaban reaccionando a su presencia. Eso también explicaría por qué parecía tan imperturbable después de ver desaparecer los dedos de Gontrok, porque probablemente era algo que Él ya había sido testigo algunas veces antes en el pasado."

          "¿Pero qué pasa con nosotros?" Escribe Leila.
      - source: scene_text_2
        paragraph: 40
        text: '"En nuestro caso, creo que pudo haber sido porque ambos tenemos menos sangre en las venas", digo. "Hubo un experimento que Arraka estaba realizando mientras estábamos en el territorio de Magium al que realmente no le presté mucha atención en ese momento, pero creo que podría ayudar a explicar lo que está sucediendo. Cuando estábamos presenciando el ritual de Kate en el Faro de la Esperanza, Arraka siguió tratando de llamar la atención de algunos de los lessathi que estaban a cargo del orfanato. Cuando finalmente logró que uno de ellos reaccionara a lo que estaba haciendo a pesar de estar en una dimensión completamente diferente, concluyó que todos los lessathi deben tener algún tipo de afinidad natural con el Magium, y que esto es parte de la razón por la que muchos de ellos son tan buenos fabricando estos dispositivos que requieren que entiendas la magia a un nivel muy complejo. Creo que también se debe a esta afinidad natural con el Magium que todavía podemos recordar la existencia de los dedos de Gontrok. en su mano izquierda."'
      - source: scene_3
        paragraph: 20
        text: |-
          "Eso... da algo de miedo pensar en ello", escribe Leila. "Solo el pensamiento de que hayamos experimentado una realidad completamente diferente a la de nuestros amigos a pesar de estar ahí a su lado todo el tiempo es suficiente para ponerme la piel de gallina. En este momento solo estamos hablando de dos dedos en la mano de alguien, pero ni siquiera puedo empezar a imaginar cómo se habría sentido tratar de convencer a Kate o Daren de tu existencia si el Magium realmente hubiera logrado hacerte desaparecer. Podría incluso haber comenzado a dudar de mis propios recuerdos de ti si me hubiera convertido en la última persona en este mundo en hacerlo. recuerda que incluso exististe..."

          "Tienes razón", digo. "Ni siquiera lo he considerado. Bueno, supongo que ahora tengo una razón extra para no querer quedar atrapado en ese vacío otra vez. Lo que describiste ahora es algo por lo que realmente no quisiera hacerte pasar".

          "Gracias", escribe Leila. "Si hay alguna forma en que pueda ayudar, por favor dímelo. No quisiera que te preocupes solo por estos cristales".
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch07a_vigilant
  - name: b3_ch07a_vigilant
    routes:
      - condition: b3_ch7_massage <> 2
        texts:
          - source: scene_text
            paragraph: 53
            text: |-
              "Bueno..." digo. "No es que esté haciendo mucho ahora aparte de estar ansioso, pero supongo que sería útil si estuvieras atento a los cristales del lado izquierdo mientras yo miro los del derecho. Si notas que alguno de ellos reacciona de manera extraña, dame una señal e intentaremos distanciarnos de ellos lo más rápido posible. No creo que haya mucho más que podamos hacer ahora excepto estar extremadamente atentos y esperar lo mejor".

              "Está bien", escribe Leila. "Yo haré eso".

              "¡Gracias!" digo. "Por cierto, ¿cómo está el dolor de cabeza?"

              "Es... mejor que antes", escribe Leila. "No ha desaparecido por completo, pero definitivamente no es tan malo como al principio. A este ritmo, el dolor podría desaparecer cuando lleguemos a la torre".

              "Es bueno escuchar eso", digo. "Lamento no haber podido ser de ninguna ayuda con eso después de que hiciste todo lo posible para que mi dolor de cabeza desapareciera".

              "No es un problema", escribe Leila. "Como dije, estoy acostumbrado a este tipo de cosas. De todos modos, creo que la pared de la izquierda está despejada. Si no recuerdo mal, el siguiente corredor debería tener menos cristales, por lo que probablemente no necesitaremos estar en guardia tanto como ahora. Vámonos".
          - source: scene_text_2
            paragraph: 41
            text: |-
              Después de pasar por algunos túneles más, finalmente llegamos a la puerta secreta que usamos para entrar a la torre cuando estuvimos aquí anteriormente y, como prometió Eiden, la puerta se dejó abierta.

              "¿Crees que deberíamos cerrar la puerta detrás de nosotros?" Escribe Leila, mientras entramos en el túnel oculto.

              "No estoy seguro", digo. "Si lo cerramos, entonces el ilusionista invisible probablemente ya no podrá seguirnos, pero tampoco podremos retirarnos a los túneles si algo sale terriblemente mal. Creo que Illuna tuvo que dirigir parte de su energía mágica hacia la pared para abrirla cuando estuvimos aquí la última vez, y ninguno de nosotros puede hacer eso. Sin embargo, solo necesitas tocar la pared una vez para cerrarla, así que eso es algo que al menos podemos hacer. Déjame pensarlo por un segundo".
