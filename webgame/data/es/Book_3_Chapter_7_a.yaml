  - name: b3_ch07a_relics
    routes:
      - condition: b3_ch7_door = 1
        texts:
          - source: scene_text
            paragraph: 55
            text: |-
              "Sí, probablemente deberíamos cerrarlo", digo. "No estoy del todo seguro de si el ilusionista podrá abrir la puerta o no, pero al menos debería retrasarlo".

              "Está bien, hagámoslo entonces", escribe Leila.

              Asiento y toco el interior de la pared, que vuelve a su lugar, cerrando la entrada al túnel secreto. Luego comenzamos a subir las escaleras que conducen al sótano debajo de la torre del seredium.

              Una vez llegamos a lo alto de las escaleras, atravesamos la segunda puerta que Eiden ha dejado abierta y entramos en el mismo armario lleno de cubos y trapos mojados con el que nos tropezamos durante nuestra anterior visita a la torre. Toco esta pared también, y también se desliza hacia su lugar como la anterior, sin dejar rastro de que alguna vez haya existido una puerta secreta.
          - source: scene_text_2
            paragraph: 42
            text: |-
              Mientras nos dirigimos hacia la habitación llena de gente encadenada al techo, no puedo evitar sentir los mismos escalofríos que sentí la última vez que estuve aquí, a pesar de saber exactamente lo que nos esperaba. Sin embargo, no tengo mucho tiempo para pensar en esto, porque casi tan pronto como salimos del armario, escuchamos las voces de Eiden y el rey de Ollendor provenientes de la lupa de voz atada al transceptor que está colocado en la esquina superior de la habitación, que si no recuerdo mal es el dispositivo que Billy Bob estaba usando antes para hacer anuncios a los prisioneros.

              "¡Creador, por favor comprende que no tenía intención de ir en contra de tus deseos!" dice el rey de Ollendor. "Es solo que dijiste que estabas ausente por asuntos importantes y no nos diste forma de contactarte, así que no tuve oportunidad de discutir mis planes contigo. ¡Nunca hubiera imaginado que te opondrías a la destrucción de los corredores subterráneos llenos de cristal!"

              "Sin embargo, la tercera regla de oro establece claramente que los cristales azules no deben ser manipulados", afirma Eiden. "Estas reglas de oro han existido desde que se fundó Varathia hace seiscientos años y se han transmitido de generación en generación desde entonces. ¿Seguramente debes haber oído hablar de ellas?"
          - source: scene_3
            paragraph: 21
            text: |-
              "Sí, pero... estas reglas de las que hablas... son reliquias del pasado, ¿no?" pregunta el rey, confundido. "Son regulaciones arcaicas de una época en la que los humanos y los animales todavía vivían juntos en armonía. ¡Esos tiempos ya pasaron! ¡Pensé que tú también habrías aceptado esto!"

              "Así que conocías muy bien estas reglas, pero aún así decidiste ignorarlas...", dice Eiden. "Dime, rey de Ollendor, ¿no se te ha pasado por la cabeza que había una razón por la cual el zorro y yo considerábamos estas 'regulaciones arcaicas' lo suficientemente importantes como para construir una civilización entera a su alrededor? ¿De verdad pensaste que podías simplemente ignorar las reglas de oro y no habría consecuencias? ¿No habría castigo por tus acciones?"

              "¿Castigo?" pregunta el rey, repentinamente asustado. "¡Creador, por favor, puedo explicarte!"
        choices:
