          - source: scene_text_2
            paragraph: 8
            text: |-
              Después de unos veinte segundos, empiezo a comprender finalmente cómo los movimientos de mis manos influyen en los cambios muy sutiles en el aura de Leila, y esto me ayuda a identificar mejor la fuente de su dolor de cabeza. A pesar de las instrucciones apresuradas e incompletas de Leila, logro improvisar una técnica que se acerca bastante a la que ella usó conmigo, y puedo ver cómo la expresión tensa que tenía en su rostro poco a poco se convierte en una mucho más relajada.

              "El dolor... ¡se va!" Leila escribe asombrada mientras todavía le estoy masajeando las sienes. "¡No pensé que pudieras aprender a hacer esto tan rápido! Me tomó horas de práctica lograr hacerlo bien cuando mi padre me enseñó la técnica por primera vez".

              "Probablemente sea más fácil para mí debido a mi Sentido mágico mejorado", digo. "Mientras puedas notar adecuadamente cada cambio menor en el aura, es más fácil improvisar la técnica. Dime cuando el dolor haya desaparecido por completo, así sabré cuándo parar".

              "Creo que ahora estoy bien", escribe Leila. "Aún quedan algunas náuseas, como en tu caso, pero eso no se soluciona con un masaje. Habrá que esperar a que pase solo. Vamos a seguir."

              "Está bien", digo, mientras quito mis manos de la cabeza de Leila. "Sígueme. Estoy bastante seguro de recordar hacia dónde fuimos la última vez".
