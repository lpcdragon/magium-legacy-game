      - condition: b3_ch7_tyrant = 0
        texts:
          - source: scene_text
            paragraph: 62
            text: |-
              "¿Dónde está el doctor Reidzek?" Le pregunto al rey. "Sabemos que usted fue quien lo secuestró".

              "¿No vas a matarme?" dice el rey. "¿Pensé que esa era la razón principal por la que estabas aquí?"

              "Responde la pregunta, ¿quieres?" digo.

              "...Muy bien", dice el rey, de mala gana. "El padre de tu amigo se encuentra actualmente recluido en una celda de prisión en algún lugar de esta ciudad. Sin embargo, solo yo conozco su ubicación, lo que significa que si no haces exactamente lo que te digo, el doctor Reidzek sufrirá una muerte prematura a manos de..."
          - source: scene_text_2
            paragraph: 45
            text: |-
              "En realidad, el doctor Reidzek está aquí", oímos la voz del Supervisor, mientras un dron verde entra en la habitación, seguido de cerca por el padre de Leila. "Le ofrecí liberarlo de su celda a cambio de activar algunos de mis protocolos a los que Biliborrathrathsarran siempre se negó a darme acceso, por miedo a entregarme demasiado control".

              "¡¿Hiciste qué?!" le grita el rey al padre de Leila. "¿Cómo? ¿Cómo pudiste haber considerado que darle más control al Supervisor es una buena idea?"

              "Bueno, no me dejaste exactamente con muchas opciones", dice el padre de Leila. "No querías decirme lo que le hiciste a mi hija, así que no podía arriesgarme a esperar más en esa celda. Gracias a los dioses que aparentemente está a salvo".
          - source: scene_3
            paragraph: 22
            text: |-
              "Por favor espera..." dice el dron de ojos verdes. "El protocolo Supervisor está analizando la situación actual... ¡Análisis completo! Parece que estás tratando de asesinar al rey de Ollendor. ¿Sabías que el rey tiene un dispositivo atado encima de su rodilla izquierda que lo defiende automáticamente de los proyectiles y luego dispara rayos de fuego a sus atacantes? Pista: El área en las inmediaciones del dispositivo no está protegida adecuadamente debido a la ingeniería defectuosa de Biliborrathrathsarran. Si disparas tu ballesta justo por encima de su rodilla izquierda, deberías poder destruir el dispositivo y desactivar las defensas del rey."

              "¡Máquina traidora!" dice el rey, enojado. "¡¿Es así como me expresas tu gratitud por permitirte vagar libremente por mi reino?!"

              "Tras un análisis más detallado, parece que el dispositivo que el rey utiliza para llamar a los guardias reales a su ubicación también funciona mal, posiblemente debido a que alguien lo manipuló de antemano", dice el Supervisor. "Si quieres matar al rey, ahora sería el momento perfecto, ya que no podrá llamar a sus aliados para que lo ayuden".
        effects:
