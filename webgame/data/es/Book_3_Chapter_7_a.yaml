              current_scene: b3_ch07a_pawn
  - name: b3_ch07a_pawn
    routes:
      - condition: b3_ch4_billy <> 0
        texts:
          - source: scene_text
            paragraph: 58
            text: |-
              "Cuando Eiden dijo que la recompensa del rey llegaría en unos minutos, estaba hablando de nosotros, ¿no?" Leila me escribe.

              "Lo más probable", digo. "Mira hacia allá. La puerta secreta que conduce al taller de Billy Bob ha quedado abierta de par en par. Eiden prácticamente nos está invitando a atravesar ese túnel y matar al rey".

              "Si ese es el caso, entonces probablemente deberíamos darnos prisa antes de que el rey abandone la habitación o pida refuerzos", escribe Leila.

              "Tienes razón", digo. "Vámonos."

              Pasamos junto a todos los prisioneros, entramos en el túnel oculto y luego subimos otro tramo de escaleras hasta llegar al taller en el que nos topamos con Billy Bob cuando anteriormente llegamos a esta torre.

              Tal como esperábamos, el rey todavía está dentro de la habitación y, hasta donde sabemos, parece ser el único aquí. Sus guardias no están a la vista.
          - source: scene_text_2
            paragraph: 44
            text: |-
              "Ah, entonces ustedes son los que el Creador envió para entregar mi castigo", dice el rey, cuando nos ve entrar al taller. "Debe haber sido muy divertido para él, enviar a los mismos asesinos de mi hermano a asesinarme. Dado que Gontrok no está contigo, ¿debo entender que ya te has ocupado de él?"

              "Sí, Gontrok está muerto", digo.

              "Esto es realmente desafortunado", dice el rey. "Era un peón útil. Muy fácil de manipular. Pero eso es suficiente charla. Has venido aquí con un propósito, ¿no? Continúa. Golpéame. Mata a este 'tirano malvado' de una vez por todas".
