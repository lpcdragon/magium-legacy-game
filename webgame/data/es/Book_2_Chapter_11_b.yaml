  - name: b2_ch11b_fatigue
    routes:
      - condition: ch11_saved_rose = 1
        texts:
          - source: scene_text
            paragraph: 34
            text: |-
              "¿Cuántos siguen dentro de sus rituales?", me pregunta Daren. "¿Solo Kate y Rose?"

              "Sí, solo Kate y Rose", digo. "Se nota por los ojos brillantes. Creo que tenemos que esperar a que todos terminen con la primera fase antes de poder pasar a la siguiente."

              "No puedo decir que me entusiasme", dice Daren. "¿Dónde está el Dios del Tiempo? ¿Sigue observándonos?"

              "No, volvió al plano mágico", digo. "Según Arraka, regresará otra vez al final del ritual."

              Mientras Daren y yo hablábamos, Kate consiguió salir también de su trance, pero la expresión que tiene ahora en la cara duele verla. Dejando de lado los fuertes sentimientos de tristeza y arrepentimiento que se perciben fácilmente a simple vista, creo que es sobre todo la resignación que tiene en los ojos lo que realmente muestra hasta qué punto la ha destrozado este ritual. Al darse cuenta de que ya no está sola, Kate cambia enseguida la expresión de su rostro por una de puro agotamiento extremo y nos hace las mismas preguntas que Daren me hizo hace unos momentos.

              "¿Todos los demás ya han terminado su ritual?", dice Kate. "¿Y dónde está el Dios del Tiempo? Creía que se suponía que debía supervisar estas pruebas hasta el final."
          - source: scene_text_2
            paragraph: 23
            text: |-
              "Todos hemos terminado nuestros rituales, salvo Rose", dice Daren. "Por lo visto, el Dios del Tiempo volvió al plano mágico y solo regresará al final."

              "Si eso es verdad, quizá podamos trazar algún plan contra él", dice Kate. "Tal vez encontremos una forma de sabotear su ritual mientras no está aquí vigilándonos..."

              "No se pueden sabotear los rituales...", dice Melindra. "Eiden lo intentó y fracasó en el pasado. Si él no pudo, ¿cómo íbamos a poder nosotros?"

              "Eiden no lo sabe todo", dice Daren. "Que él fracasara no significa que nosotros vayamos a fracasar."

              "¿Ah, sí?", dice Melindra. "¿Y cómo propones empezar ese 'sabotaje'?"

              "Ya... se nos ocurrirá algo...", dice Daren.
          - source: scene_3
            paragraph: 21
            text: |-
              "Como tú digas", dice Melindra.

              Daren y Melindra no llegan a continuar su discusión, porque Rose también acaba justo entonces de terminar su ritual y sus ojos dejan de brillar con aquella luz. Sin embargo, cuando la miramos vemos que sigue clavando la vista al frente sin fijarse en nosotros, solo que en vez de tener una expresión vacía en la cara como antes, parece completamente horrorizada.

              "Rose...", dice Daren, muy preocupado. "¿Te encuentras bien?"

              Rose no da ninguna señal de haberlo oído y sigue mirando al frente sin decir una sola palabra.
