  - name: b2_ch11b_development
    texts:
      - source: scene_text
        paragraph: 18
        text: |-
          "¿Kate?...", dice Meridith. "¿Te refieres a tu mejor amiga del Faro, de la que una vez me hablaste?"

          "¡Permítame explicarlo, Lady Meridith!", dice el lessathi barbudo.

          Luego señala a Kate con un odio puro en los ojos.

          "¡Esta... rechazada intentaba interferir con nuestro proceso de reeducación!", dice el lessathi.

          "¿Reeducación?...", pregunta Meridith.

          "¡Exacto!", dice el lessathi. "Esos cuatro huérfanos que están allí han quebrantado nuestras normas y deben ser reeducados para que no vuelvan a causarnos problemas. ¡Pero esta rechazada intentaba darnos órdenes! Nos decía que no teníamos derecho a llevarnos a los huérfanos."

          "¿Qué es exactamente este... proceso de reeducación del que no dejas de hablarme?", dice Meridith.
      - source: scene_text_2
        paragraph: 13
        text: |-
          "El proceso de reeducación es una medida extrema que aplicamos contra aquellos a quienes pillamos intentando quebrantar nuestras normas más de una vez", dice el lessathi. "A todos los infractores se los llevará a una sala especial y allí serán torturados repetidamente durante unos meses hasta volverlos completamente obedientes. Las técnicas de lavado de cerebro que utilizamos son de la máxima calidad y están pensadas para garantizar que se erradique hasta la última pizca de libre albedrío, dejando intacto su intelecto para que sigan siendo capaces de entender y obedecer nuestras órdenes. Los niños que pasan por el proceso de reeducación suelen dejar de relacionarse por completo con sus compañeros y casi nunca hablan, salvo que nosotros les hagamos una pregunta directamente. En otras palabras, se convierten en los sujetos de prueba perfectos. Nuestra técnica de reeducación se ha ido refinando con los años y estamos muy orgullosos de los resultados que nos ha dado, sobre todo en los últimos meses."

          "¿Te atreves a decir todo esto delante de mí?", dice Meridith, con una expresión furiosa en los ojos. "¿Y además me presentas estas barbaridades como si fueran algún tipo de logro digno de elogio? ¿Qué demonios les pasa? ¡Todos estos son niños! ¿Cómo es posible ser tan cruel? Cuando vi cómo se llevan a cabo los experimentos en este lugar, ya empecé a tener mis dudas, ¡pero nunca pensé que llegarían tan lejos!"
      - source: scene_3
        paragraph: 11
        text: |-
          "Pero, Lady Meridith...", dice el lessathi barbudo. "El señor Heksol ya aprobó--"

          "¡No me importa lo que el señor Heksol haya aprobado o dejado de aprobar!", dice Meridith. "Quiero todos sus nombres. Y quiero una lista de todos sus procedimientos. Tráiganmelos ahora mismo. Si vuelvo a ver más 'técnicas' dementes como esta escritas en su documentación, las tacharé todas y, si alguna vez se atreven a usarlas otra vez, no responderán solo con su trabajo, sino con su vida, ¿lo entienden?"

          "Sí, señora...", dice el lessathi, de mala gana. "Le traeré los documentos de inmediato."

          "¡Y el resto de ustedes!", dice Meridith, mirando a los demás lessathi. "Quiero escuchar ahora mismo su versión de la historia. Más les vale no omitir ningún detalle importante. No creo que quieran hacerme enfadar todavía más."

          "Vaya, eso sí que ha sido un giro interesante...", dice Arraka. "¿No es Meridith la líder actual de los lessathi? Me pregunto cuánto habrá cambiado su forma de dirigir las cosas desde que asumió el mando..."
