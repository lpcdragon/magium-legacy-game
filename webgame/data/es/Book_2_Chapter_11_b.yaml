  - name: b2_ch11b_treatment
    texts:
      - source: scene_text
        paragraph: 17
        text: |-
          "¡No!", grita Kate de repente, alzando la voz. "¡No pueden llevárselos! ¡No han hecho nada malo!"

          Cuando miro a Kate, veo que por fin ha conseguido dejar de temblar y que ahora tiene una expresión mucho más decidida en el rostro. Todas y cada una de las personas de la sala están mirando ahora a Kate, mientras el lessathi barbudo se acerca despacio a ella.

          "¿Qué acabas de decir?...", dice el lessathi barbudo con calma en cuanto llega a su lado.

          "¡He dicho que no han hecho nada malo!", dice Kate, con una voz algo más temblorosa. "Lo único que querían era escapar de este lugar infernal. ¿Cómo pueden culparlos por querer eso?"

          "Qué extraño...", dice el lessathi. "No recuerdo que antes fueras lo bastante valiente como para plantarles cara. De hecho, te recuerdo como alguien muy tímida y obediente. Tu aura también parece distinta de como la recordaba. Me pregunto qué habrá podido pasar para causar un cambio tan grande en tu personalidad... Quizá deberíamos intentar diseccionarte para averiguarlo. Después de todo eres una rechazada. No es como si tu muerte fuera a suponernos una gran pérdida."
      - source: scene_text_2
        paragraph: 12
        text: |-
          "¡No, déjela en paz!", grita Diane desde el otro lado de la sala, mientras una lágrima le corre por la mejilla. "¡No se atreva a tocarla!"

          "¿Y esto qué se supone que es?...", dice el lessathi barbudo, volviéndose ahora hacia Diane. "¿Algún tipo de rebelión? ¿Crees que vas a recibir trato especial solo porque seas una de nuestras guardaespaldas de élite? ¿O es que olvidaste que no puedes lanzar magia con ese collar alrededor del cuello, a menos que nos dé la gana permitírtelo?"

          Entonces se acerca más a Diane y la agarra del pelo para obligarla a mirarlo directamente a los ojos.

          "¿Crees que estás fuera de nuestro alcance solo porque escoltas habitualmente a nuestros grandes líderes?", dice el lessathi. "¿Crees que ya no tienes que preocuparte por nuestros castigos? Quizá deberíamos enviarte a ti también a la sala cincuenta y uno para reeducarte. Estoy seguro de que a los líderes no les importaría tener una sirvienta más obediente..."
      - source: scene_3
        paragraph: 10
        text: |-
          "¡¿Qué significa esto?!", oímos gritar a una mujer justo cuando entra en nuestro pasillo y avanza deprisa hacia el lessathi barbudo.

          La lessathi que ha gritado parece rondar el final de la treintena, con el pelo castaño largo y ojos verdes, y lleva una túnica azul oscuro igual que todos los demás lessathi de la sala. La escoltan dos hombres lessathi, ambos armados.

          "Lady Meridith...", dice el lessathi barbudo, soltando de inmediato a Diane. "Creía que usted y nuestro señor Heksol ya habían terminado su inspección del Faro..."

          "El señor Heksol se marchó temprano esta mañana", dice Meridith. "Pero yo aún tenía algunos asuntos pendientes aquí, así que decidí quedarme un poco más. ¿Qué estaba haciéndole ahora mismo a mi guardaespaldas leal?"

          "¡Lady Meridith!", dice Diane con voz temblorosa. "¡Estaban intentando matarla! ¡Intentaban matar a Kate! Dijeron que querían diseccionarla para averiguar por qué se atrevió a plantarles cara."
