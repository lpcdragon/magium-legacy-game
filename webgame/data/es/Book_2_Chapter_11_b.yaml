        texts:
          - source: scene_text
            paragraph: 22
            text: |-
              "¡Ah!", dice Arraka. "Creo que ya lo entiendo. Lo que necesita hacer para completar el ritual es dejar de intervenir y permitir que ese cuidador rescate solo a los niños que consiguió salvar en la línea temporal original. Supongo que va a tardar un rato en darse cuenta... Muy bien, pasemos a la escena siguiente."

              Entonces nos transportan a la habitación de Diane, donde vemos a Kate intentando una vez más convencer a su amiga de que conoce información del futuro y de que pueden escapar juntas del Faro.

              "No es la primera vez que me envían atrás...", dice Kate. "Puedo demostrarte que vengo del futuro. Sé exactamente cuándo traerán los cuidadores la comida y qué desayunaremos. Sé cuándo se pondrá en contacto con nosotros el cuidador que quiere ayudarnos a escapar y sé lo que va a decir. Sé muchas cosas. Y también sé que Olivia es una informante de los lessathi... No podemos dejar que se entere de nuestro plan de fuga o se lo dirá de inmediato. Yo voy a intentar convencer a los demás por mi cuenta, pero tú tienes que ser quien se lo cuente a tu hermano. Él no confiará en nadie más..."

              "Si de verdad vas en serio con todo eso que has dicho", dice Diane, "entonces dame una lista de todo lo que sabes y yo me aseguraré de dársela a Jason cuanto antes. Estoy segura de que estará mucho más dispuesto a tomarte en serio si ve las pruebas con sus propios ojos."

              "No te preocupes", dice Kate. "Tendrás la lista. Voy a asegurarme de que esta vez todo salga bien. ¡No volveré a fallar!"
          - source: scene_text_2
            paragraph: 15
            text: |-
              "¡Oh, volverá a fallar!", dice Arraka. "No tengas la menor duda. A ver si podemos acelerar un poco esto, porque todavía quedan muchos intentos de rescate por revisar."

              Entonces empezó a mostrarme los acontecimientos clave que vinieron después, excepto que esta vez todas las acciones se resumían de forma mucho más sucinta para poder dar una imagen más amplia de conjunto.

              En los primeros intentos, Kate se centró en dos cosas: poner a los hermanos elementalistas de su lado e intentar convencer a los demás huérfanos para que siguieran su plan de fuga sin que Olivia llegara a enterarse.

              Cada vez que la arrojaban de nuevo atrás en el tiempo, Kate intentaba convencer a Diane y a su hermano de que venía del futuro contándoles cosas muy concretas que iban a ocurrir antes de que sucedieran. Eso bastaba para convencer a Diane, pero Jason siempre se mostraba escéptico, por muchos detalles que ella les diera, y pensaba que o bien estaba usando trucos para averiguar la información o bien estaba teniendo una suerte descomunal con sus conjeturas.
          - source: scene_3
            paragraph: 13
            text: |-
              Convencer a los demás huérfanos para que siguieran su plan de rescate resultó todavía más difícil, porque no podía arriesgarse a contarles sus viajes en el tiempo por miedo a que entregaran esa información a los lessathi. Como en realidad no podía aportar ninguna prueba auténtica de que el cuidador lessathi que intentaba ayudarlos fuera de verdad digno de confianza, los niños solo se volvían más desconfiados cada vez que ella insistía en que no había nada de qué preocuparse. Por eso, al final del día, Kate o bien era delatada a los lessathi por uno de los huérfanos, o bien simplemente era enviada atrás en el tiempo sin haber hecho ningún progreso notable.

              Kate necesitó muchos intentos para encontrar por fin una forma de poner a todos de su lado y ejecutar su plan de fuga sin fallos, pero lo que no sabía era que aquello no era más que el principio de su prueba, porque salvar a los huérfanos era justo lo contrario de lo que necesitaba hacer si quería completar su ritual.

              "Vaya...", digo, mientras ahora vemos a Kate luchar por encontrar una salida a su bucle temporal. "No esperaba que repitiera el ritual tantas veces. Debe de haber pasado al menos unas cuantas semanas en este lugar, si no más. ¿Cuánto tiempo ha pasado en el mundo real mientras Kate hacía todo esto?"

              "Probablemente solo unos minutos o así", dice Arraka. "El tiempo fluye de forma completamente distinta en cada uno de los mundos a los que los enviaron. El enano, la chica muda y el revenant ya terminaron sus rituales. El sanador, en cambio, sigue liado con el suyo."
