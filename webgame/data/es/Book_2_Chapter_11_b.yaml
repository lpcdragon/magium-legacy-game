    routes:
      - condition: b2_ch11_skip2 = 0
        texts:
          - source: scene_text
            paragraph: 14
            text: |-
              "Entonces ¿qué tal si nos llevas al comienzo real de la reunión de los lessathi?", digo. "Ya hemos perdido bastante tiempo aquí."

              "Sí, estaba a punto de hacerlo", dice Arraka.

              Entonces acelera el tiempo hasta que el último de los lessathi llega por fin al pasillo para reunirse con sus compañeros. Una vez que todos están reunidos, la reunión empieza por fin.

              "Tal vez todos se pregunten por qué los hemos llamado aquí...", dice un lessathi de pelo gris y una larga barba gris que parece rondar el final de la cincuentena. "Intentaré ser breve. Hemos recibido información de que algunos de ustedes han sido abordados por cierto individuo que se ofrecía a ayudarlos a escapar de nuestras instalaciones. Como todos saben, las normas estipulan que, si alguien les hiciera una oferta así, estarían obligados a notificárnoslo de inmediato. Por desgracia, no solo no se ha cumplido debidamente esta norma, sino que además se han dado algunos casos en los que ciertos niños accedieron a escapar. Ni que decir tiene que estamos muy decepcionados. Por lo tanto, esta reunión se ha convocado por dos razones principales."
          - source: scene_text_2
            paragraph: 10
            text: |-
              El lessathi que está hablando ahora se acerca al lessathi encapuchado que está de rodillas y se detiene justo detrás de él.

              "La primera razón es castigar al traidor que intentó ayudarlos a escapar", dice el lessathi barbudo.

              Entonces le agarra la cabeza con ambas manos y se la retuerce hacia un lado, partiéndole el cuello de un solo movimiento y matándolo en el acto. Cuando Kate ve el cuerpo sin vida del cuidador lessathi caer al suelo, casi deja escapar un jadeo, pero se tapa rápidamente la boca para ahogar el sonido. Más allá, hacia la mitad de la fila de huérfanos, una versión de ocho años de Leila, con el mismo pelo plateado, contempla toda la escena petrificada por el miedo.

              "La segunda razón", continúa el lessathi barbudo, "es dar una lección a todos aquellos que accedieron a unirse a este traidor en su plan de fuga. Ya sabemos quiénes son, pero vamos a darles una última oportunidad de demostrar que no son un caso perdido del todo, permitiéndoles entregarse por su propia voluntad. Aquellos que sepan que son culpables de haber aceptado la oferta del traidor deben venir de inmediato aquí, al lado de los lessathi. Si hacen lo que les pedimos, su castigo será menos severo. Si intentan engañarnos, sin embargo, la pena será muchísimo peor..."
          - source: scene_3
            paragraph: 8
            text: |-
              Tras unos segundos de espera, un niño de seis años y una niña de diez se apartan lentamente de la fila de huérfanos y van a reunirse con los lessathi que tienen delante. La niña tiene una expresión de puro terror en el rostro, y el niño está a punto de romper a llorar.

              "Han hecho bien en venir aquí", dice el lessathi barbudo, apoyando las manos sobre los hombros de ambos. "Asumir la responsabilidad por sus errores es un paso importante en su reeducación. Sin embargo, no son los únicos que estaban dispuestos a abandonar este lugar junto con el traidor. Todavía sigo esperando a que los demás se entreguen. Les aseguro que no les conviene en absoluto hacerme esperar mucho más..."

              Mientras toda la sala permanece en silencio, veo que el cuerpo entero de Kate está temblando ahora de forma incontrolable por el miedo, mientras se abraza a sí misma con los brazos en un intento inútil de dejar de tiritar. Tras esperar unos diez segundos más, el lessathi niega con la cabeza, desaprobando la situación.

              "Esperaba que no llegáramos a esto...", dice el lessathi. "Muy bien, entonces. Si insisten en desobedecernos incluso ahora, no me dejan más opción que decir yo mismo sus nombres. Antes que nada, me gustaría presentarles a la persona que ha desempeñado el papel más crucial para que pudiéramos encontrar a todos los culpables. Olivia, ¿quieres dar un paso al frente?"
        choices:
