  - name: b2_ch11b_test
    texts:
      - source: scene_text
        paragraph: 9
        text: |-
          "¿De qué clase de prueba estás hablando?"

          "Estoy intentando ver si alguno de esos lessathi es capaz de percibir nuestra presencia", dice Arraka. "Llevo los últimos minutos intentando llegar hasta ellos a través de una miríada de frecuencias mágicas, pero todavía no he tenido suerte. Si mi teoría es correcta, el hecho de que ahora mismo estemos conectados al Magium debería hacer posible que nos detecten, aunque técnicamente no existamos en su propio mundo. Puede que esté enfocándolo de la manera equivocada, eso sí. Déjame probar otra cosa."

          De repente, tres payasos aparecen de la nada justo entre los lessathi y la fila de huérfanos, y empiezan a bailar en el sitio imitando los movimientos de unos gorilas, con enormes sonrisas en la cara.
      - source: scene_text_2
        paragraph: 7
        text: |-
          "Ahí estamos", dice Arraka. "Esto debería animar un poco el ambiente. Pero aun así siento que falta algo. Oye, Flower, ¿por qué no vas a bailar un rato con esos payasos? Ya vas vestida para el papel, así que lo único que tienes que hacer es imitar sus movimientos."

          "¡No llevo ropa de payaso!", grita Flower, furiosa. "¿Cuántas veces tengo que explicártelo? ¡Esto es ropa de acróbata! ¡Es el mismo tipo de ropa que usaba en Olmnar cuando actuaba como trapecista en el circo!"

          "Ajá", dice Arraka. "Seguro que sí. Ahora sé buena chica y ve a bailar con tus semejantes de ahí para que podamos--"

          "¿Has sentido eso?...", le pregunta uno de los lessathi a uno de sus compañeros.

          "¿Sentir qué?", pregunta el otro lessathi.

          "Ha habido algún tipo de... presencia extraña justo delante de nosotros, hace un momento...", dice el primer lessathi. "Sentí como si ni siquiera perteneciera a este mundo. ¡Como si ni siquiera existiera! ¿Entiendes a qué me refiero?"

          "Bueno, si no existe, quizá no deberíamos preocuparnos por ello, ¿no te parece?", dice el otro lessathi. "Se me ocurre una idea. ¿Qué tal si dejas de molestarme con tonterías y esperas a los demás en silencio, como todo el mundo?"
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch11b_warning
  - name: b2_ch11b_direct
    texts:
      - source: scene_text
        paragraph: 10
        text: |-
          "¿Por qué tendrían los lessathi acceso directo al Magium?"

          "Están aliados con los reyes de Varathia, ¿recuerdas?", dice Arraka. "Incluso ayudaron con la organización de este torneo. Si los reyes tienen acceso al Magium, entonces ellos también."

          "Ah, claro, se me había olvidado", digo. "Entonces ¿qué clase de prueba estabas planeando exactamente?"

          "Estoy intentando ver si alguno de esos lessathi es capaz de percibir nuestra presencia", dice Arraka. "Llevo los últimos minutos intentando llegar hasta ellos a través de una miríada de frecuencias mágicas, pero todavía no he tenido suerte. Si mi teoría es correcta, el hecho de que ahora mismo estemos conectados al Magium debería hacer posible que nos detecten, aunque técnicamente no existamos en su propio mundo. Puede que esté enfocándolo de la manera equivocada, eso sí. Déjame probar otra cosa."

          De repente, tres payasos aparecen de la nada justo entre los lessathi y la fila de huérfanos, y empiezan a bailar en el sitio imitando los movimientos de unos gorilas, con enormes sonrisas en la cara.
