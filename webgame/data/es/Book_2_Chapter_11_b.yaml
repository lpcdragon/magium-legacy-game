          La joven esclava no hace más que acercarse cada vez más hasta que finalmente llega junto a Rose y le agarra ambas manos, mirándola directamente a los ojos con una expresión desesperada y suplicante en el rostro.

          "Por favor, tienes que ayudarme...", dice la esclava. "Mi amo me está buscando. Va a entrar en este callejón enseguida y no puedo dejarlo atrás corriendo. Pero si me escondo en esta tienda abandonada y tú le dices que me viste ir por el otro lado, quizá te crea. No tengo a nadie más a quien pedírselo. Eres mi única esperanza. Por favor, no me abandones..."

          Mientras la esclava hablaba, Rose negaba con la cabeza una y otra vez, con lágrimas en los ojos, mientras seguía mirando impotente a la chica que le hablaba. Cuando la joven terminó por fin de decir lo que tenía que decir, Rose se dio cuenta de que se le había acabado el tiempo, así que apartó las manos de la esclava y se secó sus propias lágrimas con la manga. Luego se obligó a dibujar una sonrisa amable en la cara mientras tomaba con suavidad las manos de la esclava y le juntaba las palmas.
      - source: scene_3
        paragraph: 16
        text: |-
          "No deberías estar haciendo esto", dice Rose, mientras sigue sujetando las manos de la esclava. "Como esclava, tu deber es seguir sirviendo a tu amo por muy duramente que te trate. Cada uno de nosotros tiene su propio propósito en la vida, y no podemos simplemente huir de él cuando las cosas se ponen demasiado difíciles. Los esclavos son una parte importante de nuestra sociedad y deberías sentirte orgullosa de la contribución que haces al progreso de nuestra civilización. No te preocupes, no te soltaré las manos hasta que tu amo venga aquí a por ti. Estoy segura de que luego me lo agradecerás, cuando hayas tenido ocasión de calmarte y pensar en todo esto de una manera más racional."

          Con cada nueva frase que pronunciaba, la voz de Rose se volvía más y más temblorosa y sus ojos volvían a humedecerse, pero de algún modo consiguió mantener esa misma sonrisa forzada durante todo su discurso. La esclava se limitaba a mirarla con incredulidad todo el tiempo, aferrándose a la esperanza de que todo pudiera ser solo una broma cruel. Cuando se dio cuenta de que Rose hablaba en serio, empezó a intentar zafarse desesperadamente, pero estaba demasiado debilitada para poder escapar del agarre de Rose.

          "¡No!", grita la esclava mientras sigue intentando liberarse. "¡Suéltame! No lo entiendo... ¿Cómo puedes ser tan cruel? No te he hecho nada y aun así... y aun así..."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch11b_commendable
  - name: b2_ch11b_commendable
    texts:
      - source: scene_text
        paragraph: 29
        text: |-
          "¡Ahí está!", grita un hombre vestido con ropas extravagantes al entrar en el callejón y ver a la joven esclava. "La encontré. ¡Vengan aquí y ayúdenme a capturarla!"

          Respondiendo a la llamada del noble, otros dos hombres que parecen ser sus secuaces entran también en el callejón y luego los tres se dirigen hacia Rose y la esclava.

          "¡Suéltame las manos!", llora la esclava, mientras sus intentos de apartarse se vuelven más violentos que antes. "¡Te lo suplico! No puedo volver allí... Me va a matar. Tienes que entenderlo. ¡Tienes que hacerlo!"

          En cuanto el noble llega junto a la chica, Rose le suelta las manos y el hombre tira de la esclava del brazo con tanta violencia hacia sí que bien podría haberle dislocado el hombro en el proceso.

          "Espero que te hayas divertido", le dice el noble a la esclava con una expresión de furia en los ojos, "porque después de lo que has hecho hoy voy a esperar que aceptes tu castigo sin ofrecer ni la más mínima resistencia. ¿Lo entiendes?"

          "Sí, señor...", dice la esclava con una voz muy apagada, mientras todo su cuerpo tiembla de miedo.

          "Bien", dice el noble.

          Luego se vuelve hacia Rose.
      - source: scene_text_2
        paragraph: 20
        text: |-
          "¡Muchas gracias por su ayuda!", dice el noble. "Quién sabe adónde habría ido a parar esta esclava si usted no la hubiera retenido."

          "Oh, no hace falta que me lo agradezca", dice Rose, todavía sonriendo, aunque está a punto de echarse a llorar. "Todos deberíamos hacer cuanto podamos por ayudar a nuestros conciudadanos cuando lo necesiten."

          "Lo siento, esto debe de haber sido una experiencia muy aterradora para usted", dice el noble al ver a Rose al borde del llanto. "Tome, permítame recompensarla por sus esfuerzos."

          "¡No!", dice Rose al ver que el noble saca una bolsa llena de monedas de oro del bolsillo. "No busco ninguna recompensa. Solo hice lo que creí correcto..."

          "¡Qué encomiable!", dice el noble con una mirada llena de respeto en los ojos mientras vuelve a guardarse la bolsa de oro en el bolsillo. "Es raro ver a alguien con unos valores morales tan elevados hoy en día. Haga lo que haga, recuerde no soltar nunca esos principios, porque son esos principios los que de verdad nos hacen humanos."

          "Sí, señor, lo recordaré...", dice Rose.
      - source: scene_3
        paragraph: 17
        text: |-
          "¡Muy bien!", dice el noble. "En ese caso, nos retiraremos y dejaremos de molestarla. ¡Adiós, y gracias una vez más!"

          "Adiós...", dice Rose, mientras ve al noble arrastrar a la esclava tras él hasta salir del callejón junto con sus hombres.

          "¡Ja, ja, ja, ja, ja!", dice Arraka. "¿Oíste eso? ¿Oíste lo que le dijo a esa esclava? Madre mía, no puedo creer que de verdad pensara así hace seis años. ¿Hasta qué punto se puede tener el cerebro lavado? ¡Y luego estaba ese noble con su discursito sobre los principios! No puedo más. ¡Ja, ja, ja, ja, ja!"

          Mientras Arraka sigue riéndose, hay un destello repentino de luz y luego todos somos transportados al interior de una mansión lujosa, donde el noble de antes está ahora moliendo a golpes a su esclava hasta matarla sin la menor piedad. La joven esclava está tendida en el suelo sin moverse ni decir nada mientras la golpean, y Rose está justo allí delante de ella, en forma semitransparente, viendo cómo se desarrolla la escena ante sus ojos con una expresión horrorizada en el rostro.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch11b_reunion
  - name: b2_ch11b_reunion
    texts:
      - source: scene_text
        paragraph: 30
        text: |-
          "Vale, creo que por fin estoy llegando a alguna parte con nuestro plan de escape", dice Arraka. "Denme unos segundos y yo--"

          "¿Barry? ¿Illuna?...", oímos decir a Rose al darnos cuenta de que ahora nos está mirando directamente.

          "¿Puedes vernos?", pregunto, conmocionado, mientras también fijo la vista en los ojos de Rose.

          "Ah, claro, se me había olvidado", dice Arraka. "Se pasa la mitad del ritual en su forma semitransparente, así que prácticamente está en el mismo mundo que nosotros ahora mismo. Eeeen fin, siento interrumpir este reencuentro, pero por fin tenemos la salida despejada y no pienso desaprovechar esta oportunidad. Más vale que se preparen para unas náuseas bien fuertes, porque nuestro confort va a ser lo último que me importe mientras salgamos de este lugar."
      - source: scene_text_2
        paragraph: 21
        text: |-
          Cuando Arraka termina de hablar, de repente me sobreviene un fuerte dolor de cabeza y luego todos volvemos a nuestro mundo real en un abrir y cerrar de ojos. Una vez regresamos a nuestros cuerpos normales, ya no transparentes, miramos a nuestro alrededor y vemos que seguimos en medio del mismo bosque en el que estábamos cuando comenzaron nuestros rituales, junto a todos nuestros amigos. Parece que el tiempo sigue congelado en este mundo y que no todos han conseguido salir todavía de su trance. Los que han terminado sus rituales aparte de nosotros parecen ser Melindra, Leila y Hadrik, que nos están mirando, mientras Daren, Kate y Rose aún siguen mirando fijamente al frente con los ojos brillando con esa luz amarilla.

          "Lo conseguimos...", dice Arraka, sonando a la vez sorprendida y aliviada. "¡Lo conseguimos! Salimos de allí con vida. ¡Ja, ja, ja, ja, ja! ¡Toma esa, Magium, hijo de puta!"

          "¿Te importaría no burlarte del Magium cuando técnicamente seguimos plantados justo en su misma puerta?", dice Illuna.
      - source: scene_3
        paragraph: 18
        text: |-
          "¡Relájate!", dice Arraka. "Todo está bajo control. Los saqué de allí con vida, ¿no? Y además, ni siquiera lo estaba insultando. Le estaba haciendo un cumplido al tratarlo como si fuera una persona de verdad."

          "Actúas como si ya hubieras olvidado lo que puede pasar cuando ignoras mis advertencias...", dice Illuna con tono serio. "¿Quizá te gustaría que te lo recordara un poco devolviéndonos al mundo del que acabamos de escapar?"

          Parece que la pregunta de Illuna deja a Arraka completamente callada. Tras unos segundos más de espera a que responda, Illuna continúa.

          "Sabes que puedo hacerlo", dice. "Después de todo, fuiste tú quien me enseñó todo lo que sé..."

          "¡Vale, tú ganas!", dice Arraka con un tono algo presa del pánico. "Me callaré, ¿de acuerdo? Era solo un poco de regodeo, nada más... ¡No hace falta que te pongas así!"

          "¿Arraka sonando asustada?", dice Hadrik con una sonrisa, aunque la expresión incómoda que tiene en los ojos deja claro que sigue afectado por lo que sea que vivió en su ritual. "Eso sí que no se ve todos los días."
