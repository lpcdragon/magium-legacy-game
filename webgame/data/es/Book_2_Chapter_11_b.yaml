  - name: b2_ch11b_secretly
    texts:
      - source: scene_text
        paragraph: 16
        text: |-
          "Sí, señor", dice Olivia con una voz muy tímida, mientras se une a los lessathi y luego se gira para mirar a los demás huérfanos.

          Cuando ve a su amiga Olivia reunirse con sus enemigos mortales, Kate se queda congelada por la conmoción durante un instante y acto seguido los temblores que ya tenía se vuelven mucho más violentos.

          "Olivia lleva ya bastante tiempo sirviéndonos en secreto como informante", dice el lessathi barbudo. "Sin embargo, hasta ahora no ha producido muchos resultados dignos de mención. En el pasado le dijimos que, si alguna vez conseguía hacer una aportación importante a nuestra causa, consideraríamos darle un papel más relevante dentro de nuestra organización y, con la ayuda que nos ha prestado hoy, puede que por fin consiga ese puesto. En resumen, su amiga Olivia vino hoy a advertirnos sobre el traidor y también a advertirnos de que podría haber otros dispuestos a unirse a él. Después aceptó llevar un transceptor consigo y mantenerlo abierto para que pudiéramos oírla hablar con el traidor y con todos los niños que dijeron querer sumarse al plan de fuga. Como ya tenemos todas las pruebas que necesitamos, esperamos que vengan tranquilamente al frente, sin ofrecer resistencia alguna, en cuanto se digan sus nombres."

          Luego tose con fuerza antes de continuar.

          "Tenemos cuatro nombres en nuestra lista", dice el lessathi. "William, Hannah, Lillian y Matthew. Por favor, no nos hagan perder más tiempo fingiendo que no nos han oído llamarlos. Creo que todos sabemos lo que les ocurre a quienes intentan desobedecernos abiertamente..."
      - source: scene_text_2
        paragraph: 11
        text: |-
          Los cuatro huérfanos cuyos nombres se acaban de decir avanzan ahora con los ojos puestos en el suelo. Cuando se detienen delante de los lessathi, vemos que todos tiemblan de miedo, pero no dicen ni una sola palabra.

          "Bien", dice el lessathi. "A partir de mañana, todos serán enviados a la sala cincuenta y uno para comenzar su proceso de reeducación. ¿Ha quedado claro?"

          "¡No, por favor, no la cincuenta y uno!", grita un chico de trece años, uno de los cuatro huérfanos llamados por los lessathi. "¡Cualquier cosa menos eso! ¡Tengan piedad, se lo suplico!"

          "No cometas el error de suponer que tienes voz alguna en este asunto", dice el lessathi barbudo. "Cada queja que hagas a partir de ahora solo añadirá más tiempo al castigo de los cuatro. Así que dime, ¿tienes alguna queja más?"

          "No, señor...", dice el chico con una voz que suena a un paso de echarse a llorar.
      - source: scene_3
        paragraph: 9
        text: |-
          "Espléndido", dice el lessathi. "Y ahora, Olivia, me gustaría hacerte una última pregunta. ¿Había algún otro huérfano que quisiera conspirar con el traidor? Quizá alguno de los niños con los que hablaste antes de venir a vernos para obtener el transceptor."

          Cuando le hacen la pregunta, Olivia lanza una mirada brevísima hacia Kate por puro instinto, pero luego vuelve a mirar recto al frente.

          "No, señor...", dice Olivia. "No había nadie más."

          "Muy bien", dice el lessathi. "Puedes tener la seguridad de que tus esfuerzos serán recompensados. Puede que seas una rechazada, pero incluso alguien como tú tiene un sitio en nuestra organización, siempre que sigas demostrando que eres útil."

          "Sí...", dice Olivia con una voz muy apagada. "Eso es todo lo que siempre he querido. Ser útil..."

          "Llevemos a estos traidores a una celda provisional hasta que hagamos todos los preparativos necesarios", dice el lessathi, dirigiéndose ahora a sus colegas. "Mañana comenzaremos su proceso de reeducación."
