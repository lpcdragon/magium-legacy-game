              "Como tú digas", dice Melindra.

              "Si están buscando sabotear el ritual, quizá yo pueda ofrecerles algo de ayuda", oímos decir de pronto a Rose.

              Habíamos estado ignorando al revenant hasta este punto, pero en cuanto habló todos volvimos los ojos hacia ella.

              "¿Y por qué íbamos a querer ayuda de ti, revenant?", dice Daren con tono de asco.

              "Porque este ritual me supone tantos problemas a mí como a ustedes", dice el revenant. "...Y también porque, por mucho que haya intentado evitarlo, hay rastros de su amiga Rose dentro de mí que siempre formarán parte de lo que soy. Como mínimo, sé que Rose habría querido que cooperáramos pese a nuestras diferencias, porque nada le habría importado más en esta situación que asegurarse de que ustedes están a salvo."
