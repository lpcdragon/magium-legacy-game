  - name: b2_ch11b_afterwards
    texts:
      - source: scene_text
        paragraph: 28
        text: |-
          "¿Y qué hay de los casos en que luego no les pasó nada realmente malo a los esclavos?"

          "Estoy bastante segura de que esos simplemente se los saltan", dice Arraka. "No sería un espectáculo muy interesante si no cortaran las partes aburridas, ¿no te parece?"

          "¿Pero qué pasa si se le olvida lo que les dijo a esos esclavos?", digo. "¿El ritual seguiría para siempre?"

          "Nah", dice Arraka. "Este ritual tiene acceso a sus recuerdos, así que sabe exactamente qué recuerda y qué no. Si se trata de algo enterrado muy hondo en su subconsciente y que no quiere recordar, probablemente la obligarán a recordarlo, pero si solo es cuestión de no saber ya las palabras exactas que usó, seguramente no suponga gran diferencia. Al fin y al cabo, el propósito de este ritual es maximizar su sufrimiento, no tocarle las narices sin más."

          "Supongo que tiene sentido", digo.

          No mucho después de que dejemos de hablar, una chica de dieciocho años vestida con ropa sucia y gastada entra en el callejón y parece estar cojeando de la pierna derecha. A juzgar por el aspecto de su ropa y su pelo rubio y descuidado, lo más probable es que sea una esclava, pero no veo a su amo por ningún sitio. ¿Puede ser que haya huido y ahora esté buscando un lugar donde esconderse?

