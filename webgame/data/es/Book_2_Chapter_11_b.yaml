    routes:
      - condition: ch11_saved_slave <> 3
        texts:
          - source: scene_text
            paragraph: 31
            text: |-
              "Si crees que ahora está asustada, deberías haberla visto antes..."

              "Bueno, que me aspen...", dice Hadrik. "Ahora estoy empezando a lamentar no haber estado con ustedes en su ritual. El mío fue aburrido en comparación."

              "En realidad no era nuestro ritual, era--", empiezo a decir, pero Arraka me interrumpe.

              "¡Oh, dices que tu ritual fue aburrido!", dice Arraka en voz alta, ahogando la mía. "¿Seguro que no estás intentando ocultar algo? Porque, por lo que yo recuerdo de tu ritual, fue cualquier cosa menos aburrido..."

              "¿Qué sabes tú de mi ritual?...", dice Hadrik, mientras vuelve a aparecer esa incomodidad en sus ojos.

              "Más de lo que crees, enano", dice Arraka. "Y no hablo solo de tu prueba con el Dios del Tiempo. También estuve revisando algunos de tus recuerdos, ya que estaban prácticamente a la vista mientras estabas atrapado allí dentro. Vi cosas muy interesantes mientras repasaba los recuerdos relacionados con tu ritual. ¿Quieres que te cuente lo que descubrí?"
          - source: scene_text_2
            paragraph: 22
            text: |-
              "Estás faroleando", dice Hadrik, mientras veo que empieza a sudar un poco. "Solo estás intentando tenderme una trampa para que sea yo quien suelte la información. ¿Tan estúpido crees que soy?"

              "Bueno, no sé, enano...", dice Arraka. "¿Cuánto de estúpido eres?"

              Durante unos segundos más, ambos permanecen completamente callados, mientras Hadrik observa con intensidad el amuleto de Arraka y algunas gotas más de sudor se le forman en la frente.

              "Pero hablando en serio, solo estaba bromeando", dice Arraka de repente. "No tengo absolutamente ni idea de lo que pasaba en tu ritual. La única razón por la que dije todo eso es que me molestaste y quería hacerte sudar como un cerdo. ¿Quién es el que se está poniendo nervioso ahora, eh? ¡Ja- ja, ja, ja, ja!"

              "Vieja bruja infernal...", dice Hadrik, relajándose un poco.

              "Entonces de verdad no llegaste a ver el ritual de Hadrik, ¿no?", le pregunto a Arraka.
          - source: scene_3
            paragraph: 19
            text: |-
              "Nah", dice Arraka. "Eran demasiados como para que me diera tiempo a verlos todos. En fin, está bastante claro que su ritual tampoco fue todo arcoíris y rayos de sol, pero supongo que tendremos que esperar a que le apetezca contárnoslo si queremos averiguar qué fue. Personalmente no me importa tanto. No es que no tengamos nada mejor que hacer a estas alturas que escuchar su historia lacrimógena, ¿sabes lo que quiero decir?"

              No mucho después de que terminemos nuestra conversación, los ojos de Daren pierden su brillo amarillo y por fin sale también de su trance. Por la expresión que tiene en la cara, me resulta facilísimo ver que está bastante afectado.

              "Oh, miren, ¡el sanador ha salido!", dice Arraka. "¿Qué tal, Daren? ¿Te divertiste en tu ritual?"

              Daren decide ignorar por completo la pregunta de Arraka y se vuelve hacia mí en su lugar.
