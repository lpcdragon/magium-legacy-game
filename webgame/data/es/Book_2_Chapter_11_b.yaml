              Kate necesitó muchos intentos para encontrar por fin una forma de poner a todos de su lado y ejecutar su plan de fuga sin fallos, pero lo que no sabía era que aquello no era más que el principio de su prueba, porque salvar a los huérfanos era justo lo contrario de lo que necesitaba hacer si quería completar su ritual.

              "Vaya...", digo, mientras ahora vemos a Kate luchar por encontrar una salida a su bucle temporal. "No esperaba que repitiera el ritual tantas veces. Debe de haber pasado al menos unas cuantas semanas en este lugar, si no más. ¿Cuánto tiempo ha pasado en el mundo real mientras Kate hacía todo esto?"

              "Probablemente solo unos minutos o así", dice Arraka. "El tiempo fluye de forma completamente distinta en cada uno de los mundos a los que los enviaron. El enano y la chica muda ya terminaron sus rituales. El sanador y la herborista siguen ocupados con los suyos."
