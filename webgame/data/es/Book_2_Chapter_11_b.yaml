scenes:
  - name: b2_ch11b_collars
    texts:
      - source: scene_text
        paragraph: 2
        text: |-
          "¿Leila?...", susurra Diane en respuesta. "¿Te refieres a la chica lessathi que metieron aquí con nosotras hace dos años? Escucha, aunque ese cuidador esté intentando de verdad ayudarnos a escapar, sigues olvidando una cosa."

          Diane se señala entonces el cuello, donde lleva un collar como los que el zorro dorado usó contra nosotros.

          "Mientras Jason y yo sigamos llevando estos collares, no vamos a poder salir de aquí", dice Diane. "Si nos alejamos demasiado de este lugar, los collares nos electrocutarán, y ese será el final de nuestra fuga. Pero tú no llevas collar. Eres una de las rechazadas. Si de verdad confías en ese hombre, entonces podrías--"

          "¡No!", dice Kate, casi gritando por error. "¡Siempre haces eso! Siempre intentas poner las necesidades de tus amigos por encima de las tuyas. ¡No voy a dejar que lo hagas ahora! Podemos escapar todos juntos. Tú, yo, Leila, tu hermano..."

          "No estoy segura de hasta qué punto Jason estaría de acuerdo con este plan", dice Diane. "Ya sabes cómo es. No confía en nadie. Sobre todo si son lessathi. Ya era así incluso antes de que supiéramos lo de la prueba de lealtad. Apenas intercambia palabra con los lessathi de alto rango a los que nos envían a escoltar con regularidad. La única con la que parece llevarse bien es esa mujer... Meridith. Su segunda al mando. No sé qué le ve. Siempre me dice que es distinta a los otros lessathi de alto rango, pero para mí son todos iguales. Todos saben lo que pasa aquí. No son ciegos. Todos son culpables."
      - source: scene_text_2
        paragraph: 2
        text: |-
          "¡Diane, escúchame!", dice Kate. "Ese cuidador es muy hábil manipulando dispositivos mágicos. Estoy segura de que podría encontrar la manera de liberarte de los collares. Hablaré con él de esto en cuanto tenga ocasión, pero necesito que encuentres la forma de convencer a tu hermano para que venga con nosotras. ¿Puedes hacerlo?"

          "Me estás pidiendo mucho, Kate...", dice Diane. "Si le cuento a Jason tu historia de que has venido del futuro, pensará que me he vuelto loca. Ni siquiera estoy segura de cuánto me creo yo lo que dices. Quiero decir... ¿segura que no pudo haber sido algún tipo de alucinación? Últimamente nos han estado alimentando fatal, y--"

          "¡No!", dice Kate. "¡Es real! Dentro de un año van a cerrar el Faro por falta de fondos, y luego nos van a arrojar a todos los rechazados a la jungla para que nos las apañemos solos. No fui capaz de salvar ni a uno solo de ellos... ¡No puedo dejar que vuelva a pasar! Tengo que encontrar una forma de convencer a todos. Solo prométeme que intentarás hablar con tu hermano. No hace falta que le digas que vengo del futuro. Solo intenta encontrar la manera de hacerle entrar en razón. Como sea..."
      - source: scene_3
        paragraph: 2
        text: |-
          "Lo... intentaré...", dice Diane, vacilante.

          "Gracias", dice Kate. "Volveré a hablar contigo después de hablar con el cuidador sobre los collares. Seguro que podremos encontrar alguna solución. ¡Nos vemos pronto!"

          "Muy bien", dice Arraka, mientras Kate sale de la habitación. "He echado un vistazo rápido a los acontecimientos que siguen y creo que se puede saltar la siguiente parte sin problema. Voy a--"

          "Espera", digo. "¿De qué va la siguiente parte?"

          "Oh", dice Arraka, "solo es un rollo poco interesante sobre ella hablando con el cuidador y él confirmando que es posible quitarles los collares. Es una pérdida de tiempo."
    choices:
      - position: 1
        text: ¡Pero quiero verlo!
        effects:
          - set:
              current_scene: b2_ch11b_skip1
              b2_ch11_skip1: 0
