              b2_ch11_skip1: 1
      - position: 3
        text: ¿Podrías enseñarme la conversación de Diane con su hermano en su lugar?
        effects:
          - set:
              current_scene: b2_ch11b_skip1
              b2_ch11_skip1: 2
  - name: b2_ch11b_skip1
    routes:
      - condition: b2_ch11_skip1 = 0
        texts:
          - source: scene_text
            paragraph: 3
            text: |-
              "¡Pero quiero verlo!"

              "Vale, como quieras...", dice Arraka. "Pero luego no digas que no te avisé."

              El paisaje a nuestro alrededor vuelve a cambiar y ahora estamos en otra celda, que parece ser la habitación de Kate. Kate es la única que está dentro de la celda y, por lo que alcanzo a ver, en este momento está hablando con una persona que se encuentra al otro lado de su ventana. No puedo verle la cara porque está escondido detrás de la pared, pero solo puedo suponer que se trata del lessathi al que Leila se refiere como su padre.

              "Esos collares van a ser complicados de manejar", oigo decir al cuidador, "pero debería poder quitarlos con las herramientas adecuadas. Sin embargo, llevará tiempo y no puede hacerse mientras se organiza una fuga. Lo que sí podría hacer en su lugar es desactivar sus efectos de electrocución hasta que salgamos de aquí sanos y salvos. Seguirían sin poder usar su magia, pero lo importante es que no morirán al salir del Faro."
          - source: scene_text_2
            paragraph: 3
            text: |-
              "¡Sí, eso es exactamente lo que necesitamos!", dice Kate. "¡Gracias! También quería hablarte de otra cosa. Deberías dejar de contarles a los demás huérfanos tu plan de fuga. Ya nos engañaron antes con alguien que hizo una oferta parecida, y por culpa de eso muchos ahora se muestran reacios a confiar en cualquiera de los cuidadores. Si no tienes cuidado, alguien va a delatarte ante los altos mandos y el plan de fuga quedará arruinado. Tengo un plan para convencerlos de que confíen en ti, pero necesitaré algo de tiempo. Vuelve mañana y hablaremos más."

              "Muy bien", dice el lessathi. "Ahora debo marcharme para ocuparme de mis tareas diarias. Volveremos a hablar mañana."

              "¡Por fin!", dice Arraka. "Pensé que no se iban a callar nunca. Ahora pasemos a los acontecimientos que de verdad importan."
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch11b_olivia
      - condition: b2_ch11_skip1 = 1
        texts:
          - source: scene_text
            paragraph: 4
            text: |-
              "Supongo que será mejor saltárselo, entonces."

              "Buena elección", dice Arraka. "Larguémonos de aquí."
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch11b_olivia
      - condition: b2_ch11_skip1 = 2
        texts:
          - source: scene_text
            paragraph: 5
            text: |-
              "¿Podrías enseñarme la conversación de Diane con su hermano en su lugar?"

              "Supongo...", dice Arraka. "No tengo del todo claro lo relevante que va a ser, pero al menos no debería ser una pérdida de tiempo total."

              En vez de cambiar el paisaje, esta vez seguimos en la misma habitación, pero Diane ya no está donde estaba antes y parece que tiene un nuevo visitante. Esta persona, que en este momento está hablando con Diane, es un chico de unos dieciocho o diecinueve años, con el pelo corto y rubio, que supongo que será su hermano Jason. Su físico en conjunto no impresiona demasiado, pero la mirada que tiene en los ojos es mucho más madura de lo que cabría esperar de un chico de su edad. Parece el tipo de persona que confía mucho en sus propias capacidades y sabe exactamente lo que quiere. Igual que su hermana, también lleva un collar alrededor del cuello y viste harapos.

              "Diane", dice Jason, "ya te he dicho muchas veces que deberías tomarte con pinzas todo lo que te dice Kate. Sé que es tu mejor amiga, pero esa chica confía demasiado en la gente para su propio bien. Cuando depositas tanta confianza en los demás, duele mucho más cuando al final te traicionan. Ya verás: algún día la traicionarán de una manera tan brutal que no volverá a querer confiar en nadie nunca más, y cuando eso ocurra no podrás decir que no te lo advertí..."

              "Entonces ¿qué me estás diciendo?... ¿Que debería ser más como tú?", dice Diane. "Desde que te conozco nunca has confiado en nadie más que en ti mismo. ¿En qué es eso mejor?"
          - source: scene_text_2
            paragraph: 4
            text: |-
              "Oye, no digas cosas así...", dice Jason. "Sabes que siempre he confiado en ti. Aunque el mundo entero nos traicione, tú y yo seguiremos manteniéndonos fieles el uno al otro hasta el final. Esa fue la promesa que hicimos justo antes de que nos asignaran por primera vez como guardaespaldas de élite de los lessathi, hace tres años. Sí que recuerdas esa promesa, ¿verdad?"

              "¡Claro que sí!", dice Diane. "Pero ¿TÚ la sigues recordando? Llevo años diciéndote que Meridith es mala noticia y que deberías mantener las distancias con ella, ¡pero nunca me escuchas! ¿Por qué estás tan dispuesto a confiar en ella cuando nunca has confiado en nadie en toda tu vida?"

              "¡Nunca dije que confiara en ella!", dice Jason. "Es solo... un medio para un fin. Eso es todo. Y además, no es como los demás lessathi. Tiene potencial para cambiar las cosas a mejor. Lo único que necesita es un pequeño empujón en la dirección adecuada. Ya hay muchos lessathi que la apoyan. Yo incluso diría que ahora mismo son más los que la apoyan a ella que los que apoyan al gran líder, Heksol. No es casualidad que haya llegado a ser la segunda al mando. Cuando empezó, no era más que una secretaria de poca monta de Heksol, pero lleva veinte años ascendiendo puestos y haciendo muchos amigos por el camino. Te lo digo yo, pronto se avecina un gran cambio en el mundo lessathi, y quiero estar justo en el centro de todo cuando ocurra."
          - source: scene_3
            paragraph: 3
            text: |-
              "Sabes que no me gusta cuando hablas así...", dice Diane. "Yo creía que nuestra meta era escapar de este lugar. ¿Por qué iba a importarnos el mundo lessathi y cómo cambian las cosas a mejor? Que se pudran, por mí. Yo solo quiero librarme de esta pesadilla para que podamos vivir el resto de nuestras vidas en paz juntos. Los tres."

              "¡Y así será!", dice Jason. "Lo que estoy haciendo es por el bien de todos nosotros. Kate incluida. Ya lo entenderás cuando seas mayor."

              "¡Siempre dices eso!", dice Diane. "¿Y qué hay del plan de Kate con respecto al cuidador lessathi? ¿Vas al menos a planteártelo?"

              "Lo... pensaré", dice Jason. "En fin, tengo que irme. Si me quedo demasiado tiempo aquí, los guardias empezarán a pensar que estamos tramando algo. ¡Cuídate!"

              "Bueno, eso ha sido, eh... interesante", dice Arraka. "En fin, volvamos a lo que de verdad tiene algo de relevancia para este ritual."
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b2_ch11b_olivia
  - name: b2_ch11b_olivia
    texts:
      - source: scene_text
        paragraph: 6
        text: |-
          En cuanto Arraka deja de hablar, nos transportan a otra habitación, donde Kate está hablando con una chica de pelo castaño claro que parece rondar los quince años. Igual que Kate y Diane, va vestida con ropa vieja y andrajosa, pero lleva el pelo menos descuidado y parece cuidar mucho más su aspecto físico que las otras dos chicas. También tiene una sonrisa agradable y una forma carismática de hablar, lo que me hace pensar que es de las personas que se llevan bien con todo el mundo con facilidad.

          "Por favor", dice Kate. "Eres la única que puede ayudarme. Los demás huérfanos nunca me escuchan, ¡pero estoy segura de que a ti sí te escucharán! Siempre has tenido don de palabra y todo el mundo confía en tu criterio. Eres casi como una líder, en cierto modo."

          "¡Me halagas, Kate!", dice la chica. "Pero no es nada fácil lo que me estás pidiendo. ¿No recuerdas lo que pasó la última vez que decidimos confiar en uno de los cuidadores? Los lessathi eligieron matar solo a uno de nosotros entonces para dar ejemplo, pero podría haber sido cualquiera. No tenían ninguna razón para escoger a Benjamin entre todos nosotros. No destacaba en nada. Ni siquiera dijo una sola palabra. Pero siguieron golpeándolo y golpeándolo delante de nosotros, y no paraban. Incluso después de que ya estuviera muerto, seguían sin parar. Si intentamos escapar otra vez y nos atrapan, no creo que vuelvan a conformarse con matar solo a una persona. Esta vez nos matarán a todos y no mostrarán ninguna piedad..."
      - source: scene_text_2
        paragraph: 5
        text: |-
          "¡Van a intentar matarnos de todos modos!", dice Kate. "Las dos somos rechazadas. Cuando por fin terminen de experimentar con nosotras, nos arrojarán a la jungla y nos dejarán morir."

          "¡No podemos seguir siendo rechazadas para siempre!", dice la chica, aunque veo con claridad que se está mintiendo a sí misma. "Quizá algún día seamos como tu amiga Diane y su hermano y nos dejen escoltar a lessathi importantes en lugar de seguir experimentando con nosotras una y otra vez. Si no hemos muerto en los experimentos después de tanto tiempo, ¡entonces todavía tiene que haber una posibilidad!"

          "No va a pasar, Olivia", dice Kate. "No podemos limitarnos a esperar a que las cosas mejoren. Tenemos que tomar cartas en el asunto. Por favor, ¡confía en mí! Seguir el plan del cuidador es nuestra única oportunidad real de escapar de este infierno. No va a traicionarnos como hizo el anterior. Aún podemos salir de aquí con vida, ¡pero necesito tu ayuda!"

          Olivia empieza a calmarse después de oír lo que Kate tenía que decir y, de pronto, se le dibuja una expresión muy decidida en los ojos.
      - source: scene_3
        paragraph: 4
        text: |-
          "Lo entiendo, Kate", dice Olivia. "Sabes que siempre he sido tu amiga. Si estás dispuesta a depositar tanta confianza en este hombre, yo creeré en ti y en tu criterio. Intentaré convencer a tanta gente como pueda, pero no puedo prometerte nada. Luego te diré cómo ha ido."

          "¡Muchísimas gracias!", dice Kate, con expresión aliviada. "También hablaré con Diane y le contaré lo que has dicho. Hablaremos más cuando tengas algo nuevo que contarme. ¡Hasta luego!"

          "¡Adiós!", dice Olivia, recuperando la agradable sonrisa de antes, y entonces Kate se dispone a salir de la habitación.

          "Vale, esta siguiente parte va a estar muy bien", dice Arraka. "¡Prepárate!"

          El entorno a nuestro alrededor vuelve a cambiar, pero esta vez nos encontramos en un pasillo subterráneo enorme, donde alrededor de un centenar de huérfanos están alineados y erguidos, mirando a unos cuantos hombres vestidos con túnicas azul oscuro que tienen delante. Supongo que los hombres de las túnicas azules son los lessathi que dirigen este lugar, pero lo extraño es que todos están de pie salvo uno, que ahora mismo está de rodillas, con la capucha cubriéndole la cara y la cabeza inclinada.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch11b_malnourished
  - name: b2_ch11b_malnourished
    routes:
      - condition: b2_ch11_skip1 = 2
        texts:
          - source: scene_text
            paragraph: 7
            text: |-
              Todos los huérfanos visten el mismo tipo de harapos grises y la mayoría tienen un aspecto tan cansado que parece como si este lugar les hubiera chupado la vida. También parecen muy desnutridos y algunos tienen moretones por todo el cuerpo. Las edades de los huérfanos no parecen superar los diecinueve años ni bajar de los cuatro, aunque la mayoría rondan entre los seis y los quince. Los únicos huérfanos que no están alineados con los demás son Diane y su hermano. En vez de eso, están cerca de los lessathi, probablemente por su condición de guardaespaldas.

              Los lessathi están hablando entre ellos en ese momento, pero los huérfanos permanecen completamente callados y esperan con impaciencia a que empiece la reunión. Por lo que parece, los lessathi siguen esperando a que lleguen uno o dos compañeros más antes de anunciarles a todos el motivo por el que los han llamado aquí.

              "¿En serio?...", le digo a Arraka después de que esperemos unos diez segundos más. "¿No podías habernos traído un poco más cerca del comienzo de la reunión? ¿Cuánto más se supone que vamos a tener que esperar aquí?"
          - source: scene_text_2
            paragraph: 6
            text: '"Deja de quejarte", dice Arraka. "Nos traje aquí un poco antes porque hay algo que estoy intentando comprobar. Llevo tiempo dándole vueltas a una teoría sobre los lessathi y la razón por la que son tan buenos fabricando dispositivos mágicos, y quiero ver si es cierta o no. La idea principal es que creo que poseen algún tipo de comprensión innata de la verdadera naturaleza del Magium, lo que les da la capacidad de alterar el aura de un objeto de una manera más precisa que la mayoría de los demás inventores. Pero es algo más que simplemente conocer la naturaleza del Magium. Fyron también conoce su naturaleza y tiene una forma de acceder a ella, pero su bastón no puede compararse con los artefactos mágicos que los lessathi son capaces de inventar. Es casi como si, con los años, hubieran desarrollado alguna clase de afinidad natural con el Magium, lo bastante sutil como para que no pueda detectarla cuando estudio sus auras. Si de verdad ese fuera el caso, también podría explicar por qué no tienen magia alguna en sus auras. Si sus auras resonaran tan intensamente con el Magium, su subconsciente tendría que estar siendo bombardeado constantemente con información, lo que les haría imposible mantener cualquier tipo de conexión con el plano mágico."'
          - source: scene_3
            paragraph: 5
            text: |-
              "Bueno, ¡ahora mismo la que ME está bombardeando con demasiada información eres tú!", digo. "¿Qué quieres decir con que los lessathi tienen un aura que resuena con fuerza con el Magium? ¿Acaso yo no soy lessathi también? O medio lessathi, lo que sea. ¿Estás intentando decirme que he llevado el Magium conmigo todo este tiempo? ¡Porque desde luego yo no lo siento así!"

              "Claro que no", dice Arraka. "¿Qué clase de lógica es esa? ¿No dijeron exactamente los organizadores del torneo que te darían 'acceso' al Magium si ganas? Eso no tiene nada que ver con tener simplemente afinidad hacia él. Dejando de lado el hecho de que probablemente recibes mucha menos información del Magium que un lessathi normal por ser medio humano, casi toda esa información te resulta completamente inútil porque no tienes forma de procesarla. En cambio, si tuvieras una manera de acceder directamente al Magium desde el plano terrenal, entonces esa afinidad natural tuya se volvería de pronto mucho más útil. Los lessathi de este continente YA tienen acceso directo al Magium. Por eso una afinidad con él les resultaría útil. Pero, de nuevo, todo esto no deja de ser una teoría hasta que haga mi prueba."
        choices:
          - position: 1
            text: ¿De qué clase de prueba estás hablando?
            effects:
              - set:
                  current_scene: b2_ch11b_test
          - position: 2
            text: ¿Por qué tendrían los lessathi acceso directo al Magium?
            effects:
              - set:
                  current_scene: b2_ch11b_direct
          - position: 3
            text: ¿Cómo crees que los lessathi pudieron quedar vinculados al Magium de forma subconsciente?
            effects:
              - set:
                  current_scene: b2_ch11b_subconsciously
      - condition: b2_ch11_skip1 <> 2
        texts:
          - source: scene_text
            paragraph: 8
