    texts:
      - source: scene_text
        paragraph: 19
        text: |-
          "Yo diría que no mucho, por lo que hemos oído de Golmyck."

          "¿Por qué?", dice Arraka. "¿Porque fomentan la esclavitud? Ya te das cuenta de que la esclavitud no se considera gran cosa por estos lares, ¿no? La mayoría la trata como una parte normal de la sociedad. Cuando hablaba de un cambio en la gestión, me refería a la clase de prácticas que de verdad necesitan ocultarse al público, como la tortura y el lavado de cerebro que están llevando a cabo en este 'Faro de Esperanza'."

          "Bueno, estoy bastante seguro de que nunca hicieron un segundo Faro, así que al menos tenemos eso, supongo...", digo.

          "Arraka", dice Illuna, "¿no crees que deberíamos centrarnos en salir de aquí en vez de estar teniendo conversaciones casuales?"

          "SÍ me estoy centrando en salir", dice Arraka. "La única razón por la que sigo con el ritual es para calmarme los nervios mientras intento trazar un plan de escape."

          "¿Por qué no podemos simplemente salir por donde entramos?", dice Illuna.

          "¡Porque no estoy segura de que sea seguro!", dice Arraka. "Normalmente saldría de aquí tan campante y sin pensármelo dos veces, pero precisamente este descuido mío es lo que nos metió en este lío en primer lugar. Ahora lo estoy comprobando todo dos y tres veces. Mientras nos quedemos aquí, estamos bien, pero si intentamos salir sin tomar precauciones, puede que alertemos al Magium por error."
      - source: scene_text_2
        paragraph: 14
        text: |-
          "¿Crees que las salidas podrían estar preparadas con trampas?", dice Illuna.

          "¡No lo sé!", dice Arraka. "Ya no estoy segura de nada. Yo pensaba que el Magium se suponía que permanecía en un estado de hibernación constante, a menos que intentaras meterte con cosas realmente importantes, como aquella vez que Memphir me desterró del plano mágico. ¡No pensaba que fuera a despertarse solo porque yo intentara revelar su verdadera naturaleza! Y ahora que lo he despertado, no sé cuánto tiempo seguirá despierto ni hasta dónde llegan realmente sus capacidades. Vamos a seguir observando rituales todo el tiempo que haga falta, hasta que pueda estar completamente segura de que el camino de salida está despejado."

          "Está bien, vale...", dice Illuna. "Haz lo que creas mejor."

          Mientras hablábamos, Meridith acababa de terminar de interrogar a los lessathi y los estaba despachando.
      - source: scene_3
        paragraph: 12
        text: |-
          "Cuando vean al cuidador que me estaba trayendo los documentos, díganle que venga a mi despacho temporal", les dice Meridith a los lessathi que ahora se marchan de la sala.

          Luego se vuelve hacia sus guardaespaldas lessathi.

          "Adelántense", les dice. "Ahora mismo voy con ustedes."

          Mientras sus guardaespaldas se van por donde vinieron, Meridith se acerca a Kate y se inclina para hablarle en voz baja al oído.

          "Lo que hiciste ahí fue muy valiente", dice Meridith. "Pero la valentía por sí sola no vale nada a menos que también tengas el poder necesario para imponer tus propios ideales a los demás. Recuerda este consejo."

          Luego le da un toque suave en el hombro y se dispone a seguir a sus dos guardaespaldas fuera de la sala. Poco después de que Meridith se marche, toda la sala se cubre de una luz blanca intensa y, en cuanto la luz desaparece, me doy cuenta de que ahora estamos situados en la celda de Kate, donde Kate también está de pie a nuestro lado, mirando alrededor con confusión.
