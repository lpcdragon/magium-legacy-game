  - name: b2_ch11b_subconsciously
    texts:
      - source: scene_text
        paragraph: 11
        text: |-
          "¿Cómo crees que los lessathi pudieron conseguir su afinidad con el Magium?"

          "Ni idea", dice Arraka. "Una cosa que recuerdo haber leído en los escritos de los lessathi de antaño es que su raza ha tenido una obsesión bastante malsana con el Magium durante miles y miles de años, así que quizá eso tuviera algo que ver. Pero si me preguntas exactamente cómo ocurrió, tu suposición vale tanto como la mía."

          "Ya veo...", digo. "Entonces ¿qué clase de prueba estabas planeando exactamente?"

          "Estoy intentando ver si alguno de esos lessathi es capaz de percibir nuestra presencia", dice Arraka. "Llevo los últimos minutos intentando llegar hasta ellos a través de una miríada de frecuencias mágicas, pero todavía no he tenido suerte. Si mi teoría es correcta, el hecho de que ahora mismo estemos conectados al Magium debería hacer posible que nos detecten, aunque técnicamente no existamos en su propio mundo. Puede que esté enfocándolo de la manera equivocada, eso sí. Déjame probar otra cosa."

