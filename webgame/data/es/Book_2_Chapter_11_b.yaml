        paragraph: 27
        text: |-
          "Parece justo."

          "Lo sé, ¿verdad?", dice Arraka. "Este ritual apenas puede compararse con algunos de los otros. Mira el ritual de Illuna, por ejemplo. No fue culpa suya tener que matar a todos aquellos animales en el bosque sagrado. Todo eso pasó por mi culpa. Y aun así, el ritual la obligó a repetir aquella masacre una vez más y a ver morir a sus amigas delante de sus ojos. Eso sí que es crueldad de verdad. Este ritual, en cambio, solo obliga a Rose a ver las consecuencias directas de sus actos. No es que no supiera que estas cosas iban a pasar cuando tomó sus decisiones. Simplemente eligió no pensar demasiado en ello porque así le resultaba más cómodo."

          Mientras Arraka hablaba de la masacre de los bosques sagrados, vi a Illuna cerrar la mano derecha en un puño y apretarlo con fuerza, pero no dijo nada.

