  - name: b2_ch11b_warning
    texts:
      - source: scene_text
        paragraph: 12
        text: |-
          "¡Ajá!", dice Arraka, haciendo desaparecer a los payasos. "¡Lo sabía! Sabía que estos bastardos estaban resonando con el Magium de algún modo. Pero entonces, si los lessathi tienen tan buena afinidad con el Magium, ¿cómo es que Eiden y el zorro fueron los primeros que aprendieron a crear comida de la nada y no ellos? ¿No se obtuvo ese conocimiento también del Magium? Mmm..."

          "Te das cuenta", digo, "de que si sigues dándome tanta información sobre el Magium, al final voy a descubrir qué es, ¿verdad?"

          "¿Y qué?", dice Arraka. "¿Tengo pinta de que me importe? Todo esto no es más que un juego para mí. Me importa un bledo que descubras la verdadera naturaleza del Magium. Solo te lo he estado ocultando porque tus reacciones me resultan divertidas. No es que el propio Magium me haya prohibido hablar de esto, como a Flower y a Illuna."

          "¿Qué acabas de decir?...", le pregunto, conmocionado.

          "Arraka, no digas una sola palabra más", dice Illuna, con una mezcla de rabia y miedo en los ojos. "Te lo advierto."
      - source: scene_text_2
        paragraph: 8
        text: '"¿Advertirme?", dice Arraka. "¿A MÍ advertirme? ¿Es que nuestro pequeño viaje a este universo paralelo te ha freído el cerebro por completo? ¿Has olvidado con quién estás hablando? ¡Soy Arraka! ¡Hasta los dioses me temen! ¿De verdad crees que voy a dejarme intimidar por algo como el Magium? ¡El Magium no es más que una herramienta! ¡Una herramienta que puedo manipular libremente sin siquiera sudar! ¿Por qué iba a tenerle miedo? ¿Te crees que soy como tú? Pues, Barry, estás de suerte. ¡Hoy por fin vas a descubrir qué es el Magium! Verás, en realidad es todo bastante simple, si te paras a pensarlo. Si tienes en cuenta todo lo que te he contado sobre el mundo en el que estamos ahora y además recuerdas todo lo que ya sabías, entonces la respuesta que tienes justo delante de tus narices es que el Magium es en realidad--"'
      - source: scene_3
        paragraph: 6
        text: |-
          Justo antes de que Arraka pudiera terminar la frase, sentí una sensación tan aterradora y tan difícil de poner en palabras que cualquier amenaza que hubiera podido sentir contra mi vida por parte de alguien como Arraka o el Dios del Tiempo empalidecía por completo en comparación con lo que acababa de sentir. Ya no se trataba de temer por mi vida. Estaba temiendo por mi propia existencia. Sentí que el mundo entero parpadeaba a mi alrededor durante una fracción de segundo, como si todo se congelara en el tiempo y perdiera todo su color. Luego, en esa misma fracción de segundo, todo sencillamente desapareció delante de mis ojos, y lo único que podía ver ahora era vacío. Un vacío que se extendía kilómetros y kilómetros, aunque estuviera hecho de nada.

          Lo que se sintió como un instante también se sintió como una eternidad al mismo tiempo, y durante esa eternidad que duró menos de un segundo llegué a experimentar el puro pavor de la no existencia absoluta. No solo mi vida había sido borrada, sino que la propia noción de mí había sido completamente arrancada del tapiz del universo. Durante esa fracción de segundo no era nada y, aun así, seguía allí, en alguna parte, atrapado por una eternidad en un vacío absoluto mientras intentaba en vano encontrarle sentido al absurdo total de mi situación.

          Cuando vuelvo a encontrarme dentro de mi cuerpo semitransparente y en un mundo lleno de color, de pronto me doy cuenta de que estoy empapado en sudor frío y de que siento el corazón golpeándome el pecho como un tambor atronador. Flower también parece haberse quedado congelada por la conmoción, limitada a mirar fijamente al frente sin decir una sola palabra.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch11b_arrogant
  - name: b2_ch11b_arrogant
    texts:
      - source: scene_text
        paragraph: 13
        text: |-
          "¡¡¡Pedazo de idiota arrogante!!!", grita Illuna de repente, agarrando el amuleto de Arraka con la mano para acercárselo a la cara mientras sus ojos brillan con un intenso color azul. "¡¿Te das cuenta de lo que has hecho?!"

          Esta debe de ser la primera vez que veo a Illuna tan furiosa desde que Arraka nos habló de la masacre de los bosques sagrados en la fortaleza de los ogros. Mientras Arraka permanece completamente callada, el mundo vuelve a parpadear a nuestro alrededor y siento que entro y salgo de la existencia varias veces seguidas antes de que me devuelvan al pasillo subterráneo, sudando más que nunca.

          "¡¿Vas a quedarte callada hasta que nos borren de la existencia?!", le grita Illuna otra vez a Arraka.

          "¡Cállate!", dice Arraka, con un leve temblor de miedo en la voz. "Estoy intentando arreglar esto, pero no puedo hacerlo si no dejas de distraerme. Solo... dame un minuto."
      - source: scene_text_2
        paragraph: 9
        text: |-
          Mientras esperamos a que Arraka termine lo que está haciendo, el mundo se vuelve blanco y negro una vez más, pero ahora parpadea mucho más deprisa que antes, y siento que esta vez mi conciencia va a quedarse atrapada en el vacío para siempre. Justo cuando estoy a punto de perder toda esperanza, de repente vuelvo a ser arrastrado dentro de mi cuerpo y el mundo que nos rodea regresa a la normalidad, mientras Flower y yo respiramos muy rápido y nos miramos mutuamente, intentando darle algún sentido a lo que nos está pasando.

          "Vale...", dice Arraka, con algo de pánico todavía en la voz. "Esto debería bastar por ahora... No deberíamos sufrir más interferencias."

          "¿Qué quieres decir con que debería bastar por ahora?", dice Illuna. "¿Has solucionado el problema o no?"

          "¡Sí!", dice Arraka. "Creo... ¡No lo sé! Nunca había hecho nada parecido. Desvié la atención del Magium lejos de nosotros usando algunos trucos que aprendí del Dios del Destino. Oí que él tuvo que hacer algo parecido sobre la marcha cuando manipularon el Magium para desterrarme de su reino. Y dado que todos lograron escapar sin ser borrados de la existencia, ¡nosotros también deberíamos lograrlo!"
      - source: scene_3
        paragraph: 7
        text: |-
          "¿Estás diciendo que usaste una ilusión para crear una distracción?...", digo.

          "Bueno, si de verdad quieres hacer una comparación, se parecía más a un hechizo de sugestión ridículamente complicado", dice Arraka. "Técnicamente, sigue buscándonos, pero en un mundo completamente distinto. Mientras logre mantener mi boca de idiota cerrada esta vez, no debería ser capaz de volver a encontrarnos."

          "Entonces admites que fuiste una idiota, ¿no?", dice Illuna.

          "¡Sí!", grita Arraka. "¡Sí, lo admito! ¿Ya estás contenta? Fui una idiota por intentar desafiar al Magium en su propio territorio. Todos mis miles de años de conocimiento son casi inútiles frente a este mundo de contradicciones y absurdos. Ahora calmémonos y terminemos de hacer lo que vinimos a hacer en un principio. Ya no quiero pasar aquí dentro ni un segundo más de lo absolutamente necesario."
