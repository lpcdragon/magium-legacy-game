            paragraph: 23
            text: '"¡Ah!", dice Arraka. "Creo que ya lo entiendo. Lo que necesita hacer para completar el ritual es dejar de intervenir y permitir que ese cuidador rescate solo a los niños que consiguió salvar en la línea temporal original. Supongo que va a tardar un rato en darse cuenta... Muy bien, veamos si podemos hacer esto un poco más rápido."'
          - source: scene_text_2
            paragraph: 16
            text: |-
              Entonces empezó a mostrarme los acontecimientos clave que vinieron después, excepto que esta vez todas las acciones se resumían de forma mucho más sucinta para poder dar una imagen más amplia de conjunto.

              En los primeros intentos, Kate se centró en dos cosas: poner a los hermanos elementalistas de su lado e intentar convencer a los demás huérfanos para que siguieran su plan de fuga sin que Olivia llegara a enterarse.

              Cada vez que la arrojaban de nuevo atrás en el tiempo, Kate intentaba convencer a Diane y a su hermano de que venía del futuro contándoles cosas muy concretas que iban a ocurrir antes de que sucedieran. Eso bastaba para convencer a Diane, pero Jason siempre se mostraba escéptico, por muchos detalles que ella les diera, y pensaba que o bien estaba usando trucos para averiguar la información o bien estaba teniendo una suerte descomunal con sus conjeturas.
