              El físico general de Jason no impresiona demasiado, pero la mirada que tiene en los ojos es mucho más madura de lo que cabría esperar de un chico de su edad. Parece el tipo de persona que confía mucho en sus capacidades y sabe exactamente lo que quiere. Igual que Diane, también lleva un collar alrededor del cuello y viste los mismos harapos grises que todos los demás huérfanos.

              Los lessathi están hablando entre ellos en ese momento, pero los huérfanos permanecen completamente callados y esperan con impaciencia a que empiece la reunión. Por lo que parece, los lessathi siguen esperando a que lleguen uno o dos compañeros más antes de anunciarles a todos el motivo por el que los han llamado aquí.

