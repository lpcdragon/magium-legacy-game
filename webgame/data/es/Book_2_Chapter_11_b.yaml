  - name: b2_ch11b_denial
    texts:
      - source: scene_text
        paragraph: 24
        text: |-
          "Entonces, ¿estás más cerca de encontrar una forma de sacarnos de aquí sin riesgos?", digo.

          "Es difícil de decir", me responde Arraka. "He ido avanzando, pero todavía quedan muchas comprobaciones por hacer. Como ya dije, no haré nada hasta estar absolutamente segura de que no hay riesgos."

          "Claro...", digo.

          Mientras seguimos viendo a Kate retroceder en el tiempo una y otra vez, sus intentos parecen volverse más desesperados con cada nuevo bucle temporal. Ahora incluso está intentando salvar a Olivia del Faro, porque tiene la impresión de que la razón por la que el tiempo sigue repitiéndose es que no logró salvar de su prisión a todos y cada uno de los huérfanos. Sus intentos han hecho que la capturen numerosas veces, pero por suerte para ella, incluso en los casos en que Meridith no acudía a rescatarla, el tiempo siempre volvía a reiniciarse al final del día, así que los lessathi nunca llegaban a terminar los preparativos para su disección o para su proceso de reeducación antes de que la enviaran atrás.

          Después de muchos más intentos, Kate por fin logró sacar a todos a salvo, incluida Olivia, aunque el tiempo obviamente seguía repitiéndose incluso en los escenarios más perfectos posibles. El optimismo que se veía en el rostro de Kate tras los primeros intentos de rescate exitosos se iba convirtiendo ahora poco a poco en desesperación, a medida que empezaba a sospechar que completar su ritual exigiría de su parte un curso de acción completamente distinto.
      - source: scene_text_2
        paragraph: 17
        text: |-
          "Mmm...", dice Arraka. "Creo que por fin está empezando a entender lo que está pasando aquí. Aun así, sigo esperando que permanezca en negación al menos cinco bucles temporales más. Pero bueno, da igual. Lo más importante es que puede que por fin haya encontrado una forma apropiada de salir de aquí, pero necesito clavar el momento exacto. Prepárense para experimentar unas náuseas bastante fuertes, porque nuestro confort va a ser lo último que me importe mientras escapamos de este lugar."

          Cuando Arraka termina la frase, me sobreviene de repente un fuerte dolor de cabeza y luego todos regresamos a nuestro mundo real en un abrir y cerrar de ojos. Una vez volvemos a nuestros cuerpos normales, ya no transparentes, miramos a nuestro alrededor y vemos que seguimos en medio del mismo bosque en el que estábamos cuando comenzaron nuestros rituales, junto a todos nuestros amigos. Parece que el tiempo sigue congelado en este mundo y que no todos han logrado salir aún de su trance. Los que sí parecen haber terminado sus rituales, aparte de nosotros, son Melindra, Leila, Hadrik y el revenant, que nos observan, mientras Daren y Kate todavía siguen mirando fijamente al frente con los ojos brillando con esa luz amarilla.

          "Lo conseguimos...", dice Arraka, sonando al mismo tiempo sorprendida y aliviada. "¡Lo conseguimos! Salimos de allí con vida. ¡Ja, ja, ja, ja, ja! ¡Toma esa, Magium, hijo de puta!"

          "¿Te importaría no burlarte del Magium cuando técnicamente seguimos plantados justo en su misma puerta?", dice Illuna.

          "¡Relájate!", dice Arraka. "Todo está bajo control. Los saqué de allí con vida, ¿no? Y además, ni siquiera lo estaba insultando. Le estaba haciendo un cumplido al tratarlo como si fuera una persona de verdad."
      - source: scene_3
        paragraph: 15
        text: |-
          "Actúas como si ya hubieras olvidado lo que puede pasar cuando ignoras mis advertencias...", dice Illuna con tono serio. "¿Quizá te gustaría que te lo recordara un poco devolviéndonos al mundo del que acabamos de escapar?"

          Parece que la pregunta de Illuna deja a Arraka completamente callada. Tras unos segundos más de espera a que responda, Illuna continúa.

          "Sabes que puedo hacerlo", dice. "Después de todo, fuiste tú quien me enseñó todo lo que sé..."

          "¡Vale, tú ganas!", dice Arraka con un tono algo presa del pánico. "Me callaré, ¿de acuerdo? Era solo un poco de regodeo, nada más... ¡No hace falta que te pongas así!"

          "¿Arraka sonando asustada?", dice Hadrik con una sonrisa, aunque la expresión incómoda que tiene en los ojos deja claro que sigue afectado por lo que sea que vivió en su ritual. "Eso sí que no se ve todos los días."
    choices:
      - position: 1
        text: Si crees que ahora está asustada, deberías haberla visto antes...
        effects:
          - set:
              current_scene: b2_ch11b_scared
      - position: 2
        text: Créeme, si hubieras pasado por lo que acabamos de pasar nosotros, tú también estarías así de alterado.
        effects:
          - set:
              current_scene: b2_ch11b_panicking
      - position: 3
        text: En realidad, tú también tienes una expresión bastante incómoda. ¿Pasó algo durante tu ritual?
        effects:
          - set:
              current_scene: b2_ch11b_uneasy
  - name: b2_ch11b_switching
    texts:
      - source: scene_text
        paragraph: 25
        text: |-
          "¿Rose sigue dentro de su ritual?", digo. "¿Puedes enseñármelo? ¿O sería demasiado peligroso?"

          "Movernos entre rituales no supone ningún problema, porque seguimos vinculados al Magium en nuestras formas incorpóreas mientras lo hacemos", dice Arraka. "Solo nos volvemos vulnerables cuando regresamos a nuestros cuerpos normales."

          "Entonces... ¿podemos ir?", digo.

          "Claro, no veo por qué no...", dice Arraka. "Además, ya me estaba empezando a aburrir un poco de este ritual."

          El paisaje que nos rodea cambia por completo de repente y ahora volvemos a estar en Thilias, en medio de un callejón vacío de lo que parece ser uno de los distritos más ricos de la ciudad, donde una Rose de diecinueve años está de rodillas con lágrimas corriéndole por la cara.

          "Por favor, dejen de obligarme a hacer esto...", dice Rose, llorando. "No quiero seguir haciéndolo. Lo siento. Lo siento muchísimo..."

          "Espera, ¿qué está pasando aquí?", le pregunto a Arraka. "¿Cómo se ha llegado a esto?"
      - source: scene_text_2
        paragraph: 18
        text: |-
          "Estoy intentando averiguarlo", dice Arraka. "Dame un minuto mientras echo un vistazo rápido a lo que ha ido ocurriendo hasta ahora."

          Tras unos veinte segundos en los que no se oye nada salvo el suave llanto de Rose, Arraka por fin parece haber encontrado lo que buscaba y ahora intenta resumirnos lo que ha visto.

          "Vale, este ritual parece un poco distinto de los demás", dice Arraka. "En vez de obligarla a recrear un solo acontecimiento de su pasado, en realidad necesita repetir varios en sucesión. Básicamente, tiene que ignorar voluntariamente a todos los esclavos que alguna vez le pidieron ayuda, igual que hizo en el pasado, solo que ahora además se la obliga a presenciar lo que les ocurre a esos esclavos después de que ella se niegue a ayudarlos. Algunos han sido asesinados brutalmente por sus amos, otros han sido abandonados hasta morir de hambre, y a otros los han torturado sin descanso durante semanas hasta volverlos locos. De todo un poco. No creo que este ritual suyo termine hasta que llegue a ver el destino de todos y cada uno de los esclavos a los que ha ignorado a lo largo de su vida."
    choices:
      - position: 1
        text: Eso es terrible...
        effects:
          - set:
              current_scene: b2_ch11b_terrible
      - position: 2
        text: Parece justo.
        effects:
          - set:
              current_scene: b2_ch11b_fair
      - position: 3
        text: ¿Y qué hay de los casos en que luego no les pasó nada realmente malo a los esclavos?
        effects:
          - set:
              current_scene: b2_ch11b_afterwards
  - name: b2_ch11b_terrible
    texts:
      - source: scene_text
        paragraph: 26
        text: |-
          "Eso es terrible..."

          "¿Tú crees?", dice Arraka. "Porque, en lo que a rituales se refiere, este me parece bastante suave. Mira el ritual de Flower, por ejemplo. Le impusieron la Ilusión de que podía salvar a todos sus amigos de Olmnar cuando ni siquiera fue culpa suya no haber podido salvarlos la primera vez. ¡Eso sí que es crueldad de la buena! Este ritual, en cambio, solo obliga a Rose a ver las consecuencias directas de sus actos. No es que no supiera que esas cosas iban a pasar cuando tomó sus decisiones. Lo que pasa es que eligió no pensarlo demasiado porque así estaba más cómoda."

          "Aun así...", digo. "Este ritual sigue pasando un poco de la raya."

          "Como tú digas", dice Arraka.

          No mucho después de que dejemos de hablar, una chica de dieciocho años vestida con ropa sucia y gastada entra en el callejón y parece estar cojeando de la pierna derecha. A juzgar por el aspecto de su ropa y su pelo rubio y descuidado, lo más probable es que sea una esclava, pero no veo a su amo por ningún sitio. ¿Puede ser que haya huido y ahora esté buscando un lugar donde esconderse?

          "No...", dice Rose, poniéndose en pie y dando dos pasos hacia atrás, con una expresión de shock y miedo en los ojos cuando ve a la esclava acercarse lentamente. "No, no, no... Esto no. Cualquier cosa menos esto."
      - source: scene_text_2
        paragraph: 19
        text: |-
          La joven esclava no hace más que acercarse cada vez más hasta que finalmente llega junto a Rose y le agarra ambas manos, mirándola directamente a los ojos con una expresión desesperada y suplicante en el rostro.

          "Por favor, tienes que ayudarme...", dice la esclava. "Mi amo me está buscando. Va a entrar en este callejón enseguida y no puedo dejarlo atrás corriendo. Pero si me escondo en esta tienda abandonada y tú le dices que me viste ir por el otro lado, quizá te crea. No tengo a nadie más a quien pedírselo. Eres mi única esperanza. Por favor, no me abandones..."

          Mientras la esclava hablaba, Rose negaba con la cabeza una y otra vez, con lágrimas en los ojos, mientras seguía mirando impotente a la chica que le hablaba. Cuando la joven terminó por fin de decir lo que tenía que decir, Rose se dio cuenta de que se le había acabado el tiempo, así que apartó las manos de la esclava y se secó sus propias lágrimas con la manga. Luego se obligó a dibujar una sonrisa amable en la cara mientras tomaba con suavidad las manos de la esclava y le juntaba las palmas.
      - source: scene_3
        paragraph: 16
        text: |-
          "No deberías estar haciendo esto", dice Rose, mientras sigue sujetando las manos de la esclava. "Como esclava, tu deber es seguir sirviendo a tu amo por muy duramente que te trate. Cada uno de nosotros tiene su propio propósito en la vida, y no podemos simplemente huir de él cuando las cosas se ponen demasiado difíciles. Los esclavos son una parte importante de nuestra sociedad y deberías sentirte orgullosa de la contribución que haces al progreso de nuestra civilización. No te preocupes, no te soltaré las manos hasta que tu amo venga aquí a por ti. Estoy segura de que luego me lo agradecerás, cuando hayas tenido ocasión de calmarte y pensar en todo esto de una manera más racional."

          Con cada nueva frase que pronunciaba, la voz de Rose se volvía más y más temblorosa y sus ojos volvían a humedecerse, pero de algún modo consiguió mantener esa misma sonrisa forzada durante todo su discurso. La esclava se limitaba a mirarla con incredulidad todo el tiempo, aferrándose a la esperanza de que todo pudiera ser solo una broma cruel. Cuando se dio cuenta de que Rose hablaba en serio, empezó a intentar zafarse desesperadamente, pero estaba demasiado debilitada para poder escapar del agarre de Rose.

          "¡No!", grita la esclava mientras sigue intentando liberarse. "¡Suéltame! No lo entiendo... ¿Cómo puedes ser tan cruel? No te he hecho nada y aun así... y aun así..."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b2_ch11b_commendable
  - name: b2_ch11b_fair
