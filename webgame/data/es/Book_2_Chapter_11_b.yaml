              "Probablemente solo unos minutos o así", dice Arraka. "El tiempo fluye de forma completamente distinta en cada uno de los mundos a los que los enviaron. El enano, la chica muda y el revenant ya terminaron sus rituales. El sanador, en cambio, sigue liado con el suyo."
