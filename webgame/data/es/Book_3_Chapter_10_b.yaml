          - source: scene_text_2
            paragraph: 3
            text: |-
              "No tiene nada de malo", dice Daren, sin interrumpir lo que está haciendo. "Solo estoy tratando de mejorarlo. Se me ocurrió una idea después de una discusión que tuve con Arraka sobre las auras ayer, y ahora quiero ver si puedo hacer uso de lo que aprendí de ella para fortalecer aún más la señal mágica de mi transceptor".

              "Pero dijiste que ya era lo suficientemente fuerte como para contactar a personas de otros continentes, ¿verdad?" Hadrik dice. "¿Quieres hacerlo aún más fuerte que eso?"

              "Normalmente puede contactar con personas que están en otros continentes, sí, pero no puedo hacerlo desde este lugar, por el motivo que sea", dice Daren. "Varathia probablemente tiene algún tipo de bloqueo de señal hechizo emitido por toda la isla, para evitar cualquier contacto externo excepto el autorizado por los reyes, y estoy tratando de evitar esta restricción. Siento que estoy muy cerca de un gran avance aquí. Sólo necesito hacer algunos ajustes finales..."

              "Seguro que estás dedicando mucho esfuerzo a este proyecto tuyo", dice Hadrik. "¿Hay alguien en particular con quien quieras contactar fuera de Varathia?"

              "Sí", dice Daren. "Mi esposa."

              Después de escuchar las palabras de Daren, todos volvemos la cabeza para mirarlo, mientras Hadrik se queda ahí, confundido.

              "¿Tienes esposa?..." le pregunta Hadrik. "¡Nunca nos dijiste que estabas casado!"
          - source: scene_3
            paragraph: 2
            text: |-
              "Sí, bueno", dice Daren, sin quitar los ojos del transceptor en el que está trabajando, "a lo largo de los años, he desarrollado el hábito de no mencionarla en conversaciones casuales, para poder mantener su identidad en secreto y protegerla. Si alguno de mis enemigos se enterara de su existencia, podría intentar hacerle daño para vengarse de mí, y no podría correr ese riesgo. Si me buscaras en artículos de noticias o en los libros de historia, también encontrarás que se menciona que no estoy casado, debido a toda la información falsa que he difundido a lo largo de los años. En este momento, las únicas personas además de ti que saben sobre la existencia de mi esposa son los lugareños de la remota aldea en Continente Sur donde Sophie y yo pasamos nuestra infancia juntos, pero todos son buenas personas, por lo que acordaron mantener nuestra relación oculta del mundo exterior."

              "¿Y cómo está manejando su esposa, Sophie, todo este secreto?" Hadrik dice, con una leve sonrisa. "¿No está molesta porque no puede presumir de ser la esposa del famoso sanador con armadura?"

              "No, ella no es realmente del tipo que se jacta de esas cosas", dice Daren. "Y además, este acuerdo actual fue idea de ella, no mía. Mi idea era... un poco más extrema que eso".

              "¿Qué quieres decir?" Hadrik dice.
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch10b_eavesdropping
