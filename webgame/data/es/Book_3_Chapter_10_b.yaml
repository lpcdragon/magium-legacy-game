  - name: b3_ch10b_changed
    texts:
      - source: scene_text
        paragraph: 29
        text: |-
          "Muchas cosas han cambiado, Jirinn", dice Arraka. "Muchas cosas. De cualquier manera, creo que te hemos retenido suficiente tiempo. Una vez que te haya dado todos los detalles que necesitas con respecto a mi técnica de absorción de alma, te dejaremos en paz y luego nos comunicaremos contigo nuevamente en uno o dos días, para que puedas darnos alguna actualización sobre tu progreso con respecto a los asuntos que hemos discutido. Con suerte, serán solo buenas noticias. Ah, y asegúrate de no dejar que nadie sepa el hecho de que hemos estado en contacto entre nosotros. No quiero que ninguno de los dioses sepa que soy yo quien secretamente mueve los hilos detrás de escena."

          "Correcto", dice Jirinn. "Entonces escuchemos esos detalles. Soy todo oídos".

          Durante los siguientes veinte minutos aproximadamente, Arraka le da a Jirinn una explicación muy detallada sobre cómo funciona el proceso de absorción del alma y por qué la aplicación incorrecta de su técnica puede llevar a alguien a hablar permanentemente en múltiples voces, como es el caso de Selkram y Ulruk. Luego también se toma el tiempo para enseñarle cómo usar la misma versión básica de su técnica que les enseñó a las banshees en el plano terrestre, para que él pueda entender adecuadamente de qué está hablando.
      - source: scene_text_2
        paragraph: 22
        text: |-
          Una vez que Arraka se asegura de que Jirinn ha recibido suficiente evidencia para creer su versión de la historia, comienza a discutir con él un plan muy elaborado sobre cómo exponer al Dios de la Muerte y al Dios del Tiempo frente a todos los demás dioses, de una manera que haría obvio para todos que han absorbido espíritus en el pasado.

          Según ella, hay una manera de despertar temporalmente a los espíritus absorbidos por Selkram y Ulruk de su larga hibernación, pero sólo se puede hacer por un período de tiempo muy breve, por lo que es importante que haya tantos testigos como sea posible en ese momento dado.

          Para reunir a todos los dioses, Jirinn acordó contactarlos esta noche y afirmar falsamente que quiere prometerles lealtad mañana, antes del mediodía. Teniendo en cuenta que él es el ex líder del grupo más grande y poderoso que se ha opuesto a los dioses en el pasado, tal oferta será difícil para ellos rechazar, ya que su rendición probablemente desmoralizaría en gran medida a cualquier espíritu que todavía tuviera pensamientos de resistir el gobierno de los dioses.
      - source: scene_3
        paragraph: 17
        text: |-
          De hecho, es casi seguro que los dioses aprovecharán esta oportunidad para invitar a tantos espíritus como sea posible, para que puedan hacer una demostración pública de la humillación de Jirinn. Una vez que todos los espíritus estén reunidos y Jirinn tenga toda su atención, lanzará un despertar del alma hechizo que le proporcionó Arraka, lo que hará que los espíritus absortos de Selkram y Ulruk griten desesperadamente pidiendo ayuda con sus antiguas voces, de modo que cualquiera que los haya conocido personalmente hace cinco mil años los reconozca de inmediato.

          Aprovechando el caos resultante, Jirinn luego gritaba sobre cómo los dioses los han traicionado y cómo han estado absorbiendo espíritus en secreto para aumentar sus poderes durante todos estos años. Luego también afirmaría que la verdadera razón por la que desterraron a Arraka y a las otras mujeres de las razas civilizadas fue porque tenían miedo de volverse lo suficientemente poderosas como para desafiar su gobierno, y porque querían mantener en secreto la técnica de absorción del alma, para que solo ellas pudieran usarla.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch10b_ideal
              available_points: available_points + 3
              available_points_aux: available_points_aux + 3
            condition: b3_ch1_unlock = 2
          - set:
