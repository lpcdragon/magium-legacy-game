        texts:
          - source: scene_text
            paragraph: 21
            text: |-
              "Espera, ¿no deberíamos al menos decidir de antemano qué les vamos a decir?"

              "Ya sabemos de qué vamos a hablar", dice Arraka. "Hemos discutido esto extensamente. No me hagas repetir lo mismo por milésima vez".

              "No me refiero al tema principal de nuestra conversación, sino a la forma en que interactuaremos con este espíritu", digo. "¿Qué pasa si tenemos mucha mala suerte y Daren está vinculado a uno de los dioses con los que luchaste hace cinco mil años? O peor aún, ¿qué pasa si está vinculado al mismísimo Dios del Tiempo?"

              "Si Daren está vinculado a Selkram, entonces obviamente estamos jodidos", dice Arraka. "Sin embargo, las posibilidades de que eso suceda son casi inexistentes. Si es uno de los dioses, será un poco más difícil lograr que haga lo que queremos, pero estoy seguro de que podemos resolver las cosas con un poco de esfuerzo".

              "¡Mira, eso es lo que estaba tratando de decir!" Le digo. "No tenemos un plan adecuado para cuando las cosas van terriblemente mal. ¡Aquí hay demasiado en juego como para confiar únicamente en la improvisación!"

              "Está bien, sabelotodo", dice Arraka, "entonces, ¿qué propones TÚ que hagamos?"

              "Bueno, a mi modo de ver, la mayoría de nuestros problemas surgen de la posibilidad de que este espíritu te reconozca y te odie, ¿verdad?" digo. "Entonces, ¿qué tal si dejamos que solo Daren hable durante los primeros minutos, y veremos si puede conseguir el espíritu que lo ayude a reparar su vínculo, al menos? Luego, veremos si puede convencer al espíritu de que sabe por 'fuentes creíbles' que el Dios del Tiempo y el Dios de la Muerte han estado absorbiendo a otros habitantes del plano mágico".
          - source: scene_text_2
            paragraph: 16
            text: |-
              "No le creerán a menos que les dé suficientes detalles sobre la técnica de absorción del alma para verificar esta información por sí mismos", dice Arraka. "Y si les das esos detalles, seguramente sabrán que se trata de mí".

              "¿No han pasado miles de años desde la última vez que hablaste con alguien el plano mágico?" digo. "Por lo que saben, es muy posible que ya estés muerto, y la única razón por la que estamos familiarizados con tu técnica de absorción de alma es porque se la enseñaste a otros en el plano terrestre, y luego ellos se la enseñaron a sus descendientes... lo que técnicamente podría ser cierto, ya que dijiste que les contaste a las primeras banshees sobre tu técnica".

              "Está bien, está bien", dice Arraka. "Entiendo tu punto. Le daré a Daren los detalles que necesita para convencer al espíritu, y si no puede explicarlo lo suficientemente bien por sí solo, solo entonces intervendré. ¿Estás contento ahora o tienes algo más que agregar?"

              "No, yo diría que eso debería ser suficiente", le respondo, y luego Arraka comienza a darle a Daren la información que necesita transmitir a su espíritu vinculado para que le crean.

              Una vez que termina, Daren nos dice que está a punto de abrir el canal y toca su transceptor.

              "¿Hola?" Daren dice. "¿Hay alguien allí?"

              Espera unos momentos, pero no obtiene respuesta.

              "¿Puedes oírme?" Daren pregunta de nuevo.
          - source: scene_3
            paragraph: 13
            text: |-
              "¿Quién eres?" escuchamos una voz masculina muy distorsionada con un eco poderoso, proveniente del transceptor. "¿Qué deseas?"

              "Uh... mi nombre es Daren", dice Daren. "Me estoy comunicando contigo desde el plano terrestre, para preguntarte si puedes ayudarme con--"

              "¿El plano terrestre?" dice el espíritu. "¿Se supone que esto es algún tipo de broma?"

              "No, señor", dice Daren. "Te llamo porque nuestras dos auras aparentemente están unidas y estás actuando como una especie de embudo para extraer energía del plano mágico. Mi problema es que--"

              "¡Desharás este enlace de inmediato!" dice el espíritu. "¿Lo entiendes?"

              "Mira, incluso si quisiera, el vínculo se hizo de manera inconsciente desde mi nacimiento", dice Daren. "No creo que sea posible para ninguno de nosotros cancelarlo por nuestra propia voluntad. Ahora, si pudieras escucharme por un segundo, solo hay unas pocas cosas que quiero pedirte y luego te dejaré en paz".

              "Inaceptable", dice el espíritu. "Ninguna criatura terrestre extraerá mi energía sin mi permiso. Si no dejas de actuar inmediatamente, enfrentarás graves consecuencias".
