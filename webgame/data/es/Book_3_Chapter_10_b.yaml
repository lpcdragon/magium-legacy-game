          - source: scene_text
            paragraph: 34
            text: |-
              "¿Por qué crees que hay tan pocas banshees por ahí ahora?"

              "Bueno, una de las razones es claramente la existencia de cazadores de almas en pena, que acabo de mencionar", me responde Arraka. "Luego, también hay algunos magos blancos que se especializan en purificar a las mujeres antes de que las banshees que las poseen se despierten por completo, así que imagino que muchos espíritus también son asesinados por ellos. Pero, sobre todo, creo que es porque las banshees a las que les enseñé mi técnica de absorción de alma inicialmente no hicieron un muy buen trabajo para asegurarse de que este conocimiento se transmitiera adecuadamente a las generaciones futuras. Teniendo en cuenta que tantas banshees ni siquiera saben que necesitan apuntar al alma del anfitrión con el hechizo en lugar de su cuerpo, me estremezco al pensar qué otra información pudo haber sido transmitida incorrectamente a lo largo de los años."

              "¿Y nunca has tenido la curiosidad de encontrar los espíritus que están difundiendo información incorrecta en nuestra época actual para poder aclararlos?" digo.

              "No", dice Arraka. "Como dije: ya no es mi problema".
