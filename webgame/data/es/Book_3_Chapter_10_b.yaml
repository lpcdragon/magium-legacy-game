  - name: b3_ch10b_complicated
    routes:
      - condition: b3_ch10_misunderstanding = 0
        texts:
          - source: scene_text
            paragraph: 35
            text: |-
              "Utilicé el poder del amor y la amistad".

              "Ya veo..." dice Melindra, luciendo como si realmente estuviera tomando en serio mi respuesta. "Y... ¿crees que este 'poder de la amistad' también podría aplicarse a otras personas? ¿O crees que fuiste la excepción?"

              "Mira, si no me vas a decir nada específico, no podré ayudarte", le digo. "¿Qué fue lo que hiciste que Kate podría considerar un acto de traición? ¿Tiene algo que ver con esos Lessathi que conoces?"

              "Es... más complicado que eso", dice Melindra.

              "Cuando puso el cuchillo en mi garganta, pensó que yo también estaba aliado con los Lessathi, debido a mi linaje", digo, "pero finalmente logramos resolver las cosas. Estoy seguro de que tú también puedes hacerlo. Mientras seas sincero al respecto, no veo ninguna razón por la cual Kate no lo haría--"

              "¡Hola chicos, estamos de vuelta!" Daren grita desde la distancia, mientras él y Kate se acercan lentamente a nosotros. "¡Tenemos buenas noticias! ¿Dónde está Hadrik? Quiero que me ayude a probar algo".

              "Está junto al río, charlando con Arraka", le digo a Daren en voz alta. "¿Dónde han estado ustedes dos?"
          - source: scene_text_2
            paragraph: 26
            text: |-
              "Le pregunté a Kate si podía volar sobre sus plataformas de hielo y arrojarme piedras desde todos los ángulos", dice Daren. "Logré bloquearlos a todos con mi barrera mágica. ¡Es increíble! ¡Nunca pensé que mi Hechizo de escudo funcionaría tan bien en mi vida!"

              "¡Lindo!" digo. "Entonces esto significa que Jirinn, o como se llame, arregló el vínculo entre ustedes dos, ¿verdad? ¿Qué tan fuerte crees que es tu escudo contra ataques físicos, en comparación con lo que puedes hacer contra la magia? ¿Está cerca de ese nivel?"

              "Eso es lo que pretendo descubrir", dice Daren, mientras ahora me alcanza y comienza a gritar llamando a Hadrik. "Oye, Hadrik, ¿puedes venir un momento? ¡Quiero probar algo!"

              "Sí, sí, estaré allí enseguida", escuchamos la voz de Hadrik, y luego sale de detrás de los árboles hacia el claro en el que estábamos.

              "¿Qué está sucediendo?" Hadrik pregunta a Daren, mientras se acerca a nosotros y Flower ahora viene hacia nosotros también, con el amuleto de Arraka alrededor de su cuello.

              "Hadrik", dice Daren, "Quiero que me golpees lo más fuerte que puedas. Dame tu mejor golpe. ¡Vamos!"

              Mientras dice esto, Daren está adoptando una postura defensiva, con su escudo frente a él y su barrera semitransparente rodeándolo.

              "¿Tan fuerte como puedo?" Hadrik dice. "No creo que sea una buena idea".

              "Tonterías", dice Daren. "Puedo soportarlo. ¡Muéstrame lo mejor que tienes!"
          - source: scene_3
            paragraph: 20
            text: |-
              "Está bien, así es como vamos a hacer esto", dice Hadrik. "Comenzaré con uno de mis golpes más débiles primero y si puedes manejarlo, avanzaremos desde allí. ¿Te parece bien?"

              "Está bien, está bien, pero date prisa", dice Daren. "Estoy temblando de anticipación".

              "Muy bien, entonces", dice Hadrik, mientras prepara su golpe. "¡Aquí vamos!"

              Tan pronto como el puño de Hadrik golpea el escudo de Daren, se escucha un fuerte ruido metálico cuando golpea el metal, pero a pesar de la fuerza bastante considerable que Hadrik parece haber puesto detrás de su golpe 'más débil', Daren no se movió ni un centímetro de su posición original.

              "¡Bueno, que me condenen!" Hadrik dice, con una sonrisa. "Está bien, Daren, me has convencido. Voy a darte uno de mis mejores golpes. ¡Será mejor que no me decepciones!"

              "Ni en sueños se me ocurriría", le dice Daren.

              Esta vez, Hadrik lleva su brazo completamente hacia atrás para asegurarse de que su próximo ataque esté a la altura de las altas expectativas de Daren. Cuando su puño finalmente golpea el escudo de Daren nuevamente, el sonido que hace el escudo es tan fuerte que hace que todos los pájaros vuelen de los árboles, y el ruido continúa durante unos diez segundos más, mientras el escudo vibra continuamente por la fuerza del golpe.

              Daren fue empujado hacia atrás unos treinta centímetros aproximadamente por el impacto del golpe, pero en su mayor parte se mantuvo firme y, a menos que haya sufrido alguna herida no visible que yo desconozca, parece estar completamente ileso.
