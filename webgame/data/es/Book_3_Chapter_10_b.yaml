  - name: b3_ch10b_complaining
    texts:
      - source: scene_text
        paragraph: 18
        text: |-
          "Ejem..." dice Hadrik. "Me doy cuenta de que ustedes dos no han hablado en mucho tiempo, y realmente odio interrumpir, pero tal vez es hora de llevar esta conversación a otra parte. Por muy paciente que Arraka haya demostrado ser hasta ahora, creo que podría comenzar a lanzarnos maldiciones mientras dormimos si retrasamos su lección mágica más de lo que ya lo hemos hecho".

          "¡Oh, no es necesario!" Sophie dice. "Ya entendí la esencia principal de lo que sucedió estas últimas semanas, así que podemos detener nuestra discusión aquí, por ahora. Iré a hacer algunos recados y luego Daren y puedo hablar más más tarde, cuando estén todos menos ocupados. ¿Te parece bien, Daren?"

          "Por supuesto", dice Daren. "¡Entonces hablaré contigo más tarde!"

          "¡Adiós!" Sophie dice. "¡Oh, y fue un placer conocerlos a todos! Por favor cuiden bien a Daren... Por lo que me han estado contando, espero que necesite toda la ayuda que pueda conseguir".

          "Lo haré, señorita Sophie", dice Hadrik. "¡Servirá!"

          "¡Adiós!" Sophie dice, y luego cierra el transceptor.

          "¡Finalmente!" Arraka dice. "Pensé que ustedes dos nunca se callarían."

          "No sé por qué te quejas tanto", dice Daren, mientras deja su transceptor y comienza a reunir sus herramientas encantadoras para guardarlas en su mochila. "En todo caso, deberías estar feliz de que realmente haya logrado darle un buen uso a algunas de tus inútiles enseñanzas".
      - source: scene_text_2
        paragraph: 13
        text: |-
          "Dejaré de quejarme cuando empieces... espera, ¿a qué te refieres con mis 'enseñanzas'?" Arraka dice. "¿Estás hablando de mis lecciones de aura?"

          "Sí", dice Daren. "Recordé lo que me dijiste ayer acerca de cómo uno puede reforzar el vínculo entre dos auras identificando puntos clave en el flujo que parecen estar 'atados en nudos' y tirando suavemente de los hilos invisibles hasta que pueda desatarlos. Estos llamados 'nudos' sonaban muy similares a los bloqueos típicos que normalmente encontraría cuando encantaba mis transceptores para tener una señal más poderosa, excepto que siempre intentaba encontrar mi camino alrededor de ellos o eliminarlos por completo, y nunca pensé que tenía la opción de simplemente desatarlos como si fueran hilos. Tan pronto como apliqué este proceso a mi encantamiento, todo se volvió mucho más fácil."

          "...Flower, ¿puedes acercarme a Daren?" Arraka dice. "Quiero ver mejor este transceptor suyo".

          "¡Um, claro!" Flower dice, y luego hace lo que Arraka le pide.

          Una vez que su amuleto está más cerca del transceptor, Arraka pasa unos treinta segundos observándolo en silencio. Justo cuando estábamos a punto de preguntarle qué está haciendo, Arraka finalmente habla, en un tono de voz muy tranquilo, pero obviamente comedido.
      - source: scene_3
        paragraph: 11
        text: |-
          "Daren..." Arraka dice. "¿Recuerdas cómo el primer día cuando comenzamos tu entrenamiento de aura, te dije que para contactar al espíritu del plano mágico que está vinculado a tu aura, necesitarías desenredar el flujo de tu aura con tu mente, y que luego necesitarías tirar de la cuerda invisible para llamar la atención del espíritu?"

          "Mmm", dice Daren.

          "Corrígeme si me equivoco", dice Arraka, "pero por lo que me dijiste en el pasado, tu principal problema fue que no podías identificar el hilo que te unía a tu espíritu. Dijiste que incluso después de que el goblin Kelrim finalmente te hizo entender lo que quería decir con desenredar el flujo de tu aura, aún no pudiste completar tu tarea porque no tendrías forma de saber cómo aislar los hilos lo suficientemente bien como para ser capaz de analizarlos individualmente. ¿No fueron estas tus palabras exactas?"

          “Eso dije, sí”, le responde Daren.

          "Entonces, ¿te importaría explicarme por qué este dispositivo, creado por ti, es capaz de realizar la tarea exacta que dijiste que era imposible para ti?" Arraka pregunta, sonando como si apenas fuera capaz de contener su ira.
    choices:
