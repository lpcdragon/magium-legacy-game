chapter_effects:
  - condition: b3_ch3_stats_unavailable = 1
    effects:
      - disable stats
  - condition: b3_ch3_stats_unavailable = 0
    effects:
      - enable stats
scenes:
  - name: b3_ch10b_preoccupied
    routes:
      - condition: ch11_saved_rose = 1 AND ch11_romance_rose = 0
        texts:
          - source: scene_text
            paragraph: 2
            text: |-
              "¡Oye, Daren, ahí estás!" Hadrik dice. "Te he estado buscando. ¿Te importaría unirte a mí para un breve combate de sparring? ¡Se me acaban de ocurrir algunas técnicas nuevas y quiero ver qué tan bien funcionan contra un guerrero experimentado como tú!"

              "Uh, claro..." dice Daren, sin desviar su atención del transceptor en el que está trabajando actualmente con sus herramientas encantadoras. "Sólo dame un minuto."

              Hadrik asiente y se acerca a Daren para poder ver mejor lo que está haciendo. Han pasado cuatro días desde que salimos de Ollendor, pero durante las últimas doce horas aproximadamente, hemos estado atrapados esperando en el mismo claro del bosque donde colocamos nuestras tiendas de campaña ayer. Melindra nos dijo que esperáramos aquí mientras ella hacía los preparativos necesarios para contactar a su misteriosa amiga que se supone debe darnos nuestro detector de piñas, pero no ha regresado desde entonces, por lo que nos hemos mantenido ocupados con nuestro entrenamiento.

              Daren, por otro lado, ha estado muy preocupado con su transceptor durante las últimas horas. Al principio, parecía que solo estaba haciendo un mantenimiento regular, pero ahora empiezo a pensar que es más que eso. ¿Quizás esté trabajando en algún tipo de actualización?

              "Entonces, todavía no has terminado con ese transceptor tuyo, ¿eh?..." Hadrik le dice a Daren. "¿Qué tiene de malo? ¿Se rompió o algo así?"
          - source: scene_text_2
            paragraph: 2
            text: |-
              "No tiene nada de malo", dice Daren, sin interrumpir lo que está haciendo. "Solo estoy tratando de mejorarlo. Se me ocurrió una idea después de una discusión que tuve con Arraka sobre las auras ayer, y ahora quiero ver si puedo hacer uso de lo que aprendí de ella para fortalecer aún más la señal mágica de mi transceptor".

              "Pero dijiste que ya era lo suficientemente fuerte como para contactar a personas de otros continentes, ¿verdad?" Hadrik dice. "¿Quieres hacerlo aún más fuerte que eso?"

              "Normalmente puede contactar con personas que están en otros continentes, sí, pero no puedo hacerlo desde este lugar, por el motivo que sea", dice Daren. "Varathia probablemente tiene algún tipo de bloqueo de señal hechizo emitido por toda la isla, para evitar cualquier contacto externo excepto el autorizado por los reyes, y estoy tratando de evitar esta restricción. Siento que estoy muy cerca de un gran avance aquí. Sólo necesito hacer algunos ajustes finales..."
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch10b_eavesdropping
      - condition: ch11_saved_rose = 0
        texts:
          - source: scene_text
            paragraph: 2
            text: |-
              "¡Oye, Daren, ahí estás!" Hadrik dice. "Te he estado buscando. ¿Te importaría unirte a mí para un breve combate de sparring? ¡Se me acaban de ocurrir algunas técnicas nuevas y quiero ver qué tan bien funcionan contra un guerrero experimentado como tú!"

              "Uh, claro..." dice Daren, sin desviar su atención del transceptor en el que está trabajando actualmente con sus herramientas encantadoras. "Sólo dame un minuto."

              Hadrik asiente y se acerca a Daren para poder ver mejor lo que está haciendo. Han pasado cuatro días desde que salimos de Ollendor, pero durante las últimas doce horas aproximadamente, hemos estado atrapados esperando en el mismo claro del bosque donde colocamos nuestras tiendas de campaña ayer. Melindra nos dijo que esperáramos aquí mientras ella hacía los preparativos necesarios para contactar a su misteriosa amiga que se supone debe darnos nuestro detector de piñas, pero no ha regresado desde entonces, por lo que nos hemos mantenido ocupados con nuestro entrenamiento.

