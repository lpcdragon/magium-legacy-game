  - name: b3_ch10b_sparring
    texts:
      - source: scene_text
        paragraph: 38
        text: |-
          "¡Jajajaja!" Hadrik se ríe. "¡Entonces, así es el sanador con armadura cuando todas sus limitaciones han sido eliminadas! He estado soñando con un momento como este. El momento en que finalmente pueda probar mis poderes contra un héroe de renombre mundial que es capaz de luchar contra mí con toda su fuerza. ¿Qué te parece, Daren? ¿Estarías interesado en deshacerte de esta sesión de entrenamiento e ir a un combate de sparring completo?"

          "De hecho, iba a preguntarte lo mismo", dice Daren. "Sólo dame un minuto, así puedo quitarme esta armadura".

          "¿Oh?" Hadrik dice. "¡Esto debería ser interesante!"

          Le toma alrededor de dos minutos más o menos, pero con un poco de ayuda de nuestra parte, Daren logra quitarse todas las piezas de su armadura, quedando vestido solo con una túnica de manga corta de color verde oscuro que llevaba debajo, un par de pantalones marrones y sus botas. Una vez que todo esté preparado y el resto de nosotros estemos fuera del camino, la lucha finalmente podrá comenzar.

          Lo primero que hace Hadrik es correr directamente hacia Daren, para ver si puede abrumarlo con su velocidad inhumana. Normalmente, habría esperado que Daren usara su nueva habilidad para bloquear el ataque del enano de frente, pero en lugar de eso, lo que hace es apartarse casualmente del camino, incluso si no debería haber tenido tiempo de reaccionar ante eso sin que sus reflejos se mejoraran mágicamente de alguna manera.
      - source: scene_text_2
        paragraph: 27
        text: |-
          "¿Pensaste que no esperaría una carrera sorpresa justo al comienzo de la batalla?" Daren dice, con media sonrisa. "¡Vamos, Hadrik! ¡Me conoces mejor que eso! Te he estado viendo pelear durante semanas. Tendrás que ser un poco más impredecible si realmente quieres ganar esto".

          "¡Ja!" Hadrik dice. "Debería haber sabido que no me dejarías terminar la pelea tan rápido. Pero ¿y si hago esto?"

          Luego salta hacia Daren, tratando de golpearlo con el puño nuevamente, pero Daren se aparta una vez más, haciendo que parezca que también estaba esperando este ataque. Al ver que las sorpresas no parecen funcionar con su oponente, Hadrik decide atacar muchas veces en rápida sucesión, para darle a Daren el menor tiempo posible para superarlo.

          Para nuestra sorpresa, los movimientos de Daren fluyen como agua unos de otros, esquivando un golpe tras otro, sin dejarse golpear ni una sola vez. Su nuevo estilo de combate parece una combinación entre el estilo de su antiguo maestro Nolderan... y el de Eiden.

          "Veo que Daren está combinando sus muchos años de experiencia en combate con lo que le enseñé sobre las auras para poder leer los movimientos de su oponente y predecir sus ataques antes de que sucedan", dice Arraka. "No está mal. Tal vez no perdí todo ese tiempo enseñándole en vano".
      - source: scene_3
        paragraph: 21
        text: |-
          Después de ver que ninguno de sus ataques conecta, Hadrik decide cambiar un poco su estrategia y emplear las mismas tácticas que usó contra Gontrok en su última batalla, cambiando el tamaño y las proporciones de su cuerpo constantemente para confundir a su compañero de duelo. Por lo que puedo decir, esto parece estar teniendo un efecto en Daren, probablemente porque no ha tenido la oportunidad de ver a Hadrik pelear con este nuevo estilo durante mucho tiempo, lo que lo hace mucho más difícil de predecir. Después de algunas situaciones muy cercanas, Daren finalmente se ve obligado a ponerse a la defensiva, bloqueando muchos más golpes con su escudo que antes.

          Por otro lado, Hadrik no permite que la espada de Daren se acerque a él, sabiendo muy bien que fácilmente podría atravesar su Endurecimiento de aura y su dura piel gigante incluso si Daren no apunta a ninguno de sus puntos débiles. Este cuidado con su arma alrededor de Daren hace que algunos de sus golpes sean más débiles de lo que deberían ser, debido a que queda atrapado en el pie equivocado la mitad del tiempo.

          "Parece que no pasará mucho tiempo hasta que Daren conceda", nos dice Kate.

          "¿De qué estás hablando?" Flower dice. "¿Por qué se rendiría? ¡Está ganando totalmente!"

          "Al principio parecía que estaba ganando, pero ya no", dice Kate. "Tan pronto como empezó a ponerse a la defensiva, la pelea estaba perdida para él".
    choices:
      - position: 1
        text: De hecho, creo que Flower tiene razón. Hadrik será el que perderá, no Daren.
        effects:
          - set:
              current_scene: b3_ch10b_noon
              b3_ch10_sparring: 0
      - position: 2
        text: Estoy con Kate en este caso. Simplemente no veo a Hadrik perdiendo esta batalla.
        effects:
          - set:
              current_scene: b3_ch10b_noon
              b3_ch10_sparring: 1
      - position: 3
        text: ¿Estamos todos viendo la misma pelea? Siento que terminará en empate para mí.
        effects:
          - set:
              current_scene: b3_ch10b_noon
              b3_ch10_sparring: 2
  - name: b3_ch10b_noon
    routes:
      - condition: b3_ch10_sparring = 0 AND b3_ch10_eiden <> 0
        texts:
          - source: scene_text
            paragraph: 39
            text: |-
              "En realidad, creo que Flower tiene razón. Hadrik será el que perderá, no Daren".

              "¿Es eso así?" Kate pregunta. "¿Entonces te importaría hacer una apuesta? Quien pierda la apuesta tendrá prohibido comer cualquier comida creada por Flower durante todo un día".

              "Oye, cecina y queso por un día no suena tan mal", digo. "Estoy dentro. Para que quede claro, estás apostando a que Hadrik gana esta pelea, ¿verdad?"

              "Sí, lo soy", dice Kate.

              "Entonces esperemos y veremos", digo.

              "Esto no tiene sentido", dice Arraka. "Los dos están igualados, y nunca se molestaron en definir condiciones claras de victoria antes de comenzar su batalla. Probablemente seguirán luchando durante una hora más o menos y luego se rendirán por aburrimiento. En lugar de perder el tiempo mirándolos, deberíamos continuar con nuestra lección de ayer".

              "Bueno, ya me conoces", le digo. "Nunca diré que no a una lección de magia. Déjame coger mi cuaderno y luego podremos empezar".

              Como prometió, Arraka pasó la siguiente hora enseñándome más sobre el hechizos que ella creó, mientras que Kate, Melindra, Flower y Illuna también nos escuchaban, pero no participaban activamente en nuestra discusión. Durante este tiempo, Arraka también me habló de algunos de los trucos que Eiden usó contra ella en su última batalla y sobre formas de contrarrestarlos.
          - source: scene_text_2
            paragraph: 28
            text: |-
              La batalla de Hadrik y Daren duró mucho tiempo, tal como Arraka predijo, y los dos estuvieron efectivamente igualados durante todo el duelo, sin embargo, lo que nadie podría haber predicho fue que la pelea terminó con Daren cediendo, porque tenía hambre y Hadrik era demasiado terco para terminar el partido en empate.

              Si bien este no era exactamente el resultado que tenía en mente cuando hice la apuesta con Kate, soy un hombre de palabra, así que decidí cumplir mi parte del trato y abstenerme de comer cualquiera de las delicias de Flower durante el resto del día.

              Una vez que Flower terminó de preparar comida de la nada para todos menos para mí, todos comenzamos a comer, mientras discutíamos nuestros planes para el resto del día.

              "Es casi mediodía", dice Daren, mientras le da un mordisco a un huevo de codorniz duro. "Esa reunión con los dioses ya debería haber comenzado, ¿verdad? ¿Creen que ese viejo Jirinn, como-su-cara, lo logrará?"

              "De todos los espíritus no divinos con los que luché en plano mágico, Jirinn fue probablemente el más competente, tanto como guerrero como líder", dice Arraka. "Tengo pocas dudas de que logrará lo que se propone hacer. Lo único de lo que no estoy seguro es si saldrá vivo o no después de pronunciar su pequeño discurso, reuniendo a todos contra los dioses. Eh... Supongo que pronto descubriremos si está muerto, ya que Daren inmediatamente perderá toda su magia si ese es el caso".
          - source: scene_3
            paragraph: 22
            text: |-
              "¿Qué--" dice Daren, mientras inmediatamente se levanta del suelo y su plato cae de su regazo. "¡¿Quieres decir que enviaste a ese idiota arrogante a una misión suicida sabiendo muy bien que su muerte significaría la pérdida de mi magia?! ¿En qué estabas pensando?"

              "Relájate..." dice Arraka. "Si sucede, entonces solo será un revés temporal. Por lo general, no toma más de un día para que alguien se vincule inconscientemente a otro espíritu si el que ya estaba vinculado termina muriendo. E incluso si vuelves a vincularte mal, simplemente hablaremos con este nuevo espíritu y le diremos que lo arregle. Un día sin magia no te matará. Aún tienes tu arma, escudo y armadura encantados, así que no es como si estuvieras indefenso ni nada".

              "¡Sí, pero recién me acostumbré a pelear sin mi armadura otra vez!" Daren dice. "¿Tienes idea de cuánto tiempo ha pasado desde que pude moverme tan libremente, sin que todo ese metal pesado me arrastrara hacia abajo? Maldita sea, realmente espero que ese bastardo de espíritu no se deje matar".

              "Estará bien", dice Arraka. "Él es uno de los pocos que sobrevivió después de convertirme en su enemigo, así que al menos puedo dar fe personalmente de su resistencia".

              "Daren, ¿puedo preguntarte qué planeas hacer con tu armadura ahora que ya no la vas a usar más?" Melindra dice. "Por lo que parece, la mayoría de esas piezas de placas blindadas son demasiado grandes para caber en tu mochila. Seguramente no planeas dejarlas aquí, ¿verdad?"
        choices:
