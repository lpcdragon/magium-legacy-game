              current_scene: b3_ch10b_wanted
  - name: b3_ch10b_steal
    texts:
      - source: scene_text
        paragraph: 6
        text: |-
          "Creo que quieres que absorba tu alma y robe todos tus poderes".

          "¡Ja!" Arraka dice. "Ahora tengo un pensamiento divertido. Tal vez valdría la pena enseñarte la técnica en algún momento, sólo para ver si eres lo suficientemente estúpido como para seguir adelante con algo así".

          "Entonces, ¿no es la técnica de absorción del alma en sí lo que estás tratando de enseñarme?" digo.

          "No, no lo es", dice Arraka.

          "¿Entonces qué?" pregunto.

          Arraka suspira.

          "¿Realmente no notaste nada más sobre el hechizo que te acabo de mostrar?" Arraka dice. "¿Nada en absoluto? Por favor, dime que no perdí todo ese tiempo eligiéndolo en vano".

          "Mmm..." digo. "Ahora que lo mencionas, había algo más que había notado. Cuando usaste tu técnica de absorción de alma antes, apuntaste al aire vacío frente a tu amuleto, ¿correcto?"

          "Mmm", dice Arraka.

          "Pero el aire no tiene alma..." digo.

          "Continúa", dice Arraka.
      - source: scene_text_2
        paragraph: 7
        text: |-
          "Normalmente, un hechizo creado con un propósito muy específico, como el tuyo, no debería poder activarse si no encuentra un objetivo apropiado", digo. "Si estuvieras tratando de aturdir una roca o ponerla a dormir, sería imposible, porque la roca no está viva. Usando la misma lógica, tu hechizo también debería cancelarse antes de ser lanzado, si no lo apuntas a alguien que tiene un alma en el Plano Etéreo. Dado que tu hechizo funcionó incluso en estas condiciones, significa que el diseño del hechizo es fundamentalmente diferente de la gran mayoría de hechizos que están siendo utilizados por los magos de hoy en día. Los principios subyacentes detrás de este hechizo podrían sentar las bases para una rama de la magia completamente nueva..."

          "Ya lo hicieron", dice Arraka.

          "¿Llegar de nuevo?" Le pregunto, confundida.

          "Formé una nueva rama de la magia, basada en los principios subyacentes de ésta hechizo", dice Arraka. "Lo hice hace muchos miles de años, cuando todavía estaba en el plano mágico, y cuando diseñar el nuevo hechizos solía ser mucho más fácil y rápido de lo que es ahora".

          "¿Solía ​​ser más fácil en aquel entonces?" digo. "¿Pero por qué?"

          "¿Quién sabe?" Arraka dice. "Tal vez sea porque ha pasado menos tiempo desde que el plano primordial se dividió en tres, y los nuevos planos de existencia aún no se habían estabilizado por completo. De cualquier manera, no importa. Lo que sí importa es que solo yo tengo acceso a estos hechizos, y planeo pasar los próximos días o semanas enseñándotelos".

          "Bueno, eso es ciertamente... generoso de tu parte", digo. "¿Cuál es el truco?"
      - source: scene_3
        paragraph: 5
        text: |-
          "No hay trampa", dice Arraka. "Te los habría enseñado antes, pero no tenías forma de lanzar magia, así que habría terminado siendo una pérdida de tiempo. Ahora, al menos puedes lanzar hechizos en el Plano Etéreo, así que hay algo de progreso por hacer. Has estado practicando todo tipo de hechizos en el Plano Etéreo durante los últimos días con la ayuda de Flower y Illuna, ¿verdad? Bueno, ahora puedes agregar estos nuevos hechizos míos a la lista".

          "No estoy seguro de si así es como funciona", digo. "Hasta donde tengo entendido, no hay magia real en Plano Etéreo. La única razón por la que puedo lanzar hechizos allí es porque la gente sabe sobre ellos, y por eso las ideas detrás de esos hechizos pueden alcanzar ese plano de existencia. Si me vas a dar algún secreto hechizos que solo tú conoces, no creo que pueda lanzarlos".

          "Funcionará, no te preocupes", dice Arraka. "Siempre que la raíz de un hechizo esté impresa correctamente en el tapiz, podrás lanzarlo sin importar en qué plano te encuentres".

          "Lo siento", le digo. "¿Impreso en qué? ..."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch10b_tapestry
