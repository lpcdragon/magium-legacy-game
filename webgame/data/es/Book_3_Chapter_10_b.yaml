  - name: b3_ch10b_tapestry
    texts:
      - source: scene_text
        paragraph: 9
        text: |-
          "El tapiz", dice Arraka. "Así es como lo llamamos en el plano mágico. No estoy seguro de si tienes una palabra equivalente aquí en el plano terrestre, o si tu gente siquiera lo sabe, pero es el lugar donde se definen todos los hechizos. Sabes que la mayoría de los hechizos tienen ciertas reglas y limitaciones, ¿verdad? Bueno, el tapiz es el lugar donde se imprimen estas reglas cuando se crean por primera vez los hechizos. Cada mago puede acceder a él inconscientemente, aunque se necesita mucha habilidad para encontrar un hechizo en él que no conoces en ningún otro lugar. Normalmente, también deberías haber tenido acceso al tapiz cuando tuviste la oportunidad de usar tus estadísticas mágicas".

          "Ahora que lo mencionas, lo que dices me suena algo familiar", le digo a Arraka. "Siempre pensé que hechizos debía venir de algún lugar de plano mágico, pero nunca me detuve a pensar en cómo funcionaba todo hasta ahora".

          "El tapiz no está en el plano mágico, ni en ningún otro plano", dice Arraka. "Es uno de los pocos vestigios de los días en que los tres planos de existencia todavía estaban unidos, al igual que las auras y el hechizos primordial."

          "Correcto", digo. "Entonces, básicamente, lo que estás diciendo es que si cambio mi conciencia al Plano Etéreo ahora mismo, ¿debería poder lanzar esa absorción de alma hechizo tuya?"
      - source: scene_text_2
        paragraph: 8
        text: |-
          "No, no la absorción del alma hechizo", dice Arraka. "Solo te mostré eso para que pudieras entender los principios básicos detrás de esto. Incluso la versión muy cruda del hechizo que les enseñé a las banshees sería muy difícil de entender para ti, ya que no eres un espíritu mágico que pueda aprender estas cosas intuitivamente. Sin embargo, tengo algunos hechizos en mente que serán particularmente útiles contra el Dios del Tiempo, y contra esa triste copia mía del universo paralelo al que fuimos enviados durante el ritual".

          "¿Pero qué pasa con Eiden?" digo.

          "No lo sé", dice Arraka. "¿Qué pasa con él?"

          "Luchaste contra él antes, ¿no?" Le pregunto. "¡Seguramente debes conocer algunas de sus debilidades! O al menos algunas de las lagunas que utilizó para derrotarte".

          "Sus 'lagunas', como usted las llama, eran en gran medida irrelevantes por sí solas", dice Arraka. "La primera vez que luché contra Eiden durante el tranquilo invierno, apenas era comparable a uno de los dioses de bajo nivel que masacré en el plano mágico cuando comencé mi alboroto inicial. Claro, tenía una cantidad ridícula de poder mágico, y su forma inventiva de eludir las reglas de hechizos fue bastante impresionante, pero esos no eran el tipo de trucos de los que me quejaba cuando les conté antes sobre mi lucha contra él".

          "¿No lo son?" digo. "¿Entonces qué?"
      - source: scene_3
        paragraph: 6
        text: |-
          "Como decía, en mi primera batalla contra Eiden, lo vencí fácilmente", dice Arraka. "Yo también lo habría matado, si ese idiota stillwater Therius no me hubiera detenido, dándole al zorro dorado suficiente tiempo para lanzarse en picado y teletransportar Eiden alejarse del peligro".

          "¿Cómo te detuvo exactamente el stillwater con el que estabas fusionado?" digo. "¿No dijiste antes que se suponía que era un debilucho?"

          "Era un debilucho comparado conmigo o con Eiden, pero aun así era más fuerte que cualquier otro stillwater en esa guerra, y también era un etéreo", dice Arraka. "El problema con etéreos es que su poder se multiplica exponencialmente mientras luchas contra ellos en el Plano Etéreo, especialmente dentro de su propia mente. Therius puede haber sido más débil que yo en el plano terrestre, pero en el Plano Etéreo era lo suficientemente fuerte como para forzar un punto muerto contra mí cuando invadí su mente, y para hacer que nuestras almas se fusionaran, en lugar de dejarme absorberlo. En la práctica, esto significaba que los dos de Nos vimos obligados a vivir juntos dentro de su mente durante la guerra invernal, tal como lo están haciendo Flower y Illuna ahora. Siendo de igual fuerza para mí en ese plano de existencia, Therius pudo interferir conmigo en múltiples ocasiones, incluida aquella vez cuando salvó a Eiden de ser asesinado, porque aparentemente eran "amigos", o algo así. No es que su amistad realmente fuera mucho cuando su viejo amigo Eiden regresó. asesinarnos a los dos, por supuesto."
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch10b_bend
  - name: b3_ch10b_bend
    texts:
      - source: scene_text
        paragraph: 10
        text: |-
          "Entonces, ¿cómo logró Eiden vencerte la segunda vez?" pregunto. "¿Fue porque recibió ayuda del zorro?"

          "Recibió mucha más ayuda que solo la del zorro dorado", dice Arraka. "La segunda vez que luché contra Eiden, fue como si me enfrentara a una persona completamente diferente. Ya no estaba usando solo lagunas jurídicas. Básicamente, estaba reescribiendo por completo las reglas de la magia de maneras cada vez más ridículas durante toda la pelea. Fue una experiencia extremadamente frustrante, especialmente para alguien tan bien aprendido en las artes de la magia como yo".

          "¿Estás seguro de que no estaba simplemente usando lagunas jurídicas que no conocías en ese momento?" digo.

          "¡Por supuesto que estoy seguro!" Arraka dice. "La mitad de las cosas que estaba haciendo en esa pelea fueron literalmente imposibles. Honestamente, estoy sorprendido de haber durado tanto, considerando lo estúpidamente injusta que fue toda esa batalla".

          "Pero si lo que me estás diciendo es cierto, y Eiden realmente puede alterar las leyes de la magia, ¿cómo podría alguien esperar derrotarlo en su estado actual?" digo.
      - source: scene_text_2
        paragraph: 9
        text: '"Dije que él ''podía'' alterar las leyes de la magia a voluntad, no que todavía pueda", dice Arraka. "En este momento, probablemente solo tenga acceso a una selección muy pequeña de trucos, en comparación con lo que tuvo durante su última pelea contra mí. Mi teoría siempre ha sido que su incomparable conocimiento mágico durante esa pelea de alguna manera vino del Magium, pero más recientemente, después de haber visto cómo un fragmento de Magium poseyó al Supervisor y casi deshizo todo nuestro universo en un intento de cazar al otro Arraka, creo que finalmente podría haber descubierto lo que pasó hace tantos años. Mi suposición es que uno de los fragmentos del Magium entró de alguna manera en contacto con Eiden y el zorro en algún momento después de mi primera pelea contra él, y les dio acceso a conocimiento prohibido con el propósito específico de derrotarme. Una vez cumplido su propósito, debieron haber perdido la mayor parte de su nuevo conocimiento, excepto las pequeñas partes que pudieron conservar como recompensa por su cooperación. Por eso fueron capaces de inventar un hechizo que crea comida de la nada, algo que normalmente debería haber sido imposible usando solo el conocimiento disponible en ese momento."'
      - source: scene_3
        paragraph: 7
        text: |-
          "Entonces, ¿estás diciendo que todavía hay una posibilidad?" Le pregunto. "¿Eiden todavía puede ser derrotado?"

          "¿Por qué estás tan obsesionado con encontrar formas de derrotar a Eiden?" Arraka dice. "Apenas ha mostrado interés en pelear contra ti en el pasado. Mientras no lo provoques abiertamente ni le pises los pies de alguna manera, no veo por qué tendrías que pelear con él antes de irte Varathia".
    choices:
      - position: 1
        text: Quizás tengas razón. Quizás debería concentrarme en el Dios del Tiempo.
        effects:
          - set:
              current_scene: b3_ch10b_racket
              b3_ch10_eiden: 0
      - position: 2
        text: Simplemente no puedo confiar en él. Es demasiado impredecible.
        effects:
          - set:
              current_scene: b3_ch10b_racket
              b3_ch10_eiden: 1
      - position: 3
        text: Si quiero ganar este torneo, también tendré que vencer a Eiden, ya que él es un participante.
        effects:
          - set:
              current_scene: b3_ch10b_racket
              b3_ch10_eiden: 2
      - position: 4
        text: Sólo intento tener mucho cuidado. Nunca se sabe lo que podría pasar.
        effects:
          - set:
              current_scene: b3_ch10b_racket
              b3_ch10_eiden: 3
  - name: b3_ch10b_racket
    routes:
      - condition: b3_ch10_eiden = 0
        texts:
          - source: scene_text
            paragraph: 11
            text: |-
              "Tal vez tengas razón. Tal vez debería concentrarme en el Dios del Tiempo".

              "Centrarse en Selkram está bien y todo eso, pero será mejor que no te olvides de la otra versión mía del pasado", dice Arraka. "Probablemente nos veremos obligados a luchar contra ella antes de tener nuestra batalla final contra el autoproclamado Dios del Tiempo".

              "Sí, no me he olvidado de ella", digo. "Nos aseguraremos de estar listos para ella cuando reanudemos el ritual".

              "Está bien", dice Arraka. "¿Tienes tu cuaderno contigo?"

              "Sí, está aquí, ¡dame un segundo!" Digo, mientras saco el cuaderno y un bolígrafo de la mochila que estaba a mi lado en el suelo.

              "Entonces prepárate", dice Arraka. "Tendrás mucho que escribir si quieres aprender algo de mi hechizos".

              No mucho después de que Arraka comience a darme detalles sobre su hechizos, escuchamos un ruido muy fuerte y distorsionado proveniente de transceptor de Daren mientras todavía está trabajando en ello. En lugar de dar señales de detenerse, el sonido sigue cambiando de tono y haciéndose más fuerte mientras Daren continúa pinchando el dispositivo con sus encantadoras herramientas.
          - source: scene_text_2
            paragraph: 10
            text: |-
              "¡¿Puedes apagar ese ruido infernal?!" Arraka grita. "¡Algunos de nosotros estamos tratando de enseñar aquí!"

              "Estás actuando como si hubiera alguien en el mundo que pudiera distinguir entre este ruido y las divagaciones tontas que llamas 'enseñanza'", dice Daren, mientras continúa trabajando en su dispositivo.

              "¿Qué es lo que estás tratando de hacer, idiota?" Arraka dice en voz alta. "¿Molestarnos a todos hasta la muerte?"

              "Pronto lo verás", dice Daren, mientras mueve una vez más una de sus herramientas y el tono del sonido que emite el transceptor se vuelve aún más insoportable de escuchar.

              Después de veinte segundos más de esta colorida actuación musical, los ruidos del dispositivo finalmente se detienen y son reemplazados por un breve período de silencio total, hasta que Daren finalmente decide tomar el transceptor en su mano y hablarle.

              "¿Hola?" Daren dice. "¿Puedes oírme?"

              Hay una breve pausa, pero luego escuchamos la voz de una mujer que sale del transceptor, hablando en un tono muy vacilante.

              "...Daren?" dice la mujer. "Daren, ¿eres....eres realmente tú?..."

              "Sí, Sophie", dice Daren. "Soy yo... He estado tratando de contactarte desde que llegué aquí, pero--"
          - source: scene_3
            paragraph: 8
            text: |-
              "¡¡¡Idiota !!!" La esposa de Daren grita, sonando como si estuviera a punto de llorar. "¡¿Tienes idea de lo preocupada que estaba por ti?! ¡Pensé que estabas muerta! Pensé que estabas muerta..."

              Luego la escuchamos recuperar el aliento un par de veces, mientras intenta evitar estallar en lágrimas.

              "Lo sé", dice Daren. "Lo siento mucho. Esta isla parece bloquear toda comunicación externa que no esté autorizada por los organizadores del torneo. No tenía idea de nada de esto antes de venir aquí. Si lo hubiera sabido, habría..."

              "Te advertí que no fueras allí..." Sophie lo interrumpe. "¿Por qué tienes que correr estos enormes riesgos cada vez? ¿Por qué siempre tiene que ser así? ¿Por qué al menos no pudiste llevarme contigo?..."

              "Sophie, ¡aquí es demasiado peligroso para ti!" Daren dice. "¡No podría haberte protegido!"

              "¡Puedo manejarme solo en una pelea!" Sophie dice. "¡Lo sabes!"
