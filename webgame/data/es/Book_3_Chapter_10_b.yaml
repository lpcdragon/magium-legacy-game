  - name: b3_ch10b_eavesdropping
    routes:
      - condition: ch11_saved_rose = 1 AND ch11_romance_rose = 0
        texts:
          - source: scene_text
            paragraph: 4
            text: |-
              "¿Aún no has logrado contactar a tu esposa después de todo este tiempo?" Hadrik le pregunta.

              "No, y sinceramente estoy empezando a preocuparme un poco por ella", dice Daren. "Ha pasado casi un mes desde la última vez que hablé con ella, y no había razón para sospechar que el torneo duraría tanto. Ni siquiera puedo empezar a imaginar lo difícil que debe haber sido para ella, esperando tener noticias mías estas últimas semanas, sin saber si estaba vivo o muerto. Si existe la más mínima posibilidad de que pueda comunicarme con ella haciendo esto, tengo que intentarlo".

              "¡Muy bien, entonces tómate tu tiempo!" Hadrik dice. "No hay necesidad de apresurar las cosas por mi cuenta. ¡Continúe y asegúrese de que todo funcione como se esperaba!"

              "Gracias", dice Daren. "Yo haré eso".
          - source: scene_text_2
            paragraph: 5
            text: |-
              "¡Oye, idiota!" Arraka me dice, por el amuleto alrededor del cuello de Flower. "Deja de escuchar a escondidas y presta atención a lo que estoy haciendo. No es frecuente que tengas el privilegio de aprender de un genio como yo".

              "Prestaría un poco más de atención si no fueras tan increíblemente malo explicando las cosas", le digo a Arraka. "Honestamente, no tengo idea de cómo Illuna logró aprender algo de ti".

              "Cállate", dice Arraka. "Me toma una hora entera lanzar este hechizo mientras estoy en el maldito amuleto, y no planeo hacerlo dos veces. Lo menos que puedes hacer es tener la decencia de mirarlo. Ahora, ¿estás listo o no?"

              "Claro, lo que sea", digo. "Estoy listo".

              "Entonces asegúrate de observar hasta la última partícula mágica que fluye de mi amuleto", dice Arraka. "Si haces eso, entenderás rápidamente por qué te estoy mostrando esto. Aquí va".
          - source: scene_3
            paragraph: 3
            text: |-
              Mientras Arraka está eligiendo su hechizo, ni siquiera tengo tiempo para preguntarme qué quiso decir, porque un intenso sentimiento de pavor me abruma de inmediato. Es exactamente el mismo sentimiento que tuve durante la primera prueba del ritual del Dios del Tiempo, y también hace quince años, cuando mi hermana se convirtió por primera vez en un alma en pena. Ahora que lo pienso, también recuerdo haber tenido una sensación similar, aunque no exactamente igual, cuando Arraka poseyó el cuerpo de Flower después de romper su amuleto. ¿Podría esto significar que ahora está lanzando el hechizo que constituye la base del despertar de una banshee?

              "Parece que reconoces este hechizo", dice Arraka, probablemente después de ver mi reacción por el flujo de mi aura. "Eso es bueno. Significa que hoy deberíamos estar logrando algunos avances rápidos".

              "Lo que acabas de hacer..." le digo a Arraka. "Era extremadamente similar a lo que hace una banshee cuando despierta, pero había una diferencia muy sutil. Lo puedo notar, porque tuve la oportunidad de presenciarlo varias veces durante mi ritual, y también tengo una muy buena idea sobre la forma en que se forman los patrones en la mayoría de los flujos mágicos. Creo que la principal diferencia fue... ¿el enfoque?"

              "Exactamente", dice Arraka. "¿Ves? Puedes hacerlo si lo intentas. Sí, la principal diferencia es el enfoque, pero ¿puedes decir cuál es el enfoque de este hechizo? ¿Cuál es su verdadero propósito?"
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch10b_banshees
      - condition: ch11_saved_rose = 0
        texts:
          - source: scene_text
            paragraph: 3
            text: |-
              "Bueno, cuando le dije por primera vez que había decidido viajar alrededor del mundo ayudando a las personas necesitadas, le ofrecí el divorcio", dice Daren. "Sentí que habría sido demasiado egoísta de mi parte pedirle que me esperara durante años seguidos, sólo durante los pocos momentos en los que estaríamos juntos en las raras ocasiones en que regresaría a casa. Sin embargo, ella ni siquiera quería oír hablar de esta propuesta, así que entonces le ofrecí un compromiso. Le dije que como era culpa mía que estuviéramos lejos el uno del otro durante tanto tiempo, no me enfadaría con ella si decidiera pasar su vida con otro hombre, aunque técnicamente seguiríamos casados."

              "¿Y ella lo hizo?" Kate pregunta Daren.

              "No..." dice Daren. "Al principio, traté de alejarla, convenciéndome de que era por su propio bien, pero no importaba lo que hiciera, incluso si me iba durante años sin siquiera enviarle una carta, ella todavía esperaba pacientemente mi regreso. Al ver que no podía convencer a Sophie de que me dejara ir sin importar lo que hiciera, finalmente me di por vencido y decidí trabajar para mejorar la calidad de nuestra relación a larga distancia. Fue entonces cuando se me ocurrió la idea de encantar transceptores mágicos para aumentar su alcance, para que podamos continuar comunicándonos incluso cuando estemos en diferentes continentes. Al menos... hasta ahora."

              "Vaya..." dice Hadrik. "Entonces, ¿no has logrado contactar a tu esposa desde que comenzó este torneo? ¡Debe estar muy preocupada!"

              "Lo sé", dice Daren. "Espero que todo esto cambie hoy. Creo que ya casi he resuelto este asunto de transceptor. Puedo sentirlo".
