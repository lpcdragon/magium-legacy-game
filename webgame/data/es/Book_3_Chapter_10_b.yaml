  - name: b3_ch10b_interacts
    texts:
      - source: scene_text
        paragraph: 15
        text: |-
          "Este no es el ring de lucha en casa", dice Daren. "¡Todos aquí son magos! Bueno... casi todos. ¡No habrías tenido ninguna posibilidad contra ellos! Sophie, por favor, sé que has estado entrenando duro todos estos últimos años mientras yo estaba fuera, esperando que algún día te llevara conmigo en uno de mis viajes, pero este era el último lugar donde hubiera querido que te unieras a mí. Las cosas que he visto aquí... Ni siquiera podrías imaginar--"

          "¡Oye, idiota!" Arraka grita, de repente. "¿Qué tal si te levantas de esa roca, tomas tu transceptor y llevas esa conversación tuya a otro lugar? Preferiblemente a algún lugar lejos de aquí, donde no me vea obligado a escuchar tu voz irritante mientras doy mi lección".

          "¿Qué tal si tomo tu amuleto y lo tiro al río, vieja bruja molesta?" Daren se ajusta. "¿En serio no puedes quedarte callado ni siquiera por un minuto?"

          "Eh... ¿Daren?" Sophie dice. "¿Quién era ese?"

          "Oh, eso fue..." dice Daren, tratando en vano de encontrar una manera de describir Arraka a alguien que nunca la ha conocido antes. "Eso fue, eh..."

          "Su nombre es Arraka", interviene Hadrik. "Ella es un espíritu de diez mil años atrapado en un amuleto que ha amenazado con destruir el mundo entero varias veces en el pasado, y también mató a más de la mitad de los dioses ella sola. Soy Hadrik, por cierto. Una buena amiga de Daren. ¡Es un placer conocerte!"
      - source: scene_text_2
        paragraph: 11
        text: |-
          "¿Un amigo?..." pregunta Sophie, sonando muy sorprendido. "Pero... ¡Daren no tiene amigos!"

          "¡Jajajajaja!" Hadrik se ríe. "Pensé que podrías decir algo así. ¡Te aseguro que soy bastante real, y nada imaginario, si eso es lo que estás insinuando!"

          "¡No, no lo entiendes!" Sophie dice. "Daren siempre viaja solo. Lo ha hecho toda su vida. E incluso cuando regresa aquí, apenas interactúa con nadie de nuestra ciudad natal. ¡Prácticamente ha estado alejando a la gente desde que tengo memoria! He escuchado a muchas personas agradeciéndole por salvarlos, o cantando sus alabanzas por sus actos heroicos, pero nunca antes había escuchado a nadie llamarlo amigo abiertamente. ¿Qué ha cambiado? ¿No sigue siendo el mismo gruñón e inaccesible? Daren que conozco desde que éramos niños?"

          "¡Oh, no necesitas preocuparte por eso!" Hadrik dice. "Sigue tan de mal humor como siempre. ¡Pero todos nos hemos acostumbrado!"
      - source: scene_3
        paragraph: 9
        text: |-
          "¿'Todos'?..." pregunta Sophie, confundido. "¿Hay más de ustedes? ¿Cuántas personas viajan en su grupo en este momento?"

          "Actualmente somos... ocho, dependiendo de cómo quieras contarnos", dice Daren. "Técnicamente, dos viven dentro del mismo cuerpo, pero siguen siendo dos individuos diferentes, así que..."

          "¡¿Ocho personas ?!" Sophie dice. "¿Viajas con otras siete personas? Y... ¿el resto de estas personas también son tus amigos?"

          "Quiero decir... ¡sí, me gustaría pensar que sí!" Daren dice. "Algunos de ellos, al menos."
    choices:
      - position: 1
        text: No te preocupes, todos somos sus amigos. Tu marido está en buenas manos.
        effects:
          - set:
              current_scene: b3_ch10b_hands
      - position: 2
        text: No le hagas caso, se engaña. Sólo nos paga para que digamos que somos sus amigos.
        effects:
          - set:
              current_scene: b3_ch10b_delusional
  - name: b3_ch10b_hands
    texts:
      - source: scene_text
        paragraph: 16
        text: |-
          "No te preocupes, todos somos sus amigos. Tu marido está en buenas manos".

          "¡Habla por ti mismo, lunático!" Arraka dice. "Si alguna vez llega el día en que llame a alguno de ustedes mis amigos, tienen mi permiso para cortarme la garganta y poner fin a mi miseria, porque ese sería el día en que claramente me despediré de todos mis sentidos".

          De repente, la esposa de Daren suelta una carcajada.

          "Lo siento, no quise reírme", dice Sophie. "Es solo que... ¡Estoy tan feliz por ti, Daren! Nunca pensé que vería el día en que estarías rodeado por un grupo de amigos, discutiendo entre ellos. Todo se siente tan surrealista... ¡Tal vez algo bueno salió de este torneo de magos después de todo!"

          "No quiero interrumpir", dice Kate, "pero me parece bastante extraño que te sorprendiera más que Daren tuviera amigos que la mención de un espíritu de diez mil años en un amuleto, o los dos individuos que viven dentro del mismo cuerpo. ¿Podemos estar seguros de que todas las palabras se transmiten correctamente a través de transceptor en este momento?"

          "Oh, no, escuché sobre el espíritu en un amuleto y todas esas cosas, pero... Daren y su amigo, umm... Hadrik solo estaban bromeando, ¿verdad?" Sophie dice. "No hay manera de que estuvieran hablando en serio acerca de que viajabas con un espíritu maligno que ha matado a la mitad de los dioses, ¿verdad?..."

          Luego hace una pequeña pausa y ve que ninguno de nosotros le responde.

          "¿Verdad?..." pregunta de nuevo, esta vez en un tono más incierto.
      - source: scene_text_2
        paragraph: 12
        text: |-
          "Sophie", dice Daren, "Creo que quizás necesites tomar un vaso de agua y sentarte en algún lugar. Hay muchas cosas que necesito contarte".

          A Daren le toma más de media hora resumir adecuadamente todas las cosas que nos han sucedido desde que llegamos a Varathia, pero eventualmente logra poner al día a su esposa con la mayoría de los eventos principales que ocurrieron durante nuestro tiempo aquí.

          Sophie tuvo que preguntarle a Daren varias veces durante su relato de los eventos si hablaba en serio o no, debido a lo increíbles que eran algunas de sus historias, pero eventualmente entendió que nada de lo que él estaba diciendo era una broma, y ​​confió en él lo suficiente como para no dudar de ninguna de las cosas que le contó, sin importar cuán ridículas pudieran haber sonado desde la perspectiva de un extraño.

          Una vez que Daren termina con su historia, Sophie permanece en silencio por un momento, tratando de ordenar todo en su cabeza.

          "Daren..." dice Sophie, finalmente. "Estas cosas que me has contado... Tus continuos esfuerzos por derrotar a uno de los dioses... tu viaje a un mundo del pasado, donde había vehículos metálicos volando en el cielo... tu charla sobre una entidad que puede borrar universos enteros de la existencia... Esto es mucho para asimilar".

          "Lo sé", dice Daren. "Créame, he experimentado todo esto de primera mano y todavía me resulta difícil de creer. ¡Pero todo es verdad, lo prometo!"
      - source: scene_3
        paragraph: 10
        text: |-
          "Daren, te creo, pero... ¿no crees que te estás esforzando demasiado?" Sophie dice. "Al principio, solo se trataba de salvar a la mayor cantidad de personas posible. Luego, querías una manera de salvar a todas las personas del sufrimiento. Pensé que finalmente habías encontrado una manera de hacerlo uniéndote a este torneo, pero ahora descubro que este mundo nuestro ni siquiera es todo lo que hay. Por lo que me has dicho, debe haber miles de otros mundos ahí fuera, tal vez incluso millones, todos ellos con diferentes versiones de nosotros mismos haciendo diferentes cosas. ¿Querrás salvar esos mundos también? ¿Dónde termina todo?"

          "Yo... realmente no he pensado en eso", dice Daren. "Tal vez una vez que tenga acceso al Magium, podré viajar entre mundos y luego..."

          "¡NO!" Sophie grita. "¡No, no, no! ¡Dejarte ir a otros continentes es una cosa, pero dejarte ir a otros mundos es demasiado! Si quieres viajar a otros mundos, tendrás que llevarme contigo, ¿entiendes? ¡¡¡Me voy contigo! ¡¡¡No quiero vivir el miedo de perderte así nunca más!!!"

          "¡Está bien, está bien!" Daren dice. "¡Lo siento! La próxima vez que salga de algún lugar, te llevaré conmigo. ¡Lo prometo!"

          "... ¿De verdad lo dices en serio?" Sophie pregunta.

          "¡Sí!" Daren dice. "¡Tienes mi palabra!"

          "Te haré cumplir esta promesa, ya sabes..." dice Sophie. "Te lo recordaré hasta el día de tu muerte".

          "No lo haría de otra manera", dice Daren, mientras sonríe.
