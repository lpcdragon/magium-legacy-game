  - name: b3_ch10b_ideal
    texts:
      - source: scene_text
        paragraph: 30
        text: |-
          En el escenario ideal, el discurso de Jirinn debería ser suficiente para reunir a la mayoría de los espíritus a su lado, dándole la oportunidad de escapar mientras los dioses estarían demasiado ocupados peleando entre ellos para detenerlo. Por lo tanto, Jirinn tendría la oportunidad de formar un nuevo grupo de guerreros iluminados en los próximos días, mientras que los dioses tendrían que elegir si querrían ponerse del lado de Ulruk y Selkram o luchar contra ellos en la inevitable guerra que se avecina.

          Obviamente, el escenario ideal no está ni de lejos garantizado, y muchas cosas podrían salir mal, pero Jirinn definitivamente parece lo suficientemente motivado para llevarlo a cabo, sin importar el riesgo. Como ya hemos establecido, Jirinn nos brindará actualizaciones periódicas sobre la situación el plano mágico, aunque hemos acordado no comunicarnos con él en los próximos dos días, para evitar exponerlo a riesgos innecesarios al ser descubierto teniendo una conversación con nosotros.
      - source: scene_text_2
        paragraph: 23
        text: |-
          Tan pronto como termina la discusión entre Arraka y Jirinn, todos decidimos irnos a la cama, ya que la luna ya estaba bastante alta en el cielo cuando todo estuvo dicho y hecho. Por suerte para mí, no tengo ningún turno nocturno programado para hoy, así que por primera vez finalmente puedo dormir sin interrupciones hasta altas horas de la mañana.

          Cuando me despierto en mi tienda unas diez horas más tarde, noto que mi dispositivo de estadísticas está emitiendo un pitido a mi lado, aunque no estoy seguro de cuánto tiempo lleva haciendo esto. Parece que he recibido algunos puntos nuevos. Ya era hora.
