  - name: b3_ch10b_succumb
    texts:
      - source: scene_text
        paragraph: 31
        text: |-
          Una vez que termino con el potenciador de estadísticas, me quito el pijama, pongo el dispositivo en mi bolsillo derecho y luego salgo de la tienda.

          "Entonces, estaba pensando..." Escucho la voz de Hadrik, mientras salgo del área de tiendas y me acerco al río. "Arraka, dijiste ayer que todas las banshees aprendieron a poseer personas de ti o de espíritus a los que les enseñaste la técnica, ¿verdad? Entonces, ¿qué pasa con todos los demás espíritus femeninos que nacen en este mundo y no saben cómo poseer personas?"

          "Se mueren", le responde Arraka, simplemente.

          "Pero... dijiste que una parte del Magium se encarga de crear nuevos espíritus para equilibrar los que mueren, ¿no?" Hadrik dice. "¿Significa esto que hay miles de espíritus femeninos que renacen cada día sólo para morir una y otra vez? ¿Y esto ha estado sucediendo durante cinco mil años?"
      - source: scene_text_2
        paragraph: 24
        text: |-
          "Más o menos", dice Arraka. "En primer lugar, no 'renacen' en el verdadero sentido de la palabra, ya que las nuevas banshees que se crean no tienen los recuerdos de las antiguas que murieron. En segundo lugar, los espíritus no mueren inmediatamente después de ser traídos a este mundo. Por lo general, vuelan sin rumbo durante al menos unos días antes de sucumbir inevitablemente a su muerte. No tienen cuerpos, voces ni ningún medio real para comunicarse con nadie del reino terrestre, pero a veces su presencia es sentida por ciertas personas, que verlos en sus sueños o quiénes pueden distinguir sus formas a altas horas de la noche. Estas apariciones espectrales generalmente se denominan fantasmas. Ah, y no son "miles" de espíritus femeninos los que se reencarnan cada día sólo para morir, sino decenas de miles, o incluso más".

          "¡¿Decenas de miles ?!" Hadrik pregunta, sorprendido. "¿Y estás de acuerdo con esto?"

          "¿Qué hay para estar bien?" Arraka dice. "Les di una oportunidad de luchar, ¿no? Les enseñé cómo sobrevivir. Ahora, el resto depende de ellos. Y además, no es que pudiera haber hecho mucho más por ellos incluso si hubiera querido. Estuve atrapado en una montaña durante más de cuatro mil años, ¿recuerdas?"
      - source: scene_3
        paragraph: 18
        text: |-
          "Sí, pero dijiste que has estado vagando libre en cuerpos de animales desde el invierno y hasta que quedaste atrapado en el amuleto hace veinte años", dice Hadrik. "Eso es lo que... ¿seiscientos años, casi? ¡Podrías haberlos ayudado durante este tiempo!"

          "¿Ayudarlos a hacer qué, exactamente?" Arraka pregunta. "¿Matar a todas tus mujeres y robar sus cuerpos? Te das cuenta de que incluso con mi técnica de absorción de almas, alguien todavía necesita morir, ¿verdad? Con la excepción de etéreos, no es posible que las almas de una banshee y su anfitrión vivan juntas dentro de la misma mente. En todo caso, deberías estar agradecido de que no enseñé a más espíritus femeninos mi técnica de absorción de almas. En este momento, la cantidad de banshees en tu mundo es muy pequeña, por lo que todavía son manejables debido a la existencia de cazadores de almas en pena, pero si cada espíritu femenino adquiriera un cuerpo, rápidamente llevarían a toda la población a la extinción. Esto podría haber sido divertido por un tiempo, claro, pero un mundo que ha sido vaciado de todos sus habitantes probablemente se volvería aburrido muy rápidamente."
    choices:
      - position: 1
        text: Entonces, ¿debo entender que tenemos que agradecer a Arraka que nuestro mundo no haya sido destruido?
        effects:
          - set:
              current_scene: b3_ch10b_hypothetical
              b3_ch10_destroyed: 0
      - position: 2
