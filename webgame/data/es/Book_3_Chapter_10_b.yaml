  - name: b3_ch10b_face
    texts:
      - source: scene_text
        paragraph: 26
        text: |-
          "Oye, no somos criaturas primitivas. ¡Tu cara es una criatura primitiva!"

          "Mi cara es--" Jirinn comienza a decir, pero luego se interrumpe. "Arraka, ¿escuchaste lo que dijo? ¿Estos salvajes ni siquiera pueden formar oraciones coherentes y quieres que ayude a uno de ellos a usar magia?"

          "Le estarías ayudando, por supuesto, pero al hacerlo, también te estarías ayudando a ti mismo", dice Arraka.

          "¿De qué estás hablando?" Pregunta Jirinn.

          "¿No has notado que algo extraño está sucediendo con tus poderes mágicos en el pasado... digamos, cuarenta y cinco años más o menos?" Arraka dice. "¿No te ha resultado más difícil concentrarte en lanzar hechizos, por ejemplo? ¿O tal vez tu magia no ha sido tan fuerte como solía ser?"

          "Sí, pero... asumí que todo estaba sucediendo debido a mi vejez", dice Jirinn. "¿Me estás diciendo que todos los problemas que he tenido durante el último medio siglo se deben a mi vínculo con esa criatura terrestre?"

          "De hecho", dice Arraka. "Oh, pero ni siquiera pienses en intentar deshacer el vínculo, porque te garantizo que no se puede hacer. En el mejor de los casos, solo terminarás lastimándote al eliminarlo. En el peor de los casos, puedes terminar muerto".

          "Entonces, ¿qué propones?" Pregunta Jirinn.
      - source: scene_text_2
        paragraph: 21
        text: |-
          "La razón por la que tú y el humano en cuestión están teniendo problemas con tu magia probablemente se debe a que el vínculo se realizó incorrectamente", dice Arraka. "Ya sabemos que el aura de su alma tenía este problema en particular, por lo que las posibilidades de que suceda lo mismo con el vínculo entre ustedes dos son muy altas. Illuna, me dijiste que Flower tenía algún tipo de medicamento para curar las náuseas de Daren en el Plano Etéreo. ¿Puedes decirme exactamente para qué sirve el medicamento?"

          "No sé si esto significa algo para ti", dice Illuna, "pero Flower me dijo que el propósito del medicamento era alinear la esencia giratoria con la masa en espiral. ¿No es así, Flower?"

          "Sí, para eso es", dice Flower.

          "Está bien, en otras palabras, el enlace está ligeramente fuera de posición", dice Arraka. "Jirinn, creo que para alguien de tu habilidad, debería ser bastante fácil hacer los reajustes apropiados siempre y cuando sepas qué buscar, ¿correcto?"

          "Creo que sí..." dice Jirinn.

          "¡Perfecto!" Arraka dice. "Entonces te recomiendo que te pongas a trabajar inmediatamente. Si empiezas ahora, normalmente deberías haberlo terminado mañana por la mañana".

          "¿Qué es esta... mañana de la que hablas?" dice Jirinn.
      - source: scene_3
        paragraph: 16
        text: |-
          "Puedo ver que tu total falta de interés por todo lo que sucede en el plano terrestre no ha cambiado ni un poco desde la última vez que hablé contigo", dice Arraka. "Para responder a tu pregunta, una mañana en el plano terrestre es cuando el sol sale por primera vez en el cielo, y cuando comienza un nuevo día. ¿Recuerdas cómo hace mucho tiempo, después de que los dioses comenzaron a involucrarse fuertemente con la gente del plano terrestre, comenzamos a tomar prestadas sus unidades de medida del tiempo, como días, horas, minutos y años? Bueno, un día completo se mide como el tiempo entre dos salidas del sol, y un año es el tiempo que tarda el gran objeto esférico de tierra sobre el que estamos actualmente en girar alrededor del sol. O al menos esa es mi teoría. La mayoría de la gente aquí parece pensar que el sol es el que gira alrededor de nosotros y que la tierra sobre la que estamos es solo una superficie larga y plana, así que trato de no discutir este tema con ellos para preservar mi cordura."

          "Oye, Daren, ¿escuchaste eso?" Hadrik dice. "Arraka cree que estamos parados encima de una gran esfera que gira alrededor del sol. ¡JAJAJAJAJA!"

          "Mira, esta es exactamente la razón por la que no les hablo de esas cosas", le dice Arraka a Jirinn, mientras Hadrik todavía se ríe a carcajadas de fondo. "Es una completa pérdida de tiempo y energía".

          "Pareces tener una relación bastante amistosa con estos... humanos", dice Jirinn. "El Arraka que conocía nunca habría bromeado con criaturas terrestres ni habría pedido ayuda a un antiguo enemigo en su nombre. ¿Qué ha cambiado?"
