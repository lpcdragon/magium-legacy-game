  - name: b3_ch10b_enlightened
    texts:
      - source: scene_text
        paragraph: 25
        text: |-
          "¿Estás hablando de ese hechizo tuyo que usabas para absorber otros espíritus?..." dice Jirinn. "Si no recuerdo mal, esta fue la razón invocada por los tres dioses que mencionaste que convenció a todos los demás dioses y espíritus poderosos de estar de acuerdo con el plan de desterrar al resto de las mujeres junto contigo. Recuerdo que presentaron una prueba muy débil de que solo las mujeres de las razas civilizadas podían lanzar el hechizo de absorción de espíritus y que había un peligro inminente de que otros como tú pudieran comenzar a aparecer cada segundo. Los otros espíritus tenían mucho miedo de tu hechizo en ese momento que se tragaron sus argumentos fácilmente, pero siempre pensé que había algo extraño en su explicación".

          "Mhm..." dice Arraka. "De hecho, una de las razones principales por las que necesitaban enviar a las otras hembras conmigo es porque Memphir no sabía una manera de desterrarme, específicamente, del plano mágico. Lo creas o no, siempre y cuando sepas lo que estás haciendo, en realidad es más fácil alterar el Magium para desterrar a la mitad de los espíritus de las razas civilizadas a otro plano de existencia que seleccionar solo un espíritu y enviarlo al plano terrestre. Sólo necesitas acceso a una tremenda cantidad de energía, que fue proporcionada, por supuesto, por todos los espíritus idiotas que fueron capaces de estafar."

          "Si lo que dices es cierto, entonces esta información podría poner nuestro mundo patas arriba..." dice Jirinn. "La guerra que se iniciaría debido a esto podría costar miles de vidas. Tal vez decenas de miles. ¿Es esto lo que buscas? ¿Quieres que todos nos matemos unos a otros para tu entretenimiento, porque ya no estás aquí para hacerlo tú mismo? ¿Por qué crees que aceptaría ser parte de tal plan?"
      - source: scene_text_2
        paragraph: 20
        text: |-
          "No seas así, Jirinn..." dice Arraka. "Si fueras cualquier otro espíritu, te predicaría sobre la injusticia de todos los espíritus femeninos que esencialmente han sido sentenciados a muerte por razones equivocadas, pero tú y yo sabemos lo que realmente quieres. Quieres que haya caos tanto como yo. Tal vez incluso más que yo. ¿No es esa la verdadera razón por la que fundaste tu pequeño grupo de guerreros 'iluminados'? Al principio, estabas luchando contra los dioses, pero cuando comencé mi alboroto, inmediatamente cambiaste de objetivo y comenzaste a perseguirlos. Ahora, es posible que hayas engañado a los demás haciéndoles creer que estabas haciendo esto por las razones correctas, pero creo que sabes muy bien que ese nunca fue el caso. La verdadera razón por la que querías cazarme fue porque te gustaba el desafío. Al principio solo luchabas contra los dioses porque lo percibías como una batalla desesperada, pero cuando aparecí, reconociste mi fuerza de inmediato y decidiste oponerte a mí. ¿Qué has estado haciendo durante los últimos miles de años? ¿Ha habido alguna vez un momento en el que te hayas sentido más vivo que entonces?"

          "...No", dice Jirinn. "Después de tu destierro, volví a luchar contra los dioses, junto con mis guerreros iluminados, pero como dices, nunca volvió a ser lo mismo. Eventualmente, mi grupo se disolvió y en los años siguientes los dioses ganaron más influencia que nunca. Ahora casi no queda nadie que desafíe su supremacía, e incluso para alguien como yo, sería nada menos que suicida oponerme abiertamente a ellos en este punto".
      - source: scene_3
        paragraph: 15
        text: |-
          "¿Verás?" Arraka dice. "Eso es exactamente de lo que estaba hablando. Lo que eres ahora es sólo una cáscara vacía de tu antiguo yo. Lo que te estoy concediendo es la oportunidad de volver a tus días de gloria. Tan pronto como dejes que todos sepan la verdad, se formará una gran división entre las facciones de los dioses. Esto los debilitará y te brindará la tan esperada oportunidad de reorganizar tu grupo iluminado y convertirte una vez más en una fuerza a tener en cuenta. Piénsalo. ¿No es esto lo que has estado buscando toda tu vida?"

          "Veo que sigues siendo tan astuto como siempre", dice Jirinn. "Al menos sé que todos esos años pasados ​​en el plano terrestre no te hicieron menos astuto. Hmm... Tendré que pensar en lo que me dijiste... ¿Me proporcionarás, por supuesto, pruebas innegables para respaldar tus afirmaciones?"

          "Por supuesto", dice Arraka. "Incluso conocí a Selkram hace una semana y media, así que puedo confirmar personalmente que los espíritus todavía están absorbidos por él. Verificar este hecho será trivial".

          "¿Te reuniste con Selkram?..." pregunta Jirinn. "¿Cómo?"

          "Él se materializa en el plano terrestre por un corto tiempo cada vez que realiza sus rituales", dice Arraka. "Así es como pude hablar con él. De todos modos, antes de darte todos los detalles que necesitas, tengo un asunto adicional que discutir contigo. Se trata del humano que está vinculado a ti. El que hablaste antes."

          "No puedes hablar en serio..." dice Jirinn. "¿Realmente vas a pedirme que ayude a esta... criatura primitiva?"
