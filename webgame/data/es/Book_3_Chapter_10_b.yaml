        texts:
          - source: scene_text
            paragraph: 23
            text: |-
              "¿Qué consecuencias, hombre?..." dice Daren. "Estamos en diferentes planos de existencia. ¿En serio estás tratando de decirme que si no dejo de usar magia, vendrás aquí y me golpearás?"

              "Tu insolencia no me divierte, criatura terrestre", dice el espíritu. "Te he dado una advertencia y harías bien en prestarle atención".

              "¿Por qué sigues llamándome 'criatura terrestre'?" Daren dice. "¿Es por algún dialecto plano mágico que no entiendo, o simplemente dices eso para engañarte y pensar que eres superior a mí?"

              "Estás tratando de provocarme con tus palabras, pero lo único que obtendrás de mí es lástima, nada más", dice el espíritu.

              "Te das cuenta de que no te dejaré en paz hasta que obtenga lo que quiero de ti, ¿verdad?" Daren dice. "Podemos hacer esto toda la noche. Tengo todo el tiempo del mundo".

              "Entonces hablarás contigo mismo", dice el espíritu. "No tengo nada más que decirte".

              "Oye, tú lo pediste", dice Daren. "Debo advertirte, sin embargo... Conozco los versos de muchas canciones folclóricas antiguas, y soy un cantante terrible. Sólo dime cuando sea demasiado para ti y pararé".
          - source: scene_text_2
            paragraph: 18
            text: |-
              Daren entonces comienza a cantar lo que parece ser el himno nacional de uno de los países del Continente Sur, y puedo confirmar que efectivamente es un cantante horrible. No creo que haya tocado ni una sola nota correcta hasta ahora, y tampoco siento que esté planeando hacerlo. El problema con este plan suyo es que el espíritu del plano mágico no es el único que tiene que escucharlo cantar, y parece que algunos de nosotros ya estamos llegando a nuestros límites.

              "¡Buenos dioses!" Hadrik dice. "Daren, ¡ten piedad de nosotros, por favor!"

              "Esta no puede ser una canción real", dice Kate, mientras se tapa los oídos con las palmas. "Me niego a creerlo".

              "Entonces, ¿es seguro asumir que le gustaría que interviniera ahora, o tal vez preferiría escuchar el concierto completo?" Arraka me pregunta.

              "Bien, tú ganas", le digo a Arraka. "Si eso hace que el canto se detenga, entonces haz lo que tengas que hacer".

              "Muy bien", dice Arraka, y luego comienza a gritar para que el espíritu pueda escucharla a través del ruido de fondo del canto de Daren. "¡Oye, Jirinn! ¿Estás disfrutando la serenata? No es vergonzoso rogarle que se detenga, ¿sabes? Incluso los 'seres supremos' como tú deben tener su punto de ruptura".

              "Esa voz..." dice el espíritu del plano mágico, mientras Daren ahora ha detenido su canción. "No he escuchado esa voz en miles de años. ¿Podría ser realmente... Arraka?"
          - source: scene_3
            paragraph: 14
            text: |-
              "Lo hiciste bien en el primer intento", dice Arraka. "Supongo que no te llaman 'iluminado' por nada."

              "Debería haber sabido que seguirías vivo después de todo este tiempo", dice Jirinn, el espíritu. "Siempre fuiste particularmente difícil de matar. Como una cucaracha".

              "¿Tienen cucarachas en el plano mágico?" Daren dice. "¿No se suponía que todo allí era incorpóreo?"

              "Ya te dije que casi todas las razas terrestres tienen un equivalente en el plano mágico, idiota", dice Arraka. "Esto incluye obviamente también todo tipo de animales e insectos".

              "Entonces, después de cinco mil años, finalmente encontraste una manera de hacer contacto con el plano mágico, ¿verdad, vieja bruja?" Jirinn le dice a Arraka a través de transceptor. "Entonces, ¿qué sigue? ¿Estás planeando regresar y terminar lo que empezaste? Porque he estado deseando matarte desde la última vez que peleamos, y definitivamente me vendría bien la práctica".

              "Si estás de humor para pelear, entonces tengo lo que necesitas", dice Arraka. "¿Qué pasaría si te dijera que el motivo del destierro de todas las mujeres de las razas civilizadas del plano mágico fue una mentira fabricada por el Dios del Tiempo, el Dios de la Muerte y el Dios del Destino? ¿Qué pasaría si te dijera que tengo pruebas incuestionables de que Selkram y Ulruk mismos han usado mi técnica de absorción de almas en el pasado?"
