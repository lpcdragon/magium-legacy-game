  - name: b3_ch10b_bumbling
    texts:
      - source: scene_text
        paragraph: 19
        text: |-
          "Por supuesto", dice Daren. "Verás, es bastante simple, en realidad. El transceptor es un objeto, lo que significa que como encantador, puedo usar mis herramientas de encantamiento sobre él para manipular libremente su aura en cualquier forma que crea conveniente. Obviamente, solo aprendí este hecho recientemente, después de que descubrí que los objetos tienen auras, porque hasta hace una semana estaba seguro de que solo estaba usando mis herramientas para lanzar hechizos de encantamiento sobre estos objetos. De todos modos, lo que estoy tratando de decir es que no puedo usar mis herramientas de encantamiento conmigo mismo, porque no soy un objeto, por lo que analizar mi propia aura para encontrar la cuerda invisible de la que estás hablando sigue siendo tan imposible para mí como antes."

          "¡¡¡Entonces usa tu transceptor, imbécil torpe!!!" Arraka finalmente se rompe. "¡¿Realmente tengo que contarte todo?!"

          "¿Quieres que use mi transceptor para... contactar con un espíritu mágico en otro plano de existencia?..." pregunta Daren, confundido.

          "¡SÍ!" Arraka dice. "¿Qué clase de imbécil eres? ¡No puedo creer que haya desperdiciado tantas horas de mi vida tratando de explicarte todos estos conceptos abstractos cuando fácilmente podrías haber hecho lo que te pedí desde el principio! ¡¡¡Si no me tomara tanto tiempo conjurar dos manos físicas de este amuleto, te estrangularía hasta la muerte en el acto!!!"
      - source: scene_text_2
        paragraph: 14
        text: |-
          "No tienes ningún sentido..." dice Daren. "Me dijiste que la única forma de contactar a este espíritu es a través del vínculo que existe entre nuestras dos auras. ¿Cómo exactamente se supone que mi transceptor ayudará en esta situación?"

          "Necesitas VINCULARLO con tu aura, genio", dice Arraka. "Primero vinculas tu transceptor a tu aura, luego giras ese dial tuyo hasta que encuentras la frecuencia correcta, y una vez que la has identificado, usas tus herramientas encantadoras para desenredar el flujo del aura. No puedo creer que realmente necesite decirte cómo hacer tu propio trabajo".

          "Si sabías que era posible hacer todo esto con un transceptor, ¿por qué no me lo dijiste?" Daren dice. "Nos habría ahorrado a ambos el problema."

          "¿Cómo se supone que iba a saber que así es como funciona tu transceptor, bufón?" Arraka dice. "Ya te dije una vez que no podría tener menos interés en jugar con dispositivos. El encantamiento es el único tipo de magia del que no sé casi nada, porque nunca me molesté en importarme un carajo. No hay objetos físicos en el plano mágico, así que no tenía idea de que esta rama de la magia existía hasta que fui desterrado a este reino. ¡Eres el único aquí que sabía encantar lo suficientemente bien como para poder descifrarlo!"
      - source: scene_3
        paragraph: 12
        text: |-
          "Está bien, está bien", dice Daren. "La próxima vez, no cometeré el error de suponer que sabes de lo que estás hablando. He aprendido la lección".

          "Cállate y ponte a trabajar", dice Arraka. "Si tenemos suerte, podremos contactar con ese espíritu tuyo antes de que llegue el momento de irte a dormir. Lo único bueno de todo esto es que tu transceptor nos permitirá a cada uno de nosotros hablar con tu espíritu, no solo a ti, así que al menos podré comunicarme con él directamente. Será mejor que no arruines esto".

          "Sí, sí", dice Daren, mientras ahora está sacando sus herramientas encantadoras de su mochila nuevamente para poder trabajar en su transceptor.
