                  b3_ch10_misunderstanding: 2
      - condition: b3_ch10_destroyed = 1
        texts:
          - source: scene_text
            paragraph: 33
            text: |-
              "¿Por qué supones que las razas terrestres perderían contra las banshees?"

              "¿Por qué crees?" Arraka me pregunta. "Es obviamente porque cada espíritu del plano mágico puede lanzar magia, mientras que en tu plano de existencia solo los magos pueden hacer eso. Si también agregas a esto el hecho de que el espíritu promedio probablemente será mejor en magia que el mago promedio del plano terrestre, el resultado es fácil de predecir para cualquiera".

              "Sí, pero olvidas que tenemos guerreros y asesinos que no son magos y que pueden usar armas encantadas y también manipuladores que pueden crear dispositivos mágicos", digo. "Por lo tanto, las banshees no necesariamente lucharían sólo contra los magos".

              "¡Ja!" Arraka dice. "Si crees que alguno de esos idiotas tendría alguna posibilidad contra un espíritu mágico, entonces no has estado prestando atención".
