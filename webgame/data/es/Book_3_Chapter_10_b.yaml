  - name: b3_ch10b_delays
    texts:
      - source: scene_text
        paragraph: 45
        text: |-
          "¡Oh, sí, gracias por recordármelo!" Daren dice. "Oye, Hadrik, me he estado preguntando esto desde hace un tiempo, pero esa mochila tuya no tiene actualmente su tamaño real, ¿verdad? Una vez me dijiste que pagaste dinero extra por sus encantamientos para que pudiera contener cientos de botellas de cerveza enana en su interior y evitar que se rompieran, pero aun así, no puedo imaginar que cualquier encantador que se precie permitiría almacenar tantos artículos dentro de una mochila tan pequeña, ya que pondría demasiado mucha presión sobre ello."

          "Tienes razón", dice Hadrik. "Uno de los encantamientos de la mochila hace que cambie de tamaño junto conmigo, siempre y cuando la use cuando cambio de forma. Es el mismo tipo de encantamiento que tengo en mi ropa, armadura y botas. En realidad, el tamaño de la mochila es mucho más grande".

          "¡Lo sabía!" Daren dice. "En ese caso, ¿puedes hacerme un favor? ¿Te importaría cambiar tu talla temporalmente, para que pueda colocar mi armadura dentro de tu mochila? Sería un verdadero dolor tener que atar todas estas piezas a mi mochila para poder cargarlas..."

          "Hmm..." dice Hadrik. "Bueno, el rey gnomo me dijo que no se me permitiría convertirme en gigante mientras dure este torneo, pero supongo que si cambio de forma a un tamaño un poco más grande sólo por un corto tiempo, no debería ser un gran problema. ¡Muy bien, considéralo hecho!"

          "¡Muchas gracias!" Daren dice. "Esto realmente me quita un peso de encima. Entonces... ¿cuándo nos vamos? Melindra, ¿terminaste tus negociaciones con ese amigo tuyo que tiene el detector de piñas? ¿Cuándo podremos reunirnos con ellos?"
      - source: scene_text_2
        paragraph: 30
        text: |-
          "¡Ummm, pronto!" Melindra dice, viéndose un poco incómodo. "¡Muy pronto! Sólo hay... algunos arreglos de último momento de los que necesito encargarme, y luego seguiremos nuestro camino".

          "Correcto..." dice Daren, en un tono algo poco convencido. "Bueno, tómate todo el tiempo que necesites. Solo asegúrate de no olvidarte del juramento de encantador. Hasta ahora no ha estado actuando de ninguna manera, pero podría tener algún tipo de reacción negativa si el hechizo considera que te estás estancando demasiado".

          "Lo sé", dice Melindra. "No lo he olvidado. Yo... me aseguraré de que no haya demoras innecesarias que puedan causar problemas con el hechizo".

          "Mientras lo entiendas, está bien", dice Daren. "De todos modos, deberíamos darnos prisa y terminar de comer. Para ser honesto, todavía estoy un poco enojado por cómo terminó mi pelea con Hadrik, así que tengo ganas de una revancha".

          "Oye, ofrecí un compromiso, ¿no?" Hadrik dice. "Dije que podíamos comer mientras seguíamos peleando. ¡Tú fuiste quien se rindió de la nada antes de que pudiéramos hablar del asunto!"

          "Sí, sí", dice Daren. "Lo que digas, Hadrik. No te preocupes, esta vez no habrá más interrupciones, así que estoy seguro de que pronto tendremos un claro ganador".
      - source: scene_3
        paragraph: 23
        text: |-
          Una vez que hayamos terminado de comer, Daren y Hadrik se preparan para comenzar la segunda ronda de su batalla, como dijeron que lo harían. Sin embargo, justo cuando están a punto de comenzar, de repente se nos une un nuevo espectador, que se teletransporta justo al lado de nuestro grupo, mientras actúa con tanta naturalidad y despreocupación como ya esperábamos de él.

          "¿Qué pasa?" Eiden nos pregunta, con los ojos cerrados como siempre, después de que todos nos quedemos mirándolo fijamente durante unos segundos sin decir nada. "No hay necesidad de detener la pelea por mi cuenta. ¡Por favor, continúa!"

          "Eiden otra vez..." dice Daren, y luego suspira. "Veo que todavía estás caminando con los ojos cerrados, vestido con pijama como si acabaras de levantarte de la cama. Algunas cosas realmente nunca cambian, ¿verdad?"

          "Estos no son pijamas", dice Eiden. "Son telas de alta calidad hechas con las sedas más finas. Solían ser bastante populares hace seiscientos años. Melindra, me sorprende que hayas viajado tanto tiempo con ellos y no les hayas contado esto hasta ahora".

          "Hmph", dice Melindra, mientras se cruza de brazos y gira la cara hacia él, con un puchero. "No estoy hablando contigo."

          "Ahora, ¿es esa alguna forma de tratar a un viejo amigo?" Eiden dice, mientras se acerca a ella.

          "No eres mi amigo", dice Melindra. "Los amigos no se ignoran cuando lo necesitan. Incluso llegaste a lanzarme un hechizo de silencio en la arena Thilias y hacerme parecer un idiota cuando estaba hablando contigo. ¡No creas que alguna vez olvidaré eso!"
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch10c_collector
              storyboard_controls: Jump to frame "Book 3 Chapter 10 c"
