  - name: b3_ch10b_frequency
    texts:
      - source: scene_text
        paragraph: 20
        text: |-
          Durante la siguiente hora más o menos, Daren se centró en vincular su transceptor a su aura como había dicho que haría, mientras Arraka continuaba enseñándome sobre el hechizos que ella creó mientras todavía estaba en el plano mágico. Cuando terminó de contarme sobre el hechizos más básico de su repertorio, ya había llenado diez páginas de mi cuaderno con todos los detalles oscuros y técnicos que ella me había dado.

          Mientras tanto, cada uno de los demás miembros de nuestro equipo se había mantenido ocupado con sus propios entrenamientos individuales, excepto Melindra, que todavía no había regresado desde esta mañana. Cuando Arraka estaba a punto de terminar su lección introductoria y pasar a nociones algo más avanzadas, escuchamos a Daren llamándonos.

          "¡Chicos, creo que lo logré!" dice en voz alta. "Ven aquí por un segundo."

          Todos nos reunimos lentamente alrededor de Daren para ver de qué está hablando. Al acercarme a él, me doy cuenta de que transceptor realmente se siente diferente a antes. Es difícil describir exactamente qué tiene de diferente, pero si tuviera que intentar expresarlo con palabras, diría que el dispositivo parece estar perfectamente en sintonía con el aura de Daren, hasta el punto de reaccionar a cada uno de sus movimientos, o incluso a un ligero cambio en sus emociones o tono de voz.
      - source: scene_text_2
        paragraph: 15
        text: |-
          Cuando ve que estamos todos lo suficientemente cerca para escucharlo claramente, Daren toma el transceptor en su mano y luego gira hacia Arraka.

          "El transceptor ahora está vinculado a mi aura y me he encargado de todos los bloqueos que podrían obstruir el canal de comunicación hacia el plano mágico", dice Daren. "Lo único que queda por ver es si la frecuencia que configuré es correcta".

          "No habría habido bloqueos que solucionar si no hubieras elegido la frecuencia correcta, así que dudo que haya alguna manera de que te hayas equivocado", dice Arraka. "De cualquier manera, sabremos con certeza que funciona tan pronto como contactemos tu espíritu. ¡Ahora date prisa y activa tu transceptor! Tengo curiosidad por ver a qué espíritu has estado vinculado y si lo conozco o no".
