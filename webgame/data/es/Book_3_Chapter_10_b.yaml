  - name: b3_ch10b_hypothetical
    routes:
      - condition: b3_ch10_destroyed = 0
        texts:
          - source: scene_text
            paragraph: 32
            text: |-
              "Entonces, ¿debo entender que tenemos que agradecer a Arraka que nuestro mundo no haya sido destruido?"

              "Por supuesto que tienes que agradecértelo a mí", dice Arraka. "Diablos, prácticamente he estado salvando tu mundo todos los días durante los últimos seiscientos años simplemente eligiendo no destruirlo".

              "Creo que quisiste decir durante los últimos quinientos ochenta años", dice Illuna. "A menos que estuvieras insinuando que había alguna forma posible en la que podrías haber amenazado con destruir el mundo desde el interior de ese amuleto".

              "Te sorprenderías", dice Arraka.

              "Estoy seguro de que lo haría", dice Illuna, en tono desdeñoso.
          - source: scene_text_2
            paragraph: 25
            text: |-
              "Oye, Barry, ¿tienes un minuto?" Melindra dice, desde algún lugar detrás de mí. "Necesito hablar contigo sobre algo en privado".

              "Oh, hola Melindra", digo. "No sabía que habías regresado. Claro, tengo un minuto".

              Luego sigo a Melindra lejos de los demás, mientras Hadrik y Arraka continúan su conversación en segundo plano.

              "Mira, no estaba sugiriendo que deberías dejar que las banshees maten a todas las mujeres", le dice Hadrik a Arraka. "Estaba pensando que tal vez encontrarías alguna otra manera de ayudarlos".

              "Bueno, si quieres, podría sacarlos de su miseria un poco más rápido que el tiempo que les toma morir por sí solos", dice Arraka. "¿Eso sería lo suficientemente útil para ti?"

              "¡Maldita sea, sabes lo que quise decir!" Hadrik dice.
          - source: scene_3
            paragraph: 19
            text: |-
              Tan pronto como nos alejamos del alcance de todos los demás, Melindra comienza a hablar, con una mirada bastante seria en sus ojos.

              "Barry, conoces a Kate desde hace más tiempo que yo...", dice. "¿Cómo crees que reaccionaría si se sintiera... un tanto traicionada por alguien a quien considera su amigo?..."

              "¿Estamos hablando de un escenario puramente hipotético, por supuesto?" Le pregunto, sabiendo muy bien que en realidad se estaba refiriendo a ella misma.

              "Sí, sí... ¡puramente hipotético!" Melindra dice.

              "Bueno, para responder a tu pregunta", digo, "la última vez que Kate pensó que la había traicionado, me inmovilizó contra un árbol y me puso un cuchillo en la garganta".

              "Oh..." dice Melindra, en un tono que sugiere que esta no era exactamente la respuesta que le hubiera gustado escuchar. "Y, umm... ¿cómo lograste convencerla de que fue un malentendido?"
        choices:
          - position: 1
            text: Utilicé el poder del amor y la amistad.
            effects:
