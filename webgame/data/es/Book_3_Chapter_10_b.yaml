  - name: b3_ch10b_banshees
    texts:
      - source: scene_text
        paragraph: 5
        text: |-
          "¿Su verdadero propósito?..." digo, y luego me tomo unos segundos para pensar en lo que dijo Arraka. "Bueno, cuando una banshee despierta, lo primero que quiere hacer es..."

          Dejo de hablar de repente, porque la imagen de mi hermana convirtiéndose en un alma en pena aparece repentinamente frente a mis ojos, mientras trato de recordar los detalles del despertar. Una vez que me calmo, continúo con mi línea de pensamiento.

          "Lo primero que quiere hacer es tomar el control total del cuerpo del anfitrión", digo. "Cuando estaba dentro del ritual del Dios del Tiempo, casi podía... sentir la desesperación con la que la banshee se aferraba a su propia vida, luchando para expulsar a mi hermana de su cuerpo, para poder reclamarlo como suyo. Pero si esa banshee realmente estaba tratando de usar el hechizo que me acabas de mostrar, entonces claramente lo estaba usando mal. Ese hechizo nunca estuvo destinado a centrarse en el cuerpo, ¿verdad? Su verdadero objetivo debería haber sido el alma de la víctima. Esa es la verdadera razón por la cual la banshee que poseía a mi hermana se convirtió en una monstruosidad abominable, mientras que tú y la banshee que trabajaba para Talmak podían conservar las formas de tus anfitriones. El verdadero propósito del hechizo que me acabas de mostrar es... la absorción del alma."
      - source: scene_text_2
        paragraph: 6
        text: |-
          Inmediatamente después de decir estas dos últimas palabras, Arraka lanza un hechizo que suena como si estuviera aplaudiendo lentamente.

          "¡Bravo!" Arraka dice, mientras el sonido de las palmas aún se puede escuchar de fondo. "Bravo. De los cientos de personas a las que les hice esta pregunta en el pasado, tú y Illuna fueron los únicos que la respondieron correctamente tan rápido. Ah, y supongo que Flower también lo descubrió por su cuenta, pero nunca me molesté en hacerle la pregunta, así que no cuenta".

          "¿Le hiciste esta pregunta a cientos de personas?" digo. "Pero... ¿a quién?"
      - source: scene_3
        paragraph: 4
        text: |-
          "Banshees, en su mayoría", dice Arraka. "Hubo un tiempo en el pasado en el que pude haber tenido un... ligero sentimiento de culpa con respecto a la expulsión de los espíritus femeninos del plano mágico. Un sentimiento de culpa muy pequeño, casi insignificante, claro, pero aún así culpa. Es por eso que pasé los primeros días después de mi destierro hace cinco mil años enseñando a varios de los espíritus femeninos más viejos y sabios cómo absorber almas para sobrevivir en este plano de existencia. Al principio se negaron, por supuesto, pero una vez que les quedó claro que no tenían forma de sobrevivir en este mundo sin adquirir un cuerpo terrestre, la mayoría de ellos aceptaron a regañadientes usar mi técnica. Estos espíritus más antiguos luego se encargaron de enseñar la técnica de absorción de almas a tantos espíritus desterrados como pudieron encontrar, y así, se formó la primera generación de banshees. De lo contrario, no veo cómo la banshee que trabajaba para el sabio del norte habría podido enterarse de mí y de mi papel inicial en el destierro de todos los espíritus femeninos."

          "Pero... ¿por qué me enseñas a absorber almas?" Le pregunto a Arraka. "¿Qué propósito podrías tener al hacer tal cosa?"

          "¿Por qué no intentas responder esa pregunta tú mismo, Barry-chico?" Arraka dice. "¿Cuál crees que es mi propósito al enseñarte sobre este hechizo?"
    choices:
      - position: 1
        text: Creo que quieres que absorba tu alma y robe todos tus poderes.
        effects:
          - set:
              current_scene: b3_ch10b_steal
