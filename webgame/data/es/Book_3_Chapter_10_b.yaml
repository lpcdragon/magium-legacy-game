            text: |-
              "¿No sería malo que te conocieran, considerando tu historia allí?"

              "No necesariamente", dice Arraka. "Claro, me hice muchos enemigos en el pasado, pero lo creas o no, también tenía algunos aliados. Como mi objetivo principal era los dioses y sus seguidores del plano mágico, algunos de los espíritus a quienes no les gustaban las políticas de los dioses se unieron detrás de mí, pensando que estaba tratando de iniciar una revolución o algo así".

              "¿Y crees que alguno de ellos podría estar todavía vivo?" pregunto.

              "Cualquiera que fuera lo suficientemente tonto como para confundir mi disputa personal con los dioses con una especie de cruzada contra tiranos malvados probablemente fue ejecutado poco después de mi destierro, como castigo por luchar junto a mí", dice Arraka. "Sin embargo, hubo muchos espíritus que optaron por no tomar partido durante ese conflicto, y no veo ninguna razón por la que algunos de ellos no sigan presentes hoy".

              "Bueno, entonces esperemos que el espíritu con el que estoy vinculado sea uno de los neutrales, porque de lo contrario todo esto puede terminar siendo una gran pérdida de tiempo", dice Daren. "Estoy abriendo el canal ahora. Prepárate".

              Luego toca el transceptor y comienza a hablarle.
