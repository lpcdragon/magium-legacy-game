  - name: b3_ch09a_reference
    texts:
      - source: scene_text
        paragraph: 30
        text: |-
          "Oh, creo que ya lo entiendo", digo. "Cuando recuperé mis manos por primera vez, recuerdo haber sentido una fuerte necesidad de poder moverme, ahí afuera... en el lugar lleno de luz, y debe ser por eso que pude materializarlas. ¡Por la fuerte emoción que estaba sintiendo en ese momento!"

          "Para referencia futura", dice Illuna, "el 'lugar lleno de luz' fuera de esta casa se llama 'el éter'. Ahí es donde eventualmente terminan todas las almas una vez que mueren los cuerpos del plano terrestre con el que estaban vinculadas, y también donde comienzan a descomponerse lentamente en materia etérea".

          "¿En realidad?" Pregunta Flower, sorprendida. "¡¿La luz que hay ahí fuera es sólo un montón de almas muertas?!"

          "¿Por qué estás tan sorprendido?" dice Illuna. "Has estado viviendo aquí por más tiempo que yo, ¿no?"

          "Sí", dice Flower, "pero pensé que la razón por la que había tanta luz era porque estábamos muy cerca del sol o algo así..."

          "Aquí no hay sol", dice Illuna. "Este es el Plano Etéreo".

          "Oh, claro. Claro... ¡Lo sabía!" Flower dice, en un tono nervioso.

          "Entonces, ¿tienen alguna idea de lo que nos pasó y dónde están todos los demás?" digo. "¿Daren, Kate y Melindra todavía están ahí afuera en el éter? ¿Qué pasa con el rey del subsuelo y sus hombres?"
      - source: scene_text_2
        paragraph: 19
        text: |-
          "No estoy seguro de qué hizo exactamente el Supervisor", dice Illuna, "pero supongo que de alguna manera debe haber hecho uso de su nuevo conocimiento sobre los cristales azules y el Magium para sacar de sus propias mentes las almas de todos en el área".

          "Recuerdo que Kate nos contó en un momento cómo leyó en un viejo libro Lessathi que la mente de una persona supuestamente está ubicada en el Plano Etéreo y no en el plano terrestre", digo. "Cuando dices que las almas fueron expulsadas de sus mentes, ¿estás hablando de sus mentes que están ubicadas aquí, en este plano de existencia?"

          "Sí", dice Illuna, "me refiero a las estructuras fortificadas que están diseñadas para defender cada alma contra los efectos corrosivos del éter, y que también están destinadas a ayudar a conectar el alma con su cuerpo terrestre. Esta casa en la que estamos, por ejemplo, es la mente de Flower".

          "¿Es así?..." digo, mientras miro mejor la habitación en la que me encuentro.

          "En cualquier caso, creo que nos estamos desviando demasiado del tema original", afirma Illuna. "Lo que estaba tratando de decir es que si el Supervisor realmente encontró una manera de sacar de sus mentes a todas las personas en la plaza, entonces la mayoría de las personas involucradas en la lucha contra los drones deberían estar flotando en el éter ahora mismo".
      - source: scene_3
        paragraph: 13
        text: |-
          "Mmm..." digo. "Pero Flower dijo que todos deberían estar aturdidos, ¿verdad? ¿Cómo los encontraremos si no podemos ver sus cuerpos y si no tienen la mente lo suficientemente lúcida para responder a nuestras llamadas?"

          "Pregúntale a Flower", dice Illuna. "Ella fue quien os encontró a vosotros, Hadrik y Leila, no yo".

          "¡Oh!" Dice Flower, cuando nos ve a todos mirándola. "Bueno, verás... Cuando me di cuenta de lo que pasó, tuve esta repentina y urgente sensación de que tenía que hacer algo o todos morirían, y luego, eh... y luego..."

          Hace una pausa para pensar, como si le estuviera costando describir lo que le pasó.

          "Y luego sus ojos se pusieron de un rojo brillante y toda el aura alrededor de su cuerpo se incendió", dice Illuna. "Lo siguiente que sabes es que ella podría localizar fácilmente tu paradero desde cualquier lugar del Plano Etéreo, y podría atravesar largas distancias casi instantáneamente. Todavía no estoy del todo seguro de cómo sucedió eso, pero basándome en la poca cantidad de información que tengo a mi disposición, voy a asumir que fue algo parecido a una siguiente etapa de evolución que es específica de los etéreos, o algo parecido".
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch09a_collapsed
  - name: b3_ch09a_collapsed
    texts:
      - source: scene_text
        paragraph: 31
        text: |-
          "Sí, creo que tienes razón en cuanto a que esto es algo únicamente etéreo", digo. "La amiga de Kate, Diane también es etérea, según Kate y recuerdo claramente que sus ojos brillaban cuando nos atacó en el bosque sagrado. Ah, y no sé si recuerdas esto, pero los ojos de Flower también brillaban con un color rojo brillante esa vez cuando luchó contra Eiden antes de que entremos en Thilias. Esta... 'etapa de evolución', como la llamaste, podría ser algo relacionado con su estado emocional, porque tanto Flower como Diane estaban realmente enojadas o realmente decididas cada vez que su Los ojos empezaron a brillar."

          "Uhm..." dice Flower, "Realmente me encantaría quedarme aquí y charlar, pero estoy empezando a preocuparme un poco de que los demás también intenten respirar, como casi lo hizo Barry, así que será mejor que vaya a traerlos rápidamente a mi casa sólo para estar segura. ¡Ya vuelvo!"

          Luego queda cubierta por una luz blanca y se teletransporta fuera de la habitación.

          "Oye, Illuna", digo después de un rato, "¿puedes por casualidad ver lo que está pasando en el plano terrestre?"

          "Sí", dice Illuna. "Estamos dentro de la mente de Flower ahora mismo, así que puedo controlar su cuerpo".

          "¿Qué pasó con nuestros cuerpos de tierra?" digo. "¿Están inconscientes o?..."
      - source: scene_text_2
        paragraph: 20
        text: |-
          "Sí, sus cuerpos están inconscientes, pero ilesos", dice Illuna. "Nadie se está moviendo en este momento. Ni siquiera los drones. El único que está despierto en el área donde se estaba llevando a cabo la pelea aparte de mí es Arraka, quien está despotricando sobre cómo ni siquiera podemos defendernos de un miserable ataque a nuestras almas desde el Plano Etéreo".

          "Si los drones no se mueven, ¿podría ser posible que el Supervisor también haya desplazado su propia alma por error?" pregunto. "De lo contrario, no veo ninguna razón por la que no intentaría al menos capturar a los rebeldes mientras están desplomados en el suelo".

          "Tendremos que preguntarle a Flower si puede sentirlo en algún lugar del éter una vez que regrese", dice Illuna. "Si él está ahí afuera, entonces tu teoría será muy probable".

          "¿Flower también sabe dónde están nuestras mentes?" Escucho la voz interior de Leila hablando, mientras tiene la boca cerrada. "No recuerdo haber sido sacado de mi mente, así que no puedo ayudarla con direcciones incluso si puede teletransportarme allí".

          "Desafortunadamente no, ella no parece ser capaz de detectar dónde están tus mentes", dice Illuna. "Es por eso que tuvo que traerlos a todos aquí, en su opinión, como medida temporal".

          "¿Su mente?...", pregunta Hadrik, de repente. "¿Qué quieres decir con su mente? ¿No es esta su casa?"
      - source: scene_3
        paragraph: 14
        text: |-
          "No, esta no es una casa real", dice Illuna, un poco irritada. "Ya hemos hablado de esto. Ella hizo que pareciera una casa, pero en realidad, esto es el interior de su mente. Tiene control total sobre este lugar y puede convertirlo en lo que quiera".

          "Pero ¿cómo...?" comienza a decir Hadrik, pero luego se interrumpe. "Uf... No importa. Miren, voy a ser honesto con ustedes. Desde que llegué a la casa de Flower, he estado intentando con todas mis fuerzas no pensar en nada para que ustedes no escuchen mis pensamientos, pero el problema es que cuando estoy tan concentrado en no pensar en voz alta por accidente, ¡apenas puedo seguir nada de lo que están diciendo! ¿Cómo pueden conversar de manera tan casual sin mezclar sus palabras habladas con sus pensamientos internos? ¡No lo entiendo!"

          "Bueno, eh..." digo, mientras Leila y yo intercambiamos una mirada. "Illuna ha estado aquí durante mucho tiempo, por lo que ya debe ser algo natural para ella. En cuanto a Leila y a mí, creo que es porque ya hemos estado en el Plano Etéreo una vez antes, y tenemos una idea general de cómo funciona esto de 'pensar en voz alta'".

          "¡Ah, entonces ustedes dos ya son expertos en el campo!" dice Hadrik. "Como experto, no tendrías algún consejo para un principiante como yo, ¿verdad, Barry?"
    choices:
      - position: 1
        text: Seguro. Sólo intenta vaciar tu mente. ¡Eso funciona mejor para mí!
        effects:
          - set:
              current_scene: b3_ch09a_pastry
              b3_ch9_advice: 0
      - position: 2
        text: En realidad, no es necesario que dejes de pensar. Simplemente no uses palabras mientras piensas.
        effects:
          - set:
              current_scene: b3_ch09a_pastry
              b3_ch9_advice: 1
      - position: 3
        text: Lo siento, lo hago de forma instintiva, por lo que es difícil de explicar.
        effects:
          - set:
              current_scene: b3_ch09a_pastry
              b3_ch9_advice: 2
  - name: b3_ch09a_pastry
    routes:
      - condition: b3_ch9_advice = 0
        texts:
          - source: scene_text
            paragraph: 32
            text: |-
              "Claro. Sólo intenta vaciar tu mente. ¡Eso funciona mejor para mí!"

              "Sí, eso es lo que he estado tratando de hacer, ¡pero parece que no puedo concentrarme en nada mientras tengo la mente en blanco!" dice Hadrik. "¿No hay algún truco o algo que no entiendo y que me hará la vida más fácil?"

              "No, no lo creo", digo. "Probablemente sólo necesites más práctica, eso es todo".

              "Tenía miedo de que pudieras decir algo así", me dice Hadrik. "Supongo que entonces tendré que esforzarme más. Bueno, ¡no me hagas caso! Puedes continuar tu conversación antes de que te interrumpiera mientras averiguo todo. ¿De qué estabas hablando otra vez?"

              "Yo... como que lo olvidé", digo. "Esperemos a que Flower regrese y decidiremos juntos qué se debe hacer a continuación".

              Mientras esperamos en silencio a que Flower regrese, un ligero olor a comida quemada se está infiltrando lentamente en nuestra habitación, proveniente de una puerta que parece conducir a una especie de cocina.

              "Oye, ¿a alguien más le huele a masa quemada?" dice Hadrik.
          - source: scene_text_2
            paragraph: 21
            text: |-
              Justo cuando Hadrik termina de hablar, Flower aparece en la habitación, con lo que supongo que son el resto de nuestros amigos, aunque no puedo ver sus cuerpos.

              "¡Perdón por haberme ido por tanto tiempo!" Flower dice. "Fue REALMENTE difícil localizar a Daren por alguna razón. ¡Tomen asiento en algún lugar, muchachos! No es necesario que todos estén de pie".

              "Ugh... mi cabeza... ¡me siento tan mareada!" Escucho la voz de Daren, mientras el resto de nosotros nos sentamos en las sillas y la cama disponibles en la habitación. "¿Nadie más siente náuseas en este plano de existencia? ¿Solo yo?"

              "No", escucho la voz de Melindra proveniente de algún lugar cerca de Daren. "No tengo sensación alguna de náuseas ni de mareos".

              "Yo también me siento bien", la voz de Kate ahora se puede escuchar desde algún lugar cerca de Daren y Melindra.

              "Sí, y estoy bastante seguro de que nadie más en esta sala se siente mareado, o ya lo habrían mencionado", dice Hadrik. "Creo que eres solo tú, amigo".

              "Genial..." dice Daren. "Es solo mi suerte. Si tan solo hubiera alguna forma de lanzar uno de mis hechizos contra las náuseas en este lugar..."

              "¡Espera, te daré un medicamento!" Dice Flower, mientras abre un cajón y saca una pequeña caja de madera.
