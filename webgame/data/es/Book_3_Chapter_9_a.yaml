  - name: b3_ch09a_air
    texts:
      - source: scene_text
        paragraph: 55
        text: |-
          "Si sólo tuviera tiempo para uno, el aire sería mi elección", digo.

          "¿En serio?" Melindra dice. "¿Quieres aprender magia de viento de mí aunque ya sabes que no tengo control total sobre mi propia magia?"

          "Oye, hasta donde yo sé, sólo tienes problemas para controlar el nivel de tu poder, no los hechizos en sí", digo. "¡Estoy seguro de que te irá bien como profesora!"

          Melindra se encoge de hombros.

          "Si crees que ya sabes suficiente teoría mágica para llenar los vacíos, entonces sé mi invitado", dice. "Simplemente no vengas a quejarte después si esto termina siendo una gran pérdida de tiempo".

          Paso los siguientes minutos mostrándole a Melindra los hechizos de viento que ya sé lanzar, mientras ella me da algunos consejos sobre cómo mejorar mi postura y mis movimientos para que pueda hacer los hechizos más efectivos. Sin embargo, cuando terminamos con los que conozco, las cosas empiezan a volverse un poco más difíciles.
      - source: scene_text_2
        paragraph: 40
        text: |-
          "Hmm..." dice Melindra, después de verme fallar un hechizo que acaba de explicarme. "Dame un segundo. Estoy tratando de descubrir cómo explicar esto de una manera que tenga sentido para alguien que está acostumbrado a aprender magia de los libros y no mediante prueba y error".

          "Quiero decir, también estoy bien con el ensayo y error, siempre y cuando no lleve mucho tiempo", digo. "¿Cómo sueles aprender nuevos hechizos?"

          "Bueno", dice Melindra, "no estoy segura de cómo funciona la magia en este plano de existencia, ya que parece que no puedo hacer que funcione yo misma, pero lo que normalmente hago es intentar, eh... resonar con la frecuencia correcta de la energía mágica que se acumula dentro de mí mientras lanzo el hechizo. ¿Eso tiene sentido para ti?"

          "Creo que sí, sí..." digo. "Así es como lanzas hechizos como elementalista, ¿verdad? Recuerdo haber hecho algo similar cuando tenía mis estadísticas mágicas desbloqueadas durante mis peleas con Tyrath y los esqueletos de stillwaters. El problema es que realmente no siento ninguna energía dentro de mí mientras lanzo hechizos en este reino, así que no puedo hacer uso de esta información. ¿No hay algo que puedas decirme sobre la dirección del flujo? Por ejemplo... ¿en qué dirección miras instintivamente cuando comienzas a lanzar el hechizo? ¿Qué pasa? después? Estoy bastante seguro de que la forma en que mueves tus ojos como elementalista debería ser la más indicativa de la dirección que se supone que debe tomar el flujo de magia".
      - source: scene_3
        paragraph: 25
        text: |-
          "Déjame intentarlo ahora", dice Melindra, mientras se pone en posición, cierra los ojos y luego intenta visualizar la energía mágica inexistente de este plano de existencia. "Empieza en la esquina superior izquierda, luego baja hasta abajo, luego lentamente vuelve a subir en dirección a la derecha hasta--"

          "¡Perfecto!" digo. "Eso es todo lo que necesitaba saber".

          "¿En realidad?" Melindra pregunta. "¿Eso es todo?"

          "Sí", digo. "He estudiado miles de hechizos, por lo que generalmente puedo detectar un patrón con bastante rapidez si lo he visto varias veces antes. Por suerte, este es uno de los patrones más comunes cuando se trata de flujos mágicos, así que estoy bastante seguro de que sé adónde va desde aquí. Lo intentaré y puedes corregir mis movimientos si me desvío demasiado del rumbo. ¡Aquí vamos!"

          Después de que logro lanzar el hechizo que Melindra estaba tratando de enseñarme, usamos el mismo método de aprendizaje para los siguientes hechizos y funciona perfectamente. Como me estoy concentrando en aprender tantos hechizos como sea posible en el tiempo limitado que tenemos a nuestra disposición, pasan cuarenta minutos sin que me dé cuenta.
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch09a_afford
  - name: b3_ch09a_ice
    effects:
      - set:
          ac_b3_ch9_moment: 1
        achievement:
          id: ac_b3_ch9_moment
          title: Un momento de introspección
    routes:
      - condition: b3_ch8_overseer2 = 0
        texts:
          - source: scene_text
            paragraph: 57
            text: |-
              "Si sólo tuviera tiempo para uno, el hielo sería mi elección", digo.

              "Bueno, ya lo escuchaste, Kate", dice Illuna, mientras Kate se acerca a nosotros. "Intenta aprovechar tu tiempo al máximo. Probablemente tendrás menos de una hora a tu disposición antes de que el Supervisor recuerde el camino de regreso a su propia mente".

              "Nunca pensé que llegaría el día en que te enseñaría magia de hielo", dice Kate, después de detenerse frente a mí.

              "El tiempo vuela, ¿no?" digo. "¿Quién sabe? ¡Si no sigues el ritmo, podría ser yo quien te enseñe magia de hielo en un futuro no muy lejano!"

              "¿Es eso así?" Dice Kate, con los brazos cruzados, mientras levanta una ceja. "Entonces veamos si puedes lanzar magia tan bien como puedes alardear. Ponte en posición. Quiero que me muestres qué tan frío puedes enfriar el aire a nuestro alrededor en los próximos treinta segundos".
          - source: scene_text_2
            paragraph: 41
            text: |-
              Paso los siguientes minutos mostrándole a Kate los hechizos de hielo que ya sé lanzar, mientras ella me da algunos consejos sobre cómo mejorar mi postura y mis movimientos para que pueda hacer que los hechizos sean más efectivos. Cuando terminamos con los que conozco, ella comienza a enseñarme algunos hechizos nuevos, que inmediatamente reconozco como de uno de los manuales de magia intermedia que he leído en el pasado. Sus explicaciones son todas claras y directas, lo que hace que el proceso de aprendizaje sea mucho más rápido de lo que esperaba. Supongo que tomé una buena decisión cuando la elegí como maestra.

              "Entonces, ¿cómo se siente?" Dice Kate, mientras me observa practicando los movimientos necesarios para disparar un rayo de hielo.

              "¿Cómo se siente qué?" Le pregunto.

              "Haber logrado el sueño de toda tu vida en un plano de existencia diferente", dice Kate.

              Hago una pausa en mi práctica de magia por un breve momento para reflexionar sobre las palabras de Kate.
          - source: scene_3
            paragraph: 26
            text: |-
              "Se siente... bien", le digo, después de un rato. "Puede que esta no sea la primera vez que he tenido la oportunidad de lanzar magia, pero es la primera vez que siento que realmente me lo he ganado. Por fin, puedo decir que mis largos años de incesante estudio no han sido en vano. Incluso si esencialmente estoy usando mi imaginación en un reino gobernado por nuestras mentes, no puedo evitar sentir que este puede ser uno de los pasos más importantes que he tomado hacia mi objetivo de convertirme en mago. Por ahora, solo digamos ¡Estoy planeando disfrutar estos momentos tanto como pueda!"

              "Me alegro", dice Kate, con una leve sonrisa. "Ahora vuelve al trabajo. Tus movimientos son deficientes y tu postura es deplorable. Necesitas trabajar mucho más en tu forma antes de poder conjurar algo parecido a los rayos de hielo que has visto en mí".

              "¡Sí, señora!" Digo, y luego comienzo mi práctica de nuevo.

              Una vez que logro disparar un rayo de hielo de proporciones aceptables, Kate continúa enseñándome algunos de sus hechizos más, y mientras me concentro en la tarea que tengo entre manos, pasan cuarenta minutos sin que me dé cuenta.
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch09a_afford
