            paragraph: 17
            text: |-
              "Bien, nos atrapaste", le digo. "Hemos estado hablando con el Supervisor en secreto y hemos hecho planes para tenderle una emboscada".

              "Ah, entonces lo admites", dice el rey del subsuelo.

              "Espera, puedo explicarte..." Daren comienza a decir, pero el rey lo interrumpe.

              "Creo que ya he oído suficiente", dice el rey del subsuelo, mientras mis amigos guardan silencio. "Albert, Peter, asegúrense de vigilarlos. Si parece que están intentando algo, no duden en neutralizarlos. Mientras tanto, yo me ocuparé de los drones".

              "¿Solo, mi rey?" Albert pregunta, sorprendido.

              "Sí", dice el rey del subsuelo. "Quiero probar algo".
