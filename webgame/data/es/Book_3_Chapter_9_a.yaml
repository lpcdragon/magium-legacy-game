        paragraph: 11
        text: |-
          Todos los guerreros y los magos se hacen a un lado, dejando suficiente espacio para que mis amigos y yo caminemos, mientras que las únicas dos personas que no abandonan el lado del rey son, como siempre, Peter y Albert. Mientras habla, el rey del subsuelo se ve obligado a utilizar una voz alta, para asegurarse de que podamos escucharlo correctamente a pesar del ruido que hace el viento.

          "Voy a saltarme las bromas y os lo preguntaré a todos directamente", nos dice el rey del subsuelo, una vez que nos detenemos frente a él. "¿Qué opinas de nuestra situación actual?"

          "¿Quieres decir por qué los drones no te han atacado todavía?" dice Daren. "No lo sé... ¿tal vez sólo están esperando a ver cuál es tu primer movimiento?"
      - source: scene_text_2
        paragraph: 9
        text: |-
          "Esa sería una forma de interpretar esto, por supuesto", dice el rey, "pero envié algunos exploradores adelante para verificar, y me informaron que ni siquiera hay drones tratando de acercarse a nuestra ubicación actual. Uno habría pensado que el Supervisor al menos intentaría preparar algunas de sus fuerzas para el próximo conflicto, incluso si no planea dar el primer paso. Sin embargo, los drones parecen estar ignorándonos por completo, y no puedo evitar preguntarme qué está causando un comportamiento tan inusual--"

          "Su alteza, ¿está ahí?" escuchamos la voz de un hombre, proveniente de un transceptor que el rey del subsuelo llevaba atado a su cinturón.

          "Puedo oírte", dice el rey, después de tocar una vez el transceptor. "Dime, ¿qué es?"

          "¡Fue tal como lo predijiste, mi rey!" dice el hombre. "¡Las bolas de metal voladoras comenzaron a avanzar lentamente hacia tu posición poco después de que los forasteros salieran del edificio de almacenamiento abandonado! Deben haber estado conspirando junto con el Supervisor todo este tiempo. ¡No hay duda al respecto!"
      - source: scene_3
        paragraph: 8
        text: |-
          Cuando comenzamos a escuchar un murmullo incómodo proveniente de los hombres reunidos a nuestro alrededor, el rey del subsuelo se golpea ligeramente la frente con la palma derecha.

          "¿Y qué te dije que hicieras si sucediera algo como esto, Gregory?" —le dice el rey al hombre desde el transceptor.

          "Uh... me dijiste... que esperara hasta que me llamaras, porque querías escuchar primero lo que los forasteros tenían que decir en su defensa", dice Gregory. "Lo siento, mi señor. Yo... me adelanté. ¡Pero esto prueba su culpabilidad, sin duda! Ya no debería haber necesidad de escuchar lo que tienen que decir".

          "Eso lo decido yo, Gregory, no tú", dice el rey del subsuelo. "Esto será todo por ahora. Vuelve a tu publicación. Cerraré este canal".

          Luego toca el transceptor para interrumpir su conversación con Gregory, como dijo.

          "¿Y bien?..." nos pregunta el rey, luego de vernos ahí parados en silencio durante unos segundos. "¿Hay algo que quieras decirnos?"
    choices:
      - position: 1
        text: Dile al rey del subsuelo que él y Gregory simplemente están sacando conclusiones precipitadas.
        effects:
          - set:
              current_scene: b3_ch09a_jumping
              b3_ch9_conclusions: 0
      - position: 2
        text: Dígale que el Supervisor se puso en contacto con nosotros pero nos negamos a unirnos a su lado.
        effects:
          - set:
              current_scene: b3_ch09a_refused
              b3_ch9_conclusions: 1
      - position: 3
        text: Dile que planeamos unirnos al lado del Supervisor en esta pelea.
        effects:
          - set:
              current_scene: b3_ch09a_caught
              b3_ch9_conclusions: 2
  - name: b3_ch09a_jumping
    routes:
      - condition: b3_ch8_overseer2 = 0
        texts:
          - source: scene_text
            paragraph: 12
            text: |-
              "¿No creen que ustedes dos están sacando conclusiones precipitadas un poco?" digo. "Por lo que dijiste, parece que el Supervisor simplemente estaba esperando a ver si nosotros también nos uniríamos a la lucha, para poder saber cuántos drones enviar para luchar contra nosotros".

              "Veo que todavía estás tratando de ocultar el hecho de que te has estado comunicando en secreto con el Supervisor a través de los cristales azules en la base subterránea", dice el rey. "Es difícil para mí pensar en una razón para esto aparte de que tú conspiras con él contra nosotros..."

              ¿Él sabe de nuestras conversaciones con el Supervisor? ¿Será que uno de sus hombres nos escuchó cuando hablábamos de ello en los túneles?

              "¡Espera, espera!" dice Daren. "Es cierto que el Supervisor se puso en contacto con nosotros y quería que le ayudáramos a tenderle una emboscada, ¡pero rechazamos su oferta!"

              "Si ese fuera el caso", dice el rey del subsuelo, "no veo por qué tu amigo no lo habría mencionado desde el principio, en lugar de intentar convencernos de que no tenemos ningún motivo para sospechar de ti".

              "Está bien, admito que no hemos sido del todo sinceros contigo, pero tú tampoco", dice Daren. "El Supervisor nos reprodujo una grabación en la que le dijiste a Albert que tratara con nosotros 'discretamente' si no estábamos de acuerdo con que fueras coronado como el nuevo rey de Ollendor. Seguramente, puedes ver cómo esto causaría que tengamos algunos problemas de confianza con respecto a ti y tu grupo".
          - source: scene_text_2
            paragraph: 10
            text: |-
              "Ah, ya veo lo que está pasando", dice el rey del subsuelo. "No puedo culparte por tus acciones, si esto es realmente lo que has escuchado. Dado que no tenemos mucho tiempo, elegiré confiar en tus palabras por ahora, y volveremos a revisar esta conversación más tarde, una vez que todos estemos fuera de aquí a salvo".

              Luego toca su transceptor para poder hablar con su explorador.

              "Gregory, ¿cuánto falta para que las bolas de metal voladoras nos alcancen?" dice el rey del subsuelo.

              "Uh... deberían estar allí en cualquier momento, mi señor", dice Gregory.

              "Perfecto", dice el rey. "Entonces démosles un objetivo fácil al que disparar".

              Después de decir esto, el rey del subsuelo levanta los brazos y luego comienza a elevarse lentamente en el aire, mientras se puede ver un rayo de la tormenta golpeando en algún lugar a lo lejos.

              "¡¿Puede volar?!" pregunta Hadrik.

              "De hecho, se me ocurrió esta idea de tu amigo Barry", grita fuerte el rey del subsuelo desde arriba, respondiendo a la pregunta de Hadrik. "Escuché de mis hombres sobre el hechizo de corriente de aire que estaba usando para volar, y les pregunté a mis elementalistas de aire si no podían idear algo similar a lo que Melindra había estado lanzando".
          - source: scene_3
            paragraph: 9
            text: |-
              Luego hace algunas carreras en el aire y parece perder el control durante aproximadamente un segundo debido al fuerte viento, antes de recuperar rápidamente el equilibrio.

              "Los controles son un poco toscos, pero puedo hacer algunos ajustes con la manipulación de aura, así que no es un gran problema", dice el rey. "Ahora bien... ¿dónde están los drones?"

              A medida que el rey del subsuelo vuela más alto en el cielo, cada vez es más difícil verlo debido a la fuerte lluvia, pero no pasa mucho tiempo antes de que los drones del Supervisor muerdan el anzuelo e iluminen toda el área alrededor del rey con sus brillantes ojos rojos.

              El rey del subsuelo no se enfrenta a ellos, sino que crea a su alrededor una barrera esférica semitransparente, compuesta de aura endurecida, que lo protege tanto de los ataques mágicos de los drones como de la lluvia. Cada vez más drones rodean la barrera del rey, intentando romperla con ataques elementales de todo tipo.

              El rey del subsuelo sigue hostigando a los drones durante aproximadamente un minuto más, hasta que un centenar o más de ellos lo rodean, y justo cuando estamos a punto de perderlo de vista debido a la gran cantidad de bolas de metal que lo pululan desde todas direcciones, el rey desata una onda de choque tan poderosa que hace que todos los drones a su alrededor exploten a la vez.
        choices:
