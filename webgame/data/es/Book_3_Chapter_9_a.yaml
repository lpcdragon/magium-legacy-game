        texts:
          - source: scene_text
            paragraph: 37
            text: |-
              "¿Cuál es la mejor comida original que inventaste aquí en el Plano Etéreo?" Le pregunto a Flower.

              "Hmm..." dice Flower. "Si tuviera que elegir sólo uno... diría que probablemente sería el pastel de chocolate".

              "Definitivamente el pastel de chocolate", dice Illuna.

              "¿Sólo chocolate?" digo. "Habría esperado que fuera algo más extravagante que eso. ¿No dijiste que puedes crear sabores que no existen en el plano terrestre?"

              "Oh, no se parece en nada a ningún chocolate que hayas probado antes", dice Flower. "Petal intentó hacer que mi pastel de cumpleaños se pareciera a él, pero simplemente no hay suficientes ingredientes en el mundo real para reproducir el sabor exacto. Será más rápido si se los muestro. ¡Pruébenlo ustedes mismos!"

              De repente, Flower hace aparecer un plato en cada uno de nuestros regazo, con un trozo de tarta y un tenedor encima. Tan pronto como pruebo el pastel, entiendo exactamente lo que quiso decir Flower. Se siente como chocolate, pero el sabor es tan único y distinto de cualquier cosa que haya probado antes que ni siquiera podía imaginar qué tipo de ingredientes se necesitarían para crear algo comparable a esto.

              "¡Oye, no estabas bromeando!" Melindra dice. "Realmente no encontrarás nada que sepa tan bien en el plano terrestre. ¿Estás diciendo que puedes hacer este pastel cuando quieras, tantas veces como quieras?"
          - source: scene_text_2
            paragraph: 26
            text: |-
              "¡Sí!" Flower dice. "Puedes pedir más, si te gusta. ¡No tengo que preocuparme por gastar energía mágica aquí, así que puedo hacer todo lo posible!"

              "¡Seguro!" Melindra dice. "Pero antes de continuar con el banquete, ¿podrías darnos un breve resumen de lo que está sucediendo actualmente en el plano terrestre?"

              "¿En el plano terrestre?" Pregunta Flower, y luego comienza a mirar al frente mientras mueve sus manos como si estuviera controlando hilos invisibles atados a su cuerpo en el mundo real. "Veamos... Las bolas de metal voladoras todavía no se mueven, pero algunos de los rebeldes están empezando a despertar. En realidad no, es solo uno de los rebeldes. Peter es el único que está despierto en el mundo real. ¡Ah, y puedo sentirlo en este mundo también! Está nadando a través de la luz afuera, tratando de recuperar a sus amigos. ¡Chicos, creo que Peter también podría ser un etéreo!"

              "¿Qué pasa con el Supervisor?" Pregunta Daren, mientras come un poco de pastel. "Nos dijo que tenía un 'alma fabricada' o algo así, ¿no? Tal vez también puedas detectar su alma en la luz".

              "Sí, yo... ¡creo que puedo sentirlo!" Flower dice. "Se está moviendo alrededor del éter, por lo que no parece que esté inconsciente. Podría simplemente estar tratando de encontrar su propia mente para poder volver a ella".
          - source: scene_3
            paragraph: 18
            text: |-
              "¿Kate todavía está ahí afuera también?" Le pregunto a Flower. "Esperaba que la trajeras de regreso cuando te teletransportaste aquí con Daren y Melindra, pero no he escuchado una palabra de ella, así que supongo que no está en la habitación con nosotros".

              "No, Kate nunca estuvo en el éter", dice Flower. "Puedo garantizarlo. No creo que la echaran de su mente como al resto de ustedes".

              "La técnica que utilizó el Supervisor para eliminar las almas de todos de sus mentes probablemente requirió una conexión activa entre el alma y el cuerpo para poder funcionar", dice Illuna. "Kate ya estaba inconsciente en ese momento, por lo que la técnica probablemente no fue efectiva contra ella".

              "Me alegro de que esté bien", dice Flower, "pero tenía la esperanza de poder encontrarla en el Plano Etéreo. Realmente me hubiera gustado mostrarle mi casa".

              "Oye, ¿alguien sabe qué pasó con el rey del subsuelo?" dice Hadrik. "Estaba muy alto en el cielo cuando el Supervisor nos noqueó con esa técnica suya. ¿Podría haber muerto por la caída por casualidad?"

              "Vi el momento en que el rey del subsuelo cayó del cielo", dice Illuna. "El impacto de la caída fue amortiguado por una especie de escudo que tenía a su alrededor, hecho de aura endurecida. Por lo que parece, no sufrió ninguna herida grave".

              "Por supuesto que tendría un truco como ese bajo la manga...", dice Daren.
