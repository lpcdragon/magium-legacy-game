  - name: b3_ch09a_carcasses
    routes:
      - condition: b3_ch8_overseer2 = 0 AND b3_ch9_conclusions = 2
        texts:
          - source: scene_text
            paragraph: 22
            text: |-
              "¡Cuidado!" Daren nos grita, mientras docenas de cadáveres de metal en llamas caen encima de nosotros y todos los hombres del rey corren frenéticamente, tratando de evitar ser golpeados por ellos.

              Cuando nos apartamos de las bolas de metal que caen, vemos una nueva ola de drones que se acerca rápidamente al rey, mientras que unas pocas docenas de otros drones se acercan para atacar a las tropas en tierra.

              "Primero ocupémonos de los drones cerca del suelo y luego podremos ir a ayudar al rey", digo. "Parece que puede arreglárselas solo por ahora".

              "No vamos a ninguna parte", dice Daren. "¿Ya te olvidaste de la pequeña broma que le hiciste al rey antes? Todos piensan que ahora estamos aliados con el Supervisor. No hay manera de que nos dejen ayudarlos".

              "Oye, no importa lo que piensen de nosotros, no pueden oponerse a que matemos drones enemigos, ¿verdad?" digo. "Lo mejor para ellos es dejarnos destruirlos".
          - source: scene_text_2
            paragraph: 14
            text: |-
              Luego me giro hacia Peter, quien nos ha estado observando atentamente todo este tiempo, con el ceño fruncido y los brazos cruzados.

              "¿Qué te parece, Peter?" digo. "No te importará si nos encargamos de algunos de estos drones, ¿verdad?"

              Peter no me responde y sigue mirándome con el mismo ceño fruncido que antes.

              "¿Ver?" Le digo a Daren. "A él no le importa. ¡Ahora vamos, vámonos!"

              Pasamos junto a Peter, mientras él todavía se asegura de no perdernos de vista, y luego comenzamos a luchar contra algunos de los drones que aún no han alcanzado a los rebeldes. Sin embargo, no podremos hacerlo por mucho tiempo, porque los drones comienzan a actuar de manera muy extraña de repente, volando en el aire y girando en su lugar mientras la luz de sus ojos parpadea constantemente.
