  - name: b3_ch09a_water
    routes:
      - condition: b3_ch8_overseer2 = 0
        texts:
          - source: scene_text
            paragraph: 54
            text: |-
              "Si sólo tuviera tiempo para uno, el agua sería mi elección", digo.

              "Muy bien", dice Illuna. "Entonces, comencemos. En primer lugar, me gustaría que me mostraras los hechizos con los que ya estás familiarizado y veremos cómo avanzamos a partir de ahí".

              Paso los siguientes minutos mostrándole a Illuna los hechizos de agua que ya sé lanzar, mientras ella me da algunos consejos sobre cómo mejorar mi postura y mis movimientos para que pueda hacer los hechizos más efectivos. Cuando terminamos con los que conozco, Illuna se toma un poco de tiempo para pensar, para poder descubrir cuáles son los hechizos más apropiados que puede enseñarme en el tiempo limitado que tenemos a nuestra disposición.

              "Mencionaste que te sabes de memoria la teoría detrás de la mayoría de los hechizos..." dice Illuna. "¿Cuáles serían en tu opinión los hechizos que tendrías mayor probabilidad de aprender de mí, suponiendo que probablemente nos quede menos de una hora para trabajar antes de que el Supervisor recuerde el camino de regreso a su propia mente?"

              "Menos de una hora, ¿eh?..." digo. "Si somos realmente rápidos, podríamos cubrir los dos primeros capítulos de 'Una guía para principiantes sobre la magia del agua', pero no más que eso".
          - source: scene_text_2
            paragraph: 39
            text: |-
              "Es reconfortante ver que sus expectativas son realistas, por una vez, pero me temo que esta no es la respuesta que estaba buscando", dice Illuna.

              "¿Por qué no?" digo.

              "Tú más que nadie deberías saber que un hechizo clasificado como fácil en un manual no necesariamente es también fácil de aprender en la práctica", dice Illuna. "Incluso si el hechizo tiene muy pocos pasos para aprender, es posible que aún te equivoques en esos pasos la mitad de las veces hasta que lo hayas dominado con éxito. ¿Entiendes lo que quiero decir ahora?"

              "Sí, creo que entiendo lo que estás tratando de decir", le respondo. "Es mucho mejor tener algunos hechizos con los que pueda contar en todo momento que tener muchos hechizos que no son confiables, especialmente durante una batalla de magos donde un simple error podría costarme la vida. ¿Tienes una lista de hechizos que se ajusten a esta descripción?"

              "Creo que sí", dice Illuna. "Si empezamos a entrenar inmediatamente, es posible que tengas la oportunidad de dominar un buen número de ellos, dependiendo de tu rendimiento. Vamos a ello".

              Durante unos cuarenta minutos, Illuna me ayuda a aprender la mayoría de los hechizos de su lista. Puedo ver claramente que ella ha estudiado la teoría detrás de estos hechizos por la forma en que me los enseña, y gracias a sus explicaciones claras y concisas, logro aprender mucho más de lo que hubiera esperado en tan breve período de tiempo. Supongo que tomé una buena decisión cuando la elegí como maestra.
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch09a_afford
