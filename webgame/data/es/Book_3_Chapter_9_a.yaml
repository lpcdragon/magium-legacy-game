  - name: b3_ch09a_lunatic
    routes:
      - condition: b3_ch9_premonition = 2
        texts:
          - source: scene_text
            paragraph: 49
            text: |-
              "En realidad, estoy más interesado en saber por qué decidiste seguir el flujo de la magia una vez que tu hechizo comenzó a fallar, en lugar de intentar corregirlo", dice Illuna. "Simplemente no puedo entender la lógica detrás de tomar tal acción".

              "Oh", digo, "sólo seguí el consejo de un viejo ermitaño que me dijo que el flujo de la magia siempre volverá al camino previsto, siempre y cuando mi forma sea correcta y mi teoría sea sólida".

              "Ese consejo sólo se aplica a tu caso si estás completamente seguro de que no cometiste ni un solo error al lanzar tu hechizo", dice Illuna. "¿Me estás diciendo que no tenías la menor duda de que algunas de los millones de partículas que debías controlar serían descarriadas?"

              "Bueno, quiero decir, la mayoría de esos 'millones' de partículas siguen patrones preestablecidos que son bastante fáciles de predecir siempre y cuando sepas qué buscar", digo, "pero para responder a tu pregunta, no, por supuesto que no tenía ninguna duda. Solía estar tan obsesionado con estas cosas que probaba hechizos a mitad del día en mi patio trasero, mientras la gente me miraba como si fuera una especie de lunático. Créeme... ya superé el punto en el que un pequeño percance como ese sería suficiente para hacerme dudar de mí mismo".
          - source: scene_text_2
            paragraph: 37
            text: |-
              "... Arraka en realidad me dio una respuesta similar cuando le pregunté por qué seguía la corriente en lugar de corregirla, hace mucho tiempo, cuando yo todavía era su alumna", dice Illuna. "También dijo que ya había superado el punto en el que todavía consideraría la posibilidad de cometer un error al lanzar un hechizo. Creo que finalmente estoy empezando a entender por qué se ha vuelto tan decidida últimamente al tratar de desbloquear tus estadísticas mágicas".

              Ella hace una pausa.

              "¿Cuántos otros hechizos te sabes de memoria?" Me pregunta Illuna. "¿Supongo que sólo probaste un número limitado de hechizos antes de concluir que te era imposible lanzar magia en el plano terrestre?"

              "Sí, aprendí algunos hechizos de cada elemento tradicional y no tradicional, pero no mucho más que eso", digo. "Ah, y probablemente también debería poder lanzar las corrientes de aire que me permiten volar, porque tuve que crearlas yo mismo durante esa pelea con los esqueletos de stillwaters, así que estoy bastante familiarizado con ellos. Con suerte, funcionarán allí en el éter, aunque no hay, eh... aire... en este plano. De todos modos, en cuanto a los otros hechizos, conozco la teoría detrás de ellos, pero no puedo decir que conozca los flujos lo suficientemente bien como para poder lanzarlos sin ayuda".
          - source: scene_3
            paragraph: 22
            text: '"Eso es lo que pensé", dice Illuna. "Nuestro tiempo es limitado, así que te sugiero que te concentres en un solo elemento si realmente quieres volverte semi-competente en una pelea. Puedes aprender magia de agua de mí, magia de fuego de Flower o magia de aire de Melindra. ¿Qué elemento preferirías?"'
