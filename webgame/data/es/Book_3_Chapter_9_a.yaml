              "Estás haciendo que parezca mucho más fácil de lo que realmente es", dice Illuna. "Para alguien como Flower o yo, estas cosas son naturales, porque ella es etérea y yo soy un espíritu mágico. Para alguien como tú, que no está acostumbrado al Plano Etéreo ni a lanzar magia en general, sería necesario estar familiarizado con el movimiento de cada partícula mágica individual que compone el flujo de un hechizo, y controlar tanto su dirección como su intensidad a la perfección. Eso, por supuesto, además de conocer la teoría detrás del hechizo".

              "Entonces, si sé todas esas cosas, ¿debería poder lanzar el hechizo?" digo.

              "En teoría, sí", dice Illuna. "Pero no veo cómo podrías ser capaz de..."

              "¡Excelente!" digo. "Entonces intentaré lanzar uno ahora mismo. ¡Dame un segundo!"
