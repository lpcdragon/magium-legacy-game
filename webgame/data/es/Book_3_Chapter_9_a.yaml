            paragraph: 20
            text: |-
              "Ah, mierda", de repente escuchamos a Daren decir en voz muy alta, aunque sus labios no se mueven. "Me acabo de dar cuenta de algo. Si puedo escuchar los pensamientos de Barry y Leila, ¿significa esto que todos en la sala pueden escuchar los míos también? ¿Pueden escucharme incluso ahora, mientras estoy pensando en todo esto?"

              "Sí, Daren, todos podemos oírte", dice Illuna. "Además, es posible que quieras bajar el volumen un poco. Suenas como si estuvieras gritando cuando piensas en voz alta".

              "¡Oh, lo siento!" dice Daren.

              Luego comienza a pensar para sí mismo nuevamente, con la misma voz gritadora de antes.

              "Genial", piensa Daren. "Ahora tendré que prestar atención a mis pensamientos todo el tiempo para no hablar accidentalmente con la gente. Esto va a ser muy doloroso".

              Cuando nos ve esforzándonos por contener la risa mientras lo miramos, Daren se dirige a nosotros nuevamente, esta vez con su voz normal.

              "Estaba pensando en voz alta otra vez, ¿no?" dice Daren.

              "Ajá", le digo. "Y tú también estabas gritando de nuevo, en caso de que te lo preguntaras".

              "Bueno, eso es simplemente... fantástico", dice Daren. "¿Qué se supone que debo hacer ahora?"
            condition: b3_ch9_premonition = 2
