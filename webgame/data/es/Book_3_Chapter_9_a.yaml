        texts:
          - source: scene_text
            paragraph: 45
            text: |-
              Hadrik se ríe.

              "¡Bienvenidos al club!" le dice a Daren. "No te preocupes, lo dominarás pronto. En realidad, es un problema menor de lo que podría parecer al principio. Sólo necesitas dejar de pensar para ti mismo. Aquí, déjame enseñarte algunos trucos para hacerte la vida más fácil".

              Mientras Hadrik le enseña a Daren cómo evitar pensar en voz alta, el resto de nosotros aprovechamos la oportunidad para comer un poco más de pastel. Una vez que terminan de hablar, Daren se vuelve hacia Leila, como si acabara de recordar algo importante.

              "Leila, creo que estabas a punto de hacer una sugerencia antes de que te interrumpiera", dice Daren. "¿Aún recuerdas qué era?"
