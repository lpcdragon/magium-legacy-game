          - source: scene_text
            paragraph: 40
            text: |-
              "Flower", dice Melindra, "mencionaste antes de traernos a tu casa que no sabes dónde están ubicadas nuestras 'mentes' y que debes esperar a que recordemos el camino de regreso por nuestra cuenta. ¿Tienes alguna idea de cuánto tiempo podría tomar?"

              "Hemos tenido la oportunidad de albergar a algunas almas perdidas que deambularon cerca de la casa de Flower a lo largo de los años", dice Illuna, "pero cada una de ellas necesitaba una cantidad de tiempo diferente para recordar dónde estaba su propia mente. Normalmente no lleva más de dos horas".

              "¡En dos horas podríamos estar todos muertos si nuestros cuerpos reales van a permanecer en el suelo todo este tiempo!" dice Daren. "Illuna, ¿no hay alguna manera de que puedas usar tus técnicas de agua para inmovilizar a los rebeldes mientras están inconscientes?"

              "No quiero arriesgarme a lanzar magia a través del cuerpo de Flower en este momento", dice Illuna. "Esta 'forma evolucionada' suya en la que puede detectar a cualquiera desde el éter y teletransportarse a donde quiera sin duda también está ejerciendo una gran presión sobre su cuerpo del plano terrestre. No sabemos cuáles son sus limitaciones cuando está en esta forma, y ​​no creo que este sea un buen momento para probarlas".

              "Tienes razón", dice Daren. "Olvídate de lo que dije. La seguridad de Flower es lo primero, por supuesto".

              "¡No tienes que preocuparte por mí!" Flower dice. "Estoy seguro de que estaré bien mientras--"

              "¿Ya has aprendido cómo volver a tu forma normal sin ojos rojos brillantes?" dice Illuna.
          - source: scene_text_2
            paragraph: 31
            text: |-
              "No..." dice Flower. "¡Pero estoy trabajando en ello!"

              "Entonces no usaremos magia en el plano terrestre a menos que sea nuestra última alternativa", dice Illuna. "En cambio, deberíamos centrarnos en arreglar la situación para todos los demás".

              "¿Qué pasaría si intentáramos..." escuchamos la voz interior de Leila, pero Daren la interrumpe.

              "Vaya, ¿quién dijo eso?" Dice Daren, mientras mira alrededor de la habitación.

              "Fui yo", vuelve a decir Leila, con la boca cerrada. "Dije eso."

              "¡Pero no abres la boca cuando hablas!" dice Daren. "¿Eso... significa que estoy escuchando tus pensamientos, como lo hicimos antes con Barry?"

              "Exactamente", dice Leila.
            condition: b3_ch9_premonition = 2
