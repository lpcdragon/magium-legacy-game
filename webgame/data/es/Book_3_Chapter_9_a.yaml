            paragraph: 26
            text: |-
              "Se siente... bien", le digo, después de un rato. "Puede que esta no sea la primera vez que he tenido la oportunidad de lanzar magia, pero es la primera vez que siento que realmente me lo he ganado. Por fin, puedo decir que mis largos años de incesante estudio no han sido en vano. Incluso si esencialmente estoy usando mi imaginación en un reino gobernado por nuestras mentes, no puedo evitar sentir que este puede ser uno de los pasos más importantes que he tomado hacia mi objetivo de convertirme en mago. Por ahora, solo digamos ¡Estoy planeando disfrutar estos momentos tanto como pueda!"

              "Me alegro", dice Kate, con una leve sonrisa. "Ahora vuelve al trabajo. Tus movimientos son deficientes y tu postura es deplorable. Necesitas trabajar mucho más en tu forma antes de poder conjurar algo parecido a los rayos de hielo que has visto en mí".

              "¡Sí, señora!" Digo, y luego comienzo mi práctica de nuevo.

              Una vez que logro disparar un rayo de hielo de proporciones aceptables, Kate continúa enseñándome algunos de sus hechizos más, y mientras me concentro en la tarea que tengo entre manos, pasan cuarenta minutos sin que me dé cuenta.
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch09a_afford
  - name: b3_ch09a_afford
    routes:
      - condition: b3_ch8_overseer2 = 0
        texts:
          - source: scene_text
            paragraph: 58
            text: |-
              Mientras todavía estoy ocupado practicando, Flower de repente se da vuelta y mira fijamente una de las paredes de la habitación, como si estuviera tratando de ver a través de ellas. Esto llama la atención de Illuna, quien ahora le hace una pregunta.

              "¿Qué ocurre?" dice Illuna. "¿Pasó algo en el éter?"

              "Sí...", responde Flower a Illuna. "Parece que Peter y el Supervisor están en movimiento. No se han encontrado todavía, pero probablemente lo harán pronto. Además, Peter parece haber encontrado ya el alma del rey del subsuelo, y actualmente están viajando juntos".

              Mientras Illuna y Flower hablan, podemos escuchar algunos gruñidos de fondo de Daren, quien está poniendo mucho esfuerzo en tratar de replicar mi técnica de lanzamiento de hechizos, aunque hasta ahora no ha tenido éxito. Mis otros amigos también lo intentaron al principio, pero finalmente se dieron por vencidos y decidieron disfrutar de la comida y bebida que les servía Flower. En este momento, Flower, Illuna y yo somos los únicos que parecemos poder lanzar algún tipo de hechizo en este lugar.

              "En ese caso, no creo que podamos darnos el lujo de esperar más", afirma Illuna. "Si quieres unirte a la batalla en el Plano Etéreo, probablemente deberías hacerlo antes de que comience".

              "¿No vendrás con nosotros?" Pregunta Flower.
          - source: scene_text_2
            paragraph: 42
            text: |-
              "No, lamentablemente tendré que quedarme aquí", dice Illuna. "Si ambos dejamos tu mente, no quedará nadie para controlar tu cuerpo plano terrestre. Me temo que Barry y tú tendréis que salir solos".

              "¿No podemos esperar un minuto más?" dice Daren. "Siento que casi he resuelto este asunto del lanzamiento de hechizos etéreos. ¡Esta vez de verdad! ¡Y una vez que lo haga, podré ir contigo y ayudarte con la curación, al menos!"

              "Has estado diciendo que necesitas 'sólo un minuto más' durante los últimos quince minutos", le dice Illuna. "De alguna manera dudo que esta vez vaya a ser diferente. De cualquier manera, en caso de que logres resolverlo, Flower y yo estamos vinculados telepáticamente debido a nuestra fusión de almas, por lo que puedo contactarla sin importar dónde se encuentre en el Plano Etéreo y ella regresará para teletransportarte al campo de batalla".

              "¿Ustedes dos están conectados telepáticamente?" Pregunta Leila, sorprendida. "¿Esto significa que están escuchando los pensamientos de los demás todo el tiempo?"

              "No escucho sus pensamientos más de lo que escucho los tuyos mientras estamos en la misma habitación", dice Illuna. "Mientras ambos tengamos cuidado de no usar palabras cuando pensamos, podemos guardarnos nuestros pensamientos para nosotros mismos".
          - source: scene_3
            paragraph: 28
            text: |-
              "Oh, claro", dice Leila. "Supongo que eso tiene sentido."

              "Entonces... ¿estás listo, Barry?" Dice Flower, mientras ahora estoy lanzando mis corrientes de aire sobre mí misma, para poder volar a través del éter en cualquier momento.  "¿A dónde crees que deberíamos teletransportarnos primero? Podríamos ir y luchar contra el Supervisor directamente, o podríamos tratar de reunirnos con Peter primero y hacer equipo con él. No sé qué tan bien Peter puede manejarse en el Plano Etéreo, por lo que podría interponerse en nuestro camino más que ayudarnos, pero sigo pensando que valdría la pena intentar ir a hablar con él".
        choices:
          - position: 1
            text: Teletransportarse a Peter.
            effects:
              - set:
                  current_scene: b3_ch09c_teleport
                  storyboard_controls: Jump to frame "Book 3 Chapter 9 c"
