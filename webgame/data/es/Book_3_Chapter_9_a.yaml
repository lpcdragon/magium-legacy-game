    routes:
      - condition: b3_ch9_premonition <> 2
        texts:
          - source: scene_text
            paragraph: 35
            text: |-
              "Ya veo", dice Daren. "Supongo que no tiene sentido preguntarte por qué mi alma no estaba debidamente vinculada a mi cuerpo en el plano terrestre, ¿verdad?"

              "Me temo que no hay forma de saberlo", dice Illuna. "Pero podría estar relacionado de alguna manera con la razón por la cual tu vínculo con el espíritu en el plano mágico que te permite lanzar magia también es defectuoso. Vas a tener que resolver esto por tu cuenta".

              De repente, Flower grita de felicidad, mientras mira alrededor de la habitación y nos ve a todos sentados y poniéndonos cómodos.

              "¡Oh dioses!" Flower dice. "¡Esta es la primera vez en mi vida que tengo tantas visitas en mi casa al mismo tiempo! ¡Estoy tan emocionada! Espera aquí. ¡Iré a traer las galletas!"

              Luego corre hacia la habitación de donde provenía el olor a quemado, que solo se volvió más intenso a medida que pasaba el tiempo.
          - source: scene_text_2
            paragraph: 23
            text: |-
              "¡NO!" Flower grita desde la otra habitación. "¡Mis galletas!"

              "Mientras esperamos que Flower limpie el desorden de la cocina", nos dice Illuna, "¿podría sugerirles enseñar a nuestros visitantes más nuevos cómo recuperar sus cuerpos? Preferiría no hablar con fantasmas incorpóreos durante el resto de su estadía aquí, si no les importa".

              Durante los siguientes minutos, Illuna les muestra a Daren, Melindra y Kate cómo hacer que sus cuerpos existan de la misma manera que ella me enseñó. Poco después de terminar, Flower sale de la cocina con un plato grande de galletas que ahora está poniendo sobre una mesa en el medio de la habitación.

              "No había manera de que hubieras podido arreglar el desorden y hornear galletas nuevas en tan poco tiempo", le dice Illuna a Flower. "Hiciste trampa, ¿no?"

              "¡No!" grita Flower. "¡Hice todo según las reglas! No los hice aparecer de la nada. Solo... aceleré un poco el horno, eso es todo..."
          - source: scene_3
            paragraph: 16
            text: |-
              "Entonces, hiciste trampa", dice Illuna.

              "Bueno, ¿qué se suponía que debía hacer?" —Pregunta Flower, exasperada, mientras saca tazas de té de un armario y luego platos pequeños para cada uno de nosotros. "No podía hacer esperar a todos por tanto tiempo. ¡Eso sería de mala educación!"

              "Pero no es de mala educación que me hagas esperar, ¿verdad?" dice Illuna.

              "¡No es lo mismo!" Dice Flower, mientras pone las tazas sobre la mesa. "Tú y yo vivimos juntos. Ellos son nuestros invitados. Es normal que reciban un trato especial. Además, ¡llevamos veinte años usando el mismo horno casi todos los días! ¡Ya estás acostumbrado!"
