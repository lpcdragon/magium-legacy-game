            paragraph: 42
            text: |-
              Hadrik se ríe.

              "¡Bienvenidos al club!" le dice a Daren. "No te preocupes, lo dominarás pronto. Déjame enseñarte un pequeño truco que aprendí de Barry. ¡Todo comienza aprendiendo a pensar con tus instintos en lugar de con tu cerebro!"

              Mientras Hadrik le enseña a Daren cómo evitar pensar en voz alta, el resto de nosotros aprovechamos la oportunidad para comer un poco más de pastel. Una vez que terminan de hablar, Daren se vuelve hacia Leila, como si acabara de recordar algo importante.

              "Leila, creo que estabas a punto de hacer una sugerencia antes de que te interrumpiera", dice Daren. "¿Aún recuerdas qué era?"
          - source: scene_text_2
            paragraph: 32
            text: |-
              "¡Oh sí!" Dice Leila, sin mover los labios mientras habla. "Quería preguntarle a Flower si hay alguna manera de que podamos luchar contra el Supervisor aquí en el Plano Etéreo".

              "Si me preguntas si es posible tener batallas en el Plano Etéreo, entonces la respuesta es sí, pero realmente no lo recomendaría", dice Flower.

              "¿Por qué no?" pregunta Hadrik.

              "Ni siquiera sabías cómo crear un cuerpo para ti en este plano de existencia hasta hace poco y ¿te preguntas por qué sería una mala idea que te pelearas?" dice Illuna. "Creo que la respuesta a esa pregunta debería explicarse por sí misma".

              "Sí, ¡pero lo mismo ocurre con el Supervisor también!" dice Hadrik. "Apuesto a que nunca antes lo habían sacado de su mente. ¡Eso debería ponernos en igualdad de condiciones!"

              "Olvidas que el Supervisor fue quien utilizó la técnica de desplazamiento que llevó las almas de todos al éter en primer lugar", dice Illuna. "Claramente obtuvo mucho conocimiento sobre el Plano Etéreo a partir de su fusión temporal con el 'fragmento' de Magium, por lo que subestimar sus habilidades sería muy tonto. Incluso Flower podría tener problemas para enfrentarlo en el éter si no tiene cuidado".
            condition: b3_ch8_overseer2 = 0
          - source: scene_text_2
            paragraph: 33
            text: |-
              "¡Oh sí!" Dice Leila, sin mover los labios mientras habla. "Quería preguntarle a Flower si hay alguna manera de que podamos luchar contra los rebeldes aquí en el Plano Etéreo".

              "Si me preguntas si es posible tener batallas en el Plano Etéreo, entonces la respuesta es sí, pero realmente no lo recomendaría", dice Flower.

              "¿Por qué no?" pregunta Hadrik.

              "Ni siquiera sabías cómo crear un cuerpo para ti en este plano de existencia hasta hace poco y ¿te preguntas por qué sería una mala idea que te pelearas?" dice Illuna. "Creo que la respuesta a esa pregunta debería explicarse por sí misma".

              "Sí, ¡pero lo mismo ocurre con los rebeldes también!" dice Hadrik. "Apuesto a que nunca antes los habían echado de sus propias mentes. ¡Eso debería ponernos en igualdad de condiciones!"

              "No son del todo iguales", dice Illuna. "Como Flower mencionó antes, hay una buena posibilidad de que Peter también sea un etéreo, y no tenemos forma de saber qué tan buen luchador es en este plano de existencia. Si Flower se enfrentara a él sola en el éter, podría ganar, pero si alguno de ustedes la acompañara, solo le haría las cosas más difíciles porque todos serían objetivos fáciles que necesitaría defender constantemente durante su duelo contra Peter".
            condition: b3_ch8_overseer2 = 1
          - source: scene_3
            paragraph: 21
            text: |-
              "¿Cómo pelearía Flower en el éter exactamente?" dice Daren. "¿Estaría usando magia de fuego, como en el mundo real?"

              "Este es un reino de pensamientos e ideas, por lo que no hay 'magia' en el sentido literal de la palabra", dice Illuna, "pero los conceptos que constituyen la base de la magia están todos presentes en este lugar, por lo que puedes usar técnicas que son muy similares a la magia una vez que tengas suficiente práctica".

              "Lo siento", le digo a Illuna, "¿pero acabas de insinuar que lo único que necesitas para lanzar magia en este lugar es estar familiarizado con la teoría mágica que se encuentra en la base de los hechizos?..."

              "Estás haciendo que parezca mucho más fácil de lo que realmente es", dice Illuna. "Para alguien como Flower o yo, estas cosas son naturales, porque ella es etérea y yo soy un espíritu mágico. Para alguien como tú, que no está acostumbrado al Plano Etéreo ni a lanzar magia en general, sería necesario estar familiarizado con el movimiento de cada partícula mágica individual que compone el flujo de un hechizo, y controlar tanto su dirección como su intensidad a la perfección. Eso, por supuesto, además de conocer la teoría detrás del hechizo".

              "Entonces, si sé todas esas cosas, ¿debería poder lanzar el hechizo?" digo.

              "En teoría, sí", dice Illuna. "Pero no veo cómo podrías ser capaz de..."

              "¡Excelente!" digo. "Entonces intentaré lanzar uno ahora mismo. ¡Dame un segundo!"
            condition: b3_ch8_overseer2 = 0
