              Luego toca su transceptor para poder hablar con su explorador.

              "Gregory, ¿cuánto falta para que las bolas de metal voladoras nos alcancen?" dice el rey del subsuelo.

              "Uh... deberían estar allí en cualquier momento, mi señor", dice Gregory.

              "Perfecto", dice el rey. "Entonces démosles un objetivo fácil al que disparar".

              Después de decir esto, el rey del subsuelo levanta los brazos y luego comienza a elevarse lentamente en el aire, mientras se puede ver un rayo de la tormenta golpeando en algún lugar a lo lejos.

              "¡¿Puede volar?!" pregunta Hadrik.

              "De hecho, se me ocurrió esta idea de tu amigo Barry", grita fuerte el rey del subsuelo desde arriba, respondiendo a la pregunta de Hadrik. "Escuché de mis hombres sobre el hechizo de corriente de aire que estaba usando para volar, y les pregunté a mis elementalistas de aire si no podían idear algo similar a lo que Melindra había estado lanzando".
          - source: scene_3
            paragraph: 9
            text: |-
              Luego hace algunas carreras en el aire y parece perder el control durante aproximadamente un segundo debido al fuerte viento, antes de recuperar rápidamente el equilibrio.

              "Los controles son un poco toscos, pero puedo hacer algunos ajustes con la manipulación de aura, así que no es un gran problema", dice el rey. "Ahora bien... ¿dónde están los drones?"

              A medida que el rey del subsuelo vuela más alto en el cielo, cada vez es más difícil verlo debido a la fuerte lluvia, pero no pasa mucho tiempo antes de que los drones del Supervisor muerdan el anzuelo e iluminen toda el área alrededor del rey con sus brillantes ojos rojos.

              El rey del subsuelo no se enfrenta a ellos, sino que crea a su alrededor una barrera esférica semitransparente, compuesta de aura endurecida, que lo protege tanto de los ataques mágicos de los drones como de la lluvia. Cada vez más drones rodean la barrera del rey, intentando romperla con ataques elementales de todo tipo.

              El rey del subsuelo sigue hostigando a los drones durante aproximadamente un minuto más, hasta que un centenar o más de ellos lo rodean, y justo cuando estamos a punto de perderlo de vista debido a la gran cantidad de bolas de metal que lo pululan desde todas direcciones, el rey desata una onda de choque tan poderosa que hace que todos los drones a su alrededor exploten a la vez.
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch09a_carcasses
      - condition: b3_ch8_overseer2 = 1
        texts:
