            paragraph: 20
            text: |-
              "¡Ahora!" Daren nos grita, mientras docenas de cadáveres de metal en llamas caen encima de nosotros y todos los hombres del rey corren frenéticamente, tratando de evitar ser golpeados por ellos.

              Luego empuja a uno de los hombres del rey del subsuelo al suelo con su escudo y comienza a luchar contra los demás, mientras mis amigos se preparan para seguir su ejemplo.

              Justo cuando Daren nos está dando su llamado a la acción, tengo una visión en la que todo el cuerpo de Kate comienza a temblar violentamente mientras arquea la espalda, y luego cae al suelo, inconsciente.

              ¿Recibió una descarga eléctrica por detrás en la premonición? Pero en ese momento no había nadie cercano a ella. Esto sólo puede significar una cosa...

              "¡Kate!" Grito fuerte. "¡Albert es invisible detrás de ti! Está tratando de aplicarte una descarga eléctrica..."

              Kate no espera a que termine y congela el aire a su alrededor después de escuchar sólo las primeras palabras. De la nada, aparece una escultura de hielo con la forma de Albert, que parece como si estuviera a punto de retirarse después de escucharme gritar.

              "Flower, ¿puedes descongelarlo como practicamos ayer?" Kate dice, en un tono apresurado.

              "Uh, sí... ¡eso creo!" Dice Flower, mientras se acerca un poco más y luego invoca alrededor de cien pequeñas bolas de fuego voladoras que comienzan a girar alrededor del congelado Albert cada vez más rápido.
          - source: scene_text_2
            paragraph: 12
            text: |-
              Cuanta más velocidad ganan las bolas de fuego, menos es posible distinguir sus movimientos y, finalmente, todo se convierte en una gran mancha de fuego que gira rápidamente, mientras el hielo que cubre a Albert se derrite lentamente en agua.

              Tan pronto como las llamas circulares disminuyen su velocidad y desaparecen, Albert, ya descongelado, se desploma en el suelo con los ojos cerrados.

              "¿Funcionó?" —Pregunta Kate, un tanto ansiosa. "¿Sigue vivo?"

              "¡Sí!" Dice Flower, después de tomarle el pulso. "¡Sólo está inconsciente, eso es todo!"

              "Entonces tenemos una contramedida que funciona para mi congelación", dice Kate, aliviada. "Es bueno saberlo".

              "¡Mirar!" Les digo a Flower y Kate, mientras apunto con el dedo hacia una treintena de drones que han salido de la nada y ahora están atacando a las tropas terrestres. "¡Tenemos algunos refuerzos! Y el rey está ocupado con un nuevo lote de drones en el cielo, por lo que no puede venir a salvar a sus hombres. Ahora es nuestra oportunidad de..."

              Justo cuando estoy a punto de terminar mi frase, los drones de ojos rojos que estaban atacando a los rebeldes vuelan más alto en el cielo y comienzan a girar en su lugar, mientras la luz de sus ojos parpadea constantemente.
