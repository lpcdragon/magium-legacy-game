            paragraph: 38
            text: |-
              "Pregunta rápida", digo. "Si puedes crear cualquier alimento que quieras sin costo alguno, ¿por qué comes las mismas galletas y bebes el mismo té todos los días?"

              "¡No son las MISMAS galletas y té!" Flower dice. "Cambio su sabor de vez en cuando. ¡Y no es que no haga otros alimentos también! Es solo... una tradición, eso es todo. ¿Es realmente tan malo tener una tradición en la que comemos galletas y bebemos té todos los días?"

              "Yo... supongo que no", digo. "Aunque todavía lo encuentro un poco extraño para una tradición."

              "¡Bueno, me gusta así que no me importa si es raro o no!" Flower dice. "Y a Petal también le gusta. ¿Verdad, Petal?"

              "Oh, sí", dice Illuna, en tono irónico. "Es el momento que más espero cada día".

              "¿Ver?" Dice Flower, completamente ajena al trasfondo sarcástico de la declaración anterior de Illuna. "¡A ambos nos gusta, así que no hay razón para cambiarlo!"

              "Cuando lo dices así, supongo que tiene mucho sentido", digo.

              "¡Exactamente!" Flower dice. "¡Ahora hablamos menos y bebemos más, a menos que quieras que el té se enfríe!"

              "Flower, tengo una pregunta para ti antes de continuar con el té y las galletas", dice Melindra. "¿Podría quizás darnos un breve resumen de lo que está sucediendo actualmente en el plano terrestre?"
