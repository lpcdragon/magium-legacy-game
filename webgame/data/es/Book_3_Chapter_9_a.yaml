      - condition: b3_ch8_overseer2 = 1 AND premonition < 4
        texts:
          - source: scene_text
            paragraph: 21
            text: |-
              "¡Ahora!" Daren nos grita, mientras docenas de cadáveres de metal en llamas caen encima de nosotros y todos los hombres del rey corren frenéticamente, tratando de evitar ser golpeados por ellos.

              Luego empuja a uno de los hombres del rey del subsuelo al suelo con su escudo y comienza a luchar contra los demás, mientras mis amigos se preparan para seguir su ejemplo.

              Justo cuando todos están a punto de empezar a pelear, todo el cuerpo de Kate comienza a temblar violentamente de repente mientras arquea su espalda, para luego caer al suelo, inconsciente.

              Mi primer instinto es correr a su lado y ver si todavía está viva, pero rápidamente me doy cuenta de lo que debe haber sucedido. No había nadie detrás de ella cuando fue atacada, por lo que debe haber sido Albert quien usó algún tipo de arma eléctrica para electrocutarla mientras él era invisible. Tengo que contarles a los demás sobre esto.

              "¡Tipo!" Grito. "¡Albert se esconde de forma invisible con un arma eléctrica! ¡No dejes que te atrape!"
          - source: scene_text_2
            paragraph: 13
            text: |-
              "¿Es eso lo que le pasó a Kate?" Dice Hadrik, mientras avanza con cuidado hacia ella para ver si todavía respira. "¿Dónde se esconde? Puede que no pueda lastimarlo porque es local, pero aún puedo agarrarlo y mantenerlo en su lugar para el resto de ustedes".

              "No sé dónde está", digo. "Solo mantente atento, ¿vale? ¡Y siempre cuida tus espaldas!"

              "Bueno, Kate está viva", dice Hadrik, una vez que se acerca a ella. "Simplemente se desplomó. Aunque no intentaría despertarla ahora. Podría hacerle más daño que bien".

              "¡Mira hacia allá!" Le digo a Hadrik, mientras apunto con el dedo hacia una treintena de drones que han salido de la nada y ahora están atacando a las tropas terrestres. "¡Tenemos algunos refuerzos! Y el rey está ocupado con un nuevo lote de drones en el cielo, por lo que no puede venir a salvar a sus hombres. Ahora es nuestra oportunidad de..."

              Justo cuando estoy a punto de terminar mi frase, los drones de ojos rojos que estaban atacando a los rebeldes vuelan más alto en el cielo y comienzan a girar en su lugar, mientras la luz de sus ojos parpadea constantemente.
