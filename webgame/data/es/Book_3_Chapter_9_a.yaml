  - name: b3_ch09a_warning
    texts:
      - source: scene_text
        paragraph: 23
        text: |-
          "¡Advertencia! ¡Advertencia! ¡Advertencia!" podemos escuchar las voces metálicas de todos los drones de ojos rojos cantando al unísono, mientras los cristales azules del interior de cada uno de ellos brillan intensamente. "Hemos detectado un número extremadamente grande de unidades de drones que fueron destruidas en un período de tiempo muy corto. Ahora activamos el protocolo de emergencia experimental para evitar daños mayores. ¡Por favor, esperen!"

          "¿Protocolo de emergencia experimental?..." dice Hadrik. "¿Qué diablos se supone que eso--"

          Un silencio ensordecedor llena el área a mi alrededor mientras el sonido de la voz de Hadrik, así como el viento de la tormenta y todos los gritos de los rebeldes que luchan contra los drones se desvanecen por completo. Mientras miro a mi alrededor para comprender lo que pasó, veo que todo el mundo que me rodea simplemente... ha desaparecido.
      - source: scene_text_2
        paragraph: 15
        text: |-
          Actualmente estoy flotando en lo que parece ser un mar de luz pura, sin que ninguno de mis amigos esté cerca de mí. De hecho, tras una inspección más cercana de mi entorno, me doy cuenta de que no sólo mis amigos y el mundo se han ido, sino también mi propia persona. Cuando miro hacia abajo no veo ningún cuerpo: ni brazos, ni piernas, ni torso... ¿y mi cabeza? El brillo de este lugar casi me está cegando, así que lógicamente hablando todavía debo tener mis ojos, ¿verdad? ¿Pero eso significa que soy sólo una cabeza flotante a la deriva en este vasto plano lleno de nada más que luz?

          ¿Y mi respiración?... No puedo escucharme inhalando ni exhalando. ¿He estado conteniendo la respiración todo este tiempo? ¿Debo empezar a respirar para no morir por asfixia? Mi mente se siente como un lío en este momento. No tengo idea de qué hacer.
    choices:
      - position: 1
        text: Intenta respirar.
        effects:
          - set:
              current_scene: b3_ch09a_breathe
              ac_b3_ch9_consolation: ac_b3_ch9_consolation + 1
      - position: 2
        text: No respires.
        effects:
          - set:
              current_scene: b3_ch09a_calm
  - name: b3_ch09a_breathe
    texts:
      - source: scene_text
        paragraph: 24
        text: |-
          Intento respirar un poco de aire, pero siento como si mis vías respiratorias estuvieran completamente bloqueadas. Cuando me doy cuenta de que no puedo respirar en absoluto, empiezo a sentir pánico y automáticamente trato de inhalar más fuerte y más rápido. Cuanto más intento respirar, más doloroso me siento. Es como si de repente mi cuerpo inexistente recordara que respirar era un elemento necesario para su supervivencia, pero ya no recuerda lo que necesita para funcionar.

          Mientras sigo luchando por inhalar y exhalar, puedo sentir que mi mente se va quedando en blanco gradualmente hasta que mi conciencia finalmente se desvanece por completo.
    effects:
      - set:
          is_dead: 1
    choices:
      - position: 1
        text: Reiniciar juego
        effects:
          - set:
              current_scene: ch1_intro1
              storyboard_controls: Jump to frame "Chapter 1"
            condition: is_dead = 1
      - position: 2
        text: Cargar desde el último punto de control
        effects:
          - set:
              chapter_load: 1
              storyboard_controls: Jump to frame "Save load game"
            condition: is_dead = 1
      - position: 3
        text: Cargar partida
        effects:
          - set:
              storyboard_controls: Jump to frame "Save load game"
            condition: is_dead = 1
  - name: b3_ch09a_calm
    texts:
      - source: scene_text
        paragraph: 25
        text: |-
          Sólo necesito calmarme y pensar las cosas. No tengo cuerpo en este momento, por lo que no hay pulmones a los que pueda entrar el aire. Si todavía estoy vivo, significa que no necesito respirar. De hecho, ¿hay siquiera aire aquí? ¿Qué es este lugar exactamente? De alguna manera, parece muy familiar...

          Mientras mi mente se aclara lentamente de la neblina en la que ha estado todo este tiempo, de repente recuerdo la sensación que tuve cuando el Magium poseía al Supervisor y lanzaba mi conciencia a través de todos los planos separados de existencia, incluido el Plano Etéreo.

          Ahora lo entiendo... Este es el Plano Etéreo. ¡Por eso me parecía tan familiar! Es porque he estado aquí antes. De todos modos, ¿cómo diablos terminé en este lugar? ¿Y dónde están todos los demás? ¿Los drones del Supervisor también los arrojaron de alguna manera a este páramo? ¿Lo hicieron usando los cristales azules? Necesito salir de aquí y encontrar a mis amigos. Si tan solo pudiera moverme de alguna manera. ¡Si al menos tuviera algunas... manos!

          Justo cuando estoy pensando esa última palabra, dos manos se materializan frente a mí, de la nada. Intento mover las dos manos y me doy cuenta de que tengo control total sobre ellas, como si fueran mías, aunque todavía me falta el resto de mi cuerpo.

          ¿Qué acaba de pasar? ¿Así funcionan las cosas por aquí? ¿Me basta con pedir un deseo y se hace realidad? Si es así, entonces yo también quiero piernas. ¡Dame piernas!
      - source: scene_text_2
        paragraph: 16
        text: |-
          Espero un rato, pero no pasa nada. ¿Pedí mal el deseo? Déjame intentarlo de nuevo. ¡Quiero tener piernas! Y el resto de mi cuerpo también, de hecho. ¡Devuélveme mi cuerpo!

          De nuevo, nada. Esto no funciona. Tal vez debería rendirme por ahora y tratar de arreglármelas con lo que tengo. Sólo tengo mis manos, no todos mis brazos, pero aun así debería poder sacarles algún uso, ¿verdad?

          Mientras instintivamente hago un movimiento de nado con mis manos, puedo sentirme avanzando a través de la luz, aunque realmente no hay puntos de referencia por aquí, por lo que no hay una manera fácil para confirmar mi velocidad de desplazamiento. Sigo nadando a través del brillante espacio vacío durante unos minutos más, hasta que escucho la voz de una chica llamándome desde la distancia.

          "Barry, ¿eres tú?" Escucho débilmente la voz de Flower mientras se acerca a mí. "¡Espera ahí, no te muevas! ¡Voy por ti!"

          Cuando Flower se acerca a mí, veo que sus ojos son de un rojo brillante, como cuando luchó contra Eiden antes de que nos metiéramos en Thilias, y el aura alrededor de su cuerpo se siente como si irradiara calor.
      - source: scene_3
        paragraph: 10
        text: |-
          "Vaya, Barry, lograste conjurar algunas manos", dice Flower, una vez que llega hasta mí. "¡Eso es genial!"

          "¡Olvídate de mis manos!" digo. "¿Qué pasó con tus ojos? Y sientes que toda tu aura está ardiendo. ¿Estás bien?"

          "¡Oh, no necesitas preocuparte por eso!" Flower dice. "Así es como soy ahora."

          Luego chasquea los dedos y de repente todo su cuerpo se cubre de llamas, aunque tras una inspección más cercana, el fuego parece flotar aproximadamente a una pulgada por encima de su piel en lugar de quemarla directamente.

          "¿Ver?" Dice Flower, y luego casualmente apaga las llamas, como si fuera la cosa más normal del mundo.

          "Uhm... está bien", le digo. "Si tú lo dices. Espera, ¿por qué tú tienes todo tu cuerpo y yo no? ¿Qué estoy haciendo mal?"

          "No lo sé", dice Flower. "He estado viviendo aquí desde que nací, así que nunca hubo un momento en el que no tuviera un cuerpo en el Plano Etéreo. Si quieres conjurar un cuerpo para ti, tal vez solo necesites... ¿pensar más o algo así? Es fácil crear cosas de la nada en este lugar. ¡Mira!"
    choices:
      - position: 1
        text: Continuar
        effects:
          - set:
              current_scene: b3_ch09a_tree
  - name: b3_ch09a_tree
    texts:
      - source: scene_text
        paragraph: 26
        text: |-
          Luego señala con la mano un área vacía frente a ella y hace aparecer una palmera de la nada. Luego, la palmera se convierte en un carro, y el carro pronto se convierte en una gran roca. Tan pronto como termina su demostración, Flower aplaude una vez y la roca desaparece en el aire.

          "¡Qué-- eso es increíble!" digo. "¿Puedes enseñarme cómo hacer eso?"

          "Umm... no estoy segura", dice Flower. "Pétalo siempre me dijo que no soy exactamente el mejor enseñando cosas a los demás. Y no estoy exactamente seguro de cómo dejarte esto más claro de lo que ya lo tengo. Para mí esto es algo natural, ¿sabes? Tal vez sea solo una ventaja de ser etéreo. De todos modos, no deberíamos quedarnos aquí por mucho tiempo. ¡No es bueno para ti! Sígueme, te llevaré a mi casa. Leila y Hadrik ya te están esperando allí. ¡Y Pétalo también! ¡Toma, toma mi mano!".

          Luego toma mi mano sin esperar mi respuesta, y su cuerpo se cubre nuevamente de llamas, que sorprendentemente no se sienten como si me estuvieran quemando a pesar de que deberían. Luego siento que vibro fuertemente, mientras una luz blanca de un color diferente al que he estado atravesando nos cubre a ambos y somos teletransportados a un lugar completamente diferente.

          "¡Barry, estás vivo!" Escucho la voz interior de Leila, que ya conozco desde la última vez que ella y yo fuimos enviados juntos al Plano Etéreo. "¡Gracias a dios!"
      - source: scene_text_2
        paragraph: 17
        text: |-
          Miro a mi alrededor y veo que ahora estamos dentro de una habitación llena de juguetes e innumerables decoraciones como pinturas murales de caballeros y dragones, así como una mesa sobre la cual hay un jarrón de aspecto costoso con algunos tulipanes dentro. Leila y Hadrik están frente a mí, pero todavía no veo a Illuna. ¿Quizás ella esté en otra habitación?

          "¿Ves, Leila?" Flower dice. "¡Te dije que no habría nada de qué preocuparte! ¡Barry está bien y no hizo nada estúpido, como tratar de respirar sin sus pulmones!"

          "... ¿Qué es eso de que intento respirar?" -digo algo ansiosamente.

          "Oh", dice Flower, "cuando traje a Leila aquí, le dije que la mayoría de las personas que salen de sus propios pensamientos y salen a la luz exterior deberían estar en un estado de aturdimiento, en su mayoría simplemente flotando indefinidamente hasta que alguien los encuentre, y que la única forma en que podrían morir sería si intentaran respirar, porque entonces de repente se encontrarían con la necesidad de respirar aire fresco en sus pulmones, pero sin tener pulmones reales... o aire. Cuando se enteró de esto, Leila inmediatamente entró en pánico, y ella me dijo que eres exactamente el tipo de persona que piensa demasiado en este tipo de situaciones hasta el punto de que bien podría terminar muriendo por asfixia, pero nunca intentaste hacer nada de eso, ¿verdad, Barry?"

          "Bueno, en realidad..." digo. "Es posible que en algún momento estuve a solo unos momentos de intentar respirar. Lo único que me salvó fue el hecho de que me di cuenta de que no había manera de que pudiera necesitar aire para sobrevivir en este lugar si ya había sobrevivido sin respirar durante tanto tiempo".
      - source: scene_3
        paragraph: 11
        text: |-
          "¡Lo sabía!" Escucho los pensamientos de Leila, mientras su boca permanece cerrada. "¡Incluso cuando casi estábamos siendo borrados de la existencia, él estaba haciendo lo mismo! Casi no tomó mi mano porque le preocupaba que yo pudiera haber sido una ilusión, tratando de engañarlo".

          Hadrik se ríe.

          "Bueno, ese es Barry para ti", dice. "¡Él siempre encuentra una manera de convertir incluso la situación más trivial en una aventura que amenaza la vida! Pero debo decir que todavía es difícil acostumbrarme a escuchar la voz de Leila en lugar de verla escribir un mensaje de texto frente a mí. Barry, ya escuchaste su voz antes, ¿verdad?"

          "Sí, lo escuché la última vez cuando fuimos al Plano Etéreo y... esperen un momento, ¿por qué soy el único aquí con un par de manos flotantes? ¿Cómo recuperaron sus cuerpos tan rápido?"

          "Yo fui quien les enseñó cómo hacerlo", escucho una voz femenina desconocida proveniente de mi lado izquierdo.

          Cuando me doy la vuelta, veo a una mujer que parece tener veintitantos años, con ojos azules, cabello azul y orejas puntiagudas, con un vestido azul y que mide aproximadamente mi altura. Aunque su apariencia es muy diferente a lo que estoy acostumbrado, la mirada seria en sus ojos y su constante ceño fruncido es casi inconfundible.
