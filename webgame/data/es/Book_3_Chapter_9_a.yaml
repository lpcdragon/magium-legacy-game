            paragraph: 48
            text: |-
              Tomo la postura correcta y estiro los brazos hacia adelante, con las palmas de las manos hacia afuera. Si voy a hacer esto, haré todo según las reglas.

              He memorizado estos flujos mil veces. Esto no es nada nuevo para mí. La única diferencia entre ahora y entonces es que ahora sé con certeza que se puede hacer. Esta vez no fallaré.

              Mientras imagino las posiciones de las partículas mágicas en mi cabeza, puedo sentir el flujo de magia acumulándose frente a mis palmas, tal como los libros dicen que sucedería. La volatilidad del flujo mágico me toma por sorpresa por un momento, pero luego inmediatamente recuerdo el consejo de un viejo ermitaño que solía visitar regularmente, cuando todavía pensaba que sería posible que un no mago lanzara magia.

              "Cuando el flujo parece que se te escapa, no debes intentar corregirlo", solía decir el viejo ermitaño. "Eso sólo te hará perder el control más rápido. Lo que deberías hacer es seguirlo. Le he dicho esto a muchos magos jóvenes antes, pero no me escucharon. Mientras tu forma sea correcta y tu teoría sea sólida, no hay razón para que tu hechizo falle. Simplemente sigue el flujo de magia hasta que regrese a su posición óptima, y ​​luego continúa lanzando el hechizo. Créeme... no importa qué tan lejos el flujo parezca desviarse de su curso, siempre regresará".
          - source: scene_text_2
            paragraph: 34
            text: |-
              Sigo la dirección del flujo de partículas mágicas con mis manos, tal como dijo el ermitaño, aunque parece que mi hechizo podría romperse en cualquier segundo. Justo antes de que el hechizo esté a punto de cancelarse, las partículas regresan, como si una fuerza invisible las guiara hacia el camino correcto. Tan pronto como vuelven a estar en su lugar, reanudo el lanzamiento de mi hechizo, canalizando toda mi energía mágica imaginada en un solo punto, frente a mis manos.

              De repente se forma una bola de fuego en el punto donde estoy concentrando mi energía, y luego la bola se aleja de mí, golpea una de las paredes de la habitación de Flower y explota en llamas.

              "¡Oh no! ¡Mis cuadros!" Flower grita, presa del pánico, mientras corre hacia la pared en llamas, mientras Illuna le dispara un chorro de agua para apagar las llamas.

              "¡Está bien, tengo que admitir que estoy impresionado!" Dice Daren, después de verme lanzar mi hechizo. "¿Cómo lograste lograrlo?"

              "Hubo un tiempo en el que tenía la ilusión de que incluso una persona normal podría lanzar magia si supiera de memoria cada pequeño detalle que interviene en el proceso de lanzamiento de hechizos", digo. "No tienes idea de cuánto tiempo pasé memorizando cada posición de partícula, cada movimiento de mano y cuerpo requerido, hasta el último fragmento de teoría que se utilizó para crear los hechizos... Este es el tipo de cosas que nunca olvidas".
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch09a_lunatic
