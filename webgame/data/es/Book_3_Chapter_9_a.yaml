scenes:
  - name: b3_ch09a_intro
    texts:
      - source: scene_text
        paragraph: 2
        text: |-
          "Albert, has vuelto", dice el rey del subsuelo. "¿Qué noticias traes?"

          "Tenías razón sobre la tormenta", dice Albert, mientras entra al edificio en el que nos escondemos, con su capa empapada en agua. "Las bolas de metal voladoras tienen dificultades para moverse a través del fuerte viento y tienen problemas importantes con su maniobrabilidad".

          "Ah, entonces sus hélices deben funcionar con hechizos de aire rudimentarios, tal como pensaba", dice el rey del subsuelo. "No habría tenido sentido para los Lessathi que inicialmente construyeron estos 'drones' darles la capacidad de lanzar complejos hechizos de corrientes de aire a su alrededor sólo para las raras ocasiones en las que quedarían atrapados en una tormenta. ¿Estoy diciendo el nombre correctamente? ¿Se pronuncia 'drones'?"

          "Sí, así los llamaba Billy Bob", le digo.

          "Mi rey", dice Peter, "si bien entiendo las ventajas tácticas de enfrentar a nuestro enemigo cuando está debilitado, ¿no crees que hubiera sido prudente esperar hasta que más tropas nuestras estuvieran listas para unirse a la batalla?"
      - source: scene_text_2
        paragraph: 2
        text: |-
          "Las tormentas de verano en Varathia son muy impredecibles", afirma el rey del subsuelo. "Realmente no hay manera de saber de antemano cuánto durarán. Una oportunidad como ésta es demasiado valiosa para dejarla pasar, incluso si eso significa ir a la batalla un poco menos preparados de lo que hubiéramos esperado".

          "¿Breynan terminó de teletransportarse a todos?" Dice Albert, mientras mira a su alrededor, contando las personas en la habitación. "Todavía no veo a Herman ni a Howard. ¿Se unirán a nosotros después de todo o no?"

          "Howard no vendrá con nosotros", dice el rey del subsuelo. "Su herida de ayer se volvió a abrir justo después de que te teletransportaste a la superficie, a pesar de toda la curación que recibió, así que me vi obligado a pedirle que se quedara atrás".

          "Eso es... desafortunado", dice Albert. "Sé cuánto quería ser parte de la misión final para liberar a Ollendor, así que sólo puedo imaginar lo difícil que debe ser para él ser dejado de lado de esta manera. ¿Qué pasa con Herman?"
      - source: scene_3
        paragraph: 2
        text: |-
          "Herman se teletransportará con el próximo grupo de personas, que debería llegar pronto", dice el rey del subsuelo. "Le dije a Breynan que esperara unos minutos después de cada teletransportación, para evitar el sobrecalentamiento del dispositivo. Lo último que querríamos ahora es causar un mal funcionamiento en nuestro dispositivo de teletransportación y quedarnos varados aquí, especialmente después de que nuestro técnico principal haya sido encarcelado por traición".

          "¿Breynan no se unirá a nosotros, mi señor?" pregunta uno de los magos que se teletransportó a la superficie junto con nosotros.

          "No", dice el rey del subsuelo. "Le pedí a Breynan que permaneciera bajo tierra, porque si él también viniera con nosotros, no quedaría nadie para liderar a nuestra gente en caso de que algo saliera mal con nuestra misión. Sé que eres miembro de su equipo habitual y no estás acostumbrado a realizar expediciones de superficie sin su guía, pero eres uno de nuestros luchadores más competentes, por lo que realmente necesitábamos tenerte con nosotros hoy. Confío en que te manejarás bien incluso sin tu mentor, y que lo harás sentir orgulloso de tus logros".

          "Sí, señor", dice el mago. "¡Lo haré!"
