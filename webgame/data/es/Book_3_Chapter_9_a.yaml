              current_scene: b3_ch09a_jack
              b3_ch9_jack: 2
  - name: b3_ch09a_jack
    routes:
      - condition: b3_ch9_jack = 0
        texts:
          - source: scene_text
            paragraph: 4
            text: |-
              "¿Alguien importante para ti te dio ese colgante?" Le pregunto a Jack.

              "Oh..." dice Jack, mientras se gira hacia mí y se da cuenta de que lo había estado observando. "Sí, me lo dio mi esposa. Cada vez que siento que estoy entrando en pánico antes de una batalla, saco este colgante y... pensar en ella me calma. Me recuerda por qué estoy luchando realmente".

              "¡Vamos, Jack!" dice uno de los guerreros que seguían al rey del subsuelo. "¡No te quedes atrás!"

              "Nos vemos en el campo de batalla", nos dice Jack, y luego sigue a su camarada hasta la puerta que conduce al exterior.
          - source: scene_text_2
            paragraph: 4
            text: |-
              "¿Estás pensando mejor, Barry?" Me pregunta Daren en voz baja, mientras me ve mirando a Jack mientras se va.

              Me toma unos momentos entender que a lo que se refiere es a nuestra decisión de traicionar al rey del subsuelo y ponernos del lado del Supervisor. Miro a mi alrededor para asegurarme de que nadie nos esté mirando y luego le respondo en un susurro.

              "No", digo. "Quiero decir, no es que vayamos a hacer que los maten a todos, ¿verdad? Aún así volverán con nosotros al subsuelo después de que todo esté dicho y hecho".

              "Depende de cómo se desarrollará la batalla", dice Daren. "Pero intentaremos mantener las bajas al mínimo".

              "Entonces... ¿algún comentario final antes de ir a la batalla?" Dice Hadrik, mientras nuestro grupo se queda atrás, observando a los hombres del rey del subsuelo salir del edificio.
