  - name: b3_ch09a_currents
    routes:
      - condition: b3_ch9_currents = 0
        texts:
          - source: scene_text
            paragraph: 10
            text: |-
              "Está bien, puedes lanzar las mismas corrientes de aire de siempre. Yo me encargo".

              "Como desees", dice Melindra, y luego señala sus manos hacia mí, para ayudarla a concentrarse en el flujo invisible de energía mágica que sale de sus dedos mientras lanza su hechizo.

              Unos segundos más tarde, empiezo a sentir la familiar sensación del aire fluyendo a mi alrededor de forma antinatural, reaccionando a cada ligero movimiento de mi cuerpo. Como es habitual, las corrientes son muy débiles al principio, porque esperan que levante los brazos en el aire para señalar el inicio de mi vuelo.

              "Ha pasado un tiempo desde que el rey del subsuelo y sus hombres abandonaron el edificio", escribe Leila, mientras mira alrededor de la gran sala vacía en la que nos encontramos. "¿Deberíamos tal vez salir a ver qué está pasando?"
          - source: scene_text_2
            paragraph: 8
            text: |-
              "No", dice Daren. "El rey nos dijo explícitamente que esperáramos aquí mientras preparaban sus defensas para la batalla contra los drones. Dijo que no quiere que el Supervisor se dé cuenta de nuestra presencia inicialmente, para que calcule mal la cantidad de drones que necesita enviar para lidiar con sus enemigos".

              "O tal vez el rey del subsuelo simplemente no confía en nosotros, y eso fue sólo una excusa para evitar que nos uniéramos a la batalla", dice Kate.

              "Si él no quiere que luchemos junto a ellos, entonces ellos se lo pierden", dice Daren. "Sin embargo, no creo que ese sea el caso. Yo digo que esperemos unos minutos más y si todavía no escuchamos una palabra de ellos, echaremos un vistazo afuera para ver qué está pasando".
            condition: b3_ch8_overseer2 = 0
          - source: scene_text_2
            paragraph: 7
            text: |-
              "No", dice Daren. "El rey nos dijo explícitamente que esperáramos aquí mientras preparaban sus defensas para la batalla contra los drones. Dijo que no quiere que el Supervisor se dé cuenta de nuestra presencia inicialmente, para que calcule mal la cantidad de drones que necesita enviar para lidiar con sus enemigos".

              "O tal vez el rey del subsuelo simplemente no confía en nosotros, y eso fue sólo una excusa para evitar que nos uniéramos a la batalla", dice Kate.

              "Si ya sospechan de nosotros", dice Daren, "entonces ir en contra de las órdenes del rey nos haría aún más difícil preparar la emboscada correctamente. No se preocupen, el Supervisor dijo que no comenzará la pelea hasta que estemos todos en posición. Estoy seguro de que el rey nos llamará después de esperar unos minutos más y ver que no pasa nada".
            condition: b3_ch8_overseer2 = 1
          - source: scene_3
            paragraph: 7
            text: |-
              Tal como dijo Daren, no pasó mucho tiempo hasta que una de las tropas del subsuelo llegó a la puerta para anunciar que el rey nos estaba esperando. Todos salimos juntos y luego seguimos al enviado del rey del subsuelo durante unos veinte segundos a través de la tormenta, hasta que llegamos al lugar donde estaban estacionadas todas las fuerzas del subsuelo. Había alrededor de cien hombres aquí, más o menos, y a juzgar por sus auras, sólo unos diez eran magos. Por supuesto, no podía estar completamente seguro de eso, ya que el rey del subsuelo y Peter siempre están suprimiendo la magia de sus auras, por lo que podría haber otros haciendo lo mismo.

              Algunos de los magos todavía estaban lanzando hechizos de protección en el área cuando llegamos, mientras que los guerreros estaban simplemente de pie con sus ballestas, espadas y escudos listos, mirando ansiosamente a los drones en el cielo que se ocupaban de sus propios asuntos, simplemente ignorando a los combatientes armados que esperaban en medio de una plaza abierta, durante una cuarentena en toda la ciudad.

              "Abran paso, por favor", dice el rey del subsuelo a sus hombres, cuando ve que nos acercamos a él. "Deseo hablar con ellos."
            condition: b3_ch8_overseer2 = 0
