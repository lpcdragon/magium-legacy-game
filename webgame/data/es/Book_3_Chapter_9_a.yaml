        texts:
          - source: scene_text
            paragraph: 59
            text: '"Está bien", dice Melindra, mientras se acerca a nosotros, "así que quería decirles que revisé la tormenta afuera mientras estaban ocupados hablando, y es bastante malo. Barry, no estoy segura de qué tan bien funcionarán mis corrientes de aire mágicas con ese viento fuerte si les doy control total sobre ellas como lo hago normalmente. Podría intentar hacerlas más estables, pero eso requeriría que tomara el control parcial de ellas manualmente desde el suelo, por lo que obtendrían un retraso notable cada vez que cambien de dirección. dices?"'
          - source: scene_text_2
            paragraph: 43
            text: |-
              "¿De qué retraso estamos hablando aquí?" digo.

              "No lo sé... ¿uno o dos segundos?" Melindra dice. "¿Quizás más? Depende de mi tiempo de reacción y algunas otras cosas. Como por ejemplo si estás en mi campo de visión o no. O si estoy siendo atacado y no puedo prestarte atención".

              "Y si te atacan mientras estoy en el aire, ¿qué pasa entonces?" digo. "¿Me quedaré atrapado en medio del cielo, sin poder moverme?"
          - source: scene_3
            paragraph: 6
            text: |-
              "Aún mantendrías un control parcial sobre las corrientes", dice Melindra, "pero responderían menos y es posible que tengas que repetir los mismos movimientos unas cuantas veces hasta que funcionen. Aún puedo lanzarte la versión habitual del hechizo si quieres, lo que te daría control total, pero eso lo haría tan poco confiable como pilotar un artilugio volador gnomo en medio de un huracán. No estoy seguro de que entiendas lo que quiero decir".

              "Oye, ya he pilotado un avión durante una tormenta", digo. "¡No es tan malo! Quiero decir, casi muero como diez veces durante el mismo vuelo, pero al final aterricé sano y salvo".

              "Bueno, puedes elegir el tipo de corriente de aire que quieras", dice Melindra. "Solo recuerda que ya no puedo cambiar el tipo de corriente una vez que estás en el aire, así que debes tomar la decisión antes de salir".
