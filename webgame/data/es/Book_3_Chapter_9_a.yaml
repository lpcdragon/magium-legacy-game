          - source: scene_text
            paragraph: 33
            text: |-
              "En realidad, no es necesario que dejes de pensar. Simplemente no uses palabras mientras piensas".

              "¿Llegar de nuevo?" pregunta Hadrik, confundido.

              "¿Sabes que hay momentos en los que realmente no tienes tiempo para pensar y te ves obligado a tomar decisiones en una fracción de segundo antes de que tus pensamientos se materialicen en palabras dentro de tu cabeza?" Le digo a Hadrik. "Intenta utilizar ese tipo de pensamientos en lugar de tus pensamientos habituales si quieres evitar pensar en voz alta por error. Se necesita un poco de práctica, pero una vez que te acostumbres a este método, te resultará natural".

              "¡Oh!" dice Hadrik. "¡Creo que entiendo lo que quieres decir ahora! Tomo decisiones rápidas como esa todo el tiempo mientras estoy peleando. ¡Así que lo que me estás diciendo es que necesito confiar más en mis instintos guerreros que en mi lógica cuando estamos teniendo discusiones en el Plano Etéreo!"

              "...Algo así, sí", digo.

              "¡Ahora estás hablando mi idioma!" dice Hadrik, y luego se ríe. "Está bien, lamento hacerte esperar. ¡Hadrik está listo para unirse a la conversación una vez más! ¿De qué estábamos hablando, otra vez?"

              "Yo... como que lo olvidé", digo. "Esperemos a que Flower regrese y decidiremos juntos qué se debe hacer a continuación".

              Mientras esperamos en silencio a que Flower regrese, un ligero olor a comida quemada se está infiltrando lentamente en nuestra habitación, proveniente de una puerta que parece conducir a una especie de cocina.

              "Oye, ¿a alguien más le huele a masa quemada?" dice Hadrik.
