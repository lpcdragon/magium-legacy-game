          - source: scene_3
            paragraph: 15
            text: |-
              Luego abre la caja y toma una pastilla en la mano, que intenta entregársela a Daren. Cuando ella se la da, la pastilla simplemente cae al suelo, mientras todos miramos a Flower en completo silencio.

              "¡Oh, no!" Flower dice. "Olvidé que no tienes cuerpo. Espera, ¡lo convertiré en esencia de luz para poder alimentarte adecuadamente!"

              "¿Está bien?..." dice Daren, en un tono poco convencido.

              Flower hace algunos movimientos con sus manos y la pastilla en el suelo se convierte en un chorro de luz líquida que comienza a girar en círculos alrededor del área de donde provenía la voz de Daren. Luego estira los brazos frente a ella con las palmas abiertas y la luz se desvanece lentamente.

              "¿Se siente mejor ahora?" Pregunta Flower.

              "Se siente...", dice Daren. "Se siente... ¡MUCHO mejor ahora, gracias! ¡Mis náuseas prácticamente han desaparecido por completo! ¿Cómo lo hiciste?"

              "Oh, es porque la cosa de luz alrededor de tu... um... alrededor de tu esencia giratoria no está alineada con tu uh--"

              "Tu alma no estaba conectada correctamente a tu cuerpo desde el plano terrestre", dice Illuna. "Hace varios años conocimos en el éter a un alma perdida que tenía un problema similar, por eso Flower tenía ese medicamento listo en su cajón en caso de que volviera a suceder".
