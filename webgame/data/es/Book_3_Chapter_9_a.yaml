  - name: b3_ch09a_decades
    texts:
      - source: scene_text
        paragraph: 36
        text: |-
          "¿Ustedes dos han estado comiendo galletas y bebiendo té en esta habitación todos los días durante dos décadas?" pregunta Hadrik, perplejo.

          "Sí", dice Illuna. "Flower leyó en algún lugar de un libro para niños que así es como se supone que deben actuar las familias que viven en la misma casa, y como ella nunca tuvo una familia real antes de conocerme, me hizo seguir este ritual suyo a diario".

          "Pero... no es como si ella literalmente te estuviera obligando a unirte a ella todos los días, ¿verdad?" Dice Hadrik, mientras Flower termina de poner la mesa y ahora se dirige a la cocina para revisar el té. "Quiero decir, aún podrías negarte si quisieras, ¿verdad?"

          "Por supuesto que podría", dice Illuna. "¿Cuál es tu punto?"

          "Uh, nada", dice Hadrik, luciendo incluso más confundido que antes. "No importa, supongo..."

          Entonces, Illuna odia la tradición del té y las galletas, pero aun así participa voluntariamente todos los días por el bien de Flower, ¿eh? Supongo que se preocupa por Flower más de lo que deja ver.
      - source: scene_text_2
        paragraph: 25
        text: |-
          "Todos podemos oír lo que estás pensando", dice Illuna, mientras me mira con el ceño fruncido. "Lo sabes, ¿no?"

          "Oh, claro", digo, un poco avergonzada. "En realidad no era mi intención decirlo en voz alta. ¡Lo siento!"

          "¡El té está listo!" escuchamos a Flower, que estuvo en la cocina todo este tiempo y no escuchó nuestra conversación anterior. "¡Lo traeré ahora mismo!"

          Ella regresa unos segundos después con una tetera en la mano y comienza a servir té en nuestras tazas, una por una.

          "¡Oye, esto no está mal!" Dice Daren, mientras toma un sorbo de té de su taza. "¿Qué tipo de hojas usaste para hacer este té?"
      - source: scene_3
        paragraph: 17
        text: |-
          "No estoy segura..." dice Flower. "Simplemente imaginé el sabor que quería que tuviera el té y luego conjuré las hojas. No creo que existan en el mundo real".

          "Las galletas están basadas en una receta que estabas usando en el plano terrestre, ¿correcto?" Melindra dice, después de darle un mordisco. "Recuerdo que creaste algunas galletas muy similares usando el hechizo de creación de comida del zorro dorado".

          "Son similares, pero no exactamente iguales", dice Flower. "El hechizo de creación de comida es asombroso, pero sigue siendo muy limitante en comparación con lo que puedo hacer aquí en mi mente. Aquí, puedo replicar cualquier sabor del mundo real, y también puedo crear sabores que no existen, ¡usando sólo mi imaginación! Tengo mucha más libertad en este lugar. ¡Es genial!"
