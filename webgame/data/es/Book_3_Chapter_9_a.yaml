  - name: b3_ch09a_fire
    routes:
      - condition: b3_ch9_attempt = 0
        texts:
          - source: scene_text
            paragraph: 50
            text: |-
              "Si sólo tuviera tiempo para uno, el fuego sería mi elección", digo.

              "Muy bien", dice Illuna. "Flower, ¿puedes venir aquí un momento? Barry necesita tu... Flower, ¿qué estás haciendo?"

              "¡Estoy intentando restaurar la pintura!" Dice Flower, mientras sostiene un pincel en la mano.

              "No tenemos tiempo para esto", dice Illuna. "Tú fuiste quien dijo que los invitados necesitan recibir un trato especial, y resulta que uno de nuestros invitados necesita que le enseñes magia. O reviertes la pintura a su forma original o la pintas a mano más tarde, pero date prisa".

              "Está bien, está bien..." dice Flower, mientras devuelve la pintura a su estado anterior con un solo movimiento de su dedo, y luego la coloca nuevamente en la pared.

              Luego corre hacia nuestro lado de la habitación y se detiene frente a mí.

              "Entonces, ¿qué quieres aprender, Barry?" Flower dice.

              Paso los siguientes minutos mostrándole a Flower los hechizos de fuego que ya sé lanzar, mientras ella me da algunos consejos sobre cómo mejorar mi postura y mis movimientos para que pueda hacer que los hechizos sean más efectivos. Cuando terminamos con los que conozco, Flower intenta enseñarme algunos de sus propios hechizos, pero desafortunadamente sus explicaciones son... no tan útiles como hubiera esperado.

              "Entonces, la forma más fácil de aprender el flujo de este hechizo es hacer primero una voltereta hacia atrás y luego aterrizar con una mano", dice Flower. "¡Aquí, déjame mostrarte!"
          - source: scene_text_2
            paragraph: 38
            text: |-
              "No, no", digo. "No hay necesidad de mostrármelo. ¡Te creo! Sólo esperaba que tal vez pudieras enseñarme algo que requiera... ¿un poco menos de movimiento?"

              "¡Oh, claro, claro, por supuesto!" Flower dice. "Lo siento, es sólo que estoy tratando de descubrir cómo explicarte esto de una manera que no suene demasiado a elementalista".

              "¿Qué quieres decir?" pregunto.

              "Bueno, por ejemplo, ayer cuando le estaba enseñando a Kate cómo controlar mejor su rayo helado", dice Flower, "podría simplemente decirle que pusiera menos intensidad en el medio del rayo y que extendiera la energía más hacia los lados, y ella sabría instintivamente cómo hacerlo. Es difícil pensar en una manera de explicártelo cuando nunca lo has experimentado tú mismo, y solo has leído sobre ello en libros..."

              "Oh, ahora entiendo lo que estás diciendo", digo. "Experimenté lo que es ser un elementalista cuando mis estadísticas mágicas se desbloquearon temporalmente durante mis peleas con Tyrath y los esqueletos de stillwater, pero ahora que el conocimiento mágico instintivo que estaba obteniendo del dispositivo se ha ido, realmente no puedo entenderlo. Si mal no recuerdo, se trataba menos de visualizar el flujo de magia en mi cabeza y más de estar en sintonía con algún tipo de energía dentro de mí que podía moldear en cualquier forma que quisiera, con un número infinito de posibilidades."
          - source: scene_3
            paragraph: 24
            text: |-
              "¡Sí, algo así!" Flower dice. "¡La principal ventaja de ser elementalista es que puedes crear hechizos a partir de tu elemento a tu antojo, sin seguir ninguna regla! El problema es que realmente no puedo enseñarte ninguno de esos hechizos, porque la mayoría de ellos son improvisados, y ni siquiera sabría cómo empezar a explicártelos".

              "Pero había un hechizo que creías haber inventado y resultó que alguien más lo inventó antes que tú, ¿recuerdas?" digo. "Hablamos de ello cuando estábamos desarmando trampas en los túneles debajo de Ollendor. Tal vez también tengas otros hechizos como ese en tu repertorio y simplemente no lo sabes todavía. Déjame darte un breve resumen de todos los hechizos de fuego que conozco de los libros, y me dirás si alguno de ellos te suena familiar, ¿de acuerdo?"

              "¡Bueno!" Flower dice. "¡Vamos a intentarlo!"

              Durante unos cuarenta minutos aproximadamente, intercambio información con Flower sobre los hechizos de fuego que conozco, y cada vez que encontramos uno que ella reconoce, le pido que me dé tantos detalles como pueda, hasta que pueda descubrir qué tipos de flujos y patrones se ajustan mejor a su descripción. Afortunadamente, como ya conozco tantos hechizos, me resulta más fácil observar patrones repetitivos entre ellos, por lo que puedo adivinar las direcciones y movimientos de las partículas mágicas incluso si la información está incompleta.
