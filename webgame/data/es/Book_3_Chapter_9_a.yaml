  - name: b3_ch09a_feather
    routes:
      - condition: b3_ch9_illuna = 0
        texts:
          - source: scene_text
            paragraph: 27
            text: |-
              "Illuna, ¿eres tú?"

              "¿Quizás esperabas a alguien más bajo?" dice Illuna. "¿Quizás con el pelo rojo y sin zapatos?"

              "Bueno, quiero decir... ¡sí, más o menos!" digo. "Después de verte así durante tanto tiempo, es un poco difícil imaginarte como algo más que Flower de ojos azules".

              "Sí, sí, lo he oído antes", dice Illuna. "Leila y Hadrik también tuvieron una reacción similar cuando me vieron por primera vez".

              "Entonces, eh... ¿decías que podrías enseñarme cómo recuperar mi cuerpo?"

              "Sí", dice Illuna. "Dame un momento."

              Luego conjura una pluma frente a ella, la toma en su mano y me la da.

              "Espera esto", me dice. "Quiero que te concentres en la pluma mientras pronuncias el encantamiento que estoy a punto de decirte. Mientras no pierdas el enfoque de la pluma y digas todas las palabras correctamente, deberías recuperar tu cuerpo. ¿Estás listo?"

              "¡Eh, sí!" -digo mientras miro la pluma. "¡Dime el encantamiento!"
          - source: scene_text_2
            paragraph: 18
            text: |-
              "Repite conmigo", dice Illuna. "Sehok amon rik tus selem."

              "Sehok... amon rik tus... selem!" Digo, mientras sigo mirando la pluma muy fijamente.

              Tan pronto como termino de decir las palabras, miro hacia abajo y veo cómo mis brazos se van materializando lentamente, luego mi torso y luego mis piernas. En menos de unos segundos, todo mi cuerpo aparece de la nada, como si hubiera sido invisible todo este tiempo, y estoy usando exactamente la misma ropa que tenía en el plano terrestre.

              "¡Eso es asombroso!" digo. "¿Qué significaba el encantamiento? No reconocí el idioma".

              "No significó nada", dice Illuna simplemente.

              "¿Indulto?" Le pregunto, confundida.

              "Era un galimatías", dice Illuna. "Sólo algo que inventé en el momento para que el ritual pareciera más creíble".

              "¿Y lo de mirar la pluma?" digo. "¿Eso fue algo que tú también inventaste?"
          - source: scene_3
            paragraph: 12
            text: |-
              "Sí", dice Illuna. "En este lugar, puedes hacer cualquier cosa con tu mente, siempre y cuando tus pensamientos sean lo suficientemente poderosos. Para algo tan simple como recuperar tu cuerpo, todo lo que necesitas es estar convencido de que puedes hacerlo y tendrás éxito. Es por eso que te di estas tareas simples para que las cumplas. Ya sabías que había ayudado a Leila y Hadrik a recuperar sus cuerpos, así que estabas convencido de que mientras siguieras mis instrucciones al pie de la letra, lo mismo se aplicaría a ti. Si en lugar de eso te hubiera dicho algo vago como cómo necesitarías 'borrar cualquier duda en tu cabeza y tener plena confianza en tus propias habilidades', probablemente habrías intentado pensar en ello de manera lógica y habrías comenzado a dudar de ti mismo, porque no habría manera de medir con precisión tu nivel de confianza".

              "Dijiste que es más fácil obtener mi cuerpo que hacer otras cosas", digo. "¿Qué hay de hacer que las cosas aparezcan de la nada? Vi a Flower hacerlo afuera. Simplemente hizo que aparecieran una palmera y un carro, de la nada".

              "Flower ha estado viviendo aquí durante mucho tiempo, por lo que, naturalmente, está más acostumbrada a las costumbres de este lugar", dice Illuna. "Aparte de su ventaja de ser etérea, creo que también está el hecho de que en el Plano Etéreo te beneficia tener emociones más fuertes en lugar de analizar cada pequeño detalle, y Flower normalmente tiene emociones fuertes sobre cualquier cosa. Este es el único lugar en el mundo donde su forma ilógica de pensar realmente le da ventaja, en lugar de ser uno de sus puntos débiles".
        choices:
          - position: 1
            text: Continuar
            effects:
              - set:
                  current_scene: b3_ch09a_reference
