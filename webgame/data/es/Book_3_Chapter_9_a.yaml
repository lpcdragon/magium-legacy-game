  - name: b3_ch09a_intro2
    texts:
      - source: scene_text
        paragraph: 3
        text: |-
          Justo cuando el mago termina de hablar, una luz brillante llena el edificio de almacenamiento abandonado en el que nos encontramos, y un grupo de unas veinte personas están siendo teletransportados a la gran sala.

          "¿Es este el último grupo?" Peter pregunta, una vez que se completa la teletransportación.

          "Eso creo", dice el rey del subsuelo. "Aparte de Howard, todos parecen haber llegado".

          Luego levanta la voz para asegurarse de que todas las personas en la sala puedan escucharlo.

          "¿Puedo tener su atención, por favor?" dice el rey del subsuelo.

          El ruido de fondo de toda la gente que hablaba entre sí se está apagando poco a poco, mientras los hombres de la subsuelo esperan con gran expectación el discurso de su líder antes de la batalla final.
      - source: scene_text_2
        paragraph: 3
        text: |-
          "Seré breve", dice el rey del subsuelo. "Sé que todos quieren que esto termine. Sé que han estado esperando este día durante muchos años. El día en que Ollendor finalmente sea libre... Bueno, ahora mismo lo único que se interpone entre nosotros y esa libertad es el Supervisor. Él es el único remanente de una era de tiranía y represión que se ha cobrado muchas vidas de nuestros hermanos y hermanas. ¡Pero eso termina hoy! Hoy reclamaremos lo que es legítimamente nuestro. ¡Hoy, recuperamos Ollendor!"

          El rey del subsuelo deja que sus hombres aplaudan durante unos segundos, pero luego levanta las manos en el aire, indicándoles que se detengan.

          "¿Todos saben lo que deben hacer?" pregunta.

          "Sí, mi señor", escuchamos decir a algunos de los guerreros, mientras los demás también asienten con la cabeza.

          "Entonces procedamos", dice el rey. "Nuestro destino no está mucho más lejos de este edificio. Nos aseguraremos de eliminar tantos drones como podamos en nuestro camino hacia allí. ¡Que los dioses estén con nosotros!"
      - source: scene_3
        paragraph: 3
        text: |-
          "¿Estás bien, Jack?" Albert le dice al joven mago que preguntó por Breynan antes, mientras pone una mano en su hombro.

          "Uhm, y-- ¡sí señor!" dice Jack.

          "Mira", dice Albert, "sé que no soy Breynan, pero si necesitas ayuda en el campo de batalla puedes contar conmigo, ¿de acuerdo?"

          "¡O-- por supuesto!" dice Jack. "¡Prometo que no lo decepcionaré, señor!"

          "¡Buena suerte!" Dice Albert, y luego pasa junto a él para unirse al rey del subsuelo.

          En lugar de seguirlo, Jack saca un colgante de su bolsillo, lo mira por unos segundos y luego lo agarra firmemente con ambas manos mientras cierra los ojos.
    choices:
      - position: 1
        text: Pregúntale a Jack si recibió el colgante de alguien importante para él.
        effects:
          - set:
              current_scene: b3_ch09a_jack
              b3_ch9_jack: 0
      - position: 2
        text: Asegúrale a Jack que todos saldremos con vida.
        effects:
