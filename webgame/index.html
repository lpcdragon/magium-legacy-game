<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Magium Game v0.6.0-preview.2</title>
    <style>
      /* Ensure the page background is fully black and remove default margins so
         the app's 24px padding doesn't produce a lighter border on mobile */
      html,
      body {
        height: 100%;
        margin: 0;
        /* Defer to app theme CSS variables so body adapts to chosen theme */
        background: var(--bg, #111);
        color: var(--text, #eee);
        /* Base UI font size */
        font-size: 18px;
      }
      /* Make scrollbars on mobile less intrusive */
      body {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      /* Ensure root container fills the body for proper iframe and fullscreen behavior */
      #root {
        height: 100%;
        display: flex;
        flex-direction: column;
      }
    </style>
    <script type="module" crossorigin src="./assets/index-ByXGnhnT.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-D6ZuIBnN.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Ensure initial theme class is applied before the app mounts so body
      // background and other global styles reflect user's saved preference.
      ;(function () {
        try {
          var raw = null
          try {
            raw = localStorage.getItem('magium:styles')
          } catch (e) {
            raw = null
          }
          if (raw) {
            try {
              var prefs = JSON.parse(raw)
              if (prefs && prefs.palette) {
                document.documentElement.classList.add('theme-' + String(prefs.palette))
              }
            } catch (e) {
              /* ignore JSON errors */
            }
          }
        } catch (e) {
          /* ignore */
        }
      })()

      // Helper shim for tests / traversal: if the game exposes a global
      // `magium` object with `routeId`, propagate it onto <section>
      // elements as `data-route-id`. Also observe mutations so dynamically
      // rendered sections receive the attribute.
      ;(function () {
        try {
          if (typeof window === 'undefined' || typeof document === 'undefined') return
          function applyRouteId() {
            try {
              var mg = window.magium
              var rid = mg && mg.routeId
              if (typeof rid !== 'undefined' && rid !== null) {
                var s = document.querySelector('section')
                if (s) s.setAttribute('data-route-id', String(rid))
              }
            } catch (e) {
              /* ignore */
            }
          }
          // Apply on DOMContentLoaded and periodically for safety
          document.addEventListener('DOMContentLoaded', function () {
            applyRouteId()
            // Observe for added/changed section elements if supported
            if (typeof MutationObserver !== 'undefined') {
              var mo = new MutationObserver(function () {
                applyRouteId()
              })
              mo.observe(document.documentElement || document.body, {
                childList: true,
                subtree: true,
              })
            }
            // Also run a periodic check in case the game sets routeId later
            if (typeof setInterval !== 'undefined') setInterval(applyRouteId, 500)
          })
        } catch (e) {
          /* ignore */
        }
      })()
    </script>
  </body>
</html>
